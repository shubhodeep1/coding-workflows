# IMPORTANT: This file is managed by coding-workflows and may be overwritten
# automatically when upstream templates change. To opt out of auto-updates,
# set the ALLOW_WORKFLOW_EDITS repository variable to 'false'.
name: AI Implement
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  implement:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request == null &&
      (
        (
          github.event.comment.user.type == 'User' &&
          contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          startsWith(github.event.comment.body, '/approved')
        ) ||
        (
          github.event.comment.user.type == 'Bot' &&
          github.event.comment.user.login == 'github-actions[bot]' &&
          startsWith(github.event.comment.body, '/approved') &&
          contains(github.event.comment.body, '[auto-approved-by-plan]')
        )
      )
    uses: shubhodeep1/coding-workflows/.github/workflows/implement.yml@stable
    secrets: inherit

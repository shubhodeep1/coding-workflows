# IMPORTANT: This file is managed by coding-workflows and may be overwritten
# automatically when upstream templates change. To opt out of auto-updates,
# set the ALLOW_WORKFLOW_EDITS repository variable to 'false'.
name: AI Security Audit
on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to audit instead of the default branch (empty = default branch)"
        required: false
        default: ""
        type: string
      bypass_weekly_cap:
        description: "Open a follow-up for every surviving finding instead of stopping at the weekly cap"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  issues: write
concurrency:
  group: security-audit-${{ github.repository }}
  cancel-in-progress: false
jobs:
  security-audit:
    uses: shubhodeep1/coding-workflows/.github/workflows/security-audit.yml@stable
    with:
      ref: ${{ inputs.ref || '' }}
      bypass_weekly_cap: ${{ inputs.bypass_weekly_cap == true }}
    secrets: inherit

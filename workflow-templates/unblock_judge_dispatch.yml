# IMPORTANT: This file is managed by coding-workflows and may be overwritten
# automatically when upstream templates change. To opt out of auto-updates,
# set the ALLOW_WORKFLOW_EDITS repository variable to 'false'.
#
# Thin wrapper around unblock_judge.yml for one blocked item (an issue, a
# pull request or an orchestrator project's tracking issue). The orchestrator
# poller's unblock scan dispatches it with `gh workflow run
# unblock_judge_dispatch.yml -f item=<n>`. The run name `Unblock judge #<n>`
# and the filename are load-bearing: the scan reads the run name to skip
# items whose judge is already running, and dispatches by exact filename.
#
# workflow_dispatch only on purpose; it is not an event handler.
name: AI Unblock Judge Dispatch
run-name: "Unblock judge #${{ inputs.item }}"
on:
  workflow_dispatch:
    inputs:
      item:
        description: "Issue, pull request or tracking issue number to judge"
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write
  # Claude engine: the job's OIDC token for claude-pool-broker (plan Phase 4).
  id-token: write
jobs:
  judge:
    uses: shubhodeep1/coding-workflows/.github/workflows/unblock_judge.yml@stable
    with:
      item: ${{ inputs.item }}
    secrets: inherit

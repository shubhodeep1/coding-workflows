# IMPORTANT: This file is managed by coding-workflows and may be overwritten
# automatically when upstream templates change. To opt out of auto-updates,
# set the ALLOW_WORKFLOW_EDITS repository variable to 'false'.
name: AI Orchestrate Poller
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  # Claude engine: the job's OIDC token for claude-pool-broker (plan Phase 4).
  id-token: write
jobs:
  poll:
    # State snapshot publication is configured centrally by the called
    # workflow via caller-repo vars (LEDGER_SUBSTATES_ENABLED and the
    # STATE_SNAPSHOT_* toggles), so the wrapper interface stays unchanged.
    uses: shubhodeep1/coding-workflows/.github/workflows/orchestrate_poll.yml@stable
    # Least privilege: forward only the secrets the reusable workflow
    # declares, never inherit them all (consumer repos hold other secrets).
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}

# This workflow automatically updates AI workflow wrappers in this repo
# when new versions are published to coding-workflows@stable.
#
# How it works:
#   - Runs daily (04:00 UTC) and on repository_dispatch from the upstream
#     coding-workflows repo when a new stable release is tagged.
#   - Fetches the latest workflow templates from coding-workflows@stable and
#     verifies the release's signed sync manifest (Sigstore attestation,
#     release commit and file hashes) before any fetched code runs.
#   - Compares each template against the local wrapper in .github/workflows/
#     and stages only paths the signed manifest allows.
#   - Delivers the changes through a pull request from the ai-sync/stable
#     branch and enables auto-merge on it (or merges it directly when
#     auto-merge is unavailable). A PR that branch protection blocks stays
#     open for a human to merge.
#   - Sends a Telegram alert listing which wrappers were updated.
#
# Opting out:
#   Set the AI_WORKFLOW_AUTO_UPDATE_ENABLED repository variable to 'false' to
#   stop this job entirely (unset or any other value keeps it on). The gate
#   lives here, so a sync of this file cannot erase the hold.
#   Set the ALLOW_WORKFLOW_EDITS repository variable to 'false' to prevent
#   automatic updates. The workflow will still run but skip all changes.
#
# IMPORTANT: This file is managed by coding-workflows and will be overwritten
# by the update process. Do not add custom logic here.
name: AI Update Workflows
on:
  schedule:
    - cron: '0 4 * * *'
  repository_dispatch:
    types: [coding-workflows-stable-released]
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    if: ${{ vars.AI_WORKFLOW_AUTO_UPDATE_ENABLED != 'false' }}
    uses: shubhodeep1/coding-workflows/.github/workflows/update_workflows.yml@stable
    with:
      allow_workflow_edits: ${{ vars.ALLOW_WORKFLOW_EDITS != 'false' }}
    secrets: inherit

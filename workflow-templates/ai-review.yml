# IMPORTANT: This file is managed by coding-workflows and may be overwritten
# automatically when upstream templates change. To opt out of auto-updates,
# set the ALLOW_WORKFLOW_EDITS repository variable to 'false'.
name: AI Review
# Dispatched runs carry their PR in the run name. The orchestrator poller and
# the merge train dispatch this workflow from the default branch only
# (issue #4701: never an unmerged head ref), so a dispatched run's
# head_branch no longer identifies the PR; the poller's active-run lookups
# match this exact name instead. Every other event gets an empty expression,
# which GitHub replaces with its event-specific default (PR title / commit
# message).
run-name: "${{ github.event_name == 'workflow_dispatch' && format('AI Review [pr:{0}]', inputs.pr_number) || '' }}"
on:
  # ready_for_review is included so that converting a draft PR to a
  # non-draft re-fires the review gate. This is the unlock path for
  # automated validation-prompt self-heal PRs (see README.md section
  # "Validation self-healing"), which are opened as drafts to bypass
  # auto-review/automerge until a human reviews them.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  schedule:
    # Re-check current-head security findings after their follow-up wait expires.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review (used by autofix re-trigger)"
        required: true
        type: string
      allow_workflow_edits:
        description: "Allow AI/editor changes to .github/workflows files"
        required: false
        default: false
        type: boolean
      claude_fixer_converged_head:
        description: "Deprecated; ignored. Accepted so an old dispatcher that still sends it does not fail (the Claude-fixer hand-off was retired)"
        required: false
        default: ""
        type: string
      force_rb_judge:
        description: "Skip reviewers/editor and run only the review-blocked judge"
        required: false
        default: false
        type: boolean
permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write
  # Claude engine: the job's OIDC token for claude-pool-broker (plan Phase 4).
  id-token: write
jobs:
  review:
    if: ${{ github.event_name != 'schedule' && (github.event.action != 'closed' || github.event.pull_request.merged == true) }}
    # Review workspace reuse is controlled centrally by the called workflow via
    # vars.WORKSPACE_REUSE_ENABLED from the caller repository; the wrapper
    # interface stays unchanged because no extra workflow_call input is needed.
    uses: shubhodeep1/coding-workflows/.github/workflows/review_autofix.yml@stable
    with:
      pr_number: ${{ github.event.inputs.pr_number || github.event.pull_request.number || '' }}
      pr_is_draft: ${{ github.event_name != 'workflow_dispatch' && github.event.pull_request.draft }}
      pr_title: ${{ github.event_name != 'workflow_dispatch' && format('{0}', github.event.pull_request.title) || '' }}
      pr_body: ${{ github.event_name != 'workflow_dispatch' && format('{0}', github.event.pull_request.body) || '' }}
      allow_workflow_edits: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.allow_workflow_edits == 'true') || (github.event_name != 'workflow_dispatch' && vars.ALLOW_WORKFLOW_EDITS != 'false') }}
      force_rb_judge: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_rb_judge == 'true' }}
    secrets: inherit

  security-hold-sweep:
    if: ${{ github.event_name == 'schedule' && vars.SINGLE_ISSUE_SECURITY_PASS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted security-hold sweep support
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: stable
          path: .security-hold-support
          persist-credentials: false
      - name: Re-dispatch stale security holds
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          REPOSITORY: ${{ github.repository }}
          SINGLE_ISSUE_SECURITY_PASS_ENABLED: ${{ vars.SINGLE_ISSUE_SECURITY_PASS_ENABLED || 'false' }}
          SECURITY_PASS_FOLLOWUP_STALE_HOURS: ${{ vars.SECURITY_PASS_FOLLOWUP_STALE_HOURS || '24' }}
          SECURITY_HOLD_REVIEW_WORKFLOW: ai-review.yml
        run: PYTHONDONTWRITEBYTECODE=1 python3 .security-hold-support/scripts/review_security_hold_sweep.py

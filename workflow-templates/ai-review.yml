name: AI Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.detect.outputs.should_skip }}
    steps:
      - name: Detect autofix commit
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Read the commit message of the actual PR head commit, not the
          # merge commit that actions/checkout produces by default on
          # pull_request events.
          HEAD_MSG="$(gh api "repos/${{ github.repository }}/git/commits/${PR_HEAD_SHA}" --jq '.message' 2>/dev/null | head -1 || true)"
          if echo "${HEAD_MSG}" | grep -q '^\[ai-autofix\]'; then
            echo "Autofix commit detected — skipping review."
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: [check-skip]
    if: needs.check-skip.outputs.should_skip != 'true'
    uses: shubhodeep1/coding-workflows/.github/workflows/review_autofix.yml@stable
    with:
      allow_workflow_edits: ${{ vars.ALLOW_WORKFLOW_EDITS == 'true' }}
    secrets: inherit

  # When the review is skipped (autofix commit detected), the reusable
  # workflow never runs, so its "ready to merge" labeling and Telegram
  # notification are never reached.  This job fills that gap.
  post-autofix:
    needs: [check-skip]
    if: needs.check-skip.outputs.should_skip == 'true'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Mark linked issues ready to merge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          ISSUE_NUMBERS="$(gh api graphql \
            -f owner="${REPOSITORY%/*}" \
            -f name="${REPOSITORY#*/}" \
            -F number="${PR_NUMBER}" \
            -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { closingIssuesReferences(first: 50) { nodes { number } } } } }' \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' || true)"

          if [ -z "${ISSUE_NUMBERS}" ]; then
            echo "No linked issues found for PR #${PR_NUMBER}."
            exit 0
          fi

          while IFS= read -r issue_number; do
            [ -n "${issue_number}" ] || continue
            echo "Setting ai:ready-to-merge on issue #${issue_number}"
            gh issue edit "${issue_number}" --repo "${REPOSITORY}" --remove-label 'ai:done' --remove-label 'ai:implementing' --remove-label 'ai:awaiting-approval' --remove-label 'ai:planning' --remove-label 'ai:clarification' --remove-label 'ai:ready-to-merge' --remove-label 'ai:merged' --remove-label 'ai:closed' --remove-label 'ai:review-blocked' || true
            if ! gh issue edit "${issue_number}" --repo "${REPOSITORY}" --add-label 'ai:ready-to-merge'; then
              echo "::warning::Failed to add ai:ready-to-merge label to issue #${issue_number} — retrying in 2s..."
              sleep 2
              gh issue edit "${issue_number}" --repo "${REPOSITORY}" --add-label 'ai:ready-to-merge' \
                || echo "::warning::Retry also failed for issue #${issue_number}. Label may need manual application."
            fi
          done <<< "${ISSUE_NUMBERS}"

      - name: Enable auto-merge on PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ENABLE_AUTO_MERGE: ${{ vars.ENABLE_AUTO_MERGE || 'false' }}
        run: |
          set -euo pipefail

          if [ "${ENABLE_AUTO_MERGE}" != "true" ]; then
            echo "Auto-merge disabled (set ENABLE_AUTO_MERGE=true to enable)."
            exit 0
          fi

          echo "Enabling auto-merge (squash) on PR #${PR_NUMBER}..."
          if gh pr merge "${PR_NUMBER}" --repo "${{ github.repository }}" --squash --auto; then
            echo "Auto-merge enabled. PR will merge once all required checks pass."
          else
            echo "::warning::Could not enable auto-merge on PR #${PR_NUMBER}."
          fi

      - name: Telegram notification
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
        run: |
          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "Telegram credentials not configured; skipping notification."
            exit 0
          fi

          PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/${PR_NUMBER}"
          MSG="$(printf 'PR autofix applied — ready to merge\nPR: %s' "${PR_URL}")"
          curl -sS -X POST \
            "https://api.telegram.org/bot${TG_BOT_SECRET}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}"

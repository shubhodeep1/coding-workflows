# IMPORTANT: This file is managed by coding-workflows and will be overwritten
# by the update process. Do not add custom logic here.
name: AI Sync Labels
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview label changes without mutating repository labels"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [coding-workflows-stable-released]
permissions:
  contents: read
  issues: write
jobs:
  sync:
    uses: shubhodeep1/coding-workflows/.github/workflows/sync_ai_labels.yml@stable
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    # Least privilege: forward only the secrets the reusable workflow
    # declares, never inherit them all (consumer repos hold other secrets).
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}

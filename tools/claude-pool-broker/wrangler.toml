# claude-pool-broker: hands the Claude account pool to trusted Actions jobs
# (docs/plans/replace-claude-sessions-with-cli-engine-plan.md, Phase 4).
# Account: FT_GAMES_CF (CLAUDE.md §24). Route: workers.dev only.
# The CLAUDE_POOL_TOKENS secret is written only by
# shubhodeep1/claude-workers' claude-pool-key-sync.yml, never here.
# Optional secret BROKER_GITHUB_READ_TOKEN (read-only, set with
# `wrangler secret put`): authenticates the GitHub compare calls that verify a
# SHA-pinned job_workflow_ref. Unset means unauthenticated reads; a rate-limited
# check is refused (403 workflow_sha_unverifiable) and the job runs codex.
name = "claude-pool-broker"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
PROBE_MODEL = "claude-haiku-4-5-20251001"
GATE = "0.9"
# ChatGPT account reviewer trial, Phase 1: POST /v1/chatgpt.
# The CHATGPT_POOL_SEED secret (the ChatGPT credential JSON) is set with
# `wrangler secret put CHATGPT_POOL_SEED` in the deploy session; a new value
# re-seeds the ChatgptPoolStore Durable Object. Empty CHATGPT_REFRESH_URL or
# CHATGPT_OAUTH_CLIENT_ID mean refresh is off: a credential near expiry is
# refused (503 refresh_not_configured), never handed out on doubt.
CHATGPT_REFRESH_URL = ""
CHATGPT_OAUTH_CLIENT_ID = ""
CHATGPT_REFRESH_BEFORE_SECONDS = "1800"

[[durable_objects.bindings]]
name = "CHATGPT_POOL"
class_name = "ChatgptPoolStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatgptPoolStore"]

---
# P1 from docs/postmortems/2026-05-18-project-2734-stall.md.
#
# Enforces CLAUDE.md §19 (and the mirror in unattended_system_instructions.md)
# on the merge path this repo actually uses: squash merge. On squash-merge,
# GitHub uses the PR title + body for the squash commit message and
# auto-closes referenced issues, which kills the orchestrator's wave-by-wave
# dispatch (poller filters tracking issues by `--state open`).
#
# The squash commit's body is not always the PR body. This repository's
# squash setting is "default to commit messages", and the merge train runs
# `gh pr merge --squash` without `--body`, so the PR's commit messages are
# copied into the commit that lands on the default branch. Merge commit
# ae99a17d202 (PR #7190) closed tracking issue #6664 that way, through a
# commit message the body-only check never saw. For PRs into the default
# branch the workflow therefore also lints every commit message on the PR.
# PRs into `stable` skip that part: GitHub only closes issues from commits
# on the default branch, and a promotion PR carries all of main's history.
#
# This was the layer-3 failure mode in project #2734: PR #2760 used
# `Fixes #2734` in its body → GitHub auto-closed #2734 → orchestrator
# stopped dispatching Waves 2-7 → 7 of 9 sub-issues never shipped code.
# §19 was added (PR #2776) as a prose reaction to this incident; this
# workflow turns the prose into an enforced check.
name: Lint PR body for auto-close keywords against orchestrator-tracking issues

"on":
  pull_request:
    # `edited` catches PR title/body changes after creation;
    # `synchronize` catches new commits pushed to the PR head; `reopened` and
    # `ready_for_review` ensure the check re-runs when a draft PR
    # transitions to ready-for-review (which is when the merge button
    # becomes available).
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main, stable]

permissions:
  # Read-only on issues so the lint can resolve labels of referenced
  # issues. No write permissions needed — the lint only fails the check.
  contents: read
  issues: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Only need the lint script + the commit range for this PR. The
          # workflow does not run any tooling that needs full history.
          # Fetch enough history to enumerate commits between base and head
          # via the GH API below (no local git log needed).
          fetch-depth: 1

      - name: Write PR title and body to file
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Squash merge uses the PR title + body as the merge-commit
          # message. Write the exact merge artifact shape (title, blank
          # line, body) to disk so the lint script validates the same
          # text GitHub will evaluate for auto-close keywords.
          mkdir -p /tmp/pr-body-lint
          printf '%s\n\n%s' "${PR_TITLE:-}" "${PR_BODY:-}" > /tmp/pr-body-lint/body.txt

      - name: Write PR commit messages to file
        if: github.event.pull_request.base.ref == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          # CLAUDE.md §15: no other call in this workflow reads the PR's
          # commits; this is one paginated REST read (100 commits per page).
          # The endpoint returns at most 250 commits, the same list GitHub
          # builds the squash message from. Commit messages are written
          # oldest first, NUL-separated, as the lint script expects. A
          # failed read fails the step, so the check never passes unread.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" \
            --paginate --jq '.[].commit.message | @json' > /tmp/pr-body-lint/commits.jsonl
          python3 -I -c '
          import json, sys
          src, dst = sys.argv[1], sys.argv[2]
          with open(src, encoding="utf-8") as fh:
              messages = [json.loads(line) for line in fh if line.strip()]
          with open(dst, "w", encoding="utf-8") as out:
              out.write("\0".join(messages))
          print(f"Collected {len(messages)} commit message(s).")
          ' /tmp/pr-body-lint/commits.jsonl /tmp/pr-body-lint/commits.bin
          if [ "${PR_COMMIT_COUNT:-0}" -gt 250 ]; then
            echo "::warning::PR #${PR_NUMBER} has ${PR_COMMIT_COUNT} commits; GitHub lists only the first 250, so later commit messages are not linted."
          fi

      - name: Run auto-close keyword lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This required check validates the text that lands on the
          # default branch: PR title + body, plus the PR's commit messages
          # when the previous step collected them.
          commit_args=()
          if [ -f /tmp/pr-body-lint/commits.bin ]; then
            commit_args=(--commit-messages-file /tmp/pr-body-lint/commits.bin)
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/lint_pr_body_auto_close.py \
            --pr-body-file /tmp/pr-body-lint/body.txt \
            "${commit_args[@]}" \
            --repo "${GITHUB_REPOSITORY}"

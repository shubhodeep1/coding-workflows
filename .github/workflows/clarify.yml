---
name: AI Clarify (Reusable)

"on":
  workflow_call:
    secrets:
      GH_PAT:
        required: true
      OPENROUTER_API_KEY:
        required: true
      TG_BOT_SECRET:
        required: false

jobs:
  clarify:
    if: >-
      (github.event_name == 'issues' && github.event.action == 'opened' && !contains(toJson(github.event.issue.labels.*.name), 'ai:orchestrator-tracking')) ||
      (github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.pull_request == null && github.event.comment.user.type == 'User' && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && startsWith(github.event.comment.body, '/reclarify'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      # NOTE: cancel-in-progress: true means if a /reclarify comment arrives
      # while a clarification run is already in progress, the old run is killed
      # immediately with no comment, label update, or Telegram alert. This is
      # intentional — the new run supersedes the old one. The "Comment on issue
      # failure" step does NOT fire for cancelled runs (only for failures).
      group: ai-clarify-${{ github.event.issue.number }}
      cancel-in-progress: true
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      MODEL_EDITOR: ${{ vars.WORKFLOW_EDITOR_MODEL || 'openai/gpt-5.3-codex' }}
      MODEL_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_CLARIFY || 'medium' }}
      OPENROUTER_PROMPT_CACHE_DISABLED: ${{ vars.OPENROUTER_PROMPT_CACHE_DISABLED || 'false' }}

    steps:
      - name: Log trigger context
        run: |
          echo "Clarify workflow triggered for issue #${{ github.event.issue.number }}"
          echo "Trigger: ${{ github.event_name }}/${{ github.event.action }}"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "Comment author: ${{ github.event.comment.user.login }}"
            echo "Note: If a previous clarify run was in progress, it has been cancelled by this run (cancel-in-progress: true)."
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Configure git auth for memory helper clones
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_PAT is empty"; exit 1; }
          SERVER_HOST="${GITHUB_SERVER_URL#https://}"
          SERVER_HOST="${SERVER_HOST#http://}"
          SERVER_HOST="${SERVER_HOST%/}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}"

      - name: Install uv for Serena
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ vars.UV_VERSION || 'latest' }}

      - name: Install Codex CLI
        run: |
          set -euo pipefail
          CODEX_VERSION="${{ vars.CODEX_VERSION || 'v0.114.0' }}"
          npm install -g @openai/codex@"${CODEX_VERSION}" --no-audit --no-fund

      - name: Fetch workflow support scripts
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # When called as a reusable workflow from another repo, the caller's
          # repo is checked out and this repo's scripts/ directory is absent.
          # NOTE: github.workflow_ref resolves to the *caller* workflow, not
          # this reusable workflow, so we cannot derive the source repo from it.
          wf_source="${{ github.repository_owner }}/coding-workflows"
          # When running within coding-workflows itself, use the current
          # commit to avoid version skew with the stable tag (stable is
          # only updated after e2e tests pass — causes bootstrap failures).
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            script_ref="${{ github.sha }}"
          else
            script_ref="stable"
          fi
          # ALWAYS fetch canonical scripts from coding-workflows, even if the
          # caller repo ships its own scripts/ directory. Stale caller-repo
          # scripts (e.g. writing to mcp.json instead of config.toml) cause
          # silent MCP failures ("mcp startup: no servers").
          mkdir -p scripts
          # Bootstrap: rate-limit-aware fetch (gh_helpers.sh not yet available)
          _rl_wait() {
            local _reset_ts _wait_secs
            _reset_ts=$(gh api -i /rate_limit 2>/dev/null | grep -i '^x-ratelimit-reset:' | head -1 | awk '{print $2}' | tr -d '\r') || true
            if [ -n "${_reset_ts}" ] && [ "${_reset_ts}" -gt 0 ] 2>/dev/null; then
              _wait_secs=$(( _reset_ts - $(date +%s) + 1 ))
              [ "${_wait_secs}" -lt 1 ] && _wait_secs=1
              [ "${_wait_secs}" -gt 600 ] && _wait_secs=600
            else
              _wait_secs=30
            fi
            echo "::warning::  Rate limit resets in ${_wait_secs}s (X-RateLimit-Reset: ${_reset_ts:-unknown})" >&2
            sleep "${_wait_secs}"
          }
          _gh_api_fetch() {
            local outfile="$1"; shift
            local attempt=1
            while [ "${attempt}" -le 5 ]; do
              if gh "$@" > "${outfile}" 2>/tmp/_gh_rl_err; then return 0; fi
              if grep -qiE 'rate limit|abuse detection|secondary rate|HTTP 429' /tmp/_gh_rl_err 2>/dev/null; then
                echo "::warning::Rate limit hit during fetch (attempt ${attempt}/5), waiting for reset…" >&2
                _rl_wait; attempt=$((attempt + 1))
              else return 1; fi
            done; return 1
          }
          _fetched_scripts=()
          for f in gh_helpers.sh setup_serena.sh git_ref_health_check.sh render_prompt.sh tg_helpers.sh label_helpers.sh memory_helpers.sh ai_memory.py ai_memory_lib.py openrouter_prompt_cache.py semantic_cache.py; do
            if ! _gh_api_fetch "scripts/${f}" api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${wf_source}/contents/scripts/${f}?ref=${script_ref}"; then
              echo "::warning::${f} not found on ${script_ref}; falling back to main"
              _gh_api_fetch "scripts/${f}" api -H 'Accept: application/vnd.github.raw+json' \
                "repos/${wf_source}/contents/scripts/${f}?ref=main"
            fi
            chmod +x "scripts/${f}"
            _fetched_scripts+=("${f}")
          done
          # Block fetched scripts from being committed in consumer repos.
          if [ "${{ github.repository }}" != "${wf_source}" ]; then
            {
              echo "# Auto-generated by coding-workflows — DO NOT EDIT"
              echo "# Prevents runtime-fetched support scripts from being committed."
              printf '%s\n' "${_fetched_scripts[@]}" .gitignore
            } > scripts/.gitignore
          fi
          # Fetch AI memory schema files so consumer repos that lack
          # schemas on their default branch can bootstrap the ai-memory
          # branch (schemas are validated during memory operations).
          mkdir -p ai-memory/schemas
          for sf in memory_record.v1.json processed_command_entry.v1.json run_ledger_entry.v1.json task_lineage.v1.json; do
            if [ ! -f "ai-memory/schemas/${sf}" ]; then
              schema_tmp="ai-memory/schemas/${sf}.tmp"
              if _gh_api_fetch "${schema_tmp}" api -H 'Accept: application/vnd.github.raw+json' \
                "repos/${wf_source}/contents/ai-memory/schemas/${sf}?ref=${script_ref}"; then
                mv "${schema_tmp}" "ai-memory/schemas/${sf}"
              else
                rm -f "${schema_tmp}"
              fi
            fi
          done
          # Always use the canonical instruction files from coding-workflows
          # (must be outside the if-block so they're fetched even when the
          # caller repo ships its own scripts/ directory)
          for f in codex_system_instructions.md ai_pipeline.md; do
            if [ ! -f "${f}" ]; then
              if ! _gh_api_fetch "${f}" api -H 'Accept: application/vnd.github.raw+json' \
                "repos/${wf_source}/contents/${f}?ref=${script_ref}"; then
                echo "::warning::${f} not found on ${script_ref}; falling back to main"
                _gh_api_fetch "${f}" api -H 'Accept: application/vnd.github.raw+json' \
                  "repos/${wf_source}/contents/${f}?ref=main"
              fi
            fi
          done

          mkdir -p prompts
          if [ ! -f prompts/serena-efficiency-block.txt ]; then
            if ! _gh_api_fetch "prompts/serena-efficiency-block.txt" api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${wf_source}/contents/prompts/serena-efficiency-block.txt?ref=${script_ref}"; then
              echo "::warning::serena-efficiency-block.txt not found on ${script_ref}; falling back to main"
              _gh_api_fetch "prompts/serena-efficiency-block.txt" api -H 'Accept: application/vnd.github.raw+json' \
                "repos/${wf_source}/contents/prompts/serena-efficiency-block.txt?ref=main"
            fi
          fi

      - name: Create runtime workspace
        run: |
          set -euo pipefail
          RUNTIME_DIR="/tmp/codex-issue-${GITHUB_RUN_ID}"
          mkdir -p "${RUNTIME_DIR}"
          {
            echo "RUNTIME_DIR=${RUNTIME_DIR}"
            echo "ISSUE_META_FILE=${RUNTIME_DIR}/issue_meta.json"
            echo "ISSUE_COMMENTS_FILE=${RUNTIME_DIR}/issue_comments.json"
            echo "ISSUE_CONTEXT_FILE=${RUNTIME_DIR}/issue_context.txt"
            echo "THREAD_HISTORY_FILE=${RUNTIME_DIR}/thread_history.txt"
            echo "CODEX_PROMPT_FILE=${RUNTIME_DIR}/codex_prompt.txt"
            echo "CODEX_OUTPUT_FILE=${RUNTIME_DIR}/codex_output.txt"
            echo "QUESTIONS_FILE=${RUNTIME_DIR}/questions.txt"
          } >> "$GITHUB_ENV"

      - name: Fetch issue metadata
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}" > "${ISSUE_META_FILE}"
          ISSUE_NUMBER_JSON="$(jq -r '.number' "${ISSUE_META_FILE}")"
          ISSUE_URL_JSON="$(jq -r '.html_url' "${ISSUE_META_FILE}")"
          ISSUE_TITLE="$(jq -r '.title // ""' "${ISSUE_META_FILE}")"

          # TRUST BOUNDARY: ISSUE_BODY is user-controlled content from the GitHub
          # issue. It is NOT set as an env var to avoid repeated logging of
          # potentially large content in every step's env dump. Read it from
          # ISSUE_META_FILE via jq when needed: jq -r '.body // ""' "${ISSUE_META_FILE}"
          {
            echo "ISSUE_NUMBER=${ISSUE_NUMBER_JSON}"
            echo "ISSUE_URL=${ISSUE_URL_JSON}"
            echo "ISSUE_TITLE=${ISSUE_TITLE}"
          } >> "$GITHUB_ENV"

      - name: Detect smoke test and tune LLM settings
        run: |
          set -euo pipefail
          if echo "${ISSUE_TITLE}" | grep -qi '\[E2E Smoke Test\]'; then
            echo "🔬 Smoke test detected — switching to low reasoning effort"
            echo "MODEL_REASONING_EFFORT=low" >> "$GITHUB_ENV"
          fi

      - name: Fetch issue comments
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SEMANTIC_CACHE_BACKEND: ${{ vars.SEMANTIC_CACHE_BACKEND || 'none' }}
          SEMANTIC_CACHE_MAX_CANONICAL_CHARS: ${{ vars.SEMANTIC_CACHE_MAX_CANONICAL_CHARS || '50000' }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          # Keep clarify prompt context bounded to preserve historical behavior.
          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments?sort=created&direction=asc&per_page=50" > "${ISSUE_COMMENTS_FILE}"

          # Build full thread history only when semantic cache is enabled.
          if [ "${SEMANTIC_CACHE_BACKEND}" != "none" ]; then
            if ! gh_retry gh api --paginate --slurp "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments?sort=created&direction=asc&per_page=100" \
              | jq -r 'add // [] | .[] | "[" + (.created_at // "") + "] @" + (.user.login // "unknown") + ":\n" + (.body // "") + "\n"' > "${THREAD_HISTORY_FILE}"; then
              echo "::warning::Semantic cache thread-history fetch failed; forcing cache bypass for this run (fail-open)"
              MAX_CHARS="${SEMANTIC_CACHE_MAX_CANONICAL_CHARS}"
              if [[ "${MAX_CHARS}" =~ ^[0-9]+$ ]]; then
                MAX_CHARS=$((10#${MAX_CHARS}))
              else
                MAX_CHARS=50000
              fi
              if [ "${MAX_CHARS}" -le 0 ]; then
                MAX_CHARS=50000
              fi
              head -c "$((MAX_CHARS + 1))" /dev/zero | tr '\0' 'x' > "${THREAD_HISTORY_FILE}"
            fi
          else
            : > "${THREAD_HISTORY_FILE}"
          fi

      - name: Set clarification phase label
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          source scripts/label_helpers.sh
          # Add clarification label
          ensure_label_exists "ai:clarification" "${{ github.repository }}"
          # Remove stale phase labels only on /reclarify (new issues won't have them)
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${{ github.repository }}" \
              --add-label 'ai:clarification' \
              --remove-label 'ai:planning' --remove-label 'ai:awaiting-approval' \
              --remove-label 'ai:implementing' --remove-label 'ai:done' >/dev/null 2>&1 || true
          else
            gh_retry gh api -X POST "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels" -f labels[]='ai:clarification' >/dev/null
          fi

      - name: Record clarification run start
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          if ! bash -n scripts/memory_helpers.sh >/dev/null 2>&1 \
            || ! grep -q 'memory_retrieve' scripts/memory_helpers.sh \
            || ! grep -q 'memory_record_run_event' scripts/memory_helpers.sh \
            || ! grep -q 'memory_record_candidate' scripts/memory_helpers.sh; then
            echo "::warning::memory_helpers.sh unavailable; using fail-open stubs"
            cat > scripts/memory_helpers.sh <<'EOF'
          memory_retrieve(){ local out="${1:-}"; [ -n "${out}" ] && printf 'AI MEMORY CONTEXT\nstatus: unavailable\n' > "${out}"; return 0; }
          memory_record_run_event(){ return 0; }
          memory_record_candidate(){ return 0; }
          EOF
          fi
          source scripts/memory_helpers.sh 2>/dev/null || true
          memory_ensure_branch 2>/dev/null || true

          if ! declare -F memory_retrieve >/dev/null 2>&1 \
            || ! declare -F memory_record_run_event >/dev/null 2>&1 \
            || ! declare -F memory_record_candidate >/dev/null 2>&1; then
            echo "::warning::memory_helpers.sh missing expected helpers; applying fail-open function fallbacks"
          fi
          declare -F memory_retrieve >/dev/null 2>&1 || memory_retrieve(){ local out="${1:-}"; [ -n "${out}" ] && printf 'AI MEMORY CONTEXT\nstatus: unavailable\n' > "${out}"; return 0; }
          declare -F memory_record_run_event >/dev/null 2>&1 || memory_record_run_event(){ return 0; }
          declare -F memory_record_candidate >/dev/null 2>&1 || memory_record_candidate(){ return 0; }

          memory_record_run_event \
            --run-id "${{ github.run_id }}" \
            --workflow "clarify" \
            --event-type "phase_started" \
            --status "ok" \
            --message "Clarification phase started for issue #${ISSUE_NUMBER}" \
            --actor "${{ github.actor }}" \
            --issue-number "${ISSUE_NUMBER}"

      - name: Build context file
        run: |
          set -euo pipefail
          {
            echo "ISSUE DESCRIPTION"
            printf '%s\n\n' "$(jq -r '.body // ""' "${ISSUE_META_FILE}")"
            echo "ISSUE COMMENTS"
            # Comments are already in chronological order (direction=asc fetch).
            jq -r '.[] | "[" + (.created_at // "") + "] @" + (.user.login // "unknown") + ":\n" + (.body // "") + "\n"' "${ISSUE_COMMENTS_FILE}"
          } > "${ISSUE_CONTEXT_FILE}"

      - name: Create Codex config
        run: |
          set -euo pipefail
          mkdir -p ~/.codex
          {
            echo 'web_search = "live"'
            echo 'model_provider = "openrouter"'
            echo "model = \"${MODEL_EDITOR}\""
            echo "model_reasoning_effort = \"${MODEL_REASONING_EFFORT}\""
            echo
            echo '[model_providers.openrouter]'
            echo 'name = "OpenRouter"'
            echo 'base_url = "https://openrouter.ai/api/v1"'
            echo 'env_key = "OPENROUTER_API_KEY"'
            echo 'wire_api = "responses"'
            echo 'stream_idle_timeout_ms = 600000'
            echo 'stream_max_retries = 5'
            echo 'request_max_retries = 3'
            echo
            echo '[sandbox_workspace_write]'
            echo 'network_access = true'
          } > ~/.codex/config.toml
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

      - name: Setup Serena MCP server
        env:
          SERENA_VERSION: ${{ vars.SERENA_VERSION || 'main' }}
          SERENA_LANGUAGES: ${{ vars.SERENA_LANGUAGES || '' }}
          SERENA_DISABLED: ${{ vars.SERENA_DISABLED || 'false' }}
          CONTEXT7_DISABLED: ${{ vars.CONTEXT7_DISABLED || 'false' }}
          GIT_MCP_DISABLED: ${{ vars.GIT_MCP_DISABLED || 'false' }}
          SERENA_IGNORED_DIRS: ${{ vars.SERENA_IGNORED_DIRS || '' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          bash scripts/setup_serena.sh --mode planning --context codex

      - name: Pre-assemble static context (cacheable across runs)
        run: |
          set -euo pipefail

          if [ ! -f codex_system_instructions.md ] || [ ! -f ai_pipeline.md ]; then
            echo "Missing required codex input file(s): codex_system_instructions.md and/or ai_pipeline.md"
            exit 1
          fi

          # Split context into static (constant across runs) and dynamic (per-issue)
          # files. This enables LLM prompt caching: the static prefix is identical
          # across all runs, so the provider can cache it and charge reduced rates
          # for subsequent requests. Bundling everything into one file defeats
          # prefix caching because the dynamic issue context changes every run.
          #
          # NOTE: This file is inlined directly into the Codex prompt (not read
          # via a tool call) to avoid wasting a tool call round-trip and ~1400
          # lines of token overhead from the tool response envelope.
          #
          # PHASE-SPECIFIC TRIMMING:
          # - codex_system_instructions.md: Include only sections relevant to
          #   clarification (Serena tooling, Prime Directive, Core Priorities,
          #   Ask-First Mode with question format). Skip execution-phase sections
          #   (production code, env vars, minimal change set, backward compat,
          #   output requirements, debugging, code style, MongoDB rules, task
          #   checklists, PR review mode, repo hygiene) — these save ~130 lines
          #   of tokens that are irrelevant to asking clarification questions.
          # - ai_pipeline.md: Only Phase 1, not Phase 2/3.
          # - README.md: Exclude CI/workflow docs.
          {
            echo "=== SYSTEM INSTRUCTIONS (clarification-trimmed) ==="
            # Extract: header through end of section 2 (Ask-First Mode / question
            # format). This includes Serena tooling, Prime Directive, Core
            # Priorities, and the mandatory Q/A format — everything needed for
            # clarification. Stop at section 3 ("## 3.") which begins
            # execution-phase rules.
            awk '/^## 3\. /{exit} {print}' codex_system_instructions.md
            # Append the FINAL REMINDER since it reinforces ask-first behavior
            echo
            awk '/^## FINAL REMINDER$/,0{print}' codex_system_instructions.md
            echo
            echo "=== AI PIPELINE (Phase 1 — Clarification) ==="
            # Extract only the relevant sections: Overview, Commands, Phase 1,
            # and Shared Runtime Behavior. Stop before Phase 2.
            awk '/^# Phase 2/{exit} {print}' ai_pipeline.md
            echo
            if [ -f agents.md ]; then
              echo "=== AGENTS.MD ==="
              cat agents.md
              echo
            fi
            if [ -f README.md ]; then
              echo "=== README.MD (trimmed) ==="
              # Include app descriptions and conventions but exclude CI/workflow
              # automation docs, PR autofix details, and switchover runbooks that
              # are irrelevant to clarification.
              awk '/^### GitHub AI Automation/{exit} /^### Decimal128 switchover/{exit} {print}' README.md
              echo
            fi
          } > ./pre_assembled_static.txt

          # Log the trimmed static context size for token budget monitoring
          STATIC_LINES="$(wc -l < ./pre_assembled_static.txt)"
          STATIC_BYTES="$(wc -c < ./pre_assembled_static.txt)"
          echo "Static context assembled: ${STATIC_LINES} lines, ${STATIC_BYTES} bytes"

      - name: Retrieve memory context
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh 2>/dev/null || true
          declare -F memory_retrieve >/dev/null 2>&1 || memory_retrieve(){ local out="${1:-}"; [ -n "${out}" ] && printf 'AI MEMORY CONTEXT\nstatus: unavailable\n' > "${out}"; return 0; }

          jq -r '.body // ""' "${ISSUE_META_FILE}" > "${RUNTIME_DIR}/issue_body.txt"

          memory_retrieve "${RUNTIME_DIR}/memory_context.txt" \
            --role "clarify" \
            --issue-number "${ISSUE_NUMBER}" \
            --issue-title "${ISSUE_TITLE}" \
            --issue-body-file "${RUNTIME_DIR}/issue_body.txt"

      - name: Install Redis Python client
        if: vars.SEMANTIC_CACHE_BACKEND == 'redis'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check "redis>=5,<6"

      - name: Restore semantic cache SQLite
        if: vars.SEMANTIC_CACHE_BACKEND == 'sqlite-vec'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ vars.SEMANTIC_CACHE_SQLITE_PATH || '/tmp/semantic_cache.sqlite3' }}
          key: semantic-cache-${{ github.repository }}-${{ vars.SEMANTIC_CACHE_BACKEND }}-${{ vars.SEMANTIC_CACHE_EMBEDDING_MODEL || 'openai/text-embedding-3-small' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            semantic-cache-${{ github.repository }}-${{ vars.SEMANTIC_CACHE_BACKEND }}-${{ vars.SEMANTIC_CACHE_EMBEDDING_MODEL || 'openai/text-embedding-3-small' }}-
      - name: Semantic cache lookup
        id: semantic_cache_lookup
        if: always()
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEMANTIC_CACHE_BACKEND: ${{ vars.SEMANTIC_CACHE_BACKEND || 'none' }}
          SEMANTIC_CACHE_TTL_DAYS: ${{ vars.SEMANTIC_CACHE_TTL_DAYS || '14' }}
          SEMANTIC_CACHE_SIMILARITY_THRESHOLD: ${{ vars.SEMANTIC_CACHE_SIMILARITY_THRESHOLD || '0.92' }}
          SEMANTIC_CACHE_REDIS_URL: ${{ vars.SEMANTIC_CACHE_REDIS_URL || '' }}
          SEMANTIC_CACHE_SQLITE_PATH: ${{ vars.SEMANTIC_CACHE_SQLITE_PATH || '/tmp/semantic_cache.sqlite3' }}
          SEMANTIC_CACHE_EMBEDDING_MODEL: ${{ vars.SEMANTIC_CACHE_EMBEDDING_MODEL || 'openai/text-embedding-3-small' }}
          SEMANTIC_CACHE_MAX_CANONICAL_CHARS: ${{ vars.SEMANTIC_CACHE_MAX_CANONICAL_CHARS || '50000' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          LOOKUP_JSON="${RUNTIME_DIR}/semantic_cache_lookup.json"
          if python3 scripts/semantic_cache.py lookup \
            --phase "clarify" \
            --issue-number "${ISSUE_NUMBER}" \
            --issue-body-file "${RUNTIME_DIR}/issue_body.txt" \
            --thread-history-file "${THREAD_HISTORY_FILE}" \
            --output-file "${CODEX_OUTPUT_FILE}" > "${LOOKUP_JSON}"; then
            :
          else
            echo "::warning::Semantic cache lookup command failed; continuing with live Codex run"
            printf '{"ok":false,"hit":false,"error":"lookup_command_failed"}\n' > "${LOOKUP_JSON}"
          fi

          if jq -e '.ok == true and .hit == true' "${LOOKUP_JSON}" >/dev/null 2>&1; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
            SIMILARITY="$(jq -r '.similarity // ""' "${LOOKUP_JSON}")"
            CACHED_AT="$(jq -r '.cached_at // ""' "${LOOKUP_JSON}")"
            ORIGINAL_ISSUE_ID="$(jq -r '.original_issue_id // ""' "${LOOKUP_JSON}")"
            AUDIT_JSON="$(jq -cn --arg phase "clarify" --arg similarity "${SIMILARITY}" --arg cached_at "${CACHED_AT}" --arg original_issue_id "${ORIGINAL_ISSUE_ID}" '{event:"semantic_cache_hit",phase:$phase,similarity:($similarity|tonumber? // 0),cached_at:$cached_at,original_issue_id:$original_issue_id}')"
            echo "::notice::${AUDIT_JSON}"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
            if jq -e '.ok == false' "${LOOKUP_JSON}" >/dev/null 2>&1; then
              echo "::warning::Semantic cache lookup fail-open: $(jq -r '.error // "unknown_error"' "${LOOKUP_JSON}")"
            fi
          fi

      - name: Run Codex
        id: run_codex
        if: steps.semantic_cache_lookup.outputs.cache_hit != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOOL_CALL_BUDGET: ${{ vars.TOOL_CALL_BUDGET_CLARIFY || '15' }}
        run: |
          set -euo pipefail

          PROMPT_TEMPLATE_FILE="${RUNTIME_DIR}/mode-clarify-inline.txt"
          cat > "${PROMPT_TEMPLATE_FILE}" <<'PROMPT'
          === CLARIFICATION TASK ===

          You are executing the CLARIFICATION phase of the AI development pipeline.

          Your task is to determine whether the GitHub issue contains enough information to implement the task.

          IMPORTANT: The system instructions, AI pipeline spec, agents.md, and README.md
          are provided ABOVE in this prompt. Do NOT read pre_assembled_static.txt or
          any of the individual source files — they are already loaded.

          The issue context (description and comments) is provided BELOW at the end of
          this prompt — do NOT read issue_context.txt separately.

          Use Serena MCP tools or targeted file reads only for specific code
          symbols/functions you need to inspect for clarification.

          SERENA MCP EFFICIENCY (MANDATORY):
          {{SERENA_EFFICIENCY_BLOCK_READ_ONLY}}
          - LARGE FILES (>5000 lines): Skip get_symbols_overview entirely — it will
            exceed character limits and waste a tool call. Use shell rg with | head -n N
            first to locate relevant functions, then use find_symbol or targeted sed reads.
          - Serena search responses are truncated at ~29,000 characters. If
            get_symbols_overview is truncated, retry ONCE with max_answer_chars=29000
            before falling back to shell. Do NOT retry search_for_pattern — narrow
            scope instead. Never fall back to shell grep/rg with the same patterns.
          - NARROW SEARCH SCOPE: When using search_for_pattern, target a specific
            directory or file — never search the entire repo with a broad pattern.
            Bad:  search_for_pattern("crash", "ft.games", "**/*.{py,html,js}")
            Good: search_for_pattern("animateCrash|riseFrameId", "ft.games/static/crash.js")
            If you need to locate files first, use find_file with a specific mask.

          EFFICIENCY RULES (MANDATORY — reduces token waste):
          - Read ONLY the specific lines/symbols you need. Do NOT read entire files or
            request large ranges speculatively. Use Serena symbol tools or targeted line
            ranges (e.g. sed -n '10,30p') instead of full-file reads.
          - Never read the same file region twice. Plan your reads upfront. When reading
            multiple nearby ranges, merge them into ONE wider range instead of separate calls.
          - Prefer Serena MCP tools (get_symbols_overview, find_symbol) over raw file reads
            when available — they return only relevant symbols with far fewer tokens.
          - When a Serena search hits its character limit, do NOT fall back to shell grep/rg
            with the same patterns. Refine the Serena query or narrow the scope instead.
          - Aim to keep total tool calls (MCP + shell exec combined) under TOOL_CALL_BUDGET.
            The budget is a guideline to prevent waste, not a hard cap.
          - Batch shell searches with && or ;.
          - When searching for multiple terms (e.g., game names, route patterns), batch
            into ONE shell rg call with alternation (rg 'term1|term2|term3') rather than
            making separate Serena find_file or search_for_pattern calls per term.
          - After a Serena search returns empty results, do NOT retry with a slightly
            different regex. Switch to shell rg with broader patterns instead.
          - Do NOT map the full implementation surface. Only inspect code to the extent
            needed to identify genuine ambiguities that would block implementation.
          - Do NOT emit progress/status messages (e.g. "I've parsed the issue…"). Output
            ONLY the final STATUS/QUESTIONS result.
          - SKIP DB CONTRACTS for pure UI/frontend issues. Only inspect /db/contracts/
            files when the issue involves data model changes, queries, indexes, or storage.
            Issues about visual alignment, animations, CSS, or JS behavior do not need
            DB contract review.

          EFFICIENT TOOL CALL EXAMPLES (study before starting):
          WASTEFUL (burns budget on broad, overlapping queries):
            1. search_for_pattern("user", "src")  ← broad term on broad directory, huge result
            2. search_for_pattern("@app.route('/foo')", "app.py")  ← too-literal regex, misses dynamic routes
            3. Same search retried with a slightly different regex  ← overlapping retry wastes a call
            4. list_dir on directories unrelated to the issue  ← unnecessary exploration
            5. shell: sed -n '1,200p' some_file  ← reading 200 lines when 20-30 would suffice
            6. Searching db/schema/contract files for a pure UI/frontend issue  ← wrong scope
            7. sed -n '100,200p' f then sed -n '180,250p' f  ← overlapping ranges; use sed -n '100,250p' once
            8. 4× find_file("*term1*"), find_file("*term2*")…  ← use one rg 'term1|term2|…' call instead
          EFFICIENT (targeted, batched, minimal):
            1. activate_project → get_symbols_overview("src/main_module.py")  ← see all functions at once
            2. find_symbol("handle_request", "src/main_module.py")  ← jump to exact function
            3. shell: sed -n '120,140p' src/main_module.py  ← read only the 20 lines you need
            4. search_for_pattern("EDGE_CONFIG|rate_limit|payout", "src/main_module.py")  ← one query, specific terms
            5. shell: rg -l 'ClassName' src/ && sed -n '50,70p' src/found_file.py  ← batched with &&
          Rule of thumb: 1 activate + 1 get_symbols_overview + 2-3 find_symbol/search
          calls should cover most clarification needs. If you're past 10 tool calls,
          you are likely over-exploring.

          QUESTION BUDGET (MANDATORY):
          - HARD LIMIT: Never ask more than 5 questions. Fewer is better.
          - Only ask about decisions that genuinely block implementation.
          - Do NOT ask about implementation details that can be decided during planning
            with reasonable defaults. Examples of planning-phase decisions (do NOT ask):
            * Error handling strategy (retry vs log vs fail)
            * Whether to keep existing storage alongside new integrations
            * Minor format choices (SVG vs PNG icon, inline vs file)
            * Code organization / file structure
            * Feature phasing (include feature X at launch vs follow-up issue)
          - Remove obviously-wrong answer choices. Options that contradict your codebase
            findings waste the user's reading time and add confusion.
          - DO ask about:
            * Ambiguous scope (which pages/components are affected)
            * Conflicting information (e.g., names that don't match between issue and code)
            * Missing critical information (credentials, endpoints, target behavior)
            * Decisions with significant user-facing impact

          Your job:

          1. Determine if the issue is clear enough to implement.
          2. If clarification is required, ask concise clarification questions.
          3. Ask only essential questions needed for implementation.
          4. Use web search when needed to resolve unknowns before asking questions.
          5. If external APIs/services are likely required, review their official API docs and identify the expected endpoints and parameters so planning can include concrete call details for an offline editor.
          6. Use Serena MCP tools (get_symbols_overview, find_symbol) when available to explore
             the codebase efficiently. This helps you understand code structure with fewer tokens.
             If Serena tools are unavailable, fall back to normal file reads.
          7. Flag any factual conflicts between the issue description and the codebase
             (e.g., a name in the issue doesn't match the name in the code).
          8. Do NOT write code.
          9. Do NOT propose implementation solutions.
          10. If a required input is external and non-synthesizable by the auto-answerer
              (for example branch name, commit SHA, credential, or external URL), do not
              emit Q/Choices; emit exactly `BLOCKED: <short reason>`.

          ANSWER COMPATIBILITY (MANDATORY — prevents wasted planning runs):
          - When designing multiple-choice questions, check whether any combinations of
            answers across questions would be logically contradictory or mutually exclusive.
          - If two options across different questions conflict (e.g., Q3:C requires >=5% edge
            but Q4:C replicates tables with ~1% edge), you MUST either:
            (a) Add an explicit note under the conflicting options warning the user, e.g.
                "**Note:** incompatible with Q3:C — selecting both will require re-clarification", OR
            (b) Restructure the questions to eliminate the conflict (e.g., merge them into one
                question with combined options).
          - The goal is to prevent the user from submitting answers that will just bounce back
            for re-clarification during the planning phase, wasting a full planning run.

          Clarification format requirements (MANDATORY):

          - Use the same question/answer format defined in codex_system_instructions.md section "Mandatory Decision Prompt Format".
          - Use question identifiers only as Q1, Q2, Q3, ... (never 1), 2), etc.).
          - For each question, include a "Choices:" block with lettered options (A/B/C minimum as needed).
          - For each question, mark one or more best options with the exact uppercase suffix: " (RECOMMENDED)".
          - Never leave a question without at least one " (RECOMMENDED)" option.
          - Questions must be emitted only in this format; do not use plain bullet-question format.

          Output format (exact):
          STATUS: NEEDS_CLARIFICATION
          CONFIDENCE: HIGH | MEDIUM | LOW
          RATIONALE: <1-3 short lines>
          QUESTIONS:
          <one or more Q<ID> blocks in mandatory format>

          Or, if no clarification is needed:
          STATUS: CLEAR
          CONFIDENCE: HIGH | MEDIUM | LOW
          RATIONALE: <1-3 short lines>
          QUESTIONS:
          - None

          Or, for blocked handoff:
          BLOCKED: <short reason>
          PROMPT

          # Build prompt: static context + instructions + dynamic issue context,
          # all inlined so the model doesn't waste tool calls reading files.
          # The static prefix (pre_assembled_static.txt) is identical across all
          # runs, enabling LLM provider prompt-prefix caching.
          {
            cat ./pre_assembled_static.txt
            echo
            # Inject the configurable tool call budget before the static heredoc
            echo "TOOL_CALL_BUDGET: ${TOOL_CALL_BUDGET}"
            echo
            bash scripts/render_prompt.sh "${PROMPT_TEMPLATE_FILE}"
            echo
            echo "=== AI MEMORY CONTEXT ==="
            cat "${RUNTIME_DIR}/memory_context.txt"
            echo
            echo "=== ISSUE CONTEXT ==="
            cat "${ISSUE_CONTEXT_FILE}"
          } > "${CODEX_PROMPT_FILE}"

          # Pass prompt via stdin to avoid ARG_MAX limits with large context files
          max_attempts=3
          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Codex clarify attempt ${attempt}/${max_attempts}..."
            if cat "${CODEX_PROMPT_FILE}" | codex exec --model "${MODEL_EDITOR}" --full-auto > "${CODEX_OUTPUT_FILE}" 2> >(tee -a "${RUNTIME_DIR}/codex_log.txt" >&2); then
              if grep -q '[^[:space:]]' "${CODEX_OUTPUT_FILE}"; then
                echo "Codex clarify succeeded on attempt ${attempt}."
                break
              fi
              echo "::warning::Codex returned empty output on attempt ${attempt}."
            else
              rc=$?
              echo "::warning::Codex exited with code $rc on attempt ${attempt}."
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              sleep_secs=$(( 10 * (2 ** (attempt - 1)) + RANDOM % 10 ))
              echo "Retrying in ${sleep_secs}s (includes jitter)..."
              sleep "${sleep_secs}"
            else
              echo "::error::Codex clarify failed after ${max_attempts} attempts."
              exit 1
            fi
          done

      - name: Semantic cache store
        if: always() && steps.semantic_cache_lookup.outputs.cache_hit != 'true' && steps.run_codex.outcome == 'success'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEMANTIC_CACHE_BACKEND: ${{ vars.SEMANTIC_CACHE_BACKEND || 'none' }}
          SEMANTIC_CACHE_TTL_DAYS: ${{ vars.SEMANTIC_CACHE_TTL_DAYS || '14' }}
          SEMANTIC_CACHE_SIMILARITY_THRESHOLD: ${{ vars.SEMANTIC_CACHE_SIMILARITY_THRESHOLD || '0.92' }}
          SEMANTIC_CACHE_REDIS_URL: ${{ vars.SEMANTIC_CACHE_REDIS_URL || '' }}
          SEMANTIC_CACHE_SQLITE_PATH: ${{ vars.SEMANTIC_CACHE_SQLITE_PATH || '/tmp/semantic_cache.sqlite3' }}
          SEMANTIC_CACHE_EMBEDDING_MODEL: ${{ vars.SEMANTIC_CACHE_EMBEDDING_MODEL || 'openai/text-embedding-3-small' }}
          SEMANTIC_CACHE_MAX_CANONICAL_CHARS: ${{ vars.SEMANTIC_CACHE_MAX_CANONICAL_CHARS || '50000' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          STORE_JSON="${RUNTIME_DIR}/semantic_cache_store.json"
          if python3 scripts/semantic_cache.py store \
            --phase "clarify" \
            --issue-number "${ISSUE_NUMBER}" \
            --issue-body-file "${RUNTIME_DIR}/issue_body.txt" \
            --thread-history-file "${THREAD_HISTORY_FILE}" \
            --response-file "${CODEX_OUTPUT_FILE}" > "${STORE_JSON}"; then
            if jq -e '.ok == false' "${STORE_JSON}" >/dev/null 2>&1; then
              echo "::warning::Semantic cache store fail-open: $(jq -r '.error // "unknown_error"' "${STORE_JSON}")"
            fi
          else
            echo "::warning::Semantic cache store command failed; continuing"
          fi

      - name: Save semantic cache SQLite
        if: always() && vars.SEMANTIC_CACHE_BACKEND == 'sqlite-vec' && steps.run_codex.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ vars.SEMANTIC_CACHE_SQLITE_PATH || '/tmp/semantic_cache.sqlite3' }}
          key: semantic-cache-${{ github.repository }}-${{ vars.SEMANTIC_CACHE_BACKEND }}-${{ vars.SEMANTIC_CACHE_EMBEDDING_MODEL || 'openai/text-embedding-3-small' }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Write run summary
        if: always()
        env:
          TOKEN_WARN_THRESHOLD: ${{ vars.TOKEN_WARN_THRESHOLD_CLARIFY || '80000' }}
        run: |
          set -euo pipefail
          TOKENS=""
          if [ -f "${RUNTIME_DIR}/codex_log.txt" ]; then
            # Codex CLI prints "tokens used\n<number>" to stderr
            TOKENS="$(grep -A1 'tokens used' "${RUNTIME_DIR}/codex_log.txt" | tail -1 | tr -d '[:space:]' || true)"
          fi
          {
            echo "## AI Clarify Summary"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Issue | #${ISSUE_NUMBER} |"
            echo "| Model | \`${MODEL_EDITOR}\` |"
            if [ -n "${TOKENS}" ]; then
              echo "| Tokens used | ${TOKENS} |"
              TOKENS_NUM="${TOKENS//,/}"
              if [ "${TOKENS_NUM}" -gt "${TOKEN_WARN_THRESHOLD}" ] 2>/dev/null; then
                echo "| :warning: Token alert | Above ${TOKEN_WARN_THRESHOLD} threshold — review prompt efficiency |"
              fi
            fi
            if [ -f "${CODEX_OUTPUT_FILE}" ]; then
              STATUS="$(grep -oiE 'STATUS:\s*(CLEAR|NEEDS_CLARIFICATION)|^\s*BLOCKED:\s*.+$' "${CODEX_OUTPUT_FILE}" | head -1 || echo "unknown")"
              echo "| Result | ${STATUS} |"
              # Count questions if clarification was needed
              if echo "${STATUS}" | grep -qi 'NEEDS_CLARIFICATION'; then
                Q_COUNT="$(grep -cE '^\*\*Q[0-9]+:' "${CODEX_OUTPUT_FILE}" || echo "0")"
                echo "| Questions | ${Q_COUNT} |"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Parse Codex output
        id: parse_codex
        run: |
          set -euo pipefail
          BLOCKED_REASON="$(perl -ne '
            if (/^\s*(?:```|~~~)/) { $in_code = !$in_code; next; }
            next if $in_code;
            if (/^\s*BLOCKED:\s*(.*\S)\s*$/i) { print $1; exit; }
          ' "${CODEX_OUTPUT_FILE}")"

          if [ -n "${BLOCKED_REASON}" ]; then
            BLOCKED_REASON_OUTPUT_DELIM="BLOCKED_REASON_OUTPUT_${GITHUB_RUN_ID:-0}_${GITHUB_RUN_ATTEMPT:-0}_$$"
            BLOCKED_REASON_ENV_DELIM="BLOCKED_REASON_ENV_${GITHUB_RUN_ID:-0}_${GITHUB_RUN_ATTEMPT:-0}_$$"
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            {
              printf 'blocked_reason<<%s\n' "${BLOCKED_REASON_OUTPUT_DELIM}"
              printf '%s\n' "${BLOCKED_REASON}"
              printf '%s\n' "${BLOCKED_REASON_OUTPUT_DELIM}"
            } >> "$GITHUB_OUTPUT"
            echo "needs_clarification=false" >> "$GITHUB_OUTPUT"
            echo "BLOCKED=true" >> "$GITHUB_ENV"
            {
              printf 'BLOCKED_REASON<<%s\n' "${BLOCKED_REASON_ENV_DELIM}"
              printf '%s\n' "${BLOCKED_REASON}"
              printf '%s\n' "${BLOCKED_REASON_ENV_DELIM}"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "blocked_reason=" >> "$GITHUB_OUTPUT"
          echo "BLOCKED=false" >> "$GITHUB_ENV"

          # Case-insensitive, flexible parsing to handle LLM output variability
          if grep -qiE 'STATUS:.*NEEDS_CLARIFICATION|^\*\*STATUS:\*\*.*NEEDS_CLARIFICATION' "${CODEX_OUTPUT_FILE}"; then
            # Extract questions section, handling various markdown formats
            awk 'BEGIN{IGNORECASE=1} /QUESTIONS:/{f=1; next} f{if (/^[[:space:]]*$/ && NF==0) next; print}' "${CODEX_OUTPUT_FILE}" | sed '/^[[:space:]]*$/d' > "${QUESTIONS_FILE}"

            # Primary signal: count actual Q<N> formatted questions (most reliable)
            Q_COUNT="$(grep -cE '^\*?\*?Q[0-9]+' "${QUESTIONS_FILE}" || echo "0")"

            if [ "${Q_COUNT}" -gt 0 ]; then
              echo "needs_clarification=true" >> "$GITHUB_OUTPUT"
              echo "Detected ${Q_COUNT} clarification question(s)."
            else
              # Fallback: check for placeholder patterns that mean "no questions"
              FIRST_LINE="$(head -n 1 "${QUESTIONS_FILE}" | tr -d '\r')"
              if [ -z "${FIRST_LINE}" ] || printf '%s\n' "${FIRST_LINE}" | grep -qiE '^[[:space:]]*(-[[:space:]]*)?(none|n/?a|no questions|no clarification)[[:space:]]*'; then
                echo "::warning::NEEDS_CLARIFICATION with no actual questions; treating as clear"
                echo "needs_clarification=false" >> "$GITHUB_OUTPUT"
              elif [ -s "${QUESTIONS_FILE}" ]; then
                # Has content but no Q<N> pattern — still treat as clarification needed
                echo "::warning::Questions section has content but no Q<N> format; posting as-is"
                echo "needs_clarification=true" >> "$GITHUB_OUTPUT"
              else
                echo "needs_clarification=false" >> "$GITHUB_OUTPUT"
              fi
            fi
          else
            echo "needs_clarification=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Handle blocked clarification output
        if: steps.parse_codex.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
          BLOCKED_REASON: ${{ steps.parse_codex.outputs.blocked_reason }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          source scripts/label_helpers.sh
          source scripts/tg_helpers.sh

          ensure_label_exists "ai:blocked" "${{ github.repository }}"
          gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${{ github.repository }}" \
            --add-label 'ai:blocked' \
            --remove-label 'ai:clarification' \
            --remove-label 'ai:planning' \
            --remove-label 'ai:awaiting-approval' >/dev/null 2>&1 || true

          BLOCKED_COMMENT_FILE="${RUNTIME_DIR}/blocked_comment.md"
          {
            echo "Clarification blocked: human input required."
            echo
            echo "Reason: ${BLOCKED_REASON}"
            echo
            echo "Auto-answer has been paused to avoid unsatisfiable clarification loops."
            echo "Provide the required input, then run /reclarify or continue with /answer as appropriate."
          } > "${BLOCKED_COMMENT_FILE}"

          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat "${BLOCKED_COMMENT_FILE}")" >/dev/null

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="Clarification blocked for issue #${ISSUE_NUMBER}: ${BLOCKED_REASON}"
          MSG+=$'\n'
          MSG+="Issue: ${ISSUE_URL}"
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_tracked "${ISSUE_NUMBER}" "${MSG}" "CRITICAL"

      - name: Post clarification questions
        if: steps.parse_codex.outputs.blocked != 'true' && steps.parse_codex.outputs.needs_clarification == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          # Labels already set by "Set clarification phase label" step above.
          {
            echo "<!-- ai:clarification-questions -->"
            echo "Clarification required"
            echo
            cat "${QUESTIONS_FILE}"
            echo
            echo "Reply with:"
            echo "/answer"
          } > "${RUNTIME_DIR}/clarification_comment.md"

          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat "${RUNTIME_DIR}/clarification_comment.md")"

      - name: Record clarification candidate (needs clarification)
        if: steps.parse_codex.outputs.blocked != 'true' && steps.parse_codex.outputs.needs_clarification == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh 2>/dev/null || true
          declare -F memory_record_candidate >/dev/null 2>&1 || memory_record_candidate(){ return 0; }

          DETAILS="$(head -c 12000 "${QUESTIONS_FILE}")"

          memory_record_candidate \
            --category "decisions" \
            --summary "Issue #${ISSUE_NUMBER} needs clarification" \
            --details "${DETAILS}" \
            --confidence "0.90" \
            --workflow "clarify" \
            --run-id "${{ github.run_id }}" \
            --actor "${{ github.actor }}" \
            --issue-number "${ISSUE_NUMBER}"

      - name: Post clear-to-proceed comment
        if: steps.parse_codex.outputs.blocked != 'true' && steps.parse_codex.outputs.needs_clarification != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          source scripts/label_helpers.sh
          # Swap label from ai:clarification to ai:planning since no questions needed.
          ensure_label_exists "ai:planning" "${{ github.repository }}"
          gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${{ github.repository }}" \
            --add-label 'ai:planning' --remove-label 'ai:clarification' >/dev/null 2>&1 || true

          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body=$'The task appears clear.\n\nNo clarification questions were needed, so the workflow auto-posted /answer to continue automatically.'

          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body=$'/answer [auto-answered-by-clarify]\n\nAuto answer was posted because no human clarification was required.'

      - name: Record clarification candidate (clear)
        if: steps.parse_codex.outputs.blocked != 'true' && steps.parse_codex.outputs.needs_clarification != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh 2>/dev/null || true
          declare -F memory_record_candidate >/dev/null 2>&1 || memory_record_candidate(){ return 0; }

          memory_record_candidate \
            --category "decisions" \
            --summary "Issue #${ISSUE_NUMBER} is clear - no clarification needed" \
            --details "The issue provided sufficient context for planning. Auto-posted /answer." \
            --confidence "0.85" \
            --workflow "clarify" \
            --run-id "${{ github.run_id }}" \
            --actor "${{ github.actor }}" \
            --issue-number "${ISSUE_NUMBER}"

      - name: Telegram clarification notification
        if: steps.parse_codex.outputs.blocked != 'true' && steps.parse_codex.outputs.needs_clarification == 'true'
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
        run: |
          set -euo pipefail
          source scripts/tg_helpers.sh

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="Clarification required for #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          MSG+=$'\n'
          MSG+="Issue: ${ISSUE_URL}"
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"

          # Orchestrator-managed issues: skip TG alert (auto-answered by orchestrate_clarify_respond).
          # Non-orchestrator issues: use phase tracking (cleaned up when plan starts).
          ISSUE_BODY_CHECK="$(jq -r '.body // ""' "${ISSUE_META_FILE}")"
          if printf '%s' "${ISSUE_BODY_CHECK}" | grep -qF 'Managed by: AI Orchestrator'; then
            echo "Skipping TG alert for orchestrator-managed issue (will be auto-answered)."
          else
            tg_send_phase_tracked "${ISSUE_NUMBER}" "clarify" "${MSG}" "CRITICAL"
          fi

      - name: Record clarification run completed
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh 2>/dev/null || true
          declare -F memory_record_run_event >/dev/null 2>&1 || memory_record_run_event(){ return 0; }

          OUTCOME="clear"
          if [ "${{ steps.parse_codex.outputs.blocked }}" = "true" ]; then
            OUTCOME="blocked"
          elif [ "${{ steps.parse_codex.outputs.needs_clarification }}" = "true" ]; then
            OUTCOME="needs_clarification"
          fi

          memory_record_run_event \
            --run-id "${{ github.run_id }}" \
            --workflow "clarify" \
            --event-type "phase_completed" \
            --status "ok" \
            --message "Clarification completed: ${OUTCOME}" \
            --actor "${{ github.actor }}" \
            --issue-number "${ISSUE_NUMBER}" \
            --metadata-json "{\"outcome\": \"${OUTCOME}\"}"

      - name: Record clarification run failed
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh 2>/dev/null || true
          declare -F memory_record_run_event >/dev/null 2>&1 || memory_record_run_event(){ return 0; }

          FINAL_OUTCOME="failed"
          if [ "${{ job.status }}" = "cancelled" ]; then
            FINAL_OUTCOME="cancelled"
          fi

          memory_record_run_event \
            --run-id "${{ github.run_id }}" \
            --workflow "clarify" \
            --event-type "phase_failed" \
            --status "error" \
            --message "Clarification ${FINAL_OUTCOME} for issue #${ISSUE_NUMBER}" \
            --actor "${{ github.actor }}" \
            --issue-number "${ISSUE_NUMBER}" \
            --metadata-json "{\"outcome\": \"${FINAL_OUTCOME}\"}"

      - name: Comment on issue failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ job.status }}" = "cancelled" ]; then
            REASON="AI clarification workflow was cancelled/timed out for ${ISSUE_URL}. Run: ${RUN_URL}"
          else
            REASON="AI clarification workflow failed for ${ISSUE_URL}. Run: ${RUN_URL}"
          fi
          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body="${REASON}"

      - name: Telegram failure notification
        if: failure() || cancelled()
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
        run: |
          set -euo pipefail
          source scripts/tg_helpers.sh

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ job.status }}" = "cancelled" ]; then
            MSG="AI clarification cancelled/timed out for #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          else
            MSG="AI clarification failed for #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          fi
          MSG+=$'\n'
          MSG+="Issue: ${ISSUE_URL}"
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_tracked "${ISSUE_NUMBER}" "${MSG}" "ERROR"

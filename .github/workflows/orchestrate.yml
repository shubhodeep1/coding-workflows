---
name: AI Orchestrate (Reusable)

"on":
  workflow_call:
    inputs:
      project_description:
        description: >
          Full project description. The orchestrator will clarify scope,
          decompose into issues with a dependency DAG, create the tracking
          issue and child issues, and kick off Wave 1.
        required: true
        type: string
    secrets:
      GH_PAT:
        required: true
      OPENROUTER_API_KEY:
        required: true
      TG_BOT_SECRET:
        required: false

env:
  MODEL_EDITOR: ${{ vars.WORKFLOW_ORCHESTRATE_MODEL || vars.WORKFLOW_EDITOR_MODEL || 'openai/gpt-5.3-codex' }}
  MODEL_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_ORCHESTRATE || 'medium' }}
  OPENROUTER_PROMPT_CACHE_DISABLED: ${{ vars.OPENROUTER_PROMPT_CACHE_DISABLED || 'false' }}

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ai-orchestrate-${{ github.repository }}-${{ github.run_id }}
      cancel-in-progress: false
    env:
      ORCHESTRATE_POLL_INTERVAL: ${{ vars.ORCHESTRATE_POLL_INTERVAL || '5' }}

    steps:
      - name: Log trigger context
        run: |
          echo "Orchestrate workflow triggered"
          echo "Run ID: ${{ github.run_id }}"
          echo "Model: ${MODEL_EDITOR}"
          echo "Reasoning: ${MODEL_REASONING_EFFORT}"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Configure git auth for memory helper clones
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_PAT is empty"; exit 1; }
          SERVER_HOST="${GITHUB_SERVER_URL#https://}"
          SERVER_HOST="${SERVER_HOST#http://}"
          SERVER_HOST="${SERVER_HOST%/}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Codex CLI and core tools
        shell: bash
        run: |
          set -euo pipefail

          CODEX_VERSION="${{ vars.CODEX_VERSION || 'v0.114.0' }}"
          npm install -g "@openai/codex@${CODEX_VERSION}" --no-audit --no-fund

          missing_tools=()
          for tool in jq curl gh; do
            command -v "$tool" >/dev/null 2>&1 || missing_tools+=("$tool")
          done

          if [ "${#missing_tools[@]}" -gt 0 ]; then
            if ! command -v apt-get >/dev/null 2>&1; then
              echo "Missing tools (${missing_tools[*]}), but apt-get is unavailable on this runner" >&2
              exit 1
            fi

            apt_cmd=(apt-get)
            if command -v sudo >/dev/null 2>&1; then
              apt_cmd=(sudo apt-get)
            elif [ "$(id -u)" -ne 0 ]; then
              echo "Missing tools (${missing_tools[*]}), but sudo is unavailable and the current user is not root" >&2
              exit 1
            fi

            "${apt_cmd[@]}" update
            if ! "${apt_cmd[@]}" install -y "${missing_tools[@]}"; then
              echo "apt-get install failed for: ${missing_tools[*]}" >&2
              exit 1
            fi
          fi

          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"

      - name: Validate required environment variables
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "Missing required environment variables: OPENROUTER_API_KEY" >&2
            exit 1
          fi

      - name: Resolve workflow support ref for run-start
        run: |
          set -euo pipefail
          wf_source="${{ github.repository_owner }}/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            echo "SCRIPT_REF=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "SCRIPT_REF=stable" >> "$GITHUB_ENV"
          fi

      - name: Checkout workflow support source for run-start
        id: checkout_support_source_run_start
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/coding-workflows
          ref: ${{ env.SCRIPT_REF }}
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Checkout workflow support source fallback for run-start
        if: ${{ steps.checkout_support_source_run_start.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Checkout workflow support source main snapshot for run-start
        if: ${{ env.SCRIPT_REF != 'main' }}
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src-main
          fetch-depth: 1

      - name: Stage workflow memory support files for run-start
        run: |
          set -euo pipefail

          if [ ! -d .codex-workflow-src ]; then
            echo "::warning::Support source checkout unavailable before run-start memory event"
            exit 0
          fi

          wf_source="${{ github.repository_owner }}/coding-workflows"
          mkdir -p scripts
          _fetched_scripts=()
          for f in gh_helpers.sh memory_helpers.sh ai_memory.py ai_memory_lib.py openrouter_prompt_cache.py; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::warning::Missing required run-start support script ${f}; run-start memory event may be skipped"
              continue
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")
          done

          if [ "${{ github.repository }}" != "${wf_source}" ] && [ "${#_fetched_scripts[@]}" -gt 0 ]; then
            {
              echo "# Auto-generated by coding-workflows — DO NOT EDIT"
              echo "# Prevents runtime-fetched support scripts from being committed."
              printf '%s\n' "${_fetched_scripts[@]}" .gitignore
            } > scripts/.gitignore
          fi

          mkdir -p ai-memory/schemas
          for sf in memory_record.v1.json processed_command_entry.v1.json run_ledger_entry.v1.json task_lineage.v1.json actions_runs_cache.v1.json workflow_log_analysis_cache.v1.json; do
            src=".codex-workflow-src/ai-memory/schemas/${sf}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/ai-memory/schemas/${sf}" ]; then
              src=".codex-workflow-src-main/ai-memory/schemas/${sf}"
            fi
            if [ ! -f "ai-memory/schemas/${sf}" ] && [ -f "${src}" ]; then
              install -m 0644 "${src}" "ai-memory/schemas/${sf}"
            fi
          done

          rm -rf .codex-workflow-src-main

      - name: Record orchestration run start
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          if [ ! -f "scripts/memory_helpers.sh" ] || [ ! -f "scripts/ai_memory.py" ] || [ ! -f "scripts/ai_memory_lib.py" ]; then
            echo "::warning::Required memory helper scripts unavailable; skipping orchestration start memory event"
            exit 0
          fi

          source scripts/memory_helpers.sh
          if ! declare -F memory_ensure_branch >/dev/null 2>&1; then
            echo "::warning::memory_ensure_branch not defined after sourcing scripts/memory_helpers.sh; using no-op stub"
            memory_ensure_branch() { return 0; }
          fi
          memory_ensure_branch

          memory_record_run_event \
            --run-id "${{ github.run_id }}" \
            --workflow "orchestrate" \
            --event-type "orchestration_started" \
            --status "ok" \
            --message "Orchestration started for ${{ github.repository }}" \
            --actor "${{ github.actor }}"

      - name: Create runtime workspace
        run: |
          set -euo pipefail
          RUNTIME_DIR="/tmp/codex-orchestrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${RUNTIME_DIR}"
          {
            echo "RUNTIME_DIR=${RUNTIME_DIR}"
            echo "DECOMPOSITION_FILE=${RUNTIME_DIR}/decomposition.json"
            echo "CODEX_PROMPT_FILE=${RUNTIME_DIR}/codex_prompt.txt"
            echo "CODEX_OUTPUT_FILE=${RUNTIME_DIR}/codex_output.txt"
            echo "TRACKING_BODY_FILE=${RUNTIME_DIR}/tracking_body.md"
            echo "STATE_FILE=${RUNTIME_DIR}/state.json"
          } >> "$GITHUB_ENV"

      - name: Resolve workflow support ref
        run: |
          set -euo pipefail
          wf_source="${{ github.repository_owner }}/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            echo "SCRIPT_REF=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "SCRIPT_REF=stable" >> "$GITHUB_ENV"
          fi

      - name: Checkout workflow support source
        id: checkout_support_source
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/coding-workflows
          ref: ${{ env.SCRIPT_REF }}
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Checkout workflow support source fallback
        if: ${{ steps.checkout_support_source.outcome == 'failure' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Ensure workflow support source checkout
        run: |
          set -euo pipefail
          if [ ! -d .codex-workflow-src ]; then
            echo "::error::Failed to checkout workflow support source from ${SCRIPT_REF} or main"
            exit 1
          fi

      - name: Checkout workflow support source main snapshot
        if: ${{ env.SCRIPT_REF != 'main' }}
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src-main
          fetch-depth: 1

      - name: Stage workflow support files
        run: |
          set -euo pipefail
          wf_source="${{ github.repository_owner }}/coding-workflows"
          mkdir -p scripts

          _fetched_scripts=()
          for f in gh_helpers.sh setup_serena.sh git_ref_health_check.sh orchestrate_lib.py render_prompt.sh tg_helpers.sh memory_helpers.sh ai_memory.py ai_memory_lib.py openrouter_prompt_cache.py; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::error::Missing required support script ${f} in ${wf_source}@${SCRIPT_REF}"
              exit 1
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")
          done

          mkdir -p ai-memory/schemas
          for sf in memory_record.v1.json processed_command_entry.v1.json run_ledger_entry.v1.json task_lineage.v1.json actions_runs_cache.v1.json workflow_log_analysis_cache.v1.json; do
            src=".codex-workflow-src/ai-memory/schemas/${sf}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/ai-memory/schemas/${sf}" ]; then
              src=".codex-workflow-src-main/ai-memory/schemas/${sf}"
            fi
            if [ ! -f "ai-memory/schemas/${sf}" ] && [ -f "${src}" ]; then
              install -m 0644 "${src}" "ai-memory/schemas/${sf}"
            fi
          done

          mkdir -p prompts
          prompt_src=".codex-workflow-src/prompts/mode-orchestrate.txt"
          if [ ! -f "${prompt_src}" ] && [ -f ".codex-workflow-src-main/prompts/mode-orchestrate.txt" ]; then
            prompt_src=".codex-workflow-src-main/prompts/mode-orchestrate.txt"
          fi
          if [ ! -f "${prompt_src}" ]; then
            echo "::error::Missing required support file prompts/mode-orchestrate.txt"
            exit 1
          fi
          install -m 0644 "${prompt_src}" prompts/mode-orchestrate.txt

          prompt_src=".codex-workflow-src/prompts/serena-efficiency-block.txt"
          if [ ! -f "${prompt_src}" ] && [ -f ".codex-workflow-src-main/prompts/serena-efficiency-block.txt" ]; then
            prompt_src=".codex-workflow-src-main/prompts/serena-efficiency-block.txt"
          fi
          if [ ! -f "${prompt_src}" ]; then
            echo "::error::Missing required support file prompts/serena-efficiency-block.txt"
            exit 1
          fi
          install -m 0644 "${prompt_src}" prompts/serena-efficiency-block.txt

          mkdir -p .github/ai
          schema_src=".codex-workflow-src/.github/ai/orchestrate_schema.v1.json"
          if [ ! -f "${schema_src}" ] && [ -f ".codex-workflow-src-main/.github/ai/orchestrate_schema.v1.json" ]; then
            schema_src=".codex-workflow-src-main/.github/ai/orchestrate_schema.v1.json"
          fi
          if [ ! -f "${schema_src}" ]; then
            echo "::error::Missing required support file .github/ai/orchestrate_schema.v1.json"
            exit 1
          fi
          install -m 0644 "${schema_src}" .github/ai/orchestrate_schema.v1.json

          catalog_src=".codex-workflow-src/scripts/codex_model_catalog.json"
          if [ ! -f "${catalog_src}" ] && [ -f ".codex-workflow-src-main/scripts/codex_model_catalog.json" ]; then
            catalog_src=".codex-workflow-src-main/scripts/codex_model_catalog.json"
          fi
          if [ -f "${catalog_src}" ]; then
            install -m 0644 "${catalog_src}" scripts/codex_model_catalog.json
            _fetched_scripts+=(codex_model_catalog.json)
          else
            echo "Model catalog not on ${SCRIPT_REF} yet; using local copy."
          fi

          if [ "${{ github.repository }}" != "${wf_source}" ]; then
            {
              echo "# Auto-generated by coding-workflows — DO NOT EDIT"
              echo "# Prevents runtime-fetched support scripts from being committed."
              printf '%s\n' "${_fetched_scripts[@]}" .gitignore
            } > scripts/.gitignore
          fi

          for f in codex_system_instructions.md ai_pipeline.md; do
            if [ ! -f "${f}" ]; then
              src=".codex-workflow-src/${f}"
              if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/${f}" ]; then
                src=".codex-workflow-src-main/${f}"
              fi
              if [ ! -f "${src}" ]; then
                echo "::error::Failed to stage required file ${f}"
                exit 1
              fi
              install -m 0644 "${src}" "${f}"
            fi
          done

          rm -rf .codex-workflow-src-main

      - name: Create Codex config
        run: |
          set -euo pipefail
          mkdir -p ~/.codex
          CATALOG_PATH="$(pwd)/scripts/codex_model_catalog.json"
          {
            echo 'web_search = "live"'
            echo 'model_provider = "openrouter"'
            echo "model = \"${MODEL_EDITOR}\""
            echo "model_reasoning_effort = \"${MODEL_REASONING_EFFORT}\""
            if [ -f "${CATALOG_PATH}" ]; then
              echo "model_catalog_json = \"${CATALOG_PATH}\""
            fi
            echo
            echo '[model_providers.openrouter]'
            echo 'name = "OpenRouter"'
            echo 'base_url = "https://openrouter.ai/api/v1"'
            echo 'env_key = "OPENROUTER_API_KEY"'
            echo 'wire_api = "responses"'
            echo 'stream_idle_timeout_ms = 600000'
            echo 'stream_max_retries = 5'
            echo 'request_max_retries = 3'
            echo
            echo '[sandbox_workspace_write]'
            echo 'network_access = true'
          } > ~/.codex/config.toml
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

      - name: Setup Serena MCP server
        env:
          SERENA_VERSION: ${{ vars.SERENA_VERSION || 'main' }}
          SERENA_LANGUAGES: ${{ vars.SERENA_LANGUAGES || '' }}
          SERENA_DISABLED: ${{ vars.SERENA_DISABLED || 'false' }}
          CONTEXT7_DISABLED: ${{ vars.CONTEXT7_DISABLED || 'false' }}
          GIT_MCP_DISABLED: ${{ vars.GIT_MCP_DISABLED || 'false' }}
          SERENA_IGNORED_DIRS: ${{ vars.SERENA_IGNORED_DIRS || '' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          bash scripts/setup_serena.sh --mode planning --context codex

      - name: Pre-assemble static context
        run: |
          set -euo pipefail

          {
            echo "=== SYSTEM INSTRUCTIONS ==="
            cat codex_system_instructions.md
            echo
            echo "=== AI PIPELINE ==="
            cat ai_pipeline.md
            echo
            if [ -f agents.md ]; then
              echo "=== AGENTS.MD ==="
              cat agents.md
              echo
            fi
            if [ -f README.md ]; then
              echo "=== README.MD ==="
              cat README.md
              echo
            fi
          } > ./pre_assembled_static.txt

          STATIC_LINES="$(wc -l < ./pre_assembled_static.txt)"
          STATIC_BYTES="$(wc -c < ./pre_assembled_static.txt)"
          echo "Static context assembled: ${STATIC_LINES} lines, ${STATIC_BYTES} bytes"

      - name: Retrieve memory context
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
          PROJECT_DESCRIPTION: ${{ inputs.project_description }}
        run: |
          set -euo pipefail
          if ! source scripts/memory_helpers.sh; then
            echo "::warning::Unable to source scripts/memory_helpers.sh; writing fallback memory context"
            printf 'AI MEMORY CONTEXT\nstatus: unavailable\n' > "${RUNTIME_DIR}/memory_context.txt"
            exit 0
          fi

          PROJECT_CONTEXT_FILE="${RUNTIME_DIR}/project_description.txt"
          printf '%s\n' "${PROJECT_DESCRIPTION}" > "${PROJECT_CONTEXT_FILE}"

          ISSUE_TITLE="$(head -n 1 "${PROJECT_CONTEXT_FILE}" | tr -d '\r' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          if [ -z "${ISSUE_TITLE}" ]; then
            ISSUE_TITLE="Orchestration request"
          fi
          ISSUE_TITLE="${ISSUE_TITLE:0:200}"

          memory_retrieve "${RUNTIME_DIR}/memory_context.txt" \
            --role "planning" \
            --issue-title "${ISSUE_TITLE}" \
            --issue-body-file "${PROJECT_CONTEXT_FILE}"

      - name: Build Codex prompt
        env:
          TOOL_CALL_BUDGET: ${{ vars.TOOL_CALL_BUDGET_ORCHESTRATE || '40' }}
          PROJECT_DESCRIPTION: ${{ inputs.project_description }}
        run: |
          set -euo pipefail

          {
            cat ./pre_assembled_static.txt
            echo
            echo "TOOL_CALL_BUDGET: ${TOOL_CALL_BUDGET}"
            echo
            echo "=== ORCHESTRATION TASK ==="
            echo
            bash scripts/render_prompt.sh prompts/mode-orchestrate.txt
            echo
            echo "=== AI MEMORY CONTEXT ==="
            if [ -f "${RUNTIME_DIR}/memory_context.txt" ]; then
              cat "${RUNTIME_DIR}/memory_context.txt"
            else
              echo "AI MEMORY CONTEXT"
              echo "status: unavailable"
            fi
            echo
            echo "=== DECOMPOSITION SCHEMA ==="
            echo
            cat .github/ai/orchestrate_schema.v1.json
            echo
            echo "=== PROJECT DESCRIPTION ==="
            echo
            printf '%s\n' "${PROJECT_DESCRIPTION}"
          } > "${CODEX_PROMPT_FILE}"

          echo "Prompt built: $(wc -l < "${CODEX_PROMPT_FILE}") lines, $(wc -c < "${CODEX_PROMPT_FILE}") bytes"

      - name: Run Codex (decomposer)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail

          max_attempts=3
          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Codex orchestrate attempt ${attempt}/${max_attempts}..."
            if cat "${CODEX_PROMPT_FILE}" | codex exec --model "${MODEL_EDITOR}" --full-auto > "${CODEX_OUTPUT_FILE}" 2> >(tee -a "${RUNTIME_DIR}/codex_log.txt" >&2); then
              if grep -q '[^[:space:]]' "${CODEX_OUTPUT_FILE}"; then
                echo "Codex orchestrate succeeded on attempt ${attempt}."
                break
              fi
              echo "::warning::Codex returned empty output on attempt ${attempt}."
            else
              rc=$?
              echo "::warning::Codex exited with code $rc on attempt ${attempt}."
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              sleep_secs=$(( 10 * (2 ** (attempt - 1)) + RANDOM % 10 ))
              echo "Retrying in ${sleep_secs}s (includes jitter)..."
              sleep "${sleep_secs}"
            else
              echo "::error::Codex orchestrate failed after ${max_attempts} attempts."
              exit 1
            fi
          done

      - name: Extract and validate decomposition JSON
        run: |
          set -euo pipefail

          # The LLM may wrap output in markdown fences or add prose around the JSON.
          # Extract the first JSON object from the output.
          python3 -c "
          import json, re, sys

          raw = open('${CODEX_OUTPUT_FILE}', 'r').read()

          # Try parsing the whole output as JSON first
          try:
              data = json.loads(raw.strip())
              json.dump(data, open('${DECOMPOSITION_FILE}', 'w'), indent=2)
              sys.exit(0)
          except json.JSONDecodeError:
              pass

          # Strip markdown fences and try again
          cleaned = re.sub(r'\`\`\`(?:json)?\s*', '', raw)
          cleaned = re.sub(r'\`\`\`\s*$', '', cleaned, flags=re.MULTILINE)

          # Find the first { ... } block
          brace_depth = 0
          start = None
          for i, ch in enumerate(cleaned):
              if ch == '{':
                  if brace_depth == 0:
                      start = i
                  brace_depth += 1
              elif ch == '}':
                  brace_depth -= 1
                  if brace_depth == 0 and start is not None:
                      candidate = cleaned[start:i+1]
                      try:
                          data = json.loads(candidate)
                          json.dump(data, open('${DECOMPOSITION_FILE}', 'w'), indent=2)
                          sys.exit(0)
                      except json.JSONDecodeError:
                          start = None

          print('ERROR: Could not extract valid JSON from Codex output', file=sys.stderr)
          print('Raw output (first 2000 chars):', file=sys.stderr)
          print(raw[:2000], file=sys.stderr)
          sys.exit(1)
          "

          # Validate against schema rules
          python3 scripts/orchestrate_lib.py validate --input-file "${DECOMPOSITION_FILE}"
          echo "Decomposition validated successfully."

          # Compute waves for logging
          python3 scripts/orchestrate_lib.py compute-waves --input-file "${DECOMPOSITION_FILE}"

      - name: Ensure orchestrator labels exist
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          # The consumer repo may not have the ai:orchestrator-tracking label yet.
          # gh issue create --label fails if the label does not exist, so create it
          # idempotently first.
          gh_retry gh label create "ai:orchestrator-tracking" \
            --repo "${{ github.repository }}" \
            --color "a2eeef" \
            --description "Orchestrator project tracking issue" \
            2>/dev/null || true
          # Ensure the ai:clarification label exists so Wave 1 issues can
          # be labelled at creation time (prevents reliance on clarify.yml
          # auto-triggering via issues.opened event).
          gh_retry gh label create "ai:clarification" \
            --repo "${{ github.repository }}" \
            --color "f9d0c4" \
            --description "AI clarification required before planning" \
            2>/dev/null || true
          gh_retry gh label create "ai:orchestrator-managed" \
            --repo "${{ github.repository }}" \
            --color "bfdadc" \
            --description "Issue is managed by the AI orchestrator" \
            2>/dev/null || true
          gh_retry gh label create "ai:orchestrator-validate-required" \
            --repo "${{ github.repository }}" \
            --color "c5def5" \
            --description "Orchestrator issue requires validate phase before completion" \
            2>/dev/null || true

      - name: Create tracking issue
        id: tracking_issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true

          # Build tracking issue body
          python3 scripts/orchestrate_lib.py build-tracking-body \
            --input-file "${DECOMPOSITION_FILE}" > "${TRACKING_BODY_FILE}"

          PROJECT_TITLE="$(jq -r '.project_title' "${DECOMPOSITION_FILE}")"

          TRACKING_ISSUE_URL="$(gh_retry gh issue create \
            --repo "${{ github.repository }}" \
            --title "[Orchestrator] ${PROJECT_TITLE}" \
            --body-file "${TRACKING_BODY_FILE}" \
            --label "ai:orchestrator-tracking")"

          TRACKING_ISSUE_NUMBER="$(echo "${TRACKING_ISSUE_URL}" | grep -oE '[0-9]+$')"

          echo "Created tracking issue #${TRACKING_ISSUE_NUMBER}: ${TRACKING_ISSUE_URL}"
          {
            echo "tracking_issue_number=${TRACKING_ISSUE_NUMBER}"
            echo "tracking_issue_url=${TRACKING_ISSUE_URL}"
          } >> "$GITHUB_OUTPUT"
          echo "TRACKING_ISSUE_NUMBER=${TRACKING_ISSUE_NUMBER}" >> "$GITHUB_ENV"

      - name: Create integration branch
        id: integration_branch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE_NUMBER: ${{ steps.tracking_issue.outputs.tracking_issue_number }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          type _safe_gh_jq >/dev/null 2>&1 || _safe_gh_jq() { gh api "$@"; }

          DEFAULT_BRANCH="$(gh_retry _safe_gh_jq "repos/${{ github.repository }}" --jq '.default_branch')"
          DEFAULT_BRANCH_REF="$(printf '%s' "${DEFAULT_BRANCH}" | jq -sRr @uri)"
          INTEGRATION_BRANCH="orchestrator/project-${TRACKING_ISSUE_NUMBER}"
          INTEGRATION_BRANCH_REF="$(printf '%s' "${INTEGRATION_BRANCH}" | jq -sRr @uri)"

          if gh_retry gh api "repos/${{ github.repository }}/git/ref/heads/${INTEGRATION_BRANCH_REF}" >/dev/null 2>&1; then
            echo "Integration branch already exists: ${INTEGRATION_BRANCH}"
          else
            BASE_SHA="$(gh_retry _safe_gh_jq "repos/${{ github.repository }}/git/ref/heads/${DEFAULT_BRANCH_REF}" --jq '.object.sha')"
            gh_retry gh api "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/heads/${INTEGRATION_BRANCH}" \
              -f sha="${BASE_SHA}" >/dev/null
            echo "Created integration branch ${INTEGRATION_BRANCH} from ${DEFAULT_BRANCH}@${BASE_SHA}"
          fi

          python3 scripts/orchestrate_lib.py build-tracking-body \
            --input-file "${DECOMPOSITION_FILE}" \
            --integration-branch "${INTEGRATION_BRANCH}" > "${TRACKING_BODY_FILE}"

          gh_retry gh issue edit "${TRACKING_ISSUE_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body-file "${TRACKING_BODY_FILE}" >/dev/null

          {
            echo "integration_branch=${INTEGRATION_BRANCH}"
            echo "default_branch=${DEFAULT_BRANCH}"
          } >> "$GITHUB_OUTPUT"
          echo "INTEGRATION_BRANCH=${INTEGRATION_BRANCH}" >> "$GITHUB_ENV"

      - name: Create Wave 1 issues only
        id: create_issues
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE_NUMBER: ${{ steps.tracking_issue.outputs.tracking_issue_number }}
          INTEGRATION_BRANCH: ${{ steps.integration_branch.outputs.integration_branch }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true

          # Only create Wave 1 issues now. Later-wave issues are created by the
          # poller when their dependencies are met (deferred creation). This
          # ensures clarify.yml fires on issues.opened at the right time.
          WAVE1_IDS="$(python3 -c "
          import json, sys
          sys.path.insert(0, 'scripts')
          from orchestrate_lib import validate_decomposition, compute_waves

          with open('${DECOMPOSITION_FILE}') as f:
              data = json.load(f)

          validate_decomposition(data)
          waves = compute_waves(data)
          for issue in waves[0]:
              print(issue['id'])
          ")"

          echo "Wave 1 issue IDs: ${WAVE1_IDS}"

          # Build a map of local_id -> github_issue_number (Wave 1 only)
          declare -A ISSUE_MAP

          ISSUE_COUNT="$(jq '.issues | length' "${DECOMPOSITION_FILE}")"
          for idx in $(seq 0 $(( ISSUE_COUNT - 1 ))); do
            LOCAL_ID="$(jq -r ".issues[${idx}].id" "${DECOMPOSITION_FILE}")"

            # Skip issues not in Wave 1
            if ! echo "${WAVE1_IDS}" | grep -qxF "${LOCAL_ID}"; then
              echo "  Deferring ${LOCAL_ID} (not in Wave 1)"
              continue
            fi

            TITLE="$(jq -r ".issues[${idx}].title" "${DECOMPOSITION_FILE}")"
            BODY="$(jq -r ".issues[${idx}].body" "${DECOMPOSITION_FILE}" | sed 's/\\n/\n/g')"
            PRIORITY="$(jq -r ".issues[${idx}].priority" "${DECOMPOSITION_FILE}")"

            # Append orchestrator metadata to body
            FULL_BODY="$(cat <<EOF
          ${BODY}

          ---
          **Orchestrator metadata** (do not edit)
          - Tracking issue: #${TRACKING_ISSUE_NUMBER}
          - Integration branch: ${INTEGRATION_BRANCH}
          - Local ID: \`${LOCAL_ID}\`
          - Priority: ${PRIORITY}
          - Managed by: AI Orchestrator
          EOF
          )"

            ISSUE_URL="$(gh_retry gh issue create \
              --repo "${{ github.repository }}" \
              --title "${TITLE}" \
              --body "${FULL_BODY}" \
              --label "ai:clarification" \
              --label "ai:orchestrator-managed")"

            ISSUE_NUM="$(echo "${ISSUE_URL}" | grep -oE '[0-9]+$')"
            ISSUE_MAP["${LOCAL_ID}"]="${ISSUE_NUM}"
            echo "  Created #${ISSUE_NUM}: ${TITLE} (${LOCAL_ID})"
          done

          # Write issue map as JSON for state tracking
          MAP_JSON="{"
          first=true
          for key in "${!ISSUE_MAP[@]}"; do
            if [ "${first}" = true ]; then
              first=false
            else
              MAP_JSON+=","
            fi
            MAP_JSON+="\"${key}\":${ISSUE_MAP[${key}]}"
          done
          MAP_JSON+="}"
          echo "${MAP_JSON}" | jq '.' > "${RUNTIME_DIR}/issue_map.json"
          echo "Issue map (Wave 1 only): $(cat "${RUNTIME_DIR}/issue_map.json")"

      - name: Build and post initial state
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE_NUMBER: ${{ steps.tracking_issue.outputs.tracking_issue_number }}
          INTEGRATION_BRANCH: ${{ steps.integration_branch.outputs.integration_branch }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true

          # Build state using Python helper
          python3 -c "
          import json

          with open('${DECOMPOSITION_FILE}') as f:
              data = json.load(f)

          with open('${RUNTIME_DIR}/issue_map.json') as f:
              issue_map_raw = json.load(f)

          # Convert string values to ints
          issue_map = {k: int(v) for k, v in issue_map_raw.items()}

          # Import the library
          import sys
          sys.path.insert(0, 'scripts')
          from orchestrate_lib import validate_decomposition, compute_waves, build_tracking_state

          validate_decomposition(data)
          waves = compute_waves(data)
          state = build_tracking_state(data, waves, issue_map, integration_branch='${INTEGRATION_BRANCH}')
          state['tracking_issue'] = int('${TRACKING_ISSUE_NUMBER}')

          with open('${STATE_FILE}', 'w') as f:
              json.dump(state, f, indent=2)
          "

          # Post state as a hidden comment on the tracking issue for the poller
          STATE_COMMENT="$(cat <<EOF
          <!-- ORCHESTRATOR_STATE_V1
          $(cat "${STATE_FILE}")
          ORCHESTRATOR_STATE_V1 -->
          EOF
          )"

          jq -n --arg body "${STATE_COMMENT}" '{"body": $body}' \
            | gh_retry gh api "repos/${{ github.repository }}/issues/${TRACKING_ISSUE_NUMBER}/comments" \
                --input - >/dev/null
          echo "Posted initial state to tracking issue #${TRACKING_ISSUE_NUMBER}"

      - name: Record decomposition candidate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
          TRACKING_ISSUE_NUMBER: ${{ steps.tracking_issue.outputs.tracking_issue_number }}
        run: |
          set -euo pipefail
          if ! source scripts/memory_helpers.sh; then
            echo "::warning::Unable to source scripts/memory_helpers.sh; skipping decomposition candidate memory record"
            exit 0
          fi

          ISSUE_COUNT="$(jq '.issues | length' "${DECOMPOSITION_FILE}" 2>/dev/null || echo 0)"
          PROJECT_TITLE="$(jq -r '.project_title' "${DECOMPOSITION_FILE}" 2>/dev/null || echo "unknown")"
          if DETAILS_JSON="$(jq -c '{project_title: .project_title, issues: [.issues[] | {id, title, priority}], dependency_edges}' "${DECOMPOSITION_FILE}" 2>/dev/null)"; then
            DETAILS="${DETAILS_JSON:0:12000}"
          else
            DETAILS='{"project_title":"unknown","issues":[],"dependency_edges":[]}'
          fi

          memory_record_candidate \
            --category "decisions" \
            --summary "Decomposed project '${PROJECT_TITLE}' into ${ISSUE_COUNT} issues (tracking #${TRACKING_ISSUE_NUMBER})" \
            --details "${DETAILS}" \
            --confidence "0.80" \
            --workflow "orchestrate" \
            --run-id "${{ github.run_id }}" \
            --actor "${{ github.actor }}" \
            --issue-number "${TRACKING_ISSUE_NUMBER}"

      - name: Dispatch Wave 1
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE_NUMBER: ${{ steps.tracking_issue.outputs.tracking_issue_number }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true

          # Get wave 1 issues from state
          WAVE1_ISSUES="$(python3 scripts/orchestrate_lib.py next-wave --state-file "${STATE_FILE}")"
          echo "Wave 1 dispatch: ${WAVE1_ISSUES}"

          ACTION="$(echo "${WAVE1_ISSUES}" | jq -r '.action')"
          if [ "${ACTION}" != "dispatch" ]; then
            echo "::warning::No issues to dispatch (action=${ACTION})"
            exit 0
          fi

          # The existing pipeline triggers on issue creation (clarify.yml).
          # Issues were just created above, so clarify.yml should fire automatically.
          # Log what we expect to happen.
          echo "${WAVE1_ISSUES}" | jq -r '.issues[] | "  Issue #\(.github_issue) (\(.id)) — awaiting clarify pipeline"'

          # Post wave dispatch status to tracking issue
          WAVE1_COMMENT="## Wave 1 Dispatched

          The following issues have been created and are entering the AI pipeline:

          $(echo "${WAVE1_ISSUES}" | jq -r '.issues[] | "- #\(.github_issue) (`\(.id)`)"')

          The orchestrator poller will monitor progress and dispatch subsequent waves when dependencies are met."

          jq -n --arg body "${WAVE1_COMMENT}" '{"body": $body}' \
            | gh_retry gh api "repos/${{ github.repository }}/issues/${TRACKING_ISSUE_NUMBER}/comments" \
                --input - >/dev/null

      - name: Write run summary
        if: always()
        env:
          TOKEN_WARN_THRESHOLD: ${{ vars.TOKEN_WARN_THRESHOLD_ORCHESTRATE || '200000' }}
        run: |
          set -euo pipefail
          : "${RUNTIME_DIR:=/tmp/codex-orchestrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          : "${DECOMPOSITION_FILE:=${RUNTIME_DIR}/decomposition.json}"
          : "${TRACKING_ISSUE_NUMBER:=0}"
          TOKENS=""
          if [ -f "${RUNTIME_DIR}/codex_log.txt" ]; then
            TOKENS="$(grep -A1 'tokens used' "${RUNTIME_DIR}/codex_log.txt" | tail -1 | tr -d '[:space:]' || true)"
          fi
          ISSUE_COUNT="0"
          WAVE_COUNT="0"
          if [ -f "${DECOMPOSITION_FILE}" ]; then
            ISSUE_COUNT="$(jq '.issues | length' "${DECOMPOSITION_FILE}" 2>/dev/null || echo 0)"
            WAVE_COUNT="$(jq '.dependency_edges | length' "${DECOMPOSITION_FILE}" 2>/dev/null || echo 0)"
          fi
          {
            echo "## AI Orchestrate Summary"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Model | \`${MODEL_EDITOR}\` |"
            echo "| Reasoning | \`${MODEL_REASONING_EFFORT}\` |"
            if [ -n "${TOKENS}" ]; then
              echo "| Tokens used | ${TOKENS} |"
              TOKENS_NUM="${TOKENS//,/}"
              if [ "${TOKENS_NUM}" -gt "${TOKEN_WARN_THRESHOLD}" ] 2>/dev/null; then
                echo "| :warning: Token alert | Above ${TOKEN_WARN_THRESHOLD} threshold |"
              fi
            fi
            echo "| Issues created | ${ISSUE_COUNT} |"
            if [ -n "${TRACKING_ISSUE_NUMBER:-}" ]; then
              echo "| Tracking issue | #${TRACKING_ISSUE_NUMBER} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record orchestration run end
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
          TRACKING_ISSUE_NUMBER: ${{ steps.tracking_issue.outputs.tracking_issue_number }}
        run: |
          set -euo pipefail
          : "${RUNTIME_DIR:=/tmp/codex-orchestrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          : "${DECOMPOSITION_FILE:=${RUNTIME_DIR}/decomposition.json}"
          : "${TRACKING_ISSUE_NUMBER:=0}"

          if [ ! -f "scripts/memory_helpers.sh" ]; then
            echo "::warning::scripts/memory_helpers.sh not found; skipping orchestration end memory record"
            exit 0
          fi

          source scripts/memory_helpers.sh

          JOB_STATUS="${{ job.status }}"
          EVENT_TYPE="orchestration_failed"
          EVENT_STATUS="error"
          EVENT_MESSAGE="Orchestration failed (${JOB_STATUS})"

          if [ "${JOB_STATUS}" = "success" ]; then
            EVENT_TYPE="orchestration_completed"
            EVENT_STATUS="ok"
            EVENT_MESSAGE="Orchestration completed"
          fi

          ARGS=(
            --run-id "${{ github.run_id }}"
            --workflow "orchestrate"
            --event-type "${EVENT_TYPE}"
            --status "${EVENT_STATUS}"
            --message "${EVENT_MESSAGE}"
            --actor "${{ github.actor }}"
          )

          if [ -n "${TRACKING_ISSUE_NUMBER:-}" ] && [ "${TRACKING_ISSUE_NUMBER}" != "0" ]; then
            ARGS+=(--issue-number "${TRACKING_ISSUE_NUMBER}")
          fi

          memory_record_run_event "${ARGS[@]}"

      - name: Notify via Telegram
        if: always()
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID || '' }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE_NUMBER: ${{ steps.tracking_issue.outputs.tracking_issue_number }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
        run: |
          set -euo pipefail
          : "${RUNTIME_DIR:=/tmp/codex-orchestrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          : "${DECOMPOSITION_FILE:=${RUNTIME_DIR}/decomposition.json}"
          : "${TRACKING_ISSUE_NUMBER:=0}"
          source scripts/tg_helpers.sh

          STATUS="${{ job.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TRACKING_URL=""
          if [ -n "${TRACKING_ISSUE_NUMBER:-}" ] && [ "${TRACKING_ISSUE_NUMBER}" != "0" ]; then
            TRACKING_URL="${{ github.server_url }}/${{ github.repository }}/issues/${TRACKING_ISSUE_NUMBER}"
          fi
          ISSUE_COUNT="0"
          if [ -f "${DECOMPOSITION_FILE}" ]; then
            ISSUE_COUNT="$(jq '.issues | length' "${DECOMPOSITION_FILE}" 2>/dev/null || echo 0)"
          fi
          if [ "${STATUS}" = "success" ]; then
            MSG="Orchestrator: Decomposed project into ${ISSUE_COUNT} issues."
            LEVEL="DEBUG"
            if [ -n "${TRACKING_URL}" ]; then
              MSG+=$'\n'
              MSG+="Tracking: ${TRACKING_URL}"
            fi
          else
            MSG="Orchestrator: Failed (${STATUS})."
            LEVEL="ERROR"
            if [ -n "${TRACKING_ISSUE_NUMBER:-}" ] && [ "${TRACKING_ISSUE_NUMBER}" != "0" ]; then
              MSG+=$'\n'
              MSG+="Issue: ${TRACKING_URL}"
            fi
          fi
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_tracked "${TRACKING_ISSUE_NUMBER:-0}" "${MSG}" "${LEVEL}"

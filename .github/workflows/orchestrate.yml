---
name: AI Orchestrate (Reusable)

"on":
  workflow_call:
    inputs:
      project_description:
        description: >
          Full project description. The orchestrator will clarify scope,
          decompose into issues with a dependency DAG, create the tracking
          issue and child issues, and kick off Wave 1.
        required: true
        type: string
    secrets:
      GH_PAT:
        required: true
      OPENROUTER_API_KEY:
        required: true
      TG_BOT_SECRET:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MODEL_EDITOR: ${{ vars.WORKFLOW_ORCHESTRATE_MODEL || vars.WORKFLOW_EDITOR_MODEL || 'openai/gpt-5.6-sol' }}
  # Defaults to xhigh to match the repo-wide gpt-5.6-sol reasoning-level
  # policy. Override per-repo via vars.THINKING_LEVEL_ORCHESTRATE.
  MODEL_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_ORCHESTRATE || 'xhigh' }}
  # gpt-5.6-sol paths default to low verbosity per agents.md model table.
  # Output is structured JSON (`orchestrate_decomposition.v1` schema), which
  # is not verbosity-sensitive — the schema controls shape regardless. Low
  # keeps free-form text in `project_summary` / issue bodies concise and
  # information-dense per the OpenAI prompt guide.
  MODEL_VERBOSITY: ${{ vars.VERBOSITY_ORCHESTRATE || 'low' }}
  OPENROUTER_PROMPT_CACHE_DISABLED: ${{ vars.OPENROUTER_PROMPT_CACHE_DISABLED || 'false' }}
  MEMORY_INJECTION_SCAN_ENABLED: ${{ vars.MEMORY_INJECTION_SCAN_ENABLED || 'true' }}
  SEMBLE_ENABLED: ${{ vars.SEMBLE_ENABLED || 'true' }}
  ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS: ${{ vars.ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS || '' }}

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    # Raised from 60 → 240 min after run 25742821278 was SIGKILLed at
    # the 60-min cap while still inside attempt 1/3 of the decomposer
    # codex call, making the 3-attempt retry loop structurally
    # meaningless. The new ceiling pairs with the per-attempt timeout
    # wrapper added to the decomposer step below
    # (ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS, default 3000s
    # = 50 min): 3 × 50 min = 150 min for codex attempts, plus
    # ~90 min headroom for prompt assembly, JSON validation,
    # tracking-issue / branch / Wave-1 setup, and post steps.
    timeout-minutes: 240
    concurrency:
      group: ai-orchestrate-${{ github.repository }}-${{ github.run_id }}
      cancel-in-progress: false
    env:
      ORCHESTRATE_POLL_INTERVAL: ${{ vars.ORCHESTRATE_POLL_INTERVAL || '5' }}

    steps:
      - name: Log trigger context
        env:
          PROJECT_DESCRIPTION: ${{ inputs.project_description }}
        run: |
          echo "Orchestrate workflow triggered"
          echo "Run ID: ${{ github.run_id }}"
          echo "Model: ${MODEL_EDITOR}"
          echo "Reasoning: ${MODEL_REASONING_EFFORT}"
          # The test-and-mark-stable gate's orchestrate-decompose-test step
          # dispatches this workflow with a project_description prefixed
          # `[E2E Orchestrate Smoke <run_id>]`; suppress per-phase Telegram
          # alerts so the gate's combined pass/fail message is the only
          # notification. SILENT > CRITICAL so all callers' levels filter.
          if printf '%s' "${PROJECT_DESCRIPTION}" | grep -qiE '\[E2E (Orchestrate )?Smoke'; then
            echo "🔬 Smoke orchestrate detected — suppressing per-phase Telegram alerts"
            echo "ALERT_MSG_LEVEL=SILENT" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # ALLOWLIST(checkout-integration-ref-audit): orchestrate bootstrap
          # has no tracking-issue integration metadata before checkout.
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Configure git auth for memory helper clones
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_PAT is empty"; exit 1; }
          SERVER_HOST="${GITHUB_SERVER_URL#https://}"
          SERVER_HOST="${SERVER_HOST#http://}"
          SERVER_HOST="${SERVER_HOST%/}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Codex CLI
        # Intentionally use the released action ref as the rollout boundary.
        # Consumers pick this up when test-and-mark-stable retags @stable.
        uses: shubhodeep1/coding-workflows/.github/actions/install-codex@stable
        with:
          codex_version: ${{ vars.CODEX_VERSION || 'v0.114.0' }}

      - name: Install OS-level core tools
        shell: bash
        run: |
          set -euo pipefail

          missing_tools=()
          for tool in jq curl gh; do
            command -v "$tool" >/dev/null 2>&1 || missing_tools+=("$tool")
          done

          if [ "${#missing_tools[@]}" -gt 0 ]; then
            if ! command -v apt-get >/dev/null 2>&1; then
              echo "Missing tools (${missing_tools[*]}), but apt-get is unavailable on this runner" >&2
              exit 1
            fi

            apt_cmd=(apt-get)
            if command -v sudo >/dev/null 2>&1; then
              apt_cmd=(sudo apt-get)
            elif [ "$(id -u)" -ne 0 ]; then
              echo "Missing tools (${missing_tools[*]}), but sudo is unavailable and the current user is not root" >&2
              exit 1
            fi

            "${apt_cmd[@]}" update
            if ! "${apt_cmd[@]}" install -y "${missing_tools[@]}"; then
              echo "apt-get install failed for: ${missing_tools[*]}" >&2
              exit 1
            fi
          fi

          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"

      - name: Validate required environment variables
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "Missing required environment variables: OPENROUTER_API_KEY" >&2
            exit 1
          fi

      - name: Resolve workflow support ref for run-start
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            echo "SCRIPT_REF=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "SCRIPT_REF=stable" >> "$GITHUB_ENV"
          fi

      - name: Checkout workflow support source for run-start
        id: checkout_support_source_run_start
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ env.SCRIPT_REF }}
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Checkout workflow support source fallback for run-start
        if: ${{ steps.checkout_support_source_run_start.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Checkout workflow support source main snapshot for run-start
        if: ${{ env.SCRIPT_REF != 'main' }}
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src-main
          fetch-depth: 1

      - name: Stage workflow memory support files for run-start
        run: |
          set -euo pipefail

          if [ ! -d .codex-workflow-src ]; then
            echo "::warning::Support source checkout unavailable before run-start memory event"
            exit 0
          fi

          wf_source="shubhodeep1/coding-workflows"
          mkdir -p scripts
          _fetched_scripts=()
          for f in gh_helpers.sh memory_helpers.sh ai_memory.py ai_memory_lib.py memory_injection_patterns.py openrouter_prompt_cache.py; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::warning::Missing required run-start support script ${f}; run-start memory event may be skipped"
              continue
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")
          done

          if [ "${{ github.repository }}" != "${wf_source}" ] && [ "${#_fetched_scripts[@]}" -gt 0 ]; then
            {
              echo "# Auto-generated by coding-workflows — DO NOT EDIT"
              echo "# Prevents runtime-fetched support scripts from being committed."
              printf '%s\n' "${_fetched_scripts[@]}" .gitignore
            } > scripts/.gitignore
          fi

          mkdir -p ai-memory/schemas
          for sf in memory_record.v1.json processed_command_entry.v1.json run_ledger_entry.v1.json task_lineage.v1.json actions_runs_cache.v1.json workflow_log_analysis_cache.v1.json validation_history.v1.json operator_bypass_audit.v1.json revalidate_events.v1.json validation_discovery.v1.json; do
            src=".codex-workflow-src/ai-memory/schemas/${sf}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/ai-memory/schemas/${sf}" ]; then
              src=".codex-workflow-src-main/ai-memory/schemas/${sf}"
            fi
            if [ ! -f "ai-memory/schemas/${sf}" ] && [ -f "${src}" ]; then
              install -m 0644 "${src}" "ai-memory/schemas/${sf}"
            fi
          done

          rm -rf .codex-workflow-src-main

      - name: Record orchestration run start
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          if [ ! -f "scripts/memory_helpers.sh" ] || [ ! -f "scripts/ai_memory.py" ] || [ ! -f "scripts/ai_memory_lib.py" ]; then
            echo "::warning::Required memory helper scripts unavailable; skipping orchestration start memory event"
            exit 0
          fi

          source scripts/memory_helpers.sh
          if ! declare -F memory_ensure_branch >/dev/null 2>&1; then
            echo "::warning::memory_ensure_branch not defined after sourcing scripts/memory_helpers.sh; using no-op stub"
            memory_ensure_branch() { return 0; }
          fi
          memory_ensure_branch

          memory_record_run_event \
            --run-id "${{ github.run_id }}" \
            --workflow "orchestrate" \
            --event-type "orchestration_started" \
            --status "ok" \
            --message "Orchestration started for ${{ github.repository }}" \
            --actor "${{ github.actor }}"

      - name: Create runtime workspace
        run: |
          set -euo pipefail
          RUNTIME_DIR="/tmp/codex-orchestrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${RUNTIME_DIR}"
          {
            echo "RUNTIME_DIR=${RUNTIME_DIR}"
            echo "DECOMPOSITION_FILE=${RUNTIME_DIR}/decomposition.json"
            echo "CODEX_PROMPT_FILE=${RUNTIME_DIR}/codex_prompt.txt"
            echo "CODEX_OUTPUT_FILE=${RUNTIME_DIR}/codex_output.txt"
            echo "TRACKING_BODY_FILE=${RUNTIME_DIR}/tracking_body.md"
            echo "STATE_FILE=${RUNTIME_DIR}/state.json"
            echo "SEMBLE_AVAILABLE=false"
            echo "SEMBLE_INDEX_PATH=${RUNTIME_DIR}/.semble-index"
            echo "SEMBLE_INDEX_AVAILABLE=false"
          } >> "$GITHUB_ENV"

      - name: Resolve workflow support ref
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            echo "SCRIPT_REF=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "SCRIPT_REF=stable" >> "$GITHUB_ENV"
          fi

      - name: Checkout workflow support source
        id: checkout_support_source
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ env.SCRIPT_REF }}
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Checkout workflow support source fallback
        if: ${{ steps.checkout_support_source.outcome == 'failure' }}
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Ensure workflow support source checkout
        run: |
          set -euo pipefail
          if [ ! -d .codex-workflow-src ]; then
            echo "::error::Failed to checkout workflow support source from ${SCRIPT_REF} or main"
            exit 1
          fi

      - name: Checkout workflow support source main snapshot
        if: ${{ env.SCRIPT_REF != 'main' }}
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src-main
          fetch-depth: 1

      - name: Stage workflow support files
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          mkdir -p scripts
          _fetched_scripts=()
          for f in gh_helpers.sh label_helpers.sh git_ref_health_check.sh orchestrate_lib.py render_prompt.sh assemble_prompt.sh render_prompt.py load_workflow_overlay.py tg_helpers.sh memory_helpers.sh ai_memory.py ai_memory_lib.py memory_injection_patterns.py openrouter_prompt_cache.py install_semble.sh build_semble_wrapper.sh write_codex_config.sh; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::error::Missing required support script ${f} in ${wf_source}@${SCRIPT_REF}"
              exit 1
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")
          done

          # render_prompt.py is the optional Python backend for the
          # render_prompt.sh shim adopted by branches that took the issue
          # #3043 refactor.  main ships a self-contained bash render_prompt.sh
          # that needs no backend, so the file is absent on main and must be
          # staged only when the branch under processing actually carries it.
          # Absence is expected (non-shim branches, incl. main) and must not
          # fail the bootstrap; presence stages it beside the shim so the
          # shim resolves ${SCRIPT_DIR}/render_prompt.py.
          for f in render_prompt.py; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::notice::Optional render_prompt.py backend unavailable on ${SCRIPT_REF}; render_prompt.sh shim (if present) resolves it elsewhere or the bundled bash renderer is used."
              continue
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")
          done

          mkdir -p ai-memory/schemas
          for sf in memory_record.v1.json processed_command_entry.v1.json run_ledger_entry.v1.json task_lineage.v1.json actions_runs_cache.v1.json workflow_log_analysis_cache.v1.json validation_history.v1.json operator_bypass_audit.v1.json revalidate_events.v1.json validation_discovery.v1.json workflow_overlay.v1.json; do
            src=".codex-workflow-src/ai-memory/schemas/${sf}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/ai-memory/schemas/${sf}" ]; then
              src=".codex-workflow-src-main/ai-memory/schemas/${sf}"
            fi
            if [ ! -f "ai-memory/schemas/${sf}" ] && [ -f "${src}" ]; then
              install -m 0644 "${src}" "ai-memory/schemas/${sf}"
            fi
          done

          # WORKFLOW.md overlay is opt-in by file presence; absent file must
          # stay a no-op while valid prompt overrides flow through render_prompt.py.
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/load_workflow_overlay.py \
            --repo-root "${GITHUB_WORKSPACE}" \
            --schema-path "ai-memory/schemas/workflow_overlay.v1.json" \
            --github-env "${GITHUB_ENV}"

          echo "PROMPT_PRELUDE_REFACTOR_ENABLED=${{ vars.PROMPT_PRELUDE_REFACTOR_ENABLED || 'false' }}" >> "$GITHUB_ENV"
          echo "UNATTENDED_IDENTITY_REINJECT_ENABLED=${{ vars.UNATTENDED_IDENTITY_REINJECT_ENABLED || 'false' }}" >> "$GITHUB_ENV"

          mkdir -p prompts prompts/_templates
          prompt_src=".codex-workflow-src/prompts/mode-orchestrate.txt"
          if [ ! -f "${prompt_src}" ] && [ -f ".codex-workflow-src-main/prompts/mode-orchestrate.txt" ]; then
            prompt_src=".codex-workflow-src-main/prompts/mode-orchestrate.txt"
          fi
          if [ ! -f "${prompt_src}" ]; then
            echo "::error::Missing required support file prompts/mode-orchestrate.txt"
            exit 1
          fi
          install -m 0644 "${prompt_src}" prompts/mode-orchestrate.txt

          for prompt_assembly_asset in _identity_recall.txt _prelude_common.txt _prelude_role_persona.txt _prelude_output_contract.txt _templates/mode-orchestrate.txt; do
            asset_src=".codex-workflow-src/prompts/${prompt_assembly_asset}"
            if [ ! -f "${asset_src}" ] && [ -f ".codex-workflow-src-main/prompts/${prompt_assembly_asset}" ]; then
              asset_src=".codex-workflow-src-main/prompts/${prompt_assembly_asset}"
            fi
            if [ ! -f "${asset_src}" ]; then
              echo "::error::Missing required support file prompts/${prompt_assembly_asset}"
              exit 1
            fi
            install -m 0644 "${asset_src}" "prompts/${prompt_assembly_asset}"
          done

          mkdir -p .github/ai
          schema_src=".codex-workflow-src/.github/ai/orchestrate_schema.v1.json"
          if [ ! -f "${schema_src}" ] && [ -f ".codex-workflow-src-main/.github/ai/orchestrate_schema.v1.json" ]; then
            schema_src=".codex-workflow-src-main/.github/ai/orchestrate_schema.v1.json"
          fi
          if [ ! -f "${schema_src}" ]; then
            echo "::error::Missing required support file .github/ai/orchestrate_schema.v1.json"
            exit 1
          fi
          install -m 0644 "${schema_src}" .github/ai/orchestrate_schema.v1.json

          catalog_src=".codex-workflow-src/scripts/codex_model_catalog.json"
          if [ ! -f "${catalog_src}" ] && [ -f ".codex-workflow-src-main/scripts/codex_model_catalog.json" ]; then
            catalog_src=".codex-workflow-src-main/scripts/codex_model_catalog.json"
          fi
          if [ -f "${catalog_src}" ]; then
            install -m 0644 "${catalog_src}" scripts/codex_model_catalog.json
            _fetched_scripts+=(codex_model_catalog.json)
          else
            echo "Model catalog not on ${SCRIPT_REF} yet; using local copy."
          fi

          if [ "${{ github.repository }}" != "${wf_source}" ]; then
            {
              echo "# Auto-generated by coding-workflows — DO NOT EDIT"
              echo "# Prevents runtime-fetched support scripts from being committed."
              printf '%s\n' "${_fetched_scripts[@]}" .gitignore
            } > scripts/.gitignore
          fi

          for f in unattended_system_instructions.md ai_pipeline.md; do
            if [ ! -f "${f}" ]; then
              src=".codex-workflow-src/${f}"
              if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/${f}" ]; then
                src=".codex-workflow-src-main/${f}"
              fi
              if [ ! -f "${src}" ]; then
                echo "::error::Failed to stage required file ${f}"
                exit 1
              fi
              install -m 0644 "${src}" "${f}"
            fi
          done

          rm -rf .codex-workflow-src-main

      - name: Setup uv
        if: env.SEMBLE_ENABLED == 'true'
        continue-on-error: true
        uses: astral-sh/setup-uv@v7

      - name: Install semble
        if: env.SEMBLE_ENABLED == 'true'
        # Defense-in-depth: install_semble.sh is fail-soft already (writes
        # SEMBLE_AVAILABLE=false on any error), but the step-level guard
        # ensures a syntax regression / filesystem error / missing-script
        # condition still degrades to SEMBLE_AVAILABLE=false instead of
        # hard-failing under set -euo pipefail.
        continue-on-error: true
        run: |
          set -euo pipefail
          bash scripts/install_semble.sh

      - name: Build semble index
        if: env.SEMBLE_ENABLED == 'true'
        # Defense-in-depth: the shared script is fail-soft already, but the
        # step-level guard ensures a future wrapper regression still
        # degrades to SEMBLE_INDEX_AVAILABLE=false instead of hard-failing.
        continue-on-error: true
        run: |
          set -euo pipefail
          : "${SEMBLE_INDEX_PATH:?SEMBLE_INDEX_PATH is required}"
          # Shared BM25 wrapper builder — see scripts/build_semble_wrapper.sh
          # for the rationale (semble 0.1.3 lacks the index/query CLI).
          # Fail-soft: writes SEMBLE_INDEX_AVAILABLE=false on any error and
          # exits 0; missing-script case is handled the same way.
          if [ -f scripts/build_semble_wrapper.sh ]; then
            bash scripts/build_semble_wrapper.sh
          else
            echo "::notice::scripts/build_semble_wrapper.sh not staged; continuing without Semble index."
            echo "SEMBLE_INDEX_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Create Codex config
        run: |
          set -euo pipefail
          # Centralised in scripts/write_codex_config.sh — see that
          # script's header for the apply_patch / trust / elevation
          # rationale.
          bash scripts/write_codex_config.sh \
            --model "${MODEL_EDITOR}" \
            --reasoning "${MODEL_REASONING_EFFORT}"
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

      - name: Pre-assemble static context
        run: |
          set -euo pipefail

          {
            echo "=== SYSTEM INSTRUCTIONS ==="
            cat unattended_system_instructions.md
            echo
            echo "=== AI PIPELINE ==="
            cat ai_pipeline.md
            echo
            if [ -f agents.md ]; then
              echo "=== AGENTS.MD ==="
              cat agents.md
              echo
            fi
            if [ -f README.md ]; then
              echo "=== README.MD ==="
              cat README.md
              echo
            fi
            if [ -f probably_unnecessary_but_read_if_stuck.md ]; then
              echo "=== OVERFLOW REFERENCE ==="
              echo "If you cannot make progress without operator-runbook details (env var reference, autofix retrigger/dedup internals, orchestrator integration-sync auto-heal, validation self-healing, workflow log analysis pipeline, semantic cache scope, wrapper pin policy), read ./probably_unnecessary_but_read_if_stuck.md from the working tree before bailing."
              echo
            fi
          } > ./pre_assembled_static.txt

          STATIC_LINES="$(wc -l < ./pre_assembled_static.txt)"
          STATIC_BYTES="$(wc -c < ./pre_assembled_static.txt)"
          echo "Static context assembled: ${STATIC_LINES} lines, ${STATIC_BYTES} bytes"

      - name: Retrieve memory context
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
          PROJECT_DESCRIPTION: ${{ inputs.project_description }}
        run: |
          set -euo pipefail
          if ! source scripts/memory_helpers.sh; then
            echo "::warning::Unable to source scripts/memory_helpers.sh; writing fallback memory context"
            printf 'AI MEMORY CONTEXT\nstatus: unavailable\n' > "${RUNTIME_DIR}/memory_context.txt"
            exit 0
          fi

          PROJECT_CONTEXT_FILE="${RUNTIME_DIR}/project_description.txt"
          printf '%s\n' "${PROJECT_DESCRIPTION}" > "${PROJECT_CONTEXT_FILE}"

          ISSUE_TITLE="$(head -n 1 "${PROJECT_CONTEXT_FILE}" | tr -d '\r' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          if [ -z "${ISSUE_TITLE}" ]; then
            ISSUE_TITLE="Orchestration request"
          fi
          ISSUE_TITLE="${ISSUE_TITLE:0:200}"

          memory_retrieve "${RUNTIME_DIR}/memory_context.txt" \
            --role "planning" \
            --issue-title "${ISSUE_TITLE}" \
            --issue-body-file "${PROJECT_CONTEXT_FILE}"

      - name: Build Codex prompt
        env:
          TOOL_CALL_BUDGET: ${{ vars.TOOL_CALL_BUDGET_ORCHESTRATE || '40' }}
          PROJECT_DESCRIPTION: ${{ inputs.project_description }}
        run: |
          set -euo pipefail

          {
            cat ./pre_assembled_static.txt
            echo
            echo "TOOL_CALL_BUDGET: ${TOOL_CALL_BUDGET}"
            echo
            echo "=== ORCHESTRATION TASK ==="
            echo
            bash scripts/render_prompt.sh prompts/mode-orchestrate.txt
            echo
            echo "=== AI MEMORY CONTEXT ==="
            if [ -f "${RUNTIME_DIR}/memory_context.txt" ]; then
              cat "${RUNTIME_DIR}/memory_context.txt"
            else
              echo "AI MEMORY CONTEXT"
              echo "status: unavailable"
            fi
            echo
            echo "=== DECOMPOSITION SCHEMA ==="
            echo
            cat .github/ai/orchestrate_schema.v1.json
            echo
            echo "=== PROJECT DESCRIPTION ==="
            echo
            printf '%s\n' "${PROJECT_DESCRIPTION}"
          } > "${CODEX_PROMPT_FILE}"

          echo "Prompt built: $(wc -l < "${CODEX_PROMPT_FILE}") lines, $(wc -c < "${CODEX_PROMPT_FILE}") bytes"

      - name: Run Codex (decomposer)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROJECT_DESCRIPTION: ${{ inputs.project_description }}
        run: |
          set -euo pipefail

          # Source sanitize_codex_prompt_file (best-effort). Codex
          # CLI's stdin reader strictly validates UTF-8; any invalid
          # byte that leaked into the prompt (e.g. via a byte-based
          # truncation in an upstream awk script) would abort the
          # decomposer immediately. Stripping invalid bytes before
          # piping is the cheapest insurance.
          # shellcheck source=/dev/null
          source scripts/gh_helpers.sh 2>/dev/null || true

          # Author-enumeration enforcement.
          #
          # When the project description explicitly enumerates sub-issues
          # with `Issue <N>:` structural markers — the same markers
          # documented in prompts/mode-orchestrate.txt under the
          # Author-supplied decomposition rule — the orchestrator MUST
          # emit at least that many issues. The LLM has historically
          # collapsed enumerated issues into a single one despite the
          # prompt rule, so this loop counts the markers and rejects any
          # response with fewer issues than the author enumerated, feeding
          # the actual vs. expected counts back into the next attempt's
          # prompt. Without enumerated markers EXPECTED_MIN_ISSUES
          # defaults to 1, so non-author-decomposed dispatches behave
          # exactly as before.
          #
          # Done in Python rather than `grep | awk | sort | tail` because
          # under `set -euo pipefail` a no-match grep would abort the
          # whole step (which is the common case for non-enumerated
          # dispatches) — Python's regex returns an empty list cleanly
          # and the `or 1` fallback handles it.
          EXPECTED_MIN_ISSUES="$(PROJECT_DESCRIPTION="${PROJECT_DESCRIPTION}" python3 - <<'PYEOF'
          import os, re
          text = os.environ.get("PROJECT_DESCRIPTION", "")
          # Accepted marker forms: case-insensitive `Issue`, optional
          # whitespace before the digits (so `Issue1:` is recognized
          # alongside `Issue 1:`), optional whitespace after the digits,
          # then `:` or `(` as the structural list-marker punctuation.
          # `:` and `(` are unambiguous list markers; `.` / `-` / `–` /
          # `—` were considered but rejected because they too easily
          # match casual mentions ("Issue 5 - last week", "Issue 1.").
          # The smoke test uses `Issue 1 (...)`, `Issue 2 (...)` so `(`
          # is essential.
          pattern = r"\bIssue\s*(\d+)\s*[:(]"
          matches = [int(m.group(1)) for m in re.finditer(pattern, text, re.IGNORECASE)]
          # Use the count of DISTINCT structural markers (not max(N)) so
          # a non-contiguous enumeration like `Issue 1:` + `Issue 3:`
          # demands 2 issues, not 3 phantom ones. Same value when the
          # author numbers contiguously from 1.
          print(len(set(matches)) if matches else 1)
          PYEOF
          )"
          echo "Author enumeration requires >= ${EXPECTED_MIN_ISSUES} issue(s)."

          # Snapshot the original prompt so retry feedback is appended to a
          # clean base each attempt rather than accumulating across attempts.
          BASE_PROMPT_FILE="${CODEX_PROMPT_FILE}.base"
          cp "${CODEX_PROMPT_FILE}" "${BASE_PROMPT_FILE}"

          max_attempts=3
          last_status="no attempts ran"
          last_emitted=0

          # Per-attempt cap so a runaway first attempt can't burn the
          # full 240-min job budget before retries get a turn. Default
          # 3000s (50 min) × 3 attempts = 150 min, leaving ~90 min for
          # prompt assembly, JSON validation, tracking-issue / branch /
          # Wave-1 setup, and post steps. Mirrors the conflict-resolver
          # pattern (scripts/review_conflict_resolve.sh —
          # CONFLICT_RESOLVER_PER_ATTEMPT_TIMEOUT_SECS) that closed the
          # same failure mode there. Default + validation + clamp run
          # ONCE before the retry loop so the value enforced by the
          # `timeout` wrapper is constant across iterations.
          : "${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS:=3000}"
          if ! [[ "${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::warning::ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS=${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS} is not a positive integer; falling back to 3000."
            ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS=3000
          fi
          # Upper bound: 3 × 3000s = 150 min inside the 240-min job
          # cap leaves ~90 min for non-codex work. Overrides above the
          # default would consume that headroom; clamp with a warning.
          # To genuinely enlarge the budget, raise BOTH the job cap
          # above AND this max, then redo the 3 × per_attempt math.
          ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_MAX_SECS=3000
          if [ "${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS}" -gt "${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_MAX_SECS}" ]; then
            echo "::warning::ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS=${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS} exceeds the upper bound of ${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_MAX_SECS}s (would eat the post-codex setup headroom under the 240-min job cap); clamping to ${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_MAX_SECS}."
            ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS="${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_MAX_SECS}"
          fi
          echo "Decomposer per-attempt timeout: ${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS}s."

          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Codex orchestrate attempt ${attempt}/${max_attempts}..."
            attempt_ok=0
            attempt_started_at="$(date +%s)"
            attempt_worktree_before="$(git status --porcelain=v1 --untracked-files=all)"
            if command -v sanitize_codex_prompt_file >/dev/null 2>&1; then
              sanitize_codex_prompt_file "${CODEX_PROMPT_FILE}"
            fi
            # `--` terminates `timeout`'s option parsing so a leading
            # '-' in DURATION cannot be mistaken for an option (defence
            # in depth on top of the regex check above). stdin
            # redirection replaces the prior `cat ... | codex` so the
            # `timeout` wrapper governs codex directly — wrapping a
            # pipeline would only time out `cat`, not the model call.
            if timeout --signal=TERM --kill-after=30s -- "${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS}" \
                 codex --ask-for-approval never -c model_verbosity=low -c include_apply_patch_tool=true exec --skip-git-repo-check --model "${MODEL_EDITOR}" --sandbox danger-full-access < "${CODEX_PROMPT_FILE}" > "${CODEX_OUTPUT_FILE}" 2> >(tee -a "${RUNTIME_DIR}/codex_log.txt" >&2); then
              if ! grep -q '[^[:space:]]' "${CODEX_OUTPUT_FILE}"; then
                echo "::warning::Codex returned empty output on attempt ${attempt}."
                last_status="empty output"
              else
                # Try to extract a JSON object from the response.
                if python3 - "${CODEX_OUTPUT_FILE}" "${DECOMPOSITION_FILE}" <<'PYEOF'
          import json, re, sys

          raw = open(sys.argv[1]).read()
          out_path = sys.argv[2]
          data = None
          try:
              data = json.loads(raw.strip())
          except json.JSONDecodeError:
              cleaned = re.sub(r'```(?:json)?\s*', '', raw)
              cleaned = re.sub(r'```\s*$', '', cleaned, flags=re.MULTILINE)
              # Walk the cleaned text tracking brace depth, but skip over
              # JSON strings so braces inside string values (e.g.
              # `"prose like {foo}"`) don't close the outer object early.
              # Track string state with the standard JSON escape rules:
              # `"` toggles string mode; inside a string `\\` consumes the
              # next char so an escaped quote (`\\"`) doesn't end it.
              depth, start, in_string, escape_next = 0, None, False, False
              for i, ch in enumerate(cleaned):
                  if escape_next:
                      escape_next = False
                      continue
                  if in_string:
                      if ch == '\\':
                          escape_next = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                      continue
                  if ch == '{':
                      if depth == 0:
                          start = i
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0 and start is not None:
                          try:
                              data = json.loads(cleaned[start:i+1])
                              break
                          except json.JSONDecodeError:
                              start = None
          if data is None:
              print('ERROR: Could not extract valid JSON from Codex output', file=sys.stderr)
              print(raw[:2000], file=sys.stderr)
              sys.exit(1)
          json.dump(data, open(out_path, 'w'), indent=2)
          PYEOF
                then
                  # `if .issues|type == "array"` guards against malformed
                  # outputs where `.issues` is a string/object/number —
                  # without it, `jq | length` would return the string
                  # length / object-key count and silently pass the
                  # minimum-count gate, only failing later at schema
                  # validation. -1 forces this attempt down the retry
                  # path.
                  EMITTED=$(jq 'if (.issues|type) == "array" then (.issues | length) else -1 end' "${DECOMPOSITION_FILE}" 2>/dev/null || echo "")
                  # Defensive guard: if jq exited non-zero or printed
                  # nothing, treat the response as malformed (-1) so the
                  # downstream `[ "${EMITTED}" -lt 0 ]` /
                  # `[ "${EMITTED}" -ge "${EXPECTED_MIN_ISSUES}" ]`
                  # arithmetic doesn't bail with "integer expression
                  # expected" under set -e.
                  if ! [[ "${EMITTED}" =~ ^-?[0-9]+$ ]]; then
                    EMITTED=-1
                  fi
                  last_emitted="${EMITTED}"
                  if [ "${EMITTED}" -lt 0 ]; then
                    EMITTED_DESC="a malformed (non-array) issues field"
                  else
                    EMITTED_DESC="${EMITTED} issue(s)"
                  fi
                  if [ "${EMITTED}" -ge "${EXPECTED_MIN_ISSUES}" ]; then
                    echo "Codex orchestrate succeeded on attempt ${attempt}: emitted=${EMITTED} >= expected_min=${EXPECTED_MIN_ISSUES}."
                    attempt_ok=1
                  else
                    echo "::warning::Attempt ${attempt} produced ${EMITTED_DESC}; author enumeration requires >= ${EXPECTED_MIN_ISSUES}. Re-prompting with corrective feedback."
                    last_status="emitted=${EMITTED}, expected >= ${EXPECTED_MIN_ISSUES}"
                    # Rebuild the prompt from the clean base and append a
                    # strongly-worded retry directive that names the actual
                    # vs. expected counts, so the next attempt has explicit
                    # numeric feedback rather than the same instruction
                    # text it just ignored.
                    cp "${BASE_PROMPT_FILE}" "${CODEX_PROMPT_FILE}"
                    {
                      echo
                      echo "=== RETRY FEEDBACK (attempt ${attempt} REJECTED) ==="
                      echo
                      echo "Your previous response produced ${EMITTED_DESC}."
                      echo "The project description above explicitly enumerates ${EXPECTED_MIN_ISSUES} distinct sub-issues using \"Issue <N>:\" / \"Issue <N> (...):\" structural markers (case-insensitive; whitespace between \"Issue\" and the number is optional)."
                      echo
                      echo "PER prompts/mode-orchestrate.txt (Author-supplied decomposition rule), you MUST honor that enumeration verbatim — emit AT LEAST ${EXPECTED_MIN_ISSUES} distinct issues, in the stated order, with the stated dependency_edges. Do NOT collapse enumerated sub-tasks into a single issue, even if they appear to share a single concern, a directory, or a file family. The author already did the decomposition work; your job is to transcribe it faithfully into the schema, not to re-decide it."
                      echo
                      echo "This is your retry. Anything other than >= ${EXPECTED_MIN_ISSUES} issues will fail the orchestrator and waste the run. Re-emit the decomposition JSON now with at least ${EXPECTED_MIN_ISSUES} issues honoring the author enumeration."
                    } >> "${CODEX_PROMPT_FILE}"
                  fi
                else
                  echo "::warning::Could not extract JSON from Codex output on attempt ${attempt}."
                  last_status="invalid JSON"
                fi
              fi
            else
              rc=$?
              attempt_elapsed=$(( $(date +%s) - attempt_started_at ))
              # `timeout` documents two exit codes for timer expiry:
              #   - 124: child sent SIGTERM after DURATION expired.
              #   - 137: the child received SIGKILL (128 + 9). `timeout
              #     --kill-after=30s` produces this when the child
              #     ignored SIGTERM long enough for the kill-after
              #     backstop to fire, BUT 137 is also produced by OOM
              #     kill / external `kill -9`. Mirror the conflict-
              #     resolver pattern and disambiguate via elapsed wall
              #     clock: a timer-driven 137 should arrive only after
              #     the configured budget has elapsed.
              if [ "$rc" = "124" ]; then
                echo "::warning::Codex decomposer attempt ${attempt} killed by per-attempt timer (${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS}s, timeout exit 124, elapsed ${attempt_elapsed}s)."
                last_status="codex timeout 124 (${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS}s)"
              elif [ "$rc" = "137" ] && [ "${attempt_elapsed}" -ge "${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS}" ]; then
                echo "::warning::Codex decomposer attempt ${attempt} killed by per-attempt timer (${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS}s, timeout exit 137 after kill-after backstop, elapsed ${attempt_elapsed}s)."
                last_status="codex timeout 137 (${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS}s)"
              else
                if [ "$rc" = "137" ]; then
                  echo "::warning::Codex exited with code 137 on attempt ${attempt} before the per-attempt timer budget elapsed (${attempt_elapsed}s < ${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS}s); likely OOM kill or external SIGKILL, not the timeout wrapper."
                  last_status="codex exit 137 (elapsed ${attempt_elapsed}s < budget ${ORCHESTRATE_DECOMPOSER_PER_ATTEMPT_TIMEOUT_SECS}s; likely OOM/external SIGKILL)"
                else
                  echo "::warning::Codex exited with code $rc on attempt ${attempt}."
                  last_status="codex exit ${rc}"
                fi
              fi
            fi
            attempt_worktree_after="$(git status --porcelain=v1 --untracked-files=all)"
            if [ "${attempt_worktree_after}" != "${attempt_worktree_before}" ]; then
              echo "::error::Codex decomposer attempt ${attempt} changed the repository worktree versus the pre-attempt baseline; refusing to continue on partial edits."
              git status --short
              exit 1
            fi
            if [ "${attempt_ok}" = "1" ]; then
              break
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              sleep_secs=$(( 10 * (2 ** (attempt - 1)) + RANDOM % 10 ))
              echo "Retrying in ${sleep_secs}s (includes jitter)..."
              sleep "${sleep_secs}"
            else
              echo "::error::Codex orchestrate failed after ${max_attempts} attempts (last_status=${last_status}, last_emitted=${last_emitted}, expected_min=${EXPECTED_MIN_ISSUES})."
              exit 1
            fi
          done

      - name: Validate decomposition JSON
        run: |
          set -euo pipefail

          # JSON extraction and the author-enumeration count check ran in
          # the previous step's retry loop; ${DECOMPOSITION_FILE} is
          # already populated with a parsed JSON object that satisfies
          # `len(issues) >= EXPECTED_MIN_ISSUES`. This step only re-runs
          # the schema-shape validation (id uniqueness, edge references,
          # cycle detection, files_touched normalization).
          python3 scripts/orchestrate_lib.py validate --input-file "${DECOMPOSITION_FILE}"
          echo "Decomposition validated successfully."

          # Fetch the conflict-telemetry JSONL from the ai-memory branch
          # so the partition guard can compute the EFFECTIVE hot-file
          # set (committed seed ∪ learned telemetry). Uses git protocol
          # exclusively — zero GitHub API calls. Absence of the branch
          # or file is a valid state: consumer repos that have never
          # recorded a conflict simply degrade to the committed seed
          # (which is also optional — the planner guard still detects
          # pairwise file-touch overlaps and the poller probe still
          # catches byte-level conflicts).
          TELEMETRY_JSONL="${RUNTIME_DIR}/merge_conflicts.jsonl"
          : > "${TELEMETRY_JSONL}"
          AI_MEMORY_BRANCH_NAME="${AI_MEMORY_BRANCH:-ai-memory}"
          AI_MEMORY_ROOT_NAME="${AI_MEMORY_ROOT:-ai-memory}"
          if git fetch --quiet --depth=50 origin "${AI_MEMORY_BRANCH_NAME}:refs/remotes/origin/${AI_MEMORY_BRANCH_NAME}" 2>/dev/null; then
            if git show "refs/remotes/origin/${AI_MEMORY_BRANCH_NAME}:${AI_MEMORY_ROOT_NAME}/orchestrator/merge_conflicts.jsonl" > "${TELEMETRY_JSONL}" 2>/dev/null; then
              _tel_lines="$(wc -l < "${TELEMETRY_JSONL}" 2>/dev/null || echo 0)"
              echo "Loaded ${_tel_lines} line(s) of merge-conflict telemetry from ${AI_MEMORY_BRANCH_NAME}."
            else
              : > "${TELEMETRY_JSONL}"
              echo "No ${AI_MEMORY_ROOT_NAME}/orchestrator/merge_conflicts.jsonl on ${AI_MEMORY_BRANCH_NAME} yet (first run, nothing learned)."
            fi
          else
            echo "ai-memory branch '${AI_MEMORY_BRANCH_NAME}' not present (first run — auto-created later by the poller); no learned telemetry this cycle."
          fi

          # Partition-guard dry-run: report any sibling file-touch overlaps
          # in the raw (pre-serialization) decomposition so the tracking
          # issue and job log surface the rewrite plan BEFORE the
          # destructive compute-waves pass runs. The effective hot-file
          # set is (committed .github/ai/hot_files.json if present) ∪
          # (telemetry-learned files meeting threshold). Both sources
          # are optional — empty is a valid state.
          HOT_FILE_WINDOW_DAYS="${ORCHESTRATOR_HOT_FILE_WINDOW_DAYS:-90}"
          HOT_FILE_MIN_EVENTS="${ORCHESTRATOR_HOT_FILE_MIN_EVENTS:-3}"
          HOT_FILE_MIN_PROJECTS="${ORCHESTRATOR_HOT_FILE_MIN_PROJECTS:-2}"
          PARTITION_REPORT_FILE="${RUNTIME_DIR}/partition_report.json"
          python3 scripts/orchestrate_lib.py check-partition \
            --input-file "${DECOMPOSITION_FILE}" \
            --conflict-telemetry-jsonl "${TELEMETRY_JSONL}" \
            --telemetry-window-days "${HOT_FILE_WINDOW_DAYS}" \
            --telemetry-min-events "${HOT_FILE_MIN_EVENTS}" \
            --telemetry-min-projects "${HOT_FILE_MIN_PROJECTS}" > "${PARTITION_REPORT_FILE}" || {
              echo "::error::Partition check failed (likely cycle/structural overlap). See report:"
              cat "${PARTITION_REPORT_FILE}" || true
              exit 1
            }
          PARTITION_OVERLAP_COUNT="$(jq -r '.total_overlaps // 0' "${PARTITION_REPORT_FILE}")"
          HOT_FILE_LEARNED_COUNT="$(jq -r '.hot_files_audit.learned_count // 0' "${PARTITION_REPORT_FILE}")"
          HOT_FILE_SEED_COUNT="$(jq -r '.hot_files_audit.committed_seed_count // 0' "${PARTITION_REPORT_FILE}")"
          echo "Effective hot-file set: ${HOT_FILE_SEED_COUNT} committed seed + ${HOT_FILE_LEARNED_COUNT} learned from telemetry."
          if [ "${HOT_FILE_LEARNED_COUNT}" -gt 0 ]; then
            jq -r '.hot_files_audit.learned_files[]? | "  Learned hot: " + .path + " (" + (.events | tostring) + " events across " + (.distinct_projects | tostring) + " projects)"' "${PARTITION_REPORT_FILE}" || true
          fi
          if [ "${PARTITION_OVERLAP_COUNT}" -gt 0 ]; then
            echo "::notice::Partition guard detected ${PARTITION_OVERLAP_COUNT} sibling file-touch overlap(s); auto-serialize will resolve them by injecting dependency_edges."
            jq -r '.wave_reports[]? | select(.overlap_count > 0) | "  Wave " + (.wave | tostring) + ": " + (.overlap_count | tostring) + " overlap(s): " + ([.overlaps[] | "\(.issue_a)\u2194\(.issue_b) on \(.files | join(\", \"))"] | join("; "))' "${PARTITION_REPORT_FILE}" || true
            jq -r '.planned_serializations[]? | "  Will serialize: \(.winner) -> \(.loser) (over " + (.overlap_type) + " on " + (.files | join(", ")) + ")"' "${PARTITION_REPORT_FILE}" || true
          else
            echo "Partition guard: no sibling file-touch overlaps detected."
          fi

          # Compute waves with auto-serialize and write the resulting
          # dependency_edges back into DECOMPOSITION_FILE so tracking-body
          # build + Wave 1 dispatch consume the post-serialization graph.
          python3 scripts/orchestrate_lib.py compute-waves \
            --input-file "${DECOMPOSITION_FILE}" \
            --conflict-telemetry-jsonl "${TELEMETRY_JSONL}" \
            --telemetry-window-days "${HOT_FILE_WINDOW_DAYS}" \
            --telemetry-min-events "${HOT_FILE_MIN_EVENTS}" \
            --telemetry-min-projects "${HOT_FILE_MIN_PROJECTS}" \
            --write-back

      - name: Ensure orchestrator labels exist
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/label_helpers.sh
          ensure_label_exists "ai:orchestrator-tracking" "${{ github.repository }}"
          ensure_label_exists "ai:clarification" "${{ github.repository }}"
          ensure_label_exists "ai:orchestrator-managed" "${{ github.repository }}"
          ensure_label_exists "ai:orchestrator-validate-required" "${{ github.repository }}"

      - name: Create tracking issue
        id: tracking_issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }

          # Build tracking issue body
          python3 scripts/orchestrate_lib.py build-tracking-body \
            --input-file "${DECOMPOSITION_FILE}" > "${TRACKING_BODY_FILE}"

          PROJECT_TITLE="$(jq -r '.project_title' "${DECOMPOSITION_FILE}")"

          TRACKING_ISSUE_URL="$(gh_retry gh issue create \
            --repo "${{ github.repository }}" \
            --title "[Orchestrator] ${PROJECT_TITLE}" \
            --body-file "${TRACKING_BODY_FILE}" \
            --label "ai:orchestrator-tracking")"

          TRACKING_ISSUE_NUMBER="$(echo "${TRACKING_ISSUE_URL}" | grep -oE '[0-9]+$')"

          echo "Created tracking issue #${TRACKING_ISSUE_NUMBER}: ${TRACKING_ISSUE_URL}"
          {
            echo "tracking_issue_number=${TRACKING_ISSUE_NUMBER}"
            echo "tracking_issue_url=${TRACKING_ISSUE_URL}"
          } >> "$GITHUB_OUTPUT"
          echo "TRACKING_ISSUE_NUMBER=${TRACKING_ISSUE_NUMBER}" >> "$GITHUB_ENV"

      - name: Create integration branch
        id: integration_branch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE_NUMBER: ${{ steps.tracking_issue.outputs.tracking_issue_number }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          type _safe_gh_jq >/dev/null 2>&1 || _safe_gh_jq() {
            local _tmpf
            if ! _tmpf=$(mktemp "${TMPDIR:-/tmp}/_safe_gh_jq.XXXXXX" 2>/dev/null); then
              echo "::error::_safe_gh_jq: failed to create temp file (mktemp failed); aborting without running: $*" >&2
              return 1
            fi
            if gh api "$@" > "${_tmpf}"; then
              cat "${_tmpf}"
              rm -f "${_tmpf}"
              return 0
            fi
            rm -f "${_tmpf}"
            return 1
          }

          DEFAULT_BRANCH="$(gh_retry _safe_gh_jq "repos/${{ github.repository }}" --jq '.default_branch')"
          DEFAULT_BRANCH_REF="$(printf '%s' "${DEFAULT_BRANCH}" | jq -sRr @uri)"
          INTEGRATION_BRANCH="orchestrator/project-${TRACKING_ISSUE_NUMBER}"
          INTEGRATION_BRANCH_REF="$(printf '%s' "${INTEGRATION_BRANCH}" | jq -sRr @uri)"

          if gh_retry gh api "repos/${{ github.repository }}/git/ref/heads/${INTEGRATION_BRANCH_REF}" >/dev/null 2>&1; then
            echo "Integration branch already exists: ${INTEGRATION_BRANCH}"
          else
            BASE_SHA="$(gh_retry _safe_gh_jq "repos/${{ github.repository }}/git/ref/heads/${DEFAULT_BRANCH_REF}" --jq '.object.sha')"
            gh_retry gh api "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/heads/${INTEGRATION_BRANCH}" \
              -f sha="${BASE_SHA}" >/dev/null
            echo "Created integration branch ${INTEGRATION_BRANCH} from ${DEFAULT_BRANCH}@${BASE_SHA}"
          fi

          python3 scripts/orchestrate_lib.py build-tracking-body \
            --input-file "${DECOMPOSITION_FILE}" \
            --integration-branch "${INTEGRATION_BRANCH}" > "${TRACKING_BODY_FILE}"

          gh_retry gh issue edit "${TRACKING_ISSUE_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body-file "${TRACKING_BODY_FILE}" >/dev/null

          {
            echo "integration_branch=${INTEGRATION_BRANCH}"
            echo "default_branch=${DEFAULT_BRANCH}"
          } >> "$GITHUB_OUTPUT"
          echo "INTEGRATION_BRANCH=${INTEGRATION_BRANCH}" >> "$GITHUB_ENV"

      - name: Create Wave 1 issues only
        id: create_issues
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE_NUMBER: ${{ steps.tracking_issue.outputs.tracking_issue_number }}
          INTEGRATION_BRANCH: ${{ steps.integration_branch.outputs.integration_branch }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true

          # Only create Wave 1 issues now. Later-wave issues are created by the
          # poller when their dependencies are met (deferred creation). This
          # ensures clarify.yml fires on issues.opened at the right time.
          WAVE1_IDS="$(python3 -c "
          import json, sys
          sys.path.insert(0, 'scripts')
          from orchestrate_lib import validate_decomposition, compute_waves

          with open('${DECOMPOSITION_FILE}') as f:
              data = json.load(f)

          validate_decomposition(data)
          waves = compute_waves(data)
          for issue in waves[0]:
              print(issue['id'])
          ")"

          echo "Wave 1 issue IDs: ${WAVE1_IDS}"

          # Build a map of local_id -> github_issue_number (Wave 1 only)
          declare -A ISSUE_MAP

          ISSUE_COUNT="$(jq '.issues | length' "${DECOMPOSITION_FILE}")"
          for idx in $(seq 0 $(( ISSUE_COUNT - 1 ))); do
            LOCAL_ID="$(jq -r ".issues[${idx}].id" "${DECOMPOSITION_FILE}")"

            # Skip issues not in Wave 1
            if ! echo "${WAVE1_IDS}" | grep -qxF "${LOCAL_ID}"; then
              echo "  Deferring ${LOCAL_ID} (not in Wave 1)"
              continue
            fi

            TITLE="$(jq -r ".issues[${idx}].title" "${DECOMPOSITION_FILE}")"
            BODY="$(jq -r ".issues[${idx}].body" "${DECOMPOSITION_FILE}" | sed 's/\\n/\n/g')"
            PRIORITY="$(jq -r ".issues[${idx}].priority" "${DECOMPOSITION_FILE}")"

            # Append orchestrator metadata to body
            FULL_BODY="$(cat <<EOF
          ${BODY}

          ---
          **Orchestrator metadata** (do not edit)
          - Tracking issue: #${TRACKING_ISSUE_NUMBER}
          - Integration branch: ${INTEGRATION_BRANCH}
          - Local ID: \`${LOCAL_ID}\`
          - Priority: ${PRIORITY}
          - Managed by: AI Orchestrator
          EOF
          )"

            ISSUE_URL="$(gh_retry gh issue create \
              --repo "${{ github.repository }}" \
              --title "${TITLE}" \
              --body "${FULL_BODY}" \
              --label "ai:clarification" \
              --label "ai:orchestrator-managed")"

            ISSUE_NUM="$(echo "${ISSUE_URL}" | grep -oE '[0-9]+$')"
            ISSUE_MAP["${LOCAL_ID}"]="${ISSUE_NUM}"
            echo "  Created #${ISSUE_NUM}: ${TITLE} (${LOCAL_ID})"
          done

          # Write issue map as JSON for state tracking
          MAP_JSON="{"
          first=true
          for key in "${!ISSUE_MAP[@]}"; do
            if [ "${first}" = true ]; then
              first=false
            else
              MAP_JSON+=","
            fi
            MAP_JSON+="\"${key}\":${ISSUE_MAP[${key}]}"
          done
          MAP_JSON+="}"
          echo "${MAP_JSON}" | jq '.' > "${RUNTIME_DIR}/issue_map.json"
          echo "Issue map (Wave 1 only): $(cat "${RUNTIME_DIR}/issue_map.json")"

      - name: Build and post initial state
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE_NUMBER: ${{ steps.tracking_issue.outputs.tracking_issue_number }}
          INTEGRATION_BRANCH: ${{ steps.integration_branch.outputs.integration_branch }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true

          # Build state using Python helper
          python3 -c "
          import json

          with open('${DECOMPOSITION_FILE}') as f:
              data = json.load(f)

          with open('${RUNTIME_DIR}/issue_map.json') as f:
              issue_map_raw = json.load(f)

          # Convert string values to ints
          issue_map = {k: int(v) for k, v in issue_map_raw.items()}

          # Import the library
          import sys
          sys.path.insert(0, 'scripts')
          from orchestrate_lib import validate_decomposition, compute_waves, build_tracking_state

          validate_decomposition(data)
          waves = compute_waves(data)
          state = build_tracking_state(data, waves, issue_map, integration_branch='${INTEGRATION_BRANCH}')
          state['tracking_issue'] = int('${TRACKING_ISSUE_NUMBER}')

          with open('${STATE_FILE}', 'w') as f:
              json.dump(state, f, indent=2)
          "

          # Post state as a hidden comment on the tracking issue for the poller
          STATE_COMMENT="$(cat <<EOF
          <!-- ORCHESTRATOR_STATE_V1
          $(cat "${STATE_FILE}")
          ORCHESTRATOR_STATE_V1 -->
          EOF
          )"

          jq -n --arg body "${STATE_COMMENT}" '{"body": $body}' \
            | gh_retry gh api "repos/${{ github.repository }}/issues/${TRACKING_ISSUE_NUMBER}/comments" \
                --input - >/dev/null
          echo "Posted initial state to tracking issue #${TRACKING_ISSUE_NUMBER}"

      - name: Record decomposition candidate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
          TRACKING_ISSUE_NUMBER: ${{ steps.tracking_issue.outputs.tracking_issue_number }}
        run: |
          set -euo pipefail
          if ! source scripts/memory_helpers.sh; then
            echo "::warning::Unable to source scripts/memory_helpers.sh; skipping decomposition candidate memory record"
            exit 0
          fi

          ISSUE_COUNT="$(jq '.issues | length' "${DECOMPOSITION_FILE}" 2>/dev/null || echo 0)"
          PROJECT_TITLE="$(jq -r '.project_title' "${DECOMPOSITION_FILE}" 2>/dev/null || echo "unknown")"
          if DETAILS_JSON="$(jq -c '{project_title: .project_title, issues: [.issues[] | {id, title, priority}], dependency_edges}' "${DECOMPOSITION_FILE}" 2>/dev/null)"; then
            DETAILS="${DETAILS_JSON:0:12000}"
          else
            DETAILS='{"project_title":"unknown","issues":[],"dependency_edges":[]}'
          fi

          memory_record_candidate \
            --category "decisions" \
            --summary "Decomposed project '${PROJECT_TITLE}' into ${ISSUE_COUNT} issues (tracking #${TRACKING_ISSUE_NUMBER})" \
            --details "${DETAILS}" \
            --confidence "0.80" \
            --workflow "orchestrate" \
            --run-id "${{ github.run_id }}" \
            --actor "${{ github.actor }}" \
            --issue-number "${TRACKING_ISSUE_NUMBER}"

      - name: Dispatch Wave 1
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE_NUMBER: ${{ steps.tracking_issue.outputs.tracking_issue_number }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true

          # Get wave 1 issues from state
          WAVE1_ISSUES="$(python3 scripts/orchestrate_lib.py next-wave --state-file "${STATE_FILE}")"
          echo "Wave 1 dispatch: ${WAVE1_ISSUES}"

          ACTION="$(echo "${WAVE1_ISSUES}" | jq -r '.action')"
          if [ "${ACTION}" != "dispatch" ]; then
            echo "::warning::No issues to dispatch (action=${ACTION})"
            exit 0
          fi

          # The existing pipeline triggers on issue creation (clarify.yml).
          # Issues were just created above, so clarify.yml should fire automatically.
          # Log what we expect to happen.
          echo "${WAVE1_ISSUES}" | jq -r '.issues[] | "  Issue #\(.github_issue) (\(.id)) — awaiting clarify pipeline"'

          # Post wave dispatch status to tracking issue
          WAVE1_COMMENT="## Wave 1 Dispatched

          The following issues have been created and are entering the AI pipeline:

          $(echo "${WAVE1_ISSUES}" | jq -r '.issues[] | "- #\(.github_issue) (`\(.id)`)"')

          The orchestrator poller will monitor progress and dispatch subsequent waves when dependencies are met."

          jq -n --arg body "${WAVE1_COMMENT}" '{"body": $body}' \
            | gh_retry gh api "repos/${{ github.repository }}/issues/${TRACKING_ISSUE_NUMBER}/comments" \
                --input - >/dev/null

      - name: Write run summary
        if: always()
        env:
          TOKEN_WARN_THRESHOLD: ${{ vars.TOKEN_WARN_THRESHOLD_ORCHESTRATE || '200000' }}
        run: |
          set -euo pipefail
          : "${RUNTIME_DIR:=/tmp/codex-orchestrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          : "${DECOMPOSITION_FILE:=${RUNTIME_DIR}/decomposition.json}"
          : "${TRACKING_ISSUE_NUMBER:=0}"
          TOKENS=""
          if [ -f "${RUNTIME_DIR}/codex_log.txt" ]; then
            TOKENS="$(grep -A1 'tokens used' "${RUNTIME_DIR}/codex_log.txt" | tail -1 | tr -d '[:space:]' || true)"
          fi
          ISSUE_COUNT="0"
          WAVE_COUNT="0"
          if [ -f "${DECOMPOSITION_FILE}" ]; then
            ISSUE_COUNT="$(jq '.issues | length' "${DECOMPOSITION_FILE}" 2>/dev/null || echo 0)"
            WAVE_COUNT="$(jq '.dependency_edges | length' "${DECOMPOSITION_FILE}" 2>/dev/null || echo 0)"
          fi
          {
            echo "## AI Orchestrate Summary"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Model | \`${MODEL_EDITOR}\` |"
            echo "| Reasoning | \`${MODEL_REASONING_EFFORT}\` |"
            if [ -n "${TOKENS}" ]; then
              echo "| Tokens used | ${TOKENS} |"
              TOKENS_NUM="${TOKENS//,/}"
              if [ "${TOKENS_NUM}" -gt "${TOKEN_WARN_THRESHOLD}" ] 2>/dev/null; then
                echo "| :warning: Token alert | Above ${TOKEN_WARN_THRESHOLD} threshold |"
              fi
            fi
            echo "| Issues created | ${ISSUE_COUNT} |"
            if [ -n "${TRACKING_ISSUE_NUMBER:-}" ] && [ "${TRACKING_ISSUE_NUMBER}" != "0" ]; then
              echo "| Tracking issue | #${TRACKING_ISSUE_NUMBER} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record orchestration run end
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
          TRACKING_ISSUE_NUMBER: ${{ steps.tracking_issue.outputs.tracking_issue_number }}
        run: |
          set -euo pipefail
          : "${RUNTIME_DIR:=/tmp/codex-orchestrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          : "${DECOMPOSITION_FILE:=${RUNTIME_DIR}/decomposition.json}"
          : "${TRACKING_ISSUE_NUMBER:=0}"

          if [ ! -f "scripts/memory_helpers.sh" ]; then
            echo "::warning::scripts/memory_helpers.sh not found; skipping orchestration end memory record"
            exit 0
          fi

          source scripts/memory_helpers.sh

          JOB_STATUS="${{ job.status }}"
          EVENT_TYPE="orchestration_failed"
          EVENT_STATUS="error"
          EVENT_MESSAGE="Orchestration failed (${JOB_STATUS})"

          if [ "${JOB_STATUS}" = "success" ]; then
            EVENT_TYPE="orchestration_completed"
            EVENT_STATUS="ok"
            EVENT_MESSAGE="Orchestration completed"
          fi

          ARGS=(
            --run-id "${{ github.run_id }}"
            --workflow "orchestrate"
            --event-type "${EVENT_TYPE}"
            --status "${EVENT_STATUS}"
            --message "${EVENT_MESSAGE}"
            --actor "${{ github.actor }}"
          )

          if [ -n "${TRACKING_ISSUE_NUMBER:-}" ] && [ "${TRACKING_ISSUE_NUMBER}" != "0" ]; then
            ARGS+=(--issue-number "${TRACKING_ISSUE_NUMBER}")
          fi

          memory_record_run_event "${ARGS[@]}"

      - name: Notify via Telegram
        if: always()
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID || '' }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE_NUMBER: ${{ steps.tracking_issue.outputs.tracking_issue_number }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
        run: |
          set -euo pipefail
          : "${RUNTIME_DIR:=/tmp/codex-orchestrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          : "${DECOMPOSITION_FILE:=${RUNTIME_DIR}/decomposition.json}"
          : "${TRACKING_ISSUE_NUMBER:=0}"
          source scripts/tg_helpers.sh

          STATUS="${{ job.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TRACKING_URL=""
          if [ -n "${TRACKING_ISSUE_NUMBER:-}" ] && [ "${TRACKING_ISSUE_NUMBER}" != "0" ]; then
            TRACKING_URL="${{ github.server_url }}/${{ github.repository }}/issues/${TRACKING_ISSUE_NUMBER}"
          fi
          ISSUE_COUNT="0"
          if [ -f "${DECOMPOSITION_FILE}" ]; then
            ISSUE_COUNT="$(jq '.issues | length' "${DECOMPOSITION_FILE}" 2>/dev/null || echo 0)"
          fi
          if [ "${STATUS}" = "success" ]; then
            MSG="Orchestrator: Decomposed project into ${ISSUE_COUNT} issues."
            LEVEL="DEBUG"
            if [ -n "${TRACKING_URL}" ]; then
              MSG+=$'\n'
              MSG+="Tracking: ${TRACKING_URL}"
            fi
          else
            MSG="Orchestrator: Failed (${STATUS})."
            LEVEL="ERROR"
            if [ -n "${TRACKING_ISSUE_NUMBER:-}" ] && [ "${TRACKING_ISSUE_NUMBER}" != "0" ]; then
              MSG+=$'\n'
              MSG+="Issue: ${TRACKING_URL}"
            fi
          fi
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_tracked "${TRACKING_ISSUE_NUMBER:-0}" "${MSG}" "${LEVEL}"

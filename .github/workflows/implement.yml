---
name: AI Implement

"on":
  workflow_call:
    secrets:
      GH_PAT:
        required: true
      OPENROUTER_API_KEY:
        required: true
      TG_BOT_SECRET:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UNATTENDED_PHASE: implement
  EVENTS_JSONL_ENABLED: ${{ vars.EVENTS_JSONL_ENABLED || 'false' }}
  UNATTENDED_TRANSCRIPT_ARCHIVE_ENABLED: ${{ vars.UNATTENDED_TRANSCRIPT_ARCHIVE_ENABLED || 'false' }}
  MODEL_EDITOR: ${{ vars.WORKFLOW_EDITOR_MODEL || 'openai/gpt-5.5' }}
  # Capacity-fallback editor model. On the final implement attempt the retry
  # loop points CODEX_THREAD_REUSE_MODEL at this slug, which sits in a
  # different OpenRouter/OpenAI per-model TPM bucket than the primary, so a
  # sustained saturation of the primary editor model (the failure mode from
  # issue #3515 / run 28640359211, observed when gpt-5.4 was the primary) can
  # be ridden out without a model change on the earlier attempts. Set to the
  # primary slug (or clear it) to disable the switch.
  MODEL_EDITOR_FALLBACK: ${{ vars.WORKFLOW_EDITOR_FALLBACK_MODEL || 'openai/gpt-5.4' }}
  MODEL_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_IMPLEMENT || 'xhigh' }}
  REISSUE_PRESERVE_BASELINE_ENABLED: ${{ vars.REISSUE_PRESERVE_BASELINE_ENABLED || 'false' }}
  SEMBLE_ENABLED: ${{ vars.SEMBLE_ENABLED || 'true' }}
  SERENA_ENABLED: ${{ vars.SERENA_ENABLED || 'false' }}
  WORKSPACE_HOOK_TIMEOUT_SECONDS: ${{ vars.WORKSPACE_HOOK_TIMEOUT_SECONDS || '600' }}
  WORKSPACE_REUSE_ENABLED: ${{ vars.WORKSPACE_REUSE_ENABLED || 'false' }}
  # MODEL_DIAGNOSE drives the post-Codex diagnose step
  # (scripts/implement_diagnose_post_codex_failure.sh). Per the OpenAI
  # prompt guide that step is research/synthesis, not coding. The implement
  # editor and the diagnose step now share the gpt-5.5 default; the separate
  # env var is preserved so operators can route diagnose to a different model
  # (e.g. a cheaper mini variant) without affecting the editor.
  MODEL_DIAGNOSE: ${{ vars.WORKFLOW_DIAGNOSE_MODEL || 'openai/gpt-5.5' }}
  MODEL_DIAGNOSE_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_DIAGNOSE || 'xhigh' }}
  # Defaults to xhigh to match the repo-wide gpt-5.5 reasoning-level
  # policy. Override per-repo via vars.THINKING_LEVEL_IMPLEMENT_REPAIR if
  # repair runs need a different effort than the main editor.
  MODEL_REPAIR_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_IMPLEMENT_REPAIR || 'xhigh' }}
  OPENROUTER_PROMPT_CACHE_DISABLED: ${{ vars.OPENROUTER_PROMPT_CACHE_DISABLED || 'false' }}
  MEMORY_INJECTION_SCAN_ENABLED: ${{ vars.MEMORY_INJECTION_SCAN_ENABLED || 'true' }}
  ALLOW_WORKFLOW_EDITS: ${{ vars.ALLOW_WORKFLOW_EDITS || 'true' }}
  WRITE_GUARDS_ENABLED: ${{ vars.WRITE_GUARDS_ENABLED || 'true' }}
  # files_touched scope-enforcement guard (see the preflight + commit-time
  # scope guards in this workflow and scripts/files_touched_scope_guard.py).
  # ENFORCE_FILES_TOUCHED is the master toggle — set 'false' to globally
  # downgrade the guard to a logged skip. ALLOW_OUT_OF_SCOPE_FILES is the
  # per-run escape hatch — set 'true' to warn but allow, mirroring
  # ALLOW_BULK_DELETE / ALLOW_WORKFLOW_EDITS. Both are mapped here (like
  # ALLOW_WORKFLOW_EDITS) because vars.* are not auto-exposed to the shell.
  ENFORCE_FILES_TOUCHED: ${{ vars.ENFORCE_FILES_TOUCHED || 'true' }}
  ALLOW_OUT_OF_SCOPE_FILES: ${{ vars.ALLOW_OUT_OF_SCOPE_FILES || 'false' }}
  # Optional per-issue ai:scope:<glob> label. Default false during
  # acceptance so existing implement behavior is unchanged until the
  # feature is exercised on a real issue.
  SCOPE_LOCK_LABEL_ENABLED: ${{ vars.SCOPE_LOCK_LABEL_ENABLED || 'false' }}
  # Destructive-commit guard knobs. Both guard shells (Preflight
  # destructive-commit guard + Commit changes) read these as bare
  # ${VAR:-default}, so they must be bound at workflow-env level to reach
  # those steps — the same wiring ALLOW_WORKFLOW_EDITS above relies on.
  # vars.* resolves to the caller (consumer) repository, making them
  # configurable via the README "Variables" table; the defaults match the
  # in-shell fallbacks (false / 3 / 100) so unset variables preserve the
  # current behaviour exactly.
  ALLOW_BULK_DELETE: ${{ vars.ALLOW_BULK_DELETE || 'false' }}
  BULK_DELETE_THRESHOLD: ${{ vars.BULK_DELETE_THRESHOLD || '3' }}
  BULK_DELETE_THRESHOLD_MD: ${{ vars.BULK_DELETE_THRESHOLD_MD || '100' }}
  MAX_POST_CODEX_REPAIR_ATTEMPTS: ${{ vars.MAX_POST_CODEX_REPAIR_ATTEMPTS || '3' }}
  CODEX_THREAD_REUSE_ENABLED: ${{ vars.CODEX_THREAD_REUSE_ENABLED || 'false' }}

jobs:
  implement:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request == null &&
      (
        (
          github.event.comment.user.type == 'User' &&
          contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          startsWith(github.event.comment.body, '/approved')
        ) ||
        (
          github.event.comment.user.type == 'Bot' &&
          github.event.comment.user.login == 'github-actions[bot]' &&
          startsWith(github.event.comment.body, '/approved') &&
          contains(github.event.comment.body, '[auto-approved-by-plan]')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: ai-implement-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      APPROVAL_COMMENT_ID: ${{ github.event.comment.id }}
      SKIP_IMPLEMENT: "false"
      RESTORE_AWAITING_APPROVAL_ON_SKIP: "false"

    steps:
      - name: Precheck approval phase label
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          RUNTIME_DIR="/tmp/codex-implement-${GITHUB_RUN_ID}"
          mkdir -p "${RUNTIME_DIR}"
          ISSUE_META_FILE="${RUNTIME_DIR}/issue_meta.json"
          ISSUE_BODY_FILE="${RUNTIME_DIR}/issue_body.txt"

          # Fetch state alongside labels so a closed issue (e.g. cleanup-closed
          # by the orchestrate-decompose-test smoke before the auto-approve
          # comment fires the implement workflow) short-circuits before any
          # Codex / install cost. Without the state gate, implement runs on
          # the closed issue, posts a misleading "implementation-failed"
          # diagnostics comment, and burns budget.
          ISSUE_PAYLOAD="$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}")"
          printf '%s\n' "${ISSUE_PAYLOAD}" > "${ISSUE_META_FILE}"
          ISSUE_BODY="$(printf '%s' "${ISSUE_PAYLOAD}" | jq -r '.body // ""')"
          printf '%s\n' "${ISSUE_BODY}" > "${ISSUE_BODY_FILE}"
          ISSUE_STATE="$(printf '%s' "${ISSUE_PAYLOAD}" | jq -r '.state // "open"')"
          ISSUE_LABELS_JSON="$(printf '%s' "${ISSUE_PAYLOAD}" | jq -c '[.labels[]?.name]')"
          if [ "${ISSUE_STATE}" = "closed" ]; then
            echo "Issue #${ISSUE_NUMBER} is closed. Skipping implementation steps."
            echo "AI_PHASE_GATE_V1 phase=implement gate=phase_precheck reason=issue_closed outcome=skip issue=${ISSUE_NUMBER}"
            echo "SKIP_IMPLEMENT=true" >> "$GITHUB_ENV"
          elif printf '%s' "${ISSUE_LABELS_JSON}" | jq -e 'index("ai:implementing") != null' >/dev/null; then
            echo "Issue #${ISSUE_NUMBER} already has ai:implementing label. Another implement run is in progress. Skipping."
            echo "AI_PHASE_GATE_V1 phase=implement gate=phase_precheck reason=already_implementing outcome=skip issue=${ISSUE_NUMBER}"
            echo "SKIP_IMPLEMENT=true" >> "$GITHUB_ENV"
          elif ! printf '%s' "${ISSUE_LABELS_JSON}" | jq -e 'index("ai:awaiting-approval") != null' >/dev/null; then
            echo "Issue #${ISSUE_NUMBER} is not in ai:awaiting-approval phase. Skipping implementation steps."
            echo "AI_PHASE_GATE_V1 phase=implement gate=phase_precheck reason=wrong_phase outcome=skip issue=${ISSUE_NUMBER}"
            echo "SKIP_IMPLEMENT=true" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        if: env.SKIP_IMPLEMENT != 'true'
        uses: shubhodeep1/coding-workflows/.github/actions/install-codex@stable
        with:
          codex_version: ${{ vars.CODEX_VERSION || 'v0.114.0' }}

      - name: Create runtime workspace
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail
          RUNTIME_DIR="/tmp/codex-implement-${GITHUB_RUN_ID}"
          mkdir -p "${RUNTIME_DIR}"

          {
            echo "JOB_START_EPOCH=$(date +%s)"
            echo "RUNTIME_DIR=${RUNTIME_DIR}"
            echo "CODEX_THREAD_REUSE_RUNTIME_DIR=${RUNTIME_DIR}"
            echo "SEMBLE_AVAILABLE=false"
            echo "SEMBLE_INDEX_AVAILABLE=false"
            echo "SEMBLE_INDEX_PATH=${RUNTIME_DIR}/.semble-index"
            echo "SERENA_AVAILABLE=false"
            echo "SERENA_PROJECT_PREEXISTED=false"
            echo "SERENA_PROJECT_BOOTSTRAP_HASH="
            echo "ISSUE_META_FILE=${RUNTIME_DIR}/issue_meta.json"
            echo "ISSUE_BODY_FILE=${RUNTIME_DIR}/issue_body.txt"
            echo "ISSUE_COMMENTS_FILE=${RUNTIME_DIR}/issue_comments.json"
            echo "ISSUE_SUMMARY_PROMPT_FILE=${RUNTIME_DIR}/issue_summary_prompt.txt"
            echo "ISSUE_SUMMARY_FILE=${RUNTIME_DIR}/issue_summary.md"
            echo "IMPLEMENTATION_CONTEXT_FILE=${RUNTIME_DIR}/implementation_context.txt"
            echo "CODEX_PROMPT_FILE=${RUNTIME_DIR}/codex_prompt.txt"
            echo "CODEX_OUTPUT_FILE=${RUNTIME_DIR}/codex_output.txt"
            echo "IMPLEMENT_DIAGNOSE_PROMPT_FILE=${RUNTIME_DIR}/implement_diagnose_prompt.txt"
            echo "IMPLEMENT_DIAGNOSE_OUTPUT_FILE=${RUNTIME_DIR}/implement_diagnose_output.txt"
            echo "IMPLEMENT_DIAGNOSE_LOG_FILE=${RUNTIME_DIR}/implement_diagnose.log"
            echo "IMPLEMENT_DIAGNOSE_RESULT_FILE=${RUNTIME_DIR}/implement_diagnose_result.json"
            echo "PLAN_FILE=${RUNTIME_DIR}/implementation_plan.txt"
            echo "CLARIFICATION_ANSWERS_FILE=${RUNTIME_DIR}/clarification_answers.txt"
            echo "PR_EXISTS_FILE=${RUNTIME_DIR}/existing_prs.txt"
            echo "MEMORY_CONTEXT_FILE=${RUNTIME_DIR}/memory_context.txt"
            echo "CHANGED_FILES_FILE=${RUNTIME_DIR}/changed_files.txt"
            echo "PR_METADATA_FILE=${RUNTIME_DIR}/pr_metadata.json"
            echo "TARGET_BRANCH=ai/issue-${ISSUE_NUMBER}"
          } >> "$GITHUB_ENV"

      - name: Safety check for existing PR
        if: env.SKIP_IMPLEMENT != 'true'
        id: existing_pr_check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # Resolve "is there already an open PR for this issue?" via the
          # issue timeline cross-reference events — the same shape used by
          # plan.yml's "Skip when issue already has a PR" step. Do NOT use
          # `gh pr list --search "issue:${ISSUE_NUMBER}"`: GitHub has no
          # `issue:` PR-search qualifier, so the query degrades to fuzzy
          # free-text and false-positive matches any open PR whose body or
          # comments contain the digit string (e.g. an unrelated PR with a
          # review comment referencing line N of a file). Fail-open on a
          # timeline lookup miss is acceptable here: the downstream
          # `Create Pull Request` step uses `gh pr create --head
          # "${TARGET_BRANCH}"`, which GitHub itself rejects when an open
          # PR already exists on the same head — see the recovery branch
          # at the `gh pr create` failure handler below.
          gh api --paginate \
            "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/timeline" \
            --jq '
              [.[]
                | select(.event == "cross-referenced")
                | select(.source.issue.pull_request != null)
                | select(.source.issue.state == "open")
                | .source.issue
              ]
              | unique_by(.number)
              | .[]
              | "#\(.number) \(.html_url)"
            ' > "${PR_EXISTS_FILE}" || true

          if [ -s "${PR_EXISTS_FILE}" ]; then
            echo "existing_pr=true" >> "$GITHUB_OUTPUT"
            {
              echo "Existing PR(s) found for issue ${ISSUE_NUMBER}:"
              cat "${PR_EXISTS_FILE}"
            }
          else
            echo "existing_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve workflow support ref for duplicate PR notice
        if: env.SKIP_IMPLEMENT != 'true' && steps.existing_pr_check.outputs.existing_pr == 'true'
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            echo "DUPLICATE_NOTICE_SCRIPT_REF=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "DUPLICATE_NOTICE_SCRIPT_REF=stable" >> "$GITHUB_ENV"
          fi

      - name: Checkout support source for duplicate PR notice
        if: env.SKIP_IMPLEMENT != 'true' && steps.existing_pr_check.outputs.existing_pr == 'true'
        id: checkout_support_source_duplicate_notice
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ env.DUPLICATE_NOTICE_SCRIPT_REF }}
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Checkout support source fallback for duplicate PR notice
        if: env.SKIP_IMPLEMENT != 'true' && steps.existing_pr_check.outputs.existing_pr == 'true' && steps.checkout_support_source_duplicate_notice.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Checkout support source main snapshot for duplicate PR notice
        if: env.SKIP_IMPLEMENT != 'true' && steps.existing_pr_check.outputs.existing_pr == 'true' && env.DUPLICATE_NOTICE_SCRIPT_REF != 'main'
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src-main
          fetch-depth: 1

      - name: Telegram duplicate PR notification
        if: env.SKIP_IMPLEMENT != 'true' && steps.existing_pr_check.outputs.existing_pr == 'true'
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
        run: |
          set -euo pipefail
          mkdir -p scripts
          tg_helper_src=".codex-workflow-src/scripts/tg_helpers.sh"
          if [ ! -f "${tg_helper_src}" ] && [ -f ".codex-workflow-src-main/scripts/tg_helpers.sh" ]; then
            tg_helper_src=".codex-workflow-src-main/scripts/tg_helpers.sh"
          fi
          if [ -f "${tg_helper_src}" ]; then
            install -m 0755 "${tg_helper_src}" scripts/tg_helpers.sh
            source scripts/tg_helpers.sh
          fi
          rm -rf .codex-workflow-src-main

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="Skipping implementation for issue #${ISSUE_NUMBER} — PR already exists."
          MSG+=$'\n'
          MSG+="Issue: ${ISSUE_URL}"
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          if declare -F tg_send_tracked >/dev/null 2>&1; then
            tg_send_tracked "${ISSUE_NUMBER}" "${MSG}" "WARNING"
          else
            echo "::warning::Telegram helper unavailable; skipping duplicate PR Telegram notification."
          fi

      - name: Exit when existing PR is found
        if: env.SKIP_IMPLEMENT != 'true' && steps.existing_pr_check.outputs.existing_pr == 'true'
        run: |
          echo "AI_PHASE_GATE_V1 phase=implement gate=existing_pr_check reason=existing_pr outcome=skip issue=${ISSUE_NUMBER}"
          echo "Existing PR already present for this issue; exiting safely."
          echo "SKIP_IMPLEMENT=true" >> "$GITHUB_ENV"
          exit 0

      - name: Resolve integration ref
        if: env.SKIP_IMPLEMENT != 'true'
        id: refctx
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          issue_number="${ISSUE_NUMBER:-}"
          if ! [[ "${issue_number}" =~ ^[0-9]+$ ]] || [ "${issue_number}" -le 0 ]; then
            echo "::notice::No issue number available for integration ref resolution; falling back to default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          resolver_repo="shubhodeep1/coding-workflows"
          resolver_ref="stable"
          if [ "${{ github.repository }}" = "${resolver_repo}" ]; then
            resolver_ref="${{ github.sha }}"
          fi

          resolver_stage_root="${RUNNER_TEMP}/resolve-integration-ref-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          resolver_stage_primary="${resolver_stage_root}/primary"
          resolver_stage_fallback="${resolver_stage_root}/fallback"
          resolver_repo_url="https://github.com/${resolver_repo}"
          rm -rf "${resolver_stage_root}"
          mkdir -p "${resolver_stage_root}"
          resolver_clone_log="${resolver_stage_root}/clone.log"
          resolver_git_auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          resolver_git() {
            git -c "http.extraHeader=Authorization: Basic ${resolver_git_auth_header}" "$@"
          }
          cleanup_resolver_stage() {
            rm -rf "${resolver_stage_root}"
          }
          trap cleanup_resolver_stage EXIT

          if resolver_git clone --quiet --depth 1 --branch main "${resolver_repo_url}" "${resolver_stage_primary}" 2>"${resolver_clone_log}"; then
            resolver_script="${resolver_stage_primary}/scripts/resolve_integration_ref.sh"
            if ! resolver_git -C "${resolver_stage_primary}" fetch --quiet --depth 1 origin "${resolver_ref}" 2>>"${resolver_clone_log}" || \
               ! git -C "${resolver_stage_primary}" checkout --quiet --detach FETCH_HEAD 2>>"${resolver_clone_log}"; then
              echo "::warning::Failed to stage canonical integration resolver ref ${resolver_ref}; using main fallback."
              if [ -s "${resolver_clone_log}" ]; then
                sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g' "${resolver_clone_log}" | sed -n '1,20p'
              fi
            fi
          elif resolver_git clone --quiet --depth 1 --branch main "${resolver_repo_url}" "${resolver_stage_fallback}" 2>>"${resolver_clone_log}"; then
            resolver_script="${resolver_stage_fallback}/scripts/resolve_integration_ref.sh"
          else
            echo "::warning::Failed to stage canonical integration resolver; falling back to default branch."
            if [ -s "${resolver_clone_log}" ]; then
              sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g' "${resolver_clone_log}" | sed -n '1,20p'
            fi
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "${resolver_script}" ]; then
            echo "::warning::Canonical integration resolver script not found in staged source; falling back to default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          chmod +x "${resolver_script}"
          if integration_branch="$({
            REPO="${{ github.repository }}" \
            ISSUE="${issue_number}" \
            GH_TOKEN="${GH_TOKEN}" \
            bash "${resolver_script}"
          })"; then
            echo "ref=${integration_branch}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Canonical integration resolver failed; falling back to default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve checkout ref
        if: env.SKIP_IMPLEMENT != 'true'
        id: checkout_ref
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DEFAULT_CHECKOUT_REF: ${{ steps.refctx.outputs.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          issue_meta_matches_issue() {
            local meta_file="${1:-}"
            [ -n "${meta_file}" ] || return 1
            [ -s "${meta_file}" ] || return 1
            jq -er --arg issue_num "${ISSUE_NUMBER}" '
              type == "object"
              and ((.number | tostring) == $issue_num)
              and (has("body") and ((.body // "") | type == "string"))
            ' "${meta_file}" >/dev/null 2>&1
          }

          gh_api_with_retry() {
            local attempt=1
            local backoff=2
            local output=""
            local cmd_status=0
            local stderr_file=""

            stderr_file="$(mktemp "${TMPDIR:-/tmp}/checkout-ref-gh-api.XXXXXX" 2>/dev/null || true)"

            while :; do
              output=""
              cmd_status=0
              if [ -n "${stderr_file}" ]; then
                : > "${stderr_file}"
                output="$("$@" 2>"${stderr_file}")" || cmd_status=$?
              else
                output="$("$@" 2>/dev/null)" || cmd_status=$?
              fi
              if [ "${cmd_status}" -eq 0 ]; then
                if [ -n "${stderr_file}" ]; then
                  rm -f "${stderr_file}" >/dev/null 2>&1 || true
                fi
                printf '%s' "${output}"
                return 0
              fi
              if [ "${attempt}" -ge 3 ]; then
                if [ -n "${stderr_file}" ] && [ -s "${stderr_file}" ]; then
                  cat "${stderr_file}" >&2 || true
                fi
                if [ -n "${stderr_file}" ]; then
                  rm -f "${stderr_file}" >/dev/null 2>&1 || true
                fi
                return "${cmd_status}"
              fi
              sleep "${backoff}"
              backoff=$((backoff * 2))
              attempt=$((attempt + 1))
            done
          }

          checkout_ref="${DEFAULT_CHECKOUT_REF:-${{ github.event.repository.default_branch }}}"
          issue_meta_json=""
          if issue_meta_matches_issue "${ISSUE_META_FILE:-}"; then
            issue_meta_json="$(cat "${ISSUE_META_FILE}")"
          else
            : > "${ISSUE_META_FILE}"
            : > "${ISSUE_BODY_FILE}"
          fi

          if [ -z "${issue_meta_json}" ]; then
            if ! issue_meta_json="$(gh_api_with_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}")"; then
              echo "::warning::Failed to fetch issue metadata for checkout context; using ${checkout_ref}."
              echo "ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
              echo "source=integration/default" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! printf '%s' "${issue_meta_json}" | jq -er --arg issue_num "${ISSUE_NUMBER}" '
            type == "object"
            and ((.number | tostring) == $issue_num)
            and (has("body") and ((.body // "") | type == "string"))
          ' >/dev/null 2>&1; then
            echo "::warning::Ignoring invalid issue metadata for checkout context; using ${checkout_ref}."
            : > "${ISSUE_META_FILE}"
            : > "${ISSUE_BODY_FILE}"
            echo "ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
            echo "source=integration/default" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          issue_body="$(printf '%s' "${issue_meta_json}" | jq -er 'if has("body") then (.body // "") else error("missing body") end' 2>/dev/null)"

          printf '%s\n' "${issue_meta_json}" > "${ISSUE_META_FILE}"
          printf '%s\n' "${issue_body}" > "${ISSUE_BODY_FILE}"

          # Trusted prior_pr_baseline_branch checkout is resolved only by the
          # guarded baseline_refctx step below. This step exists to cache issue
          # metadata for later consumers and to emit the integration/default
          # fallback ref for normal checkout.
          echo "ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
          echo "source=integration/default" >> "$GITHUB_OUTPUT"

      - name: Resolve trusted prior PR baseline branch
        if: env.SKIP_IMPLEMENT != 'true'
        id: baseline_refctx
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association || '' }}
          REISSUE_PRESERVE_BASELINE_ENABLED: ${{ vars.REISSUE_PRESERVE_BASELINE_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          issue_body = os.environ.get("ISSUE_BODY", "")
          issue_body_file = Path(os.environ.get("ISSUE_BODY_FILE", ""))
          if issue_body_file.is_file():
              try:
                  issue_body = issue_body_file.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  print("::notice::Baseline override ignored: ISSUE_BODY_FILE could not be read; falling back to event body.")
          issue_body = issue_body.replace("\r\n", "\n")
          issue_author_association = os.environ.get("ISSUE_AUTHOR_ASSOCIATION", "").strip().upper()
          feature_enabled = os.environ.get("REISSUE_PRESERVE_BASELINE_ENABLED", "false").strip().lower() in {"1", "true", "yes", "on"}
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          trusted_issue_associations = {"OWNER", "MEMBER", "COLLABORATOR"}

          def emit(*, branch: str = "", sha: str = "", status: str) -> None:
              with output_path.open("a", encoding="utf-8") as fh:
                  fh.write(f"branch={branch}\n")
                  if sha:
                      fh.write(f"sha={sha}\n")
                  fh.write(f"status={status}\n")

          def notice(message: str) -> None:
              print(f"::notice::{message}")

          if not feature_enabled:
              notice("Baseline override ignored: REISSUE_PRESERVE_BASELINE_ENABLED is disabled.")
              emit(status="disabled")
              raise SystemExit(0)

          # Review-blocked reissues are created by the repo's trusted GH_PAT
          # identity, so reject baseline overrides on externally authored issues
          # before consulting any user-controlled body metadata.
          if issue_author_association not in trusted_issue_associations:
              notice("Baseline override ignored: issue author association is not trusted for review-blocked baseline reuse.")
              emit(status="issue-author-untrusted")
              raise SystemExit(0)

          metadata_footer_match = re.search(
              r"(?:^|\n)---\n\*\*Review-blocked reissue metadata\*\*\n(?P<block>.*)\Z",
              issue_body,
              re.DOTALL,
          )
          if metadata_footer_match is None:
              notice("Baseline override ignored: review-blocked reissue metadata header is missing.")
              emit(status="metadata-missing")
              raise SystemExit(0)

          metadata_block = metadata_footer_match.group("block")
          metadata_lines = metadata_block.splitlines()
          if not metadata_lines:
              notice("Baseline override ignored: review-blocked reissue metadata footer is incomplete.")
              emit(status="metadata-missing")
              raise SystemExit(0)

          branch_matches: list[str] = []
          files_touched_entries: list[str] = []
          files_touched_blocks = 0
          reissue_type_matches: list[str] = []
          replaces_matches: list[str] = []
          current_key = ""

          for line in metadata_lines:
              if not line.strip():
                  continue

              if line.startswith("- "):
                  current_key = ""

                  replaces_match = re.fullmatch(
                      r"- Replaces:\s*(?:#\d+\s+)?\(PR #(\d+) closed \u2014 approach rework\)\s*",
                      line,
                  )
                  if replaces_match is not None:
                      replaces_matches.append(replaces_match.group(1))
                      continue

                  reissue_type_match = re.fullmatch(r"- Type:\s*(review-blocked-reissue)\s*", line)
                  if reissue_type_match is not None:
                      reissue_type_matches.append(reissue_type_match.group(1))
                      continue

                  branch_line_match = re.fullmatch(r"- prior_pr_baseline_branch:\s*`?\s*([^`\n]+?)\s*`?\s*", line)
                  if branch_line_match is not None:
                      branch_matches.append(branch_line_match.group(1).strip())
                      continue

                  if re.fullmatch(r"- files_touched:\s*", line) is not None:
                      files_touched_blocks += 1
                      current_key = "files_touched"
                      continue

                  notice("Baseline override ignored: review-blocked reissue metadata footer is incomplete.")
                  emit(status="metadata-missing")
                  raise SystemExit(0)

              if line.startswith("  - "):
                  if current_key != "files_touched":
                      notice("Baseline override ignored: review-blocked reissue metadata footer is incomplete.")
                      emit(status="metadata-missing")
                      raise SystemExit(0)

                  file_path = line[4:].strip()
                  if not file_path:
                      notice("Baseline override ignored: files_touched metadata is missing or empty.")
                      emit(status="files-missing")
                      raise SystemExit(0)

                  files_touched_entries.append(file_path)
                  continue

              notice("Baseline override ignored: review-blocked reissue metadata footer is incomplete.")
              emit(status="metadata-missing")
              raise SystemExit(0)

          if len(reissue_type_matches) != 1 or len(replaces_matches) != 1:
              notice("Baseline override ignored: review-blocked reissue metadata footer is incomplete.")
              emit(status="metadata-missing")
              raise SystemExit(0)

          if len(branch_matches) != 1:
              notice("Baseline override ignored: review-blocked reissue metadata footer does not contain exactly one prior_pr_baseline_branch entry.")
              emit(status="absent")
              raise SystemExit(0)

          if files_touched_blocks != 1 or not files_touched_entries:
              notice("Baseline override ignored: files_touched metadata is missing or empty.")
              emit(status="files-missing")
              raise SystemExit(0)

          branch = branch_matches[0].strip()
          branch_match = re.fullmatch(r"ai/reissue-baseline/pr-(\d+)-([0-9a-f]{12})-\d+-\d+", branch)
          if branch_match is None:
              notice("Baseline override ignored: prior_pr_baseline_branch is not in the trusted review-blocked format.")
              emit(status="untrusted")
              raise SystemExit(0)

          expected_pr_number = replaces_matches[0]
          branch_pr_number, sha_prefix = branch_match.groups()
          if branch_pr_number != expected_pr_number:
              notice("Baseline override ignored: prior_pr_baseline_branch PR number does not match reissue metadata.")
              emit(status="pr-mismatch")
              raise SystemExit(0)

          if not repo:
              notice("Baseline override ignored: repository context unavailable for PR validation.")
              emit(status="repo-missing")
              raise SystemExit(0)

          try:
              pr_view = subprocess.run(
                  [
                      "gh",
                      "pr",
                      "view",
                      expected_pr_number,
                      "--repo",
                      repo,
                      "--json",
                      "state,headRefOid",
                  ],
                  capture_output=True,
                  text=True,
                  check=False,
                  timeout=30,
              )
          except (OSError, ValueError, subprocess.SubprocessError):
              notice("Baseline override ignored: failed to verify prior PR baseline branch against GitHub.")
              emit(status="lookup-failed")
              raise SystemExit(0)
          if pr_view.returncode != 0:
              notice("Baseline override ignored: failed to verify prior PR baseline branch against GitHub.")
              emit(status="lookup-failed")
              raise SystemExit(0)

          try:
              pr_payload = json.loads(pr_view.stdout or "{}")
          except json.JSONDecodeError:
              notice("Baseline override ignored: GitHub PR validation response was malformed.")
              emit(status="lookup-failed")
              raise SystemExit(0)

          pr_state = str(pr_payload.get("state") or "")
          pr_head_oid = str(pr_payload.get("headRefOid") or "")
          # Review-blocked reissues are emitted only for PRs closed without
          # merge ("closed — approach rework"), so MERGED stays untrusted here.
          if pr_state != "CLOSED":
              notice("Baseline override ignored: referenced PR is not in the closed review-blocked state.")
              emit(status="pr-open")
              raise SystemExit(0)

          if re.fullmatch(r"[0-9a-f]{40}", pr_head_oid) is None or pr_head_oid[:12] != sha_prefix:
              notice("Baseline override ignored: prior_pr_baseline_branch suffix does not match the closed PR head SHA.")
              emit(status="head-mismatch")
              raise SystemExit(0)

          # The gh pr view call above validates the closed PR head, but it
          # cannot prove the machine-generated baseline ref actually exists or
          # still points at that immutable commit. Resolve the exact ref before
          # honoring the override, then continue to checkout by SHA below.
          try:
              ref_view = subprocess.run(
                  [
                      "gh",
                      "api",
                      f"repos/{repo}/git/matching-refs/heads/{branch}",
                  ],
                  capture_output=True,
                  text=True,
                  check=False,
                  timeout=30,
              )
          except (OSError, ValueError, subprocess.SubprocessError):
              notice("Baseline override ignored: failed to verify prior PR baseline ref against GitHub.")
              emit(status="ref-lookup-failed")
              raise SystemExit(0)
          if ref_view.returncode != 0:
              notice("Baseline override ignored: failed to verify prior PR baseline ref against GitHub.")
              emit(status="ref-lookup-failed")
              raise SystemExit(0)

          try:
              ref_payload = json.loads(ref_view.stdout or "[]")
          except json.JSONDecodeError:
              notice("Baseline override ignored: GitHub baseline ref validation response was malformed.")
              emit(status="ref-lookup-failed")
              raise SystemExit(0)
          if not isinstance(ref_payload, list):
              notice("Baseline override ignored: GitHub baseline ref validation response was malformed.")
              emit(status="ref-lookup-failed")
              raise SystemExit(0)

          exact_refs = [
              item for item in ref_payload
              if isinstance(item, dict) and str(item.get("ref") or "") == f"refs/heads/{branch}"
          ]
          if len(exact_refs) != 1:
              notice("Baseline override ignored: prior PR baseline ref is missing on GitHub.")
              emit(status="ref-missing")
              raise SystemExit(0)

          ref_object = exact_refs[0].get("object")
          ref_oid = str(ref_object.get("sha") or "") if isinstance(ref_object, dict) else ""
          if re.fullmatch(r"[0-9a-f]{40}", ref_oid) is None:
              notice("Baseline override ignored: prior PR baseline ref did not resolve to a commit SHA.")
              emit(status="ref-missing")
              raise SystemExit(0)
          if ref_oid != pr_head_oid:
              notice("Baseline override ignored: prior PR baseline ref no longer points at the closed PR head SHA.")
              emit(status="ref-mismatch")
              raise SystemExit(0)

          notice(f"Baseline override accepted: {branch}")
          emit(branch=branch, sha=pr_head_oid, status="accepted")
          PY

      - name: Checkout prior PR baseline branch
        if: env.SKIP_IMPLEMENT != 'true' && steps.baseline_refctx.outputs.branch != ''
        id: checkout_baseline
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.baseline_refctx.outputs.sha || steps.baseline_refctx.outputs.branch }}
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Checkout repository
        if: env.SKIP_IMPLEMENT != 'true' && (steps.baseline_refctx.outputs.branch == '' || steps.checkout_baseline.outcome != 'success')
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.checkout_ref.outputs.ref || steps.refctx.outputs.ref || github.event.repository.default_branch }}
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Configure git auth for memory helper clones
        if: env.SKIP_IMPLEMENT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_PAT is empty"; exit 1; }
          SERVER_HOST="${GITHUB_SERVER_URL#https://}"
          SERVER_HOST="${SERVER_HOST#http://}"
          SERVER_HOST="${SERVER_HOST%/}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}"

      - name: Resolve workflow support ref
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            echo "SCRIPT_REF=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "SCRIPT_REF=stable" >> "$GITHUB_ENV"
          fi

      - name: Checkout workflow support source
        if: env.SKIP_IMPLEMENT != 'true'
        id: checkout_support_source
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ env.SCRIPT_REF }}
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Checkout workflow support source fallback
        if: env.SKIP_IMPLEMENT != 'true' && steps.checkout_support_source.outcome == 'failure'
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Ensure workflow support source checkout
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail
          if [ ! -d .codex-workflow-src ]; then
            echo "::error::Failed to checkout workflow support source from ${SCRIPT_REF} or main"
            exit 1
          fi

      - name: Checkout workflow support source main snapshot
        if: env.SKIP_IMPLEMENT != 'true' && env.SCRIPT_REF != 'main'
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src-main
          fetch-depth: 1

      - name: Stage workflow support files
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"

          FETCHED_MANIFEST="${RUNTIME_DIR}/fetched_files.txt"
          : > "${FETCHED_MANIFEST}"
          echo "FETCHED_MANIFEST=${FETCHED_MANIFEST}" >> "$GITHUB_ENV"

          is_self_repo="false"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            is_self_repo="true"
          fi

          mkdir -p scripts
          _fetched_scripts=()
          for f in gh_helpers.sh git_ref_health_check.sh render_prompt.sh assemble_prompt.sh render_prompt.py load_workflow_overlay.py validate_changed_files_syntax.sh tg_helpers.sh label_helpers.sh memory_helpers.sh ai_memory.py ai_memory_lib.py memory_injection_patterns.py openrouter_prompt_cache.py implement_diagnose_post_codex_failure.sh implement_commit_changes.sh build_static_context.sh targeted_file_context.py write_codex_config.sh codex_helpers.sh codex_stall_guard.sh watchdog_helpers.sh write_guard.sh ledger_emit_substate.sh orchestrate_force_tick.sh workspace_init.sh workspace_safety_check.sh run_workspace_hook.sh codex_thread_reuse.sh lint_pr_body_auto_close.py; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::error::Missing required support script ${f} in ${wf_source}@${SCRIPT_REF}"
              exit 1
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")
            # Intentionally NOT adding scripts/${f} to FETCHED_MANIFEST —
            # see the persistence note above the loop.
          done

          # Optional: files_touched scope-enforcement guard helper. Fail-open —
          # if it is unavailable on ${SCRIPT_REF} (e.g. ref skew during a
          # rollout) the scope guard steps degrade to a logged skip rather than
          # blocking implementation. Added to _fetched_scripts so the generated
          # scripts/.gitignore keeps it out of consumer-repo commits (and out of
          # the staged set the scope guard inspects).
          for f in files_touched_scope_guard.py; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::notice::Optional files_touched scope guard ${f} is unavailable on ${SCRIPT_REF}; scope enforcement will fail open this run."
              continue
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")
          done

          # render_prompt.py is the optional Python backend for the
          # render_prompt.sh shim adopted by branches that took the issue
          # #3043 refactor.  main ships a self-contained bash render_prompt.sh
          # that needs no backend, so the file is absent on main and must be
          # staged only when the branch under processing actually carries it.
          # Absence is expected (non-shim branches, incl. main) and must not
          # fail the bootstrap; presence stages it beside the shim so the
          # shim resolves ${SCRIPT_DIR}/render_prompt.py.
          for f in render_prompt.py; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::notice::Optional render_prompt.py backend unavailable on ${SCRIPT_REF}; render_prompt.sh shim (if present) resolves it elsewhere or the bundled bash renderer is used."
              continue
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")
          done

          for f in setup_serena.sh serena_stats_emit.py mcp_handshake_probe.py; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::notice::Optional Serena support asset ${f} is unavailable on ${SCRIPT_REF}; Serena bootstrap remains disabled."
              continue
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")
          done

          for f in emit_event.sh emit_event.py; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::notice::Optional events mirror helper ${f} is unavailable on ${SCRIPT_REF}; stable text-prefix mirroring remains disabled."
              continue
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")
          done

          for f in transcript_archive.sh; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::notice::Optional transcript archive helper ${f} is unavailable on ${SCRIPT_REF}; transcript archiving remains disabled."
              continue
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")
          done

          mkdir -p scripts/templates
          serena_template_src=".codex-workflow-src/scripts/templates/serena_project.yml.j2"
          if [ ! -f "${serena_template_src}" ] && [ -f ".codex-workflow-src-main/scripts/templates/serena_project.yml.j2" ]; then
            serena_template_src=".codex-workflow-src-main/scripts/templates/serena_project.yml.j2"
          fi
          if [ ! -f "${serena_template_src}" ]; then
            echo "::notice::Optional Serena template scripts/templates/serena_project.yml.j2 is unavailable on ${SCRIPT_REF}; Serena bootstrap remains disabled."
          elif [ "${is_self_repo}" = "false" ] && git ls-files --error-unmatch -- "scripts/templates/serena_project.yml.j2" >/dev/null 2>&1; then
            echo "::notice::Consumer repo already tracks scripts/templates/serena_project.yml.j2; preserving caller-owned Serena template."
          else
            install -m 0644 "${serena_template_src}" "scripts/templates/serena_project.yml.j2"
            if [ "${is_self_repo}" = "false" ]; then
              echo "scripts/templates/serena_project.yml.j2" >> "${FETCHED_MANIFEST}"
            fi
          fi

          for f in install_semble.sh build_semble_wrapper.sh semble_helpers.sh; do
            if [ "${is_self_repo}" = "true" ] && [ ! -f "scripts/${f}" ]; then
              echo "::notice::Optional Semble support script ${f} is not tracked in this checkout; skipping canonical self-repo bootstrap."
              continue
            fi
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::notice::Optional Semble support script ${f} is unavailable on ${SCRIPT_REF}; legacy path remains active."
              continue
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")

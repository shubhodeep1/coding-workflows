---
name: AI Implement

"on":
  workflow_call:
    secrets:
      GH_PAT:
        required: true
      OPENROUTER_API_KEY:
        required: true
      TG_BOT_SECRET:
        required: false

env:
  MODEL_EDITOR: ${{ vars.WORKFLOW_EDITOR_MODEL || 'openai/gpt-5.3-codex' }}
  MODEL_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_IMPLEMENT || 'high' }}
  OPENROUTER_PROMPT_CACHE_DISABLED: ${{ vars.OPENROUTER_PROMPT_CACHE_DISABLED || 'false' }}
  ALLOW_WORKFLOW_EDITS: ${{ vars.ALLOW_WORKFLOW_EDITS || 'true' }}

jobs:
  implement:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request == null &&
      (
        (
          github.event.comment.user.type == 'User' &&
          contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          startsWith(github.event.comment.body, '/approved')
        ) ||
        (
          github.event.comment.user.type == 'Bot' &&
          github.event.comment.user.login == 'github-actions[bot]' &&
          startsWith(github.event.comment.body, '/approved') &&
          contains(github.event.comment.body, '[auto-approved-by-plan]')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: ai-implement-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      APPROVAL_COMMENT_ID: ${{ github.event.comment.id }}
      SKIP_IMPLEMENT: "false"
      RESTORE_AWAITING_APPROVAL_ON_SKIP: "false"

    steps:
      - name: Precheck approval phase label
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          ISSUE_LABELS_JSON="$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}" --jq '[.labels[].name]')"
          if printf '%s' "${ISSUE_LABELS_JSON}" | jq -e 'index("ai:implementing") != null' >/dev/null; then
            echo "Issue #${ISSUE_NUMBER} already has ai:implementing label. Another implement run is in progress. Skipping."
            echo "SKIP_IMPLEMENT=true" >> "$GITHUB_ENV"
          elif ! printf '%s' "${ISSUE_LABELS_JSON}" | jq -e 'index("ai:awaiting-approval") != null' >/dev/null; then
            echo "Issue #${ISSUE_NUMBER} is not in ai:awaiting-approval phase. Skipping implementation steps."
            echo "SKIP_IMPLEMENT=true" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail
          CODEX_VERSION="${{ vars.CODEX_VERSION || 'v0.114.0' }}"
          npm install -g @openai/codex@"${CODEX_VERSION}" --no-audit --no-fund

      - name: Install uv for Serena
        if: env.SKIP_IMPLEMENT != 'true'
        uses: astral-sh/setup-uv@v7

      - name: Create runtime workspace
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail
          RUNTIME_DIR="/tmp/codex-implement-${GITHUB_RUN_ID}"
          mkdir -p "${RUNTIME_DIR}"

          {
            echo "JOB_START_EPOCH=$(date +%s)"
            echo "RUNTIME_DIR=${RUNTIME_DIR}"
            echo "ISSUE_META_FILE=${RUNTIME_DIR}/issue_meta.json"
            echo "ISSUE_BODY_FILE=${RUNTIME_DIR}/issue_body.txt"
            echo "ISSUE_COMMENTS_FILE=${RUNTIME_DIR}/issue_comments.json"
            echo "ISSUE_SUMMARY_PROMPT_FILE=${RUNTIME_DIR}/issue_summary_prompt.txt"
            echo "ISSUE_SUMMARY_FILE=${RUNTIME_DIR}/issue_summary.md"
            echo "IMPLEMENTATION_CONTEXT_FILE=${RUNTIME_DIR}/implementation_context.txt"
            echo "CODEX_PROMPT_FILE=${RUNTIME_DIR}/codex_prompt.txt"
            echo "CODEX_OUTPUT_FILE=${RUNTIME_DIR}/codex_output.txt"
            echo "PLAN_FILE=${RUNTIME_DIR}/implementation_plan.txt"
            echo "CLARIFICATION_ANSWERS_FILE=${RUNTIME_DIR}/clarification_answers.txt"
            echo "PR_EXISTS_FILE=${RUNTIME_DIR}/existing_prs.txt"
            echo "MEMORY_CONTEXT_FILE=${RUNTIME_DIR}/memory_context.txt"
            echo "CHANGED_FILES_FILE=${RUNTIME_DIR}/changed_files.txt"
            echo "PR_METADATA_FILE=${RUNTIME_DIR}/pr_metadata.json"
            echo "TARGET_BRANCH=ai/issue-${ISSUE_NUMBER}"
          } >> "$GITHUB_ENV"

      - name: Safety check for existing PR
        if: env.SKIP_IMPLEMENT != 'true'
        id: existing_pr_check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          gh pr list --repo "${{ github.repository }}" --search "issue:${ISSUE_NUMBER}" --state open --json number,url --jq '.[] | "#\(.number) \(.url)"' > "${PR_EXISTS_FILE}" || true

          if [ -s "${PR_EXISTS_FILE}" ]; then
            echo "existing_pr=true" >> "$GITHUB_OUTPUT"
            {
              echo "Existing PR(s) found for issue ${ISSUE_NUMBER}:"
              cat "${PR_EXISTS_FILE}"
            }
          else
            echo "existing_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Telegram duplicate PR notification
        if: env.SKIP_IMPLEMENT != 'true' && steps.existing_pr_check.outputs.existing_pr == 'true'
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
        run: |
          set -euo pipefail
          # tg_helpers.sh not yet fetched at this step; inline-fetch it
          wf_source="${{ github.repository_owner }}/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            script_ref="${{ github.sha }}"
          else
            script_ref="stable"
          fi
          mkdir -p scripts
          helpers_tmp="$(mktemp)"
          if gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${wf_source}/contents/scripts/tg_helpers.sh?ref=${script_ref}" > "${helpers_tmp}" 2>/dev/null && [ -s "${helpers_tmp}" ]; then
            mv "${helpers_tmp}" "scripts/tg_helpers.sh"
            source scripts/tg_helpers.sh
          else
            rm -f "${helpers_tmp}"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="Skipping implementation for issue #${ISSUE_NUMBER} — PR already exists."
          MSG+=$'\n'
          MSG+="Issue: ${ISSUE_URL}"
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          if declare -F tg_send_tracked >/dev/null 2>&1; then
            tg_send_tracked "${ISSUE_NUMBER}" "${MSG}" "WARNING"
          else
            echo "::warning::Telegram helper unavailable; skipping duplicate PR Telegram notification."
          fi

      - name: Exit when existing PR is found
        if: env.SKIP_IMPLEMENT != 'true' && steps.existing_pr_check.outputs.existing_pr == 'true'
        run: |
          echo "Existing PR already present for this issue; exiting safely."
          exit 0

      - name: Checkout repository
        if: env.SKIP_IMPLEMENT != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Configure git auth for memory helper clones
        if: env.SKIP_IMPLEMENT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_PAT is empty"; exit 1; }
          SERVER_HOST="${GITHUB_SERVER_URL#https://}"
          SERVER_HOST="${SERVER_HOST#http://}"
          SERVER_HOST="${SERVER_HOST%/}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}"

      - name: Fetch workflow support scripts
        if: env.SKIP_IMPLEMENT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # When called as a reusable workflow from another repo, the caller's
          # repo is checked out and this repo's scripts/ directory is absent.
          # NOTE: github.workflow_ref resolves to the *caller* workflow, not
          # this reusable workflow, so we cannot derive the source repo from it.
          wf_source="${{ github.repository_owner }}/coding-workflows"
          # When running within coding-workflows itself, use the current
          # commit to avoid version skew with the stable tag (stable is
          # only updated after e2e tests pass — causes bootstrap failures).
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            script_ref="${{ github.sha }}"
          else
            script_ref="stable"
          fi

          # Track files fetched by the workflow so cleanup only removes what
          # we created — never files that already belong to the caller repo.
          # On coding-workflows itself these files are actual source code, so
          # the manifest stays empty and cleanup becomes a no-op.
          FETCHED_MANIFEST="${RUNTIME_DIR}/fetched_files.txt"
          : > "${FETCHED_MANIFEST}"
          echo "FETCHED_MANIFEST=${FETCHED_MANIFEST}" >> "$GITHUB_ENV"
          is_self_repo="false"
          if [[ "${{ github.repository }}" == *"/coding-workflows" ]]; then
            is_self_repo="true"
          fi

          # ALWAYS fetch canonical scripts from coding-workflows, even if the
          # caller repo ships its own scripts/ directory. Stale caller-repo
          # scripts cause silent MCP failures.
          mkdir -p scripts
          # Bootstrap: rate-limit-aware fetch (gh_helpers.sh not yet available)
          _rl_wait() {
            local _reset_ts _wait_secs
            _reset_ts=$(gh api -i /rate_limit 2>/dev/null | grep -i '^x-ratelimit-reset:' | head -1 | awk '{print $2}' | tr -d '\r') || true
            if [ -n "${_reset_ts}" ] && [ "${_reset_ts}" -gt 0 ] 2>/dev/null; then
              _wait_secs=$(( _reset_ts - $(date +%s) + 1 ))
              [ "${_wait_secs}" -lt 1 ] && _wait_secs=1
              [ "${_wait_secs}" -gt 600 ] && _wait_secs=600
            else
              _wait_secs=30
            fi
            echo "::warning::  Rate limit resets in ${_wait_secs}s (X-RateLimit-Reset: ${_reset_ts:-unknown})" >&2
            sleep "${_wait_secs}"
          }
          _gh_api_fetch() {
            local outfile="$1"; shift
            local attempt=1
            while [ "${attempt}" -le 5 ]; do
              if gh "$@" > "${outfile}" 2>/tmp/_gh_rl_err; then return 0; fi
              if grep -qiE 'rate limit|abuse detection|secondary rate|HTTP 429' /tmp/_gh_rl_err 2>/dev/null; then
                echo "::warning::Rate limit hit during fetch (attempt ${attempt}/5), waiting for reset…" >&2
                _rl_wait; attempt=$((attempt + 1))
              else return 1; fi
            done; return 1
          }
          _fetched_scripts=()
          for f in gh_helpers.sh setup_serena.sh git_ref_health_check.sh render_prompt.sh serena_efficiency_report.py tg_helpers.sh label_helpers.sh memory_helpers.sh ai_memory.py ai_memory_lib.py openrouter_prompt_cache.py; do
            if ! _gh_api_fetch "scripts/${f}" api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${wf_source}/contents/scripts/${f}?ref=${script_ref}"; then
              echo "::warning::${f} not found on ${script_ref}; falling back to main"
              _gh_api_fetch "scripts/${f}" api -H 'Accept: application/vnd.github.raw+json' \
                "repos/${wf_source}/contents/scripts/${f}?ref=main"
            fi
            case "${f}" in
              *.sh|*.py)
                chmod +x "scripts/${f}"
                ;;
            esac
            _fetched_scripts+=("${f}")
            if [ "${is_self_repo}" = "false" ]; then
              echo "scripts/${f}" >> "${FETCHED_MANIFEST}"
            fi
          done
          # Block fetched scripts from being committed in consumer repos.
          if [ "${is_self_repo}" = "false" ]; then
            {
              echo "# Auto-generated by coding-workflows — DO NOT EDIT"
              echo "# Prevents runtime-fetched support scripts from being committed."
              printf '%s\n' "${_fetched_scripts[@]}" .gitignore
            } > scripts/.gitignore
          fi
          # Fetch AI memory schema files so consumer repos that lack
          # schemas on their default branch can bootstrap the ai-memory
          # branch (schemas are validated during memory operations).
          mkdir -p ai-memory/schemas
          for sf in memory_record.v1.json processed_command_entry.v1.json run_ledger_entry.v1.json task_lineage.v1.json; do
            if [ ! -f "ai-memory/schemas/${sf}" ]; then
              schema_tmp="ai-memory/schemas/${sf}.tmp"
              if _gh_api_fetch "${schema_tmp}" api -H 'Accept: application/vnd.github.raw+json' \
                "repos/${wf_source}/contents/ai-memory/schemas/${sf}?ref=${script_ref}"; then
                mv "${schema_tmp}" "ai-memory/schemas/${sf}"
              else
                rm -f "${schema_tmp}"
              fi
              if [ "${is_self_repo}" = "false" ]; then
                echo "ai-memory/schemas/${sf}" >> "${FETCHED_MANIFEST}"
              fi
            fi
          done
          # Always use the canonical instruction files from coding-workflows
          # (must not be gated on is_external — caller repos that ship their
          # own scripts/ still need these canonical md files)
          for f in codex_system_instructions.md ai_pipeline.md; do
            if [ ! -f "${f}" ]; then
              if ! _gh_api_fetch "${f}" api -H 'Accept: application/vnd.github.raw+json' \
                "repos/${wf_source}/contents/${f}?ref=${script_ref}"; then
                echo "::warning::${f} not found on ${script_ref}; falling back to main"
                _gh_api_fetch "${f}" api -H 'Accept: application/vnd.github.raw+json' \
                  "repos/${wf_source}/contents/${f}?ref=main"
              fi
              if [ "${is_self_repo}" = "false" ]; then
                echo "${f}" >> "${FETCHED_MANIFEST}"
              fi
            fi
          done

          mkdir -p prompts
          if [ ! -f prompts/serena-efficiency-block.txt ]; then
            if ! _gh_api_fetch "prompts/serena-efficiency-block.txt" api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${wf_source}/contents/prompts/serena-efficiency-block.txt?ref=${script_ref}"; then
              echo "::warning::serena-efficiency-block.txt not found on ${script_ref}; falling back to main"
              _gh_api_fetch "prompts/serena-efficiency-block.txt" api -H 'Accept: application/vnd.github.raw+json' \
                "repos/${wf_source}/contents/prompts/serena-efficiency-block.txt?ref=main"
            fi
            if [ "${is_self_repo}" = "false" ]; then
              echo "prompts/serena-efficiency-block.txt" >> "${FETCHED_MANIFEST}"
            fi
          fi

          # Fetch canonical agents.md from coding-workflows into the runtime
          # directory. This is combined with the caller repo's own agents.md
          # (if any) during prompt assembly — the caller's copy is never
          # overwritten or deleted.
          _gh_api_fetch "${RUNTIME_DIR}/agents_canonical.md" api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${wf_source}/contents/agents.md?ref=${script_ref}" || true

      - name: Fetch issue metadata
        if: env.SKIP_IMPLEMENT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry &>/dev/null || gh_retry() { "$@"; }

          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}" > "${ISSUE_META_FILE}"

          ISSUE_BODY="$(jq -r '.body // ""' "${ISSUE_META_FILE}")"
          ISSUE_TITLE="$(jq -r '.title // ""' "${ISSUE_META_FILE}")"
          ISSUE_NUMBER_JSON="$(jq -r '.number' "${ISSUE_META_FILE}")"
          ISSUE_URL_JSON="$(jq -r '.html_url' "${ISSUE_META_FILE}")"
          PR_BASE_BRANCH="${{ github.event.repository.default_branch }}"
          INTEGRATION_BRANCH_RAW="$(printf '%s\n' "${ISSUE_BODY}" | awk '
            /^\*\*Orchestrator metadata\*\* \(do not edit\)$/ { in_meta = 1; next }
            in_meta && /^- Integration branch: / { sub(/^- Integration branch: /, ""); print; exit }
          ' | tr -d '\r')"

          if [ -n "${INTEGRATION_BRANCH_RAW}" ]; then
            if printf '%s' "${INTEGRATION_BRANCH_RAW}" | grep -Eq '^orchestrator/project-[0-9]+$'; then
              INTEGRATION_BRANCH_REF="$(printf '%s' "${INTEGRATION_BRANCH_RAW}" | jq -sRr @uri)"
              if gh_retry gh api "repos/${{ github.repository }}/git/ref/heads/${INTEGRATION_BRANCH_REF}" >/dev/null 2>&1; then
                PR_BASE_BRANCH="${INTEGRATION_BRANCH_RAW}"
              else
                echo "::warning::Ignoring integration branch from metadata because it does not exist: ${INTEGRATION_BRANCH_RAW}"
              fi
            else
              echo "::warning::Ignoring integration branch from metadata because format is invalid: ${INTEGRATION_BRANCH_RAW}"
            fi
          fi

          printf '%s\n' "${ISSUE_BODY}" > "${ISSUE_BODY_FILE}"

          # TRUST BOUNDARY: ISSUE_BODY is user-controlled content from the GitHub
          # issue. It is passed via heredoc (not shell expansion) to prevent injection
          # into shell commands. Downstream consumers must treat it as untrusted input.
          {
            echo "ISSUE_NUMBER=${ISSUE_NUMBER_JSON}"
            echo "ISSUE_URL=${ISSUE_URL_JSON}"
            echo "PR_BASE_BRANCH=${PR_BASE_BRANCH}"
            echo 'ISSUE_TITLE<<EOF'
            echo "${ISSUE_TITLE}"
            echo 'EOF'
            echo 'ISSUE_BODY<<EOF'
            echo "${ISSUE_BODY}"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Detect smoke test and tune LLM settings
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail
          ISSUE_TITLE="$(jq -r '.title // ""' "${ISSUE_META_FILE}")"
          if echo "${ISSUE_TITLE}" | grep -qi '\[E2E Smoke Test\]'; then
            echo "🔬 Smoke test detected — switching to low reasoning effort"
            echo "MODEL_REASONING_EFFORT=low" >> "$GITHUB_ENV"
          fi

      - name: Fetch issue comments
        if: env.SKIP_IMPLEMENT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          found_approval_comment="false"
          for attempt in 1 2 3 4 5; do
            if ! { gh api --paginate "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments?per_page=100" | jq -s 'add // []' > "${ISSUE_COMMENTS_FILE}"; } 2>/dev/null; then
              echo "Attempt ${attempt}: API call failed, retrying..."
              sleep $((attempt * 2))
              continue
            fi
            if jq -e --arg approval_comment_id "${APPROVAL_COMMENT_ID}" 'any(.[]; (.id | tostring) == $approval_comment_id)' "${ISSUE_COMMENTS_FILE}" >/dev/null; then
              found_approval_comment="true"
              break
            fi
            sleep $((attempt * 2))
          done

          if [ "${found_approval_comment}" != "true" ]; then
            echo "Unable to fetch triggering approval comment from issue comments."
            exit 1
          fi

      - name: Validate approval phase label
        if: env.SKIP_IMPLEMENT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry &>/dev/null || gh_retry() { "$@"; }
          source scripts/label_helpers.sh
          ISSUE_LABELS_JSON="$(gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}" --jq '[.labels[].name]')"
          if ! printf '%s' "${ISSUE_LABELS_JSON}" | jq -e 'index("ai:awaiting-approval") != null' >/dev/null; then
            echo "Issue #${ISSUE_NUMBER} is not in ai:awaiting-approval phase. Exiting safely."
            echo "SKIP_IMPLEMENT=true" >> "$GITHUB_ENV"
            exit 0
          fi
          ensure_label_exists "ai:implementing" "${{ github.repository }}"
          gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${{ github.repository }}" \
            --add-label 'ai:implementing' --remove-label 'ai:awaiting-approval' >/dev/null 2>&1 || true
          echo "RESTORE_AWAITING_APPROVAL_ON_SKIP=true" >> "$GITHUB_ENV"

      - name: Claim /approved command
        if: env.SKIP_IMPLEMENT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh
          memory_ensure_branch

          check_json="$(memory_processed_command_check \
            --issue-number "${ISSUE_NUMBER}" \
            --comment-id "${APPROVAL_COMMENT_ID}" \
            --command approved)"
          already_processed="$(printf '%s' "${check_json}" | jq -r '.exists // false')"
          if [ "${already_processed}" = "true" ]; then
            echo "Approval comment ${APPROVAL_COMMENT_ID} already processed. Skipping duplicate implementation run."
            echo "SKIP_IMPLEMENT=true" >> "$GITHUB_ENV"
            echo "RESTORE_AWAITING_APPROVAL_ON_SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi

          claim_json="$(memory_processed_command_claim \
            --issue-number "${ISSUE_NUMBER}" \
            --comment-id "${APPROVAL_COMMENT_ID}" \
            --command approved \
            --workflow implement \
            --actor "${{ github.actor }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --metadata-json "$(jq -cn --arg issue_url "${ISSUE_URL}" --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{issue_url: $issue_url, run_url: $run_url}')")"

          memory_enabled="$(printf '%s' "${AI_MEMORY_ENABLED:-true}" | tr '[:upper:]' '[:lower:]')"
          if [ -z "${claim_json}" ] && ! [[ "${memory_enabled}" =~ ^(1|true|yes|on)$ ]]; then
            claimed="true"
          else
            claimed="$(printf '%s' "${claim_json}" | jq -r '.operation_result.claimed // .claimed // false')"
          fi
          if [ "${claimed}" != "true" ]; then
            echo "Approval comment ${APPROVAL_COMMENT_ID} was not claimed for this run. Skipping duplicate implementation run."
            echo "SKIP_IMPLEMENT=true" >> "$GITHUB_ENV"
            echo "RESTORE_AWAITING_APPROVAL_ON_SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi

      - name: Record implementation run start event
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh

          memory_record_run_event \
            --run-id "${{ github.run_id }}" \
            --workflow implement \
            --event-type phase_started \
            --status ok \
            --message "Implementation phase started" \
            --issue-number "${ISSUE_NUMBER}" \
            --actor "${{ github.actor }}" \
            --metadata-json "$(jq -cn --arg approval_comment_id "${APPROVAL_COMMENT_ID}" --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{approval_comment_id: $approval_comment_id, run_url: $run_url}')"

      - name: Cleanup plan-phase Telegram messages
        if: env.SKIP_IMPLEMENT != 'true'
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/tg_helpers.sh
          tg_cleanup_phase_msgs "${ISSUE_NUMBER}" "plan"

      - name: Extract implementation plan
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail

          # Extract the most recent implementation plan comment at or before the triggering /approved comment.
          # Only trusted plan authors are accepted to block untrusted comment injection.
          jq -r --arg approval_comment_id "${APPROVAL_COMMENT_ID}" '
            sort_by(.created_at) |
            # Resolve the exact /approved comment that triggered this workflow run.
            ([.[] | select(
              ((.id | tostring) == $approval_comment_id) and
              ((.body // "") | test("(?i)/approved"))
            )] | if length > 0 then .[0] else null end) as $approval |
            if $approval == null then ""
            else
              # Find the most recent trusted implementation plan before or at this approval.
              [.[] | select(
                ((.body // "") | test("(?im)^\\s*implementation\\s+plan\\b")) and
                (.created_at <= $approval.created_at) and
                (
                  (
                    (.user.type == "Bot") and
                    ((.user.login // "") as $bot_login | ["github-actions[bot]", "codex-bot[bot]"] | index($bot_login))
                  ) or
                  ((.author_association // "") as $assoc | ["OWNER", "MEMBER", "COLLABORATOR"] | index($assoc))
                )
              )] |
              if length > 0 then .[-1].body else "" end
            end
          ' "${ISSUE_COMMENTS_FILE}" > "${PLAN_FILE}"

          if [ ! -s "${PLAN_FILE}" ] || ! grep -qiE '^[[:space:]]*implementation[[:space:]]+plan\b' "${PLAN_FILE}"; then
            echo "Unable to locate approved Implementation Plan in issue comments."
            exit 1
          fi

      - name: Extract clarification answers
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail

          jq -r 'sort_by(.created_at)
            | map(select(.user.type == "User" and ((.body // "") | test("(?i)^\\s*/answer\\b"))))
            | if length == 0 then "None" else .[] | "[" + (.created_at // "") + "] @" + (.user.login // "unknown") + ":\n" + (.body // "") + "\n" end' "${ISSUE_COMMENTS_FILE}" > "${CLARIFICATION_ANSWERS_FILE}"

      - name: Build implementation context
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail
          {
            echo "ISSUE DESCRIPTION"
            printf '%s\n\n' "${ISSUE_BODY}"
            echo "CLARIFICATION ANSWERS"
            cat "${CLARIFICATION_ANSWERS_FILE}"
            echo
            echo "APPROVED IMPLEMENTATION PLAN"
            cat "${PLAN_FILE}"
            echo
            echo "ISSUE COMMENTS"
            jq -r 'sort_by(.created_at)[] | "[" + (.created_at // "") + "] @" + (.user.login // "unknown") + ":\n" + (.body // "") + "\n"' "${ISSUE_COMMENTS_FILE}"
          } > "${IMPLEMENTATION_CONTEXT_FILE}"

      - name: Create Codex config
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.codex
          {
            echo 'web_search = "disabled"'
            echo 'model_provider = "openrouter"'
            echo "model = \"${MODEL_EDITOR}\""
            echo "model_reasoning_effort = \"${MODEL_REASONING_EFFORT}\""
            echo
            echo '[model_providers.openrouter]'
            echo 'name = "OpenRouter"'
            echo 'base_url = "https://openrouter.ai/api/v1"'
            echo 'env_key = "OPENROUTER_API_KEY"'
            echo 'wire_api = "responses"'
            echo 'stream_idle_timeout_ms = 600000'
            echo 'stream_max_retries = 5'
            echo 'request_max_retries = 3'
            echo
            echo '[sandbox_workspace_write]'
            echo 'network_access = true'
          } > ~/.codex/config.toml
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

          # MCP server configuration is managed in ~/.codex/config.toml;
          # setup_serena.sh appends the relevant [mcp_servers.*] entries.

      - name: Setup Serena MCP server
        if: env.SKIP_IMPLEMENT != 'true'
        env:
          SERENA_VERSION: ${{ vars.SERENA_VERSION || 'main' }}
          SERENA_LANGUAGES: ${{ vars.SERENA_LANGUAGES || '' }}
          SERENA_DISABLED: ${{ vars.SERENA_DISABLED || 'false' }}
          CONTEXT7_DISABLED: ${{ vars.CONTEXT7_DISABLED || 'false' }}
          GIT_MCP_DISABLED: ${{ vars.GIT_MCP_DISABLED || 'false' }}
          SERENA_IGNORED_DIRS: ${{ vars.SERENA_IGNORED_DIRS || '' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          bash scripts/setup_serena.sh --mode editing --context codex

      - name: Pre-assemble static context (cacheable across runs)
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail

          if [ ! -f codex_system_instructions.md ] || [ ! -f ai_pipeline.md ]; then
            echo "Missing required codex input file(s): codex_system_instructions.md and/or ai_pipeline.md"
            exit 1
          fi

          # Split context into static (constant across runs) and dynamic (per-issue)
          # files. This enables LLM prompt caching: the static prefix is identical
          # across all runs, so the provider can cache it and charge reduced rates
          # for subsequent requests.
          {
            echo "=== SYSTEM INSTRUCTIONS (implementation-trimmed) ==="
            # Include Serena + sections 0-6 + code style + FINAL REMINDER.
            awk '/^## 7\./{exit} {print}' codex_system_instructions.md
            echo
            awk '/^## 9\. Code Style/,/^## 10\./{if ($0 ~ /^## 10\./) exit; print}' codex_system_instructions.md
            echo
            awk '/^## FINAL REMINDER$/,0{print}' codex_system_instructions.md
            echo

            echo "=== AI PIPELINE (implementation-trimmed) ==="
            # Keep shared runtime behavior and implementation phase details only.
            awk '
              /^## Shared Runtime Behavior/{in_shared=1}
              /^## Phase 1/{in_shared=0}
              /^## Phase 3/{in_impl=1}
              /^## Failure Handling/{in_impl=0}
              { if (in_shared || in_impl) print }
            ' ai_pipeline.md
            echo

            # Include agents.md context: canonical from coding-workflows plus
            # the caller repo's own agents.md (if present). Both are included
            # so the model has the full picture.
            if [ -f "${RUNTIME_DIR}/agents_canonical.md" ] || [ -f agents.md ]; then
              echo "=== AGENTS.MD ==="
              if [ -f "${RUNTIME_DIR}/agents_canonical.md" ]; then
                cat "${RUNTIME_DIR}/agents_canonical.md"
                echo
              fi
              if [ -f agents.md ]; then
                echo "=== REPO-SPECIFIC AGENTS.MD ==="
                cat agents.md
                echo
              fi
            fi
          } > ./pre_assembled_static.txt

      - name: Retrieve implementation memory context
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh

          ISSUE_TITLE_JSON="$(jq -r '.title // ""' "${ISSUE_META_FILE}")"
          memory_retrieve "${MEMORY_CONTEXT_FILE}" \
            --role implementation \
            --issue-number "${ISSUE_NUMBER}" \
            --issue-title "${ISSUE_TITLE_JSON}" \
            --issue-body-file "${ISSUE_BODY_FILE}"

      - name: Run Codex implementation
        if: env.SKIP_IMPLEMENT != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOOL_CALL_BUDGET: ${{ vars.TOOL_CALL_BUDGET_IMPLEMENT || '50' }}
          EDITOR_IDLE_TIMEOUT: ${{ vars.EDITOR_IDLE_TIMEOUT || '1200' }}
          EDITOR_MAX_WALL: ${{ vars.EDITOR_MAX_WALL || '3300' }}
        run: |
          set -euo pipefail

          PROMPT_TEMPLATE_FILE="${RUNTIME_DIR}/mode-implement-inline.txt"
          cat > "${PROMPT_TEMPLATE_FILE}" <<'EOF'
          === IMPLEMENTATION TASK ===

          You are executing the IMPLEMENTATION phase of the AI development pipeline.

          Your task is to implement the approved implementation plan.

          IMPORTANT: The system instructions, AI pipeline spec, and agents.md are provided
          ABOVE in this prompt. Do NOT read pre_assembled_static.txt or any of the individual
          source files — they are already loaded.

          The implementation context (issue description, clarification answers, approved
          plan, and comments) is provided BELOW at the end of this prompt — do NOT read
          implementation_context.txt separately.

          Your job:

          1. Implement the approved implementation plan.
          2. Modify repository files as required.
          3. Keep changes minimal and safe.
          4. Avoid modifying unrelated files.

          SERENA MCP EFFICIENCY (MANDATORY):
          {{SERENA_EFFICIENCY_BLOCK_READ_WRITE}}

          EFFICIENCY RULES (MANDATORY — reduces token waste):
          - Read ONLY the specific lines/symbols you need. Do NOT read entire files or
            request large ranges speculatively. Use Serena symbol tools or targeted line
            ranges (e.g. sed -n '10,30p') instead of full-file reads.
          - Never read the same file region twice. Plan your reads upfront.
          - Prefer Serena MCP tools (get_symbols_overview, find_symbol) over raw file reads
            when available — they return only relevant symbols with far fewer tokens.
          - When a Serena search hits its character limit, do NOT fall back to shell grep/rg
            with the same patterns. Refine the Serena query or narrow the scope instead.
          - Aim to keep total tool calls (MCP + shell exec combined) under TOOL_CALL_BUDGET.
            For large refactors that touch many files, exceeding the budget is acceptable —
            the budget is a guideline to prevent waste, not a hard cap.
          - Batch shell searches with && or ;.
          - Do NOT run `git diff` to display your own changes at the end. The CI pipeline
            handles commit and diff reporting separately.
          - Do NOT emit progress/status messages. Output ONLY repository changes.

          CONFLICT DETECTION:
          - Flag any factual conflicts between the implementation plan and the actual
            codebase (e.g., a function name in the plan doesn't match the code, a file
            path referenced in the plan doesn't exist, or an API signature differs).
          - When a conflict is found, note it clearly in your output and proceed with the
            codebase truth (not the plan's assumption).

          Test verification:

          - If `pytest` is not installed, install it via `pip install pytest` before running.
          - When running `npm test`, treat "Missing script" errors as a pass (the project
            has no tests defined), but treat any other test failure as a real error.

          Restrictions:

          - Do not ask clarification questions.
          - Do not change CI workflows.
          - Do not modify ai_pipeline.md or codex_system_instructions.md.

          Your output should be repository changes only.
          EOF

          # Build prompt: static context + instructions + dynamic implementation context,
          # all inlined so the model doesn't waste tool calls reading files.
          # The static prefix (pre_assembled_static.txt) is identical across all
          # runs, enabling LLM provider prompt-prefix caching.
          {
            cat ./pre_assembled_static.txt
            echo
            # Inject the configurable tool call budget before the static heredoc
            echo "TOOL_CALL_BUDGET: ${TOOL_CALL_BUDGET}"
            echo
            bash scripts/render_prompt.sh "${PROMPT_TEMPLATE_FILE}"
            echo
            echo "=== AI MEMORY CONTEXT ==="
            cat "${MEMORY_CONTEXT_FILE}"
            echo
            echo "=== IMPLEMENTATION CONTEXT ==="
            cat "${IMPLEMENTATION_CONTEXT_FILE}"
          } > "${CODEX_PROMPT_FILE}"

          # ── Adaptive progress-aware watchdog for the implement editor ──
          # The Codex process is run in the background with stderr-based
          # heartbeat tracking.  A watchdog monitors idle time (no stderr
          # output) and wall-clock time per attempt.  Before killing an idle
          # process the watchdog probes /proc/<pid>/fd for active network
          # sockets — if connections exist the process is likely waiting on
          # an API response and the idle window is extended.
          # ────────────────────────────────────────────────────────────────

          IMPLEMENT_IDLE_TIMEOUT="${EDITOR_IDLE_TIMEOUT:-1200}"   # 20 min default
          IMPLEMENT_MAX_WALL="${EDITOR_MAX_WALL:-3300}"            # 55 min default
          JOB_TIMEOUT_SECS=$((180 * 60))
          JOB_DEADLINE=$(( ${JOB_START_EPOCH:-$(date +%s)} + JOB_TIMEOUT_SECS ))

          max_attempts=5
          implement_succeeded=false
          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Codex implement attempt ${attempt}/${max_attempts}..."

            # Budget check: skip attempt if not enough time remains
            now_epoch="$(date +%s)"
            remaining=$(( JOB_DEADLINE - now_epoch ))
            if [ "${remaining}" -lt 300 ]; then
              echo "::warning::Skipping attempt ${attempt}: only ${remaining}s remain before job deadline (need 300s minimum)."
              if [ "${implement_succeeded}" = true ]; then
                break
              fi
              echo "::error::Insufficient remaining budget and no successful implement attempt completed."
              exit 1
            fi
            # Cap wall time to remaining budget minus 2-min cleanup buffer
            attempt_wall="${IMPLEMENT_MAX_WALL}"
            budget_cap=$(( remaining - 120 ))
            if [ "${budget_cap}" -lt "${attempt_wall}" ]; then
              attempt_wall="${budget_cap}"
              echo "Implement attempt ${attempt}: capping wall time to ${attempt_wall}s (budget-limited, ${remaining}s remain)."
            fi

            # On retries after a no-op (Codex succeeded but made no file
            # changes), prepend a nudge so the model knows it must actually
            # modify files this time.
            PROMPT_FILE_TO_USE="${CODEX_PROMPT_FILE}"
            if [ "${attempt}" -gt 1 ] && [ -z "$(git status --porcelain)" ]; then
              PROMPT_FILE_TO_USE="${RUNTIME_DIR}/codex_prompt_retry.txt"
              {
                cat <<'RETRY_EOF'
          IMPORTANT: Your previous attempt produced NO file changes. The implementation
          plan requires repository modifications. You MUST create or edit the files
          described in the plan. Do NOT just describe the changes — execute them by
          writing to disk. Proceed now.

          RETRY_EOF
                cat "${CODEX_PROMPT_FILE}"
              } > "${PROMPT_FILE_TO_USE}"
            fi

            # ── Heartbeat file for progress tracking ──
            hb_file="$(mktemp /tmp/heartbeat_implement.XXXXXX)"
            printf '%s' "$(date +%s)" > "${hb_file}.tmp" && mv -f "${hb_file}.tmp" "${hb_file}"
            impl_start="$(date +%s)"
            codex_pid_file="$(mktemp /tmp/codex_pid_implement.XXXXXX)"

            # ── Background watchdog ──
            (
              while true; do
                sleep 15
                wd_now="$(date +%s)"
                last="$(cat "${hb_file}" 2>/dev/null || echo "${wd_now}")"
                if ! [[ "${last}" =~ ^[0-9]+$ ]]; then last="${wd_now}"; fi
                idle_secs=$(( wd_now - last ))
                wall_secs=$(( wd_now - impl_start ))

                # Hard wall-time limit (budget-aware)
                if [ "${wall_secs}" -ge "${attempt_wall}" ]; then
                  echo "Codex killed — wall time ${attempt_wall}s exceeded (attempt ${attempt})." >&2
                  cpid="$(cat "${codex_pid_file}" 2>/dev/null || true)"
                  if [ -n "${cpid}" ]; then kill -TERM "${cpid}" 2>/dev/null; sleep 5; kill -KILL "${cpid}" 2>/dev/null; fi
                  rm -f "${hb_file}"
                  exit 143
                fi

                # Idle check with network-activity probe
                if [ "${idle_secs}" -ge "${IMPLEMENT_IDLE_TIMEOUT}" ]; then
                  cpid="$(cat "${codex_pid_file}" 2>/dev/null || true)"
                  net_active=false
                  if [ -n "${cpid}" ] && [ -d "/proc/${cpid}/fd" ]; then
                    sock_count="$(ls -l "/proc/${cpid}/fd" 2>/dev/null | grep -c ' socket:' || true)"
                    if [ "${sock_count}" -gt 0 ]; then
                      net_active=true
                    fi
                  fi
                  if [ "${net_active}" = true ]; then
                    echo "Codex idle for ${idle_secs}s but has ${sock_count} active socket(s) — extending idle window (attempt ${attempt})." >&2
                    printf '%s' "$(date +%s)" > "${hb_file}.tmp" && mv -f "${hb_file}.tmp" "${hb_file}" 2>/dev/null
                  else
                    echo "Codex killed — no output for ${idle_secs}s and no active network connections (idle limit: ${IMPLEMENT_IDLE_TIMEOUT}s, attempt ${attempt})." >&2
                    if [ -n "${cpid}" ]; then kill -TERM "${cpid}" 2>/dev/null; sleep 5; kill -KILL "${cpid}" 2>/dev/null; fi
                    rm -f "${hb_file}"
                    exit 142
                  fi
                fi
              done
            ) &
            wd_pid=$!

            # Run codex in background with stderr-based heartbeat tracking
            (
              exec codex exec --model "${MODEL_EDITOR}" --full-auto < "${PROMPT_FILE_TO_USE}"
            ) > "${CODEX_OUTPUT_FILE}" 2> >(
              while IFS= read -r line || [ -n "$line" ]; do
                printf '%s' "$(date +%s)" > "${hb_file}.tmp" && mv -f "${hb_file}.tmp" "${hb_file}" 2>/dev/null
                printf '%s\n' "$line"
              done | tee -a "${RUNTIME_DIR}/codex_log.txt" >&2
            ) &
            codex_bg_pid=$!
            echo "${codex_bg_pid}" > "${codex_pid_file}"
            cmd_rc=0
            wait "${codex_bg_pid}" 2>/dev/null || cmd_rc=$?

            # Clean up watchdog
            kill "${wd_pid}" 2>/dev/null || true; wait "${wd_pid}" 2>/dev/null || true
            rm -f "${hb_file}" "${hb_file}.tmp" "${codex_pid_file}"

            if [ "${cmd_rc}" -eq 0 ]; then
              if grep -q '[^[:space:]]' "${CODEX_OUTPUT_FILE}"; then
                # Codex returned output — check if it actually changed files.
                if [ -n "$(git status --porcelain)" ]; then
                  echo "Codex implement succeeded with file changes on attempt ${attempt}."
                  implement_succeeded=true
                  break
                fi
                echo "::warning::Codex returned output but produced no file changes on attempt ${attempt}."
              else
                echo "::warning::Codex returned empty output on attempt ${attempt}."
              fi
            else
              echo "::warning::Codex exited with code $cmd_rc on attempt ${attempt}."
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              sleep_secs=$((10 * (2 ** (attempt - 1))))
              echo "Retrying in ${sleep_secs}s..."
              sleep "${sleep_secs}"
            else
              echo "::error::Codex implement failed after ${max_attempts} attempts."
              exit 1
            fi
          done

      - name: Write run summary
        if: env.SKIP_IMPLEMENT != 'true' && always()
        env:
          TOKEN_WARN_THRESHOLD: ${{ vars.TOKEN_WARN_THRESHOLD_IMPLEMENT || '200000' }}
        run: |
          set -euo pipefail
          TOKENS=""
          if [ -f "${RUNTIME_DIR}/codex_log.txt" ]; then
            TOKENS="$(grep -A1 'tokens used' "${RUNTIME_DIR}/codex_log.txt" | tail -1 | tr -d '[:space:]' || true)"
          fi
          {
            echo "## AI Implement Summary"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Issue | #${ISSUE_NUMBER} |"
            echo "| Model | \`${MODEL_EDITOR}\` |"
            if [ -n "${TOKENS}" ]; then
              echo "| Tokens used | ${TOKENS} |"
              TOKENS_NUM="${TOKENS//,/}"
              if [ "${TOKENS_NUM}" -gt "${TOKEN_WARN_THRESHOLD}" ] 2>/dev/null; then
                echo "| :warning: Token alert | Above ${TOKEN_WARN_THRESHOLD} threshold — review prompt efficiency |"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log token usage and Serena stats
        if: env.SKIP_IMPLEMENT != 'true' && always()
        run: |
          set -euo pipefail
          if [ -f "${CODEX_OUTPUT_FILE}" ]; then
            echo "::group::Editor LLM output size"
            wc -c < "${CODEX_OUTPUT_FILE}"
            echo "::endgroup::"
          fi
          if [ -f .serena/tool_usage_stats.json ]; then
            echo "::group::Serena tool usage stats"
            cat .serena/tool_usage_stats.json
            echo "::endgroup::"
          else
            echo "No Serena tool usage stats found (Serena may not have been used or stats not recorded)."
          fi

      - name: Generate Serena efficiency report
        if: env.SKIP_IMPLEMENT != 'true' && always()
        env:
          SERENA_WARN_THRESHOLD: ${{ vars.SERENA_WARN_THRESHOLD_IMPLEMENT || '50' }}
        run: |
          set -euo pipefail
          SERENA_REPORT_FILE="${RUNTIME_DIR}/serena_efficiency_report.md"
          echo "SERENA_REPORT_FILE=${SERENA_REPORT_FILE}" >> "$GITHUB_ENV"

          extra_files=()
          [ -f "${CODEX_OUTPUT_FILE}" ] && extra_files+=("--extra-files" "${CODEX_OUTPUT_FILE}")

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/serena_efficiency_report.py \
            --scan-dir "${RUNTIME_DIR}" \
            "${extra_files[@]}" \
            --warn-threshold "${SERENA_WARN_THRESHOLD}" \
            --output "${SERENA_REPORT_FILE}" || {
              echo "::warning::Serena efficiency report generation failed."
              echo "### Serena MCP efficiency" > "${SERENA_REPORT_FILE}"
              echo "Report generation failed for this run." >> "${SERENA_REPORT_FILE}"
            }

      - name: Create implementation branch
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail
          if ! [[ "${TARGET_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "${TARGET_BRANCH}" =~ (^|/)__pycache__(/|$) ]] || [[ "${TARGET_BRANCH}" =~ \.pyc$ ]]; then
            echo "Rejecting invalid TARGET_BRANCH: ${TARGET_BRANCH}"
            exit 1
          fi
          git checkout -B "${TARGET_BRANCH}"

      - name: Validate syntax of changed files
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail
          ERRORS=0

          # Check all modified/added Python files for syntax errors
          for f in $(git diff --name-only --diff-filter=ACM HEAD -- '*.py'); do
            if [ -f "$f" ]; then
              if ! python3 -m py_compile "$f" 2>&1; then
                echo "::error file=${f}::Syntax error in ${f}"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done

          # Check all modified/added JS files for syntax errors
          for f in $(git diff --name-only --diff-filter=ACM HEAD -- '*.js'); do
            if [ -f "$f" ]; then
              if ! node --check "$f" 2>&1; then
                echo "::error file=${f}::Syntax error in ${f}"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done

          # Check all modified/added shell scripts for syntax errors
          for f in $(git diff --name-only --diff-filter=ACM HEAD -- '*.sh'); do
            if [ -f "$f" ]; then
              if ! bash -n "$f" 2>&1; then
                echo "::error file=${f}::Shell syntax error in ${f}"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done

          # Check all modified/added YAML files for syntax errors using a YAML
          # parser - bash -n must NOT be used on YAML files as it parses them
          # as shell and produces false failures (e.g. 'name: foo (bar)').
          for f in $(git diff --name-only --diff-filter=ACM HEAD -- '*.yml' '*.yaml'); do
            if [ -f "$f" ]; then
              if ! python3 -c "import yaml, sys; f=open(sys.argv[1]); yaml.safe_load(f); f.close()" "$f" 2>&1; then
                echo "::error file=${f}::YAML syntax error in ${f}"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done

          if [ "${ERRORS}" -gt 0 ]; then
            echo "::error::${ERRORS} file(s) failed syntax validation."
            exit 1
          fi
          echo "All changed files passed syntax validation."

      - name: Protect workflow files from implementation edits
        if: env.SKIP_IMPLEMENT != 'true'
        run: |
          set -euo pipefail

          if [ "${ALLOW_WORKFLOW_EDITS:-false}" = "true" ]; then
            echo "ALLOW_WORKFLOW_EDITS is enabled — preserving .github/workflows changes."
          elif [ -d .github/workflows ]; then
            if [ -n "$(git status --porcelain .github/workflows)" ]; then
              echo "Discarding Codex edits under .github/workflows (ALLOW_WORKFLOW_EDITS is not enabled)."
              git restore --source=HEAD --staged --worktree .github/workflows || true
            fi
            git clean -fd -- .github/workflows
          fi

      - name: Commit changes
        if: env.SKIP_IMPLEMENT != 'true'
        id: commit_changes
        run: |
          set -euo pipefail

          # Remove workflow-generated/fetched artifacts BEFORE checking for
          # changes so they don't cause false-positive "file changes" detection.
          # The manifest tracks exactly which files were fetched — caller-repo
          # files that were never touched are safe.
          rm -f ./pre_assembled_static.txt
          if [ -f "${FETCHED_MANIFEST}" ]; then
            while IFS= read -r fetched_file; do
              [ -n "${fetched_file}" ] && rm -f "${fetched_file}"
            done < "${FETCHED_MANIFEST}"
          fi
          rm -rf .serena

          if [ -z "$(git status --porcelain)" ]; then
            echo "No repository changes were produced by Codex implementation."
            echo "did_commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "codex-bot"
          git config user.email "codex@users.noreply.github.com"
          git rm -r --cached node_modules 2>/dev/null || true
          # Template-owned paths (scripts/, prompts/, .github/prompts/,
          # .github/scripts/) are fetched from coding-workflows at runtime in
          # consumer repos, and must NOT be committed there — any edit to them
          # in a consumer wrapper would either be a no-op (overwritten next run)
          # or leak a stale copy back into the caller's tree.  In the canonical
          # `*/coding-workflows` repository these paths ARE the source of truth
          # and must be editable, so the excludes are dropped.
          is_self_repo="false"
          if [[ "${{ github.repository }}" == *"/coding-workflows" ]]; then
            is_self_repo="true"
          fi
          add_u_excludes=(':!node_modules')
          add_o_excludes=(':!node_modules' ':!.serena' ':!.github/ai')
          if [ "${is_self_repo}" = "false" ]; then
            add_u_excludes+=(':!scripts' ':!.github/prompts' ':!.github/scripts')
            add_o_excludes+=(':!scripts' ':!prompts' ':!.github/prompts' ':!.github/scripts')
          fi
          git add -u -- "${add_u_excludes[@]}"
          git ls-files --others --exclude-standard -z -- "${add_o_excludes[@]}" | xargs -0 -r git add --
          echo "Staged files before commit:"
          git diff --cached --name-only | sed 's/^/ - /' || true
          if [ "${is_self_repo}" = "false" ] && git diff --cached --name-only | grep -E '^\.github/(prompts|scripts)/'; then
            echo "Error: .github/prompts or .github/scripts is staged"
            exit 1
          fi
          # If every Codex-produced change was filtered out by the path exclusions
          # above (or stripped by the fetched-manifest cleanup earlier in this step),
          # there is nothing to commit.  Treat this as a no-op rather than letting
          # `git commit` fail — the "Handle no-op implementation" step below will
          # re-label the issue and post an explanatory comment.
          if [ -z "$(git diff --cached --name-only)" ]; then
            if [ "${is_self_repo}" = "false" ]; then
              echo "All Codex changes were filtered out (scripts/, .github/prompts/, .github/scripts/, or fetched-manifest cleanup); nothing to commit."
            else
              echo "No staged changes after fetched-manifest cleanup; nothing to commit."
            fi
            echo "did_commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "AI implementation for issue #${ISSUE_NUMBER}"
          echo "did_commit=true" >> "$GITHUB_OUTPUT"

      - name: Handle no-op implementation
        if: env.SKIP_IMPLEMENT != 'true' && steps.commit_changes.outputs.did_commit == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry &>/dev/null || gh_retry() { "$@"; }

          # A no-op implementation is almost always a bug — the plan approved
          # changes but codex produced none (or they were stripped, e.g.
          # workflow edits without ALLOW_WORKFLOW_EDITS).  Label the issue so
          # the orchestrator poller can detect and re-issue instead of silently
          # treating this as success.
          echo "::warning::Implementation produced no repository changes. Labeling issue #${ISSUE_NUMBER} as ai:implementation-failed."

          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body="⚠️ AI implementation produced no repository changes despite an approved plan. This is likely a pipeline bug (e.g. workflow edits stripped without \`ALLOW_WORKFLOW_EDITS=true\`, or the model failed to write files). Labeling \`ai:implementation-failed\` for orchestrator re-processing."

          # Remove ai:done (if present) and add failure label.
          # The commit step may already have removed fetched helper artifacts
          # in caller repos, so only source label_helpers when available.
          if [ -f scripts/label_helpers.sh ]; then
            source scripts/label_helpers.sh
            ensure_label_exists "ai:implementation-failed" "${{ github.repository }}"
          else
            gh_retry gh label create "ai:implementation-failed" --repo "${{ github.repository }}" \
              --color "e11d48" --description "Implementation produced no changes despite an approved plan — will be re-issued" \
              2>/dev/null || true
          fi
          gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${{ github.repository }}" \
            --remove-label 'ai:done' --add-label 'ai:implementation-failed' 2>/dev/null || \
          gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${{ github.repository }}" \
            --add-label 'ai:implementation-failed' 2>/dev/null || true

      - name: Push branch
        if: env.SKIP_IMPLEMENT != 'true' && steps.commit_changes.outputs.did_commit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry &>/dev/null || gh_retry() { "$@"; }

          git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}"

          # Re-fetch git_ref_health_check.sh — the commit step deletes fetched
          # artifacts to keep them out of caller repos.
          wf_source="${{ github.repository_owner }}/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            script_ref="${{ github.sha }}"
          else
            script_ref="stable"
          fi
          mkdir -p scripts
          if ! gh_retry gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${wf_source}/contents/scripts/git_ref_health_check.sh?ref=${script_ref}" > scripts/git_ref_health_check.sh 2>/dev/null; then
            echo "::warning::git_ref_health_check.sh not found on ${script_ref}; falling back to main"
            gh_retry gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${wf_source}/contents/scripts/git_ref_health_check.sh?ref=main" > scripts/git_ref_health_check.sh
          fi
          chmod +x scripts/git_ref_health_check.sh

          bash scripts/git_ref_health_check.sh repair
          rm -f scripts/git_ref_health_check.sh

          for attempt in 1 2 3; do
            # Fetch latest remote state before pushing so local tracking refs
            # are up to date.
            if ! git fetch --no-tags --prune origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"; then
              echo "Fetch attempt ${attempt} failed; using local refs."
            fi

            # Default: normal (non-force) push, compatible with protected branches.
            # Set ALLOW_FORCE_PUSH=true in the workflow environment to opt in to
            # --force-with-lease (only appropriate for unprotected bot branches).
            PUSH_ARGS=("-u" "origin" "HEAD:${TARGET_BRANCH}")
            if [ "${ALLOW_FORCE_PUSH:-false}" = "true" ]; then
              echo "Force-push path active: using --force-with-lease (attempt ${attempt})."
              if git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}"; then
                # Pin the lease to the freshly-fetched remote SHA so the push
                # succeeds even when the remote moved since our last fetch.
                REMOTE_SHA="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
                PUSH_ARGS+=("--force-with-lease=refs/heads/${TARGET_BRANCH}:${REMOTE_SHA}")
              else
                PUSH_ARGS+=("--force-with-lease")
              fi
            fi

            PUSH_EXIT=0
            git push "${PUSH_ARGS[@]}" || PUSH_EXIT=$?
            if [ "${PUSH_EXIT}" -eq 0 ]; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              echo "Push attempt ${attempt} failed (exit ${PUSH_EXIT}); retrying..."
              # When not force-pushing, attempt to reconcile a non-fast-forward
              # rejection by rebasing local HEAD onto the freshly-fetched remote
              # ref before the next push attempt.  When force-push is enabled the
              # pinned --force-with-lease will overwrite the remote, so no rebase
              # is needed (or safe) in that path.
              if [ "${ALLOW_FORCE_PUSH:-false}" != "true" ]; then
                if git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}"; then
                  echo "Attempting rebase onto origin/${TARGET_BRANCH} to reconcile non-fast-forward..."
                  if ! git rebase "origin/${TARGET_BRANCH}"; then
                    echo "::error::Rebase failed due to conflicts. Manual resolution required."
                    echo "::warning::Aborting rebase — git state may need manual inspection if abort fails."
                    git rebase --abort || true
                    exit 1
                  fi
                  echo "Rebase onto origin/${TARGET_BRANCH} succeeded; retrying push."
                fi
              fi
              sleep $((attempt * 2))
            else
              echo "::error::Push failed after 3 attempts (exit ${PUSH_EXIT})."
              if [ "${ALLOW_FORCE_PUSH:-false}" != "true" ]; then
                echo "Note: push was attempted without --force-with-lease."
                echo "If the branch exists remotely and has diverged, the remote may have a non-fast-forward conflict."
                echo "Protected branches that disallow force-push will reject forced updates (GH013)."
                echo "If this branch is unprotected and force-push is intended, set ALLOW_FORCE_PUSH=true."
              fi
            fi
          done

          exit 1

      - name: Create Pull Request
        if: env.SKIP_IMPLEMENT != 'true' && steps.commit_changes.outputs.did_commit == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          if ! gh pr create \
            --repo "${{ github.repository }}" \
            --base "${PR_BASE_BRANCH}" \
            --head "${TARGET_BRANCH}" \
            --title "AI implementation for issue #${ISSUE_NUMBER}" \
            --body "Automated implementation. Closes ${ISSUE_URL}" > "${RUNTIME_DIR}/created_pr_url.txt" 2> "${RUNTIME_DIR}/created_pr_url.err"; then
            echo "PR creation failed. This may indicate a PR was created by another process during execution."
            if [ -s "${RUNTIME_DIR}/created_pr_url.err" ]; then
              cat "${RUNTIME_DIR}/created_pr_url.err"
            fi
            EXISTING_PR="$(gh pr list --repo "${{ github.repository }}" --search "issue:${ISSUE_NUMBER}" --state open --json url --jq '.[0].url // ""')"
            if [ -n "${EXISTING_PR}" ]; then
              echo "Found existing PR: ${EXISTING_PR}"
              echo "pr_url=${EXISTING_PR}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi

          PR_URL="$(grep -Eo 'https://github\.com/[^[:space:]]+/pull/[0-9]+' "${RUNTIME_DIR}/created_pr_url.txt" | head -n 1 || true)"
          if [ -z "${PR_URL}" ]; then
            PR_URL="$(head -n 1 "${RUNTIME_DIR}/created_pr_url.txt" | tr -d '\r')"
          fi
          if [ -z "${PR_URL}" ]; then
            echo "Unable to determine PR URL from gh output."
            exit 1
          fi
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Refetch memory helpers after commit cleanup
        if: env.SKIP_IMPLEMENT != 'true' && steps.commit_changes.outputs.did_commit == 'true' && steps.create_pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          wf_source="${{ github.repository_owner }}/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            script_ref="${{ github.sha }}"
          else
            script_ref="stable"
          fi

          mkdir -p scripts
          # Rate-limit-aware fetch
          _rl_wait() {
            local _reset_ts _wait_secs
            _reset_ts=$(gh api -i /rate_limit 2>/dev/null | grep -i '^x-ratelimit-reset:' | head -1 | awk '{print $2}' | tr -d '\r') || true
            if [ -n "${_reset_ts}" ] && [ "${_reset_ts}" -gt 0 ] 2>/dev/null; then
              _wait_secs=$(( _reset_ts - $(date +%s) + 1 ))
              [ "${_wait_secs}" -lt 1 ] && _wait_secs=1
              [ "${_wait_secs}" -gt 600 ] && _wait_secs=600
            else
              _wait_secs=30
            fi
            echo "::warning::  Rate limit resets in ${_wait_secs}s (X-RateLimit-Reset: ${_reset_ts:-unknown})" >&2
            sleep "${_wait_secs}"
          }
          _gh_api_fetch() {
            local outfile="$1"; shift
            local attempt=1
            while [ "${attempt}" -le 5 ]; do
              if gh "$@" > "${outfile}" 2>/tmp/_gh_rl_err; then return 0; fi
              if grep -qiE 'rate limit|abuse detection|secondary rate|HTTP 429' /tmp/_gh_rl_err 2>/dev/null; then
                echo "::warning::Rate limit hit during fetch (attempt ${attempt}/5), waiting for reset…" >&2
                _rl_wait; attempt=$((attempt + 1))
              else return 1; fi
            done; return 1
          }
          for f in gh_helpers.sh memory_helpers.sh ai_memory.py ai_memory_lib.py openrouter_prompt_cache.py; do
            if ! _gh_api_fetch "scripts/${f}" api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${wf_source}/contents/scripts/${f}?ref=${script_ref}"; then
              echo "::warning::${f} not found on ${script_ref}; falling back to main"
              _gh_api_fetch "scripts/${f}" api -H 'Accept: application/vnd.github.raw+json' \
                "repos/${wf_source}/contents/scripts/${f}?ref=main"
            fi
            chmod +x "scripts/${f}"
          done

      - name: Collect PR metadata and changed files
        if: env.SKIP_IMPLEMENT != 'true' && steps.commit_changes.outputs.did_commit == 'true' && steps.create_pr.outputs.pr_url != ''
        id: pr_metadata
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          PR_URL="${{ steps.create_pr.outputs.pr_url }}"
          PR_NUMBER="$(printf '%s\n' "${PR_URL}" | sed -E 's#.*/pull/([0-9]+).*#\1#')"
          if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            PR_NUMBER=""
          fi

          PR_HEAD_REF=""
          if [ -n "${PR_NUMBER}" ]; then
            _pr_view_json="$(gh pr view "${PR_NUMBER}" --repo "${{ github.repository }}" --json headRefName,files 2>/dev/null || echo '{}')"
            PR_HEAD_REF="$(echo "${_pr_view_json}" | jq -r '.headRefName // ""')"
            echo "${_pr_view_json}" | jq -r '.files[].path' > "${CHANGED_FILES_FILE}" || true
          else
            : > "${CHANGED_FILES_FILE}"
          fi

          if [ ! -s "${CHANGED_FILES_FILE}" ]; then
            git show --name-only --pretty='' HEAD > "${CHANGED_FILES_FILE}" || true
          fi

          CHANGED_FILES_JSON="$(jq -R -s -c 'split("\n") | map(select(length > 0))' "${CHANGED_FILES_FILE}")"

          jq -cn \
            --arg pr_url "${PR_URL}" \
            --arg pr_number "${PR_NUMBER}" \
            --arg branch "${PR_HEAD_REF}" \
            --arg issue_number "${ISSUE_NUMBER}" \
            --arg issue_url "${ISSUE_URL}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson changed_files "${CHANGED_FILES_JSON}" \
            '{
              issue_number: (if ($issue_number | length) > 0 then ($issue_number | tonumber) else null end),
              issue_url: $issue_url,
              pr_url: $pr_url,
              pr_number: (if ($pr_number | length) > 0 then ($pr_number | tonumber) else null end),
              branch: (if ($branch | length) > 0 then $branch else null end),
              run_id: "${{ github.run_id }}",
              run_attempt: "${{ github.run_attempt }}",
              run_url: $run_url,
              changed_files: $changed_files
            }' > "${PR_METADATA_FILE}"

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "branch=${PR_HEAD_REF}" >> "$GITHUB_OUTPUT"

      - name: Record implementation candidate
        if: env.SKIP_IMPLEMENT != 'true' && steps.commit_changes.outputs.did_commit == 'true' && steps.create_pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh

          PR_URL="$(jq -r '.pr_url // ""' "${PR_METADATA_FILE}")"
          SUMMARY="Implementation PR created for issue #${ISSUE_NUMBER}: ${PR_URL}"
          DETAILS="$(jq -c '.' "${PR_METADATA_FILE}")"
          PR_NUMBER_STR="$(jq -r 'if .pr_number == null then "" else (.pr_number|tostring) end' "${PR_METADATA_FILE}")"

          memory_record_candidate \
            --category task_summaries \
            --summary "${SUMMARY}" \
            --details "${DETAILS}" \
            --workflow implement \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --actor "${{ github.actor }}" \
            --issue-number "${ISSUE_NUMBER}" \
            --pr-number "${PR_NUMBER_STR}" \
            --source-refs "${{ steps.create_pr.outputs.pr_url }}"

      - name: Complete /approved processed command
        if: env.SKIP_IMPLEMENT != 'true' && steps.commit_changes.outputs.did_commit == 'true' && steps.create_pr.outputs.pr_url != ''
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh

          memory_processed_command_complete \
            --issue-number "${ISSUE_NUMBER}" \
            --comment-id "${APPROVAL_COMMENT_ID}" \
            --command approved \
            --status completed \
            --metadata-json "$(jq -c '.' "${PR_METADATA_FILE}")"

      - name: Finalize implementation task lineage as in_progress
        if: env.SKIP_IMPLEMENT != 'true' && steps.commit_changes.outputs.did_commit == 'true' && steps.create_pr.outputs.pr_url != ''
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh

          PR_NUMBER_STR="$(jq -r 'if .pr_number == null then "" else (.pr_number|tostring) end' "${PR_METADATA_FILE}")"
          FINALIZE_ARGS=(
            --issue-number "${ISSUE_NUMBER}"
            --issue-url "${ISSUE_URL}"
            --final-state in_progress
            --workflow implement
            --run-id "${{ github.run_id }}"
            --run-attempt "${{ github.run_attempt }}"
            --actor "${{ github.actor }}"
            --pr-url "${{ steps.create_pr.outputs.pr_url }}"
          )
          if [ -n "${PR_NUMBER_STR}" ] && [ "${PR_NUMBER_STR}" != "null" ]; then
            FINALIZE_ARGS+=(--pr-number "${PR_NUMBER_STR}")
          fi
          memory_finalize_task "${FINALIZE_ARGS[@]}"

      - name: Generate AI issue summary for PR comment
        if: env.SKIP_IMPLEMENT != 'true' && steps.commit_changes.outputs.did_commit == 'true' && steps.create_pr.outputs.pr_url != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail

          cat > "${ISSUE_SUMMARY_PROMPT_FILE}" <<EOF
          Generate a concise issue summary for a pull request comment.

          Requirements:
          - Output markdown only.
          - Start with this exact heading: "### AI Issue Summary"
          - Provide 3-6 bullet points summarizing the issue goal, key constraints, and expected outcome.
          - Do not include implementation details that are not present in the issue context.
          - Do not include fenced code blocks.
          - Keep it under 120 words.

          Use only the contents of ${RUNTIME_DIR}/issue_context_for_summary.txt.
          EOF

          {
            echo "ISSUE CONTEXT FOR SUMMARY"
            jq -r '"Title: " + (.title // "") + "\nURL: " + (.html_url // "") + "\n\nBody:\n" + (.body // "")' "${ISSUE_META_FILE}"
            echo
            echo "LATEST APPROVED IMPLEMENTATION PLAN"
            cat "${PLAN_FILE}"
          } > "${RUNTIME_DIR}/issue_context_for_summary.txt"

          CONFIG_FILE="${HOME}/.codex/config.toml"
          CONFIG_BACKUP_FILE="${RUNTIME_DIR}/codex_config_issue_summary_backup.toml"
          HAD_CONFIG="false"
          if [ -f "${CONFIG_FILE}" ]; then
            HAD_CONFIG="true"
            cp "${CONFIG_FILE}" "${CONFIG_BACKUP_FILE}"
          fi

          restore_codex_config() {
            if [ "${HAD_CONFIG}" = "true" ] && [ -f "${CONFIG_BACKUP_FILE}" ]; then
              cp "${CONFIG_BACKUP_FILE}" "${CONFIG_FILE}"
              rm -f "${CONFIG_BACKUP_FILE}"
              return
            fi
            rm -f "${CONFIG_FILE}" "${CONFIG_BACKUP_FILE}"
          }
          trap 'restore_codex_config; rm -f "${RUNTIME_DIR}/issue_context_for_summary.txt"' EXIT

          mkdir -p "${HOME}/.codex"
          if [ "${HAD_CONFIG}" = "true" ] && [ -f "${CONFIG_BACKUP_FILE}" ]; then
            awk '
              BEGIN { replaced = 0 }
              /^model_reasoning_effort[[:space:]]*=/ {
                print "model_reasoning_effort = \"low\""
                replaced = 1
                next
              }
              { print }
              END {
                if (!replaced) {
                  print "model_reasoning_effort = \"low\""
                }
              }
            ' "${CONFIG_BACKUP_FILE}" > "${CONFIG_FILE}"
          else
            {
              echo 'model_reasoning_effort = "low"'
              echo 'model_provider = "openrouter"'
              echo "model = \"${MODEL_EDITOR}\""
              echo
              echo '[model_providers.openrouter]'
              echo 'name = "OpenRouter"'
              echo 'base_url = "https://openrouter.ai/api/v1"'
              echo 'env_key = "OPENROUTER_API_KEY"'
              echo 'wire_api = "responses"'
            } > "${CONFIG_FILE}"
          fi

          cat "${ISSUE_SUMMARY_PROMPT_FILE}" "${RUNTIME_DIR}/issue_context_for_summary.txt" | codex exec --model "${MODEL_EDITOR}" --full-auto > "${ISSUE_SUMMARY_FILE}"

      - name: Post AI issue summary as first PR comment
        if: env.SKIP_IMPLEMENT != 'true' && steps.commit_changes.outputs.did_commit == 'true' && steps.create_pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry &>/dev/null || gh_retry() { "$@"; }

          if [ ! -s "${ISSUE_SUMMARY_FILE}" ]; then
            echo "AI issue summary file is missing or empty."
            exit 1
          fi
          if ! grep -q '^### AI Issue Summary' "${ISSUE_SUMMARY_FILE}"; then
            echo "AI issue summary is missing required heading."
            exit 1
          fi
          if grep -q '```' "${ISSUE_SUMMARY_FILE}"; then
            echo "AI issue summary contains fenced code blocks."
            exit 1
          fi

          # Append Serena efficiency report if available
          if [ -s "${SERENA_REPORT_FILE:-}" ]; then
            echo "" >> "${ISSUE_SUMMARY_FILE}"
            cat "${SERENA_REPORT_FILE}" >> "${ISSUE_SUMMARY_FILE}"
          fi

          gh_retry gh pr comment "${{ steps.create_pr.outputs.pr_url }}" \
            --repo "${{ github.repository }}" \
            --body-file "${ISSUE_SUMMARY_FILE}"

      - name: Mark issue done after implementation PR
        if: env.SKIP_IMPLEMENT != 'true' && steps.commit_changes.outputs.did_commit == 'true' && steps.create_pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry &>/dev/null || gh_retry() { "$@"; }
          gh_retry gh label create "ai:done" --repo "${{ github.repository }}" \
            --color "0e8a16" --description "Implementation PR created" \
            2>/dev/null || true
          gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${{ github.repository }}" \
            --add-label 'ai:done' --remove-label 'ai:implementing' >/dev/null 2>&1 || true

      - name: Record implementation run success event
        if: env.SKIP_IMPLEMENT != 'true' && steps.commit_changes.outputs.did_commit == 'true' && steps.create_pr.outputs.pr_url != ''
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh

          PR_NUMBER_STR="$(jq -r 'if .pr_number == null then "" else (.pr_number|tostring) end' "${PR_METADATA_FILE}")"
          EVENT_ARGS=(
            --run-id "${{ github.run_id }}"
            --workflow implement
            --event-type phase_completed
            --status ok
            --message "Implementation phase completed with PR"
            --issue-number "${ISSUE_NUMBER}"
            --actor "${{ github.actor }}"
            --metadata-json "$(jq -c '.' "${PR_METADATA_FILE}")"
          )
          if [ -n "${PR_NUMBER_STR}" ] && [ "${PR_NUMBER_STR}" != "null" ]; then
            EVENT_ARGS+=(--pr-number "${PR_NUMBER_STR}")
          fi
          memory_record_run_event "${EVENT_ARGS[@]}"

      - name: Restore awaiting approval label on skipped implementation
        if: env.SKIP_IMPLEMENT == 'true' && env.RESTORE_AWAITING_APPROVAL_ON_SKIP == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry &>/dev/null || gh_retry() { "$@"; }
          gh_retry gh label create "ai:awaiting-approval" --repo "${{ github.repository }}" \
            --color "fbca04" --description "Awaiting human approval to implement" \
            2>/dev/null || true
          gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${{ github.repository }}" \
            --add-label 'ai:awaiting-approval' --remove-label 'ai:implementing' >/dev/null 2>&1 || true

      - name: Comment on issue failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry &>/dev/null || gh_retry() { "$@"; }
          ISSUE_LABELS_JSON="$(gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}" --jq '[.labels[].name]')"
          if printf '%s' "${ISSUE_LABELS_JSON}" | jq -e 'index("ai:implementing") != null' >/dev/null; then
            gh_retry gh label create "ai:awaiting-approval" --repo "${{ github.repository }}" \
              --color "fbca04" --description "Awaiting human approval to implement" \
              2>/dev/null || true
            gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${{ github.repository }}" \
              --add-label 'ai:awaiting-approval' --remove-label 'ai:implementing' >/dev/null 2>&1 || true
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ job.status }}" = "cancelled" ]; then
            REASON="AI implementation workflow was cancelled/timed out for ${ISSUE_URL}. Run: ${RUN_URL}"
          else
            REASON="AI implementation workflow failed for ${ISSUE_URL}. Run: ${RUN_URL}"
          fi
          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body="${REASON}"

      - name: Telegram failure notification
        if: failure() || cancelled()
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/tg_helpers.sh ]; then
            echo "tg_helpers.sh not available; skipping Telegram notification."
            exit 0
          fi
          source scripts/tg_helpers.sh

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ job.status }}" = "cancelled" ]; then
            MSG="AI implementation workflow cancelled/timed out for issue #${ISSUE_NUMBER}"
          else
            MSG="AI implementation workflow failed for issue #${ISSUE_NUMBER}"
          fi
          MSG+=$'\n'
          MSG+="Issue: ${ISSUE_URL}"
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          if declare -F tg_send_tracked >/dev/null 2>&1; then
            tg_send_tracked "${ISSUE_NUMBER}" "${MSG}" "ERROR"
          else
            echo "::warning::tg_helpers.sh unavailable; skipping Telegram notification."
          fi

      - name: Record implementation run failure event
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -f scripts/memory_helpers.sh ]; then
            source scripts/memory_helpers.sh
          else
            wf_source="${{ github.repository_owner }}/coding-workflows"
            if [ "${{ github.repository }}" = "${wf_source}" ]; then
              script_ref="${{ github.sha }}"
            else
              script_ref="stable"
            fi
            mkdir -p scripts
            # Rate-limit-aware fetch
            _rl_wait() {
              local _reset_ts _wait_secs
              _reset_ts=$(gh api -i /rate_limit 2>/dev/null | grep -i '^x-ratelimit-reset:' | head -1 | awk '{print $2}' | tr -d '\r') || true
              if [ -n "${_reset_ts}" ] && [ "${_reset_ts}" -gt 0 ] 2>/dev/null; then
                _wait_secs=$(( _reset_ts - $(date +%s) + 1 ))
                [ "${_wait_secs}" -lt 1 ] && _wait_secs=1
                [ "${_wait_secs}" -gt 600 ] && _wait_secs=600
              else
                _wait_secs=30
              fi
              echo "::warning::  Rate limit resets in ${_wait_secs}s (X-RateLimit-Reset: ${_reset_ts:-unknown})" >&2
              sleep "${_wait_secs}"
            }
            _gh_api_fetch() {
              local outfile="$1"; shift
              local attempt=1
              while [ "${attempt}" -le 5 ]; do
                if gh "$@" > "${outfile}" 2>/tmp/_gh_rl_err; then return 0; fi
                if grep -qiE 'rate limit|abuse detection|secondary rate|HTTP 429' /tmp/_gh_rl_err 2>/dev/null; then
                  echo "::warning::Rate limit hit during fetch (attempt ${attempt}/5), waiting for reset…" >&2
                  _rl_wait; attempt=$((attempt + 1))
                else return 1; fi
              done; return 1
            }
            for f in gh_helpers.sh memory_helpers.sh ai_memory.py ai_memory_lib.py openrouter_prompt_cache.py; do
              if ! _gh_api_fetch "scripts/${f}" api -H 'Accept: application/vnd.github.raw+json' \
                "repos/${wf_source}/contents/scripts/${f}?ref=${script_ref}"; then
                _gh_api_fetch "scripts/${f}" api -H 'Accept: application/vnd.github.raw+json' \
                  "repos/${wf_source}/contents/scripts/${f}?ref=main"
              fi
              chmod +x "scripts/${f}"
            done
            source scripts/memory_helpers.sh
          fi

          if [ -f scripts/memory_helpers.sh ]; then
            if [ "${{ job.status }}" = "cancelled" ]; then
              phase_message="Implementation phase cancelled"
            else
              phase_message="Implementation phase failed"
            fi
            memory_record_run_event \
              --run-id "${{ github.run_id }}" \
              --workflow implement \
              --event-type phase_failed \
              --status error \
              --message "${phase_message}" \
              --issue-number "${ISSUE_NUMBER}" \
              --actor "${{ github.actor }}" \
              --metadata-json "$(jq -cn --arg job_status "${{ job.status }}" --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{job_status: $job_status, run_url: $run_url}')"
          fi

      - name: Exit safely
        if: failure() || cancelled()
        run: exit 0

      - name: Cleanup temporary artifacts
        if: always()
        run: |
          set -euo pipefail
          if [[ "${RUNTIME_DIR:-}" =~ ^/tmp/codex-implement-[0-9]+$ ]]; then
            rm -rf "${RUNTIME_DIR}"
          else
            echo "RUNTIME_DIR not set or unsafe; skipping cleanup"
          fi

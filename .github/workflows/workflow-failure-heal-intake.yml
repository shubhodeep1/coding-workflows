---
name: Workflow Failure Heal Intake

# Receives workflow-failure reports and turns them into heal issues for the AI
# pipeline. Three entry points:
#
#   1. `repository_dispatch` (event type `workflow-failure-heal`), sent by
#      scripts/workflow_failure_heal_report.sh from a consumer repository (or
#      from this repo's own `internal-workflow-failure-heal.yml`) when a
#      human-needed escalation label lands on an issue / pull request.
#   2. `workflow_run: completed` for the release and promotion workflows of
#      this repository; only `failure` / `timed_out` conclusions proceed.
#   3. `workflow_dispatch` with a raw payload JSON, for manual re-runs.
#
# scripts/workflow_failure_heal_intake.sh fetches the failed job logs, runs the
# diagnosis model (prompts/mode-workflow-failure-heal.txt), de-duplicates by
# fingerprint, applies the lineage / budget caps, and opens the heal issue
# (label `ai:workflow-heal`, `Target branch: stable` so the fix ships as a
# hotfix on the stable line). See README "Workflow Failure Heal".

"on":
  repository_dispatch:
    types:
      - workflow-failure-heal
  workflow_run:
    workflows:
      - "Test & Mark Stable Release"
      - "Mark Stable Release"
      - "Promote main to stable"
      - "Auto release stable"
      - "Forward-merge stable to main"
    types:
      - completed
  workflow_dispatch:
    inputs:
      payload_json:
        description: "Raw workflow_failure_heal.v1 payload JSON (manual re-run / testing)"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: read
  # Claude engine: the job's OIDC token for claude-pool-broker (plan Phase 4).
  id-token: write

# Serialise every intake so the fingerprint dedup and the open-issue / per-day
# budgets are evaluated against a consistent issue list.
concurrency:
  group: workflow-failure-heal-intake
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}

jobs:
  intake:
    if: >-
      !contains(fromJson('["false"]'), vars.WORKFLOW_HEAL_ENABLED) &&
      (github.event_name != 'workflow_run' ||
       contains(fromJson('["failure","timed_out"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      MODEL_EDITOR: ${{ vars.WORKFLOW_HEAL_MODEL || vars.WORKFLOW_EDITOR_MODEL || 'openai/gpt-6-sol' }}
      MODEL_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_WORKFLOW_HEAL || 'high' }}
      MODEL_VERBOSITY: ${{ vars.VERBOSITY_WORKFLOW_HEAL || 'low' }}
      OPENROUTER_PROMPT_CACHE_DISABLED: ${{ vars.OPENROUTER_PROMPT_CACHE_DISABLED || 'false' }}
      WORKFLOW_HEAL_ENABLED: ${{ vars.WORKFLOW_HEAL_ENABLED || 'true' }}
      WORKFLOW_HEAL_MAX_LINEAGE_DEPTH: ${{ vars.WORKFLOW_HEAL_MAX_LINEAGE_DEPTH || '3' }}
      WORKFLOW_HEAL_MAX_OPEN_ISSUES: ${{ vars.WORKFLOW_HEAL_MAX_OPEN_ISSUES || '10' }}
      WORKFLOW_HEAL_MAX_ISSUES_PER_DAY: ${{ vars.WORKFLOW_HEAL_MAX_ISSUES_PER_DAY || '20' }}
      WORKFLOW_HEAL_TARGET_BRANCH: ${{ vars.WORKFLOW_HEAL_TARGET_BRANCH || 'stable' }}
      WORKFLOW_HEAL_SELF_INFLICTED_ROUTING_ENABLED: ${{ vars.WORKFLOW_HEAL_SELF_INFLICTED_ROUTING_ENABLED || 'true' }}
      TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
      TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
      TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Capture approved heal support SHA
        run: |
          set -euo pipefail
          echo "HEAL_SUPPORT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create runtime workspace
        run: |
          set -euo pipefail
          RUNTIME_DIR="/tmp/workflow-heal-intake-${GITHUB_RUN_ID}"
          mkdir -p "${RUNTIME_DIR}"
          echo "RUNTIME_DIR=${RUNTIME_DIR}" >> "$GITHUB_ENV"
          echo "WORKFLOW_HEAL_PAYLOAD_FILE=${RUNTIME_DIR}/payload_raw.json" >> "$GITHUB_ENV"

      - name: Materialize the report payload
        id: payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          # TRUST BOUNDARY: all three sources are external to this run. They are
          # bound as env (never interpolated into the script) and re-validated
          # by scripts/workflow_failure_heal.py before any field is used.
          CLIENT_PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
          WORKFLOW_RUN_JSON: ${{ toJson(github.event.workflow_run) }}
          DISPATCH_PAYLOAD_JSON: ${{ inputs.payload_json }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            repository_dispatch)
              # Reporters envelope the report as {schema_version, report}
              # (GitHub caps client_payload at 10 top-level properties);
              # unwrap-dispatch also passes the legacy flat shape through.
              printf '%s' "${CLIENT_PAYLOAD_JSON}" > "${RUNTIME_DIR}/client_payload.json"
              if ! python3 scripts/workflow_failure_heal.py unwrap-dispatch \
                --payload-json "${RUNTIME_DIR}/client_payload.json" \
                > "${WORKFLOW_HEAL_PAYLOAD_FILE}" 2> "${RUNTIME_DIR}/unwrap_error.txt"; then
                echo "::error::client_payload could not be unwrapped or parsed: $(head -c 300 "${RUNTIME_DIR}/unwrap_error.txt" | tr '\n' ' ')"
                exit 1
              fi
              ;;
            workflow_run)
              printf '%s' "${WORKFLOW_RUN_JSON}" > "${RUNTIME_DIR}/workflow_run.json"
              python3 scripts/workflow_failure_heal.py build-run-payload \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow-run-json "${RUNTIME_DIR}/workflow_run.json" \
                > "${WORKFLOW_HEAL_PAYLOAD_FILE}"
              ;;
            workflow_dispatch)
              printf '%s' "${DISPATCH_PAYLOAD_JSON}" > "${WORKFLOW_HEAL_PAYLOAD_FILE}"
              ;;
            *)
              echo "::error::Unsupported event ${EVENT_NAME}"
              exit 1
              ;;
          esac
          if ! jq -e 'type == "object"' "${WORKFLOW_HEAL_PAYLOAD_FILE}" >/dev/null 2>&1; then
            echo "::error::Payload is not a JSON object"
            exit 1
          fi
          echo "source_repo=$(jq -r '.source_repo // ""' "${WORKFLOW_HEAL_PAYLOAD_FILE}" | tr -cd 'A-Za-z0-9_./-' | head -c 120)" >> "$GITHUB_OUTPUT"

      - name: Install Codex CLI
        uses: ./.github/actions/install-codex
        with:
          codex_version: ${{ vars.CODEX_VERSION || 'v0.114.0' }}

      - name: Create Codex config
        run: |
          set -euo pipefail
          source scripts/codex_helpers.sh
          codex_config_assemble "${MODEL_EDITOR}" "${MODEL_REASONING_EFFORT}" "low"

      # Claude engine (replace-claude-sessions plan Phase 5d): the WORKFLOW_HEAL
      # diagnosis runs on Claude unless AI_ENGINE_WORKFLOW_HEAL or AI_ENGINE say
      # codex. The CLI and the account pool are fetched only then; exit 75 runs
      # the unchanged codex call (plan D1).
      - name: Resolve AI engine
        id: ai_engine
        env:
          AI_ENGINE: ${{ vars.AI_ENGINE || '' }}
          AI_ENGINE_WORKFLOW_HEAL: ${{ vars.AI_ENGINE_WORKFLOW_HEAL || '' }}
        run: |
          set -euo pipefail
          any_claude=false
          engine_loaded=false
          if [ -f "scripts/ai_engine.sh" ]; then
            # shellcheck disable=SC1091
            source "scripts/ai_engine.sh" && engine_loaded=true
          fi
          for role in WORKFLOW_HEAL; do
            engine="codex"
            if [ "${engine_loaded}" = "true" ]; then
              engine="$(ai_engine_for_role "${role}" || echo codex)"
            fi
            [ "${engine}" = "claude" ] || engine="codex"
            [ "${engine}" = "codex" ] || any_claude=true
            echo "AI_ENGINE_RESOLVED_${role}=${engine}" >> "$GITHUB_ENV"
          done
          echo "any_claude=${any_claude}" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI
        if: steps.ai_engine.outputs.any_claude == 'true'
        continue-on-error: true
        uses: ./.github/actions/install-claude
        with:
          config_path: .github/ai/claude_engine.json

      - name: Resolve Claude credential
        if: steps.ai_engine.outputs.any_claude == 'true'
        continue-on-error: true
        uses: ./.github/actions/claude-pool-token
        with:
          config_path: .github/ai/claude_engine.json

      - name: Run workflow failure heal intake
        env:
          # Codex version baked into the isolated diagnosis agent's image (scripts/codex_isolated_exec.sh).
          CODEX_VERSION: ${{ vars.CODEX_VERSION || 'v0.114.0' }}
        run: |
          set -euo pipefail
          bash scripts/workflow_failure_heal_intake.sh

      - name: Notify on intake workflow failure
        if: ${{ failure() }}
        env:
          SOURCE_REPO: ${{ steps.payload.outputs.source_repo }}
        run: |
          set -euo pipefail
          # A read-profile model may have seen untrusted source. Do not source
          # the notifier from a checkout it could have changed.
          if ! heal_support_status="$(git status --porcelain --untracked-files=all 2>/dev/null)" ||
             [ -z "${HEAL_SUPPORT_SHA:-}" ] ||
             [ "$(git rev-parse HEAD 2>/dev/null)" != "${HEAL_SUPPORT_SHA}" ] ||
             [ -n "${heal_support_status}" ]; then
            echo "::error::Workflow heal support checkout changed; skipping support-based notification."
            exit 0
          fi
          source scripts/tg_helpers.sh 2>/dev/null || true
          type tg_send_msg >/dev/null 2>&1 || exit 0
          RUN_URL="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          notification="Workflow Failure Heal Intake workflow itself failed (report from '${SOURCE_REPO:-unknown}')."
          tg_send_msg "${notification}"$'\n'"Run: ${RUN_URL}" "CRITICAL" >/dev/null 2>&1 || true

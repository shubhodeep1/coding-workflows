---
name: Update Workflow Wrappers

"on":
  workflow_call:
    inputs:
      allow_workflow_edits:
        description: "Allow automatic workflow wrapper updates"
        required: false
        default: true
        type: boolean
      update_via_pull_request:
        description: "When UPDATER_PR_DELIVERY_ENABLED is false, deliver updates through an ai-sync/stable pull request (true) or push directly to the default branch (false); ignored while that variable selects the auto/update-workflows-* pull request"
        required: false
        default: true
        type: boolean
    secrets:
      GH_PAT:
        required: true
      TG_BOT_SECRET:
        required: false
  # workflow_dispatch is additive — required by the release gate to live-test
  # the update-wrappers path before tagging stable. Consumer repos still call
  # this workflow via workflow_call from ai-update-workflows.yml.
  workflow_dispatch:
    inputs:
      allow_workflow_edits:
        description: "Allow automatic workflow wrapper updates"
        required: false
        default: true
        type: boolean
      update_via_pull_request:
        description: "When UPDATER_PR_DELIVERY_ENABLED is false, deliver updates through an ai-sync/stable pull request (true) or push directly to the default branch (false); ignored while that variable selects the auto/update-workflows-* pull request"
        required: false
        default: true
        type: boolean
      alert_msg_level:
        description: Override the Telegram alert threshold for this run. Set to SILENT when dispatched from the test-and-mark-stable smoke gate to avoid drowning the gate's combined notification in per-job alerts.
        required: false
        default: ""
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Default is SILENT (not DEBUG like other workflows) so the per-run
  # "🔍 DEBUG: Workflow wrappers updated in <repo>…" notification at line ~452
  # is suppressed by tg_helpers.sh::_tg_should_send. Consumer repos that
  # want the wrapper-update alert back can set vars.ALERT_MSG_LEVEL=DEBUG
  # (or any level ≤ DEBUG=0), or pass alert_msg_level=DEBUG on dispatch.
  ALERT_MSG_LEVEL: ${{ (github.event.inputs.alert_msg_level || '') != '' && github.event.inputs.alert_msg_level || vars.ALERT_MSG_LEVEL || 'SILENT' }}

jobs:
  update-wrappers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # allow_workflow_edits (vars.ALLOW_WORKFLOW_EDITS) no longer skips this
    # job: managed wrappers always follow the release (the consumer's
    # ai-workflow-integrity.yml locks them). With it false, only the
    # non-wrapper asset steps below are skipped; see "Report ignored
    # wrapper opt-out".
    # Re-exported for the `verify` job (issue #7004). Additive only.
    outputs:
      delivery: ${{ steps.commit_push.outputs.delivery }}
      pr_action: ${{ steps.commit_push.outputs.pr_action }}
      pr_number: ${{ steps.commit_push.outputs.pr_number }}
      pr_url: ${{ steps.commit_push.outputs.pr_url }}
      pushed_sha: ${{ steps.commit_push.outputs.pushed_sha }}
      branch: ${{ steps.commit_push.outputs.branch }}
      base: ${{ steps.commit_push.outputs.base }}
      upstream_sha: ${{ steps.fetch.outputs.upstream_sha }}
      verified: ${{ steps.verify_release_manifest.outputs.verified }}
      tag: ${{ steps.verify_release_manifest.outputs.tag }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      # Deprecation notice: ALLOW_WORKFLOW_EDITS=false used to skip the whole
      # sync. The name and the allow_workflow_edits input stay (CLAUDE.md §6),
      # but managed wrappers are now updated regardless.
      - name: Report ignored wrapper opt-out
        if: ${{ inputs.allow_workflow_edits == false }}
        run: |
          echo "WORKFLOW_EDITS_OPT_OUT outcome=ignored scope=managed_wrappers input=allow_workflow_edits value=false"
          echo "::warning::ALLOW_WORKFLOW_EDITS=false no longer stops managed workflow wrapper updates; it only skips the .claude/, CLAUDE.md, audit-gate, retired-file and changelog/agents asset steps. Remove allow_workflow_edits: false from ai-update-workflows.yml."

      - name: Fetch latest workflow templates from coding-workflows@stable
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          TEMPLATES_REPO="shubhodeep1/coding-workflows"
          TEMPLATES_REF="refs/tags/stable"
          TEMPLATES_DIR="workflow-templates"
          SCRIPTS_DIR="scripts"

          # Clone only the workflow-templates and scripts directories (sparse checkout)
          TMPDIR=$(mktemp -d)
          git clone --depth 1 --no-checkout \
            --filter=blob:none --sparse \
            "https://x-access-token:${GH_TOKEN}@github.com/${TEMPLATES_REPO}.git" \
            "${TMPDIR}/upstream"
          cd "${TMPDIR}/upstream"
          # Fetch the release tag explicitly. A long-lived branch also named
          # stable exists, so --branch stable would leave the authoritative
          # source ambiguous during release preparation.
          git fetch --force --no-tags --depth 1 origin "${TEMPLATES_REF}"
          UPSTREAM_SHA="$(git rev-parse 'FETCH_HEAD^{commit}')"
          git checkout --detach "${UPSTREAM_SHA}"
          # In cone mode, repo-root files remain present alongside these
          # directory patterns, which keeps workflow-templates/CLAUDE.md
          # (a symlink to ../CLAUDE.md) readable without passing a bare
          # root-file argument here; modern git rejects that form.
          git sparse-checkout set "${TEMPLATES_DIR}" "${SCRIPTS_DIR}"
          if [[ ! "${UPSTREAM_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Resolved upstream stable ref is not a 40-character commit SHA."
            exit 1
          fi
          UPSTREAM_SHA="${UPSTREAM_SHA,,}"

          # repository_dispatch payloads are untrusted hints only. Validate
          # them, but always render the freshly fetched stable commit so a
          # delayed event can never downgrade consumer pins.
          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            if [[ ! "${DISPATCH_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::warning::coding-workflows-stable-released payload is missing a valid 40-character sha; current stable ${UPSTREAM_SHA} wins."
            elif [ "${DISPATCH_SHA,,}" != "${UPSTREAM_SHA}" ]; then
              echo "::warning::Release payload sha ${DISPATCH_SHA,,} does not match current stable ${UPSTREAM_SHA}; current stable wins."
            fi
          fi
          cd -

          echo "upstream_dir=${TMPDIR}/upstream/${TEMPLATES_DIR}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"

      # Signed sync manifest verification (#7128). Runs before any fetched
      # upstream code: the stable tag is mutable, so trust comes only from
      # the attestation identity (the two release workflows on
      # refs/heads/stable, GitHub-hosted runners) and from the manifest's
      # commit and file hashes matching the fetched sparse checkout exactly.
      # The verifier lives in this file, which consumers pin by SHA, so it
      # never imports code from the tree it verifies.
      - name: Verify signed sync manifest
        id: verify_manifest
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          UPSTREAM_DIR: ${{ steps.fetch.outputs.upstream_dir }}
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
          SYNC_UPSTREAM_REPO: shubhodeep1/coding-workflows
        run: |
          set -euo pipefail

          UPSTREAM_ROOT="$(dirname "${UPSTREAM_DIR}")"
          SYNC_VERIFIER="${RUNNER_TEMP}/sync_manifest_verify.py"
          SYNC_ALLOWED_FILE="${RUNNER_TEMP}/sync_allowed_consumer_paths.txt"
          rm -f "${SYNC_ALLOWED_FILE}"

          reject() {
            echo "failure_reason_code=$1" >> "$GITHUB_OUTPUT"
            echo "::error::SYNC_MANIFEST outcome=rejected reason=$1${2:+ $2}"
            exit 1
          }

          cat > "${SYNC_VERIFIER}" <<'SYNC_VERIFY_PY'
          """Inline sync-manifest verifier and staged-path policy (#7128).

          Kept in update_workflows.yml on purpose: it must not import code from
          the upstream tree it verifies. The glob matcher mirrors
          scripts/build_sync_manifest.py::glob_to_regex (a test pins both).
          """
          import hashlib
          import json
          import os
          import re
          import stat
          import sys

          SCHEMA = "coding-workflows.sync-manifest.v1"
          REPOSITORY = "shubhodeep1/coding-workflows"


          def glob_to_regex(pattern):
              parts = [("[^/]*" if char == "*" else re.escape(char)) for char in pattern]
              return re.compile("^" + "".join(parts) + "$")


          def fail(code, path=None):
              print(code if path is None else f"{code} path={path}")
              sys.exit(1)


          def walk_tree(root):
              found = {}
              for dirpath, dirnames, filenames in os.walk(root, followlinks=False):
                  rel_dir = os.path.relpath(dirpath, root).replace(os.sep, "/")
                  if rel_dir == ".":
                      dirnames[:] = [name for name in dirnames if name != ".git"]
                  names = list(filenames)
                  for name in list(dirnames):
                      if os.path.islink(os.path.join(dirpath, name)):
                          dirnames.remove(name)
                          names.append(name)
                  for name in names:
                      full = os.path.join(dirpath, name)
                      rel = name if rel_dir == "." else f"{rel_dir}/{name}"
                      mode = os.lstat(full).st_mode
                      if stat.S_ISLNK(mode):
                          found[rel] = "symlink:" + os.readlink(full)
                      elif stat.S_ISREG(mode):
                          digest = hashlib.sha256()
                          with open(full, "rb") as handle:
                              for chunk in iter(lambda: handle.read(1 << 20), b""):
                                  digest.update(chunk)
                          found[rel] = digest.hexdigest()
                      else:
                          fail("ERR_SYNC_MANIFEST_FILE_MISMATCH", rel)
              return found


          def verify():
              try:
                  with open(os.environ["MANIFEST_FILE"], encoding="utf-8") as handle:
                      manifest = json.load(handle)
              except (OSError, KeyError, ValueError):
                  fail("ERR_SYNC_MANIFEST_MISSING")
              if not isinstance(manifest, dict):
                  fail("ERR_SYNC_MANIFEST_MISSING")
              if manifest.get("schema") != SCHEMA or manifest.get("repository") != REPOSITORY:
                  fail("ERR_SYNC_MANIFEST_COMMIT_MISMATCH")
              if manifest.get("commit") != os.environ.get("EXPECTED_COMMIT", "").lower():
                  fail("ERR_SYNC_MANIFEST_COMMIT_MISMATCH")
              if manifest.get("version") != os.environ.get("EXPECTED_VERSION", ""):
                  fail("ERR_SYNC_MANIFEST_COMMIT_MISMATCH")
              files = manifest.get("files")
              allowed = manifest.get("allowed_consumer_paths")
              if not isinstance(files, dict) or not all(isinstance(k, str) and isinstance(v, str) for k, v in files.items()):
                  fail("ERR_SYNC_MANIFEST_FILE_MISMATCH")
              if not isinstance(allowed, list) or not allowed or not all(isinstance(item, str) and item for item in allowed):
                  fail("ERR_SYNC_MANIFEST_FILE_MISMATCH")
              found = walk_tree(os.environ["UPSTREAM_ROOT"])
              for path in sorted(set(found) | set(files)):
                  if found.get(path) != files.get(path):
                      fail("ERR_SYNC_MANIFEST_FILE_MISMATCH", path)
              with open(os.environ["ALLOWED_OUT"], "w", encoding="utf-8") as handle:
                  handle.write("\n".join(allowed) + "\n")
              print(len(files))


          def check_paths(allowed_file, paths_file):
              with open(allowed_file, encoding="utf-8") as handle:
                  compiled = [glob_to_regex(line) for line in handle.read().splitlines() if line]
              if not compiled:
                  sys.exit(1)
              with open(paths_file, "rb") as handle:
                  paths = [item.decode("utf-8", "replace") for item in handle.read().split(b"\0") if item]
              for path in paths:
                  if not any(regex.match(path) for regex in compiled):
                      print(path)
                      sys.exit(3)


          if __name__ == "__main__":
              if len(sys.argv) == 2 and sys.argv[1] == "verify":
                  verify()
              elif len(sys.argv) == 4 and sys.argv[1] == "check-paths":
                  check_paths(sys.argv[2], sys.argv[3])
              else:
                  sys.exit(2)
          SYNC_VERIFY_PY

          # 1. The release version tag whose peeled commit is the fetched one.
          TAG_LIST="$(git -C "${UPSTREAM_ROOT}" ls-remote --tags origin 'refs/tags/v*')" \
            || reject ERR_SYNC_MANIFEST_NO_VERSION_TAG "detail=ls_remote_failed"
          SYNC_VERSION="$(printf '%s\n' "${TAG_LIST}" | while read -r tag_sha tag_ref; do
              [ "${tag_sha,,}" = "${UPSTREAM_SHA}" ] || continue
              [[ "${tag_ref}" =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)\^\{\}$ ]] || continue
              echo "${BASH_REMATCH[1]}"
            done | sort -V | tail -n 1)"
          [ -n "${SYNC_VERSION}" ] || reject ERR_SYNC_MANIFEST_NO_VERSION_TAG
          echo "version=${SYNC_VERSION}" >> "$GITHUB_OUTPUT"

          # 2. The manifest asset of that release.
          MANIFEST_DIR="${RUNNER_TEMP}/sync-manifest"
          rm -rf "${MANIFEST_DIR}"
          mkdir -p "${MANIFEST_DIR}"
          gh release download "${SYNC_VERSION}" --repo "${SYNC_UPSTREAM_REPO}" \
            --pattern sync-manifest.json --dir "${MANIFEST_DIR}" >/dev/null 2>&1 \
            || reject ERR_SYNC_MANIFEST_MISSING
          MANIFEST_FILE="${MANIFEST_DIR}/sync-manifest.json"
          { [ -f "${MANIFEST_FILE}" ] && [ ! -L "${MANIFEST_FILE}" ]; } || reject ERR_SYNC_MANIFEST_MISSING

          # 3. Its Sigstore attestation. No --source-digest: the signing run's
          # source is the tested commit, which can differ from the release
          # commit by the changelog fold; step 4 binds the release commit.
          VERIFY_HELP="$(gh attestation verify --help 2>&1 || true)"
          if ! grep -q -- '--cert-identity-regex' <<<"${VERIFY_HELP}" || ! grep -q -- '--deny-self-hosted-runners' <<<"${VERIFY_HELP}"; then
            reject ERR_SYNC_MANIFEST_SIGNATURE "reason=gh_flags_missing"
          fi
          if ! gh attestation verify "${MANIFEST_FILE}" \
            --repo "${SYNC_UPSTREAM_REPO}" \
            --cert-identity-regex '^https://github\.com/shubhodeep1/coding-workflows/\.github/workflows/(test-and-mark-stable|mark-stable)\.yml@refs/heads/stable$' \
            --deny-self-hosted-runners >/dev/null; then
            reject ERR_SYNC_MANIFEST_SIGNATURE
          fi

          # 4. Commit, version and the exact file set of the sparse checkout.
          set +e
          VERIFY_RESULT="$(MANIFEST_FILE="${MANIFEST_FILE}" UPSTREAM_ROOT="${UPSTREAM_ROOT}" \
            EXPECTED_COMMIT="${UPSTREAM_SHA}" EXPECTED_VERSION="${SYNC_VERSION}" \
            ALLOWED_OUT="${SYNC_ALLOWED_FILE}" PYTHONDONTWRITEBYTECODE=1 \
            python3 -I "${SYNC_VERIFIER}" verify)"
          VERIFY_RC=$?
          set -e
          if [ "${VERIFY_RC}" -ne 0 ]; then
            VERIFY_CODE="${VERIFY_RESULT%% *}"
            VERIFY_DETAIL=""
            if [[ "${VERIFY_RESULT}" == *" "* ]]; then
              VERIFY_DETAIL="${VERIFY_RESULT#* }"
            fi
            [[ "${VERIFY_CODE}" =~ ^ERR_SYNC_MANIFEST_[A-Z_]+$ ]] || VERIFY_CODE="ERR_SYNC_MANIFEST_FILE_MISMATCH"
            reject "${VERIFY_CODE}" "${VERIFY_DETAIL}"
          fi

          echo "allowed_file=${SYNC_ALLOWED_FILE}" >> "$GITHUB_OUTPUT"
          echo "failure_reason_code=" >> "$GITHUB_OUTPUT"
          echo "SYNC_MANIFEST outcome=verified version=${SYNC_VERSION} commit=${UPSTREAM_SHA} files=${VERIFY_RESULT}"

      # Fail-closed release-manifest verification (orchestrator project #6902,
      # issue #6960). Runs before every step that writes the consumer
      # checkout; any failure stops the job, so "Commit and push updates"
      # never runs. On unless the repo variable
      # UPDATER_VERIFY_RELEASE_MANIFEST is "false" (unset or empty is on).
      # Assumption: the authoritative plan
      # (docs/plans/safeguarded-consumer-updater-plan.md on branch
      # claude/elegant-mendel-5pli2i-safeguarded-updater-plan) could not be
      # read from the planning/implementation sandbox, so the variable, asset
      # name and log prefix are the provisional names from the issue. If the
      # plan names different identifiers, the plan wins.
      # The logic stays inline: in consumer runs the only scripts/ copy is
      # the release checkout being verified, so a helper there would be
      # unverified code.
      - name: Verify attested release manifest
        id: verify_release_manifest
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          UPSTREAM_DIR: ${{ steps.fetch.outputs.upstream_dir }}
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
          UPDATER_VERIFY_RELEASE_MANIFEST: ${{ vars.UPDATER_VERIFY_RELEASE_MANIFEST || 'true' }}
          RELEASE_MANIFEST_ASSET_NAME: release-manifest.v1.json
        run: |
          set -euo pipefail

          VERIFY_OUT="${GITHUB_OUTPUT:-/dev/null}"
          VERIFY_REASON_FILE="${UPDATER_MANIFEST_VERIFY_REASON_FILE:-/tmp/update_workflows_failure_reason.txt}"
          ASSET_NAME="${RELEASE_MANIFEST_ASSET_NAME:-release-manifest.v1.json}"
          RELEASE_REPO="shubhodeep1/coding-workflows"
          MANIFEST_MAX_BYTES=16777216

          verify_flag="${UPDATER_VERIFY_RELEASE_MANIFEST:-true}"
          verify_flag="${verify_flag//[[:space:]]/}"
          verify_flag="${verify_flag,,}"
          if [ "${verify_flag}" != "true" ]; then
            if [ "${verify_flag}" != "false" ]; then
              echo "::warning::UPDATER_VERIFY_RELEASE_MANIFEST is neither true nor false; release-manifest verification stays disabled."
            fi
            echo "UPDATER_MANIFEST_VERIFY outcome=skip reason=disabled"
            echo "verified=skipped" >> "${VERIFY_OUT}"
            echo "reason=disabled" >> "${VERIFY_OUT}"
            exit 0
          fi

          # Fixed, path-free tokens only; never echo URLs or credentials.
          reject() {
            local stage="$1"
            local reason="$2"
            echo "::error::UPDATER_MANIFEST_VERIFY outcome=rejected reason=${reason} stage=${stage}"
            echo "verified=false" >> "${VERIFY_OUT}"
            echo "reason=${reason}" >> "${VERIFY_OUT}"
            printf '%s\n%s\n' "ERR_RELEASE_MANIFEST_VERIFY_FAILED" "Release manifest verification failed at stage ${stage} (reason ${reason}); no consumer file was changed." > "${VERIFY_REASON_FILE}"
            exit 1
          }

          [[ "${UPSTREAM_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || reject input invalid_upstream_sha
          [ -n "${UPSTREAM_DIR:-}" ] && [ -d "${UPSTREAM_DIR}" ] || reject input upstream_missing
          UPSTREAM_ROOT="$(cd "${UPSTREAM_DIR}/.." && pwd -P)" || reject input upstream_missing
          for verify_tool in git gh jq sha256sum python3; do
            command -v "${verify_tool}" >/dev/null 2>&1 || reject input tool_missing
          done

          WORK="$(mktemp -d)" || reject input workdir_unavailable
          trap 'rm -rf "${WORK}"' EXIT
          MANIFEST="${WORK}/${ASSET_NAME}"

          # Release tag for UPSTREAM_SHA: git protocol on the existing clone
          # (no REST call). Peeled ^{} lines override annotated-tag objects.
          if ! tag_refs="$(git -C "${UPSTREAM_ROOT}" ls-remote --tags origin 'refs/tags/v*' 2>/dev/null)"; then
            reject tag release_tag_missing
          fi
          TAG="$(printf '%s\n' "${tag_refs}" | awk -v want="${UPSTREAM_SHA}" '
            NF >= 2 {
              sha = tolower($1); ref = $2
              sub(/^refs\/tags\//, "", ref)
              if (ref ~ /\^\{\}$/) { sub(/\^\{\}$/, "", ref); peeled[ref] = sha } else { direct[ref] = sha }
            }
            END {
              for (t in direct) {
                c = (t in peeled) ? peeled[t] : direct[t]
                if (t ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && c == want) print t
              }
            }' | sort -V | tail -n1)"
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || reject tag release_tag_missing

          # GitHub API (§14): no existing call in this job returns release
          # data, so this adds exactly one release lookup and one asset
          # download, only when the flag is on.
          if ! release_json="$(gh api "repos/${RELEASE_REPO}/releases/tags/${TAG}" 2>/dev/null)"; then
            reject release release_lookup_failed
          fi
          if ! asset_line="$(printf '%s' "${release_json}" | jq -r --arg name "${ASSET_NAME}" '
            if type == "object" and .draft == false and .prerelease == false then
              [(.assets // [])[] | select(type == "object" and .name == $name and .state == "uploaded")]
              | if length == 1 then "\(.[0].id) \(.[0].size)" else "missing" end
            else "invalid" end' 2>/dev/null)"; then
            reject release release_lookup_failed
          fi
          case "${asset_line}" in
            invalid|"") reject release release_lookup_failed ;;
            missing) reject release asset_missing ;;
          esac
          ASSET_ID="${asset_line%% *}"
          ASSET_SIZE="${asset_line##* }"
          [[ "${ASSET_ID}" =~ ^[0-9]+$ ]] && [[ "${ASSET_SIZE}" =~ ^[0-9]+$ ]] || reject release release_lookup_failed
          if [ "${ASSET_SIZE}" -le 0 ] || [ "${ASSET_SIZE}" -gt "${MANIFEST_MAX_BYTES}" ]; then
            reject release asset_missing
          fi

          if ! gh api -H 'Accept: application/octet-stream' "repos/${RELEASE_REPO}/releases/assets/${ASSET_ID}" > "${MANIFEST}" 2>/dev/null; then
            reject download asset_download_failed
          fi
          downloaded_size="$(wc -c < "${MANIFEST}" | tr -d '[:space:]')"
          [ "${downloaded_size}" = "${ASSET_SIZE}" ] || reject download asset_download_failed

          # Attestation with the runner's gh, never code from the release
          # tree. Both release workflows attest on GitHub-hosted runners.
          if ! gh attestation verify "${MANIFEST}" \
            --repo shubhodeep1/coding-workflows \
            --cert-identity-regex '^https://github\.com/shubhodeep1/coding-workflows/\.github/workflows/(mark-stable|test-and-mark-stable)\.yml@refs/heads/stable$' \
            --predicate-type https://slsa.dev/provenance/v1 \
            --deny-self-hosted-runners; then
            reject attestation attestation_failed
          fi

          if ! jq -e --arg repo "${RELEASE_REPO}" --arg sha "${UPSTREAM_SHA}" --arg tag "${TAG}" \
            'type == "object" and .repository == $repo and .release_sha == $sha and .tag == $tag' \
            "${MANIFEST}" >/dev/null 2>&1; then
            reject header manifest_header_mismatch
          fi

          # Bootstrap: hash every Python module the verifier executes before
          # running any code from the release tree.
          for bootstrap_rel in scripts/verify_release_manifest.py scripts/release_manifest.py scripts/workflow_wrapper_refs.py; do
            expected_sha256="$(jq -r --arg p "${bootstrap_rel}" \
              '[(.files // [])[] | select(type == "object" and .path == $p and .mode != "120000")] | if length == 1 then (.[0].sha256 // "") else "" end' \
              "${MANIFEST}" 2>/dev/null)" || expected_sha256=""
            [[ "${expected_sha256}" =~ ^[0-9a-f]{64}$ ]] || reject bootstrap verifier_unattested
            bootstrap_path="${UPSTREAM_ROOT}/${bootstrap_rel}"
            if [ ! -f "${bootstrap_path}" ] || [ -L "${bootstrap_path}" ]; then
              reject bootstrap verifier_hash_mismatch
            fi
            actual_sha256="$(sha256sum -- "${bootstrap_path}" | awk '{print $1}')"
            [ "${actual_sha256}" = "${expected_sha256}" ] || reject bootstrap verifier_hash_mismatch
          done

          # Every path the later steps read, relative to the release root.
          # Whole directories are enumerated so an injected file is reported
          # as unlisted_path.
          PATHS_FILE="${WORK}/paths.txt"
          (
            cd "${UPSTREAM_ROOT}"
            shopt -s nullglob
            for listed in workflow-templates/*.yml workflow-templates/profiles/*.txt; do
              printf '%s\n' "${listed}"
            done
            printf '%s\n' \
              workflow-templates/retired_files.txt \
              workflow-templates/CLAUDE.md \
              CLAUDE.md \
              scripts/workflow_wrapper_refs.py \
              scripts/apply_audit_gate_assets.py \
              scripts/assemble_changelog.py \
              scripts/assemble_agents.py \
              scripts/verify_release_manifest.py \
              scripts/release_manifest.py \
              scripts/lint_pr_body_auto_close.py \
              scripts/tg_helpers.sh
            for listed_dir in workflow-templates/.claude workflow-templates/audit-gate; do
              if [ -e "${listed_dir}" ] || [ -L "${listed_dir}" ]; then
                find "${listed_dir}" ! -type d -print
              fi
            done
          ) > "${PATHS_FILE}" || reject paths paths_enumeration_failed

          set +e
          verify_line="$(PYTHONDONTWRITEBYTECODE=1 python3 -I -B "${UPSTREAM_ROOT}/scripts/verify_release_manifest.py" verify \
            --manifest "${MANIFEST}" \
            --release-root "${UPSTREAM_ROOT}" \
            --expected-sha "${UPSTREAM_SHA}" \
            --expected-repository shubhodeep1/coding-workflows \
            --paths-file "${PATHS_FILE}" 2>/dev/null | head -n1)"
          verify_rc=$?
          set -e
          if [ "${verify_rc}" -ne 0 ]; then
            verify_reason="$(printf '%s\n' "${verify_line}" | sed -n 's/^UPDATER_MANIFEST_VERIFY outcome=rejected reason=\([a-z_]*\).*/\1/p')"
            [ -n "${verify_reason}" ] || verify_reason="internal_error"
            if [ -n "${verify_line}" ]; then
              echo "::error::${verify_line}"
            fi
            reject verify "${verify_reason}"
          fi
          echo "${verify_line}"
          echo "UPDATER_MANIFEST_VERIFY outcome=ok reason=ok tag=${TAG}"
          echo "verified=true" >> "${VERIFY_OUT}"
          echo "reason=ok" >> "${VERIFY_OUT}"
          echo "tag=${TAG}" >> "${VERIFY_OUT}"

      - name: Prepare immutable workflow wrappers
        id: render_wrappers
        run: |
          set -euo pipefail

          UPSTREAM_DIR="${{ steps.fetch.outputs.upstream_dir }}"
          UPSTREAM_SHA="${{ steps.fetch.outputs.upstream_sha }}"
          RENDERER="${UPSTREAM_DIR}/../scripts/workflow_wrapper_refs.py"
          RENDERED_DIR="$(mktemp -d)"

          [ -f "${RENDERER}" ] || { echo "::error::Immutable wrapper renderer is missing: ${RENDERER}"; exit 1; }

          shopt -s nullglob
          upstream_wrapper_templates=( "${UPSTREAM_DIR}"/*.yml )
          [ "${#upstream_wrapper_templates[@]}" -gt 0 ] || { echo "::error::No workflow wrappers found to render."; exit 1; }
          for upstream_wrapper_template in "${upstream_wrapper_templates[@]}"; do
            rendered_wrapper_path="${RENDERED_DIR}/$(basename "${upstream_wrapper_template}")"
            if ! PYTHONDONTWRITEBYTECODE=1 python3 "${RENDERER}" \
              --input "${upstream_wrapper_template}" \
              --output "${rendered_wrapper_path}" \
              --sha "${UPSTREAM_SHA}"; then
              echo "::error::Failed to render immutable wrapper: ${upstream_wrapper_template}"
              exit 1
            fi
          done
          shopt -u nullglob

          echo "rendered_dir=${RENDERED_DIR}" >> "$GITHUB_OUTPUT"

      - name: Apply canonical audit-gate assets
        id: audit_gate
        if: ${{ inputs.allow_workflow_edits != false }}
        run: |
          set -euo pipefail

          UPSTREAM_DIR="${{ steps.fetch.outputs.upstream_dir }}"
          CONTRACT_DIR="${UPSTREAM_DIR}/audit-gate"
          RESULT_FILE="/tmp/audit_gate_apply_result.json"
          CHANGED_FILES_FILE="/tmp/audit_gate_changed_files.txt"

          python3 "${UPSTREAM_DIR}/../scripts/apply_audit_gate_assets.py" \
            --contract-root "${CONTRACT_DIR}" \
            --repo-root "." \
            --result-file "${RESULT_FILE}" \
            --changed-files-file "${CHANGED_FILES_FILE}"

          status="$(python3 - <<'PY' "${RESULT_FILE}"
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(payload.get('status', ''))
          PY
          )"
          script_action="$(python3 - <<'PY' "${RESULT_FILE}"
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(payload.get('package_script_action', ''))
          PY
          )"
          message="$(python3 - <<'PY' "${RESULT_FILE}"
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(payload.get('message', ''))
          PY
          )"
          if [ -s "${CHANGED_FILES_FILE}" ]; then
            changed_count=$(wc -l < "${CHANGED_FILES_FILE}" | tr -d ' ')
          else
            changed_count=0
          fi

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "package_script_action=${script_action}" >> "$GITHUB_OUTPUT"
          echo "changed_count=${changed_count}" >> "$GITHUB_OUTPUT"
          echo "message=${message}" >> "$GITHUB_OUTPUT"

      - name: Sync .claude/ assets from upstream
        id: claude_sync
        if: ${{ inputs.allow_workflow_edits != false }}
        run: |
          set -euo pipefail

          # Mirror workflow-templates/.claude/ → .claude/ in the consumer
          # repo. Semantics, per design:
          #   - Upstream is source of truth: any file present in
          #     upstream's workflow-templates/.claude/ overwrites the
          #     consumer's copy on every sync. Hand-edits to consumer
          #     copies of synced files will be lost — matches how
          #     *.yml workflow wrappers already behave.
          #   - Consumer-local files NOT present in upstream are left
          #     alone (consumers can keep .claude/skills/private-foo/).
          #   - Files removed upstream are NOT deleted here; the next
          #     step ("Remove retired upstream files") deletes the ones
          #     listed in workflow-templates/retired_files.txt.
          # If upstream has no workflow-templates/.claude/ at this
          # stable ref, log and exit 0 — the sync is additive.

          UPSTREAM_DIR="${{ steps.fetch.outputs.upstream_dir }}"
          CLAUDE_UPSTREAM_DIR="${UPSTREAM_DIR}/.claude"
          CLAUDE_LOCAL_DIR=".claude"

          echo "claude_changed=0" >> "$GITHUB_OUTPUT"
          echo "claude_has_changes=false" >> "$GITHUB_OUTPUT"
          : > /tmp/claude_changed_files.txt

          if [ ! -d "${CLAUDE_UPSTREAM_DIR}" ]; then
            echo "Upstream has no workflow-templates/.claude/ at this ref — nothing to sync."
            exit 0
          fi

          mkdir -p "${CLAUDE_LOCAL_DIR}"

          CHANGED_COUNT=0
          while IFS= read -r upstream_path; do
            [ -n "${upstream_path}" ] || continue
            rel="${upstream_path#${CLAUDE_UPSTREAM_DIR}/}"
            local_path="${CLAUDE_LOCAL_DIR}/${rel}"
            local_dir=$(dirname "${local_path}")
            mkdir -p "${local_dir}"

            # Copy if absent or differs (whitespace-tolerant compare,
            # matching the wrapper-update step's diff invocation so
            # CRLF round-trips don't trigger spurious churn).
            if [ ! -f "${local_path}" ] || ! diff -q --strip-trailing-cr --ignore-space-at-eol "${upstream_path}" "${local_path}" >/dev/null 2>&1; then
              cp "${upstream_path}" "${local_path}"
              CHANGED_COUNT=$((CHANGED_COUNT + 1))
              printf '%s\n' "${local_path}" >> /tmp/claude_changed_files.txt
            fi
          done < <(LC_ALL=C find "${CLAUDE_UPSTREAM_DIR}" -type f | LC_ALL=C sort)

          echo "claude_changed=${CHANGED_COUNT}" >> "$GITHUB_OUTPUT"
          if [ "${CHANGED_COUNT}" -gt 0 ]; then
            echo "claude_has_changes=true" >> "$GITHUB_OUTPUT"
            echo ".claude/ assets synced: ${CHANGED_COUNT} file(s) changed."
          else
            echo ".claude/ assets already up to date."
          fi

      - name: Remove retired upstream files
        id: retired_files
        if: ${{ inputs.allow_workflow_edits != false }}
        run: |
          set -euo pipefail

          # Files coding-workflows no longer ships (workflow-templates/
          # retired_files.txt: "<consumer path> <sha256> [<sha256> ...]").
          # The .claude/ sync above never deletes, so retired assets would
          # otherwise linger. A file is deleted only when its sha256 matches
          # a released version listed in the manifest; a consumer-modified
          # copy is kept and logged (RETIRED_FILE_KEPT_MODIFIED). No GitHub
          # API calls; a missing manifest is a no-op.
          MANIFEST="${{ steps.fetch.outputs.upstream_dir }}/retired_files.txt"
          : > /tmp/retired_removed_files.txt
          echo "retired_removed=0" >> "$GITHUB_OUTPUT"
          echo "retired_has_changes=false" >> "$GITHUB_OUTPUT"
          if [ ! -f "${MANIFEST}" ]; then
            echo "Upstream has no workflow-templates/retired_files.txt at this ref — nothing to retire."
            exit 0
          fi

          REMOVED=0
          while read -r retired_path retired_hashes; do
            case "${retired_path}" in
              ''|'#'*) continue ;;
            esac
            case "${retired_path}" in
              /*|*..*|.git/*)
                echo "::warning::RETIRED_FILE_SKIPPED path=${retired_path} reason=unsafe_path"
                continue
                ;;
            esac
            if [ ! -f "${retired_path}" ] || [ -L "${retired_path}" ]; then
              continue
            fi
            actual="$(sha256sum "${retired_path}" | awk '{print $1}')"
            matched=false
            for expected in ${retired_hashes}; do
              if [ "${actual}" = "${expected}" ]; then
                matched=true
                break
              fi
            done
            if [ "${matched}" = "true" ]; then
              rm -f -- "${retired_path}"
              printf '%s\n' "${retired_path}" >> /tmp/retired_removed_files.txt
              REMOVED=$((REMOVED + 1))
              echo "RETIRED_FILE_REMOVED path=${retired_path}"
            else
              echo "::warning::RETIRED_FILE_KEPT_MODIFIED path=${retired_path} sha256=${actual}"
            fi
          done < "${MANIFEST}"

          echo "retired_removed=${REMOVED}" >> "$GITHUB_OUTPUT"
          if [ "${REMOVED}" -gt 0 ]; then
            echo "retired_has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync top-level CLAUDE.md from upstream
        id: claude_md_sync
        if: ${{ inputs.allow_workflow_edits != false }}
        run: |
          set -euo pipefail

          # Mirror upstream's root CLAUDE.md → consumer's root CLAUDE.md.
          # Semantics match the .claude/ sync above and the wrapper
          # update: upstream is source of truth, hand-edits are
          # overwritten on every sync. The upstream copy reached here
          # via the workflow-templates/CLAUDE.md symlink (→ ../CLAUDE.md);
          # cp -L dereferences it so the consumer gets a regular file
          # at its repo root, not a symlink. If upstream has no
          # CLAUDE.md at this stable ref the sync is a no-op.

          UPSTREAM_DIR="${{ steps.fetch.outputs.upstream_dir }}"
          UPSTREAM_CLAUDE_MD="${UPSTREAM_DIR}/CLAUDE.md"
          LOCAL_CLAUDE_MD="CLAUDE.md"

          echo "claude_md_changed=false" >> "$GITHUB_OUTPUT"
          rm -f /tmp/claude_md_changed_file.txt

          if [ ! -e "${UPSTREAM_CLAUDE_MD}" ] && [ ! -L "${UPSTREAM_CLAUDE_MD}" ]; then
            echo "Upstream has no workflow-templates/CLAUDE.md at this ref — nothing to sync."
            exit 0
          fi

          # Dereferenced read — if the symlink target wasn't pulled by
          # sparse-checkout this will fail loudly rather than silently
          # writing a broken file.
          if ! cat -- "${UPSTREAM_CLAUDE_MD}" >/dev/null 2>&1; then
            echo "::error::Root CLAUDE.md is unreadable via workflow-templates/CLAUDE.md (dangling symlink or missing sparse-checkout target)."
            exit 1
          fi

          if [ ! -f "${LOCAL_CLAUDE_MD}" ] || ! diff -q --strip-trailing-cr --ignore-space-at-eol "${UPSTREAM_CLAUDE_MD}" "${LOCAL_CLAUDE_MD}" >/dev/null 2>&1; then
            cp -L "${UPSTREAM_CLAUDE_MD}" "${LOCAL_CLAUDE_MD}"
            echo "claude_md_changed=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${LOCAL_CLAUDE_MD}" > /tmp/claude_md_changed_file.txt
            echo "Top-level CLAUDE.md synced from upstream."
          else
            echo "Top-level CLAUDE.md already up to date."
          fi

      - name: Sync changelog fragment assets from upstream
        id: changelog_sync
        if: ${{ inputs.allow_workflow_edits != false }}
        run: |
          set -euo pipefail

          # Fifth sync category (CLAUDE.md §20). Consumer repos hit constant
          # CHANGELOG.md merge conflicts because newest-entry-first insertion
          # makes every concurrent PR edit the same hunk at line 1. The fix is
          # the changelog.d/ fragment workflow: one file per PR, so two PRs
          # never touch the same path. This step lands the scaffolding that
          # makes the mechanism real in the consumer:
          #   - changelog.d/.gitkeep — the directory agents write fragments to.
          #   - .gitattributes — the managed `CHANGELOG.md merge=union` block,
          #     a backstop for direct edits that bypass fragments.
          # Semantics differ deliberately from the .claude/ sync above: this is
          # ADDITIVE ONLY. .gitattributes is edited through a delimited managed
          # block, so consumer-local attribute rules are preserved rather than
          # overwritten, and an existing changelog.d/ is never emptied.
          # Runs upstream's scripts/assemble_changelog.py from the @stable
          # support checkout — the consumer never carries a copy, so the rule
          # in CLAUDE.md §20 and the machinery implementing it cannot drift.

          UPSTREAM_DIR="${{ steps.fetch.outputs.upstream_dir }}"
          UPSTREAM_SCRIPTS_DIR="$(dirname "${UPSTREAM_DIR}")/scripts"
          ASSEMBLER="${UPSTREAM_SCRIPTS_DIR}/assemble_changelog.py"

          echo "changelog_assets_has_changes=false" >> "$GITHUB_OUTPUT"
          rm -f /tmp/changelog_asset_files.txt

          if [ ! -f "${ASSEMBLER}" ]; then
            echo "Upstream has no scripts/assemble_changelog.py at this ref — nothing to sync."
            exit 0
          fi

          PYTHONDONTWRITEBYTECODE=1 python3 "${ASSEMBLER}" ensure-assets \
            --repo-root . \
            --changed-paths-file /tmp/changelog_asset_files.txt

      - name: Assemble changelog fragments
        id: changelog_assemble
        if: ${{ inputs.allow_workflow_edits != false }}
        run: |
          set -euo pipefail

          # Consumer-side assembly host (CLAUDE.md §18.A/§18.B — folded into
          # automation that already runs, no operator action). Consumer repos
          # have no release workflow and no push-triggered wrapper, so this
          # sync job — which already commits and pushes to the default branch
          # below — is the only existing automation that can fold fragments
          # into CHANGELOG.md. Assembly therefore lands on the next sync run
          # (daily 04:00 UTC cron, or immediately on the @stable
          # repository_dispatch) rather than at merge time.
          #
          # The assembler auto-detects the repo's layout: Keep a Changelog
          # (## [Unreleased] + ### subsections) upstream, bare ## YYYY-MM-DD
          # date headings in consumers such as tele-funtoken-msg-scoring. No
          # consumer has to convert its changelog history.

          UPSTREAM_DIR="${{ steps.fetch.outputs.upstream_dir }}"
          UPSTREAM_SCRIPTS_DIR="$(dirname "${UPSTREAM_DIR}")/scripts"
          ASSEMBLER="${UPSTREAM_SCRIPTS_DIR}/assemble_changelog.py"

          echo "changelog_assembled=false" >> "$GITHUB_OUTPUT"

          if [ ! -f "${ASSEMBLER}" ]; then
            echo "Upstream has no scripts/assemble_changelog.py at this ref — skipping assembly."
            exit 0
          fi

          PYTHONDONTWRITEBYTECODE=1 python3 "${ASSEMBLER}" assemble --repo-root .

      - name: Assemble agents.md fragments
        id: agents_assemble
        if: ${{ inputs.allow_workflow_edits != false }}
        run: |
          set -euo pipefail

          # Same consumer-side host as the changelog step above, for the
          # agents.d/ fragments of CLAUDE.md §30: PRs add
          # agents.d/<issue-or-pr>-<slug>.md instead of editing AGENTS.md, and
          # this sync folds them in. Runs upstream's script from the @stable
          # support checkout. Fails open: a fragment that cannot fold stays for
          # the next sync, and the step never fails the wrapper update.

          UPSTREAM_DIR="${{ steps.fetch.outputs.upstream_dir }}"
          UPSTREAM_SCRIPTS_DIR="$(dirname "${UPSTREAM_DIR}")/scripts"
          AGENTS_ASSEMBLER="${UPSTREAM_SCRIPTS_DIR}/assemble_agents.py"

          echo "agents_assembled=false" >> "$GITHUB_OUTPUT"

          if [ ! -f "${AGENTS_ASSEMBLER}" ]; then
            echo "Upstream has no scripts/assemble_agents.py at this ref — skipping assembly."
            exit 0
          fi

          PYTHONDONTWRITEBYTECODE=1 python3 "${AGENTS_ASSEMBLER}" assemble --repo-root . \
            || echo "::warning::agents.md fragment assembly failed; fragments stay in agents.d/ for the next sync."

      - name: Compare and update workflow wrappers
        id: update
        run: |
          set -euo pipefail

          UPSTREAM_DIR="${{ steps.fetch.outputs.upstream_dir }}"
          RENDERED_DIR="${{ steps.render_wrappers.outputs.rendered_dir }}"
          LOCAL_DIR=".github/workflows"
          UPDATED_FILES=""
          CREATED_FILES=""
          SKIPPED_FILES=""
          TOTAL_CHECKED=0
          TOTAL_UPDATED=0
          TOTAL_CREATED=0
          FAILURE_REASON_FILE="/tmp/update_workflows_failure_reason.txt"
          SELECTED_PROFILE="${{ vars.WORKFLOW_PROFILE != '' && vars.WORKFLOW_PROFILE || 'full' }}"
          PROFILE_MANIFEST_DIR="${UPSTREAM_DIR}/profiles"
          PROFILE_MANIFEST="${PROFILE_MANIFEST_DIR}/${SELECTED_PROFILE}.txt"
          manifest_templates=()
          self_template_selected=false

          # The updater itself must already exist for this job to run. Refresh
          # it when present, but never auto-create it, to avoid bootstrap loops.
          SELF_TEMPLATE="ai-update-workflows.yml"

          printf '' > /tmp/updated_files.txt
          printf '' > /tmp/created_files.txt
          printf '' > /tmp/skipped_files.txt
          : > "${FAILURE_REASON_FILE}"

          echo "templates_checked=0" >> "$GITHUB_OUTPUT"
          echo "templates_updated=0" >> "$GITHUB_OUTPUT"
          echo "templates_created=0" >> "$GITHUB_OUTPUT"
          echo "has_updates=false" >> "$GITHUB_OUTPUT"
          echo "validation_ok=false" >> "$GITHUB_OUTPUT"
          echo "failure_reason_code=" >> "$GITHUB_OUTPUT"
          echo "failure_reason_detail=" >> "$GITHUB_OUTPUT"

          fail_with_reason() {
            local code="$1"
            local detail="$2"
            local detail_sanitized="${detail//$'\r'/ }"
            detail_sanitized="${detail_sanitized//$'\n'/ }"
            echo "::error::${code}: ${detail_sanitized}"
            echo "validation_ok=false" >> "$GITHUB_OUTPUT"
            echo "failure_reason_code=${code}" >> "$GITHUB_OUTPUT"
            echo "failure_reason_detail=${detail_sanitized}" >> "$GITHUB_OUTPUT"
            printf '%s\n%s\n' "${code}" "${detail_sanitized}" > "${FAILURE_REASON_FILE}"
            exit 1
          }

          [ -n "${UPSTREAM_DIR}" ] || fail_with_reason "ERR_UPSTREAM_DIR_EMPTY" "Fetch step did not provide upstream_dir."
          [ -d "${UPSTREAM_DIR}" ] || fail_with_reason "ERR_UPSTREAM_DIR_MISSING" "Upstream template directory does not exist: ${UPSTREAM_DIR}"

          shopt -s nullglob
          upstream_templates=( "${UPSTREAM_DIR}"/*.yml )
          [ "${#upstream_templates[@]}" -gt 0 ] || fail_with_reason "ERR_UPSTREAM_TEMPLATES_EMPTY" "No workflow templates (*.yml) found in ${UPSTREAM_DIR}."
          [ -f "${UPSTREAM_DIR}/${SELF_TEMPLATE}" ] || fail_with_reason "ERR_UPSTREAM_SELF_TEMPLATE_MISSING" "Expected sentinel template ${SELF_TEMPLATE} is missing from ${UPSTREAM_DIR}."

          [ -d "${LOCAL_DIR}" ] || fail_with_reason "ERR_LOCAL_WORKFLOW_DIR_MISSING" "Local workflow directory is missing: ${LOCAL_DIR}"
          [ -w "${LOCAL_DIR}" ] || fail_with_reason "ERR_LOCAL_WORKFLOW_DIR_NOT_WRITABLE" "Local workflow directory is not writable: ${LOCAL_DIR}"

          [ -d "${PROFILE_MANIFEST_DIR}" ] || fail_with_reason "ERR_PROFILE_MANIFEST_DIR_MISSING" "Upstream profile manifest directory does not exist: ${PROFILE_MANIFEST_DIR}."
          [ -f "${PROFILE_MANIFEST}" ] || fail_with_reason "ERR_WORKFLOW_PROFILE_UNKNOWN" "Requested WORKFLOW_PROFILE '${SELECTED_PROFILE}' does not match an upstream manifest in ${PROFILE_MANIFEST_DIR}."

          while IFS= read -r manifest_entry || [ -n "${manifest_entry}" ]; do
            manifest_entry="${manifest_entry%$'\r'}"
            manifest_entry="${manifest_entry#"${manifest_entry%%[![:space:]]*}"}"
            manifest_entry="${manifest_entry%"${manifest_entry##*[![:space:]]}"}"
            [ -n "${manifest_entry}" ] || continue
            upstream_file="${RENDERED_DIR}/${manifest_entry}"
            [ -f "${upstream_file}" ] || fail_with_reason "ERR_PROFILE_TEMPLATE_MISSING" "Workflow profile ${SELECTED_PROFILE} references missing template ${manifest_entry}."
            manifest_templates+=( "${upstream_file}" )
            if [ "${manifest_entry}" = "${SELF_TEMPLATE}" ]; then
              self_template_selected=true
            fi
          done < "${PROFILE_MANIFEST}"

          [ "${#manifest_templates[@]}" -gt 0 ] || fail_with_reason "ERR_WORKFLOW_PROFILE_EMPTY" "Workflow profile ${SELECTED_PROFILE} has no template entries."

          # The self-updater is bootstrap-only when absent, but once present
          # it must receive immutable pins even when the selected profile does
          # not list it.
          if [ "${self_template_selected}" != "true" ] && [ -e "${LOCAL_DIR}/${SELF_TEMPLATE}" ]; then
            manifest_templates+=( "${RENDERED_DIR}/${SELF_TEMPLATE}" )
          fi

          for upstream_file in "${manifest_templates[@]}"; do
            filename=$(basename "$upstream_file")
            local_file="${LOCAL_DIR}/${filename}"
            if [ "$filename" = "$SELF_TEMPLATE" ] && [ ! -e "$local_file" ]; then
              continue
            fi
            if [ -e "$local_file" ] && [ -d "$local_file" ]; then
              fail_with_reason "ERR_LOCAL_TARGET_IS_DIRECTORY" "Existing workflow path is a directory, not a file: ${local_file}"
            fi
            if [ -e "$local_file" ] && [ ! -w "$local_file" ]; then
              fail_with_reason "ERR_LOCAL_TARGET_NOT_WRITABLE" "Existing workflow file is not writable: ${local_file}"
            fi
          done

          for upstream_file in "${manifest_templates[@]}"; do
            filename=$(basename "$upstream_file")
            local_file="${LOCAL_DIR}/${filename}"
            TOTAL_CHECKED=$((TOTAL_CHECKED + 1))

            if [ ! -f "$local_file" ]; then
              if [ "$filename" = "$SELF_TEMPLATE" ]; then
                SKIPPED_FILES="${SKIPPED_FILES}${filename} (self-updater absent, skipped)\n"
                continue
              fi

              echo "Creating: ${filename}"
              cp "$upstream_file" "$local_file" || fail_with_reason "ERR_TEMPLATE_COPY_FAILED" "Failed to create workflow file ${local_file} from ${upstream_file}."
              TOTAL_CREATED=$((TOTAL_CREATED + 1))
              CREATED_FILES="${CREATED_FILES}• ${filename}\n"
              continue
            fi

            # Exact byte comparison. The consumer's ai-workflow-integrity.yml
            # accepts only byte-identical wrappers, and the former
            # `diff --ignore-space-at-eol` (a git-only flag, GNU diff exits 2)
            # counted every wrapper as updated on every run.
            if ! cmp -s "$upstream_file" "$local_file"; then
              echo "Updating: ${filename}"
              cp "$upstream_file" "$local_file" || fail_with_reason "ERR_TEMPLATE_COPY_FAILED" "Failed to update workflow file ${local_file} from ${upstream_file}."
              TOTAL_UPDATED=$((TOTAL_UPDATED + 1))
              UPDATED_FILES="${UPDATED_FILES}• ${filename}\n"
            fi
          done
          shopt -u nullglob

          echo "validation_ok=true" >> "$GITHUB_OUTPUT"
          echo "failure_reason_code=" >> "$GITHUB_OUTPUT"
          echo "failure_reason_detail=" >> "$GITHUB_OUTPUT"

          echo "templates_checked=${TOTAL_CHECKED}" >> "$GITHUB_OUTPUT"
          echo "templates_updated=${TOTAL_UPDATED}" >> "$GITHUB_OUTPUT"
          echo "templates_created=${TOTAL_CREATED}" >> "$GITHUB_OUTPUT"

          # Store multi-line outputs via files
          printf '%b' "$UPDATED_FILES" > /tmp/updated_files.txt
          printf '%b' "$CREATED_FILES" > /tmp/created_files.txt
          printf '%b' "$SKIPPED_FILES" > /tmp/skipped_files.txt

          TOTAL_CHANGED=$((TOTAL_UPDATED + TOTAL_CREATED))
          if [ "$TOTAL_CHANGED" -eq 0 ]; then
            echo "All workflow wrappers are up to date."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      # Pull-request delivery (issue #6989, orchestrator project #6902).
      # Assumption: the authoritative plan
      # (docs/plans/safeguarded-consumer-updater-plan.md on branch
      # claude/elegant-mendel-5pli2i-safeguarded-updater-plan) could not be
      # read, so UPDATER_PR_DELIVERY_ENABLED (default true), the branch
      # prefix auto/update-workflows- and the log prefix UPDATER_PR_DELIVERY
      # are the provisional names from the issue. With the flag set to false
      # this step still pushes straight to the default branch. With it on, nothing is
      # pushed to the default branch: the commit goes to
      # auto/update-workflows-<release-sha-12> with a lease-checked push and
      # one pull request is opened or refreshed. This step never enables
      # auto-merge: for a verified=true release it records
      # auto_merge=pending_verify, and the separate `verify` job (issue #7004)
      # enables auto-merge, bound to the pushed head, only after it has
      # checked the PR tree against the attested release manifest and posted
      # the ai-update-workflows/verify commit status. PR calls use GH_PAT, so the job requests no
      # pull-requests permission: a reusable job cannot raise the caller's
      # contents: write grant, and asking for more fails the run at startup.
      - name: Commit and push updates
        id: commit_push
        if: steps.update.outputs.has_updates == 'true' || steps.audit_gate.outputs.status == 'applied' || steps.claude_sync.outputs.claude_has_changes == 'true' || steps.retired_files.outputs.retired_has_changes == 'true' || steps.claude_md_sync.outputs.claude_md_changed == 'true' || steps.changelog_sync.outputs.changelog_assets_has_changes == 'true' || steps.changelog_assemble.outputs.changelog_assembled == 'true' || steps.agents_assemble.outputs.agents_assembled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          UPDATE_VIA_PR: ${{ inputs.update_via_pull_request != false }}
          SYNC_VERSION: ${{ steps.verify_manifest.outputs.version }}
          SYNC_UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
          SYNC_ALLOWED_FILE: ${{ steps.verify_manifest.outputs.allowed_file }}
          UPSTREAM_DIR: ${{ steps.fetch.outputs.upstream_dir }}
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
          VERIFIED: ${{ steps.verify_release_manifest.outputs.verified }}
          RELEASE_TAG: ${{ steps.verify_release_manifest.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATER_PR_DELIVERY_ENABLED: ${{ vars.UPDATER_PR_DELIVERY_ENABLED || 'true' }}
          # Passed via env: so the run body carries no expressions (tests/test_workflow_file_size_limit.py 18,000-char guard).
          CHANGELOG_ASSEMBLED: ${{ steps.changelog_assemble.outputs.changelog_assembled }}
          CHANGELOG_FRAGMENT_COUNT: ${{ steps.changelog_assemble.outputs.changelog_fragment_count }}
          CHANGELOG_LAYOUT: ${{ steps.changelog_assemble.outputs.changelog_layout }}
          AGENTS_ASSEMBLED: ${{ steps.agents_assemble.outputs.agents_assembled }}
          AGENTS_FILE: ${{ steps.agents_assemble.outputs.agents_file }}
          AGENTS_FRAGMENT_COUNT: ${{ steps.agents_assemble.outputs.agents_fragment_count }}
        run: |
          set -euo pipefail

          PR_OUT="${GITHUB_OUTPUT:-/dev/null}"
          PR_DELIVERY="false"
          pr_delivery_flag="${UPDATER_PR_DELIVERY_ENABLED:-true}"
          pr_delivery_flag="${pr_delivery_flag//[[:space:]]/}"
          pr_delivery_flag="${pr_delivery_flag,,}"
          if [ "${pr_delivery_flag}" = "true" ]; then
            PR_DELIVERY="true"
          elif [ "${pr_delivery_flag}" != "false" ]; then
            echo "::warning::UPDATER_PR_DELIVERY_ENABLED is neither true nor false; pull-request delivery stays disabled."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .github/workflows/
          if [ -f /tmp/audit_gate_changed_files.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              git add -- "$changed_path"
            done < /tmp/audit_gate_changed_files.txt
          fi
          if [ -f /tmp/claude_changed_files.txt ] && [ -s /tmp/claude_changed_files.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              git add -- "$changed_path"
            done < /tmp/claude_changed_files.txt
          fi
          if [ -f /tmp/claude_md_changed_file.txt ] && [ -s /tmp/claude_md_changed_file.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              git add -- "$changed_path"
            done < /tmp/claude_md_changed_file.txt
          fi
          if [ -f /tmp/retired_removed_files.txt ] && [ -s /tmp/retired_removed_files.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              git add -A -- "$changed_path"
            done < /tmp/retired_removed_files.txt
          fi
          if [ -f /tmp/changelog_asset_files.txt ] && [ -s /tmp/changelog_asset_files.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              git add -- "$changed_path"
            done < /tmp/changelog_asset_files.txt
          fi
          # Assembly both rewrites CHANGELOG.md and deletes the folded
          # fragments, so stage with -A to pick up the removals.
          if [ "${CHANGELOG_ASSEMBLED:-}" = "true" ]; then
            git add -A -- CHANGELOG.md changelog.d
          fi
          # Same for agents.d/: the agents file is rewritten and fragments deleted.
          if [ "${AGENTS_ASSEMBLED:-}" = "true" ]; then
            git add -A -- "${AGENTS_FILE}" agents.d
          fi

          # Signed path policy (#7128): every staged path must match the
          # allowlist of the verified sync manifest, or nothing is committed.
          SYNC_VERIFIER="${RUNNER_TEMP}/sync_manifest_verify.py"
          if [ -z "${SYNC_ALLOWED_FILE:-}" ] || [ ! -s "${SYNC_ALLOWED_FILE}" ] || [ ! -f "${SYNC_VERIFIER}" ]; then
            echo "::error::ERR_SYNC_PATH_NOT_ALLOWED reason=allowlist_missing"
            git reset -q
            exit 1
          fi
          SYNC_STAGED_PATHS_FILE="$(mktemp)"
          git diff --cached --name-only --no-renames -z > "${SYNC_STAGED_PATHS_FILE}"
          set +e
          SYNC_DENIED_PATH="$(PYTHONDONTWRITEBYTECODE=1 python3 -I "${SYNC_VERIFIER}" check-paths "${SYNC_ALLOWED_FILE}" "${SYNC_STAGED_PATHS_FILE}")"
          SYNC_POLICY_RC=$?
          set -e
          if [ "${SYNC_POLICY_RC}" -ne 0 ]; then
            if [ "${SYNC_POLICY_RC}" -eq 3 ]; then
              echo "::error::ERR_SYNC_PATH_NOT_ALLOWED path=${SYNC_DENIED_PATH}"
            else
              echo "::error::ERR_SYNC_PATH_NOT_ALLOWED reason=policy_check_failed"
            fi
            git reset -q
            exit 1
          fi

          COMMIT_BODY=""
          UPDATED_LIST=$(cat /tmp/updated_files.txt)
          CREATED_LIST=$(cat /tmp/created_files.txt)
          AUDIT_CHANGED_LIST=""
          if [ -f /tmp/audit_gate_changed_files.txt ] && [ -s /tmp/audit_gate_changed_files.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              AUDIT_CHANGED_LIST="${AUDIT_CHANGED_LIST}• ${changed_path}\n"
            done < /tmp/audit_gate_changed_files.txt
          fi
          CLAUDE_CHANGED_LIST=""
          if [ -f /tmp/claude_changed_files.txt ] && [ -s /tmp/claude_changed_files.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              CLAUDE_CHANGED_LIST="${CLAUDE_CHANGED_LIST}• ${changed_path}\n"
            done < /tmp/claude_changed_files.txt
          fi
          if [ -n "$UPDATED_LIST" ]; then
            COMMIT_BODY="${COMMIT_BODY}Updated templates:\n${UPDATED_LIST}\n"
          fi
          if [ -n "$CREATED_LIST" ]; then
            COMMIT_BODY="${COMMIT_BODY}New templates:\n${CREATED_LIST}\n"
          fi
          if [ -n "$AUDIT_CHANGED_LIST" ]; then
            COMMIT_BODY="${COMMIT_BODY}Audit gate assets:\n${AUDIT_CHANGED_LIST}\n"
          fi
          if [ -n "$CLAUDE_CHANGED_LIST" ]; then
            COMMIT_BODY="${COMMIT_BODY}.claude/ assets:\n${CLAUDE_CHANGED_LIST}\n"
          fi
          CLAUDE_MD_CHANGED_LIST=""
          if [ -f /tmp/claude_md_changed_file.txt ] && [ -s /tmp/claude_md_changed_file.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              CLAUDE_MD_CHANGED_LIST="${CLAUDE_MD_CHANGED_LIST}• ${changed_path}\n"
            done < /tmp/claude_md_changed_file.txt
          fi
          if [ -n "$CLAUDE_MD_CHANGED_LIST" ]; then
            COMMIT_BODY="${COMMIT_BODY}Top-level CLAUDE.md:\n${CLAUDE_MD_CHANGED_LIST}\n"
          fi
          RETIRED_REMOVED_LIST=""
          if [ -f /tmp/retired_removed_files.txt ] && [ -s /tmp/retired_removed_files.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              RETIRED_REMOVED_LIST="${RETIRED_REMOVED_LIST}• ${changed_path}\n"
            done < /tmp/retired_removed_files.txt
          fi
          if [ -n "$RETIRED_REMOVED_LIST" ]; then
            COMMIT_BODY="${COMMIT_BODY}Retired files removed:\n${RETIRED_REMOVED_LIST}\n"
          fi
          CHANGELOG_ASSET_LIST=""
          if [ -f /tmp/changelog_asset_files.txt ] && [ -s /tmp/changelog_asset_files.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              CHANGELOG_ASSET_LIST="${CHANGELOG_ASSET_LIST}• ${changed_path}\n"
            done < /tmp/changelog_asset_files.txt
          fi
          if [ -n "$CHANGELOG_ASSET_LIST" ]; then
            COMMIT_BODY="${COMMIT_BODY}Changelog fragment assets:\n${CHANGELOG_ASSET_LIST}\n"
          fi
          if [ "${CHANGELOG_ASSEMBLED:-}" = "true" ]; then
            COMMIT_BODY="${COMMIT_BODY}Changelog fragments assembled into CHANGELOG.md (${CHANGELOG_FRAGMENT_COUNT:-} fragment(s), layout ${CHANGELOG_LAYOUT:-}).\n"
          fi
          if [ "${AGENTS_ASSEMBLED:-}" = "true" ]; then
            COMMIT_BODY="${COMMIT_BODY}agents.d fragments assembled into ${AGENTS_FILE:-} (${AGENTS_FRAGMENT_COUNT:-} fragment(s)).\n"
          fi

          if git diff --cached --quiet; then
            echo "No staged changes detected after update step; skipping commit."
            echo "delivery=none" >> "${PR_OUT}"
            exit 0
          fi

          # Captured before the commit so the PR path never relies on HEAD~1 in
          # the shallow checkout.
          BASE_SHA="$(git rev-parse HEAD)"
          CHECKED_OUT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"

          git commit -m "$(printf 'chore: update AI workflow wrappers from coding-workflows@stable\n\n%b\nAuto-applied by ai-update-workflows. Managed wrappers always follow\nthe pinned release; ALLOW_WORKFLOW_EDITS='\''false'\'' only skips other assets.' "$COMMIT_BODY")"

          # Delivery selection. UPDATER_PR_DELIVERY_ENABLED=true (#6989/#7004)
          # selects the auto/update-workflows-<release-sha-12> pull request at
          # the end of this step, which the `verify` job checks before enabling
          # auto-merge. Otherwise the update_via_pull_request input (#7128,
          # default true) selects the ai-sync/stable pull request, and false
          # keeps the direct push to the default branch.
          if [ "${PR_DELIVERY}" != "true" ] && [ "${UPDATE_VIA_PR:-true}" != "true" ]; then
            echo "delivery=direct" >> "${PR_OUT}"
            git push
            echo "sync_pr_state=pushed" >> "$GITHUB_OUTPUT"
            echo "sync_pr_url=" >> "$GITHUB_OUTPUT"
            echo "SYNC_DELIVERY outcome=pushed branch=default version=${SYNC_VERSION:-unknown}"
            exit 0
          fi

          if [ "${PR_DELIVERY}" != "true" ]; then
            # Delivery through a pull request on ai-sync/stable (#7128). API
            # calls per run with changes: 1 repo GET, 1 open-PR list GET, at most
            # 1 PR close, at most 1 PR create and 1-2 merge calls; none in a
            # loop. Audited: no earlier step of this job reads repository or
            # pull-request data, so there is no existing call to extend.
            SYNC_BRANCH="ai-sync/stable"
            REPO="${GITHUB_REPOSITORY}"
            OWNER="${GITHUB_REPOSITORY_OWNER}"
            REPO_JSON="$(gh api "repos/${REPO}")"
            DEFAULT_BRANCH="$(jq -r '.default_branch // empty' <<<"${REPO_JSON}")"
            if [ -z "${DEFAULT_BRANCH}" ]; then
              echo "::error::SYNC_DELIVERY outcome=failed reason=default_branch_unavailable"
              exit 1
            fi
            MERGE_METHOD="$(jq -r 'if .allow_squash_merge == true then "squash" elif .allow_merge_commit == true then "merge" elif .allow_rebase_merge == true then "rebase" else "squash" end' <<<"${REPO_JSON}")"
            OPEN_PRS="$(gh api "repos/${REPO}/pulls?head=${OWNER}:${SYNC_BRANCH}&base=${DEFAULT_BRANCH}&state=open")"
            OPEN_PR_NUMBER="$(jq -r --arg b "${SYNC_BRANCH}" '[.[] | select(.head.ref == $b)] | .[0].number // empty' <<<"${OPEN_PRS}")"
            OPEN_PR_URL="$(jq -r --arg b "${SYNC_BRANCH}" '[.[] | select(.head.ref == $b)] | .[0].html_url // empty' <<<"${OPEN_PRS}")"

            SYNC_PR_NUMBER=""
            SYNC_PR_URL=""
            SYNC_PR_REUSED=false
            MERGE_HEAD_SHA=""
            # Reuse an open sync PR only when its tree already matches: pushing
            # to an open PR fires synchronize, and the review head gate then
            # withdraws auto-merge, racing with the merge below.
            if [ -n "${OPEN_PR_NUMBER}" ] \
              && git fetch --quiet --depth 1 origin "refs/heads/${SYNC_BRANCH}" 2>/dev/null \
              && [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')" ]; then
              SYNC_PR_NUMBER="${OPEN_PR_NUMBER}"
              SYNC_PR_URL="${OPEN_PR_URL}"
              SYNC_PR_REUSED=true
              MERGE_HEAD_SHA="$(git rev-parse 'FETCH_HEAD^{commit}')"
            else
              if [ -n "${OPEN_PR_NUMBER}" ]; then
                gh api -X PATCH "repos/${REPO}/pulls/${OPEN_PR_NUMBER}" -f state=closed >/dev/null
                echo "SYNC_DELIVERY outcome=replaced_stale_pr pr=${OPEN_PR_NUMBER} branch=${SYNC_BRANCH}"
              fi
              # The updater owns this branch. The lease binds the replacement
              # to the tip read just before it, so a concurrent updater run
              # that moved the branch fails this push instead of being
              # silently overwritten (an empty tip means "must not exist").
              SYNC_REMOTE_SHA="$(git ls-remote origin "refs/heads/${SYNC_BRANCH}" | awk 'NR == 1 { print $1 }')"
              if ! git push --force-with-lease="refs/heads/${SYNC_BRANCH}:${SYNC_REMOTE_SHA}" origin "HEAD:refs/heads/${SYNC_BRANCH}"; then
                echo "::error::SYNC_DELIVERY outcome=failed reason=lease_mismatch_or_push_rejected branch=${SYNC_BRANCH}"
                exit 1
              fi
              MERGE_HEAD_SHA="$(git rev-parse HEAD)"
              SYNC_PR_BODY="$(printf '%b\nAuto-applied by ai-update-workflows. Managed wrappers always follow\nthe pinned release; ALLOW_WORKFLOW_EDITS='\''false'\'' only skips other assets.\n\n<!-- ai-sync:v1 version=%s commit=%s -->' "${COMMIT_BODY}" "${SYNC_VERSION:-unknown}" "${SYNC_UPSTREAM_SHA:-unknown}")"
              CREATED_PR="$(gh api -X POST "repos/${REPO}/pulls" \
                -f title="chore: sync AI workflow wrappers from coding-workflows ${SYNC_VERSION:-stable}" \
                -f head="${SYNC_BRANCH}" \
                -f base="${DEFAULT_BRANCH}" \
                -f body="${SYNC_PR_BODY}")"
              SYNC_PR_NUMBER="$(jq -r '.number // empty' <<<"${CREATED_PR}")"
              SYNC_PR_URL="$(jq -r '.html_url // empty' <<<"${CREATED_PR}")"
              if [ -z "${SYNC_PR_NUMBER}" ]; then
                echo "::error::SYNC_DELIVERY outcome=failed reason=pr_create_failed branch=${SYNC_BRANCH}"
                exit 1
              fi
            fi

            # Merge refusals (required reviews, statuses, protection rules) leave
            # the PR open for a human; they do not fail the job.
            SYNC_PR_STATE="awaiting_merge"
            set +e
            MERGE_ERR="$(gh pr merge "${SYNC_PR_NUMBER}" --repo "${REPO}" --auto "--${MERGE_METHOD}" --match-head-commit "${MERGE_HEAD_SHA}" 2>&1 >/dev/null)"
            MERGE_RC=$?
            set -e
            if [ "${MERGE_RC}" -eq 0 ]; then
              SYNC_PR_STATE="auto_merge_enabled"
            elif grep -qiE 'clean status|auto.?merge (is )?not allowed|not allowed for this repository|enablePullRequestAutoMerge' <<<"${MERGE_ERR}"; then
              if gh pr merge "${SYNC_PR_NUMBER}" --repo "${REPO}" "--${MERGE_METHOD}" --match-head-commit "${MERGE_HEAD_SHA}" >/dev/null 2>&1; then
                SYNC_PR_STATE="merged"
              fi
            fi
            if [ "${SYNC_PR_STATE}" = "awaiting_merge" ]; then
              echo "::warning::SYNC_DELIVERY pull request ${SYNC_PR_URL} was not merged automatically: $(head -n 1 <<<"${MERGE_ERR}" | cut -c1-200)"
            fi
            echo "sync_pr_state=${SYNC_PR_STATE}" >> "$GITHUB_OUTPUT"
            echo "sync_pr_url=${SYNC_PR_URL}" >> "$GITHUB_OUTPUT"
            echo "SYNC_DELIVERY outcome=${SYNC_PR_STATE} pr=${SYNC_PR_NUMBER} branch=${SYNC_BRANCH} version=${SYNC_VERSION:-unknown} reused=${SYNC_PR_REUSED}"
            exit 0
          fi

          # ── Pull-request delivery (UPDATER_PR_DELIVERY_ENABLED=true) ──────────
          # Nothing below pushes to the default branch. Every failure exits
          # non-zero before the next write.
          BRANCH=""
          PR_NUMBER=""
          PR_URL=""
          PR_ACTION=""
          AUTO_MERGE="none"
          STALE_CLOSED=0
          pr_log() {
            echo "UPDATER_PR_DELIVERY outcome=$1 reason=$2 branch=${BRANCH:-none} pr=${PR_NUMBER:-none} auto_merge=${AUTO_MERGE:-none}"
          }
          pr_fail() {
            echo "::error::$(pr_log failed "$1")"
            echo "delivery=pr" >> "${PR_OUT}"
            echo "pr_action=failed" >> "${PR_OUT}"
            exit 1
          }

          [[ "${UPSTREAM_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || pr_fail invalid_upstream_sha
          [[ "${GITHUB_REPOSITORY:-}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || pr_fail invalid_repository
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || pr_fail invalid_base_sha

          # GitHub API budget for this path (§14): at most 1 default-branch read
          # (only when the event carries no repository payload), 1 head+base PR
          # lookup, 1 compare + 1 user read + 1 branch-activity read (only when the
          # branch already exists), 1 create or edit, 1 stale-PR list, 1 user read
          # (only when stale candidates exist and the login is not yet known),
          # one close per stale PR, 1 auto-merge enable.
          BASE="${DEFAULT_BRANCH:-}"
          if [ -z "${BASE}" ]; then
            BASE="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch 2>/dev/null)" || pr_fail default_branch_lookup_failed
          fi
          [[ "${BASE}" =~ ^[A-Za-z0-9._/-]+$ ]] || pr_fail invalid_default_branch
          [ "${CHECKED_OUT_BRANCH}" = "${BASE}" ] || pr_fail not_default_branch

          BRANCH="auto/update-workflows-${UPSTREAM_SHA:0:12}"
          [[ "${BRANCH}" =~ ^auto/update-workflows-[0-9a-f]{12}$ ]] || pr_fail invalid_branch_name

          # Release trailer: the foreign-commit check below accepts only commits
          # that carry it. The direct path above keeps its message unchanged.
          UPDATER_COMMIT_MSG="$(git log -1 --format=%B)"
          git commit --amend -q -m "${UPDATER_COMMIT_MSG}" -m "Updater-Release-SHA: ${UPSTREAM_SHA}" || pr_fail commit_amend_failed
          PUSHED_SHA="$(git rev-parse HEAD)"

          TAG_TEXT="${RELEASE_TAG:-}"
          if ! [[ "${TAG_TEXT}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Verification off: resolve the vX.Y.Z tag for UPSTREAM_SHA over the
            # git protocol on the existing release clone (no REST call), the
            # same way the verify step does. Any failure leaves it unresolved.
            TAG_TEXT=""
            if TAG_ROOT="$(cd "${UPSTREAM_DIR:-/nonexistent}/.." 2>/dev/null && pwd -P)" \
              && TAG_REFS="$(git -C "${TAG_ROOT}" ls-remote --tags origin 'refs/tags/v*' 2>/dev/null)"; then
              TAG_TEXT="$(printf '%s\n' "${TAG_REFS}" | awk -v want="${UPSTREAM_SHA}" '
                NF >= 2 {
                  sha = tolower($1); ref = $2
                  sub(/^refs\/tags\//, "", ref)
                  if (ref ~ /\^\{\}$/) { sub(/\^\{\}$/, "", ref); peeled[ref] = sha } else { direct[ref] = sha }
                }
                END {
                  for (t in direct) {
                    c = (t in peeled) ? peeled[t] : direct[t]
                    if (t ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && c == want) print t
                  }
                }' | sort -V | tail -n1)" || TAG_TEXT=""
            fi
            [[ "${TAG_TEXT}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || TAG_TEXT="unresolved"
          fi
          VERIFIED_TEXT="${VERIFIED:-}"
          case "${VERIFIED_TEXT}" in
            true|false|skipped) ;;
            "") VERIFIED_TEXT="skipped" ;;
            *) VERIFIED_TEXT="unknown" ;;
          esac
          if [ "${TAG_TEXT}" = "unresolved" ]; then
            TITLE_REF="${UPSTREAM_SHA:0:12}"
          else
            TITLE_REF="${TAG_TEXT}"
          fi
          PR_TITLE="chore: update AI workflow wrappers from coding-workflows@stable (${TITLE_REF})"

          PR_WORK="$(mktemp -d)" || pr_fail workdir_unavailable
          trap 'rm -rf "${PR_WORK}"' EXIT
          BODY="${PR_WORK}/body.md"
          LINT_INPUT="${PR_WORK}/lint_input.md"
          COMMIT_MSGS="${PR_WORK}/commit_messages.bin"
          {
            echo "Automated update from coding-workflows@stable."
            echo ""
            echo "- **Release tag:** ${TAG_TEXT}"
            echo "- **Release SHA:** \`${UPSTREAM_SHA}\`"
            echo "- **Release manifest verification:** ${VERIFIED_TEXT}"
            echo ""
            if [ "${VERIFIED_TEXT}" = "true" ]; then
              echo "Release manifest verification passed, so auto-merge is enabled for this exact head commit after the \`ai-update-workflows/verify\` check passes."
            else
              echo "Release manifest verification did not pass (outcome: ${VERIFIED_TEXT}), so this pull request waits for a human to review and merge it."
            fi
            echo ""
            echo "Changed files:"
            echo ""
            changed_count=0
            while IFS= read -r changed_path; do
              [ -n "${changed_path}" ] || continue
              changed_count=$((changed_count + 1))
              if [ "${changed_count}" -gt 200 ]; then
                echo "- (more files omitted)"
                break
              fi
              case "${changed_path}" in
                *'`'*) echo "- (a path with unsupported characters)" ;;
                *) echo "- \`${changed_path}\`" ;;
              esac
            done < <(git diff --name-only "${BASE_SHA}" HEAD)
            echo ""
            echo "Opened by ai-update-workflows (UPDATER_PR_DELIVERY_ENABLED=true). The plan that names this variable could not be read when it was built, so the variable, the auto/update-workflows- branch prefix and the UPDATER_PR_DELIVERY log prefix are provisional names."
            echo ""
            echo "<!-- ai:update-workflows-pr:v1 release_sha=${UPSTREAM_SHA} -->"
          } > "${BODY}"
          {
            printf '%s\n\n' "${PR_TITLE}"
            cat "${BODY}"
          } > "${LINT_INPUT}"
          git log -1 --format='%B%x00' > "${COMMIT_MSGS}"

          # §21: the composed title, body and commit message must not auto-close
          # any orchestrator tracking issue. No fail-open: a lookup error blocks.
          UPSTREAM_ROOT="$(cd "${UPSTREAM_DIR:-/nonexistent}/.." 2>/dev/null && pwd -P)" || pr_fail upstream_missing
          LINT_SCRIPT="${UPSTREAM_ROOT}/scripts/lint_pr_body_auto_close.py"
          [ -f "${LINT_SCRIPT}" ] || pr_fail pr_body_lint_missing
          if ! PYTHONDONTWRITEBYTECODE=1 python3 -I -B "${LINT_SCRIPT}" --pr-body-file "${LINT_INPUT}" --commit-messages-file "${COMMIT_MSGS}" --repo "${GITHUB_REPOSITORY}"; then
            pr_fail pr_body_lint_failed
          fi

          # One lookup scoped to head and base. The list API (not search) sees a
          # pull request created seconds earlier.
          PR_LIST_JSON="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --base "${BASE}" --state all --limit 20 --json number,url,state,isCrossRepository,headRefName,mergedAt,id,autoMergeRequest)" || pr_fail pr_lookup_failed
          OPEN_PR="$(printf '%s' "${PR_LIST_JSON}" | jq -r --arg b "${BRANCH}" '[.[] | select(.isCrossRepository == false and .headRefName == $b and .state == "OPEN")] | .[0] | if . == null then "" else "\(.number) \(.url)" end')" || pr_fail pr_lookup_failed
          CLOSED_UNMERGED="$(printf '%s' "${PR_LIST_JSON}" | jq -r --arg b "${BRANCH}" '[.[] | select(.isCrossRepository == false and .headRefName == $b and .state == "CLOSED" and .mergedAt == null)] | length')" || pr_fail pr_lookup_failed
          [[ "${CLOSED_UNMERGED}" =~ ^[0-9]+$ ]] || pr_fail pr_lookup_failed
          RELEASE_PR_MERGED="$(printf '%s' "${PR_LIST_JSON}" | jq -r --arg b "${BRANCH}" '[.[] | select(.isCrossRepository == false and .headRefName == $b and .mergedAt != null)] | length')" || pr_fail pr_lookup_failed
          [[ "${RELEASE_PR_MERGED}" =~ ^[0-9]+$ ]] || pr_fail pr_lookup_failed
          if [ -n "${OPEN_PR}" ]; then
            PR_NUMBER="${OPEN_PR%% *}"
            PR_URL="${OPEN_PR#* }"
            [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]] || pr_fail pr_lookup_failed
            # #7004: GitHub keeps auto-merge enrollment across pushes, so an
            # earlier run's enrollment would merge the refreshed head before
            # the verify job checks it. Withdraw it before pushing; the verify
            # job re-enables it for the verified head. Reuses the lookup above
            # (§14); a failed withdrawal fails closed before any push.
            OPEN_PR_AUTO="$(printf '%s' "${PR_LIST_JSON}" | jq -r --arg n "${PR_NUMBER}" '[.[] | select((.number | tostring) == $n)] | .[0] | if .autoMergeRequest == null then "" else (.id // "missing") end')" || pr_fail pr_lookup_failed
            if [ "${OPEN_PR_AUTO}" = "missing" ]; then
              pr_fail auto_merge_withdraw_failed
            elif [ -n "${OPEN_PR_AUTO}" ]; then
              gh api graphql -f query='mutation($id: ID!) { disablePullRequestAutoMerge(input: {pullRequestId: $id}) { clientMutationId } }' -f "id=${OPEN_PR_AUTO}" >/dev/null || pr_fail auto_merge_withdraw_failed
              echo "UPDATER_PR_DELIVERY #${PR_NUMBER}: withdrew auto-merge enrolled by an earlier run before refreshing the head."
            fi
          elif [ "${CLOSED_UNMERGED}" -gt 0 ]; then
            # A human closed this release's pull request: respect the rejection.
            echo "::warning::$(pr_log skipped closed_by_human)"
            {
              echo "delivery=pr"
              echo "branch=${BRANCH}"
              echo "pr_action=skipped"
              echo "auto_merge=none"
            } >> "${PR_OUT}"
            exit 0
          fi

          # Lease-checked push. Never overwrites commits the updater did not write.
          REMOTE_LINE="$(git ls-remote origin "refs/heads/${BRANCH}")" || pr_fail remote_lookup_failed
          REMOTE_SHA="$(printf '%s\n' "${REMOTE_LINE}" | awk -v ref="refs/heads/${BRANCH}" '$2 == ref {print $1; exit}')"
          PUSH_REASON="pushed"
          if [ -n "${REMOTE_SHA}" ] && [ -z "${OPEN_PR}" ] && [ "${RELEASE_PR_MERGED}" -gt 0 ]; then
            # This release's pull request already merged and its branch is
            # still there. A new commit is built on the current default branch,
            # so updating the branch would rewrite the merged history: consumer
            # rulesets reject that (non_fast_forward, deletion), and it would
            # reopen a delivered release. What is left is usually a changelog or
            # agents.md fragment fold; the next release's pull request carries it.
            echo "::notice::$(pr_log skipped release_pr_merged) changed_files=$(git diff --name-only "${BASE_SHA}" HEAD | wc -l | tr -d ' ')"
            {
              echo "delivery=pr"
              echo "branch=${BRANCH}"
              echo "pr_action=skipped"
              echo "auto_merge=none"
            } >> "${PR_OUT}"
            exit 0
          fi
          if [ -z "${REMOTE_SHA}" ]; then
            # Empty lease value: the push succeeds only if the branch still does not exist.
            git push --force-with-lease="refs/heads/${BRANCH}:" origin "HEAD:refs/heads/${BRANCH}" || pr_fail lease_mismatch_or_push_rejected
          else
            [[ "${REMOTE_SHA}" =~ ^[0-9a-f]{40}$ ]] || pr_fail remote_lookup_failed
            COMPARE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${REMOTE_SHA}")" || pr_fail compare_failed
            if ! printf '%s' "${COMPARE_JSON}" | jq -e --arg sha "${UPSTREAM_SHA}" '
              (.ahead_by | type) == "number"
              and .ahead_by <= 20
              and .ahead_by == ((.commits // []) | length)
              and all((.commits // [])[];
                (.commit.committer.email // "") == "github-actions[bot]@users.noreply.github.com"
                and ((.commit.message // "") | split("\n") | any(. == ("Updater-Release-SHA: " + $sha))))
            ' >/dev/null 2>&1; then
              pr_fail foreign_commits_on_branch
            fi
            # Committer email and trailer are git metadata anyone with push
            # access can forge, so they only pre-filter. The proof is the
            # authenticated pusher: every push recorded for this branch (repository
            # activity API, newest first) must come from the GH_PAT account the
            # checkout pushes with, and the newest one must have produced
            # REMOTE_SHA. A full page (possible older history) or any lookup error
            # fails closed.
            PAT_LOGIN="$(gh api user --jq .login 2>/dev/null)" || PAT_LOGIN=""
            [ -n "${PAT_LOGIN}" ] || pr_fail branch_pusher_unverified
            ACTIVITY_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/activity?ref=refs/heads/${BRANCH}&per_page=100" 2>/dev/null)" || pr_fail branch_pusher_unverified
            if ! printf '%s' "${ACTIVITY_JSON}" | jq -e --arg login "${PAT_LOGIN}" --arg sha "${REMOTE_SHA}" --arg ref "refs/heads/${BRANCH}" '
              type == "array"
              and length > 0
              and length < 100
              and .[0].after == $sha
              and all(.[]; (.actor.login // "") == $login and (.ref // "") == $ref)
            ' >/dev/null 2>&1; then
              pr_fail foreign_commits_on_branch
            fi
            git fetch --no-tags --depth 1 origin "refs/heads/${BRANCH}" >/dev/null 2>&1 || pr_fail remote_lookup_failed
            [ "$(git rev-parse FETCH_HEAD)" = "${REMOTE_SHA}" ] || pr_fail lease_mismatch_or_push_rejected
            if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')" ]; then
              PUSHED_SHA="${REMOTE_SHA}"
              PUSH_REASON="branch_up_to_date"
            else
              git push --force-with-lease="refs/heads/${BRANCH}:${REMOTE_SHA}" origin "HEAD:refs/heads/${BRANCH}" || pr_fail lease_mismatch_or_push_rejected
            fi
          fi

          if [ -n "${PR_NUMBER}" ]; then
            gh pr edit "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file "${BODY}" >/dev/null || pr_fail pr_edit_failed
            PR_ACTION="refreshed"
          else
            PR_URL="$(gh pr create --repo "${GITHUB_REPOSITORY}" --base "${BASE}" --head "${BRANCH}" --title "${PR_TITLE}" --body-file "${BODY}" | tail -n1)" || pr_fail pr_create_failed
            PR_NUMBER="${PR_URL##*/}"
            [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]] || pr_fail pr_create_failed
            PR_ACTION="created"
          fi

          # Best effort: close earlier updater pull requests for older releases.
          # Only same-repository PRs on a strict auto/update-workflows-<sha12>
          # branch authored by the GH_PAT account are touched.
          if STALE_JSON="$(gh pr list --repo "${GITHUB_REPOSITORY}" --base "${BASE}" --state open --search "head:auto/update-workflows-" --limit 50 --json number,url,headRefName,isCrossRepository,author 2>/dev/null)"; then
            STALE_CANDIDATES="$(printf '%s' "${STALE_JSON}" | jq -r --arg b "${BRANCH}" '.[] | select(.isCrossRepository == false and (.headRefName | test("^auto/update-workflows-[0-9a-f]{12}$")) and .headRefName != $b) | "\(.number) \(.author.login // "")"' 2>/dev/null)" || STALE_CANDIDATES=""
            if [ -n "${STALE_CANDIDATES}" ]; then
              if { [ -n "${PAT_LOGIN:-}" ] || PAT_LOGIN="$(gh api user --jq .login 2>/dev/null)"; } && [ -n "${PAT_LOGIN}" ]; then
                while read -r stale_number stale_author; do
                  [[ "${stale_number}" =~ ^[0-9]+$ ]] || continue
                  [ "${stale_author}" = "${PAT_LOGIN}" ] || continue
                  if gh pr close "${stale_number}" --repo "${GITHUB_REPOSITORY}" --comment "Superseded by ${PR_URL} (release ${TAG_TEXT}, ${UPSTREAM_SHA})." >/dev/null; then
                    STALE_CLOSED=$((STALE_CLOSED + 1))
                  else
                    echo "::warning::UPDATER_PR_DELIVERY could not close stale updater pull request #${stale_number}."
                  fi
                done <<< "${STALE_CANDIDATES}"
              else
                echo "::warning::UPDATER_PR_DELIVERY could not read the GH_PAT login; stale updater pull requests stay open."
              fi
            fi
          else
            echo "::warning::UPDATER_PR_DELIVERY could not list stale updater pull requests."
          fi

          # Merge policy: auto-merge only a verified release, and only from the
          # `verify` job after its independent PR-tree check passes (#7004).
          if [ "${VERIFIED_TEXT}" = "true" ]; then
            AUTO_MERGE="pending_verify"
            echo "UPDATER_PR_DELIVERY #${PR_NUMBER}: the verify job checks the PR tree and decides auto-merge."
          else
            AUTO_MERGE="skipped_unverified"
            echo "::warning::UPDATER_PR_DELIVERY release manifest verification outcome is ${VERIFIED_TEXT}; #${PR_NUMBER} waits for a human to review and merge it."
          fi

          {
            echo "delivery=pr"
            echo "branch=${BRANCH}"
            echo "base=${BASE}"
            echo "pushed_sha=${PUSHED_SHA}"
            echo "pr_number=${PR_NUMBER}"
            echo "pr_url=${PR_URL}"
            echo "pr_action=${PR_ACTION}"
            echo "auto_merge=${AUTO_MERGE}"
            echo "stale_closed=${STALE_CLOSED}"
          } >> "${PR_OUT}"
          if [ "${PR_ACTION}" = "created" ]; then
            pr_log opened "${PUSH_REASON}"
          else
            pr_log refreshed "${PUSH_REASON}"
          fi

      - name: Send Telegram notification
        if: steps.update.outputs.has_updates == 'true' || steps.audit_gate.outputs.status == 'applied' || steps.claude_sync.outputs.claude_has_changes == 'true' || steps.retired_files.outputs.retired_has_changes == 'true' || steps.claude_md_sync.outputs.claude_md_changed == 'true' || steps.changelog_sync.outputs.changelog_assets_has_changes == 'true' || steps.changelog_assemble.outputs.changelog_assembled == 'true' || steps.agents_assemble.outputs.agents_assembled == 'true'
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          COMMIT_DELIVERY: ${{ steps.commit_push.outputs.delivery }}
          COMMIT_PR_URL: ${{ steps.commit_push.outputs.pr_url }}
          COMMIT_PR_ACTION: ${{ steps.commit_push.outputs.pr_action }}
          COMMIT_AUTO_MERGE: ${{ steps.commit_push.outputs.auto_merge }}
          UPSTREAM_DIR: ${{ steps.fetch.outputs.upstream_dir }}
          SYNC_PR_URL: ${{ steps.commit_push.outputs.sync_pr_url }}
          SYNC_PR_STATE: ${{ steps.commit_push.outputs.sync_pr_state }}
        run: |
          set -euo pipefail

          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "::warning::Telegram not configured (TG_BOT_SECRET or TG_ADMIN_CHAT_ID missing) — skipping notification."
            exit 0
          fi

          # Source tg_helpers.sh from the verified upstream checkout (#7128)
          # rather than fetching a second, unverified copy from stable or a
          # separate contents-API fetch whose bytes nothing verifies. It
          # sources scripts/gh_helpers.sh by a relative path, so run it from
          # the upstream root. Falls back to a raw curl send below.
          UPSTREAM_ROOT="$(dirname "${UPSTREAM_DIR:-/nonexistent}")"
          helpers_src="${UPSTREAM_DIR:-/nonexistent}/../scripts/tg_helpers.sh"
          if [ -f "${helpers_src}" ] && [ ! -L "${helpers_src}" ]; then
            pushd "${UPSTREAM_ROOT}" >/dev/null
            source scripts/tg_helpers.sh || true
            popd >/dev/null
          fi

          REPO="${{ github.repository }}"
          UPDATED_COUNT="${{ steps.update.outputs.templates_updated }}"
          CREATED_COUNT="${{ steps.update.outputs.templates_created }}"
          UPDATED_LIST=$(cat /tmp/updated_files.txt)
          CREATED_LIST=$(cat /tmp/created_files.txt)
          AUDIT_GATE_STATUS="${{ steps.audit_gate.outputs.status }}"
          AUDIT_GATE_CHANGED_LIST=""
          if [ -f /tmp/audit_gate_changed_files.txt ] && [ -s /tmp/audit_gate_changed_files.txt ]; then
            AUDIT_GATE_CHANGED_LIST=$(cat /tmp/audit_gate_changed_files.txt)
          fi
          CLAUDE_CHANGED_COUNT="${{ steps.claude_sync.outputs.claude_changed }}"
          CLAUDE_CHANGED_LIST=""
          if [ -f /tmp/claude_changed_files.txt ] && [ -s /tmp/claude_changed_files.txt ]; then
            CLAUDE_CHANGED_LIST=$(cat /tmp/claude_changed_files.txt)
          fi
          CLAUDE_MD_CHANGED="${{ steps.claude_md_sync.outputs.claude_md_changed }}"
          CLAUDE_MD_CHANGED_LIST=""
          if [ -f /tmp/claude_md_changed_file.txt ] && [ -s /tmp/claude_md_changed_file.txt ]; then
            CLAUDE_MD_CHANGED_LIST=$(cat /tmp/claude_md_changed_file.txt)
          fi
          CHANGELOG_ASSET_LIST=""
          if [ -f /tmp/changelog_asset_files.txt ] && [ -s /tmp/changelog_asset_files.txt ]; then
            CHANGELOG_ASSET_LIST=$(cat /tmp/changelog_asset_files.txt)
          fi
          CHANGELOG_ASSEMBLED="${{ steps.changelog_assemble.outputs.changelog_assembled }}"
          CHANGELOG_FRAGMENT_COUNT="${{ steps.changelog_assemble.outputs.changelog_fragment_count }}"
          CHANGELOG_LAYOUT="${{ steps.changelog_assemble.outputs.changelog_layout }}"
          AGENTS_ASSEMBLED="${{ steps.agents_assemble.outputs.agents_assembled }}"
          AGENTS_FRAGMENT_COUNT="${{ steps.agents_assemble.outputs.agents_fragment_count }}"
          AGENTS_FILE="${{ steps.agents_assemble.outputs.agents_file }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MSG="Workflow wrappers updated in ${REPO}
          "
          if [ -n "$UPDATED_LIST" ]; then
            MSG="${MSG}
          ${UPDATED_COUNT} wrapper(s) updated:
          ${UPDATED_LIST}"
          fi
          if [ -n "$CREATED_LIST" ]; then
            MSG="${MSG}
          ${CREATED_COUNT} new wrapper(s) added:
          ${CREATED_LIST}"
          fi
          if [ "${AUDIT_GATE_STATUS}" = "applied" ] && [ -n "$AUDIT_GATE_CHANGED_LIST" ]; then
            MSG="${MSG}
          Audit-gate assets applied:
          ${AUDIT_GATE_CHANGED_LIST}"
          fi
          if [ -n "$CLAUDE_CHANGED_LIST" ]; then
            MSG="${MSG}
          ${CLAUDE_CHANGED_COUNT} .claude/ asset(s) synced:
          ${CLAUDE_CHANGED_LIST}"
          fi
          if [ "${CLAUDE_MD_CHANGED}" = "true" ] && [ -n "$CLAUDE_MD_CHANGED_LIST" ]; then
            MSG="${MSG}
          Top-level CLAUDE.md synced:
          ${CLAUDE_MD_CHANGED_LIST}"
          fi
          if [ -n "$CHANGELOG_ASSET_LIST" ]; then
            MSG="${MSG}
          Changelog fragment assets changed:
          ${CHANGELOG_ASSET_LIST}"
          fi
          if [ "${CHANGELOG_ASSEMBLED}" = "true" ]; then
            MSG="${MSG}
          Changelog fragments assembled: ${CHANGELOG_FRAGMENT_COUNT} fragment(s), layout ${CHANGELOG_LAYOUT}."
          fi
          if [ "${AGENTS_ASSEMBLED}" = "true" ]; then
            MSG="${MSG}
          agents.d fragments assembled into ${AGENTS_FILE}: ${AGENTS_FRAGMENT_COUNT} fragment(s)."
          fi
          if [ -n "${SYNC_PR_URL:-}" ]; then
            MSG="${MSG}
          Delivery: ${SYNC_PR_STATE:-unknown} (${SYNC_PR_URL})"
          fi
          # Pull-request delivery reports the PR instead of a pushed commit.
          # A PR left for a human (auto-merge not enabled) is a WARNING.
          TG_LEVEL="DEBUG"
          # An ai-sync/stable PR that was not merged or enrolled in
          # auto-merge waits for a person to merge it (#7128).
          if [ "${SYNC_PR_STATE:-}" = "awaiting_merge" ]; then
            TG_LEVEL="WARNING"
          fi
          if [ "${COMMIT_DELIVERY:-}" = "pr" ]; then
            MSG="${MSG}
          Delivered as a pull request (${COMMIT_PR_ACTION:-unknown}): ${COMMIT_PR_URL:-none}
          Auto-merge: ${COMMIT_AUTO_MERGE:-none}"
            if [ "${COMMIT_AUTO_MERGE:-}" != "enabled" ] && [ "${COMMIT_AUTO_MERGE:-}" != "pending_verify" ]; then
              TG_LEVEL="WARNING"
            fi
          fi
          MSG="${MSG}
          Source: coding-workflows@stable
          Run: ${RUN_URL}"

          if declare -F tg_send_msg >/dev/null 2>&1; then
            tg_send_msg "${MSG}" "${TG_LEVEL}" >/dev/null
          else
            curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_SECRET}/sendMessage" \
              -d "chat_id=${TG_ADMIN_CHAT_ID}" \
              -d "disable_web_page_preview=true" \
              --data-urlencode "text=${MSG}" >/dev/null 2>&1 || echo "::warning::Telegram send failed"
          fi

      - name: Alert on sync manifest verification failure
        if: ${{ failure() && steps.verify_manifest.outcome == 'failure' }}
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          SYNC_REASON_CODE: ${{ steps.verify_manifest.outputs.failure_reason_code }}
          SYNC_REPO: ${{ github.repository }}
          SYNC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Verification failed, so no upstream script may run here: fixed
          # text through a raw Telegram call only.
          sync_alert_level="${ALERT_MSG_LEVEL:-SILENT}"
          case "${sync_alert_level^^}" in
            DEBUG|WARNING|ERROR) ;;
            *) echo "Alert level ${sync_alert_level} suppresses the verification alert."; exit 0 ;;
          esac
          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "::warning::Telegram not configured — skipping verification alert."
            exit 0
          fi
          MSG="ERROR: workflow sync verification failed in ${SYNC_REPO}
          Reason: ${SYNC_REASON_CODE:-unknown}
          Nothing was changed.
          Run: ${SYNC_RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_SECRET}/sendMessage" \
            -d "chat_id=${TG_ADMIN_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}" >/dev/null 2>&1 || echo "::warning::Telegram send failed"

      - name: Summary
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify_release_manifest.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit_push.outcome }}
          COMMIT_DELIVERY: ${{ steps.commit_push.outputs.delivery }}
          COMMIT_PR_URL: ${{ steps.commit_push.outputs.pr_url }}
          COMMIT_AUTO_MERGE: ${{ steps.commit_push.outputs.auto_merge }}
        run: |
          set -euo pipefail

          FETCH_OUTCOME="${{ steps.fetch.outcome }}"
          # VERIFY_OUTCOME (env) stays the flag-gated release-manifest step;
          # the signed sync manifest step (#7128) has its own names.
          SYNC_VERIFY_OUTCOME="${{ steps.verify_manifest.outcome }}"
          SYNC_VERIFY_REASON_CODE="${{ steps.verify_manifest.outputs.failure_reason_code }}"
          SYNC_PR_STATE="${{ steps.commit_push.outputs.sync_pr_state }}"
          SYNC_PR_URL="${{ steps.commit_push.outputs.sync_pr_url }}"
          RENDER_OUTCOME="${{ steps.render_wrappers.outcome }}"
          UPDATE_OUTCOME="${{ steps.update.outcome }}"
          HAS_UPDATES="${{ steps.update.outputs.has_updates }}"
          TEMPLATES_CHECKED="${{ steps.update.outputs.templates_checked }}"
          TEMPLATES_UPDATED="${{ steps.update.outputs.templates_updated }}"
          TEMPLATES_CREATED="${{ steps.update.outputs.templates_created }}"
          AUDIT_GATE_STATUS="${{ steps.audit_gate.outputs.status }}"
          AUDIT_GATE_SCRIPT_ACTION="${{ steps.audit_gate.outputs.package_script_action }}"
          AUDIT_GATE_CHANGED_COUNT="${{ steps.audit_gate.outputs.changed_count }}"
          AUDIT_GATE_MESSAGE="${{ steps.audit_gate.outputs.message }}"
          FAILURE_REASON_CODE="${{ steps.update.outputs.failure_reason_code }}"
          FAILURE_REASON_DETAIL="${{ steps.update.outputs.failure_reason_detail }}"
          FAILURE_REASON_FILE="/tmp/update_workflows_failure_reason.txt"

          if [ -z "${HAS_UPDATES}" ]; then
            HAS_UPDATES="false"
          fi
          if [ -z "${TEMPLATES_CHECKED}" ]; then
            TEMPLATES_CHECKED="0"
          fi
          if [ -z "${TEMPLATES_UPDATED}" ]; then
            TEMPLATES_UPDATED="0"
          fi
          if [ -z "${TEMPLATES_CREATED}" ]; then
            TEMPLATES_CREATED="0"
          fi

          if [ -z "${FAILURE_REASON_CODE}" ] && [ -f "${FAILURE_REASON_FILE}" ]; then
            IFS= read -r FAILURE_REASON_CODE < "${FAILURE_REASON_FILE}" || true
            FAILURE_REASON_DETAIL="$(sed -n '2p' "${FAILURE_REASON_FILE}" 2>/dev/null || true)"
          fi

          echo "### Workflow Wrapper Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${FETCH_OUTCOME}" = "failure" ]; then
            echo "- **Status:** failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason code:** \\`ERR_TEMPLATE_FETCH_FAILED\\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason detail:** Fetch step failed before pre-mutation validation could run." >> "$GITHUB_STEP_SUMMARY"
            if [ -f "${FAILURE_REASON_FILE}" ]; then
              echo "- **Failure reason artifact:** \\`${FAILURE_REASON_FILE}\\`" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi

          if [ "${SYNC_VERIFY_OUTCOME}" = "failure" ]; then
            echo "- **Status:** failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason code:** \`${SYNC_VERIFY_REASON_CODE:-ERR_SYNC_MANIFEST_SIGNATURE}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason detail:** The signed sync manifest could not be verified; no upstream code ran and nothing was changed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${VERIFY_OUTCOME:-}" = "failure" ]; then
            # Same path the verify step writes (it honours the override).
            VERIFY_REASON_FILE="${UPDATER_MANIFEST_VERIFY_REASON_FILE:-${FAILURE_REASON_FILE}}"
            VERIFY_FAILURE_DETAIL=""
            if [ -f "${VERIFY_REASON_FILE}" ]; then
              VERIFY_FAILURE_DETAIL="$(sed -n '2p' "${VERIFY_REASON_FILE}" 2>/dev/null || true)"
            fi
            [ -n "${VERIFY_FAILURE_DETAIL}" ] || VERIFY_FAILURE_DETAIL="Release manifest verification failed before any consumer file was changed."
            echo "- **Status:** failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason code:** \`ERR_RELEASE_MANIFEST_VERIFY_FAILED\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason detail:** ${VERIFY_FAILURE_DETAIL}" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "${VERIFY_REASON_FILE}" ]; then
              echo "- **Failure reason artifact:** \`${VERIFY_REASON_FILE}\`" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi

          if [ "${RENDER_OUTCOME}" = "failure" ]; then
            echo "- **Status:** failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason code:** \`ERR_WRAPPER_RENDER_FAILED\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason detail:** Canonical wrappers could not be validated and rendered with the current stable commit SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${UPDATE_OUTCOME}" = "failure" ]; then
            if [ -z "${FAILURE_REASON_CODE}" ]; then
              FAILURE_REASON_CODE="ERR_UNCATEGORIZED_FAILURE"
              FAILURE_REASON_DETAIL="Update step failed before categorized reason was recorded."
            fi
            echo "- **Status:** failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason code:** \\`${FAILURE_REASON_CODE}\\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason detail:** ${FAILURE_REASON_DETAIL}" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "${FAILURE_REASON_FILE}" ]; then
              echo "- **Failure reason artifact:** \\`${FAILURE_REASON_FILE}\\`" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi

          echo "- **Templates checked:** ${TEMPLATES_CHECKED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Templates updated:** ${TEMPLATES_UPDATED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Templates created:** ${TEMPLATES_CREATED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Audit gate status:** ${AUDIT_GATE_STATUS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Audit gate package script action:** ${AUDIT_GATE_SCRIPT_ACTION:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Audit gate changed files:** ${AUDIT_GATE_CHANGED_COUNT:-0}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${AUDIT_GATE_MESSAGE:-}" ]; then
            echo "- **Audit gate message:** ${AUDIT_GATE_MESSAGE}" >> "$GITHUB_STEP_SUMMARY"
          fi
          CLAUDE_CHANGED_COUNT="${{ steps.claude_sync.outputs.claude_changed }}"
          echo "- **.claude/ assets synced:** ${CLAUDE_CHANGED_COUNT:-0}" >> "$GITHUB_STEP_SUMMARY"
          CLAUDE_MD_CHANGED="${{ steps.claude_md_sync.outputs.claude_md_changed }}"
          echo "- **Top-level CLAUDE.md synced:** ${CLAUDE_MD_CHANGED:-false}" >> "$GITHUB_STEP_SUMMARY"
          RETIRED_REMOVED_COUNT="${{ steps.retired_files.outputs.retired_removed }}"
          echo "- **Retired files removed:** ${RETIRED_REMOVED_COUNT:-0}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Sync manifest verification:** ${SYNC_VERIFY_OUTCOME:-skipped}" >> "$GITHUB_STEP_SUMMARY"
          # The ai-sync/stable and direct-push paths report sync_pr_state;
          # the auto/update-workflows-* path reports delivery.
          if [ -n "${SYNC_PR_STATE}" ]; then
            echo "- **Delivery:** ${SYNC_PR_STATE}${SYNC_PR_URL:+ (${SYNC_PR_URL})}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Delivery:** ${COMMIT_DELIVERY:-none}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${COMMIT_OUTCOME:-}" = "failure" ]; then
            echo "- **Delivery status:** failed (see the UPDATER_PR_DELIVERY log line)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Pull request:** ${COMMIT_PR_URL:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Auto-merge:** ${COMMIT_AUTO_MERGE:-n/a}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${HAS_UPDATES}" = "true" ]; then
            UPDATED_LIST=$(cat /tmp/updated_files.txt)
            CREATED_LIST=$(cat /tmp/created_files.txt)
            SKIPPED_LIST=$(cat /tmp/skipped_files.txt)
            if [ -n "$UPDATED_LIST" ]; then
              echo "**Updated files:**" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/updated_files.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -n "$CREATED_LIST" ]; then
              echo "**New files:**" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/created_files.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -n "$SKIPPED_LIST" ]; then
              echo "**Skipped files:**" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/skipped_files.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "All wrappers are up to date." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s /tmp/audit_gate_changed_files.txt ]; then
            echo "**Audit gate files:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/audit_gate_changed_files.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s /tmp/claude_changed_files.txt ]; then
            echo "**.claude/ files:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/claude_changed_files.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s /tmp/claude_md_changed_file.txt ]; then
            echo "**Top-level CLAUDE.md:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/claude_md_changed_file.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  # Independent pull-request verification (issue #7004, orchestrator project
  # #6902). Runs only after the PR path opened or refreshed a pull request. It
  # checks the PR head out as data (no stored credentials, nothing from it is
  # executed), re-downloads and attests the release manifest, hash-checks every
  # release module it runs, and compares every file the PR changes with what
  # the attested release produces (scripts/verify_release_manifest.py
  # verify-pr-tree). It posts the fixed commit status
  # `ai-update-workflows/verify` on the PR head, and it is the only place that
  # enables auto-merge (bound to the verified head, verified=true releases
  # only). Any error fails closed: failure status, no auto-merge.
  # Assumption: the authoritative plan
  # (docs/plans/safeguarded-consumer-updater-plan.md on branch
  # claude/elegant-mendel-5pli2i-safeguarded-updater-plan) could not be read,
  # so the job id `verify`, the status context `ai-update-workflows/verify`
  # and the log prefix UPDATER_PR_VERIFY are the provisional names from the
  # issue. If the plan names different identifiers, the plan wins.
  # No job-level `permissions:` block on purpose: a reusable job that asks for
  # a permission its caller did not grant fails the whole run at startup with
  # zero jobs, which would also stop this updater from refreshing an older
  # caller wrapper. The job inherits the caller's grant; the consumer template
  # grants `statuses: write`. With an older wrapper that lacks it, each status
  # post retries once with GH_PAT, and the job fails closed only when both are
  # refused. The attestation and bootstrap-hash logic stays inline for
  # the same reason as in "Verify attested release manifest".
  verify:
    needs: update-wrappers
    if: ${{ !cancelled() && needs.update-wrappers.outputs.delivery == 'pr' && (needs.update-wrappers.outputs.pr_action == 'created' || needs.update-wrappers.outputs.pr_action == 'refreshed') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      VERIFY_STATUS_CONTEXT: ai-update-workflows/verify
      PR_NUMBER: ${{ needs.update-wrappers.outputs.pr_number }}
      PUSHED_SHA: ${{ needs.update-wrappers.outputs.pushed_sha }}
      UPSTREAM_SHA: ${{ needs.update-wrappers.outputs.upstream_sha }}
      VERIFIED: ${{ needs.update-wrappers.outputs.verified }}
      BASE: ${{ needs.update-wrappers.outputs.base }}
    steps:
      - name: Validate verify inputs and mark pending
        id: verify_inputs
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          VERIFY_OUT="${GITHUB_OUTPUT:-/dev/null}"
          reject() {
            echo "::error::UPDATER_PR_VERIFY outcome=rejected reason=$2 stage=$1"
            exit 1
          }

          [[ "${PR_NUMBER:-}" =~ ^[0-9]+$ ]] || reject input invalid_pr_number
          [[ "${PUSHED_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || reject input invalid_pushed_sha
          [[ "${UPSTREAM_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || reject input invalid_upstream_sha
          [[ "${BASE:-}" =~ ^[A-Za-z0-9._/-]+$ ]] || reject input invalid_base
          case "${VERIFIED:-}" in
            true|false|skipped|"") ;;
            *) reject input invalid_verified ;;
          esac
          [[ "${GITHUB_REPOSITORY:-}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || reject input invalid_repository
          echo "sha_ok=true" >> "${VERIFY_OUT}"

          RUN_URL="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID:-0}"
          post_pending_status() {
            GH_TOKEN="$1" gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${PUSHED_SHA}" \
              -f state=pending \
              -f "context=${VERIFY_STATUS_CONTEXT}" \
              -f "description=Verifying updater PR tree against the attested release manifest" \
              -f "target_url=${RUN_URL}" >/dev/null
          }
          # Same GH_PAT fallback as "Publish verify result and enable
          # auto-merge": a caller wrapper rendered before it granted
          # `statuses: write` must still reach that step.
          if ! post_pending_status "${GH_TOKEN:-}"; then
            if [ -n "${MERGE_TOKEN:-}" ] && post_pending_status "${MERGE_TOKEN}"; then
              echo "::warning::UPDATER_PR_VERIFY posted the status with GH_PAT because github.token was refused; the caller wrapper should grant statuses: write."
            else
              reject status status_post_failed
            fi
          fi

      - name: Check out updater pull request head (data only)
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.update-wrappers.outputs.pushed_sha }}
          path: .updater-pr-tree
          fetch-depth: 2
          persist-credentials: false
          token: ${{ github.token }}
          lfs: false

      - name: Fetch and verify attested release
        id: verify_release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_MANIFEST_ASSET_NAME: release-manifest.v1.json
        run: |
          set -euo pipefail

          VERIFY_OUT="${GITHUB_OUTPUT:-/dev/null}"
          reject() {
            echo "::error::UPDATER_PR_VERIFY outcome=rejected reason=$2 stage=$1"
            exit 1
          }

          ASSET_NAME="${RELEASE_MANIFEST_ASSET_NAME:-release-manifest.v1.json}"
          RELEASE_REPO="shubhodeep1/coding-workflows"
          RELEASE_URL="https://github.com/${RELEASE_REPO}.git"
          MANIFEST_MAX_BYTES=16777216
          WORK="${RUNNER_TEMP:-/tmp}/updater-verify"
          RELEASE_ROOT="${WORK}/release"
          MANIFEST="${WORK}/${ASSET_NAME}"

          [[ "${UPSTREAM_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || reject input invalid_upstream_sha
          for verify_tool in git gh jq sha256sum python3; do
            command -v "${verify_tool}" >/dev/null 2>&1 || reject input tool_missing
          done
          # Our own scratch directory under RUNNER_TEMP; start from a clean state.
          rm -rf -- "${WORK}"
          mkdir -p "${WORK}"

          # GH_PAT reaches git only through this one-shot credential helper,
          # never through a remote URL or a written git config.
          CRED_HELPER='!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          rgit() {
            git -c credential.helper= -c "credential.helper=${CRED_HELPER}" -c core.hooksPath=/dev/null "$@"
          }

          # Release tag whose peeled commit is the release the PR was built
          # from. `stable` is not re-read, so a release published after the
          # update job cannot cause a false rejection.
          if ! tag_refs="$(rgit ls-remote --tags "${RELEASE_URL}" 'refs/tags/v*' 2>/dev/null)"; then
            reject tag release_tag_missing
          fi
          TAG="$(printf '%s\n' "${tag_refs}" | awk -v want="${UPSTREAM_SHA}" '
            NF >= 2 {
              sha = tolower($1); ref = $2
              sub(/^refs\/tags\//, "", ref)
              if (ref ~ /\^\{\}$/) { sub(/\^\{\}$/, "", ref); peeled[ref] = sha } else { direct[ref] = sha }
            }
            END {
              for (t in direct) {
                c = (t in peeled) ? peeled[t] : direct[t]
                if (t ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && c == want) print t
              }
            }' | sort -V | tail -n1)"
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || reject tag release_tag_missing

          rgit clone --quiet --depth 1 --no-checkout --filter=blob:none --sparse "${RELEASE_URL}" "${RELEASE_ROOT}" || reject release release_clone_failed
          rgit -C "${RELEASE_ROOT}" fetch --quiet --force --no-tags --depth 1 origin "refs/tags/${TAG}" || reject release release_clone_failed
          fetched_sha="$(git -C "${RELEASE_ROOT}" rev-parse 'FETCH_HEAD^{commit}')" || reject release release_clone_failed
          [ "${fetched_sha,,}" = "${UPSTREAM_SHA}" ] || reject release release_sha_mismatch
          rgit -C "${RELEASE_ROOT}" checkout --quiet --detach "${UPSTREAM_SHA}" || reject release release_clone_failed
          rgit -C "${RELEASE_ROOT}" sparse-checkout set workflow-templates scripts || reject release release_clone_failed
          [ "$(git -C "${RELEASE_ROOT}" rev-parse HEAD)" = "${UPSTREAM_SHA}" ] || reject release release_sha_mismatch

          # GitHub API (§14): this is a separate job, so nothing from the
          # update job can be reused; one release lookup and one asset
          # download, repeated on purpose so the check is independent.
          if ! release_json="$(gh api "repos/${RELEASE_REPO}/releases/tags/${TAG}" 2>/dev/null)"; then
            reject release release_lookup_failed
          fi
          if ! asset_line="$(printf '%s' "${release_json}" | jq -r --arg name "${ASSET_NAME}" '
            if type == "object" and .draft == false and .prerelease == false then
              [(.assets // [])[] | select(type == "object" and .name == $name and .state == "uploaded")]
              | if length == 1 then "\(.[0].id) \(.[0].size)" else "missing" end
            else "invalid" end' 2>/dev/null)"; then
            reject release release_lookup_failed
          fi
          case "${asset_line}" in
            invalid|"") reject release release_lookup_failed ;;
            missing) reject release asset_missing ;;
          esac
          ASSET_ID="${asset_line%% *}"
          ASSET_SIZE="${asset_line##* }"
          [[ "${ASSET_ID}" =~ ^[0-9]+$ ]] && [[ "${ASSET_SIZE}" =~ ^[0-9]+$ ]] || reject release release_lookup_failed
          if [ "${ASSET_SIZE}" -le 0 ] || [ "${ASSET_SIZE}" -gt "${MANIFEST_MAX_BYTES}" ]; then
            reject release asset_missing
          fi
          if ! gh api -H 'Accept: application/octet-stream' "repos/${RELEASE_REPO}/releases/assets/${ASSET_ID}" > "${MANIFEST}" 2>/dev/null; then
            reject download asset_download_failed
          fi
          downloaded_size="$(wc -c < "${MANIFEST}" | tr -d '[:space:]')"
          [ "${downloaded_size}" = "${ASSET_SIZE}" ] || reject download asset_download_failed

          # Same attestation policy as "Verify attested release manifest";
          # tests/test_update_workflows_template_gate.py keeps the two in step.
          if ! gh attestation verify "${MANIFEST}" \
            --repo shubhodeep1/coding-workflows \
            --cert-identity-regex '^https://github\.com/shubhodeep1/coding-workflows/\.github/workflows/(mark-stable|test-and-mark-stable)\.yml@refs/heads/stable$' \
            --predicate-type https://slsa.dev/provenance/v1 \
            --deny-self-hosted-runners; then
            reject attestation attestation_failed
          fi

          if ! jq -e --arg repo "${RELEASE_REPO}" --arg sha "${UPSTREAM_SHA}" --arg tag "${TAG}" \
            'type == "object" and .repository == $repo and .release_sha == $sha and .tag == $tag' \
            "${MANIFEST}" >/dev/null 2>&1; then
            reject header manifest_header_mismatch
          fi

          # Bootstrap: hash every release module this job executes before any
          # of them runs.
          for bootstrap_rel in scripts/verify_release_manifest.py scripts/release_manifest.py scripts/workflow_wrapper_refs.py scripts/apply_audit_gate_assets.py scripts/assemble_changelog.py scripts/assemble_agents.py; do
            expected_sha256="$(jq -r --arg p "${bootstrap_rel}" \
              '[(.files // [])[] | select(type == "object" and .path == $p and .mode != "120000")] | if length == 1 then (.[0].sha256 // "") else "" end' \
              "${MANIFEST}" 2>/dev/null)" || expected_sha256=""
            [[ "${expected_sha256}" =~ ^[0-9a-f]{64}$ ]] || reject bootstrap verifier_unattested
            bootstrap_path="${RELEASE_ROOT}/${bootstrap_rel}"
            if [ ! -f "${bootstrap_path}" ] || [ -L "${bootstrap_path}" ]; then
              reject bootstrap verifier_hash_mismatch
            fi
            actual_sha256="$(sha256sum -- "${bootstrap_path}" | awk '{print $1}')"
            [ "${actual_sha256}" = "${expected_sha256}" ] || reject bootstrap verifier_hash_mismatch
          done

          PATHS_FILE="${WORK}/paths.txt"
          (
            cd "${RELEASE_ROOT}"
            shopt -s nullglob
            for listed in workflow-templates/*.yml workflow-templates/profiles/*.txt; do
              printf '%s\n' "${listed}"
            done
            printf '%s\n' \
              workflow-templates/retired_files.txt \
              workflow-templates/CLAUDE.md \
              CLAUDE.md \
              scripts/workflow_wrapper_refs.py \
              scripts/apply_audit_gate_assets.py \
              scripts/assemble_changelog.py \
              scripts/assemble_agents.py \
              scripts/verify_release_manifest.py \
              scripts/release_manifest.py \
              scripts/lint_pr_body_auto_close.py \
              scripts/tg_helpers.sh
            for listed_dir in workflow-templates/.claude workflow-templates/audit-gate; do
              if [ -e "${listed_dir}" ] || [ -L "${listed_dir}" ]; then
                find "${listed_dir}" ! -type d -print
              fi
            done
          ) > "${PATHS_FILE}" || reject paths paths_enumeration_failed

          set +e
          (cd "${WORK}" && python3 -I -B "${RELEASE_ROOT}/scripts/verify_release_manifest.py" verify \
            --manifest "${MANIFEST}" \
            --release-root "${RELEASE_ROOT}" \
            --expected-sha "${UPSTREAM_SHA}" \
            --expected-repository shubhodeep1/coding-workflows \
            --paths-file "${PATHS_FILE}") > "${WORK}/verify_release.out" 2>/dev/null
          verify_rc=$?
          set -e
          verify_line="$(head -n1 "${WORK}/verify_release.out")"
          if [ "${verify_rc}" -ne 0 ]; then
            verify_reason="$(printf '%s\n' "${verify_line}" | sed -n 's/^UPDATER_MANIFEST_VERIFY outcome=rejected reason=\([a-z_]*\).*/\1/p')"
            reject release_tree "${verify_reason:-internal_error}"
          fi
          echo "${verify_line}"

          {
            echo "work=${WORK}"
            echo "release_root=${RELEASE_ROOT}"
            echo "manifest=${MANIFEST}"
            echo "tag=${TAG}"
          } >> "${VERIFY_OUT}"

      - name: Check updater pull request topology
        id: verify_topology
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERIFY_OUT="${GITHUB_OUTPUT:-/dev/null}"
          reject() {
            echo "::error::UPDATER_PR_VERIFY outcome=rejected reason=$2 stage=$1"
            exit 1
          }

          PR_TREE="${GITHUB_WORKSPACE}/.updater-pr-tree"
          pgit() {
            git -C "${PR_TREE}" -c core.hooksPath=/dev/null -c core.fsmonitor=false -c protocol.allow=never "$@"
          }

          head_sha="$(pgit rev-parse HEAD)" || reject topology head_mismatch
          [ "${head_sha}" = "${PUSHED_SHA}" ] || reject topology head_mismatch
          parents_line="$(pgit rev-list --parents -n1 "${PUSHED_SHA}")" || reject topology not_single_parent
          read -r -a commit_parts <<< "${parents_line}"
          [ "${#commit_parts[@]}" -eq 2 ] || reject topology not_single_parent
          PARENT="${commit_parts[1]}"
          [[ "${PARENT}" =~ ^[0-9a-f]{40}$ ]] || reject topology not_single_parent

          head_message="$(pgit log -1 --format=%B "${PUSHED_SHA}")" || reject topology release_trailer_missing
          printf '%s\n' "${head_message}" | grep -Fxq "Updater-Release-SHA: ${UPSTREAM_SHA}" || reject topology release_trailer_missing

          # One compare call proves the PR adds exactly one commit on top of
          # the default branch (§14: no earlier call in this job has it).
          compare_json="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${PUSHED_SHA}" 2>/dev/null)" || reject topology compare_failed
          if ! printf '%s' "${compare_json}" | jq -e --arg parent "${PARENT}" '
            (.ahead_by == 1)
            and ((.merge_base_commit.sha // "") == $parent)
            and (.status == "ahead" or .status == "diverged")
          ' >/dev/null 2>&1; then
            reject topology unexpected_commits
          fi

          # The update job assembled the changelog with today's UTC date; the
          # head commit's UTC date reproduces it, also for a refreshed PR.
          COMMIT_DATE="$(TZ=UTC pgit log -1 --format=%cd --date=format-local:%Y-%m-%d "${PUSHED_SHA}")" || reject topology commit_date_unreadable
          [[ "${COMMIT_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || reject topology commit_date_unreadable

          {
            echo "parent=${PARENT}"
            echo "commit_date=${COMMIT_DATE}"
          } >> "${VERIFY_OUT}"

      - name: Reproduce derived consumer files
        id: verify_reproduce
        env:
          WORK: ${{ steps.verify_release.outputs.work }}
          RELEASE_ROOT: ${{ steps.verify_release.outputs.release_root }}
          PARENT: ${{ steps.verify_topology.outputs.parent }}
          COMMIT_DATE: ${{ steps.verify_topology.outputs.commit_date }}
          # Mirrors the update job: with allow_workflow_edits false the
          # derived asset steps were skipped, so nothing is reproduced.
          SYNC_NON_WRAPPER_ASSETS: ${{ inputs.allow_workflow_edits != false }}
        run: |
          set -euo pipefail

          VERIFY_OUT="${GITHUB_OUTPUT:-/dev/null}"
          reject() {
            echo "::error::UPDATER_PR_VERIFY outcome=rejected reason=$2 stage=$1"
            exit 1
          }

          [ -n "${WORK:-}" ] && [ -d "${WORK}" ] || reject reproduce workdir_missing
          [ -n "${RELEASE_ROOT:-}" ] && [ -d "${RELEASE_ROOT}" ] || reject reproduce release_missing
          [[ "${PARENT:-}" =~ ^[0-9a-f]{40}$ ]] || reject reproduce invalid_parent
          PR_TREE="${GITHUB_WORKSPACE}/.updater-pr-tree"
          BASE_TREE="${WORK}/base"

          git -C "${PR_TREE}" -c core.hooksPath=/dev/null -c protocol.allow=never worktree add --quiet --detach "${BASE_TREE}" "${PARENT}" || reject reproduce worktree_failed

          # The same attested scripts, with the same arguments the update job
          # used, run from a neutral directory against the PR's parent tree.
          cd "${WORK}"
          if [ "${SYNC_NON_WRAPPER_ASSETS:-true}" != "true" ]; then
            echo "UPDATER_PR_VERIFY derived assets not reproduced: allow_workflow_edits is false"
            echo "base_tree=${BASE_TREE}" >> "${VERIFY_OUT}"
            exit 0
          fi
          GITHUB_OUTPUT=/dev/null python3 -I -B "${RELEASE_ROOT}/scripts/apply_audit_gate_assets.py" \
            --contract-root "${RELEASE_ROOT}/workflow-templates/audit-gate" \
            --repo-root "${BASE_TREE}" \
            --result-file "${WORK}/audit_gate_result.json" \
            --changed-files-file "${WORK}/audit_gate_changed_files.txt" >/dev/null || reject reproduce audit_gate_failed
          GITHUB_OUTPUT=/dev/null python3 -I -B "${RELEASE_ROOT}/scripts/assemble_changelog.py" ensure-assets \
            --repo-root "${BASE_TREE}" \
            --changed-paths-file "${WORK}/changelog_asset_files.txt" >/dev/null || reject reproduce changelog_assets_failed
          GITHUB_OUTPUT=/dev/null python3 -I -B "${RELEASE_ROOT}/scripts/assemble_changelog.py" assemble \
            --repo-root "${BASE_TREE}" \
            --date "${COMMIT_DATE}" >/dev/null || reject reproduce changelog_assemble_failed
          # Same fail-open as the update job's "Assemble agents.md fragments".
          GITHUB_OUTPUT=/dev/null python3 -I -B "${RELEASE_ROOT}/scripts/assemble_agents.py" assemble \
            --repo-root "${BASE_TREE}" >/dev/null || echo "::warning::UPDATER_PR_VERIFY agents.md fragment assembly failed on the parent tree; fragments stay as in the update job."

          echo "base_tree=${BASE_TREE}" >> "${VERIFY_OUT}"

      - name: Verify pull request tree against attested manifest
        id: verify_tree
        env:
          WORK: ${{ steps.verify_release.outputs.work }}
          RELEASE_ROOT: ${{ steps.verify_release.outputs.release_root }}
          MANIFEST: ${{ steps.verify_release.outputs.manifest }}
          PARENT: ${{ steps.verify_topology.outputs.parent }}
          BASE_TREE: ${{ steps.verify_reproduce.outputs.base_tree }}
        run: |
          set -euo pipefail

          reject() {
            echo "::error::UPDATER_PR_VERIFY outcome=rejected reason=$2 stage=$1"
            exit 1
          }

          PR_TREE="${GITHUB_WORKSPACE}/.updater-pr-tree"
          cd "${WORK}"
          set +e
          python3 -I -B "${RELEASE_ROOT}/scripts/verify_release_manifest.py" verify-pr-tree \
            --manifest "${MANIFEST}" \
            --release-root "${RELEASE_ROOT}" \
            --expected-sha "${UPSTREAM_SHA}" \
            --expected-repository shubhodeep1/coding-workflows \
            --git-dir "${PR_TREE}/.git" \
            --base "${PARENT}" \
            --head "${PUSHED_SHA}" \
            --reproduced-root "${BASE_TREE}" > "${WORK}/verify_tree.out" 2>/dev/null
          tree_rc=$?
          set -e
          tree_line="$(head -n1 "${WORK}/verify_tree.out")"
          if [ -n "${tree_line}" ]; then
            echo "${tree_line}"
          fi
          if [ "${tree_rc}" -ne 0 ]; then
            tree_reason="$(printf '%s\n' "${tree_line}" | sed -n 's/^UPDATER_MANIFEST_VERIFY outcome=rejected reason=\([a-z_]*\).*/\1/p')"
            reject verify "${tree_reason:-internal_error}"
          fi

      - name: Publish verify result and enable auto-merge
        id: verify_publish
        env:
          STATUS_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          VERIFY_OUT="${GITHUB_OUTPUT:-/dev/null}"
          RUN_URL="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID:-0}"
          post_verify_status() {
            GH_TOKEN="$1" gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${PUSHED_SHA}" \
              -f state=success \
              -f "context=${VERIFY_STATUS_CONTEXT}" \
              -f "description=Updater PR tree matches the attested release manifest" \
              -f "target_url=${RUN_URL}" >/dev/null
          }
          # A caller wrapper rendered before it granted `statuses: write`
          # leaves github.token without that permission. The PR that fixes
          # the wrapper would then wait for a human, so retry once with
          # GH_PAT, which already enables the merge below.
          if ! post_verify_status "${STATUS_TOKEN:-}"; then
            if [ -n "${MERGE_TOKEN:-}" ] && post_verify_status "${MERGE_TOKEN}"; then
              echo "::warning::UPDATER_PR_VERIFY posted the status with GH_PAT because github.token was refused; the caller wrapper should grant statuses: write."
            else
              echo "::error::UPDATER_PR_VERIFY outcome=rejected reason=status_post_failed stage=publish"
              exit 1
            fi
          fi

          # Merge policy (moved here from "Commit and push updates"): only a
          # verified=true release, only after the success status, bound to
          # the verified head.
          AUTO_MERGE="skipped_unverified"
          if [ "${VERIFIED:-}" = "true" ]; then
            if GH_TOKEN="${MERGE_TOKEN:-}" gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --auto --squash --match-head-commit "${PUSHED_SHA}"; then
              AUTO_MERGE="enabled"
            else
              AUTO_MERGE="failed"
              echo "::warning::UPDATER_PR_VERIFY could not enable auto-merge on #${PR_NUMBER}; a human must merge it."
            fi
          else
            echo "::warning::UPDATER_PR_VERIFY release manifest verification outcome is ${VERIFIED:-skipped}; #${PR_NUMBER} waits for a human to review and merge it."
          fi
          echo "auto_merge=${AUTO_MERGE}" >> "${VERIFY_OUT}"
          echo "UPDATER_PR_VERIFY outcome=passed reason=ok pr=${PR_NUMBER} head=${PUSHED_SHA} auto_merge=${AUTO_MERGE}"

      - name: Mark verify failure
        if: ${{ always() && steps.verify_inputs.outputs.sha_ok == 'true' && steps.verify_publish.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.GH_PAT }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail

          VERIFY_STATE="failure"
          if [ "${JOB_STATUS:-}" = "cancelled" ]; then
            VERIFY_STATE="error"
          fi
          RUN_URL="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID:-0}"
          post_failure_status() {
            GH_TOKEN="$1" gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${PUSHED_SHA}" \
              -f "state=${VERIFY_STATE}" \
              -f "context=${VERIFY_STATUS_CONTEXT}" \
              -f "description=Updater PR tree did not pass verification; auto-merge stays off" \
              -f "target_url=${RUN_URL}" >/dev/null
          }
          # Same GH_PAT fallback as the other status posts in this job.
          if ! post_failure_status "${GH_TOKEN:-}"; then
            if [ -z "${MERGE_TOKEN:-}" ] || ! post_failure_status "${MERGE_TOKEN}"; then
              echo "::warning::UPDATER_PR_VERIFY could not post the ${VERIFY_STATE} status."
            fi
          fi
          echo "UPDATER_PR_VERIFY outcome=rejected reason=verify_failed stage=final pr=${PR_NUMBER} head=${PUSHED_SHA} auto_merge=none"

      - name: Verify summary
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.verify_publish.outcome }}
          AUTO_MERGE: ${{ steps.verify_publish.outputs.auto_merge }}
        run: |
          set -euo pipefail

          if [ "${PUBLISH_OUTCOME:-}" = "success" ]; then
            VERIFY_RESULT="passed"
          else
            VERIFY_RESULT="failed (see the UPDATER_PR_VERIFY log line)"
          fi
          {
            echo "### Updater pull request verification"
            echo ""
            echo "- **Pull request:** #${PR_NUMBER:-none}"
            echo "- **Head:** \`${PUSHED_SHA:-none}\`"
            echo "- **Result:** ${VERIFY_RESULT}"
            echo "- **Auto-merge:** ${AUTO_MERGE:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

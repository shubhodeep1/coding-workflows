---
name: Update Workflow Wrappers

"on":
  workflow_call:
    inputs:
      allow_workflow_edits:
        description: "Allow automatic workflow wrapper updates"
        required: false
        default: true
        type: boolean
    secrets:
      GH_PAT:
        required: true
      TG_BOT_SECRET:
        required: false
  # workflow_dispatch is additive — required by the release gate to live-test
  # the update-wrappers path before tagging stable. Consumer repos still call
  # this workflow via workflow_call from ai-update-workflows.yml.
  workflow_dispatch:
    inputs:
      allow_workflow_edits:
        description: "Allow automatic workflow wrapper updates"
        required: false
        default: true
        type: boolean
      alert_msg_level:
        description: Override the Telegram alert threshold for this run. Set to SILENT when dispatched from the test-and-mark-stable smoke gate to avoid drowning the gate's combined notification in per-job alerts.
        required: false
        default: ""
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Default is SILENT (not DEBUG like other workflows) so the per-run
  # "🔍 DEBUG: Workflow wrappers updated in <repo>…" notification at line ~452
  # is suppressed by tg_helpers.sh::_tg_should_send. Consumer repos that
  # want the wrapper-update alert back can set vars.ALERT_MSG_LEVEL=DEBUG
  # (or any level ≤ DEBUG=0), or pass alert_msg_level=DEBUG on dispatch.
  ALERT_MSG_LEVEL: ${{ (github.event.inputs.alert_msg_level || '') != '' && github.event.inputs.alert_msg_level || vars.ALERT_MSG_LEVEL || 'SILENT' }}

jobs:
  update-wrappers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ inputs.allow_workflow_edits != false }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Fetch latest workflow templates from coding-workflows@stable
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          TEMPLATES_REPO="shubhodeep1/coding-workflows"
          TEMPLATES_REF="refs/tags/stable"
          TEMPLATES_DIR="workflow-templates"
          SCRIPTS_DIR="scripts"

          # Clone only the workflow-templates and scripts directories (sparse checkout)
          TMPDIR=$(mktemp -d)
          git clone --depth 1 --no-checkout \
            --filter=blob:none --sparse \
            "https://x-access-token:${GH_TOKEN}@github.com/${TEMPLATES_REPO}.git" \
            "${TMPDIR}/upstream"
          cd "${TMPDIR}/upstream"
          # Fetch the release tag explicitly. A long-lived branch also named
          # stable exists, so --branch stable would leave the authoritative
          # source ambiguous during release preparation.
          git fetch --force --no-tags --depth 1 origin "${TEMPLATES_REF}"
          UPSTREAM_SHA="$(git rev-parse 'FETCH_HEAD^{commit}')"
          git checkout --detach "${UPSTREAM_SHA}"
          # In cone mode, repo-root files remain present alongside these
          # directory patterns, which keeps workflow-templates/CLAUDE.md
          # (a symlink to ../CLAUDE.md) readable without passing a bare
          # root-file argument here; modern git rejects that form.
          git sparse-checkout set "${TEMPLATES_DIR}" "${SCRIPTS_DIR}"
          if [[ ! "${UPSTREAM_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Resolved upstream stable ref is not a 40-character commit SHA."
            exit 1
          fi
          UPSTREAM_SHA="${UPSTREAM_SHA,,}"

          # repository_dispatch payloads are untrusted hints only. Validate
          # them, but always render the freshly fetched stable commit so a
          # delayed event can never downgrade consumer pins.
          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            if [[ ! "${DISPATCH_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::warning::coding-workflows-stable-released payload is missing a valid 40-character sha; current stable ${UPSTREAM_SHA} wins."
            elif [ "${DISPATCH_SHA,,}" != "${UPSTREAM_SHA}" ]; then
              echo "::warning::Release payload sha ${DISPATCH_SHA,,} does not match current stable ${UPSTREAM_SHA}; current stable wins."
            fi
          fi
          cd -

          echo "upstream_dir=${TMPDIR}/upstream/${TEMPLATES_DIR}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"

      - name: Prepare immutable workflow wrappers
        id: render_wrappers
        run: |
          set -euo pipefail

          UPSTREAM_DIR="${{ steps.fetch.outputs.upstream_dir }}"
          UPSTREAM_SHA="${{ steps.fetch.outputs.upstream_sha }}"
          RENDERER="${UPSTREAM_DIR}/../scripts/workflow_wrapper_refs.py"
          RENDERED_DIR="$(mktemp -d)"

          [ -f "${RENDERER}" ] || { echo "::error::Immutable wrapper renderer is missing: ${RENDERER}"; exit 1; }

          shopt -s nullglob
          upstream_wrapper_templates=( "${UPSTREAM_DIR}"/*.yml )
          [ "${#upstream_wrapper_templates[@]}" -gt 0 ] || { echo "::error::No workflow wrappers found to render."; exit 1; }
          for upstream_wrapper_template in "${upstream_wrapper_templates[@]}"; do
            rendered_wrapper_path="${RENDERED_DIR}/$(basename "${upstream_wrapper_template}")"
            if ! PYTHONDONTWRITEBYTECODE=1 python3 "${RENDERER}" \
              --input "${upstream_wrapper_template}" \
              --output "${rendered_wrapper_path}" \
              --sha "${UPSTREAM_SHA}"; then
              echo "::error::Failed to render immutable wrapper: ${upstream_wrapper_template}"
              exit 1
            fi
          done
          shopt -u nullglob

          echo "rendered_dir=${RENDERED_DIR}" >> "$GITHUB_OUTPUT"

      - name: Apply canonical audit-gate assets
        id: audit_gate
        run: |
          set -euo pipefail

          UPSTREAM_DIR="${{ steps.fetch.outputs.upstream_dir }}"
          CONTRACT_DIR="${UPSTREAM_DIR}/audit-gate"
          RESULT_FILE="/tmp/audit_gate_apply_result.json"
          CHANGED_FILES_FILE="/tmp/audit_gate_changed_files.txt"

          python3 "${UPSTREAM_DIR}/../scripts/apply_audit_gate_assets.py" \
            --contract-root "${CONTRACT_DIR}" \
            --repo-root "." \
            --result-file "${RESULT_FILE}" \
            --changed-files-file "${CHANGED_FILES_FILE}"

          status="$(python3 - <<'PY' "${RESULT_FILE}"
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(payload.get('status', ''))
          PY
          )"
          script_action="$(python3 - <<'PY' "${RESULT_FILE}"
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(payload.get('package_script_action', ''))
          PY
          )"
          message="$(python3 - <<'PY' "${RESULT_FILE}"
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(payload.get('message', ''))
          PY
          )"
          if [ -s "${CHANGED_FILES_FILE}" ]; then
            changed_count=$(wc -l < "${CHANGED_FILES_FILE}" | tr -d ' ')
          else
            changed_count=0
          fi

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "package_script_action=${script_action}" >> "$GITHUB_OUTPUT"
          echo "changed_count=${changed_count}" >> "$GITHUB_OUTPUT"
          echo "message=${message}" >> "$GITHUB_OUTPUT"

      - name: Sync .claude/ assets from upstream
        id: claude_sync
        run: |
          set -euo pipefail

          # Mirror workflow-templates/.claude/ → .claude/ in the consumer
          # repo. Semantics, per design:
          #   - Upstream is source of truth: any file present in
          #     upstream's workflow-templates/.claude/ overwrites the
          #     consumer's copy on every sync. Hand-edits to consumer
          #     copies of synced files will be lost — matches how
          #     *.yml workflow wrappers already behave.
          #   - Consumer-local files NOT present in upstream are left
          #     alone (consumers can keep .claude/skills/private-foo/).
          #   - Files removed upstream are NOT deleted from the
          #     consumer; orphans accumulate. Intentional retirement
          #     is a future feature.
          # If upstream has no workflow-templates/.claude/ at this
          # stable ref, log and exit 0 — the sync is additive.

          UPSTREAM_DIR="${{ steps.fetch.outputs.upstream_dir }}"
          CLAUDE_UPSTREAM_DIR="${UPSTREAM_DIR}/.claude"
          CLAUDE_LOCAL_DIR=".claude"

          echo "claude_changed=0" >> "$GITHUB_OUTPUT"
          echo "claude_has_changes=false" >> "$GITHUB_OUTPUT"
          : > /tmp/claude_changed_files.txt

          if [ ! -d "${CLAUDE_UPSTREAM_DIR}" ]; then
            echo "Upstream has no workflow-templates/.claude/ at this ref — nothing to sync."
            exit 0
          fi

          mkdir -p "${CLAUDE_LOCAL_DIR}"

          CHANGED_COUNT=0
          while IFS= read -r upstream_path; do
            [ -n "${upstream_path}" ] || continue
            rel="${upstream_path#${CLAUDE_UPSTREAM_DIR}/}"
            local_path="${CLAUDE_LOCAL_DIR}/${rel}"
            local_dir=$(dirname "${local_path}")
            mkdir -p "${local_dir}"

            # Copy if absent or differs (whitespace-tolerant compare,
            # matching the wrapper-update step's diff invocation so
            # CRLF round-trips don't trigger spurious churn).
            if [ ! -f "${local_path}" ] || ! diff -q --strip-trailing-cr --ignore-space-at-eol "${upstream_path}" "${local_path}" >/dev/null 2>&1; then
              cp "${upstream_path}" "${local_path}"
              CHANGED_COUNT=$((CHANGED_COUNT + 1))
              printf '%s\n' "${local_path}" >> /tmp/claude_changed_files.txt
            fi
          done < <(LC_ALL=C find "${CLAUDE_UPSTREAM_DIR}" -type f | LC_ALL=C sort)

          echo "claude_changed=${CHANGED_COUNT}" >> "$GITHUB_OUTPUT"
          if [ "${CHANGED_COUNT}" -gt 0 ]; then
            echo "claude_has_changes=true" >> "$GITHUB_OUTPUT"
            echo ".claude/ assets synced: ${CHANGED_COUNT} file(s) changed."
          else
            echo ".claude/ assets already up to date."
          fi

      - name: Sync top-level CLAUDE.md from upstream
        id: claude_md_sync
        run: |
          set -euo pipefail

          # Mirror upstream's root CLAUDE.md → consumer's root CLAUDE.md.
          # Semantics match the .claude/ sync above and the wrapper
          # update: upstream is source of truth, hand-edits are
          # overwritten on every sync. The upstream copy reached here
          # via the workflow-templates/CLAUDE.md symlink (→ ../CLAUDE.md);
          # cp -L dereferences it so the consumer gets a regular file
          # at its repo root, not a symlink. If upstream has no
          # CLAUDE.md at this stable ref the sync is a no-op.

          UPSTREAM_DIR="${{ steps.fetch.outputs.upstream_dir }}"
          UPSTREAM_CLAUDE_MD="${UPSTREAM_DIR}/CLAUDE.md"
          LOCAL_CLAUDE_MD="CLAUDE.md"

          echo "claude_md_changed=false" >> "$GITHUB_OUTPUT"
          rm -f /tmp/claude_md_changed_file.txt

          if [ ! -e "${UPSTREAM_CLAUDE_MD}" ] && [ ! -L "${UPSTREAM_CLAUDE_MD}" ]; then
            echo "Upstream has no workflow-templates/CLAUDE.md at this ref — nothing to sync."
            exit 0
          fi

          # Dereferenced read — if the symlink target wasn't pulled by
          # sparse-checkout this will fail loudly rather than silently
          # writing a broken file.
          if ! cat -- "${UPSTREAM_CLAUDE_MD}" >/dev/null 2>&1; then
            echo "::error::Root CLAUDE.md is unreadable via workflow-templates/CLAUDE.md (dangling symlink or missing sparse-checkout target)."
            exit 1
          fi

          if [ ! -f "${LOCAL_CLAUDE_MD}" ] || ! diff -q --strip-trailing-cr --ignore-space-at-eol "${UPSTREAM_CLAUDE_MD}" "${LOCAL_CLAUDE_MD}" >/dev/null 2>&1; then
            cp -L "${UPSTREAM_CLAUDE_MD}" "${LOCAL_CLAUDE_MD}"
            echo "claude_md_changed=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${LOCAL_CLAUDE_MD}" > /tmp/claude_md_changed_file.txt
            echo "Top-level CLAUDE.md synced from upstream."
          else
            echo "Top-level CLAUDE.md already up to date."
          fi

      - name: Sync changelog fragment assets from upstream
        id: changelog_sync
        run: |
          set -euo pipefail

          # Fifth sync category (CLAUDE.md §20). Consumer repos hit constant
          # CHANGELOG.md merge conflicts because newest-entry-first insertion
          # makes every concurrent PR edit the same hunk at line 1. The fix is
          # the changelog.d/ fragment workflow: one file per PR, so two PRs
          # never touch the same path. This step lands the scaffolding that
          # makes the mechanism real in the consumer:
          #   - changelog.d/.gitkeep — the directory agents write fragments to.
          #   - .gitattributes — the managed `CHANGELOG.md merge=union` block,
          #     a backstop for direct edits that bypass fragments.
          # Semantics differ deliberately from the .claude/ sync above: this is
          # ADDITIVE ONLY. .gitattributes is edited through a delimited managed
          # block, so consumer-local attribute rules are preserved rather than
          # overwritten, and an existing changelog.d/ is never emptied.
          # Runs upstream's scripts/assemble_changelog.py from the @stable
          # support checkout — the consumer never carries a copy, so the rule
          # in CLAUDE.md §20 and the machinery implementing it cannot drift.

          UPSTREAM_DIR="${{ steps.fetch.outputs.upstream_dir }}"
          UPSTREAM_SCRIPTS_DIR="$(dirname "${UPSTREAM_DIR}")/scripts"
          ASSEMBLER="${UPSTREAM_SCRIPTS_DIR}/assemble_changelog.py"

          echo "changelog_assets_has_changes=false" >> "$GITHUB_OUTPUT"
          rm -f /tmp/changelog_asset_files.txt

          if [ ! -f "${ASSEMBLER}" ]; then
            echo "Upstream has no scripts/assemble_changelog.py at this ref — nothing to sync."
            exit 0
          fi

          PYTHONDONTWRITEBYTECODE=1 python3 "${ASSEMBLER}" ensure-assets \
            --repo-root . \
            --changed-paths-file /tmp/changelog_asset_files.txt

      - name: Assemble changelog fragments
        id: changelog_assemble
        run: |
          set -euo pipefail

          # Consumer-side assembly host (CLAUDE.md §18.A/§18.B — folded into
          # automation that already runs, no operator action). Consumer repos
          # have no release workflow and no push-triggered wrapper, so this
          # sync job — which already commits and pushes to the default branch
          # below — is the only existing automation that can fold fragments
          # into CHANGELOG.md. Assembly therefore lands on the next sync run
          # (daily 04:00 UTC cron, or immediately on the @stable
          # repository_dispatch) rather than at merge time.
          #
          # The assembler auto-detects the repo's layout: Keep a Changelog
          # (## [Unreleased] + ### subsections) upstream, bare ## YYYY-MM-DD
          # date headings in consumers such as tele-funtoken-msg-scoring. No
          # consumer has to convert its changelog history.

          UPSTREAM_DIR="${{ steps.fetch.outputs.upstream_dir }}"
          UPSTREAM_SCRIPTS_DIR="$(dirname "${UPSTREAM_DIR}")/scripts"
          ASSEMBLER="${UPSTREAM_SCRIPTS_DIR}/assemble_changelog.py"

          echo "changelog_assembled=false" >> "$GITHUB_OUTPUT"

          if [ ! -f "${ASSEMBLER}" ]; then
            echo "Upstream has no scripts/assemble_changelog.py at this ref — skipping assembly."
            exit 0
          fi

          PYTHONDONTWRITEBYTECODE=1 python3 "${ASSEMBLER}" assemble --repo-root .

      - name: Compare and update workflow wrappers
        id: update
        run: |
          set -euo pipefail

          UPSTREAM_DIR="${{ steps.fetch.outputs.upstream_dir }}"
          RENDERED_DIR="${{ steps.render_wrappers.outputs.rendered_dir }}"
          LOCAL_DIR=".github/workflows"
          UPDATED_FILES=""
          CREATED_FILES=""
          SKIPPED_FILES=""
          TOTAL_CHECKED=0
          TOTAL_UPDATED=0
          TOTAL_CREATED=0
          FAILURE_REASON_FILE="/tmp/update_workflows_failure_reason.txt"
          SELECTED_PROFILE="${{ vars.WORKFLOW_PROFILE != '' && vars.WORKFLOW_PROFILE || 'full' }}"
          PROFILE_MANIFEST_DIR="${UPSTREAM_DIR}/profiles"
          PROFILE_MANIFEST="${PROFILE_MANIFEST_DIR}/${SELECTED_PROFILE}.txt"
          manifest_templates=()
          self_template_selected=false

          # The updater itself must already exist for this job to run. Refresh
          # it when present, but never auto-create it, to avoid bootstrap loops.
          SELF_TEMPLATE="ai-update-workflows.yml"

          printf '' > /tmp/updated_files.txt
          printf '' > /tmp/created_files.txt
          printf '' > /tmp/skipped_files.txt
          : > "${FAILURE_REASON_FILE}"

          echo "templates_checked=0" >> "$GITHUB_OUTPUT"
          echo "templates_updated=0" >> "$GITHUB_OUTPUT"
          echo "templates_created=0" >> "$GITHUB_OUTPUT"
          echo "has_updates=false" >> "$GITHUB_OUTPUT"
          echo "validation_ok=false" >> "$GITHUB_OUTPUT"
          echo "failure_reason_code=" >> "$GITHUB_OUTPUT"
          echo "failure_reason_detail=" >> "$GITHUB_OUTPUT"

          fail_with_reason() {
            local code="$1"
            local detail="$2"
            local detail_sanitized="${detail//$'\r'/ }"
            detail_sanitized="${detail_sanitized//$'\n'/ }"
            echo "::error::${code}: ${detail_sanitized}"
            echo "validation_ok=false" >> "$GITHUB_OUTPUT"
            echo "failure_reason_code=${code}" >> "$GITHUB_OUTPUT"
            echo "failure_reason_detail=${detail_sanitized}" >> "$GITHUB_OUTPUT"
            printf '%s\n%s\n' "${code}" "${detail_sanitized}" > "${FAILURE_REASON_FILE}"
            exit 1
          }

          [ -n "${UPSTREAM_DIR}" ] || fail_with_reason "ERR_UPSTREAM_DIR_EMPTY" "Fetch step did not provide upstream_dir."
          [ -d "${UPSTREAM_DIR}" ] || fail_with_reason "ERR_UPSTREAM_DIR_MISSING" "Upstream template directory does not exist: ${UPSTREAM_DIR}"

          shopt -s nullglob
          upstream_templates=( "${UPSTREAM_DIR}"/*.yml )
          [ "${#upstream_templates[@]}" -gt 0 ] || fail_with_reason "ERR_UPSTREAM_TEMPLATES_EMPTY" "No workflow templates (*.yml) found in ${UPSTREAM_DIR}."
          [ -f "${UPSTREAM_DIR}/${SELF_TEMPLATE}" ] || fail_with_reason "ERR_UPSTREAM_SELF_TEMPLATE_MISSING" "Expected sentinel template ${SELF_TEMPLATE} is missing from ${UPSTREAM_DIR}."

          [ -d "${LOCAL_DIR}" ] || fail_with_reason "ERR_LOCAL_WORKFLOW_DIR_MISSING" "Local workflow directory is missing: ${LOCAL_DIR}"
          [ -w "${LOCAL_DIR}" ] || fail_with_reason "ERR_LOCAL_WORKFLOW_DIR_NOT_WRITABLE" "Local workflow directory is not writable: ${LOCAL_DIR}"

          [ -d "${PROFILE_MANIFEST_DIR}" ] || fail_with_reason "ERR_PROFILE_MANIFEST_DIR_MISSING" "Upstream profile manifest directory does not exist: ${PROFILE_MANIFEST_DIR}."
          [ -f "${PROFILE_MANIFEST}" ] || fail_with_reason "ERR_WORKFLOW_PROFILE_UNKNOWN" "Requested WORKFLOW_PROFILE '${SELECTED_PROFILE}' does not match an upstream manifest in ${PROFILE_MANIFEST_DIR}."

          while IFS= read -r manifest_entry || [ -n "${manifest_entry}" ]; do
            manifest_entry="${manifest_entry%$'\r'}"
            manifest_entry="${manifest_entry#"${manifest_entry%%[![:space:]]*}"}"
            manifest_entry="${manifest_entry%"${manifest_entry##*[![:space:]]}"}"
            [ -n "${manifest_entry}" ] || continue
            upstream_file="${RENDERED_DIR}/${manifest_entry}"
            [ -f "${upstream_file}" ] || fail_with_reason "ERR_PROFILE_TEMPLATE_MISSING" "Workflow profile ${SELECTED_PROFILE} references missing template ${manifest_entry}."
            manifest_templates+=( "${upstream_file}" )
            if [ "${manifest_entry}" = "${SELF_TEMPLATE}" ]; then
              self_template_selected=true
            fi
          done < "${PROFILE_MANIFEST}"

          [ "${#manifest_templates[@]}" -gt 0 ] || fail_with_reason "ERR_WORKFLOW_PROFILE_EMPTY" "Workflow profile ${SELECTED_PROFILE} has no template entries."

          # The self-updater is bootstrap-only when absent, but once present
          # it must receive immutable pins even when the selected profile does
          # not list it.
          if [ "${self_template_selected}" != "true" ] && [ -e "${LOCAL_DIR}/${SELF_TEMPLATE}" ]; then
            manifest_templates+=( "${RENDERED_DIR}/${SELF_TEMPLATE}" )
          fi

          for upstream_file in "${manifest_templates[@]}"; do
            filename=$(basename "$upstream_file")
            local_file="${LOCAL_DIR}/${filename}"
            if [ "$filename" = "$SELF_TEMPLATE" ] && [ ! -e "$local_file" ]; then
              continue
            fi
            if [ -e "$local_file" ] && [ -d "$local_file" ]; then
              fail_with_reason "ERR_LOCAL_TARGET_IS_DIRECTORY" "Existing workflow path is a directory, not a file: ${local_file}"
            fi
            if [ -e "$local_file" ] && [ ! -w "$local_file" ]; then
              fail_with_reason "ERR_LOCAL_TARGET_NOT_WRITABLE" "Existing workflow file is not writable: ${local_file}"
            fi
          done

          for upstream_file in "${manifest_templates[@]}"; do
            filename=$(basename "$upstream_file")
            local_file="${LOCAL_DIR}/${filename}"
            TOTAL_CHECKED=$((TOTAL_CHECKED + 1))

            if [ ! -f "$local_file" ]; then
              if [ "$filename" = "$SELF_TEMPLATE" ]; then
                SKIPPED_FILES="${SKIPPED_FILES}${filename} (self-updater absent, skipped)\n"
                continue
              fi

              echo "Creating: ${filename}"
              cp "$upstream_file" "$local_file" || fail_with_reason "ERR_TEMPLATE_COPY_FAILED" "Failed to create workflow file ${local_file} from ${upstream_file}."
              TOTAL_CREATED=$((TOTAL_CREATED + 1))
              CREATED_FILES="${CREATED_FILES}• ${filename}\n"
              continue
            fi

            # Compare content (ignore trailing whitespace differences)
            if ! diff -q --strip-trailing-cr --ignore-space-at-eol "$upstream_file" "$local_file" >/dev/null 2>&1; then
              echo "Updating: ${filename}"
              cp "$upstream_file" "$local_file" || fail_with_reason "ERR_TEMPLATE_COPY_FAILED" "Failed to update workflow file ${local_file} from ${upstream_file}."
              TOTAL_UPDATED=$((TOTAL_UPDATED + 1))
              UPDATED_FILES="${UPDATED_FILES}• ${filename}\n"
            fi
          done
          shopt -u nullglob

          echo "validation_ok=true" >> "$GITHUB_OUTPUT"
          echo "failure_reason_code=" >> "$GITHUB_OUTPUT"
          echo "failure_reason_detail=" >> "$GITHUB_OUTPUT"

          echo "templates_checked=${TOTAL_CHECKED}" >> "$GITHUB_OUTPUT"
          echo "templates_updated=${TOTAL_UPDATED}" >> "$GITHUB_OUTPUT"
          echo "templates_created=${TOTAL_CREATED}" >> "$GITHUB_OUTPUT"

          # Store multi-line outputs via files
          printf '%b' "$UPDATED_FILES" > /tmp/updated_files.txt
          printf '%b' "$CREATED_FILES" > /tmp/created_files.txt
          printf '%b' "$SKIPPED_FILES" > /tmp/skipped_files.txt

          TOTAL_CHANGED=$((TOTAL_UPDATED + TOTAL_CREATED))
          if [ "$TOTAL_CHANGED" -eq 0 ]; then
            echo "All workflow wrappers are up to date."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updates
        if: steps.update.outputs.has_updates == 'true' || steps.audit_gate.outputs.status == 'applied' || steps.claude_sync.outputs.claude_has_changes == 'true' || steps.claude_md_sync.outputs.claude_md_changed == 'true' || steps.changelog_sync.outputs.changelog_assets_has_changes == 'true' || steps.changelog_assemble.outputs.changelog_assembled == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .github/workflows/
          if [ -f /tmp/audit_gate_changed_files.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              git add -- "$changed_path"
            done < /tmp/audit_gate_changed_files.txt
          fi
          if [ -f /tmp/claude_changed_files.txt ] && [ -s /tmp/claude_changed_files.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              git add -- "$changed_path"
            done < /tmp/claude_changed_files.txt
          fi
          if [ -f /tmp/claude_md_changed_file.txt ] && [ -s /tmp/claude_md_changed_file.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              git add -- "$changed_path"
            done < /tmp/claude_md_changed_file.txt
          fi
          if [ -f /tmp/changelog_asset_files.txt ] && [ -s /tmp/changelog_asset_files.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              git add -- "$changed_path"
            done < /tmp/changelog_asset_files.txt
          fi
          # Assembly both rewrites CHANGELOG.md and deletes the folded
          # fragments, so stage with -A to pick up the removals.
          if [ "${{ steps.changelog_assemble.outputs.changelog_assembled }}" = "true" ]; then
            git add -A -- CHANGELOG.md changelog.d
          fi

          COMMIT_BODY=""
          UPDATED_LIST=$(cat /tmp/updated_files.txt)
          CREATED_LIST=$(cat /tmp/created_files.txt)
          AUDIT_CHANGED_LIST=""
          if [ -f /tmp/audit_gate_changed_files.txt ] && [ -s /tmp/audit_gate_changed_files.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              AUDIT_CHANGED_LIST="${AUDIT_CHANGED_LIST}• ${changed_path}\n"
            done < /tmp/audit_gate_changed_files.txt
          fi
          CLAUDE_CHANGED_LIST=""
          if [ -f /tmp/claude_changed_files.txt ] && [ -s /tmp/claude_changed_files.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              CLAUDE_CHANGED_LIST="${CLAUDE_CHANGED_LIST}• ${changed_path}\n"
            done < /tmp/claude_changed_files.txt
          fi
          if [ -n "$UPDATED_LIST" ]; then
            COMMIT_BODY="${COMMIT_BODY}Updated templates:\n${UPDATED_LIST}\n"
          fi
          if [ -n "$CREATED_LIST" ]; then
            COMMIT_BODY="${COMMIT_BODY}New templates:\n${CREATED_LIST}\n"
          fi
          if [ -n "$AUDIT_CHANGED_LIST" ]; then
            COMMIT_BODY="${COMMIT_BODY}Audit gate assets:\n${AUDIT_CHANGED_LIST}\n"
          fi
          if [ -n "$CLAUDE_CHANGED_LIST" ]; then
            COMMIT_BODY="${COMMIT_BODY}.claude/ assets:\n${CLAUDE_CHANGED_LIST}\n"
          fi
          CLAUDE_MD_CHANGED_LIST=""
          if [ -f /tmp/claude_md_changed_file.txt ] && [ -s /tmp/claude_md_changed_file.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              CLAUDE_MD_CHANGED_LIST="${CLAUDE_MD_CHANGED_LIST}• ${changed_path}\n"
            done < /tmp/claude_md_changed_file.txt
          fi
          if [ -n "$CLAUDE_MD_CHANGED_LIST" ]; then
            COMMIT_BODY="${COMMIT_BODY}Top-level CLAUDE.md:\n${CLAUDE_MD_CHANGED_LIST}\n"
          fi
          CHANGELOG_ASSET_LIST=""
          if [ -f /tmp/changelog_asset_files.txt ] && [ -s /tmp/changelog_asset_files.txt ]; then
            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              CHANGELOG_ASSET_LIST="${CHANGELOG_ASSET_LIST}• ${changed_path}\n"
            done < /tmp/changelog_asset_files.txt
          fi
          if [ -n "$CHANGELOG_ASSET_LIST" ]; then
            COMMIT_BODY="${COMMIT_BODY}Changelog fragment assets:\n${CHANGELOG_ASSET_LIST}\n"
          fi
          if [ "${{ steps.changelog_assemble.outputs.changelog_assembled }}" = "true" ]; then
            COMMIT_BODY="${COMMIT_BODY}Changelog fragments assembled into CHANGELOG.md (${{ steps.changelog_assemble.outputs.changelog_fragment_count }} fragment(s), layout ${{ steps.changelog_assemble.outputs.changelog_layout }}).\n"
          fi

          if git diff --cached --quiet; then
            echo "No staged changes detected after update step; skipping commit."
            exit 0
          fi

          git commit -m "$(printf 'chore: update AI workflow wrappers from coding-workflows@stable\n\n%b\nAuto-applied by ai-update-workflows. To opt out, set the\nALLOW_WORKFLOW_EDITS repository variable to '\''false'\''.' "$COMMIT_BODY")"

          git push

      - name: Send Telegram notification
        if: steps.update.outputs.has_updates == 'true' || steps.audit_gate.outputs.status == 'applied' || steps.claude_sync.outputs.claude_has_changes == 'true' || steps.claude_md_sync.outputs.claude_md_changed == 'true' || steps.changelog_sync.outputs.changelog_assets_has_changes == 'true' || steps.changelog_assemble.outputs.changelog_assembled == 'true'
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "::warning::Telegram not configured (TG_BOT_SECRET or TG_ADMIN_CHAT_ID missing) — skipping notification."
            exit 0
          fi

          # Inline-fetch tg_helpers.sh for alert level support
          wf_source="${{ github.repository_owner }}/coding-workflows"
          mkdir -p scripts
          helpers_tmp="$(mktemp)"
          if gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${wf_source}/contents/scripts/tg_helpers.sh?ref=stable" > "${helpers_tmp}" 2>/dev/null && [ -s "${helpers_tmp}" ]; then
            mv "${helpers_tmp}" "scripts/tg_helpers.sh"
            # Block fetched scripts from being committed in consumer repos.
            if [ "${{ github.repository }}" != "${wf_source}" ]; then
              {
                echo "# Auto-generated by coding-workflows — DO NOT EDIT"
                echo "# Prevents runtime-fetched support scripts from being committed."
                echo "tg_helpers.sh"
                echo ".gitignore"
              } > scripts/.gitignore
            fi
            source scripts/tg_helpers.sh
          else
            rm -f "${helpers_tmp}"
          fi

          REPO="${{ github.repository }}"
          UPDATED_COUNT="${{ steps.update.outputs.templates_updated }}"
          CREATED_COUNT="${{ steps.update.outputs.templates_created }}"
          UPDATED_LIST=$(cat /tmp/updated_files.txt)
          CREATED_LIST=$(cat /tmp/created_files.txt)
          AUDIT_GATE_STATUS="${{ steps.audit_gate.outputs.status }}"
          AUDIT_GATE_CHANGED_LIST=""
          if [ -f /tmp/audit_gate_changed_files.txt ] && [ -s /tmp/audit_gate_changed_files.txt ]; then
            AUDIT_GATE_CHANGED_LIST=$(cat /tmp/audit_gate_changed_files.txt)
          fi
          CLAUDE_CHANGED_COUNT="${{ steps.claude_sync.outputs.claude_changed }}"
          CLAUDE_CHANGED_LIST=""
          if [ -f /tmp/claude_changed_files.txt ] && [ -s /tmp/claude_changed_files.txt ]; then
            CLAUDE_CHANGED_LIST=$(cat /tmp/claude_changed_files.txt)
          fi
          CLAUDE_MD_CHANGED="${{ steps.claude_md_sync.outputs.claude_md_changed }}"
          CLAUDE_MD_CHANGED_LIST=""
          if [ -f /tmp/claude_md_changed_file.txt ] && [ -s /tmp/claude_md_changed_file.txt ]; then
            CLAUDE_MD_CHANGED_LIST=$(cat /tmp/claude_md_changed_file.txt)
          fi
          CHANGELOG_ASSET_LIST=""
          if [ -f /tmp/changelog_asset_files.txt ] && [ -s /tmp/changelog_asset_files.txt ]; then
            CHANGELOG_ASSET_LIST=$(cat /tmp/changelog_asset_files.txt)
          fi
          CHANGELOG_ASSEMBLED="${{ steps.changelog_assemble.outputs.changelog_assembled }}"
          CHANGELOG_FRAGMENT_COUNT="${{ steps.changelog_assemble.outputs.changelog_fragment_count }}"
          CHANGELOG_LAYOUT="${{ steps.changelog_assemble.outputs.changelog_layout }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MSG="Workflow wrappers updated in ${REPO}
          "
          if [ -n "$UPDATED_LIST" ]; then
            MSG="${MSG}
          ${UPDATED_COUNT} wrapper(s) updated:
          ${UPDATED_LIST}"
          fi
          if [ -n "$CREATED_LIST" ]; then
            MSG="${MSG}
          ${CREATED_COUNT} new wrapper(s) added:
          ${CREATED_LIST}"
          fi
          if [ "${AUDIT_GATE_STATUS}" = "applied" ] && [ -n "$AUDIT_GATE_CHANGED_LIST" ]; then
            MSG="${MSG}
          Audit-gate assets applied:
          ${AUDIT_GATE_CHANGED_LIST}"
          fi
          if [ -n "$CLAUDE_CHANGED_LIST" ]; then
            MSG="${MSG}
          ${CLAUDE_CHANGED_COUNT} .claude/ asset(s) synced:
          ${CLAUDE_CHANGED_LIST}"
          fi
          if [ "${CLAUDE_MD_CHANGED}" = "true" ] && [ -n "$CLAUDE_MD_CHANGED_LIST" ]; then
            MSG="${MSG}
          Top-level CLAUDE.md synced:
          ${CLAUDE_MD_CHANGED_LIST}"
          fi
          if [ -n "$CHANGELOG_ASSET_LIST" ]; then
            MSG="${MSG}
          Changelog fragment assets changed:
          ${CHANGELOG_ASSET_LIST}"
          fi
          if [ "${CHANGELOG_ASSEMBLED}" = "true" ]; then
            MSG="${MSG}
          Changelog fragments assembled: ${CHANGELOG_FRAGMENT_COUNT} fragment(s), layout ${CHANGELOG_LAYOUT}."
          fi
          MSG="${MSG}
          Source: coding-workflows@stable
          Run: ${RUN_URL}"

          if declare -F tg_send_msg >/dev/null 2>&1; then
            tg_send_msg "${MSG}" "DEBUG" >/dev/null
          else
            curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_SECRET}/sendMessage" \
              -d "chat_id=${TG_ADMIN_CHAT_ID}" \
              -d "disable_web_page_preview=true" \
              --data-urlencode "text=${MSG}" >/dev/null 2>&1 || echo "::warning::Telegram send failed"
          fi

      - name: Summary
        if: always()
        run: |
          set -euo pipefail

          FETCH_OUTCOME="${{ steps.fetch.outcome }}"
          RENDER_OUTCOME="${{ steps.render_wrappers.outcome }}"
          UPDATE_OUTCOME="${{ steps.update.outcome }}"
          HAS_UPDATES="${{ steps.update.outputs.has_updates }}"
          TEMPLATES_CHECKED="${{ steps.update.outputs.templates_checked }}"
          TEMPLATES_UPDATED="${{ steps.update.outputs.templates_updated }}"
          TEMPLATES_CREATED="${{ steps.update.outputs.templates_created }}"
          AUDIT_GATE_STATUS="${{ steps.audit_gate.outputs.status }}"
          AUDIT_GATE_SCRIPT_ACTION="${{ steps.audit_gate.outputs.package_script_action }}"
          AUDIT_GATE_CHANGED_COUNT="${{ steps.audit_gate.outputs.changed_count }}"
          AUDIT_GATE_MESSAGE="${{ steps.audit_gate.outputs.message }}"
          FAILURE_REASON_CODE="${{ steps.update.outputs.failure_reason_code }}"
          FAILURE_REASON_DETAIL="${{ steps.update.outputs.failure_reason_detail }}"
          FAILURE_REASON_FILE="/tmp/update_workflows_failure_reason.txt"

          if [ -z "${HAS_UPDATES}" ]; then
            HAS_UPDATES="false"
          fi
          if [ -z "${TEMPLATES_CHECKED}" ]; then
            TEMPLATES_CHECKED="0"
          fi
          if [ -z "${TEMPLATES_UPDATED}" ]; then
            TEMPLATES_UPDATED="0"
          fi
          if [ -z "${TEMPLATES_CREATED}" ]; then
            TEMPLATES_CREATED="0"
          fi

          if [ -z "${FAILURE_REASON_CODE}" ] && [ -f "${FAILURE_REASON_FILE}" ]; then
            IFS= read -r FAILURE_REASON_CODE < "${FAILURE_REASON_FILE}" || true
            FAILURE_REASON_DETAIL="$(sed -n '2p' "${FAILURE_REASON_FILE}" 2>/dev/null || true)"
          fi

          echo "### Workflow Wrapper Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${FETCH_OUTCOME}" = "failure" ]; then
            echo "- **Status:** failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason code:** \\`ERR_TEMPLATE_FETCH_FAILED\\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason detail:** Fetch step failed before pre-mutation validation could run." >> "$GITHUB_STEP_SUMMARY"
            if [ -f "${FAILURE_REASON_FILE}" ]; then
              echo "- **Failure reason artifact:** \\`${FAILURE_REASON_FILE}\\`" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi

          if [ "${RENDER_OUTCOME}" = "failure" ]; then
            echo "- **Status:** failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason code:** \`ERR_WRAPPER_RENDER_FAILED\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason detail:** Canonical wrappers could not be validated and rendered with the current stable commit SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${UPDATE_OUTCOME}" = "failure" ]; then
            if [ -z "${FAILURE_REASON_CODE}" ]; then
              FAILURE_REASON_CODE="ERR_UNCATEGORIZED_FAILURE"
              FAILURE_REASON_DETAIL="Update step failed before categorized reason was recorded."
            fi
            echo "- **Status:** failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason code:** \\`${FAILURE_REASON_CODE}\\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failure reason detail:** ${FAILURE_REASON_DETAIL}" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "${FAILURE_REASON_FILE}" ]; then
              echo "- **Failure reason artifact:** \\`${FAILURE_REASON_FILE}\\`" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi

          echo "- **Templates checked:** ${TEMPLATES_CHECKED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Templates updated:** ${TEMPLATES_UPDATED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Templates created:** ${TEMPLATES_CREATED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Audit gate status:** ${AUDIT_GATE_STATUS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Audit gate package script action:** ${AUDIT_GATE_SCRIPT_ACTION:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Audit gate changed files:** ${AUDIT_GATE_CHANGED_COUNT:-0}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${AUDIT_GATE_MESSAGE:-}" ]; then
            echo "- **Audit gate message:** ${AUDIT_GATE_MESSAGE}" >> "$GITHUB_STEP_SUMMARY"
          fi
          CLAUDE_CHANGED_COUNT="${{ steps.claude_sync.outputs.claude_changed }}"
          echo "- **.claude/ assets synced:** ${CLAUDE_CHANGED_COUNT:-0}" >> "$GITHUB_STEP_SUMMARY"
          CLAUDE_MD_CHANGED="${{ steps.claude_md_sync.outputs.claude_md_changed }}"
          echo "- **Top-level CLAUDE.md synced:** ${CLAUDE_MD_CHANGED:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${HAS_UPDATES}" = "true" ]; then
            UPDATED_LIST=$(cat /tmp/updated_files.txt)
            CREATED_LIST=$(cat /tmp/created_files.txt)
            SKIPPED_LIST=$(cat /tmp/skipped_files.txt)
            if [ -n "$UPDATED_LIST" ]; then
              echo "**Updated files:**" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/updated_files.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -n "$CREATED_LIST" ]; then
              echo "**New files:**" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/created_files.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -n "$SKIPPED_LIST" ]; then
              echo "**Skipped files:**" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/skipped_files.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "All wrappers are up to date." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s /tmp/audit_gate_changed_files.txt ]; then
            echo "**Audit gate files:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/audit_gate_changed_files.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s /tmp/claude_changed_files.txt ]; then
            echo "**.claude/ files:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/claude_changed_files.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s /tmp/claude_md_changed_file.txt ]; then
            echo "**Top-level CLAUDE.md:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/claude_md_changed_file.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

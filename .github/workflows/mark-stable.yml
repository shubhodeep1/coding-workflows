---
name: Mark Stable Release

"on":
  workflow_dispatch:
    inputs:
      version_tag:
        description: >
          Semantic version tag (e.g. v1.2.0). Leave blank to auto-increment
          patch from the latest stable release.
        required: false
        type: string
        default: ""
      dry_run:
        description: Validate only — do not push tags or create release
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Job -1: Validate dispatch ref — must be `stable`
  #
  # Mirrors the lockdown applied to test-and-mark-stable.yml. This
  # workflow only releases from the long-lived `stable` branch.
  # Dispatching from `main` (or any other ref) is rejected so an
  # operator cannot accidentally tag main as stable. To promote `main`
  # to the new stable baseline, run promote-main-to-stable.yml — it
  # fast-forwards stable to main and then dispatches the full release
  # gate (test-and-mark-stable.yml) on stable automatically.
  # ──────────────────────────────────────────────────────────────────
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      branch: ${{ steps.detect.outputs.branch }}
    steps:
      - name: Validate dispatch ref
        id: detect
        run: |
          set -euo pipefail
          REF="${{ github.ref_name }}"
          if [ "$REF" != "stable" ]; then
            echo "::error::mark-stable.yml must be dispatched from the 'stable' branch (got '${REF}')."
            echo "::error::To promote 'main' to a new stable baseline, run promote-main-to-stable.yml — it fast-forwards stable to main and then dispatches the full release gate on stable automatically."
            exit 1
          fi
          echo "Dispatched from 'stable' — proceeding"
          echo "branch=stable" >> "$GITHUB_OUTPUT"

  resolve-version:
    needs: [source]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version tag
        id: resolve
        env:
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.version_tag }}"

          if [ -n "$INPUT_VERSION" ]; then
            if [[ ! "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Provided version '${INPUT_VERSION}' is invalid; must match vX.Y.Z"
              exit 1
            fi
            echo "Using user-provided version: ${INPUT_VERSION}"
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Refresh tags from origin BEFORE computing LATEST. If a new
          # tag was pushed after checkout, computing LATEST first would
          # pick an outdated base. Bounded retry tolerates transient
          # network/auth flakes; persistent failure is a hard error
          # since running on stale tag data could pick a colliding
          # version.
          # Capture each attempt's stderr to /tmp/_git_fetch_err so the
          # underlying transport/auth failure cause is visible in logs
          # instead of being swallowed by the retry warning.
          fetch_attempt=1
          while [ "$fetch_attempt" -le 3 ]; do
            if git fetch --tags --force origin 2>/tmp/_git_fetch_err; then
              break
            fi
            if [ "$fetch_attempt" -eq 3 ]; then
              echo "::error::Failed to fetch remote tags from origin after 3 attempts — refusing to compute next version on potentially stale tag data"
              cat /tmp/_git_fetch_err >&2 2>/dev/null || true
              exit 1
            fi
            backoff=$(( 2 ** fetch_attempt ))
            echo "::warning::git fetch --tags failed (attempt ${fetch_attempt}/3), retrying in ${backoff}s…"
            cat /tmp/_git_fetch_err >&2 2>/dev/null || true
            sleep "${backoff}"
            fetch_attempt=$((fetch_attempt + 1))
          done

          # Find the latest vX.Y.Z tag reachable from `stable`'s HEAD.
          # `--merged HEAD` is critical: if main is on v1.5.0 and stable
          # is on v1.4.2, the next stable patch must bump from v1.4.2
          # (→ v1.4.3), not from main's v1.5.0. Filter to strict semver
          # with grep (the shell glob also matches prerelease tags like
          # `v1.4.2-beta.1` which would break `cut -d. -f3` arithmetic).
          # `{ grep ... || true; }` keeps the pipeline exit status at 0
          # when no semver tags exist so the empty-LATEST fallback can
          # run under pipefail.
          LATEST=$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | head -n1)

          NEXT=""
          if [ -z "$LATEST" ]; then
            NEXT="v1.0.0"
            echo "No existing version tags reachable from ${SOURCE_BRANCH}. Defaulting to ${NEXT}"
          else
            # Bump patch and skip any candidate that already exists
            # anywhere in the repo (e.g. main may have tagged a v1.4.3
            # before bumping to v1.5.0 while stable is still at v1.4.2;
            # without this check the workflow would fail later at the
            # tag-push step). Bounded to 1000 iterations.
            MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
            i=0
            while [ "$i" -lt 1000 ]; do
              PATCH=$((PATCH + 1))
              CANDIDATE="v${MAJOR}.${MINOR}.${PATCH}"
              if ! git rev-parse "refs/tags/${CANDIDATE}" >/dev/null 2>&1; then
                NEXT="$CANDIDATE"
                break
              fi
              echo "Tag ${CANDIDATE} already exists elsewhere in repo — skipping"
              i=$((i + 1))
            done
            if [ -z "$NEXT" ]; then
              echo "::error::Could not find an unused patch tag after 1000 attempts starting from ${LATEST}"
              exit 1
            fi
            echo "Latest tag on ${SOURCE_BRANCH}: ${LATEST} → next version: ${NEXT}"
          fi

          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────
  # Script correctness validation — gates the release
  # ──────────────────────────────────────────────────────────────────
  validate-scripts:
    needs: [source, resolve-version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.branch }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: YAML lint
        run: |
          set -euo pipefail
          pip install -q yamllint
          yamllint -s .github/workflows/*.yml .github/actions/*/action.yml

      - name: Shell script syntax check
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            bash -n "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: ShellCheck static analysis
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            shellcheck --severity=error "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Python syntax check
        run: |
          set -euo pipefail
          for f in scripts/*.py; do
            python3 -m py_compile "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Python lint (ruff)
        run: |
          set -euo pipefail
          pip install -q ruff
          ruff check --select E,F --ignore E501 scripts/*.py

      - name: Install Python test dependencies
        run: |
          set -euo pipefail
          # test_validation_refresh_runner.py exercises the real discovery
          # manifest validator (validate_discovered_manifest_yaml), which needs
          # pyyaml + jsonschema; jinja2 is required by the template-render tests.
          # Matches the dependency set installed in ci.yml, validation-refresh.yml
          # and nightly-validation-selftest.yml. Without these, the validator
          # short-circuits with jsonschema_missing, the codex retry loop fires,
          # and the FakeExecutor planned-call sequence desyncs (false failure).
          python3 -m pip install --quiet pyyaml jsonschema jinja2

      - name: Unit tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_lib.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_blocker_check.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_codex_stall_guard_poller.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_force_tick.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrator_concurrency_caps.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_integration_ahead_by_gate.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_poll_process.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_poll_noop_suspicious_recovery.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_state_snapshot.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_run_substate_ledger.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_lint_pr_body_auto_close.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_lint_plan_archival_completeness.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_check_integration_pr_readiness.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_mark_stable_release_tag_refspec_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_targeted_file_context.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_phase_prompt_untrusted_context_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_detect_editor_changes_lost.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_autofix_review_pipeline_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_autofix_editor_noop_cascade_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_rb_judge_self_run_exclusion.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_rereview_and_approval_rubric.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_surface_prompt_hardening.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validate_editor_audit.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_reject_verify.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_stall_recovery_pr_lookup.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_editor_fifo_drain.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_subissue_closing_pr.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_fingerprint_state_selfheal.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_stall_loop_and_churn_fixes.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_stall_freshness_branch_fallback.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_retrigger_inflight_direct_fallback.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_actions_runs_fetch_unconfirmed_warning.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_conflict_resolve_smoke_deterministic.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_conflict_resolve_retry_prelude_render.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_cost_audit_semble_metrics.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workflow_log_analysis_failure_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_phase_skip_gate_telemetry_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workflow_gh_retry_fallback_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_semble_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_judge_semble_prefetch_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_judge_interim_round_trip.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_codex_stall_guard_scripts.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_memory_record_schema.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_audit_consumer_drift.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_render_prompt_foundation.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_render_prompt_core_modes.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_render_prompt_review_judge_modes.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_render_prompt_validate_analytics_modes.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_synthesise_smoke.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_implement_semble_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validate_semble_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validate_driver_synthesised_filter.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validation_refresh_runner.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validation_discovery_bootstrap.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validate_workflow_validate_bootstrap.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_codex_thread_reuse_core.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_codex_skip_git_repo_check_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workspace_init.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workspace_hooks.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workspace_cache_maintenance.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_family_node_runtime.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_poll_workflow_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workflow_overlay_orchestrator.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_mcp_handshake_probe.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_setup_serena_toml.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_serena_stats_emit.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validate_process_template_mode.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_semble_workflow_parity_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_drift_audit_job.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_fingerprint_quarantine.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_conflict_resolve_retry_state.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_verify_integration_fingerprints_tiers.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_verify_integration_fingerprints_post_capture_evolution.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_conflict_resolve_reasoning_step_down.py

      - name: Prompt files integrity
        run: |
          set -euo pipefail
          for f in prompts/*.txt; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f is empty"
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done

      - name: Script-workflow cross-reference
        run: |
          set -euo pipefail
          echo "Verifying all scripts referenced by workflows exist..."
          # Scripts intentionally absent on main: optional backends that shim
          # branches stage at runtime (see #3057). They appear as literal
          # scripts/<name> tokens in workflow YAML (e.g. validate.yml stages
          # render_prompt.py conditionally; review_autofix.yml's leaked-path
          # guard lists it), but main ships a self-contained alternative
          # (render_prompt.sh), so their absence here is expected and must not
          # fail the cross-reference gate. Keep this list in sync with the
          # optional-bootstrap handling in the consumer-facing workflows.
          OPTIONAL_SCRIPTS=("scripts/render_prompt.py")
          MISSING=0
          for ref in $(grep -rhoE 'scripts/[a-zA-Z0-9_.-]+\.(sh|py|json)' .github/workflows/ | sort -u); do
            if [ ! -f "$ref" ]; then
              if printf '%s\n' "${OPTIONAL_SCRIPTS[@]}" | grep -qxF "$ref"; then
                echo "OPTIONAL (absent on main, staged by shim branches): $ref"
                continue
              fi
              echo "FAIL: $ref referenced in workflows but does not exist"
              MISSING=$((MISSING + 1))
            else
              echo "OK: $ref"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::${MISSING} script(s) referenced by workflows are missing"
            exit 1
          fi
          echo "All referenced scripts exist."

  validate:
    needs: [source, resolve-version]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate version format
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version tag '${VERSION}'. Must match vX.Y.Z"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.branch }}
          fetch-depth: 0

      - name: Ensure tag does not already exist
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          # Query the remote directly — `git rev-parse refs/tags/<V>`
          # only checks the local namespace and can race a concurrent
          # tag push. `git ls-remote --exit-code` returns 0 if the ref
          # exists, 2 if absent, other non-zero on transport/auth
          # errors. Disambiguate so a transient failure can't silently
          # look like "tag absent" and let the workflow advance to a
          # duplicate tag push. Matches test-and-mark-stable.yml.
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "::error::Tag ${VERSION} already exists on origin"
              exit 1
              ;;
            2)
              echo "Tag ${VERSION} does not yet exist on origin — OK"
              ;;
            *)
              echo "::error::git ls-remote failed with exit code ${rc} (transport/auth/repo error). Refusing to proceed without a confirmed tag-absent signal."
              exit 1
              ;;
          esac

      - name: Verify CI passed on stable
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          SHA=$(git rev-parse HEAD)
          echo "Checking CI status for ${SOURCE_BRANCH} @ $SHA ..."
          # Allow the release even if no CI status is reported (repos
          # with no required checks). Fail only on explicit failure.
          # Distinguish three failure modes:
          #   1. API call itself failed (transport / auth / repeated 5xx
          #      / rate-limit retries exhausted) → hard error. The old
          #      `|| echo "pending"` coerced this into a synthetic
          #      "pending" that bypassed the gate.
          #   2. API returned an empty state (repo has no required
          #      checks configured) → proceed (preserves the documented
          #      "Allow the release even if no CI status is reported"
          #      policy above).
          #   3. API returned a real state — fail only on explicit
          #      "failure" / "error".
          # gh_retry already surfaces the final failure stderr, so rc
          # alone distinguishes transport/auth failure from an empty CI
          # state.
          set +e
          STATE=$(gh_retry gh api "repos/${{ github.repository }}/commits/${SHA}/status" \
            --jq '.state')
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Failed to query CI status for ${SOURCE_BRANCH} after retries (rc=${rc}). Refusing to release without a confirmed CI signal."
            exit 1
          fi
          if [ -z "$STATE" ]; then
            echo "CI state: (empty — no required checks configured?) — proceeding"
          elif [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
            echo "::error::CI is failing on ${SOURCE_BRANCH} ($STATE). Fix before releasing."
            exit 1
          else
            echo "CI state: $STATE — OK"
          fi

  release:
    needs: [source, resolve-version, validate, validate-scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.branch }}
          fetch-depth: 0

      - name: Extract changelog for this version
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          # Pull the section between this version header and the next
          NOTES=$(awk \
            "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" \
            CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="No changelog entry found for ${VERSION}."
          fi
          # Write to file to avoid quoting issues
          echo "$NOTES" > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Tag version and update stable pointer
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION="${{ needs.resolve-version.outputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          # Immutable version tag (refs/tags/ prefix for consistency with the moving-tag pushes below)
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

          # Moving stable pointer (use refs/tags/ to disambiguate from refs/heads/stable)
          git tag -f stable "$VERSION"
          git push -f origin refs/tags/stable

          # Moving major-version pointer (e.g. v1)
          git tag -f "$MAJOR" "$VERSION"
          git push -f origin "refs/tags/$MAJOR"

          echo "Tagged $VERSION and updated stable + $MAJOR pointers."

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            --target "${SOURCE_BRANCH}"

      - name: Notify consumer repos via repository_dispatch
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          VERSION="${{ needs.resolve-version.outputs.version }}"

          # Read consumer repos from .github/ai/consumer_repos.json (a JSON
          # array of repo strings, e.g. ["owner/repo"]). If the file is
          # absent the step is a no-op — consumers still pick up changes via
          # their daily schedule.
          CONSUMER_FILE=".github/ai/consumer_repos.json"
          if [ ! -f "$CONSUMER_FILE" ]; then
            echo "No consumer_repos.json found — skipping repository_dispatch."
            exit 0
          fi

          REPOS=$(jq -r '.[]' "$CONSUMER_FILE" 2>/dev/null || true)
          if [ -z "$REPOS" ]; then
            echo "consumer_repos.json is empty — skipping."
            exit 0
          fi

          for REPO in $REPOS; do
            echo "Dispatching coding-workflows-stable-released to ${REPO} ..."
            gh_retry gh api "repos/${REPO}/dispatches" \
              -f event_type="coding-workflows-stable-released" \
              -f "client_payload[version]=${VERSION}" \
              || echo "::warning::Failed to dispatch to ${REPO} (may lack permissions)"
          done

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        env:
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
        run: |
          echo "=== DRY RUN ==="
          VERSION="${{ needs.resolve-version.outputs.version }}"
          echo "Would tag ${SOURCE_BRANCH} as: ${VERSION}"
          echo "Would update pointers: stable, $(echo "${VERSION}" | cut -d. -f1)"
          echo ""
          echo "Changelog notes:"
          cat "${{ steps.changelog.outputs.notes_file }}"

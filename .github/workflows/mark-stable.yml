---
name: Mark Stable Release

"on":
  workflow_dispatch:
    inputs:
      version_tag:
        description: >
          Semantic version tag (e.g. v1.2.0). Leave blank to auto-increment
          patch from the latest stable release.
        required: false
        type: string
        default: ""
      dry_run:
        description: Validate only — do not push tags or create release
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Job -1: Validate dispatch ref — must be `stable`
  #
  # Mirrors the lockdown applied to test-and-mark-stable.yml. This
  # workflow only releases from the long-lived `stable` branch.
  # Dispatching from `main` (or any other ref) is rejected so an
  # operator cannot accidentally tag main as stable. To promote `main`
  # to the new stable baseline, run promote-main-to-stable.yml — it
  # fast-forwards stable to main and then dispatches the full release
  # gate (test-and-mark-stable.yml) on stable automatically.
  # ──────────────────────────────────────────────────────────────────
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      branch: ${{ steps.detect.outputs.branch }}
    steps:
      # The dispatch ref is writer-controlled (a branch may be named
      # `$(...)`): it reaches the shell only through env and must equal
      # refs/heads/stable exactly, which also rejects the `stable` tag.
      - name: Validate dispatch ref
        id: detect
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${DISPATCH_REF}" != "refs/heads/stable" ]; then
            printf "::error::mark-stable.yml must be dispatched from the 'stable' branch (refs/heads/stable; got '%s').\n" "${DISPATCH_REF}"
            echo "::error::To promote 'main' to a new stable baseline, run promote-main-to-stable.yml — it fast-forwards stable to main and then dispatches the full release gate on stable automatically."
            exit 1
          fi
          echo "Dispatched from 'stable' — proceeding"
          printf 'branch=stable\n' >> "$GITHUB_OUTPUT"

      # Writer-controlled github.sha must be the stable tip or an ancestor of
      # it before any later job checks it out (the release job does so with
      # GH_PAT and runs its scripts). This step runs no repository code: it
      # never checks anything out and uses github.token read-only.
      - name: Verify dispatched commit is on stable
        id: verify_commit
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "${DISPATCH_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            printf "::error::Dispatched commit '%s' is not a 40-character hex SHA; refusing to release.\n" "${DISPATCH_SHA}"
            exit 1
          fi
          backoff="${RELEASE_SOURCE_VERIFY_BACKOFF_SECONDS:-2}"
          case "${backoff}" in ''|*[!0-9]*) backoff=2 ;; esac
          # Bounded retry; only the successful attempt's stdout is used
          # (gh api prints error bodies to stdout, #5495).
          release_source_api() {
            local attempt=1 delay="${backoff}" out=""
            while [ "${attempt}" -le 3 ]; do
              if out="$(gh api "$@")"; then
                printf '%s' "${out}"
                return 0
              fi
              if [ "${attempt}" -lt 3 ]; then
                echo "::warning::gh api $1 failed (attempt ${attempt}/3); retrying in ${delay}s." >&2
                sleep "${delay}"
                delay=$((delay * 2))
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }
          # GitHub API audit (§14): the source job makes no other API call to
          # extend, and scripts/gh_helpers.sh is not available because
          # checking it out would run repository code before this trust check.
          # heads/ is fully qualified: `stable` is also a tag.
          if ! STABLE_TIP="$(release_source_api "repos/${GITHUB_REPOSITORY}/git/ref/heads/stable" --jq '.object.sha')"; then
            echo "::error::Could not read the stable branch tip after 3 attempts; refusing to release an unverified commit."
            exit 1
          fi
          if ! [[ "${STABLE_TIP}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The stable branch tip lookup returned no valid SHA; refusing to release an unverified commit."
            exit 1
          fi
          if [ "${STABLE_TIP}" = "${DISPATCH_SHA}" ]; then
            echo "Dispatched commit ${DISPATCH_SHA} is the stable tip — OK"
            exit 0
          fi
          if ! COMPARE_STATUS="$(release_source_api "repos/${GITHUB_REPOSITORY}/compare/${DISPATCH_SHA}...${STABLE_TIP}" --jq '.status')"; then
            echo "::error::Could not compare ${DISPATCH_SHA} with the stable tip ${STABLE_TIP} after 3 attempts; refusing to release an unverified commit."
            exit 1
          fi
          case "${COMPARE_STATUS}" in
            identical|ahead)
              echo "Dispatched commit ${DISPATCH_SHA} is in the history of the stable tip ${STABLE_TIP} — OK"
              ;;
            *)
              printf "::error::RELEASE_UNTESTED_HEAD tested=%s tip=%s compare='%s': the dispatched commit is not in the stable branch history; refusing to release.\n" "${DISPATCH_SHA}" "${STABLE_TIP}" "${COMPARE_STATUS}"
              exit 1
              ;;
          esac

  resolve-version:
    needs: [source]
    runs-on: ubuntu-latest
    # The full-history checkout (fetch-depth: 0, for the tag list) took 87s
    # on 2026-10-15 02:21 and passed 2 minutes at 10:04, cancelling the
    # release after stable had already moved (run 38717659089).
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version tag
        id: resolve
        env:
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
          INPUT_VERSION: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            if [[ ! "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Provided version '${INPUT_VERSION}' is invalid; must match vX.Y.Z"
              exit 1
            fi
            echo "Using user-provided version: ${INPUT_VERSION}"
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Refresh tags from origin BEFORE computing LATEST. If a new
          # tag was pushed after checkout, computing LATEST first would
          # pick an outdated base. Bounded retry tolerates transient
          # network/auth flakes; persistent failure is a hard error
          # since running on stale tag data could pick a colliding
          # version.
          # Capture each attempt's stderr to /tmp/_git_fetch_err so the
          # underlying transport/auth failure cause is visible in logs
          # instead of being swallowed by the retry warning.
          fetch_attempt=1
          while [ "$fetch_attempt" -le 3 ]; do
            if git fetch --tags --force origin 2>/tmp/_git_fetch_err; then
              break
            fi
            if [ "$fetch_attempt" -eq 3 ]; then
              echo "::error::Failed to fetch remote tags from origin after 3 attempts — refusing to compute next version on potentially stale tag data"
              cat /tmp/_git_fetch_err >&2 2>/dev/null || true
              exit 1
            fi
            backoff=$(( 2 ** fetch_attempt ))
            echo "::warning::git fetch --tags failed (attempt ${fetch_attempt}/3), retrying in ${backoff}s…"
            cat /tmp/_git_fetch_err >&2 2>/dev/null || true
            sleep "${backoff}"
            fetch_attempt=$((fetch_attempt + 1))
          done

          # Find the latest vX.Y.Z tag reachable from `stable`'s HEAD.
          # `--merged HEAD` is critical: if main is on v1.5.0 and stable
          # is on v1.4.2, the next stable patch must bump from v1.4.2
          # (→ v1.4.3), not from main's v1.5.0. Filter to strict semver
          # with grep (the shell glob also matches prerelease tags like
          # `v1.4.2-beta.1` which would break `cut -d. -f3` arithmetic).
          # `{ grep ... || true; }` keeps the pipeline exit status at 0
          # when no semver tags exist so the empty-LATEST fallback can
          # run under pipefail.
          LATEST=$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | head -n1)

          NEXT=""
          if [ -z "$LATEST" ]; then
            NEXT="v1.0.0"
            echo "No existing version tags reachable from ${SOURCE_BRANCH}. Defaulting to ${NEXT}"
          else
            # Bump patch and skip any candidate that already exists
            # anywhere in the repo (e.g. main may have tagged a v1.4.3
            # before bumping to v1.5.0 while stable is still at v1.4.2;
            # without this check the workflow would fail later at the
            # tag-push step). Bounded to 1000 iterations.
            MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
            i=0
            while [ "$i" -lt 1000 ]; do
              PATCH=$((PATCH + 1))
              CANDIDATE="v${MAJOR}.${MINOR}.${PATCH}"
              if ! git rev-parse "refs/tags/${CANDIDATE}" >/dev/null 2>&1; then
                NEXT="$CANDIDATE"
                break
              fi
              echo "Tag ${CANDIDATE} already exists elsewhere in repo — skipping"
              i=$((i + 1))
            done
            if [ -z "$NEXT" ]; then
              echo "::error::Could not find an unused patch tag after 1000 attempts starting from ${LATEST}"
              exit 1
            fi
            echo "Latest tag on ${SOURCE_BRANCH}: ${LATEST} → next version: ${NEXT}"
          fi

          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"

      # Release credential preflight (analysis/workflow-optimization-2026-09-22.md,
      # Speed #4 / Reliability #2): release run 35639756385 spent about 94
      # minutes before GitHub refused the tag push for a classic GH_PAT without
      # the `workflow` scope. Fails here only when the classic PAT lacks that
      # scope AND stable..HEAD changes .github/workflows/; every uncertain case
      # proceeds. RELEASE_TAG_PREFLIGHT_ENABLED=false turns it off.
      - name: Preflight release tag credential
        id: release_tag_preflight
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_TAG_PREFLIGHT_ENABLED: ${{ vars.RELEASE_TAG_PREFLIGHT_ENABLED || 'true' }}
          STABLE_RELEASE_ENABLED: ${{ vars.STABLE_RELEASE_ENABLED || 'true' }}
          RELEASE_TAGGING_ENABLED: ${{ vars.RELEASE_TAGGING_ENABLED || 'true' }}
        run: |
          set -euo pipefail
          base="$(git rev-parse -q --verify 'refs/tags/stable^{commit}' 2>/dev/null || true)"
          head="$(git rev-parse -q --verify 'HEAD^{commit}' 2>/dev/null || true)"
          if [ ! -f scripts/release_tag_preflight.sh ] || [ -L scripts/release_tag_preflight.sh ]; then
            echo "::warning::scripts/release_tag_preflight.sh is missing on this commit; skipping the release credential preflight."
            echo "RELEASE_TAG_PREFLIGHT result=unknown error_class=none reason=script_missing"
            exit 0
          fi
          RELEASE_TAG_PREFLIGHT_BASE_SHA="${base}" RELEASE_TAG_PREFLIGHT_HEAD_SHA="${head}" \
            bash scripts/release_tag_preflight.sh

  # ──────────────────────────────────────────────────────────────────
  # Script correctness validation — gates the release
  # ──────────────────────────────────────────────────────────────────
  validate-scripts:
    needs: [source, resolve-version]
    runs-on: ubuntu-latest
    # 45, not 30: the orchestrate-poll module is this job's critical path
    # even after sharding, and shards can be slower on a cold runner than
    # on a warm one. At 30 the serial suite in the test-and-mark-stable
    # twin of this job was cancelled mid-run (release v1.27.0, run
    # 33073743283). It mirrored the `CI / lint` budget from #3844 until #4707 split that job.
    # 60, not 45 (#4707): the job measured 37 minutes on 2026-09-28
    # (test-and-mark-stable run 36374918973: orchestrate-poll 21 minutes,
    # unit tests 14.5 minutes), too close to 45. `CI` splits the same
    # suite into parallel jobs; this manually dispatched gate keeps one runner
    # and the longer budget instead.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.branch }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: YAML lint
        run: |
          set -euo pipefail
          pip install -q yamllint
          yamllint -s .github/workflows/*.yml .github/actions/*/action.yml

      - name: Shell script syntax check
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            bash -n "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: ShellCheck static analysis
        run: |
          set -euo pipefail
          # Issue #6680: ShellCheck 0.9.x (the runner image's copy) always runs
          # its dataflow analysis, which takes the runner down on
          # scripts/orchestrate_poll_process.sh. ShellCheck 0.10+ honours that
          # file's `# shellcheck extended-analysis=false` directive, so pin it.
          # A failed install keeps the runner's copy with a warning.
          sc=shellcheck
          if python3 -m pip install --quiet 'shellcheck-py==0.10.0.1'; then
            sc_dir="$(python3 -c 'import sysconfig; print(sysconfig.get_path("scripts"))')" || sc_dir=""
            if [ -x "${sc_dir}/shellcheck" ]; then
              sc="${sc_dir}/shellcheck"
            else
              echo "::warning::ShellCheck 0.10.0.1 installed but ${sc_dir:-<unknown>}/shellcheck is missing; using $(command -v shellcheck || echo 'no shellcheck')."
            fi
          else
            echo "::warning::Could not install ShellCheck 0.10.0.1; using $(command -v shellcheck || echo 'no shellcheck')."
          fi
          "${sc}" --version
          for f in scripts/*.sh; do
            "${sc}" --severity=error "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Python syntax check
        run: |
          set -euo pipefail
          for f in scripts/*.py; do
            python3 -m py_compile "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Python lint (ruff)
        run: |
          set -euo pipefail
          pip install -q ruff
          ruff check --select E,F --ignore E501 scripts/*.py

      - name: Install Python test dependencies
        run: |
          set -euo pipefail
          # test_validation_refresh_runner.py exercises the real discovery
          # manifest validator (validate_discovered_manifest_yaml), which needs
          # pyyaml + jsonschema; jinja2 is required by the template-render tests.
          # Those three dependencies match validation-refresh.yml and
          # nightly-validation-selftest.yml; pytest runs the release-gate
          # watchdog contract test. Without the first three, the validator
          # short-circuits with jsonschema_missing, the codex retry loop fires,
          # and the FakeExecutor planned-call sequence desyncs (false failure).
          python3 -m pip install --quiet pyyaml jsonschema jinja2 pytest

      - name: Orchestrate poll process unit tests
        env:
          CI_POLL_TEST_SHARDS: ${{ vars.CI_POLL_TEST_SHARDS || '4' }}
        run: |
          set -euo pipefail
          # Ported from ci.yml's sharded step (#3844): this module is the
          # job's critical path. Most of its 300+ tests spawn the real poller
          # as a bash subprocess inside a throwaway sandbox, so they cost
          # seconds each rather than milliseconds; run sequentially the module
          # consumed ~24 of the 30 budgeted minutes in the test-and-mark-stable
          # twin of this job and the job was cancelled mid-suite (release
          # v1.27.0, run 33073743283), which skipped `validate`/`release` and
          # failed the release. Each test allocates its own tempdir sandbox in
          # _make_poller_sandbox, so the module shards with no shared state.
          # Unlike ci.yml there is no fast-fail subset here: the shard input
          # is the full module.
          shards="${CI_POLL_TEST_SHARDS:-4}"
          if ! [ "${shards}" -ge 1 ] 2>/dev/null; then
            echo "::warning::CI_POLL_TEST_SHARDS='${shards}' is not a positive integer; falling back to 1 (sequential)."
            shards=1
          fi

          # Partition-contract guard: the awk split below must lose nothing
          # and duplicate nothing. tests/test_ci_poll_test_sharding.py pins
          # the expression for every workflow that shards this module.
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_ci_poll_test_sharding.py

          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import ast
          from pathlib import Path

          module = ast.parse(
              Path("tests/test_orchestrate_poll_process.py").read_text(encoding="utf-8")
          )
          tests = [
              node.name
              for node in module.body
              if isinstance(node, ast.FunctionDef) and node.name.startswith("test_")
          ]
          tests.sort()
          if not tests:
              raise SystemExit("No tests discovered in the orchestrate-poll module")
          Path("/tmp/orchestrate_poll_all_tests.txt").write_text("\n".join(tests) + "\n")
          PY

          rm -f /tmp/poll_shard_*.txt /tmp/poll_shard_*.log /tmp/poll_shard_*.rc
          shard_pids=()
          for shard in $(seq 0 "$((shards - 1))"); do
            awk -v n="${shard}" -v total="${shards}" 'NR % total == n' \
              /tmp/orchestrate_poll_all_tests.txt > "/tmp/poll_shard_${shard}.txt"
            [ -s "/tmp/poll_shard_${shard}.txt" ] || continue
            (
              mapfile -t shard_tests < "/tmp/poll_shard_${shard}.txt"
              set +e
              PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_poll_process.py \
                "${shard_tests[@]}" > "/tmp/poll_shard_${shard}.log" 2>&1
              echo "$?" > "/tmp/poll_shard_${shard}.rc"
            ) &
            shard_pids+=("$!")
          done

          # Reap every shard before judging any of them, so one early failure
          # cannot leave siblings orphaned on the runner.
          for shard_pid in "${shard_pids[@]}"; do
            wait "${shard_pid}" || true
          done

          # Each failed shard's failing tests are repeated after the loop (#6888).
          # The shard logs above sit in collapsed groups, so in run 37907017153 the
          # job tail showed only the last shard's "33 passed", not shard 1's failure.
          shard_failures=0
          shard_failure_lines=()
          for shard in $(seq 0 "$((shards - 1))"); do
            [ -s "/tmp/poll_shard_${shard}.txt" ] || continue
            # A shard with tests but no log died before its runner started, so
            # its tests never ran: count it as failed instead of skipping it.
            if [ ! -f "/tmp/poll_shard_${shard}.log" ]; then
              echo "::error::orchestrate-poll shard ${shard} produced no log; its tests did not run"
              shard_failures=$((shard_failures + 1))
              shard_failure_lines+=("shard ${shard}: no log recorded, its tests did not run")
              continue
            fi
            echo "::group::orchestrate-poll shard ${shard} ($(wc -l < "/tmp/poll_shard_${shard}.txt" | tr -d '[:space:]') tests)"
            cat "/tmp/poll_shard_${shard}.log"
            echo "::endgroup::"
            # A missing .rc means the subshell died before recording one; treat
            # that as a failure rather than silently passing the shard.
            shard_rc="$(cat "/tmp/poll_shard_${shard}.rc" 2>/dev/null || echo 1)"
            case "${shard_rc}" in
              ''|*[!0-9]*) shard_rc=1 ;;
            esac
            if [ "${shard_rc}" -ne 0 ]; then
              echo "::error::orchestrate-poll shard ${shard} failed (exit ${shard_rc})"
              # Name the failing tests in annotations (#6885): the per-shard
              # log above sits inside a ::group:: that triage cannot read.
              # Match the runner's exact "  FAIL  <name>: ..." prefix, cap at
              # 20 lines, and escape workflow-command data. Without a FAIL
              # line (interrupted shard), print the log tail with a prefix so
              # log text can never start a workflow command.
              mapfile -t shard_fail_lines < <(grep -a -E '^  FAIL  ' "/tmp/poll_shard_${shard}.log" | head -n 20 || true)
              if [ "${#shard_fail_lines[@]}" -gt 0 ]; then
                for shard_fail_line in "${shard_fail_lines[@]}"; do
                  shard_fail_line="${shard_fail_line//%/%25}"
                  shard_fail_line="${shard_fail_line//$'\r'/%0D}"
                  shard_fail_line="${shard_fail_line//$'\n'/%0A}"
                  echo "::error::orchestrate-poll shard ${shard}: ${shard_fail_line#  }"
                done
              else
                echo "::error::orchestrate-poll shard ${shard} had no FAIL line; last log lines follow"
                while IFS= read -r shard_tail_line || [ -n "${shard_tail_line}" ]; do
                  echo "orchestrate-poll shard ${shard} | ${shard_tail_line}"
                done < <(tail -n 20 "/tmp/poll_shard_${shard}.log" || true)
              fi
              shard_failures=$((shard_failures + 1))
              # Prefer the runner's FAIL line (it carries the exception); fall back
              # to its "complete" fail events; else say no failure was recorded.
              # Every match is kept so the "... and <k> more" count below is exact.
              # `-a`: a NUL byte in the log must not turn the matches into grep's
              # "Binary file ... matches" line.
              mapfile -t shard_fail_matches < <(grep -a -E '^[[:space:]]*FAIL[[:space:]]' "/tmp/poll_shard_${shard}.log" 2>/dev/null || true)
              if [ "${#shard_fail_matches[@]}" -eq 0 ]; then
                mapfile -t shard_fail_matches < <(grep -a -E '^TEST_CASE_EVENT: .*"event":"complete"' "/tmp/poll_shard_${shard}.log" 2>/dev/null | grep -a -F '"status":"fail"' || true)
              fi
              if [ "${#shard_fail_matches[@]}" -eq 0 ]; then
                shard_failure_lines+=("shard ${shard}: exit ${shard_rc}, no FAIL line recorded (runner likely died)")
              else
                for shard_fail_match in "${shard_fail_matches[@]}"; do
                  shard_failure_lines+=("shard ${shard}: ${shard_fail_match#"${shard_fail_match%%[![:space:]]*}"}")
                done
              fi
            fi
          done
          if [ "${shard_failures}" -ne 0 ]; then
            # At most 20 annotations; CR removed, cut to 400 characters, then "%"
            # escaped so a test message cannot break the annotation syntax.
            shard_failure_shown=0
            for shard_failure_line in "${shard_failure_lines[@]}"; do
              if [ "${shard_failure_shown}" -ge 20 ]; then
                break
              fi
              shard_failure_line="${shard_failure_line//$'\r'/}"
              shard_failure_line="${shard_failure_line:0:400}"
              shard_failure_line="${shard_failure_line//\%/%25}"
              echo "::error::orchestrate-poll failing test: ${shard_failure_line}"
              shard_failure_shown=$((shard_failure_shown + 1))
            done
            if [ "${#shard_failure_lines[@]}" -gt 20 ]; then
              echo "::error::orchestrate-poll failing test: ... and $(( ${#shard_failure_lines[@]} - 20 )) more (see the shard groups above)"
            fi
            echo "::error::${shard_failures} orchestrate-poll shard(s) failed."
            exit 1
          fi

      - name: Unit tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_lib.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_blocker_check.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_codex_stall_guard_poller.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_force_tick.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrator_concurrency_caps.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_integration_ahead_by_gate.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_poll_noop_suspicious_recovery.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_state_snapshot.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_run_substate_ledger.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_lint_pr_body_auto_close.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_lint_plan_archival_completeness.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_lint_plan_decisions.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_check_integration_pr_readiness.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_mark_stable_release_tag_refspec_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_targeted_file_context.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_phase_prompt_untrusted_context_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_security_audit_workflow_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_detect_editor_changes_lost.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_autofix_review_pipeline_contract.py

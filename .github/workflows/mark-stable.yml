---
name: Mark Stable Release

"on":
  workflow_dispatch:
    inputs:
      version_tag:
        description: >
          Semantic version tag (e.g. v1.2.0). Leave blank to auto-increment
          patch from the latest stable release.
        required: false
        type: string
        default: ""
      dry_run:
        description: Validate only — do not push tags or create release
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version tag
        id: resolve
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.version_tag }}"

          if [ -n "$INPUT_VERSION" ]; then
            if [[ ! "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Provided version '${INPUT_VERSION}' is invalid; must match vX.Y.Z"
              exit 1
            fi
            echo "Using user-provided version: ${INPUT_VERSION}"
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find the latest vX.Y.Z tag reachable from main
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)

          if [ -z "$LATEST" ]; then
            NEXT="v1.0.0"
            echo "No existing version tags found. Defaulting to ${NEXT}"
          else
            # Parse and increment patch
            MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
            NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "Latest tag: ${LATEST} → next version: ${NEXT}"
          fi

          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────
  # Script correctness validation — gates the release
  # ──────────────────────────────────────────────────────────────────
  validate-scripts:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: YAML lint
        run: |
          set -euo pipefail
          pip install -q yamllint
          yamllint -s .github/workflows/*.yml .github/actions/*/action.yml

      - name: Shell script syntax check
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            bash -n "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: ShellCheck static analysis
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            shellcheck --severity=error "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Python syntax check
        run: |
          set -euo pipefail
          for f in scripts/*.py; do
            python3 -m py_compile "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Python lint (ruff)
        run: |
          set -euo pipefail
          pip install -q ruff
          ruff check --select E,F --ignore E501 scripts/*.py

      - name: Unit tests
        run: |
          set -euo pipefail
          python3 tests/test_orchestrate_lib.py
          python3 tests/test_orchestrate_poll_process.py
          python3 tests/test_validate_process_driver_guard_scope.py

      - name: Prompt files integrity
        run: |
          set -euo pipefail
          for f in prompts/*.txt; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f is empty"
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done

      - name: Script-workflow cross-reference
        run: |
          set -euo pipefail
          echo "Verifying all scripts referenced by workflows exist..."
          MISSING=0
          for ref in $(grep -rhoE 'scripts/[a-zA-Z0-9_.-]+\.(sh|py|json)' .github/workflows/ | sort -u); do
            if [ ! -f "$ref" ]; then
              echo "FAIL: $ref referenced in workflows but does not exist"
              MISSING=$((MISSING + 1))
            else
              echo "OK: $ref"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::${MISSING} script(s) referenced by workflows are missing"
            exit 1
          fi
          echo "All referenced scripts exist."

  validate:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate version format
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version tag '${VERSION}'. Must match vX.Y.Z"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure tag does not already exist
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${VERSION} already exists"
            exit 1
          fi

      - name: Verify CI passed on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "Checking CI status for $SHA ..."
          # Allow the release even if no CI status is reported (repos
          # with no required checks). Fail only on explicit failure.
          # Rate-limit-aware gh retry
          _rl_wait() {
            local _reset_ts _wait_secs
            _reset_ts=$(gh api -i /rate_limit 2>/dev/null | grep -i '^x-ratelimit-reset:' | head -1 | awk '{print $2}' | tr -d '\r') || true
            if [ -n "${_reset_ts}" ] && [ "${_reset_ts}" -gt 0 ] 2>/dev/null; then
              _wait_secs=$(( _reset_ts - $(date +%s) + 1 ))
              [ "${_wait_secs}" -lt 1 ] && _wait_secs=1
              [ "${_wait_secs}" -gt 600 ] && _wait_secs=600
            else
              _wait_secs=30
            fi
            echo "::warning::  Rate limit resets in ${_wait_secs}s (X-RateLimit-Reset: ${_reset_ts:-unknown})" >&2
            sleep "${_wait_secs}"
          }
          _gh_retry() {
            local attempt=1
            while [ "${attempt}" -le 5 ]; do
              if "$@" 2>/tmp/_gh_rl_err; then return 0; fi
              if grep -qiE 'rate limit|abuse detection|secondary rate|HTTP 429' /tmp/_gh_rl_err 2>/dev/null; then
                echo "::warning::Rate limit hit (attempt ${attempt}/5), waiting for reset…" >&2
                _rl_wait; attempt=$((attempt + 1))
              else
                cat /tmp/_gh_rl_err >&2 2>/dev/null; local w=$(( 2 ** (attempt - 1) ))
                echo "::warning::gh failed (attempt ${attempt}/5), retrying in ${w}s…" >&2
                sleep "${w}"; attempt=$((attempt + 1))
              fi
            done; return 1
          }
          STATE=$(_gh_retry gh api "repos/${{ github.repository }}/commits/${SHA}/status" \
            --jq '.state' 2>/dev/null || echo "pending")
          if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
            echo "::error::CI is failing on main ($STATE). Fix before releasing."
            exit 1
          fi
          echo "CI state: $STATE — OK"

  release:
    needs: [resolve-version, validate, validate-scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Extract changelog for this version
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          # Pull the section between this version header and the next
          NOTES=$(awk \
            "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" \
            CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="No changelog entry found for ${VERSION}."
          fi
          # Write to file to avoid quoting issues
          echo "$NOTES" > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Tag version and update stable pointer
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION="${{ needs.resolve-version.outputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          # Immutable version tag
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

          # Moving stable pointer
          git tag -f stable "$VERSION"
          git push -f origin stable

          # Moving major-version pointer (e.g. v1)
          git tag -f "$MAJOR" "$VERSION"
          git push -f origin "$MAJOR"

          echo "Tagged $VERSION and updated stable + $MAJOR pointers."

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            --target main

      - name: Notify consumer repos via repository_dispatch
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"

          # Read consumer repos from .github/ai/consumer_repos.json (a JSON
          # array of repo strings, e.g. ["owner/repo"]). If the file is
          # absent the step is a no-op — consumers still pick up changes via
          # their daily schedule.
          CONSUMER_FILE=".github/ai/consumer_repos.json"
          if [ ! -f "$CONSUMER_FILE" ]; then
            echo "No consumer_repos.json found — skipping repository_dispatch."
            exit 0
          fi

          REPOS=$(jq -r '.[]' "$CONSUMER_FILE" 2>/dev/null || true)
          if [ -z "$REPOS" ]; then
            echo "consumer_repos.json is empty — skipping."
            exit 0
          fi

          # Rate-limit-aware gh retry
          _rl_wait() {
            local _reset_ts _wait_secs
            _reset_ts=$(gh api -i /rate_limit 2>/dev/null | grep -i '^x-ratelimit-reset:' | head -1 | awk '{print $2}' | tr -d '\r') || true
            if [ -n "${_reset_ts}" ] && [ "${_reset_ts}" -gt 0 ] 2>/dev/null; then
              _wait_secs=$(( _reset_ts - $(date +%s) + 1 ))
              [ "${_wait_secs}" -lt 1 ] && _wait_secs=1
              [ "${_wait_secs}" -gt 600 ] && _wait_secs=600
            else
              _wait_secs=30
            fi
            echo "::warning::  Rate limit resets in ${_wait_secs}s (X-RateLimit-Reset: ${_reset_ts:-unknown})" >&2
            sleep "${_wait_secs}"
          }
          _gh_retry() {
            local attempt=1
            while [ "${attempt}" -le 5 ]; do
              if "$@" 2>/tmp/_gh_rl_err; then return 0; fi
              if grep -qiE 'rate limit|abuse detection|secondary rate|HTTP 429' /tmp/_gh_rl_err 2>/dev/null; then
                echo "::warning::Rate limit hit (attempt ${attempt}/5), waiting for reset…" >&2
                _rl_wait; attempt=$((attempt + 1))
              else
                cat /tmp/_gh_rl_err >&2 2>/dev/null; local w=$(( 2 ** (attempt - 1) ))
                echo "::warning::gh failed (attempt ${attempt}/5), retrying in ${w}s…" >&2
                sleep "${w}"; attempt=$((attempt + 1))
              fi
            done; return 1
          }
          for REPO in $REPOS; do
            echo "Dispatching coding-workflows-stable-released to ${REPO} ..."
            _gh_retry gh api "repos/${REPO}/dispatches" \
              -f event_type="coding-workflows-stable-released" \
              -f "client_payload[version]=${VERSION}" \
              || echo "::warning::Failed to dispatch to ${REPO} (may lack permissions)"
          done

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "=== DRY RUN ==="
          VERSION="${{ needs.resolve-version.outputs.version }}"
          echo "Would tag main as: ${VERSION}"
          echo "Would update pointers: stable, $(echo "${VERSION}" | cut -d. -f1)"
          echo ""
          echo "Changelog notes:"
          cat "${{ steps.changelog.outputs.notes_file }}"

  validate:
    needs: [source, resolve-version]
    runs-on: ubuntu-latest
    # 45, not 5: the CI gate below waits up to RELEASE_CI_GATE_WAIT_SECS
    # (default 30 minutes, maximum 40) for a pending `CI / lint` run; the
    # extra 5 minutes cover checkout and the tag preflight so the gate can
    # log its wait_timeout outcome. A job timeout fails closed.
    timeout-minutes: 45
    # checks/actions read let the CI gate read check-runs and workflow runs
    # with github.token; this job writes nothing.
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - name: Validate version format
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version tag '${VERSION}'. Must match vX.Y.Z"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.branch }}
          fetch-depth: 0

      - name: Validate existing version tag
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          # Query the remote directly: `git rev-parse refs/tags/<V>` only
          # checks the local tag namespace, which can race a concurrent
          # tag push (or be incomplete depending on checkout fetch
          # config). `git ls-remote --exit-code` returns 0 if the ref
          # exists on origin, 2 if it does not, and any other non-zero
          # value for transport / auth / repo errors. A matching existing
          # tag is a partial-release recovery; a tag targeting any other
          # commit remains an immutable conflict.
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>/tmp/release_version_tag_lsremote_err
          rc=$?
          set -e
          case "$rc" in
            0)
              git fetch origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
              intended_release_commit="$(git rev-parse HEAD)"
              existing_release_commit="$(git rev-parse "${VERSION}^{commit}")"
              if [ "${existing_release_commit}" != "${intended_release_commit}" ]; then
                echo "::error::Tag ${VERSION} already exists on origin at ${existing_release_commit}, not intended release commit ${intended_release_commit}. Refusing to retarget the immutable tag."
                exit 1
              fi
              echo "Tag ${VERSION} already targets ${intended_release_commit} — accepting partial-release recovery."
              ;;
            2)
              echo "Tag ${VERSION} does not yet exist on origin — OK"
              ;;
            *)
              echo "::error::git ls-remote failed with exit code ${rc} (transport/auth/repo error). Refusing to proceed without a confirmed tag-absent signal."
              cat /tmp/release_version_tag_lsremote_err >&2 2>/dev/null || true
              exit 1
              ;;
          esac

      # Security finding #6548 (Refs #7029): the legacy combined commit
      # status never contains GitHub Actions check-runs, so this check used
      # to pass on an empty or pending state. It now reuses the bounded
      # release CI gate (scripts/release_ci_gate.sh, #6797): the newest
      # github-actions `lint` check-run from ci.yml on the validated SHA must
      # be completed with success; missing, failed, cancelled, timed-out or
      # unreadable results fail closed after the bounded wait.
      - name: Verify CI passed on stable
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
          GATE_REPO: ${{ github.repository }}
          RELEASE_CI_GATE_WAIT_SECS: ${{ vars.RELEASE_CI_GATE_WAIT_SECS || '1800' }}
          RELEASE_CI_GATE_POLL_SECS: ${{ vars.RELEASE_CI_GATE_POLL_SECS || '30' }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "Checking CI / lint for ${SOURCE_BRANCH} @ ${SHA} ..."
          if [ ! -f scripts/release_ci_gate.sh ]; then
            echo "::error::scripts/release_ci_gate.sh is missing on ${SOURCE_BRANCH}@${SHA}. Refusing to release without a confirmed CI signal."
            exit 1
          fi
          bash scripts/release_ci_gate.sh "${GATE_REPO}" "${SHA}"

  release:
    needs: [source, resolve-version, validate, validate-scripts]
    runs-on: ubuntu-latest
    # 50, not 10: the CI gate below waits up to RELEASE_CI_GATE_WAIT_SECS
    # (default 30 minutes) for a pending `CI / lint` run, and the tag-push
    # retries still have to fit after it. A job timeout fails closed.
    timeout-minutes: 50
    # Least privilege: only this job gets an OIDC token and attestation write,
    # for the release-manifest attestation (#6943). A job-level block replaces
    # the inherited one, so contents: write is listed again.
    # checks: read lets the CI lint gates read check-runs with github.token;
    # actions: read lets the CI gate read workflow runs when GH_PAT is absent;
    # contents: write keeps the tag and release writes.
    # id-token/attestations write also sign the consumer sync manifest (#7128).
    permissions:
      contents: write
      id-token: write
      attestations: write
      checks: read
      actions: read
    outputs:
      # true only when both STABLE_RELEASE_ENABLED and RELEASE_TAGGING_ENABLED
      # let this run publish, so sync-to-main and the notify summary never
      # treat an untagged run as a release.
      release_enabled: ${{ steps.release_switch.outputs.enabled == 'true' && steps.release_tagging.outputs.enabled == 'true' && 'true' || 'false' }}
    env:
      STABLE_RELEASE_ENABLED: ${{ vars.STABLE_RELEASE_ENABLED || 'true' }}
      STABLE_RELEASE_CI_WAIT_SECS: ${{ vars.STABLE_RELEASE_CI_WAIT_SECS || '600' }}
    # Serialise the mutating tag pushes across every stable-tag writer
    # (test-and-mark-stable.yml, this legacy path, and everything that
    # dispatches them). The stale-tip guard in the tagging step covers the
    # ordering half: a gate whose checkout is no longer the branch tip
    # refuses to tag.
    concurrency:
      group: stable-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          # The dispatched commit, not the branch name: the branch may move
          # while the test jobs run, and only the dispatched commit was tested.
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Record the tested commit
        env:
          DISPATCHED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "${DISPATCHED_SHA}" ]; then
            echo "::error::Release checkout is $(git rev-parse HEAD), not the dispatched commit ${DISPATCHED_SHA}."
            exit 1
          fi
          echo "RELEASE_TESTED_SHA=${DISPATCHED_SHA}" >> "$GITHUB_ENV"

      # Publishing switch (issue #6532 / #6809). On by default: an unset or
      # empty repository variable STABLE_RELEASE_ENABLED, or `true` (any
      # case), publishes. `false` turns publishing off; any other value also
      # turns it off and warns, so a typo never publishes. The default was
      # off until the off switch held every release since v1.31.0 back
      # (#7029: stable tagging was never meant to sit behind an off switch).
      # While off the gate still runs every validation job and the CI lint
      # check below, but the changelog push, tags, GitHub release, consumer
      # dispatch and sync-to-main are skipped. The value reaches the script
      # only through env.
      - name: Resolve stable release switch
        id: release_switch
        run: |
          set -euo pipefail
          release_switch_value="${STABLE_RELEASE_ENABLED:-true}"
          release_switch_value="${release_switch_value,,}"
          if [ "${release_switch_value}" = "true" ]; then
            release_switch_enabled=true
          else
            release_switch_enabled=false
            if [ "${release_switch_value}" != "false" ]; then
              echo "::warning::STABLE_RELEASE_ENABLED has an unrecognised value; publishing stays off. Use true or false."
            fi
          fi
          echo "STABLE_RELEASE_SWITCH enabled=${release_switch_enabled}"
          printf 'enabled=%s\n' "${release_switch_enabled}" >> "$GITHUB_OUTPUT"

      # Issue #6532: never release a commit whose CI failed. GitHub Actions
      # jobs report as check-runs, not commit statuses, so the validate job's
      # combined-status read cannot see `lint`, the aggregate job of ci.yml.
      # Runs before the first step that can push, whatever dry_run and the
      # switch say. Only `lint` check-runs created by the github-actions app
      # in a check suite of a `.github/workflows/ci.yml` run for the SHA
      # count (other workflows also have `lint` jobs). As in
      # scripts/release_ci_gate.sh, the newest of them (highest check-run id)
      # decides, so a re-run that passed outweighs an older failed attempt;
      # it must be completed with `success`. Missing and incomplete results are
      # re-checked within a bounded wait; whatever is still missing or
      # incomplete then, and failed or unreadable results, fail closed.
      # GitHub API audit (§14): no existing call in this job returns
      # check-runs; each poll makes two reads (ci.yml runs for the SHA,
      # then the commit's `lint` check-runs).
      - name: Require successful CI lint check-run
        id: ci_lint_gate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CHECK_NAME: lint
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          gate_sha="${RELEASE_TESTED_SHA:-}"
          if ! [[ "${gate_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::STABLE_RELEASE_CI_GATE outcome=fail reason=invalid_sha sha=invalid runs=0"
            exit 1
          fi
          gate_check_name="${CI_CHECK_NAME:-lint}"
          gate_wait_secs="${STABLE_RELEASE_CI_WAIT_SECS:-600}"
          case "${gate_wait_secs}" in
            ''|*[!0-9]*)
              echo "::warning::STABLE_RELEASE_CI_WAIT_SECS is not a non-negative integer; using 600."
              gate_wait_secs=600
              ;;
          esac
          # Drop leading zeros first so a zero-padded in-range value (`002400`)
          # is not mistaken for an oversized one by the length check below.
          gate_wait_secs="${gate_wait_secs#"${gate_wait_secs%%[!0]*}"}"
          gate_wait_secs="${gate_wait_secs:-0}"
          # Same range as RELEASE_CI_GATE_WAIT_SECS (0..2400); the length check
          # runs first so a huge value never reaches shell arithmetic.
          if [ "${#gate_wait_secs}" -gt 4 ] || [ "$((10#${gate_wait_secs}))" -gt 2400 ]; then
            echo "::warning::STABLE_RELEASE_CI_WAIT_SECS is above 2400; using 600."
            gate_wait_secs=600
          fi
          # Force base 10: a leading zero (`0900`, `08`) would be read as octal.
          gate_wait_secs=$((10#${gate_wait_secs}))
          gate_poll_secs=30
          # Round up so any positive budget below one poll interval still re-checks once.
          gate_polls_left=$(((gate_wait_secs + gate_poll_secs - 1) / gate_poll_secs))
          gate_response_file="$(mktemp "${RUNNER_TEMP:-/tmp}/stable_release_ci_gate.XXXXXX")"
          gate_runs_file="$(mktemp "${RUNNER_TEMP:-/tmp}/stable_release_ci_gate_runs.XXXXXX")"
          trap 'rm -f "${gate_response_file}" "${gate_runs_file}"' EXIT

          # Prints "<reason> <runs>" where reason is one of
          # pass|missing|incomplete|failed|unreadable.
          stable_release_ci_gate_classify() {
            local gate_rc=0
            local gate_verdict=""
            set +e
            gh_retry gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${gate_sha}&per_page=100" >"${gate_runs_file}"
            gate_rc=$?
            if [ "${gate_rc}" -eq 0 ]; then
              gh_retry gh api "repos/${GITHUB_REPOSITORY}/commits/${gate_sha}/check-runs?check_name=${gate_check_name}&filter=latest&per_page=100" >"${gate_response_file}"
              gate_rc=$?
            fi
            set -e
            if [ "${gate_rc}" -ne 0 ]; then
              printf 'unreadable 0\n'
              return 0
            fi
            if ! gate_verdict="$(jq -rn --arg name "${gate_check_name}" --arg sha "${gate_sha}" \
                --slurpfile checks "${gate_response_file}" --slurpfile ci_runs "${gate_runs_file}" '
                if ($checks | length) != 1 or ($ci_runs | length) != 1 then "unreadable 0"
                else $ci_runs[0] as $wr
                  | $checks[0]
                  | if (type != "object") or ((.check_runs | type) != "array") or ((.total_count | type) != "number") then "unreadable 0"
                    elif ($wr | type) != "object" or (($wr.workflow_runs | type) != "array") or (($wr.total_count | type) != "number") then "unreadable 0"
                    elif .total_count > (.check_runs | length) or $wr.total_count > ($wr.workflow_runs | length) then "unreadable \(.check_runs | length)"
                    else
                      [$wr.workflow_runs[] | select(type == "object" and .head_sha == $sha) | .check_suite_id | select(type == "number")] as $suites
                      | [.check_runs[] | select(type == "object" and .name == $name and (.app.slug? // "") == "github-actions"
                          and ((.check_suite.id? // null) as $sid | ($sid | type) == "number" and any($suites[]; . == $sid))
                          and ((.id? // null) | type) == "number")] as $runs
                      | if ($runs | length) == 0 then "missing 0"
                        else ($runs | max_by(.id)) as $newest
                          | if $newest.status != "completed" then "incomplete \($runs | length)"
                            elif $newest.conclusion != "success" then "failed \($runs | length)"
                            else "pass \($runs | length)"
                            end
                        end
                    end
                end' 2>/dev/null)"; then
              printf 'unreadable 0\n'
              return 0
            fi
            case "${gate_verdict}" in
              *$'\n'*) printf 'unreadable 0\n' ;;
              "pass "*|"missing "*|"incomplete "*|"failed "*|"unreadable "*) printf '%s\n' "${gate_verdict}" ;;
              *) printf 'unreadable 0\n' ;;
            esac
          }

          while :; do
            gate_result="$(stable_release_ci_gate_classify)"
            gate_reason="${gate_result%% *}"
            gate_runs="${gate_result##* }"
            if [ "${gate_reason}" = "pass" ]; then
              echo "STABLE_RELEASE_CI_GATE outcome=pass sha=${gate_sha} runs=${gate_runs}"
              exit 0
            fi
            if { [ "${gate_reason}" = "incomplete" ] || [ "${gate_reason}" = "missing" ]; } && [ "${gate_polls_left}" -gt 0 ]; then
              gate_polls_left=$((gate_polls_left - 1))
              echo "STABLE_RELEASE_CI_GATE outcome=wait reason=${gate_reason} sha=${gate_sha} runs=${gate_runs} polls_left=${gate_polls_left}"
              sleep "${gate_poll_secs}"
              continue
            fi
            echo "::error::STABLE_RELEASE_CI_GATE outcome=fail reason=${gate_reason} sha=${gate_sha} runs=${gate_runs}"
            exit 1
          done

      # Security finding release-gate-ignores-actions-ci (#6797, Refs #6532):
      # the jobs above run this workflow's own tests, and the combined commit
      # status never contains GitHub Actions check-runs, so a commit whose
      # `CI / lint` aggregate was red, cancelled or never ran could be tagged.
      # Require the github-actions `lint` check-run from ci.yml on the exact
      # tested commit to be completed with success. Pending or missing runs
      # are waited for (bounded); anything else fails closed. It runs before
      # the changelog push and every tag write, and in dry runs too (read only).
      # The tag may point at this commit plus a changelog-only commit; the
      # RELEASE_UNTESTED_HEAD and RELEASE_STALE_TIP guards below bind it.
      - name: Require CI / lint success on the tested commit
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GATE_REPO: ${{ github.repository }}
          RELEASE_CI_GATE_WAIT_SECS: ${{ vars.RELEASE_CI_GATE_WAIT_SECS || '1800' }}
          RELEASE_CI_GATE_POLL_SECS: ${{ vars.RELEASE_CI_GATE_POLL_SECS || '30' }}
        run: |
          set -euo pipefail
          bash scripts/release_ci_gate.sh "${GATE_REPO}" "${RELEASE_TESTED_SHA}"

      # Kill switch for stable tag writes (Refs #6548, #7029). Default on:
      # any value other than `true` (case-insensitive) skips the changelog
      # commit, the tag pushes, the GitHub Release and the consumer dispatch.
      # The CI gate above and the validate job still run.
      - name: Resolve release tagging switch
        id: release_tagging
        env:
          RELEASE_TAGGING_ENABLED: ${{ vars.RELEASE_TAGGING_ENABLED || 'true' }}
        run: |
          set -euo pipefail
          raw="${RELEASE_TAGGING_ENABLED-true}"
          value="$(printf '%s' "${raw}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ -z "${value}" ] || [ "${value}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release tagging enabled."
            exit 0
          fi
          shown="$(printf '%s' "${raw}" | tr -cd 'A-Za-z0-9_.-' | cut -c1-32)"
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::warning::RELEASE_TAGGING_ENABLED=${shown} — skipping tag writes, GitHub Release and consumer dispatch; CI gate and validation still ran."
          echo "Release tagging disabled (RELEASE_TAGGING_ENABLED=${shown}): no changelog commit, tag push, GitHub Release or consumer dispatch." >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true

      - name: Assemble changelog fragments
        id: changelog_assemble
        env:
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
          # The switch off behaves like a dry run here: assembled locally, never pushed.
          DRY_RUN: ${{ (inputs.dry_run || steps.release_switch.outputs.enabled != 'true') && 'true' || 'false' }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          RELEASE_TAGGING: ${{ steps.release_tagging.outputs.enabled }}
        run: |
          set -euo pipefail

          # Upstream assembly host (CLAUDE.md §20, §18.A/§18.B). Agents write
          # one changelog.d/<issue-or-pr>-<slug>.md fragment per PR instead of
          # editing CHANGELOG.md, so concurrent PRs never touch the same path
          # and cannot conflict. This step folds the accumulated fragments into
          # CHANGELOG.md's ## [Unreleased] section and deletes them, before the
          # release notes are extracted and the version tag is cut, so the tag
          # carries the assembled changelog.
          #
          # Fails open: if the assembled commit cannot be pushed (branch
          # protection, a concurrent push that survives the retry loop), the
          # working tree is reset to the remote tip so the tag below still
          # points at pushed history, and the fragments simply wait for the
          # next release. A release must never fail because of changelog
          # bookkeeping.

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/assemble_changelog.py assemble --repo-root .
          # agents.d/ fragments (CLAUDE.md §30) fold into agents.md in the same
          # commit. Fail open: a fragment that cannot fold stays in agents.d/
          # for the next release, and a missing script (an older ref) is a no-op.
          if [ -f scripts/assemble_agents.py ]; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/assemble_agents.py assemble --repo-root . \
              || echo "::warning::agents.md fragment assembly failed; fragments stay in agents.d/ for the next release."
          fi

          if [ -z "$(git status --porcelain -- CHANGELOG.md changelog.d agents.md agents.d)" ]; then
            echo "No changelog fragments to fold — nothing to commit."
            exit 0
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run — assembled CHANGELOG.md left uncommitted."
            exit 0
          fi

          # Kill switch: anything but an explicit `true` (including a missing
          # output) leaves the stable branch untouched.
          if [ "${RELEASE_TAGGING:-}" != "true" ]; then
            echo "Release tagging disabled — assembled CHANGELOG.md left uncommitted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- CHANGELOG.md changelog.d agents.md agents.d
          git commit -m "chore: assemble changelog fragments for ${VERSION}"

          pushed="false"
          delay=2
          for attempt in 1 2 3 4; do
            # refs/heads/ on the push and on the tip lookup below: `stable` is
            # also a tag, so a bare `HEAD:stable` is rejected with "dst refspec
            # stable matches more than one" and `git fetch origin stable`
            # resolves to the tag, leaving origin/stable stale.
            if git push origin "HEAD:refs/heads/${SOURCE_BRANCH}"; then
              pushed="true"
              break
            fi
            echo "::warning::Push of assembled changelog failed (attempt ${attempt}); retrying in ${delay}s."
            sleep "${delay}"
            delay=$((delay * 2))
            # Never rebase onto a moved branch: only the tested commit may be
            # released. A remote tip other than RELEASE_TESTED_SHA means the
            # branch moved under this run, so fail closed instead of
            # re-baselining onto untested history.
            _remote_tip="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" 2>/dev/null | awk '{print $1}' || true)"
            if [ -n "${_remote_tip}" ] && [ "${_remote_tip}" != "${RELEASE_TESTED_SHA}" ]; then
              echo "::error::RELEASE_STALE_TIP branch=${SOURCE_BRANCH} tested=${RELEASE_TESTED_SHA} tip=${_remote_tip}: the branch moved after this gate started; not releasing a stale checkout."
              exit 1
            fi
          done

          if [ "${pushed}" != "true" ]; then
            echo "::warning::Could not push the assembled changelog to ${SOURCE_BRANCH}; releasing without it. Fragments remain in changelog.d/ for the next release."
            git reset --hard "${RELEASE_TESTED_SHA}"
          fi

      - name: Extract changelog for this version
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          # Pull the section between this version header and the next
          NOTES=$(awk \
            "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" \
            CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="No changelog entry found for ${VERSION}."
          fi
          # Write to file to avoid quoting issues
          echo "$NOTES" > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      # Signed consumer sync manifest (#7128). Built on the final release
      # commit (HEAD: the tested commit plus any changelog/agents fold), on
      # dry runs too so the builder is exercised. Consumers verify its
      # attestation and hashes before running any fetched upstream code.
      - name: Build sync manifest
        id: sync_manifest
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          SYNC_MANIFEST_PATH="${RUNNER_TEMP}/sync-manifest.json"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/build_sync_manifest.py build \
            --repo-root . \
            --commit "$(git rev-parse HEAD)" \
            --version "${VERSION}" \
            --out "${SYNC_MANIFEST_PATH}"
          echo "path=${SYNC_MANIFEST_PATH}" >> "$GITHUB_OUTPUT"

      # A failed attestation fails the job here, before any tag is pushed.
      - name: Attest sync manifest
        if: ${{ !inputs.dry_run && steps.release_switch.outputs.enabled == 'true' && steps.release_tagging.outputs.enabled == 'true' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.sync_manifest.outputs.path }}

      - name: Tag version and update stable pointer
        if: ${{ !inputs.dry_run && steps.release_switch.outputs.enabled == 'true' && steps.release_tagging.outputs.enabled == 'true' }}
        env:
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION="${{ needs.resolve-version.outputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          VERSION_TAG_ALREADY_PUBLISHED=false

          publish_tag_with_remote_verification() {
            local tag_ref="$1"
            local publication_mode="$2"
            local expected_object_id=""
            local remote_lookup_error=""
            local remote_lookup_error_file=""
            local remote_lookup_output=""
            local remote_object_id=""
            local attempt=1
            local max_attempts=5
            local backoff_seconds=2
            local lookup_rc=0
            local push_error_file=""
            local push_rc=0

            case "${publication_mode}" in
              immutable|moving) ;;
              *)
                echo "::error::Unsupported tag publication mode '${publication_mode}' for ${tag_ref}."
                return 1
                ;;
            esac

            if ! expected_object_id="$(git rev-parse "${tag_ref}" 2>/dev/null)"; then
              echo "::error::Could not resolve ${tag_ref} to a local Git object."
              return 1
            fi
            if [[ ! "${expected_object_id}" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
              echo "::error::Could not resolve ${tag_ref} to a valid local Git object ID."
              return 1
            fi

            while [ "${attempt}" -le "${max_attempts}" ]; do
              echo "Publishing ${tag_ref} (attempt ${attempt}/${max_attempts})..."
              push_error_file="$(mktemp "${RUNNER_TEMP:-/tmp}/release_tag_push_err.XXXXXX")"
              set +e
              if [ "${publication_mode}" = "immutable" ]; then
                git push origin "${tag_ref}" 2>"${push_error_file}"
              else
                git push -f origin "${tag_ref}" 2>"${push_error_file}"
              fi
              push_rc=$?
              set -e
              cat "${push_error_file}" >&2 || true
              if [ "${push_rc}" -eq 0 ]; then
                rm -f "${push_error_file}"
                return 0
              fi
              # A missing workflow scope never clears on retry (run 35639756385): stop now.
              if { grep -qi 'refusing to allow' "${push_error_file}" && grep -qi 'workflow' "${push_error_file}"; } \
                || grep -qiE 'workflows[^[:alnum:]]{0,2}permission' "${push_error_file}"; then
                rm -f "${push_error_file}"
                echo "::error::RELEASE_TAG_PUBLISH outcome=failed error_class=workflow_scope tag_ref=${tag_ref}: GitHub refused the push because the release credential cannot update workflow files. Give GH_PAT the \`workflow\` scope (classic PAT) or \`workflows: write\` (fine-grained PAT / GitHub App), then re-run the release."
                return 1
              fi
              rm -f "${push_error_file}"

              remote_lookup_error_file="$(mktemp "${RUNNER_TEMP:-/tmp}/release_tag_lsremote_err.XXXXXX")"
              set +e
              remote_lookup_output="$(git ls-remote --exit-code origin "${tag_ref}" 2>"${remote_lookup_error_file}")"
              lookup_rc=$?
              set -e
              remote_lookup_error="$(<"${remote_lookup_error_file}")"
              rm -f "${remote_lookup_error_file}"
              remote_object_id=""
              if [ "${lookup_rc}" -eq 0 ]; then
                remote_object_id="$(printf '%s\n' "${remote_lookup_output}" | awk -v expected_ref="${tag_ref}" '$2 == expected_ref { print $1 }')"
                if [[ "${remote_object_id}" =~ ^[0-9a-fA-F]{40,64}$ ]] && [ "${remote_object_id}" = "${expected_object_id}" ]; then
                  echo "Remote ${tag_ref} already matches the local tag object; treating the failed push as accepted."
                  return 0
                fi
                if [ "${publication_mode}" = "immutable" ] && [[ "${remote_object_id}" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
                  echo "::error::Immutable ${tag_ref} exists remotely at a different object ID; refusing to overwrite it."
                  return 1
                fi
              fi

              if [ "${attempt}" -eq "${max_attempts}" ]; then
                echo "::error::Failed to publish and verify ${tag_ref} after ${max_attempts} attempts."
                if [ "${lookup_rc}" -ne 0 ] && [ -n "${remote_lookup_error}" ]; then
                  printf '%s\n' "${remote_lookup_error}" >&2
                fi
                return 1
              fi

              echo "::warning::Push result for ${tag_ref} was not confirmed; retrying in ${backoff_seconds}s."
              sleep "${backoff_seconds}"
              backoff_seconds=$((backoff_seconds * 2))
              attempt=$((attempt + 1))
            done
          }

          # Re-check after changelog assembly because that step may have moved
          # HEAD. Only a tag peeled to this final release commit is recoverable.
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>/tmp/release_version_tag_lsremote_err
          version_tag_lookup_rc=$?
          set -e
          case "${version_tag_lookup_rc}" in
            0)
              git fetch origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
              intended_release_commit="$(git rev-parse HEAD)"
              existing_release_commit="$(git rev-parse "${VERSION}^{commit}")"
              if [ "${existing_release_commit}" != "${intended_release_commit}" ]; then
                echo "::error::Tag ${VERSION} already exists on origin at ${existing_release_commit}, not final release commit ${intended_release_commit}. Refusing to retarget the immutable tag."
                exit 1
              fi
              VERSION_TAG_ALREADY_PUBLISHED=true
              echo "Tag ${VERSION} already targets ${intended_release_commit} — retaining it for partial-release recovery."
              ;;
            2) ;;
            *)
              echo "::error::git ls-remote failed with exit code ${version_tag_lookup_rc}; refusing to publish without authoritative immutable-tag state."
              cat /tmp/release_version_tag_lsremote_err >&2 2>/dev/null || true
              exit 1
              ;;
          esac
          # Stale-tip guard. RELEASE_TESTED_SHA is the commit this run was
          # dispatched on and the gate tested. HEAD may be that commit or
          # that commit plus the changelog-assembly commit, nothing else, and
          # the branch tip must still be HEAD: a gate dispatched on an older
          # tip that finishes after the branch moved (a promotion
          # fast-forwarded `stable`, or a patch landed) would otherwise move
          # the `stable` tag onto history the newer gate has superseded.
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${RELEASE_TESTED_SHA}" ]; then
            if [ "$(git rev-parse HEAD^)" != "${RELEASE_TESTED_SHA}" ] \
              || [ -n "$(git diff --name-only HEAD^ HEAD | grep -vE '^(CHANGELOG\.md$|changelog\.d/|agents\.md$|agents\.d/)' || true)" ]; then
              echo "::error::RELEASE_UNTESTED_HEAD tested=${RELEASE_TESTED_SHA} head=${HEAD_SHA}: HEAD is not the tested commit plus its changelog/agents.md assembly; refusing to tag."
              exit 1
            fi
          fi
          BRANCH_TIP="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')"
          if [ -z "${BRANCH_TIP}" ]; then
            echo "::error::Could not read the tip of ${SOURCE_BRANCH} from origin; refusing to tag without confirming the checkout is current."
            exit 1
          fi
          if [ "${BRANCH_TIP}" != "${HEAD_SHA}" ]; then
            echo "::error::RELEASE_STALE_TIP branch=${SOURCE_BRANCH} tested=${RELEASE_TESTED_SHA} tip=${BRANCH_TIP}: the branch moved after this gate started; not tagging a stale checkout. The gate on the new tip owns the release."
            exit 1
          fi

          # Immutable version tag (refs/tags/ prefix for consistency with the moving-tag pushes below)
          if [ "${VERSION_TAG_ALREADY_PUBLISHED}" != "true" ]; then
            git tag -a "$VERSION" -m "Release $VERSION"
            publish_tag_with_remote_verification "refs/tags/$VERSION" immutable
          fi

          # Moving stable pointer (use refs/tags/ to disambiguate from refs/heads/stable)
          git tag -f stable "$VERSION"
          publish_tag_with_remote_verification refs/tags/stable moving

          # Moving major-version pointer (e.g. v1)
          git tag -f "$MAJOR" "$VERSION"
          publish_tag_with_remote_verification "refs/tags/$MAJOR" moving

          echo "Tagged $VERSION and updated stable + $MAJOR pointers."

      # Release manifest (safeguarded consumer updater, phase 1, #6943):
      # build it from the tagged tree, attest it, and upload it as a release
      # asset before consumers are notified. Any failure stops the job before
      # consumer dispatch; dry runs skip all three steps. Logic lives in
      # scripts/release_manifest_publish.sh (log prefix RELEASE_MANIFEST).
      - name: Build release manifest
        id: release_manifest
        if: ${{ !inputs.dry_run && steps.release_switch.outputs.enabled == 'true' && steps.release_tagging.outputs.enabled == 'true' }}
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-manifest
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse "${RELEASE_VERSION}^{commit}")"
          RELEASE_SHA="${RELEASE_SHA,,}"
          bash scripts/release_manifest_publish.sh build \
            --tag "${RELEASE_VERSION}" \
            --release-sha "${RELEASE_SHA}" \
            --output-dir "${RELEASE_MANIFEST_DIR}"

      - name: Attest release manifest
        if: ${{ !inputs.dry_run && steps.release_switch.outputs.enabled == 'true' && steps.release_tagging.outputs.enabled == 'true' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.release_manifest.outputs.manifest_path }}

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run && steps.release_switch.outputs.enabled == 'true' && steps.release_tagging.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          VERSION="${{ needs.resolve-version.outputs.version }}"
          RELEASE_LOOKUP_ERROR_FILE="/tmp/release_lookup_err"
          RELEASE_CREATE_ERROR_FILE="/tmp/release_create_err"

          # Audited the adjacent consumer-dispatch API calls: they publish an
          # event but return no release-by-tag state, so this lookup cannot be
          # merged with or served by existing workflow data.
          set +e
          EXISTING_RELEASE_TAG="$(gh_retry gh api "repos/${{ github.repository }}/releases/tags/${VERSION}" --jq 'if (.draft == false and .prerelease == false) then .tag_name else error("release-is-draft-or-prerelease") end' 2>"${RELEASE_LOOKUP_ERROR_FILE}")"
          RELEASE_LOOKUP_RC=$?
          set -e

          if [ "${RELEASE_LOOKUP_RC}" -eq 0 ]; then
            if [ "${EXISTING_RELEASE_TAG}" != "${VERSION}" ]; then
              echo "::error::Release lookup for ${VERSION} returned unexpected tag '${EXISTING_RELEASE_TAG}'."
              exit 1
            fi
            echo "GitHub Release ${VERSION} already exists — accepting partial-release recovery."
            exit 0
          fi

          if ! grep -Fq "HTTP 404" "${RELEASE_LOOKUP_ERROR_FILE}"; then
            echo "::error::Failed to determine whether GitHub Release ${VERSION} exists."
            cat "${RELEASE_LOOKUP_ERROR_FILE}" >&2 2>/dev/null || true
            exit "${RELEASE_LOOKUP_RC}"
          fi

          set +e
          gh_retry gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            --target "${SOURCE_BRANCH}" 2>"${RELEASE_CREATE_ERROR_FILE}"
          RELEASE_CREATE_RC=$?
          set -e
          if [ "${RELEASE_CREATE_RC}" -eq 0 ]; then
            exit 0
          fi

          # A concurrent recovery run may have created the release after the
          # confirmed 404. Accept that race only after an exact-tag recheck.
          set +e
          EXISTING_RELEASE_TAG="$(gh_retry gh api "repos/${{ github.repository }}/releases/tags/${VERSION}" --jq 'if (.draft == false and .prerelease == false) then .tag_name else error("release-is-draft-or-prerelease") end' 2>"${RELEASE_LOOKUP_ERROR_FILE}")"
          RELEASE_RECHECK_RC=$?
          set -e
          if [ "${RELEASE_RECHECK_RC}" -eq 0 ] && [ "${EXISTING_RELEASE_TAG}" = "${VERSION}" ]; then
            echo "GitHub Release ${VERSION} appeared concurrently — accepting it as complete."
            exit 0
          fi

          cat "${RELEASE_CREATE_ERROR_FILE}" >&2 2>/dev/null || true
          cat "${RELEASE_LOOKUP_ERROR_FILE}" >&2 2>/dev/null || true
          exit "${RELEASE_CREATE_RC}"

      # Separate from "Create GitHub Release", which exits early on
      # partial-release recovery. A rerun rebuilds a byte-identical manifest
      # for the same commit and --clobber replaces the asset.
      - name: Upload sync manifest
        if: ${{ !inputs.dry_run && steps.release_switch.outputs.enabled == 'true' && steps.release_tagging.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          SYNC_MANIFEST_PATH: ${{ steps.sync_manifest.outputs.path }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          if ! gh_retry gh release upload "${VERSION}" "${SYNC_MANIFEST_PATH}" --clobber; then
            echo "::error::SYNC_MANIFEST outcome=upload_failed version=${VERSION}"
            exit 1
          fi
          echo "SYNC_MANIFEST outcome=uploaded version=${VERSION}"

      - name: Upload release manifest asset
        if: ${{ !inputs.dry_run && steps.release_switch.outputs.enabled == 'true' && steps.release_tagging.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
          RELEASE_MANIFEST_PATH: ${{ steps.release_manifest.outputs.manifest_path }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/release_manifest_publish.sh upload \
            --tag "${RELEASE_VERSION}" \
            --manifest "${RELEASE_MANIFEST_PATH}" \
            --repo "${RELEASE_REPOSITORY}"

      - name: Notify consumer repos via repository_dispatch
        if: ${{ !inputs.dry_run && steps.release_switch.outputs.enabled == 'true' && steps.release_tagging.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          VERSION="${{ needs.resolve-version.outputs.version }}"
          RELEASE_SHA="$(git rev-parse "${VERSION}^{commit}")"
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not peel ${VERSION} to a 40-character release commit SHA."
            exit 1
          fi
          RELEASE_SHA="${RELEASE_SHA,,}"

          # Read consumer repos from .github/ai/consumer_repos.json (a JSON
          # array of repo strings, e.g. ["owner/repo"]). If the file is
          # absent the step is a no-op — consumers still pick up changes via
          # their daily schedule.
          CONSUMER_FILE=".github/ai/consumer_repos.json"
          if [ ! -f "$CONSUMER_FILE" ]; then
            echo "No consumer_repos.json found — skipping repository_dispatch."
            exit 0
          fi

          # The registry must be a JSON array; `.[]` on an object would dispatch to its values.
          if ! jq -e 'type == "array"' "$CONSUMER_FILE" >/dev/null 2>&1; then
            echo "::warning::${CONSUMER_FILE} is not a JSON array of owner/repo strings — skipping repository_dispatch."
            exit 0
          fi

          REPOS=$(jq -r '.[] | tostring | explode | map(if . < 32 or . == 127 then 32 else . end) | implode' "$CONSUMER_FILE" 2>/dev/null || true)
          if [ -z "$REPOS" ]; then
            echo "consumer_repos.json is empty — skipping."
            exit 0
          fi

          # Control characters (CR, LF, NUL, ...) become spaces inside jq, before bash
          # command substitution could silently drop a NUL and let the entry pass.
          # One entry per line; each must be a plain owner/repo before it reaches a
          # URL path, so a malformed entry can never split or glob into extra targets.
          # The rejected value is never printed, only its position in the list.
          REPO_INDEX=0
          while IFS= read -r REPO; do
            REPO_INDEX=$((REPO_INDEX + 1))
            [ -z "${REPO}" ] && continue
            if [[ ! "${REPO}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] \
              || [[ "${REPO}" =~ (^|/)\.{1,2}(/|$) ]]; then
              echo "::warning::Skipping malformed consumer registry entry #${REPO_INDEX} in ${CONSUMER_FILE} (expected owner/repo)."
              continue
            fi
            echo "Dispatching coding-workflows-stable-released to ${REPO} ..."
            # A duplicate event is harmless: the consumer updater renders current
            # stable regardless of the payload, so a retried POST is safe.
            GH_RETRY_IDEMPOTENT=true gh_retry gh api "repos/${REPO}/dispatches" \
              -f event_type="coding-workflows-stable-released" \
              -f "client_payload[version]=${VERSION}" \
              -f "client_payload[sha]=${RELEASE_SHA}" \
              </dev/null \
              || echo "::warning::Failed to dispatch to ${REPO} (may lack permissions)"
          done <<< "${REPOS}"

      - name: Release disabled summary
        if: ${{ !inputs.dry_run && steps.release_switch.outputs.enabled != 'true' }}
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          echo "::notice::STABLE_RELEASE_DISABLED version=${RELEASE_VERSION} sha=${RELEASE_TESTED_SHA}: validation and the CI lint gate passed; changelog push, tags, GitHub release, consumer dispatch and sync-to-main skipped"
          printf 'Stable release %s passed the gate but was not published: STABLE_RELEASE_ENABLED is off.\n' "${RELEASE_VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        env:
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
        run: |
          echo "=== DRY RUN ==="
          VERSION="${{ needs.resolve-version.outputs.version }}"
          echo "Would tag ${SOURCE_BRANCH} as: ${VERSION}"
          echo "Would update pointers: stable, $(echo "${VERSION}" | cut -d. -f1)"
          echo ""
          echo "Changelog notes:"
          cat "${{ steps.changelog.outputs.notes_file }}"

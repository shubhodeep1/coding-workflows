---
name: Apply analysis on main

# Unattended counterpart of the interactive `/apply-analysis` command.
#
# On every push to the default branch, hand ONE pending analysis doc
# (analysis/workflow-optimization-*.md, oldest first) to the orchestrator
# and label the resulting tracking issue `ai:comprehensive-test-pending`.
# When that project completes cleanly, the orchestrator poller's release
# callback dispatches promote-main-to-stable.yml, so a clean end-to-end
# orchestrator run on the current `main` is what promotes it to `stable`.
#
# Holds (exit 0, nothing dispatched) when there is no analysis doc, when a
# labelled project is still in flight, or when every remaining doc was
# dispatched before. Limiting each run to a single doc leaves docs for the
# next push to `main` to execute. See scripts/apply_analysis_on_main.sh for
# the decision order and the loop guard.

"on":
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: apply-analysis-on-main-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Dispatch one pending analysis doc to the orchestrator
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          APPLY_ANALYSIS_ON_MAIN_ENABLED: ${{ vars.APPLY_ANALYSIS_ON_MAIN_ENABLED || 'true' }}
          APPLY_ANALYSIS_TRACKING_WAIT_SECS: ${{ vars.APPLY_ANALYSIS_TRACKING_WAIT_SECS || '1800' }}
        run: |
          set -euo pipefail
          bash scripts/apply_analysis_on_main.sh

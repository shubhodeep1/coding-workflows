name: Workflow Log Analysis

on:
  workflow_dispatch:
    inputs:
      since:
        description: Optional ISO-8601 timestamp to collect runs since (e.g. 2026-04-01T00:00:00Z)
        required: false
        default: ""
        type: string
      lookback_days:
        description: Days of workflow runs to analyze
        required: false
        default: "7"
        type: string
      since_last_report:
        description: Start the window where the newest report's window ended (read from its first-line marker), clamped to 7 days; falls back to lookback_days when no usable marker exists. An explicit since wins.
        required: false
        default: "false"
        type: string
      codex_mode:
        description: Deprecated no-op input retained for backward compatibility; the workflow always runs the Codex-first analysis path.
        required: false
        default: true
        type: boolean
      repos_override:
        description: Optional comma-separated repositories (owner/repo)
        required: false
        default: ""
        type: string
      tracking_issue:
        description: Optional tracking issue number for failure marker and label handling
        required: false
        default: "0"
        type: string
      alert_msg_level:
        description: Override the Telegram alert threshold for this run. Set to SILENT when dispatched from the test-and-mark-stable smoke gate to avoid drowning the gate's combined notification in per-job alerts.
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 9 * * 1"
    - cron: "0 6 * * *"

env:
  # Claude capacity wait (issue #7370): a capacity fallback waits for the
  # hourly capacity-resume pass instead of running codex/OpenCode. Off for the
  # `core` install profile, which has no orchestrate-poll wrapper to resume
  # waiting work; repo variable CLAUDE_POOL_CAPACITY_WAIT_ENABLED=false rolls back.
  CLAUDE_POOL_CAPACITY_WAIT_ENABLED: ${{ vars.CLAUDE_POOL_CAPACITY_WAIT_ENABLED || (vars.WORKFLOW_PROFILE == 'core' && 'false') || 'true' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UNATTENDED_PHASE: workflow_log_analysis
  EVENTS_JSONL_ENABLED: ${{ vars.EVENTS_JSONL_ENABLED || 'false' }}
  ALERT_MSG_LEVEL: ${{ (github.event.inputs.alert_msg_level || '') != '' && github.event.inputs.alert_msg_level || vars.ALERT_MSG_LEVEL || 'WARNING' }}
  SEMBLE_ENABLED: ${{ vars.SEMBLE_ENABLED || 'true' }}
  WORKFLOW_LOG_SCENARIO_TRACE_ENABLED: ${{ vars.WORKFLOW_LOG_SCENARIO_TRACE_ENABLED || 'false' }}
  WORKFLOW_RETRO_ENABLED: ${{ vars.WORKFLOW_RETRO_ENABLED || 'true' }}
  WORKFLOW_RETRO_MODEL: ${{ vars.WORKFLOW_RETRO_MODEL || 'openai/gpt-6-luna' }}
  WORKFLOW_RETRO_REASONING: ${{ vars.WORKFLOW_RETRO_REASONING || 'medium' }}
  # Skip the LLM retro pass and the tracker comment on weeks with zero
  # workflow runs and zero merged PRs (log-only skip via WORKFLOW_RETRO_SKIP_V1).
  WORKFLOW_RETRO_SKIP_IF_NO_ACTIVITY: ${{ vars.WORKFLOW_RETRO_SKIP_IF_NO_ACTIVITY || 'true' }}
  # GitHub does not interpolate vars into `on.schedule`, so this default must
  # stay aligned with the literal cron above. The job gate uses it to fail
  # closed if a future schedule is added without updating the retro path.
  WORKFLOW_RETRO_CRON: ${{ vars.WORKFLOW_RETRO_CRON || '0 9 * * 1' }}

permissions:
  contents: write
  actions: read
  issues: write
  # Claude engine: the job's OIDC token for claude-pool-broker (plan Phase 4).
  id-token: write

concurrency:
  group: workflow-log-analysis-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  collect-logs:
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 6 * * *' || ((vars.WORKFLOW_RETRO_ENABLED || 'true') == 'true' && github.event.schedule == (vars.WORKFLOW_RETRO_CRON || '0 9 * * 1')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    # Collection window (plan P4): the analyze step writes these into the
    # report's first-line marker, which a later since_last_report run reads.
    outputs:
      window_start: ${{ steps.collect.outputs.window_start }}
      window_end: ${{ steps.collect.outputs.window_end }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve repositories
        id: resolve_repos
        env:
          OVERRIDE_INPUT: ${{ github.event.inputs.repos_override || '' }}
          PAT_BUDGET_DAILY: ${{ github.event_name == 'schedule' && github.event.schedule == '0 6 * * *' }}
        run: |
          set -euo pipefail

          REPO_REGISTRY_PATH=".github/ai/consumer_repos.json"

          declare -a repos=()

          if [ "${PAT_BUDGET_DAILY}" = "true" ]; then
            repos+=("${GITHUB_REPOSITORY}")
          elif [ -n "${OVERRIDE_INPUT//[[:space:]]/}" ]; then
            IFS=',' read -r -a override_repos <<< "${OVERRIDE_INPUT}"
            for raw_repo in "${override_repos[@]}"; do
              repo="$(printf '%s' "${raw_repo}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -n "${repo}" ] || continue
              if [[ ! "${repo}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
                echo "::error::Invalid repository format in repos_override: ${repo}"
                exit 1
              fi
              repos+=("${repo}")
            done
          else
            if [ -f "${REPO_REGISTRY_PATH}" ]; then
              if ! jq -e 'type == "array"' "${REPO_REGISTRY_PATH}" >/dev/null 2>&1; then
                echo "::error::${REPO_REGISTRY_PATH} must be valid JSON containing an array of repositories."
                exit 1
              fi

              mapfile -t configured_repos < <(jq -r '.[]' "${REPO_REGISTRY_PATH}")
              for raw_repo in "${configured_repos[@]}"; do
                repo="$(printf '%s' "${raw_repo}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
                [ -n "${repo}" ] || continue
                repos+=("${repo}")
              done
            else
              echo "::warning::${REPO_REGISTRY_PATH} not found; defaulting to current repository only."
            fi

            repos+=("${GITHUB_REPOSITORY}")
          fi

          declare -A seen=()
          declare -a deduped=()
          for repo in "${repos[@]}"; do
            [ -n "${repo}" ] || continue
            if [ -z "${seen[${repo}]+x}" ]; then
              seen["${repo}"]=1
              deduped+=("${repo}")
            fi
          done

          if [ "${#deduped[@]}" -eq 0 ]; then
            echo "::error::No repositories resolved."
            exit 1
          fi

          printf '%s\n' "${deduped[@]}" > /tmp/workflow-analysis-repos.txt
          echo "repo_count=${#deduped[@]}" >> "$GITHUB_OUTPUT"

          echo "Resolved repositories:"
          printf ' - %s\n' "${deduped[@]}"

      - name: Collect workflow logs
        id: collect
        env:
          GH_TOKEN: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') && github.token || secrets.GH_PAT || github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
          SINCE_INPUT: ${{ github.event.inputs.since || '' }}
          LOOKBACK_DAYS_INPUT: ${{ github.event.inputs.lookback_days || '7' }}
          SINCE_LAST_REPORT_INPUT: ${{ github.event.inputs.since_last_report || 'false' }}
          PAT_BUDGET_DAILY: ${{ github.event_name == 'schedule' && github.event.schedule == '0 6 * * *' }}
          AI_MEMORY_ENABLED: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') && 'false' || vars.AI_MEMORY_ENABLED || 'true' }}
        run: |
          set -euo pipefail

          # Window end (plan P4): this step's start time, taken before
          # collection and written at once so the output exists even when
          # the collector fails. A later since_last_report run starts here.
          wla_window_end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "window_end=${wla_window_end}" >> "$GITHUB_OUTPUT"
          wla_window_start="unknown"

          mapfile -t REPOS < /tmp/workflow-analysis-repos.txt

          LOG_OUTPUT_DIR="${RUNNER_TEMP:-/tmp}/workflow-log-output"
          rm -rf "${LOG_OUTPUT_DIR}"
          mkdir -p "${LOG_OUTPUT_DIR}"
          echo "log_output_dir=${LOG_OUTPUT_DIR}" >> "$GITHUB_OUTPUT"

          COLLECT_ARGS=(
            --output workflow_log_report.json
            --log-output-dir "${LOG_OUTPUT_DIR}"
          )

          # since_last_report (plan P4): start where the newest report's
          # window ended. The marker is the report's first line, written by
          # the analyze step. History is read with git only (no REST call):
          # a shallow fetch of the last 8 days, then local git log/show. Only
          # regex-validated values are used or printed; any failure falls
          # back to the lookback_days window. An explicit since still wins.
          wla_since_last_report="false"
          case "$(printf '%s' "${SINCE_LAST_REPORT_INPUT:-false}" | tr '[:upper:]' '[:lower:]')" in
            true|1|yes|on) wla_since_last_report="true" ;;
          esac
          wla_iso_re='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          wla_marker_re='^<!-- workflow-log-analysis: window_start=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z|unknown) window_end=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) run=[0-9]+ -->$'
          wla_doc_re='^analysis/workflow-optimization-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]+)?\.md$'
          wla_last_report_since=""

          if [ "${PAT_BUDGET_DAILY}" = "true" ]; then
            # Include runs that began the day before the report window but
            # finished inside it. The report itself is limited to yesterday.
            wla_window_start="$(date -u -d '2 days ago 00:00' +%Y-%m-%dT%H:%M:%SZ)"
            COLLECT_ARGS+=(--since "${wla_window_start}"
              --max-pages 50 --max-log-runs 0
              --pat-budget-day "$(date -u -d yesterday +%Y-%m-%d)"
              --pat-budget-output "${RUNNER_TEMP}/gh-pat-budget.md")
          elif [ -n "${SINCE_INPUT//[[:space:]]/}" ]; then
            COLLECT_ARGS+=(--since "${SINCE_INPUT}")
            wla_window_start="$(date -u -d "${SINCE_INPUT}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)"
            [[ "${wla_window_start}" =~ ${wla_iso_re} ]] || wla_window_start="unknown"
          else
            if [ "${wla_since_last_report}" = "true" ]; then
              wla_lr_reason="ok"
              wla_lr_report="none"
              wla_lr_end=""
              wla_lr_clamped="false"
              wla_lr_log=""
              wla_lr_fetch_since="$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)"
              if ! git fetch --quiet --no-tags --shallow-since="${wla_lr_fetch_since}" origin "${GITHUB_SHA:-HEAD}" >/dev/null 2>&1 \
                || ! wla_lr_log="$(git log --format='C %H' --name-only --diff-filter=A "${GITHUB_SHA:-HEAD}" -- 'analysis/workflow-optimization-*.md' 2>/dev/null)"; then
                wla_lr_reason="git_failed"
              else
                wla_lr_commit=""
                wla_lr_pairs=0
                while IFS= read -r wla_lr_line; do
                  case "${wla_lr_line}" in
                    "C "*) wla_lr_commit="${wla_lr_line#C }"; continue ;;
                    "") continue ;;
                  esac
                  [[ "${wla_lr_commit}" =~ ^[0-9a-f]{40,64}$ ]] || continue
                  [[ "${wla_lr_line}" =~ ${wla_doc_re} ]] || continue
                  wla_lr_pairs=$((wla_lr_pairs + 1))
                  [ "${wla_lr_pairs}" -le 50 ] || break
                  wla_lr_first="$(git show "${wla_lr_commit}:${wla_lr_line}" 2>/dev/null | head -n 1 || true)"
                  wla_lr_first="${wla_lr_first%$'\r'}"
                  if [[ "${wla_lr_first}" =~ ${wla_marker_re} ]]; then
                    if [ -z "${wla_lr_end}" ] || [[ "${BASH_REMATCH[2]}" > "${wla_lr_end}" ]]; then
                      wla_lr_end="${BASH_REMATCH[2]}"
                      wla_lr_report="${wla_lr_line}"
                    fi
                  fi
                done <<< "${wla_lr_log}"
                if [ -z "${wla_lr_end}" ]; then
                  wla_lr_reason="no_marker"
                  wla_lr_report="none"
                elif ! wla_lr_end_epoch="$(date -u -d "${wla_lr_end}" +%s 2>/dev/null)" || ! [[ "${wla_lr_end_epoch}" =~ ^[0-9]+$ ]]; then
                  wla_lr_reason="unparseable"
                elif [ "${wla_lr_end_epoch}" -gt "$(date -u +%s)" ]; then
                  wla_lr_reason="future"
                elif [ "${wla_lr_end_epoch}" -lt "$(( $(date -u +%s) - 7 * 86400 ))" ]; then
                  wla_last_report_since="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
                  wla_lr_clamped="true"
                else
                  wla_last_report_since="${wla_lr_end}"
                fi
              fi
              if [ -n "${wla_last_report_since}" ]; then
                echo "WORKFLOW_LOG_ANALYSIS_WINDOW source=last_report since=${wla_last_report_since} report=${wla_lr_report} clamped=${wla_lr_clamped} reason=${wla_lr_reason}"
              else
                wla_lr_lookback_since="$(date -u -d "${LOOKBACK_DAYS_INPUT} days ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)"
                [[ "${wla_lr_lookback_since}" =~ ${wla_iso_re} ]] || wla_lr_lookback_since="unknown"
                [[ "${wla_lr_report}" =~ ${wla_doc_re} ]] || wla_lr_report="none"
                echo "WORKFLOW_LOG_ANALYSIS_WINDOW source=lookback since=${wla_lr_lookback_since} report=${wla_lr_report} clamped=false reason=${wla_lr_reason}"
              fi
            fi
            if [ -n "${wla_last_report_since}" ]; then
              COLLECT_ARGS+=(--since "${wla_last_report_since}")
              wla_window_start="${wla_last_report_since}"
            else
              if ! [[ "${LOOKBACK_DAYS_INPUT}" =~ ^[0-9]+$ ]] || [ "${LOOKBACK_DAYS_INPUT}" -lt 1 ]; then
                echo "::error::lookback_days must be a positive integer."
                exit 1
              fi
              COLLECT_ARGS+=(--lookback-days "${LOOKBACK_DAYS_INPUT}")
              wla_window_start="$(date -u -d "${LOOKBACK_DAYS_INPUT} days ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)"
              [[ "${wla_window_start}" =~ ${wla_iso_re} ]] || wla_window_start="unknown"
            fi
          fi
          echo "window_start=${wla_window_start}" >> "$GITHUB_OUTPUT"

          for repo in "${REPOS[@]}"; do
            COLLECT_ARGS+=(--repo "${repo}")
          done

          # P3: keep the collector's exit code, log coverage, then re-exit
          # with the same code so the step result is unchanged.
          collect_rc=0; python3 scripts/collect_workflow_logs.py "${COLLECT_ARGS[@]}" || collect_rc=$?

          # --- collection coverage (P3) begin ---
          # Diagnostics only and fail-open: no command here can change the
          # step result. Only owner/repo names that pass the resolve_repos
          # regex (anchored with \A..\z so a newline cannot smuggle a second
          # line) and counts are printed; collector error text never is.
          coverage_report="workflow_log_report.json"
          coverage_repo_re='\A[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\z'
          if [ -f "${coverage_report}" ] && jq -e '(.coverage | type) == "object"' "${coverage_report}" >/dev/null 2>&1; then
            coverage_repos="$(jq -r '[(.coverage.repositories_requested // []) | .[]? | strings] | length' "${coverage_report}" 2>/dev/null || true)"
            [[ "${coverage_repos}" =~ ^[0-9]+$ ]] || coverage_repos=0
            coverage_failed_csv="$(jq -r --arg re "${coverage_repo_re}" '[(.coverage.repositories_failed // []) | .[]? | objects | .repository | strings | select(test($re))] | unique | join(",")' "${coverage_report}" 2>/dev/null || true)"
            coverage_truncated_csv="$(jq -r --arg re "${coverage_repo_re}" '[(.coverage.repositories_truncated // []) | .[]? | strings | select(test($re))] | unique | join(",")' "${coverage_report}" 2>/dev/null || true)"
            coverage_failed_list=()
            coverage_truncated_list=()
            [ -n "${coverage_failed_csv}" ] && IFS=',' read -r -a coverage_failed_list <<< "${coverage_failed_csv}"
            [ -n "${coverage_truncated_csv}" ] && IFS=',' read -r -a coverage_truncated_list <<< "${coverage_truncated_csv}"
            echo "WORKFLOW_LOG_COLLECT_COVERAGE repos=${coverage_repos} failed=${#coverage_failed_list[@]} truncated=${#coverage_truncated_list[@]} failed_repos=${coverage_failed_csv} truncated_repos=${coverage_truncated_csv}"
            for coverage_repo in "${coverage_failed_list[@]}"; do
              echo "::error title=Workflow log collection::Could not read workflow runs for ${coverage_repo}; it is missing from this analysis."
            done
            for coverage_repo in "${coverage_truncated_list[@]}"; do
              echo "::warning title=Workflow log collection::Run listing for ${coverage_repo} was truncated; this analysis covers only part of its runs."
            done
            {
              echo "coverage_failed_count=${#coverage_failed_list[@]}"
              echo "coverage_truncated_count=${#coverage_truncated_list[@]}"
              echo "coverage_failed_repos=${coverage_failed_csv}"
              echo "coverage_truncated_repos=${coverage_truncated_csv}"
            } >> "${GITHUB_OUTPUT:-/dev/null}" || true
          else
            echo "::warning::workflow_log_report.json has no coverage object; collection coverage is unknown."
          fi
          # --- collection coverage (P3) end ---

          exit "${collect_rc}"

      - name: Publish daily PAT consumer ranking
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 6 * * *' }}
        run: |
          cat "${RUNNER_TEMP}/gh-pat-budget.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload daily PAT consumer ranking
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 6 * * *' }}
        uses: actions/upload-artifact@v6
        with:
          name: gh-pat-budget-day
          path: ${{ runner.temp }}/gh-pat-budget.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload workflow log report artifact
        uses: actions/upload-artifact@v6
        with:
          name: workflow-log-report
          path: workflow_log_report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload full workflow log directory artifact
        uses: actions/upload-artifact@v6
        with:
          name: workflow-log-output
          path: ${{ steps.collect.outputs.log_output_dir }}
          if-no-files-found: warn
          retention-days: 7

      # P3: one WARNING alert per run when collection had gaps. Separate step
      # so TG_BOT_SECRET never shares a step with GH_PAT; skipped on the 06:00
      # PAT-budget run, whose behaviour P3 leaves unchanged. ALERT_MSG_LEVEL
      # (workflow env) still filters it, so SILENT holds it back.
      - name: Alert on workflow log collection gaps
        id: coverage_alert
        if: ${{ always() && ((steps.collect.outputs.coverage_failed_count || '0') != '0' || (steps.collect.outputs.coverage_truncated_count || '0') != '0') && !(github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') }}
        continue-on-error: true
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          WLA_COVERAGE_FAILED_COUNT: ${{ steps.collect.outputs.coverage_failed_count || '0' }}
          WLA_COVERAGE_TRUNCATED_COUNT: ${{ steps.collect.outputs.coverage_truncated_count || '0' }}
          WLA_COVERAGE_FAILED_REPOS: ${{ steps.collect.outputs.coverage_failed_repos || '' }}
          WLA_COVERAGE_TRUNCATED_REPOS: ${{ steps.collect.outputs.coverage_truncated_repos || '' }}
        run: |
          set -euo pipefail

          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "::warning::Telegram not configured (TG_BOT_SECRET or TG_ADMIN_CHAT_ID missing) — skipping collection gap alert."
            exit 0
          fi

          if [ ! -f scripts/tg_helpers.sh ]; then
            echo "::warning::scripts/tg_helpers.sh not found — skipping collection gap alert."
            exit 0
          fi

          source scripts/tg_helpers.sh

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG="Workflow log collection gaps for ${GITHUB_REPOSITORY}: failed=${WLA_COVERAGE_FAILED_COUNT} truncated=${WLA_COVERAGE_TRUNCATED_COUNT}"
          MSG+=$'\n'
          MSG+="Failed repos: ${WLA_COVERAGE_FAILED_REPOS:-none}"
          MSG+=$'\n'
          MSG+="Truncated repos: ${WLA_COVERAGE_TRUNCATED_REPOS:-none}"
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_msg "${MSG}" "WARNING" >/dev/null || echo "::warning::Collection gap alert could not be sent to Telegram."

  weekly-retro:
    needs: collect-logs
    if: ${{ github.event_name == 'schedule' && (vars.WORKFLOW_RETRO_ENABLED || 'true') == 'true' && github.event.schedule == (vars.WORKFLOW_RETRO_CRON || '0 9 * * 1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODEX_VERSION: ${{ vars.CODEX_VERSION || 'v0.114.0' }}
      AI_ENGINE: ${{ vars.AI_ENGINE || '' }}
      AI_ENGINE_RETRO: ${{ vars.AI_ENGINE_RETRO || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve AI engine
        id: ai_engine
        env:
          WLA_ENGINE_ROLES: RETRO
          CLAUDE_ENGINE_SUPPORT_DEST: ${{ runner.temp }}/claude-engine-support
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || '' }}
        run: |
          set -euo pipefail
          # Claude engine (plan item 3d): this job's model roles run Claude
          # through the engine root staged here from this workflow's own
          # checkout; the codex CLI stays installed as the fallback. No work
          # item, so no labels. This workflow is not reusable (schedule +
          # dispatch only): its YAML, scripts and this checkout are one
          # commit, so the checkout is the verified support source once HEAD
          # is pinned to GITHUB_SHA and the run is on the default branch. A
          # dispatch of any other ref runs codex, so unmerged engine support
          # never fetches the Claude pool credential.
          any_claude="false"
          trusted_ref="false"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] ||
             { [ -n "${DEFAULT_BRANCH}" ] && [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; }; then
            trusted_ref="true"
          fi
          checkout_head="$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD 2>/dev/null || true)"
          # shellcheck disable=SC1091
          if [ "${trusted_ref}" = "true" ] && [ -n "${checkout_head}" ] && [ "${checkout_head}" = "${GITHUB_SHA}" ] &&
             source scripts/ai_engine.sh && ai_engine_stage_support "${GITHUB_WORKSPACE}" "${CLAUDE_ENGINE_SUPPORT_DEST}"; then
            echo "CLAUDE_ENGINE_SUPPORT_DIR=${CLAUDE_ENGINE_SUPPORT_DEST}" >> "$GITHUB_ENV"
            for wla_role in ${WLA_ENGINE_ROLES}; do
              wla_engine="$(SUPPORT_ROOT_DIR="${CLAUDE_ENGINE_SUPPORT_DEST}" ai_engine_for_role "${wla_role}" || echo codex)"
              if [ "${wla_engine}" = "claude" ]; then
                any_claude="true"
              fi
            done
          else
            echo "::warning::Trusted Claude engine support is unavailable; ${WLA_ENGINE_ROLES} run codex."
          fi
          echo "any_claude=${any_claude}" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI
        if: steps.ai_engine.outputs.any_claude == 'true'
        continue-on-error: true
        uses: ./.github/actions/install-claude
        with:
          config_path: .github/ai/claude_engine.json

      - name: Resolve Claude credential
        id: claude_pool
        if: steps.ai_engine.outputs.any_claude == 'true'
        continue-on-error: true
        uses: ./.github/actions/claude-pool-token
        with:
          config_path: .github/ai/claude_engine.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Codex CLI
        id: cache-codex
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/codex
          key: codex-${{ vars.CODEX_VERSION || 'v0.114.0' }}-v2

      - name: Install Codex CLI
        if: steps.cache-codex.outputs.cache-hit != 'true'
        uses: shubhodeep1/coding-workflows/.github/actions/install-codex@91b30f6fba400686c5dded34423f88f1ea10e163
        with:
          codex_version: ${{ env.CODEX_VERSION }}

      - name: Persist Codex CLI to tool cache
        if: steps.cache-codex.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NPM_GLOBAL_ROOT="$(npm root -g)"
          mkdir -p "${{ runner.tool_cache }}/codex"
          [ -d "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64" ] || {
            echo "::error::Codex platform package @openai/codex-linux-x64 missing after install"
            exit 1
          }
          cp -r "${NPM_GLOBAL_ROOT}/@openai/codex"           "${{ runner.tool_cache }}/codex/package"
          cp -r "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64" "${{ runner.tool_cache }}/codex/codex-linux-x64"

      - name: Restore Codex CLI from cache
        if: steps.cache-codex.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          NPM_GLOBAL_ROOT="$(npm root -g)"
          NPM_GLOBAL_PREFIX="$(npm prefix -g)"
          mkdir -p "${NPM_GLOBAL_ROOT}/@openai" "${NPM_GLOBAL_PREFIX}/bin"
          rm -rf "${NPM_GLOBAL_ROOT}/@openai/codex" "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64"
          cp -r "${{ runner.tool_cache }}/codex/package" "${NPM_GLOBAL_ROOT}/@openai/codex"
          cp -r "${{ runner.tool_cache }}/codex/codex-linux-x64" "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64"
          ln -sf "${NPM_GLOBAL_ROOT}/@openai/codex/bin/codex.js" "${NPM_GLOBAL_PREFIX}/bin/codex"
          codex --version

      - name: Create Codex config
        run: |
          set -euo pipefail
          bash scripts/write_codex_config.sh \
            --model "${WORKFLOW_RETRO_MODEL}" \
            --reasoning "${WORKFLOW_RETRO_REASONING}"
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

      - name: Setup uv (Semble)
        if: env.SEMBLE_ENABLED == 'true'
        continue-on-error: true
        uses: astral-sh/setup-uv@v7

      - name: Install semble
        if: env.SEMBLE_ENABLED == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "SEMBLE_AVAILABLE=false" >> "$GITHUB_ENV"
          bash scripts/install_semble.sh

      - name: Build semble index
        if: env.SEMBLE_ENABLED == 'true'
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SEMBLE_INDEX_PATH: ${{ runner.temp }}/.semble-index
        run: |
          set -euo pipefail
          if [ -f scripts/build_semble_wrapper.sh ]; then
            bash scripts/build_semble_wrapper.sh
          else
            echo "::notice::scripts/build_semble_wrapper.sh not present; continuing without Semble index."
            echo "SEMBLE_INDEX_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Download workflow log report artifact
        uses: actions/download-artifact@v4
        with:
          name: workflow-log-report
          path: .

      - name: Build weekly retro context
        id: retro_context
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          RETRO_CONTEXT_FILE="${RUNNER_TEMP:-/tmp}/workflow-weekly-retro-context.md"
          RETRO_JSON_FILE="${RUNNER_TEMP:-/tmp}/workflow-weekly-retro-context.json"

          python3 scripts/workflow_retro.py \
            --report workflow_log_report.json \
            --output "${RETRO_CONTEXT_FILE}" \
            --json-output "${RETRO_JSON_FILE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --repo-root "${GITHUB_WORKSPACE}"

          echo "retro_context_file=${RETRO_CONTEXT_FILE}" >> "$GITHUB_OUTPUT"
          echo "retro_json_file=${RETRO_JSON_FILE}" >> "$GITHUB_OUTPUT"
          echo "week_label=$(jq -r '.window.week_label' "${RETRO_JSON_FILE}")" >> "$GITHUB_OUTPUT"
          echo "window_since=$(jq -r '.window.since' "${RETRO_JSON_FILE}")" >> "$GITHUB_OUTPUT"

          # No-activity gate: skip the LLM pass and the tracker comment when
          # the window had zero workflow runs and zero merged PRs. Log-only —
          # the WORKFLOW_RETRO_SKIP_V1 line in the run log is the sole trace.
          retro_has_activity="$(jq -r 'if .has_activity == false then "false" else "true" end' "${RETRO_JSON_FILE}")"
          retro_skip_if_no_activity_normalized="$(printf '%s' "${WORKFLOW_RETRO_SKIP_IF_NO_ACTIVITY:-true}" | tr '[:upper:]' '[:lower:]')"
          if [ "${retro_has_activity}" != "true" ] && [[ "${retro_skip_if_no_activity_normalized}" =~ ^(1|true|yes|on)$ ]]; then
            echo "WORKFLOW_RETRO_SKIP_V1: repo=${GITHUB_REPOSITORY} week=$(jq -r '.window.week_label' "${RETRO_JSON_FILE}") reason=no_activity total_runs=$(jq -r '.summary.total_runs // 0' "${RETRO_JSON_FILE}") merged_prs=$(jq -r '.summary.merged_pr_count // 0' "${RETRO_JSON_FILE}")"
            echo "retro_gate=skip_no_activity" >> "$GITHUB_OUTPUT"
          else
            echo "retro_gate=run" >> "$GITHUB_OUTPUT"
          fi

      - name: Run weekly retro pass
        id: retro
        if: steps.retro_context.outputs.retro_gate == 'run'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          MAX_CODEX_ATTEMPTS: ${{ vars.MAX_CODEX_ATTEMPTS || '3' }}
          CODEX_RETRY_BACKOFF_BASE_SECS: ${{ vars.CODEX_RETRY_BACKOFF_BASE_SECS || '10' }}
          PYTHONDONTWRITEBYTECODE: "1"
          RETRO_CONTEXT_FILE: ${{ steps.retro_context.outputs.retro_context_file }}
          RETRO_JSON_FILE: ${{ steps.retro_context.outputs.retro_json_file }}
        run: |
          set -euo pipefail

          source scripts/gh_helpers.sh 2>/dev/null || true

          RETRO_BODY_FILE="${RUNNER_TEMP:-/tmp}/workflow-weekly-retro.md"
          CODEX_PROMPT_FILE="$(mktemp)"
          trap 'rm -f "${CODEX_PROMPT_FILE}"' EXIT

          RETRO_SEMBLE_PREFETCH=""
          if [ "${SEMBLE_INDEX_AVAILABLE:-false}" = "true" ] && [ -f scripts/semble_helpers.sh ]; then
            # shellcheck disable=SC1091
            source scripts/semble_helpers.sh || true
            if type semble_query_block >/dev/null 2>&1; then
              retro_query_text="$(head -c 6000 "${RETRO_CONTEXT_FILE}" 2>/dev/null | iconv -f UTF-8 -t UTF-8 -c 2>/dev/null || true)"
              if [ -n "${retro_query_text}" ]; then
                RETRO_SEMBLE_PREFETCH="$(semble_query_block "${retro_query_text}" 6 "Workflow Weekly Retro Context" 2>/dev/null || true)"
              fi
            fi
          fi

          {
            echo "Mode: retro"
            SEMBLE_PREFETCH="${RETRO_SEMBLE_PREFETCH}" bash scripts/render_prompt.sh prompts/mode-workflow-analysis.txt
            echo
            echo "=== WEEKLY RETRO CONTEXT ==="
            cat "${RETRO_CONTEXT_FILE}"
            echo
            echo "=== WEEKLY RETRO JSON ==="
            cat "${RETRO_JSON_FILE}"
          } > "${CODEX_PROMPT_FILE}"

          max_attempts="${MAX_CODEX_ATTEMPTS}"
          if ! [[ "${max_attempts}" =~ ^[0-9]+$ ]] || [ "${max_attempts}" -lt 1 ]; then
            echo "::warning::MAX_CODEX_ATTEMPTS must be a positive integer (got: ${max_attempts}); defaulting to 3."
            max_attempts="3"
          fi
          backoff_base="${CODEX_RETRY_BACKOFF_BASE_SECS}"
          if ! [[ "${backoff_base}" =~ ^[0-9]+$ ]] || [ "${backoff_base}" -lt 1 ]; then
            echo "::warning::CODEX_RETRY_BACKOFF_BASE_SECS must be a positive integer (got: ${backoff_base}); defaulting to 10."
            backoff_base=10
          fi

          RETRO_EXIT=0
          # The codex command of this pass, unchanged (AI_ENGINE_RETRO=codex, or
          # no trusted engine support). Claude runs it as the fallback.
          wla_codex_retro()
          {
            bash scripts/codex_heartbeat.sh \
              --phase workflow_weekly_retro \
              --stdout-file "${RETRO_BODY_FILE}" \
              -- bash scripts/codex_isolated_exec.sh run --mode read-only -- --ask-for-approval never -c model_verbosity=low -c include_apply_patch_tool=true exec --skip-git-repo-check --model "${WORKFLOW_RETRO_MODEL}" --sandbox danger-full-access < "${CODEX_PROMPT_FILE}" 2> >(tee -a /tmp/workflow-weekly-retro-codex.log >&2)
          }
          wla_engine_ready()
          {
            [ -n "${CLAUDE_ENGINE_SUPPORT_DIR:-}" ] && [ -f "${CLAUDE_ENGINE_SUPPORT_DIR}/scripts/ai_engine.sh" ] && [ ! -L "${CLAUDE_ENGINE_SUPPORT_DIR}/scripts/ai_engine.sh" ]
          }
          for attempt in $(seq 1 "${max_attempts}"); do
            if command -v sanitize_codex_prompt_file >/dev/null 2>&1; then
              sanitize_codex_prompt_file "${CODEX_PROMPT_FILE}"
            fi
            set +e
            # The agent reads workflow logs from every consumer repo; it runs in the
            # credential-free, network-isolated container (scripts/codex_isolated_exec.sh).
            # Engine selection (role RETRO): Claude in the same isolated container
            # via claude_run_selected, the codex command above as its fallback.
            if wla_engine_ready; then
              (
                unset GH_TOKEN GITHUB_TOKEN TG_BOT_SECRET TG_ADMIN_CHAT_ID TG_CHAT_ID
                # shellcheck disable=SC1091
                if ! source "${CLAUDE_ENGINE_SUPPORT_DIR}/scripts/ai_engine.sh"; then
                  echo "AI_ENGINE_FALLBACK role=RETRO reason=engine_support_missing" >&2
                  wla_codex_retro
                  exit $?
                fi
                AI_ENGINE_MODEL_HINT="${WORKFLOW_RETRO_MODEL}" AI_ENGINE_EFFORT_HINT="${WORKFLOW_RETRO_REASONING}" \
                  claude_run_selected RETRO "${CODEX_PROMPT_FILE}" "${RETRO_BODY_FILE}" "${PWD}" -- wla_codex_retro
              )
            else
              echo "AI_ENGINE_FALLBACK role=RETRO reason=engine_support_missing" >&2
              wla_codex_retro
            fi
            RETRO_EXIT=$?
            set -e
            if [ "${RETRO_EXIT}" -eq 80 ]; then
              # Claude capacity wait (issue #7370): no codex fallback and no
              # retries against a gated pool; this scheduled pass runs again
              # on its next trigger.
              echo "AI_ENGINE_CAPACITY_WAIT role=RETRO outcome=deferred stage=workflow_log_analysis"
              echo "::error::Claude pool at capacity (role RETRO); stopping this pass without codex fallback or retries."
              exit 80
            fi
            if [ "${RETRO_EXIT}" -eq 0 ] && grep -q '[^[:space:]]' "${RETRO_BODY_FILE}"; then
              break
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              sleep_secs=$((backoff_base * (2 ** (attempt - 1))))
              sleep "${sleep_secs}"
            else
              if [ "${RETRO_EXIT}" -eq 0 ]; then
                echo "::error::Weekly retro Codex returned empty output after ${max_attempts} attempts."
                exit 1
              fi
              echo "::error::Weekly retro Codex failed after ${max_attempts} attempts with exit code ${RETRO_EXIT}."
              exit "${RETRO_EXIT}"
            fi
          done

          if ! head -n1 "${RETRO_BODY_FILE}" | grep -qx '## Weekly Retro'; then
            echo "::error::Weekly retro Codex output did not start with the required '## Weekly Retro' heading."
            head -n5 "${RETRO_BODY_FILE}" >&2 || true
            exit 1
          fi

          required_headings=(
            "## Weekly Retro"
            "### What Worked"
            "### Failure Modes"
            "### Next Week Recommendation"
            "### Metrics Snapshot"
          )
          previous_heading_line=0
          for heading in "${required_headings[@]}"; do
            heading_line="$(grep -nFx "${heading}" "${RETRO_BODY_FILE}" | head -n1 | cut -d: -f1 || true)"
            if [ -z "${heading_line}" ]; then
              echo "::error::Weekly retro Codex output is missing required heading: ${heading}"
              exit 1
            fi
            if [ "${heading_line}" -le "${previous_heading_line}" ]; then
              echo "::error::Weekly retro Codex output has headings out of order at: ${heading}"
              exit 1
            fi
            previous_heading_line="${heading_line}"
          done

          echo "retro_status=completed" >> "$GITHUB_OUTPUT"
          echo "retro_body_file=${RETRO_BODY_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upsert weekly retro tracker comment
        id: post_retro
        if: steps.retro.outputs.retro_status == 'completed'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          RETRO_BODY_FILE: ${{ steps.retro.outputs.retro_body_file }}
          RETRO_WEEK_LABEL: ${{ steps.retro_context.outputs.week_label }}
          RETRO_WINDOW_SINCE: ${{ steps.retro_context.outputs.window_since }}
        run: |
          set -euo pipefail

          if [ ! -s "${RETRO_BODY_FILE}" ]; then
            echo "::error::Weekly retro body file missing: ${RETRO_BODY_FILE}"
            exit 1
          fi

          # shellcheck disable=SC1091
          source scripts/label_helpers.sh
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }

          TRACKER_TITLE="AI Workflow Weekly Retro"
          TRACKER_MARKER="<!-- ai:retro-tracker:v1 -->"
          COMMENT_MARKER="<!-- ai:workflow-retro:${RETRO_WEEK_LABEL} -->"
          RETRO_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          RETRO_RUNTIME_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/workflow-weekly-retro.XXXXXX")"
          trap 'rm -rf "${RETRO_RUNTIME_DIR}"' EXIT
          TRACKER_BODY_FILE="${RETRO_RUNTIME_DIR}/tracker-issue-body.md"
          TRACKER_CANDIDATES_JSON="${RETRO_RUNTIME_DIR}/tracker-candidates.json"
          TRACKER_SELECTION_ENV="${RETRO_RUNTIME_DIR}/tracker-selection.env"
          TRACKER_COMMENTS_JSON="${RETRO_RUNTIME_DIR}/tracker-comments.json"
          TRACKER_COMMENT_FILE="${RETRO_RUNTIME_DIR}/tracker-comment.md"
          TRACKER_COMMENT_PAYLOAD="${RETRO_RUNTIME_DIR}/tracker-comment-payload.json"

          cat > "${TRACKER_BODY_FILE}" <<EOF
          ${TRACKER_MARKER}
          # ${TRACKER_TITLE}

          This issue is managed by .github/workflows/workflow-log-analysis.yml.

          It collects source-repo weekly workflow retrospectives posted by the
          schedule-gated retro path.
          EOF

          ensure_label_exists "ai:retro" "${GITHUB_REPOSITORY}"

          gh_retry gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state all \
            --label "ai:retro" \
            --limit 50 \
            --json number,title,body,state,updatedAt,url > "${TRACKER_CANDIDATES_JSON}"

          python3 - "${TRACKER_CANDIDATES_JSON}" "${TRACKER_MARKER}" > "${TRACKER_SELECTION_ENV}" <<'PY'
          from __future__ import annotations

          import json
          import shlex
          import sys
          from pathlib import Path

          candidates_path = Path(sys.argv[1])
          marker = sys.argv[2]

          try:
              candidates = json.loads(candidates_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"failed to load retro tracker candidates: {exc}")

          selected_candidates = []
          for candidate in candidates:
              if not isinstance(candidate, dict):
                  continue
              body = str(candidate.get("body") or "")
              if marker not in body:
                  continue
              selected_candidates.append(candidate)

          selected_candidates.sort(
              key=lambda candidate: (
                  str(candidate.get("state") or "").upper() == "OPEN",
                  str(candidate.get("updatedAt") or ""),
                  int(candidate.get("number") or 0),
              ),
              reverse=True,
          )
          selected = selected_candidates[0] if selected_candidates else None

          number = ""
          state = ""
          if isinstance(selected, dict):
              number = str(selected.get("number") or "").strip()
              state = str(selected.get("state") or "").strip()

          print(f"TRACKER_NUMBER={shlex.quote(number)}")
          print(f"TRACKER_STATE={shlex.quote(state)}")
          PY

          # shellcheck disable=SC1090
          source "${TRACKER_SELECTION_ENV}"

          if [ -z "${TRACKER_NUMBER}" ]; then
            TRACKER_URL="$(gh_retry gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TRACKER_TITLE}" \
              --label "ai:retro" \
              --body-file "${TRACKER_BODY_FILE}")"
            TRACKER_NUMBER="${TRACKER_URL##*/}"
          else
            if [ "$(printf '%s' "${TRACKER_STATE}" | tr '[:lower:]' '[:upper:]')" = "CLOSED" ]; then
              gh_retry gh issue reopen "${TRACKER_NUMBER}" --repo "${GITHUB_REPOSITORY}"
            fi
            gh_retry gh issue edit "${TRACKER_NUMBER}" --repo "${GITHUB_REPOSITORY}" --add-label "ai:retro" >/dev/null
          fi

          {
            echo "${COMMENT_MARKER}"
            echo
            echo "_Workflow run: ${RETRO_RUN_URL}_"
            echo
            cat "${RETRO_BODY_FILE}"
          } > "${TRACKER_COMMENT_FILE}"

          # Query only the current retro window so the week-scoped comment upsert
          # stays bounded even as the tracker grows over time.
          gh_retry gh api "repos/${GITHUB_REPOSITORY}/issues/${TRACKER_NUMBER}/comments?since=${RETRO_WINDOW_SINCE}&per_page=100" > "${TRACKER_COMMENTS_JSON}"

          existing_comment_id="$(jq -r --arg marker "${COMMENT_MARKER}" '([.[] | select(((.body // "") | contains($marker))) | {id: ((.id // 0) | tonumber), body: (.body // "")}] | sort_by(.id) | last | .id) // empty' "${TRACKER_COMMENTS_JSON}" 2>/dev/null || echo "")"
          existing_comment_body="$(jq -r --arg marker "${COMMENT_MARKER}" '([.[] | select(((.body // "") | contains($marker))) | {id: ((.id // 0) | tonumber), body: (.body // "")}] | sort_by(.id) | last | .body) // ""' "${TRACKER_COMMENTS_JSON}" 2>/dev/null || echo "")"

          if [ -n "${existing_comment_id}" ] && [ "${existing_comment_body}" = "$(cat "${TRACKER_COMMENT_FILE}")" ]; then
            echo "Weekly retro comment already up to date (#${existing_comment_id})."
            exit 0
          fi

          jq -n --rawfile body "${TRACKER_COMMENT_FILE}" '{body: $body}' > "${TRACKER_COMMENT_PAYLOAD}"

          if [ -n "${existing_comment_id}" ] && [[ "${existing_comment_id}" =~ ^[0-9]+$ ]]; then
            if gh_retry gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" --input "${TRACKER_COMMENT_PAYLOAD}" >/dev/null 2>&1; then
              echo "Weekly retro comment refreshed (#${existing_comment_id}) on issue #${TRACKER_NUMBER}."
              exit 0
            fi
            # Reconfirm GET: runs only on this PATCH-failure path (BUG-005). GitHub
            # may apply a PATCH and lose the response, so POSTing blindly would
            # leave a duplicate marker comment. Reads audited per §14: the
            # week-scoped issues/<n>/comments?since= list read above runs before
            # the PATCH, so it cannot show whether the PATCH landed, and the
            # tracker `gh issue list` read returns no comment bodies. At most one
            # extra bounded GET per weekly run, only when the PATCH fails.
            TRACKER_COMMENT_RECONFIRM_JSON="${RETRO_RUNTIME_DIR}/tracker-comment-reconfirm.json"
            TRACKER_COMMENT_RECONFIRM_ERR="${RETRO_RUNTIME_DIR}/tracker-comment-reconfirm.err"
            if gh_retry gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" > "${TRACKER_COMMENT_RECONFIRM_JSON}" 2> "${TRACKER_COMMENT_RECONFIRM_ERR}"; then
              if ! tracker_reconfirm_body="$(jq -r '.body // ""' "${TRACKER_COMMENT_RECONFIRM_JSON}" 2>/dev/null)"; then
                echo "::warning::Failed to refresh weekly retro comment #${existing_comment_id} on issue #${TRACKER_NUMBER} and could not reconfirm it; not posting a duplicate."
                exit 1
              fi
              if [ "${tracker_reconfirm_body}" = "$(cat "${TRACKER_COMMENT_FILE}")" ]; then
                echo "Weekly retro comment refreshed (#${existing_comment_id}) on issue #${TRACKER_NUMBER}."
                exit 0
              fi
              # The marker is week-scoped, so no later run refreshes this comment.
              # Fail like the consumer fan-out does for the same condition.
              echo "::warning::Weekly retro comment #${existing_comment_id} exists on issue #${TRACKER_NUMBER} in ${GITHUB_REPOSITORY} but was not refreshed; not posting a duplicate, so this week's comment stays stale."
              exit 1
            elif grep -qE 'HTTP 404' "${TRACKER_COMMENT_RECONFIRM_ERR}"; then
              echo "::warning::Failed to refresh weekly retro comment #${existing_comment_id}; reconfirm shows it is gone (HTTP 404), posting a new comment."
            else
              echo "::warning::Failed to refresh weekly retro comment #${existing_comment_id} on issue #${TRACKER_NUMBER} and could not reconfirm it; not posting a duplicate."
              exit 1
            fi
          fi

          gh_retry gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${TRACKER_NUMBER}/comments" --input "${TRACKER_COMMENT_PAYLOAD}" >/dev/null
          echo "Weekly retro comment posted on issue #${TRACKER_NUMBER}."

      - name: Consumer retro fan-out
        id: retro_fanout
        # Runs whenever the retro context built, even if the source repo's own
        # retro was skipped for no activity or failed — consumer activity is
        # independent of source-repo activity. The collect-logs artifact
        # already contains every consumer repo's runs, so per-consumer retros
        # are posted centrally from here via GH_PAT (§14 repo scope).
        if: ${{ !cancelled() && steps.retro_context.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
          WORKFLOW_RETRO_CONSUMER_FANOUT_ENABLED: ${{ vars.WORKFLOW_RETRO_CONSUMER_FANOUT_ENABLED || 'true' }}
          MAX_CODEX_ATTEMPTS: ${{ vars.MAX_CODEX_ATTEMPTS || '3' }}
          CODEX_RETRY_BACKOFF_BASE_SECS: ${{ vars.CODEX_RETRY_BACKOFF_BASE_SECS || '10' }}
        run: |
          set -euo pipefail
          bash scripts/workflow_retro_fanout.sh

      - name: Send Telegram notification
        if: always()
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "::warning::Telegram not configured (TG_BOT_SECRET or TG_ADMIN_CHAT_ID missing) — skipping notification."
            exit 0
          fi

          if [ ! -f scripts/tg_helpers.sh ]; then
            echo "::warning::scripts/tg_helpers.sh not found — skipping Telegram notification."
            exit 0
          fi

          # A no-activity week is a silent skip (WORKFLOW_RETRO_SKIP_V1 in the
          # run log is the trace) — not a failure worth a Telegram alert.
          if [ "${{ steps.retro_context.outputs.retro_gate || '' }}" = "skip_no_activity" ]; then
            echo "Weekly retro skipped for a no-activity week — no Telegram notification."
            exit 0
          fi

          source scripts/tg_helpers.sh

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RETRO_STEP_OUTCOME="${{ steps.retro.outcome || 'skipped' }}"
          POST_STEP_OUTCOME="${{ steps.post_retro.outcome || 'skipped' }}"
          if [ "${RETRO_STEP_OUTCOME}" = "success" ] && [ "${POST_STEP_OUTCOME}" = "success" ]; then
            MSG="Weekly workflow retro posted for ${{ github.repository }}"
            ALERT_LEVEL="DEBUG"
          else
            MSG="Weekly workflow retro FAILED for ${{ github.repository }} (retro=${RETRO_STEP_OUTCOME}, post=${POST_STEP_OUTCOME})"
            ALERT_LEVEL="CRITICAL"
          fi
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_msg "${MSG}" "${ALERT_LEVEL}" >/dev/null

  analyze-commit-notify:
    needs: collect-logs
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    # Run #25558885206 cancelled at 30m 14s on this job (Codex pass alone
    # ran ~26m 31s — start 13:47:06, ##[error]The operation was canceled
    # 14:13:38). Successful neighbours took only 9–13m (e.g. 25548339583
    # 11m 57s, 25470798500 12m 46s), so this run hit a slow Codex pass /
    # retry under the 30m cap. Bumped 30 → 60m to mirror the api-redundancy
    # 30 → 60m precedent (run #25115192726). When this is bumped again,
    # also propagate the +Δ minutes through every caller that watches a
    # dispatched run of this workflow:
    #   1. test-and-mark-stable.yml's `orphan-workflows-test` →
    #      `Dispatch & watch — workflow-log-analysis` step (in-script
    #      DEADLINE in seconds, step timeout-minutes, and the job-level
    #      timeout-minutes with its sum-of-DEADLINEs comment).
    #   2. comprehensive-test-and-release.yml's
    #      `phase2-collect-and-analyze-logs` (and the downstream
    #      `phase3-...` job that reuses the same watcher pattern) —
    #      both currently capped at `timeout-minutes: 120`. The watcher
    #      is idle-based (INACTIVITY_LIMIT = phase_timeout * 60), so a
    #      progressing run won't trigger the soft idle exit, but the
    #      hard 120m job cap can still cancel a healthy run whose chain
    #      now totals up to 250m. Bump those caps if/when this worst
    #      case becomes observable in those callers.
    timeout-minutes: 60
    # Job-level grants replace the workflow-level block for this job, so the
    # four workflow-level grants are copied here unchanged. pull-requests:
    # write is added only here: commit_report delivers the report through a
    # pull request (WORKFLOW_LOG_ANALYSIS_REPORT_VIA_PR) and the github.token
    # fallback needs it to open and merge that PR. The other jobs keep the
    # narrower workflow-level grants.
    permissions:
      contents: write
      actions: read
      issues: write
      id-token: write
      pull-requests: write
    outputs:
      # commit_report may rename REPORT_FILE on a concurrent-write
      # collision; downstream jobs (deep-audit, api-redundancy) must see
      # the post-rename path, so prefer commit_report's output and fall
      # back to analyze.outputs.report_file when commit_report did not run.
      report_file: ${{ steps.commit_report.outputs.report_file || steps.analyze.outputs.report_file }}
      analysis_status: ${{ steps.analyze.outputs.analysis_status }}
      # pushed | pr_merged | pr_auto_merge | pr_open; empty when commit_report
      # did not run or had nothing to commit. deep-audit runs only when the
      # report is on the target branch (empty, pushed or pr_merged).
      report_delivery: ${{ steps.commit_report.outputs.delivery }}
      # Issue #8963: deliver-report opens a PR for a report left on a per-run
      # branch. commit_report (project #9116, P1) already opens and merges
      # that PR itself and always sets delivery when it commits, so committed
      # and report_branch are passed on only when it set no delivery outcome.
      # Otherwise deliver-report would open a second PR, and the deep-audit
      # and api-redundancy sync steps would reject report_branch=<target>.
      # With these empty, the sync steps read the target branch (where a
      # delivered report is) and the section steps skip their run-branch push.
      committed: ${{ steps.commit_report.outputs.delivery == '' && steps.commit_report.outputs.committed || '' }}
      report_branch: ${{ steps.commit_report.outputs.delivery == '' && steps.commit_report.outputs.report_branch || '' }}
      purged_docs: ${{ steps.commit_report.outputs.purged_docs }}
    env:
      CODEX_VERSION: ${{ vars.CODEX_VERSION || 'v0.114.0' }}
      AI_ENGINE: ${{ vars.AI_ENGINE || '' }}
      AI_ENGINE_LOG_SUMMARY: ${{ vars.AI_ENGINE_LOG_SUMMARY || '' }}
      AI_ENGINE_LOG_ANALYSIS: ${{ vars.AI_ENGINE_LOG_ANALYSIS || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}
          # Issue #8963 (§23.E): keep GH_PAT out of .git/config while the
          # Codex steps run; the steps that fetch or push set a one-shot
          # credential helper that reads GH_TOKEN from their env.
          persist-credentials: false

      - name: Resolve AI engine
        id: ai_engine
        env:
          WLA_ENGINE_ROLES: LOG_SUMMARY LOG_ANALYSIS
          CLAUDE_ENGINE_SUPPORT_DEST: ${{ runner.temp }}/claude-engine-support
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || '' }}
        run: |
          set -euo pipefail
          # Job start, read by commit_report to keep its merge wait inside
          # the job's 60-minute timeout.
          echo "WLA_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          # Claude engine (plan item 3d): this job's model roles run Claude
          # through the engine root staged here from this workflow's own
          # checkout; the codex CLI stays installed as the fallback. No work
          # item, so no labels. This workflow is not reusable (schedule +
          # dispatch only): its YAML, scripts and this checkout are one
          # commit, so the checkout is the verified support source once HEAD
          # is pinned to GITHUB_SHA and the run is on the default branch. A
          # dispatch of any other ref runs codex, so unmerged engine support
          # never fetches the Claude pool credential.
          any_claude="false"
          trusted_ref="false"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] ||
             { [ -n "${DEFAULT_BRANCH}" ] && [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; }; then
            trusted_ref="true"
          fi
          checkout_head="$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD 2>/dev/null || true)"
          # shellcheck disable=SC1091
          if [ "${trusted_ref}" = "true" ] && [ -n "${checkout_head}" ] && [ "${checkout_head}" = "${GITHUB_SHA}" ] &&
             source scripts/ai_engine.sh && ai_engine_stage_support "${GITHUB_WORKSPACE}" "${CLAUDE_ENGINE_SUPPORT_DEST}"; then
            echo "CLAUDE_ENGINE_SUPPORT_DIR=${CLAUDE_ENGINE_SUPPORT_DEST}" >> "$GITHUB_ENV"
            for wla_role in ${WLA_ENGINE_ROLES}; do
              wla_engine="$(SUPPORT_ROOT_DIR="${CLAUDE_ENGINE_SUPPORT_DEST}" ai_engine_for_role "${wla_role}" || echo codex)"
              if [ "${wla_engine}" = "claude" ]; then
                any_claude="true"
              fi
            done
          else
            echo "::warning::Trusted Claude engine support is unavailable; ${WLA_ENGINE_ROLES} run codex."
          fi
          echo "any_claude=${any_claude}" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI
        if: steps.ai_engine.outputs.any_claude == 'true'
        continue-on-error: true
        uses: ./.github/actions/install-claude
        with:
          config_path: .github/ai/claude_engine.json

      - name: Resolve Claude credential
        id: claude_pool
        if: steps.ai_engine.outputs.any_claude == 'true'
        continue-on-error: true
        uses: ./.github/actions/claude-pool-token
        with:
          config_path: .github/ai/claude_engine.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Codex CLI
        id: cache-codex
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/codex
          # -v2: previous cache only stored @openai/codex (no platform binary),
          # so cache hits restored a stub-only install and Codex crashed at
          # startup with "Missing optional dependency @openai/codex-linux-x64".
          # Bump invalidates the broken entries; persist+restore below now
          # handle both packages symmetrically.
          key: codex-${{ vars.CODEX_VERSION || 'v0.114.0' }}-v2

      - name: Install Codex CLI
        if: steps.cache-codex.outputs.cache-hit != 'true'
        uses: shubhodeep1/coding-workflows/.github/actions/install-codex@91b30f6fba400686c5dded34423f88f1ea10e163
        with:
          codex_version: ${{ env.CODEX_VERSION }}

      - name: Persist Codex CLI to tool cache
        if: steps.cache-codex.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NPM_GLOBAL_ROOT="$(npm root -g)"
          mkdir -p "${{ runner.tool_cache }}/codex"
          [ -d "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64" ] || {
            echo "::error::Codex platform package @openai/codex-linux-x64 missing after install"
            exit 1
          }
          cp -r "${NPM_GLOBAL_ROOT}/@openai/codex"           "${{ runner.tool_cache }}/codex/package"
          cp -r "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64" "${{ runner.tool_cache }}/codex/codex-linux-x64"

      - name: Restore Codex CLI from cache
        if: steps.cache-codex.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          NPM_GLOBAL_ROOT="$(npm root -g)"
          NPM_GLOBAL_PREFIX="$(npm prefix -g)"
          # Restore the cached directories directly into the global npm tree so
          # the @openai/codex-linux-x64 alias name is preserved. npm install -g
          # on the local paths re-reads package.json, and both cached
          # directories report "name": "@openai/codex".
          mkdir -p "${NPM_GLOBAL_ROOT}/@openai" "${NPM_GLOBAL_PREFIX}/bin"
          rm -rf "${NPM_GLOBAL_ROOT}/@openai/codex" "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64"
          cp -r "${{ runner.tool_cache }}/codex/package" "${NPM_GLOBAL_ROOT}/@openai/codex"
          cp -r "${{ runner.tool_cache }}/codex/codex-linux-x64" "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64"
          ln -sf "${NPM_GLOBAL_ROOT}/@openai/codex/bin/codex.js" "${NPM_GLOBAL_PREFIX}/bin/codex"
          codex --version

      - name: Create Codex config
        env:
          WORKFLOW_EDITOR_MODEL: ${{ vars.WORKFLOW_LOG_ANALYSIS_MODEL || 'openai/gpt-6-sol' }}
        run: |
          set -euo pipefail
          # Centralised in scripts/write_codex_config.sh — see that
          # script's header for the apply_patch / trust / elevation
          # rationale.
          bash scripts/write_codex_config.sh \
            --model "${WORKFLOW_EDITOR_MODEL}" \
            --reasoning xhigh
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

      - name: Setup uv (Semble)
        if: env.SEMBLE_ENABLED == 'true'
        continue-on-error: true
        uses: astral-sh/setup-uv@v7

      - name: Install semble
        if: env.SEMBLE_ENABLED == 'true'
        # Defense-in-depth: install_semble.sh is fail-soft (writes
        # SEMBLE_AVAILABLE=false on any error), but `continue-on-error: true`
        # ensures a future environment/regression issue still degrades to
        # blank prefetch rather than hard-failing the Codex pass.
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "SEMBLE_AVAILABLE=false" >> "$GITHUB_ENV"
          bash scripts/install_semble.sh

      - name: Build semble index
        if: env.SEMBLE_ENABLED == 'true'
        # Defense-in-depth: the shell script and the file-existence guard
        # below are both already fail-soft, but `continue-on-error: true`
        # makes the contract explicit at the step boundary so an unexpected
        # non-zero exit (syntax regression, future refactor) still degrades
        # to SEMBLE_INDEX_AVAILABLE=false rather than hard-failing the job.
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          # Pin the index location explicitly. Without this the wrapper
          # falls back to ${RUNTIME_DIR:-${RUNNER_TEMP:-${PWD}}}/.semble-index;
          # GitHub-hosted runners always set RUNNER_TEMP, but on self-hosted
          # runners that don't, the index would land in the checkout root.
          SEMBLE_INDEX_PATH: ${{ runner.temp }}/.semble-index
        run: |
          set -euo pipefail
          # Shared BM25 wrapper builder — see scripts/build_semble_wrapper.sh
          # for the rationale (semble 0.1.3 ships no index/query CLI surface).
          # Fail-soft: missing-script case is handled here (callers pinned to
          # an older reusable workflow ref may not yet have it staged); all
          # other errors are handled inside the script (writes
          # SEMBLE_INDEX_AVAILABLE=false to GITHUB_ENV and exits 0) so the
          # prefetch step renders blank.
          if [ -f scripts/build_semble_wrapper.sh ]; then
            bash scripts/build_semble_wrapper.sh
          else
            echo "::notice::scripts/build_semble_wrapper.sh not present; continuing without Semble index."
            echo "SEMBLE_INDEX_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Download workflow log report artifact
        uses: actions/download-artifact@v4
        with:
          name: workflow-log-report
          path: .

      - name: Download full workflow log directory artifact
        id: download_log_output
        # Fail-open contract: a missing/expired workflow-log-output artifact
        # must NOT fail the analyze job. The downstream Codex prompt assembly
        # falls back to analysis_context.json only and emits a ::warning::.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: workflow-log-output
          path: ${{ runner.temp }}/workflow-log-output

      - name: Summarize unselected runs (gpt-6-luna)
        id: summarize_unselected
        # Fail-open contract: this step widens analyzer coverage by adding
        # `log_summary` fields to runs that the collector did not deep-dive,
        # but it must never block the Codex pass. Errors only emit warnings.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          WORKFLOW_LOG_SUMMARY_MODEL: ${{ vars.WORKFLOW_LOG_SUMMARY_MODEL || 'openai/gpt-6-luna' }}
          WORKFLOW_LOG_SUMMARY_MAX_RUNS: ${{ vars.WORKFLOW_LOG_SUMMARY_MAX_RUNS || '100' }}
          WORKFLOW_LOG_SUMMARY_TOKEN_BUDGET: ${{ vars.WORKFLOW_LOG_SUMMARY_TOKEN_BUDGET || '1500000' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          if [ ! -f workflow_log_report.json ]; then
            echo "::warning::workflow_log_report.json not present; skipping mini summarization."
            exit 0
          fi

          # Validate `vars`-sourced numeric inputs in-shell so a typo like
          # vars.WORKFLOW_LOG_SUMMARY_MAX_RUNS="abc" doesn't crash argparse
          # before the Python script can emit a fail-open ::warning:: +
          # AI_MEMORY_TELEMETRY. Pattern matches the `^[0-9]+$` shell guard
          # used for MAX_CODEX_ATTEMPTS/CODEX_RETRY_BACKOFF_BASE_SECS later
          # in this workflow — negatives are rejected here (the script
          # treats 0 as "skip", so non-negative integers are the full
          # accepted range).
          max_summaries="${WORKFLOW_LOG_SUMMARY_MAX_RUNS}"
          token_budget="${WORKFLOW_LOG_SUMMARY_TOKEN_BUDGET}"
          if ! [[ "${max_summaries}" =~ ^[0-9]+$ ]]; then
            echo "::warning::Invalid WORKFLOW_LOG_SUMMARY_MAX_RUNS='${WORKFLOW_LOG_SUMMARY_MAX_RUNS}' (must be a non-negative integer); falling back to 100."
            max_summaries="100"
          fi
          if ! [[ "${token_budget}" =~ ^[0-9]+$ ]]; then
            echo "::warning::Invalid WORKFLOW_LOG_SUMMARY_TOKEN_BUDGET='${WORKFLOW_LOG_SUMMARY_TOKEN_BUDGET}' (must be a non-negative integer); falling back to 1500000."
            token_budget="1500000"
          fi

          python3 scripts/summarize_unselected_runs.py \
            --report workflow_log_report.json \
            --max-summaries "${max_summaries}" \
            --token-budget "${token_budget}"

      - name: Run workflow log analysis
        id: analyze
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WORKFLOW_EDITOR_MODEL: ${{ vars.WORKFLOW_LOG_ANALYSIS_MODEL || 'openai/gpt-6-sol' }}
          MAX_CODEX_ATTEMPTS: ${{ vars.MAX_CODEX_ATTEMPTS || '3' }}
          CODEX_RETRY_BACKOFF_BASE_SECS: ${{ vars.CODEX_RETRY_BACKOFF_BASE_SECS || '10' }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue || '0' }}
          RUN_LOGS_DIR: ${{ steps.download_log_output.outputs.download-path }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
          WORKFLOW_LOG_ANALYSIS_REPORT_CHECK_ENABLED: ${{ vars.WORKFLOW_LOG_ANALYSIS_REPORT_CHECK_ENABLED || 'true' }}
          WLA_WINDOW_START: ${{ needs.collect-logs.outputs.window_start }}
          WLA_WINDOW_END: ${{ needs.collect-logs.outputs.window_end }}
          # A repos_override run covers only some repositories, so its report
          # gets no window marker (a full-roster run must not start there).
          WLA_REPOS_OVERRIDE: ${{ github.event.inputs.repos_override || '' }}
        run: |
          set -euo pipefail

          # Source sanitize_codex_prompt_file (best-effort) so the
          # log-analysis prompt is UTF-8-clean before piping. Log
          # excerpts pulled from CI can carry control bytes from
          # downstream tool output that may include invalid UTF-8.
          # shellcheck source=/dev/null
          source scripts/gh_helpers.sh 2>/dev/null || true
          type emit_event >/dev/null 2>&1 || emit_event() { return 0; }
          _wla_label_retry() { if type gh_retry >/dev/null 2>&1; then gh_retry "$@"; else "$@"; fi; }
          _wla_label_create() { local _wla_err; _wla_err=$(gh label create "$@" 2>&1 >/dev/null) && return 0; case "${_wla_err}" in *"already exists"*) return 0 ;; esac; _wla_label_retry gh label create "$@"; }

          TRACKING_ISSUE_RAW="${TRACKING_ISSUE:-0}"
          TRACKING_ISSUE_NUM=""
          if ! [[ "${TRACKING_ISSUE_RAW}" =~ ^[0-9]+$ ]]; then
            echo "::error::tracking_issue must be 0 or a positive integer."
            exit 1
          fi
          if [ "${TRACKING_ISSUE_RAW}" -gt 0 ]; then
            TRACKING_ISSUE_NUM="${TRACKING_ISSUE_RAW}"
          fi

          if ! [[ "${MAX_CODEX_ATTEMPTS}" =~ ^[0-9]+$ ]] || [ "${MAX_CODEX_ATTEMPTS}" -lt 1 ]; then
            echo "::warning::MAX_CODEX_ATTEMPTS must be a positive integer (got: ${MAX_CODEX_ATTEMPTS}); defaulting to 3."
            MAX_CODEX_ATTEMPTS=3
          fi
          if ! [[ "${CODEX_RETRY_BACKOFF_BASE_SECS}" =~ ^[0-9]+$ ]] || [ "${CODEX_RETRY_BACKOFF_BASE_SECS}" -lt 1 ]; then
            echo "::warning::CODEX_RETRY_BACKOFF_BASE_SECS must be a positive integer (got: ${CODEX_RETRY_BACKOFF_BASE_SECS}); defaulting to 10."
            CODEX_RETRY_BACKOFF_BASE_SECS=10
          fi

          emit_log_analysis_phase_failure() {
            local failed_step_name="$1"
            local failure_mode="$2"
            local attempt_count="$3"
            local failure_summary="$4"

            if [ -z "${TRACKING_ISSUE_NUM}" ]; then
              echo "::warning::AI_PHASE_FAILURE_V1 skipped for log-analysis: no tracking issue context (step=${failed_step_name}, mode=${failure_mode})."
              emit_event "AI_PHASE_FAILURE_V1" \
                "schema_version=1" \
                "phase=workflow_log_analysis" \
                "failure_mode=${failure_mode}" \
                "failed_step_name=${failed_step_name}" \
                "workflow_run_id=${GITHUB_RUN_ID}" \
                "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}" \
                "workflow_name=${GITHUB_WORKFLOW}" \
                "workflow_file=workflow-log-analysis.yml" \
                "repository=${GITHUB_REPOSITORY}" \
                "tracking_issue=0" \
                "attempt_count=${attempt_count}" \
                "recommended_resume_action=retrigger_log_analysis" \
                "status=skipped" \
                "reason=no_tracking_issue"
              return 0
            fi

            local timestamp
            timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            local run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            local payload
            payload="$(jq -cn \
              --arg phase "workflow_log_analysis" \
              --arg failure_mode "${failure_mode}" \
              --arg failed_step_name "${failed_step_name}" \
              --arg workflow_run_id "${GITHUB_RUN_ID}" \
              --arg workflow_run_attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg workflow_name "${GITHUB_WORKFLOW}" \
              --arg workflow_file "workflow-log-analysis.yml" \
              --arg workflow_run_url "${run_url}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg tracking_issue "${TRACKING_ISSUE_NUM}" \
              --arg attempt_count "${attempt_count}" \
              --arg recommended_resume_action "retrigger_log_analysis" \
              --arg timestamp "${timestamp}" \
              '{
                schema_version: 1,
                phase: $phase,
                failure_mode: $failure_mode,
                failed_step_name: $failed_step_name,
                workflow_run_id: $workflow_run_id,
                workflow_run_attempt: $workflow_run_attempt,
                workflow_name: $workflow_name,
                workflow_file: $workflow_file,
                workflow_run_url: $workflow_run_url,
                repository: $repository,
                tracking_issue: $tracking_issue,
                attempt_count: $attempt_count,
                recommended_resume_action: $recommended_resume_action,
                timestamp: $timestamp
              }')"

            local comment_body
            comment_body="<!-- AI_PHASE_FAILURE_V1"$'\n'"${payload}"$'\n'"AI_PHASE_FAILURE_V1 -->"$'\n'"## ❌ Workflow log analysis failure"$'\n\n'"${failure_summary}"$'\n\n'"Run: ${run_url}"

            gh issue comment "${TRACKING_ISSUE_NUM}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "${comment_body}" >/dev/null 2>&1 || \
              echo "::warning::Failed to post AI_PHASE_FAILURE_V1 comment for tracking issue #${TRACKING_ISSUE_NUM}."
            emit_event "AI_PHASE_FAILURE_V1" \
              "schema_version=1" \
              "phase=workflow_log_analysis" \
              "failure_mode=${failure_mode}" \
              "failed_step_name=${failed_step_name}" \
              "workflow_run_id=${GITHUB_RUN_ID}" \
              "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}" \
              "workflow_name=${GITHUB_WORKFLOW}" \
              "workflow_file=workflow-log-analysis.yml" \
              "workflow_run_url=${run_url}" \
              "repository=${GITHUB_REPOSITORY}" \
              "tracking_issue=${TRACKING_ISSUE_NUM}" \
              "attempt_count=${attempt_count}" \
              "recommended_resume_action=retrigger_log_analysis" \
              "timestamp=${timestamp}"

            _wla_label_create "ai:log-analysis-failed" \
              --repo "${GITHUB_REPOSITORY}" \
              --color "e11d48" \
              --description "Workflow log analysis failed" >/dev/null 2>&1 || true

            GH_RETRY_IDEMPOTENT=true _wla_label_retry gh issue edit "${TRACKING_ISSUE_NUM}" \
              --repo "${GITHUB_REPOSITORY}" \
              --add-label "ai:log-analysis-failed" >/dev/null 2>&1 || \
              echo "::warning::Failed to apply ai:log-analysis-failed to #${TRACKING_ISSUE_NUM}."
          }

          handle_log_analysis_codex_failure() {
            local failed_step_name="$1"
            local failure_mode="$2"
            local attempt_count="$3"
            local codex_exit="$4"
            local failure_summary="$5"

            emit_log_analysis_phase_failure "${failed_step_name}" "${failure_mode}" "${attempt_count}" "${failure_summary}"

            if [ "${codex_exit}" -eq 0 ]; then
              exit 1
            fi
            exit "${codex_exit}"
          }

          REPORT_DATE="$(date -u +%F)"
          REPORT_DIR="analysis"
          REPORT_BASE="${REPORT_DIR}/workflow-optimization-${REPORT_DATE}"
          REPORT_FILE="${REPORT_BASE}.md"
          if [ -f "${REPORT_FILE}" ]; then
            REPORT_SUFFIX=2
            while [ -f "${REPORT_BASE}-${REPORT_SUFFIX}.md" ]; do
              REPORT_SUFFIX=$((REPORT_SUFFIX + 1))
            done
            REPORT_FILE="${REPORT_BASE}-${REPORT_SUFFIX}.md"
          fi

          ANALYSIS_CONTEXT_FILE=""
          ANALYZE_EXIT=0
          set +e
          ANALYSIS_CONTEXT_FILE="$(python3 scripts/analyze_workflow_logs.py --input workflow_log_report.json --output "${REPORT_FILE}" --codex-mode)"
          ANALYZE_EXIT=$?
          set -e

          if [ "${ANALYZE_EXIT}" -ne 0 ]; then
            failure_summary="Analyzer failed to prepare Codex context with exit code ${ANALYZE_EXIT}."
            echo "::error::${failure_summary}"
            handle_log_analysis_codex_failure "analysis_prepare_context" "analyzer_failed" "1" "${ANALYZE_EXIT}" "${failure_summary}"
          fi
          if [ -z "${ANALYSIS_CONTEXT_FILE}" ] || [ ! -f "${ANALYSIS_CONTEXT_FILE}" ]; then
            failure_summary="Analyzer did not produce a valid Codex context file path."
            echo "::error::${failure_summary}"
            handle_log_analysis_codex_failure "analysis_prepare_context" "missing_context_artifact" "1" 1 "${failure_summary}"
          fi

          # Verify the full-log directory artifact arrived before assembling
          # the prompt; without it Codex would fall back to the analysis
          # context's quick-index views and miss the untruncated step logs
          # that motivate the workflow-log-output artifact.
          # A missing artifact still publishes the report, with a fixed
          # data-gap line added after the analysis (project #9116, P2).
          wla_logs_missing="false"
          if [ -z "${RUN_LOGS_DIR:-}" ] || [ ! -d "${RUN_LOGS_DIR}" ]; then
            echo "::warning::workflow-log-output artifact not present at '${RUN_LOGS_DIR:-<unset>}'; Codex will only see analysis_context.json."
            RUN_LOGS_DIR=""
            wla_logs_missing="true"
            echo "WORKFLOW_LOG_ANALYSIS_COVERAGE logs=missing"
          fi

          wla_run_logs_include_args=()
          wla_run_logs_note=""
          if [ -n "${RUN_LOGS_DIR}" ]; then
            if ! RUN_LOGS_DIR="$(realpath -e -- "${RUN_LOGS_DIR}" 2>/dev/null)"; then
              echo "::warning::workflow-log-output path could not be resolved; using analysis_context.json only."
              RUN_LOGS_DIR=""
              wla_logs_missing="true"
              echo "WORKFLOW_LOG_ANALYSIS_COVERAGE logs=missing"
            elif ! [[ "${RUN_LOGS_DIR}" =~ ^/[A-Za-z0-9._@+/-]+$ ]] || [[ "${RUN_LOGS_DIR}" == *,* ]] || [[ "${RUN_LOGS_DIR}" == *"/../"* ]] || [[ "${RUN_LOGS_DIR}" == *"/.." ]]; then
              echo "::warning::workflow-log-output path is unsafe for the sandbox mount; using analysis_context.json only."
              RUN_LOGS_DIR=""
              wla_logs_missing="true"
              echo "WORKFLOW_LOG_ANALYSIS_COVERAGE logs=missing"
            else
              # Keep a bounded copy below the isolation helper's 256 MiB include limit.
              if wla_run_logs_result="$(python3 -I -B scripts/stage_workflow_log_bundle.py "${RUN_LOGS_DIR}" "${RUNNER_TEMP}/workflow-log-output-bounded" "$((200*1024*1024))")" \
                && wla_run_logs_path="$(printf '%s' "${wla_run_logs_result}" | jq -er '.path | select(type == "string")')" \
                && wla_run_logs_mode="$(printf '%s' "${wla_run_logs_result}" | jq -er '.mode | select(. == "full" or . == "bounded")')"; then
                if [[ "${wla_run_logs_path}" =~ ^/[A-Za-z0-9._@+/-]+$ ]] && [[ "${wla_run_logs_path}" != *,* ]] \
                  && [[ "${wla_run_logs_path}" != *"/../"* ]] && [[ "${wla_run_logs_path}" != *"/.." ]] && [ -d "${wla_run_logs_path}" ]; then
                  RUN_LOGS_DIR="${wla_run_logs_path}"
                  wla_run_logs_include_args=(--include "${RUN_LOGS_DIR}")
                  if [ "${wla_run_logs_mode}" = "bounded" ]; then
                    echo "::warning::workflow-log-output exceeded 200 MiB; mounting a bounded subset."
                    wla_run_logs_note="This is a bounded subset; read ${RUN_LOGS_DIR}/BOUNDED_SUBSET.txt for omitted runs."
                  fi
                else
                  echo "::warning::workflow-log-output staged path is unsafe; using analysis_context.json only."
                  RUN_LOGS_DIR=""
                  wla_logs_missing="true"
                  echo "WORKFLOW_LOG_ANALYSIS_COVERAGE logs=missing"
                fi
              else
                echo "::warning::workflow-log-output staging failed; using analysis_context.json only."
                RUN_LOGS_DIR=""
                wla_logs_missing="true"
                echo "WORKFLOW_LOG_ANALYSIS_COVERAGE logs=missing"
              fi
            fi
          fi

          # Build Semble prefetch (best-effort, fail-soft). Skipped silently
          # when SEMBLE_ENABLED=false, install failed, or the index build
          # failed — render_prompt.sh treats an empty SEMBLE_PREFETCH as a
          # blank-line substitution, so a Semble miss never blocks the pass.
          WLA_SEMBLE_PREFETCH=""
          if [ "${SEMBLE_INDEX_AVAILABLE:-false}" = "true" ] && [ -f scripts/semble_helpers.sh ]; then
            # shellcheck disable=SC1091
            source scripts/semble_helpers.sh || true
            if type semble_query_block >/dev/null 2>&1; then
              # `head -c 6000 | iconv -c` truncates by bytes then strips any
              # incomplete trailing UTF-8 sequence so a multi-byte character
              # split at the byte boundary doesn't garble the BM25 query.
              wla_query_text="$(head -c 6000 "${ANALYSIS_CONTEXT_FILE}" 2>/dev/null | iconv -f UTF-8 -t UTF-8 -c 2>/dev/null || true)"
              if [ -n "${wla_query_text}" ]; then
                WLA_SEMBLE_PREFETCH="$(semble_query_block "${wla_query_text}" 6 "Workflow Log Analysis Context" 2>/dev/null || true)"
              fi
            fi
          fi

          CODEX_PROMPT_FILE="$(mktemp)"
          {
            SEMBLE_PREFETCH="${WLA_SEMBLE_PREFETCH}" bash scripts/render_prompt.sh prompts/mode-workflow-analysis.txt
            echo
            echo "=== ANALYSIS CONTEXT ==="
            cat "${ANALYSIS_CONTEXT_FILE}"
            if [ -n "${RUN_LOGS_DIR}" ]; then
              echo
              echo "=== FULL RUN LOGS DIRECTORY ==="
              echo "Run-logs directory: ${RUN_LOGS_DIR}"
              echo "Mounted read-only in the sandbox at this path."
              echo "Layout: summary.json (top-level metrics), errors/ (full logs of failed runs), slow/ (full logs of longest runs by repo+family), recent/ (full logs of most recent runs)."
              echo "Each run subdirectory contains metadata.json plus untruncated step-NNN-<step>.log files. Read summary.json first, then drill into errors/, slow/, recent/ for evidence."
              if [ -n "${wla_run_logs_note}" ]; then
                echo "${wla_run_logs_note}"
              fi
            fi
          } > "${CODEX_PROMPT_FILE}"

          max_attempts="${MAX_CODEX_ATTEMPTS}"
          if ! [[ "${max_attempts}" =~ ^[0-9]+$ ]] || [ "${max_attempts}" -lt 1 ]; then
            echo "::warning::MAX_CODEX_ATTEMPTS must be a positive integer (got: ${max_attempts}); defaulting to 3."
            max_attempts="3"
          fi
          codex_failure_mode=""
          analyze_attempts_used=0
          # Report structure check (project #9116, P2). false/0/no/off restores
          # the plain non-empty check; any other value keeps it on. A checker
          # exit other than 1 is a checker error and accepts the report (fail open).
          wla_report_check_enabled="true"
          case "$(printf '%s' "${WORKFLOW_LOG_ANALYSIS_REPORT_CHECK_ENABLED:-true}" | tr '[:upper:]' '[:lower:]')" in
            false|0|no|off) wla_report_check_enabled="false" ;;
          esac
          if [ "${wla_report_check_enabled}" = "true" ] && [ ! -f scripts/check_workflow_analysis_report.py ]; then
            echo "::warning::scripts/check_workflow_analysis_report.py not present; skipping the report structure check."
            wla_report_check_enabled="false"
          fi
          # The codex command of this pass, unchanged (AI_ENGINE_LOG_ANALYSIS=codex, or
          # no trusted engine support). Claude runs it as the fallback.
          wla_codex_analyze()
          {
            bash scripts/codex_heartbeat.sh \
              --phase workflow_log_analysis \
              --stdout-file "${REPORT_FILE}" \
              -- bash scripts/codex_isolated_exec.sh run --mode read-only ${wla_run_logs_include_args[@]+"${wla_run_logs_include_args[@]}"} -- --ask-for-approval never -c model_verbosity=low -c include_apply_patch_tool=true exec --skip-git-repo-check --model "${WORKFLOW_EDITOR_MODEL}" --sandbox danger-full-access < "${CODEX_PROMPT_FILE}" 2> >(tee -a /tmp/workflow-analysis-codex.log >&2)
          }
          wla_engine_ready()
          {
            [ -n "${CLAUDE_ENGINE_SUPPORT_DIR:-}" ] && [ -f "${CLAUDE_ENGINE_SUPPORT_DIR}/scripts/ai_engine.sh" ] && [ ! -L "${CLAUDE_ENGINE_SUPPORT_DIR}/scripts/ai_engine.sh" ]
          }
          for attempt in $(seq 1 "${max_attempts}"); do
            analyze_attempts_used="${attempt}"
            if command -v sanitize_codex_prompt_file >/dev/null 2>&1; then
              sanitize_codex_prompt_file "${CODEX_PROMPT_FILE}"
            fi
            set +e
            # The agent reads workflow logs from every consumer repo; it runs in the
            # credential-free, network-isolated container (scripts/codex_isolated_exec.sh).
            # Engine selection (role LOG_ANALYSIS): Claude in the same isolated container
            # via claude_run_selected, the codex command above as its fallback.
            if wla_engine_ready; then
              (
                unset GH_TOKEN GITHUB_TOKEN TG_BOT_SECRET TG_ADMIN_CHAT_ID TG_CHAT_ID
                # shellcheck disable=SC1091
                if ! source "${CLAUDE_ENGINE_SUPPORT_DIR}/scripts/ai_engine.sh"; then
                  echo "AI_ENGINE_FALLBACK role=LOG_ANALYSIS reason=engine_support_missing" >&2
                  wla_codex_analyze
                  exit $?
                fi
                AI_ENGINE_MODEL_HINT="${WORKFLOW_EDITOR_MODEL}" AI_ENGINE_EFFORT_HINT="" \
                  claude_run_selected LOG_ANALYSIS "${CODEX_PROMPT_FILE}" "${REPORT_FILE}" "${PWD}" -- wla_codex_analyze
              )
            else
              echo "AI_ENGINE_FALLBACK role=LOG_ANALYSIS reason=engine_support_missing" >&2
              wla_codex_analyze
            fi
            ANALYZE_EXIT=$?
            set -e
            if [ "${ANALYZE_EXIT}" -eq 80 ]; then
              # Claude capacity wait (issue #7370): no codex fallback and no
              # retries against a gated pool; this scheduled pass runs again
              # on its next trigger.
              echo "AI_ENGINE_CAPACITY_WAIT role=LOG_ANALYSIS outcome=deferred stage=workflow_log_analysis"
              echo "::error::Claude pool at capacity (role LOG_ANALYSIS); stopping this pass without codex fallback or retries."
              exit 80
            fi
            if [ "${ANALYZE_EXIT}" -eq 0 ] && grep -q '[^[:space:]]' "${REPORT_FILE}"; then
              if [ "${wla_report_check_enabled}" != "true" ]; then
                codex_failure_mode=""
                break
              fi
              set +e
              python3 -I -B scripts/check_workflow_analysis_report.py --report "${REPORT_FILE}" --collect-report workflow_log_report.json
              wla_report_check_rc=$?
              set -e
              if [ "${wla_report_check_rc}" -eq 0 ]; then
                codex_failure_mode=""
                break
              elif [ "${wla_report_check_rc}" -eq 1 ]; then
                codex_failure_mode="report_structure_invalid"
              else
                echo "::warning::The report structure check errored (rc=${wla_report_check_rc}); accepting the report."
                codex_failure_mode=""
                break
              fi
            elif [ "${ANALYZE_EXIT}" -ne 0 ]; then
              codex_failure_mode="codex_rc_nonzero"
            else
              codex_failure_mode="codex_empty_output"
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              sleep_secs=$((CODEX_RETRY_BACKOFF_BASE_SECS * (2 ** (attempt - 1))))
              sleep "${sleep_secs}"
            else
              if [ "${codex_failure_mode}" = "report_structure_invalid" ]; then
                # Held back from the branch: analysis_status is never set, so
                # Commit and push report does not run; the upload step keeps it.
                # The handler exits, so add the data-gap line here as well.
                if [ "${wla_logs_missing}" = "true" ] && ! python3 -I -B scripts/check_workflow_analysis_report.py --insert-data-gap --report "${REPORT_FILE}"; then
                  echo "::warning::Could not add the data-gap line to the held report."
                fi
                echo "held_report_file=${REPORT_FILE}" >> "$GITHUB_OUTPUT"
                failure_summary="Workflow log analysis report failed the report structure check after ${max_attempts} attempts; held back from the branch, kept as artifact workflow-log-analysis-report."
                echo "::error::${failure_summary}"
                handle_log_analysis_codex_failure "analysis_codex_pass" "report_structure_invalid" "${analyze_attempts_used}" 0 "${failure_summary}"
              fi
              if [ "${codex_failure_mode}" = "codex_empty_output" ]; then
                failure_summary="Workflow log analysis Codex pass returned empty output after ${max_attempts} attempts."
                echo "::error::${failure_summary}"
                handle_log_analysis_codex_failure "analysis_codex_pass" "codex_empty_output" "${analyze_attempts_used}" 0 "${failure_summary}"
              fi
              failure_summary="Workflow log analysis Codex pass failed after ${max_attempts} attempts with exit code ${ANALYZE_EXIT}."
              echo "::error::${failure_summary}"
              handle_log_analysis_codex_failure "analysis_codex_pass" "codex_rc_nonzero" "${analyze_attempts_used}" "${ANALYZE_EXIT}" "${failure_summary}"
            fi
          done

          # --- window marker (plan P4) begin ---
          # First line of the published report records the collection window,
          # so a later since_last_report run starts where this one ended. The
          # values are re-validated here; on any failure the report is
          # published without the marker (the next run then picks an older
          # marker or the lookback window: overlap only, never a gap). Written
          # before the data-gap line, which check_workflow_analysis_report.py
          # places under the marker (WINDOW_MARKER_RE).
          wla_marker_iso_re='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          wla_marker_start="${WLA_WINDOW_START:-}"
          wla_marker_end="${WLA_WINDOW_END:-}"
          wla_marker_run="${GITHUB_RUN_ID:-}"
          wla_marker_override="${WLA_REPOS_OVERRIDE:-}"
          if [ -n "${wla_marker_override//[[:space:]]/}" ]; then
            echo "::warning::repos_override limited this run to some repositories; publishing the report without the window marker so a later since_last_report run does not skip the others."
          elif [[ "${wla_marker_end}" =~ ${wla_marker_iso_re} ]] \
            && { [ "${wla_marker_start}" = "unknown" ] || [[ "${wla_marker_start}" =~ ${wla_marker_iso_re} ]]; } \
            && [[ "${wla_marker_run}" =~ ^[0-9]+$ ]] && [ -f "${REPORT_FILE}" ]; then
            wla_marker_first="$(head -n 1 "${REPORT_FILE}" 2>/dev/null || true)"
            if [[ "${wla_marker_first}" != "<!-- workflow-log-analysis:"* ]]; then
              wla_marker_tmp="$(mktemp "$(dirname "${REPORT_FILE}")/.wla-marker.XXXXXX" 2>/dev/null || true)"
              if [ -n "${wla_marker_tmp}" ] \
                && { printf '<!-- workflow-log-analysis: window_start=%s window_end=%s run=%s -->\n' "${wla_marker_start}" "${wla_marker_end}" "${wla_marker_run}"; cat "${REPORT_FILE}"; } > "${wla_marker_tmp}" \
                && chmod 0644 "${wla_marker_tmp}" && mv -f "${wla_marker_tmp}" "${REPORT_FILE}"; then
                :
              else
                [ -n "${wla_marker_tmp}" ] && rm -f "${wla_marker_tmp}"
                echo "::warning::Could not add the window marker to the report; publishing it without the marker."
              fi
            fi
          else
            echo "::warning::Collection window unavailable or invalid; publishing the report without the window marker."
          fi
          # --- window marker (plan P4) end ---

          if [ "${wla_logs_missing}" = "true" ]; then
            if ! python3 -I -B scripts/check_workflow_analysis_report.py --insert-data-gap --report "${REPORT_FILE}"; then
              echo "::warning::Could not add the data-gap line to the report; publishing it without the line."
            fi
          fi

          echo "report_file=${REPORT_FILE}" >> "$GITHUB_OUTPUT"
          echo "analysis_status=completed" >> "$GITHUB_OUTPUT"

      # Keeps the report as an artifact, including one held back by the
      # structure check (held_report_file) that never reaches the branch.
      - name: Upload workflow log analysis report
        if: always() && (steps.analyze.outputs.report_file != '' || steps.analyze.outputs.held_report_file != '')
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: workflow-log-analysis-report
          path: ${{ steps.analyze.outputs.report_file || steps.analyze.outputs.held_report_file }}
          if-no-files-found: warn
          retention-days: 30

      - name: Render workflow scenario traces
        if: steps.analyze.outputs.analysis_status == 'completed' && env.WORKFLOW_LOG_SCENARIO_TRACE_ENABLED == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          # The renderer logs WORKFLOW_SCENARIO_TRACE_WRITTEN on successful
          # writes and WORKFLOW_SCENARIO_TRACE_PARSE_FAIL on fail-open per-run
          # skips. Traces stay local-only under the gitignored .ai/ path.
          TRACE_OUTPUT_DIR=".ai/workflow_traces"
          mkdir -p "${TRACE_OUTPUT_DIR}"
          python3 scripts/render_scenario_trace.py \
            --input workflow_log_report.json \
            --output-dir "${TRACE_OUTPUT_DIR}"

      - name: Commit and push report
        id: commit_report
        if: steps.analyze.outputs.analysis_status == 'completed'
        env:
          REPORT_RETENTION_DAYS: ${{ vars.WORKFLOW_LOG_ANALYSIS_REPORT_RETENTION_DAYS || '30' }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          # One-shot credential helper (§23.E): the checkout does not persist
          # credentials, so git reads GH_TOKEN from this step's env only.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { printf "username=x-access-token\npassword=%s\n" "${GH_TOKEN}"; }; f'
          # Same trusted-marker set the promote cycle and poller use, so the
          # purge keeps every doc a trusted marker names.
          COMPREHENSIVE_CYCLE_MARKER_TRUSTED_ASSOCIATIONS: ${{ vars.COMPREHENSIVE_CYCLE_MARKER_TRUSTED_ASSOCIATIONS || 'OWNER,MEMBER,COLLABORATOR' }}
          # true (default): deliver the report through a pull request from a
          # run-unique branch. false/0/no/off: legacy direct push to the
          # dispatch branch, unchanged.
          WORKFLOW_LOG_ANALYSIS_REPORT_VIA_PR: ${{ vars.WORKFLOW_LOG_ANALYSIS_REPORT_VIA_PR || 'true' }}
          # Minutes (0-20) to wait for auto-merge to land the report before
          # the step ends; 0 disables the wait. Git polling only.
          WORKFLOW_LOG_ANALYSIS_REPORT_MERGE_WAIT_MINUTES: ${{ vars.WORKFLOW_LOG_ANALYSIS_REPORT_MERGE_WAIT_MINUTES || '10' }}
          # Passed through env (not inlined) so the LLM-run analyze output
          # never reaches the shell as code; validated below.
          WLA_ANALYZE_REPORT_FILE: ${{ steps.analyze.outputs.report_file }}
        run: |
          set -euo pipefail

          REPORT_FILE="${WLA_ANALYZE_REPORT_FILE:-}"
          # The analyze step only writes analysis/workflow-optimization-<date>(-N).md;
          # anything else (empty, ../, shell metacharacters) is refused before
          # any git or gh write.
          if [[ ! "${REPORT_FILE}" =~ ^analysis/workflow-optimization-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]+)?\.md$ ]]; then
            echo "::error::Unexpected workflow log analysis report path from the analyze step; refusing to commit it."
            exit 1
          fi
          report_delivery_mode="pr"
          case "$(printf '%s' "${WORKFLOW_LOG_ANALYSIS_REPORT_VIA_PR:-true}" | tr '[:upper:]' '[:lower:]')" in
            false|0|no|off) report_delivery_mode="push" ;;
            true|1|yes|on|"") ;;
            *) echo "::warning::WORKFLOW_LOG_ANALYSIS_REPORT_VIA_PR has an unrecognized value; delivering the report through a pull request (set false to keep the direct push)." ;;
          esac
          REPORT_PR_BRANCH=""
          if [ "${report_delivery_mode}" = "pr" ]; then
            REPORT_PR_BRANCH="auto/workflow-log-analysis-report-${GITHUB_RUN_ID:-}-${GITHUB_RUN_ATTEMPT:-}"
            if [[ ! "${REPORT_PR_BRANCH}" =~ ^auto/workflow-log-analysis-report-[0-9]+-[0-9]+$ ]]; then
              echo "::error::Could not build the report PR branch name from GITHUB_RUN_ID/GITHUB_RUN_ATTEMPT (got '${REPORT_PR_BRANCH}')."
              exit 1
            fi
          fi
          if [ "${GITHUB_REF_TYPE:-}" != "branch" ]; then
            echo "::error::Workflow log analysis can only push report updates from branch refs (got ref_type='${GITHUB_REF_TYPE:-unknown}', ref_name='${GITHUB_REF_NAME:-unknown}')."
            exit 1
          fi
          TARGET_BRANCH="${GITHUB_REF_NAME:-}"
          if [ -z "${TARGET_BRANCH}" ]; then
            echo "::error::Workflow log analysis can only push report updates from branch refs (got ref_type='${GITHUB_REF_TYPE:-unknown}', ref_name='${GITHUB_REF_NAME:-unknown}')."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Age-based purge: delete analysis/workflow-optimization-<date>(-N).md
          # files whose date stamp in the filename is older than the retention
          # window. Filename dates are authoritative — mtime would reset on
          # every checkout. The just-written REPORT_FILE is excluded.
          # Retention applies only to docs the recommendation processing
          # report records (plan P5, decision D5): a doc past the window that
          # no apply-analysis run has processed yet is kept and logged
          # reason=unprocessed, and when that report is missing or unreadable
          # nothing is purged (reason=processing_report_unavailable). Same
          # fail-closed rule as the in-flight guard below (issue #7022).
          retention_raw="${REPORT_RETENTION_DAYS:-30}"
          if ! [[ "${retention_raw}" =~ ^[0-9]+$ ]] || [ "${retention_raw}" -lt 1 ]; then
            echo "::warning::WORKFLOW_LOG_ANALYSIS_REPORT_RETENTION_DAYS must be a positive integer (got: ${retention_raw}); defaulting to 30."
            retention_raw=30
          fi
          # Fail-open: if cutoff computation fails, skip the purge entirely
          # rather than fall back to today (which would delete every prior
          # report). The previous fallback `|| date -u +%Y-%m-%d` was unsafe
          # for that reason.
          purged_count=0
          cutoff_date=""
          # Never purge a doc an open apply-analysis project still reads: its
          # plan and implement stages read the doc from the default branch,
          # and the project's own final PR deletes it. Issue #7022 blocked when
          # a doc was purged from main before its project could read it. When
          # the open projects cannot be read, skip the purge (fail closed; a
          # report kept one more day costs nothing).
          purge_in_flight_docs=""
          purge_guard_ok="true"
          if ! purge_in_flight_docs="$(APPLY_ANALYSIS_IN_FLIGHT_DOCS=true bash scripts/apply_analysis_on_main.sh)"; then
            purge_guard_ok="false"
            echo "::warning::Could not list the analysis docs open apply-analysis projects use (or an orchestrator run is still creating a project); skipping the age-based purge this run."
          fi
          # Never purge a doc the apply-analysis loop has not processed yet
          # (issue #8963: commit 0fcc49b2 purged the unprocessed 09-24 docs).
          # "Processed" means the doc's basename is listed in the processing
          # report, the same grep -qF test unprocessed_docs() uses in
          # scripts/apply_analysis_on_main.sh. A missing or unreadable
          # processing report skips the whole purge (fail closed).
          # Same path and default as scripts/apply_analysis_on_main.sh.
          purge_processing_report="${APPLY_ANALYSIS_REPORT_PATH:-analysis/recommendation-processing-report.md}"
          purged_docs_list=""
          if [ "${purge_guard_ok}" = "true" ] && { [ ! -f "${purge_processing_report}" ] || [ ! -r "${purge_processing_report}" ]; }; then
            purge_guard_ok="false"
            echo "WORKFLOW_LOG_ANALYSIS_PURGE_SKIPPED reason=processing_report_unavailable"
            echo "::warning::WORKFLOW_LOG_ANALYSIS_PURGE_SKIPPED doc=all reason=processing_report_missing path=${purge_processing_report}"
          fi
          if [ "${purge_guard_ok}" = "true" ] && cutoff_date="$(date -u -d "${retention_raw} days ago" +%Y-%m-%d 2>/dev/null)" && [ -n "${cutoff_date}" ]; then
            shopt -s nullglob
            for old_report in analysis/workflow-optimization-*.md; do
              [ "${old_report}" = "${REPORT_FILE}" ] && continue
              if printf '%s\n' "${purge_in_flight_docs}" | grep -qxF -- "${old_report}"; then
                echo "WORKFLOW_LOG_ANALYSIS_PURGE_SKIPPED doc=${old_report} reason=in_flight_project"
                continue
              fi
              filename="$(basename "${old_report}")"
              # Match workflow-optimization-YYYY-MM-DD(-N).md and capture only
              # the date stamp; greedy parameter expansion (e.g. ${s%%-[0-9]*})
              # would chop the month/day off the date itself.
              if [[ ! "${filename}" =~ ^workflow-optimization-([0-9]{4}-[0-9]{2}-[0-9]{2})(-[0-9]+)?\.md$ ]]; then
                continue
              fi
              stamp="${BASH_REMATCH[1]}"
              if [[ "${stamp}" < "${cutoff_date}" ]]; then
                # Fixed-string basename match, as apply_analysis_on_main.sh
                # uses; a read error (grep rc 2) also keeps the doc.
                if ! grep -qF -- "${filename}" "${purge_processing_report}"; then
                  echo "WORKFLOW_LOG_ANALYSIS_PURGE_SKIPPED doc=${old_report} reason=unprocessed"
                  continue
                fi
                git rm -- "${old_report}" >/dev/null
                purged_count=$((purged_count + 1))
                purged_docs_list="${purged_docs_list:+${purged_docs_list} }${old_report}"
              fi
            done
            shopt -u nullglob
          elif [ "${purge_guard_ok}" = "true" ]; then
            echo "::warning::Unable to compute report purge cutoff date for retention window (${retention_raw} days); skipping age-based purge to avoid accidental deletions."
          fi
          if [ "${purged_count}" -gt 0 ]; then
            echo "INFO: purged ${purged_count} workflow-optimization report(s) older than ${cutoff_date}."
          fi

          git add "${REPORT_FILE}"
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "report_file=${REPORT_FILE}" >> "$GITHUB_OUTPUT"
            echo "report_branch=" >> "$GITHUB_OUTPUT"
            echo "purged_docs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${purged_count}" -gt 0 ]; then
            commit_msg="chore: add workflow log analysis report (purged ${purged_count} older than ${retention_raw}d)"
          else
            commit_msg="chore: add workflow log analysis report"
          fi
          git commit -m "${commit_msg}"

          # Issue #8963: the default branch requires status checks with no
          # bypass actors, so the report goes to a branch for this run. In PR
          # mode (WORKFLOW_LOG_ANALYSIS_REPORT_VIA_PR) this step opens and
          # merges the PR for it below; REPORT_BRANCH names the same run
          # branch as REPORT_PR_BRANCH.
          if ! [[ "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ ]] || ! [[ "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT must be numeric to name the report branch."
            exit 1
          fi
          REPORT_BRANCH="auto/workflow-log-analysis-report-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # Concurrent runs of this workflow can each pick the same dated
          # suffix (e.g. "...-3.md") because the suffix is derived from
          # the local checkout in the analyze step, before Codex runs for
          # 30+ minutes. By push time, another run may have already
          # published the same path on TARGET_BRANCH.
          # Retry-with-rename: fetch the latest tip, and if our path
          # already exists upstream, rename our report to the next free
          # suffix (considering both the local checkout and origin),
          # amend the commit, and retry the push. deliver-report repeats
          # the check against other open report PR branches.
          REPORT_BASE=""
          if [[ "${REPORT_FILE}" =~ ^(analysis/workflow-optimization-[0-9]{4}-[0-9]{2}-[0-9]{2})(-[0-9]+)?\.md$ ]]; then
            REPORT_BASE="${BASH_REMATCH[1]}"
          fi
          report_last_pushed_sha=""
          # The ref this step pushes to: the dispatch branch in push mode,
          # the run branch in PR mode. Named in the push failure lines.
          wla_push_target="${TARGET_BRANCH}"
          if [ "${report_delivery_mode}" = "pr" ]; then
            wla_push_target="${REPORT_PR_BRANCH}"
          fi
          push_log="$(mktemp)"
          trap 'rm -f "${push_log}"' EXIT
          push_attempt=0
          push_max_attempts=5
          push_backoff_secs=5
          while : ; do
            push_attempt=$((push_attempt + 1))
            # Allow a transient fetch failure to be absorbed by the
            # retry loop instead of killing the step under `set -e`.
            # When the fetch fails we skip the upstream-collision check
            # for this iteration; the rebase below does its own fetch.
            # PR mode: a report from an earlier run can still be waiting in
            # its open or auto-merging PR, so it is not on TARGET_BRANCH yet.
            # Fetch the other pending report branches (git only, no API
            # call) and treat their paths as taken too; otherwise the two
            # PRs add the same path and the later one can never merge.
            # Fetched before TARGET_BRANCH so FETCH_HEAD stays the target.
            wla_pending_refs=""
            if [ "${report_delivery_mode}" = "pr" ]; then
              # A --depth fetch fails when the glob matches nothing, so list
              # the branches first; none pending means nothing to fetch.
              wla_pending_heads=""
              wla_pending_list_ok=1
              wla_pending_heads="$(git ls-remote --heads origin 'refs/heads/auto/workflow-log-analysis-report-*' 2>/dev/null)" || wla_pending_list_ok=0
              if [ "${wla_pending_list_ok}" -eq 1 ] && [ -z "${wla_pending_heads}" ]; then
                :
              elif [ "${wla_pending_list_ok}" -eq 1 ] \
                 && git fetch --prune --depth=1 origin '+refs/heads/auto/workflow-log-analysis-report-*:refs/remotes/wla-pending/*' 2>/dev/null; then
                wla_pending_refs="$(git for-each-ref --format='%(refname)' refs/remotes/wla-pending/ | grep -vxF "refs/remotes/wla-pending/${GITHUB_RUN_ID:-}-${GITHUB_RUN_ATTEMPT:-}" || true)"
              else
                echo "::warning::Could not fetch pending workflow log analysis report branches; checking only ${TARGET_BRANCH} for a report path collision."
              fi
            fi
            wla_path_pending()
            {
              local wla_ref
              for wla_ref in ${wla_pending_refs}; do
                if git cat-file -e "${wla_ref}:$1" 2>/dev/null; then
                  return 0
                fi
              done
              return 1
            }

            fetch_ok=1
            git fetch origin "${TARGET_BRANCH}" --depth=1 || fetch_ok=0

            if [ -n "${REPORT_BASE}" ] \
               && { { [ "${fetch_ok}" -eq 1 ] && git cat-file -e "FETCH_HEAD:${REPORT_FILE}" 2>/dev/null; } \
                    || wla_path_pending "${REPORT_FILE}"; }; then
              next_suffix=2
              while [ -e "${REPORT_BASE}-${next_suffix}.md" ] \
                 || { [ "${fetch_ok}" -eq 1 ] && git cat-file -e "FETCH_HEAD:${REPORT_BASE}-${next_suffix}.md" 2>/dev/null; } \
                 || wla_path_pending "${REPORT_BASE}-${next_suffix}.md"; do
                next_suffix=$((next_suffix + 1))
              done
              NEW_REPORT_FILE="${REPORT_BASE}-${next_suffix}.md"
              echo "INFO: '${REPORT_FILE}' already exists on origin/${TARGET_BRANCH}; renaming to '${NEW_REPORT_FILE}' to avoid concurrent-write collision."
              git mv -- "${REPORT_FILE}" "${NEW_REPORT_FILE}"
              REPORT_FILE="${NEW_REPORT_FILE}"
              git commit --amend --no-edit
            fi

            # A retry leases to the run branch's current remote head: only
            # this run and attempt writes that branch, and an earlier push
            # may have landed even though the client saw a failure.
            if [ "${report_delivery_mode}" = "pr" ] && [ "${push_attempt}" -gt 1 ]; then
              report_last_pushed_sha="$(git ls-remote origin "refs/heads/${REPORT_PR_BRANCH}" 2>/dev/null | cut -f1 || true)"
            fi
            # The push output goes to push_log so a ruleset refusal (#8963)
            # is classified below; it is printed with URL credentials masked.
            : >"${push_log}"
            push_exit=1
            if [ "${report_delivery_mode}" = "push" ]; then
              if git pull --rebase origin "${TARGET_BRANCH}" \
                 && git push origin "HEAD:${TARGET_BRANCH}" >"${push_log}" 2>&1; then
                push_exit=0
              fi
            # PR mode: rebase onto the target tip the same way, but push to
            # the run-unique branch. The forced push is limited to that
            # branch and leased to its remote head as read before a retry
            # (nothing on the first push), so a retry can replace this run's
            # own earlier push but never a head pushed after that read.
            # TARGET_BRANCH is never forced.
            elif git pull --rebase origin "${TARGET_BRANCH}" \
               && git push --force-with-lease="refs/heads/${REPORT_PR_BRANCH}:${report_last_pushed_sha}" origin "HEAD:refs/heads/${REPORT_PR_BRANCH}" >"${push_log}" 2>&1; then
              report_last_pushed_sha="$(git rev-parse HEAD)"
              push_exit=0
            fi
            sed -E 's#(https?://)[^/@[:space:]]+@#\1***@#g' "${push_log}" >&2 || true
            if [ "${push_exit}" -eq 0 ]; then
              break
            fi
            if grep -qiE 'GH006|GH013|protected branch|push declined|repository rule' "${push_log}"; then
              echo "::error::WORKFLOW_LOG_ANALYSIS_REPORT_DELIVERY outcome=failed reason=push_rejected_by_ruleset branch=${wla_push_target}"
              exit 1
            fi

            if [ "${push_attempt}" -ge "${push_max_attempts}" ]; then
              echo "::error::Could not push workflow log analysis report after ${push_attempt} attempt(s) (target=${wla_push_target}, file=${REPORT_FILE})."
              echo "::error::WORKFLOW_LOG_ANALYSIS_REPORT_DELIVERY outcome=failed reason=push_failed branch=${wla_push_target}"
              exit 1
            fi
            echo "::warning::Workflow log analysis report push attempt ${push_attempt} failed; retrying in ${push_backoff_secs}s."
            sleep "${push_backoff_secs}"
            # Exponential backoff capped at 60s so transient flakes don't
            # exhaust the attempt budget in rapid succession.
            push_backoff_secs=$(( push_backoff_secs * 2 ))
            if [ "${push_backoff_secs}" -gt 60 ]; then
              push_backoff_secs=60
            fi
          done

          report_delivery="pushed"
          report_pr_number=""
          report_pr_url=""
          report_branch="${TARGET_BRANCH}"
          if [ "${report_delivery_mode}" = "pr" ]; then
            report_branch="${REPORT_PR_BRANCH}"
            # GitHub API budget (unattended_system_instructions.md §14): at
            # most 3 gh calls per committed run -- gh pr create, the direct
            # gh pr merge, and the gh pr merge --auto fallback -- plus one
            # gh pr list only when create reports the PR already exists.
            # None when nothing changed and none in push mode. Calls audited:
            # the only other API use in this step is the in-flight purge guard
            # (scripts/apply_analysis_on_main.sh), which reads tracking issues
            # and orchestrator runs and returns no PR data to reuse.
            report_pr_body_file="${RUNNER_TEMP:-/tmp}/wla_report_pr_body.md"
            report_run_url="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-}"
            # Fixed text only: no issue references (never the tracking_issue
            # input), so the PR cannot auto-close an orchestrator tracking issue.
            {
              printf '## Workflow log analysis report\n\n'
              printf -- '- Report: `%s`\n' "${REPORT_FILE}"
              printf -- '- Run: %s\n\n' "${report_run_url}"
              printf 'Generated by workflow-log-analysis.yml.\n'
            } > "${report_pr_body_file}"
            if ! python3 scripts/lint_pr_body_auto_close.py --pr-body-file "${report_pr_body_file}" --fail-open-on-lookup-error; then
              echo "::error::The workflow log analysis report PR body failed the auto-close keyword lint; not opening the PR (branch ${REPORT_PR_BRANCH} keeps the report)."
              exit 1
            fi

            # Single attempt: a PR create is not idempotent.
            report_pr_create_rc=0
            report_pr_create_out="$(gh pr create \
              --base "${TARGET_BRANCH}" \
              --head "${REPORT_PR_BRANCH}" \
              --title "chore: add workflow log analysis report (${REPORT_FILE})" \
              --body-file "${report_pr_body_file}" 2>&1)" || report_pr_create_rc=$?
            if [ "${report_pr_create_rc}" -eq 0 ]; then
              # Host-independent (GitHub Enterprise Server too): take the
              # first .../pull/<n> URL gh printed.
              report_pr_url="$(printf '%s\n' "${report_pr_create_out}" | grep -oE 'https?://[^[:space:]]+/pull/[0-9]+' | head -n1 || true)"
              report_pr_number="$(printf '%s' "${report_pr_url}" | sed -nE 's#.*/pull/([0-9]+)$#\1#p')"
            elif printf '%s' "${report_pr_create_out}" | grep -qiE 'pull request for branch .* already exists'; then
              report_pr_lookup="$(gh pr list --head "${REPORT_PR_BRANCH}" --base "${TARGET_BRANCH}" --state open --json number,url --jq '.[0] | "\(.number) \(.url)"' 2>/dev/null || true)"
              report_pr_number="$(printf '%s' "${report_pr_lookup}" | awk '{print $1}')"
              report_pr_url="$(printf '%s' "${report_pr_lookup}" | awk '{print $2}')"
            else
              printf '%s\n' "${report_pr_create_out}" >&2
              echo "::error::Could not open the workflow log analysis report PR (base=${TARGET_BRANCH}, head=${REPORT_PR_BRANCH}); the report stays on ${REPORT_PR_BRANCH}. Set WORKFLOW_LOG_ANALYSIS_REPORT_VIA_PR=false to restore the direct push."
              exit 1
            fi
            if [[ ! "${report_pr_number}" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not read the workflow log analysis report PR number (base=${TARGET_BRANCH}, head=${REPORT_PR_BRANCH})."
              exit 1
            fi

            # No admin bypass: branch protection and required checks still
            # apply. --match-head-commit refuses a head anyone pushed after
            # this run's own push.
            report_head_sha="$(git rev-parse HEAD)"
            report_merge_requested=""
            # A report PR can land long after the purge guard ran (#7022): a
            # merge queue accepts even the direct merge (exit 0) and lands it
            # later, and auto-merge waits for checks. An apply-analysis
            # project dispatched meanwhile could read a doc this PR deletes.
            # So the age-based purge deletions leave the PR before any merge
            # call; apply-analysis deletes the docs it processes, and push
            # mode (WORKFLOW_LOG_ANALYSIS_REPORT_VIA_PR=false) still purges.
            report_purge_drop_ok=1
            report_purged_paths="$(git diff --name-only --diff-filter=D HEAD~1 HEAD -- 'analysis/workflow-optimization-*.md' 2>/dev/null)" || report_purge_drop_ok=0
            if [ "${report_purge_drop_ok}" -eq 1 ] && [ -n "${report_purged_paths}" ]; then
              if printf '%s\n' "${report_purged_paths}" | xargs -d '\n' git checkout HEAD~1 -- \
                 && git commit --amend -q -m "chore: add workflow log analysis report" \
                 && git push --force-with-lease="refs/heads/${REPORT_PR_BRANCH}:${report_last_pushed_sha}" origin "HEAD:refs/heads/${REPORT_PR_BRANCH}"; then
                report_last_pushed_sha="$(git rev-parse HEAD)"
                report_head_sha="${report_last_pushed_sha}"
                # The docs stay, so purged_docs must not name them.
                purged_docs_list=""
                echo "WORKFLOW_LOG_ANALYSIS_PURGE_SKIPPED reason=auto_merge_pending count=$(printf '%s\n' "${report_purged_paths}" | wc -l | tr -d ' ')"
              else
                report_purge_drop_ok=0
              fi
            fi
            if [ "${report_purge_drop_ok}" -ne 1 ]; then
              echo "::warning::Could not remove the purge deletions from report PR ${report_pr_url:-#${report_pr_number}}; not merging it or arming auto-merge. The PR still deletes the docs this run's purge guard chose: drop those deletions (or close the PR and re-run) before merging it by hand."
            elif gh pr merge "${report_pr_number}" --squash --match-head-commit "${report_head_sha}"; then
              # A merge queue can accept the PR (exit 0) without merging it
              # yet, so the landing check below decides pr_merged.
              report_merge_requested="direct"
            elif gh pr merge "${report_pr_number}" --auto --squash --match-head-commit "${report_head_sha}"; then
              report_merge_requested="auto"
            fi
            if [ -n "${report_merge_requested}" ]; then
              report_delivery="pr_auto_merge"
              # Wait a bounded time for the report to reach the branch:
              # deep-audit, api-redundancy and callers that read the newest
              # report from the branch after this run need it there. Git only
              # (fetch + cat-file), no GitHub API call. 0 still checks once.
              # The deadline is also clamped to 55 minutes after the job
              # started (WLA_JOB_START_EPOCH), so a slow analysis cannot push
              # the wait past the job's 60-minute timeout.
              wla_wait_minutes="${WORKFLOW_LOG_ANALYSIS_REPORT_MERGE_WAIT_MINUTES:-10}"
              if [[ ! "${wla_wait_minutes}" =~ ^(0|[1-9]|1[0-9]|20)$ ]]; then
                echo "::warning::WORKFLOW_LOG_ANALYSIS_REPORT_MERGE_WAIT_MINUTES must be an integer from 0 to 20; using 10."
                wla_wait_minutes=10
              fi
              wla_poll_secs="${WORKFLOW_LOG_ANALYSIS_REPORT_MERGE_POLL_SECS:-30}"
              if [[ ! "${wla_poll_secs}" =~ ^[1-9][0-9]{0,2}$ ]]; then
                wla_poll_secs=30
              fi
              wla_wait_deadline=$(( $(date +%s) + wla_wait_minutes * 60 ))
              if [[ "${WLA_JOB_START_EPOCH:-}" =~ ^[0-9]+$ ]] \
                 && [ "${wla_wait_deadline}" -gt $(( WLA_JOB_START_EPOCH + 55 * 60 )) ]; then
                wla_wait_deadline=$(( WLA_JOB_START_EPOCH + 55 * 60 ))
              fi
              while : ; do
                if git fetch origin "${TARGET_BRANCH}" --depth=1 2>/dev/null \
                   && git cat-file -e "FETCH_HEAD:${REPORT_FILE}" 2>/dev/null; then
                  report_delivery="pr_merged"
                  report_branch="${TARGET_BRANCH}"
                  break
                fi
                if [ "$(date +%s)" -ge "${wla_wait_deadline}" ]; then
                  break
                fi
                sleep "${wla_poll_secs}"
              done
              # Fail-open cleanup, only once the report is on the branch
              # (deleting a queued PR's head would close it). Not gh
              # --delete-branch, which switches the local checkout mid-job;
              # the ls-remote check skips a branch GitHub already deleted.
              if [ "${report_delivery}" = "pr_merged" ] \
                 && git ls-remote --exit-code --heads origin "${REPORT_PR_BRANCH}" >/dev/null 2>&1 \
                 && ! git push origin --delete "${REPORT_PR_BRANCH}"; then
                echo "::warning::Could not delete merged report branch ${REPORT_PR_BRANCH}; delete it by hand."
              fi
            else
              report_delivery="pr_open"
              echo "::warning::Workflow log analysis report PR ${report_pr_url:-#${report_pr_number}} could not be merged or set to auto-merge; it stays open for review."
            fi
            if [ "${report_delivery}" != "pr_merged" ]; then
              echo "::warning::The workflow log analysis report is not on ${TARGET_BRANCH} yet (PR ${report_pr_url:-#${report_pr_number}}, delivery ${report_delivery}): deep-audit and api-redundancy are skipped for this run, and a caller that reads the newest report from ${TARGET_BRANCH} after this run sees the previous one. Set WORKFLOW_LOG_ANALYSIS_REPORT_VIA_PR=false to keep the direct push."
            fi
          fi

          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "report_file=${REPORT_FILE}" >> "$GITHUB_OUTPUT"
          {
            echo "delivery=${report_delivery}"
            echo "report_pr_number=${report_pr_number}"
            echo "report_pr_url=${report_pr_url}"
            echo "report_branch=${report_branch}"
          } >> "$GITHUB_OUTPUT"
          echo "purged_docs=${purged_docs_list}" >> "$GITHUB_OUTPUT"
          echo "WORKFLOW_LOG_ANALYSIS_REPORT_DELIVERY mode=${report_delivery_mode} outcome=${report_delivery} pr=${report_pr_number:-none} base=${TARGET_BRANCH} file=${REPORT_FILE}"

      - name: Send Telegram notification
        if: always()
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          WLA_REPORT_PR_URL: ${{ steps.commit_report.outputs.report_pr_url || '' }}
          WLA_REPORT_DELIVERY: ${{ steps.commit_report.outputs.delivery || '' }}
          WLA_COMMIT_OUTCOME: ${{ steps.commit_report.outcome || '' }}
          WLA_REPORT_VIA_PR: ${{ vars.WORKFLOW_LOG_ANALYSIS_REPORT_VIA_PR || 'true' }}
          WLA_TG_REPORT_FILE: ${{ steps.commit_report.outputs.report_file || steps.analyze.outputs.report_file || '' }}
          # Issue #8963: names the run branch only when deliver-report opens
          # the PR, i.e. under the same rule as the job's report_branch output
          # (commit_report set no delivery outcome). A report that commit_report
          # delivered itself is linked through WLA_REPORT_PR_URL or the branch.
          TG_REPORT_BRANCH: ${{ steps.commit_report.outputs.delivery == '' && steps.commit_report.outputs.report_branch || '' }}
        run: |
          set -euo pipefail

          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "::warning::Telegram not configured (TG_BOT_SECRET or TG_ADMIN_CHAT_ID missing) — skipping notification."
            exit 0
          fi

          if [ ! -f scripts/tg_helpers.sh ]; then
            echo "::warning::scripts/tg_helpers.sh not found — skipping Telegram notification."
            exit 0
          fi

          source scripts/tg_helpers.sh

          ANALYSIS_STATUS="${{ steps.analyze.outputs.analysis_status || '' }}"
          # commit_report may rename REPORT_FILE on a concurrent-write
          # collision; use its output when present so the Telegram link
          # points at the file that was actually pushed.
          # Read through env (WLA_TG_REPORT_FILE) so the LLM-run analyze
          # output never reaches the shell as code.
          REPORT_FILE="${WLA_TG_REPORT_FILE:-}"
          REPORT_URL=""
          if [ -n "${REPORT_FILE}" ] && [ -n "${TG_REPORT_BRANCH:-}" ]; then
            # The report reaches the default branch through a PR (#8963);
            # link the run branch it was pushed to.
            REPORT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TG_REPORT_BRANCH}/${REPORT_FILE}"
          elif [ -n "${REPORT_FILE}" ]; then
            REPORT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/${REPORT_FILE}"
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${ANALYSIS_STATUS}" = "completed" ] \
             && { [ "${WLA_COMMIT_OUTCOME:-}" = "failure" ] || [ "${WLA_COMMIT_OUTCOME:-}" = "cancelled" ]; }; then
            # The report was written but never reached the branch (the step
            # failed or the job was cancelled mid-step), so a blob link
            # would 404. Only PR mode has a run branch it may be on.
            MSG="Workflow log analysis report delivery FAILED for ${{ github.repository }}"
            MSG+=$'\n'
            case "$(printf '%s' "${WLA_REPORT_VIA_PR:-true}" | tr '[:upper:]' '[:lower:]')" in
              false|0|no|off)
                MSG+="The report did not reach ${GITHUB_REF_NAME}; it was not pushed and is lost with the runner." ;;
              *)
                MSG+="The report did not reach ${GITHUB_REF_NAME}; it may be on branch auto/workflow-log-analysis-report-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}." ;;
            esac
            MSG+=$'\n'
            MSG+="Run: ${RUN_URL}"
            ALERT_LEVEL="WARNING"
          elif [ "${ANALYSIS_STATUS}" = "completed" ]; then
            SUMMARY_LINE="Analysis report generated."
            if [ -n "${REPORT_FILE}" ] && [ -f "${REPORT_FILE}" ]; then
              SUMMARY_LINE="$(grep -m1 -E '^- |^[0-9]+\. ' "${REPORT_FILE}" || true)"
              [ -n "${SUMMARY_LINE}" ] || SUMMARY_LINE="Analysis report generated."
            fi

            MSG="Workflow log analysis completed for ${{ github.repository }}"
            MSG+=$'\n'
            # A report still waiting in its PR is not on the branch yet, so
            # the blob link would 404; link the PR instead.
            if { [ "${WLA_REPORT_DELIVERY:-}" = "pr_auto_merge" ] || [ "${WLA_REPORT_DELIVERY:-}" = "pr_open" ]; } && [ -n "${WLA_REPORT_PR_URL:-}" ]; then
              MSG+="Report PR: ${WLA_REPORT_PR_URL}"
              MSG+=$'\n'
            elif [ -n "${REPORT_URL}" ]; then
              MSG+="Report: ${REPORT_URL}"
              MSG+=$'\n'
            fi
            MSG+="Summary: ${SUMMARY_LINE}"
            MSG+=$'\n'
            if [ -n "${TG_REPORT_BRANCH:-}" ]; then
              MSG+="Delivery: a report PR into ${GITHUB_REF_NAME} is being opened (branch ${TG_REPORT_BRANCH})."
              MSG+=$'\n'
            fi
            MSG+="Run: ${RUN_URL}"
            ALERT_LEVEL="DEBUG"
            # A report PR left open needs a person to merge it. pr_auto_merge
            # stays DEBUG: GitHub merges that PR itself once checks pass.
            if [ "${WLA_REPORT_DELIVERY:-}" = "pr_open" ]; then
              ALERT_LEVEL="WARNING"
            fi
          else
            MSG="Workflow log analysis FAILED for ${{ github.repository }} (status: ${ANALYSIS_STATUS:-unknown})"
            MSG+=$'\n'
            MSG+="Run: ${RUN_URL}"
            ALERT_LEVEL="CRITICAL"
          fi
          tg_send_msg "${MSG}" "${ALERT_LEVEL}" >/dev/null

  deep-audit:
    needs: analyze-commit-notify
    # Runs only when the report is on the target branch: a report still in
    # an open or auto-merging PR would fail the 'not found on target branch'
    # check below, so that run skips the audit instead.
    if: ${{ github.event_name != 'schedule' && success() && needs.analyze-commit-notify.outputs.analysis_status == 'completed' && (needs.analyze-commit-notify.outputs.report_delivery == '' || needs.analyze-commit-notify.outputs.report_delivery == 'pushed' || needs.analyze-commit-notify.outputs.report_delivery == 'pr_merged') }}
    runs-on: ubuntu-latest
    # Bumped 30 → 45 after run #25088541089 cancelled at 30m 16s — the
    # original 30m budget gave no headroom for LLM latency variance, and
    # `api-redundancy` was skipped (`needs: deep-audit`) when the timeout
    # tripped. 45m absorbs the observed margin and leaves room for slow
    # codex calls without changing the watcher's overall ceiling beyond
    # what test-and-mark-stable.yml already accommodates.
    # Bumped 45 → 75 after run #25474659590 cancelled at 45m 16s on
    # deep-audit. Recent successful single-attempt durations (jobs API)
    # were 14–27m; in that run, codex attempt 1 ran ~24m and failed
    # validation (empty stdout / non-zero exit), forcing a retry that
    # was then killed by the 45m cap mid-attempt-2. 75m fits the full
    # MAX_CODEX_ATTEMPTS=3 ladder at the observed worst-case ~25m per
    # attempt plus the 10s/20s exponential backoff. Cascade bumped the
    # orphan-watcher step timeout (205 → 235m) and in-script DEADLINE
    # (12000 → 13800s) in test-and-mark-stable.yml.
    timeout-minutes: 75
    outputs:
      audit_status: ${{ steps.audit.outputs.audit_status }}
    env:
      CODEX_VERSION: ${{ vars.CODEX_VERSION || 'v0.114.0' }}
      AI_ENGINE: ${{ vars.AI_ENGINE || '' }}
      AI_ENGINE_LOG_AUDIT: ${{ vars.AI_ENGINE_LOG_AUDIT || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}
          # Issue #8963 (§23.E): keep GH_PAT out of .git/config while the
          # Codex steps run; the steps that fetch or push set a one-shot
          # credential helper that reads GH_TOKEN from their env.
          persist-credentials: false

      - name: Resolve AI engine
        id: ai_engine
        env:
          WLA_ENGINE_ROLES: LOG_AUDIT
          CLAUDE_ENGINE_SUPPORT_DEST: ${{ runner.temp }}/claude-engine-support
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || '' }}
        run: |
          set -euo pipefail
          # Claude engine (plan item 3d): this job's model roles run Claude
          # through the engine root staged here from this workflow's own
          # checkout; the codex CLI stays installed as the fallback. No work
          # item, so no labels. This workflow is not reusable (schedule +
          # dispatch only): its YAML, scripts and this checkout are one
          # commit, so the checkout is the verified support source once HEAD
          # is pinned to GITHUB_SHA and the run is on the default branch. A
          # dispatch of any other ref runs codex, so unmerged engine support
          # never fetches the Claude pool credential.
          any_claude="false"
          trusted_ref="false"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] ||
             { [ -n "${DEFAULT_BRANCH}" ] && [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; }; then
            trusted_ref="true"
          fi
          checkout_head="$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD 2>/dev/null || true)"
          # shellcheck disable=SC1091
          if [ "${trusted_ref}" = "true" ] && [ -n "${checkout_head}" ] && [ "${checkout_head}" = "${GITHUB_SHA}" ] &&
             source scripts/ai_engine.sh && ai_engine_stage_support "${GITHUB_WORKSPACE}" "${CLAUDE_ENGINE_SUPPORT_DEST}"; then
            echo "CLAUDE_ENGINE_SUPPORT_DIR=${CLAUDE_ENGINE_SUPPORT_DEST}" >> "$GITHUB_ENV"
            for wla_role in ${WLA_ENGINE_ROLES}; do
              wla_engine="$(SUPPORT_ROOT_DIR="${CLAUDE_ENGINE_SUPPORT_DEST}" ai_engine_for_role "${wla_role}" || echo codex)"
              if [ "${wla_engine}" = "claude" ]; then
                any_claude="true"
              fi
            done
          else
            echo "::warning::Trusted Claude engine support is unavailable; ${WLA_ENGINE_ROLES} run codex."
          fi
          echo "any_claude=${any_claude}" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI
        if: steps.ai_engine.outputs.any_claude == 'true'
        continue-on-error: true
        uses: ./.github/actions/install-claude
        with:
          config_path: .github/ai/claude_engine.json

      - name: Resolve Claude credential
        id: claude_pool
        if: steps.ai_engine.outputs.any_claude == 'true'
        continue-on-error: true
        uses: ./.github/actions/claude-pool-token
        with:
          config_path: .github/ai/claude_engine.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Codex CLI
        id: cache-codex
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/codex
          # -v2: previous cache only stored @openai/codex (no platform binary),
          # so cache hits restored a stub-only install and Codex crashed at
          # startup with "Missing optional dependency @openai/codex-linux-x64".
          # Bump invalidates the broken entries; persist+restore below now
          # handle both packages symmetrically.
          key: codex-${{ vars.CODEX_VERSION || 'v0.114.0' }}-v2

      - name: Install Codex CLI
        if: steps.cache-codex.outputs.cache-hit != 'true'
        uses: shubhodeep1/coding-workflows/.github/actions/install-codex@91b30f6fba400686c5dded34423f88f1ea10e163
        with:
          codex_version: ${{ env.CODEX_VERSION }}

      - name: Persist Codex CLI to tool cache
        if: steps.cache-codex.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NPM_GLOBAL_ROOT="$(npm root -g)"
          mkdir -p "${{ runner.tool_cache }}/codex"
          [ -d "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64" ] || {
            echo "::error::Codex platform package @openai/codex-linux-x64 missing after install"
            exit 1
          }
          cp -r "${NPM_GLOBAL_ROOT}/@openai/codex"           "${{ runner.tool_cache }}/codex/package"
          cp -r "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64" "${{ runner.tool_cache }}/codex/codex-linux-x64"

      - name: Restore Codex CLI from cache
        if: steps.cache-codex.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          NPM_GLOBAL_ROOT="$(npm root -g)"
          NPM_GLOBAL_PREFIX="$(npm prefix -g)"
          # Restore the cached directories directly into the global npm tree so
          # the @openai/codex-linux-x64 alias name is preserved. npm install -g
          # on the local paths re-reads package.json, and both cached
          # directories report "name": "@openai/codex".
          mkdir -p "${NPM_GLOBAL_ROOT}/@openai" "${NPM_GLOBAL_PREFIX}/bin"
          rm -rf "${NPM_GLOBAL_ROOT}/@openai/codex" "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64"
          cp -r "${{ runner.tool_cache }}/codex/package" "${NPM_GLOBAL_ROOT}/@openai/codex"
          cp -r "${{ runner.tool_cache }}/codex/codex-linux-x64" "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64"
          ln -sf "${NPM_GLOBAL_ROOT}/@openai/codex/bin/codex.js" "${NPM_GLOBAL_PREFIX}/bin/codex"
          codex --version

      - name: Create Codex config
        env:
          WORKFLOW_EDITOR_MODEL: ${{ vars.WORKFLOW_LOG_ANALYSIS_MODEL || 'openai/gpt-6-sol' }}
        run: |
          set -euo pipefail
          # Reasoning effort is hardcoded at "xhigh" and deliberately kept
          # above the repo-wide gpt-6-sol `high` default for the audit pass.
          # Historical context:
          # run #25088541089 cancelled this job at 30m 16s on its prior
          # 30m cap because xhigh over the audit's wide surface area
          # (~30 workflow files + scripts/, plus the full report file
          # concatenated as context) carries a meaningful latency tax —
          # which is why the timeout was bumped from 30m → 45m. If audit
          # passes start timing out again, lower this to `high` first.
          # Codex config centralised in scripts/write_codex_config.sh —
          # see that script's header for the apply_patch / trust /
          # elevation rationale.
          bash scripts/write_codex_config.sh \
            --model "${WORKFLOW_EDITOR_MODEL}" \
            --reasoning xhigh
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

      - name: Sync latest report from target branch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          # One-shot credential helper (§23.E): the checkout does not persist
          # credentials, so git reads GH_TOKEN from this step's env only.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { printf "username=x-access-token\npassword=%s\n" "${GH_TOKEN}"; }; f'
          REPORT_BRANCH: ${{ needs.analyze-commit-notify.outputs.report_branch }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" != "branch" ]; then
            echo "::error::Deep audit requires a branch ref for report sync/push (got ref_type='${GITHUB_REF_TYPE:-unknown}', ref_name='${GITHUB_REF_NAME:-unknown}')."
            exit 1
          fi
          # Issue #8963: the report lives on this run's report branch until
          # its PR merges; append to that copy. Without a report branch,
          # keep the old sync from the target branch.
          if [ -n "${REPORT_BRANCH:-}" ]; then
            if ! [[ "${REPORT_BRANCH}" =~ ^auto/workflow-log-analysis-report-[0-9]+-[0-9]+$ ]]; then
              echo "::error::report_branch output does not match auto/workflow-log-analysis-report-<run_id>-<run_attempt>."
              exit 1
            fi
            git fetch origin "+refs/heads/${REPORT_BRANCH}:refs/remotes/origin/${REPORT_BRANCH}"
            git checkout -B "${REPORT_BRANCH}" "origin/${REPORT_BRANCH}"
            exit 0
          fi
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "${TARGET_BRANCH}" --depth=1
          git checkout "${TARGET_BRANCH}" 2>/dev/null || git checkout -b "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          git pull --rebase origin "${TARGET_BRANCH}"

      - name: Setup uv (Semble)
        if: env.SEMBLE_ENABLED == 'true'
        continue-on-error: true
        uses: astral-sh/setup-uv@v7

      - name: Install semble
        if: env.SEMBLE_ENABLED == 'true'
        # Defense-in-depth: install_semble.sh is fail-soft (writes
        # SEMBLE_AVAILABLE=false on any error), but `continue-on-error: true`
        # ensures a future environment/regression issue still degrades to
        # blank prefetch rather than hard-failing the Codex pass.
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "SEMBLE_AVAILABLE=false" >> "$GITHUB_ENV"
          bash scripts/install_semble.sh

      - name: Build semble index
        if: env.SEMBLE_ENABLED == 'true'
        # Defense-in-depth: the shell script and the file-existence guard
        # below are both already fail-soft, but `continue-on-error: true`
        # makes the contract explicit at the step boundary so an unexpected
        # non-zero exit (syntax regression, future refactor) still degrades
        # to SEMBLE_INDEX_AVAILABLE=false rather than hard-failing the job.
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          # Pin the index location explicitly. Without this the wrapper
          # falls back to ${RUNTIME_DIR:-${RUNNER_TEMP:-${PWD}}}/.semble-index;
          # GitHub-hosted runners always set RUNNER_TEMP, but on self-hosted
          # runners that don't, the index would land in the checkout root.
          SEMBLE_INDEX_PATH: ${{ runner.temp }}/.semble-index
        run: |
          set -euo pipefail
          # Shared BM25 wrapper builder — see scripts/build_semble_wrapper.sh
          # for the rationale (semble 0.1.3 ships no index/query CLI surface).
          # Fail-soft: missing-script case is handled here (callers pinned to
          # an older reusable workflow ref may not yet have it staged); all
          # other errors are handled inside the script (writes
          # SEMBLE_INDEX_AVAILABLE=false to GITHUB_ENV and exits 0) so the
          # prefetch step renders blank.
          if [ -f scripts/build_semble_wrapper.sh ]; then
            bash scripts/build_semble_wrapper.sh
          else
            echo "::notice::scripts/build_semble_wrapper.sh not present; continuing without Semble index."
            echo "SEMBLE_INDEX_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Run deep audit pass
        id: audit
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WORKFLOW_EDITOR_MODEL: ${{ vars.WORKFLOW_LOG_ANALYSIS_MODEL || 'openai/gpt-6-sol' }}
          MAX_CODEX_ATTEMPTS: ${{ vars.MAX_CODEX_ATTEMPTS || '3' }}
          CODEX_RETRY_BACKOFF_BASE_SECS: ${{ vars.CODEX_RETRY_BACKOFF_BASE_SECS || '10' }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue || '0' }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          REPORT_FILE: ${{ needs.analyze-commit-notify.outputs.report_file }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          # Source sanitize_codex_prompt_file (best-effort) so the
          # deep-audit prompt is UTF-8-clean before piping.
          # shellcheck source=/dev/null
          source scripts/gh_helpers.sh 2>/dev/null || true
          type emit_event >/dev/null 2>&1 || emit_event() { return 0; }
          _wla_label_retry() { if type gh_retry >/dev/null 2>&1; then gh_retry "$@"; else "$@"; fi; }
          _wla_label_create() { local _wla_err; _wla_err=$(gh label create "$@" 2>&1 >/dev/null) && return 0; case "${_wla_err}" in *"already exists"*) return 0 ;; esac; _wla_label_retry gh label create "$@"; }

          TRACKING_ISSUE_RAW="${TRACKING_ISSUE:-0}"
          TRACKING_ISSUE_NUM=""
          if ! [[ "${TRACKING_ISSUE_RAW}" =~ ^[0-9]+$ ]]; then
            echo "::error::tracking_issue must be 0 or a positive integer."
            exit 1
          fi
          if [ "${TRACKING_ISSUE_RAW}" -gt 0 ]; then
            TRACKING_ISSUE_NUM="${TRACKING_ISSUE_RAW}"
          fi

          emit_deep_audit_failure() {
            local failure_mode="$1"
            local attempt_count="$2"
            local failure_summary="$3"
            if [ -z "${TRACKING_ISSUE_NUM}" ]; then
              echo "::warning::Deep audit failure without tracking issue context; skipping ai:log-analysis-failed label and AI_PHASE_FAILURE_V1 marker."
              emit_event "AI_PHASE_FAILURE_V1" \
                "schema_version=1" \
                "phase=workflow_log_analysis" \
                "failure_mode=${failure_mode}" \
                "failed_step_name=deep_audit_codex_pass" \
                "workflow_run_id=${{ github.run_id }}" \
                "workflow_run_attempt=${{ github.run_attempt }}" \
                "workflow_name=${{ github.workflow }}" \
                "workflow_file=workflow-log-analysis.yml" \
                "repository=${GITHUB_REPOSITORY}" \
                "tracking_issue=0" \
                "attempt_count=${attempt_count}" \
                "recommended_resume_action=retrigger_log_analysis" \
                "status=skipped" \
                "reason=no_tracking_issue"
              return 0
            fi
            local timestamp
            timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            local run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            local payload
            payload="$(jq -cn \
              --arg phase "workflow_log_analysis" \
              --arg failure_mode "${failure_mode}" \
              --arg failed_step_name "deep_audit_codex_pass" \
              --arg workflow_run_id "${{ github.run_id }}" \
              --arg workflow_run_attempt "${{ github.run_attempt }}" \
              --arg workflow_name "${{ github.workflow }}" \
              --arg workflow_file "workflow-log-analysis.yml" \
              --arg workflow_run_url "${run_url}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg tracking_issue "${TRACKING_ISSUE_NUM}" \
              --arg attempt_count "${attempt_count}" \
              --arg recommended_resume_action "retrigger_log_analysis" \
              --arg timestamp "${timestamp}" \
              '{
                schema_version: 1,
                phase: $phase,
                failure_mode: $failure_mode,
                failed_step_name: $failed_step_name,
                workflow_run_id: $workflow_run_id,
                workflow_run_attempt: $workflow_run_attempt,
                workflow_name: $workflow_name,
                workflow_file: $workflow_file,
                workflow_run_url: $workflow_run_url,
                repository: $repository,
                tracking_issue: $tracking_issue,
                attempt_count: $attempt_count,
                recommended_resume_action: $recommended_resume_action,
                timestamp: $timestamp
              }')"
            comment_body="<!-- AI_PHASE_FAILURE_V1"$'\n'"${payload}"$'\n'"AI_PHASE_FAILURE_V1 -->"$'\n'"## ❌ Workflow log analysis deep audit failure"$'\n\n'"${failure_summary}"$'\n\n'"Run: ${run_url}"
            gh issue comment "${TRACKING_ISSUE_NUM}" --repo "${GITHUB_REPOSITORY}" --body "${comment_body}" >/dev/null 2>&1 || true
            emit_event "AI_PHASE_FAILURE_V1" \
              "schema_version=1" \
              "phase=workflow_log_analysis" \
              "failure_mode=${failure_mode}" \
              "failed_step_name=deep_audit_codex_pass" \
              "workflow_run_id=${{ github.run_id }}" \
              "workflow_run_attempt=${{ github.run_attempt }}" \
              "workflow_name=${{ github.workflow }}" \
              "workflow_file=workflow-log-analysis.yml" \
              "workflow_run_url=${run_url}" \
              "repository=${GITHUB_REPOSITORY}" \
              "tracking_issue=${TRACKING_ISSUE_NUM}" \
              "attempt_count=${attempt_count}" \
              "recommended_resume_action=retrigger_log_analysis" \
              "timestamp=${timestamp}"
            _wla_label_create "ai:log-analysis-failed" --repo "${GITHUB_REPOSITORY}" --color "e11d48" --description "Workflow log analysis failed" >/dev/null 2>&1 || true
            GH_RETRY_IDEMPOTENT=true _wla_label_retry gh issue edit "${TRACKING_ISSUE_NUM}" --repo "${GITHUB_REPOSITORY}" --add-label "ai:log-analysis-failed" >/dev/null 2>&1 || true
          }

          if [ -z "${REPORT_FILE}" ]; then
            echo "::error::Upstream job did not provide report_file."
            exit 1
          fi
          if [ ! -f "${REPORT_FILE}" ]; then
            echo "::error::Report file '${REPORT_FILE}' not found on target branch."
            exit 1
          fi

          # Build Semble prefetch (best-effort, fail-soft).
          AUDIT_SEMBLE_PREFETCH=""
          if [ "${SEMBLE_INDEX_AVAILABLE:-false}" = "true" ] && [ -f scripts/semble_helpers.sh ]; then
            # shellcheck disable=SC1091
            source scripts/semble_helpers.sh || true
            if type semble_query_block >/dev/null 2>&1; then
              # `head -c 6000 | iconv -c` truncates by bytes then strips any
              # incomplete trailing UTF-8 sequence so a multi-byte character
              # split at the byte boundary doesn't garble the BM25 query.
              audit_query_text="$(head -c 6000 "${REPORT_FILE}" 2>/dev/null | iconv -f UTF-8 -t UTF-8 -c 2>/dev/null || true)"
              if [ -n "${audit_query_text}" ]; then
                AUDIT_SEMBLE_PREFETCH="$(semble_query_block "${audit_query_text}" 6 "Workflow Deep Audit Context" 2>/dev/null || true)"
              fi
            fi
          fi

          SECTION_FILE=""
          CODEX_PROMPT_FILE=""
          trap 'rm -f "${SECTION_FILE}" "${CODEX_PROMPT_FILE}"' EXIT
          SECTION_FILE="$(mktemp)"
          CODEX_PROMPT_FILE="$(mktemp)"
          {
            SEMBLE_PREFETCH="${AUDIT_SEMBLE_PREFETCH}" bash scripts/render_prompt.sh prompts/mode-workflow-audit.txt
            echo
            echo "=== ANALYSIS CONTEXT ==="
            echo "Report file path: ${REPORT_FILE}"
            echo "Current UTC date: $(date -u +%F)"
            echo "--- Begin current report contents ---"
            cat "${REPORT_FILE}"
            echo "--- End current report contents ---"
          } > "${CODEX_PROMPT_FILE}"

          max_attempts="${MAX_CODEX_ATTEMPTS}"
          if ! [[ "${max_attempts}" =~ ^[0-9]+$ ]] || [ "${max_attempts}" -lt 1 ]; then
            echo "::warning::MAX_CODEX_ATTEMPTS must be a positive integer (got: ${max_attempts}); defaulting to 3."
            max_attempts="3"
          fi

          backoff_base="${CODEX_RETRY_BACKOFF_BASE_SECS}"
          if ! [[ "${backoff_base}" =~ ^[0-9]+$ ]] || [ "${backoff_base}" -lt 1 ]; then
            echo "::warning::CODEX_RETRY_BACKOFF_BASE_SECS must be a positive integer (got: ${backoff_base}); defaulting to 10."
            backoff_base=10
          fi

          AUDIT_EXIT=0
          # The codex command of this pass, unchanged (AI_ENGINE_LOG_AUDIT=codex, or
          # no trusted engine support). Claude runs it as the fallback.
          wla_codex_audit()
          {
            bash scripts/codex_heartbeat.sh \
              --phase workflow_deep_audit \
              --stdout-file "${SECTION_FILE}" \
              -- bash scripts/codex_isolated_exec.sh run --mode read-only -- --ask-for-approval never -c model_verbosity=low -c include_apply_patch_tool=true exec --skip-git-repo-check --model "${WORKFLOW_EDITOR_MODEL}" --sandbox danger-full-access < "${CODEX_PROMPT_FILE}" 2> >(tee -a /tmp/workflow-audit-codex.log >&2)
          }
          wla_engine_ready()
          {
            [ -n "${CLAUDE_ENGINE_SUPPORT_DIR:-}" ] && [ -f "${CLAUDE_ENGINE_SUPPORT_DIR}/scripts/ai_engine.sh" ] && [ ! -L "${CLAUDE_ENGINE_SUPPORT_DIR}/scripts/ai_engine.sh" ]
          }
          for attempt in $(seq 1 "${max_attempts}"); do
            if command -v sanitize_codex_prompt_file >/dev/null 2>&1; then
              sanitize_codex_prompt_file "${CODEX_PROMPT_FILE}"
            fi
            set +e
            # The agent reads workflow logs from every consumer repo; it runs in the
            # credential-free, network-isolated container (scripts/codex_isolated_exec.sh).
            # Engine selection (role LOG_AUDIT): Claude in the same isolated container
            # via claude_run_selected, the codex command above as its fallback.
            if wla_engine_ready; then
              (
                unset GH_TOKEN GITHUB_TOKEN TG_BOT_SECRET TG_ADMIN_CHAT_ID TG_CHAT_ID
                # shellcheck disable=SC1091
                if ! source "${CLAUDE_ENGINE_SUPPORT_DIR}/scripts/ai_engine.sh"; then
                  echo "AI_ENGINE_FALLBACK role=LOG_AUDIT reason=engine_support_missing" >&2
                  wla_codex_audit
                  exit $?
                fi
                AI_ENGINE_MODEL_HINT="${WORKFLOW_EDITOR_MODEL}" AI_ENGINE_EFFORT_HINT="" \
                  claude_run_selected LOG_AUDIT "${CODEX_PROMPT_FILE}" "${SECTION_FILE}" "${PWD}" -- wla_codex_audit
              )
            else
              echo "AI_ENGINE_FALLBACK role=LOG_AUDIT reason=engine_support_missing" >&2
              wla_codex_audit
            fi
            AUDIT_EXIT=$?
            set -e
            if [ "${AUDIT_EXIT}" -eq 80 ]; then
              # Claude capacity wait (issue #7370): no codex fallback and no
              # retries against a gated pool; this scheduled pass runs again
              # on its next trigger.
              echo "AI_ENGINE_CAPACITY_WAIT role=LOG_AUDIT outcome=deferred stage=workflow_log_analysis"
              echo "::error::Claude pool at capacity (role LOG_AUDIT); stopping this pass without codex fallback or retries."
              exit 80
            fi
            if [ "${AUDIT_EXIT}" -eq 0 ] && grep -q '[^[:space:]]' "${SECTION_FILE}"; then
              break
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              sleep_secs=$((backoff_base * (2 ** (attempt - 1))))
              sleep "${sleep_secs}"
            else
              if [ "${AUDIT_EXIT}" -eq 0 ]; then
                failure_summary="Deep audit Codex returned empty output after ${max_attempts} attempts."
                echo "::error::${failure_summary}"
                emit_deep_audit_failure "codex_empty_output" "${max_attempts}" "${failure_summary}"
                exit 1
              fi
              failure_summary="Deep audit Codex failed after ${max_attempts} attempts with exit code ${AUDIT_EXIT}."
              echo "::error::${failure_summary}"
              emit_deep_audit_failure "codex_rc_nonzero" "${max_attempts}" "${failure_summary}"
              exit "${AUDIT_EXIT}"
            fi
          done

          if ! head -n1 "${SECTION_FILE}" | grep -qE '^## Deep Audit — Workflows & Scripts \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$'; then
            echo "::error::Deep audit Codex output did not start with the required '## Deep Audit — Workflows & Scripts (YYYY-MM-DD)' heading."
            head -n5 "${SECTION_FILE}" >&2 || true
            exit 1
          fi

          required_headings=(
            "### Section 1: Bug & Correctness Sweep"
            "### Section 2: GitHub API Call Redundancy Audit"
            "### Section 3: Code Duplication & Modularization Opportunities"
            "### Section 4: Expression Size Limit Risk Assessment"
            "### Section 5: Cross-Cutting Concerns"
            "### Section 6: Summary & Severity Matrix"
            "#### 6A. Findings Summary Table"
            "#### 6B. Estimated Remediation Scope"
          )
          previous_heading_line=0
          for heading in "${required_headings[@]}"; do
            heading_line="$(grep -nFx "${heading}" "${SECTION_FILE}" | head -n1 | cut -d: -f1 || true)"
            if [ -z "${heading_line}" ]; then
              echo "::error::Deep audit Codex output is missing required heading: ${heading}"
              exit 1
            fi
            if [ "${heading_line}" -le "${previous_heading_line}" ]; then
              echo "::error::Deep audit Codex output has headings out of order at: ${heading}"
              exit 1
            fi
            previous_heading_line="${heading_line}"
          done

          printf '\n' >> "${REPORT_FILE}"
          cat "${SECTION_FILE}" >> "${REPORT_FILE}"

          echo "audit_status=completed" >> "$GITHUB_OUTPUT"

      - name: Commit and push deep audit section
        if: steps.audit.outputs.audit_status == 'completed'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          # One-shot credential helper (§23.E): the checkout does not persist
          # credentials, so git reads GH_TOKEN from this step's env only.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { printf "username=x-access-token\npassword=%s\n" "${GH_TOKEN}"; }; f'
          REPORT_FILE: ${{ needs.analyze-commit-notify.outputs.report_file }}
          REPORT_BRANCH: ${{ needs.analyze-commit-notify.outputs.report_branch }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE:-}" != "branch" ]; then
            echo "::error::Deep audit commit requires a branch ref for report push (got ref_type='${GITHUB_REF_TYPE:-unknown}', ref_name='${GITHUB_REF_NAME:-unknown}')."
            exit 1
          fi
          if [ -n "${REPORT_BRANCH:-}" ] && ! [[ "${REPORT_BRANCH}" =~ ^auto/workflow-log-analysis-report-[0-9]+-[0-9]+$ ]]; then
            echo "::error::report_branch output does not match auto/workflow-log-analysis-report-<run_id>-<run_attempt>."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${REPORT_FILE}"
          if git diff --cached --quiet; then
            echo "No deep audit section changes to commit."
            exit 0
          fi

          git commit -m "chore: append deep audit section to workflow log analysis report"

          # Issue #8963: the default branch requires status checks with no
          # bypass, so the section goes to this run's report branch and the
          # deliver-report job's PR carries it. Never push to the default
          # branch: without a report branch there is nothing to deliver.
          if [ -z "${REPORT_BRANCH:-}" ]; then
            # Project #9116 P1: commit_report delivers the report itself, so
            # no run branch reaches this job and the section is not delivered.
            echo "::warning::The deep audit section was committed locally but not delivered: this run has no report branch (the report was delivered by commit_report)."
            echo "WORKFLOW_LOG_ANALYSIS_REPORT_DELIVERY outcome=skipped reason=no_report_branch job=deep-audit"
            exit 0
          fi

          # Only this run writes the report branch, and deep-audit and
          # api-redundancy run one after another (api-redundancy needs
          # deep-audit), so every push is a fast-forward and nothing
          # rebases. The bounded retry covers transient network failures.
          push_log="$(mktemp)"
          trap 'rm -f "${push_log}"' EXIT
          push_attempt=0
          push_max_attempts=5
          push_backoff_secs=5
          while : ; do
            push_attempt=$((push_attempt + 1))
            push_exit=0
            git push origin "HEAD:refs/heads/${REPORT_BRANCH}" >"${push_log}" 2>&1 || push_exit=$?
            sed -E 's#(https?://)[^/@[:space:]]+@#\1***@#g' "${push_log}" >&2 || true
            if [ "${push_exit}" -eq 0 ]; then
              break
            fi
            if grep -qiE 'GH006|GH013|protected branch|push declined|repository rule' "${push_log}"; then
              echo "::error::WORKFLOW_LOG_ANALYSIS_REPORT_DELIVERY outcome=failed reason=push_rejected_by_ruleset branch=${REPORT_BRANCH}"
              exit 1
            fi

            if [ "${push_attempt}" -ge "${push_max_attempts}" ]; then
              echo "::error::Could not push deep audit section after ${push_attempt} attempt(s) (target=${REPORT_BRANCH}, file=${REPORT_FILE})."
              echo "::error::WORKFLOW_LOG_ANALYSIS_REPORT_DELIVERY outcome=failed reason=push_failed branch=${REPORT_BRANCH}"
              exit 1
            fi

            echo "::warning::Deep audit section push attempt ${push_attempt} failed; retrying in ${push_backoff_secs}s."
            sleep "${push_backoff_secs}"
            push_backoff_secs=$(( push_backoff_secs * 2 ))
            if [ "${push_backoff_secs}" -gt 60 ]; then
              push_backoff_secs=60
            fi
          done

      - name: Send Telegram notification
        if: always()
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "::warning::Telegram not configured (TG_BOT_SECRET or TG_ADMIN_CHAT_ID missing) — skipping notification."
            exit 0
          fi

          if [ ! -f scripts/tg_helpers.sh ]; then
            echo "::warning::scripts/tg_helpers.sh not found — skipping Telegram notification."
            exit 0
          fi

          source scripts/tg_helpers.sh

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STAGE_STATUS="${{ steps.audit.outputs.audit_status || 'failed' }}"
          if [ "${STAGE_STATUS}" = "completed" ]; then
            MSG="Deep audit pass completed for ${{ github.repository }}"
            ALERT_LEVEL="DEBUG"
          else
            MSG="Deep audit pass FAILED for ${{ github.repository }} (status: ${STAGE_STATUS:-unknown})"
            ALERT_LEVEL="CRITICAL"
          fi
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_msg "${MSG}" "${ALERT_LEVEL}" >/dev/null

  api-redundancy:
    needs: [analyze-commit-notify, deep-audit]
    if: ${{ github.event_name != 'schedule' && success() && needs.deep-audit.outputs.audit_status == 'completed' }}
    runs-on: ubuntu-latest
    # Bumped 30 → 60 after run 25115192726 cancelled at 30m19s on this job
    # — Codex was still mid-analysis ("considering whether I can combine
    # findings from two separate call sites") when the 30m cap fired and
    # emitted `##[error]The operation was canceled.`. Bumped 60 → 90 after
    # run 25200117236 cancelled at 60m 11s — Codex (gpt-5.4 reasoning
    # effort xhigh) was still in the "Plan update … → Draft final markdown
    # section" phase (had not started generating output) when the 60m cap
    # fired. Audit-prompt input size has not grown materially since the
    # 30 → 60 bump (report file 51 KB this run vs. 33–58 KB pre-bump);
    # the structural cause is xhigh deliberation latency variance, which
    # the 60m cap couldn't absorb. The workflow-log-analysis-test
    # poller's outer DEADLINE in test-and-mark-stable.yml (dispatch
    # step) still covers the new 90m cap with headroom. (Was
    # `orphan-workflows-test` before PR #2351 split this dispatch out.)
    timeout-minutes: 90
    outputs:
      api_redundancy_status: ${{ steps.api_redundancy.outputs.api_redundancy_status }}
    env:
      CODEX_VERSION: ${{ vars.CODEX_VERSION || 'v0.114.0' }}
      AI_ENGINE: ${{ vars.AI_ENGINE || '' }}
      AI_ENGINE_LOG_ANALYSIS: ${{ vars.AI_ENGINE_LOG_ANALYSIS || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}
          # Issue #8963 (§23.E): keep GH_PAT out of .git/config while the
          # Codex steps run; the steps that fetch or push set a one-shot
          # credential helper that reads GH_TOKEN from their env.
          persist-credentials: false

      - name: Resolve AI engine
        id: ai_engine
        env:
          WLA_ENGINE_ROLES: LOG_ANALYSIS
          CLAUDE_ENGINE_SUPPORT_DEST: ${{ runner.temp }}/claude-engine-support
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || '' }}
        run: |
          set -euo pipefail
          # Claude engine (plan item 3d): this job's model roles run Claude
          # through the engine root staged here from this workflow's own
          # checkout; the codex CLI stays installed as the fallback. No work
          # item, so no labels. This workflow is not reusable (schedule +
          # dispatch only): its YAML, scripts and this checkout are one
          # commit, so the checkout is the verified support source once HEAD
          # is pinned to GITHUB_SHA and the run is on the default branch. A
          # dispatch of any other ref runs codex, so unmerged engine support
          # never fetches the Claude pool credential.
          any_claude="false"
          trusted_ref="false"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] ||
             { [ -n "${DEFAULT_BRANCH}" ] && [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; }; then
            trusted_ref="true"
          fi
          checkout_head="$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD 2>/dev/null || true)"
          # shellcheck disable=SC1091
          if [ "${trusted_ref}" = "true" ] && [ -n "${checkout_head}" ] && [ "${checkout_head}" = "${GITHUB_SHA}" ] &&
             source scripts/ai_engine.sh && ai_engine_stage_support "${GITHUB_WORKSPACE}" "${CLAUDE_ENGINE_SUPPORT_DEST}"; then
            echo "CLAUDE_ENGINE_SUPPORT_DIR=${CLAUDE_ENGINE_SUPPORT_DEST}" >> "$GITHUB_ENV"
            for wla_role in ${WLA_ENGINE_ROLES}; do
              wla_engine="$(SUPPORT_ROOT_DIR="${CLAUDE_ENGINE_SUPPORT_DEST}" ai_engine_for_role "${wla_role}" || echo codex)"
              if [ "${wla_engine}" = "claude" ]; then
                any_claude="true"
              fi
            done
          else
            echo "::warning::Trusted Claude engine support is unavailable; ${WLA_ENGINE_ROLES} run codex."
          fi
          echo "any_claude=${any_claude}" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI
        if: steps.ai_engine.outputs.any_claude == 'true'
        continue-on-error: true
        uses: ./.github/actions/install-claude
        with:
          config_path: .github/ai/claude_engine.json

      - name: Resolve Claude credential
        id: claude_pool
        if: steps.ai_engine.outputs.any_claude == 'true'
        continue-on-error: true
        uses: ./.github/actions/claude-pool-token
        with:
          config_path: .github/ai/claude_engine.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Codex CLI
        id: cache-codex
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/codex
          # -v2: previous cache only stored @openai/codex (no platform binary),
          # so cache hits restored a stub-only install and Codex crashed at
          # startup with "Missing optional dependency @openai/codex-linux-x64".
          # Bump invalidates the broken entries; persist+restore below now
          # handle both packages symmetrically.
          key: codex-${{ vars.CODEX_VERSION || 'v0.114.0' }}-v2

      - name: Install Codex CLI
        if: steps.cache-codex.outputs.cache-hit != 'true'
        uses: shubhodeep1/coding-workflows/.github/actions/install-codex@91b30f6fba400686c5dded34423f88f1ea10e163
        with:
          codex_version: ${{ env.CODEX_VERSION }}

      - name: Persist Codex CLI to tool cache
        if: steps.cache-codex.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NPM_GLOBAL_ROOT="$(npm root -g)"
          mkdir -p "${{ runner.tool_cache }}/codex"
          [ -d "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64" ] || {
            echo "::error::Codex platform package @openai/codex-linux-x64 missing after install"
            exit 1
          }
          cp -r "${NPM_GLOBAL_ROOT}/@openai/codex"           "${{ runner.tool_cache }}/codex/package"
          cp -r "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64" "${{ runner.tool_cache }}/codex/codex-linux-x64"

      - name: Restore Codex CLI from cache
        if: steps.cache-codex.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          NPM_GLOBAL_ROOT="$(npm root -g)"
          NPM_GLOBAL_PREFIX="$(npm prefix -g)"
          # Restore the cached directories directly into the global npm tree so
          # the @openai/codex-linux-x64 alias name is preserved. npm install -g
          # on the local paths re-reads package.json, and both cached
          # directories report "name": "@openai/codex".
          mkdir -p "${NPM_GLOBAL_ROOT}/@openai" "${NPM_GLOBAL_PREFIX}/bin"
          rm -rf "${NPM_GLOBAL_ROOT}/@openai/codex" "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64"
          cp -r "${{ runner.tool_cache }}/codex/package" "${NPM_GLOBAL_ROOT}/@openai/codex"
          cp -r "${{ runner.tool_cache }}/codex/codex-linux-x64" "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64"
          ln -sf "${NPM_GLOBAL_ROOT}/@openai/codex/bin/codex.js" "${NPM_GLOBAL_PREFIX}/bin/codex"
          codex --version

      - name: Create Codex config
        env:
          WORKFLOW_EDITOR_MODEL: ${{ vars.WORKFLOW_LOG_ANALYSIS_MODEL || 'openai/gpt-6-sol' }}
          THINKING_LEVEL_ANALYSIS: ${{ vars.THINKING_LEVEL_ANALYSIS || 'high' }}
        run: |
          set -euo pipefail
          # Centralised in scripts/write_codex_config.sh — see that
          # script's header for the apply_patch / trust / elevation
          # rationale.
          bash scripts/write_codex_config.sh \
            --model "${WORKFLOW_EDITOR_MODEL}" \
            --reasoning "${THINKING_LEVEL_ANALYSIS}"
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

      - name: Sync latest report from target branch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          # One-shot credential helper (§23.E): the checkout does not persist
          # credentials, so git reads GH_TOKEN from this step's env only.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { printf "username=x-access-token\npassword=%s\n" "${GH_TOKEN}"; }; f'
          REPORT_BRANCH: ${{ needs.analyze-commit-notify.outputs.report_branch }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" != "branch" ]; then
            echo "::error::API redundancy pass requires a branch ref for report sync/push (got ref_type='${GITHUB_REF_TYPE:-unknown}', ref_name='${GITHUB_REF_NAME:-unknown}')."
            exit 1
          fi
          # Issue #8963: the report lives on this run's report branch until
          # its PR merges; append to that copy. Without a report branch,
          # keep the old sync from the target branch.
          if [ -n "${REPORT_BRANCH:-}" ]; then
            if ! [[ "${REPORT_BRANCH}" =~ ^auto/workflow-log-analysis-report-[0-9]+-[0-9]+$ ]]; then
              echo "::error::report_branch output does not match auto/workflow-log-analysis-report-<run_id>-<run_attempt>."
              exit 1
            fi
            git fetch origin "+refs/heads/${REPORT_BRANCH}:refs/remotes/origin/${REPORT_BRANCH}"
            git checkout -B "${REPORT_BRANCH}" "origin/${REPORT_BRANCH}"
            exit 0
          fi
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "${TARGET_BRANCH}" --depth=1
          git checkout "${TARGET_BRANCH}" 2>/dev/null || git checkout -b "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          git pull --rebase origin "${TARGET_BRANCH}"

      - name: Setup uv (Semble)
        if: env.SEMBLE_ENABLED == 'true'
        continue-on-error: true
        uses: astral-sh/setup-uv@v7

      - name: Install semble
        if: env.SEMBLE_ENABLED == 'true'
        # Defense-in-depth: install_semble.sh is fail-soft (writes
        # SEMBLE_AVAILABLE=false on any error), but `continue-on-error: true`
        # ensures a future environment/regression issue still degrades to
        # blank prefetch rather than hard-failing the Codex pass.
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "SEMBLE_AVAILABLE=false" >> "$GITHUB_ENV"
          bash scripts/install_semble.sh

      - name: Build semble index
        if: env.SEMBLE_ENABLED == 'true'
        # Defense-in-depth: the shell script and the file-existence guard
        # below are both already fail-soft, but `continue-on-error: true`
        # makes the contract explicit at the step boundary so an unexpected
        # non-zero exit (syntax regression, future refactor) still degrades
        # to SEMBLE_INDEX_AVAILABLE=false rather than hard-failing the job.
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          # Pin the index location explicitly. Without this the wrapper
          # falls back to ${RUNTIME_DIR:-${RUNNER_TEMP:-${PWD}}}/.semble-index;
          # GitHub-hosted runners always set RUNNER_TEMP, but on self-hosted
          # runners that don't, the index would land in the checkout root.
          SEMBLE_INDEX_PATH: ${{ runner.temp }}/.semble-index
        run: |
          set -euo pipefail
          # Shared BM25 wrapper builder — see scripts/build_semble_wrapper.sh
          # for the rationale (semble 0.1.3 ships no index/query CLI surface).
          # Fail-soft: missing-script case is handled here (callers pinned to
          # an older reusable workflow ref may not yet have it staged); all
          # other errors are handled inside the script (writes
          # SEMBLE_INDEX_AVAILABLE=false to GITHUB_ENV and exits 0) so the
          # prefetch step renders blank.
          if [ -f scripts/build_semble_wrapper.sh ]; then
            bash scripts/build_semble_wrapper.sh
          else
            echo "::notice::scripts/build_semble_wrapper.sh not present; continuing without Semble index."
            echo "SEMBLE_INDEX_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Run API redundancy pass
        id: api_redundancy
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WORKFLOW_EDITOR_MODEL: ${{ vars.WORKFLOW_LOG_ANALYSIS_MODEL || 'openai/gpt-6-sol' }}
          WLA_API_REDUNDANCY_EFFORT_HINT: ${{ vars.THINKING_LEVEL_ANALYSIS || 'high' }}
          MAX_CODEX_ATTEMPTS: ${{ vars.MAX_CODEX_ATTEMPTS || '3' }}
          CODEX_RETRY_BACKOFF_BASE_SECS: ${{ vars.CODEX_RETRY_BACKOFF_BASE_SECS || '10' }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue || '0' }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          REPORT_FILE: ${{ needs.analyze-commit-notify.outputs.report_file }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          # Source sanitize_codex_prompt_file (best-effort) so the
          # API-redundancy prompt is UTF-8-clean before piping.
          # shellcheck source=/dev/null
          source scripts/gh_helpers.sh 2>/dev/null || true
          type emit_event >/dev/null 2>&1 || emit_event() { return 0; }
          _wla_label_retry() { if type gh_retry >/dev/null 2>&1; then gh_retry "$@"; else "$@"; fi; }
          _wla_label_create() { local _wla_err; _wla_err=$(gh label create "$@" 2>&1 >/dev/null) && return 0; case "${_wla_err}" in *"already exists"*) return 0 ;; esac; _wla_label_retry gh label create "$@"; }

          TRACKING_ISSUE_RAW="${TRACKING_ISSUE:-0}"
          TRACKING_ISSUE_NUM=""
          if ! [[ "${TRACKING_ISSUE_RAW}" =~ ^[0-9]+$ ]]; then
            echo "::error::tracking_issue must be 0 or a positive integer."
            exit 1
          fi
          if [ "${TRACKING_ISSUE_RAW}" -gt 0 ]; then
            TRACKING_ISSUE_NUM="${TRACKING_ISSUE_RAW}"
          fi

          emit_api_redundancy_failure() {
            local failure_mode="$1"
            local attempt_count="$2"
            local failure_summary="$3"
            if [ -z "${TRACKING_ISSUE_NUM}" ]; then
              echo "::warning::API redundancy failure without tracking issue context; skipping ai:log-analysis-failed label and AI_PHASE_FAILURE_V1 marker."
              emit_event "AI_PHASE_FAILURE_V1" \
                "schema_version=1" \
                "phase=workflow_log_analysis" \
                "failure_mode=${failure_mode}" \
                "failed_step_name=api_redundancy_codex_pass" \
                "workflow_run_id=${{ github.run_id }}" \
                "workflow_run_attempt=${{ github.run_attempt }}" \
                "workflow_name=${{ github.workflow }}" \
                "workflow_file=workflow-log-analysis.yml" \
                "repository=${GITHUB_REPOSITORY}" \
                "tracking_issue=0" \
                "attempt_count=${attempt_count}" \
                "recommended_resume_action=retrigger_log_analysis" \
                "status=skipped" \
                "reason=no_tracking_issue"
              return 0
            fi
            local timestamp
            timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            local run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            local payload
            payload="$(jq -cn \
              --arg phase "workflow_log_analysis" \
              --arg failure_mode "${failure_mode}" \
              --arg failed_step_name "api_redundancy_codex_pass" \
              --arg workflow_run_id "${{ github.run_id }}" \
              --arg workflow_run_attempt "${{ github.run_attempt }}" \
              --arg workflow_name "${{ github.workflow }}" \
              --arg workflow_file "workflow-log-analysis.yml" \
              --arg workflow_run_url "${run_url}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg tracking_issue "${TRACKING_ISSUE_NUM}" \
              --arg attempt_count "${attempt_count}" \
              --arg recommended_resume_action "retrigger_log_analysis" \
              --arg timestamp "${timestamp}" \
              '{
                schema_version: 1,
                phase: $phase,
                failure_mode: $failure_mode,
                failed_step_name: $failed_step_name,
                workflow_run_id: $workflow_run_id,
                workflow_run_attempt: $workflow_run_attempt,
                workflow_name: $workflow_name,
                workflow_file: $workflow_file,
                workflow_run_url: $workflow_run_url,
                repository: $repository,
                tracking_issue: $tracking_issue,
                attempt_count: $attempt_count,
                recommended_resume_action: $recommended_resume_action,
                timestamp: $timestamp
              }')"
            comment_body="<!-- AI_PHASE_FAILURE_V1"$'\n'"${payload}"$'\n'"AI_PHASE_FAILURE_V1 -->"$'\n'"## ❌ Workflow log analysis API redundancy failure"$'\n\n'"${failure_summary}"$'\n\n'"Run: ${run_url}"
            gh issue comment "${TRACKING_ISSUE_NUM}" --repo "${GITHUB_REPOSITORY}" --body "${comment_body}" >/dev/null 2>&1 || true
            emit_event "AI_PHASE_FAILURE_V1" \
              "schema_version=1" \
              "phase=workflow_log_analysis" \
              "failure_mode=${failure_mode}" \
              "failed_step_name=api_redundancy_codex_pass" \
              "workflow_run_id=${{ github.run_id }}" \
              "workflow_run_attempt=${{ github.run_attempt }}" \
              "workflow_name=${{ github.workflow }}" \
              "workflow_file=workflow-log-analysis.yml" \
              "workflow_run_url=${run_url}" \
              "repository=${GITHUB_REPOSITORY}" \
              "tracking_issue=${TRACKING_ISSUE_NUM}" \
              "attempt_count=${attempt_count}" \
              "recommended_resume_action=retrigger_log_analysis" \
              "timestamp=${timestamp}"
            _wla_label_create "ai:log-analysis-failed" --repo "${GITHUB_REPOSITORY}" --color "e11d48" --description "Workflow log analysis failed" >/dev/null 2>&1 || true
            GH_RETRY_IDEMPOTENT=true _wla_label_retry gh issue edit "${TRACKING_ISSUE_NUM}" --repo "${GITHUB_REPOSITORY}" --add-label "ai:log-analysis-failed" >/dev/null 2>&1 || true
          }

          if [ -z "${REPORT_FILE}" ]; then
            echo "::error::Upstream job did not provide report_file."
            exit 1
          fi
          if [ ! -f "${REPORT_FILE}" ]; then
            echo "::error::Report file '${REPORT_FILE}' not found on target branch."
            exit 1
          fi

          # Build Semble prefetch (best-effort, fail-soft).
          API_SEMBLE_PREFETCH=""
          if [ "${SEMBLE_INDEX_AVAILABLE:-false}" = "true" ] && [ -f scripts/semble_helpers.sh ]; then
            # shellcheck disable=SC1091
            source scripts/semble_helpers.sh || true
            if type semble_query_block >/dev/null 2>&1; then
              # `head -c 6000 | iconv -c` truncates by bytes then strips any
              # incomplete trailing UTF-8 sequence so a multi-byte character
              # split at the byte boundary doesn't garble the BM25 query.
              api_query_text="$(head -c 6000 "${REPORT_FILE}" 2>/dev/null | iconv -f UTF-8 -t UTF-8 -c 2>/dev/null || true)"
              if [ -n "${api_query_text}" ]; then
                API_SEMBLE_PREFETCH="$(semble_query_block "${api_query_text}" 6 "Workflow API Redundancy Context" 2>/dev/null || true)"
              fi
            fi
          fi

          SECTION_FILE=""
          CODEX_PROMPT_FILE=""
          trap 'rm -f "${SECTION_FILE}" "${CODEX_PROMPT_FILE}"' EXIT
          SECTION_FILE="$(mktemp)"
          CODEX_PROMPT_FILE="$(mktemp)"
          {
            SEMBLE_PREFETCH="${API_SEMBLE_PREFETCH}" bash scripts/render_prompt.sh prompts/mode-workflow-api-redundancy.txt
            echo
            echo "=== ANALYSIS CONTEXT ==="
            echo "Report file path: ${REPORT_FILE}"
            echo "Current UTC date: $(date -u +%F)"
            echo "--- Begin current report contents (includes prior Deep Audit section) ---"
            cat "${REPORT_FILE}"
            echo "--- End current report contents ---"
          } > "${CODEX_PROMPT_FILE}"

          max_attempts="${MAX_CODEX_ATTEMPTS}"
          if ! [[ "${max_attempts}" =~ ^[0-9]+$ ]] || [ "${max_attempts}" -lt 1 ]; then
            echo "::warning::MAX_CODEX_ATTEMPTS must be a positive integer (got: ${max_attempts}); defaulting to 3."
            max_attempts="3"
          fi
          backoff_base="${CODEX_RETRY_BACKOFF_BASE_SECS}"
          if ! [[ "${backoff_base}" =~ ^[0-9]+$ ]] || [ "${backoff_base}" -lt 1 ]; then
            echo "::warning::CODEX_RETRY_BACKOFF_BASE_SECS must be a positive integer (got: ${backoff_base}); defaulting to 10."
            backoff_base=10
          fi

          API_EXIT=0
          # The codex command of this pass, unchanged (AI_ENGINE_LOG_ANALYSIS=codex, or
          # no trusted engine support). Claude runs it as the fallback.
          wla_codex_api_redundancy()
          {
            bash scripts/codex_heartbeat.sh \
              --phase workflow_api_redundancy \
              --stdout-file "${SECTION_FILE}" \
              -- bash scripts/codex_isolated_exec.sh run --mode read-only -- --ask-for-approval never -c model_verbosity=low -c include_apply_patch_tool=true exec --skip-git-repo-check --model "${WORKFLOW_EDITOR_MODEL}" --sandbox danger-full-access < "${CODEX_PROMPT_FILE}" 2> >(tee -a /tmp/workflow-api-redundancy-codex.log >&2)
          }
          wla_engine_ready()
          {
            [ -n "${CLAUDE_ENGINE_SUPPORT_DIR:-}" ] && [ -f "${CLAUDE_ENGINE_SUPPORT_DIR}/scripts/ai_engine.sh" ] && [ ! -L "${CLAUDE_ENGINE_SUPPORT_DIR}/scripts/ai_engine.sh" ]
          }
          for attempt in $(seq 1 "${max_attempts}"); do
            if command -v sanitize_codex_prompt_file >/dev/null 2>&1; then
              sanitize_codex_prompt_file "${CODEX_PROMPT_FILE}"
            fi
            set +e
            # The agent reads workflow logs from every consumer repo; it runs in the
            # credential-free, network-isolated container (scripts/codex_isolated_exec.sh).
            # Engine selection (role LOG_ANALYSIS): Claude in the same isolated container
            # via claude_run_selected, the codex command above as its fallback.
            if wla_engine_ready; then
              (
                unset GH_TOKEN GITHUB_TOKEN TG_BOT_SECRET TG_ADMIN_CHAT_ID TG_CHAT_ID
                # shellcheck disable=SC1091
                if ! source "${CLAUDE_ENGINE_SUPPORT_DIR}/scripts/ai_engine.sh"; then
                  echo "AI_ENGINE_FALLBACK role=LOG_ANALYSIS reason=engine_support_missing" >&2
                  wla_codex_api_redundancy
                  exit $?
                fi
                AI_ENGINE_MODEL_HINT="${WORKFLOW_EDITOR_MODEL}" AI_ENGINE_EFFORT_HINT="${WLA_API_REDUNDANCY_EFFORT_HINT:-}" \
                  claude_run_selected LOG_ANALYSIS "${CODEX_PROMPT_FILE}" "${SECTION_FILE}" "${PWD}" -- wla_codex_api_redundancy
              )
            else
              echo "AI_ENGINE_FALLBACK role=LOG_ANALYSIS reason=engine_support_missing" >&2
              wla_codex_api_redundancy
            fi
            API_EXIT=$?
            set -e
            if [ "${API_EXIT}" -eq 80 ]; then
              # Claude capacity wait (issue #7370): no codex fallback and no
              # retries against a gated pool; this scheduled pass runs again
              # on its next trigger.
              echo "AI_ENGINE_CAPACITY_WAIT role=LOG_ANALYSIS outcome=deferred stage=workflow_log_analysis"
              echo "::error::Claude pool at capacity (role LOG_ANALYSIS); stopping this pass without codex fallback or retries."
              exit 80
            fi
            if [ "${API_EXIT}" -eq 0 ] && grep -q '[^[:space:]]' "${SECTION_FILE}"; then
              break
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              sleep_secs=$((backoff_base * (2 ** (attempt - 1))))
              sleep "${sleep_secs}"
            else
              if [ "${API_EXIT}" -eq 0 ]; then
                failure_summary="API redundancy Codex returned empty output after ${max_attempts} attempts."
                echo "::error::${failure_summary}"
                emit_api_redundancy_failure "codex_empty_output" "${max_attempts}" "${failure_summary}"
                exit 1
              fi
              failure_summary="API redundancy Codex failed after ${max_attempts} attempts with exit code ${API_EXIT}."
              echo "::error::${failure_summary}"
              emit_api_redundancy_failure "codex_rc_nonzero" "${max_attempts}" "${failure_summary}"
              exit "${API_EXIT}"
            fi
          done

          if ! head -n1 "${SECTION_FILE}" | grep -qE '^## API Call Consolidation & Dead-Call Analysis \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$'; then
            echo "::error::API redundancy Codex output did not start with the required '## API Call Consolidation & Dead-Call Analysis (YYYY-MM-DD)' heading."
            head -n5 "${SECTION_FILE}" >&2 || true
            exit 1
          fi

          required_headings=(
            "### Safety Tag Legend"
            "### Consolidation Candidates (MERGE-###)"
            "### Redundant Re-Fetch (REUSE-###)"
            "### Dead Calls (DEAD-API-###)"
            "### Cross-References to Deep Audit Section"
            "### Summary Counts"
            "### Implement-Stage Handoff"
          )
          previous_heading_line=0
          for heading in "${required_headings[@]}"; do
            heading_line="$(grep -nFx "${heading}" "${SECTION_FILE}" | head -n1 | cut -d: -f1 || true)"
            if [ -z "${heading_line}" ]; then
              echo "::error::API redundancy Codex output is missing required heading: ${heading}"
              exit 1
            fi
            if [ "${heading_line}" -le "${previous_heading_line}" ]; then
              echo "::error::API redundancy Codex output has headings out of order at: ${heading}"
              exit 1
            fi
            previous_heading_line="${heading_line}"
          done

          printf '\n' >> "${REPORT_FILE}"
          cat "${SECTION_FILE}" >> "${REPORT_FILE}"

          echo "api_redundancy_status=completed" >> "$GITHUB_OUTPUT"

      - name: Commit and push API redundancy section
        if: steps.api_redundancy.outputs.api_redundancy_status == 'completed'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          # One-shot credential helper (§23.E): the checkout does not persist
          # credentials, so git reads GH_TOKEN from this step's env only.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { printf "username=x-access-token\npassword=%s\n" "${GH_TOKEN}"; }; f'
          REPORT_FILE: ${{ needs.analyze-commit-notify.outputs.report_file }}
          REPORT_BRANCH: ${{ needs.analyze-commit-notify.outputs.report_branch }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE:-}" != "branch" ]; then
            echo "::error::API redundancy commit requires a branch ref for report push (got ref_type='${GITHUB_REF_TYPE:-unknown}', ref_name='${GITHUB_REF_NAME:-unknown}')."
            exit 1
          fi
          if [ -n "${REPORT_BRANCH:-}" ] && ! [[ "${REPORT_BRANCH}" =~ ^auto/workflow-log-analysis-report-[0-9]+-[0-9]+$ ]]; then
            echo "::error::report_branch output does not match auto/workflow-log-analysis-report-<run_id>-<run_attempt>."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${REPORT_FILE}"
          if git diff --cached --quiet; then
            echo "No API redundancy section changes to commit."
            exit 0
          fi

          git commit -m "chore: append API redundancy section to workflow log analysis report"

          # Issue #8963: the default branch requires status checks with no
          # bypass, so the section goes to this run's report branch and the
          # deliver-report job's PR carries it. Never push to the default
          # branch: without a report branch there is nothing to deliver.
          if [ -z "${REPORT_BRANCH:-}" ]; then
            # Project #9116 P1: commit_report delivers the report itself, so
            # no run branch reaches this job and the section is not delivered.
            echo "::warning::The API redundancy section was committed locally but not delivered: this run has no report branch (the report was delivered by commit_report)."
            echo "WORKFLOW_LOG_ANALYSIS_REPORT_DELIVERY outcome=skipped reason=no_report_branch job=api-redundancy"
            exit 0
          fi

          # Only this run writes the report branch, and deep-audit and
          # api-redundancy run one after another (api-redundancy needs
          # deep-audit), so every push is a fast-forward and nothing
          # rebases. The bounded retry covers transient network failures.
          push_log="$(mktemp)"
          trap 'rm -f "${push_log}"' EXIT
          push_attempt=0
          push_max_attempts=5
          push_backoff_secs=5
          while : ; do
            push_attempt=$((push_attempt + 1))
            push_exit=0
            git push origin "HEAD:refs/heads/${REPORT_BRANCH}" >"${push_log}" 2>&1 || push_exit=$?
            sed -E 's#(https?://)[^/@[:space:]]+@#\1***@#g' "${push_log}" >&2 || true
            if [ "${push_exit}" -eq 0 ]; then
              break
            fi
            if grep -qiE 'GH006|GH013|protected branch|push declined|repository rule' "${push_log}"; then
              echo "::error::WORKFLOW_LOG_ANALYSIS_REPORT_DELIVERY outcome=failed reason=push_rejected_by_ruleset branch=${REPORT_BRANCH}"
              exit 1
            fi

            if [ "${push_attempt}" -ge "${push_max_attempts}" ]; then
              echo "::error::Could not push API redundancy section after ${push_attempt} attempt(s) (target=${REPORT_BRANCH}, file=${REPORT_FILE})."
              echo "::error::WORKFLOW_LOG_ANALYSIS_REPORT_DELIVERY outcome=failed reason=push_failed branch=${REPORT_BRANCH}"
              exit 1
            fi

            echo "::warning::API redundancy section push attempt ${push_attempt} failed; retrying in ${push_backoff_secs}s."
            sleep "${push_backoff_secs}"
            push_backoff_secs=$(( push_backoff_secs * 2 ))
            if [ "${push_backoff_secs}" -gt 60 ]; then
              push_backoff_secs=60
            fi
          done

      - name: Send Telegram notification
        if: always()
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "::warning::Telegram not configured (TG_BOT_SECRET or TG_ADMIN_CHAT_ID missing) — skipping notification."
            exit 0
          fi

          if [ ! -f scripts/tg_helpers.sh ]; then
            echo "::warning::scripts/tg_helpers.sh not found — skipping Telegram notification."
            exit 0
          fi

          source scripts/tg_helpers.sh

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STAGE_STATUS="${{ steps.api_redundancy.outputs.api_redundancy_status || 'failed' }}"
          if [ "${STAGE_STATUS}" = "completed" ]; then
            MSG="API redundancy pass completed for ${{ github.repository }}"
            ALERT_LEVEL="DEBUG"
          else
            MSG="API redundancy pass FAILED for ${{ github.repository }} (status: ${STAGE_STATUS:-unknown})"
            ALERT_LEVEL="CRITICAL"
          fi
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_msg "${MSG}" "${ALERT_LEVEL}" >/dev/null

  # Issue #8963: the default branch requires the `lint` and
  # `ai-review/head-gate` checks and has no bypass actors, so the report
  # (and its deep-audit / API-redundancy sections) reaches it through one PR
  # per run. This job runs no LLM step; it holds GH_PAT only in the delivery
  # step, uses a one-shot credential helper, and does its git work in a
  # temporary worktree (scripts/workflow_log_analysis_deliver_report.sh).
  # always(): a failed or skipped section job still delivers what completed.
  deliver-report:
    needs: [analyze-commit-notify, deep-audit, api-redundancy]
    if: ${{ always() && github.event_name != 'schedule' && needs.analyze-commit-notify.outputs.committed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # Issue #8963: check out with GH_PAT, as the other report jobs do.
          # The github.token fallback only keeps the checkout working so the
          # delivery script can log reason=token_missing; the script itself
          # never uses github.token, and credentials are not persisted.
          token: ${{ secrets.GH_PAT || github.token }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Deliver report pull request
        id: deliver_report
        env:
          # GH_PAT only: a PR opened with github.token starts no CI, so the
          # script fails closed (reason=token_missing) when it is unset.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPORT_PUSH_TOKEN: ${{ secrets.GH_PAT }}
          REPORT_BRANCH: ${{ needs.analyze-commit-notify.outputs.report_branch }}
          REPORT_FILE: ${{ needs.analyze-commit-notify.outputs.report_file }}
          PURGED_DOCS: ${{ needs.analyze-commit-notify.outputs.purged_docs }}
          AUDIT_STATUS: ${{ needs.deep-audit.outputs.audit_status }}
          API_REDUNDANCY_STATUS: ${{ needs.api-redundancy.outputs.api_redundancy_status }}
          # The *_status outputs are set before the section push step runs;
          # the job result says whether the section reached the run branch.
          DEEP_AUDIT_RESULT: ${{ needs.deep-audit.result }}
          API_REDUNDANCY_RESULT: ${{ needs.api-redundancy.result }}
          # A dispatch from a non-default ref fails closed (run_context_invalid).
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || '' }}
        run: bash scripts/workflow_log_analysis_deliver_report.sh

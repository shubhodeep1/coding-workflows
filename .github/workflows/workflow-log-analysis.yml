name: Workflow Log Analysis

on:
  workflow_dispatch:
    inputs:
      since:
        description: Optional ISO-8601 timestamp to collect runs since (e.g. 2026-04-01T00:00:00Z)
        required: false
        default: ""
        type: string
      lookback_days:
        description: Days of workflow runs to analyze
        required: false
        default: "7"
        type: string
      codex_mode:
        description: Run Codex-first analysis path (set false to use legacy analyzer mode)
        required: false
        default: true
        type: boolean
      batch_api_disabled:
        description: Optional true/false override for analyzer batch API behavior in non-codex mode
        required: false
        default: ""
        type: string
      repos_override:
        description: Optional comma-separated repositories (owner/repo)
        required: false
        default: ""
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read

concurrency:
  group: workflow-log-analysis-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  collect-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve repositories
        id: resolve_repos
        run: |
          set -euo pipefail

          OVERRIDE_INPUT="${{ github.event.inputs.repos_override || '' }}"
          REPO_REGISTRY_PATH=".github/ai/consumer_repos.json"

          declare -a repos=()

          if [ -n "${OVERRIDE_INPUT//[[:space:]]/}" ]; then
            IFS=',' read -r -a override_repos <<< "${OVERRIDE_INPUT}"
            for raw_repo in "${override_repos[@]}"; do
              repo="$(printf '%s' "${raw_repo}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -n "${repo}" ] || continue
              if [[ ! "${repo}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
                echo "::error::Invalid repository format in repos_override: ${repo}"
                exit 1
              fi
              repos+=("${repo}")
            done
          else
            if [ -f "${REPO_REGISTRY_PATH}" ]; then
              if ! jq -e 'type == "array"' "${REPO_REGISTRY_PATH}" >/dev/null 2>&1; then
                echo "::error::${REPO_REGISTRY_PATH} must be valid JSON containing an array of repositories."
                exit 1
              fi

              mapfile -t configured_repos < <(jq -r '.[]' "${REPO_REGISTRY_PATH}")
              for raw_repo in "${configured_repos[@]}"; do
                repo="$(printf '%s' "${raw_repo}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
                [ -n "${repo}" ] || continue
                repos+=("${repo}")
              done
            else
              echo "::warning::${REPO_REGISTRY_PATH} not found; defaulting to current repository only."
            fi

            repos+=("${GITHUB_REPOSITORY}")
          fi

          declare -A seen=()
          declare -a deduped=()
          for repo in "${repos[@]}"; do
            [ -n "${repo}" ] || continue
            if [ -z "${seen[${repo}]+x}" ]; then
              seen["${repo}"]=1
              deduped+=("${repo}")
            fi
          done

          if [ "${#deduped[@]}" -eq 0 ]; then
            echo "::error::No repositories resolved."
            exit 1
          fi

          printf '%s\n' "${deduped[@]}" > /tmp/workflow-analysis-repos.txt
          echo "repo_count=${#deduped[@]}" >> "$GITHUB_OUTPUT"

          echo "Resolved repositories:"
          printf ' - %s\n' "${deduped[@]}"

      - name: Collect workflow logs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          SINCE_INPUT="${{ github.event.inputs.since || '' }}"
          LOOKBACK_DAYS="${{ github.event.inputs.lookback_days || '7' }}"
          mapfile -t REPOS < /tmp/workflow-analysis-repos.txt

          COLLECT_ARGS=(
            --output workflow_log_report.json
          )

          if [ -n "${SINCE_INPUT//[[:space:]]/}" ]; then
            COLLECT_ARGS+=(--since "${SINCE_INPUT}")
          else
            COLLECT_ARGS+=(--lookback-days "${LOOKBACK_DAYS}")
          fi

          for repo in "${REPOS[@]}"; do
            COLLECT_ARGS+=(--repo "${repo}")
          done

          python3 scripts/collect_workflow_logs.py "${COLLECT_ARGS[@]}"

      - name: Upload workflow log report artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow-log-report
          path: workflow_log_report.json
          if-no-files-found: error
          retention-days: 7

  analyze-commit-notify:
    needs: collect-logs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      report_file: ${{ steps.analyze.outputs.report_file }}
      analysis_status: ${{ steps.analyze.outputs.analysis_status }}
    env:
      CODEX_VERSION: ${{ vars.CODEX_VERSION || 'v0.114.0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Codex CLI
        if: ${{ inputs.codex_mode }}
        id: cache-codex
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/codex
          key: codex-${{ vars.CODEX_VERSION || 'v0.114.0' }}

      - name: Install Codex CLI
        if: ${{ inputs.codex_mode && steps.cache-codex.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          npm install -g @openai/codex@"${CODEX_VERSION}" --no-audit --no-fund
          CODEX_BIN="$(which codex)"
          mkdir -p "${{ runner.tool_cache }}/codex"
          cp -r "$(npm root -g)/@openai/codex" "${{ runner.tool_cache }}/codex/package"
          cp "${CODEX_BIN}" "${{ runner.tool_cache }}/codex/codex"

      - name: Restore Codex CLI from cache
        if: ${{ inputs.codex_mode && steps.cache-codex.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          npm install -g "${{ runner.tool_cache }}/codex/package" --no-audit --no-fund

      - name: Create Codex config
        if: ${{ inputs.codex_mode }}
        env:
          WORKFLOW_EDITOR_MODEL: ${{ vars.WORKFLOW_LOG_ANALYSIS_MODEL || 'openai/gpt-5.3-codex' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.codex
          CATALOG_PATH="$(pwd)/scripts/codex_model_catalog.json"
          {
            echo 'web_search = "live"'
            echo 'model_provider = "openrouter"'
            echo "model = \"${WORKFLOW_EDITOR_MODEL}\""
            echo 'model_reasoning_effort = "medium"'
            if [ -f "${CATALOG_PATH}" ]; then
              echo "model_catalog_json = \"${CATALOG_PATH}\""
            fi
            echo
            echo '[model_providers.openrouter]'
            echo 'name = "OpenRouter"'
            echo 'base_url = "https://openrouter.ai/api/v1"'
            echo 'env_key = "OPENROUTER_API_KEY"'
            echo 'wire_api = "responses"'
            echo 'stream_idle_timeout_ms = 600000'
            echo 'stream_max_retries = 5'
            echo 'request_max_retries = 3'
            echo
            echo '[sandbox_workspace_write]'
            echo 'network_access = true'
          } > ~/.codex/config.toml
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

      - name: Download workflow log report artifact
        uses: actions/download-artifact@v4
        with:
          name: workflow-log-report
          path: .

      - name: Run workflow log analysis
        id: analyze
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_PROMPT_CACHE_DISABLED: ${{ vars.OPENROUTER_PROMPT_CACHE_DISABLED || 'false' }}
          THINKING_LEVEL_ANALYSIS: ${{ vars.THINKING_LEVEL_ANALYSIS || 'xhigh' }}
          WORKFLOW_EDITOR_MODEL: ${{ vars.WORKFLOW_LOG_ANALYSIS_MODEL || 'openai/gpt-5.3-codex' }}
          BATCH_API_DISABLED: ${{ vars.BATCH_API_DISABLED || 'false' }}
          BATCH_API_PROVIDER: ${{ vars.BATCH_API_PROVIDER || 'auto' }}
          BATCH_API_POLL_TIMEOUT_HOURS: ${{ vars.BATCH_API_POLL_TIMEOUT_HOURS || '24' }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          CODEX_MODE_INPUT="${{ inputs.codex_mode && 'true' || 'false' }}"
          BATCH_API_DISABLED_INPUT="${{ github.event.inputs.batch_api_disabled || '' }}"
          BATCH_ARTIFACT_NAME="workflow-log-analysis-batch-state"
          BATCH_STATE_FILE="workflow_log_analysis_batch_state.json"

          if [ "${CODEX_MODE_INPUT}" != "true" ]; then
            if ARTIFACTS_JSON="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" 2>/dev/null)"; then
              :
            else
              ARTIFACTS_JSON=''
            fi
            if [ -n "${ARTIFACTS_JSON}" ]; then
              ARTIFACT_ID="$(printf '%s\n' "${ARTIFACTS_JSON}" | jq -rs --arg name "${BATCH_ARTIFACT_NAME}" --arg branch "${GITHUB_REF_NAME}" '[.[].artifacts[]?] | map(select(.name == $name and .expired == false and (((.workflow_run // {}) | .head_branch // "") == $branch))) | sort_by(.created_at) | last | .id // empty' 2>/dev/null || true)"
              if [ -n "${ARTIFACT_ID}" ]; then
                TMP_DIR="$(mktemp -d)"
                if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "${TMP_DIR}/batch-state.zip" 2>/dev/null; then
                  if unzip -oq "${TMP_DIR}/batch-state.zip" -d "${TMP_DIR}" >/dev/null 2>&1 && [ -f "${TMP_DIR}/${BATCH_STATE_FILE}" ]; then
                    cp "${TMP_DIR}/${BATCH_STATE_FILE}" "${BATCH_STATE_FILE}"
                    echo "INFO: {\"event\":\"batch_poll\",\"status\":\"state_loaded\",\"artifact_id\":${ARTIFACT_ID}}"
                  fi
                fi
                rm -rf "${TMP_DIR}"
              fi
            fi
          fi

          if [ -n "${BATCH_API_DISABLED_INPUT//[[:space:]]/}" ]; then
            case "${BATCH_API_DISABLED_INPUT,,}" in
              true|false)
                BATCH_API_DISABLED="${BATCH_API_DISABLED_INPUT,,}"
                ;;
              *)
                echo "::error::Invalid batch_api_disabled input '${BATCH_API_DISABLED_INPUT}'. Use true or false."
                exit 1
                ;;
            esac
          fi

          ANALYZE_EXIT=0
          REPORT_FILE=""
          if [ "${CODEX_MODE_INPUT}" = "true" ]; then
            REPORT_DATE="$(date -u +%F)"
            REPORT_DIR="analysis"
            REPORT_BASE="${REPORT_DIR}/workflow-optimization-${REPORT_DATE}"
            REPORT_FILE="${REPORT_BASE}.md"
            if [ -f "${REPORT_FILE}" ]; then
              REPORT_SUFFIX=2
              while [ -f "${REPORT_BASE}-${REPORT_SUFFIX}.md" ]; do
                REPORT_SUFFIX=$((REPORT_SUFFIX + 1))
              done
              REPORT_FILE="${REPORT_BASE}-${REPORT_SUFFIX}.md"
            fi

            ANALYSIS_CONTEXT_FILE=""
            set +e
            ANALYSIS_CONTEXT_FILE="$(python3 scripts/analyze_workflow_logs.py --input workflow_log_report.json --output "${REPORT_FILE}" --codex-mode)"
            ANALYZE_EXIT=$?
            set -e

            if [ "${ANALYZE_EXIT}" -ne 0 ]; then
              echo "::error::Analyzer failed to prepare Codex context with exit code ${ANALYZE_EXIT}."
              exit "${ANALYZE_EXIT}"
            fi
            if [ -z "${ANALYSIS_CONTEXT_FILE}" ] || [ ! -f "${ANALYSIS_CONTEXT_FILE}" ]; then
              echo "::error::Analyzer did not produce a valid Codex context file path."
              exit 1
            fi

            CODEX_PROMPT_FILE="$(mktemp)"
            {
              bash scripts/render_prompt.sh prompts/mode-workflow-analysis.txt
              echo
              echo "=== ANALYSIS CONTEXT ==="
              cat "${ANALYSIS_CONTEXT_FILE}"
            } > "${CODEX_PROMPT_FILE}"

            max_attempts=3
            for attempt in $(seq 1 "${max_attempts}"); do
              set +e
              codex exec --model "${WORKFLOW_EDITOR_MODEL}" --full-auto < "${CODEX_PROMPT_FILE}" > "${REPORT_FILE}" 2> >(tee -a /tmp/workflow-analysis-codex.log >&2)
              ANALYZE_EXIT=$?
              set -e
              if [ "${ANALYZE_EXIT}" -eq 0 ] && grep -q '[^[:space:]]' "${REPORT_FILE}"; then
                break
              fi
              if [ "${attempt}" -lt "${max_attempts}" ]; then
                sleep_secs=$((10 * (2 ** (attempt - 1))))
                sleep "${sleep_secs}"
              else
                if [ "${ANALYZE_EXIT}" -eq 0 ]; then
                  echo "::error::Codex returned empty output after ${max_attempts} attempts."
                  exit 1
                fi
                echo "::error::Codex failed after ${max_attempts} attempts with exit code ${ANALYZE_EXIT}."
                exit "${ANALYZE_EXIT}"
              fi
            done

            echo "report_file=${REPORT_FILE}" >> "$GITHUB_OUTPUT"
            echo "analysis_status=completed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cmd=(python3 scripts/analyze_workflow_logs.py --input workflow_log_report.json --batch-state-file "${BATCH_STATE_FILE}")
          if [ -n "${THINKING_LEVEL_ANALYSIS}" ]; then
            cmd+=(--thinking-level "${THINKING_LEVEL_ANALYSIS}")
          fi
          LEGACY_PROMPT_TOKEN_BUDGET="${{ vars.WORKFLOW_LOG_ANALYSIS_LEGACY_PROMPT_TOKEN_BUDGET || '24000' }}"
          if [[ ! "${LEGACY_PROMPT_TOKEN_BUDGET}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid WORKFLOW_LOG_ANALYSIS_LEGACY_PROMPT_TOKEN_BUDGET='${LEGACY_PROMPT_TOKEN_BUDGET}'. Use a non-negative integer."
            exit 1
          fi
          cmd+=(--prompt-token-budget "${LEGACY_PROMPT_TOKEN_BUDGET}")
          case "${WORKFLOW_EDITOR_MODEL:-}" in
            *gemini*) cmd+=(--max-output-tokens 60000) ;;
          esac

          set +e
          REPORT_FILE="$("${cmd[@]}")"
          ANALYZE_EXIT=$?
          set -e

          if [ "${ANALYZE_EXIT}" -eq 0 ]; then
            if [ -z "${REPORT_FILE}" ] || [ ! -f "${REPORT_FILE}" ]; then
              echo "::error::Analyzer did not produce a valid report file path."
              exit 1
            fi
            echo "report_file=${REPORT_FILE}" >> "$GITHUB_OUTPUT"
            echo "analysis_status=completed" >> "$GITHUB_OUTPUT"
            if [ -f "${BATCH_STATE_FILE}" ]; then
              echo "batch_state_file=${BATCH_STATE_FILE}" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ "${ANALYZE_EXIT}" -eq 3 ]; then
            if [ ! -f "${BATCH_STATE_FILE}" ]; then
              echo "::error::Analyzer exited pending but did not produce batch state file."
              exit 1
            fi
            echo "analysis_status=pending" >> "$GITHUB_OUTPUT"
            echo "batch_state_file=${BATCH_STATE_FILE}" >> "$GITHUB_OUTPUT"
            echo "INFO: {\"event\":\"batch_poll\",\"status\":\"pending\"}"
            exit 0
          fi

          echo "::error::Analyzer failed with exit code ${ANALYZE_EXIT}."
          exit "${ANALYZE_EXIT}"

      - name: Upload batch state artifact
        if: steps.analyze.outputs.batch_state_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: workflow-log-analysis-batch-state
          path: ${{ steps.analyze.outputs.batch_state_file }}
          if-no-files-found: error
          retention-days: 7

      - name: Commit and push report
        id: commit_report
        if: steps.analyze.outputs.analysis_status == 'completed'
        run: |
          set -euo pipefail

          REPORT_FILE="${{ steps.analyze.outputs.report_file }}"
          TARGET_BRANCH="${{ github.ref_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${REPORT_FILE}"
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: add workflow log analysis report"
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"

          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        if: always()
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail

          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "::warning::Telegram not configured (TG_BOT_SECRET or TG_ADMIN_CHAT_ID missing) — skipping notification."
            exit 0
          fi

          if [ ! -f scripts/tg_helpers.sh ]; then
            echo "::warning::scripts/tg_helpers.sh not found — skipping Telegram notification."
            exit 0
          fi

          source scripts/tg_helpers.sh

          ANALYSIS_STATUS="${{ steps.analyze.outputs.analysis_status || '' }}"
          REPORT_FILE="${{ steps.analyze.outputs.report_file || '' }}"
          REPORT_URL=""
          if [ -n "${REPORT_FILE}" ]; then
            REPORT_URL="${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/${REPORT_FILE}"
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${ANALYSIS_STATUS}" = "pending" ]; then
            MSG="Workflow log analysis submitted async batch for ${{ github.repository }}"
            MSG+=$'\n'
            MSG+="Report: pending (rerun this workflow manually to continue polling)"
            MSG+=$'\n'
            MSG+="Run: ${RUN_URL}"
          else
            SUMMARY_LINE="Analysis report generated."
            if [ -n "${REPORT_FILE}" ] && [ -f "${REPORT_FILE}" ]; then
              SUMMARY_LINE="$(grep -m1 -E '^- |^[0-9]+\. ' "${REPORT_FILE}" || true)"
              [ -n "${SUMMARY_LINE}" ] || SUMMARY_LINE="Analysis report generated."
            fi

            MSG="Workflow log analysis completed for ${{ github.repository }}"
            MSG+=$'\n'
            if [ -n "${REPORT_URL}" ]; then
              MSG+="Report: ${REPORT_URL}"
              MSG+=$'\n'
            fi
            MSG+="Summary: ${SUMMARY_LINE}"
            MSG+=$'\n'
            MSG+="Run: ${RUN_URL}"
          fi
          tg_send_msg "${MSG}" "DEBUG" >/dev/null

  deep-audit:
    needs: analyze-commit-notify
    if: needs.analyze-commit-notify.outputs.analysis_status == 'completed' && inputs.codex_mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      audit_status: ${{ steps.audit.outputs.audit_status }}
    env:
      CODEX_VERSION: ${{ vars.CODEX_VERSION || 'v0.114.0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Codex CLI
        id: cache-codex
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/codex
          key: codex-${{ vars.CODEX_VERSION || 'v0.114.0' }}

      - name: Install Codex CLI
        if: steps.cache-codex.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          npm install -g @openai/codex@"${CODEX_VERSION}" --no-audit --no-fund
          CODEX_BIN="$(which codex)"
          mkdir -p "${{ runner.tool_cache }}/codex"
          cp -r "$(npm root -g)/@openai/codex" "${{ runner.tool_cache }}/codex/package"
          cp "${CODEX_BIN}" "${{ runner.tool_cache }}/codex/codex"

      - name: Restore Codex CLI from cache
        if: steps.cache-codex.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          npm install -g "${{ runner.tool_cache }}/codex/package" --no-audit --no-fund

      - name: Create Codex config
        env:
          WORKFLOW_EDITOR_MODEL: ${{ vars.WORKFLOW_LOG_ANALYSIS_MODEL || 'openai/gpt-5.3-codex' }}
          THINKING_LEVEL_ANALYSIS: ${{ vars.THINKING_LEVEL_ANALYSIS || 'xhigh' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.codex
          CATALOG_PATH="$(pwd)/scripts/codex_model_catalog.json"
          {
            echo 'web_search = "live"'
            echo 'model_provider = "openrouter"'
            echo "model = \"${WORKFLOW_EDITOR_MODEL}\""
            echo "model_reasoning_effort = \"${THINKING_LEVEL_ANALYSIS}\""
            if [ -f "${CATALOG_PATH}" ]; then
              echo "model_catalog_json = \"${CATALOG_PATH}\""
            fi
            echo
            echo '[model_providers.openrouter]'
            echo 'name = "OpenRouter"'
            echo 'base_url = "https://openrouter.ai/api/v1"'
            echo 'env_key = "OPENROUTER_API_KEY"'
            echo 'wire_api = "responses"'
            echo 'stream_idle_timeout_ms = 600000'
            echo 'stream_max_retries = 5'
            echo 'request_max_retries = 3'
            echo
            echo '[sandbox_workspace_write]'
            echo 'network_access = true'
          } > ~/.codex/config.toml
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

      - name: Sync latest report from target branch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "${TARGET_BRANCH}" --depth=1
          git checkout "${TARGET_BRANCH}" 2>/dev/null || git checkout -b "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          git pull --rebase origin "${TARGET_BRANCH}"

      - name: Run deep audit pass
        id: audit
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_PROMPT_CACHE_DISABLED: ${{ vars.OPENROUTER_PROMPT_CACHE_DISABLED || 'false' }}
          WORKFLOW_EDITOR_MODEL: ${{ vars.WORKFLOW_LOG_ANALYSIS_MODEL || 'openai/gpt-5.3-codex' }}
          REPORT_FILE: ${{ needs.analyze-commit-notify.outputs.report_file }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          if [ -z "${REPORT_FILE}" ]; then
            echo "::error::Upstream job did not provide report_file."
            exit 1
          fi
          if [ ! -f "${REPORT_FILE}" ]; then
            echo "::error::Report file '${REPORT_FILE}' not found on target branch."
            exit 1
          fi

          SECTION_FILE="$(mktemp)"
          CODEX_PROMPT_FILE="$(mktemp)"
          trap 'rm -f "${SECTION_FILE}" "${CODEX_PROMPT_FILE}"' EXIT
          {
            bash scripts/render_prompt.sh prompts/mode-workflow-audit.txt
            echo
            echo "=== ANALYSIS CONTEXT ==="
            echo "Report file path: ${REPORT_FILE}"
            echo "Current UTC date: $(date -u +%F)"
            echo "--- Begin current report contents ---"
            cat "${REPORT_FILE}"
            echo "--- End current report contents ---"
          } > "${CODEX_PROMPT_FILE}"

          max_attempts=3
          AUDIT_EXIT=0
          for attempt in $(seq 1 "${max_attempts}"); do
            set +e
            codex exec --model "${WORKFLOW_EDITOR_MODEL}" --full-auto < "${CODEX_PROMPT_FILE}" > "${SECTION_FILE}" 2> >(tee -a /tmp/workflow-audit-codex.log >&2)
            AUDIT_EXIT=$?
            set -e
            if [ "${AUDIT_EXIT}" -eq 0 ] && grep -q '[^[:space:]]' "${SECTION_FILE}"; then
              break
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              sleep_secs=$((10 * (2 ** (attempt - 1))))
              sleep "${sleep_secs}"
            else
              if [ "${AUDIT_EXIT}" -eq 0 ]; then
                echo "::error::Deep audit Codex returned empty output after ${max_attempts} attempts."
                exit 1
              fi
              echo "::error::Deep audit Codex failed after ${max_attempts} attempts with exit code ${AUDIT_EXIT}."
              exit "${AUDIT_EXIT}"
            fi
          done

          if ! head -n1 "${SECTION_FILE}" | grep -qE '^## Deep Audit — Workflows & Scripts \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$'; then
            echo "::error::Deep audit Codex output did not start with the required '## Deep Audit — Workflows & Scripts (YYYY-MM-DD)' heading."
            head -n5 "${SECTION_FILE}" >&2 || true
            exit 1
          fi

          required_headings=(
            "### Section 1: Bug & Correctness Sweep"
            "### Section 2: GitHub API Call Redundancy Audit"
            "### Section 3: Code Duplication & Modularization Opportunities"
            "### Section 4: Expression Size Limit Risk Assessment"
            "### Section 5: Cross-Cutting Concerns"
            "### Section 6: Summary & Severity Matrix"
            "#### 6A. Findings Summary Table"
            "#### 6B. Estimated Remediation Scope"
          )
          previous_heading_line=0
          for heading in "${required_headings[@]}"; do
            heading_line="$(grep -nFx "${heading}" "${SECTION_FILE}" | head -n1 | cut -d: -f1 || true)"
            if [ -z "${heading_line}" ]; then
              echo "::error::Deep audit Codex output is missing required heading: ${heading}"
              exit 1
            fi
            if [ "${heading_line}" -le "${previous_heading_line}" ]; then
              echo "::error::Deep audit Codex output has headings out of order at: ${heading}"
              exit 1
            fi
            previous_heading_line="${heading_line}"
          done

          printf '\n' >> "${REPORT_FILE}"
          cat "${SECTION_FILE}" >> "${REPORT_FILE}"

          echo "audit_status=completed" >> "$GITHUB_OUTPUT"

      - name: Commit and push deep audit section
        if: steps.audit.outputs.audit_status == 'completed'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          REPORT_FILE: ${{ needs.analyze-commit-notify.outputs.report_file }}
        run: |
          set -euo pipefail

          TARGET_BRANCH="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${REPORT_FILE}"
          if git diff --cached --quiet; then
            echo "No deep audit section changes to commit."
            exit 0
          fi

          git commit -m "chore: append deep audit section to workflow log analysis report"
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Send Telegram notification
        if: always()
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail

          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "::warning::Telegram not configured (TG_BOT_SECRET or TG_ADMIN_CHAT_ID missing) — skipping notification."
            exit 0
          fi

          if [ ! -f scripts/tg_helpers.sh ]; then
            echo "::warning::scripts/tg_helpers.sh not found — skipping Telegram notification."
            exit 0
          fi

          source scripts/tg_helpers.sh

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STAGE_STATUS="${{ steps.audit.outputs.audit_status || 'failed' }}"
          if [ "${STAGE_STATUS}" = "completed" ]; then
            MSG="Deep audit pass completed for ${{ github.repository }}"
            ALERT_LEVEL="DEBUG"
          else
            MSG="Deep audit pass FAILED for ${{ github.repository }}"
            ALERT_LEVEL="CRITICAL"
          fi
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_msg "${MSG}" "${ALERT_LEVEL}" >/dev/null

  api-redundancy:
    needs: [analyze-commit-notify, deep-audit]
    if: needs.deep-audit.outputs.audit_status == 'completed' && inputs.codex_mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      api_redundancy_status: ${{ steps.api_redundancy.outputs.api_redundancy_status }}
    env:
      CODEX_VERSION: ${{ vars.CODEX_VERSION || 'v0.114.0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Codex CLI
        id: cache-codex
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/codex
          key: codex-${{ vars.CODEX_VERSION || 'v0.114.0' }}

      - name: Install Codex CLI
        if: steps.cache-codex.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          npm install -g @openai/codex@"${CODEX_VERSION}" --no-audit --no-fund
          CODEX_BIN="$(which codex)"
          mkdir -p "${{ runner.tool_cache }}/codex"
          cp -r "$(npm root -g)/@openai/codex" "${{ runner.tool_cache }}/codex/package"
          cp "${CODEX_BIN}" "${{ runner.tool_cache }}/codex/codex"

      - name: Restore Codex CLI from cache
        if: steps.cache-codex.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          npm install -g "${{ runner.tool_cache }}/codex/package" --no-audit --no-fund

      - name: Create Codex config
        env:
          WORKFLOW_EDITOR_MODEL: ${{ vars.WORKFLOW_LOG_ANALYSIS_MODEL || 'openai/gpt-5.3-codex' }}
          THINKING_LEVEL_ANALYSIS: ${{ vars.THINKING_LEVEL_ANALYSIS || 'xhigh' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.codex
          CATALOG_PATH="$(pwd)/scripts/codex_model_catalog.json"
          {
            echo 'web_search = "live"'
            echo 'model_provider = "openrouter"'
            echo "model = \"${WORKFLOW_EDITOR_MODEL}\""
            echo "model_reasoning_effort = \"${THINKING_LEVEL_ANALYSIS}\""
            if [ -f "${CATALOG_PATH}" ]; then
              echo "model_catalog_json = \"${CATALOG_PATH}\""
            fi
            echo
            echo '[model_providers.openrouter]'
            echo 'name = "OpenRouter"'
            echo 'base_url = "https://openrouter.ai/api/v1"'
            echo 'env_key = "OPENROUTER_API_KEY"'
            echo 'wire_api = "responses"'
            echo 'stream_idle_timeout_ms = 600000'
            echo 'stream_max_retries = 5'
            echo 'request_max_retries = 3'
            echo
            echo '[sandbox_workspace_write]'
            echo 'network_access = true'
          } > ~/.codex/config.toml
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

      - name: Sync latest report from target branch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "${TARGET_BRANCH}" --depth=1
          git checkout "${TARGET_BRANCH}" 2>/dev/null || git checkout -b "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          git pull --rebase origin "${TARGET_BRANCH}"

      - name: Run API redundancy pass
        id: api_redundancy
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_PROMPT_CACHE_DISABLED: ${{ vars.OPENROUTER_PROMPT_CACHE_DISABLED || 'false' }}
          WORKFLOW_EDITOR_MODEL: ${{ vars.WORKFLOW_LOG_ANALYSIS_MODEL || 'openai/gpt-5.3-codex' }}
          REPORT_FILE: ${{ needs.analyze-commit-notify.outputs.report_file }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          if [ -z "${REPORT_FILE}" ]; then
            echo "::error::Upstream job did not provide report_file."
            exit 1
          fi
          if [ ! -f "${REPORT_FILE}" ]; then
            echo "::error::Report file '${REPORT_FILE}' not found on target branch."
            exit 1
          fi

          SECTION_FILE="$(mktemp)"
          CODEX_PROMPT_FILE="$(mktemp)"
          trap 'rm -f "${SECTION_FILE}" "${CODEX_PROMPT_FILE}"' EXIT
          {
            bash scripts/render_prompt.sh prompts/mode-workflow-api-redundancy.txt
            echo
            echo "=== ANALYSIS CONTEXT ==="
            echo "Report file path: ${REPORT_FILE}"
            echo "Current UTC date: $(date -u +%F)"
            echo "--- Begin current report contents (includes prior Deep Audit section) ---"
            cat "${REPORT_FILE}"
            echo "--- End current report contents ---"
          } > "${CODEX_PROMPT_FILE}"

          max_attempts=3
          API_EXIT=0
          for attempt in $(seq 1 "${max_attempts}"); do
            set +e
            codex exec --model "${WORKFLOW_EDITOR_MODEL}" --full-auto < "${CODEX_PROMPT_FILE}" > "${SECTION_FILE}" 2> >(tee -a /tmp/workflow-api-redundancy-codex.log >&2)
            API_EXIT=$?
            set -e
            if [ "${API_EXIT}" -eq 0 ] && grep -q '[^[:space:]]' "${SECTION_FILE}"; then
              break
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              sleep_secs=$((10 * (2 ** (attempt - 1))))
              sleep "${sleep_secs}"
            else
              if [ "${API_EXIT}" -eq 0 ]; then
                echo "::error::API redundancy Codex returned empty output after ${max_attempts} attempts."
                exit 1
              fi
              echo "::error::API redundancy Codex failed after ${max_attempts} attempts with exit code ${API_EXIT}."
              exit "${API_EXIT}"
            fi
          done

          if ! head -n1 "${SECTION_FILE}" | grep -qE '^## API Call Consolidation & Dead-Call Analysis \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$'; then
            echo "::error::API redundancy Codex output did not start with the required '## API Call Consolidation & Dead-Call Analysis (YYYY-MM-DD)' heading."
            head -n5 "${SECTION_FILE}" >&2 || true
            exit 1
          fi

          required_headings=(
            "### Safety Tag Legend"
            "### Consolidation Candidates (MERGE-###)"
            "### Redundant Re-Fetch (REUSE-###)"
            "### Dead Calls (DEAD-API-###)"
            "### Cross-References to Deep Audit Section"
            "### Summary Counts"
            "### Implement-Stage Handoff"
          )
          previous_heading_line=0
          for heading in "${required_headings[@]}"; do
            heading_line="$(grep -nFx "${heading}" "${SECTION_FILE}" | head -n1 | cut -d: -f1 || true)"
            if [ -z "${heading_line}" ]; then
              echo "::error::API redundancy Codex output is missing required heading: ${heading}"
              exit 1
            fi
            if [ "${heading_line}" -le "${previous_heading_line}" ]; then
              echo "::error::API redundancy Codex output has headings out of order at: ${heading}"
              exit 1
            fi
            previous_heading_line="${heading_line}"
          done

          printf '\n' >> "${REPORT_FILE}"
          cat "${SECTION_FILE}" >> "${REPORT_FILE}"

          echo "api_redundancy_status=completed" >> "$GITHUB_OUTPUT"

      - name: Commit and push API redundancy section
        if: steps.api_redundancy.outputs.api_redundancy_status == 'completed'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          REPORT_FILE: ${{ needs.analyze-commit-notify.outputs.report_file }}
        run: |
          set -euo pipefail

          TARGET_BRANCH="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${REPORT_FILE}"
          if git diff --cached --quiet; then
            echo "No API redundancy section changes to commit."
            exit 0
          fi

          git commit -m "chore: append API redundancy section to workflow log analysis report"
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Send Telegram notification
        if: always()
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail

          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "::warning::Telegram not configured (TG_BOT_SECRET or TG_ADMIN_CHAT_ID missing) — skipping notification."
            exit 0
          fi

          if [ ! -f scripts/tg_helpers.sh ]; then
            echo "::warning::scripts/tg_helpers.sh not found — skipping Telegram notification."
            exit 0
          fi

          source scripts/tg_helpers.sh

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STAGE_STATUS="${{ steps.api_redundancy.outputs.api_redundancy_status || 'failed' }}"
          if [ "${STAGE_STATUS}" = "completed" ]; then
            MSG="API redundancy pass completed for ${{ github.repository }}"
            ALERT_LEVEL="DEBUG"
          else
            MSG="API redundancy pass FAILED for ${{ github.repository }}"
            ALERT_LEVEL="CRITICAL"
          fi
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_msg "${MSG}" "${ALERT_LEVEL}" >/dev/null

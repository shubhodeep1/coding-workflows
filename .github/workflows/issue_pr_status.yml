---
name: AI Issue PR Status Sync

"on":
  workflow_call:
    secrets:
      GH_PAT:
        required: true
      TG_BOT_SECRET:
        required: false

env:
  FINAL_LABEL: ${{ github.event.pull_request.merged && 'ai:merged' || 'ai:closed' }}

jobs:
  sync-issue-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve workflow support ref
        shell: bash
        env:
          WORKFLOW_DEFINITION_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_DEFINITION_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          if [ "${WORKFLOW_DEFINITION_REPOSITORY}" != "${wf_source}" ]; then
            echo "::error::Reusable workflow repository '${WORKFLOW_DEFINITION_REPOSITORY}' does not match expected source '${wf_source}'."
            exit 1
          fi
          if ! [[ "${WORKFLOW_DEFINITION_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::job.workflow_sha is not an immutable 40-character commit SHA."
            exit 1
          fi
          echo "SCRIPT_REF=${WORKFLOW_DEFINITION_SHA,,}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

          persist-credentials: false
      - name: Checkout workflow support source
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ env.SCRIPT_REF }}
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1
          persist-credentials: false

      - name: Ensure workflow support source checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .codex-workflow-src ]; then
            echo "::error::Failed to checkout immutable workflow support source at ${SCRIPT_REF}"
            exit 1
          fi
          support_head="$(git -C .codex-workflow-src rev-parse HEAD 2>/dev/null || true)"
          if [ "${support_head,,}" != "${SCRIPT_REF}" ]; then
            echo "::error::Workflow support checkout HEAD does not match requested immutable SHA ${SCRIPT_REF}."
            exit 1
          fi

      - name: Configure git auth for memory helper clones
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_PAT is empty"; exit 1; }
          SERVER_HOST="${GITHUB_SERVER_URL#https://}"
          SERVER_HOST="${SERVER_HOST#http://}"
          SERVER_HOST="${SERVER_HOST%/}"
          git_auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic ${git_auth_header}"
          git remote set-url origin "${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Fetch memory helper scripts
        run: |
          set -euo pipefail

          wf_source="shubhodeep1/coding-workflows"
          mkdir -p scripts

          MEMORY_HELPERS_READY=1
          _fetched_scripts=()
          for f in gh_helpers.sh emit_event.sh emit_event.py label_helpers.sh memory_helpers.sh tg_helpers.sh ai_memory.py ai_memory_lib.py openrouter_prompt_cache.py semantic_cache.py memory_injection_patterns.py; do
            support_script=".codex-workflow-src/scripts/${f}"
            if [ ! -s "${support_script}" ]; then
              echo "::error::Missing or empty required support script ${f} in ${wf_source}@${SCRIPT_REF}"
              exit 1
            fi
            install -m 0755 "${support_script}" "scripts/${f}"
            if [ ! -s "scripts/${f}" ] || [ ! -x "scripts/${f}" ]; then
              echo "::error::Failed to install required support script ${f} from ${wf_source}@${SCRIPT_REF}"
              exit 1
            fi
            _fetched_scripts+=("${f}")
          done
          # Optional helper for the implement-plan lessons step. Kept out of
          # MEMORY_HELPERS_READY so a support ref that predates it never
          # blocks lineage finalization; that step skips when it is missing.
          if fetch_from_ref_or_local "scripts/ingest_implement_plan_lessons.py" "scripts/ingest_implement_plan_lessons.py"; then
            _fetched_scripts+=("ingest_implement_plan_lessons.py")
          fi
          issue_status_immutable_support_manifest="${RUNNER_TEMP}/issue-status-immutable-support-manifest.json"
          issue_status_immutable_support_root="${RUNNER_TEMP}/issue-status-immutable-support-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "${_fetched_scripts[@]}" | jq -Rsc '
            split("\n") | map(select(length > 0) | "scripts/" + .)
            | {required_scripts: ., executable_files: .}
          ' > "${issue_status_immutable_support_manifest}"
          WORKFLOW_SUPPORT_REF="${SCRIPT_REF}" bash ".codex-workflow-src/scripts/stage_workflow_support.sh" immutable-bundle \
            --manifest "${issue_status_immutable_support_manifest}" \
            --source-root ".codex-workflow-src" \
            --destination-root "${issue_status_immutable_support_root}"
          echo "PYTHONPATH=${issue_status_immutable_support_root}/scripts" >> "$GITHUB_ENV"
          # Block fetched scripts from being committed in consumer repos.
          if [ "${{ github.repository }}" != "${wf_source}" ]; then
            {
              echo "# Auto-generated by coding-workflows — DO NOT EDIT"
              echo "# Prevents runtime-fetched support scripts from being committed."
              printf '%s\n' "${_fetched_scripts[@]}" .gitignore
            } > scripts/.gitignore
          fi
          # Fetch AI memory schema files so consumer repos that lack
          # schemas on their default branch can bootstrap the ai-memory
          # branch (schemas are validated during memory operations).
          # Include H5/H6 cache schemas; fetch remains best-effort until
          # these files exist on the selected support ref.
          mkdir -p ai-memory/schemas
          for sf in \
            memory_record.v1.json \
            processed_command_entry.v1.json \
            run_ledger_entry.v1.json \
            task_lineage.v1.json \
            actions_runs_cache.v1.json \
            workflow_log_analysis_cache.v1.json \
            validation_history.v1.json \
            operator_bypass_audit.v1.json \
            revalidate_events.v1.json \
            validation_discovery.v1.json \
            lessons_learned_record.v1.json; do
            if [ ! -f "ai-memory/schemas/${sf}" ]; then
              support_schema=".codex-workflow-src/ai-memory/schemas/${sf}"
              if [ -s "${support_schema}" ]; then
                install -m 0644 "${support_schema}" "ai-memory/schemas/${sf}"
              fi
            fi
          done

          echo "MEMORY_HELPERS_READY=${MEMORY_HELPERS_READY}" >> "$GITHUB_ENV"

      - name: Update linked issue labels when PR closes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          set -euo pipefail
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh"
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }

          TRACKING_ISSUES=""
          MANAGED_ISSUES=""
          ORCHESTRATOR_CLASSIFICATION_COMPLETE="true"

          export_orchestrator_issue_classification() {
            echo "LINKED_ISSUE_NUMBERS<<EOF" >> "$GITHUB_ENV"
            printf '%s\n' "${ISSUE_NUMBERS:-}" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
            echo "TRACKING_ISSUES<<EOF" >> "$GITHUB_ENV"
            printf '%s\n' "${TRACKING_ISSUES:-}" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
            echo "MANAGED_ISSUES<<EOF" >> "$GITHUB_ENV"
            printf '%s\n' "${MANAGED_ISSUES:-}" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
            echo "ORCHESTRATOR_CLASSIFICATION_COMPLETE=${ORCHESTRATOR_CLASSIFICATION_COMPLETE}" >> "$GITHUB_ENV"
          }

          classify_orchestrator_issues_from_payload() {
            local payload="$1"
            local expected_count="$2"

            [ -n "${payload}" ] || return 1
            printf '%s' "${payload}" | jq -e --argjson expected "${expected_count}" '
              ((.errors // []) | length) == 0
              and (.data.repository? != null)
              and (([.data.repository.pullRequest.closingIssuesReferences.nodes[]? | select(. != null)] | length) == $expected)
            ' >/dev/null 2>&1 || return 1

            TRACKING_ISSUES="$(printf '%s' "${payload}" | jq -r '
              .data.repository.pullRequest.closingIssuesReferences.nodes[]? | select(. != null) |
              select(((.labels.nodes // []) | map(.name) | index("ai:orchestrator-tracking")) != null) |
              .number
            ' 2>/dev/null || echo '')"
            MANAGED_ISSUES="$(printf '%s' "${payload}" | jq -r '
              .data.repository.pullRequest.closingIssuesReferences.nodes[]? | select(. != null) |
              select(((.labels.nodes // []) | map(.name) | index("ai:orchestrator-tracking")) == null) |
              select(
                ((.labels.nodes // []) | map(.name) | index("ai:orchestrator-managed")) != null
                or ((.body // "") | contains("Managed by: AI Orchestrator"))
              ) |
              .number
            ' 2>/dev/null || echo '')"
          }

          merge_issue_number_list() {
            local current_list="$1"
            local incoming_list="$2"

            if [ -z "${current_list}" ]; then
              printf '%s' "${incoming_list}"
            elif [ -z "${incoming_list}" ]; then
              printf '%s' "${current_list}"
            else
              printf '%s\n%s\n' "${current_list}" "${incoming_list}" | awk 'NF' | sort -un
            fi
          }

          LOOKUP_ISSUE_NUMBERS=""
          CLOSING_ISSUE_NUMBERS=""
          CLOSING_ISSUES_RESP=""

          CLOSING_ISSUES_RESP="$(gh_retry gh api graphql \
            -f owner="${REPOSITORY%/*}" \
            -f name="${REPOSITORY#*/}" \
            -F number="${PR_NUMBER}" \
            -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { closingIssuesReferences(first: 50) { nodes { number body labels(first: 50) { nodes { name } } } } } } }' \
            2>/dev/null || true)"

          CLOSING_ISSUE_NUMBERS="$(printf '%s' "${CLOSING_ISSUES_RESP}" | jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes[]?.number' 2>/dev/null || true)"
          ISSUE_NUMBERS="${CLOSING_ISSUE_NUMBERS}"

          if [ -n "${CLOSING_ISSUE_NUMBERS}" ]; then
            LOOKUP_COUNT="$(printf '%s\n' "${CLOSING_ISSUE_NUMBERS}" | awk 'NF' | wc -l | tr -d '[:space:]')"
            if ! classify_orchestrator_issues_from_payload "${CLOSING_ISSUES_RESP}" "${LOOKUP_COUNT}"; then
              TRACKING_ISSUES=""
              MANAGED_ISSUES=""
              LOOKUP_ISSUE_NUMBERS="${CLOSING_ISSUE_NUMBERS}"
            fi
          fi

          if [ -z "${ISSUE_NUMBERS}" ]; then
            # Fallback: extract issue number from PR body/title only when the
            # PR explicitly references an issue via a supported closing keyword
            # (close(s|d)/fix(es|ed)/resolve(s|d) #N) or a full repo-scoped
            # URL/path.
            # Bare prose mentions like "issue #N" or "issues/N" are NOT treated
            # as closing links — those are documentation references and
            # auto-labeling/closing on them caused incorrect ai:merged
            # transitions on orchestrator-tracking issues mentioned in PR
            # bodies (see issue #1469).
            PR_DATA="${PR_TITLE:-} ${PR_BODY:-}"
            if type extract_repo_scoped_issue_refs_from_text >/dev/null 2>&1; then
              ISSUE_NUMBERS="$(extract_repo_scoped_issue_refs_from_text "${REPOSITORY}" "${PR_DATA}" || true)"
            else
              ISSUE_NUMBERS=""
            fi
            if [ -z "${ISSUE_NUMBERS}" ]; then
              echo "No linked issues found for PR #${PR_NUMBER} (even after body/title fallback)."
              ISSUE_NUMBERS=""
            fi
            if [ -n "${ISSUE_NUMBERS}" ]; then
              LOOKUP_ISSUE_NUMBERS="$(merge_issue_number_list "${LOOKUP_ISSUE_NUMBERS}" "${ISSUE_NUMBERS}")"
              echo "Found linked issues via PR body/title fallback: ${ISSUE_NUMBERS}"
            fi
          fi

          BRANCH_ISSUE_NUMBER="$(printf '%s\n' "${PR_HEAD_REF}" | sed -nE 's#^ai/issue-([0-9]+)([-/].*)?$#\1#p' | head -n1)"
          if [ -n "${BRANCH_ISSUE_NUMBER}" ]; then
            ISSUE_NUMBERS="$(merge_issue_number_list "${ISSUE_NUMBERS}" "${BRANCH_ISSUE_NUMBER}")"
            if [ -z "${CLOSING_ISSUE_NUMBERS}" ] || ! printf '%s\n' "${CLOSING_ISSUE_NUMBERS}" | grep -qxF "${BRANCH_ISSUE_NUMBER}"; then
              LOOKUP_ISSUE_NUMBERS="$(merge_issue_number_list "${LOOKUP_ISSUE_NUMBERS}" "${BRANCH_ISSUE_NUMBER}")"
            fi
            echo "Resolved linked issue from branch ${PR_HEAD_REF}: #${BRANCH_ISSUE_NUMBER}"
          fi

          if [ -z "${ISSUE_NUMBERS}" ]; then
            echo "No linked issues found for PR #${PR_NUMBER}."
            export_orchestrator_issue_classification
            exit 0
          fi

          if [ ! -f "scripts/label_helpers.sh" ]; then
            echo "::error::Missing required support script scripts/label_helpers.sh" >&2
            exit 1
          fi
          source "${SUPPORT_SCRIPTS_DIR}/label_helpers.sh"
          if ! type set_issue_phase_label_resilient >/dev/null 2>&1; then
            set_issue_phase_label_resilient() {
              local issue_number="$1"
              local target_label="$2"
              local repo="$3"
              ensure_label_exists "${target_label}" "${repo}" || true
              gh_retry gh api -X POST "repos/${repo}/issues/${issue_number}/labels" \
                -f "labels[]=${target_label}" >/dev/null 2>&1 \
                || echo "::warning::Fallback label add failed for #${issue_number}."
            }
          fi
          ensure_label_exists "${FINAL_LABEL}" "${REPOSITORY}"

          # Classify each linked issue into one of three buckets so the
          # label/close path applies the right policy:
          #
          #   1. TRACKING_ISSUES — orchestrator project tracking issues
          #      (label `ai:orchestrator-tracking`). Their terminal phase
          #      label and close lifecycle are owned exclusively by
          #      scripts/orchestrate_poll_process.sh. SKIP entirely.
          #      This is the regression guard for issue #1469: when a
          #      child PR's body mentions a tracking issue, we must not
          #      relabel or auto-close it.
          #
          #   2. MANAGED_ISSUES — orchestrator-managed child issues
          #      (label `ai:orchestrator-managed` OR the
          #      "Managed by: AI Orchestrator" body marker). These
          #      always merge into orchestrator/project-N, never main,
          #      so the default `PR_BASE_REF == main` close gate would
          #      strand them. Apply FINAL_LABEL and close on PR merge
          #      regardless of base ref. The orchestrator poller's
          #      reconcile_managed_issue_labels and
          #      close_merged_issues_sweep paths remain authoritative
          #      backstops; this path is idempotent with them.
          #
          #   3. Standalone issues — neither tracking nor managed. Keep
          #      the original `PR_BASE_REF == main` gate to preserve
          #      the workflow's long-standing safety for non-orchestrator
          #      flows.
          #
          # Single batched GraphQL call (one API request regardless of
          # N) per CLAUDE.md §15. Fail-open with a per-issue REST
          # fallback so a transient GraphQL failure cannot silently
          # degrade detection.
          ORCH_ALIAS_FRAGMENT=""
          ORCH_IDX=0
          while IFS= read -r _orch_num; do
            [ -n "${_orch_num}" ] || continue
            [[ "${_orch_num}" =~ ^[0-9]+$ ]] || continue
            ORCH_ALIAS_FRAGMENT+=" i${ORCH_IDX}: issue(number: ${_orch_num}) { number labels(first: 50) { nodes { name } } body }"
            ORCH_IDX=$((ORCH_IDX + 1))
          done <<< "${LOOKUP_ISSUE_NUMBERS}"

          if [ -n "${ORCH_ALIAS_FRAGMENT}" ]; then
            ORCH_QUERY="query { repository(owner: \"${REPOSITORY%/*}\", name: \"${REPOSITORY#*/}\") {${ORCH_ALIAS_FRAGMENT} } }"
            ORCH_RESP="$(gh_retry gh api graphql -f query="${ORCH_QUERY}" 2>/dev/null || echo '')"
            ORCH_BATCH_FAILED=true
            if [ -n "${ORCH_RESP}" ] && printf '%s' "${ORCH_RESP}" | jq -e --argjson expected "${ORCH_IDX}" '
              ((.errors // []) | length) == 0
              and (.data.repository? != null)
              and (([.data.repository | to_entries[] | .value | select(. != null)] | length) == $expected)
            ' >/dev/null 2>&1; then
              _tracking_issues="$(printf '%s' "${ORCH_RESP}" | jq -r '
                .data.repository | to_entries[] | .value | select(. != null) |
                select(((.labels.nodes // []) | map(.name) | index("ai:orchestrator-tracking")) != null) |
                .number
              ' 2>/dev/null || echo '')"
              _managed_issues="$(printf '%s' "${ORCH_RESP}" | jq -r '
                .data.repository | to_entries[] | .value | select(. != null) |
                select(((.labels.nodes // []) | map(.name) | index("ai:orchestrator-tracking")) == null) |
                select(
                  ((.labels.nodes // []) | map(.name) | index("ai:orchestrator-managed")) != null
                  or
                  ((.body // "") | contains("Managed by: AI Orchestrator"))
                ) | .number
              ' 2>/dev/null || echo '')"
              TRACKING_ISSUES="$(merge_issue_number_list "${TRACKING_ISSUES}" "${_tracking_issues}")"
              MANAGED_ISSUES="$(merge_issue_number_list "${MANAGED_ISSUES}" "${_managed_issues}")"
              ORCH_BATCH_FAILED=false
            fi
            if [ "${ORCH_BATCH_FAILED}" = true ]; then
              # GraphQL batch failed — fall back to per-issue REST detection
              # so a transient failure cannot re-introduce the #1469 bug
              # (tracking issue auto-closed) or strand a managed child.
              echo "::warning::Orchestrator-issue batch detection failed; falling back to per-issue REST."
              while IFS= read -r _orch_num; do
                [ -n "${_orch_num}" ] || continue
                [[ "${_orch_num}" =~ ^[0-9]+$ ]] || continue
                _orch_meta="$(gh_retry gh api "repos/${REPOSITORY}/issues/${_orch_num}" --jq '{labels:[.labels[].name], body:(.body // "")}' 2>/dev/null || echo '')"
                if [ -z "${_orch_meta}" ]; then
                  # Conservative fail-open: treat as tracking so we skip
                  # the label/close mutation. Mis-classifying a managed
                  # child as tracking only delays its close to the next
                  # orchestrator poll cycle; mis-classifying a tracking
                  # issue as managed would re-introduce #1469.
                  echo "::warning::Orchestrator fallback lookup failed for issue #${_orch_num}; conservatively treating as tracking (skip)."
                  ORCHESTRATOR_CLASSIFICATION_COMPLETE="false"
                  TRACKING_ISSUES+="${_orch_num}"$'\n'
                  continue
                fi
                if printf '%s' "${_orch_meta}" | jq -e '((.labels // []) | index("ai:orchestrator-tracking")) != null' >/dev/null 2>&1; then
                  TRACKING_ISSUES+="${_orch_num}"$'\n'
                elif printf '%s' "${_orch_meta}" | jq -e '
                  ((.labels // []) | index("ai:orchestrator-managed")) != null
                  or ((.body // "") | contains("Managed by: AI Orchestrator"))
                ' >/dev/null 2>&1; then
                  MANAGED_ISSUES+="${_orch_num}"$'\n'
                fi
              done <<< "${LOOKUP_ISSUE_NUMBERS}"
            fi
          fi

          while IFS= read -r issue_number; do
            [ -n "${issue_number}" ] || continue

            if [ -n "${TRACKING_ISSUES}" ] && printf '%s\n' "${TRACKING_ISSUES}" | grep -qxF "${issue_number}"; then
              echo "Skipping orchestrator-tracking issue #${issue_number} — terminal phase label and close are owned by orchestrate_poll_process.sh; PR-close path must not mutate it."
              continue
            fi

            is_managed_child=false
            if [ -n "${MANAGED_ISSUES}" ] && printf '%s\n' "${MANAGED_ISSUES}" | grep -qxF "${issue_number}"; then
              is_managed_child=true
            fi

            echo "Updating issue #${issue_number} with label ${FINAL_LABEL}"
            set_issue_phase_label_resilient "${issue_number}" "${FINAL_LABEL}" "${REPOSITORY}"

            if [ "${PR_MERGED}" != "true" ] || [ "${PR_BASE_REF}" = "main" ] || [ "${is_managed_child}" = "true" ]; then
              if [ "${is_managed_child}" = "true" ] && [ "${PR_MERGED}" = "true" ] && [ "${PR_BASE_REF}" != "main" ]; then
                echo "Closing orchestrator-managed child issue #${issue_number} after PR #${PR_NUMBER} merged into ${PR_BASE_REF} (integration branch)."
              else
                echo "Closing issue #${issue_number} after PR #${PR_NUMBER} close event."
              fi
              if ! gh_retry gh issue close "${issue_number}" -R "${REPOSITORY}"; then
                echo "::warning::Failed to close issue #${issue_number}."
              fi
            else
              echo "PR merged into ${PR_BASE_REF}; issue #${issue_number} remains open."
            fi
          done <<< "${ISSUE_NUMBERS}"

          # Export linked issue numbers and orchestrator classification for
          # downstream lineage, alerting, and cleanup steps.
          export_orchestrator_issue_classification

      - name: Finalize linked issue lineage state
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          AI_MEMORY_ENABLED: ${{ vars.AI_MEMORY_ENABLED || 'true' }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          AI_MEMORY_ENABLED_NORMALIZED=false
          case "$(printf '%s' "${AI_MEMORY_ENABLED}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on) AI_MEMORY_ENABLED_NORMALIZED=true ;;
          esac

          if [ -z "${LINKED_ISSUE_NUMBERS:-}" ]; then
            echo "No linked issues found; skipping lineage finalization."
            echo "AI_MEMORY_TELEMETRY: {\"op\":\"finalize-task\",\"ok\":true,\"enabled\":${AI_MEMORY_ENABLED_NORMALIZED},\"fail_open\":true,\"reason\":\"no_linked_issues\",\"source\":\"issue_pr_status.yml\"}"
            exit 0
          fi

          if [ "${AI_MEMORY_ENABLED_NORMALIZED}" != "true" ]; then
            echo "AI memory disabled; skipping lineage finalization."
            echo "AI_MEMORY_TELEMETRY: {\"op\":\"finalize-task\",\"ok\":true,\"enabled\":${AI_MEMORY_ENABLED_NORMALIZED},\"fail_open\":true,\"reason\":\"ai_memory_disabled\",\"source\":\"issue_pr_status.yml\"}"
            exit 0
          fi

          if [ "${MEMORY_HELPERS_READY:-0}" != "1" ]; then
            echo "Missing required memory helper scripts; cannot finalize lineage." >&2
            exit 1
          fi

          [ -f scripts/memory_helpers.sh ] || {
            echo "memory_helpers.sh missing; cannot finalize lineage." >&2
            exit 1
          }

          if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            FINAL_STATE="merged"
          else
            FINAL_STATE="closed"
          fi

          source "${SUPPORT_SCRIPTS_DIR}/memory_helpers.sh"
          memory_ensure_branch

          while IFS= read -r issue_number; do
            [ -n "${issue_number}" ] || continue

            ISSUE_URL="${{ github.server_url }}/${REPOSITORY}/issues/${issue_number}"
            memory_finalize_task \
              --issue-number "${issue_number}" \
              --issue-url "${ISSUE_URL}" \
              --final-state "${FINAL_STATE}" \
              --workflow "${WORKFLOW_NAME}" \
              --run-id "${RUN_ID}" \
              --run-attempt "${RUN_ATTEMPT}" \
              --actor "${ACTOR}" \
              --pr-number "${PR_NUMBER}" \
              --pr-url "${PR_URL}"
          done <<< "${LINKED_ISSUE_NUMBERS}"

      # /implement-plan-claude records reusable lessons in its progress log
      # (docs/implement-plan/<slug>.md, `## Lessons`). When a PR that carries
      # the log merges, copy those lessons into the ai-memory branch.
      # Idempotent (record ids derive from slug + source + text) and
      # fail-open: this step never turns the job red.
      - name: Ingest implement-plan lessons into AI memory
        if: ${{ !cancelled() && github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'claude/implement-plan-') || startsWith(github.event.pull_request.head.ref, 'claude/verify-activation-')) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          AI_MEMORY_ENABLED: ${{ vars.AI_MEMORY_ENABLED || 'true' }}
          LESSONS_LEARNED_ENABLED: ${{ vars.LESSONS_LEARNED_ENABLED || 'true' }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          if [ ! -f scripts/ingest_implement_plan_lessons.py ] || [ ! -f scripts/ai_memory_lib.py ]; then
            echo "::warning::implement-plan lessons helper unavailable; skipping ingestion"
            echo "AI_MEMORY_TELEMETRY: {\"op\":\"ingest_implement_plan_lessons\",\"ok\":true,\"fail_open\":true,\"reason\":\"helper_missing\",\"source\":\"issue_pr_status.yml\"}"
            exit 0
          fi

          if [ -z "${MERGE_COMMIT_SHA:-}" ] || ! git fetch --no-tags --quiet --depth=1 origin "${MERGE_COMMIT_SHA}"; then
            echo "::warning::could not fetch merge commit ${MERGE_COMMIT_SHA:-<none>}; skipping implement-plan lessons ingestion"
            echo "AI_MEMORY_TELEMETRY: {\"op\":\"ingest_implement_plan_lessons\",\"ok\":false,\"fail_open\":true,\"reason\":\"merge_commit_unavailable\",\"source\":\"issue_pr_status.yml\"}"
            exit 0
          fi

          python3 scripts/ingest_implement_plan_lessons.py \
            --ref "${MERGE_COMMIT_SHA}" \
            --pr-number "${PR_NUMBER}"

      - name: Send PR merged Telegram alert
        if: github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID || '' }}
          ALERT_MSG_LEVEL: SILENT
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "Telegram not configured; skipping PR merged alert."
            exit 0
          fi
          if [ ! -s "scripts/gh_helpers.sh" ] || \
            [ ! -s ".codex-workflow-src/scripts/gh_helpers.sh" ] || \
            ! cmp -s ".codex-workflow-src/scripts/gh_helpers.sh" "scripts/gh_helpers.sh" || \
            [ ! -s "scripts/tg_helpers.sh" ] || \
            [ ! -s ".codex-workflow-src/scripts/tg_helpers.sh" ] || \
            ! cmp -s ".codex-workflow-src/scripts/tg_helpers.sh" "scripts/tg_helpers.sh"; then
            echo "::error::Trusted issue-status Telegram support is unavailable at ${SCRIPT_REF:-unknown}."
            exit 1
          fi
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh"
          source "${SUPPORT_SCRIPTS_DIR}/tg_helpers.sh"
          if ! declare -F tg_send_msg >/dev/null 2>&1; then
            echo "::error::tg_send_msg is missing from trusted Telegram support at ${SCRIPT_REF:-unknown}."
            exit 1
          fi

          # Reuse the earlier orchestrator issue classifier on the common path.
          # Fall back to per-issue body lookup only when that classification is
          # incomplete (for example, a per-issue REST fallback lookup failed and
          # the label/close step conservatively treated the issue as tracking).
          IS_ORCHESTRATED="false"
          if [ -n "${MANAGED_ISSUES:-}" ]; then
            IS_ORCHESTRATED="true"
          elif [ "${ORCHESTRATOR_CLASSIFICATION_COMPLETE:-false}" != "true" ] && [ -n "${LINKED_ISSUE_NUMBERS:-}" ]; then
            echo "::warning::Reused orchestrator classification is incomplete; falling back to per-issue body lookup for PR merged alert suppression."
            while IFS= read -r issue_number; do
              [ -n "${issue_number}" ] || continue
              ISSUE_IS_MANAGED="$(_safe_gh_jq "repos/${REPOSITORY}/issues/${issue_number}" --jq '
                ((.labels // []) | map(.name) | index("ai:orchestrator-tracking")) == null
                and (
                  ((.labels // []) | map(.name) | index("ai:orchestrator-managed")) != null
                  or ((.body // "") | contains("Managed by: AI Orchestrator"))
                )
              ' || echo "")"
              if [ "${ISSUE_IS_MANAGED}" = "true" ]; then
                IS_ORCHESTRATED="true"
                break
              fi
            done <<< "${LINKED_ISSUE_NUMBERS}"
          fi

          if [ "${IS_ORCHESTRATED}" = "true" ]; then
            echo "Orchestrator-managed issue — skipping PR merged alert (poller handles completion)."
            exit 0
          fi

          # Untracked send — PR merged alerts are never deleted
          MSG="PR #${PR_NUMBER} merged: ${PR_TITLE}"
          MSG+=$'\n'
          MSG+="PR: ${PR_URL}"
          if [ -n "${LINKED_ISSUE_NUMBERS:-}" ]; then
            FIRST_ISSUE="$(echo "${LINKED_ISSUE_NUMBERS}" | head -n1)"
            if [ -n "${FIRST_ISSUE}" ]; then
              MSG+=$'\n'
              MSG+="Issue: ${{ github.server_url }}/${REPOSITORY}/issues/${FIRST_ISSUE}"
            fi
          fi
          tg_send_msg "${MSG}" "DEBUG" >/dev/null

      - name: Cleanup tracked Telegram messages
        if: always() && github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID || '' }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "Telegram not configured; skipping TG cleanup."
            exit 0
          fi

          if [ ! -s "scripts/tg_helpers.sh" ] || \
            [ ! -s ".codex-workflow-src/scripts/tg_helpers.sh" ] || \
            ! cmp -s ".codex-workflow-src/scripts/tg_helpers.sh" "scripts/tg_helpers.sh"; then
            echo "::error::Trusted issue-status Telegram support is unavailable at ${SCRIPT_REF:-unknown}."
            exit 1
          fi
          export GITHUB_REPOSITORY="${REPOSITORY}"
          source "${SUPPORT_SCRIPTS_DIR}/tg_helpers.sh"
          if ! declare -F tg_cleanup_msgs >/dev/null 2>&1; then
            echo "::error::tg_cleanup_msgs is missing from trusted Telegram support at ${SCRIPT_REF:-unknown}."
            exit 1
          fi

          # Cleanup messages tracked on the PR
          echo "Cleaning up TG messages for PR #${PR_NUMBER}..."
          tg_cleanup_msgs "${PR_NUMBER}"

          # Cleanup messages tracked on linked issues
          if [ -n "${LINKED_ISSUE_NUMBERS:-}" ]; then
            while IFS= read -r issue_number; do
              [ -n "${issue_number}" ] || continue
              echo "Cleaning up TG messages for issue #${issue_number}..."
              tg_cleanup_msgs "${issue_number}"
            done <<< "${LINKED_ISSUE_NUMBERS}"
          fi

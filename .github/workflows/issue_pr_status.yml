---
name: AI Issue PR Status Sync

"on":
  workflow_call:
    secrets:
      GH_PAT:
        required: true
      TG_BOT_SECRET:
        required: false

env:
  FINAL_LABEL: ${{ github.event.pull_request.merged && 'ai:merged' || 'ai:closed' }}

jobs:
  sync-issue-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update linked issue labels when PR closes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          ISSUE_NUMBERS="$(gh api graphql \
            -f owner="${REPOSITORY%/*}" \
            -f name="${REPOSITORY#*/}" \
            -F number="${PR_NUMBER}" \
            -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { closingIssuesReferences(first: 50) { nodes { number } } } } }' \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' || true)"

          if [ -z "${ISSUE_NUMBERS}" ]; then
            # Fallback: extract issue number from PR body/title when closing keywords are missing
            PR_DATA="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title + " " + (.body // "")' 2>/dev/null || echo "")"
            REPOSITORY_ESCAPED="${REPOSITORY//./\\.}"
            ISSUE_NUMBERS="$(echo "${PR_DATA}" | grep -oiE "(github\\.com/${REPOSITORY_ESCAPED}/issues/[0-9]+|${REPOSITORY_ESCAPED}/issues/[0-9]+|(^|[^[:alnum:]_/-])issues/[0-9]+|issue[[:space:]]*#[[:space:]]*[0-9]+|(closes|fixes|resolves)[[:space:]]*:?[[:space:]]*#[[:space:]]*[0-9]+)" | grep -oE '[0-9]+$' | sort -un || true)"
            if [ -z "${ISSUE_NUMBERS}" ]; then
              echo "No linked issues found for PR #${PR_NUMBER} (even after body/title fallback)."
              exit 0
            fi
            echo "Found linked issues via PR body/title fallback: ${ISSUE_NUMBERS}"
          fi

          # Ensure the target label exists in the repo (create if missing)
          if ! gh api "repos/${REPOSITORY}/labels/$(printf '%s' "${FINAL_LABEL}" | jq -sRr @uri)" --silent 2>/dev/null; then
            echo "Label '${FINAL_LABEL}' not found in repo, creating it..."
            if [ "${FINAL_LABEL}" = "ai:merged" ]; then
              LABEL_COLOR="5319e7"; LABEL_DESC="Linked PR merged"
            else
              LABEL_COLOR="6a737d"; LABEL_DESC="Linked PR closed without merge"
            fi
            gh api "repos/${REPOSITORY}/labels" \
              -f name="${FINAL_LABEL}" \
              -f color="${LABEL_COLOR}" \
              -f description="${LABEL_DESC}" \
              --silent 2>/dev/null || echo "::warning::Could not create label '${FINAL_LABEL}' (may already exist or lack permissions)."
          fi

          while IFS= read -r issue_number; do
            [ -n "${issue_number}" ] || continue
            echo "Updating issue #${issue_number} with label ${FINAL_LABEL}"
            gh issue edit "${issue_number}" -R "${REPOSITORY}" --remove-label 'ai:done' --remove-label 'ai:implementing' --remove-label 'ai:awaiting-approval' --remove-label 'ai:planning' --remove-label 'ai:clarification' --remove-label 'ai:ready-to-merge' --remove-label 'ai:merged' --remove-label 'ai:closed' || true
            if ! gh issue edit "${issue_number}" -R "${REPOSITORY}" --add-label "${FINAL_LABEL}"; then
              echo "::warning::Failed to add label '${FINAL_LABEL}' to issue #${issue_number}."
            fi
          done <<< "${ISSUE_NUMBERS}"

          # Export linked issue numbers for TG cleanup step
          echo "LINKED_ISSUE_NUMBERS<<EOF" >> "$GITHUB_ENV"
          echo "${ISSUE_NUMBERS}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Send PR merged Telegram alert
        if: github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID || '' }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "Telegram not configured; skipping PR merged alert."
            exit 0
          fi

          # Only alert for non-orchestrator issues (orchestrator projects
          # get their own completion alerts from the poller).
          IS_ORCHESTRATED="false"
          if [ -n "${LINKED_ISSUE_NUMBERS:-}" ]; then
            while IFS= read -r issue_number; do
              [ -n "${issue_number}" ] || continue
              BODY="$(gh api "repos/${REPOSITORY}/issues/${issue_number}" --jq '.body // ""' 2>/dev/null || echo "")"
              if printf '%s' "${BODY}" | grep -qF 'Managed by: AI Orchestrator'; then
                IS_ORCHESTRATED="true"
                break
              fi
            done <<< "${LINKED_ISSUE_NUMBERS}"
          fi

          if [ "${IS_ORCHESTRATED}" = "true" ]; then
            echo "Orchestrator-managed issue — skipping PR merged alert (poller handles completion)."
            exit 0
          fi

          # Untracked send — PR merged alerts are never deleted
          MSG="PR #${PR_NUMBER} merged: ${PR_TITLE}"
          MSG+=$'\n'
          MSG+="${PR_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_SECRET}/sendMessage" \
            -d "chat_id=${TG_ADMIN_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}" >/dev/null 2>&1 || echo "::warning::Telegram send failed"

      - name: Cleanup tracked Telegram messages
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID || '' }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "Telegram not configured; skipping TG cleanup."
            exit 0
          fi

          # Fetch tg_helpers.sh
          wf_source="shubhodeep1/coding-workflows"
          mkdir -p scripts
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${wf_source}/contents/scripts/tg_helpers.sh?ref=stable" > "scripts/tg_helpers.sh" 2>/dev/null || {
            echo "::warning::Could not fetch tg_helpers.sh; skipping TG cleanup."
            exit 0
          }
          export GITHUB_REPOSITORY="${REPOSITORY}"
          source scripts/tg_helpers.sh

          # Cleanup messages tracked on the PR
          echo "Cleaning up TG messages for PR #${PR_NUMBER}..."
          tg_cleanup_msgs "${PR_NUMBER}"

          # Cleanup messages tracked on linked issues
          if [ -n "${LINKED_ISSUE_NUMBERS:-}" ]; then
            while IFS= read -r issue_number; do
              [ -n "${issue_number}" ] || continue
              echo "Cleaning up TG messages for issue #${issue_number}..."
              tg_cleanup_msgs "${issue_number}"
            done <<< "${LINKED_ISSUE_NUMBERS}"
          fi

---
name: AI Issue PR Status Sync

"on":
  workflow_call:
    secrets:
      GH_PAT:
        required: true
      TG_BOT_SECRET:
        required: false

env:
  FINAL_LABEL: ${{ github.event.pull_request.merged && 'ai:merged' || 'ai:closed' }}

jobs:
  sync-issue-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Configure git auth for memory helper clones
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_PAT is empty"; exit 1; }
          SERVER_HOST="${GITHUB_SERVER_URL#https://}"
          SERVER_HOST="${SERVER_HOST#http://}"
          SERVER_HOST="${SERVER_HOST%/}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch memory helper scripts
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          wf_source="shubhodeep1/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            script_ref="${{ github.sha }}"
          else
            script_ref="stable"
          fi

          mkdir -p scripts

          _rl_wait() {
            local _reset_ts _wait_secs
            _reset_ts=$(gh api -i /rate_limit 2>/dev/null | grep -i '^x-ratelimit-reset:' | head -1 | awk '{print $2}' | tr -d '\r') || true
            if [ -n "${_reset_ts}" ] && [ "${_reset_ts}" -gt 0 ] 2>/dev/null; then
              _wait_secs=$(( _reset_ts - $(date +%s) + 1 ))
              [ "${_wait_secs}" -lt 1 ] && _wait_secs=1
              [ "${_wait_secs}" -gt 600 ] && _wait_secs=600
            else
              _wait_secs=30
            fi
            echo "::warning::  Rate limit resets in ${_wait_secs}s (X-RateLimit-Reset: ${_reset_ts:-unknown})" >&2
            sleep "${_wait_secs}"
          }
          fetch_from_ref_or_local() {
            local repo_path="$1"
            local target_path="$2"
            local tmp_path="${target_path}.tmp"
            local attempt=1

            while [ "${attempt}" -le 5 ]; do
              if gh api -H 'Accept: application/vnd.github.raw+json' \
                "repos/${wf_source}/contents/${repo_path}?ref=${script_ref}" > "${tmp_path}" 2>/tmp/_gh_rl_err; then
                mv "${tmp_path}" "${target_path}"
                return 0
              fi
              if grep -qiE 'rate limit|abuse detection|secondary rate|HTTP 429' /tmp/_gh_rl_err 2>/dev/null; then
                echo "::warning::Rate limit hit (attempt ${attempt}/5), waiting for reset…" >&2
                _rl_wait; attempt=$((attempt + 1))
              else
                break
              fi
            done

            rm -f "${tmp_path}"
            if [ -f "${target_path}" ]; then
              echo "Using local fallback for ${target_path} (not found on ${script_ref}: ${repo_path})"
              return 0
            fi

            echo "Missing required file: ${repo_path} (${script_ref}) and local fallback ${target_path}" >&2
            return 1
          }

          MEMORY_HELPERS_READY=1
          _fetched_scripts=()
          for f in gh_helpers.sh ai_memory.py ai_memory_lib.py openrouter_prompt_cache.py memory_helpers.sh; do
            if ! fetch_from_ref_or_local "scripts/${f}" "scripts/${f}"; then
              MEMORY_HELPERS_READY=0
            fi
            _fetched_scripts+=("${f}")
          done
          # Block fetched scripts from being committed in consumer repos.
          if [ "${{ github.repository }}" != "${wf_source}" ]; then
            {
              echo "# Auto-generated by coding-workflows — DO NOT EDIT"
              echo "# Prevents runtime-fetched support scripts from being committed."
              printf '%s\n' "${_fetched_scripts[@]}" tg_helpers.sh .gitignore
            } > scripts/.gitignore
          fi
          # Fetch AI memory schema files so consumer repos that lack
          # schemas on their default branch can bootstrap the ai-memory
          # branch (schemas are validated during memory operations).
          mkdir -p ai-memory/schemas
          for sf in memory_record.v1.json processed_command_entry.v1.json run_ledger_entry.v1.json task_lineage.v1.json; do
            if [ ! -f "ai-memory/schemas/${sf}" ]; then
              gh api -H 'Accept: application/vnd.github.raw+json' \
                "repos/${wf_source}/contents/ai-memory/schemas/${sf}?ref=${script_ref}" > "ai-memory/schemas/${sf}" 2>/dev/null || true
            fi
          done

          echo "MEMORY_HELPERS_READY=${MEMORY_HELPERS_READY}" >> "$GITHUB_ENV"

      - name: Update linked issue labels when PR closes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }

          ISSUE_NUMBERS="$(gh_retry gh api graphql \
            -f owner="${REPOSITORY%/*}" \
            -f name="${REPOSITORY#*/}" \
            -F number="${PR_NUMBER}" \
            -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { closingIssuesReferences(first: 50) { nodes { number } } } } }' \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' || true)"

          if [ -z "${ISSUE_NUMBERS}" ]; then
            # Fallback: extract issue number from PR body/title when closing keywords are missing
            PR_DATA="$(gh_retry gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title + " " + (.body // "")' 2>/dev/null || echo "")"
            REPOSITORY_ESCAPED="${REPOSITORY//./\\.}"
            ISSUE_NUMBERS="$(echo "${PR_DATA}" | grep -oiE "(github\\.com/${REPOSITORY_ESCAPED}/issues/[0-9]+|${REPOSITORY_ESCAPED}/issues/[0-9]+|(^|[^[:alnum:]_/-])issues/[0-9]+|issue[[:space:]]*#[[:space:]]*[0-9]+|(closes|fixes|resolves)[[:space:]]*:?[[:space:]]*#[[:space:]]*[0-9]+)" | grep -oE '[0-9]+$' | sort -un || true)"
            if [ -z "${ISSUE_NUMBERS}" ]; then
              echo "No linked issues found for PR #${PR_NUMBER} (even after body/title fallback)."
              ISSUE_NUMBERS=""
            fi
            if [ -n "${ISSUE_NUMBERS}" ]; then
              echo "Found linked issues via PR body/title fallback: ${ISSUE_NUMBERS}"
            fi
          fi

          BRANCH_ISSUE_NUMBER="$(printf '%s\n' "${PR_HEAD_REF}" | sed -nE 's#^ai/issue-([0-9]+)([-/].*)?$#\1#p' | head -n1)"
          if [ -n "${BRANCH_ISSUE_NUMBER}" ]; then
            if [ -n "${ISSUE_NUMBERS}" ]; then
              ISSUE_NUMBERS="$(printf '%s\n%s\n' "${ISSUE_NUMBERS}" "${BRANCH_ISSUE_NUMBER}" | awk 'NF' | sort -un)"
            else
              ISSUE_NUMBERS="${BRANCH_ISSUE_NUMBER}"
            fi
            echo "Resolved linked issue from branch ${PR_HEAD_REF}: #${BRANCH_ISSUE_NUMBER}"
          fi

          if [ -z "${ISSUE_NUMBERS}" ]; then
            echo "No linked issues found for PR #${PR_NUMBER}."
            exit 0
          fi

          # Ensure the target label exists in the repo (create if missing)
          if ! gh_retry gh api "repos/${REPOSITORY}/labels/$(printf '%s' "${FINAL_LABEL}" | jq -sRr @uri)" --silent 2>/dev/null; then
            echo "Label '${FINAL_LABEL}' not found in repo, creating it..."
            if [ "${FINAL_LABEL}" = "ai:merged" ]; then
              LABEL_COLOR="5319e7"; LABEL_DESC="Linked PR merged"
            else
              LABEL_COLOR="6a737d"; LABEL_DESC="Linked PR closed without merge"
            fi
            gh_retry gh api "repos/${REPOSITORY}/labels" \
              -f name="${FINAL_LABEL}" \
              -f color="${LABEL_COLOR}" \
              -f description="${LABEL_DESC}" \
              --silent 2>/dev/null || echo "::warning::Could not create label '${FINAL_LABEL}' (may already exist or lack permissions)."
          fi

          while IFS= read -r issue_number; do
            [ -n "${issue_number}" ] || continue
            echo "Updating issue #${issue_number} with label ${FINAL_LABEL}"
            if ! gh_retry gh issue edit "${issue_number}" -R "${REPOSITORY}" --remove-label 'ai:done' --remove-label 'ai:implementing' --remove-label 'ai:awaiting-approval' --remove-label 'ai:planning' --remove-label 'ai:clarification' --remove-label 'ai:ready-to-merge' --remove-label 'ai:review-blocked' --remove-label 'ai:implementation-failed' --remove-label 'ai:merged' --remove-label 'ai:closed' --add-label "${FINAL_LABEL}"; then
              echo "::warning::Failed to update labels on issue #${issue_number}."
            fi

            if [ "${PR_MERGED}" != "true" ] || [ "${PR_BASE_REF}" = "main" ]; then
              echo "Closing issue #${issue_number} after PR #${PR_NUMBER} close event."
              if ! gh_retry gh issue close "${issue_number}" -R "${REPOSITORY}"; then
                echo "::warning::Failed to close issue #${issue_number}."
              fi
            else
              echo "PR merged into ${PR_BASE_REF}; issue #${issue_number} remains open."
            fi
          done <<< "${ISSUE_NUMBERS}"

          # Export linked issue numbers for TG cleanup step
          echo "LINKED_ISSUE_NUMBERS<<EOF" >> "$GITHUB_ENV"
          echo "${ISSUE_NUMBERS}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Finalize linked issue lineage state
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          AI_MEMORY_ENABLED: ${{ vars.AI_MEMORY_ENABLED || 'true' }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [ -z "${LINKED_ISSUE_NUMBERS:-}" ]; then
            echo "No linked issues found; skipping lineage finalization."
            exit 0
          fi

          case "$(printf '%s' "${AI_MEMORY_ENABLED}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on) ;;
            *) echo "AI memory disabled; skipping lineage finalization."; exit 0 ;;
          esac

          if [ "${MEMORY_HELPERS_READY:-0}" != "1" ]; then
            echo "Missing required memory helper scripts; cannot finalize lineage." >&2
            exit 1
          fi

          [ -f scripts/memory_helpers.sh ] || {
            echo "memory_helpers.sh missing; cannot finalize lineage." >&2
            exit 1
          }

          if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            FINAL_STATE="merged"
          else
            FINAL_STATE="closed"
          fi

          source scripts/memory_helpers.sh
          memory_ensure_branch

          while IFS= read -r issue_number; do
            [ -n "${issue_number}" ] || continue

            ISSUE_URL="${{ github.server_url }}/${REPOSITORY}/issues/${issue_number}"
            memory_finalize_task \
              --issue-number "${issue_number}" \
              --issue-url "${ISSUE_URL}" \
              --final-state "${FINAL_STATE}" \
              --workflow "${WORKFLOW_NAME}" \
              --run-id "${RUN_ID}" \
              --run-attempt "${RUN_ATTEMPT}" \
              --actor "${ACTOR}" \
              --pr-number "${PR_NUMBER}" \
              --pr-url "${PR_URL}"
          done <<< "${LINKED_ISSUE_NUMBERS}"

      - name: Send PR merged Telegram alert
        if: github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID || '' }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "Telegram not configured; skipping PR merged alert."
            exit 0
          fi

          # Inline-fetch tg_helpers.sh for alert level support
          wf_source="${{ github.repository_owner }}/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            script_ref="${{ github.sha }}"
          else
            script_ref="stable"
          fi
          mkdir -p scripts
          helpers_tmp="$(mktemp)"
          if gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${wf_source}/contents/scripts/tg_helpers.sh?ref=${script_ref}" > "${helpers_tmp}" 2>/dev/null && [ -s "${helpers_tmp}" ]; then
            mv "${helpers_tmp}" "scripts/tg_helpers.sh"
            source scripts/tg_helpers.sh
          else
            rm -f "${helpers_tmp}"
          fi

          # Only alert for non-orchestrator issues (orchestrator projects
          # get their own completion alerts from the poller).
          IS_ORCHESTRATED="false"
          if [ -n "${LINKED_ISSUE_NUMBERS:-}" ]; then
            while IFS= read -r issue_number; do
              [ -n "${issue_number}" ] || continue
              BODY="$(_safe_gh_jq "repos/${REPOSITORY}/issues/${issue_number}" --jq '.body // ""' || echo "")"
              if printf '%s' "${BODY}" | grep -qF 'Managed by: AI Orchestrator'; then
                IS_ORCHESTRATED="true"
                break
              fi
            done <<< "${LINKED_ISSUE_NUMBERS}"
          fi

          if [ "${IS_ORCHESTRATED}" = "true" ]; then
            echo "Orchestrator-managed issue — skipping PR merged alert (poller handles completion)."
            exit 0
          fi

          # Untracked send — PR merged alerts are never deleted
          MSG="PR #${PR_NUMBER} merged: ${PR_TITLE}"
          MSG+=$'\n'
          MSG+="PR: ${PR_URL}"
          if [ -n "${LINKED_ISSUE_NUMBERS:-}" ]; then
            FIRST_ISSUE="$(echo "${LINKED_ISSUE_NUMBERS}" | head -n1)"
            if [ -n "${FIRST_ISSUE}" ]; then
              MSG+=$'\n'
              MSG+="Issue: ${{ github.server_url }}/${REPOSITORY}/issues/${FIRST_ISSUE}"
            fi
          fi
          if declare -F tg_send_msg >/dev/null 2>&1; then
            tg_send_msg "${MSG}" "DEBUG" >/dev/null
          else
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_SECRET}/sendMessage" \
              -d "chat_id=${TG_ADMIN_CHAT_ID}" \
              -d "disable_web_page_preview=true" \
              --data-urlencode "text=${MSG}" >/dev/null 2>&1 || echo "::warning::Telegram send failed"
          fi

      - name: Cleanup tracked Telegram messages
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID || '' }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${TG_ADMIN_CHAT_ID:-}" ]; then
            echo "Telegram not configured; skipping TG cleanup."
            exit 0
          fi

          # Fetch tg_helpers.sh
          wf_source="shubhodeep1/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            script_ref="${{ github.sha }}"
          else
            script_ref="stable"
          fi
          mkdir -p scripts
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${wf_source}/contents/scripts/tg_helpers.sh?ref=${script_ref}" > "scripts/tg_helpers.sh" 2>/dev/null || {
            echo "::warning::Could not fetch tg_helpers.sh; skipping TG cleanup."
            exit 0
          }
          [ -s "scripts/tg_helpers.sh" ] || { echo "::warning::tg_helpers.sh is empty; skipping TG cleanup."; exit 0; }
          export GITHUB_REPOSITORY="${REPOSITORY}"
          source scripts/tg_helpers.sh
          if ! declare -F tg_cleanup_msgs >/dev/null 2>&1; then
            echo "::warning::tg_cleanup_msgs helper missing; skipping TG cleanup."
            exit 0
          fi

          # Cleanup messages tracked on the PR
          echo "Cleaning up TG messages for PR #${PR_NUMBER}..."
          tg_cleanup_msgs "${PR_NUMBER}"

          # Cleanup messages tracked on linked issues
          if [ -n "${LINKED_ISSUE_NUMBERS:-}" ]; then
            while IFS= read -r issue_number; do
              [ -n "${issue_number}" ] || continue
              echo "Cleaning up TG messages for issue #${issue_number}..."
              tg_cleanup_msgs "${issue_number}"
            done <<< "${LINKED_ISSUE_NUMBERS}"
          fi

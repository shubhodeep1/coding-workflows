---
name: Promote main to stable

# Use this workflow when `main` is ready to become the new stable
# baseline (typically a minor or major version bump). It does two
# things in one run:
#
#   1. Fast-forwards the long-lived `stable` branch to `main`.
#   2. Dispatches `test-and-mark-stable.yml` on the freshly-updated
#      `stable` branch, which runs the release gate, tags the commit,
#      moves the `stable` and `vN` git tags, creates a GitHub Release,
#      and fires the `coding-workflows-stable-released` dispatch to
#      every consumer repo.
#
# For BUG-FIX patch releases on the existing stable line, do NOT use
# this workflow — dispatch `test-and-mark-stable.yml` directly from
# the `stable` branch with `--ref stable`.
#
# Pre-condition: `stable` must be an ancestor of (or equal to) `main`.
# The `forward-merge-stable-to-main.yml` workflow normally guarantees
# this. If `--ff-only` would refuse, this workflow refuses too — fix
# the divergence first instead of force-pushing stable.

"on":
  workflow_dispatch:
    inputs:
      version_tag:
        description: >
          Semantic version tag (e.g. v1.5.0). Leave blank to
          auto-increment the MINOR component from the latest
          stable-reachable tag (vX.Y.Z → vX.(Y+1).0). The patch
          component is reset to 0 — promotes are minor/major bumps
          by definition; the patch-bump default in
          test-and-mark-stable.yml is for the stable-only patch path.
        required: false
        type: string
        default: ""
      test_repo:
        description: >
          Forwarded to test-and-mark-stable.yml. Repository to run
          E2E smoke test on (owner/repo). Defaults to this repo.
        required: false
        type: string
        default: ""
      skip_e2e:
        description: Forwarded to test-and-mark-stable.yml.
        required: false
        type: boolean
        default: false
      dry_run:
        description: >
          Validate only. Still fast-forwards `stable` to `main` (so
          you can verify the move), but the downstream release gate
          runs in dry_run mode — no tags pushed, no GitHub Release
          created, no consumer dispatches.
        required: false
        type: boolean
        default: false
      phase_timeout:
        description: Forwarded to test-and-mark-stable.yml.
        required: false
        type: number
        default: 30
      review_timeout:
        description: >
          Forwarded to test-and-mark-stable.yml. Default mirrors that
          workflow's own `review_timeout` default (60), which was raised
          30→40 in #3290 and 40→60 after run 28282500673 (v1.20.1) to
          absorb slow multi-pass reviewer LLM steps.
          Because this dispatcher forwards the value explicitly
          (`-f review_timeout=...`), a stale lower value here silently
          overrides the downstream default and re-introduces the
          wait-review false-timeout: the v1.27.0 release failure
          (run 32824674139) happened exactly this way — this default
          still said 40 after the downstream 40→60 bump, so a healthy
          51m "Run reviewer models" step aged out the 40m inactivity
          timer. When test-and-mark-stable.yml's `review_timeout`
          default changes, this default MUST change with it.
        required: false
        type: number
        default: 60

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-main-to-stable
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout stable (full history)
        uses: actions/checkout@v5
        with:
          ref: stable
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest main
        run: |
          set -euo pipefail
          git fetch origin main

      - name: Validate stable is fast-forwardable to main
        run: |
          set -euo pipefail
          # `stable` must be an ancestor of `origin/main` (or equal). If
          # it isn't, stable has commits not present on main — most
          # likely a forward-merge PR that wasn't merged, a direct push
          # to stable that bypassed the forward-merge workflow, or — by
          # far the most common cause in this repo's history — a
          # forward-merge PR that WAS merged but via "Squash and merge"
          # / "Rebase and merge" instead of "Create a merge commit",
          # which copies the file content into a new single-parent
          # commit on main and silently strips stable's commits from
          # main's ancestry. Refuse rather than silently force-pushing
          # or merging — the operator should investigate first.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            ahead=$(git rev-list --count origin/main..HEAD)
            mb=$(git merge-base HEAD origin/main 2>/dev/null || echo "")
            echo "::error::stable has ${ahead} commit(s) not present on main — refusing to promote."
            if [ -z "${mb}" ]; then
              echo "::error::stable and main have NO common ancestor (unrelated histories) — every recent forward-merge PR was likely squash-merged. Recovery: cherry-pick any genuinely unforwarded stable patches onto main, then force-reset stable to origin/main (\`git push --force-with-lease origin <main-sha>:refs/heads/stable\`)."
            else
              echo "::error::Most likely cause: a forward-merge PR was merged via \"Squash and merge\" or \"Rebase and merge\" instead of \"Create a merge commit\". Squash/rebase strips stable's commits from main's ancestry even though the file content was forwarded. Inspect with: \`git log --oneline origin/main..HEAD\` and verify the corresponding squash commits on main."
            fi
            echo "::error::Forward-merge those commits via forward-merge-stable-to-main.yml first (and use \"Create a merge commit\" when merging the fallback PR), then re-run."
            exit 1
          fi

      - name: Fast-forward stable to main
        id: ff
        run: |
          set -euo pipefail
          # Pre-check: `stable` MUST exist on origin as a branch. A naked
          # `git push origin stable` from a detached HEAD (which is what
          # `actions/checkout ref: stable` produces when only a `stable`
          # tag exists) will silently match the tag refspec and report
          # "Everything up-to-date" without moving any branch — the
          # downstream release would then run against an unchanged
          # commit. ls-remote --exit-code: 0 found, 2 absent, other =
          # transport/auth/repo error.
          set +e
          git ls-remote --exit-code --heads origin stable >/dev/null 2>&1
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            2)
              echo "::error::Origin has no 'stable' branch. The promote workflow requires a long-lived stable branch (consumers pin to the @stable tag, but the branch is what this workflow fast-forwards)."
              echo "::error::Create it once with: git push origin <commit>:refs/heads/stable"
              exit 1
              ;;
            *)
              echo "::error::git ls-remote failed with exit code ${rc} (transport/auth/repo error). Refusing to proceed without a confirmed branch-present signal."
              exit 1
              ;;
          esac

          BEFORE=$(git rev-parse HEAD)
          TARGET=$(git rev-parse origin/main)
          if [ "${BEFORE}" = "${TARGET}" ]; then
            echo "stable already at main's HEAD (${TARGET}) — no-op"
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "sha=${TARGET}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --ff-only origin/main
          # Push HEAD explicitly to refs/heads/stable. Without the
          # explicit refspec, `git push origin stable` from a detached
          # HEAD resolves to the local `stable` tag (if present) and
          # no-ops; the explicit `HEAD:refs/heads/stable` always
          # targets the branch.
          git push origin "HEAD:refs/heads/stable"

          # Post-verify: confirm origin's stable branch actually moved
          # to TARGET. Catches any path where the push appeared to
          # succeed but the remote ref didn't advance (e.g. a server-
          # side hook silently dropped the update, or an intermediate
          # cache returned a stale OK).
          # Bounded retry distinguishes a transient transport failure
          # from a real ref mismatch — without it, a network blip
          # would surface as "origin/stable is at <empty>, expected
          # TARGET" instead of the underlying transport error.
          ls_attempt=1
          REMOTE_AFTER=""
          while [ "$ls_attempt" -le 3 ]; do
            set +e
            git ls-remote origin refs/heads/stable >/tmp/_ls_remote_out 2>/tmp/_ls_remote_err
            ls_rc=$?
            set -e
            if [ "$ls_rc" -eq 0 ]; then
              REMOTE_AFTER=$(awk '{print $1}' /tmp/_ls_remote_out 2>/dev/null || true)
              if [ -n "$REMOTE_AFTER" ]; then
                break
              fi
            fi
            if [ "$ls_attempt" -eq 3 ]; then
              echo "::error::Post-push verification failed: git ls-remote could not return a SHA for refs/heads/stable after 3 attempts (rc=${ls_rc}). Cannot confirm origin/stable advanced — re-run after the transport issue resolves."
              cat /tmp/_ls_remote_err >&2 2>/dev/null || true
              exit 1
            fi
            backoff=$(( 2 ** ls_attempt ))
            echo "::warning::git ls-remote failed (attempt ${ls_attempt}/3), retrying in ${backoff}s…"
            cat /tmp/_ls_remote_err >&2 2>/dev/null || true
            sleep "${backoff}"
            ls_attempt=$((ls_attempt + 1))
          done
          if [ "${REMOTE_AFTER}" != "${TARGET}" ]; then
            echo "::error::Push reported success but origin/stable is at ${REMOTE_AFTER}, expected ${TARGET}. Refusing to dispatch the release on stale state."
            exit 1
          fi
          echo "Fast-forwarded stable: ${BEFORE} → ${TARGET} (verified on origin)"
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "sha=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Resolve version (compute next minor if not provided)
        id: resolve_version
        env:
          INPUT_VERSION: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          # Promote runs are minor/major bumps by definition; the
          # auto-bump path here computes vX.(Y+1).0 from the latest
          # semver tag reachable from the just-fast-forwarded HEAD
          # (== main HEAD). The patch-bump auto-resolver in
          # test-and-mark-stable.yml is appropriate for the stable-
          # only patch path; we override it here by passing an
          # explicit version_tag through to the dispatch.
          if [ -n "${INPUT_VERSION}" ]; then
            if [[ ! "${INPUT_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Provided version '${INPUT_VERSION}' is invalid; must match vX.Y.Z"
              exit 1
            fi
            echo "Using user-provided version: ${INPUT_VERSION}"
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Refresh tags from origin BEFORE computing LATEST. Bounded
          # retry tolerates transient network/auth flakes; persistent
          # failure is a hard error since computing the next version
          # on stale tag data could pick a colliding version.
          fetch_attempt=1
          while [ "$fetch_attempt" -le 3 ]; do
            if git fetch --tags --force origin 2>/tmp/_git_fetch_err; then
              break
            fi
            if [ "$fetch_attempt" -eq 3 ]; then
              echo "::error::Failed to fetch remote tags after 3 attempts — refusing to compute next version on potentially stale tag data"
              cat /tmp/_git_fetch_err >&2 2>/dev/null || true
              exit 1
            fi
            backoff=$(( 2 ** fetch_attempt ))
            echo "::warning::git fetch --tags failed (attempt ${fetch_attempt}/3), retrying in ${backoff}s…"
            cat /tmp/_git_fetch_err >&2 2>/dev/null || true
            sleep "${backoff}"
            fetch_attempt=$((fetch_attempt + 1))
          done

          # Strict semver filter mirrors test-and-mark-stable.yml's
          # resolver: the shell glob also matches prerelease tags
          # (e.g. v1.4.2-beta.1) which would later break minor
          # arithmetic on `cut -d. -f2` under `set -euo pipefail`.
          LATEST=$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | head -n1)

          if [ -z "$LATEST" ]; then
            NEXT="v1.0.0"
            echo "No existing version tags reachable from HEAD. Defaulting to ${NEXT}"
          else
            MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
            # Bump minor (patch resets to 0) and skip any candidate
            # already in the local tag namespace (which mirrors origin
            # after the fetch above). Bounded to 1000 iterations as a
            # belt-and-braces guard.
            NEXT=""
            i=0
            while [ "$i" -lt 1000 ]; do
              MINOR=$((MINOR + 1))
              CANDIDATE="v${MAJOR}.${MINOR}.0"
              if ! git rev-parse "refs/tags/${CANDIDATE}" >/dev/null 2>&1; then
                NEXT="$CANDIDATE"
                break
              fi
              echo "Tag ${CANDIDATE} already exists — skipping"
              i=$((i + 1))
            done
            if [ -z "$NEXT" ]; then
              echo "::error::Could not find an unused minor tag after 1000 attempts starting from ${LATEST}"
              exit 1
            fi
            echo "Latest reachable tag: ${LATEST} → next promote version: ${NEXT}"
          fi

          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Dispatch test-and-mark-stable on stable
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          RESOLVED_VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          set -euo pipefail
          # test-and-mark-stable.yml hard-rejects any dispatch ref
          # other than `stable`, so we MUST pass `--ref stable` here.
          # The release job tags the just-fast-forwarded commit on
          # stable and `gh release create` targets the stable branch.
          # Passing `version_tag` explicitly overrides
          # test-and-mark-stable.yml's auto-bump (which would patch-
          # bump) — promote runs are minor/major by definition.
          gh workflow run test-and-mark-stable.yml \
            --ref stable \
            -f version_tag="${RESOLVED_VERSION}" \
            -f test_repo="${{ inputs.test_repo }}" \
            -f skip_e2e="${{ inputs.skip_e2e }}" \
            -f dry_run="${{ inputs.dry_run }}" \
            -f phase_timeout="${{ inputs.phase_timeout }}" \
            -f review_timeout="${{ inputs.review_timeout }}"
          echo "Dispatched test-and-mark-stable.yml on stable branch with version=${RESOLVED_VERSION}."
          echo "View runs: https://github.com/${GITHUB_REPOSITORY}/actions/workflows/test-and-mark-stable.yml"

      - name: Summary
        run: |
          set -euo pipefail
          echo "Promotion summary:"
          echo "  stable now at: ${{ steps.ff.outputs.sha }}"
          echo "  fast-forward moved: ${{ steps.ff.outputs.moved }}"
          echo "  resolved version: ${{ steps.resolve_version.outputs.version }}"
          echo "  release pipeline dispatched on stable branch (see link above)"
          echo ""
          echo "The release run will tag, move the stable/vN pointers, create a"
          echo "GitHub Release, and dispatch coding-workflows-stable-released"
          echo "to every consumer repo. Watch its status for completion."

---
name: Promote main to stable

# Use this workflow when `main` is ready to become the new stable
# baseline (typically a minor or major version bump). It does two
# things in one run:
#
#   1. Fast-forwards the long-lived `stable` branch to `main`.
#   2. Dispatches `test-and-mark-stable.yml` on the freshly-updated
#      `stable` branch, which runs the release gate, tags the commit,
#      moves the `stable` and `vN` git tags, creates a GitHub Release,
#      and fires the `coding-workflows-stable-released` dispatch to
#      every consumer repo.
#
# For BUG-FIX patch releases on the existing stable line, do NOT use
# this workflow — dispatch `test-and-mark-stable.yml` directly from
# the `stable` branch with `--ref stable`.
#
# Pre-condition: `stable` must be an ancestor of (or equal to) `main`.
# The `forward-merge-stable-to-main.yml` workflow normally guarantees
# this. If `--ff-only` would refuse, this workflow refuses too — fix
# the divergence first instead of force-pushing stable.

"on":
  workflow_dispatch:
    inputs:
      version_tag:
        description: >
          Semantic version tag (e.g. v1.5.0). Almost always required
          for a promotion (since the typical case is a minor/major
          bump). Leave blank to fall back to patch auto-increment
          from the latest stable-reachable tag.
        required: false
        type: string
        default: ""
      test_repo:
        description: >
          Forwarded to test-and-mark-stable.yml. Repository to run
          E2E smoke test on (owner/repo). Defaults to this repo.
        required: false
        type: string
        default: ""
      skip_e2e:
        description: Forwarded to test-and-mark-stable.yml.
        required: false
        type: boolean
        default: false
      dry_run:
        description: >
          Validate only. Still fast-forwards `stable` to `main` (so
          you can verify the move), but the downstream release gate
          runs in dry_run mode — no tags pushed, no GitHub Release
          created, no consumer dispatches.
        required: false
        type: boolean
        default: false
      phase_timeout:
        description: Forwarded to test-and-mark-stable.yml.
        required: false
        type: number
        default: 30
      review_timeout:
        description: Forwarded to test-and-mark-stable.yml.
        required: false
        type: number
        default: 30

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-main-to-stable
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout stable (full history)
        uses: actions/checkout@v5
        with:
          ref: stable
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest main
        run: |
          set -euo pipefail
          git fetch origin main

      - name: Validate stable is fast-forwardable to main
        run: |
          set -euo pipefail
          # `stable` must be an ancestor of `origin/main` (or equal). If
          # it isn't, stable has commits not present on main — most
          # likely a forward-merge PR that wasn't merged, or a direct
          # push to stable that bypassed the forward-merge workflow.
          # Refuse rather than silently force-pushing or merging — the
          # operator should investigate first.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            ahead=$(git rev-list --count origin/main..HEAD)
            echo "::error::stable has ${ahead} commit(s) not present on main — refusing to promote."
            echo "::error::Forward-merge those commits via forward-merge-stable-to-main.yml first, then re-run."
            exit 1
          fi

      - name: Fast-forward stable to main
        id: ff
        run: |
          set -euo pipefail
          # Pre-check: `stable` MUST exist on origin as a branch. A naked
          # `git push origin stable` from a detached HEAD (which is what
          # `actions/checkout ref: stable` produces when only a `stable`
          # tag exists) will silently match the tag refspec and report
          # "Everything up-to-date" without moving any branch — the
          # downstream release would then run against an unchanged
          # commit. ls-remote --exit-code: 0 found, 2 absent, other =
          # transport/auth/repo error.
          set +e
          git ls-remote --exit-code --heads origin stable >/dev/null 2>&1
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            2)
              echo "::error::Origin has no 'stable' branch. The promote workflow requires a long-lived stable branch (consumers pin to the @stable tag, but the branch is what this workflow fast-forwards)."
              echo "::error::Create it once with: git push origin <commit>:refs/heads/stable"
              exit 1
              ;;
            *)
              echo "::error::git ls-remote failed with exit code ${rc} (transport/auth/repo error). Refusing to proceed without a confirmed branch-present signal."
              exit 1
              ;;
          esac

          BEFORE=$(git rev-parse HEAD)
          TARGET=$(git rev-parse origin/main)
          if [ "${BEFORE}" = "${TARGET}" ]; then
            echo "stable already at main's HEAD (${TARGET}) — no-op"
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "sha=${TARGET}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --ff-only origin/main
          # Push HEAD explicitly to refs/heads/stable. Without the
          # explicit refspec, `git push origin stable` from a detached
          # HEAD resolves to the local `stable` tag (if present) and
          # no-ops; the explicit `HEAD:refs/heads/stable` always
          # targets the branch.
          git push origin "HEAD:refs/heads/stable"

          # Post-verify: confirm origin's stable branch actually moved
          # to TARGET. Catches any path where the push appeared to
          # succeed but the remote ref didn't advance (e.g. a server-
          # side hook silently dropped the update, or an intermediate
          # cache returned a stale OK).
          # Bounded retry distinguishes a transient transport failure
          # from a real ref mismatch — without it, a network blip
          # would surface as "origin/stable is at <empty>, expected
          # TARGET" instead of the underlying transport error.
          ls_attempt=1
          REMOTE_AFTER=""
          while [ "$ls_attempt" -le 3 ]; do
            set +e
            git ls-remote origin refs/heads/stable >/tmp/_ls_remote_out 2>/tmp/_ls_remote_err
            ls_rc=$?
            set -e
            if [ "$ls_rc" -eq 0 ]; then
              REMOTE_AFTER=$(awk '{print $1}' /tmp/_ls_remote_out 2>/dev/null || true)
              if [ -n "$REMOTE_AFTER" ]; then
                break
              fi
            fi
            if [ "$ls_attempt" -eq 3 ]; then
              echo "::error::Post-push verification failed: git ls-remote could not return a SHA for refs/heads/stable after 3 attempts (rc=${ls_rc}). Cannot confirm origin/stable advanced — re-run after the transport issue resolves."
              cat /tmp/_ls_remote_err >&2 2>/dev/null || true
              exit 1
            fi
            backoff=$(( 2 ** ls_attempt ))
            echo "::warning::git ls-remote failed (attempt ${ls_attempt}/3), retrying in ${backoff}s…"
            cat /tmp/_ls_remote_err >&2 2>/dev/null || true
            sleep "${backoff}"
            ls_attempt=$((ls_attempt + 1))
          done
          if [ "${REMOTE_AFTER}" != "${TARGET}" ]; then
            echo "::error::Push reported success but origin/stable is at ${REMOTE_AFTER}, expected ${TARGET}. Refusing to dispatch the release on stale state."
            exit 1
          fi
          echo "Fast-forwarded stable: ${BEFORE} → ${TARGET} (verified on origin)"
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "sha=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Dispatch test-and-mark-stable on stable
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          # test-and-mark-stable.yml hard-rejects any dispatch ref
          # other than `stable`, so we MUST pass `--ref stable` here.
          # The release job tags the just-fast-forwarded commit on
          # stable and `gh release create` targets the stable branch.
          gh workflow run test-and-mark-stable.yml \
            --ref stable \
            -f version_tag="${{ inputs.version_tag }}" \
            -f test_repo="${{ inputs.test_repo }}" \
            -f skip_e2e="${{ inputs.skip_e2e }}" \
            -f dry_run="${{ inputs.dry_run }}" \
            -f phase_timeout="${{ inputs.phase_timeout }}" \
            -f review_timeout="${{ inputs.review_timeout }}"
          echo "Dispatched test-and-mark-stable.yml on stable branch."
          echo "View runs: https://github.com/${GITHUB_REPOSITORY}/actions/workflows/test-and-mark-stable.yml"

      - name: Summary
        run: |
          set -euo pipefail
          echo "Promotion summary:"
          echo "  stable now at: ${{ steps.ff.outputs.sha }}"
          echo "  fast-forward moved: ${{ steps.ff.outputs.moved }}"
          echo "  release pipeline dispatched on stable branch (see link above)"
          echo ""
          echo "The release run will tag, move the stable/vN pointers, create a"
          echo "GitHub Release, and dispatch coding-workflows-stable-released"
          echo "to every consumer repo. Watch its status for completion."

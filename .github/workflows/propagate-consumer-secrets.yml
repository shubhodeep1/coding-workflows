name: Propagate consumer secrets

# Copies the library's consumer-facing Actions secrets (CHECK_TRIAGE_ISSUES_TOKEN,
# GH_PAT, OPENROUTER_API_KEY, TG_BOT_SECRET) into consumer repositories, so a
# repository seeded by /seed-repo receives them the moment its registration PR
# (the .github/ai/consumer_repos.json edit, CLAUDE.md §14) merges — no operator
# visit to each consumer's Settings → Secrets page.
#
# Triggers:
#   - push to main touching .github/ai/consumer_repos.json: only the entries
#     added by that push are targeted (diff against the previous registry).
#   - workflow_dispatch: the `targets` input (space-separated owner/repo,
#     registered entries only) or, when empty, every registry entry — the
#     backfill for consumers registered before this workflow existed.
#
# Secret values travel on stdin into `gh secret set` and are never echoed;
# see scripts/propagate_consumer_secrets.sh for the contract and log keys.

on:
  push:
    branches: [main]
    paths:
      - '.github/ai/consumer_repos.json'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Space-separated owner/repo list (must be registered in .github/ai/consumer_repos.json). Empty = every registry entry.'
        required: false
        default: ''

permissions:
  contents: read

# No concurrency group on purpose: GitHub replaces an older *pending* run in a
# group with the newer one, and the survivor only diffs its own push, so the
# consumers added by the replaced push would never be targeted. Parallel runs
# write identical values and are harmless (review finding on PR #6709).

jobs:
  propagate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve target consumers
        id: targets
        env:
          INPUT_TARGETS: ${{ github.event.inputs.targets }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          REGISTRY: .github/ai/consumer_repos.json
        run: |
          set -euo pipefail
          targets=""
          skip="false"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            targets="${INPUT_TARGETS}"
            echo "Dispatch: targets='${targets:-<every registry entry>}'"
          else
            # New entries only: current registry minus the registry at the
            # push's `before` tip. When that commit is not in the shallow
            # checkout (a multi-commit push, a first push), target every
            # entry rather than diff against the parent commit, which would
            # miss a consumer added by an earlier commit of the same push
            # (review finding on PR #6709). Re-setting an identical value is
            # harmless.
            previous="[]"
            previous_ref=""
            if [ -n "${EVENT_BEFORE}" ] && [ "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
              previous_ref="${EVENT_BEFORE}"
            fi
            if [ -n "${previous_ref}" ] && previous_json="$(git show "${previous_ref}:${REGISTRY}" 2>/dev/null)" \
               && printf '%s' "${previous_json}" | jq -e 'type == "array"' >/dev/null 2>&1; then
              previous="${previous_json}"
            else
              echo "::warning::Previous registry revision unavailable; targeting every registry entry."
            fi
            targets="$(jq -r --argjson prev "${previous}" '. - $prev | .[]' "${REGISTRY}" | tr '\n' ' ')"
            targets="${targets% }"
            if [ -z "${previous_ref}" ] || [ "${previous}" = "[]" ]; then
              targets=""
            fi
            if [ -n "${previous_ref}" ] && [ "${previous}" != "[]" ] && [ -z "${targets}" ]; then
              echo "No new registry entries in this push; nothing to propagate."
              skip="true"
            fi
            echo "Push: new entries='${targets:-<every registry entry>}' skip=${skip}"
          fi
          {
            echo "targets=${targets}"
            echo "skip=${skip}"
          } >> "${GITHUB_OUTPUT}"

      - name: Propagate secrets
        if: ${{ steps.targets.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CHECK_TRIAGE_ISSUES_TOKEN: ${{ secrets.CHECK_TRIAGE_ISSUES_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          PROPAGATE_TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -euo pipefail
          bash scripts/propagate_consumer_secrets.sh

      - name: Telegram alert on failure
        if: ${{ failure() }}
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/tg_helpers.sh
          source scripts/tg_helpers.sh
          tg_send_msg "Consumer secrets propagation failed for ${GITHUB_REPOSITORY} (targets: ${TARGETS:-every registry entry}). Consumers may be missing CHECK_TRIAGE_ISSUES_TOKEN / GH_PAT / OPENROUTER_API_KEY / TG_BOT_SECRET. Run: ${RUN_URL}" "CRITICAL" >/dev/null || true

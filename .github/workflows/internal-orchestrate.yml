name: "Internal: AI Orchestrate"

on:
  workflow_dispatch:
    inputs:
      project_description:
        description: >
          Full project description. The orchestrator will decompose it into
          issues with a dependency DAG and dispatch them through the AI pipeline.
        required: true
        type: string
      tracking_labels:
        description: Optional comma-separated extra labels for the tracking issue.
        required: false
        type: string
        default: ""
      tracking_comment:
        description: Optional comment posted on the tracking issue after creation.
        required: false
        type: string
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  orchestrate:
    uses: shubhodeep1/coding-workflows/.github/workflows/orchestrate.yml@main
    with:
      project_description: ${{ inputs.project_description }}
      tracking_labels: ${{ inputs.tracking_labels }}
      tracking_comment: ${{ inputs.tracking_comment }}
    secrets: inherit

---
name: AI Orchestrate Clarify Respond (Reusable)

# Automatically answers clarification questions on orchestrator-managed issues
# so the orchestrator pipeline can run fully unattended.
#
# Trigger: issue_comment.created (fires when clarify.yml posts questions).
# Guard:   only runs when the comment contains "Clarification required",
#          is authored by a trusted actor (github-actions[bot] or repository
#          owner/member/collaborator), and the issue body contains the
#          "Managed by: AI Orchestrator" metadata marker.

"on":
  workflow_call:
    secrets:
      GH_PAT:
        required: true
      OPENROUTER_API_KEY:
        required: true
      TG_BOT_SECRET:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  respond:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request == null &&
      (
        (
          github.event.comment.user.type == 'Bot' &&
          github.event.comment.user.login == 'github-actions[bot]'
        ) ||
        (
          github.event.comment.user.type == 'User' &&
          contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      ) &&
      contains(github.event.comment.body, 'Clarification required')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-orchestrate-clarify-respond-${{ github.event.issue.number }}
      cancel-in-progress: true
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      SEMBLE_ENABLED: ${{ vars.SEMBLE_ENABLED || 'true' }}
      MODEL_EDITOR: ${{ vars.WORKFLOW_EDITOR_MODEL || 'openai/gpt-5.5' }}
      # Defaults to xhigh to match the repo-wide gpt-5.5 reasoning-level
      # policy. Override per-repo via vars.THINKING_LEVEL_CLARIFY_RESPOND.
      MODEL_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_CLARIFY_RESPOND || 'xhigh' }}
      MODEL_VERBOSITY: ${{ vars.VERBOSITY_CLARIFY_RESPOND || 'low' }}
      ORCHESTRATOR_MAX_CLARIFY_CYCLES: ${{ vars.ORCHESTRATOR_MAX_CLARIFY_CYCLES || '3' }}
      OPENROUTER_PROMPT_CACHE_DISABLED: ${{ vars.OPENROUTER_PROMPT_CACHE_DISABLED || 'false' }}
      MEMORY_INJECTION_SCAN_ENABLED: ${{ vars.MEMORY_INJECTION_SCAN_ENABLED || 'true' }}

    steps:
      - name: Check orchestrator metadata
        id: check_orchestrator
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          EARLY_CACHE_DIR="${RUNNER_TEMP}/orchestrate-clarify-respond-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${EARLY_CACHE_DIR}"
          ISSUE_PAYLOAD_FILE="${EARLY_CACHE_DIR}/issue_payload.json"
          TRACKING_PAYLOAD_FILE="${EARLY_CACHE_DIR}/tracking_issue_payload.json"
          {
            echo "ISSUE_PAYLOAD_FILE=${ISSUE_PAYLOAD_FILE}"
            echo "TRACKING_PAYLOAD_FILE=${TRACKING_PAYLOAD_FILE}"
          } >> "$GITHUB_ENV"
          ISSUE_PAYLOAD="$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}")"
          printf '%s' "${ISSUE_PAYLOAD}" > "${ISSUE_PAYLOAD_FILE}"
          ISSUE_BODY="$(printf '%s' "${ISSUE_PAYLOAD}" | jq -r '.body // ""')"
          ISSUE_TITLE="$(printf '%s' "${ISSUE_PAYLOAD}" | jq -r '.title // ""')"
          if printf '%s' "${ISSUE_BODY}" | grep -qF 'Managed by: AI Orchestrator'; then
            echo "is_orchestrator=true" >> "$GITHUB_OUTPUT"
          else
            echo "Issue #${ISSUE_NUMBER} is not orchestrator-managed. Skipping."
            echo "AI_PHASE_GATE_V1 phase=orchestrate_clarify_respond gate=orchestrator_metadata reason=not_orchestrator_managed outcome=skip issue=${ISSUE_NUMBER}"
            echo "is_orchestrator=false" >> "$GITHUB_OUTPUT"
          fi
          # Suppress per-phase Telegram alerts when the orchestrator
          # tracking parent of this child is the test-and-mark-stable
          # smoke fixture (title `[Orchestrator] E2E …`). The gate emits
          # a single combined pass/fail notification at the end.
          TRACKING_NUM="$(printf '%s' "${ISSUE_BODY}" | sed -n 's/.*Tracking issue: #\([0-9][0-9]*\).*/\1/p' | head -n1)"
          if [ -n "${TRACKING_NUM}" ]; then
            if TRACKING_PAYLOAD="$(gh api "repos/${{ github.repository }}/issues/${TRACKING_NUM}" 2>/dev/null)"; then
              if [ -n "${TRACKING_PAYLOAD}" ]; then
                printf '%s' "${TRACKING_PAYLOAD}" > "${TRACKING_PAYLOAD_FILE}"
                TRACKING_TITLE="$(printf '%s' "${TRACKING_PAYLOAD}" | jq -r '.title // ""' 2>/dev/null || echo "")"
              else
                TRACKING_TITLE=""
              fi
            else
              TRACKING_TITLE=""
            fi
            if printf '%s' "${TRACKING_TITLE}" | grep -qiE '^\[Orchestrator\] E2E '; then
              echo "🔬 Smoke orchestrator parent (#${TRACKING_NUM}) — suppressing per-phase Telegram alerts"
              echo "ALERT_MSG_LEVEL=SILENT" >> "$GITHUB_ENV"
            fi
          fi

      - name: Resolve integration ref
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        id: refctx
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          issue_number="${ISSUE_NUMBER:-}"
          if ! [[ "${issue_number}" =~ ^[0-9]+$ ]] || [ "${issue_number}" -le 0 ]; then
            echo "::notice::No issue number available for integration ref resolution; falling back to default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          resolver_repo="shubhodeep1/coding-workflows"
          resolver_ref="stable"
          if [ "${{ github.repository }}" = "${resolver_repo}" ]; then
            resolver_ref="${{ github.sha }}"
          fi

          resolver_stage_root="${RUNNER_TEMP}/resolve-integration-ref-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          resolver_stage_primary="${resolver_stage_root}/primary"
          resolver_stage_fallback="${resolver_stage_root}/fallback"
          resolver_repo_url="https://github.com/${resolver_repo}"
          rm -rf "${resolver_stage_root}"
          mkdir -p "${resolver_stage_root}"
          resolver_clone_log="${resolver_stage_root}/clone.log"
          resolver_git_auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          resolver_git() {
            git -c "http.extraHeader=Authorization: Basic ${resolver_git_auth_header}" "$@"
          }
          cleanup_resolver_stage() {
            rm -rf "${resolver_stage_root}"
          }
          trap cleanup_resolver_stage EXIT

          if resolver_git clone --quiet --depth 1 --branch main "${resolver_repo_url}" "${resolver_stage_primary}" 2>"${resolver_clone_log}"; then
            resolver_script="${resolver_stage_primary}/scripts/resolve_integration_ref.sh"
            if ! resolver_git -C "${resolver_stage_primary}" fetch --quiet --depth 1 origin "${resolver_ref}" 2>>"${resolver_clone_log}" || \
               ! git -C "${resolver_stage_primary}" checkout --quiet --detach FETCH_HEAD 2>>"${resolver_clone_log}"; then
              echo "::warning::Failed to stage canonical integration resolver ref ${resolver_ref}; using main fallback."
              if [ -s "${resolver_clone_log}" ]; then
                sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g' "${resolver_clone_log}" | sed -n '1,20p'
              fi
            fi
          elif resolver_git clone --quiet --depth 1 --branch main "${resolver_repo_url}" "${resolver_stage_fallback}" 2>>"${resolver_clone_log}"; then
            resolver_script="${resolver_stage_fallback}/scripts/resolve_integration_ref.sh"
          else
            echo "::warning::Failed to stage canonical integration resolver; falling back to default branch."
            if [ -s "${resolver_clone_log}" ]; then
              sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g' "${resolver_clone_log}" | sed -n '1,20p'
            fi
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "${resolver_script}" ]; then
            echo "::warning::Canonical integration resolver script not found in staged source; falling back to default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          chmod +x "${resolver_script}"
          if integration_branch="$({
            REPO="${{ github.repository }}" \
            ISSUE="${issue_number}" \
            GH_TOKEN="${GH_TOKEN}" \
            bash "${resolver_script}"
          })"; then
            echo "ref=${integration_branch}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Canonical integration resolver failed; falling back to default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.refctx.outputs.ref || github.event.repository.default_branch }}
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Log checkout ref
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        run: |
          set -euo pipefail
          echo "Resolved ref: ${{ steps.refctx.outputs.ref || github.event.repository.default_branch }}"
          echo "HEAD commit: $(git rev-parse HEAD)"
          if branch_name="$(git symbolic-ref --short HEAD 2>/dev/null)"; then
            echo "HEAD branch: ${branch_name}"
          else
            echo "HEAD branch: DETACHED"
          fi

      - name: Configure git auth for memory helper clones
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_PAT is empty"; exit 1; }
          SERVER_HOST="${GITHUB_SERVER_URL#https://}"
          SERVER_HOST="${SERVER_HOST#http://}"
          SERVER_HOST="${SERVER_HOST%/}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}"

      - name: Install Codex CLI
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        uses: shubhodeep1/coding-workflows/.github/actions/install-codex@stable
        with:
          codex_version: ${{ vars.CODEX_VERSION || 'v0.114.0' }}

      - name: Resolve workflow support ref
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            echo "SCRIPT_REF=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "SCRIPT_REF=stable" >> "$GITHUB_ENV"
          fi

      - name: Checkout workflow support source
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        id: checkout_support_source
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ env.SCRIPT_REF }}
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Checkout workflow support source fallback
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true' && steps.checkout_support_source.outcome == 'failure'
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Ensure workflow support source checkout
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        run: |
          set -euo pipefail
          if [ ! -d .codex-workflow-src ]; then
            echo "::error::Failed to checkout workflow support source from ${SCRIPT_REF} or main"
            exit 1
          fi

      - name: Checkout workflow support source main snapshot
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true' && env.SCRIPT_REF != 'main'
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src-main
          fetch-depth: 1

      - name: Stage workflow support files
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          mkdir -p scripts

          _fetched_scripts=()
          for f in gh_helpers.sh render_prompt.sh assemble_prompt.sh render_prompt.py load_workflow_overlay.py tg_helpers.sh label_helpers.sh memory_helpers.sh ai_memory.py ai_memory_lib.py memory_injection_patterns.py openrouter_prompt_cache.py semantic_cache.py install_semble.sh build_semble_wrapper.sh write_codex_config.sh orchestrate_parse_and_post_answer.sh; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::error::Missing required support script ${f} in ${wf_source}@${SCRIPT_REF}"
              exit 1
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")
          done

          # render_prompt.py is the optional Python backend for the
          # render_prompt.sh shim adopted by branches that took the issue
          # #3043 refactor.  main ships a self-contained bash render_prompt.sh
          # that needs no backend, so the file is absent on main and must be
          # staged only when the branch under processing actually carries it.
          # Absence is expected (non-shim branches, incl. main) and must not
          # fail the bootstrap; presence stages it beside the shim so the
          # shim resolves ${SCRIPT_DIR}/render_prompt.py.
          for f in render_prompt.py; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::notice::Optional render_prompt.py backend unavailable on ${SCRIPT_REF}; render_prompt.sh shim (if present) resolves it elsewhere or the bundled bash renderer is used."
              continue
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")
          done

          # Fetch AI memory schema files so consumer repos that lack
          # schemas on their default branch can bootstrap the ai-memory
          # branch (schemas are validated during memory operations).
          mkdir -p ai-memory/schemas
          for sf in memory_record.v1.json processed_command_entry.v1.json run_ledger_entry.v1.json task_lineage.v1.json actions_runs_cache.v1.json workflow_log_analysis_cache.v1.json validation_history.v1.json operator_bypass_audit.v1.json revalidate_events.v1.json validation_discovery.v1.json workflow_overlay.v1.json; do
            src=".codex-workflow-src/ai-memory/schemas/${sf}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/ai-memory/schemas/${sf}" ]; then
              src=".codex-workflow-src-main/ai-memory/schemas/${sf}"
            fi
            if [ ! -f "ai-memory/schemas/${sf}" ] && [ -f "${src}" ]; then
              install -m 0644 "${src}" "ai-memory/schemas/${sf}"
            fi
          done

          # WORKFLOW.md overlay is opt-in by file presence; absent file must
          # stay a no-op while valid prompt overrides flow through render_prompt.py.
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/load_workflow_overlay.py \
            --repo-root "${GITHUB_WORKSPACE}" \
            --schema-path "ai-memory/schemas/workflow_overlay.v1.json" \
            --github-env "${GITHUB_ENV}"

          echo "PROMPT_PRELUDE_REFACTOR_ENABLED=${{ vars.PROMPT_PRELUDE_REFACTOR_ENABLED || 'false' }}" >> "$GITHUB_ENV"
          echo "UNATTENDED_IDENTITY_REINJECT_ENABLED=${{ vars.UNATTENDED_IDENTITY_REINJECT_ENABLED || 'false' }}" >> "$GITHUB_ENV"

          # Model catalog: try script_ref first, fall back to local copy from checkout.
          catalog_src=".codex-workflow-src/scripts/codex_model_catalog.json"
          if [ ! -f "${catalog_src}" ] && [ -f ".codex-workflow-src-main/scripts/codex_model_catalog.json" ]; then
            catalog_src=".codex-workflow-src-main/scripts/codex_model_catalog.json"
          fi
          if [ -f "${catalog_src}" ]; then
            install -m 0644 "${catalog_src}" scripts/codex_model_catalog.json
            _fetched_scripts+=(codex_model_catalog.json)
          else
            echo "Model catalog not on ${SCRIPT_REF} yet; using local copy."
          fi

          # Block fetched scripts from being committed in consumer repos.
          if [ "${{ github.repository }}" != "${wf_source}" ]; then
            {
              echo "# Auto-generated by coding-workflows — DO NOT EDIT"
              echo "# Prevents runtime-fetched support scripts from being committed."
              printf '%s\n' "${_fetched_scripts[@]}" .gitignore
            } > scripts/.gitignore
          fi
          # Fetch the clarify-respond prompt and its shared-prelude assets.
          PROMPT_SOURCE="prompts/mode-clarify-respond.txt"
          mkdir -p prompts prompts/_templates
          if [ ! -f "${PROMPT_SOURCE}" ]; then
            src=".codex-workflow-src/${PROMPT_SOURCE}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/${PROMPT_SOURCE}" ]; then
              src=".codex-workflow-src-main/${PROMPT_SOURCE}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::error::Missing required support file ${PROMPT_SOURCE}"
              exit 1
            fi
            install -m 0644 "${src}" "${PROMPT_SOURCE}"
          fi
          for prompt_support_asset in _identity_recall.txt _prelude_common.txt _prelude_output_contract.txt _prelude_role_persona.txt _templates/mode-clarify-respond.txt; do
            if [ ! -f "prompts/${prompt_support_asset}" ]; then
              src=".codex-workflow-src/prompts/${prompt_support_asset}"
              if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/prompts/${prompt_support_asset}" ]; then
                src=".codex-workflow-src-main/prompts/${prompt_support_asset}"
              fi
              if [ ! -f "${src}" ]; then
                echo "::error::Missing required support file prompts/${prompt_support_asset}"
                exit 1
              fi
              install -m 0644 "${src}" "prompts/${prompt_support_asset}"
            fi
          done

          # Keep canonical static instructions available in caller repos where
          # these files may not exist yet.
          for f in unattended_system_instructions.md ai_pipeline.md; do
            if [ ! -f "${f}" ]; then
              src=".codex-workflow-src/${f}"
              if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/${f}" ]; then
                src=".codex-workflow-src-main/${f}"
              fi
              if [ ! -f "${src}" ]; then
                echo "::error::Failed to fetch required file ${f}"
                exit 1
              fi
              install -m 0644 "${src}" "${f}"
            fi
            if [ ! -s "${f}" ]; then
              echo "::error::Failed to fetch required file ${f}"
              exit 1
            fi
          done

          rm -rf .codex-workflow-src-main

      - name: Record memory run-start event
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        run: |
          set -euo pipefail

          if [ ! -f scripts/memory_helpers.sh ]; then
            echo "::warning::memory_helpers.sh unavailable; skipping run-start memory event"
            exit 0
          fi

          source scripts/memory_helpers.sh
          memory_ensure_branch

          METADATA_JSON="$(jq -cn \
            --arg repository "${{ github.repository }}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg issue_url "${ISSUE_URL}" \
            '{repository: $repository, run_attempt: $run_attempt, issue_url: $issue_url}')"

          memory_record_run_event \
            --run-id "${GITHUB_RUN_ID}" \
            --workflow "orchestrate_clarify_respond" \
            --event-type "run_start" \
            --status "start" \
            --message "orchestrate clarify-respond started" \
            --issue-number "${ISSUE_NUMBER}" \
            --actor "${GITHUB_ACTOR}" \
            --metadata-json "${METADATA_JSON}"

      - name: Create runtime workspace
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        run: |
          set -euo pipefail
          RUNTIME_DIR="/tmp/codex-clarify-respond-${GITHUB_RUN_ID}"
          mkdir -p "${RUNTIME_DIR}"
          {
            echo "RUNTIME_DIR=${RUNTIME_DIR}"
            echo "CODEX_PROMPT_FILE=${RUNTIME_DIR}/codex_prompt.txt"
            echo "CODEX_OUTPUT_FILE=${RUNTIME_DIR}/codex_output.txt"
            echo "THREAD_HISTORY_FILE=${RUNTIME_DIR}/thread_history.txt"
            echo "SEMBLE_AVAILABLE=false"
            echo "SEMBLE_INDEX_PATH=${RUNTIME_DIR}/.semble-index"
            echo "SEMBLE_INDEX_AVAILABLE=false"
          } >> "$GITHUB_ENV"

      - name: Fetch issue and tracking context
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CLARIFICATION_COMMENT: ${{ github.event.comment.body }}
          CLARIFICATION_COMMENT_ID: ${{ github.event.comment.id }}
          CLARIFICATION_COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          CLARIFICATION_COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
          SEMANTIC_CACHE_BACKEND: ${{ vars.SEMANTIC_CACHE_BACKEND || 'none' }}
          SEMANTIC_CACHE_MAX_CANONICAL_CHARS: ${{ vars.SEMANTIC_CACHE_MAX_CANONICAL_CHARS || '50000' }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }

          # Reuse the earlier metadata-gate fetch when it is still valid, but
          # preserve the live gh api fallback for cache miss / corruption.
          ISSUE_META=""
          if [ -n "${ISSUE_PAYLOAD_FILE:-}" ] && [ -s "${ISSUE_PAYLOAD_FILE}" ]; then
            if jq -e --arg issue_number "${ISSUE_NUMBER}" '(.number // empty) == ($issue_number | tonumber)' "${ISSUE_PAYLOAD_FILE}" >/dev/null 2>&1; then
              ISSUE_META="$(cat "${ISSUE_PAYLOAD_FILE}")"
            fi
          fi
          if [ -z "${ISSUE_META}" ]; then
            ISSUE_META="$(gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}")"
          fi

          ISSUE_BODY="$(printf '%s' "${ISSUE_META}" | jq -r '.body // ""')"
          ISSUE_TITLE="$(printf '%s' "${ISSUE_META}" | jq -r '.title // ""')"
          echo "ISSUE_TITLE=${ISSUE_TITLE}" >> "$GITHUB_ENV"

          # Extract tracking issue number from orchestrator metadata
          TRACKING_NUM="$(printf '%s\n' "${ISSUE_BODY}" | sed -nE 's/.*Tracking issue:[[:space:]]*#([0-9]+).*/\1/p' | head -n1 || true)"

          # Fetch tracking issue body (contains project description)
          TRACKING_BODY=""
          if [ -n "${TRACKING_NUM}" ] && [[ "${TRACKING_NUM}" =~ ^[0-9]+$ ]]; then
            if [ -n "${TRACKING_PAYLOAD_FILE:-}" ] && [ -s "${TRACKING_PAYLOAD_FILE}" ] && jq -e --arg tracking_num "${TRACKING_NUM}" '(.number // empty) == ($tracking_num | tonumber)' "${TRACKING_PAYLOAD_FILE}" >/dev/null 2>&1; then
              TRACKING_BODY="$(jq -r '.body // ""' "${TRACKING_PAYLOAD_FILE}")"
            else
              TRACKING_BODY="$(gh_retry gh api "repos/${{ github.repository }}/issues/${TRACKING_NUM}" --jq '.body // ""')"
            fi
          fi

          # Save context for prompt assembly
          printf '%s' "${ISSUE_BODY}" > "${RUNTIME_DIR}/issue_body.txt"
          printf '%s' "${TRACKING_BODY}" > "${RUNTIME_DIR}/tracking_body.txt"
          printf '%s' "${CLARIFICATION_COMMENT}" > "${RUNTIME_DIR}/clarification_comment.txt"

          if [ "${SEMANTIC_CACHE_BACKEND}" != "none" ]; then
            if ISSUE_COMMENTS_JSON="$(gh_retry gh api --paginate --slurp "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments?sort=created&direction=asc&per_page=100")" \
              && printf '%s' "${ISSUE_COMMENTS_JSON}" | jq -r 'add // [] | .[] | "[" + (.created_at // "") + "] @" + (.user.login // "unknown") + ":\n" + (.body // "") + "\n"' > "${THREAD_HISTORY_FILE}"; then
              if ! printf '%s' "${ISSUE_COMMENTS_JSON}" | jq -e --arg cid "${CLARIFICATION_COMMENT_ID}" 'add // [] | any((.id | tostring) == $cid)' >/dev/null 2>&1; then
                printf '[%s] @%s:\n%s\n' "${CLARIFICATION_COMMENT_CREATED_AT}" "${CLARIFICATION_COMMENT_AUTHOR}" "${CLARIFICATION_COMMENT}" >> "${THREAD_HISTORY_FILE}"
              fi
            else
              echo "::warning::Semantic cache thread-history fetch failed; forcing cache bypass for this run (fail-open)"
              MAX_CHARS="${SEMANTIC_CACHE_MAX_CANONICAL_CHARS}"
              if [[ "${MAX_CHARS}" =~ ^[0-9]+$ ]]; then
                MAX_CHARS=$((10#${MAX_CHARS}))
              else
                MAX_CHARS=50000
              fi
              if [ "${MAX_CHARS}" -le 0 ]; then
                MAX_CHARS=50000
              fi
              head -c "$((MAX_CHARS + 1))" /dev/zero | tr '\0' 'x' > "${THREAD_HISTORY_FILE}"
            fi
          else
            : > "${THREAD_HISTORY_FILE}"
          fi

      - name: Install Redis Python client
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true' && vars.SEMANTIC_CACHE_BACKEND == 'redis'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check "redis>=5,<6"

      - name: Restore semantic cache SQLite
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true' && vars.SEMANTIC_CACHE_BACKEND == 'sqlite-vec'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ vars.SEMANTIC_CACHE_SQLITE_PATH || '/tmp/semantic_cache.sqlite3' }}
          key: semantic-cache-${{ github.repository }}-${{ vars.SEMANTIC_CACHE_BACKEND }}-${{ vars.SEMANTIC_CACHE_EMBEDDING_MODEL || 'openai/text-embedding-3-small' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            semantic-cache-${{ github.repository }}-${{ vars.SEMANTIC_CACHE_BACKEND }}-${{ vars.SEMANTIC_CACHE_EMBEDDING_MODEL || 'openai/text-embedding-3-small' }}-
      - name: Semantic cache lookup
        id: semantic_cache_lookup
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEMANTIC_CACHE_BACKEND: ${{ vars.SEMANTIC_CACHE_BACKEND || 'none' }}
          SEMANTIC_CACHE_TTL_DAYS: ${{ vars.SEMANTIC_CACHE_TTL_DAYS || '14' }}
          SEMANTIC_CACHE_SIMILARITY_THRESHOLD: ${{ vars.SEMANTIC_CACHE_SIMILARITY_THRESHOLD || '0.92' }}
          SEMANTIC_CACHE_REDIS_URL: ${{ vars.SEMANTIC_CACHE_REDIS_URL || '' }}
          SEMANTIC_CACHE_SQLITE_PATH: ${{ vars.SEMANTIC_CACHE_SQLITE_PATH || '/tmp/semantic_cache.sqlite3' }}
          SEMANTIC_CACHE_EMBEDDING_MODEL: ${{ vars.SEMANTIC_CACHE_EMBEDDING_MODEL || 'openai/text-embedding-3-small' }}
          SEMANTIC_CACHE_MAX_CANONICAL_CHARS: ${{ vars.SEMANTIC_CACHE_MAX_CANONICAL_CHARS || '50000' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          LOOKUP_JSON="${RUNTIME_DIR}/semantic_cache_lookup.json"
          if python3 scripts/semantic_cache.py lookup \
            --phase "orchestrate_clarify_respond" \
            --issue-number "${ISSUE_NUMBER}" \
            --issue-body-file "${RUNTIME_DIR}/issue_body.txt" \
            --thread-history-file "${THREAD_HISTORY_FILE}" \
            --output-file "${CODEX_OUTPUT_FILE}" > "${LOOKUP_JSON}"; then
            :
          else
            echo "::warning::Semantic cache lookup command failed; continuing with live Codex run"
            printf '{"ok":false,"hit":false,"error":"lookup_command_failed"}\n' > "${LOOKUP_JSON}"
          fi

          if jq -e '.ok == true and .hit == true' "${LOOKUP_JSON}" >/dev/null 2>&1; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
            SIMILARITY="$(jq -r '.similarity // ""' "${LOOKUP_JSON}")"
            CACHED_AT="$(jq -r '.cached_at // ""' "${LOOKUP_JSON}")"
            ORIGINAL_ISSUE_ID="$(jq -r '.original_issue_id // ""' "${LOOKUP_JSON}")"
            AUDIT_JSON="$(jq -cn --arg phase "orchestrate_clarify_respond" --arg similarity "${SIMILARITY}" --arg cached_at "${CACHED_AT}" --arg original_issue_id "${ORIGINAL_ISSUE_ID}" '{event:"semantic_cache_hit",phase:$phase,similarity:($similarity|tonumber? // 0),cached_at:$cached_at,original_issue_id:$original_issue_id}')"
            echo "::notice::${AUDIT_JSON}"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
            if jq -e '.ok == false' "${LOOKUP_JSON}" >/dev/null 2>&1; then
              echo "::warning::Semantic cache lookup fail-open: $(jq -r '.error // "unknown_error"' "${LOOKUP_JSON}")"
            fi
          fi

      - name: Setup uv
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true' && steps.semantic_cache_lookup.outputs.cache_hit != 'true' && env.SEMBLE_ENABLED == 'true'
        continue-on-error: true
        uses: astral-sh/setup-uv@v7

      - name: Install semble
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true' && steps.semantic_cache_lookup.outputs.cache_hit != 'true' && env.SEMBLE_ENABLED == 'true'
        # Defense-in-depth: install_semble.sh is fail-soft already (writes
        # SEMBLE_AVAILABLE=false on any error), but the step-level guard
        # ensures a syntax regression / filesystem error / missing-script
        # condition still degrades to SEMBLE_AVAILABLE=false instead of
        # hard-failing under set -euo pipefail.
        continue-on-error: true
        run: |
          set -euo pipefail
          bash scripts/install_semble.sh

      - name: Build semble index
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true' && steps.semantic_cache_lookup.outputs.cache_hit != 'true' && env.SEMBLE_ENABLED == 'true'
        # Defense-in-depth: the shared script is fail-soft already, but the
        # step-level guard ensures a future wrapper regression still
        # degrades to SEMBLE_INDEX_AVAILABLE=false instead of hard-failing.
        continue-on-error: true
        run: |
          set -euo pipefail
          : "${SEMBLE_INDEX_PATH:?SEMBLE_INDEX_PATH is required}"
          # Shared BM25 wrapper builder — see scripts/build_semble_wrapper.sh
          # for the rationale (semble 0.1.3 lacks the index/query CLI).
          # Fail-soft: writes SEMBLE_INDEX_AVAILABLE=false on any error and
          # exits 0; missing-script case is handled the same way.
          if [ -f scripts/build_semble_wrapper.sh ]; then
            bash scripts/build_semble_wrapper.sh
          else
            echo "::notice::scripts/build_semble_wrapper.sh not staged; continuing without Semble index."
            echo "SEMBLE_INDEX_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Create Codex config
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        run: |
          set -euo pipefail
          # Centralised in scripts/write_codex_config.sh — see that
          # script's header for the apply_patch / trust / elevation
          # rationale.
          bash scripts/write_codex_config.sh \
            --model "${MODEL_EDITOR}" \
            --reasoning "${MODEL_REASONING_EFFORT}"
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

      - name: Pre-assemble static context (cacheable across runs)
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        run: |
          set -euo pipefail

          if [ ! -s unattended_system_instructions.md ] || [ ! -s ai_pipeline.md ]; then
            echo "Missing or empty required codex input file(s): unattended_system_instructions.md and/or ai_pipeline.md"
            exit 1
          fi

          # Keep an identical static prefix at the start of every request so
          # provider-side prompt prefix caching can be reused across runs.
          {
            echo "=== SYSTEM INSTRUCTIONS ==="
            cat unattended_system_instructions.md
            echo
            echo "=== AI PIPELINE ==="
            cat ai_pipeline.md
            echo
            if [ -f AGENTS.md ]; then
              echo "=== AGENTS.MD ==="
              cat AGENTS.md
              echo
            elif [ -f agents.md ]; then
              echo "=== AGENTS.MD ==="
              cat agents.md
              echo
            fi
            if [ -f README.md ]; then
              echo "=== README.MD ==="
              cat README.md
              echo
            fi
            if [ -f probably_unnecessary_but_read_if_stuck.md ]; then
              echo "=== OVERFLOW REFERENCE ==="
              echo "If you cannot make progress without operator-runbook details (env var reference, autofix retrigger/dedup internals, orchestrator integration-sync auto-heal, validation self-healing, workflow log analysis pipeline, semantic cache scope, wrapper pin policy), read ./probably_unnecessary_but_read_if_stuck.md from the working tree before bailing."
              echo
            fi
          } > ./pre_assembled_static.txt

      - name: Retrieve issue memory context
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        run: |
          set -euo pipefail

          if [ ! -f scripts/memory_helpers.sh ]; then
            echo "::warning::memory_helpers.sh unavailable; using empty memory context"
            : > "${RUNTIME_DIR}/memory_context.txt"
            exit 0
          fi

          source scripts/memory_helpers.sh

          memory_retrieve "${RUNTIME_DIR}/memory_context.txt" \
            --role "clarify" \
            --issue-number "${ISSUE_NUMBER}" \
            --issue-title "${ISSUE_TITLE}" \
            --issue-body-file "${RUNTIME_DIR}/issue_body.txt"

      - name: Remove git auth before Codex execution
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        run: |
          set -euo pipefail
          if [ -d .git ]; then
            git remote set-url origin "${{ github.server_url }}/${{ github.repository }}"
          fi

      - name: Build prompt and run Codex
        id: run_codex
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true' && steps.semantic_cache_lookup.outputs.cache_hit != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOOL_CALL_BUDGET: ${{ vars.TOOL_CALL_BUDGET_CLARIFY_RESPOND || '25' }}
        run: |
          set -euo pipefail

          # Source sanitize_codex_prompt_file (best-effort) so the
          # clarify-respond prompt is UTF-8-clean before piping.
          # shellcheck source=/dev/null
          source scripts/gh_helpers.sh 2>/dev/null || true

          # Keep static context first for cache reuse, then append run-specific
          # data so issue/comment changes do not invalidate the cached prefix.
          {
            cat ./pre_assembled_static.txt
            echo
            echo "TOOL_CALL_BUDGET: ${TOOL_CALL_BUDGET}"
            echo
            echo "=== CLARIFY RESPOND TASK ==="
            bash scripts/render_prompt.sh prompts/mode-clarify-respond.txt
            echo
            echo "=== MEMORY CONTEXT ==="
            cat "${RUNTIME_DIR}/memory_context.txt"
            echo
            echo "=== PROJECT CONTEXT (from tracking issue) ==="
            cat "${RUNTIME_DIR}/tracking_body.txt"
            echo
            echo "=== ISSUE DESCRIPTION ==="
            cat "${RUNTIME_DIR}/issue_body.txt"
            echo
            echo "=== CLARIFICATION QUESTIONS ==="
            cat "${RUNTIME_DIR}/clarification_comment.txt"
          } > "${CODEX_PROMPT_FILE}"

          # Inject prior clarify-cycle context if available.
          # NOTE: memory_clarify_cycle_history should be implemented in
          # scripts/memory_helpers.sh as a follow-up.
          if [ -f scripts/memory_helpers.sh ]; then
            source scripts/memory_helpers.sh
            PRIOR_CYCLES="$(memory_clarify_cycle_history \
              --issue-number "${ISSUE_NUMBER}" \
              --max-cycles 5 2>/dev/null || true)"
            if [ -n "${PRIOR_CYCLES}" ] && [ "${PRIOR_CYCLES}" != "null" ] && [ "${PRIOR_CYCLES}" != "[]" ]; then
              {
                echo "=== PRIOR CLARIFY CYCLES ==="
                echo "The following auto-answer cycles have already occurred on this issue."
                echo "Do NOT repeat a prior answer that failed to unblock planning."
                echo "${PRIOR_CYCLES}"
              } >> "${CODEX_PROMPT_FILE}"
            fi
          fi

          max_attempts=3
          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Codex clarify-respond attempt ${attempt}/${max_attempts}..."
            if command -v sanitize_codex_prompt_file >/dev/null 2>&1; then
              sanitize_codex_prompt_file "${CODEX_PROMPT_FILE}"
            fi
            if cat "${CODEX_PROMPT_FILE}" | codex --ask-for-approval never -c model_verbosity=low -c include_apply_patch_tool=true exec --skip-git-repo-check --model "${MODEL_EDITOR}" --sandbox danger-full-access > "${CODEX_OUTPUT_FILE}" 2> >(tee -a "${RUNTIME_DIR}/codex_log.txt" >&2); then
              if grep -q '[^[:space:]]' "${CODEX_OUTPUT_FILE}"; then
                echo "Codex clarify-respond succeeded on attempt ${attempt}."
                break
              fi
              echo "::warning::Codex returned empty output on attempt ${attempt}."
            else
              rc=$?
              echo "::warning::Codex exited with code $rc on attempt ${attempt}."
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              sleep_secs=$(( 10 * (2 ** (attempt - 1)) + RANDOM % 10 ))
              echo "Retrying in ${sleep_secs}s (includes jitter)..."
              sleep "${sleep_secs}"
            else
              echo "::error::Codex clarify-respond failed after ${max_attempts} attempts."
              exit 1
            fi
          done

      - name: Self-critique pass for non-letter decisions
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true' && steps.semantic_cache_lookup.outputs.cache_hit != 'true' && steps.run_codex.outcome == 'success'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail

          # Source sanitize_codex_prompt_file (best-effort) so the
          # critic + revised prompts are UTF-8-clean before piping.
          # shellcheck source=/dev/null
          source scripts/gh_helpers.sh 2>/dev/null || true

          # Self-critique pass for non-letter decisions
          HAS_NON_LETTER="false"
          if grep -qE '^Q[0-9]+:\s*(DERIVE_FROM_REPO|SYNTHESIZE|REFRAME|ESCALATE)' "${CODEX_OUTPUT_FILE}"; then
            HAS_NON_LETTER="true"
          fi

          if [ "${HAS_NON_LETTER}" = "true" ]; then
            echo "Non-letter decisions detected; running self-critique pass..."

            {
              echo "You are reviewing an autonomous clarify-resolve decision."
              echo "The original clarification questions and the responder's decisions follow."
              echo
              echo "=== CLARIFICATION QUESTIONS ==="
              cat "${RUNTIME_DIR}/clarification_comment.txt"
              echo
              echo "=== RESPONDER DECISIONS ==="
              cat "${CODEX_OUTPUT_FILE}"
              echo
              echo "Review checklist:"
              echo "1. Did the responder avoid fabricating data? Every derivation must trace to a specific repo file."
              echo "2. Is each equivalence argument sound? Does the substitute genuinely satisfy the original intent?"
              echo "3. Is the execution plan actually executable by the planner/implementer with repo access only?"
              echo "4. Are synthetic fixtures deterministic and well-specified?"
              echo "5. If ESCALATE was used, are rungs 1-3 genuinely infeasible?"
              echo
              echo "Output exactly one of:"
              echo "VERDICT: APPROVE"
              echo "VERDICT: REJECT"
              echo "REASON: <1-2 sentences if REJECT>"
            } > "${RUNTIME_DIR}/critic_prompt.txt"

            CRITIC_MODEL="${MODEL_EDITOR}"
            if command -v sanitize_codex_prompt_file >/dev/null 2>&1; then
              sanitize_codex_prompt_file "${RUNTIME_DIR}/critic_prompt.txt"
            fi
            if cat "${RUNTIME_DIR}/critic_prompt.txt" | codex --ask-for-approval never -c model_verbosity=low -c include_apply_patch_tool=true exec \
              --skip-git-repo-check --model "${CRITIC_MODEL}" --sandbox danger-full-access > "${RUNTIME_DIR}/critic_output.txt" 2>/dev/null; then
              if grep -q 'VERDICT: REJECT' "${RUNTIME_DIR}/critic_output.txt"; then
                echo "::warning::Self-critique rejected the decision. Appending critique and re-running."
                CRITIC_REASON="$(grep -A5 'REASON:' "${RUNTIME_DIR}/critic_output.txt" || echo "No reason provided")"
                {
                  cat "${CODEX_PROMPT_FILE}"
                  echo
                  echo "=== SELF-CRITIQUE FEEDBACK (your previous output was rejected) ==="
                  echo "${CRITIC_REASON}"
                  echo "Revise your decisions to address this feedback."
                } > "${CODEX_PROMPT_FILE}.v2"

                if command -v sanitize_codex_prompt_file >/dev/null 2>&1; then
                  sanitize_codex_prompt_file "${CODEX_PROMPT_FILE}.v2"
                fi
                if cat "${CODEX_PROMPT_FILE}.v2" | codex --ask-for-approval never -c model_verbosity=low -c include_apply_patch_tool=true exec \
                  --skip-git-repo-check --model "${MODEL_EDITOR}" --sandbox danger-full-access > "${CODEX_OUTPUT_FILE}" 2>/dev/null; then
                  echo "Revised decision produced after self-critique."
                else
                  echo "::warning::Revised Codex call failed; using original output."
                fi
              else
                echo "Self-critique approved the decision."
              fi
            else
              echo "::warning::Critic call failed; proceeding with original output."
            fi
          fi

      - name: Semantic cache store
        if: always() && steps.check_orchestrator.outputs.is_orchestrator == 'true' && steps.semantic_cache_lookup.outputs.cache_hit != 'true' && steps.run_codex.outcome == 'success'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEMANTIC_CACHE_BACKEND: ${{ vars.SEMANTIC_CACHE_BACKEND || 'none' }}
          SEMANTIC_CACHE_TTL_DAYS: ${{ vars.SEMANTIC_CACHE_TTL_DAYS || '14' }}
          SEMANTIC_CACHE_SIMILARITY_THRESHOLD: ${{ vars.SEMANTIC_CACHE_SIMILARITY_THRESHOLD || '0.92' }}
          SEMANTIC_CACHE_REDIS_URL: ${{ vars.SEMANTIC_CACHE_REDIS_URL || '' }}
          SEMANTIC_CACHE_SQLITE_PATH: ${{ vars.SEMANTIC_CACHE_SQLITE_PATH || '/tmp/semantic_cache.sqlite3' }}
          SEMANTIC_CACHE_EMBEDDING_MODEL: ${{ vars.SEMANTIC_CACHE_EMBEDDING_MODEL || 'openai/text-embedding-3-small' }}
          SEMANTIC_CACHE_MAX_CANONICAL_CHARS: ${{ vars.SEMANTIC_CACHE_MAX_CANONICAL_CHARS || '50000' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          STORE_JSON="${RUNTIME_DIR}/semantic_cache_store.json"
          if python3 scripts/semantic_cache.py store \
            --phase "orchestrate_clarify_respond" \
            --issue-number "${ISSUE_NUMBER}" \
            --issue-body-file "${RUNTIME_DIR}/issue_body.txt" \
            --thread-history-file "${THREAD_HISTORY_FILE}" \
            --response-file "${CODEX_OUTPUT_FILE}" > "${STORE_JSON}"; then
            if jq -e '.ok == false' "${STORE_JSON}" >/dev/null 2>&1; then
              echo "::warning::Semantic cache store fail-open: $(jq -r '.error // "unknown_error"' "${STORE_JSON}")"
            fi
          else
            echo "::warning::Semantic cache store command failed; continuing"
          fi

      - name: Save semantic cache SQLite
        if: always() && steps.check_orchestrator.outputs.is_orchestrator == 'true' && vars.SEMANTIC_CACHE_BACKEND == 'sqlite-vec' && steps.run_codex.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ vars.SEMANTIC_CACHE_SQLITE_PATH || '/tmp/semantic_cache.sqlite3' }}
          key: semantic-cache-${{ github.repository }}-${{ vars.SEMANTIC_CACHE_BACKEND }}-${{ vars.SEMANTIC_CACHE_EMBEDDING_MODEL || 'openai/text-embedding-3-small' }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Data-provision guard
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true' && (steps.run_codex.outcome == 'success' || steps.semantic_cache_lookup.outputs.cache_hit == 'true')
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          if [ ! -f scripts/clarify_data_provision_guard.py ]; then
            echo "::notice::clarify_data_provision_guard.py not found; skipping data-provision guard."
            exit 0
          fi
          if [ ! -f "${RUNTIME_DIR}/clarification_comment.txt" ] || [ ! -f "${CODEX_OUTPUT_FILE}" ]; then
            echo "::notice::Missing clarification or answer files; skipping data-provision guard."
            exit 0
          fi

          GUARDED_OUTPUT="${RUNTIME_DIR}/codex_output_guarded.txt"
          if python3 scripts/clarify_data_provision_guard.py \
            --clarification-file "${RUNTIME_DIR}/clarification_comment.txt" \
            --answers-file "${CODEX_OUTPUT_FILE}" > "${GUARDED_OUTPUT}"; then
            if ! diff -q "${CODEX_OUTPUT_FILE}" "${GUARDED_OUTPUT}" >/dev/null 2>&1; then
              echo "::warning::Data-provision guard overrode one or more answers to prevent circular clarification loop."
              echo "::group::Guard diff"
              diff "${CODEX_OUTPUT_FILE}" "${GUARDED_OUTPUT}" || true
              echo "::endgroup::"
              cp "${GUARDED_OUTPUT}" "${CODEX_OUTPUT_FILE}"
            else
              echo "Data-provision guard: no overrides needed."
            fi
          else
            echo "::warning::Data-provision guard script failed (fail-open); using original answers."
          fi

      - name: Parse and post answer
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
          CLARIFICATION_COMMENT_ID: ${{ github.event.comment.id }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          bash scripts/orchestrate_parse_and_post_answer.sh

      - name: Reconfigure git auth for memory helper clones
        if: always() && steps.check_orchestrator.outputs.is_orchestrator == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ ! -d .git ]; then
            echo "::warning::.git not found; skipping git auth reconfiguration"
            exit 0
          fi
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_PAT is empty"; exit 1; }
          SERVER_HOST="${GITHUB_SERVER_URL#https://}"
          SERVER_HOST="${SERVER_HOST#http://}"
          SERVER_HOST="${SERVER_HOST%/}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}"

      - name: Record memory candidate after auto-answer
        if: steps.check_orchestrator.outputs.is_orchestrator == 'true' && env.SKIP_AUTO_ANSWER != 'true'
        run: |
          set -euo pipefail

          if [ ! -f scripts/memory_helpers.sh ]; then
            echo "::warning::memory_helpers.sh unavailable; skipping memory candidate recording"
            exit 0
          fi

          source scripts/memory_helpers.sh

          MAX_DETAILS_CHARS=12000
          if [ -f "${RUNTIME_DIR}/answer_comment.md" ]; then
            CANDIDATE_DETAILS="$(head -c "${MAX_DETAILS_CHARS}" "${RUNTIME_DIR}/answer_comment.md")"
          else
            CANDIDATE_DETAILS="Auto-answer comment file was not found at ${RUNTIME_DIR}/answer_comment.md"
          fi

          # Keep category aligned with scripts/ai_memory_lib.py allowed values.
          memory_record_candidate \
            --category "decisions" \
            --summary "Orchestrator posted auto-answer for issue #${ISSUE_NUMBER}" \
            --details "${CANDIDATE_DETAILS}" \
            --confidence "0.90" \
            --workflow "orchestrate_clarify_respond" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --actor "${GITHUB_ACTOR}" \
            --issue-number "${ISSUE_NUMBER}" \
            --source-refs "${ISSUE_URL}"

      - name: Write run summary
        if: always() && steps.check_orchestrator.outputs.is_orchestrator == 'true'
        env:
          TOKEN_WARN_THRESHOLD: ${{ vars.TOKEN_WARN_THRESHOLD_CLARIFY_RESPOND || '80000' }}
        run: |
          set -euo pipefail
          TOKENS=""
          if [ -n "${RUNTIME_DIR:-}" ] && [ -f "${RUNTIME_DIR}/codex_log.txt" ]; then
            TOKENS="$(grep -A1 'tokens used' "${RUNTIME_DIR}/codex_log.txt" | tail -1 | tr -d '[:space:]' || true)"
          fi
          {
            echo "## AI Orchestrate Clarify Respond Summary"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Issue | #${ISSUE_NUMBER} |"
            echo "| Model | \`${MODEL_EDITOR}\` |"
            echo "| Reasoning | \`${MODEL_REASONING_EFFORT}\` |"
            if [ -n "${TOKENS}" ]; then
              echo "| Tokens used | ${TOKENS} |"
              TOKENS_NUM="${TOKENS//,/}"
              if [[ "${TOKENS_NUM}" =~ ^[0-9]+$ ]] && [ "${TOKENS_NUM}" -gt "${TOKEN_WARN_THRESHOLD}" ]; then
                echo "| :warning: Token alert | Above ${TOKEN_WARN_THRESHOLD} threshold |"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record memory run-end success event
        if: success() && steps.check_orchestrator.outputs.is_orchestrator == 'true'
        run: |
          set -euo pipefail

          if [ ! -f scripts/memory_helpers.sh ]; then
            echo "::warning::memory_helpers.sh unavailable; skipping run-end success memory event"
            exit 0
          fi

          source scripts/memory_helpers.sh

          METADATA_JSON="$(jq -cn \
            --arg repository "${{ github.repository }}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{repository: $repository, run_attempt: $run_attempt}')"

          memory_record_run_event \
            --run-id "${GITHUB_RUN_ID}" \
            --workflow "orchestrate_clarify_respond" \
            --event-type "run_end" \
            --status "ok" \
            --message "orchestrate clarify-respond completed successfully" \
            --issue-number "${ISSUE_NUMBER}" \
            --actor "${GITHUB_ACTOR}" \
            --metadata-json "${METADATA_JSON}"

      - name: Record memory run-end failure event
        if: failure() && steps.check_orchestrator.outputs.is_orchestrator == 'true'
        run: |
          set -euo pipefail

          if [ ! -f scripts/memory_helpers.sh ]; then
            echo "::warning::memory_helpers.sh unavailable; skipping run-end failure memory event"
            exit 0
          fi

          source scripts/memory_helpers.sh

          METADATA_JSON="$(jq -cn \
            --arg repository "${{ github.repository }}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{repository: $repository, run_attempt: $run_attempt}')"

          memory_record_run_event \
            --run-id "${GITHUB_RUN_ID}" \
            --workflow "orchestrate_clarify_respond" \
            --event-type "run_end" \
            --status "error" \
            --message "orchestrate clarify-respond failed" \
            --issue-number "${ISSUE_NUMBER}" \
            --actor "${GITHUB_ACTOR}" \
            --metadata-json "${METADATA_JSON}"

      - name: Comment on issue failure
        if: failure() && steps.check_orchestrator.outputs.is_orchestrator == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body="Orchestrator clarify-respond workflow failed for ${ISSUE_URL}. Run: ${RUN_URL}"

      - name: Telegram failure notification
        if: failure() && steps.check_orchestrator.outputs.is_orchestrator == 'true'
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
        run: |
          set -euo pipefail
          source scripts/tg_helpers.sh

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="Orchestrator clarify-respond failed for #${ISSUE_NUMBER}: ${ISSUE_TITLE:-}"
          MSG+=$'\n'
          MSG+="Issue: ${ISSUE_URL}"
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_tracked "${ISSUE_NUMBER}" "${MSG}" "ERROR"

      - name: Cleanup git auth remote
        if: always() && steps.check_orchestrator.outputs.is_orchestrator == 'true'
        run: |
          set -euo pipefail
          if [ -d .git ]; then
            git remote set-url origin "${{ github.server_url }}/${{ github.repository }}"
          fi

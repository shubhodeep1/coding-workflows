name: Codex PR Self-Healing Semantic Agent

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number to process"
        required: false
        type: string
      pr_is_draft:
        description: "Whether the PR is a draft (passed by wrapper workflows)"
        required: false
        default: false
        type: boolean
      pr_title:
        description: "PR title for [skip ai] gating (passed by wrapper workflows)"
        required: false
        default: ""
        type: string
      pr_body:
        description: "PR body for [skip ai] gating (passed by wrapper workflows)"
        required: false
        default: ""
        type: string
      pr_skip_ai:
        description: "Precomputed skip flag for [skip ai] gating"
        required: false
        default: false
        type: boolean
      allow_workflow_edits:
        description: "Allow AI/editor changes to .github/workflows files"
        required: false
        default: true
        type: boolean
      force_rb_judge:
        description: "Skip reviewers/editor/commit and run only the review-blocked judge (used by the stall poller to escape ai:review-blocked)"
        required: false
        default: false
        type: boolean
      # No-PR claude-branch review inputs (push-without-PR path).
      # When the caller fires for a push to a claude/** branch that has no
      # open PR, set force_claude_branch_review=true and pass head/base
      # overrides so the gate can bypass its PR-API fetch and synthesize
      # PR_META_FILE without calling /repos/{owner}/{repo}/pulls/{n}.
      # PR-backed claude/** branches intentionally do NOT use this mode;
      # they run the same review -> editor -> commit -> re-review loop as
      # every other PR branch. post_review_comment.sh routes to a commit
      # comment when PR_NUMBER is empty (see scripts/post_review_comment.sh
      # §"Routing decision").
      force_claude_branch_review:
        description: "No-PR claude-branch review path: bypass gate's PR-number requirement and run reviewer-comment mode against the head_ref_override / head_sha_override / base_ref_override inputs. PR-backed claude/** branches run normal autofix."
        required: false
        default: false
        type: boolean
      head_ref_override:
        description: "Caller-supplied head branch (e.g. github.ref_name) for the no-PR claude-branch-review path."
        required: false
        default: ""
        type: string
      head_sha_override:
        description: "Caller-supplied head SHA (e.g. github.sha) for the no-PR claude-branch-review path."
        required: false
        default: ""
        type: string
      base_ref_override:
        description: "Caller-supplied base branch for the no-PR claude-branch-review path (defaults to the repo default branch when empty)."
        required: false
        default: ""
        type: string
    secrets:
      GH_PAT:
        required: true
      OPENROUTER_API_KEY:
        required: true
      TG_BOT_SECRET:
        required: false
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to process (used by merge-ref fallback re-trigger)"
        required: true
        type: string
      allow_workflow_edits:
        description: "Allow AI/editor changes to .github/workflows files"
        required: false
        default: false
        type: boolean
      force_rb_judge:
        description: "Skip reviewers/editor/commit and run only the review-blocked judge (used by the stall poller to escape ai:review-blocked)"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REVIEWER_MODELS: |
    minimax/minimax-m2.5
    moonshotai/kimi-k2.5
    deepseek/deepseek-v4-pro
    mistralai/mistral-small-2603
    qwen/qwen3.6-plus
    x-ai/grok-4.20
  MODEL_EDITOR: ${{ vars.WORKFLOW_EDITOR_MODEL || 'openai/gpt-5.4' }}
  # Defaults to xhigh to match the repo-wide gpt-5.4 reasoning-level
  # policy. Override per-repo via vars.THINKING_LEVEL_REVIEWER; the smoke
  # path forces `low` separately in the "Detect smoke test" step.
  REVIEWER_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_REVIEWER || 'xhigh' }}
  REVIEWER_VERBOSITY: ${{ vars.VERBOSITY_REVIEWER || 'low' }}
  # Pass-2 diff-size gate (review_run_reviewers.sh): by default, small diffs
  # run a shallower second-pass review than large diffs while preserving the
  # existing per-branch override structure. Operators can still override one
  # or both branches via vars.REVIEWER_PASS2_REASONING_SMALL /
  # vars.REVIEWER_PASS2_REASONING_LARGE, and the operator override
  # (THINKING_LEVEL_REVIEWER / smoke-set REVIEWER_REASONING_EFFORT) always
  # wins over the gate.
  REVIEWER_PASS2_DIFF_LARGE_LOC: ${{ vars.REVIEWER_PASS2_DIFF_LARGE_LOC || '200' }}
  REVIEWER_PASS2_REASONING_SMALL: ${{ vars.REVIEWER_PASS2_REASONING_SMALL || 'high' }}
  REVIEWER_PASS2_REASONING_LARGE: ${{ vars.REVIEWER_PASS2_REASONING_LARGE || 'xhigh' }}
  REVIEW_TIER_RESOLVER_ENABLED: ${{ vars.REVIEW_TIER_RESOLVER_ENABLED || 'false' }}
  REVIEW_TIER_LITE_MAX_LOC: ${{ vars.REVIEW_TIER_LITE_MAX_LOC || '50' }}
  REVIEW_TIER_LITE_REVIEWER_SLUG: ${{ vars.REVIEW_TIER_LITE_REVIEWER_SLUG || 'qwen/qwen3.6-plus' }}
  REVIEW_TIER_STANDARD_MAX_LOC: ${{ vars.REVIEW_TIER_STANDARD_MAX_LOC || '200' }}
  REVIEW_TIER_STANDARD_REVIEWER_SLUGS: ${{ vars.REVIEW_TIER_STANDARD_REVIEWER_SLUGS || 'minimax/minimax-m2.5,deepseek/deepseek-v4-pro,x-ai/grok-4.20' }}
  REVIEWER_RISK_TIER_ENABLED: ${{ vars.REVIEWER_RISK_TIER_ENABLED || '0' }}
  REVIEWER_RISK_TIER_TRIVIAL_LOC: ${{ vars.REVIEWER_RISK_TIER_TRIVIAL_LOC || '10' }}
  REVIEWER_RISK_TIER_TRIVIAL_FILES: ${{ vars.REVIEWER_RISK_TIER_TRIVIAL_FILES || '20' }}
  REVIEWER_RISK_TIER_LITE_LOC: ${{ vars.REVIEWER_RISK_TIER_LITE_LOC || '100' }}
  REVIEWER_RISK_TIER_LITE_FILES: ${{ vars.REVIEWER_RISK_TIER_LITE_FILES || '20' }}
  REVIEWER_RISK_TIER_ALWAYS_FULL_REGEX: ${{ vars.REVIEWER_RISK_TIER_ALWAYS_FULL_REGEX || '^(scripts/|\.github/workflows/|\.github/ai/|prompts/|workflow-templates/|db/contracts/|ai-memory/)' }}
  REVIEWER_TIER_TRIVIAL_MODELS: ${{ vars.REVIEWER_TIER_TRIVIAL_MODELS || '' }}
  REVIEWER_TIER_LITE_MODELS: ${{ vars.REVIEWER_TIER_LITE_MODELS || '' }}
  REVIEWER_CIRCUIT_BREAKER_ENABLED: ${{ vars.REVIEWER_CIRCUIT_BREAKER_ENABLED || '0' }}
  REVIEWER_FAILBACK_MAX_RETRIES: ${{ vars.REVIEWER_FAILBACK_MAX_RETRIES || '1' }}
  REVIEWER_HEALTH_OPEN_THRESHOLD: ${{ vars.REVIEWER_HEALTH_OPEN_THRESHOLD || '3' }}
  REVIEWER_HEALTH_OPEN_TTL_SECS: ${{ vars.REVIEWER_HEALTH_OPEN_TTL_SECS || '1800' }}
  # Editor (codex apply-fixes loop). Production defaults to xhigh
  # (repo-wide gpt-5.4 policy); smoke runs override to `medium` via the
  # "Detect smoke test PR" step (search "EDITOR_REASONING_EFFORT=medium"
  # below) — that medium override is preserved deliberately because the
  # smoke editor's bait-line task is the only known empty-output failure
  # mode where xhigh has been observed to time out. The "Switch reasoning
  # effort for editor" step below re-patches the global ~/.codex/config.toml
  # to EDITOR_REASONING_EFFORT before the editor's codex exec call. The
  # per-reviewer CODEX_HOME copies used during the reviewer passes are
  # isolated and never read by the editor.
  EDITOR_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_EDITOR || 'xhigh' }}
  EDITOR_VERBOSITY: ${{ vars.VERBOSITY_EDITOR || 'low' }}
  CONTEXT_BUDGET_WARN_RATIO: ${{ vars.CONTEXT_BUDGET_WARN_RATIO || '0.7' }}
  MAX_PROMPT_TOKENS_FOR_PHASE: ${{ vars.MAX_PROMPT_TOKENS_FOR_PHASE || '' }}
  OPENROUTER_PROMPT_CACHE_DISABLED: ${{ vars.OPENROUTER_PROMPT_CACHE_DISABLED || 'false' }}
  MEMORY_INJECTION_SCAN_ENABLED: ${{ vars.MEMORY_INJECTION_SCAN_ENABLED || 'true' }}
  # Targeted-file-context inlining limit — propagated to scripts/
  # review_apply_fixes.sh (autofix editor) and scripts/review_conflict_resolve.sh
  # (conflict resolver) via this workflow-level env block. Without this
  # export, the scripts' shell-level ${VAR:-DEFAULT} fallback fires and
  # repo-variable overrides are silently ignored. See
  # scripts/targeted_file_context.py docstring for semantics. Set to 0
  # to disable inlining entirely. Default matches implement.yml.
  TARGETED_FILE_CONTEXT_MAX_BYTES: ${{ vars.TARGETED_FILE_CONTEXT_MAX_BYTES || '102400' }}
  CODEX_HEARTBEAT_ENABLED: ${{ vars.CODEX_HEARTBEAT_ENABLED || '1' }}
  CODEX_HEARTBEAT_INTERVAL_SECS: ${{ vars.CODEX_HEARTBEAT_INTERVAL_SECS || '30' }}
  ENABLE_REVIEWER_TWO_PASS: ${{ vars.ENABLE_REVIEWER_TWO_PASS || 'true' }}
  REVIEW_REVIEWER_CHECKLIST_ENABLED: ${{ vars.REVIEW_REVIEWER_CHECKLIST_ENABLED || 'false' }}
  REVIEWER_FILTER_UNINTERESTING_ENABLED: ${{ vars.REVIEWER_FILTER_UNINTERESTING_ENABLED || 'false' }}
  REVIEWER_FILTER_EXTRA_GLOBS: ${{ vars.REVIEWER_FILTER_EXTRA_GLOBS || '' }}
  REVIEWER_FILTER_EXEMPT_GLOBS: ${{ vars.REVIEWER_FILTER_EXEMPT_GLOBS || 'db/contracts/**,**/migrations/**,**/migrate/**' }}
  AGENTS_MD_MATERIALITY_ENABLED: ${{ vars.AGENTS_MD_MATERIALITY_ENABLED || '1' }}
  AGENTS_MD_MATERIALITY_LLM_FALLBACK_ENABLED: ${{ vars.AGENTS_MD_MATERIALITY_LLM_FALLBACK_ENABLED || '0' }}
  AGENTS_MD_MATERIALITY_MODEL: ${{ vars.AGENTS_MD_MATERIALITY_MODEL || 'openai/gpt-5.4-mini' }}
  AGENTS_MD_MATERIALITY_REASONING: ${{ vars.AGENTS_MD_MATERIALITY_REASONING || 'medium' }}
  REVIEW_AGENTS_MD_MATERIALITY_CHECK_ENABLED: ${{ vars.REVIEW_AGENTS_MD_MATERIALITY_CHECK_ENABLED || 'true' }}
  # Cross-reviewer consensus summariser: after each pass (pass-1 feeds pass-2,
  # pass-2 feeds the editor), all reviewer outputs are fed to one codex-cli
  # call that emits a consolidated ledger. Hard-fails the workflow on repeat
  # failure — job-level "Telegram failure" step surfaces the incident.
  XPOLL_SUMMARISER_MODEL: ${{ vars.XPOLL_SUMMARISER_MODEL || 'openai/gpt-5.4-mini' }}
  XPOLL_SUMMARISER_REASONING: ${{ vars.XPOLL_SUMMARISER_REASONING || 'medium' }}
  XPOLL_SUMMARISER_LINES_PER_REVIEWER: ${{ vars.XPOLL_SUMMARISER_LINES_PER_REVIEWER || '160' }}
  XPOLL_SUMMARISER_CALL_TIMEOUT_SECS: ${{ vars.XPOLL_SUMMARISER_CALL_TIMEOUT_SECS || '2400' }}
  XPOLL_SUMMARISER_MAX_INPUT_LINES: ${{ vars.XPOLL_SUMMARISER_MAX_INPUT_LINES || '3000' }}
  # CI/lint check-run autofix context: when enabled (default), the workflow
  # snapshots failing/incomplete check-runs on the PR head SHA into
  # ${PR_CHECK_RUNS_CONTEXT_FILE} and feeds the file to reviewers + editor so
  # CI/lint failures are detected and fixed every run. See README and
  # agents.md for the contract.
  CHECK_RUNS_AUTOFIX_ENABLED: ${{ vars.CHECK_RUNS_AUTOFIX_ENABLED || 'true' }}
  CHECK_RUNS_WAIT_TIMEOUT_SECS: ${{ vars.CHECK_RUNS_WAIT_TIMEOUT_SECS || '300' }}
  CHECK_RUNS_POLL_INTERVAL_SECS: ${{ vars.CHECK_RUNS_POLL_INTERVAL_SECS || '20' }}
  # Per-failed-check-run cap on the `failed[i].log_tail` snapshot field
  # written by the "Collect PR check-run failures" step. The writer resolves
  # a short-lived Actions job-log URL (using the job ID parsed from the
  # already-captured details_url), range-fetches only the final
  # CHECK_RUNS_LOG_TAIL_BYTES bytes, then trims to the last 200 lines —
  # keeps actionable failure detail in reach when
  # consumer CI steps (bare `npm test`, `pytest`, `make test`) don't
  # emit `::error::` annotations and the Checks API output.summary is
  # empty. Fail-open: any fetch error writes an empty log_tail and the
  # pipeline continues. Set to `0` to disable log_tail capture; values
  # above `131072` clamp to `131072` so the snapshot stays bounded.
  CHECK_RUNS_LOG_TAIL_BYTES: ${{ vars.CHECK_RUNS_LOG_TAIL_BYTES || '16384' }}
  FINGERPRINT_QUARANTINE_RUNS_M: ${{ vars.FINGERPRINT_QUARANTINE_RUNS_M || '3' }}
  SEMBLE_ENABLED: ${{ vars.SEMBLE_ENABLED || 'true' }}
  SERENA_ENABLED: ${{ vars.SERENA_ENABLED || 'false' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.evaluate.outputs.should_run }}
      post_merge_dispatch: ${{ steps.evaluate.outputs.post_merge_dispatch }}
      skip_reason: ${{ steps.evaluate.outputs.skip_reason }}
      deterministic_skip: ${{ steps.evaluate.outputs.deterministic_skip }}
      det_skip_reason: ${{ steps.evaluate.outputs.det_skip_reason }}
      claude_branch_review: ${{ steps.evaluate.outputs.claude_branch_review }}
      force_full_review_tier: ${{ steps.evaluate.outputs.force_full_review_tier }}
      head_ref: ${{ steps.evaluate.outputs.head_ref }}
      post_merge_pr_text_json: ${{ steps.evaluate.outputs.post_merge_pr_text_json }}
      post_merge_linked_issues_json: ${{ steps.evaluate.outputs.post_merge_linked_issues_json }}
    steps:
      - name: Evaluate review gate
        id: evaluate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_IS_DRAFT: ${{ inputs.pr_is_draft }}
          PR_SKIP_AI: ${{ inputs.pr_skip_ai }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          AUTOFIX_SKIP_SELF_TRIGGERED: ${{ vars.AUTOFIX_SKIP_SELF_TRIGGERED }}
          AUTOFIX_BOT_LOGIN: ${{ vars.AUTOFIX_BOT_LOGIN }}
          # Deterministic pre-review skip (CLAUDE.md §4: env vars get defaults).
          # Skip the reviewer panel + editor cycle when:
          #   * AUTOFIX_SKIP_DOC_ONLY=true (default) AND every changed file
          #     matches the doc-only globs: *.md, *.txt, *.rst, LICENSE*,
          #     CHANGELOG*, docs/**.
          #   * OR total additions ≤ AUTOFIX_SKIP_MAX_ADDITIONS (default 10)
          #     AND total deletions ≤ AUTOFIX_SKIP_MAX_DELETIONS (default 10).
          # Override per PR: title contains [force-review] OR PR has the
          # `force-review` label — skip is bypassed and full review runs.
          # When the gate fires, the sibling `deterministic-skip-merge` job
          # adds `ai:review-skipped` to the PR, sets `ai:ready-to-merge` on
          # linked issues, and enables auto-merge — mirroring the tail of the
          # normal codex-agent job. Merge-conflict resolution is NOT run on
          # the skip path; conflicts fall through to the orchestrator stall
          # recovery cron, which can re-dispatch with a force-review override.
          AUTOFIX_SKIP_DOC_ONLY: ${{ vars.AUTOFIX_SKIP_DOC_ONLY }}
          AUTOFIX_SKIP_MAX_ADDITIONS: ${{ vars.AUTOFIX_SKIP_MAX_ADDITIONS }}
          AUTOFIX_SKIP_MAX_DELETIONS: ${{ vars.AUTOFIX_SKIP_MAX_DELETIONS }}
          # No-PR claude-branch-review path inputs (push-without-PR caller).
          FORCE_CLAUDE_BRANCH_REVIEW: ${{ inputs.force_claude_branch_review }}
          HEAD_REF_OVERRIDE: ${{ inputs.head_ref_override }}
        run: |
          set -euo pipefail

          SHOULD_RUN="true"
          POST_MERGE_DISPATCH="false"
          SKIP_REASON=""
          POST_MERGE_PR_TEXT_JSON='{"title":"","body":""}'
          POST_MERGE_LINKED_ISSUES_JSON='[]'
          FORCE_FULL_REVIEW_TIER="false"

          pr_state=""
          pr_merged="false"
          pr_head_ref=""
          pr_labels=""
          pr_additions=""
          pr_deletions=""
          pr_title_cached="${PR_TITLE:-}"
          pr_body_cached="${PR_BODY:-}"
          if [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            : # fall through to existing PR-API fetch below
          elif [ "${FORCE_CLAUDE_BRANCH_REVIEW:-false}" = "true" ] && [ -n "${HEAD_REF_OVERRIDE:-}" ]; then
            # No-PR claude-branch review path: caller (push to claude/** with
            # no open PR — see internal-review.yml resolve job) supplied the
            # head ref directly. Treat as an open synthetic PR for gating
            # purposes and leave PR-shaped fields empty; downstream editor /
            # commit / auto-merge steps still require a real PR number and are
            # skipped by the no-PR review-only mode below.
            pr_head_ref="${HEAD_REF_OVERRIDE}"
            pr_state="open"
            echo "AUTOFIX_GATE_NO_PR_FALLBACK head_ref=${pr_head_ref} reason=force_claude_branch_review_push"
          else
            SHOULD_RUN="false"
            SKIP_REASON="invalid_pr_number"
            echo "::warning::PR_NUMBER '${PR_NUMBER}' is not numeric; skipping review run."
          fi
          if [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            # CLAUDE.md §15: extend the existing PR fetch to also return
            # labels (force-review override check below) and per-PR
            # additions/deletions totals (deterministic-skip size check).
            # The /pulls/{n} endpoint already exposes these; using them
            # avoids a paginated /files call on the small-diff branch.
            if _pr_gate="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '{state: (.state // ""), merged: (.merged // false), head_ref: (.head.ref // ""), labels: ((.labels // []) | map(.name)), additions: (.additions // 0), deletions: (.deletions // 0), title: (.title // ""), body: (.body // "")}' \
              2>/dev/null)"; then
              pr_state="$(printf '%s' "${_pr_gate}" | jq -r '.state // ""' 2>/dev/null || echo "")"
              pr_merged="$(printf '%s' "${_pr_gate}" | jq -r 'if (.merged // false) then "true" else "false" end' 2>/dev/null || echo "false")"
              pr_head_ref="$(printf '%s' "${_pr_gate}" | jq -r '.head_ref // ""' 2>/dev/null || echo "")"
              pr_labels="$(printf '%s' "${_pr_gate}" | jq -r '(.labels // []) | join(",")' 2>/dev/null || echo "")"
              pr_additions="$(printf '%s' "${_pr_gate}" | jq -r '.additions // 0' 2>/dev/null || echo "")"
              pr_deletions="$(printf '%s' "${_pr_gate}" | jq -r '.deletions // 0' 2>/dev/null || echo "")"
              if [ -z "$(printf '%s' "${pr_title_cached}" | tr -d '[:space:]')" ]; then
                pr_title_cached="$(printf '%s' "${_pr_gate}" | jq -r '.title // ""' 2>/dev/null || echo "")"
              fi
              if [ -z "$(printf '%s' "${pr_body_cached}" | tr -d '[:space:]')" ]; then
                pr_body_cached="$(printf '%s' "${_pr_gate}" | jq -r '.body // ""' 2>/dev/null || echo "")"
              fi
            fi
          fi

          if [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]] && [ -z "${pr_state}" ]; then
            SHOULD_RUN="false"
            SKIP_REASON="pr_state_unknown"
            echo "::warning::Unable to determine PR state for #${PR_NUMBER}; skipping review run."
          elif [ "${pr_state}" = "closed" ]; then
            SHOULD_RUN="false"
            SKIP_REASON="pr_closed"
            if [ "${pr_merged}" = "true" ]; then
              POST_MERGE_DISPATCH="true"
            fi
          elif [ "${PR_IS_DRAFT}" = "true" ] || [ "${PR_SKIP_AI}" = "true" ]; then
            SHOULD_RUN="false"
            SKIP_REASON="draft_or_skip_ai"
          elif printf "%s" "${PR_TITLE} ${PR_BODY}" | grep -Fq "[skip ai]"; then
            SHOULD_RUN="false"
            SKIP_REASON="skip_ai_marker"
          fi

          # post-merge-validate-dispatch runs in a separate job and cannot
          # read the codex-agent runtime files. Hand off compact caches via
          # gate outputs so the merged-PR path can reuse the already fetched
          # PR text and linked-issue labels before any live fallback.
          if [ "${POST_MERGE_DISPATCH}" = "true" ] && [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            POST_MERGE_PR_TEXT_JSON="$(jq -cn --arg title "${pr_title_cached}" --arg body "${pr_body_cached}" '{title: $title, body: $body}')"
            if _post_merge_linked="$(gh api graphql \
              -f owner="${REPOSITORY%/*}" \
              -f name="${REPOSITORY#*/}" \
              -F number="${PR_NUMBER}" \
              -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { closingIssuesReferences(first: 50) { nodes { number labels(first: 100) { nodes { name } } } } } } }' \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes // [] | map({number: .number, labels: ((.labels.nodes // []) | map(.name))})' \
              2>/dev/null)"; then
              POST_MERGE_LINKED_ISSUES_JSON="$(printf '%s' "${_post_merge_linked}" | jq -c '.' 2>/dev/null || echo '[]')"
            else
              echo "::warning::Failed to cache linked issue labels for merged PR #${PR_NUMBER}; post-merge validation will fall back to live lookups."
            fi
          fi

          # No-PR claude-branch reviewer-comment mode:
          # Pushes to claude/** with no open PR have no PR thread to update
          # and no PR number for the editor / commit / auto-merge loop. Keep
          # that synthetic no-PR route as reviewer-comment-only, but do NOT
          # special-case PR-backed claude/** branches. Once a claude/** branch
          # has a PR, it should run the standard review -> editor -> commit ->
          # re-review loop until reviewers stop generating new findings, just
          # like any other branch.
          CLAUDE_BRANCH_REVIEW="false"
          if [ "${SHOULD_RUN}" = "true" ] \
            && [ "${FORCE_CLAUDE_BRANCH_REVIEW:-false}" = "true" ] \
            && [ -z "${PR_NUMBER:-}" ] \
            && [ -n "${pr_head_ref}" ]; then
            case "${pr_head_ref}" in
              claude/*)
                CLAUDE_BRANCH_REVIEW="true"
                echo "AUTOFIX_GATE_CLAUDE_BRANCH_REVIEW_NO_PR pr=${PR_NUMBER:-none} head_ref=${pr_head_ref} — running reviewer panel + commit-comment path because no PR exists."
                ;;
            esac
          fi

          # Self-triggered autofix skip:
          # When a pull_request.synchronize event was fired by the autofix's
          # own [ai-autofix] commit push (GitHub-attributed .author.login or
          # .committer.login equals AUTOFIX_BOT_LOGIN, default "codex"), the
          # follow-up "verification" run re-executes the full reviewer panel + editor
          # pass on the tree that was just committed. In the common case
          # every reviewer finding has already been applied or classified in
          # the preceding fix run, so this pass returns Change status:
          # not-edited and contributes no new work — it is pure cost
          # (~7 LLM calls per follow-up run). Skipping it cuts ~50% of
          # autofix LLM spend per fix cycle.
          #
          # Safety boundary:
          #   * Only synchronize events are eligible. workflow_dispatch (the
          #     post-commit fallback, EDITOR_CHANGES_LOST re-dispatch,
          #     orchestrator conflict-dispatch in _dispatch_review_for_conflicts,
          #     and manual re-runs) always runs.
          #   * pull_request.opened / reopened / ready_for_review always run.
          #   * Only the [ai-autofix] prefix is skipped; [ai-merge-resolve]
          #     commits still run the verification pass so post-resolution
          #     reviewer coverage is preserved (conflict-resolved code is
          #     higher-risk than a vanilla autofix edit).
          #   * Identity guard is based on GitHub-attributed identity:
          #     .author.login or .committer.login on the commit API response
          #     must equal AUTOFIX_BOT_LOGIN (default "codex"). These fields
          #     are resolved server-side by GitHub from the push credentials
          #     and are NOT user-controlled — unlike .commit.author.email,
          #     which is spoofable. If both logins are empty (e.g. an
          #     unauthenticated mirror push or a commit whose author email
          #     is not linked to any GitHub account), the gate fails open
          #     and runs review normally.
          #
          # Safety net:
          #   If a [ai-autofix] commit is incomplete or regresses the tree,
          #   the orchestrator stall cron (internal-orchestrate-poll.yml
          #   every 30 min) re-kicks autofix via workflow_dispatch, which
          #   bypasses this skip. Worst-case window: ~30 min.
          #
          # Opt-IN to the synchronize-self-skip: set repository variable
          # AUTOFIX_SKIP_SELF_TRIGGERED=true. Default is now `false` so that
          # autofix runs continuously on every push (including its own
          # [ai-autofix] verification reruns), matching the new
          # `internal-review-autofix-sweep` cron behaviour. Flip the var to
          # `true` to restore the prior LLM-cost-saving skip.
          # Override bot login: set repository variable AUTOFIX_BOT_LOGIN.
          if [ "${SHOULD_RUN}" = "true" ] \
            && [ "${EVENT_NAME}" = "pull_request" ] \
            && [ "${EVENT_ACTION}" = "synchronize" ] \
            && [ "${AUTOFIX_SKIP_SELF_TRIGGERED:-false}" = "true" ] \
            && [ -n "${PR_HEAD_SHA}" ]; then
            head_meta=""
            if ! head_meta="$(gh api "repos/${REPOSITORY}/commits/${PR_HEAD_SHA}" \
              --jq '[(.commit.message // "" | split("\n")[0]), (.author.login // ""), (.committer.login // "")] | @tsv' \
              2>/dev/null)"; then
              # Fail open — API error falls through to normal run so the
              # cycle is never silently broken.
              echo "AUTOFIX_GATE_SKIP_QUERY_FAILED pr=${PR_NUMBER:-?} head_sha=${PR_HEAD_SHA} reason=api_error"
              head_meta=""
            fi
            if [ -n "${head_meta}" ]; then
              head_msg_line="$(printf '%s' "${head_meta}" | cut -f1)"
              head_author_login="$(printf '%s' "${head_meta}" | cut -f2)"
              head_committer_login="$(printf '%s' "${head_meta}" | cut -f3)"
              bot_login="${AUTOFIX_BOT_LOGIN:-codex}"
              case "${head_msg_line}" in
                "[ai-autofix]"*)
                  if [ -n "${bot_login}" ] \
                    && { [ "${head_author_login,,}" = "${bot_login,,}" ] \
                      || [ "${head_committer_login,,}" = "${bot_login,,}" ]; }; then
                    SHOULD_RUN="false"
                    SKIP_REASON="self_triggered_autofix"
                    echo "AUTOFIX_GATE_SKIP reason=self_triggered_autofix pr=${PR_NUMBER} head_sha=${PR_HEAD_SHA} head_prefix=[ai-autofix] author_login=${head_author_login} committer_login=${head_committer_login} bot_login=${bot_login}"
                  else
                    echo "AUTOFIX_GATE_NO_SKIP_IDENTITY pr=${PR_NUMBER} head_sha=${PR_HEAD_SHA} head_prefix=[ai-autofix] author_login=${head_author_login} committer_login=${head_committer_login} bot_login=${bot_login}"
                  fi
                  ;;
              esac
            fi
          fi

          # Deterministic pre-review skip (last gate check):
          # If all earlier gates have passed (SHOULD_RUN still true) and the
          # PR qualifies as doc-only or under the size threshold, flip
          # SHOULD_RUN to false and route the PR to the
          # `deterministic-skip-merge` sibling job, which preserves the
          # ai:ready-to-merge + auto-merge tail of the normal review path.
          # See header env-block comment for full semantics.
          DETERMINISTIC_SKIP="false"
          DET_SKIP_REASON=""
          if [ "${SHOULD_RUN}" = "true" ] && [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            FORCE_REVIEW="false"
            if printf "%s" "${PR_TITLE}" | grep -Fq "[force-review]"; then
              FORCE_REVIEW="true"
            fi
            if [ -n "${pr_labels}" ]; then
              case ",${pr_labels}," in
                *,force-review,*) FORCE_REVIEW="true" ;;
              esac
            fi
            FORCE_FULL_REVIEW_TIER="${FORCE_REVIEW}"

            if [ "${FORCE_REVIEW}" = "true" ]; then
              echo "AUTOFIX_GATE_DET_SKIP_OVERRIDE pr=${PR_NUMBER} reason=force_review_marker"
            else
              # Size check uses the .additions/.deletions totals already
              # returned by the PR-state fetch above (no extra API call).
              # Bash arithmetic test fails open ("not small") if either
              # value is non-numeric.
              SMALL_DIFF="false"
              max_add="${AUTOFIX_SKIP_MAX_ADDITIONS:-10}"
              max_del="${AUTOFIX_SKIP_MAX_DELETIONS:-10}"
              if [ -n "${pr_additions}" ] && [ -n "${pr_deletions}" ] \
                && [ "${pr_additions}" -le "${max_add}" ] 2>/dev/null \
                && [ "${pr_deletions}" -le "${max_del}" ] 2>/dev/null; then
                SMALL_DIFF="true"
              fi

              # Doc-only check: only reach for the paginated /files API if
              # (a) the operator hasn't disabled the doc-only branch AND
              # (b) the cheap size check did not already qualify the PR.
              # /files is the only call where filenames are available;
              # /pulls/{n} does not include them.
              DOC_ONLY="false"
              file_count=""
              pr_files_json=""
              if [ "${SMALL_DIFF}" != "true" ] && [ "${AUTOFIX_SKIP_DOC_ONLY:-true}" != "false" ]; then
                # `gh api --paginate --jq '[…]'` emits one JSON array per
                # page. Without `jq -s 'add // []'` the concatenated output
                # is not a single valid JSON document and downstream jq
                # silently falls back to 0/empty — which on a >1-page PR
                # would erroneously evaluate as doc-only. Slurp + add
                # merges all pages into one array. JSON parse failure
                # treats the lookup as unavailable (fail-open below).
                pr_files_json=""
                if ! pr_files_json="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '[.[] | {filename: .filename}]' 2>/dev/null | jq -s 'add // []' 2>/dev/null)"; then
                  pr_files_json=""
                fi

                if [ -n "${pr_files_json}" ] && [ "${pr_files_json}" != "[]" ]; then
                  file_count="$(printf '%s' "${pr_files_json}" | jq 'length' 2>/dev/null || echo 0)"
                  if [ "${file_count}" != "0" ]; then
                    DOC_ONLY="true"
                    while IFS= read -r fname; do
                      [ -n "${fname}" ] || continue
                      base="${fname##*/}"
                      lc_fname="${fname,,}"
                      lc_base="${base,,}"
                      case "${lc_fname}" in
                        docs/*) continue ;;
                      esac
                      case "${lc_base}" in
                        *.md|*.txt|*.rst) continue ;;
                      esac
                      # LICENSE / CHANGELOG: case-insensitive prefix on
                      # basename — matches GitHub's own license/changelog
                      # detection (recognises license.txt, Changelog.md,
                      # LICENCE, etc.).
                      case "${lc_base}" in
                        license*|changelog*) continue ;;
                      esac
                      DOC_ONLY="false"
                      break
                    done < <(printf '%s' "${pr_files_json}" | jq -r '.[].filename' 2>/dev/null || true)
                  fi
                else
                  echo "AUTOFIX_GATE_DET_SKIP_FILES_UNAVAILABLE pr=${PR_NUMBER} — /files fetch failed or empty, doc-only check inconclusive."
                fi
              fi

              candidate_skip="false"
              candidate_skip_reason=""
              if [ "${DOC_ONLY}" = "true" ]; then
                candidate_skip="true"
                candidate_skip_reason="docs_only"
              elif [ "${SMALL_DIFF}" = "true" ]; then
                candidate_skip="true"
                candidate_skip_reason="small_diff"
              fi

              MATERIALITY_SKIP_SUPPRESSED="false"
              case "$(printf '%s' "${AGENTS_MD_MATERIALITY_ENABLED:-0}" | tr '[:upper:]' '[:lower:]')" in
                1|true|yes|on)
                  # Keep medium/high material PRs on the codex-agent path so
                  # the advisory comment is still reachable when the diff
                  # would otherwise short-circuit through deterministic skip.
                  # This lightweight gate only has /pulls/{n}/files path data,
                  # so it suppresses skip on the path-glob signals that are
                  # visible here and fails open for helper-only signals such as
                  # repo-verified new top-level directories.
                  if [ "${candidate_skip}" = "true" ]; then
                    if [ -z "${pr_files_json}" ] || [ "${pr_files_json}" = "[]" ]; then
                      if pr_files_json="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '[.[] | {filename: .filename}]' 2>/dev/null | jq -s 'add // []' 2>/dev/null)"; then
                        file_count="$(printf '%s' "${pr_files_json}" | jq 'length' 2>/dev/null || echo "${file_count:-0}")"
                      else
                        pr_files_json=""
                      fi
                    fi

                    if [ -n "${pr_files_json}" ] && [ "${pr_files_json}" != "[]" ]; then
                      # Mirror the helper's visible path rules here so the gate
                      # only suppresses deterministic skip when the helper would
                      # later classify the diff medium/high from PR file paths
                      # alone. Repo-verified signals such as new top-level
                      # directories remain helper-only and intentionally fail
                      # open on the gate path.
                      if gate_materiality_json="$(PR_FILES_JSON="${pr_files_json}" python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import PurePosixPath


          ROOT_HIGH_PATHS = {"package.json", "pyproject.toml", "Cargo.toml", "go.mod"}
          HIGH_BUILD_TEST_BASENAMES = {
              "pytest.ini",
              "tox.ini",
              "noxfile.py",
              "jest.config.js",
              "jest.config.cjs",
              "jest.config.mjs",
              "jest.config.ts",
              "vitest.config.js",
              "vitest.config.cjs",
              "vitest.config.mjs",
              "vitest.config.ts",
              "playwright.config.js",
              "playwright.config.cjs",
              "playwright.config.mjs",
              "playwright.config.ts",
              "cypress.config.js",
              "cypress.config.cjs",
              "cypress.config.mjs",
              "cypress.config.ts",
              "webpack.config.js",
              "webpack.config.cjs",
              "webpack.config.mjs",
              "webpack.config.ts",
              "vite.config.js",
              "vite.config.cjs",
              "vite.config.mjs",
              "vite.config.ts",
              "turbo.json",
              "go.work",
          }
          MEDIUM_DEPENDENCY_BASENAMES = {
              "package-lock.json",
              "bun.lock",
              "bun.lockb",
              "yarn.lock",
              "pnpm-lock.yaml",
              "Cargo.lock",
              "poetry.lock",
              "uv.lock",
              "go.sum",
              "Pipfile",
              "Pipfile.lock",
          }
          MEDIUM_LINT_BASENAMES = {
              ".eslintrc",
              ".eslintrc.json",
              ".eslintrc.js",
              ".eslintrc.cjs",
              ".eslintrc.yaml",
              ".eslintrc.yml",
              "eslint.config.js",
              "eslint.config.cjs",
              "eslint.config.mjs",
              "eslint.config.ts",
              ".prettierrc",
              ".prettierrc.json",
              ".prettierrc.js",
              ".prettierrc.cjs",
              ".stylelintrc",
              ".stylelintrc.json",
              ".stylelintrc.js",
              "stylelint.config.js",
              "stylelint.config.cjs",
              "stylelint.config.mjs",
              "stylelint.config.ts",
              "ruff.toml",
              ".ruff.toml",
              ".flake8",
              "pylintrc",
              "biome.json",
              "biome.jsonc",
          }
          CLIENT_WRAPPER_BASENAMES = {
              "client.py",
              "client.ts",
              "client.js",
              "client.tsx",
              "client.jsx",
              "client.go",
              "client.rb",
              "client.java",
          }
          CLIENT_WRAPPER_TOKENS = (
              "api_client",
              "api-client",
              "http_client",
              "http-client",
              "github_client",
              "github-client",
              "rest_client",
              "rest-client",
              "sdk_client",
              "sdk-client",
          )


          def looks_like_client_wrapper(path: str) -> bool:
              pure = PurePosixPath(path)
              basename = pure.name.lower()
              if basename in CLIENT_WRAPPER_BASENAMES:
                  parent_parts = [part.lower() for part in pure.parts[:-1]]
                  if any(part in {"api", "apis", "client", "clients", "http", "sdk"} for part in parent_parts):
                      return True
              if any(token in basename for token in CLIENT_WRAPPER_TOKENS):
                  return True
              return False


          def classify_path(path: str) -> str:
              pure = PurePosixPath(path)
              basename = pure.name
              if path in ROOT_HIGH_PATHS:
                  return "high"
              if path.startswith(".github/workflows/"):
                  return "high"
              if "/" not in path and basename in HIGH_BUILD_TEST_BASENAMES:
                  return "high"
              if basename in MEDIUM_DEPENDENCY_BASENAMES or (basename.startswith("requirements") and basename.endswith(".txt")) or (basename.startswith("constraints") and basename.endswith(".txt")):
                  return "medium"
              if basename in MEDIUM_LINT_BASENAMES:
                  return "medium"
              if looks_like_client_wrapper(path):
                  return "medium"
              return "low"


          payload = os.environ.get("PR_FILES_JSON", "")
          entries = json.loads(payload) if payload else json.load(sys.stdin)
          paths = []
          seen = set()
          for entry in entries:
              path = str((entry or {}).get("filename") or "").strip()
              if not path or path in seen:
                  continue
              seen.add(path)
              paths.append(path)

          materiality = "low"
          for path in paths:
              severity = classify_path(path)
              if severity == "high":
                  materiality = "high"
                  break
              if severity == "medium":
                  materiality = "medium"

          print(json.dumps({
              "agents_md_changed": "agents.md" in seen,
              "materiality": materiality,
          }))
          PY
                      )"; then
                        gate_materiality="$(printf '%s' "${gate_materiality_json}" | jq -r '.materiality // "low"' 2>/dev/null || echo low)"
                        gate_agents_changed="$(printf '%s' "${gate_materiality_json}" | jq -r 'if (.agents_md_changed // false) then "true" else "false" end' 2>/dev/null || echo false)"
                        if [ "${gate_agents_changed}" != "true" ] && { [ "${gate_materiality}" = "high" ] || [ "${gate_materiality}" = "medium" ]; }; then
                          MATERIALITY_SKIP_SUPPRESSED="true"
                          echo "AUTOFIX_GATE_DET_SKIP_SUPPRESSED reason=agents_md_materiality pr=${PR_NUMBER} materiality=${gate_materiality} candidate=${candidate_skip_reason}"
                        fi
                      else
                        echo "AUTOFIX_GATE_MATERIALITY_FILES_UNAVAILABLE pr=${PR_NUMBER} candidate=${candidate_skip_reason} — classifier unavailable, keeping deterministic skip fail-open."
                      fi
                    else
                      echo "AUTOFIX_GATE_MATERIALITY_FILES_UNAVAILABLE pr=${PR_NUMBER} candidate=${candidate_skip_reason} — /files fetch failed or empty, keeping deterministic skip fail-open."
                    fi
                  fi
                  ;;
              esac

              if [ "${candidate_skip}" = "true" ] && [ "${MATERIALITY_SKIP_SUPPRESSED}" != "true" ]; then
                DETERMINISTIC_SKIP="true"
                DET_SKIP_REASON="${candidate_skip_reason}"
                SHOULD_RUN="false"
                SKIP_REASON="deterministic_skip_${candidate_skip_reason}"
              fi

              echo "AUTOFIX_GATE_DET_SKIP_EVAL pr=${PR_NUMBER} files=${file_count:-skipped} additions=${pr_additions:-?} deletions=${pr_deletions:-?} max_add=${max_add} max_del=${max_del} doc_only=${DOC_ONLY} small_diff=${SMALL_DIFF} skip=${DETERMINISTIC_SKIP} reason=${DET_SKIP_REASON} materiality_suppressed=${MATERIALITY_SKIP_SUPPRESSED}"
            fi
          fi

          # The no-PR claude-branch reviewer-comment route and the deterministic
          # doc-only / small-diff skip path are mutually exclusive: without a
          # PR, there is nowhere to apply deterministic skip labeling /
          # auto-merge. PR-backed claude/** branches are not in this mode and
          # follow the same deterministic-skip behavior as other PRs.
          if [ "${CLAUDE_BRANCH_REVIEW}" = "true" ] && [ "${DETERMINISTIC_SKIP}" = "true" ]; then
            echo "AUTOFIX_GATE_DET_SKIP_SUPPRESSED reason=claude_branch_review pr=${PR_NUMBER} prior_det_skip_reason=${DET_SKIP_REASON}"
            DETERMINISTIC_SKIP="false"
            DET_SKIP_REASON=""
          fi

          echo "should_run=${SHOULD_RUN}" >> "${GITHUB_OUTPUT}"
          echo "post_merge_dispatch=${POST_MERGE_DISPATCH}" >> "${GITHUB_OUTPUT}"
          echo "skip_reason=${SKIP_REASON}" >> "${GITHUB_OUTPUT}"
          echo "deterministic_skip=${DETERMINISTIC_SKIP}" >> "${GITHUB_OUTPUT}"
          echo "det_skip_reason=${DET_SKIP_REASON}" >> "${GITHUB_OUTPUT}"
          echo "claude_branch_review=${CLAUDE_BRANCH_REVIEW}" >> "${GITHUB_OUTPUT}"
          echo "force_full_review_tier=${FORCE_FULL_REVIEW_TIER}" >> "${GITHUB_OUTPUT}"
          # Propagate head ref so downstream jobs (deterministic-skip-merge)
          # can apply the same head-ref-keyed auto-merge suppressors without
          # repeating the /pulls/{n} fetch above (§15 API hygiene). May be
          # empty on the invalid-PR-number branch; consumers must treat an
          # empty value as "unknown" and fall through (the empty string
          # never matches any suppressor regex, so auto-merge runs as before).
          echo "head_ref=${pr_head_ref}" >> "${GITHUB_OUTPUT}"
          printf 'post_merge_pr_text_json=%s\n' "${POST_MERGE_PR_TEXT_JSON}" >> "${GITHUB_OUTPUT}"
          printf 'post_merge_linked_issues_json=%s\n' "${POST_MERGE_LINKED_ISSUES_JSON}" >> "${GITHUB_OUTPUT}"

  post-merge-validate-dispatch:
    needs: gate
    runs-on: ubuntu-latest
    # claude_branch_review-mode skip: claude/* branches are operator-driven
    # and never carry orchestrator-managed sub-issues, so the validate
    # dispatch is unnecessary. Belt-and-braces — the label-scoped iteration
    # inside the job already no-ops on claude/* PRs.
    if: ${{ needs.gate.outputs.post_merge_dispatch == 'true' && needs.gate.outputs.claude_branch_review != 'true' }}
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
      VALIDATE_WORKFLOW_NAME: ${{ vars.VALIDATE_WORKFLOW_NAME || 'ai-validate.yml' }}
      WORKFLOW_SUPPORT_REF: ${{ github.repository == 'shubhodeep1/coding-workflows' && github.sha || 'stable' }}
      POST_MERGE_PR_TEXT_JSON: ${{ needs.gate.outputs.post_merge_pr_text_json }}
      POST_MERGE_LINKED_ISSUES_JSON: ${{ needs.gate.outputs.post_merge_linked_issues_json }}
    steps:
      - name: Checkout workflow support source
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ env.WORKFLOW_SUPPORT_REF }}
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Dispatch standalone validate for orchestrator short-circuit issues
        run: |
          set -euo pipefail

          if [ -f ".codex-workflow-src/scripts/gh_helpers.sh" ]; then
            source ".codex-workflow-src/scripts/gh_helpers.sh" 2>/dev/null || true
          fi

          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::warning::Skipping post-merge validate dispatch: invalid PR number '${PR_NUMBER}'."
            exit 0
          fi

          issue_nodes_json="$(printf '%s' "${POST_MERGE_LINKED_ISSUES_JSON:-[]}" | jq -c 'if type == "array" then [.[] | select((.number | tonumber?) != null) | {number: (.number | tonumber), labels: (if (.labels | type) == "array" then .labels else null end)}] else [] end' 2>/dev/null || echo '[]')"

          if [ "${issue_nodes_json}" = "[]" ]; then
            issue_nodes_json="$(gh api graphql \
              -f owner="${REPOSITORY%/*}" \
              -f name="${REPOSITORY#*/}" \
              -F number="${PR_NUMBER}" \
              -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { closingIssuesReferences(first: 50) { nodes { number labels(first: 100) { nodes { name } } } } } } }' \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes // [] | map({number: .number, labels: ((.labels.nodes // []) | map(.name))})' || true)"
          fi

          if [ -z "${issue_nodes_json}" ] || [ "${issue_nodes_json}" = "[]" ]; then
            pr_data="$(printf '%s' "${POST_MERGE_PR_TEXT_JSON:-{}}" | jq -r 'if type == "object" then [(.title // ""), (.body // "")] | join(" ") else "" end' 2>/dev/null || echo "")"
            if [ -z "$(printf '%s' "${pr_data}" | tr -d '[:space:]')" ]; then
              pr_data="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title + " " + (.body // "")' 2>/dev/null || echo "")"
            fi
            issue_numbers=""
            if type extract_repo_scoped_issue_refs_from_text >/dev/null 2>&1; then
              issue_numbers="$(extract_repo_scoped_issue_refs_from_text "${REPOSITORY}" "${pr_data}" || true)"
            else
              echo "::warning::Shared linked-issue fallback helper unavailable; skipping PR body/title fallback for PR #${PR_NUMBER}."
            fi
            if [ -z "${issue_numbers}" ]; then
              echo "No linked issues found for merged PR #${PR_NUMBER}."
              exit 0
            fi
            echo "Found linked issues via PR body/title fallback: ${issue_numbers}"

            issue_nodes_json="$(printf '%s\n' "${issue_numbers}" | jq -Rsc 'split("\n") | map(select(length > 0)) | map({number: tonumber, labels: null})')"
          fi

          validation_dispatched="false"
          validate_workflow="${VALIDATE_WORKFLOW_NAME:-ai-validate.yml}"
          while IFS=$'\t' read -r issue_number has_validate_label labels_known; do
            [ -n "${issue_number}" ] || continue

            if [ "${labels_known}" != "true" ]; then
              issue_labels="$(gh issue view "${issue_number}" --repo "${REPOSITORY}" --json labels --jq '.labels[].name' 2>/dev/null || true)"
              if echo "${issue_labels}" | grep -Fxq 'ai:orchestrator-validate-required'; then
                has_validate_label="true"
              else
                has_validate_label="false"
              fi
            fi

            if [ "${has_validate_label}" != "true" ]; then
              echo "Issue #${issue_number} does not have ai:orchestrator-validate-required; skipping."
              continue
            fi

            if [ "${validation_dispatched}" = "false" ]; then
              echo "Dispatching standalone validation for linked issue #${issue_number} (tracking_issue=0)."
              if gh workflow run "${validate_workflow}" --repo "${REPOSITORY}" -f tracking_issue="0" -f pr_number="${PR_NUMBER}" || { [ "${validate_workflow}" != "internal-validate.yml" ] && gh workflow run "internal-validate.yml" --repo "${REPOSITORY}" -f tracking_issue="0" -f pr_number="${PR_NUMBER}"; }; then
                validation_dispatched="true"
              else
                echo "::warning::Failed to dispatch ${validate_workflow}/internal-validate.yml for issue #${issue_number}; continuing without failing workflow."
                continue
              fi
            fi

            if ! gh issue edit "${issue_number}" --repo "${REPOSITORY}" --remove-label 'ai:orchestrator-validate-required'; then
              echo "::warning::Standalone validation dispatched for issue #${issue_number}, but failed to remove ai:orchestrator-validate-required."
            fi
          done < <(printf '%s' "${issue_nodes_json}" | jq -r '.[] | [.number, (if (.labels | type) == "array" then ((.labels | index("ai:orchestrator-validate-required")) != null) else false end), ((.labels | type) == "array")] | @tsv')

          if [ "${validation_dispatched}" = "false" ]; then
            echo "::warning::No standalone validation workflow could be dispatched for merged PR #${PR_NUMBER}."
          fi

      - name: Force orchestrate poll after merged PR handling
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          HELPER=".codex-workflow-src/scripts/orchestrate_force_tick.sh"
          if [ ! -f "${HELPER}" ]; then
            echo "::warning::orchestrate_force_tick.sh unavailable; skipping post-merge force tick."
            exit 0
          fi
          bash "${HELPER}" \
            --repo "${REPOSITORY}" \
            --issue "${PR_NUMBER}" \
            --reason "review-post-merge" \
            --source-workflow "review_autofix" \
            --run-id "${{ github.run_id }}"

  # Deterministic skip path: fires when the gate detects a doc-only PR or a
  # PR under the +/- LOC threshold. Mirrors the labeler + auto-merge tail of
  # the codex-agent job so the orchestrator phase machine still advances
  # (ai:ready-to-merge on linked issues) and the PR auto-merges as it would
  # after a normal clean review. Reviewer panel, editor, summarizer, and
  # merge-conflict resolver are all skipped — if a conflict exists,
  # auto-merge will block and the orchestrator stall cron re-dispatches.
  deterministic-skip-merge:
    needs: gate
    runs-on: ubuntu-latest
    if: ${{ needs.gate.outputs.deterministic_skip == 'true' }}
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
      DET_SKIP_REASON: ${{ needs.gate.outputs.det_skip_reason }}
      ENABLE_AUTO_MERGE: ${{ vars.ENABLE_AUTO_MERGE || 'true' }}
      # When 'true' (default), forward-merge fallback PRs (head ref
      # `^auto/forward-merge-stable-`) auto-merge via a real merge commit
      # (`gh pr merge --merge --auto`) instead of being left for a manual
      # merge. Set to any non-'true' value to restore the previous
      # manual-merge-commit behaviour. See the auto-merge step below.
      FORWARD_MERGE_FALLBACK_AUTO_MERGE: ${{ vars.FORWARD_MERGE_FALLBACK_AUTO_MERGE || 'true' }}
      # Reused from the gate job's existing /pulls/{n} fetch (§15 API hygiene) —
      # consumed by the forward-merge-fallback suppressor in the auto-merge
      # step below. May be empty when the gate could not resolve the PR
      # (invalid PR number); the suppressor treats empty as "unknown" and
      # falls through to the regular auto-merge call.
      PR_HEAD_REF: ${{ needs.gate.outputs.head_ref }}
    steps:
      - name: Mark PR review-skipped, mark linked issues ready-to-merge, enable auto-merge
        run: |
          set -euo pipefail

          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::warning::Skipping deterministic-skip-merge: invalid PR number '${PR_NUMBER}'."
            exit 0
          fi

          # Inline retry wrapper (mirrors gh_retry pattern from
          # SUPPORT_SCRIPTS_DIR/gh_helpers.sh; we avoid loading the full
          # support source here to keep this job lightweight).
          gh_retry() {
            local n=0 max=4 delay=2
            while :; do
              if "$@"; then return 0; fi
              n=$((n+1))
              if [ "${n}" -ge "${max}" ]; then return 1; fi
              sleep "${delay}"
              delay=$((delay*2))
            done
          }

          ensure_label_exists() {
            local label="$1" repo="$2" color="$3" desc="$4"
            gh_retry gh label create "${label}" --repo "${repo}" --color "${color}" --description "${desc}" >/dev/null 2>&1 || true
          }

          # 1) PR-side audit label. Color + description mirror the central
          # catalog in scripts/label_helpers.sh so `ensure_label_exists`
          # produces an identical label regardless of which job creates it
          # first. This job intentionally does not load label_helpers.sh
          # (avoids the heavyweight workflow-source checkout); the inline
          # definitions must stay in lockstep with the catalog.
          ensure_label_exists "ai:review-skipped" "${REPOSITORY}" "c2e0c6" "Reviewer panel + editor cycle skipped by deterministic gate (doc-only or under size threshold)"
          if ! gh_retry gh api -X POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" \
            -f "labels[]=ai:review-skipped" >/dev/null 2>&1; then
            echo "::warning::Failed to add ai:review-skipped label to PR #${PR_NUMBER}."
          fi

          # 2) Linked-issue resolution: GraphQL `closingIssuesReferences`
          # ONLY. We deliberately do NOT fall back to the body/title regex
          # used by post-merge-validate-dispatch and the codex-agent
          # `Mark linked issues ready to merge` step, because the
          # deterministic skip path runs on doc-only and tiny PRs whose
          # body/title is the most likely place to contain incidental
          # references like `issues/45` or `issue #99` (e.g. README
          # examples), which would otherwise mislabel unrelated issues
          # with `ai:ready-to-merge` and prematurely advance their
          # orchestrator phase. Orchestrator-managed PRs always carry
          # explicit closing keywords (`Fixes #N`) so GraphQL resolves
          # them correctly; PRs whose linked issue depends on the regex
          # heuristic will simply not advance their issue label on this
          # path — they still pass through PR labeling + auto-merge,
          # and the orchestrator stall cron picks up any lag.
          issue_numbers="$(gh api graphql \
            -f owner="${REPOSITORY%/*}" \
            -f name="${REPOSITORY#*/}" \
            -F number="${PR_NUMBER}" \
            -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { closingIssuesReferences(first: 50) { nodes { number } } } } }' \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes // [] | map(.number) | .[]' 2>/dev/null || true)"

          if [ -n "${issue_numbers}" ]; then
            ensure_label_exists "ai:ready-to-merge" "${REPOSITORY}" "0e8a16" "PR review complete and ready to merge"
            while IFS= read -r issue_number; do
              [ -n "${issue_number}" ] || continue
              echo "Setting ai:ready-to-merge on issue #${issue_number}"
              if ! gh_retry gh api -X POST "repos/${REPOSITORY}/issues/${issue_number}/labels" \
                -f "labels[]=ai:ready-to-merge" >/dev/null 2>&1; then
                echo "::warning::Failed to set ai:ready-to-merge on issue #${issue_number}."
              fi
            done <<< "${issue_numbers}"
          else
            echo "No linked issues found via closingIssuesReferences for PR #${PR_NUMBER} — skipping issue labeling. PR will still be labeled ai:review-skipped and auto-merge will be enabled."
          fi

          # 3) Auto-merge (mirrors codex-agent's "Enable auto-merge on PR" step)
          auto_merge_summary="disabled by ENABLE_AUTO_MERGE"
          if [ "${ENABLE_AUTO_MERGE}" != "true" ]; then
            echo "Auto-merge disabled (ENABLE_AUTO_MERGE != true) — leaving PR for manual merge."
          elif [ -n "${PR_HEAD_REF}" ] && printf '%s\n' "${PR_HEAD_REF}" | grep -Eq '^auto/forward-merge-stable-'; then
            # Mirror of the forward-merge-fallback handling in the codex-agent
            # "Enable auto-merge on PR" step. Defense in depth: a tiny
            # forward-merge fallback PR (e.g. one that just happens to fall
            # under AUTOFIX_SKIP_MAX_ADDITIONS / _DELETIONS) short-circuits
            # through this deterministic-skip-merge path before the codex-agent
            # path runs, so the same merge-commit auto-merge (or its opt-out)
            # must be applied here too — otherwise the `--squash --auto` tail
            # below would strip stable's ancestry. See the longer comment block
            # on this exact regex in the "Enable auto-merge on PR" step for the
            # full rationale (promote-main-to-stable.yml ancestry check,
            # "Create a merge commit" requirement, etc.).
            if [ "${FORWARD_MERGE_FALLBACK_AUTO_MERGE}" = "true" ]; then
              echo "Enabling auto-merge (merge commit) on forward-merge fallback PR #${PR_NUMBER} (head ref '${PR_HEAD_REF}')..."
              if gh_retry gh pr merge "${PR_NUMBER}" --repo "${REPOSITORY}" --merge --auto; then
                auto_merge_summary="ENABLED (merge commit)"
                echo "Auto-merge (merge commit) enabled. PR will merge once all required checks pass, preserving stable's ancestry on main."
              else
                auto_merge_summary="FAILED to enable merge-commit auto-merge (see warnings above)"
                echo "::warning::Could not enable auto-merge (merge commit) on forward-merge fallback PR #${PR_NUMBER}. Check that 'Allow merge commits' and 'Allow auto-merge' are enabled in repo settings and branch protection is configured. The PR remains open for manual 'Create a merge commit'."
              fi
            else
              auto_merge_summary="SUPPRESSED (forward-merge fallback head ref '${PR_HEAD_REF}', FORWARD_MERGE_FALLBACK_AUTO_MERGE != 'true')"
              echo "PR #${PR_NUMBER} head ref '${PR_HEAD_REF}' matches forward-merge fallback pattern '^auto/forward-merge-stable-' and FORWARD_MERGE_FALLBACK_AUTO_MERGE != 'true' — auto-merge suppressed on the deterministic-skip path. Merge manually via 'Create a merge commit' (NOT squash/rebase) so stable's commits remain in main's ancestry; promote-main-to-stable.yml's pre-flight 'git merge-base --is-ancestor HEAD origin/main' check refuses otherwise."
            fi
          else
            echo "Enabling auto-merge (squash) on PR #${PR_NUMBER}..."
            if gh_retry gh pr merge "${PR_NUMBER}" --repo "${REPOSITORY}" --squash --auto; then
              auto_merge_summary="ENABLED (squash)"
              echo "Auto-merge enabled. PR will merge once all required checks pass."
            else
              auto_merge_summary="FAILED to enable (see warnings above)"
              echo "::warning::Could not enable auto-merge on PR #${PR_NUMBER}. Check that 'Allow auto-merge' is enabled in repo settings and branch protection is configured."
            fi
          fi

          # 4) Workflow run summary
          {
            echo "## Deterministic skip gate fired"
            echo ""
            echo "- **PR:** #${PR_NUMBER}"
            echo "- **Skip reason:** \`${DET_SKIP_REASON}\`"
            echo "- **Reviewer panel + editor cycle:** SKIPPED"
            echo "- **Auto-merge:** ${auto_merge_summary}"
            echo ""
            echo "To force a full review on a future run, add the \`force-review\` label to the PR or include \`[force-review]\` in the title, then re-trigger the workflow."
          } >> "${GITHUB_STEP_SUMMARY}"

  codex-agent:
    needs: gate
    # Display name surfaces the gate's no-PR claude_branch_review decision in
    # the GitHub Checks UI. Only claude/** pushes without an open PR use the
    # reviewer-comment path; PR-backed claude/** branches keep the normal
    # codex-agent name and run the full autofix loop. Job ID stays
    # "codex-agent" so cross-references in internal-review.yml / status
    # checks / required-checks rules don't break.
    name: ${{ needs.gate.outputs.claude_branch_review == 'true' && 'codex-agent (claude-branch-review)' || 'codex-agent' }}
    runs-on: ubuntu-latest
    # Sized to accommodate the resolver step's 170-min cap plus the
    # pre-resolver work (~24 min observed on run 25629086684: disk
    # cleanup, checkout, codex install, runtime workspace setup,
    # reviewer fan-out, editor, prompt prep) and post-resolver work
    # (validation, push, comments, telegram, EXIT-trap dispatch).
    # The previous 180-min cap left only ~10 min of job-level
    # headroom over the new 170-min step cap, which a flagged
    # review comment correctly identified as risk: a long resolver
    # run could be killed by the job timer before the EXIT trap
    # dispatches the orchestrator poll.  240 min gives ~46 min of
    # cushion (24 pre + 170 step + 46 post = 240) so the EXIT trap
    # is reachable even when every retry uses its full per-attempt
    # budget.
    timeout-minutes: 240
    concurrency:
      # Two cancellation regimes, keyed off needs.gate.outputs.claude_branch_review:
      #
      #   * PR-backed branches, including claude/** PR branches (regular PR autofix): cancel-in-progress=false.
      #     New runs queue behind the running peer instead of cancelling it.
      #     If another run is already pending in this group, GitHub replaces
      #     that older pending run with the newest one. This keeps bursts
      #     near "current run + newest queued run" while avoiding the long
      #     trail of cancelled in-progress runs that cancel-in-progress=true
      #     used to cause. Hung runs are bounded by the timeout-minutes above.
      #
      #   * No-PR claude/** reviewer-comment mode: cancel-in-progress=true.
      #     With no PR/autofix loop to preserve, a new push makes the in-flight
      #     reviewer panel stale; cancel it so only the latest SHA gets a
      #     commit comment.
      #
      # Group key fallback to inputs.head_ref_override covers the no-PR
      # claude-branch push path (review-claude-branch-push in
      # internal-review.yml): PR_NUMBER is empty and inputs.pr_number is "",
      # so without the head_ref_override fallback the group would collapse
      # to github.run_id (unique per run) and cancel-in-progress could never
      # match a prior run on the same branch. Using the branch name keeps
      # the group stable across commits to the same claude/** branch.
      group: pr-autofix-${{ github.event.pull_request.number || inputs.pr_number || inputs.head_ref_override || github.run_id }}
      cancel-in-progress: ${{ needs.gate.outputs.claude_branch_review == 'true' }}
    if: ${{ needs.gate.outputs.should_run == 'true' }}

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PR_NUMBER: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
      WORKSPACE_REUSE_ENABLED: ${{ vars.WORKSPACE_REUSE_ENABLED || 'false' }}
      # Review-pipeline knobs: mirror the landed script defaults so repo-var
      # overrides are honored without changing current branch behaviour.
      REVIEW_FLOOR_RULES_ENABLED: ${{ vars.REVIEW_FLOOR_RULES_ENABLED || '1' }}
      REVIEW_FLOOR_KEYWORDS_FILE: ${{ vars.REVIEW_FLOOR_KEYWORDS_FILE || '' }}
      REVIEW_CONSOLIDATOR_ENABLED: ${{ vars.REVIEW_CONSOLIDATOR_ENABLED || '1' }}
      REVIEW_CONSOLIDATOR_MODEL: ${{ vars.REVIEW_CONSOLIDATOR_MODEL || 'openai/gpt-5.4' }}
      REVIEW_CONSOLIDATOR_REASONING: ${{ vars.REVIEW_CONSOLIDATOR_REASONING || 'xhigh' }}
      REVIEW_CONSOLIDATOR_TIMEOUT_SECS: ${{ vars.REVIEW_CONSOLIDATOR_TIMEOUT_SECS || '300' }}
      REVIEW_CONSOLIDATOR_MAX_TOKENS_OUT: ${{ vars.REVIEW_CONSOLIDATOR_MAX_TOKENS_OUT || '16000' }}
      REVIEW_PARSER_FAILOPEN: ${{ vars.REVIEW_PARSER_FAILOPEN || '1' }}
      CONSOLIDATOR_REJECT_SCHEMA_ENABLED: ${{ vars.CONSOLIDATOR_REJECT_SCHEMA_ENABLED || 'false' }}
      REVIEW_LEDGER_ENABLED: ${{ vars.REVIEW_LEDGER_ENABLED || '1' }}
      REVIEW_LEDGER_REREVIEW_ENABLED: ${{ vars.REVIEW_LEDGER_REREVIEW_ENABLED || 'false' }}
      REVIEW_LEDGER_PERSIST_LIMIT: ${{ vars.REVIEW_LEDGER_PERSIST_LIMIT || '2' }}
      REVIEW_LEDGER_PATH: ${{ vars.REVIEW_LEDGER_PATH || format('.ai/review_issue_ledger/pr-{0}.txt', inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number || '0') }}
      REVIEW_APPROVAL_RUBRIC_ENABLED: ${{ vars.REVIEW_APPROVAL_RUBRIC_ENABLED || 'false' }}
      REVIEW_BREAK_GLASS_ENABLED: ${{ vars.REVIEW_BREAK_GLASS_ENABLED || 'false' }}
      REVIEW_REVIEWER_CHECKLIST_ENABLED: ${{ vars.REVIEW_REVIEWER_CHECKLIST_ENABLED || '1' }}
      REVIEW_REVIEWER_ITERATION_SCOPING: ${{ vars.REVIEW_REVIEWER_ITERATION_SCOPING || '1' }}
      FORCE_FULL_REVIEW_TIER: ${{ needs.gate.outputs.force_full_review_tier || 'false' }}
      REVIEW_TIER_RESOLVER_ENABLED: ${{ vars.REVIEW_TIER_RESOLVER_ENABLED || 'false' }}
      REVIEW_TIER_LITE_MAX_LOC: ${{ vars.REVIEW_TIER_LITE_MAX_LOC || '50' }}
      REVIEW_TIER_LITE_REVIEWER_SLUG: ${{ vars.REVIEW_TIER_LITE_REVIEWER_SLUG || 'qwen/qwen3.6-plus' }}
      REVIEW_TIER_STANDARD_MAX_LOC: ${{ vars.REVIEW_TIER_STANDARD_MAX_LOC || '200' }}
      REVIEW_TIER_STANDARD_REVIEWER_SLUGS: ${{ vars.REVIEW_TIER_STANDARD_REVIEWER_SLUGS || 'minimax/minimax-m2.5,deepseek/deepseek-v4-pro,x-ai/grok-4.20' }}
      REVIEWER_RISK_TIER_ENABLED: ${{ vars.REVIEWER_RISK_TIER_ENABLED || '0' }}
      REVIEWER_RISK_TIER_TRIVIAL_LOC: ${{ vars.REVIEWER_RISK_TIER_TRIVIAL_LOC || '10' }}
      REVIEWER_RISK_TIER_TRIVIAL_FILES: ${{ vars.REVIEWER_RISK_TIER_TRIVIAL_FILES || '20' }}
      REVIEWER_RISK_TIER_LITE_LOC: ${{ vars.REVIEWER_RISK_TIER_LITE_LOC || '100' }}
      REVIEWER_RISK_TIER_LITE_FILES: ${{ vars.REVIEWER_RISK_TIER_LITE_FILES || '20' }}
      REVIEWER_RISK_TIER_ALWAYS_FULL_REGEX: ${{ vars.REVIEWER_RISK_TIER_ALWAYS_FULL_REGEX || '^(scripts/|\.github/workflows/|\.github/ai/|prompts/|workflow-templates/|db/contracts/|ai-memory/)' }}
      REVIEWER_TIER_TRIVIAL_MODELS: ${{ vars.REVIEWER_TIER_TRIVIAL_MODELS || '' }}
      REVIEWER_TIER_LITE_MODELS: ${{ vars.REVIEWER_TIER_LITE_MODELS || '' }}
      REVIEWER_CIRCUIT_BREAKER_ENABLED: ${{ vars.REVIEWER_CIRCUIT_BREAKER_ENABLED || '0' }}
      REVIEWER_FAILBACK_MAX_RETRIES: ${{ vars.REVIEWER_FAILBACK_MAX_RETRIES || '1' }}
      REVIEWER_HEALTH_OPEN_THRESHOLD: ${{ vars.REVIEWER_HEALTH_OPEN_THRESHOLD || '3' }}
      REVIEWER_HEALTH_OPEN_TTL_SECS: ${{ vars.REVIEWER_HEALTH_OPEN_TTL_SECS || '1800' }}
      REVIEWER_FILTER_UNINTERESTING_ENABLED: ${{ vars.REVIEWER_FILTER_UNINTERESTING_ENABLED || 'false' }}
      REVIEWER_FILTER_EXTRA_GLOBS: ${{ vars.REVIEWER_FILTER_EXTRA_GLOBS || '' }}
      REVIEWER_FILTER_EXEMPT_GLOBS: ${{ vars.REVIEWER_FILTER_EXEMPT_GLOBS || 'db/contracts/**,**/migrations/**,**/migrate/**' }}
      SLOP_SCAN_ENABLED: ${{ vars.SLOP_SCAN_ENABLED || 'true' }}
      AGENTS_MD_MATERIALITY_ENABLED: ${{ vars.AGENTS_MD_MATERIALITY_ENABLED || '1' }}
      AGENTS_MD_MATERIALITY_LLM_FALLBACK_ENABLED: ${{ vars.AGENTS_MD_MATERIALITY_LLM_FALLBACK_ENABLED || '0' }}
      AGENTS_MD_MATERIALITY_MODEL: ${{ vars.AGENTS_MD_MATERIALITY_MODEL || 'openai/gpt-5.4-mini' }}
      AGENTS_MD_MATERIALITY_REASONING: ${{ vars.AGENTS_MD_MATERIALITY_REASONING || 'medium' }}
      REVIEW_AGENTS_MD_MATERIALITY_CHECK_ENABLED: ${{ vars.REVIEW_AGENTS_MD_MATERIALITY_CHECK_ENABLED || 'true' }}
      JUDGE_INTERIM_ENABLED: ${{ vars.JUDGE_INTERIM_ENABLED || 'false' }}
      JUDGE_INTERIM_REASONING: ${{ vars.JUDGE_INTERIM_REASONING || 'low' }}
      JUDGE_INTERIM_TIMEOUT_S: ${{ vars.JUDGE_INTERIM_TIMEOUT_S || '120' }}
      BEHAVIOURAL_SMOKE_FROM_JUDGE_ENABLED: ${{ vars.BEHAVIOURAL_SMOKE_FROM_JUDGE_ENABLED || 'false' }}
      BEHAVIOURAL_SMOKE_LANG: ${{ vars.BEHAVIOURAL_SMOKE_LANG || '' }}
      BEHAVIOURAL_SMOKE_MODEL: ${{ vars.BEHAVIOURAL_SMOKE_MODEL || 'openai/gpt-5.4-mini' }}
      BEHAVIOURAL_SMOKE_TIMEOUT_S: ${{ vars.BEHAVIOURAL_SMOKE_TIMEOUT_S || '120' }}
      VALIDATION_INCLUDE_SYNTHESISED: ${{ vars.VALIDATION_INCLUDE_SYNTHESISED || 'true' }}
      ALLOW_WORKFLOW_EDITS: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.allow_workflow_edits == 'true') || (github.event_name != 'workflow_dispatch' && inputs.allow_workflow_edits)) && 'true' || 'false' }}
      WRITE_GUARDS_ENABLED: ${{ vars.WRITE_GUARDS_ENABLED || 'true' }}
      # Claude-branch-review mode: when true, the codex-agent job runs the
      # reviewer panel + summariser, posts the consensus ledger as a PR
      # commit comment via scripts/post_review_comment.sh, and exits without
      # invoking the editor / commit / push / rb_judge / auto-merge tail.
      # This is only for claude/** pushes with no open PR; PR-backed claude/**
      # branches run normal autofix. Sourced from the gate output. See gate.
      CLAUDE_BRANCH_REVIEW_MODE: ${{ needs.gate.outputs.claude_branch_review }}
      # No-PR claude-branch-review path overrides (push events on claude/**
      # without an open PR).  Read by "Collect PR metadata" and
      # "Checkout PR head branch" to synthesize PR_META_FILE / TARGET_BRANCH
      # without calling the GitHub PR API.  Empty strings are treated as
      # "not in no-PR mode" — the standard PR-API path runs instead.
      HEAD_REF_OVERRIDE_INPUT: ${{ inputs.head_ref_override }}
      HEAD_SHA_OVERRIDE_INPUT: ${{ inputs.head_sha_override }}
      BASE_REF_OVERRIDE_INPUT: ${{ inputs.base_ref_override }}

    steps:

      # Reclaim ~25–28 GB on ubuntu-latest before any checkout/LLM
      # work runs.  The codex-agent job has historically died mid-step on
      # asset-heavy consumer repos when the parallel reviewer fan-out
      # and an in-flight git clone all competed for the
      # runner's default ~14 GB free disk.  Removing the unused
      # tool-cache + Android/.NET/Haskell SDKs + Docker images + swap
      # gives every downstream step a wide margin.
      #
      # Knobs deliberately left off:
      #   * large-packages: apt removal is slow (~3–5 min) and not needed
      #     once the SDK caches above are gone.
      # Only enabled on codex-agent — the deterministic-skip-merge job
      # has no checkout, no LLM, and no working tree, so the ~30 s spent
      # here would be pure waste there.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Show disk usage (post free-disk-space)
        run: df -h /

      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # Use the PR head SHA instead of the default merge ref
          # (refs/pull/<number>/merge). When the PR has merge conflicts,
          # the merge ref may not exist, causing checkout to fail and
          # preventing the entire workflow — including conflict resolution
          # — from running.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Shallow clone to bound disk/memory cost on history-heavy
          # consumer repos.  fetch-depth: 0 (full clone with all branches +
          # tags) was the dominant cause of "runner died mid-step" on
          # large repos: the parallel reviewer fan-out in `Run reviewer
          # models` running on top of a multi-GB clone exhausts the
          # ubuntu-latest runner's RAM/disk.  Depth 100 covers every
          # in-job git walk by a wide margin (autofix walk ≤ 3, judge-fix
          # walk ≤ PR-unique history, HEAD~1 diffs, recent-commits-20).
          # Steps that need history beyond depth 100 (the merge precheck
          # and the `origin/<base>...HEAD` diff fallback) deepen on demand
          # below — see "Generate diff context" and "Detect merge
          # conflicts".
          fetch-depth: 100
          # Partial clone: skip historical blobs at clone time and lazy-
          # fetch them only when a step actually reads file contents.  On
          # asset-heavy consumer repos (large PNGs/binaries with many
          # rewrites in history) this can drop the working clone by
          # several GB without affecting the in-job git walks (autofix /
          # judge-fix / HEAD~1 / recent-commits-20), which only need
          # commits + trees.  HEAD's blobs are still materialised by the
          # checkout itself, so reviewers see the working tree as usual.
          filter: blob:none
          token: ${{ secrets.GH_PAT }}

      - name: Show disk usage (post checkout)
        run: df -h /

      - name: Configure git auth for memory helper clones
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_PAT is empty"; exit 1; }
          SERVER_HOST="${GITHUB_SERVER_URL#https://}"
          SERVER_HOST="${SERVER_HOST#http://}"
          SERVER_HOST="${SERVER_HOST%/}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}"

      - name: Resolve workflow support ref
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            echo "SCRIPT_REF=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "SCRIPT_REF=stable" >> "$GITHUB_ENV"
          fi

      - name: Checkout workflow support source
        id: checkout_support_source
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ env.SCRIPT_REF }}
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Checkout workflow support source fallback
        if: ${{ steps.checkout_support_source.outcome == 'failure' }}
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Ensure workflow support source checkout
        run: |
          set -euo pipefail
          if [ ! -d .codex-workflow-src ]; then
            echo "::error::Failed to checkout workflow support source from ${SCRIPT_REF} or main"
            exit 1
          fi

      - name: Checkout workflow support source main snapshot
        if: ${{ env.SCRIPT_REF != 'main' }}
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src-main
          fetch-depth: 1

      - name: Stage workflow support files
        run: |
          set -euo pipefail
          helper=".codex-workflow-src/scripts/stage_workflow_support.sh"
          if [ ! -f "${helper}" ] && [ -f ".codex-workflow-src-main/scripts/stage_workflow_support.sh" ]; then
            helper=".codex-workflow-src-main/scripts/stage_workflow_support.sh"
          fi
          if [ ! -f "${helper}" ]; then
            echo "::error::stage_workflow_support.sh not found in checked-out support sources (${SCRIPT_REF} and optional main snapshot) in shubhodeep1/coding-workflows."
            exit 1
          fi
          echo "PROMPT_PRELUDE_REFACTOR_ENABLED=${{ vars.PROMPT_PRELUDE_REFACTOR_ENABLED || 'false' }}" >> "$GITHUB_ENV"
          CURRENT_REPOSITORY="${{ github.repository }}" \
          WORKFLOW_SOURCE_REPO="shubhodeep1/coding-workflows" \
          bash "${helper}"

          SUPPORT_ROOT_DIR="${RUNNER_TEMP}/coding-workflows-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SUPPORT_PROMPTS_DIR="${SUPPORT_ROOT_DIR}/prompts"
          if [ ! -f "${SUPPORT_PROMPTS_DIR}/integration-sync-conflict-resolver-retry-timeout-prelude.txt" ]; then
            src=".codex-workflow-src/prompts/integration-sync-conflict-resolver-retry-timeout-prelude.txt"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/prompts/integration-sync-conflict-resolver-retry-timeout-prelude.txt" ]; then
              src=".codex-workflow-src-main/prompts/integration-sync-conflict-resolver-retry-timeout-prelude.txt"
            fi
            if [ -f "${src}" ]; then
              install -m 0644 "${src}" "${SUPPORT_PROMPTS_DIR}/integration-sync-conflict-resolver-retry-timeout-prelude.txt"
            else
              echo "::warning::integration-sync-conflict-resolver-retry-timeout-prelude.txt not found in checked-out support sources for ${SCRIPT_REF}; resolver timeout-induced retries on integration-sync runs will fall back to the original prompt verbatim (no timeout-aware reflexion guidance)."
              rm -f "${SUPPORT_PROMPTS_DIR}/integration-sync-conflict-resolver-retry-timeout-prelude.txt"
            fi
          fi

      - name: Show disk usage (post support-source staging)
        run: df -h /

      - name: Validate PR number input
        # Skip in the no-PR claude-branch-review path (push event on a
        # claude/** branch with no open PR — PR_NUMBER is intentionally
        # empty and post_review_comment.sh routes to a commit comment).
        if: env.CLAUDE_BRANCH_REVIEW_MODE != 'true' || env.PR_NUMBER != ''
        run: |
          set -euo pipefail
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR_NUMBER: ${PR_NUMBER}. Expected numeric string matching ^[0-9]+$"
            exit 1
          fi

      - name: Check PR state (defense-in-depth)
        # Skip in the no-PR claude-branch-review path (no PR to query).
        if: env.CLAUDE_BRANCH_REVIEW_MODE != 'true' || env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }

          pr_meta="$(gh_retry _safe_gh_jq "repos/${REPOSITORY}/pulls/${PR_NUMBER}" || echo 'null')"
          pr_state="$(printf '%s\n' "${pr_meta}" | jq -r 'if ((.merged_at != null) or (.merged == true)) then "merged" else (.state // "") end' | grep -xE 'open|closed|merged' || echo "")"
          if [ -z "${pr_state}" ]; then
            echo "::warning::Unable to determine PR #${PR_NUMBER} state; assuming open."
            pr_state="open"
          fi
          if [ "${pr_state}" = "closed" ] || [ "${pr_state}" = "merged" ]; then
            echo "::warning::PR #${PR_NUMBER} is ${pr_state} — setting PR_CLOSED to skip downstream work."
            echo "PR_CLOSED=true" >> "$GITHUB_ENV"
          fi

      - name: Install Codex CLI
        uses: shubhodeep1/coding-workflows/.github/actions/install-codex@stable
        with:
          codex_version: ${{ vars.CODEX_VERSION || 'v0.114.0' }}

      - name: Install OS-level dependencies
        shell: bash
        run: |
          set -euo pipefail

          # jq/curl/python3 are pre-installed on hosted ubuntu runners, so the
          # common case needs no apt at all. Only reach for apt-get when a tool
          # is genuinely missing: a bare `apt-get update` under `set -e` exits
          # 100 whenever an unrelated pre-installed third-party apt source (e.g.
          # packages.microsoft.com) transiently 403s, which would otherwise take
          # the whole review pipeline down for a dependency this step never uses.
          # Mirrors the "Install OS-level core tools" step in orchestrate.yml /
          # orchestrate_poll.yml.
          missing_tools=()
          for tool in jq curl python3; do
            command -v "$tool" >/dev/null 2>&1 || missing_tools+=("$tool")
          done

          if [ "${#missing_tools[@]}" -gt 0 ]; then
            if ! command -v apt-get >/dev/null 2>&1; then
              echo "Missing tools (${missing_tools[*]}), but apt-get is unavailable on this runner" >&2
              exit 1
            fi

            apt_cmd=(apt-get)
            if command -v sudo >/dev/null 2>&1; then
              apt_cmd=(sudo apt-get)
            elif [ "$(id -u)" -ne 0 ]; then
              echo "Missing tools (${missing_tools[*]}), but sudo is unavailable and the current user is not root" >&2
              exit 1
            fi

            "${apt_cmd[@]}" update || {
              apt_update_rc=$?
              echo "apt-get update failed (rc=${apt_update_rc}) while preparing to install missing tools: ${missing_tools[*]}" >&2
              exit "${apt_update_rc}"
            }
            "${apt_cmd[@]}" install -y "${missing_tools[@]}" || {
              apt_install_rc=$?
              echo "apt-get install failed (rc=${apt_install_rc}) for: ${missing_tools[*]}" >&2
              exit "${apt_install_rc}"
            }
          fi

      - name: Initialize runtime workspace
        run: |
          set -euo pipefail

          RUNTIME_DIR="/tmp/codex-pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          PREVIOUS_REVIEWS_DIR="${RUNTIME_DIR}/previous_reviews"
          RUNTIME_CONTEXT_DIR="${RUNTIME_DIR}/runtime_context"

          mkdir -p "${PREVIOUS_REVIEWS_DIR}" "${RUNTIME_CONTEXT_DIR}"

          {
            echo "JOB_START_EPOCH=$(date +%s)"
            echo "RUNTIME_DIR=${RUNTIME_DIR}"
            echo "PREVIOUS_REVIEWS_DIR=${PREVIOUS_REVIEWS_DIR}"
            echo "RUNTIME_CONTEXT_DIR=${RUNTIME_CONTEXT_DIR}"
            echo "PR_PAYLOAD_FILE=${RUNTIME_DIR}/pr_payload.json"
            echo "PR_META_FILE=${RUNTIME_DIR}/pr_meta.json"
            echo "PR_DIFF_FILE=${RUNTIME_DIR}/pr_diff.patch"
            echo "ORIGINAL_PR_DIFF_FILE=${RUNTIME_DIR}/original_pr_diff.patch"
            echo "PR_ISSUE_COMMENTS_FILE=${RUNTIME_DIR}/pr_issue_comments.json"
            echo "AGENTS_MD_MATERIALITY_RESULT_FILE=${RUNTIME_DIR}/agents_md_materiality_result.json"
            echo "AGENTS_MD_MATERIALITY_COMMENT_FILE=${RUNTIME_DIR}/agents_md_materiality_comment.md"
            echo "PR_REVIEWS_FILE=${RUNTIME_DIR}/pr_reviews.json"
            echo "PR_REVIEW_COMMENTS_FILE=${RUNTIME_DIR}/pr_review_comments.json"
            echo "PR_ALL_COMMENTS_CONTEXT_FILE=${RUNTIME_DIR}/pr_all_comments_context.txt"
            echo "PR_CHECK_RUNS_CONTEXT_FILE=${RUNTIME_DIR}/pr_check_runs_context.txt"
            echo "LAST_RUN_DIFF_FILE=${RUNTIME_DIR}/last_run_diff.patch"
            echo "LAST_RUN_CHANGED_FILES_FILE=${RUNTIME_DIR}/last_run_changed_files.txt"
            echo "PR_CHANGED_FILES_FILE=${RUNTIME_DIR}/pr_changed_files.txt"
            echo "LAST_COMMIT_STAT_FILE=${RUNTIME_DIR}/last_commit_stat.txt"
            echo "LAST_RUN_DIFF_STAT_FILE=${RUNTIME_DIR}/last_run_diff_stat.txt"
            echo "SLOP_SCAN_FINDINGS_FILE=${GITHUB_WORKSPACE}/.ai/slop_scan/findings.json"
            echo "REVIEWER_PROMPT_BODY_FILE=${RUNTIME_DIR}/reviewer_prompt_body.txt"
            echo "EDITOR_PROMPT_BODY_FILE=${RUNTIME_DIR}/editor_prompt_body.txt"
            echo "REVIEWER_PROMPT_FILE=${RUNTIME_DIR}/reviewer_prompt.txt"
            echo "EDITOR_PROMPT_FILE=${RUNTIME_DIR}/editor_prompt.txt"
            echo "EDITOR_SUMMARY_FILE=${RUNTIME_DIR}/editor_summary.txt"
            echo "PR_EDITOR_COMMENT_FILE=${RUNTIME_DIR}/pr_editor_comment.txt"
            echo "REVIEWER_CONSENSUS_FILE=${RUNTIME_DIR}/reviewer_consensus.txt"
            echo "LINKED_ISSUE_CONTEXT_FILE=${RUNTIME_DIR}/linked_issue_context.txt"
            echo "MEMORY_CONTEXT_FILE=${RUNTIME_DIR}/memory_context.txt"
            echo "REVIEWER_SEMBLE_QUERY_FILE=${RUNTIME_DIR}/reviewer_semble_query.txt"
            echo "EDITOR_SEMBLE_QUERY_FILE=${RUNTIME_DIR}/editor_semble_query.txt"
            echo "CONFLICT_RESOLVER_SEMBLE_QUERY_FILE=${RUNTIME_DIR}/conflict_resolver_semble_query.txt"
            echo "CONFLICT_RESOLVER_PROMPT_FILE=${RUNTIME_DIR}/conflict_resolver_prompt.txt"
            echo "CONFLICT_RESOLVER_SUMMARY_FILE=${RUNTIME_DIR}/conflict_resolver_summary.txt"
            echo "COMMITTED_FILES_FILE=${RUNTIME_DIR}/committed_files.txt"
            echo "SEMBLE_AVAILABLE=false"
            echo "SEMBLE_BIN="
            echo "SEMBLE_INDEX_AVAILABLE=false"
            echo "SEMBLE_INDEX_PATH=${RUNTIME_DIR}/.semble-index"
            echo "SERENA_AVAILABLE=false"
            echo "SERENA_PROJECT_PREEXISTED=false"
            echo "SERENA_PROJECT_BOOTSTRAP_HASH="
            echo "HAS_PR_DIFF=false"
            echo "PR_DIFF_SOURCE=uninitialized"
            echo "PR_DIFF_ATTEMPTED_PATHS=gh_pr_diff:${RUNTIME_DIR}/pr_diff.patch"
          } >> "$GITHUB_ENV"

      - name: Initialize workspace metadata
        if: env.PR_CLOSED != 'true'
        id: workspace_meta
        run: |
          set -euo pipefail

          workspace_reuse_enabled="${WORKSPACE_REUSE_ENABLED:-false}"
          workspace_identifier=""
          if [[ "${PR_NUMBER:-}" =~ ^[0-9]+$ ]] && [ "${PR_NUMBER}" -gt 0 ]; then
            workspace_identifier="${PR_NUMBER}"
          else
            workspace_reuse_enabled="false"
          fi

          WORKSPACE_REUSE_ENABLED="${workspace_reuse_enabled}" \
          WORKSPACE_REQUIRE_STABLE_IDENTIFIER_FOR_REUSE="true" \
          WORKSPACE_ISSUE_IDENTIFIER="${workspace_identifier}" \
          WORKSPACE_SOURCE_PATH="${GITHUB_WORKSPACE}" \
            bash "${SUPPORT_SCRIPTS_DIR}/workspace_init.sh" metadata

      - name: Restore reusable workspace cache
        if: env.PR_CLOSED != 'true' && steps.workspace_meta.outputs.workspace_reuse_enabled == 'true'
        id: workspace_cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.workspace_meta.outputs.workspace_path }}
          key: ${{ steps.workspace_meta.outputs.workspace_cache_key }}
          restore-keys: |
            ${{ steps.workspace_meta.outputs.workspace_cache_restore_prefix_exact }}
            ${{ steps.workspace_meta.outputs.workspace_cache_restore_prefix_issue }}

      - name: Finalize workspace metadata
        if: env.PR_CLOSED != 'true'
        id: workspace_state
        run: |
          set -euo pipefail
          workspace_cache_matched_key=""
          workspace_cache_path="${{ steps.workspace_meta.outputs.workspace_path }}"
          workspace_cache_key="${{ steps.workspace_meta.outputs.workspace_cache_key }}"
          workspace_cache_restore_prefix_issue="${{ steps.workspace_meta.outputs.workspace_cache_restore_prefix_issue }}"
          workspace_cache_hit="${{ steps.workspace_cache.outputs.cache-hit || '' }}"
          if [ "${workspace_cache_hit}" = "true" ]; then
            workspace_cache_matched_key="${workspace_cache_key}"
          elif [ -d "${workspace_cache_path}" ] && [ -n "$(find "${workspace_cache_path}" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
            workspace_cache_matched_key="${workspace_cache_restore_prefix_issue}restored"
          fi
          WORKSPACE_REUSE_ENABLED="${{ steps.workspace_meta.outputs.workspace_reuse_enabled }}" \
          WORKSPACE_REQUIRE_STABLE_IDENTIFIER_FOR_REUSE="true" \
          WORKSPACE_ISSUE_IDENTIFIER="${{ steps.workspace_meta.outputs.workspace_issue_identifier }}" \
          WORKSPACE_SOURCE_PATH="${GITHUB_WORKSPACE}" \
          WORKSPACE_FINGERPRINT="${{ steps.workspace_meta.outputs.workspace_fingerprint }}" \
          WORKSPACE_CACHE_MATCHED_KEY="${workspace_cache_matched_key}" \
            bash "${SUPPORT_SCRIPTS_DIR}/workspace_init.sh" metadata

      - name: Finalize workspace contents
        if: env.PR_CLOSED != 'true'
        run: |
          set -euo pipefail
          WORKSPACE_SOURCE_PATH="${GITHUB_WORKSPACE}" \
          WORKSPACE_PATH="${{ steps.workspace_state.outputs.workspace_path }}" \
          WORKSPACE_REUSE_ENABLED="${{ steps.workspace_state.outputs.workspace_reuse_enabled }}" \
          WORKSPACE_CACHE_RESTORE_STATE="${{ steps.workspace_state.outputs.workspace_cache_restore_state }}" \
            bash "${SUPPORT_SCRIPTS_DIR}/workspace_init.sh" finalize

      - name: Activate workspace shell context
        if: env.PR_CLOSED != 'true'
        run: |
          set -euo pipefail
          workspace_shell_env="${RUNTIME_DIR}/workspace-shell.env"
          cat > "${workspace_shell_env}" <<'EOF'
          if [ -n "${WORKSPACE_PATH:-}" ] && [ -d "${WORKSPACE_PATH}" ]; then
            cd "${WORKSPACE_PATH}"
          fi
          EOF
          {
            echo "BASH_ENV=${workspace_shell_env}"
            echo "GIT_DIR=${GITHUB_WORKSPACE}/.git"
            echo "GIT_WORK_TREE=${WORKSPACE_PATH}"
          } >> "$GITHUB_ENV"

      - name: Setup uv for Semble
        if: env.PR_CLOSED != 'true' && (env.SEMBLE_ENABLED == 'true' || env.SERENA_ENABLED == 'true')
        continue-on-error: true
        uses: astral-sh/setup-uv@v7

      - name: Install semble
        if: env.PR_CLOSED != 'true' && (env.SEMBLE_ENABLED == 'true' || env.SERENA_ENABLED == 'true')
        continue-on-error: true
        run: |
          set -euo pipefail

          # The shared installer is still pip-based today. Keep setup-uv as
          # additive bootstrap so the workflow-level Semble contract lands
          # without redesigning scripts/install_semble.sh in this issue.
          if [ "${SEMBLE_ENABLED:-false}" != "true" ]; then
            echo "::notice::SEMBLE_ENABLED is not true; skipping Semble install."
            echo "SEMBLE_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ ! -f "${SUPPORT_SCRIPTS_DIR}/install_semble.sh" ]; then
            echo "::warning::Optional Semble installer is unavailable at ${SUPPORT_SCRIPTS_DIR}/install_semble.sh; leaving Semble disabled for this run."
            echo "SEMBLE_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if ! bash "${SUPPORT_SCRIPTS_DIR}/install_semble.sh"; then
            echo "::warning::Semble install helper failed; leaving Semble disabled for this run."
            echo "SEMBLE_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

          SEMBLE_BIN_PATH="$(command -v semble 2>/dev/null || true)"
          if [ -n "${SEMBLE_BIN_PATH}" ]; then
            echo "SEMBLE_BIN=${SEMBLE_BIN_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Build semble index
        if: env.PR_CLOSED != 'true' && env.SEMBLE_ENABLED == 'true'
        # Defense-in-depth: the shared script is fail-soft already, but the
        # step-level guard ensures a future wrapper regression still
        # degrades to SEMBLE_INDEX_AVAILABLE=false instead of hard-failing.
        continue-on-error: true
        run: |
          set -euo pipefail
          # Shared BM25 wrapper builder — see scripts/build_semble_wrapper.sh
          # for the rationale (semble 0.1.3 lacks the index/query CLI).
          # Fail-soft: writes SEMBLE_INDEX_AVAILABLE=false on any error and
          # exits 0, continuing without Semble-backed prompt context.
          # Honors SUPPORT_SCRIPTS_DIR (the staged-bootstrap dir) ahead of
          # local scripts/ so review_autofix's @stable-pinned support root
          # wins when it's populated.
          wrapper_script=""
          if [ -n "${SUPPORT_SCRIPTS_DIR:-}" ] && [ -f "${SUPPORT_SCRIPTS_DIR}/build_semble_wrapper.sh" ]; then
            wrapper_script="${SUPPORT_SCRIPTS_DIR}/build_semble_wrapper.sh"
          elif [ -f scripts/build_semble_wrapper.sh ]; then
            wrapper_script="scripts/build_semble_wrapper.sh"
          fi
          if [ -n "${wrapper_script}" ]; then
            # The wrapper is documented "always exit 0" (every failure path
            # routes through mark_unavailable() which exits 0), so the prior
            # `if !` check was dead code. Gate the diagnostic tail on the
            # wrapper's own failure marker in the captured log instead of on
            # pickle absence: a cleanup-of-cleanup failure (rm -rf fails to
            # remove the pickle inside mark_unavailable) would leave the
            # pickle on disk and falsely suppress the tail. The "Semble
            # wrapper unavailable: <reason>" line is written via log() to
            # stderr before any cleanup runs, so it's always present in the
            # captured log on failure.
            bash "${wrapper_script}" > "${RUNTIME_DIR}/semble_index.log" 2>&1 || true
            if grep -q '^build_semble_wrapper: Semble wrapper unavailable:' "${RUNTIME_DIR}/semble_index.log" 2>/dev/null; then
              tail -n 20 "${RUNTIME_DIR}/semble_index.log" 2>/dev/null | sed 's/^/semble index: /' || true
            fi
          else
            echo "::notice::build_semble_wrapper.sh not staged; continuing without Semble-backed prompt context."
            echo "SEMBLE_INDEX_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Record review run start in memory (fail-open)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set +e

          if [ -f "${SUPPORT_SCRIPTS_DIR}/memory_helpers.sh" ]; then
            # shellcheck disable=SC1091
            source "${SUPPORT_SCRIPTS_DIR}/memory_helpers.sh"
            memory_bootstrap --ensure-branch --require memory_record_run_event
            memory_record_run_event \
              --run-id "${GITHUB_RUN_ID}" \
              --workflow "review_autofix" \
              --event-type "phase_started" \
              --status "ok" \
              --message "review_autofix run started" \
              --pr-number "${PR_NUMBER}" \
              --actor "${GITHUB_ACTOR}" \
              --metadata-json "{\"run_attempt\": ${GITHUB_RUN_ATTEMPT}}"
          else
            echo "::warning::memory helper script missing; skipping run-start event"
          fi

          true

      - name: Create Codex config
        run: |
          set -euo pipefail
          source "${SUPPORT_SCRIPTS_DIR}/codex_helpers.sh"
          # See scripts/write_codex_config.sh for the apply_patch /
          # trust / elevation rationale.
          CODEX_HELPERS_SCRIPTS_DIR="${SUPPORT_SCRIPTS_DIR}" \
            codex_config_assemble "${MODEL_EDITOR}" "${REVIEWER_REASONING_EFFORT}" "low" --web-search disabled

      - name: Pre-assemble static context (cacheable across runs)
        run: |
          set -euo pipefail

          if [ ! -s "${SUPPORT_INSTRUCTIONS_FILE}" ]; then
            echo "Missing required unattended_system_instructions.md"
            exit 1
          fi

          # Pre-assemble static system instructions into one file so the LLM
          # provider can cache this stable prefix across runs. Dynamic per-PR
          # content (diffs, reviewer output, etc.) is kept separate and read after.
          {
            echo "=== UNATTENDED SYSTEM INSTRUCTIONS ==="
            cat "${SUPPORT_INSTRUCTIONS_FILE}"
            echo
            # Note: SUPPORT_INSTRUCTIONS_FILE and SUPPORT_CODEX_INSTRUCTIONS_FILE
            # both now resolve to unattended_system_instructions.md, which
            # already contains §11 Code Style. The previous "code-style-only"
            # extraction block (`awk '/^## 9\. Code Style/{flag=1} /^## 10\./{flag=0} flag{print}'`)
            # was keyed to the old codex_system_instructions.md numbering and
            # would now silently emit an empty section against the new file's
            # `## §11. Code Style` header. Removed because the cat above
            # already includes that section in full.
            if [ -f "${SUPPORT_AGENTS_FILE}" ]; then
              echo "=== AGENTS.MD ==="
              cat "${SUPPORT_AGENTS_FILE}"
              echo
            fi
            if [ -f README.md ]; then
              echo "=== README.MD (trimmed) ==="
              # Keep overview/variables; exclude wrapper and automation docs.
              awk '/^### 2\. Create wrapper workflows/{exit} {print}' README.md
              echo
            fi
            if [ -f probably_unnecessary_but_read_if_stuck.md ]; then
              echo "=== OVERFLOW REFERENCE ==="
              echo "If you cannot make progress without operator-runbook details (env var reference, autofix retrigger/dedup internals, orchestrator integration-sync auto-heal, validation self-healing, workflow log analysis pipeline, semantic cache scope, wrapper pin policy), read ./probably_unnecessary_but_read_if_stuck.md from the working tree before bailing."
              echo
            fi
          } > ./pre_assembled_static.txt

      - name: Collect PR metadata
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          bash "${SUPPORT_SCRIPTS_DIR}/review_collect_pr_metadata.sh"

      - name: Retrieve reviewer memory context (fail-open)
        run: |
          set +e

          _write_memory_fallback() {
            printf 'AI MEMORY CONTEXT\nstatus: unavailable\n' > "${MEMORY_CONTEXT_FILE}"
          }

          _pr_body_file=""

          if [ ! -s "${PR_META_FILE}" ]; then
            echo "::warning::PR metadata missing; writing fallback reviewer memory context"
            _write_memory_fallback
          else
            _pr_title="$(jq -r '((.title // "") | if test("\\S") then . else "" end)' "${PR_META_FILE}" 2>/dev/null || echo "")"
            _pr_body_has_text="$(jq -r '((.body // "") | test("\\S"))' "${PR_META_FILE}" 2>/dev/null || echo false)"
            if [ -z "${_pr_title}" ] && [ "${_pr_body_has_text}" != "true" ]; then
              echo "::notice::Reviewer memory retrieval skipped: PR title/body are empty."
              _write_memory_fallback
            elif [ -f "${SUPPORT_SCRIPTS_DIR}/memory_helpers.sh" ]; then
              _pr_body_file="$(mktemp)"
              if ! jq -r '.body // ""' "${PR_META_FILE}" > "${_pr_body_file}" 2>/dev/null; then
                : > "${_pr_body_file}"
              fi
              # shellcheck disable=SC1091
              if source "${SUPPORT_SCRIPTS_DIR}/memory_helpers.sh"; then
                if declare -F memory_bootstrap >/dev/null 2>&1; then
                  memory_bootstrap --require memory_retrieve
                fi
                if declare -F memory_retrieve >/dev/null 2>&1; then
                  memory_retrieve "${MEMORY_CONTEXT_FILE}" \
                    --role reviewer \
                    --pr-number "${PR_NUMBER}" \
                    --issue-title "${_pr_title}" \
                    --issue-body-file "${_pr_body_file}"
                else
                  echo "::warning::memory_retrieve helper unavailable; writing fallback reviewer memory context"
                  _write_memory_fallback
                fi
              else
                echo "::warning::failed to source memory helper script; writing fallback reviewer memory context"
                _write_memory_fallback
              fi
            else
              echo "::warning::memory helper script missing; writing fallback reviewer memory context"
              _write_memory_fallback
            fi
          fi

          if [ -n "${_pr_body_file}" ]; then
            rm -f "${_pr_body_file}"
          fi

          true

      - name: Collect PR check-run failures (CI/lint autofix context)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # Used by the in-flight filter below to exclude this workflow run's
          # own check-runs (most notably `review / codex-agent`, which is
          # `in_progress` while this step polls) from the wait count, so the
          # loop cannot self-wait until CHECK_RUNS_WAIT_TIMEOUT_SECS expires.
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 "${SUPPORT_SCRIPTS_DIR}/collect_pr_check_runs_context.py"

      # Restore the per-PR review-issue ledger + reviewer health state from the
      # previous autofix iteration before reviewers run. Both artifacts live
      # under .ai/, are gitignored, and persist across iterations only through
      # this cache pair. Missing cache is fail-open: iteration-scoping and
      # reviewer failback health both treat absence as first-run state.
      - name: Restore review-issue ledger
        # NOTE: this step runs BEFORE the `retrigger_guard` step (id below),
        # so `steps.retrigger_guard.outputs.*` is not yet populated here — the
        # former `max_iterations_reached != 'true'` guard was a no-op at this
        # point (always an empty string) and actionlint correctly rejected the
        # forward step reference. Gate only on the env signals that are already
        # set this early in the job.
        if: env.PR_CLOSED != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.workspace_state.outputs.workspace_path }}/.ai/review_issue_ledger/
            ${{ steps.workspace_state.outputs.workspace_path }}/.ai/review_runtime/
            ${{ steps.workspace_state.outputs.workspace_path }}/${{ env.REVIEW_LEDGER_PATH }}
          key: review-ledger-${{ github.repository }}-pr-${{ env.PR_NUMBER }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            review-ledger-${{ github.repository }}-pr-${{ env.PR_NUMBER }}-

      - name: Detect smoke test and tune LLM settings
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true
          PR_TITLE=$(jq -r '.title // ""' "${PR_PAYLOAD_FILE}")
          PR_BODY=$(jq -r '.body // ""' "${PR_PAYLOAD_FILE}")

          IS_SMOKE=false

          # Direct match on PR title/body
          if echo "${PR_TITLE}" | grep -qi '\[E2E Smoke Test\]' \
             || echo "${PR_BODY}" | grep -qi '\[E2E Smoke Test\]'; then
            IS_SMOKE=true
          fi

          # Check linked issue title. Only honour GitHub's closing-keyword
          # pattern (Closes/Fixes/Resolves + #N or issue URL, case-insensitive)
          # to avoid false-matching loose "issue #N" mentions inside log
          # citations or backticked fragments quoted in the PR body — which
          # would otherwise trigger phantom `gh api issues/<N>` 404s. The
          # implement and orchestrator workflows both emit closing keywords
          # when they create PRs, so this still resolves the linked issue
          # for every auto-generated smoke-test PR.
          # The URL alternative is restricted to the current repository so a
          # cross-repo "Closes <other-repo>/issues/N" reference cannot route
          # an unrelated number into this repo's issues lookup.
          if [ "$IS_SMOKE" = "false" ]; then
            ISSUE_NUM=$(echo "${PR_BODY}" | grep -oiPm1 '\b(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?):?\s+(?:https?://[^[:space:]]+/${{ github.repository }}/issues/|#)\K\d+\b' || true)
            if [ -n "${ISSUE_NUM:-}" ]; then
              ISSUE_TITLE=$(_safe_gh_jq "repos/${{ github.repository }}/issues/${ISSUE_NUM}" --jq '.title // ""' || echo "")
              if echo "${ISSUE_TITLE}" | grep -qi '\[E2E Smoke Test\]'; then
                IS_SMOKE=true
              fi
            fi
          fi

          if [ "$IS_SMOKE" = "true" ]; then
            # Reasoning overrides for smoke runs.
            # Reviewers are pinned to low; editor is pinned to medium.
            #
            # History of reasoning levels on smoke runs (editor). The runs
            # cited below predate the gpt-5.4 cutover and were observed on
            # the legacy editor default; the rationale (medium beats
            # extremes for execution-heavy editing tasks) still stands per
            # the gpt-5.4 prompt guide:
            #   low  → run 25254574828: OSCILLATION GUARD activated because the
            #           bait commit appeared in LAST_RUN_DIFF (since fixed at
            #           L2249-2260 to only walk [ai-autofix] commits — bait
            #           commits never match, so the guard no longer fires).
            #   xhigh → run 25249170035 / PR #1982: budget burns on tool calls +
            #           reasoning summaries, editor exits rc=0 with 0 file changes
            #           (6 attempts, all empty, ~81k tokens on attempt 1).
            #   none  → run 25305535590: the legacy editor default at reasoning=none runs one
            #           read tool call, exits cleanly rc=0 with empty stdout, and
            #           the in-step retry loop bails after MAX_ATTEMPTS with no
            #           edits (same failure mode as the conflict resolver at none,
            #           documented at the "Resolve merge conflicts" step below).
            #           Reviewer manifest validation then fails because the editor
            #           lists aggregate files instead of individual reviewer files.
            #   low   → run 25308327160 (gate run 25308071039): the legacy editor default at
            #           reasoning=low also exits rc=0 with empty stdout on all
            #           3 attempts per round (same failure mode as none — pattern
            #           extends across both none and low for this model+task).
            #           "low is sufficient" assumption was wrong.
            # medium is the only untried level; reviewers stay at low (all 6
            # succeeded on attempt 1 at low in run 25308327160). LAST_RUN_DIFF
            # already excludes bait commits so the oscillation guard cannot
            # fire regardless of editor reasoning level.
            # Non-smoke PRs continue to use the workflow defaults
            # (THINKING_LEVEL_REVIEWER / THINKING_LEVEL_EDITOR).
            echo "REVIEWER_REASONING_EFFORT=low" >> "$GITHUB_ENV"
            echo "EDITOR_REASONING_EFFORT=medium" >> "$GITHUB_ENV"
            # Patch the already-written Codex config so the reviewer phase
            # (which copies ~/.codex/config.toml into each reviewer's
            # isolated CODEX_HOME) picks up the low override. Without this
            # sed the reviewer codex config would still hold the medium value
            # baked in by the "Create Codex config" step that ran earlier.
            # The editor phase re-patches the config in "Switch reasoning effort
            # for editor" using EDITOR_REASONING_EFFORT=medium (set above).
            sed -i 's/^[[:space:]]*model_reasoning_effort[[:space:]]*=[[:space:]]*".*"/model_reasoning_effort = "low"/' ~/.codex/config.toml
            echo "🔬 Smoke test PR detected — reviewer reasoning=low, editor reasoning=medium (Phase 4b fix)"
            # Suppress per-phase Telegram alerts; the test-and-mark-stable
            # gate emits a single combined pass/fail notification at the
            # end via raw curl. SILENT > CRITICAL so all levels filter.
            echo "ALERT_MSG_LEVEL=SILENT" >> "$GITHUB_ENV"
            # Surface the smoke-test signal to scripts/review_apply_fixes.sh
            # so the editor prompt can append a short, explicit
            # "must call apply_patch on tests/e2e_smoke_canary.txt"
            # directive. The repeated empty-output failures (runs
            # 25305535590 / 25308327160 / 25310399716) all share the
            # signature: codex reads the file, decides the change is
            # trivial, and exits with 0-byte stdout because nothing in
            # the production prompt forces an apply_patch invocation
            # on a single-line removal. Only the smoke fixture sets this
            # env var; real PR autofixes never see the smoke override
            # and continue under the production prompt unchanged.
            echo "IS_SMOKE_TEST=true" >> "$GITHUB_ENV"
          else
            echo "Standard PR — using default LLM settings"
          fi

      - name: Use lightweight reviewer profile for no-PR claude-branch-review
        if: env.CLAUDE_BRANCH_REVIEW_MODE == 'true' && env.PR_NUMBER == ''
        run: |
          set -euo pipefail
          echo "ENABLE_REVIEWER_TWO_PASS=false" >> "$GITHUB_ENV"
          echo "REVIEWER_REASONING_EFFORT=low" >> "$GITHUB_ENV"
          mapfile -t reviewer_models < <(printf '%s\n' "${REVIEWER_MODELS:-}" | sed '/^$/d' | head -n 3)
          if [ "${#reviewer_models[@]}" -gt 0 ]; then
            {
              echo 'REVIEWER_MODELS<<__NO_PR_REVIEWER_MODELS__'
              printf '%s\n' "${reviewer_models[@]}"
              echo '__NO_PR_REVIEWER_MODELS__'
            } >> "$GITHUB_ENV"
          fi
          # Override the reviewer config written earlier by Create Codex
          # config. This step intentionally runs after the smoke-test
          # tuning block so no-PR claude/** comment-only reviews always use
          # the lightweight single-pass reviewer profile.
          sed -i 's/^[[:space:]]*model_reasoning_effort[[:space:]]*=[[:space:]]*".*"/model_reasoning_effort = "low"/' ~/.codex/config.toml
          echo "CLAUDE_BRANCH_REVIEW_LIGHT_PROFILE mode=no_pr reviewer_reasoning=low reviewer_two_pass=false reviewer_count=${#reviewer_models[@]}"

      - name: Checkout PR head branch
        run: |
          set -euo pipefail

          HEAD_REF="$(jq -r '.headRefName' "${PR_META_FILE}")"
          HEAD_REPO="$(jq -r '.headRepoFullName' "${PR_META_FILE}")"

          if [ -z "${HEAD_REF}" ] || [ "${HEAD_REF}" = "null" ]; then
            echo "Unable to determine PR head branch"
            exit 1
          fi

          if ! [[ "${HEAD_REF}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Rejecting PR head branch with unsupported characters: ${HEAD_REF}"
            echo "CAN_PUSH=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "${HEAD_REF}" =~ (^|/)__pycache__(/|$) ]] || [[ "${HEAD_REF}" =~ \.pyc$ ]] || [[ "${HEAD_REF}" == */.* ]] || [[ "${HEAD_REF}" == .* ]] || [[ "${HEAD_REF}" == */ ]] || [[ "${HEAD_REF}" == /* ]] || [[ "${HEAD_REF}" == *..* ]] || [[ "${HEAD_REF}" == *//* ]] || [[ "${HEAD_REF}" == *@{* ]]; then
            echo "Rejecting PR head branch due to disallowed branch pattern: ${HEAD_REF}"
            echo "CAN_PUSH=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "${HEAD_REPO}" != "${{ github.repository }}" ]; then
            echo "PR head repo (${HEAD_REPO}) is not writable from this workflow."
            echo "CAN_PUSH=false" >> "$GITHUB_ENV"
            exit 0
          fi

          bash "${SUPPORT_SCRIPTS_DIR}/git_ref_health_check.sh" repair

          CURRENT_BRANCH="$(git branch --show-current || true)"

          # Retry git fetch against transient github.com errors (5xx,
          # connection resets, DNS hiccups). A single ~minute-long
          # GitHub-side blip otherwise kills a 15-minute autofix run
          # with exit 128 (observed in run 25674867638, where two
          # consecutive HTTPS calls returned "remote: Internal Server
          # Error" / HTTP 500 within ~105s and the unguarded fetch
          # failed the whole job). Backoff follows the project standard
          # for git fetch/pull retries: 2s, 4s, 8s, 16s across 4
          # attempts. Same shape as the existing push-retry fetch loop
          # later in this file (search "fetch_attempt").
          fetch_attempt=1
          fetch_max_attempts=4
          fetch_backoff=2
          while true; do
            if git fetch --no-tags --prune origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"; then
              break
            fi
            if [ "${fetch_attempt}" -ge "${fetch_max_attempts}" ]; then
              echo "::error::git fetch origin refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF} failed after ${fetch_max_attempts} attempts; giving up."
              exit 1
            fi
            echo "::warning::git fetch origin refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF} failed (attempt ${fetch_attempt}/${fetch_max_attempts}); retrying in ${fetch_backoff}s."
            sleep "${fetch_backoff}"
            fetch_attempt=$((fetch_attempt + 1))
            fetch_backoff=$((fetch_backoff * 2))
          done

          if [ "${CURRENT_BRANCH}" = "${HEAD_REF}" ]; then
            git reset --hard "refs/remotes/origin/${HEAD_REF}"
          else
            # Use -f so the branch switch discards any runtime-local
            # modifications in the worktree, mirroring the `reset --hard`
            # in the sibling branch above. The "Initialize/Finalize
            # workspace contents" steps materialize the source tree into
            # this worktree and regenerate the gitignored-but-tracked
            # runtime artifact .ai/.workspace_source_manifest.txt. Without
            # -f, a plain `git checkout -B` aborts with "Your local changes
            # to the following files would be overwritten by checkout"
            # whenever the target branch's committed copy of that manifest
            # differs from the index's (e.g. a cross-base PR whose base is
            # `stable` while the worktree index is `main`). This step runs
            # before the editor touches the worktree, so the only local
            # changes here are regenerated runtime artifacts that are safe
            # to discard — landing cleanly on origin/${HEAD_REF} is exactly
            # the intent.
            git checkout -f -B "${HEAD_REF}" "refs/remotes/origin/${HEAD_REF}"
          fi

          echo "CAN_PUSH=true" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=${HEAD_REF}" >> "$GITHUB_ENV"
          # Capture the SHA reviewers/editor will operate against so the
          # mid-run stale-base gates (see probably_unnecessary_but_read_if_stuck.md §20.2) can detect an
          # external push that happens between here and "Push all pending
          # commits" ~30 minutes later.  Use the SHA AFTER the hard-reset
          # above (not github.event.pull_request.head.sha, which may be
          # stale if another run advanced the branch before this step ran).
          INITIAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "INITIAL_HEAD_SHA=${INITIAL_HEAD_SHA}" >> "$GITHUB_ENV"
          echo "Captured INITIAL_HEAD_SHA=${INITIAL_HEAD_SHA} for stale-base detection."

      - name: Detect preexisting Serena project config
        if: env.PR_CLOSED != 'true'
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch -- .serena/project.yml >/dev/null 2>&1 || [ -e .serena/project.yml ]; then
            echo "SERENA_PROJECT_PREEXISTED=true" >> "$GITHUB_ENV"
          else
            echo "SERENA_PROJECT_PREEXISTED=false" >> "$GITHUB_ENV"
          fi

      - name: "Preflight: Warn if protected paths are tracked in consumer repo"
        # Defensive check: in consumer repos, the workflow's runtime helpers
        # (known scripts/<helper> files, prompts/, .github/scripts/,
        # .github/prompts/, ai-memory/) should never be tracked — they are
        # fetched at runtime from coding-workflows. Consumer-owned scripts/**
        # are allowed and intentionally excluded from this warning.
        # If a prior buggy run leaked runtime helpers into the
        # consumer's history, every merge with the base branch will re-stage
        # them in the conflict-resolver step and trip the downstream guard.
        # We can't fix the leak from here, but we surface it immediately so
        # the operator can clean it up, instead of discovering it after the
        # full reviewer+editor cycle has already run.  This step NEVER fails
        # the job — it is purely informational.
        if: success() && env.CAN_PUSH == 'true' && env.IS_WORKFLOW_SOURCE_REPO != 'true'
        run: |
          set -euo pipefail

          leaked_paths="$(git ls-files -- \
            'scripts/gh_helpers.sh' 'scripts/git_ref_health_check.sh' \
            'scripts/render_prompt.sh' 'scripts/render_prompt.py' 'scripts/validate_changed_files_syntax.sh' \
            'scripts/tg_helpers.sh' 'scripts/label_helpers.sh' 'scripts/memory_helpers.sh' \
            'scripts/ai_memory.py' 'scripts/ai_memory_lib.py' 'scripts/openrouter_prompt_cache.py' \
            'scripts/codex_model_catalog.json' \
            'prompts/' '.github/scripts/' '.github/prompts/' 'ai-memory/' 2>/dev/null || true)"
          if [ -n "${leaked_paths}" ]; then
            leaked_count="$(printf '%s\n' "${leaked_paths}" | sed '/^$/d' | wc -l | tr -d ' ')"
            echo "::warning::Consumer repo tracks ${leaked_count} workflow runtime/helper artifact(s) (scripts/<known helper>, prompts/, .github/scripts/, .github/prompts/, or ai-memory/). Consumer-owned scripts under scripts/ are allowed; remove only leaked workflow artifacts (git rm -r --cached + commit) to prevent repeated merge friction on every merge with the base branch."
            echo "Tracked protected paths found on ${TARGET_BRANCH:-HEAD}:"
            printf '%s\n' "${leaked_paths}" | sed '/^$/d; s/^/ - /'
          else
            echo "No tracked workflow runtime/helper artifacts on ${TARGET_BRANCH:-HEAD}."
          fi

      - name: Count autofix iterations
        id: retrigger_guard
        env:
          MAX_AUTOFIX_ITERATIONS: ${{ vars.MAX_AUTOFIX_ITERATIONS || '5' }}
          FORCE_RB_JUDGE: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.force_rb_judge == 'true') || (github.event_name != 'workflow_dispatch' && inputs.force_rb_judge)) && 'true' || 'false' }}
          # Orchestrator PR autofix flow (see README §"Orchestrator PR autofix flow"):
          # When enabled, classify the PR by base/head branch for orchestrator-
          # side observability and the orch_final cap bypass:
          #   - orch_intermediate (sub-issue PR → orchestrator/project-*):
          #       inner loop matches the legacy default (MAX_AUTOFIX_ITERATIONS,
          #       judge runs after exhaustion). Catches blocking issues per
          #       sub-issue PR instead of letting them accumulate and surface
          #       en masse on the integration→default-branch final merge.
          #   - orch_final (orchestrator/project-* → any non-orch base, i.e.
          #       the default branch): same inner loop as legacy default; the
          #       orchestrate_poll_process.sh judge-cycle cap is bypassed for
          #       this phase, giving unlimited 5-autofix→judge cycles until
          #       the PR is mergeable.
          #   - other (non-orchestrator PR): unchanged legacy behavior.
          # Setting ORCH_PR_AUTOFIX_FLOW_ENABLED=false forces orch_pr_mode to
          # stay at "other" (the classifier never inspects head/base) and
          # disables the orchestrator-side cap bypass; per-PR autofix loops
          # are unaffected (they already use MAX_AUTOFIX_ITERATIONS in every
          # mode).
          ORCH_PR_AUTOFIX_FLOW_ENABLED: ${{ vars.ORCH_PR_AUTOFIX_FLOW_ENABLED || 'true' }}
          ORCH_INTEGRATION_BRANCH_PATTERN: ${{ vars.ORCH_INTEGRATION_BRANCH_PATTERN || '^orchestrator/project-' }}
        run: |
          set -euo pipefail

          # ----- Orchestrator PR mode classification -----
          orch_pr_mode="other"
          if [ "${ORCH_PR_AUTOFIX_FLOW_ENABLED}" = "true" ]; then
            _head_ref_class=""
            _base_ref_class=""
            if [ -f "${PR_META_FILE}" ]; then
              _head_ref_class="$(jq -r '.headRefName // ""' "${PR_META_FILE}" 2>/dev/null || echo "")"
              _base_ref_class="$(jq -r '.baseRefName // ""' "${PR_META_FILE}" 2>/dev/null || echo "")"
            fi
            # Pre-validate ORCH_INTEGRATION_BRANCH_PATTERN before classifying:
            #   - Empty pattern would match every ref (`grep -Eq -- ""` matches
            #     everything), misclassifying every PR as orch_intermediate or
            #     orch_final.
            #   - Invalid POSIX ERE makes `grep -Eq` exit with status 2 rather
            #     than 1; if a misconfigured regex slipped past code review,
            #     every classifier call would log a noisy regex error.
            # Both cases fall open to orch_pr_mode=other (legacy behavior) with
            # one ::warning:: log line, so a misconfigured repo var cannot
            # brick `review_autofix` runs for non-orchestrator PRs.
            _pattern_ok="true"
            if [ -z "${ORCH_INTEGRATION_BRANCH_PATTERN}" ]; then
              echo "::warning::ORCH_INTEGRATION_BRANCH_PATTERN is empty; falling back to orch_pr_mode=other for this run."
              _pattern_ok="false"
            else
              _pattern_check_exit=0
              printf 'x\n' | grep -Eq -- "${ORCH_INTEGRATION_BRANCH_PATTERN}" >/dev/null 2>&1 || _pattern_check_exit=$?
              if [ "${_pattern_check_exit}" -ge 2 ]; then
                echo "::warning::ORCH_INTEGRATION_BRANCH_PATTERN is not a valid POSIX ERE (grep exit ${_pattern_check_exit}); falling back to orch_pr_mode=other for this run."
                _pattern_ok="false"
              fi
            fi
            # Use `printf` + `grep -Eq --` so a repo-configured pattern that
            # happens to start with `-` (e.g. `-orchestrator/...`) is parsed
            # as the regex argument and not as a grep option / echo flag.
            if [ "${_pattern_ok}" = "true" ] && [ -n "${_head_ref_class}" ] && printf '%s\n' "${_head_ref_class}" | grep -Eq -- "${ORCH_INTEGRATION_BRANCH_PATTERN}"; then
              if [ -n "${_base_ref_class}" ] && printf '%s\n' "${_base_ref_class}" | grep -Eq -- "${ORCH_INTEGRATION_BRANCH_PATTERN}"; then
                orch_pr_mode="orch_intermediate"
              else
                orch_pr_mode="orch_final"
              fi
            fi
          fi
          echo "Orchestrator PR mode: ${orch_pr_mode} (head='${_head_ref_class:-?}' base='${_base_ref_class:-?}', flow_enabled=${ORCH_PR_AUTOFIX_FLOW_ENABLED})"
          echo "orch_pr_mode=${orch_pr_mode}" >> "$GITHUB_OUTPUT"

          # All modes use MAX_AUTOFIX_ITERATIONS (default 5).  The
          # former orch_intermediate cap of 1 was removed: catching blocking
          # issues per sub-issue PR (where the diff is small and the linked-
          # issue context is narrow) is cheaper and more reliable than
          # front-loading the entire review burden onto the final integration
          # → default-branch merge.
          effective_max_iterations="${MAX_AUTOFIX_ITERATIONS}"

          # Pre-walk shallow safeguard: the codex-agent's "Checkout repo"
          # step uses fetch-depth: 100 to cap clone size on history-heavy
          # consumer repos.  Both the [ai-autofix] walk below and the
          # [judge-fix] walk further down expect to see all PR-unique
          # history.  Depth 100 is enough for any realistic PR, but on
          # the off chance a PR has accumulated >100 commits (e.g. a
          # long-running orchestrator integration PR) we deepen by a
          # bounded amount once before walking so the counts are not
          # silently truncated.
          #
          # Explicit refspec on TARGET_BRANCH (the PR head ref): without
          # one, `git fetch ... origin` would defer to the default
          # `remote.origin.fetch = +refs/heads/*:refs/remotes/origin/*`
          # and pull every remote branch, undoing the whole point of
          # fetch-depth: 100.  The walks only need HEAD's first-parent
          # history, which lives on TARGET_BRANCH.
          #
          # No-op when the repo is already a full clone, when
          # TARGET_BRANCH is unset (Checkout PR head branch hit its
          # validation early-exit), or when the deepen fetch fails
          # (fail-open: counts may be undercounted but the workflow
          # proceeds).
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            if [ -n "${TARGET_BRANCH:-}" ]; then
              echo "Shallow repository detected — deepening TARGET_BRANCH=${TARGET_BRANCH} once (+200) so autofix/judge-fix walks see PR-unique history beyond the initial fetch-depth boundary."
              if ! git fetch --no-tags --prune --deepen=200 origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" 2>/dev/null; then
                echo "::warning::git fetch --deepen=200 origin refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH} failed before autofix/judge-fix walks; walk counts may be undercounted on PRs with >100 commits."
              fi
            else
              echo "::warning::TARGET_BRANCH unset (Checkout PR head branch likely early-exited); skipping pre-walk deepen safeguard. Walk counts may be undercounted on PRs with >100 commits."
            fi
          fi

          # Count consecutive [ai-autofix] commits from HEAD backwards.
          autofix_count=0
          while true; do
            msg="$(git log -1 --format='%s' "HEAD~${autofix_count}" 2>/dev/null || true)"
            if echo "${msg}" | grep -q '^\[ai-autofix\]'; then
              autofix_count=$((autofix_count + 1))
            else
              break
            fi
          done

          echo "Consecutive autofix commits: ${autofix_count} (max: ${effective_max_iterations})"
          echo "autofix_iteration=${autofix_count}" >> "$GITHUB_OUTPUT"

          # skip_judge is retained as a step output for backward compat with
          # downstream gate expressions (e.g. the rb_judge step's
          # `steps.retrigger_guard.outputs.skip_judge != 'true'` guard) but
          # is now always emitted as `false` — the orch_intermediate
          # short-circuit was removed so every mode runs the per-PR judge
          # after autofix exhaustion.  The force_rb_judge stall-recovery
          # escape hatch (dispatched by the orchestrator stall poller via
          # review_rb_judge_dispatch.yml) is unaffected; FORCE_RB_JUDGE=true
          # still forces max_iterations_reached=true below so the rb_judge
          # step fires directly.
          echo "skip_judge=false" >> "$GITHUB_OUTPUT"

          # force_rb_judge short-circuit: the stall poller dispatches the
          # review workflow with this input set when a linked issue has
          # been stuck at ai:review-blocked past the stall threshold.
          # Force max_iterations_reached=true so the reviewer/editor/
          # commit steps (all gated on max_iterations_reached != 'true')
          # are skipped and the rb_judge step fires directly against the
          # existing PR state.
          if [ "${FORCE_RB_JUDGE}" = "true" ]; then
            echo "force_rb_judge=true — forcing max_iterations_reached=true to run only the review-blocked judge."
            echo "max_iterations_reached=true" >> "$GITHUB_OUTPUT"
          elif [ "${autofix_count}" -ge "${effective_max_iterations}" ]; then
            echo "Max autofix iterations reached — skipping review/editor."
            echo "max_iterations_reached=true" >> "$GITHUB_OUTPUT"
          else
            echo "max_iterations_reached=false" >> "$GITHUB_OUTPUT"
          fi

          # Count [judge-fix] commits in the branch history for retry tracking.
          judge_fix_count=0
          while IFS= read -r line; do
            if echo "${line}" | grep -q '^\[judge-fix\]'; then
              judge_fix_count=$((judge_fix_count + 1))
            fi
          done < <(git log --format='%s' 2>/dev/null || true)
          echo "Judge-fix commits in history: ${judge_fix_count}"
          echo "judge_fix_count=${judge_fix_count}" >> "$GITHUB_OUTPUT"

      - name: Log reviewer reasoning effort
        if: steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true'
        run: |
          set -euo pipefail
          echo "Reviewer reasoning effort: ${REVIEWER_REASONING_EFFORT:-xhigh}"

      - name: Generate diff context
        if: steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true'
        run: |
          set -euo pipefail

          echo "Generating reviewer diff context"
          bash "${SUPPORT_SCRIPTS_DIR}/git_ref_health_check.sh" repair

          # Helper: ensure the merge-base between HEAD and origin/<base>
          # is reachable in the local (possibly shallow) clone.
          # `git diff origin/<base>...HEAD` and the merge precheck both
          # need this merge-base; on a shallow clone (codex-agent uses
          # fetch-depth: 100) it may sit below the boundary for long-
          # running PRs.  Deepens iteratively, falling back to
          # --unshallow as a last resort.  Fail-open: callers that need
          # the merge-base check `git rev-parse --verify origin/<base>`
          # themselves and degrade gracefully.
          #
          # Refspec discipline: every `git fetch` here passes explicit
          # refspecs limited to BASE_BRANCH + (when known) TARGET_BRANCH.
          # Without them, `git fetch ... origin` defers to the default
          # `remote.origin.fetch = +refs/heads/*:refs/remotes/origin/*`
          # and would pull every remote branch on each deepen call —
          # undoing the fetch-depth: 100 budget this PR is trying to
          # enforce.  Either side of the merge-base reaching its full
          # ancestor is sufficient for git merge-base to resolve, so
          # deepening just these two refs is enough.
          _ensure_merge_base_reachable() {
            local _remote_ref="$1"
            local _local_ref="${2:-HEAD}"
            local _iter=0
            local -a _refspecs=("refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}")
            if [ -n "${TARGET_BRANCH:-}" ]; then
              _refspecs+=("refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}")
            fi
            while [ "${_iter}" -lt 4 ]; do
              if [ ! -f "$(git rev-parse --git-dir)/shallow" ]; then
                return 0
              fi
              if git merge-base "${_remote_ref}" "${_local_ref}" >/dev/null 2>&1; then
                return 0
              fi
              _iter=$((_iter + 1))
              echo "merge-base ${_remote_ref}…${_local_ref} unreachable in shallow clone — deepening (attempt ${_iter}/4) on refs: ${_refspecs[*]}."
              if ! git fetch --no-tags --prune --deepen=200 origin "${_refspecs[@]}" 2>/dev/null; then
                echo "::warning::git fetch --deepen=200 origin ${_refspecs[*]} failed during deepen-on-miss; falling back to --unshallow on the same refs."
                git fetch --no-tags --prune --unshallow origin "${_refspecs[@]}" 2>/dev/null || true
                return 0
              fi
            done
            if ! git merge-base "${_remote_ref}" "${_local_ref}" >/dev/null 2>&1; then
              echo "::warning::merge-base ${_remote_ref}…${_local_ref} still unreachable after 4 deepen attempts; trying final --unshallow on refs: ${_refspecs[*]}."
              git fetch --no-tags --prune --unshallow origin "${_refspecs[@]}" 2>/dev/null || true
            fi
          }

          PR_DIFF_ATTEMPTED_PATHS="${PR_DIFF_ATTEMPTED_PATHS:-gh_pr_diff:${PR_DIFF_FILE}}"
          if [ ! -s "${PR_DIFF_FILE}" ]; then
            echo "Primary gh pr diff output is empty. Attempting git fallback diff generation."
            PR_DIFF_ATTEMPTED_PATHS="${PR_DIFF_ATTEMPTED_PATHS};git_diff_origin_base_head:${PR_DIFF_FILE}"
            if ! git fetch --no-tags --prune origin "refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"; then
              echo "Warning: git fetch origin ${BASE_BRANCH} failed in fallback path; fallback git diff requires an existing origin/${BASE_BRANCH} ref."
            fi
            if git rev-parse --verify "origin/${BASE_BRANCH}" >/dev/null 2>&1; then
              _ensure_merge_base_reachable "origin/${BASE_BRANCH}" "HEAD"
              git diff "origin/${BASE_BRANCH}...HEAD" > "${PR_DIFF_FILE}" || true
            else
              echo "Warning: origin/${BASE_BRANCH} is unavailable in fallback path; skipping fallback git diff generation."
              : > "${PR_DIFF_FILE}"
            fi
          fi

          if [ ! -s "${PR_DIFF_FILE}" ]; then
            echo "Both primary and fallback diff generation produced empty output. Writing placeholder diff context."
            printf '%s\n' "[NO_PR_DIFF_AVAILABLE] Unable to generate PR patch content from both gh pr diff and git diff origin/<base>...HEAD for this run." > "${PR_DIFF_FILE}"
            echo "HAS_PR_DIFF=false" >> "$GITHUB_ENV"
            echo "PR_DIFF_SOURCE=placeholder_no_diff_available" >> "$GITHUB_ENV"
          else
            if [ "${PR_DIFF_SOURCE:-gh_pr_diff_empty}" = "gh_pr_diff_empty" ]; then
              echo "PR_DIFF_SOURCE=git_fallback_origin_base_head" >> "$GITHUB_ENV"
            fi
            echo "HAS_PR_DIFF=true" >> "$GITHUB_ENV"
          fi
          echo "PR_DIFF_ATTEMPTED_PATHS=${PR_DIFF_ATTEMPTED_PATHS}" >> "$GITHUB_ENV"

          cp "${PR_DIFF_FILE}" "${ORIGINAL_PR_DIFF_FILE}"

          pr_diff_bytes="$(wc -c < "${PR_DIFF_FILE}" | tr -d '[:space:]')"
          original_pr_diff_bytes="$(wc -c < "${ORIGINAL_PR_DIFF_FILE}" | tr -d '[:space:]')"
          echo "Final PR diff bytes (${PR_DIFF_FILE}): ${pr_diff_bytes}"
          echo "Final PR diff bytes (${ORIGINAL_PR_DIFF_FILE}): ${original_pr_diff_bytes}"
          echo "Final PR diff sha256 (${PR_DIFF_FILE}): $(sha256sum "${PR_DIFF_FILE}" | awk '{print $1}')"
          echo "Final PR diff sha256 (${ORIGINAL_PR_DIFF_FILE}): $(sha256sum "${ORIGINAL_PR_DIFF_FILE}" | awk '{print $1}')"
          echo "Final PR diff preview (${PR_DIFF_FILE}) suppressed in logs for security."

          if ! git fetch --no-tags --prune origin "refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"; then
            echo "Warning: git fetch origin ${BASE_BRANCH} failed before changed-files generation; continuing with current refs."
          fi

          if git rev-parse --verify "origin/${BASE_BRANCH}" >/dev/null 2>&1; then
            _ensure_merge_base_reachable "origin/${BASE_BRANCH}" "HEAD"
            git diff --name-only "origin/${BASE_BRANCH}...HEAD" > "${PR_CHANGED_FILES_FILE}" || true
          else
            echo "Warning: origin/${BASE_BRANCH} is unavailable; writing empty changed-files list."
            : > "${PR_CHANGED_FILES_FILE}"
          fi
          git show --stat HEAD > "${LAST_COMMIT_STAT_FILE}" || true

          # LAST_RUN_DIFF must reflect actual prior AI autofix work on PR head,
          # not whatever HEAD~1 happens to be. The downstream OSCILLATION GUARD
          # in the editor prompt (scripts/review_apply_fixes.sh:441-462) tells
          # the model to leave any hunk visible in LAST_RUN_DIFF alone unless
          # it can attach a "regression fingerprint" + "runtime failure path".
          # The previous unconditional `git diff HEAD~1...HEAD` fed the editor
          # the diff of impl commits, smoke-test bait commits, and manual
          # pushes — falsely tripping the guardrail on first-iteration runs.
          # Smoke run 25254574828 hit this: bait commit was at HEAD,
          # last_run_diff showed the bait line, OSCILLATION GUARD activated,
          # editor produced empty output across 6 attempts (3 + 3 retry) at
          # reasoning=low → Phase 4b bait-removed verification failed.
          # Walk back recent commits and only use the diff of the most recent
          # `[ai-autofix]`/`[judge-fix]` commit on the PR head's first-parent
          # chain, matching the iteration counter at line 2096-2105 and the
          # in-step retry gate further down in this file (see the
          # `_prior_autofix_count` block in the `Apply fixes with editor model`
          # step). `--first-parent` is load-bearing: without it, `git log`
          # walks merged-in history and could pick up an unrelated autofix
          # commit from base (e.g. a `[ai-autofix]` commit on `main` pulled
          # in by a merge), polluting LAST_RUN_DIFF on a first-iteration PR.
          LAST_AUTOFIX_SHA="$(git log --first-parent --format='%H%x09%s' -n 50 2>/dev/null \
            | awk -F'\t' '$2 ~ /^\[(ai-autofix|judge-fix)\]/ { print $1; exit }' \
            || true)"
          if [ -n "${LAST_AUTOFIX_SHA}" ] && git rev-parse "${LAST_AUTOFIX_SHA}^" >/dev/null 2>&1; then
            git diff "${LAST_AUTOFIX_SHA}^...${LAST_AUTOFIX_SHA}" > "${LAST_RUN_DIFF_FILE}" || true
            git diff --name-only "${LAST_AUTOFIX_SHA}^...${LAST_AUTOFIX_SHA}" > "${LAST_RUN_CHANGED_FILES_FILE}" || true
            git diff --stat "${LAST_AUTOFIX_SHA}^...${LAST_AUTOFIX_SHA}" > "${LAST_RUN_DIFF_STAT_FILE}" || true
          else
            echo "No previous AI autofix run on PR head" > "${LAST_RUN_DIFF_FILE}"
            echo "No previous AI autofix run on PR head" > "${LAST_RUN_CHANGED_FILES_FILE}"
            echo "FIRST_RUN_NO_PREVIOUS_AI_CHANGES" > "${LAST_RUN_DIFF_STAT_FILE}"
          fi

      - name: Collect local slop-scan findings
        continue-on-error: true
        run: |
          set -euo pipefail

          write_slop_scan_sentinel() {
            local status="$1"
            cat > "${SLOP_SCAN_FINDINGS_FILE}" <<EOF
          {
            "schema_version": 1,
            "collection_status": "${status}",
            "scanned_files": [],
            "findings": [],
            "suppressed_findings": []
          }
          EOF
          }

          mkdir -p "$(dirname "${SLOP_SCAN_FINDINGS_FILE}")"

          case "$(printf '%s' "${SLOP_SCAN_ENABLED:-true}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
            1|true|yes|on)
              ;;
            *)
              write_slop_scan_sentinel "disabled"
              exit 0
              ;;
          esac

          slop_scan_script=""
          for candidate in \
            "${GITHUB_WORKSPACE}/.codex-workflow-src/scripts/slop_scan_local.py" \
            "${GITHUB_WORKSPACE}/.codex-workflow-src-main/scripts/slop_scan_local.py" \
            "${GITHUB_WORKSPACE}/scripts/slop_scan_local.py"
          do
            if [ -f "${candidate}" ]; then
              slop_scan_script="${candidate}"
              break
            fi
          done

          if [ -z "${slop_scan_script}" ]; then
            echo "::warning::slop_scan_local.py was not available in the workflow support checkout; continuing without slop-scan findings."
            write_slop_scan_sentinel "scan_error"
            exit 0
          fi

          if ! PYTHONDONTWRITEBYTECODE=1 python3 "${slop_scan_script}" \
            --changed-files "${PR_CHANGED_FILES_FILE}" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --output "${SLOP_SCAN_FINDINGS_FILE}"; then
            echo "::warning::slop_scan_local.py failed; continuing without blocking review."
            write_slop_scan_sentinel "scan_error"
            exit 0
          fi

          if [ ! -s "${SLOP_SCAN_FINDINGS_FILE}" ]; then
            echo "::warning::slop_scan_local.py wrote no findings artifact; continuing without blocking review."
            write_slop_scan_sentinel "scan_error"
          fi

      - name: Generate symbol-level diff summary
        run: |
          set -euo pipefail
          SYMBOL_DIFF_SUMMARY_FILE="${RUNTIME_DIR}/symbol_diff_summary.txt"
          echo "SYMBOL_DIFF_SUMMARY_FILE=${SYMBOL_DIFF_SUMMARY_FILE}" >> "$GITHUB_ENV"

          if [ -s "${PR_DIFF_FILE}" ] || [ -s "${PR_CHANGED_FILES_FILE}" ]; then
            PYTHONDONTWRITEBYTECODE=1 python3 "${SUPPORT_SCRIPTS_DIR}/generate_symbol_diff_summary.py" \
              --diff-file "${PR_DIFF_FILE}" \
              --changed-files "${PR_CHANGED_FILES_FILE}" \
              --output "${SYMBOL_DIFF_SUMMARY_FILE}" \
              --project-dir "." || {
                echo "::warning::Symbol diff summary generation failed; continuing without it."
                echo "Symbol diff summary unavailable." > "${SYMBOL_DIFF_SUMMARY_FILE}"
              }
          else
            echo "No diff available for symbol summary." > "${SYMBOL_DIFF_SUMMARY_FILE}"
          fi

      - name: Capture runtime context
        if: always()
        run: |
          set -euo pipefail

          # Early guard: if the Create runtime workspace step never ran
          # (e.g. a prior step failed before RUNTIME_CONTEXT_DIR was
          # written to $GITHUB_ENV), this step would otherwise fail with
          # "unbound variable" under set -u and mask the real root-cause
          # error in the failure notification step.  Skip cleanly so the
          # job's failure reason stays pinned to the actual first failure.
          if [ -z "${RUNTIME_CONTEXT_DIR:-}" ]; then
            echo "::warning::RUNTIME_CONTEXT_DIR not set; runtime workspace step did not complete. Skipping runtime context capture."
            exit 0
          fi

          mkdir -p "${RUNTIME_CONTEXT_DIR}"

          git status --short --branch > "${RUNTIME_CONTEXT_DIR}/git_status.txt" || true
          git diff --stat > "${RUNTIME_CONTEXT_DIR}/git_diff_stat.txt" || true
          ls -R . | sed -n "1,400p" > "${RUNTIME_CONTEXT_DIR}/shallow_tree.txt" || true
          {
            for key in \
              CI \
              GITHUB_ACTION \
              GITHUB_ACTIONS \
              GITHUB_ACTOR \
              GITHUB_ACTOR_ID \
              GITHUB_API_URL \
              GITHUB_BASE_REF \
              GITHUB_ENV \
              GITHUB_EVENT_NAME \
              GITHUB_EVENT_PATH \
              GITHUB_GRAPHQL_URL \
              GITHUB_HEAD_REF \
              GITHUB_JOB \
              GITHUB_OUTPUT \
              GITHUB_PATH \
              GITHUB_REF \
              GITHUB_REF_NAME \
              GITHUB_REF_PROTECTED \
              GITHUB_REF_TYPE \
              GITHUB_REPOSITORY \
              GITHUB_REPOSITORY_ID \
              GITHUB_REPOSITORY_OWNER \
              GITHUB_REPOSITORY_OWNER_ID \
              GITHUB_RETENTION_DAYS \
              GITHUB_RUN_ATTEMPT \
              GITHUB_RUN_ID \
              GITHUB_RUN_NUMBER \
              GITHUB_SERVER_URL \
              GITHUB_SHA \
              GITHUB_STEP_SUMMARY \
              GITHUB_TRIGGERING_ACTOR \
              GITHUB_WORKFLOW \
              GITHUB_WORKFLOW_REF \
              GITHUB_WORKFLOW_SHA \
              GITHUB_WORKSPACE \
              HOME \
              LANG \
              LC_ALL \
              PATH \
              PWD \
              RUNNER_ARCH \
              RUNNER_NAME \
              RUNNER_OS \
              RUNNER_TEMP \
              RUNNER_TOOL_CACHE \
              RUNNER_WORKSPACE \
              SHELL \
              SHLVL \
              TZ \
              USER; do
              if [ "${!key+x}" = "x" ]; then
                printf '%s=%s\n' "${key}" "${!key}"
              fi
            done
          } | sort > "${RUNTIME_CONTEXT_DIR}/environment_sorted.txt" || true
          git log --oneline -n 20 > "${RUNTIME_CONTEXT_DIR}/recent_commits.txt" || true
          git branch -a > "${RUNTIME_CONTEXT_DIR}/branches.txt" || true
          cp .github/workflows/review_autofix.yml "${RUNTIME_CONTEXT_DIR}/workflow_snapshot.yml" || true
          {
            [ -d "${HOME}/.npm/_logs" ] && ls -1 "${HOME}/.npm/_logs" | tail -n 5 || true
            [ -f "${GITHUB_STEP_SUMMARY:-}" ] && cat "${GITHUB_STEP_SUMMARY}" || true
          } > "${RUNTIME_CONTEXT_DIR}/run_logs_best_effort.txt" || true

      - name: "Preflight: Verify required files before reviewer invocation"
        if: steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true'
        run: |
          set -euo pipefail

          abs_path() {
            local p="$1"
            if [ -z "${p}" ]; then
              p="."
            fi
            if [[ "${p}" = /* ]]; then
              realpath -m "${p}"
            else
              realpath -m "$(pwd)/${p}"
            fi
          }

          declare -a missing=()

          check_required_dir() {
            local path="$1"
            local abs
            abs="$(abs_path "${path}")"
            if [ ! -d "${path}" ]; then
              echo "MISSING: ${abs}"
              missing+=("${abs}")
            fi
          }

          check_required_file() {
            local path="$1"
            local abs
            abs="$(abs_path "${path}")"
            if [ ! -f "${path}" ]; then
              echo "MISSING: ${abs}"
              missing+=("${abs}")
            fi
          }

          check_required_nonempty_file() {
            local path="$1"
            local abs
            abs="$(abs_path "${path}")"
            if [ ! -s "${path}" ]; then
              echo "MISSING_OR_EMPTY: ${abs}"
              missing+=("${abs} (missing or empty)")
            fi
          }

          check_soft_file() {
            local path="$1"
            local abs
            abs="$(abs_path "${path}")"
            if [ ! -f "${path}" ]; then
              echo "::warning::SOFT_MISSING: ${abs}"
            fi
          }

          check_required_dir "${RUNTIME_DIR}"
          check_required_dir "${PREVIOUS_REVIEWS_DIR}"
          check_required_dir "${RUNTIME_CONTEXT_DIR}"
          check_required_dir "${SUPPORT_SCRIPTS_DIR}"
          check_required_dir "${SUPPORT_PROMPTS_DIR}"

          check_required_file "${SUPPORT_SCRIPTS_DIR}/codex_helpers.sh"
          check_required_file "${SUPPORT_SCRIPTS_DIR}/codex_stall_guard.sh"
          check_required_file "${SUPPORT_SCRIPTS_DIR}/watchdog_helpers.sh"
          check_required_file "${SUPPORT_SCRIPTS_DIR}/review_run_reviewers.sh"
          check_required_file "${SUPPORT_SCRIPTS_DIR}/render_prompt.sh"
          check_required_file "${SUPPORT_SCRIPTS_DIR}/assemble_prompt.sh"
          check_soft_file "${SUPPORT_SCRIPTS_DIR}/render_prompt.py"
          check_required_nonempty_file "${SUPPORT_INSTRUCTIONS_FILE}"
          check_required_file "./pre_assembled_static.txt"
          check_required_file "${PR_DIFF_FILE}"
          check_required_file "${ORIGINAL_PR_DIFF_FILE}"
          check_required_file "${PR_CHANGED_FILES_FILE}"
          check_required_file "${PR_ALL_COMMENTS_CONTEXT_FILE}"
          check_required_file "${PR_CHECK_RUNS_CONTEXT_FILE}"
          check_required_file "${SYMBOL_DIFF_SUMMARY_FILE}"
          check_required_file "${MEMORY_CONTEXT_FILE}"
          check_required_file "${HOME}/.codex/config.toml"

          if ! codex_bin="$(command -v codex 2>/dev/null)"; then
            codex_missing_message="codex binary (not found in PATH)"
            echo "MISSING: ${codex_missing_message}"
            missing+=("${codex_missing_message}")
          else
            echo "Found codex binary: ${codex_bin}"
          fi

          check_soft_file "${SUPPORT_CODEX_INSTRUCTIONS_FILE}"
          check_soft_file "${SUPPORT_AGENTS_FILE}"
          check_soft_file "${SUPPORT_PROMPTS_DIR}/mode-judge-review-blocked.txt"
          check_soft_file "${SUPPORT_PROMPTS_DIR}/mode-judge-interim.txt"
          check_soft_file "${SUPPORT_PROMPTS_DIR}/behavioural-smoke-synthesise.txt"
          check_soft_file "${SUPPORT_PROMPTS_DIR}/conflict-resolver.txt"
          case "$(printf '%s' "${REVIEW_REVIEWER_CHECKLIST_ENABLED:-0}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on) check_soft_file "${SUPPORT_PROMPTS_DIR}/review-reviewer-checklist.txt" ;;
          esac
          case "$(printf '%s' "${REVIEWER_FILTER_UNINTERESTING_ENABLED:-0}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on) check_soft_file "${SUPPORT_SCRIPTS_DIR}/review_filter_uninteresting_files.sh" ;;
          esac
          case "$(printf '%s' "${AGENTS_MD_MATERIALITY_ENABLED:-0}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on) check_soft_file "${SUPPORT_SCRIPTS_DIR}/review_agents_md_materiality.sh" ;;
          esac
          case "$(printf '%s' "${REVIEWER_CIRCUIT_BREAKER_ENABLED:-0}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on) check_soft_file "${SUPPORT_SCRIPTS_DIR}/reviewer_failback_chains.json" ;;
          esac
          check_soft_file "${SUPPORT_SCRIPTS_DIR}/codex_model_catalog.json"
          check_soft_file "${SUPPORT_SCRIPTS_DIR}/install_semble.sh"
          check_soft_file "${SUPPORT_SCRIPTS_DIR}/semble_helpers.sh"
          check_soft_file "${LAST_RUN_DIFF_FILE}"
          check_soft_file "${LAST_RUN_CHANGED_FILES_FILE}"
          check_soft_file "${LAST_RUN_DIFF_STAT_FILE}"
          check_soft_file "${LAST_COMMIT_STAT_FILE}"

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Preflight check FAILED: ${#missing[@]} required file(s) missing:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "Preflight check PASSED: all required files present."

      - name: Show disk usage (pre LLM call)
        if: steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true'
        run: df -h /

      - name: Pre-review deterministic merge-topology gate
        # Fail open on ambiguous git/API errors so reviewer/editor work is only
        # skipped for deterministic stale-base or structurally unmergeable PRs.
        # Ordinary content conflicts continue to the existing late
        # Detect merge conflicts + resolver path below.
        if: steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTOFIX_BOT_LOGIN: ${{ vars.AUTOFIX_BOT_LOGIN }}
          LOCAL_HEAD_SHA: ${{ env.INITIAL_HEAD_SHA }}
        run: |
          set -euo pipefail

          if [ ! -x "${SUPPORT_SCRIPTS_DIR}/check_external_branch_advance.sh" ]; then
            echo "::warning::check_external_branch_advance.sh missing from support scripts; fail-open (skipping pre-review stale-base gate)."
          else
            advance_out="$(bash "${SUPPORT_SCRIPTS_DIR}/check_external_branch_advance.sh" || printf 'ADVANCE=unknown\n')"
            advance_val="$(printf '%s\n' "${advance_out}" | grep -E '^ADVANCE=' | tail -n 1 | cut -d= -f2 || true)"
            advance_val="${advance_val:-unknown}"
            case "${advance_val}" in
              external)
                echo "AUTOFIX_PRE_REVIEW_STALE_BASE pr=${PR_NUMBER} local_sha=${LOCAL_HEAD_SHA} target_branch=${TARGET_BRANCH} action=soft_exit"
                echo "AUTOFIX_STALE_BASE_SKIP=true" >> "$GITHUB_ENV"
                exit 0
                ;;
              self_only)
                echo "AUTOFIX_PRE_REVIEW_SELF_ADVANCE pr=${PR_NUMBER} local_sha=${LOCAL_HEAD_SHA} target_branch=${TARGET_BRANCH} action=continue"
                ;;
              none)
                echo "AUTOFIX_PRE_REVIEW_BASE_FRESH pr=${PR_NUMBER} local_sha=${LOCAL_HEAD_SHA} target_branch=${TARGET_BRANCH}"
                ;;
              *)
                echo "AUTOFIX_PRE_REVIEW_UNKNOWN pr=${PR_NUMBER} local_sha=${LOCAL_HEAD_SHA} target_branch=${TARGET_BRANCH} action=fail_open"
                ;;
            esac
          fi

          if [ ! -x "${SUPPORT_SCRIPTS_DIR}/git_ref_health_check.sh" ]; then
            echo "::warning::git_ref_health_check.sh missing from support scripts; fail-open (skipping pre-review merge-topology probe)."
            exit 0
          fi

          # Mirror the late merge-precheck cleanup so runtime-fetched helper
          # files cannot trip an exit-128 pre-merge abort before reviewers run.
          rm -f scripts/ai_memory.py scripts/ai_memory_lib.py scripts/memory_helpers.sh scripts/openrouter_prompt_cache.py scripts/cost_audit.py scripts/codex_heartbeat.sh scripts/review_run_reviewers.sh scripts/review_apply_fixes.sh scripts/review_rb_judge.sh scripts/pr_checks_lib.sh scripts/summarize_reviewer_consensus.sh scripts/check_external_branch_advance.sh 2>/dev/null || true
          if ! git reset --hard HEAD; then
            echo "::warning::git reset --hard HEAD failed during pre-review merge-topology gate; fail-open to reviewer path."
            exit 0
          fi
          if ! git clean -ffdx -e .codex-workflow-src -e .codex-workflow-src-main -e pre_assembled_static.txt; then
            echo "::warning::git clean -ffdx failed during pre-review merge-topology gate; fail-open to reviewer path."
            exit 0
          fi

          if ! bash "${SUPPORT_SCRIPTS_DIR}/git_ref_health_check.sh" repair; then
            echo "::warning::git_ref_health_check.sh repair failed during pre-review merge-topology gate; fail-open to reviewer path."
            exit 0
          fi

          if ! git fetch --no-tags --prune origin "refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" 2>/dev/null; then
            echo "::warning::git fetch for origin/${BASE_BRANCH} failed during pre-review merge-topology gate; fail-open to reviewer path."
            exit 0
          fi

          merge_probe_ambiguous=false
          _merge_refspecs=("refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}")
          if [ -n "${TARGET_BRANCH:-}" ]; then
            _merge_refspecs+=("refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}")
          fi
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            _merge_base_deepen_iter=0
            while [ "${_merge_base_deepen_iter}" -lt 4 ]; do
              if git merge-base "origin/${BASE_BRANCH}" HEAD >/dev/null 2>&1; then
                break
              fi
              _merge_base_deepen_iter=$((_merge_base_deepen_iter + 1))
              echo "pre-review merge-base origin/${BASE_BRANCH}…HEAD unreachable in shallow clone — deepening (attempt ${_merge_base_deepen_iter}/4) on refs: ${_merge_refspecs[*]}."
              if ! git fetch --no-tags --prune --deepen=200 origin "${_merge_refspecs[@]}" 2>/dev/null; then
                echo "::warning::git fetch --deepen=200 origin ${_merge_refspecs[*]} failed during pre-review gate; trying --unshallow and treating any structural merge failure as ambiguous if history stays incomplete."
                git fetch --no-tags --prune --unshallow origin "${_merge_refspecs[@]}" 2>/dev/null || true
                break
              fi
            done
            if ! git merge-base "origin/${BASE_BRANCH}" HEAD >/dev/null 2>&1; then
              echo "::warning::merge-base origin/${BASE_BRANCH}…HEAD still unreachable after pre-review deepen attempts; continuing to the merge probe, but any unrelated-histories result will fail-open as ambiguous."
              git fetch --no-tags --prune --unshallow origin "${_merge_refspecs[@]}" 2>/dev/null || true
              if ! git merge-base "origin/${BASE_BRANCH}" HEAD >/dev/null 2>&1; then
                if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
                  merge_probe_ambiguous=true
                fi
              fi
            fi
          fi

          git config user.name "codex-bot" 2>/dev/null || true
          git config user.email "codex@users.noreply.github.com" 2>/dev/null || true

          MERGE_STASH="$(mktemp -d 2>/dev/null || printf '')"
          if [ -z "${MERGE_STASH}" ] || [ ! -d "${MERGE_STASH}" ]; then
            echo "::warning::mktemp -d failed during pre-review merge-topology gate; fail-open to reviewer path."
            exit 0
          fi
          MERGE_STDERR_FILE="$(mktemp 2>/dev/null || printf '')"
          if [ -z "${MERGE_STDERR_FILE}" ] || [ ! -f "${MERGE_STDERR_FILE}" ]; then
            echo "::warning::mktemp failed for merge stderr capture during pre-review merge-topology gate; fail-open to reviewer path."
            rm -rf "${MERGE_STASH}" >/dev/null 2>&1 || true
            exit 0
          fi
          cleanup_pre_review_merge_probe() {
            local status="$1"
            trap - EXIT
            set +e
            if [ -f "$(git rev-parse --git-dir)/MERGE_HEAD" ]; then
              git merge --abort >/dev/null 2>&1 || true
            fi
            git reset --hard HEAD >/dev/null 2>&1 || true
            git clean -ffdx -e .codex-workflow-src -e .codex-workflow-src-main -e pre_assembled_static.txt >/dev/null 2>&1 || true
            for d in scripts prompts ai-memory .codex-workflow-src .codex-workflow-src-main; do
              if [ -d "${MERGE_STASH}/${d}" ]; then
                cp -a "${MERGE_STASH}/${d}/." "${d}/" 2>/dev/null || cp -a "${MERGE_STASH}/${d}" "${d}" 2>/dev/null || true
              fi
            done
            rm -rf "${MERGE_STASH}" >/dev/null 2>&1 || true
            rm -f "${MERGE_STDERR_FILE}" >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap 'cleanup_pre_review_merge_probe $?' EXIT

          for d in scripts prompts ai-memory .codex-workflow-src .codex-workflow-src-main; do
            if [ -d "${d}" ]; then
              if git ls-files -- "${d}/" 2>/dev/null | grep -q .; then
                while IFS= read -r f; do
                  [ -n "${f}" ] && [ -e "${f}" ] && {
                    mkdir -p "${MERGE_STASH}/$(dirname "${f}")"
                    mv "${f}" "${MERGE_STASH}/${f}"
                  }
                done < <(git ls-files --others -- "${d}/")
              else
                mv "${d}" "${MERGE_STASH}/${d}"
              fi
            fi
          done
          git clean -ffdx -e .codex-workflow-src -e .codex-workflow-src-main -e pre_assembled_static.txt 2>/dev/null || true

          echo "=== pre-review merge working tree state ==="
          git status --porcelain 2>/dev/null || true
          _pre_review_untracked="$(git ls-files --others --exclude-standard 2>/dev/null || true)"
          if [ -n "${_pre_review_untracked}" ]; then
            echo "untracked files:"
            printf '%s\n' "${_pre_review_untracked}" | head -20
          fi
          echo "========================================"

          merge_exit=0
          merge_promisor_fetch_failure_seen=false
          merge_promisor_initial_stderr=""
          git merge --no-commit --no-ff "origin/${BASE_BRANCH}" 2> "${MERGE_STDERR_FILE}" || merge_exit=$?
          if [ -s "${MERGE_STDERR_FILE}" ]; then
            sed 's/^/git merge stderr: /' "${MERGE_STDERR_FILE}"
          fi
          if grep -qiE 'promisor remote|not our ref|could not fetch|fetch-pack|remote error: upload-pack' "${MERGE_STDERR_FILE}" 2>/dev/null; then
            merge_promisor_fetch_failure_seen=true
            merge_promisor_initial_stderr="$(tr '\n' ' ' < "${MERGE_STDERR_FILE}" 2>/dev/null | sed 's/[[:space:]]\+/ /g; s/^ //; s/ $//')"
            merge_promisor_initial_stderr="${merge_promisor_initial_stderr:-<git merge produced no stderr>}"
          fi

          # Blobless partial clone recovery (the codex-agent checkout uses
          # `filter: blob:none`): the 3-way merge lazy-fetches blob content
          # from the promisor remote, and that batched on-demand fetch fails
          # hard (exit 128) when any single OID in the batch is unreachable
          # server-side ("not our ref" / "could not fetch ... from promisor
          # remote") — even though the merge itself is well-formed. On that
          # signature, drop the partial filter, refetch the merge inputs so
          # every blob is materialised locally, and retry the merge once.
          # Without this the gate misreads a transient/infra fetch failure as
          # a deterministic stale base and skips the conflict resolver.
          if [ "${merge_exit}" -ne 0 ] && [ ! -f "$(git rev-parse --git-dir)/MERGE_HEAD" ] \
             && [ "${merge_promisor_fetch_failure_seen}" = "true" ]; then
            echo "::warning::Pre-review merge probe hit a partial-clone promisor fetch failure; backfilling blobs and retrying the merge once."
            git reset --hard HEAD >/dev/null 2>&1 || true
            git config --unset-all remote.origin.partialclonefilter 2>/dev/null || true
            _refetch_rc=0
            _refetch_stderr="$(git fetch --no-tags --prune --refetch origin "${_merge_refspecs[@]}" 2>&1 >/dev/null)" || _refetch_rc=$?
            if [ "${_refetch_rc}" -ne 0 ]; then
              _refetch_stderr="$(printf '%s' "${_refetch_stderr}" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g; s/^ //; s/ $//')"
              _refetch_stderr="${_refetch_stderr:-<git fetch produced no stderr>}"
              echo "::warning::blob-backfill refetch failed during pre-review merge gate; retrying the merge anyway. git fetch stderr: ${_refetch_stderr}"
            fi
            merge_exit=0
            : > "${MERGE_STDERR_FILE}"
            git merge --no-commit --no-ff "origin/${BASE_BRANCH}" 2> "${MERGE_STDERR_FILE}" || merge_exit=$?
            if [ -s "${MERGE_STDERR_FILE}" ]; then
              sed 's/^/git merge stderr (after blob backfill): /' "${MERGE_STDERR_FILE}"
            fi
          fi

          if [ -z "$(git ls-files --unmerged)" ]; then
            if [ "${merge_exit}" -ne 0 ] && [ ! -f "$(git rev-parse --git-dir)/MERGE_HEAD" ]; then
              _merge_stderr_oneline="$(tr '\n' ' ' < "${MERGE_STDERR_FILE}" 2>/dev/null | sed 's/[[:space:]]\+/ /g; s/^ //; s/ $//')"
              _merge_stderr_oneline="${_merge_stderr_oneline:-<git merge produced no stderr>}"
              if [ "${merge_promisor_fetch_failure_seen}" = "true" ] && [ -n "${merge_promisor_initial_stderr}" ] \
                 && [ "${merge_promisor_initial_stderr}" != "${_merge_stderr_oneline}" ]; then
                _merge_stderr_oneline="${_merge_stderr_oneline} | initial promisor stderr: ${merge_promisor_initial_stderr}"
              fi
              _merge_stderr_oneline="$(printf '%s' "${_merge_stderr_oneline}" | sed 's/%/%25/g; s/\r/%0D/g')"
              if grep -qi 'refusing to merge unrelated histories' "${MERGE_STDERR_FILE}" 2>/dev/null; then
                if [ "${merge_probe_ambiguous}" = "true" ]; then
                  echo "::warning::Pre-review merge topology gate saw 'refusing to merge unrelated histories' after ambiguous history preparation; continuing to reviewers. git stderr: ${_merge_stderr_oneline}"
                  echo "AUTOFIX_PRE_REVIEW_MERGE_TOPOLOGY pr=${PR_NUMBER} base_branch=${BASE_BRANCH} local_sha=${LOCAL_HEAD_SHA} result=unrelated_histories_ambiguous action=fail_open"
                else
                  _head_sha="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
                  _base_sha="$(git rev-parse --short "origin/${BASE_BRANCH}" 2>/dev/null || echo unknown)"
                  echo "::error::Pre-review merge topology gate failed: HEAD (${_head_sha}) and origin/${BASE_BRANCH} (${_base_sha}) have no common ancestor. Skipping reviewer/editor spend. git stderr: ${_merge_stderr_oneline}"
                  echo "AUTOFIX_PRE_REVIEW_MERGE_TOPOLOGY pr=${PR_NUMBER} base_branch=${BASE_BRANCH} local_sha=${LOCAL_HEAD_SHA} result=no_common_ancestor action=soft_exit"
                  echo "AUTOFIX_STALE_BASE_SKIP=true" >> "$GITHUB_ENV"
                  exit 0
                fi
              elif [ "${merge_exit}" -eq 128 ]; then
                if [ "${merge_promisor_fetch_failure_seen}" = "true" ] \
                   || grep -qiE 'promisor remote|not our ref|could not fetch|fetch-pack|remote error: upload-pack' "${MERGE_STDERR_FILE}" 2>/dev/null; then
                  # A partial-clone promisor fetch failure that survived the
                  # blob-backfill retry above is an infrastructure error, not
                  # a deterministic stale base. Fail OPEN so the reviewer +
                  # conflict-resolver path still runs (the resolver runs its
                  # own merge with its own backfill) rather than skipping it.
                  echo "::warning::Pre-review merge topology gate: exit 128 from a partial-clone promisor fetch failure that survived the blob-backfill retry. Failing open to the reviewer/resolver path. git stderr: ${_merge_stderr_oneline}"
                  echo "AUTOFIX_PRE_REVIEW_MERGE_TOPOLOGY pr=${PR_NUMBER} base_branch=${BASE_BRANCH} local_sha=${LOCAL_HEAD_SHA} result=merge_precheck_promisor_fetch_failed action=fail_open"
                else
                  echo "::error::Pre-review merge topology gate failed (exit 128): git merge aborted before entering merge state. Skipping reviewer/editor spend. See pre-review diagnostics above. git stderr: ${_merge_stderr_oneline}"
                  echo "AUTOFIX_PRE_REVIEW_MERGE_TOPOLOGY pr=${PR_NUMBER} base_branch=${BASE_BRANCH} local_sha=${LOCAL_HEAD_SHA} result=merge_precheck_failed_exit_128 action=soft_exit"
                  echo "AUTOFIX_STALE_BASE_SKIP=true" >> "$GITHUB_ENV"
                  exit 0
                fi
              else
                echo "::warning::Pre-review merge topology gate hit an inconclusive merge failure (exit ${merge_exit}); continuing to reviewers. git stderr: ${_merge_stderr_oneline}"
                echo "AUTOFIX_PRE_REVIEW_MERGE_TOPOLOGY pr=${PR_NUMBER} base_branch=${BASE_BRANCH} local_sha=${LOCAL_HEAD_SHA} result=merge_failure_inconclusive_exit_${merge_exit} action=fail_open"
              fi
            else
              echo "AUTOFIX_PRE_REVIEW_MERGE_TOPOLOGY pr=${PR_NUMBER} base_branch=${BASE_BRANCH} local_sha=${LOCAL_HEAD_SHA} result=clean_or_up_to_date action=continue"
            fi
          else
            echo "AUTOFIX_PRE_REVIEW_MERGE_TOPOLOGY pr=${PR_NUMBER} base_branch=${BASE_BRANCH} local_sha=${LOCAL_HEAD_SHA} result=content_conflict action=continue"
          fi

      - name: Run reviewer models
        if: steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true'
        id: reviewers
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
          TOOL_CALL_BUDGET_JUDGE: ${{ vars.TOOL_CALL_BUDGET_JUDGE || '60' }}
        run: |
          set -euo pipefail
          materiality_pid=""
          case "$(printf '%s' "${AGENTS_MD_MATERIALITY_ENABLED:-0}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on)
              if [ "${CLAUDE_BRANCH_REVIEW_MODE:-false}" != "true" ] && [ -x "${SUPPORT_SCRIPTS_DIR}/review_agents_md_materiality.sh" ]; then
                bash "${SUPPORT_SCRIPTS_DIR}/review_agents_md_materiality.sh" &
                materiality_pid="$!"
              elif [ "${CLAUDE_BRANCH_REVIEW_MODE:-false}" != "true" ]; then
                echo "::warning::review_agents_md_materiality.sh unavailable at ${SUPPORT_SCRIPTS_DIR}/review_agents_md_materiality.sh; AGENTS.md materiality advisory will fail open."
              fi
              ;;
          esac

          reviewers_rc=0
          bash "${SUPPORT_SCRIPTS_DIR}/review_run_reviewers.sh" || reviewers_rc=$?

          if [ -n "${materiality_pid}" ]; then
            materiality_rc=0
            wait "${materiality_pid}" || materiality_rc=$?
            if [ "${materiality_rc}" -ne 0 ]; then
              echo "::warning::review_agents_md_materiality.sh exited with ${materiality_rc}; AGENTS.md materiality advisory will fail open."
            fi
          fi

          exit "${reviewers_rc}"

      - name: Upload per-reviewer logs (always)
        if: always() && env.PREVIOUS_REVIEWS_DIR != '' && env.AUTOFIX_STALE_BASE_SKIP != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: reviewer-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PREVIOUS_REVIEWS_DIR }}/*.log
            ${{ env.PREVIOUS_REVIEWS_DIR }}/status_*.txt
            ${{ env.PREVIOUS_REVIEWS_DIR }}/review_*.txt
            ${{ env.PREVIOUS_REVIEWS_DIR }}/pass1_*.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Post AI Materiality Advisory comment
        if: always() && steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          if [ ! -s "${AGENTS_MD_MATERIALITY_RESULT_FILE:-}" ]; then
            echo "AGENTS_MD_MATERIALITY: no result file; skipping advisory comment."
            exit 0
          fi

          advisory_required="$(jq -r '.advisory_required // false' "${AGENTS_MD_MATERIALITY_RESULT_FILE}" 2>/dev/null || echo false)"
          if [ "${advisory_required}" != "true" ]; then
            echo "AGENTS_MD_MATERIALITY: advisory not required."
            exit 0
          fi

          if [ ! -s "${AGENTS_MD_MATERIALITY_COMMENT_FILE:-}" ]; then
            echo "::warning::AGENTS.md materiality advisory requested but comment body file is missing/empty; skipping."
            exit 0
          fi

          if [ ! -s "${PR_ISSUE_COMMENTS_FILE:-}" ]; then
            echo "::warning::PR_ISSUE_COMMENTS_FILE missing/empty; skipping AI Materiality Advisory comment."
            exit 0
          fi

          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }

          comment_marker="$(jq -r '.comment_marker // "<!-- AI_MATERIALITY_ADVISORY_V1 -->"' "${AGENTS_MD_MATERIALITY_RESULT_FILE}" 2>/dev/null || echo '<!-- AI_MATERIALITY_ADVISORY_V1 -->')"
          existing_comment_id="$(jq -r --arg marker "${comment_marker}" '([.[] | select(((.body // "") | contains($marker))) | {id: ((.id // 0) | tonumber), body: (.body // "")}] | sort_by(.id) | last | .id) // empty' "${PR_ISSUE_COMMENTS_FILE}" 2>/dev/null || echo "")"
          existing_comment_body="$(jq -r --arg marker "${comment_marker}" '([.[] | select(((.body // "") | contains($marker))) | {id: ((.id // 0) | tonumber), body: (.body // "")}] | sort_by(.id) | last | .body) // ""' "${PR_ISSUE_COMMENTS_FILE}" 2>/dev/null || echo "")"
          if [ -n "${existing_comment_id}" ] && [ "${existing_comment_body}" = "$(cat "${AGENTS_MD_MATERIALITY_COMMENT_FILE}")" ]; then
            echo "AGENTS_MD_MATERIALITY: advisory comment already up to date (#${existing_comment_id})."
            exit 0
          fi

          payload="$(mktemp)"
          jq -n --rawfile body "${AGENTS_MD_MATERIALITY_COMMENT_FILE}" '{body: $body}' > "${payload}"

          if [ -n "${existing_comment_id}" ] && [[ "${existing_comment_id}" =~ ^[0-9]+$ ]]; then
            if gh_retry gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing_comment_id}" --input "${payload}" >/dev/null 2>&1; then
              echo "AGENTS_MD_MATERIALITY: refreshed advisory comment #${existing_comment_id}."
              rm -f "${payload}"
              exit 0
            fi
            echo "::warning::Failed to refresh AI Materiality Advisory comment #${existing_comment_id}; will try posting a new advisory."
          fi

          if gh_retry gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --input "${payload}" >/dev/null 2>&1; then
            echo "AGENTS_MD_MATERIALITY: posted advisory comment."
          else
            echo "::warning::Failed to post AI Materiality Advisory comment on PR #${PR_NUMBER}."
          fi
          rm -f "${payload}"

      - name: Record reviewer consensus candidate in memory (fail-open)
        if: steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true'
        run: |
          set +e

          if [ ! -f "${SUPPORT_SCRIPTS_DIR}/memory_helpers.sh" ]; then
            echo "::warning::memory helper script missing; skipping consensus candidate record"
            exit 0
          fi

          if [ ! -s "${REVIEWER_CONSENSUS_FILE}" ]; then
            echo "::warning::reviewer consensus file missing/empty; skipping consensus candidate record"
            exit 0
          fi

          # shellcheck disable=SC1091
          source "${SUPPORT_SCRIPTS_DIR}/memory_helpers.sh"

          # REVIEWER_CONSENSUS_FILE is now a ledger produced by
          # summarize_reviewer_consensus.sh. The CONSENSUS FINDINGS and
          # CONSENSUS TASK GAPS blocks each list one entry per bullet starting
          # "- "; each entry has a "flagged_by: [slug, slug, ...]" line.
          # "Multi-reviewer" = >=2 slugs.
          counts="$(awk '
            BEGIN { in_consensus = 0; total = 0; multi = 0 }
            /^=== CONSENSUS FINDINGS ===$/     { in_consensus = 1; next }
            /^=== END CONSENSUS FINDINGS ===$/ { in_consensus = 0; next }
            /^=== CONSENSUS TASK GAPS ===$/    { in_consensus = 1; next }
            /^=== END CONSENSUS TASK GAPS ===$/ { in_consensus = 0; next }
            in_consensus && /^- / { total++ }
            in_consensus && /^[[:space:]]*flagged_by:/ {
              n = gsub(/,/, ",", $0) + 1
              if (index($0, "[]") > 0) { n = 0 }
              if (n >= 2) { multi++ }
            }
            END { printf "%d %d\n", multi, total }
          ' "${REVIEWER_CONSENSUS_FILE}")"
          high_confidence_count="${counts%% *}"
          total_consensus_count="${counts##* }"

          if [ "${high_confidence_count}" -gt 0 ]; then
            summary="Reviewer consensus flagged ${high_confidence_count} multi-reviewer item(s) across ${total_consensus_count} total consensus item(s)"
          else
            summary="Reviewer consensus produced ${total_consensus_count} consensus item(s); none flagged by multiple reviewers"
          fi

          details="$(head -c 12000 "${REVIEWER_CONSENSUS_FILE}")"

          memory_record_candidate \
            --category "patterns" \
            --summary "${summary}" \
            --details "${details}" \
            --workflow "review_autofix" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --actor "${GITHUB_ACTOR}" \
            --pr-number "${PR_NUMBER}" \
            --source-refs "reviewer_consensus.txt"

          true

      # No-PR claude-branch-review terminal step: post the reviewer-consensus
      # ledger as a commit comment for the head SHA via
      # scripts/post_review_comment.sh. PR-backed claude/** branches are not in
      # this mode and continue into the editor / commit / push / re-review tail.
      - name: Post claude-branch-review consensus comment
        if: env.CLAUDE_BRANCH_REVIEW_MODE == 'true' && steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -s "${REVIEWER_CONSENSUS_FILE:-}" ]; then
            echo "::warning::claude-branch-review: REVIEWER_CONSENSUS_FILE missing/empty (${REVIEWER_CONSENSUS_FILE:-<unset>}); nothing to post."
            exit 0
          fi
          bash "${SUPPORT_SCRIPTS_DIR}/post_review_comment.sh"

      - name: Pre-editor stale-base gate
        # Skip the expensive editor LLM call when the PR branch advanced
        # with a non-autofix commit during the reviewer pass.  See
        # probably_unnecessary_but_read_if_stuck.md §20.2.  The gate is fail-open: detection failures
        # (fetch errors, API blips) fall through to the editor so a
        # GitHub API glitch never silently drops a review.
        # Claude-branch-review mode never runs the editor, so this
        # check (and the API calls it makes) is unnecessary.
        if: steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        id: pre_editor_stale_base_gate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTOFIX_BOT_LOGIN: ${{ vars.AUTOFIX_BOT_LOGIN }}
          LOCAL_HEAD_SHA: ${{ env.INITIAL_HEAD_SHA }}
        run: |
          set -euo pipefail
          if [ ! -x "${SUPPORT_SCRIPTS_DIR}/check_external_branch_advance.sh" ]; then
            echo "::warning::check_external_branch_advance.sh missing from support scripts; fail-open (skipping gate)."
            echo "pre_editor_advance=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          advance_out="$(bash "${SUPPORT_SCRIPTS_DIR}/check_external_branch_advance.sh" || printf 'ADVANCE=unknown\n')"
          advance_val="$(printf '%s\n' "${advance_out}" | grep -E '^ADVANCE=' | tail -n 1 | cut -d= -f2 || true)"
          advance_val="${advance_val:-unknown}"
          echo "pre_editor_advance=${advance_val}" >> "$GITHUB_OUTPUT"
          case "${advance_val}" in
            external)
              echo "AUTOFIX_PRE_EDITOR_STALE_BASE pr=${PR_NUMBER} local_sha=${LOCAL_HEAD_SHA} target_branch=${TARGET_BRANCH} action=soft_exit"
              echo "AUTOFIX_STALE_BASE_SKIP=true" >> "$GITHUB_ENV"
              ;;
            self_only)
              echo "AUTOFIX_PRE_EDITOR_SELF_ADVANCE pr=${PR_NUMBER} local_sha=${LOCAL_HEAD_SHA} target_branch=${TARGET_BRANCH} action=continue"
              ;;
            none)
              echo "AUTOFIX_PRE_EDITOR_BASE_FRESH pr=${PR_NUMBER} local_sha=${LOCAL_HEAD_SHA} target_branch=${TARGET_BRANCH}"
              ;;
            *)
              echo "AUTOFIX_PRE_EDITOR_UNKNOWN pr=${PR_NUMBER} local_sha=${LOCAL_HEAD_SHA} target_branch=${TARGET_BRANCH} action=fail_open"
              ;;
          esac

      - name: Install project dependencies (best-effort)
        if: steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        run: |
          set -euo pipefail
          # Install project dependencies so the editor can validate fixes
          # (e.g., run vitest, tsc, pytest). Best-effort: failures here do
          # not block the workflow.
          install_failed=false
          if [ -f package-lock.json ]; then
            echo "Found package-lock.json — running npm ci"
            npm ci --ignore-scripts 2>&1 || install_failed=true
          elif [ -f yarn.lock ]; then
            echo "Found yarn.lock — running yarn install"
            yarn install --frozen-lockfile --ignore-scripts 2>&1 || install_failed=true
          elif [ -f pnpm-lock.yaml ]; then
            echo "Found pnpm-lock.yaml — running pnpm install"
            npx pnpm install --frozen-lockfile --ignore-scripts 2>&1 || install_failed=true
          elif [ -f package.json ]; then
            echo "Found package.json (no lockfile) — running npm install"
            npm install --ignore-scripts 2>&1 || install_failed=true
          fi
          if [ -f requirements.txt ]; then
            echo "Found requirements.txt — running pip install"
            pip install -r requirements.txt 2>&1 || install_failed=true
          elif [ -f pyproject.toml ] && [ ! -f package.json ]; then
            echo "Found pyproject.toml — running pip install"
            pip install -e ".[dev]" 2>&1 || pip install -e . 2>&1 || install_failed=true
          fi
          if [ "${install_failed}" = "true" ]; then
            echo "::warning::Some project dependencies could not be installed. Editor validation may be limited."
          fi

      - name: Switch reasoning effort for editor
        if: steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        run: |
          set -euo pipefail
          sed -i "s/^model_reasoning_effort = \".*\"/model_reasoning_effort = \"${EDITOR_REASONING_EFFORT}\"/" ~/.codex/config.toml
          echo "Updated reasoning effort to ${EDITOR_REASONING_EFFORT} for editor phase"
          # Enable reasoning summaries for the editor so the model is forced to
          # externalize its decision tokens. Investigation of run #25115530167
          # (the legacy editor default) found that @ xhigh + summaries=none
          # can complete a session with empty stdout: the model reasons silently,
          # decides not to call apply_patch, and the session ends cleanly with
          # 0 bytes output (no stderr error, no SIGTERM). Setting summaries to
          # "auto" forces at least a brief externalized rationale on every turn —
          # gives us diagnostic visibility AND nudges the model toward emitting
          # a final assistant message instead of silent termination. The
          # field name `model_reasoning_summary` mirrors the Codex CLI
          # convention used by `model_reasoning_effort`; the catalog at
          # scripts/codex_model_catalog.json confirms both gpt-5.4 (current
          # default) and the legacy editor default advertise
          # `default_reasoning_summary: "auto"`.
          if grep -q "^model_reasoning_summary = " ~/.codex/config.toml; then
            sed -i "s/^model_reasoning_summary = \".*\"/model_reasoning_summary = \"auto\"/" ~/.codex/config.toml
          else
            sed -i "/^model_reasoning_effort = /a model_reasoning_summary = \"auto\"" ~/.codex/config.toml
          fi
          echo "Enabled reasoning summaries (auto) for editor phase"

      - name: Setup Serena for editor
        if: steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true' && env.SERENA_ENABLED == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -f "${SUPPORT_SCRIPTS_DIR}/setup_serena.sh" ]; then
            echo "::warning::Optional Serena bootstrap helper is unavailable at ${SUPPORT_SCRIPTS_DIR}/setup_serena.sh; leaving Serena disabled for this run."
            echo "SERENA_FALLBACK target=review-autofix-editor reason=setup-failure" >&2
            echo "SERENA_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! SERENA_FALLBACK_TARGET="review-autofix-editor" bash "${SUPPORT_SCRIPTS_DIR}/setup_serena.sh"; then
            echo "::warning::Serena bootstrap helper failed; leaving Serena disabled for this run."
            echo "SERENA_FALLBACK target=review-autofix-editor reason=setup-failure" >&2
            echo "SERENA_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
          if [ "${SERENA_PROJECT_PREEXISTED:-false}" != "true" ] && [ -f .serena/project.yml ]; then
            serena_project_hash="$(sha256sum .serena/project.yml 2>/dev/null | awk '{print $1}' || true)"
            echo "SERENA_PROJECT_BOOTSTRAP_HASH=${serena_project_hash}" >> "$GITHUB_ENV"
          else
            echo "SERENA_PROJECT_BOOTSTRAP_HASH=" >> "$GITHUB_ENV"
          fi

      - name: Apply fixes with editor model
        if: steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
          TOOL_CALL_BUDGET_JUDGE: ${{ vars.TOOL_CALL_BUDGET_JUDGE || '60' }}
        run: |
          set -euo pipefail

          # On the workflow source repo, snapshot the working-tree state before
          # the editor runs.  The "Commit changes" step below uses this snapshot
          # to stage ONLY files the editor actually wrote to (computed by
          # hashing each file pre/post plus executable-bit changes), instead of
          # relying on hardcoded
          # ':!scripts/<helper>' pathspec excludes that cannot unstage files
          # already in the index.  This lets any script — including former
          # "canonical helpers" like review_apply_fixes.sh — be legitimately
          # modified, while still blocking files the editor never touched from
          # riding along in the commit.
          # Consumer repos use per-file exclusions from scripts/.gitignore
          # so consumer-owned scripts (e.g. scripts/security/*.js) are staged.
          if [ "${IS_WORKFLOW_SOURCE_REPO:-false}" = "true" ]; then
            PRE_EDITOR_STATE_FILE="${RUNTIME_DIR}/pre_editor_state.tsv"
            : > "${PRE_EDITOR_STATE_FILE}"
            PRE_EDITOR_DIFF_BASELINE_FILE="${RUNTIME_DIR}/pre_editor_head_diff_paths.txt"
            git diff --name-only HEAD | sort -u > "${PRE_EDITOR_DIFF_BASELINE_FILE}" || true
            # `sort -zu` dedupes: in an active merge state, `git ls-files -z`
            # emits conflicted paths once per index stage (1/2/3).  The
            # autofix step should never run in merge state, but the guard is
            # cheap and makes the snapshot reusable from the resolver step.
            while IFS= read -r -d '' snap_path; do
              [ -f "${snap_path}" ] || continue
              snap_exec=0
              [ -x "${snap_path}" ] && snap_exec=1
              printf 'T\t%s\t%s\t%s\n' \
                "$(git hash-object -- "${snap_path}")" \
                "${snap_exec}" \
                "${snap_path}" >> "${PRE_EDITOR_STATE_FILE}"
            done < <(git ls-files -z | sort -zu)
            while IFS= read -r snap_path; do
              [ -n "${snap_path}" ] && \
                printf 'U\t%s\n' "${snap_path}" >> "${PRE_EDITOR_STATE_FILE}"
            done < <(git ls-files --others --exclude-standard)
            echo "PRE_EDITOR_STATE_FILE=${PRE_EDITOR_STATE_FILE}" >> "$GITHUB_ENV"
            echo "PRE_EDITOR_DIFF_BASELINE_FILE=${PRE_EDITOR_DIFF_BASELINE_FILE}" >> "$GITHUB_ENV"
            echo "Pre-editor snapshot captured: $(wc -l < "${PRE_EDITOR_STATE_FILE}") entries"
          fi

          bash "${SUPPORT_SCRIPTS_DIR}/review_apply_fixes.sh"

          # Bounded in-step retry for first-iteration empty-output failures.
          #
          # When the editor crashes/times out on the very first autofix
          # iteration (no prior `[ai-autofix]` commits on HEAD), the
          # downstream "Post editor summary comment" step posts a "will
          # retry" comment and exits non-zero, deferring the retry to
          # the stall poller's next cron tick — typically 1–3 hours
          # later, which directly contributes to ai:done elapsed time.
          # On iteration 2+ an empty editor output is a legitimate
          # convergence signal (no new defects), so the retry is
          # gated to the first-iteration case only.
          #
          # Skipped when AUTOFIX_INSTEP_RETRY_ENABLED=false so consumers
          # can opt out without redeploying the workflow.  Tune the
          # cooldown via AUTOFIX_INSTEP_RETRY_SLEEP_SECS (default 30) so
          # slower runner environments can give the editor more time to
          # recover from transient crashes/timeouts without holding the
          # job for an excessive fixed window.
          _instep_retry_enabled="${AUTOFIX_INSTEP_RETRY_ENABLED:-true}"
          _instep_retry_sleep="${AUTOFIX_INSTEP_RETRY_SLEEP_SECS:-30}"
          if ! [[ "${_instep_retry_sleep}" =~ ^[0-9]+$ ]] || [ "${_instep_retry_sleep}" -lt 1 ] || [ "${_instep_retry_sleep}" -gt 600 ]; then
            echo "::warning::AUTOFIX_INSTEP_RETRY_SLEEP_SECS must be an integer in [1, 600]; defaulting to 30."
            _instep_retry_sleep=30
          fi
          # Detect whether the editor's just-written summary is unusable
          # for downstream consumers (commit step, push step, validator).
          # Two signals count, both of which mean "no productive editor
          # output landed":
          #   1. The summary file is missing or zero-length (the original
          #      retry condition).
          #   2. The summary file exists but contains the same fallback /
          #      failure markers that the downstream "Validate editor no-op
          #      disposition" step greps for to set EDITOR_NOOP_SUSPICIOUS.
          #      `scripts/review_apply_fixes.sh` writes a ~600-byte fallback
          #      summary when all editor attempts fail — non-empty on disk,
          #      so the original `[ ! -s ... ]` test missed it. The marker
          #      regex must stay in lockstep with the validate step's grep
          #      (both reference "editor failed before producing" /
          #      "unavailable (editor fallback)") — a divergence that lets
          #      the fallback summary slip past the validator would
          #      reintroduce the run-25126757724 cascade.
          # The flag name is "unusable" rather than "empty" because case
          # (2) leaves a non-empty summary on disk that nonetheless cannot
          # drive a productive autofix commit.
          _instep_retry_summary_unusable="false"
          if [ ! -s "${EDITOR_SUMMARY_FILE:-/dev/null}" ]; then
            _instep_retry_summary_unusable="true"
          elif grep -qiE 'editor failed before producing|unavailable \(editor fallback\)' "${EDITOR_SUMMARY_FILE}" 2>/dev/null; then
            _instep_retry_summary_unusable="true"
            # Wording deliberately omits the literal substring
            # "Editor summary contains failure/fallback markers" — the e2e
            # poller in test-and-mark-stable.yml greps live job logs for
            # the validator's `::warning::` annotation that uses that
            # phrase, and a retry-side echo carrying the same literal
            # would false-trigger the poller's early-exit before the
            # retry has had a chance to succeed (see PR #1798 review).
            echo "::notice::Editor summary present but matched fallback-marker regex — treating as unusable for in-step retry decision."
          fi
          if [ "${_instep_retry_enabled}" = "true" ] \
              && [ "${_instep_retry_summary_unusable}" = "true" ]; then
            # `git log` here intentionally walks HEAD on the already-
            # checked-out PR branch (the surrounding workflow checks
            # out the PR head before this step runs, see "Checkout PR
            # head branch" earlier in the job).  If this block is ever
            # extracted to a standalone script, the caller must ensure
            # the PR branch is current.
            # `grep -c` prints "0" AND exits 1 when there are no matches, so
            # `|| echo 0` would append a second "0" (yielding "0\n0") and the
            # subsequent equality check would silently fail — the retry would
            # never fire because the comparison is never the literal "0".
            # Use `|| true` instead so grep's own "0" output is the only value
            # captured.  See PR #1703 review comment by copilot-pull-request-reviewer.
            # The grouping (`^(A|B)`) is semantically equivalent to
            # `^A|^B` under standard ERE precedence, but is more
            # robust against refactors and reviewer-bot misreadings.
            _prior_autofix_count="$(git log --format='%s' -n 5 2>/dev/null \
              | grep -cE '^(\[ai-autofix\]|\[judge-fix\])' || true)"
            if [ "${_prior_autofix_count}" = "0" ]; then
              echo "::warning::Editor produced no summary on first iteration — retrying once after ${_instep_retry_sleep}s before falling through to noop-comment path."
              sleep "${_instep_retry_sleep}"
              bash "${SUPPORT_SCRIPTS_DIR}/review_apply_fixes.sh" || {
                echo "::warning::Editor in-step retry also failed; downstream noop-comment path will fire."
              }
            fi
          fi

      - name: Remove slop-scan runtime artifact
        if: always()
        run: |
          set -euo pipefail
          expected_dir="${GITHUB_WORKSPACE}/.ai/slop_scan"
          if [ -n "${SLOP_SCAN_FINDINGS_FILE:-}" ] && [ "$(dirname "${SLOP_SCAN_FINDINGS_FILE}")" = "${expected_dir}" ]; then
            rm -f "${SLOP_SCAN_FINDINGS_FILE}"
            rmdir "${expected_dir}" 2>/dev/null || true
          elif [ -n "${SLOP_SCAN_FINDINGS_FILE:-}" ]; then
            echo "::warning::Unexpected SLOP_SCAN_FINDINGS_FILE path (${SLOP_SCAN_FINDINGS_FILE}); skipping cleanup."
          fi

      - name: Log token usage
        if: always()
        run: |
          set -euo pipefail
          if [ -f "${EDITOR_SUMMARY_FILE:-}" ]; then
            echo "::group::Editor summary size"
            wc -c < "${EDITOR_SUMMARY_FILE}"
            echo "::endgroup::"
          fi

      - name: Commit changes
        if: steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        id: commit_changes
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          bash "${SUPPORT_SCRIPTS_DIR}/review_commit_changes.sh"

      - name: Run interim judge
        if: env.JUDGE_INTERIM_ENABLED == 'true' && steps.retrigger_guard.outputs.max_iterations_reached != 'true' && steps.commit_changes.outputs.did_commit == 'true' && env.LEDGER_ONLY_COMMIT_STRICT != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        env:
          ROUND_NUMBER: ${{ steps.retrigger_guard.outputs.autofix_iteration }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bash "${SUPPORT_SCRIPTS_DIR}/review_run_judge_interim.sh"

      - name: Synthesize behavioural smoke
        if: env.BEHAVIOURAL_SMOKE_FROM_JUDGE_ENABLED == 'true' && env.JUDGE_INTERIM_ENABLED == 'true' && steps.retrigger_guard.outputs.max_iterations_reached != 'true' && steps.commit_changes.outputs.did_commit == 'true' && env.LEDGER_ONLY_COMMIT_STRICT != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        continue-on-error: true
        env:
          ROUND_NUMBER: ${{ steps.retrigger_guard.outputs.autofix_iteration }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bash "${SUPPORT_SCRIPTS_DIR}/review_synthesise_smoke.sh"

      # Save the updated per-PR review runtime state so the next iteration
      # (separate workflow run triggered by pull_request.synchronize after
      # the autofix commit) can restore both the review-issue ledger and
      # any per-round judge-interim artifact above. Runs even if the apply,
      # commit, or interim-judge path failed partway so cross-iteration state
      # remains best-effort and fail-open.
      - name: Save review-issue ledger
        if: always() && steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.workspace_state.outputs.workspace_path }}/.ai/review_issue_ledger/
            ${{ steps.workspace_state.outputs.workspace_path }}/.ai/review_runtime/
            ${{ steps.workspace_state.outputs.workspace_path }}/${{ env.REVIEW_LEDGER_PATH }}
          key: review-ledger-${{ github.repository }}-pr-${{ env.PR_NUMBER }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Post editor summary comment
        if: "!cancelled() && steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }

          # Empty-editor-output short-circuit.
          #
          # If the editor produced no structured summary AND no file
          # changes were committed, this run has nothing meaningful to
          # report — the synthetic fallback summary (below) would be a
          # false positive that masks a codex crash/timeout/empty-prompt.
          # Post a distinct, retry-friendly comment, signal the
          # failure handlers to NOT apply ai:review-blocked for this
          # specific cause, and fail the step so the stall poller can
          # retry the review later instead of poisoning the linked
          # issue with an unrecoverable label.
          if [ ! -s "${EDITOR_SUMMARY_FILE}" ] && [ ! -s "${COMMITTED_FILES_FILE:-/dev/null}" ]; then
            echo "::warning::Editor produced no summary and no committed changes — treating as retryable no-op."
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            NOOP_BODY="$(cat <<EOF
          **AI review/autofix produced no output — will retry**

          The editor stage completed without a structured summary and without committing any file changes. This typically indicates a transient codex crash, timeout, or empty prompt rather than a reviewable defect in the PR. No \`ai:review-blocked\` label is being applied for this run.

          [View workflow run](${RUN_URL}) for details. The stall poller will retry the review on a subsequent cycle.
          EOF
          )"
            gh_retry gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -f body="${NOOP_BODY}" >/dev/null 2>&1 || true
            echo "AUTOFIX_EDITOR_EMPTY_NOOP=true" >> "$GITHUB_ENV"
            exit 1
          fi

          if [ ! -s "${EDITOR_SUMMARY_FILE}" ]; then
            cat > "${EDITOR_SUMMARY_FILE}" <<'__EDITOR_SUMMARY__'
          Changes made:
          - none (no editor summary output was generated)

          Already satisfied (suggested but already present):
          - none (no editor summary output was generated)

          Ignored suggestions (with short reason):
          - no summary available from editor stage

          Reviewer files processed:
          - none (no editor summary output was generated)

          Review file issue audit:
          - none (no editor summary output was generated)

          Regression fingerprint:
          - unavailable (editor fallback)

          Runtime failure path:
          - unavailable (editor fallback)
          __EDITOR_SUMMARY__
          fi

          {
            echo "AI autofix editor summary"
            echo
            cat "${EDITOR_SUMMARY_FILE}"
            echo
            echo "Files changed / commit status:"
            if [ -s "${COMMITTED_FILES_FILE}" ]; then
              cat "${COMMITTED_FILES_FILE}"
            else
              echo "- none"
            fi
            echo
          } > "${PR_EDITOR_COMMENT_FILE}"

          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }

          if gh_retry gh api repos/${{ github.repository }}/issues/"${PR_NUMBER}"/comments -f body="$(cat "${PR_EDITOR_COMMENT_FILE}")" >/dev/null; then
            echo "Posted editor summary comment."
            # Signal to the failure-comment step (line ~3269) that the
            # editor summary already landed on the PR thread. The generic
            # "AI review/autofix failed" body speculates about editor /
            # dependency / infra failure modes and would contradict the
            # success-looking summary above when the editor in fact ran
            # to completion and a later step (push, conflict resolver,
            # auto-merge config, telemetry) is what actually failed.
            # Set only on a successful post; on retry exhaustion the
            # editor summary is not visible to the reader, so the
            # generic body is the right thing to post. See PR #1476
            # follow-up for the contradictory-comment regression this
            # signal resolves.
            echo "EDITOR_SUMMARY_POSTED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Unable to post editor summary comment after retries."
          fi

      - name: Clear Serena after editor
        if: always() && env.SERENA_ENABLED == 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -f "${SUPPORT_SCRIPTS_DIR}/setup_serena.sh" ]; then
            echo "::notice::setup_serena.sh is unavailable; skipping Serena reset."
            echo "SERENA_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! SERENA_ENABLED=false bash "${SUPPORT_SCRIPTS_DIR}/setup_serena.sh"; then
            echo "::warning::Serena reset helper failed; downstream Codex stages may inherit stale Serena MCP config."
          fi
          echo "SERENA_AVAILABLE=false" >> "$GITHUB_ENV"

      - name: Detect editor-claimed-but-uncommitted changes
        # The editor LLM reports what it believes it changed in the
        # EDITOR_SUMMARY_FILE ("Changes made:" section).  The commit step
        # independently checks `git diff --cached` to determine what actually
        # changed on disk.  When the editor claims changes but git has no
        # diff, the tool calls likely failed to persist — this is
        # NOT a "clean review" signal and must block auto-merge.
        # See: PR #1136, #1137 where this mismatch caused premature
        # auto-merge of un-fixed PRs.
        # LEDGER_ONLY_COMMIT_STRICT=true: the commit's only tracked path is
        # the autofix ledger, which is a bookkeeping write — not a
        # productive edit — so this safety check must still run to validate
        # the editor's no-op claim before downstream clean-review gates
        # fire.  See PR #1472.  We deliberately read the STRICT flag here
        # (not LEDGER_ONLY_COMMIT) because the non-strict flag is also set
        # by the audit-convergence branch in
        # scripts/review_commit_changes.sh, which can fire on commits that
        # DID land real source-file edits.  Running this detector against
        # such a commit produces a false-positive EDITOR_CHANGES_LOST alert
        # (bitsafe.io PR #177 / run 25653654000).
        if: "!cancelled() && (steps.commit_changes.outputs.did_commit != 'true' || env.LEDGER_ONLY_COMMIT_STRICT == 'true') && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'"
        run: |
          set -euo pipefail

          EDITOR_CHANGES_LOST="false"

          if [ -s "${EDITOR_SUMMARY_FILE:-}" ]; then
            # Prefer the authoritative "Change status:" section emitted by
            # the editor prompt (see scripts/review_apply_fixes.sh editor
            # response format). The section contains exactly one bullet
            # with value "edited" or "not-edited" (or "not edited",
            # normalized to "not-edited"). Capture both the
            # below-header bullet form and any inline value on the header
            # line ("Change status: edited") to be robust to minor
            # formatting drift.
            change_status_section="$(awk '
              /^[[:space:]]*Change status:/ {
                header=$0
                sub(/^[[:space:]]*Change status:[[:space:]]*/, "", header)
                if (header != "") print header
                in_section=1
                next
              }
              in_section && /^[[:space:]]*[A-Za-z].*:/ { exit }
              in_section { print }
            ' "${EDITOR_SUMMARY_FILE}")"
            change_status="$(printf '%s\n' "${change_status_section}" | grep -iE '^[[:space:]]*-?[[:space:]]*(edited|not-edited|not[[:space:]]+edited)[[:space:]]*$' | head -1 | sed -E 's/^[[:space:]]*-?[[:space:]]*//; s/[[:space:]]*$//; s/^not[[:space:]]+edited$/not-edited/I' | tr '[:upper:]' '[:lower:]' || true)"

            # Extract the "Changes made:" section, stopping at the next
            # top-level section header (line starting with a non-dash
            # alphabetic word followed by a colon). Used both for the
            # heuristic fallback below and for the error-context printout
            # when the authoritative signal reports "edited".
            changes_section="$(awk '
              /^[[:space:]]*Changes made:/ { in_section=1; next }
              in_section && /^[[:space:]]*[A-Za-z].*:/ { exit }
              in_section { print }
            ' "${EDITOR_SUMMARY_FILE}")"

            edit_claim_regex='\b(modif(y|ied|ies|ying)|updat(e|ed|es|ing)|change(d|s|ing)?|add(ed|s|ing)?|remov(e|ed|es|ing)|delet(e|ed|es|ing)|renam(e|ed|es|ing)|creat(e|ed|es|ing)|fix(ed|es|ing)?|patch(ed|es|ing)?|implement(ed|s|ing)?|refactor(ed|s|ing)?|tweak(ed|s|ing)?|adjust(ed|s|ing)?|improv(e|ed|es|ing)|resolv(e|ed|es|ing))\b'
            strong_edit_claim_regex='\b(modif(y|ied|ies|ying)|change(d|s|ing)?|updat(e|ed|es|ing)|add(ed|s|ing)?|remov(e|ed|es|ing)|delet(e|ed|es|ing)|renam(e|ed|es|ing)|creat(e|ed|es|ing)|fix(ed|es|ing)?|patch(ed|es|ing)?|implement(ed|s|ing)?|refactor(ed|s|ing)?|tweak(ed|s|ing)?|adjust(ed|s|ing)?|improv(e|ed|es|ing)|resolv(e|ed|es|ing))\b'
            no_change_phrase_regex='no ((repository|repo|code|file)[[:space:]]+)?(file[[:space:]]+)?(changes?|modifications?|edits?)([[:space:]]+(were|was|are|is))?[[:space:]]+(required|needed|made|necessary)|no[[:space:]]+(repository[[:space:]]+)?files[[:space:]]+(were[[:space:]]+)?modified|no[[:space:]]+changes[[:space:]]+(were[[:space:]]+)?made|no[[:space:]]+modifications|no[[:space:]]+(repository[[:space:]]+)?files[[:space:]]+(are|is)[[:space:]]+modified|no[[:space:]]+(repository[[:space:]]+)?files[[:space:]]+(were[[:space:]]+)?changed|no[[:space:]]+changes\b'
            no_change_declaration_regex="^[[:space:]]*(-[[:space:]]*)?([^;:,]*[;:,-][[:space:]]*)?(${no_change_phrase_regex})([[:space:]]*[[:punct:]]*)?"

            has_real_changes="false"
            if [ "${change_status}" = "edited" ] || [ "${change_status}" = "not-edited" ]; then
              # Authoritative path: trust the editor's self-reported status.
              # The free-text heuristic below is only consulted when the
              # "Change status:" line is missing or not one of the two
              # known values (older cached summaries or malformed output).
              if [ "${change_status}" = "edited" ]; then
                has_real_changes="true"
              elif [ -n "${changes_section}" ] && \
                printf '%s\n' "${changes_section}" | grep -viE '^[[:space:]]*$|^[[:space:]]*-[[:space:]]*none([[:space:][:punct:]]|$)|^[[:space:]]{2,}-|^[[:space:]]*-[[:space:]]*(Validation executed|Validation limitation|Ran [^:]*(validation|check|test)|Assumptions?( applied| made)|Missing[- ]context)' | grep -viE "^[[:space:]]*-[[:space:]]*(${no_change_phrase_regex})([[:space:][:punct:]]*)$" | grep -qiE "${edit_claim_regex}"; then
                echo "::warning::Editor reported Change status: not-edited but Changes made contains edit-like claims; trusting Change status."
              fi
            elif [ -n "${changes_section}" ]; then
              # Fallback heuristic: used only when the authoritative
              # "Change status:" signal is missing/malformed.
              # If the first non-blank line is a "- none" variant or an
              # explicit "no (repository) files were modified / no changes
              # made / no modifications" declaration (with any trailing
              # description), treat the entire section as "no changes".
              # Editors may append informational bullets (validation runs,
              # missing-context notes, action summaries with file mentions)
              # below such declarations that are not real file-change claims;
              # without this guard those bullets trigger a false-positive
              # EDITOR_CHANGES_LOST error because edit_claim_regex loosely
              # matches generic edit-like substrings (for example `change`)
              # in informational text.
              first_line="$(printf '%s\n' "${changes_section}" | grep -vE '^[[:space:]]*$' | head -1 || true)"
              # Strip lines that are blank, match "- none*", are indented
              # nested sub-bullets (continuations of validation/assumption
              # headers), or are informational metadata bullets
              # (e.g. "- Validation executed").
              substantive="$(printf '%s\n' "${changes_section}" | grep -viE '^[[:space:]]*$|^[[:space:]]*-[[:space:]]*none([[:space:][:punct:]]|$)|^[[:space:]]{2,}-|^[[:space:]]*-[[:space:]]*(Validation executed|Validation limitation|Ran [^:]*(validation|check|test)|Assumptions?( applied| made)|Missing[- ]context)' || true)"
              # Stricter bullet-start edit regex for multi-line contradiction checks.
              bullet_edit_regex='^[[:space:]]*-[[:space:]]*(modif(y|ied|ies|ying)|updat(e|ed|es|ing)|change(d|s|ing)?|add(ed|s|ing)?|remov(e|ed|es|ing)|delet(e|ed|es|ing)|renam(e|ed|es|ing)|creat(e|ed|es|ing)|fix(ed|es|ing)?|patch(ed|es|ing)?|implement(ed|s|ing)?|refactor(ed|s|ing)?|tweak(ed|s|ing)?|adjust(ed|s|ing)?|improv(e|ed|es|ing)|resolv(e|ed|es|ing))([[:space:][:punct:]]|$)'
              if printf '%s\n' "${first_line}" | grep -qiE "^[[:space:]]*-[[:space:]]*(${no_change_phrase_regex})([[:space:][:punct:]].*)?$"; then
                # Explicit "no files modified / no changes made / no
                # modifications" first-bullet is a deliberate declaration
                # from the editor. Trust it and short-circuit to "no real
                # changes" — the remainder check below is intentionally
                # conservative and can match generic edit-like words in
                # purely informational bullets, and
                # would fire a false-positive EDITOR_CHANGES_LOST error.
                # Same-line contradictions ("no files modified but updated
                # X") and multi-line explicit edit bullets are still caught.
                first_line_suffix="$(printf '%s\n' "${first_line}" | sed -E "s/^[[:space:]]*-[[:space:]]*(${no_change_phrase_regex})[[:space:][:punct:]]*//I")"
                if printf '%s\n' "${first_line_suffix}" | grep -qiE "${edit_claim_regex}"; then
                  has_real_changes="true"
                elif [ -n "${substantive}" ]; then
                  if printf '%s\n' "${substantive}" | grep -qiE "(${no_change_phrase_regex}).*(but|however|yet|although|still|nevertheless).*(${edit_claim_regex})"; then
                    has_real_changes="true"
                  else
                    # Multi-line contradiction detection: check remaining
                    # bullets for explicit edit verbs at bullet start.
                    remainder="$(printf '%s\n' "${substantive}" | grep -viE "${no_change_declaration_regex}" || true)"
                    if printf '%s\n' "${remainder}" | grep -qiE "${bullet_edit_regex}"; then
                      has_real_changes="true"
                    fi
                  fi
                fi
              elif printf '%s\n' "${first_line}" | grep -qiE '^[[:space:]]*-[[:space:]]*none([[:space:][:punct:]]|$)'; then
                # Preserve contradictory summaries such as "- none" followed
                # by "- created ...".
                if [ -n "${substantive}" ]; then
                  if printf '%s\n' "${substantive}" | grep -qiE "((${strong_edit_claim_regex}).*(${no_change_phrase_regex})|(${no_change_phrase_regex}).*(${strong_edit_claim_regex}))"; then
                    has_real_changes="true"
                  elif printf '%s\n' "${substantive}" | grep -qiE "(${no_change_phrase_regex}).*(but|however|yet|although|still|nevertheless).*(${edit_claim_regex})"; then
                    has_real_changes="true"
                  else
                    remainder="$(printf '%s\n' "${substantive}" | grep -viE "${no_change_declaration_regex}" || true)"
                    if printf '%s\n' "${remainder}" | grep -qiE "${edit_claim_regex}"; then
                      has_real_changes="true"
                    fi
                  fi
                fi
              else
                # Strip lines that are blank, match "- none*", are indented
                # nested sub-bullets (continuations of validation/assumption
                # headers), or are informational metadata
                # (e.g. "- Validation executed: ...") that the editor may
                # emit when no files changed. Keep explicit "no changes"
                # lines for contradiction detection.
                substantive="$(printf '%s\n' "${changes_section}" | grep -viE '^[[:space:]]*$|^[[:space:]]*-[[:space:]]*none([[:space:][:punct:]]|$)|^[[:space:]]{2,}-|^[[:space:]]*-[[:space:]]*(Validation executed|Validation limitation|Ran [^:]*(validation|check|test)|Assumptions?( applied| made)|Missing[- ]context)' || true)"
                if [ -n "${substantive}" ]; then
                  if printf '%s\n' "${substantive}" | grep -qiE "((${strong_edit_claim_regex}).*(${no_change_phrase_regex})|(${no_change_phrase_regex}).*(${strong_edit_claim_regex}))"; then
                    has_real_changes="true"
                  elif printf '%s\n' "${substantive}" | grep -qiE "${no_change_phrase_regex}"; then
                    # Preserve contradictory mixed lines ("no changes, but
                    # updated ...") so they still count as real change claims.
                    if printf '%s\n' "${substantive}" | grep -qiE "(${no_change_phrase_regex}).*(but|however|yet|although|still|nevertheless).*(${edit_claim_regex})"; then
                      has_real_changes="true"
                    else
                      # Remove standalone no-modification declarations, but
                      # still detect mixed sections that claim concrete edits.
                      remainder="$(printf '%s\n' "${substantive}" | grep -viE "${no_change_declaration_regex}" || true)"
                      if printf '%s\n' "${remainder}" | grep -qiE "${edit_claim_regex}"; then
                        has_real_changes="true"
                      fi
                    fi
                  else
                    if printf '%s\n' "${substantive}" | grep -qiE "${edit_claim_regex}"; then
                      has_real_changes="true"
                    fi
                  fi
                fi
                # Echo retained substantive content whenever this fallback
                # branch sees non-empty filtered lines. This makes future
                # false-positive investigations tractable — reviewers can see
                # exactly which bullets were considered.
                if [ -n "${substantive}" ]; then
                  echo "Substantive bullets retained by detector regex:"
                  printf '%s\n' "${substantive}" | head -20
                fi
              fi
            fi

            if [ "${has_real_changes}" = "true" ]; then
              # Defense-in-depth: before firing the warning and blocking
              # auto-merge, re-check the working-tree state and the
              # narrative "Changes made:" block via the shared shim. If
              # both indicate no real edits, downgrade to an
              # informational log line and do not block auto-merge.
              # Keeps the hard failure only when there is real evidence
              # of lost edits. See: fun-token-multi-chain PR #117.
              #
              # The script is bootstrapped to ${SUPPORT_SCRIPTS_DIR} by the
              # bootstrap step (REQUIRED_BOOTSTRAP_SCRIPTS).  Reading from
              # ${GITHUB_WORKSPACE}/scripts/ would silently skip the recheck
              # in every consumer repo (only the workflow-source repo
              # vendors this path), which is how the bitsafe.io PR #177 /
              # run 25653654000 false positive escaped this safety net.
              recheck_script="${SUPPORT_SCRIPTS_DIR}/detect_editor_changes_lost.sh"
              if [ -x "${recheck_script}" ]; then
                recheck_result="$(bash "${recheck_script}" "${EDITOR_SUMMARY_FILE}" 2>/dev/null || echo "true")"
                if [ "${recheck_result}" = "false" ]; then
                  echo "Notice: Change status: reported edited but working tree is clean and narrative claims no concrete changes; treating as false positive (no warning, auto-merge not blocked)."
                  has_real_changes="false"
                fi
              fi
            fi

            if [ "${has_real_changes}" = "true" ]; then
              if [ "${CAN_PUSH:-}" = "true" ]; then
                echo "::error::Editor claimed changes but no commit was produced. This indicates a mismatch between the editor summary and final git state (changes may have failed to persist, or may have been discarded during commit validation)."
              else
                echo "::error::Editor claimed changes but no commit was produced. Push is disabled (CAN_PUSH=${CAN_PUSH:-false}), so this does not necessarily indicate a tool persistence failure."
              fi
              echo "Editor-claimed changes:"
              printf '%s\n' "${changes_section}" | head -20
              EDITOR_CHANGES_LOST="true"
            fi
          fi

          echo "EDITOR_CHANGES_LOST=${EDITOR_CHANGES_LOST}" >> "$GITHUB_ENV"

      - name: Validate editor no-op disposition
        # When the editor claims no changes are needed (did_commit=false,
        # EDITOR_CHANGES_LOST=false), verify the claim is trustworthy
        # before allowing auto-merge.  Two failure modes can reach here
        # with a false "clean review" signal:
        #
        # 1. Editor completely failed (all retries exhausted) and the
        #    fallback summary was used — its "- none (editor failed...)"
        #    text passes the Changes-Lost filter but the editor never
        #    actually reviewed the code.
        #
        # 2. Editor ran but silently errored during code analysis,
        #    dismissing all reviewer issues without validating them.
        #    The audit section would show inconsistent counts.
        #
        # Sets EDITOR_NOOP_SUSPICIOUS=true to block auto-merge when
        # the no-op claim cannot be verified.
        # LEDGER_ONLY_COMMIT=true is treated the same as did_commit=false
        # here: the ledger is bookkeeping and does not count as a productive
        # editor change, so the no-op disposition still needs validation
        # before downstream clean-review gates fire. See PR #1472.
        #
        # Skip on max_iterations_reached runs (autofix cap hit, or
        # force_rb_judge=true short-circuit): in those modes the editor
        # is intentionally not invoked, so `EDITOR_SUMMARY_FILE` is
        # legitimately empty and there is no editor claim to validate.
        # Running this step would set EDITOR_NOOP_SUSPICIOUS=true off
        # the empty-summary branch (line below), which then gates off
        # the "Detect merge conflicts" and "Resolve merge conflicts"
        # steps (their `if:` filters on `EDITOR_NOOP_SUSPICIOUS != 'true'`
        # for defence-in-depth against a leaked MERGE_CONFLICT). The
        # net effect was a deadlock: an exhausted PR with merge
        # conflicts could never reach the Codex conflict resolver, and
        # the orchestrator-poll's `_dispatch_review_for_conflicts`
        # (scripts/orchestrate_poll_process.sh) kept re-dispatching the
        # same futile run every cycle. See PR #2667 / runs 25968901129+
        # for the original deadlock. Downstream auto-merge / mark-ready
        # gates that also consume `EDITOR_NOOP_SUSPICIOUS` already
        # short-circuit independently on `max_iterations_reached != 'true'`,
        # so leaving the env var unset on these runs does not relax any
        # auto-merge safety.
        if: "!cancelled() && steps.retrigger_guard.outputs.max_iterations_reached != 'true' && (steps.commit_changes.outputs.did_commit != 'true' || env.LEDGER_ONLY_COMMIT == 'true') && env.EDITOR_CHANGES_LOST != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'"
        run: |
          set -euo pipefail

          EDITOR_NOOP_SUSPICIOUS="false"
          # Additive refusal-specific signal (per CLAUDE.md §6 — do NOT
          # rename EDITOR_NOOP_SUSPICIOUS; add alongside). Set when the
          # fallback summary contains the "model refused (safety filter)"
          # sentinel that review_apply_fixes.sh writes after detecting an
          # OpenAI-style refusal. Lets downstream consumers (Telegram
          # alerts, operators) distinguish "model refused — re-run" from
          # generic "no-op suspicious — manual review".
          EDITOR_NOOP_REFUSAL="false"

          if [ ! -s "${EDITOR_SUMMARY_FILE:-}" ]; then
            echo "::warning::Editor summary file is missing or empty — editor never produced output."
            EDITOR_NOOP_SUSPICIOUS="true"
          else
            # ── Check 1: Detect editor fallback/failure markers ──
            # The fallback summary (review_apply_fixes.sh) writes known
            # sentinel phrases when all editor attempts fail.  These must
            # never reach auto-merge.
            if grep -qiE 'editor failed before producing|unavailable \(editor fallback\)' "${EDITOR_SUMMARY_FILE}"; then
              echo "::warning::Editor summary contains failure/fallback markers — editor never completed a validated review."
              EDITOR_NOOP_SUSPICIOUS="true"
            fi

            # ── Check 1b: Detect refusal-specific sentinel ──
            # When the editor model returns a safety-policy refusal,
            # review_apply_fixes.sh writes "Runtime failure path: -
            # model refused (safety filter)" into the fallback summary
            # alongside the existing failure markers. Check 1 above
            # already set EDITOR_NOOP_SUSPICIOUS=true via the existing
            # markers (which the refusal fallback preserves verbatim for
            # lockstep — see probably_unnecessary_but_read_if_stuck.md
            # §20.10). This additive check sets EDITOR_NOOP_REFUSAL=true
            # so a more specific alert can be surfaced downstream.
            if grep -qiE 'model refused \(safety filter\)' "${EDITOR_SUMMARY_FILE}"; then
              echo "::notice::Editor returned a safety-policy refusal — re-run is likely to succeed once the provider-side cache expires."
              EDITOR_NOOP_REFUSAL="true"
            fi

            # ── Check 2: Reviewer audit sanity ──
            # When reviewer execution succeeded (REVIEWERS_SUCCESSFUL > 0)
            # but the editor claims no changes, verify the audit section has
            # real entries and the arithmetic adds up. The check itself
            # lives in scripts/validate_editor_audit.sh so the orchestrator
            # poll's noop-suspicious recovery sweep can call the exact
            # same regex/arithmetic logic when deciding whether a
            # force-merge fallback is safe — keeping the two paths in
            # lockstep prevents drift between "what the workflow flagged
            # as noop-suspicious" and "what the poller considers an
            # audit-healthy fallback candidate".
            if [ "${EDITOR_NOOP_SUSPICIOUS}" = "false" ] && [ "${REVIEWERS_SUCCESSFUL:-0}" -gt 0 ]; then
              # shellcheck disable=SC1091
              source "${SUPPORT_SCRIPTS_DIR}/validate_editor_audit.sh"
              _vea_rc=0
              validate_editor_audit_arithmetic \
                "${EDITOR_SUMMARY_FILE}" \
                "${REVIEWERS_SUCCESSFUL:-0}" \
                || _vea_rc=$?
              if [ "${_vea_rc}" -ne 0 ]; then
                EDITOR_NOOP_SUSPICIOUS="true"
              fi
            fi
          fi

          echo "EDITOR_NOOP_SUSPICIOUS=${EDITOR_NOOP_SUSPICIOUS}" >> "$GITHUB_ENV"
          echo "EDITOR_NOOP_REFUSAL=${EDITOR_NOOP_REFUSAL}" >> "$GITHUB_ENV"

      - name: Detect merge conflicts
        # The pre-review gate above only short-circuits deterministic stale/
        # structurally-unmergeable cases before reviewer spend. This late step
        # remains the authoritative MERGE_CONFLICT + resolver entry point for
        # ordinary content conflicts on runs that still reach the editor tail.
        # Run conflict detection regardless of max_iterations_reached or
        # did_commit — merge conflicts are independent of the autofix cycle.
        # When did_commit is true the autofix commit already happened (push is
        # deferred), and HEAD is up to date, so the merge-base check is valid.
        # Actual
        # resolution is gated separately below.
        #
        # Skip when EDITOR_NOOP_SUSPICIOUS=true on ordinary editor-tail runs:
        # the editor never produced a validated commit, so even a successful
        # conflict resolver run would have nothing fix-related to push. This
        # does not apply when max_iterations_reached=true, because the
        # disposition step is skipped in that mode and conflict resolution is
        # independent of the editor cycle. Running merge detection here
        # otherwise wastes ~30s and — if the defensive fallback at the end of
        # this step trips on an unrelated git issue — sets MERGE_CONFLICT=true,
        # which in turn fires the (futile) Codex resolver and produces a
        # `FAILED_STEPS=1` cascade that the e2e poller treats as the proximate
        # failure (analysis: e2e-smoke-failure-25126757724.md §B/D).
        if: success() && env.CAN_PUSH == 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true' && env.EDITOR_NOOP_SUSPICIOUS != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          echo "Checking for merge conflicts"
          echo "MERGE_CONFLICT=false" >> "$GITHUB_ENV"
          echo "CONFLICT_RESOLVED=false" >> "$GITHUB_ENV"

          # git merge requires a clean working tree.  Save untracked dirs
          # (like scripts/, prompts/) so they survive into the
          # conflict-resolver step instead of being destroyed by git clean.
          UNTRACKED_BACKUP="$(mktemp -d)"
          for d in scripts prompts; do
            if [ -d "${d}" ]; then
              cp -a "${d}" "${UNTRACKED_BACKUP}/${d}"
            fi
          done
          # Explicitly remove known CI-generated files before reset/clean.
          # In consumer repos these files are fetched at runtime (untracked);
          # git reset --hard does not remove untracked files, so they linger
          # and cause "Untracked working tree file would be overwritten" when
          # git merge later tries to write the same path from origin/BASE_BRANCH.
          # In the source repo these files are tracked, so git reset --hard HEAD
          # will restore them after this removal — no data loss occurs.
          rm -f scripts/ai_memory.py scripts/ai_memory_lib.py scripts/memory_helpers.sh scripts/openrouter_prompt_cache.py scripts/cost_audit.py scripts/codex_heartbeat.sh scripts/review_run_reviewers.sh scripts/review_apply_fixes.sh scripts/review_rb_judge.sh scripts/pr_checks_lib.sh scripts/summarize_reviewer_consensus.sh scripts/check_external_branch_advance.sh 2>/dev/null || true
          git reset --hard HEAD
          # Use -ffdx: double-force clears nested git repos (-ff), and -x also
          # removes files matching .gitignore so nothing
          # ignored can survive to block the upcoming merge simulation.
          git clean -ffdx -e .codex-workflow-src -e .codex-workflow-src-main

          # The scripts may have been removed during artifact cleanup in the
          # commit step (caller repos delete fetched scripts before committing)
          # or wiped by git clean -ffdx above.
          # Re-stage any missing scripts from checked-out support source.
          for f in gh_helpers.sh pr_checks_lib.sh git_ref_health_check.sh tg_helpers.sh label_helpers.sh cost_audit.py codex_helpers.sh codex_heartbeat.sh review_run_reviewers.sh review_apply_fixes.sh review_rb_judge.sh check_workflow_script_refs.py check_resolver_diff.sh summarize_reviewer_consensus.sh watchdog_helpers.sh check_external_branch_advance.sh workspace_safety_check.sh; do
            if [ ! -f "${SUPPORT_SCRIPTS_DIR}/${f}" ]; then
              mkdir -p "${SUPPORT_SCRIPTS_DIR}"
              src="${GITHUB_WORKSPACE}/.codex-workflow-src/scripts/${f}"
              if [ ! -f "${src}" ] && [ -f "${GITHUB_WORKSPACE}/.codex-workflow-src-main/scripts/${f}" ]; then
                src="${GITHUB_WORKSPACE}/.codex-workflow-src-main/scripts/${f}"
              fi
              if [ ! -f "${src}" ]; then
                echo "::warning::${f} not found in checked-out support source; downstream steps that need it will fail with a specific error."
                rm -f "${SUPPORT_SCRIPTS_DIR}/${f}"
                continue
              fi
              install -m 0755 "${src}" "${SUPPORT_SCRIPTS_DIR}/${f}"
            fi
          done
          bash "${SUPPORT_SCRIPTS_DIR}/git_ref_health_check.sh" repair
          git fetch --no-tags --prune origin "refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

          # Ensure the merge-base between HEAD and origin/<base> is reachable
          # in the local clone before invoking `git merge --no-commit` below.
          # The codex-agent's "Checkout repo" step uses fetch-depth: 100 to
          # bound clone size on history-heavy consumer repos.  On long-running
          # PRs (e.g. orchestrator integration branches that have lived through
          # many base-branch advances) the merge-base may sit deeper than the
          # shallow boundary.  Without this guard, `git merge origin/<base>`
          # would fail with "refusing to merge unrelated histories" — which
          # the existing handler below would surface as a (misleading)
          # force-push / orphan-root error requiring manual repair.  Deepen
          # iteratively, falling back to --unshallow as a last resort.
          # Fail-open: if the deepen path fails, the merge precheck below
          # will still run and its existing error handling will catch it.
          #
          # Refspec discipline: every `git fetch` here passes explicit
          # refspecs limited to BASE_BRANCH + (when known) TARGET_BRANCH.
          # Without them, `git fetch ... origin` defers to the default
          # `remote.origin.fetch = +refs/heads/*:refs/remotes/origin/*`
          # and would pull every remote branch on each deepen call —
          # undoing the fetch-depth: 100 budget this PR is trying to
          # enforce.  Either side of the merge-base reaching its full
          # ancestor is sufficient for git merge-base to resolve, so
          # deepening just these two refs is enough.
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            _merge_base_refspecs=("refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}")
            if [ -n "${TARGET_BRANCH:-}" ]; then
              _merge_base_refspecs+=("refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}")
            fi
            _merge_base_deepen_iter=0
            while [ "${_merge_base_deepen_iter}" -lt 4 ]; do
              if git merge-base "origin/${BASE_BRANCH}" HEAD >/dev/null 2>&1; then
                break
              fi
              _merge_base_deepen_iter=$((_merge_base_deepen_iter + 1))
              echo "merge-base origin/${BASE_BRANCH}…HEAD unreachable in shallow clone — deepening (attempt ${_merge_base_deepen_iter}/4) on refs: ${_merge_base_refspecs[*]}."
              if ! git fetch --no-tags --prune --deepen=200 origin "${_merge_base_refspecs[@]}" 2>/dev/null; then
                echo "::warning::git fetch --deepen=200 origin ${_merge_base_refspecs[*]} failed during merge-base deepen-on-miss; falling back to --unshallow on the same refs."
                git fetch --no-tags --prune --unshallow origin "${_merge_base_refspecs[@]}" 2>/dev/null || true
                break
              fi
            done
            if ! git merge-base "origin/${BASE_BRANCH}" HEAD >/dev/null 2>&1; then
              echo "::warning::merge-base origin/${BASE_BRANCH}…HEAD still unreachable after deepen attempts; trying final --unshallow on refs: ${_merge_base_refspecs[*]}."
              git fetch --no-tags --prune --unshallow origin "${_merge_base_refspecs[@]}" 2>/dev/null || true
            fi
          fi

          # Ensure committer identity is available — git merge (even with
          # --no-commit) requires it when recording a merge result.  Earlier
          # steps may set this, but after git clean / reset it can be lost if
          # the runner has no global git config.
          git config user.name  "codex-bot"        2>/dev/null || true
          git config user.email "codex@users.noreply.github.com" 2>/dev/null || true

          # Move untracked content out of the working tree so it doesn't
          # collide with files coming from origin/BASE_BRANCH during the
          # merge simulation.  "git merge" refuses to proceed when untracked
          # files would be overwritten by the merge result.
          #
          # IMPORTANT: tracked files MUST remain in the working tree so that
          # the index and working tree agree when git merge is invoked.
          # Moving tracked files out of the tree causes
          # "Entry … not uptodate. Cannot merge." errors and prevents
          # git merge --abort from resetting cleanly afterward.
          MERGE_STASH="$(mktemp -d)"
          for d in scripts prompts ai-memory .codex-workflow-src .codex-workflow-src-main; do
            if [ -d "${d}" ]; then
              if git ls-files -- "${d}/" 2>/dev/null | grep -q .; then
                # Directory contains tracked files — move only the untracked
                # files individually so tracked files stay in place and the
                # index remains consistent with the working tree.
                # Preserve full relative-path structure to avoid collisions
                # between files with identical names in different subdirs.
                while IFS= read -r f; do
                  [ -n "${f}" ] && [ -e "${f}" ] && {
                    mkdir -p "${MERGE_STASH}/$(dirname "${f}")"
                    mv "${f}" "${MERGE_STASH}/${f}"
                  }
                done < <(git ls-files --others -- "${d}/")
              else
                # Directory is entirely untracked — safe to move as a whole.
                mv "${d}" "${MERGE_STASH}/${d}"
              fi
            fi
          done

          # Safety net: clean any remaining untracked files (including
          # .gitignore'd ones) that the MERGE_STASH loop may have missed.
          # git merge refuses to proceed when an untracked working-tree file
          # would be overwritten; this ensures the tree is fully clean before
          # the merge simulation.  Tracked files are never removed by git clean.
          git clean -ffdx -e .codex-workflow-src -e .codex-workflow-src-main 2>/dev/null || true

          # Guardrail diagnostics: emit working tree state before merge so any
          # future untracked-file collision is immediately obvious in CI logs.
          echo "=== pre-merge working tree state ==="
          git status --porcelain 2>/dev/null || true
          _pre_merge_untracked="$(git ls-files --others --exclude-standard 2>/dev/null || true)"
          if [ -n "${_pre_merge_untracked}" ]; then
            echo "untracked files:"
            printf '%s\n' "${_pre_merge_untracked}" | head -20
          fi
          echo "====================================="

          merge_exit=0
          # Capture git merge stderr so the failure annotation can surface
          # the real cause (e.g. "refusing to merge unrelated histories",
          # "Untracked working tree file … would be overwritten by merge").
          # The previous implementation hard-coded "untracked files or a
          # corrupted working tree" in the ::error:: annotation, which was
          # misleading whenever git's actual complaint was something else.
          MERGE_STDERR_FILE="$(mktemp)"
          trap 'rm -f "${MERGE_STDERR_FILE}"' EXIT
          git merge --no-commit --no-ff "origin/${BASE_BRANCH}" 2> "${MERGE_STDERR_FILE}" || merge_exit=$?
          # Echo captured stderr so it remains visible in the raw step log
          # even when we wrap it in an annotation below.
          if [ -s "${MERGE_STDERR_FILE}" ]; then
            sed 's/^/git merge stderr: /' "${MERGE_STDERR_FILE}"
          fi

          # Restore the stashed dirs so later steps have them available.
          for d in scripts prompts ai-memory .codex-workflow-src .codex-workflow-src-main; do
            if [ -d "${MERGE_STASH}/${d}" ]; then
              # Use cp + rm instead of mv to handle the case where the merge
              # already created the directory (e.g. scripts/ from main).
              cp -a "${MERGE_STASH}/${d}/." "${d}/" 2>/dev/null || cp -a "${MERGE_STASH}/${d}" "${d}"
            fi
          done
          rm -rf "${MERGE_STASH}"

          # If the merge command itself failed (e.g. missing identity, corrupt
          # refs, or untracked file collision) WITHOUT producing unmerged index
          # entries, we must not silently report "no conflicts".  Treat an
          # unexpected merge failure as a conflict so the resolver step can
          # attempt a proper merge.
          if [ -z "$(git ls-files --unmerged)" ]; then
            if [ "${merge_exit}" -ne 0 ] && [ ! -f "$(git rev-parse --git-dir)/MERGE_HEAD" ]; then
              # Flatten the captured stderr onto a single line for the
              # annotation (::error:: notations cannot span newlines).
              _merge_stderr_oneline="$(tr '\n' ' ' < "${MERGE_STDERR_FILE}" 2>/dev/null | sed 's/[[:space:]]\+/ /g; s/^ //; s/ $//')"
              _merge_stderr_oneline="${_merge_stderr_oneline:-<git merge produced no stderr>}"
              _merge_stderr_oneline="$(printf '%s' "${_merge_stderr_oneline}" | sed 's/%/%25/g; s/\r/%0D/g')"
              if grep -qi 'refusing to merge unrelated histories' "${MERGE_STDERR_FILE}" 2>/dev/null; then
                _head_sha="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
                _base_sha="$(git rev-parse --short "origin/${BASE_BRANCH}" 2>/dev/null || echo unknown)"
                echo "::error::Merge precheck failed (exit ${merge_exit}): HEAD (${_head_sha}) and origin/${BASE_BRANCH} (${_base_sha}) have no common ancestor. This PR's branch was likely force-pushed to an orphan root, or ${BASE_BRANCH} was force-pushed since this branch diverged. Manual repair required: rebase the PR branch onto a current ${BASE_BRANCH} ancestor, or recreate the branch from ${BASE_BRANCH} and re-apply the changes. git stderr: ${_merge_stderr_oneline}"
              elif [ "${merge_exit}" -eq 128 ]; then
                echo "::error::Merge precheck failed (exit 128): git merge aborted before entering merge state. See pre-merge diagnostics above. git stderr: ${_merge_stderr_oneline}"
              else
                echo "::warning::git merge exited ${merge_exit} without entering merge state — treating as conflict. git stderr: ${_merge_stderr_oneline}"
              fi
              rm -f "${MERGE_STDERR_FILE}"
              echo "Merge conflict detected (merge command failed)"
              echo "MERGE_CONFLICT=true" >> "$GITHUB_ENV"
              for d in scripts prompts; do
                if [ -d "${UNTRACKED_BACKUP}/${d}" ]; then
                  cp -a "${UNTRACKED_BACKUP}/${d}" .
                fi
              done
              rm -rf "${UNTRACKED_BACKUP}"
              exit 0
            fi
            echo "No merge conflicts detected"
            # Only abort if a merge is actually in progress (MERGE_HEAD exists).
            # When the branch is already up-to-date, git merge succeeds immediately
            # without entering merge state, so there is nothing to abort.
            # Cleanup is best-effort: merge --abort and reset can fail when
            # the index is in an inconsistent state.  Use || true so cleanup
            # never hard-fails the job.
            if [ -f "$(git rev-parse --git-dir)/MERGE_HEAD" ]; then
              git merge --abort || true
            fi
            git reset --hard HEAD || true
            git clean -fd || true
            rm -rf "${UNTRACKED_BACKUP}"
            rm -f "${MERGE_STDERR_FILE}"
            exit 0
          else
            echo "Merge conflict detected"
            echo "MERGE_CONFLICT=true" >> "$GITHUB_ENV"
            # Conflict path is non-fatal: abort the simulated merge so the
            # working tree is clean for the conflict-resolver step, then
            # restore env dirs and exit 0.  The job must not fail here —
            # human review or the resolver step handles the actual conflict.
            # Cleanup is best-effort; || true prevents exit 128 from a
            # failed abort/reset from surfacing as a job failure.
            if [ -f "$(git rev-parse --git-dir)/MERGE_HEAD" ]; then
              git merge --abort || true
            fi
            # Restore untracked dirs so the conflict resolver's codex exec
            # has its full environment (scripts/, prompts/).
            for d in scripts prompts; do
              if [ -d "${UNTRACKED_BACKUP}/${d}" ]; then
                cp -a "${UNTRACKED_BACKUP}/${d}" .
              fi
            done
          fi
          rm -rf "${UNTRACKED_BACKUP}"
          rm -f "${MERGE_STDERR_FILE}"

      - name: Prepare merge-conflict resolver prompt and pre-snapshot
        # Split from "Run Codex resolver, validate, stage, commit" below so
        # that neither run: block exceeds GitHub Actions' 21,000-char
        # template-expression limit. A single combined step used to weigh in
        # at 24.6 KB and silently broke review_autofix.yml's parseability
        # from internal-review.yml. Both halves share the identical if:
        # condition so they short-circuit together.
        #
        # Run conflict resolution even when max_iterations_reached — conflict
        # resolution is not an autofix iteration and should not be blocked by
        # the iteration cap.  Also runs when did_commit is true since the push
        # is deferred — both autofix and conflict resolution are pushed together.
        #
        # The EDITOR_NOOP_SUSPICIOUS != 'true' clause mirrors the gate on
        # "Detect merge conflicts" above: on ordinary editor-tail runs, if the
        # editor never produced a validated commit, that step was also skipped
        # and left MERGE_CONFLICT unset. We repeat the guard for defence-in-
        # depth in case future code paths set MERGE_CONFLICT outside that
        # step. On max_iterations_reached runs, EDITOR_NOOP_SUSPICIOUS stays
        # unset, so this guard is a no-op and MERGE_CONFLICT can legitimately
        # come from the detect step above.
        if: success() && env.CAN_PUSH == 'true' && env.MERGE_CONFLICT == 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true' && env.EDITOR_NOOP_SUSPICIOUS != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          bash "${SUPPORT_SCRIPTS_DIR}/review_conflict_prepare.sh"

      - name: Run Codex resolver, validate, stage, commit
        # Second half of the split merge-conflict resolver step. Carries the
        # identical if: condition as the prepare step above so the two halves
        # short-circuit together — any change to one must be mirrored to the
        # other. See the comment block on the prepare step for why the step
        # was split.
        #
        # timeout-minutes is the safety net for a hung codex exec call.  The
        # script-internal retry loop does up to INTEGRATION_SYNC_RESOLVER_MAX_
        # ATTEMPTS=3 attempts, with the no-progress check biting after attempt
        # 2 when fingerprint violations are stable.  Per-attempt cap is
        # CONFLICT_RESOLVER_PER_ATTEMPT_TIMEOUT_SECS=3000 (50 min, raised from
        # 18 min after run 25629086684 / PR #2865 on tele-funtoken-msg-scoring
        # where every attempt hit the previous 18-min ceiling without ever
        # producing apply_patch on a 7-file mixed-implementation merge).
        # 3 × 50 min = 150 min fits inside the 170-min step cap with ~20 min
        # for soft validation, commit, and the EXIT-trap dispatch.  The
        # surrounding job's timeout-minutes (240 — see the `timeout-minutes:`
        # setting on the codex-agent job earlier in this workflow) was sized
        # to fit ~24 min of pre-resolver work (disk cleanup, checkout, codex
        # install, runtime workspace, prompt prep, reviewers, editor) plus
        # this 170-min step cap plus ~46 min of post-resolver work, so the
        # EXIT trap is reachable even when every retry uses its full
        # per-attempt budget.  On hit, the EXIT trap in
        # review_conflict_resolve.sh fires the immediate orchestrator-poll
        # dispatch so the integration judge takes over without waiting for
        # the */5 cron tick.
        if: success() && env.CAN_PUSH == 'true' && env.MERGE_CONFLICT == 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true' && env.EDITOR_NOOP_SUSPICIOUS != 'true'
        timeout-minutes: 170
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RESOLVER_ESCAPE_THRESHOLD_N: ${{ vars.RESOLVER_ESCAPE_THRESHOLD_N || '5' }}
          # Decoupled from EDITOR_REASONING_EFFORT: the smoke-test override
          # ("Detect smoke test PR" step) sets editor reasoning to "none" so
          # the single-line bait removal completes deterministically. That
          # patches ~/.codex/config.toml, which the conflict resolver below
          # would otherwise inherit. With reasoning=none the legacy
          # the legacy editor default hit an empty-stdout failure mode on this
          # fixture (documented on the editor step
          # ("Switch reasoning effort for editor"): it runs one read tool
          # call, exits cleanly with rc=0 and zero stdout, and the retry
          # loop bails after MAX_ATTEMPTS with no edits. Observed on PR
          # #2058 / run 25300219172 where the resolver was given a 1-line
          # canary conflict, never wrote a final message, and the
          # [ai-merge-resolve] commit was aborted. Pin the resolver to a
          # workflow-controlled effort so the smoke override never starves
          # it.
          #
          # Default lowered from 'xhigh' to 'high' after runs 25627236793
          # (PR shubhodeep1/tele-funtoken-msg-scoring#2874) and
          # 25627316961 (PR #2867) on the orchestrator/project-2840
          # stack hit a hung-thinking failure mode at 'xhigh': Codex
          # consumed the full 1080s per-attempt budget enumerating
          # duplicate helper definitions outside the conflict markers
          # and was SIGTERMed by `timeout` before invoking apply_patch
          # on all three retry attempts (markers=0,
          # fingerprint_violations=0 on every retry — the unambiguous
          # signature of `timeout` firing pre-patch). 'high' trades some
          # merge depth for finishing inside the per-attempt budget on
          # degenerate orchestrator-stack integrations. The smoke-test
          # starvation rationale above still holds at 'high'; the only
          # level that triggered it was 'none'. Consumers can override
          # per-repo via vars.THINKING_LEVEL_CONFLICT_RESOLVER; valid
          # levels (review_conflict_resolve.sh) are
          # xhigh, high, medium, none.
          CONFLICT_RESOLVER_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_CONFLICT_RESOLVER || 'high' }}
        run: |
          set -euo pipefail
          if [ -f "${SUPPORT_SCRIPTS_DIR}/label_helpers.sh" ]; then
            source "${SUPPORT_SCRIPTS_DIR}/label_helpers.sh" 2>/dev/null || true
            ensure_label_exists "ai:resolver-escalated" "${{ github.repository }}" || true
          fi
          # Parse guard for the staged resolver helper. Runtime support
          # files now stage out of tree even on the workflow source
          # repo, so merge-replay markers in the PR worktree no longer
          # poison SUPPORT_SCRIPTS_DIR. Keep the fallback below as
          # defence in depth in case the staged resolver copy is ever
          # truncated or otherwise unparsable.
          # The .codex-workflow-src/ checkout (pinned to SCRIPT_REF) is
          # untouched by merge replay, so it remains a clean fallback
          # source when the staged script fails `bash -n`.
          RESOLVER_SCRIPT="${SUPPORT_SCRIPTS_DIR}/review_conflict_resolve.sh"
          # Capture bash -n stderr (instead of redirecting to /dev/null)
          # and surface a sanitized copy in every fallback annotation so
          # operators debugging a workflow run can tell an unresolved-
          # merge-marker failure apart from a truncated file, a missing
          # dependency reference, or any other parse-time issue without
          # having to re-run the job locally.  Multi-line stderr is
          # preserved by URL-encoding newlines as `%0A` (the workflow-
          # command-encoding spec for annotation messages) instead of
          # collapsing to a single line, so a multi-line `bash -n`
          # diagnostic — e.g. several syntax errors on different lines
          # of the same script — renders with its original line breaks
          # in the annotation body.  `%` and `\r` are still escaped to
          # match the "Detect merge conflicts" step's sanitisation.
          #
          # Probe a candidate resolver path and echo one of:
          #   ok | missing | parse_fail:<sanitized annotation-safe stderr>
          # The state string is embedded verbatim in the
          # warning/error annotation below so the triple-failure path
          # (in-tree corrupted AND both fallbacks unavailable or
          # unparseable) reports each fallback's distinct state +
          # captured stderr — addresses #2466 review feedback that
          # the prior implementation suppressed fallback stderr and
          # conflated missing-file with parse-failure under a single
          # "unavailable/unparseable" label.
          _probe_resolver() {
            local path="$1" err
            if [ ! -f "${path}" ]; then
              printf '%s\n' "missing"
              return
            fi
            # `bash -n` writes diagnostics to stderr only; merge them
            # into the command substitution with `2>&1` so the err= capture
            # actually receives them.  Keep the probe to `2>&1` only:
            # `bash -n` is stderr-only here, so extra stdout redirection is
            # unnecessary and would only make the capture semantics harder
            # to reason about.
            if err="$(bash -n "${path}" 2>&1)"; then
              printf '%s\n' "ok"
            else
              err="$(printf '%s' "${err}" | sed 's/%/%25/g; s/\r/%0D/g' | awk 'BEGIN{ORS=""} NR>1{print "%0A"} {print}')"
              printf 'parse_fail:%s\n' "${err:-<no stderr captured>}"
            fi
          }
          _primary_state="$(_probe_resolver "${RESOLVER_SCRIPT}")"
          if [ "${_primary_state}" != "ok" ]; then
            _fb1="${GITHUB_WORKSPACE}/.codex-workflow-src/scripts/review_conflict_resolve.sh"
            _fb2="${GITHUB_WORKSPACE}/.codex-workflow-src-main/scripts/review_conflict_resolve.sh"
            _fb1_state="$(_probe_resolver "${_fb1}")"
            if [ "${_fb1_state}" = "ok" ]; then
              echo "::warning::Resolver entry-point check: ${RESOLVER_SCRIPT}=${_primary_state} (likely unresolved conflict markers from the merge replay); falling back to ${_fb1} (SCRIPT_REF=${SCRIPT_REF:-unknown})."
              RESOLVER_SCRIPT="${_fb1}"
            else
              _fb2_state="$(_probe_resolver "${_fb2}")"
              if [ "${_fb2_state}" = "ok" ]; then
                echo "::warning::Resolver entry-point check: ${RESOLVER_SCRIPT}=${_primary_state}; ${_fb1}=${_fb1_state}; falling back to ${_fb2}."
                RESOLVER_SCRIPT="${_fb2}"
              else
                echo "::error::Resolver entry-point check: ${RESOLVER_SCRIPT}=${_primary_state}; ${_fb1}=${_fb1_state}; ${_fb2}=${_fb2_state}. No clean resolver entry-point available."
                exit 2
              fi
            fi
          fi
          bash "${RESOLVER_SCRIPT}"

      - name: Cache linked issues references
        # Claude-branch-review mode skips all the downstream label-mutating
        # steps (Mark linked issues ready to merge, Mark linked issues
        # review-blocked, etc.) so refreshing LINKED_ISSUES_JSON would be
        # wasted API calls.
        if: always() && env.PR_CLOSED != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          # Reuse LINKED_ISSUES_JSON from the early "Collect PR metadata" step
          # which already fetched closingIssuesReferences via GraphQL (with
          # title+body). Treat any set value (including "[]") as cached to
          # avoid duplicate API calls in the common no-linked-issues case.
          if [ -n "${LINKED_ISSUES_JSON+x}" ]; then
            if [ -n "${LINKED_ISSUES_JSON:-}" ] && [ "${LINKED_ISSUES_JSON}" != "[]" ]; then
              _linked_count="$(printf '%s' "${LINKED_ISSUES_JSON}" | jq -r 'length' 2>/dev/null || echo '0')"
              _linked_numbers="$(printf '%s' "${LINKED_ISSUES_JSON}" | jq -r '[.[].number] | join(", ")' 2>/dev/null || true)"
              if [ -n "${_linked_numbers}" ]; then
                echo "Linked issues already cached from early fetch: count=${_linked_count}; numbers=${_linked_numbers}"
              else
                echo "Linked issues already cached from early fetch: count=${_linked_count}"
              fi
            else
              echo "Linked issues already cached from early fetch."
            fi
          else
            if [ -n "${SUPPORT_SCRIPTS_DIR:-}" ] && [ -f "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" ]; then
              source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true
            fi
            type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
            if LINKED_ISSUES_JSON="$(gh_retry gh api graphql \
              -f owner="${REPOSITORY%/*}" \
              -f name="${REPOSITORY#*/}" \
              -F number="${PR_NUMBER}" \
              -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { closingIssuesReferences(first: 50) { nodes { number } } } } }' \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes // []')"; then
              :
            else
              echo "::warning::Failed to refresh linked issues references; proceeding with empty linked issue list."
              LINKED_ISSUES_JSON='[]'
            fi
            LINKED_ISSUES_JSON="$(printf '%s' "${LINKED_ISSUES_JSON}" | jq -c '.' 2>/dev/null || echo '[]')"
            printf 'LINKED_ISSUES_JSON=%s\n' "${LINKED_ISSUES_JSON}" >> "$GITHUB_ENV"
          fi

      - name: Telegram conflict resolution message
        if: success() && env.CONFLICT_RESOLVED == 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
        run: |
          source "${SUPPORT_SCRIPTS_DIR}/tg_helpers.sh"
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true
          PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/${PR_NUMBER}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ISSUE_NUM="$(echo "${LINKED_ISSUES_JSON:-[]}" | jq -r '.[0].number // empty' 2>/dev/null || true)"
          MSG="Merge conflicts resolved automatically"
          MSG+=$'\n'
          MSG+="PR: ${PR_URL}"
          if [ -n "${ISSUE_NUM}" ]; then
            MSG+=$'\n'
            MSG+="Issue: ${{ github.server_url }}/${{ github.repository }}/issues/${ISSUE_NUM}"
          fi
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_tracked "${PR_NUMBER}" "${MSG}" "DEBUG"

      - name: Mark linked issues ready to merge
        # Clean-review-tail gate: did_commit=false OR LEDGER_ONLY_COMMIT_STRICT=true.
        # We deliberately read the STRICT flag (not LEDGER_ONLY_COMMIT) because
        # the non-strict flag is also set by the audit-convergence branch in
        # scripts/review_commit_changes.sh, which can fire on commits that DID
        # land real source-file edits. Reading the loose flag here would mark
        # the linked issue ai:ready-to-merge for a run whose committed edits
        # have not yet been re-reviewed. See PR #2542 (mergedAt 12:36:08Z on
        # head f11d6dc while editor commit 005824e was still local) and the
        # docstring at scripts/review_commit_changes.sh:32-41 for the same
        # rationale that already governs EDITOR_CHANGES_LOST at :3315-3326.
        if: "success() && (steps.retrigger_guard.outputs.max_iterations_reached != 'true' || steps.retrigger_guard.outputs.skip_judge == 'true') && (steps.commit_changes.outputs.did_commit != 'true' || env.LEDGER_ONLY_COMMIT_STRICT == 'true') && env.MERGE_CONFLICT != 'true' && env.PR_CLOSED != 'true' && env.EDITOR_CHANGES_LOST != 'true' && env.EDITOR_NOOP_SUSPICIOUS != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          if [ -f "${SUPPORT_SCRIPTS_DIR}/label_helpers.sh" ]; then
            source "${SUPPORT_SCRIPTS_DIR}/label_helpers.sh"
          else
            # Fetched helper artifacts can be removed in caller repos during
            # commit cleanup; keep a local fallback for this late stage.
            ensure_label_exists() {
              local label_name="$1"
              local repo="$2"
              case "${label_name}" in
                ai:ready-to-merge)
                  gh_retry gh label create "${label_name}" --repo "${repo}" --color "0e8a16" --description "PR review complete and ready to merge" 2>/dev/null || true
                  ;;
                ai:closed)
                  gh_retry gh label create "${label_name}" --repo "${repo}" --color "6a737d" --description "Linked PR closed without merge" 2>/dev/null || true
                  ;;
                *)
                  gh_retry gh label create "${label_name}" --repo "${repo}" --color "1d76db" --description "AI workflow label" 2>/dev/null || true
                  ;;
              esac
            }
            set_issue_phase_label_resilient() {
              local issue_number="$1"
              local target_label="$2"
              local repo="$3"
              ensure_label_exists "${target_label}" "${repo}" || true
              gh_retry gh api -X POST "repos/${repo}/issues/${issue_number}/labels" \
                -f "labels[]=${target_label}" >/dev/null 2>&1 \
                || echo "::warning::Fallback label add failed for #${issue_number}."
            }
          fi
          if ! type set_issue_phase_label_resilient >/dev/null 2>&1; then
            set_issue_phase_label_resilient() {
              local issue_number="$1"
              local target_label="$2"
              local repo="$3"
              ensure_label_exists "${target_label}" "${repo}" || true
              gh_retry gh api -X POST "repos/${repo}/issues/${issue_number}/labels" \
                -f "labels[]=${target_label}" >/dev/null 2>&1 \
                || echo "::warning::Fallback label add failed for #${issue_number}."
            }
          fi

          ISSUE_NUMBERS="$(echo "${LINKED_ISSUES_JSON:-[]}" | jq -r '.[].number' 2>/dev/null || true)"

          if [ -z "${ISSUE_NUMBERS}" ]; then
            ISSUE_NUMBERS="$(printf '%s' "${LINKED_ISSUE_FALLBACK_NUMBERS_JSON:-[]}" | jq -r '.[]' 2>/dev/null || true)"
          fi

          if [ -z "${ISSUE_NUMBERS}" ]; then
            # Fallback: strict current-repo closing-keyword refs and repo-scoped issue URLs/paths only.
            PR_DATA="$(jq -r '[.title // "", .body // ""] | join(" ")' "${PR_META_FILE}" 2>/dev/null || echo "")"
            if [ -z "$(printf '%s' "${PR_DATA}" | tr -d '[:space:]')" ]; then
              PR_DATA="$(gh_retry gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title + " " + (.body // "")' 2>/dev/null || echo "")"
            fi
            if type extract_repo_scoped_issue_refs_from_text >/dev/null 2>&1; then
              ISSUE_NUMBERS="$(extract_repo_scoped_issue_refs_from_text "${REPOSITORY}" "${PR_DATA}" || true)"
            else
              ISSUE_NUMBERS=""
            fi
            if [ -z "${ISSUE_NUMBERS}" ]; then
              echo "No linked issues found for PR #${PR_NUMBER} (even after body/title fallback)."
              exit 0
            fi
            echo "Found linked issues via PR body/title fallback: ${ISSUE_NUMBERS}"
          fi

          ensure_label_exists "ai:ready-to-merge" "${REPOSITORY}"
          while IFS= read -r issue_number; do
            [ -n "${issue_number}" ] || continue
            echo "Setting ai:ready-to-merge on issue #${issue_number}"
            set_issue_phase_label_resilient "${issue_number}" "ai:ready-to-merge" "${REPOSITORY}"
          done <<< "${ISSUE_NUMBERS}"
      - name: Detect review-blocked break-glass override
        if: success() && steps.retrigger_guard.outputs.max_iterations_reached == 'true' && steps.retrigger_guard.outputs.skip_judge != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        run: |
          set -euo pipefail
          echo "REVIEW_BREAK_GLASS=false" >> "$GITHUB_ENV"
          echo "REVIEW_BREAK_GLASS_COMMENTER=" >> "$GITHUB_ENV"

          case "$(printf '%s' "${REVIEW_BREAK_GLASS_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on) ;;
            *) exit 0 ;;
          esac

          if [ ! -s "${PR_ISSUE_COMMENTS_FILE:-}" ] && [ ! -s "${PR_REVIEWS_FILE:-}" ]; then
            echo "Review-blocked break-glass scan inputs missing; continuing with override disabled."
            exit 0
          fi

          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          import re
          from pathlib import Path

          issue_comments_path = os.environ.get("PR_ISSUE_COMMENTS_FILE", "")
          reviews_path = os.environ.get("PR_REVIEWS_FILE", "")
          pattern = re.compile(r"^@codex break-glass\b")

          def load(path_text: str):
              if not path_text:
                  return []
              path = Path(path_text)
              if not path.exists() or path.stat().st_size == 0:
                  return []
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  return []
              if not isinstance(data, list):
                  return []
              return [item for item in data if isinstance(item, dict)]

          matches = []
          for entry in load(issue_comments_path) + load(reviews_path):
              user = entry.get("user") or {}
              if not isinstance(user, dict) or user.get("type") != "User":
                  continue
              body = entry.get("body")
              if not isinstance(body, str) or not pattern.match(body):
                  continue
              sort_key = entry.get("created_at") or entry.get("submitted_at") or entry.get("updated_at") or ""
              try:
                  ident = int(entry.get("id") or 0)
              except (TypeError, ValueError):
                  ident = 0
              matches.append((sort_key, ident, str(user.get("login") or "unknown")))

          if matches:
              matches.sort()
              print("REVIEW_BREAK_GLASS=true")
              print(f"REVIEW_BREAK_GLASS_COMMENTER={matches[-1][2]}")
          PY

      - name: Review-blocked judge decision
        id: rb_judge
        if: success() && steps.retrigger_guard.outputs.max_iterations_reached == 'true' && steps.retrigger_guard.outputs.skip_judge != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
          ENABLE_REVIEW_BLOCKED_JUDGE: ${{ vars.ENABLE_REVIEW_BLOCKED_JUDGE || 'true' }}
          MAX_REVIEW_BLOCKED_RETRIES: ${{ vars.MAX_REVIEW_BLOCKED_RETRIES || '2' }}
          JUDGE_FIX_COUNT: ${{ steps.retrigger_guard.outputs.judge_fix_count }}
          JUDGE_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_REVIEW_BLOCKED_JUDGE || 'xhigh' }}
          TOOL_CALL_BUDGET_JUDGE: ${{ vars.TOOL_CALL_BUDGET_JUDGE || '60' }}
          ENABLE_AUTO_MERGE: ${{ vars.ENABLE_AUTO_MERGE || 'true' }}
          REISSUE_PRESERVE_BASELINE_ENABLED: ${{ vars.REISSUE_PRESERVE_BASELINE_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          # Graceful-degradation wrapper.  The judge has two recognised
          # failure modes:
          #   exit 2 — transient bash syntax error from runner FS races;
          #            retry once after a short pause.
          #   exit !=0,!=2 — anything else (timeout, OpenRouter 5xx,
          #            JSON schema reject).  Previously this propagated
          #            and failed the whole job, leaving the linked
          #            issue stranded with no terminal label.  Instead,
          #            emit rb_judge_status=failed so the next step can
          #            still apply ai:review-blocked (which the stall
          #            poller's dispatch_rb_judge rung can recover from
          #            on a later cycle).
          _judge_exit=0
          bash "${SUPPORT_SCRIPTS_DIR}/review_rb_judge.sh" || _judge_exit=$?
          if [ "${_judge_exit}" -eq 2 ]; then
            echo "::warning::review_rb_judge.sh exited 2 (syntax error) — retrying once after 5 s"
            sleep 5
            _judge_exit=0
            bash "${SUPPORT_SCRIPTS_DIR}/review_rb_judge.sh" || _judge_exit=$?
          fi
          if [ "${_judge_exit}" -ne 0 ]; then
            echo "::warning::review_rb_judge.sh exited ${_judge_exit} — degrading to ai:review-blocked recovery path"
            echo "rb_judge_status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "rb_judge_status=ok" >> "$GITHUB_OUTPUT"
          fi
      - name: Mark linked issues review-blocked (autofix exhaustion)
        if: "(success() || steps.rb_judge.outputs.rb_judge_status == 'failed') && steps.retrigger_guard.outputs.max_iterations_reached == 'true' && steps.retrigger_guard.outputs.skip_judge != 'true' && steps.rb_judge.outputs.judge_handled != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
          MAX_AUTOFIX_ITERATIONS: ${{ vars.MAX_AUTOFIX_ITERATIONS || '5' }}
        run: |
          set -euo pipefail
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true
          if [ -f "${SUPPORT_SCRIPTS_DIR}/label_helpers.sh" ] && source "${SUPPORT_SCRIPTS_DIR}/label_helpers.sh" 2>/dev/null; then
            :
          else
            if [ -f "${GITHUB_WORKSPACE}/.codex-workflow-src/scripts/label_helpers.sh" ]; then
              mkdir -p "${SUPPORT_SCRIPTS_DIR}"
              install -m 0755 "${GITHUB_WORKSPACE}/.codex-workflow-src/scripts/label_helpers.sh" "${SUPPORT_SCRIPTS_DIR}/label_helpers.sh"
              source "${SUPPORT_SCRIPTS_DIR}/label_helpers.sh" 2>/dev/null || true
            elif [ -f "${GITHUB_WORKSPACE}/.codex-workflow-src-main/scripts/label_helpers.sh" ]; then
              mkdir -p "${SUPPORT_SCRIPTS_DIR}"
              install -m 0755 "${GITHUB_WORKSPACE}/.codex-workflow-src-main/scripts/label_helpers.sh" "${SUPPORT_SCRIPTS_DIR}/label_helpers.sh"
              source "${SUPPORT_SCRIPTS_DIR}/label_helpers.sh" 2>/dev/null || true
            else
              type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
              ensure_label_exists() {
                local label_name="$1"
                local repo="$2"
                case "${label_name}" in
                  ai:review-blocked)
                    gh_retry gh label create "${label_name}" --repo "${repo}" --color "e11d48" --description "PR review/autofix could not resolve all issues — needs human intervention" 2>/dev/null || true
                    ;;
                  *)
                    gh_retry gh label create "${label_name}" --repo "${repo}" --color "1d76db" --description "AI workflow label" 2>/dev/null || true
                    ;;
                esac
              }
              set_issue_phase_label_resilient() {
                local issue_number="$1"
                local target_label="$2"
                local repo="$3"
                ensure_label_exists "${target_label}" "${repo}" || true
                gh_retry gh api -X POST "repos/${repo}/issues/${issue_number}/labels" \
                  -f "labels[]=${target_label}" >/dev/null 2>&1 \
                  || echo "::warning::Fallback label add failed for #${issue_number}. Label may need manual application."
              }
            fi
          fi
          if ! type set_issue_phase_label_resilient >/dev/null 2>&1; then
            set_issue_phase_label_resilient() {
              local issue_number="$1"
              local target_label="$2"
              local repo="$3"
              ensure_label_exists "${target_label}" "${repo}" || true
              gh_retry gh api -X POST "repos/${repo}/issues/${issue_number}/labels" \
                -f "labels[]=${target_label}" >/dev/null 2>&1 \
                || echo "::warning::Fallback label add failed for #${issue_number}. Label may need manual application."
            }
          fi

          ISSUE_NUMBERS="$(echo "${LINKED_ISSUES_JSON:-[]}" | jq -r '.[].number' 2>/dev/null || true)"

          if [ -z "${ISSUE_NUMBERS}" ]; then
            ISSUE_NUMBERS="$(printf '%s' "${LINKED_ISSUE_FALLBACK_NUMBERS_JSON:-[]}" | jq -r '.[]' 2>/dev/null || true)"
          fi

          if [ -z "${ISSUE_NUMBERS}" ]; then
            # Fallback: strict current-repo closing-keyword refs and repo-scoped issue URLs/paths only.
            PR_DATA="$(jq -r '[.title // "", .body // ""] | join(" ")' "${PR_META_FILE}" 2>/dev/null || echo "")"
            if [ -z "$(printf '%s' "${PR_DATA}" | tr -d '[:space:]')" ]; then
              PR_DATA="$(_safe_gh_jq "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title + " " + (.body // "")' || echo "")"
            fi
            if type extract_repo_scoped_issue_refs_from_text >/dev/null 2>&1; then
              ISSUE_NUMBERS="$(extract_repo_scoped_issue_refs_from_text "${REPOSITORY}" "${PR_DATA}" || true)"
            else
              ISSUE_NUMBERS=""
            fi
            if [ -z "${ISSUE_NUMBERS}" ]; then
              echo "No linked issues found for PR #${PR_NUMBER} (even after body/title fallback)."
              exit 0
            fi
            echo "Found linked issues via PR body/title fallback: ${ISSUE_NUMBERS}"
          fi

          ensure_label_exists "ai:review-blocked" "${REPOSITORY}"
          while IFS= read -r issue_number; do
            [ -n "${issue_number}" ] || continue
            echo "Setting ai:review-blocked on issue #${issue_number}"
            set_issue_phase_label_resilient "${issue_number}" "ai:review-blocked" "${REPOSITORY}"
          done <<< "${ISSUE_NUMBERS}"

      - name: Force orchestrate poll after review-blocked exhaustion
        # Best-effort re-poke of the orchestrator poll. Its failure must never
        # turn the AI Review check red — this is a notification/recovery hook,
        # not a gate. (orchestrate_force_tick.sh runs under set -euo pipefail.)
        continue-on-error: true
        if: success() && steps.retrigger_guard.outputs.max_iterations_reached == 'true' && steps.retrigger_guard.outputs.skip_judge != 'true' && steps.rb_judge.outputs.judge_handled != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # REPOSITORY is referenced as ${REPOSITORY} in the run: block under
          # set -u. The codex-agent job has no job-level REPOSITORY and it is
          # never exported to $GITHUB_ENV, so it must be declared per-step here
          # (matching the rb_judge / review-blocked-label steps). Omitting it
          # aborts the force tick with "REPOSITORY: unbound variable".
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          HELPER="${SUPPORT_SCRIPTS_DIR}/orchestrate_force_tick.sh"
          if [ ! -f "${HELPER}" ]; then
            echo "::warning::orchestrate_force_tick.sh unavailable; skipping review-blocked force tick."
            exit 0
          fi
          bash "${HELPER}" \
            --repo "${REPOSITORY}" \
            --issue "${PR_NUMBER}" \
            --reason "review-blocked" \
            --source-workflow "review_autofix" \
            --run-id "${{ github.run_id }}"

      - name: Post review-blocked comment on PR (autofix exhaustion)
        if: success() && steps.retrigger_guard.outputs.max_iterations_reached == 'true' && steps.retrigger_guard.outputs.skip_judge != 'true' && steps.rb_judge.outputs.judge_handled != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MAX_AUTOFIX_ITERATIONS: ${{ vars.MAX_AUTOFIX_ITERATIONS || '5' }}
          JUDGE_SKIP_REASON: ${{ steps.rb_judge.outputs.judge_skip_reason }}
        run: |
          set -euo pipefail
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Reason-specific body. The generic "max autofix iterations"
          # body posted unconditionally (pre-fix) confused operators
          # when the actual refusal was a transient gate — e.g. the
          # merge_with_followup self-deadlock observed on tele-funtoken-
          # msg-scoring PR #2989, where the judge approved the merge but
          # the check-runs gate refused it because the rb_judge's own
          # host job (review / codex-agent) was still in_progress.
          # judge_skip_reason now carries the proximate cause from
          # scripts/review_rb_judge.sh so the comment can explain what
          # actually happened. Empty reason = legacy / pre-fix script,
          # falls through to the original body.
          case "${JUDGE_SKIP_REASON:-}" in
            missing_followup_details)
              BODY_HEADING="AI review/autofix — judge omitted follow-up issue details"
              BODY_DETAIL="The review-blocked judge chose \`merge_with_followup\` but returned an empty \`followup_issue.title\` and/or \`.body\`, so the workflow refused the action rather than merge code without durable tracking for the deferred gap. Stall recovery will re-fire the judge; if this repeats, inspect the judge output in the workflow log."
              ;;
            blocking_check_runs)
              BODY_HEADING="AI review/autofix — merge gated by in-flight check-runs"
              BODY_DETAIL="The review-blocked judge approved this PR but other CI check-runs on the head commit had not yet completed when the merge was attempted. Stall recovery will re-fire the judge after the remaining check-runs settle; no action is required unless the blocking checks themselves are stuck. Linked issues remain labelled \`ai:review-blocked\` so the recovery ladder will retry."
              ;;
            check_runs_query_failed)
              BODY_HEADING="AI review/autofix — judge could not query check-runs"
              BODY_DETAIL="The review-blocked judge could not fetch the check-runs API for the PR head commit and refused the merge rather than land code against unvalidated CI state. This is usually transient; stall recovery will re-fire the judge. If it persists, check the workflow run log for the GitHub API error."
              ;;
            unresolved_head_sha)
              BODY_HEADING="AI review/autofix — judge could not resolve PR head SHA"
              BODY_DETAIL="The review-blocked judge could not resolve the PR head SHA from the GitHub PR JSON and refused the merge to avoid landing unjudged code. Stall recovery will re-fire the judge. If this recurs, the GitHub PR API may be returning a partial payload — check the workflow run log."
              ;;
            sync_merge_failed)
              BODY_HEADING="AI review/autofix — judge approved merge but \`gh pr merge\` failed"
              BODY_DETAIL="The review-blocked judge approved this PR and all check-runs had settled, but the synchronous \`gh pr merge --squash\` call failed. Typical causes: branch-protection rules, a merge queue requirement, missing permissions on the GH token, GitHub returning 422, or a concurrent push that changed HEAD. Stall recovery will re-fire the judge; the operator may need to merge manually if the underlying cause is permission/policy."
              ;;
            auto_merge_disabled)
              BODY_HEADING="AI review/autofix — judge approved merge but auto-merge is disabled"
              BODY_DETAIL="The review-blocked judge approved this PR but \`ENABLE_AUTO_MERGE\` is false in repo configuration, so the judge cannot land the merge itself. Please merge this PR manually; the follow-up tracking issue will be created on the next judge run after the merge lands."
              ;;
            merge_conflict)
              BODY_HEADING="AI review/autofix — PR has merge conflicts"
              BODY_DETAIL="The review-blocked judge could not act because the PR has merge conflicts against its base branch (mergeable=false). Please resolve the conflicts (rebase or merge the base branch) and push; the autofix loop will re-run."
              ;;
            mergeability_pending)
              BODY_HEADING="AI review/autofix — mergeability still computing"
              BODY_DETAIL="The review-blocked judge could not act because GitHub was still computing the PR's mergeability state when the gate ran. Stall recovery will re-fire the judge shortly; no action is required unless the state remains unknown for an extended period."
              ;;
            followup_issue_create_failed)
              BODY_HEADING="AI review/autofix — merge landed but follow-up issue creation failed"
              BODY_DETAIL="The review-blocked judge approved \`merge_with_followup\` and the PR merge succeeded, but GitHub failed while creating the follow-up issue. The deferred gap is not yet tracked; please create the follow-up manually if needed, or let stall recovery / a subsequent judge run retry issue creation."
              ;;
            *)
              BODY_HEADING="AI review/autofix blocked — needs human intervention"
              BODY_DETAIL="This PR has reached the maximum number of autofix iterations (${MAX_AUTOFIX_ITERATIONS}) without resolving all review issues. The remaining problems could not be auto-fixed and require manual attention."
              ;;
          esac

          BODY="$(cat <<EOF
          **${BODY_HEADING}**

          ${BODY_DETAIL}

          **What to do:**
          - Review the editor summary comments above for details on what was fixed and what was not
          - Address the remaining issues manually if needed
          - Push a new commit to re-trigger the review workflow if you have made changes

          Linked issues have been labeled \`ai:review-blocked\`.

          Run: ${RUN_URL}
          EOF
          )"

          if ! gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -f body="${BODY}" >/dev/null; then
            echo "::warning::Failed to post review-blocked comment on PR #${PR_NUMBER}."
          fi

      - name: Enable auto-merge on PR
        # Clean-review-tail gate: did_commit=false OR LEDGER_ONLY_COMMIT_STRICT=true.
        # The STRICT flag means "only the review-issue ledger was committed";
        # the non-strict LEDGER_ONLY_COMMIT also fires on the audit-convergence
        # branch in scripts/review_commit_changes.sh, which can be true on a
        # commit that DID land real source-file edits. Reading the loose flag
        # here caused PR #2542 to auto-merge at the pre-edit head SHA f11d6dc
        # while the editor's productive commit 005824e (real edits to
        # review_autofix.yml + README.md) was still local: the auto-merge step
        # fires before "Push all pending commits" by design (see :4436-4440
        # comment), and GitHub squashed the old head before the new commit
        # reached the remote. With STRICT, an audit-converged commit that
        # contains real edits blocks auto-merge here; the synchronize event
        # from the deferred push then triggers a fresh review_autofix
        # iteration on the new tip (the gate job checks
        # `${AUTOFIX_SKIP_SELF_TRIGGERED:-false}`, so the default is `false`
        # and the [ai-autofix] synchronize is NOT skipped). The autofix loop now actually "keeps going
        # until there are no edits" instead of converging on a stale head.
        if: "success() && (steps.retrigger_guard.outputs.max_iterations_reached != 'true' || steps.retrigger_guard.outputs.skip_judge == 'true') && (steps.commit_changes.outputs.did_commit != 'true' || env.LEDGER_ONLY_COMMIT_STRICT == 'true') && env.MERGE_CONFLICT != 'true' && env.PR_CLOSED != 'true' && env.EDITOR_CHANGES_LOST != 'true' && env.EDITOR_NOOP_SUSPICIOUS != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ENABLE_AUTO_MERGE: ${{ vars.ENABLE_AUTO_MERGE || 'true' }}
          # When 'true' (default), forward-merge fallback PRs auto-merge via a
          # real merge commit instead of being suppressed for manual merge.
          # See the forward-merge-fallback branch below for the full rationale.
          FORWARD_MERGE_FALLBACK_AUTO_MERGE: ${{ vars.FORWARD_MERGE_FALLBACK_AUTO_MERGE || 'true' }}
          ORCH_INTEGRATION_BRANCH_PATTERN: ${{ vars.ORCH_INTEGRATION_BRANCH_PATTERN || '^orchestrator/project-' }}
        run: |
          bash "${SUPPORT_SCRIPTS_DIR}/review_enable_auto_merge.sh"

      - name: Push all pending commits
        # Deferred push: autofix commits and/or conflict resolution commits
        # are pushed together AFTER labeling and auto-merge are configured.
        # This avoids a concurrency self-cancel race where the synchronize
        # event from an earlier push would kill subsequent steps.
        if: success() && env.CAN_PUSH == 'true' && (env.DID_COMMIT == 'true' || env.CONFLICT_RESOLVED == 'true') && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTOFIX_BOT_LOGIN: ${{ vars.AUTOFIX_BOT_LOGIN }}
          LOCAL_HEAD_SHA: ${{ env.INITIAL_HEAD_SHA }}
        run: |
          set -euo pipefail
          export LANG=C

          # Pre-push stale-base gate.  Soft-exit 0 if the remote tip
          # advanced past INITIAL_HEAD_SHA with a non-autofix commit
          # during the editor run — the synchronize event from that
          # external push has already queued (or will queue) a fresh
          # review_autofix run against the new tip, so pushing our
          # locally-committed autofix on top would either lose the
          # external change via merge or hard-fail at the merge-retry
          # step below.  See probably_unnecessary_but_read_if_stuck.md §20.2.
          if [ -x "${SUPPORT_SCRIPTS_DIR}/check_external_branch_advance.sh" ]; then
            pre_push_out="$(bash "${SUPPORT_SCRIPTS_DIR}/check_external_branch_advance.sh" || printf 'ADVANCE=unknown\n')"
            pre_push_val="$(printf '%s\n' "${pre_push_out}" | grep -E '^ADVANCE=' | tail -n 1 | cut -d= -f2 || true)"
            pre_push_val="${pre_push_val:-unknown}"
            case "${pre_push_val}" in
              external)
                echo "AUTOFIX_PRE_PUSH_STALE_BASE pr=${PR_NUMBER} local_sha=${LOCAL_HEAD_SHA} target_branch=${TARGET_BRANCH} action=soft_exit"
                echo "AUTOFIX_STALE_BASE_SKIP=true" >> "$GITHUB_ENV"
                exit 0
                ;;
              self_only)
                echo "AUTOFIX_PRE_PUSH_SELF_ADVANCE pr=${PR_NUMBER} local_sha=${LOCAL_HEAD_SHA} target_branch=${TARGET_BRANCH} action=continue"
                ;;
              none)
                echo "AUTOFIX_PRE_PUSH_BASE_FRESH pr=${PR_NUMBER} local_sha=${LOCAL_HEAD_SHA} target_branch=${TARGET_BRANCH}"
                ;;
              *)
                echo "AUTOFIX_PRE_PUSH_UNKNOWN pr=${PR_NUMBER} local_sha=${LOCAL_HEAD_SHA} target_branch=${TARGET_BRANCH} action=fail_open"
                ;;
            esac
          else
            echo "::warning::check_external_branch_advance.sh missing from support scripts; fail-open (skipping pre-push gate)."
          fi

          git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}"
          echo "Pushing pending commits to ${TARGET_BRANCH}..."

          # Retry non-fast-forward rejections with fetch+merge.  A concurrent
          # push to ${TARGET_BRANCH} (another workflow run, a human push, a
          # sibling autofix job) during this ~30-minute job would otherwise
          # cause an unrecoverable `! [rejected] (fetch first)` failure and
          # lose the deferred autofix / [ai-merge-resolve] commit.  We merge
          # the advanced remote tip into our local HEAD and retry up to 3
          # times with exponential backoff.
          #
          # Why `git merge` and NOT `git rebase` here: the conflict-resolver
          # step above (see the "NOTE: git is intentionally left in merge
          # state" block around the `git commit -m "[ai-merge-resolve]…"`
          # call) deliberately creates the ai-merge-resolve commit as a
          # real two-parent merge commit.  That second parent is load-
          # bearing — without it, git's merge-base walker rewinds to the
          # original merge base on every subsequent `git merge` attempt
          # and re-raises the identical conflict (observed on PR #908,
          # which left the PR in mergeable_state=dirty).  A plain
          # `git rebase` would flatten that merge commit into a single-
          # parent commit and resurrect the exact bug PR #908 was designed
          # to fix.  `git rebase --rebase-merges` would rewrite the merge
          # commit SHA too.  `git merge` preserves the existing commit
          # exactly and simply adds another merge commit on top when
          # origin has genuinely advanced — never rewriting history and
          # never clobbering other pushers' commits (no --force / no
          # --force-with-lease on this path).  If the merge itself would
          # introduce new conflicts we abort the merge and fail loudly —
          # we must never silently resurrect conflict markers that the
          # resolver just cleared.
          max_push_attempts=3
          push_attempt=1
          push_backoff=2
          push_stderr_file="$(mktemp)"
          trap 'rm -f "${push_stderr_file}"' EXIT
          while :; do
            push_exit=0
            # Capture BOTH stdout and stderr: `git push` normally emits
            # rejection details on stderr, but remote helpers and some
            # git versions can surface `! [rejected]` / `non-fast-forward`
            # on stdout, which would cause stderr-only classification to
            # mis-route a retryable failure to the hard-fail branch.
            git push origin "HEAD:${TARGET_BRANCH}" >"${push_stderr_file}" 2>&1 || push_exit=$?
            cat "${push_stderr_file}" >&2
            if [ "${push_exit}" -eq 0 ]; then
              echo "Push complete."
              break
            fi
            if ! grep -qE '\[rejected\].*\((fetch first|non-fast-forward)\)' "${push_stderr_file}"; then
              echo "::error::git push failed (exit ${push_exit}) for a reason other than [rejected] (fetch first/non-fast-forward); not retrying."
              exit "${push_exit}"
            fi
            if [ "${push_attempt}" -ge "${max_push_attempts}" ]; then
              echo "::error::git push still rejected as non-fast-forward after ${max_push_attempts} attempts; giving up."
              exit 1
            fi
            echo "::warning::git push rejected as non-fast-forward (attempt ${push_attempt}/${max_push_attempts}); fetching ${TARGET_BRANCH} and merging before retry in ${push_backoff}s."
            sleep "${push_backoff}"
            push_backoff=$((push_backoff * 2))
            push_attempt=$((push_attempt + 1))
            fetch_attempt=1
            while ! git fetch origin "${TARGET_BRANCH}"; do
              if [ "${fetch_attempt}" -ge 2 ]; then
                echo "::error::git fetch origin ${TARGET_BRANCH} failed twice during push-retry; giving up to avoid pushing a stale tree."
                exit 1
              fi
              echo "::warning::git fetch origin ${TARGET_BRANCH} failed during push-retry (attempt ${fetch_attempt}/2); retrying in 2s."
              fetch_attempt=$((fetch_attempt + 1))
              sleep 2
            done
            if ! git merge --no-edit --no-ff "origin/${TARGET_BRANCH}"; then
              echo "::error::git merge origin/${TARGET_BRANCH} failed — merge would introduce new conflicts. Aborting merge and failing the job; refusing to silently resurrect conflict markers."
              git merge --abort || true
              exit 1
            fi
            : > "${push_stderr_file}"
          done

      - name: Re-trigger review via workflow_dispatch
        # The push above fires a pull_request synchronize event, but GitHub
        # resolves reusable workflow refs from the merge ref
        # (refs/pull/N/merge).  When that merge ref is unbuildable (e.g.
        # main advanced and introduced new conflicts), the caller workflow
        # is silently skipped.  Dispatch explicitly as a fallback —
        # workflow_dispatch resolves from the target ref (the PR branch),
        # which always exists.  The concurrency group ensures only one run
        # proceeds if both the synchronize event and this dispatch fire.
        #
        # If the dispatch fails, the synchronize event from the push still
        # serves as a fallback so the autofix cycle is never silently broken.
        #
        # Dispatch order:
        #   1. review_autofix.yml (this file) — works when it exists in the
        #      current repo (coding-workflows itself, or consumer repos that
        #      added workflow_dispatch to their caller workflow template).
        #   2. Caller workflow parsed from github.workflow_ref — fallback for
        #      consumer repos whose caller workflow has workflow_dispatch.
        if: success() && env.CAN_PUSH == 'true' && (env.DID_COMMIT == 'true' || env.CONFLICT_RESOLVED == 'true') && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          AUTOFIX_SKIP_SELF_TRIGGERED: ${{ vars.AUTOFIX_SKIP_SELF_TRIGGERED }}
          AUTOFIX_CONTINUATION_ENABLED: ${{ vars.AUTOFIX_CONTINUATION_ENABLED }}
          AUTOFIX_CONTINUATION_SETTLE_SECS: ${{ vars.AUTOFIX_CONTINUATION_SETTLE_SECS }}
        run: |
          set -euo pipefail
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true

          # Self-triggered autofix skip (mirrors gate-job behavior):
          # The gate job suppresses self-triggered autofix follow-up runs for
          # pull_request.synchronize events (by matching subject [ai-autofix]
          # against AUTOFIX_BOT_LOGIN-attributed .author.login/.committer.login),
          # but workflow_dispatch does not go through that same event filter.
          # Without this guard, the dispatch below could spawn a verification
          # run for the autofix we just pushed and effectively bypass that
          # suppression.
          #
          # This guard keys off this run's outcome flags, not commit identity:
          # skip dispatch when the just-pushed change is a pure [ai-autofix]
          # edit (DID_COMMIT=true and CONFLICT_RESOLVED!=true). Since these
          # flags are set by the step that just performed the push, there is
          # no spoofing vector here — no commit-API identity check required.
          # [ai-merge-resolve] / conflict-resolved pushes still dispatch so
          # the post-resolution reviewer pass runs (conflict-resolved code
          # is higher-risk than a vanilla autofix edit).
          #
          # Autofix continuation (probably_unnecessary_but_read_if_stuck.md §20.4): when the just-pushed
          # [ai-autofix] commit is a productive edit (DID_COMMIT=true,
          # LEDGER_ONLY_COMMIT!=true, CONFLICT_RESOLVED!=true) and
          # AUTOFIX_CONTINUATION_ENABLED is not `false`, the dispatch
          # proceeds even though the gate job would suppress the parallel
          # pull_request.synchronize event.  This closes the ~0–120 min
          # stall window where a PR otherwise had to wait for the
          # orchestrator stall cron before its next autofix iteration —
          # critical for non-orchestrator PRs that the cron does not
          # scan.  Ledger-only commits are still skipped here (the
          # clean-review tail in the same run handles auto-merge, so no
          # continuation is needed).  Setting
          # AUTOFIX_CONTINUATION_ENABLED=false restores the
          # pre-continuation path, where productive autofix commits skip
          # this step only when AUTOFIX_SKIP_SELF_TRIGGERED=true.
          continuation_enabled="${AUTOFIX_CONTINUATION_ENABLED:-true}"
          is_ledger_only_commit="${LEDGER_ONLY_COMMIT:-false}"
          if [ "${DID_COMMIT:-false}" = "true" ] \
            && [ "${CONFLICT_RESOLVED:-false}" != "true" ] \
            && { [ "${is_ledger_only_commit}" = "true" ] \
              || { [ "${AUTOFIX_SKIP_SELF_TRIGGERED:-false}" = "true" ] \
                && [ "${continuation_enabled}" = "false" ]; }; }; then
            echo "AUTOFIX_DISPATCH_SKIPPED reason=self_triggered_autofix pr=${PR_NUMBER} current_run=${CURRENT_RUN_ID} source=post_commit_retrigger continuation_enabled=${continuation_enabled} ledger_only=${is_ledger_only_commit}"
            exit 0
          fi

          # Continuation-specific pre-dispatch guards.  Only applied when
          # the commit was a productive autofix and continuation is
          # enabled; conflict-resolved and legacy pass-through paths
          # retain their existing (pre-continuation) dispatch behaviour.
          is_productive_autofix_commit="false"
          if [ "${DID_COMMIT:-false}" = "true" ] \
            && [ "${CONFLICT_RESOLVED:-false}" != "true" ] \
            && [ "${is_ledger_only_commit}" != "true" ]; then
            is_productive_autofix_commit="true"
          fi
          is_continuation_dispatch="false"
          if [ "${is_productive_autofix_commit}" = "true" ] && [ "${continuation_enabled}" != "false" ]; then
            # Settle delay: allow the push to propagate through GitHub's
            # indices before dispatching a run that will check out the
            # new HEAD SHA.  Tunable via
            # AUTOFIX_CONTINUATION_SETTLE_SECS (default 10, clamped 1..60).
            settle_secs="${AUTOFIX_CONTINUATION_SETTLE_SECS:-10}"
            if ! [[ "${settle_secs}" =~ ^[1-9][0-9]*$ ]] || [ "${settle_secs}" -gt 60 ]; then
              settle_secs=10
            fi
            sleep "${settle_secs}"
            is_continuation_dispatch="true"
          fi

          # Preflight dedup: the push above fires a pull_request.synchronize
          # event that produces its own review_autofix run via the caller
          # workflow.  Both runs land in the `pr-autofix-${PR}` concurrency
          # group with cancel-in-progress: false, so a redundant dispatch can
          # still queue, appear in the Actions UI, and consume a
          # workflow_dispatch API call.  Give the synchronize event a few
          # seconds to show up in the Actions API, then skip our dispatch if a
          # peer run is already queued or running.  Fails open — any detection
          # failure falls through to the original dispatch logic so we never
          # silently break the cycle.
          #
          # Tunable via AUTOFIX_RETRIGGER_PEER_WAIT_SECS (default 8s).
          peer_wait="${AUTOFIX_RETRIGGER_PEER_WAIT_SECS:-8}"
          if ! [[ "${peer_wait}" =~ ^[0-9]+$ ]] || [ "${peer_wait}" -gt 60 ]; then
            peer_wait=8
          fi
          sleep "${peer_wait}"

          # Continuation dispatches are the designated successor run for a
          # productive [ai-autofix] push. The only same-branch peer the
          # dedup can find is the gate-skipped pull_request.synchronize run
          # produced by our own push (AUTOFIX_GATE_SKIP
          # reason=self_triggered_autofix), whose `run` job is gated out
          # because its `needs.gate.outputs.should_run == 'true'` condition
          # is not met, so it never advances retrigger_guard or invokes
          # rb_judge. Handing the iteration to that peer stalls the cycle
          # until the orchestrator stall cron recovers — and the cron does
          # not scan non-orchestrator PRs at all (probably_unnecessary_but_read_if_stuck.md §20.4). Bypass
          # the peer check in the continuation case; legacy non-continuation
          # dispatches keep their existing dedup semantics.
          if [ "${is_continuation_dispatch}" = "true" ]; then
            echo "AUTOFIX_PEER_CHECK_BYPASSED pr=${PR_NUMBER} current_run=${CURRENT_RUN_ID} reason=continuation_dispatch source=post_commit_retrigger"
          elif type autofix_retrigger_has_inflight_peer >/dev/null 2>&1 \
            && autofix_retrigger_has_inflight_peer "${PR_NUMBER}" "${TARGET_BRANCH}" "${CURRENT_RUN_ID}"; then
            echo "AUTOFIX_DISPATCH_SKIPPED reason=sync_event_inflight pr=${PR_NUMBER} current_run=${CURRENT_RUN_ID} source=post_commit_retrigger"
            exit 0
          fi

          if [ "${is_continuation_dispatch}" = "true" ]; then
            echo "AUTOFIX_CONTINUATION_DISPATCH_ISSUED pr=${PR_NUMBER} current_run=${CURRENT_RUN_ID} settle_secs=${settle_secs} source=post_commit_retrigger"
            echo "AUTOFIX_DISPATCH_ISSUED reason=no_peer_detected pr=${PR_NUMBER} current_run=${CURRENT_RUN_ID} source=post_commit_retrigger continuation=true"
          else
            echo "AUTOFIX_DISPATCH_ISSUED reason=no_peer_detected pr=${PR_NUMBER} current_run=${CURRENT_RUN_ID} source=post_commit_retrigger"
          fi

          dispatched=false

          # 1. Try dispatching review_autofix.yml directly.  This works for
          #    coding-workflows itself (the file exists locally) and for any
          #    consumer repo that copies or syncs this file.
          if gh workflow run "review_autofix.yml" \
            --ref "${TARGET_BRANCH}" \
            -f pr_number="${PR_NUMBER}" \
            -f allow_workflow_edits="${ALLOW_WORKFLOW_EDITS}"; then
            echo "Dispatched review_autofix.yml on ${TARGET_BRANCH} for PR #${PR_NUMBER}."
            dispatched=true
          fi

          # 2. Fall back to the caller workflow (e.g. ai-review.yml in a
          #    consumer repo).  Only attempt if the direct dispatch failed
          #    and the caller is a different file.
          if [ "${dispatched}" = "false" ]; then
            caller_ref="${{ github.workflow_ref }}"
            caller_workflow="$(basename "${caller_ref%%@*}")"
            if [ -z "${caller_workflow}" ]; then
              caller_workflow="internal-review.yml"
            fi
            if [ "${caller_workflow}" != "review_autofix.yml" ]; then
              echo "Direct dispatch failed; trying caller workflow: ${caller_workflow}"
              if gh workflow run "${caller_workflow}" \
                --ref "${TARGET_BRANCH}" \
                -f pr_number="${PR_NUMBER}" \
                -f allow_workflow_edits="${ALLOW_WORKFLOW_EDITS}"; then
                echo "Dispatched ${caller_workflow} on ${TARGET_BRANCH} for PR #${PR_NUMBER}."
                dispatched=true
              fi
            else
              for candidate in ai-review.yml internal-review.yml; do
                echo "Direct dispatch failed; trying caller workflow: ${candidate}"
                if gh workflow run "${candidate}" \
                  --ref "${TARGET_BRANCH}" \
                  -f pr_number="${PR_NUMBER}" \
                  -f allow_workflow_edits="${ALLOW_WORKFLOW_EDITS}"; then
                  echo "Dispatched ${candidate} on ${TARGET_BRANCH} for PR #${PR_NUMBER}."
                  dispatched=true
                  break
                fi
              done
            fi
          fi

          if [ "${dispatched}" = "false" ]; then
            echo "::warning::Could not dispatch review workflow via workflow_dispatch; the synchronize event from the push will trigger the next review run instead. To enable dispatch (avoids merge-ref resolution issues), add a workflow_dispatch trigger with a pr_number input and an optional allow_workflow_edits boolean input to your caller workflow. Ensure GH_PAT can dispatch workflows (classic PAT: repo+workflow; fine-grained PAT: Actions read/write)."
          fi

      - name: Telegram success
        # Clean-review-tail gate: matches the auto-merge / mark-ready siblings
        # above so the success notification only fires on a truly converged
        # iteration. See the comment block on "Enable auto-merge on PR" for
        # the LEDGER_ONLY_COMMIT_STRICT rationale.
        if: "success() && (steps.retrigger_guard.outputs.max_iterations_reached != 'true' || steps.retrigger_guard.outputs.skip_judge == 'true') && (steps.commit_changes.outputs.did_commit != 'true' || env.LEDGER_ONLY_COMMIT_STRICT == 'true') && env.MERGE_CONFLICT != 'true' && env.PR_CLOSED != 'true' && env.EDITOR_CHANGES_LOST != 'true' && env.EDITOR_NOOP_SUSPICIOUS != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'"
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # The DEBUG "PR processed: #N" ping fires once per successful run, so
          # orchestrator-driven PRs that synchronize many times generate noise.
          # Default this step's ALERT_MSG_LEVEL to SILENT so the DEBUG call below
          # is suppressed by tg_helpers.sh::_tg_should_send unless the consumer
          # explicitly opts in via vars.PR_PROCESSED_ALERT_LEVEL. Mirrors the
          # pattern in update_workflows.yml (see CHANGELOG entry from the
          # "update_workflows.yml ALERT_MSG_LEVEL default SILENT" change).
          ALERT_MSG_LEVEL: ${{ vars.PR_PROCESSED_ALERT_LEVEL || 'SILENT' }}
        run: |
          source "${SUPPORT_SCRIPTS_DIR}/tg_helpers.sh"
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/${PR_NUMBER}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ISSUE_NUM="$(echo "${LINKED_ISSUES_JSON:-[]}" | jq -r '.[0].number // empty' 2>/dev/null || true)"
          MSG="PR processed: #${PR_NUMBER}"
          MSG+=$'\n'
          MSG+="PR: ${PR_URL}"
          if [ -n "${ISSUE_NUM}" ]; then
            MSG+=$'\n'
            MSG+="Issue: ${{ github.server_url }}/${{ github.repository }}/issues/${ISSUE_NUM}"
          fi
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_tracked "${PR_NUMBER}" "${MSG}" "DEBUG"

      - name: Re-dispatch review on editor-changes-lost
        # When the editor claims changes but nothing persisted on disk after
        # all retry attempts, automatically re-dispatch the review workflow
        # so the next iteration gets a fresh codex instance.
        # Guard against an endless re-dispatch loop when no commit is
        # produced by allowing this auto-redispatch only on runs that still
        # carry the original pull_request event payload.
        # Re-dispatched workflow_dispatch runs do not include
        # github.event.pull_request and therefore cannot re-enter this path.
        if: "success() && env.EDITOR_CHANGES_LOST == 'true' && env.PR_CLOSED != 'true' && steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.CAN_PUSH == 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true' && github.event.pull_request.number"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true

          echo "Editor changes lost — dispatching fresh review iteration for PR #${PR_NUMBER}."

          # Preflight dedup: same rationale as the post-commit retrigger
          # above.  When EDITOR_CHANGES_LOST fires the editor produced no
          # commit, so no pull_request.synchronize event follows from us —
          # but a sibling run from an earlier retrigger or from a user push
          # may still be in flight.  Skip dispatch if so; fail open on any
          # detection failure.
          peer_wait="${AUTOFIX_RETRIGGER_PEER_WAIT_SECS:-8}"
          if ! [[ "${peer_wait}" =~ ^[0-9]+$ ]] || [ "${peer_wait}" -gt 60 ]; then
            peer_wait=8
          fi
          sleep "${peer_wait}"

          if type autofix_retrigger_has_inflight_peer >/dev/null 2>&1 \
            && autofix_retrigger_has_inflight_peer "${PR_NUMBER}" "${TARGET_BRANCH}" "${CURRENT_RUN_ID}"; then
            echo "AUTOFIX_DISPATCH_SKIPPED reason=peer_inflight pr=${PR_NUMBER} current_run=${CURRENT_RUN_ID} source=editor_changes_lost_retrigger"
            echo "CHANGES_LOST_REDISPATCHED=skipped_peer_inflight" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "AUTOFIX_DISPATCH_ISSUED reason=no_peer_detected pr=${PR_NUMBER} current_run=${CURRENT_RUN_ID} source=editor_changes_lost_retrigger"

          dispatched=false

          if gh workflow run "review_autofix.yml" \
            --ref "${TARGET_BRANCH}" \
            -f pr_number="${PR_NUMBER}" \
            -f allow_workflow_edits="${ALLOW_WORKFLOW_EDITS}"; then
            echo "Dispatched review_autofix.yml on ${TARGET_BRANCH} for PR #${PR_NUMBER}."
            dispatched=true
          fi

          if [ "${dispatched}" = "false" ]; then
            caller_workflow=""
            if [ -n "${{ github.workflow_ref }}" ]; then
              caller_ref="${{ github.workflow_ref }}"
              caller_workflow="$(basename "${caller_ref%%@*}")"
            fi
            if [ -z "${caller_workflow}" ]; then
              caller_workflow="internal-review.yml"
            fi
            if [ "${caller_workflow}" != "review_autofix.yml" ]; then
              if gh workflow run "${caller_workflow}" \
                --ref "${TARGET_BRANCH}" \
                -f pr_number="${PR_NUMBER}" \
                -f allow_workflow_edits="${ALLOW_WORKFLOW_EDITS}"; then
                echo "Dispatched ${caller_workflow} on ${TARGET_BRANCH} for PR #${PR_NUMBER}."
                dispatched=true
              fi
            fi
          fi

          if [ "${dispatched}" = "false" ]; then
            echo "::warning::Could not dispatch review workflow for editor-changes-lost recovery. The next synchronize event or manual re-run is needed."
          fi

          echo "CHANGES_LOST_REDISPATCHED=${dispatched}" >> "$GITHUB_ENV"

      - name: Telegram editor-changes-lost warning
        if: "success() && env.EDITOR_CHANGES_LOST == 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'"
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          source "${SUPPORT_SCRIPTS_DIR}/tg_helpers.sh"
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/${PR_NUMBER}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${CHANGES_LOST_REDISPATCHED:-false}" = "true" ]; then
            MSG="⚠️ Editor changes lost (retrying): #${PR_NUMBER}"
            MSG+=$'\n'
            MSG+="Editor tool calls failed to persist. Fresh review dispatched."
            MSG+=$'\n'
            MSG+="PR: ${PR_URL}"
            MSG+=$'\n'
            MSG+="Run: ${RUN_URL}"
            tg_send_tracked "${PR_NUMBER}" "${MSG}" "WARN"
          elif [ "${CHANGES_LOST_REDISPATCHED:-}" = "skipped_peer_inflight" ]; then
            echo "Editor changes lost re-dispatch skipped; peer run already in flight."
          else
            if [ "${CAN_PUSH:-}" = "true" ]; then
              MSG="⚠️ Editor changes lost (exhausted): #${PR_NUMBER}"
              MSG+=$'\n'
              MSG+="All retries exhausted. Auto-merge blocked."
              MSG+=$'\n'
              MSG+="PR: ${PR_URL}"
              MSG+=$'\n'
              MSG+="Run: ${RUN_URL}"
              tg_send_tracked "${PR_NUMBER}" "${MSG}" "CRITICAL"

              # Post a PR comment only when re-dispatch failed (human attention needed)
              BODY="⚠️ **Editor changes lost** — the editor reported making changes but no commit was produced."
              BODY+=$'\n\n'
              BODY+="Auto-merge has been **blocked**. All automated retry attempts have been exhausted."
              BODY+=$'\n'
              BODY+="**Next steps:** re-run the review workflow manually or apply the changes from the editor summary above."
              BODY+=$'\n\n'
              BODY+="Run: ${RUN_URL}"
              gh_retry gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -f body="${BODY}" >/dev/null 2>&1 || true
            else
              MSG="⚠️ Editor changes lost (push disabled): #${PR_NUMBER}"
              MSG+=$'\n'
              MSG+="Editor claimed changes but push is disabled (CAN_PUSH=${CAN_PUSH:-false}); changes cannot be committed to the PR."
              MSG+=$'\n'
              MSG+="PR: ${PR_URL}"
              MSG+=$'\n'
              MSG+="Run: ${RUN_URL}"
              tg_send_tracked "${PR_NUMBER}" "${MSG}" "WARN"
            fi
          fi

      - name: Telegram editor-noop-suspicious warning
        if: "success() && env.EDITOR_NOOP_SUSPICIOUS == 'true' && steps.retrigger_guard.outputs.max_iterations_reached != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'"
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          source "${SUPPORT_SCRIPTS_DIR}/tg_helpers.sh"
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/${PR_NUMBER}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Branch the operator-facing alert on EDITOR_NOOP_REFUSAL (set by
          # the "Validate editor no-op disposition" step's Check 1b when the
          # editor model returns a safety-policy refusal). A refusal is
          # transient — re-running after the provider-side prompt cache
          # expires usually clears it — so the alert points the operator at a
          # re-run instead of the generic "editor failed silently / audit
          # inconsistent" causes, which do not apply to a refusal. The flag
          # was added for exactly this branch (see
          # probably_unnecessary_but_read_if_stuck.md §20.10.1). Auto-merge
          # stays blocked in both branches (the EDITOR_NOOP_SUSPICIOUS gate is
          # unchanged — a refusal always also sets SUSPICIOUS=true via Check
          # 1). The PR comment BODY keeps the "⚠️ **Editor no-op suspicious**"
          # literal in BOTH branches because the orchestrator-poll
          # noop-suspicious recovery sweep (scripts/orchestrate_poll_process.sh)
          # greps PR comments for it to auto-re-dispatch the run — which is
          # precisely the remediation a refusal needs. Dropping it from the
          # refusal branch would strand refusal PRs (no auto-re-dispatch, no
          # force-merge). Do NOT rename the flags or that literal (CLAUDE.md §6).
          if [ "${EDITOR_NOOP_REFUSAL:-false}" = "true" ]; then
            MSG="⚠️ Editor safety-policy refusal: #${PR_NUMBER}"
            MSG+=$'\n'
            MSG+="Editor model returned a safety-policy refusal — no changes applied."
            MSG+=$'\n'
            MSG+="Auto-merge blocked. Re-run is likely to succeed once the provider-side cache expires."
            MSG+=$'\n'
            MSG+="PR: ${PR_URL}"
            MSG+=$'\n'
            MSG+="Run: ${RUN_URL}"
            tg_send_tracked "${PR_NUMBER}" "${MSG}" "WARNING"

            BODY="⚠️ **Editor no-op suspicious** — the editor model returned a safety-policy refusal (safety filter), so no fix was applied this pass."
            BODY+=$'\n\n'
            BODY+="This is typically transient. Re-running the AI Review workflow after the provider-side prompt cache expires usually clears it; manual review is only needed if the refusal recurs."
            BODY+=$'\n'
            BODY+="Auto-merge has been **blocked**."
            gh_retry gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -f body="${BODY}" >/dev/null 2>&1 || true
          else
            MSG="⚠️ Editor no-op suspicious: #${PR_NUMBER}"
            MSG+=$'\n'
            MSG+="Editor claimed no changes needed but disposition could not be verified."
            MSG+=$'\n'
            MSG+="Auto-merge blocked. Manual review or re-run required."
            MSG+=$'\n'
            MSG+="PR: ${PR_URL}"
            MSG+=$'\n'
            MSG+="Run: ${RUN_URL}"
            tg_send_tracked "${PR_NUMBER}" "${MSG}" "WARNING"

            BODY="⚠️ **Editor no-op suspicious** — the editor claimed no changes were needed but the disposition could not be verified."
            BODY+=$'\n\n'
            BODY+="Possible causes: editor failed silently, did not read reviewer files, or audit counts are inconsistent."
            BODY+=$'\n'
            BODY+="Auto-merge has been **blocked**. Please review the editor summary and re-run the workflow if appropriate."
            gh_retry gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -f body="${BODY}" >/dev/null 2>&1 || true
          fi

      - name: Telegram review-blocked judge decision
        if: success() && steps.retrigger_guard.outputs.max_iterations_reached == 'true' && steps.retrigger_guard.outputs.skip_judge != 'true' && env.PR_CLOSED != 'true' && env.AUTOFIX_STALE_BASE_SKIP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          JUDGE_ACTION: ${{ steps.rb_judge.outputs.judge_action }}
          JUDGE_HANDLED: ${{ steps.rb_judge.outputs.judge_handled }}
          JUDGE_SKIP_REASON: ${{ steps.rb_judge.outputs.judge_skip_reason }}
          MAX_AUTOFIX_ITERATIONS: ${{ vars.MAX_AUTOFIX_ITERATIONS || '5' }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
        run: |
          source "${SUPPORT_SCRIPTS_DIR}/tg_helpers.sh"
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true

          PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/${PR_NUMBER}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ISSUE_NUM="$(echo "${LINKED_ISSUES_JSON:-[]}" | jq -r '.[0].number // empty' 2>/dev/null || true)"
          ISSUE_LINE=""
          if [ -n "${ISSUE_NUM}" ]; then
            ISSUE_LINE=$'\n'"Issue: ${{ github.server_url }}/${{ github.repository }}/issues/${ISSUE_NUM}"
          fi
          if [ "${JUDGE_HANDLED}" = "true" ]; then
            case "${JUDGE_ACTION}" in
              merge)
                MSG="Review-blocked judge merged PR as-is" ;;
              fix)
                MSG="Review-blocked judge pushed fix commit" ;;
              close_and_reissue)
                MSG="Review-blocked judge closed PR and created replacement issue" ;;
              *)
                MSG="Review-blocked judge action: ${JUDGE_ACTION}" ;;
            esac
          else
            case "${JUDGE_SKIP_REASON}" in
              disabled)
                MSG="$(printf 'PR review blocked — autofix exhausted (%s iterations), judge disabled\nNeeds human intervention' "${MAX_AUTOFIX_ITERATIONS}")" ;;
              not_writable)
                MSG="$(printf 'PR review blocked — autofix exhausted (%s iterations), branch not writable\nNeeds human intervention' "${MAX_AUTOFIX_ITERATIONS}")" ;;
              missing_followup_details)
                MSG="$(printf 'PR review blocked — judge selected merge_with_followup but omitted follow-up details\nNeeds judge retry or manual follow-up issue creation')" ;;
              unresolved_head_sha)
                MSG="$(printf 'PR review blocked — judge could not resolve PR head SHA\nStall recovery will retry automatically')" ;;
              check_runs_query_failed)
                MSG="$(printf 'PR review blocked — judge could not query head check-runs\nStall recovery will retry automatically')" ;;
              blocking_check_runs)
                MSG="$(printf 'PR review blocked — merge_with_followup approved but check-runs are still in flight\nStall recovery will retry automatically')" ;;
              sync_merge_failed)
                MSG="$(printf 'PR review blocked — merge_with_followup approved but gh pr merge failed\nNeeds retry or manual merge investigation')" ;;
              auto_merge_disabled)
                MSG="$(printf 'PR review blocked — merge_with_followup approved but ENABLE_AUTO_MERGE=false\nManual merge required before follow-up creation')" ;;
              merge_conflict)
                MSG="$(printf 'PR review blocked — PR has merge conflicts\nNeeds rebase or conflict resolution')" ;;
              mergeability_pending)
                MSG="$(printf 'PR review blocked — GitHub mergeability still computing\nStall recovery will retry automatically')" ;;
              followup_issue_create_failed)
                MSG="$(printf 'PR review blocked — PR merged but follow-up issue creation failed\nNeeds follow-up issue creation or retry')" ;;
              llm_failed_critical_issues|json_parse_failed_critical_issues)
                MSG="$(printf 'PR review blocked — autofix exhausted (%s iterations), judge LLM failed, deterministic fallback found critical issues\nNeeds human intervention' "${MAX_AUTOFIX_ITERATIONS}")" ;;
              llm_failed*|json_parse_failed*)
                MSG="$(printf 'PR review blocked — autofix exhausted (%s iterations), judge LLM failed\nNeeds human intervention' "${MAX_AUTOFIX_ITERATIONS}")" ;;
              *)
                MSG="$(printf 'PR review blocked — autofix exhausted (%s iterations)\nNeeds human intervention' "${MAX_AUTOFIX_ITERATIONS}")" ;;
            esac
          fi
          MSG+=$'\n'
          MSG+="PR: ${PR_URL}${ISSUE_LINE}"
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_tracked "${PR_NUMBER}" "${MSG}" "CRITICAL"

      - name: Check PR state before failure alerts
        if: failure() && env.PR_CLOSED != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }

          pr_meta="$(gh_retry _safe_gh_jq "repos/${REPOSITORY}/pulls/${PR_NUMBER}" 2>/dev/null || echo 'null')"
          pr_state="$(printf '%s\n' "${pr_meta}" | jq -r 'if ((.merged_at != null) or (.merged == true)) then "merged" else (.state // "") end' | grep -xE 'open|closed|merged' || echo "")"
          if [ -z "${pr_state}" ]; then
            echo "::warning::Unable to determine PR #${PR_NUMBER} state; assuming open."
            pr_state="open"
          fi
          if [ "${pr_state}" = "closed" ] || [ "${pr_state}" = "merged" ]; then
            echo "PR #${PR_NUMBER} is ${pr_state} — skipping failure alerts."
            echo "PR_CLOSED=true" >> "$GITHUB_ENV"
          fi

      - name: Mark linked issues review-blocked (workflow failure)
        if: failure() && env.PR_CLOSED != 'true' && env.AUTOFIX_EDITOR_EMPTY_NOOP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true' && env.RESOLVER_ESCALATED != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          if [ -f "${SUPPORT_SCRIPTS_DIR}/label_helpers.sh" ]; then
            source "${SUPPORT_SCRIPTS_DIR}/label_helpers.sh" 2>/dev/null || true
          fi
          if ! type ensure_label_exists >/dev/null 2>&1; then
            ensure_label_exists() {
              local label_name="$1"
              local repo="$2"
              gh_retry gh label create "${label_name}" --repo "${repo}" \
                --color "e11d48" --description "PR review/autofix could not resolve all issues — needs human intervention" \
                2>/dev/null || true
            }
          fi
          if ! type set_issue_phase_label_resilient >/dev/null 2>&1; then
            set_issue_phase_label_resilient() {
              local issue_number="$1"
              local target_label="$2"
              local repo="$3"
              ensure_label_exists "${target_label}" "${repo}" || true
              gh_retry gh api -X POST "repos/${repo}/issues/${issue_number}/labels" \
                -f "labels[]=${target_label}" >/dev/null 2>&1 \
                || echo "::warning::Fallback label add failed for #${issue_number}."
            }
          fi

          ensure_label_exists "ai:review-blocked" "${REPOSITORY}" || true

          ISSUE_NUMBERS="$(echo "${LINKED_ISSUES_JSON:-[]}" | jq -r '.[].number' 2>/dev/null || true)"

          if [ -z "${ISSUE_NUMBERS}" ]; then
            ISSUE_NUMBERS="$(printf '%s' "${LINKED_ISSUE_FALLBACK_NUMBERS_JSON:-[]}" | jq -r '.[]' 2>/dev/null || true)"
          fi

          if [ -z "${ISSUE_NUMBERS}" ]; then
            # Fallback: strict current-repo closing-keyword refs and repo-scoped issue URLs/paths only.
            PR_DATA="$(jq -r '[.title // "", .body // ""] | join(" ")' "${PR_META_FILE}" 2>/dev/null || echo "")"
            if [ -z "$(printf '%s' "${PR_DATA}" | tr -d '[:space:]')" ]; then
              PR_DATA="$(gh_retry gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title + " " + (.body // "")' 2>/dev/null || echo "")"
            fi
            if type extract_repo_scoped_issue_refs_from_text >/dev/null 2>&1; then
              ISSUE_NUMBERS="$(extract_repo_scoped_issue_refs_from_text "${REPOSITORY}" "${PR_DATA}" || true)"
            else
              ISSUE_NUMBERS=""
            fi
            if [ -z "${ISSUE_NUMBERS}" ]; then
              echo "No linked issues found for PR #${PR_NUMBER} (even after body/title fallback)."
              exit 0
            fi
            echo "Found linked issues via PR body/title fallback: ${ISSUE_NUMBERS}"
          fi

          while IFS= read -r issue_number; do
            [ -n "${issue_number}" ] || continue
            echo "Setting ai:review-blocked on issue #${issue_number} (workflow failure)"
            set_issue_phase_label_resilient "${issue_number}" "ai:review-blocked" "${REPOSITORY}"
          done <<< "${ISSUE_NUMBERS}"

      - name: Force orchestrate poll after workflow failure review-blocked label
        # Best-effort re-poke of the orchestrator poll on the failure path.
        # Marking it continue-on-error keeps this recovery hook from being
        # reported as the step that failed the job — the job's red status
        # already reflects the original failure that triggered this path.
        continue-on-error: true
        if: failure() && env.PR_CLOSED != 'true' && env.AUTOFIX_EDITOR_EMPTY_NOOP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true' && env.RESOLVER_ESCALATED != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # REPOSITORY is referenced as ${REPOSITORY} in the run: block under
          # set -u. The codex-agent job has no job-level REPOSITORY and it is
          # never exported to $GITHUB_ENV, so it must be declared per-step here
          # (matching the rb_judge / review-blocked-label steps). Omitting it
          # aborts the force tick with "REPOSITORY: unbound variable".
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          HELPER="${SUPPORT_SCRIPTS_DIR}/orchestrate_force_tick.sh"
          if [ ! -f "${HELPER}" ]; then
            echo "::warning::orchestrate_force_tick.sh unavailable; skipping workflow-failure force tick."
            exit 0
          fi
          bash "${HELPER}" \
            --repo "${REPOSITORY}" \
            --issue "${PR_NUMBER}" \
            --reason "review-blocked" \
            --source-workflow "review_autofix" \
            --run-id "${{ github.run_id }}"

      - name: Post review-blocked comment on PR (workflow failure)
        if: failure() && env.PR_CLOSED != 'true' && env.AUTOFIX_EDITOR_EMPTY_NOOP != 'true' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true' && env.RESOLVER_ESCALATED != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Pick a body variant that doesn't contradict an editor
          # summary comment when one was already posted.
          # EDITOR_SUMMARY_POSTED=true only guarantees the summary
          # comment is visible on the PR thread; it does not by
          # itself prove editor execution succeeded (fallback summaries
          # can also be posted). Keep this branch wording limited to
          # that invariant.
          if [ "${EDITOR_SUMMARY_POSTED:-false}" = "true" ]; then
            BODY="$(cat <<EOF
          **AI review/autofix encountered a post-editor failure — needs human intervention**

          An editor summary comment is visible above, but a downstream stage still failed before completion. Possible failure domains include push, conflict resolver, label/auto-merge, or telemetry plumbing.

          [View workflow run](${RUN_URL}) for details.

          Linked issues have been labeled \`ai:review-blocked\`.
          EOF
          )"
          else
            BODY="$(cat <<EOF
          **AI review/autofix failed — needs human intervention**

          The review/autofix workflow encountered an error and could not complete. This may be due to an editor failure, missing dependencies, or an infrastructure issue.

          [View workflow run](${RUN_URL}) for details.

          Linked issues have been labeled \`ai:review-blocked\`.
          EOF
          )"
          fi

          gh_retry gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -f body="${BODY}" >/dev/null 2>&1 || true

      - name: Telegram failure
        if: failure() && env.PR_CLOSED != 'true'
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
        run: |
          source "${SUPPORT_SCRIPTS_DIR}/tg_helpers.sh"
          source "${SUPPORT_SCRIPTS_DIR}/gh_helpers.sh" 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }

          PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/${PR_NUMBER}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ISSUE_NUM="$(echo "${LINKED_ISSUES_JSON:-[]}" | jq -r '.[0].number // empty' 2>/dev/null || true)"
          MSG="PR autofix failed"
          MSG+=$'\n'
          MSG+="PR: ${PR_URL}"
          if [ -n "${ISSUE_NUM}" ]; then
            MSG+=$'\n'
            MSG+="Issue: ${{ github.server_url }}/${{ github.repository }}/issues/${ISSUE_NUM}"
          fi
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_phase_failure review_autofix "${MSG}" "ERROR" "${PR_NUMBER}"

      - name: Record review run completion in memory (fail-open)
        if: success()
        run: |
          set +e

          if [ -f "${SUPPORT_SCRIPTS_DIR}/memory_helpers.sh" ]; then
            # shellcheck disable=SC1091
            source "${SUPPORT_SCRIPTS_DIR}/memory_helpers.sh"
            memory_record_run_event \
              --run-id "${GITHUB_RUN_ID}" \
              --workflow "review_autofix" \
              --event-type "phase_completed" \
              --status "ok" \
              --message "review_autofix run completed" \
              --pr-number "${PR_NUMBER}" \
              --actor "${GITHUB_ACTOR}" \
              --metadata-json "{\"run_attempt\": ${GITHUB_RUN_ATTEMPT}}"
          else
            echo "::warning::memory helper script missing; skipping run-end completion event"
          fi

          true

      - name: Record review run failure in memory (fail-open)
        if: failure() || cancelled()
        run: |
          set +e

          if [ -f "${SUPPORT_SCRIPTS_DIR}/memory_helpers.sh" ]; then
            # shellcheck disable=SC1091
            source "${SUPPORT_SCRIPTS_DIR}/memory_helpers.sh"
            memory_record_run_event \
              --run-id "${GITHUB_RUN_ID}" \
              --workflow "review_autofix" \
              --event-type "phase_failed" \
              --status "error" \
              --message "review_autofix run failed or was cancelled" \
              --pr-number "${PR_NUMBER}" \
              --actor "${GITHUB_ACTOR}" \
              --metadata-json "{\"run_attempt\": ${GITHUB_RUN_ATTEMPT}}"
          else
            echo "::warning::memory helper script missing; skipping run-end failure event"
          fi

          true

      - name: Stage codex logs for upload (failure or empty-editor)
        # Mirrors the failure-log capture pattern PR #1940 added for
        # implement.yml. The gate is broader than a plain failure() ||
        # cancelled() because review_autofix is fail-open on editor
        # empty-output: when the editor model completes with 0-byte stdout
        # (no apply_patch invocation, no final assistant summary — see
        # the comment in the "Switch reasoning effort for editor" step
        # documenting run #25115530167 on the legacy editor
        # default) the job posts the noop-comment
        # path and exits success(), so we'd miss exactly the case this
        # artifact exists for. EDITOR_NOOP_SUSPICIOUS and
        # EDITOR_CHANGES_LOST are the two existing flags that mark
        # "editor produced nothing useful" on a job that still exited
        # success; capturing on either keeps us aligned with the
        # downstream "Telegram editor-noop-suspicious" / "Telegram
        # editor-changes-lost" alerts.
        if: always() && env.RUNTIME_DIR != '' && (failure() || cancelled() || env.EDITOR_NOOP_SUSPICIOUS == 'true' || env.EDITOR_CHANGES_LOST == 'true')
        run: |
          set -euo pipefail
          # Stage everything under RUNNER_TEMP so the Cleanup step
          # below cannot race the upload — it rm -rf's RUNTIME_DIR.
          # The upload step's path: glob is also more predictable when
          # rooted at a single dir we own.
          STAGE_DIR="${RUNNER_TEMP:-/tmp}/codex-review-autofix-failure-logs"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}/runtime" "${STAGE_DIR}/previous_reviews" "${STAGE_DIR}/codex-home-log"

          if [ -d "${RUNTIME_DIR:-}" ]; then
            # Top-level prompts, summaries, and diagnostic context. The
            # editor_* and conflict_resolver_* files are the codex stdout
            # / synthesised summaries; floor_tags / review_issues /
            # ledger_status / consolidator_raw / parser_stats are the
            # advisory editor inputs declared at the top of
            # scripts/review_apply_fixes.sh — without them a cold post-
            # mortem can't tell whether bad consolidator/parser output
            # was the upstream cause of an empty editor turn.
            # pr_check_runs_context.txt and reviewer_consensus.txt let
            # us reconstruct what context the editor saw without re-
            # fetching from the API.
            for f in editor_summary.txt editor_prompt.txt editor_prompt_body.txt \
                     pr_editor_comment.txt reviewer_consensus.txt \
                     reviewer_prompt.txt reviewer_prompt_body.txt \
                     reviewer_prompt_pass1.txt reviewer_prompt_pass2.txt \
                     cross_pollination_summary.txt \
                     reviewer_bundle.txt reviewer_manifest.txt \
                     conflict_resolver_summary.txt conflict_resolver_prompt.txt \
                     committed_files.txt pr_check_runs_context.txt \
                     pr_meta.json pr_all_comments_context.txt \
                     linked_issue_context.txt memory_context.txt \
                     pr_diff.patch original_pr_diff.patch \
                     last_run_diff.patch last_run_changed_files.txt \
                     pr_changed_files.txt last_commit_stat.txt \
                     last_run_diff_stat.txt \
                     symbol_diff_summary.txt \
                     floor_tags.txt review_issues.txt ledger_status.txt \
                     consolidator_raw.txt parser_stats.txt; do
              [ -f "${RUNTIME_DIR}/${f}" ] && \
                cp -f "${RUNTIME_DIR}/${f}" "${STAGE_DIR}/runtime/${f}" || true
            done
          fi

          # Per-attempt editor stdout / stderr — the primary signal for
          # the empty-output failure. review_apply_fixes.sh writes
          # editor_attempt_${attempt}.txt (codex stdout) and
          # editor_attempt_${attempt}.err (codex stderr) for every retry,
          # plus editor_attempt_${attempt}_changes_lost.txt when the
          # claimed-changes-lost guard fires. The reviewer-side .log /
          # .txt / status_* files plus pass1/pass2 two-pass logs and
          # consensus_pass1.txt cover the reviewer-fanout failure modes
          # (all written by review_run_reviewers.sh into
          # PREVIOUS_REVIEWS_DIR — note: reviewers produce .log not
          # .err, the .err extension is editor-only). Without these the
          # only remaining trace of why a codex stage produced 0 bytes
          # is the truncated stderr in the live job log.
          if [ -d "${PREVIOUS_REVIEWS_DIR:-}" ]; then
            for f in "${PREVIOUS_REVIEWS_DIR}"/editor_attempt_*.txt \
                     "${PREVIOUS_REVIEWS_DIR}"/editor_attempt_*.err \
                     "${PREVIOUS_REVIEWS_DIR}"/editor_attempt_*_changes_lost.txt \
                     "${PREVIOUS_REVIEWS_DIR}"/review_*.txt \
                     "${PREVIOUS_REVIEWS_DIR}"/review_*.log \
                     "${PREVIOUS_REVIEWS_DIR}"/pass1_*.txt \
                     "${PREVIOUS_REVIEWS_DIR}"/pass1_*.log \
                     "${PREVIOUS_REVIEWS_DIR}"/pass2_*.txt \
                     "${PREVIOUS_REVIEWS_DIR}"/pass2_*.log \
                     "${PREVIOUS_REVIEWS_DIR}"/status_*.txt \
                     "${PREVIOUS_REVIEWS_DIR}"/consensus_pass1.txt \
                     "${PREVIOUS_REVIEWS_DIR}"/cache_probe_*.txt \
                     "${PREVIOUS_REVIEWS_DIR}"/cache_probe_*.log; do
              [ -f "${f}" ] && cp -f "${f}" "${STAGE_DIR}/previous_reviews/" || true
            done
          fi

          # Codex CLI's own session log directory carries the raw
          # OpenRouter wire trace (request/response bodies, finish_reason,
          # tool-router rejections). The editor stage runs under the
          # default ${CODEX_HOME:-$HOME/.codex}, which survives until
          # this step. Reviewer-fanout and summariser stages run under
          # ephemeral ${RUNNER_TEMP}/codex_home_{reviewers,summariser,
          # consolidator,...} dirs that those scripts rm -rf themselves
          # before this step runs (see review_run_reviewers.sh L816,
          # L958, L970, L1019 and summarize_reviewer_consensus.sh L211
          # trap), so this glob captures editor wire logs but NOT
          # reviewer/summariser ones — those are reconstructed from the
          # PREVIOUS_REVIEWS_DIR/.log files copied above. Preserving
          # reviewer wire logs would require a script-side change
          # (logged as a follow-up). Copy unconditionally with no
          # mtime filter so multi-attempt failures don't lose the
          # earliest session log to a sliding window; retention-days
          # on the upload step bounds storage cost.
          if [ -d "${CODEX_HOME:-$HOME/.codex}/log" ]; then
            cp -rf "${CODEX_HOME:-$HOME/.codex}/log/." "${STAGE_DIR}/codex-home-log/" 2>/dev/null || true
          fi

          echo "CODEX_REVIEW_AUTOFIX_FAILURE_LOG_DIR=${STAGE_DIR}" >> "$GITHUB_ENV"
          echo "Staged $(find "${STAGE_DIR}" -type f | wc -l) file(s) for review_autofix failure-log upload."

      - name: Upload codex logs (failure or empty-editor)
        if: always() && env.CODEX_REVIEW_AUTOFIX_FAILURE_LOG_DIR != ''
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: codex-review-autofix-failure-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CODEX_REVIEW_AUTOFIX_FAILURE_LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Emit Serena stats
        if: always() && env.RUNTIME_DIR != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -f "${SUPPORT_SCRIPTS_DIR}/serena_stats_emit.py" ]; then
            echo "::notice::serena_stats_emit.py is unavailable; skipping Serena stats emission."
            exit 0
          fi

          serena_stat_args=(--target review_autofix)
          if [ -d "${PREVIOUS_REVIEWS_DIR:-}" ]; then
            while IFS= read -r -d '' log_path; do
              serena_stat_args+=(--log "${log_path}")
            done < <(find "${PREVIOUS_REVIEWS_DIR}" -maxdepth 1 -type f -name 'editor_attempt_*.err' -print0 2>/dev/null)
          fi
          if [ -d "${CODEX_HOME:-$HOME/.codex}/log" ]; then
            while IFS= read -r -d '' log_path; do
              serena_stat_args+=(--log "${log_path}")
            done < <(find "${CODEX_HOME:-$HOME/.codex}/log" -type f -print0 2>/dev/null)
          fi

          if [ "${#serena_stat_args[@]}" -le 2 ]; then
            echo "::notice::No Serena log files were found for this review_autofix run."
            exit 0
          fi

          PYTHONDONTWRITEBYTECODE=1 python3 "${SUPPORT_SCRIPTS_DIR}/serena_stats_emit.py" "${serena_stat_args[@]}"

      - name: Append review pipeline iteration summary
        if: always() && env.RUNTIME_DIR != '' && env.CLAUDE_BRANCH_REVIEW_MODE != 'true'
        continue-on-error: true
        env:
          AUTOFIX_ITERATION_METRIC: ${{ steps.retrigger_guard.outputs.autofix_iteration }}
          EDITOR_COMMIT_PRODUCED: ${{ steps.commit_changes.outputs.did_commit }}
        run: |
          set -euo pipefail

          count_nonempty_lines()
          {
            local path="$1"
            if [ ! -f "${path}" ]; then
              echo 0
              return
            fi
            awk 'NF { c++ } END { print c + 0 }' "${path}" 2>/dev/null || echo 0
          }

          file_bytes()
          {
            local path="$1"
            if [ ! -f "${path}" ]; then
              echo 0
              return
            fi
            wc -c < "${path}" 2>/dev/null | tr -d '[:space:]' || echo 0
          }

          stat_value()
          {
            local path="$1"
            local key="$2"
            local value=""
            if [ -f "${path}" ]; then
              value="$(awk -F= -v key="${key}" '$1 == key { print $2; exit }' "${path}" 2>/dev/null | tr -d '[:space:]' || true)"
            fi
            if [[ "${value}" =~ ^[0-9]+$ ]]; then
              echo "${value}"
            else
              echo 0
            fi
          }

          ledger_state_count()
          {
            local path="$1"
            local state="$2"
            if [ ! -f "${path}" ]; then
              echo 0
              return
            fi
            awk -F $'\t' -v state="${state}" '$2 == state { c++ } END { print c + 0 }' "${path}" 2>/dev/null || echo 0
          }

          iteration_label="${AUTOFIX_ITERATION_METRIC:-unknown}"
          [ -n "${iteration_label}" ] || iteration_label="unknown"

          reviewers_run="${REVIEWERS_SUCCESSFUL:-0}"
          if ! [[ "${reviewers_run}" =~ ^[0-9]+$ ]]; then
            reviewers_run=0
          fi

          reviewer_scope_label="full-diff"
          reviewer_scope_note="- Reviewer flags: checklist=${REVIEW_REVIEWER_CHECKLIST_ENABLED:-1}, iteration_scoping=${REVIEW_REVIEWER_ITERATION_SCOPING:-1} (plumbed only on this branch; reviewer scope remains full-diff)."

          reviewer_bundle_file="${RUNTIME_DIR}/reviewer_bundle.txt"
          floor_tags_file="${RUNTIME_DIR}/floor_tags.txt"
          consolidator_raw_file="${RUNTIME_DIR}/consolidator_raw.txt"
          parser_stats_file="${RUNTIME_DIR}/parser_stats.txt"
          ledger_status_file="${RUNTIME_DIR}/ledger_status.txt"

          bundle_bytes="$(file_bytes "${reviewer_bundle_file}")"
          floor_tag_count="$(count_nonempty_lines "${floor_tags_file}")"
          consolidator_output_bytes="$(file_bytes "${consolidator_raw_file}")"
          consolidator_invoked="unknown"
          if [ "${REVIEW_CONSOLIDATOR_ENABLED:-1}" = "0" ]; then
            consolidator_invoked="no"
          elif [ -f "${consolidator_raw_file}" ]; then
            if [ "${consolidator_output_bytes}" -gt 0 ]; then
              consolidator_invoked="yes"
            else
              consolidator_invoked="failed"
            fi
          fi

          parsed_blocks="$(stat_value "${parser_stats_file}" parsed_blocks)"
          passthrough_blocks="$(stat_value "${parser_stats_file}" passthrough_blocks)"
          line_unverified="$(stat_value "${parser_stats_file}" line_unverified)"

          ledger_total="$(count_nonempty_lines "${ledger_status_file}")"
          ledger_new="$(ledger_state_count "${ledger_status_file}" NEW)"
          ledger_persisting="$(ledger_state_count "${ledger_status_file}" PERSISTING)"
          ledger_fixed="$(ledger_state_count "${ledger_status_file}" FIXED)"
          ledger_resurgent="$(ledger_state_count "${ledger_status_file}" RESURGENT)"
          ledger_accepted_residual="$(ledger_state_count "${ledger_status_file}" accepted-residual)"

          editor_invoked="no"
          if [ -s "${EDITOR_SUMMARY_FILE:-/dev/null}" ]; then
            editor_invoked="yes"
          elif [ -d "${PREVIOUS_REVIEWS_DIR:-}" ] && \
            { compgen -G "${PREVIOUS_REVIEWS_DIR}/editor_attempt_*.txt" >/dev/null || compgen -G "${PREVIOUS_REVIEWS_DIR}/editor_attempt_*.err" >/dev/null; }; then
            editor_invoked="yes"
          fi

          override_count=0
          if [ -f "${EDITOR_SUMMARY_FILE:-/dev/null}" ]; then
            override_count="$(grep -c 'CONSOLIDATOR_OVERRIDDEN:' "${EDITOR_SUMMARY_FILE}" 2>/dev/null || true)"
          fi
          if ! [[ "${override_count}" =~ ^[0-9]+$ ]]; then
            override_count=0
          fi

          editor_commit_produced="${EDITOR_COMMIT_PRODUCED:-}"
          case "${editor_commit_produced}" in
            true)
              editor_commit_produced="yes"
              ;;
            false|'')
              editor_commit_produced="no"
              ;;
            *)
              editor_commit_produced="unknown"
              ;;
          esac

          {
            echo "### Review Pipeline — Iteration ${iteration_label}"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Reviewers run | ${reviewers_run} |"
            echo "| Reviewer scope | ${reviewer_scope_label} |"
            echo "| Raw bundle size (bytes) | ${bundle_bytes} |"
            echo "| Floor tags | ${floor_tag_count} |"
            echo "| Consolidator model | ${REVIEW_CONSOLIDATOR_MODEL:-openai/gpt-5.4} |"
            echo "| Consolidator invoked | ${consolidator_invoked} |"
            echo "| Consolidator output bytes | ${consolidator_output_bytes} |"
            echo "| Parsed issue blocks | ${parsed_blocks} |"
            echo "| Passthrough blocks | ${passthrough_blocks} |"
            echo "| Line-unverified blocks | ${line_unverified} |"
            echo "| Ledger entries total | ${ledger_total} |"
            echo "| NEW | ${ledger_new} |"
            echo "| PERSISTING | ${ledger_persisting} |"
            echo "| FIXED | ${ledger_fixed} |"
            echo "| RESURGENT | ${ledger_resurgent} |"
            echo "| accepted-residual | ${ledger_accepted_residual} |"
            echo "| Editor invoked | ${editor_invoked} |"
            echo "| CONSOLIDATOR_OVERRIDDEN count | ${override_count} |"
            echo "| Editor commit produced | ${editor_commit_produced} |"
            echo
            echo "**Acceptance deltas vs prior iteration:**"
            echo "${reviewer_scope_note}"
            if [ "${consolidator_invoked}" = "failed" ]; then
              echo "- Consolidator output was empty while REVIEW_CONSOLIDATOR_ENABLED=${REVIEW_CONSOLIDATOR_ENABLED:-1}; downstream parser/editor stayed fail-open on local artifacts."
            else
              echo "- none"
            fi
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Cleanup temporary artifacts
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE}/.codex-workflow-src-main"

          # Guard: RUNTIME_DIR is only written to $GITHUB_ENV by the
          # Create runtime workspace step.  If an earlier step failed
          # before that step ran, expanding "${RUNTIME_DIR}" under set -u
          # would raise "unbound variable" and mask the real root-cause
          # error.  Skip cleanly when unset (nothing to clean up anyway).
          if [ -n "${RUNTIME_DIR:-}" ]; then
            rm -rf "${RUNTIME_DIR}"
          fi

          # Also clean the failure-log staging dir so successive runs on
          # a warm runner don't see a stale copy. Path-shape regex guard
          # mirrors the RUNTIME_DIR guard above and the equivalent
          # cleanup PR #1940 added in implement.yml.
          if [ -n "${CODEX_REVIEW_AUTOFIX_FAILURE_LOG_DIR:-}" ] && \
             [[ "${CODEX_REVIEW_AUTOFIX_FAILURE_LOG_DIR}" =~ ^${RUNNER_TEMP:-/tmp}/codex-review-autofix-failure-logs$ ]]; then
            rm -rf "${CODEX_REVIEW_AUTOFIX_FAILURE_LOG_DIR}"
          fi

          # Remove workflow-fetched support files that were preserved for
          # notification steps (tg_helpers.sh, label_helpers.sh, etc.).
          # Skip when running on coding-workflows itself — these are source.
          if [ "${IS_WORKFLOW_SOURCE_REPO:-false}" != "true" ]; then
            rm -f scripts/gh_helpers.sh scripts/pr_checks_lib.sh scripts/git_ref_health_check.sh scripts/generate_symbol_diff_summary.py scripts/label_helpers.sh scripts/tg_helpers.sh scripts/memory_helpers.sh scripts/ai_memory.py scripts/ai_memory_lib.py scripts/openrouter_prompt_cache.py scripts/cost_audit.py scripts/codex_heartbeat.sh scripts/codex_model_catalog.json scripts/review_run_reviewers.sh scripts/review_apply_fixes.sh scripts/review_rb_judge.sh scripts/summarize_reviewer_consensus.sh scripts/check_external_branch_advance.sh
            rm -rf prompts
            rm -f .github/ai/orchestrate_schema.v1.json
          fi

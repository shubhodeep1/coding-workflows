name: "Internal: AI Review & Autofix"
# Dispatched runs carry their PR in the run name. review_autofix_sweep.yml
# dispatches from the default branch only (issue #4618: never an unmerged
# head ref), so the run's head_branch no longer identifies the PR; the sweep's
# active-run snapshot and the poller's _has_active_autofix_run match this
# exact name instead. Every other event gets an empty expression, which GitHub
# replaces with its event-specific default (PR title / commit message).
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Internal: AI Review & Autofix [pr:{0}]', inputs.pr_number) || '' }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  # Push to claude/** triggers the no-PR claude-branch-review path: the
  # resolve-claude-branch-pr job below first checks whether an open PR
  # already exists for the head branch (in which case the parallel
  # pull_request:synchronize trigger handles it and this leg exits to
  # avoid double-firing).  When no PR exists, the review-claude-branch-push
  # job calls review_autofix.yml with force_claude_branch_review=true and
  # the head/sha/base overrides so the codex-agent runs the reviewer panel
  # + summariser and posts the consensus ledger as a commit comment via
  # scripts/post_review_comment.sh.
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review (used by autofix re-trigger)"
        required: true
        type: string
      allow_workflow_edits:
        description: "Allow AI/editor changes to .github/workflows files"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

# De-duplicate review runs on the same branch. A push to claude/** and
# a pull_request:opened/synchronize event for the same head ref can both
# arrive around PR creation time. PR-backed claude/** branches now use the
# same full autofix loop as every other PR, so do not cancel in-progress PR
# runs on autofix pushes; otherwise the [ai-autofix] synchronize event can
# kill the run before its continuation dispatch. Keep push and pull_request
# events in separate concurrency groups so the no-PR push route only cancels
# stale in-flight reviewer-comment runs.
#
# workflow_dispatch is keyed separately on inputs.pr_number, because on
# manual dispatch head_ref is empty and ref_name is the workflow's ref
# (typically the default branch) — without a PR-scoped key, manual
# re-triggers for different PRs would cancel each other.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('internal-review-dispatch-pr-{0}', github.event.inputs.pr_number) || format('internal-review-{0}-{1}', github.event_name, github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'claude/') }}

jobs:
  review:
    if: ${{ github.event_name != 'push' && (github.event.action != 'closed' || github.event.pull_request.merged == true) }}
    uses: shubhodeep1/coding-workflows/.github/workflows/review_autofix.yml@main
    with:
      pr_number: ${{ github.event.inputs.pr_number || github.event.pull_request.number || '' }}
      pr_is_draft: >-
        ${{ github.event_name != 'workflow_dispatch' && github.event.pull_request.draft || false }}
      pr_title: >-
        ${{ github.event_name != 'workflow_dispatch' && format('{0}', github.event.pull_request.title) || '' }}
      pr_body: >-
        ${{ github.event_name != 'workflow_dispatch' && format('{0}', github.event.pull_request.body) || '' }}
      pr_skip_ai: false
      allow_workflow_edits: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.allow_workflow_edits == 'true') || (github.event_name != 'workflow_dispatch' && contains(' 1 true yes on ', format(' {0} ', vars.ALLOW_WORKFLOW_EDITS || 'true'))) }}
    secrets: inherit

  # Push to claude/** path:
  # On every push to a claude/** branch, look up whether an open PR
  # already exists for the branch.  If yes, skip — the parallel
  # pull_request:synchronize trigger handles the review and double-firing
  # would waste LLM budget.  If no PR exists, emit the head ref / SHA /
  # base ref so review-claude-branch-push can dispatch review_autofix.yml
  # in the no-PR claude-branch-review path (commit-comment route).
  #
  # Grace window: Claude sessions push a new branch and open its PR a few
  # seconds later (median 20s over 151 cases, 2026-09-23..30), so a single
  # lookup at push time found no PR and the full reviewer panel ran twice on
  # the same commit (once here, once on pull_request:opened) -- ~9% of the
  # week's glm-5.2 reviewer tokens.  When no PR exists, the step re-checks
  # every 60s for up to vars.CLAUDE_BRANCH_PUSH_PR_GRACE_SECONDS (default
  # 300; 0 restores the single lookup; invalid values fall back to 300) and
  # skips as soon as a PR appears.  A failed lookup counts as "no PR yet"
  # (fail open: the review still runs once the window ends).
  resolve-claude-branch-pr:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
    steps:
      - name: Resolve PR for head branch
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || '' }}
          CLAUDE_BRANCH_PUSH_PR_GRACE_SECONDS: ${{ vars.CLAUDE_BRANCH_PUSH_PR_GRACE_SECONDS || '300' }}
        run: |
          set -euo pipefail
          base_ref=""
          encoded_head_ref="$(jq -nr --arg ref "${HEAD_REF}" '$ref | @uri')"
          pr_grace_default_secs=300
          pr_grace_max_secs=3600
          pr_recheck_interval_secs=60
          pr_grace_secs="${CLAUDE_BRANCH_PUSH_PR_GRACE_SECONDS:-${pr_grace_default_secs}}"
          if ! [[ "${pr_grace_secs}" =~ ^[0-9]{1,5}$ ]] || [ "$((10#${pr_grace_secs}))" -gt "${pr_grace_max_secs}" ]; then
            echo "::warning::CLAUDE_BRANCH_PUSH_PR_GRACE_SECONDS='${pr_grace_secs}' is not an integer between 0 and ${pr_grace_max_secs}; using ${pr_grace_default_secs}."
            pr_grace_secs="${pr_grace_default_secs}"
          fi
          pr_grace_secs="$((10#${pr_grace_secs}))"
          pr_waited_secs=0
          pr_lookup_failures=0
          # Look up open PRs for this exact head branch.  Filter to PRs
          # whose head ref matches the pushed branch — `gh pr list --head`
          # already does this — and consider only OPEN PRs (closed/merged
          # PRs do not double-fire, but the API call returns them too if
          # state filter is omitted).
          # A failed lookup logs gh's error text (one line, printable
          # characters only, no double quotes, at most 200 chars) so the
          # cause is visible: PR #5462's first live run failed every re-check
          # on a GH_PAT "API rate limit exceeded" that stderr had hidden.
          pr_lookup_err_file="$(mktemp)"
          lookup_open_pr() {
            local pr_lookup_error
            if ! existing_pr="$(gh api \
              "repos/${REPOSITORY}/pulls?state=open&head=${REPOSITORY%/*}:${encoded_head_ref}" \
              --jq '[.[] | .number] | first // empty' 2>"${pr_lookup_err_file}")"; then
              existing_pr=""
              pr_lookup_failures=$((pr_lookup_failures + 1))
              pr_lookup_error="$(tr -c '[:print:]' ' ' < "${pr_lookup_err_file}" | tr -d '"' | tr -s ' ' | sed 's/^ //; s/ $//' | cut -c1-200)"
              echo "RESOLVE_CLAUDE_BRANCH_PR_LOOKUP_FAILED head_ref=${HEAD_REF} waited_secs=${pr_waited_secs} failures=${pr_lookup_failures} error=\"${pr_lookup_error:-no error text}\""
            fi
          }
          lookup_open_pr
          while [ -z "${existing_pr}" ] && [ "${pr_waited_secs}" -lt "${pr_grace_secs}" ]; do
            pr_sleep_secs=$((pr_grace_secs - pr_waited_secs))
            if [ "${pr_sleep_secs}" -gt "${pr_recheck_interval_secs}" ]; then
              pr_sleep_secs="${pr_recheck_interval_secs}"
            fi
            echo "RESOLVE_CLAUDE_BRANCH_PR_WAIT head_ref=${HEAD_REF} head_sha=${HEAD_SHA} waited_secs=${pr_waited_secs} grace_secs=${pr_grace_secs} next_check_in_secs=${pr_sleep_secs}"
            sleep "${pr_sleep_secs}"
            pr_waited_secs=$((pr_waited_secs + pr_sleep_secs))
            lookup_open_pr
          done
          if [ -n "${existing_pr}" ]; then
            echo "RESOLVE_CLAUDE_BRANCH_PR_SKIP head_ref=${HEAD_REF} existing_pr=${existing_pr} reason=pull_request_synchronize_handles waited_secs=${pr_waited_secs}"
            {
              echo "proceed=false"
              echo "head_ref=${HEAD_REF}"
              echo "head_sha=${HEAD_SHA}"
              echo "base_ref=${base_ref}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base_ref="${EVENT_DEFAULT_BRANCH:-}"
          if [ -z "${base_ref}" ]; then
            base_ref="$(gh api "repos/${REPOSITORY}" --jq '.default_branch' 2>/dev/null || echo 'main')"
          fi
          echo "RESOLVE_CLAUDE_BRANCH_PR_PROCEED head_ref=${HEAD_REF} head_sha=${HEAD_SHA} base_ref=${base_ref} reason=no_open_pr waited_secs=${pr_waited_secs} grace_secs=${pr_grace_secs} lookup_failures=${pr_lookup_failures}"
          {
            echo "proceed=true"
            echo "head_ref=${HEAD_REF}"
            echo "head_sha=${HEAD_SHA}"
            echo "base_ref=${base_ref}"
          } >> "${GITHUB_OUTPUT}"

  review-claude-branch-push:
    needs: resolve-claude-branch-pr
    if: ${{ github.event_name == 'push' && needs.resolve-claude-branch-pr.outputs.proceed == 'true' }}
    uses: shubhodeep1/coding-workflows/.github/workflows/review_autofix.yml@main
    with:
      pr_number: ""
      pr_is_draft: false
      pr_title: ""
      pr_body: ""
      pr_skip_ai: false
      allow_workflow_edits: false
      force_claude_branch_review: true
      head_ref_override: ${{ needs.resolve-claude-branch-pr.outputs.head_ref }}
      head_sha_override: ${{ needs.resolve-claude-branch-pr.outputs.head_sha }}
      base_ref_override: ${{ needs.resolve-claude-branch-pr.outputs.base_ref }}
    secrets: inherit

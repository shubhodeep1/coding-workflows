name: "Internal: AI Review & Autofix"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review (used by autofix re-trigger)"
        required: true
        type: string
      allow_workflow_edits:
        description: "Allow AI/editor changes to .github/workflows files"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # Gate: skip synchronize events caused by autofix commits.  The autofix
  # workflow already re-dispatches itself via workflow_dispatch, so the
  # synchronize trigger is redundant and causes the completing run to
  # appear "cancelled" due to the concurrency group.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check head commit message
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.action }}" = "synchronize" ]; then
            msg=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}" --jq '.commit.message' 2>/dev/null | head -1 || true)
            if printf '%s\n' "${msg}" | grep -q '^\[ai-autofix\]'; then
              echo "Skipping: head commit is an autofix commit"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  review:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    uses: ./.github/workflows/review_autofix.yml
    with:
      pr_number: ${{ github.event.inputs.pr_number || '' }}
      allow_workflow_edits: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.allow_workflow_edits == 'true') || (github.event_name != 'workflow_dispatch' && vars.ALLOW_WORKFLOW_EDITS != 'false') }}
    secrets: inherit

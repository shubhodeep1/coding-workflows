name: AI Plan

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true
      OPENROUTER_API_KEY:
        required: true
      TG_BOT_SECRET:
        required: false

jobs:
  plan:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request == null &&
      (
        (
          github.event.comment.user.type == 'User' &&
          contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        ) ||
        (
          github.event.comment.user.type == 'Bot' &&
          github.event.comment.user.login == 'github-actions[bot]' &&
          startsWith(github.event.comment.body, '/answer') &&
          contains(github.event.comment.body, '[auto-answered-by-clarify]')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      SKIP_PLAN: "false"
      MODEL_EDITOR: ${{ vars.WORKFLOW_EDITOR_MODEL || 'openai/gpt-5.3-codex' }}
      MODEL_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_PLAN || 'xhigh' }}
      AUTO_IMPLEMENT_ON_CLEAR_PLAN: ${{ vars.AUTO_IMPLEMENT_ON_CLEAR_PLAN || 'false' }}
      PLAN_FAILURE_CONTEXT: "Planning run did not complete."
      CODEX_VERSION: ${{ vars.CODEX_VERSION || 'v0.114.0' }}

    steps:
      - name: Cache Codex CLI
        id: cache-codex
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/codex
          key: codex-${{ vars.CODEX_VERSION || 'v0.114.0' }}

      - name: Install Codex CLI
        if: steps.cache-codex.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          npm install -g @openai/codex@"${CODEX_VERSION}" --no-audit --no-fund
          # Persist to tool cache for future runs
          CODEX_BIN="$(which codex)"
          CODEX_DIR="$(dirname "${CODEX_BIN}")"
          mkdir -p "${{ runner.tool_cache }}/codex"
          cp -r "$(npm root -g)/@openai/codex" "${{ runner.tool_cache }}/codex/package"
          cp "${CODEX_BIN}" "${{ runner.tool_cache }}/codex/codex"

      - name: Restore Codex CLI from cache
        if: steps.cache-codex.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          npm install -g "${{ runner.tool_cache }}/codex/package" --no-audit --no-fund

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Install uv for Serena
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ vars.UV_VERSION || 'latest' }}

      - name: Fetch workflow support scripts
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # When called as a reusable workflow from another repo, the caller's
          # repo is checked out and this repo's scripts/ directory is absent.
          # NOTE: github.workflow_ref resolves to the *caller* workflow, not
          # this reusable workflow, so we cannot derive the source repo from it.
          wf_source="${{ github.repository_owner }}/coding-workflows"
          # ALWAYS fetch canonical scripts from coding-workflows, even if the
          # caller repo ships its own scripts/ directory. Stale caller-repo
          # scripts cause silent MCP failures.
          mkdir -p scripts
          for f in setup_serena.sh git_ref_health_check.sh; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${wf_source}/contents/scripts/${f}?ref=stable" > "scripts/${f}"
            chmod +x "scripts/${f}"
          done
          # Always use the canonical instruction files from coding-workflows
          # (must be outside the if-block so they're fetched even when the
          # caller repo ships its own scripts/ directory)
          for f in codex_system_instructions.md ai_pipeline.md; do
            if [ ! -f "${f}" ]; then
              gh api -H 'Accept: application/vnd.github.raw+json' \
                "repos/${wf_source}/contents/${f}?ref=stable" > "${f}"
            fi
          done

      - name: Create runtime workspace
        run: |
          set -euo pipefail
          RUNTIME_DIR="/tmp/codex-plan-${GITHUB_RUN_ID}"
          mkdir -p "${RUNTIME_DIR}"
          {
            echo "RUNTIME_DIR=${RUNTIME_DIR}"
            echo "ISSUE_META_FILE=${RUNTIME_DIR}/issue_meta.json"
            echo "ISSUE_COMMENTS_FILE=${RUNTIME_DIR}/issue_comments.json"
            echo "PLANNING_CONTEXT_FILE=${RUNTIME_DIR}/planning_context.txt"
            echo "CODEX_PROMPT_FILE=${RUNTIME_DIR}/codex_prompt.txt"
            echo "CODEX_OUTPUT_FILE=${RUNTIME_DIR}/codex_output.txt"
            echo "PLAN_COMMENT_FILE=${RUNTIME_DIR}/plan_comment.md"
          } >> "$GITHUB_ENV"

      - name: Fetch issue metadata
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}" > "${ISSUE_META_FILE}"

          ISSUE_BODY="$(jq -r '.body // ""' "${ISSUE_META_FILE}")"
          ISSUE_NUMBER_JSON="$(jq -r '.number' "${ISSUE_META_FILE}")"
          ISSUE_URL_JSON="$(jq -r '.html_url' "${ISSUE_META_FILE}")"

          # TRUST BOUNDARY: ISSUE_BODY is user-controlled content from the GitHub
          # issue. It is passed via heredoc (not shell expansion) to prevent injection
          # into shell commands. Downstream consumers must treat it as untrusted input.
          {
            echo "ISSUE_NUMBER=${ISSUE_NUMBER_JSON}"
            echo "ISSUE_URL=${ISSUE_URL_JSON}"
            echo 'ISSUE_BODY<<EOF'
            echo "${ISSUE_BODY}"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Fetch issue comments
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments?per_page=100" > "${ISSUE_COMMENTS_FILE}"

      - name: Validate planning phase label
        if: env.SKIP_PLAN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRIGGER_COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${TRIGGER_COMMENT_BODY}" | perl -0777 -ne 'exit((/^\s*\/answer\b/is) ? 0 : 1)'; then
            echo "Comment does not begin with /answer on first non-whitespace content. Skipping planning run."
            echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # Reuse already-fetched issue metadata instead of a redundant API call
          ISSUE_LABELS_JSON="$(jq -c '[.labels[].name]' "${ISSUE_META_FILE}")"
          if printf '%s' "${ISSUE_LABELS_JSON}" | jq -e 'index("ai:planning") != null' >/dev/null; then
            echo "Issue #${ISSUE_NUMBER} is already in ai:planning phase."
          elif printf '%s' "${ISSUE_LABELS_JSON}" | jq -e 'index("ai:clarification") != null' >/dev/null; then
            echo "Issue #${ISSUE_NUMBER} is in ai:clarification phase; transitioning to ai:planning for /answer processing."
            gh api -X POST "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels" -f labels[]='ai:planning' >/dev/null
            gh api -X DELETE "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels/ai:clarification" >/dev/null 2>&1 || true
          else
            echo "Issue #${ISSUE_NUMBER} has neither ai:planning nor ai:clarification labels. Skipping planning run."
            echo "Current labels: ${ISSUE_LABELS_JSON}"
            echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
            exit 0
          fi

      - name: Skip when issue already has a PR
        if: env.SKIP_PLAN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # Use the issue timeline API to find PRs that are actually
          # cross-referenced to this issue (not just text matches).
          # The previous gh pr list --search approach produced false positives
          # when unrelated PRs happened to mention the issue number.
          LINKED_PR_COUNT="$(gh api --paginate \
            "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/timeline" \
            --jq '
              [.[]
               | select(.event == "cross-referenced")
               | select(.source.issue.pull_request != null)
               | select(.source.issue.state == "open")
              ] | length
            ')"
          if [ "${LINKED_PR_COUNT}" -gt 0 ]; then
            echo "Issue #${ISSUE_NUMBER} already has at least one open PR. Skipping planning run."
            echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
          fi

      - name: Skip stale /answer comments
        if: env.SKIP_PLAN != 'true'
        env:
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail

          LATEST_ANSWER_COMMENT_ID="$(jq -r '
            [ .[] | select((.body // "") | test("(?i)^\\s*/answer\\b")) ]
            | sort_by(.created_at)
            | last
            | .id // ""
          ' "${ISSUE_COMMENTS_FILE}")"

          if [ -z "${LATEST_ANSWER_COMMENT_ID}" ] || [ "${LATEST_ANSWER_COMMENT_ID}" = "null" ]; then
            echo "No start-of-comment /answer command found. Skipping planning run."
            echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Triggering comment ID: ${TRIGGER_COMMENT_ID}"
          echo "Latest /answer comment ID: ${LATEST_ANSWER_COMMENT_ID}"

          if [ "${LATEST_ANSWER_COMMENT_ID}" != "${TRIGGER_COMMENT_ID}" ]; then
            echo "Skipping stale /answer comment ${TRIGGER_COMMENT_ID}; latest is ${LATEST_ANSWER_COMMENT_ID}."
            echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
            exit 0
          fi

      - name: Extract clarification answers and questions
        if: env.SKIP_PLAN != 'true'
        env:
          TRIGGER_COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          write_multiline_env() {
            local key="$1"
            local value="$2"
            local delim
            delim="EOF_$(date +%s%N)_$RANDOM"
            {
              printf '%s<<%s\n' "$key" "$delim"
              printf '%s\n' "$value"
              printf '%s\n' "$delim"
            } >> "$GITHUB_ENV"
          }

          ANSWER_COMMENT_BODY="$(jq -r '
            [ .[] | select((.body // "") | test("(?i)^\\s*/answer\\b")) ]
            | sort_by(.created_at)
            | last
            | .body // ""
          ' "${ISSUE_COMMENTS_FILE}")"

          if [ -z "${ANSWER_COMMENT_BODY}" ] || [ "${ANSWER_COMMENT_BODY}" = "null" ]; then
            echo "No /answer comment found in thread; using triggering comment body."
            ANSWER_COMMENT_BODY="${TRIGGER_COMMENT_BODY}"
          fi

          USER_ANSWERS="$(printf '%s' "${ANSWER_COMMENT_BODY}" | perl -0777 -pe 's/^\s*\/answer\b\s*//is')"
          if [ -z "${USER_ANSWERS}" ]; then
            USER_ANSWERS="(No content provided after /answer.)"
          fi

          CLARIFICATION_QUESTIONS="$(jq -r '
            def ix_of_latest_answer:
              ([ .
                | to_entries[]
                | select((.value.body // "") | test("(?i)^\\s*/answer\\b"))
                | .key
              ] | last);

            . as $all
            | (ix_of_latest_answer) as $idx
            | if ($idx == null) then
                ""
              else
                [ range(0; $idx) as $i | $all[$i] ]
                | reverse
                | map(select(
                    ((.user.type // "") != "User") or
                    ((.body // "") | test("Q[0-9]+:|QUESTIONS:|clarification"; "i"))
                  ))
                | if length > 0 then .[0].body // "" else "" end
              end
          ' "${ISSUE_COMMENTS_FILE}")"

          if [ -z "${CLARIFICATION_QUESTIONS}" ]; then
            CLARIFICATION_QUESTIONS="(No clarification questions were required. Continuation was confirmed with /answer.)"
          fi

          write_multiline_env "USER_ANSWERS" "${USER_ANSWERS}"
          write_multiline_env "CLARIFICATION_QUESTIONS" "${CLARIFICATION_QUESTIONS}"

      - name: Build planning context
        if: env.SKIP_PLAN != 'true'
        run: |
          set -euo pipefail
          {
            echo "ISSUE DESCRIPTION"
            printf '%s\n\n' "${ISSUE_BODY}"
            echo "CLARIFICATION QUESTIONS"
            printf '%s\n\n' "${CLARIFICATION_QUESTIONS}"
            echo "USER ANSWERS"
            printf '%s\n\n' "${USER_ANSWERS}"
            echo "ALL COMMENTS"
            jq -r 'sort_by(.created_at)[] | "[" + (.created_at // "") + "] @" + (.user.login // "unknown") + ":\n" + (.body // "") + "\n"' "${ISSUE_COMMENTS_FILE}"
          } > "${PLANNING_CONTEXT_FILE}"

      - name: Create Codex config
        if: env.SKIP_PLAN != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.codex
          {
            echo 'web_search = "live"'
            echo 'model_provider = "openrouter"'
            echo "model = \"${MODEL_EDITOR}\""
              echo "model_reasoning_effort = \"${MODEL_REASONING_EFFORT}\""
            echo
            echo '[model_providers.openrouter]'
            echo 'name = "OpenRouter"'
            echo 'base_url = "https://openrouter.ai/api/v1"'
            echo 'env_key = "OPENROUTER_API_KEY"'
            echo 'wire_api = "responses"'
            echo 'stream_idle_timeout_ms = 600000'
            echo 'stream_max_retries = 5'
            echo 'request_max_retries = 3'
            echo
            echo '[sandbox_workspace_write]'
            echo 'network_access = true'
          } > ~/.codex/config.toml
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

      - name: Setup Serena MCP server
        if: env.SKIP_PLAN != 'true'
        env:
          SERENA_VERSION: ${{ vars.SERENA_VERSION || 'main' }}
          SERENA_LANGUAGES: ${{ vars.SERENA_LANGUAGES || '' }}
          SERENA_DISABLED: ${{ vars.SERENA_DISABLED || 'false' }}
          SERENA_IGNORED_DIRS: ${{ vars.SERENA_IGNORED_DIRS || '' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          bash scripts/setup_serena.sh --mode planning --context codex

      - name: Pre-assemble static context (cacheable across runs)
        if: env.SKIP_PLAN != 'true'
        run: |
          set -euo pipefail

          if [ ! -f codex_system_instructions.md ] || [ ! -f ai_pipeline.md ]; then
            echo "Missing required codex input file(s): codex_system_instructions.md and/or ai_pipeline.md"
            exit 1
          fi

          # Split context into static (constant across runs) and dynamic (per-issue)
          # files. This enables LLM prompt caching: the static prefix is identical
          # across all runs, so the provider can cache it and charge reduced rates
          # for subsequent requests. Bundling everything into one file defeats
          # prefix caching because the dynamic issue context changes every run.
          {
            echo "=== SYSTEM INSTRUCTIONS ==="
            cat codex_system_instructions.md
            echo
            echo "=== AI PIPELINE ==="
            cat ai_pipeline.md
            echo
            if [ -f agents.md ]; then
              echo "=== AGENTS.MD ==="
              cat agents.md
              echo
            fi
            if [ -f README.md ]; then
              echo "=== README.MD ==="
              cat README.md
              echo
            fi
          } > ./pre_assembled_static.txt

      - name: Run Codex planning
        if: env.SKIP_PLAN != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOOL_CALL_BUDGET: ${{ vars.TOOL_CALL_BUDGET_PLAN || '40' }}
        run: |
          set -euo pipefail

          # Build prompt: static context + instructions + dynamic planning context,
          # all inlined so the model doesn't waste tool calls reading files.
          # The static prefix (pre_assembled_static.txt) is identical across all
          # runs, enabling LLM provider prompt-prefix caching.
          {
            cat ./pre_assembled_static.txt
            echo
            # Inject the configurable tool call budget before the static heredoc
            echo "TOOL_CALL_BUDGET: ${TOOL_CALL_BUDGET}"
            echo
            cat <<'EOF'
          === PLANNING TASK ===

          You are executing the PLANNING phase of the AI development pipeline.

          Your task is to generate an implementation plan for the GitHub issue.

          IMPORTANT: The system instructions, AI pipeline spec, agents.md, and README.md
          are provided ABOVE in this prompt. Do NOT read pre_assembled_static.txt or
          any of the individual source files — they are already loaded.

          The planning context (issue description, clarification Q&A, and comments) is
          provided BELOW at the end of this prompt — do NOT read planning_context.txt
          separately.

          Use Serena MCP tools or targeted file reads only for specific code
          symbols/functions you need to inspect for the plan.

          SERENA MCP EFFICIENCY (MANDATORY):
          - Do NOT call onboarding, initial_instructions, or check_onboarding_performed.
            Skip straight to activate_project and then use tools directly.
          - Prefer get_symbols_overview and find_symbol over raw file reads.
          - Never read the same file region twice. Plan reads upfront.
          - For large files (>5000 lines), use get_symbols_overview with depth=0 first to
            get a high-level map, then drill into specific symbols with find_symbol.
            Do NOT use depth=1+ on very large files — it will exceed character limits.
          - When search_for_pattern returns "answer is too long", NARROW the query (target
            a single function/class name or a specific subdirectory). Do NOT retry the same
            broad pattern or fall back to shell grep/rg with equivalent patterns.

          EXPLORATION STRATEGY (MANDATORY — prevents over-reading):
          - When adding a new game/feature/module that follows existing patterns, study ONE
            representative existing implementation end-to-end rather than reading all of them.
            For example: to plan a new game, read the most structurally similar existing game
            (its backend logic, template, JS, and relevant DB contracts) instead of reading
            every game. Reference the representative in the plan so the implementer knows
            which pattern to follow.
          - For the representative, read: (1) its entry in the game/feature registry,
            (2) its core logic function, (3) its template/frontend, (4) its autobet/auto
            integration if applicable. Skip the others — they follow the same pattern.
          - Only read additional games/features if the plan requires behavior that differs
            from the representative.

          EFFICIENCY RULES (MANDATORY — reduces token waste):
          - Read ONLY the specific lines/symbols you need. Do NOT read entire files or
            request large ranges speculatively. Use Serena symbol tools or targeted line
            ranges (e.g. sed -n '10,30p') instead of full-file reads.
          - Never read the same file region twice. Plan your reads upfront.
          - Prefer Serena MCP tools (get_symbols_overview, find_symbol) over raw file reads
            when available — they return only relevant symbols with far fewer tokens.
          - When a Serena search hits its character limit, do NOT fall back to shell grep/rg
            with the same patterns. Refine the Serena query or narrow the scope instead.
          - Aim to keep total tool calls (MCP + shell exec combined) under TOOL_CALL_BUDGET.
            For large refactors that span many files/modules, exceeding the budget is
            acceptable — the budget is a guideline to prevent waste, not a hard cap.
          - Batch shell searches with && or ;.
          - Focus exploration on code areas directly relevant to the plan. Avoid reading
            files that are unlikely to change or inform the implementation.
          - Do NOT emit progress/status messages (e.g. "I've parsed the answers…"). Output
            ONLY the final plan or clarification result.

          CONFLICT DETECTION:
          - Flag any factual conflicts between the issue description and the codebase
            (e.g., a name in the issue doesn't match the name in the code, a file path
            referenced in the issue doesn't exist, or an API signature differs).
          - When a conflict is found, note it explicitly in the plan so the implementer
            and reviewer are aware.

          Your job:

          Create a structured implementation plan that includes:

          1. Files likely to change
          2. Functions or modules to implement
          3. Data structures affected
          4. API or interface changes
          5. Potential risks or edge cases
          6. Testing considerations

          Rules:

          - Before planning, always read and interpret the user clarification answers from
            the planning context provided below.
          - Multiple-choice answers may appear in flexible formats and casing (for example:
            `q1: a q2: c q3:d`, multiline variants, or `Q1: A`). Interpret intent without
            enforcing strict formatting.
          - Do not require exact answer formatting and do not depend on regex-style strictness
            in reasoning.
          - Map each interpreted answer back to its corresponding Q<ID> clarification question
            before creating the plan.
          - If any answer is missing, contradictory, or unclear after best-effort interpretation,
            do NOT guess: return clarification questions in the codex_system_instructions.md
            mandatory Q<ID>/Choices format and state that clarification is required before planning.
          - Use web search when needed to validate unknowns.
          - If implementation requires calling external APIs/services, read their official API
            docs and include concrete endpoint/method/parameter details in the plan so the
            implementation editor can execute without web access.
          - Do NOT write code.
          - Do NOT modify repository files.
          - Only generate the implementation plan when answers are interpretable and sufficient.

          The output must be plain text suitable for posting as an issue comment.
          EOF
            echo
            echo "=== PLANNING CONTEXT ==="
            cat "${PLANNING_CONTEXT_FILE}"
          } > "${CODEX_PROMPT_FILE}"

          # ── Heartbeat-based timeout (inlined — reusable workflows run in caller's workspace) ──
          HEARTBEAT_FILE="$(mktemp /tmp/heartbeat.XXXXXX)"
          date +%s > "${HEARTBEAT_FILE}"
          _HEARTBEAT_START_TIME="$(date +%s)"
          _HB_IDLE="${HEARTBEAT_IDLE_TIMEOUT:-900}"
          _HB_WALL="${HEARTBEAT_MAX_WALL:-7200}"
          heartbeat_touch() { [ -n "${HEARTBEAT_FILE}" ] && printf '%s' "$(date +%s)" > "${HEARTBEAT_FILE}.tmp" && mv -f "${HEARTBEAT_FILE}.tmp" "${HEARTBEAT_FILE}" 2>/dev/null; }
          heartbeat_tee() {
            local outfile="${1:-}"
            if [ -n "$outfile" ]; then
              while IFS= read -r line || [ -n "$line" ]; do heartbeat_touch; printf '%s\n' "$line"; printf '%s\n' "$line" >> "$outfile"; done
            else
              while IFS= read -r line || [ -n "$line" ]; do heartbeat_touch; printf '%s\n' "$line"; done
            fi
          }
          heartbeat_stop() {
            [ -n "${HEARTBEAT_WATCHDOG_PID:-}" ] && { kill "${HEARTBEAT_WATCHDOG_PID}" 2>/dev/null; wait "${HEARTBEAT_WATCHDOG_PID}" 2>/dev/null || true; }; HEARTBEAT_WATCHDOG_PID=""
            [ -n "${HEARTBEAT_FILE:-}" ] && rm -f "${HEARTBEAT_FILE}" "${HEARTBEAT_FILE}.tmp"; HEARTBEAT_FILE=""
          }
          ( while true; do sleep 10; now="$(date +%s)"; last="$(cat "${HEARTBEAT_FILE}" 2>/dev/null || echo "$now")"
            # Guard against empty/corrupt reads from race condition
            [[ "${last}" =~ ^[0-9]+$ ]] || last="${now}"
            [ $(( now - last )) -ge "${_HB_IDLE}" ] && echo "" >&2 && echo "::error::heartbeat: no output for $(( now - last ))s (limit: ${_HB_IDLE}s) — terminating" >&2 && kill -TERM "$$" 2>/dev/null && sleep 10 && kill -KILL "$$" 2>/dev/null && exit 142
            [ $(( now - _HEARTBEAT_START_TIME )) -ge "${_HB_WALL}" ] && echo "" >&2 && echo "::error::heartbeat: max wall time ${_HB_WALL}s exceeded — terminating" >&2 && kill -TERM "$$" 2>/dev/null && sleep 10 && kill -KILL "$$" 2>/dev/null && exit 143
          done ) &
          HEARTBEAT_WATCHDOG_PID=$!
          echo "heartbeat: watchdog started (idle=${_HB_IDLE}s, max_wall=${_HB_WALL}s, pid=${HEARTBEAT_WATCHDOG_PID})"

          max_attempts=3
          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Codex planning attempt ${attempt}/${max_attempts}..."
            if cat "${CODEX_PROMPT_FILE}" | codex exec --model "${MODEL_EDITOR}" --full-auto > "${CODEX_OUTPUT_FILE}" 2> >(heartbeat_tee "${RUNTIME_DIR}/codex_log.txt" >&2); then
              if grep -q '[^[:space:]]' "${CODEX_OUTPUT_FILE}"; then
                echo "Codex planning succeeded on attempt ${attempt}."
                break
              fi
              echo "::warning::Codex returned empty output on attempt ${attempt}."
            else
              rc=$?
              if [ "$rc" -eq 142 ]; then
                echo "::error::Codex planning killed — no output activity (idle timeout)."
                heartbeat_stop
                exit 1
              fi
              echo "::warning::Codex exited with code $rc on attempt ${attempt}."
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              sleep_secs=$((10 * (2 ** (attempt - 1))))
              echo "Retrying in ${sleep_secs}s..."
              sleep "${sleep_secs}"
            else
              echo "::error::Codex planning failed after ${max_attempts} attempts."
              heartbeat_stop
              exit 1
            fi
          done

          heartbeat_stop

      - name: Write run summary
        if: env.SKIP_PLAN != 'true' && always()
        env:
          TOKEN_WARN_THRESHOLD: ${{ vars.TOKEN_WARN_THRESHOLD_PLAN || '200000' }}
        run: |
          set -euo pipefail
          TOKENS=""
          if [ -f "${RUNTIME_DIR}/codex_log.txt" ]; then
            TOKENS="$(grep -A1 'tokens used' "${RUNTIME_DIR}/codex_log.txt" | tail -1 | tr -d '[:space:]' || true)"
          fi
          {
            echo "## AI Plan Summary"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Issue | #${ISSUE_NUMBER} |"
            echo "| Model | \`${MODEL_EDITOR}\` |"
            if [ -n "${TOKENS}" ]; then
              echo "| Tokens used | ${TOKENS} |"
              TOKENS_NUM="${TOKENS//,/}"
              if [ "${TOKENS_NUM}" -gt "${TOKEN_WARN_THRESHOLD}" ] 2>/dev/null; then
                echo "| :warning: Token alert | Above ${TOKEN_WARN_THRESHOLD} threshold — review prompt efficiency |"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Parse planning output
        if: env.SKIP_PLAN != 'true'
        id: parse_plan
        run: |
          set -euo pipefail
          if ! grep -q '[^[:space:]]' "${CODEX_OUTPUT_FILE}"; then
            echo "Codex planning output is empty; refusing to continue."
            exit 1
          fi

          HAS_STATUS_NEEDS_CLARIFICATION="false"
          if grep -qiE 'STATUS:.*NEEDS_CLARIFICATION|^\*\*STATUS:\*\*.*NEEDS_CLARIFICATION' "${CODEX_OUTPUT_FILE}"; then
            HAS_STATUS_NEEDS_CLARIFICATION="true"
          fi

          HAS_STRUCTURED_CLARIFICATION_BLOCK="false"
          if perl -ne '
            if (/^\s*(?:```|~~~)/) { $in_code = !$in_code; next; }
            next if $in_code;
            if (/^\s*(?:\*\*)?Q[0-9]+(?:\*\*)?:(?:\*\*)?\s+/i) { $q_line = $.; next; }
            if (defined $q_line && $. - $q_line <= 20 && /^\s*Choices:\s*$/i) { $has_block = 1; }
            if (defined $q_line && $. - $q_line <= 20 && /^\s*-\s*\*\*[A-Z]\*\*\s*[—–-]/) { $has_block = 1; }
            END { exit($has_block ? 0 : 1); }
          ' "${CODEX_OUTPUT_FILE}"; then
            HAS_STRUCTURED_CLARIFICATION_BLOCK="true"
          fi

          if [ "${HAS_STATUS_NEEDS_CLARIFICATION}" = "true" ] || [ "${HAS_STRUCTURED_CLARIFICATION_BLOCK}" = "true" ]; then
            echo "needs_clarification=true" >> "$GITHUB_OUTPUT"
            echo "NEEDS_CLARIFICATION=true" >> "$GITHUB_ENV"
          else
            echo "needs_clarification=false" >> "$GITHUB_OUTPUT"
            echo "NEEDS_CLARIFICATION=false" >> "$GITHUB_ENV"
          fi

      - name: Post clarification questions
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.needs_clarification == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # Strip absolute CI runner paths from Codex output
          sed -i -E 's|/home/runner/work/[^/]+/[^/]+/||g' "${CODEX_OUTPUT_FILE}"
          gh api -X POST "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels" -f labels[]='ai:clarification' >/dev/null
          gh api -X DELETE "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels/ai:planning" >/dev/null 2>&1 &
          gh api -X DELETE "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels/ai:awaiting-approval" >/dev/null 2>&1 &
          wait

          {
            echo "Clarification required"
            echo
            cat "${CODEX_OUTPUT_FILE}"
            echo
            echo "Reply with:"
            echo "/answer"
          } > "${PLAN_COMMENT_FILE}"

          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat "${PLAN_COMMENT_FILE}")"

      - name: Telegram clarification notification
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.needs_clarification == 'true'
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
        run: |
          set -euo pipefail

          CHAT_ID="${TG_CHAT_ID:-}"
          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${CHAT_ID}" ]; then
            echo "Warning: Telegram clarification notification skipped (missing TG_BOT_SECRET or chat_id)"
            exit 0
          fi

          MSG="Plan needs clarification for issue ${ISSUE_URL}"
          RESPONSE="$(curl -sS -X POST \
            "https://api.telegram.org/bot${TG_BOT_SECRET}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}")"
          if ! printf '%s' "${RESPONSE}" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "::warning::Telegram clarification notification failed: ${RESPONSE}"
          fi

      - name: Post implementation plan
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.needs_clarification != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # Strip absolute CI runner paths from Codex output so comments show clean relative paths
          sed -i -E 's|/home/runner/work/[^/]+/[^/]+/||g' "${CODEX_OUTPUT_FILE}"
          {
            echo "Implementation Plan"
            echo
            cat "${CODEX_OUTPUT_FILE}"
            echo
            echo "To proceed reply:"
            echo
            echo "/approved"
            echo
            echo "To restart clarification reply:"
            echo
            echo "/reclarify"
          } > "${PLAN_COMMENT_FILE}"

          PLAN_COMMENT_LEN="$(wc -c < "${PLAN_COMMENT_FILE}")"
          if [ "${PLAN_COMMENT_LEN}" -gt 65536 ]; then
            echo "Generated plan comment too long (${PLAN_COMMENT_LEN} bytes); refusing to post over GitHub limit."
            exit 1
          fi

          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat "${PLAN_COMMENT_FILE}")"

          gh api -X POST "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels" -f labels[]='ai:awaiting-approval' >/dev/null
          gh api -X DELETE "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels/ai:planning" >/dev/null 2>&1 || true

      - name: Auto-approve clear plan
        id: auto_approve
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.needs_clarification != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          echo "auto_approved=false" >> "$GITHUB_OUTPUT"
          normalized_flag="$(printf '%s' "${AUTO_IMPLEMENT_ON_CLEAR_PLAN:-false}" | tr '[:upper:]' '[:lower:]' | xargs)"
          case "${normalized_flag}" in
            1|true|yes|on)
              gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
                -f body=$'/approved [auto-approved-by-plan]\n\nAuto approval was posted because AUTO_IMPLEMENT_ON_CLEAR_PLAN is enabled.'
              echo "auto_approved=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "AUTO_IMPLEMENT_ON_CLEAR_PLAN disabled; skipping auto-approval comment."
              ;;
          esac

      - name: Telegram plan notification
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.needs_clarification != 'true' && steps.auto_approve.outputs.auto_approved != 'true'
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
        run: |
          set -euo pipefail

          CHAT_ID="${TG_CHAT_ID:-}"
          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${CHAT_ID}" ]; then
            echo "Warning: Telegram plan notification skipped (missing TG_BOT_SECRET or chat_id)"
            exit 0
          fi

          MSG="Implementation plan generated for issue ${ISSUE_URL}"
          RESPONSE="$(curl -sS -X POST \
            "https://api.telegram.org/bot${TG_BOT_SECRET}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}")"
          if ! printf '%s' "${RESPONSE}" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "::warning::Telegram plan notification failed: ${RESPONSE}"
          fi

      - name: Capture planning failure context
        if: failure() || cancelled()
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = "cancelled" ]; then
            {
              echo "PLAN_FAILURE_CONTEXT=AI Plan phase was cancelled or timed out before posting the implementation plan."
            } >> "$GITHUB_ENV"
          else
            {
              echo "PLAN_FAILURE_CONTEXT=AI Plan phase failed before posting the implementation plan."
            } >> "$GITHUB_ENV"
          fi

      - name: Comment on issue failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED_STEP_HINT="Check the AI Plan run logs and inspect the first failed step."
          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body=$'AI planning workflow failed.\n\nWorkflow: AI Plan\nIssue: #'"${ISSUE_NUMBER}"$'\nIssue URL: '"${ISSUE_URL}"$'\nContext: '"${PLAN_FAILURE_CONTEXT}"$'\nHint: '"${FAILED_STEP_HINT}"$'\nRun: '"${RUN_URL}"

      - name: Telegram failure notification
        if: failure() || cancelled()
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
        run: |
          set -euo pipefail

          CHAT_ID="${TG_CHAT_ID:-}"
          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${CHAT_ID}" ]; then
            echo "Warning: Telegram failure notification skipped (missing TG_BOT_SECRET or chat_id)"
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED_STEP_HINT="Check the AI Plan run logs and inspect the first failed step."
          if [ "${{ job.status }}" = "cancelled" ]; then
            MSG="AI planning workflow cancelled/timed out."
          else
            MSG="AI planning workflow failed."
          fi
          MSG+=$'\n'
          MSG+="Workflow: AI Plan"
          MSG+=$'\n'
          MSG+="Issue: #${ISSUE_NUMBER}"
          MSG+=$'\n'
          MSG+="Issue URL: ${ISSUE_URL}"
          MSG+=$'\n'
          MSG+="Context: ${PLAN_FAILURE_CONTEXT}"
          MSG+=$'\n'
          MSG+="Hint: ${FAILED_STEP_HINT}"
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          RESPONSE="$(curl -sS -X POST \
            "https://api.telegram.org/bot${TG_BOT_SECRET}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}")"
          if ! printf '%s' "${RESPONSE}" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "::warning::Telegram failure notification failed: ${RESPONSE}"
          fi

      - name: Exit safely
        if: failure() || cancelled()
        run: exit 0

name: AI Plan

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true
      OPENROUTER_API_KEY:
        required: true
      TG_BOT_SECRET:
        required: false

env:
  # Claude capacity wait (issue #7370): a capacity fallback waits for the
  # hourly capacity-resume pass instead of running codex/OpenCode. Off for the
  # `core` install profile, which has no orchestrate-poll wrapper to resume
  # waiting work; repo variable CLAUDE_POOL_CAPACITY_WAIT_ENABLED=false rolls back.
  CLAUDE_POOL_CAPACITY_WAIT_ENABLED: ${{ vars.CLAUDE_POOL_CAPACITY_WAIT_ENABLED || (vars.WORKFLOW_PROFILE == 'core' && 'false') || 'true' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request == null &&
      !contains(toJson(github.event.issue.labels.*.name), 'ai:auto-heal-source') &&
      (
        (
          github.event.comment.user.type == 'User' &&
          contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          startsWith(github.event.comment.body, '/answer') &&
          (
            vars.AI_PIPELINE_APPROVER_LOGIN == '' ||
            (
              !contains(github.event.comment.body, '[auto-answered-by-clarify]') &&
              !contains(github.event.comment.body, '[auto-answered-by-orchestrator]')
            )
          )
        ) ||
        (
          github.event.comment.user.type == 'Bot' &&
          vars.AI_PIPELINE_APPROVER_LOGIN != '' &&
          github.event.comment.user.login == vars.AI_PIPELINE_APPROVER_LOGIN &&
          startsWith(github.event.comment.body, '/answer') &&
          (
            contains(github.event.comment.body, '[auto-answered-by-clarify]') ||
            contains(github.event.comment.body, '[auto-answered-by-orchestrator]')
          )
        ) ||
        (
          vars.AI_PIPELINE_APPROVER_LOGIN != '' &&
          github.event.comment.user.type == 'User' &&
          github.event.comment.author_association == 'OWNER' &&
          github.event.comment.user.login == github.repository_owner &&
          startsWith(github.event.comment.body, '/answer') &&
          (
            contains(github.event.comment.body, '[auto-answered-by-clarify]') ||
            contains(github.event.comment.body, '[auto-answered-by-orchestrator]')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AI_ENGINE_FALLBACK_POLICY: ${{ vars.AI_ENGINE_FALLBACK_POLICY || 'capacity' }}
      # Claude capacity wait (issue #7370): run_plan_codex.sh sets SKIP_PLAN
      # on exit 80; the resume pass re-posts the triggering command.
      CLAUDE_CAPACITY_WAIT_ITEM_KIND: issue
      CLAUDE_CAPACITY_WAIT_ITEM_NUMBER: ${{ github.event.issue.number }}
      CLAUDE_CAPACITY_WAIT_STAGE: plan
      CLAUDE_CAPACITY_WAIT_SOURCE_COMMENT: ${{ github.event.comment.id || '' }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      SKIP_PLAN: "false"
      SEMBLE_ENABLED: ${{ vars.SEMBLE_ENABLED || 'true' }}
      MODEL_EDITOR: ${{ vars.WORKFLOW_EDITOR_MODEL || 'openai/gpt-6-sol' }}
      # Capacity-fallback editor model. On the final planning attempt the
      # retry loop switches --model to this slug, which sits in a different
      # OpenRouter/OpenAI per-model TPM bucket than the primary, so a
      # sustained saturation of the primary editor model (issue #3515 / run 28640359211) can be
      # ridden out without a model change on the earlier attempts. Set to the
      # primary slug (or clear it) to disable the switch.
      MODEL_EDITOR_FALLBACK: ${{ vars.WORKFLOW_EDITOR_FALLBACK_MODEL || 'openai/gpt-5.6-sol' }}
      # Defaults to high to match the repo-wide gpt-6-sol reasoning-level
      # policy. Override per-repo via vars.THINKING_LEVEL_PLAN; the smoke
      # path forces `low` separately in the "Detect smoke test" step.
      MODEL_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_PLAN || 'high' }}
      MODEL_VERBOSITY: ${{ vars.VERBOSITY_PLAN || 'low' }}
      OPENROUTER_PROMPT_CACHE_DISABLED: ${{ vars.OPENROUTER_PROMPT_CACHE_DISABLED || 'false' }}
      MEMORY_INJECTION_SCAN_ENABLED: ${{ vars.MEMORY_INJECTION_SCAN_ENABLED || 'true' }}
      AUTO_IMPLEMENT_ON_CLEAR_PLAN: ${{ vars.AUTO_IMPLEMENT_ON_CLEAR_PLAN || 'true' }}
      # Issue #6769: while off (the default), plans listing automation paths
      # (.github/, .claude/, scripts/, prompts/, workflow-templates/) get no
      # automatic /approved. When on, every listed protected path needs a
      # trusted, exact files_touched grant in the issue body.
      AUTOMATION_PATH_PLAN_AUTO_APPROVAL_ENABLED: ${{ vars.AUTOMATION_PATH_PLAN_AUTO_APPROVAL_ENABLED || 'true' }}
      # The plan auto-approval gate holds a plan whose Files section lists a file
      # outside the issue's files_touched list, which implement would refuse.
      # It mirrors implement's ENFORCE_FILES_TOUCHED / ALLOW_OUT_OF_SCOPE_FILES;
      # PLAN_FILES_TOUCHED_GATE_ENABLED=false turns the plan-time check off.
      ENFORCE_FILES_TOUCHED: ${{ vars.ENFORCE_FILES_TOUCHED || 'true' }}
      ALLOW_OUT_OF_SCOPE_FILES: ${{ vars.ALLOW_OUT_OF_SCOPE_FILES || 'false' }}
      PLAN_FILES_TOUCHED_GATE_ENABLED: ${{ vars.PLAN_FILES_TOUCHED_GATE_ENABLED || 'true' }}
      WRITE_GUARDS_ENABLED: ${{ vars.WRITE_GUARDS_ENABLED || 'true' }}
      PLAN_FAILURE_CONTEXT: "Planning run did not complete."
      CODEX_VERSION: ${{ vars.CODEX_VERSION || 'v0.114.0' }}
      PROCESSED_ANSWER_CLAIMED: "false"
      PROCESSED_ANSWER_COMPLETED: "false"
      PLAN_SELF_CHECK_ENABLED: ${{ vars.PLAN_SELF_CHECK_ENABLED || 'true' }}
      PLAN_SCOPE_MODE_REQUIRED: ${{ vars.PLAN_SCOPE_MODE_REQUIRED || 'true' }}
      PLAN_REUSE_AUDIT_REQUIRED: ${{ vars.PLAN_REUSE_AUDIT_REQUIRED || 'true' }}
      PLAN_DIAGRAMS_OPTIONAL: ${{ vars.PLAN_DIAGRAMS_OPTIONAL || 'true' }}

    steps:
      - name: Cache Codex CLI
        id: cache-codex
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/codex
          # -v2: previous cache only stored @openai/codex (no platform binary),
          # so cache hits restored a stub-only install and Codex crashed at
          # startup with "Missing optional dependency @openai/codex-linux-x64".
          # Bump invalidates the broken entries; persist+restore below now
          # handle both packages symmetrically.
          key: codex-${{ vars.CODEX_VERSION || 'v0.114.0' }}-v2

      - name: Install Codex CLI
        if: steps.cache-codex.outputs.cache-hit != 'true'
        uses: shubhodeep1/coding-workflows/.github/actions/install-codex@91b30f6fba400686c5dded34423f88f1ea10e163
        with:
          codex_version: ${{ env.CODEX_VERSION }}

      - name: Persist Codex CLI to tool cache
        if: steps.cache-codex.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NPM_GLOBAL_ROOT="$(npm root -g)"
          mkdir -p "${{ runner.tool_cache }}/codex"
          [ -d "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64" ] || {
            echo "::error::Codex platform package @openai/codex-linux-x64 missing after install"
            exit 1
          }
          cp -r "${NPM_GLOBAL_ROOT}/@openai/codex"           "${{ runner.tool_cache }}/codex/package"
          cp -r "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64" "${{ runner.tool_cache }}/codex/codex-linux-x64"

      - name: Restore Codex CLI from cache
        if: steps.cache-codex.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          NPM_GLOBAL_ROOT="$(npm root -g)"
          NPM_GLOBAL_PREFIX="$(npm prefix -g)"
          # Restore the cached directories directly into the global npm tree so
          # the @openai/codex-linux-x64 alias name is preserved. npm install -g
          # on the local paths re-reads package.json, and both cached
          # directories report "name": "@openai/codex".
          mkdir -p "${NPM_GLOBAL_ROOT}/@openai" "${NPM_GLOBAL_PREFIX}/bin"
          rm -rf "${NPM_GLOBAL_ROOT}/@openai/codex" "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64"
          cp -r "${{ runner.tool_cache }}/codex/package" "${NPM_GLOBAL_ROOT}/@openai/codex"
          cp -r "${{ runner.tool_cache }}/codex/codex-linux-x64" "${NPM_GLOBAL_ROOT}/@openai/codex-linux-x64"
          ln -sf "${NPM_GLOBAL_ROOT}/@openai/codex/bin/codex.js" "${NPM_GLOBAL_PREFIX}/bin/codex"
          codex --version

      - name: Resolve integration ref
        id: refctx
        env:
          SUPPORT_REF_WORKFLOW_JOB_JSON: ${{ toJSON(job) }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CI_TRIAGE_PR_BRANCH_ROUTING_ENABLED: ${{ vars.CI_TRIAGE_PR_BRANCH_ROUTING_ENABLED || 'true' }}
        run: |
          set -euo pipefail
          issue_number="${ISSUE_NUMBER:-}"
          if ! [[ "${issue_number}" =~ ^[0-9]+$ ]] || [ "${issue_number}" -le 0 ]; then
            echo "::notice::No issue number available for integration ref resolution; falling back to default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "resolver_status=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          resolver_repo="shubhodeep1/coding-workflows"
          resolver_ref="stable"
          resolver_ref_pinned=false
          # A consumer wrapper pinned to a commit runs the resolver from that
          # commit, never from stable or main (issue tele-funtoken#4566).
          resolver_workflow_ref="$(jq -r '.workflow_ref // ""' <<< "${SUPPORT_REF_WORKFLOW_JOB_JSON:-}" 2>/dev/null || true)"
          if [[ "${resolver_workflow_ref}" =~ ^shubhodeep1/coding-workflows/\.github/workflows/plan\.yml@[0-9a-f]{40}$ ]]; then
            resolver_ref="${resolver_workflow_ref##*@}"
            resolver_ref_pinned=true
          fi
          if [ "${{ github.repository }}" = "${resolver_repo}" ]; then
            resolver_ref="${{ github.sha }}"
          fi

          resolver_stage_root="${RUNNER_TEMP}/resolve-integration-ref-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          resolver_stage_primary="${resolver_stage_root}/primary"
          resolver_stage_fallback="${resolver_stage_root}/fallback"
          resolver_repo_url="https://github.com/${resolver_repo}"
          rm -rf "${resolver_stage_root}"
          mkdir -p "${resolver_stage_root}"
          resolver_clone_log="${resolver_stage_root}/clone.log"
          resolver_git_auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          resolver_git() {
            git -c "http.extraHeader=Authorization: Basic ${resolver_git_auth_header}" "$@"
          }
          cleanup_resolver_stage() {
            rm -rf "${resolver_stage_root}"
          }
          trap cleanup_resolver_stage EXIT
          # Issue #7283: with CI-triage PR-branch routing on, a resolver that cannot
          # be staged, pinned or found fails the step instead of falling back to the
          # default branch (the unpinned main fallback clone counts as a pinning
          # failure). The flag is parsed like ci_triage_routing_enabled in
          # scripts/resolve_integration_ref.sh. With routing off, the fallbacks below
          # are unchanged.
          resolver_ci_triage_routing_on=false
          case "${CI_TRIAGE_PR_BRANCH_ROUTING_ENABLED:-true}" in
            [Tt][Rr][Uu][Ee]|1|[Yy][Ee][Ss]|[Oo][Nn]) resolver_ci_triage_routing_on=true ;;
          esac
          resolver_stage_fail_closed() {
            if [ "${resolver_ci_triage_routing_on}" = "true" ]; then
              resolver_pin_log=""
              if [ "${resolver_ref_pinned}" = "true" ]; then resolver_pin_log=" pinned_ref=${resolver_ref}"; fi
              echo "::error::INTEGRATION_REF_RESOLVE outcome=resolver_unavailable reason=$1 ci_triage_routing=on${resolver_pin_log}; refusing to fall back to the default branch."
            elif [ "${resolver_ref_pinned}" = "true" ]; then
              echo "::error::INTEGRATION_REF_RESOLVE outcome=resolver_unavailable reason=$1 pinned_ref=${resolver_ref}; refusing to run resolver code from another ref."
            else
              return 0
            fi
            if [ -s "${resolver_clone_log}" ]; then
              sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g' "${resolver_clone_log}" | sed -n '1,20p'
            fi
            exit 1
          }

          if resolver_git clone --quiet --depth 1 --branch main "${resolver_repo_url}" "${resolver_stage_primary}" 2>"${resolver_clone_log}"; then
            resolver_script="${resolver_stage_primary}/scripts/resolve_integration_ref.sh"
            if ! resolver_git -C "${resolver_stage_primary}" fetch --quiet --depth 1 origin "${resolver_ref}" 2>>"${resolver_clone_log}" || \
               ! git -C "${resolver_stage_primary}" checkout --quiet --detach FETCH_HEAD 2>>"${resolver_clone_log}" || \
               { [ "${resolver_ref_pinned}" = "true" ] && [ "$(git -C "${resolver_stage_primary}" rev-parse HEAD 2>/dev/null || true)" != "${resolver_ref}" ]; }; then
              resolver_stage_fail_closed pin_failed
              echo "::warning::Failed to stage canonical integration resolver ref ${resolver_ref}; using main fallback."
              if [ -s "${resolver_clone_log}" ]; then
                sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g' "${resolver_clone_log}" | sed -n '1,20p'
              fi
            fi
          elif resolver_git clone --quiet --depth 1 --branch main "${resolver_repo_url}" "${resolver_stage_fallback}" 2>>"${resolver_clone_log}"; then
            resolver_script="${resolver_stage_fallback}/scripts/resolve_integration_ref.sh"
            resolver_stage_fail_closed pin_failed
          else
            resolver_stage_fail_closed stage_failed
            echo "::warning::Failed to stage canonical integration resolver; falling back to default branch."
            if [ -s "${resolver_clone_log}" ]; then
              sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g' "${resolver_clone_log}" | sed -n '1,20p'
            fi
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "resolver_status=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "${resolver_script}" ]; then
            resolver_stage_fail_closed script_missing
            echo "::warning::Canonical integration resolver script not found in staged source; falling back to default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "resolver_status=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          chmod +x "${resolver_script}"
          # Exit 3 means CI-triage PR-branch routing was required but could
          # not be verified; never fall back to the default branch then.
          # One exception (#7477): reason=pr_not_open (the triage PR merged
          # or closed) is tolerated as in clarify, with pr_not_open=true, and
          # the "Close superseded CI-repair issue (merged PR)" step settles
          # it: close the issue, plan on the PR's base, or skip planning.
          resolver_rc=0
          # Resolver stderr is captured (then replayed) so a branch that came
          # from CI-triage PR-head routing, not from an explicit body line,
          # can be told apart for the check-triage branch guard (#7064).
          resolver_err_file="${resolver_stage_root}/resolver.err"
          integration_branch="$({
            REPO="${{ github.repository }}" \
            ISSUE="${issue_number}" \
            GH_TOKEN="${GH_TOKEN}" \
            CI_TRIAGE_PR_BRANCH_ROUTING_ENABLED="${CI_TRIAGE_PR_BRANCH_ROUTING_ENABLED:-true}" \
            bash "${resolver_script}" 2>"${resolver_err_file}"
          })" || resolver_rc=$?
          resolver_pr_not_open=false
          if [ "${resolver_rc}" -eq 3 ] && grep -Eq 'outcome=refused reason=pr_not_open$' "${resolver_err_file}" 2>/dev/null; then
            resolver_pr_not_open=true
          fi
          if [ -s "${resolver_err_file}" ]; then
            if [ "${resolver_pr_not_open}" = "true" ]; then
              sed 's/^::error::CI_TRIAGE_PR_BRANCH_ROUTING /::notice::CI_TRIAGE_PR_BRANCH_ROUTING /' "${resolver_err_file}" >&2
            else
              cat "${resolver_err_file}" >&2
            fi
          fi
          if [ "${resolver_rc}" -eq 0 ]; then
            echo "ref=${integration_branch}" >> "$GITHUB_OUTPUT"
            if [ -n "${integration_branch}" ]; then
              echo "integration_branch_meta=${integration_branch}" >> "$GITHUB_OUTPUT"
              # resolver_status (#7064) feeds the check-triage branch guard:
              # resolved / routed / none / failed / unavailable. "routed"
              # means the branch is a verified PR head from CI-triage routing
              # and the issue body declared no branch line.
              triage_routed=false
              while IFS= read -r resolver_err_line; do
                case "${resolver_err_line}" in
                  "CI_TRIAGE_PR_BRANCH_ROUTING issue=${issue_number} pr="*" outcome=routed branch=${integration_branch}") triage_routed=true ;;
                esac
              done < "${resolver_err_file}"
              if [ "${triage_routed}" = "true" ]; then
                echo "resolver_status=routed" >> "$GITHUB_OUTPUT"
              else
                echo "resolver_status=resolved" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "resolver_status=none" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${resolver_pr_not_open}" = "true" ]; then
            echo "::notice::CI-triage PR for issue #${issue_number} is no longer open; planning continues only if the superseded-PR check resolves it."
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "resolver_status=failed" >> "$GITHUB_OUTPUT"
            echo "pr_not_open=true" >> "$GITHUB_OUTPUT"
          elif [ "${resolver_rc}" -eq 3 ]; then
            echo "::error::CI-triage PR-branch routing refused for issue #${issue_number}; refusing to fall back to the default branch."
            exit 1
          elif [ "${resolver_rc}" -eq 75 ] && [ "${resolver_ci_triage_routing_on}" = "true" ]; then
            echo "::error::INTEGRATION_REF_RESOLVE outcome=rate_limited rc=${resolver_rc} ci_triage_routing=on; refusing to fall back to the default branch."
            exit 1
          else
            echo "::warning::Canonical integration resolver failed; falling back to default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "resolver_status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.refctx.outputs.ref || github.event.repository.default_branch }}
          # Planning is read-only — shallow clone is sufficient and faster.
          # Implementation workflows use fetch-depth: 0 for full history.
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Log checkout ref
        env:
          PLAN_RESOLVED_REF: ${{ steps.refctx.outputs.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "Resolved ref: ${PLAN_RESOLVED_REF}"
          echo "HEAD commit: $(git rev-parse HEAD)"
          if branch_name="$(git symbolic-ref --short HEAD 2>/dev/null)"; then
            echo "HEAD branch: ${branch_name}"
          else
            echo "HEAD branch: DETACHED"
          fi

      - name: Configure git auth for memory helper clones
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_PAT is empty"; exit 1; }
          SERVER_HOST="${GITHUB_SERVER_URL#https://}"
          SERVER_HOST="${SERVER_HOST#http://}"
          SERVER_HOST="${SERVER_HOST%/}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}"

      - name: Resolve workflow support ref
        env:
          SUPPORT_REF_WORKFLOW_JOB_JSON: ${{ toJSON(job) }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            promote_candidate_support_ref="${{ github.sha }}"
            promote_candidate_workflow_ref="$(jq -r '.workflow_ref // ""' <<< "${SUPPORT_REF_WORKFLOW_JOB_JSON:-}" 2>/dev/null || true)"
            # Pipeline runs of this repository pinned to the protected promote-candidate
            # branch (promote cycle, docs/plans/pin-promote-cycle-to-candidate-plan.md)
            # take support code from that branch's tip. A look-alike ref, an unprotected
            # branch or a failed read keep github.sha.
            if [[ "${promote_candidate_workflow_ref}" =~ ^shubhodeep1/coding-workflows/\.github/workflows/plan\.yml@refs/heads/promote-candidate$ ]]; then
              # One branches read, only on this path: no earlier call in this step
              # returns the promote-candidate tip or its protection flag.
              source "${GH_API_RETRY_HELPERS:-/dev/null}" 2>/dev/null || true
              type gh_api_retry >/dev/null 2>&1 || gh_api_retry() { while [ "${1:-}" = --idempotent ] || [ "${1:-}" = --optional ]; do shift; done; gh api "$@"; }
              promote_candidate_json="$(gh_api_retry repos/shubhodeep1/coding-workflows/branches/promote-candidate 2>/dev/null || true)"
              promote_candidate_sha="$(jq -r 'if .protected == true then (.commit.sha // "") else "" end' <<< "${promote_candidate_json}" 2>/dev/null || true)"
              if [[ "${promote_candidate_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                promote_candidate_support_ref="${promote_candidate_sha}"
                echo "SUPPORT_REF source=promote_candidate sha=${promote_candidate_sha}"
              else
                echo "SUPPORT_REF source=promote_candidate_unprotected"
              fi
            fi
            echo "SCRIPT_REF=${promote_candidate_support_ref}" >> "$GITHUB_ENV"
          else
            # A consumer wrapper pins this workflow to a commit (<file>@<sha>);
            # take the support scripts from that same commit, not a newer
            # stable (Q64, as validate.yml in #7123). Tags, branches and any
            # other identity keep stable.
            support_ref_pin="stable"
            support_ref_workflow_ref="$(jq -r '.workflow_ref // ""' <<< "${SUPPORT_REF_WORKFLOW_JOB_JSON:-}" 2>/dev/null || true)"
            if [[ "${support_ref_workflow_ref}" =~ ^shubhodeep1/coding-workflows/\.github/workflows/plan\.yml@[0-9a-f]{40}$ ]]; then
              support_ref_pin="${support_ref_workflow_ref##*@}"
            fi
            echo "SUPPORT_REF ref=${support_ref_pin} workflow_ref=${support_ref_workflow_ref:-unknown}"
            echo "SCRIPT_REF=${support_ref_pin}" >> "$GITHUB_ENV"
          fi

      - name: Checkout workflow support source
        id: checkout_support_source
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ env.SCRIPT_REF }}
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Checkout workflow support source fallback
        if: ${{ steps.checkout_support_source.outcome == 'failure' && env.SCRIPT_REF == 'stable' }}
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Ensure workflow support source checkout
        run: |
          set -euo pipefail
          if [ ! -d .codex-workflow-src ]; then
            echo "::error::Failed to checkout workflow support source from ${SCRIPT_REF} or main"
            exit 1
          fi
          # A pinned support ref must be exactly the commit the caller pinned;
          # never run support code from a moving ref in its place.
          if [[ "${SCRIPT_REF}" =~ ^[0-9a-f]{40}$ ]] && [ "$(git -C .codex-workflow-src rev-parse HEAD 2>/dev/null || true)" != "${SCRIPT_REF}" ]; then
            echo "::error::Workflow support checkout does not match the pinned commit ${SCRIPT_REF}; refusing to run support code from another ref."
            exit 1
          fi

      - name: Checkout workflow support source main snapshot
        if: ${{ env.SCRIPT_REF == 'stable' }}
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src-main
          fetch-depth: 1

      - name: Stage workflow support files
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          mkdir -p scripts
          _fetched_scripts=()
          for f in gh_helpers.sh run_plan_codex.sh render_prompt.sh pr_dependency.py assemble_prompt.sh render_prompt.py load_workflow_overlay.py tg_helpers.sh label_helpers.sh memory_helpers.sh ai_memory.py ai_memory_lib.py memory_injection_patterns.py openrouter_prompt_cache.py build_static_context.sh assemble_agents.py install_semble.sh build_semble_wrapper.sh write_codex_config.sh codex_helpers.sh write_guard.sh codex_stall_guard.sh codex_isolated_exec.sh sandbox_image.sh codex_isolated_workspace.py clarify_openrouter_broker.py claude_anthropic_relay.py ai_engine.sh claude_engine.py workflow_failure_heal.py workflow_failure_heal_evidence.sh clarify_base_image_preseed.sh clarify_isolated_run.sh files_touched_scope_guard.py plan_split_dispatch.sh; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::error::Missing required support script ${f} in ${wf_source}@${SCRIPT_REF}"
              exit 1
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")
          done

          src=".codex-workflow-src/scripts/claude_settings.json.tmpl"
          if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/claude_settings.json.tmpl" ]; then
            src=".codex-workflow-src-main/scripts/claude_settings.json.tmpl"
          fi
          if [ ! -f "${src}" ]; then
            echo "::error::Missing required Claude settings template in ${wf_source}@${SCRIPT_REF}"
            exit 1
          fi
          install -m 0644 "${src}" scripts/claude_settings.json.tmpl
          _fetched_scripts+=(claude_settings.json.tmpl)

          mkdir -p scripts/clarify_sandbox
          sandbox_src=".codex-workflow-src/scripts/clarify_sandbox/Dockerfile"
          if [ ! -f "${sandbox_src}" ] && [ -f ".codex-workflow-src-main/scripts/clarify_sandbox/Dockerfile" ]; then
            sandbox_src=".codex-workflow-src-main/scripts/clarify_sandbox/Dockerfile"
          fi
          [ -f "${sandbox_src}" ] || { echo '::error::Missing plan isolation Dockerfile' >&2; exit 1; }
          install -m 0644 "${sandbox_src}" scripts/clarify_sandbox/Dockerfile

          # render_prompt.py is the Python backend of the render_prompt.sh
          # shim (issue #3043 refactor). main ships both, the shim needs the
          # backend, and check_workflow_script_refs.py fails CI if it goes
          # missing. Some older refs still bundle a self-contained bash
          # render_prompt.sh with no backend, so absence on the ref under
          # processing (and on main's copy) only skips staging and must not
          # fail the bootstrap; presence stages it beside the shim so the
          # shim resolves ${SCRIPT_DIR}/render_prompt.py.
          for f in render_prompt.py; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/scripts/${f}" ]; then
              src=".codex-workflow-src-main/scripts/${f}"
            fi
            if [ ! -f "${src}" ]; then
              echo "::notice::Optional render_prompt.py backend unavailable on ${SCRIPT_REF}; render_prompt.sh shim (if present) resolves it elsewhere or the bundled bash renderer is used."
              continue
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched_scripts+=("${f}")
          done

          # Stage codex_model_catalog.json so scripts/write_codex_config.sh
          # can wire `model_catalog_json` and codex registers
          # `apply_patch_tool_type = "freeform"` for our `openai/gpt-5.*`
          # slugs (PR openai/codex#11238 removed the offline fallback so
          # this catalog file is the only path that registers the tool).
          # Mirrors the staging block in implement.yml so plan.yml's
          # codex calls aren't stuck in announce-without-emit mode.
          catalog_src=".codex-workflow-src/scripts/codex_model_catalog.json"
          if [ ! -f "${catalog_src}" ] && [ -f ".codex-workflow-src-main/scripts/codex_model_catalog.json" ]; then
            catalog_src=".codex-workflow-src-main/scripts/codex_model_catalog.json"
          fi
          if [ -f "${catalog_src}" ]; then
            install -m 0644 "${catalog_src}" scripts/codex_model_catalog.json
            _fetched_scripts+=(codex_model_catalog.json)
          else
            echo "::warning::Codex model catalog not found in ${SCRIPT_REF}/main; apply_patch may not be registered for non-built-in models"
          fi

          if [ "${{ github.repository }}" != "${wf_source}" ]; then
            {
              echo "# Auto-generated by coding-workflows — DO NOT EDIT"
              echo "# Prevents runtime-fetched support scripts from being committed."
              printf '%s\n' "${_fetched_scripts[@]}" .gitignore
            } > scripts/.gitignore
          fi

          mkdir -p ai-memory/schemas
          for sf in memory_record.v1.json processed_command_entry.v1.json run_ledger_entry.v1.json task_lineage.v1.json actions_runs_cache.v1.json workflow_log_analysis_cache.v1.json validation_history.v1.json operator_bypass_audit.v1.json revalidate_events.v1.json validation_discovery.v1.json workflow_overlay.v1.json; do
            src=".codex-workflow-src/ai-memory/schemas/${sf}"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/ai-memory/schemas/${sf}" ]; then
              src=".codex-workflow-src-main/ai-memory/schemas/${sf}"
            fi
            if [ ! -f "ai-memory/schemas/${sf}" ] && [ -f "${src}" ]; then
              install -m 0644 "${src}" "ai-memory/schemas/${sf}"
            fi
          done

          # WORKFLOW.md overlay is opt-in by file presence; absent file must
          # stay a no-op while valid prompt overrides flow through render_prompt.py.
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/load_workflow_overlay.py \
            --repo-root "${GITHUB_WORKSPACE}" \
            --schema-path "ai-memory/schemas/workflow_overlay.v1.json" \
            --github-env "${GITHUB_ENV}"

          echo "PROMPT_PRELUDE_REFACTOR_ENABLED=${{ vars.PROMPT_PRELUDE_REFACTOR_ENABLED || 'false' }}" >> "$GITHUB_ENV"
          echo "UNATTENDED_IDENTITY_REINJECT_ENABLED=${{ vars.UNATTENDED_IDENTITY_REINJECT_ENABLED || 'false' }}" >> "$GITHUB_ENV"

          for f in unattended_system_instructions.md ai_pipeline.md; do
            if [ ! -f "${f}" ]; then
              src=".codex-workflow-src/${f}"
              if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/${f}" ]; then
                src=".codex-workflow-src-main/${f}"
              fi
              if [ ! -f "${src}" ]; then
                echo "::error::Failed to stage required file ${f}"
                exit 1
              fi
              install -m 0644 "${src}" "${f}"
            fi
          done

          # Stage prompts/header.txt so the prompt-assembly step's
          # `render_prompt.sh prompts/header.txt` invocation resolves a
          # working-tree file. render_prompt.sh checks the bare path before
          # delegating to render_prompt.py, so the fragment must land in
          # ./prompts/ alongside the staged scripts/. header.txt carries
          # only the {{REPO_LEARNINGS}} placeholder (resolved from the
          # REPO_LEARNINGS env var at render time) and has no contract, so
          # staging the single file is sufficient. The `if [ ! -f ]` guard
          # preserves the self-repo's own checked-in copy.
          mkdir -p prompts
          if [ ! -f prompts/header.txt ]; then
            src=".codex-workflow-src/prompts/header.txt"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/prompts/header.txt" ]; then
              src=".codex-workflow-src-main/prompts/header.txt"
            fi
            if [ ! -f "${src}" ]; then
              echo "::error::Failed to stage required file prompts/header.txt"
              exit 1
            fi
            install -m 0644 "${src}" prompts/header.txt
          fi
          if [ ! -f prompts/_identity_recall.txt ]; then
            src=".codex-workflow-src/prompts/_identity_recall.txt"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/prompts/_identity_recall.txt" ]; then
              src=".codex-workflow-src-main/prompts/_identity_recall.txt"
            fi
            if [ ! -f "${src}" ]; then
              echo "::error::Failed to stage required file prompts/_identity_recall.txt"
              exit 1
            fi
            install -m 0644 "${src}" prompts/_identity_recall.txt
          fi

          if [ ! -f prompts/references/security-money-lens.txt ]; then
            mkdir -p prompts/references
            src=".codex-workflow-src/prompts/references/security-money-lens.txt"
            if [ ! -f "${src}" ] && [ -f ".codex-workflow-src-main/prompts/references/security-money-lens.txt" ]; then
              src=".codex-workflow-src-main/prompts/references/security-money-lens.txt"
            fi
            if [ ! -f "${src}" ]; then
              echo "::error::Failed to stage required file prompts/references/security-money-lens.txt"
              exit 1
            fi
            install -m 0644 "${src}" prompts/references/security-money-lens.txt
          fi

          rm -rf .codex-workflow-src-main

      - name: Create runtime workspace
        run: |
          set -euo pipefail
          RUNTIME_DIR="/tmp/codex-plan-${GITHUB_RUN_ID}"
          mkdir -p "${RUNTIME_DIR}"
          {
            echo "RUNTIME_DIR=${RUNTIME_DIR}"
            echo "ISSUE_META_FILE=${RUNTIME_DIR}/issue_meta.json"
            echo "ISSUE_COMMENTS_FILE=${RUNTIME_DIR}/issue_comments.json"
            echo "PLANNING_CONTEXT_FILE=${RUNTIME_DIR}/planning_context.txt"
            echo "CODEX_PROMPT_FILE=${RUNTIME_DIR}/codex_prompt.txt"
            echo "CODEX_OUTPUT_FILE=${RUNTIME_DIR}/codex_output.txt"
            echo "PRE_PLAN_WRITE_GUARD_PATHS_FILE=${RUNTIME_DIR}/pre_plan_write_guard_paths.txt"
            echo "POST_PLAN_WRITE_GUARD_PATHS_FILE=${RUNTIME_DIR}/post_plan_write_guard_paths.txt"
            echo "PLAN_COMMENT_FILE=${RUNTIME_DIR}/plan_comment.md"
            echo "SEMBLE_AVAILABLE=false"
            echo "SEMBLE_INDEX_PATH=${RUNTIME_DIR}/.semble-index"
            echo "SEMBLE_INDEX_AVAILABLE=false"
          } >> "$GITHUB_ENV"

      - name: Fetch issue metadata
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}" > "${ISSUE_META_FILE}"

          ISSUE_BODY="$(jq -r '.body // ""' "${ISSUE_META_FILE}")"
          ISSUE_NUMBER_JSON="$(jq -r '.number' "${ISSUE_META_FILE}")"
          ISSUE_URL_JSON="$(jq -r '.html_url' "${ISSUE_META_FILE}")"
          ISSUE_BODY_DELIM="EOF_$(date +%s%N)_$RANDOM"

          # TRUST BOUNDARY: ISSUE_BODY is user-controlled content from the GitHub
          # issue. It is passed via heredoc (not shell expansion) to prevent injection
          # into shell commands. Downstream consumers must treat it as untrusted input.
          {
            echo "ISSUE_NUMBER=${ISSUE_NUMBER_JSON}"
            echo "ISSUE_URL=${ISSUE_URL_JSON}"
            printf 'ISSUE_BODY<<%s\n' "${ISSUE_BODY_DELIM}"
            printf '%s\n' "${ISSUE_BODY}"
            printf '%s\n' "${ISSUE_BODY_DELIM}"
          } >> "$GITHUB_ENV"

      - name: Detect smoke test and tune LLM settings
        if: env.SKIP_PLAN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          ISSUE_TITLE="$(jq -r '.title // ""' "${ISSUE_META_FILE}")"

          IS_SMOKE_PLAN="false"

          # Direct match on the issue's own title. Matches every
          # `[E2E <variant>]` fixture title the release gate creates, not
          # just `[E2E Smoke Test]`. The gate builds four shapes
          # (test-and-mark-stable.yml:544, 2661, 4664, 4942) and the old
          # literal `\[E2E Smoke Test\]` pattern matched only two:
          # `[E2E Clarify Negative Test]` has a different middle token, and
          # `[E2E Smoke Test alt-model]` has no `]` directly after `Test`.
          # Anchored at `^` so a production issue that merely mentions a
          # fixture tag mid-title is not mistaken for the fixture itself;
          # real AI issue titles never begin with `[E2E `.
          if echo "${ISSUE_TITLE}" | grep -qiE '^\[E2E '; then
            IS_SMOKE_PLAN="true"
          fi

          # Orchestrator-managed children carry NO fixture marker at all.
          # The gate's orchestrate-decompose-test job feeds a
          # `[E2E Orchestrate Smoke <run_id>]` project description to the
          # decomposer, which then writes the child titles itself (e.g.
          # "Update E2E smoke canary A for run 35672590166", issues #4249
          # and #4250 of run 35672590166). No title pattern can ever match
          # those, so fall back to the parent tracking issue's title, the
          # same signal orchestrate_clarify_respond.yml already uses
          # (`^\[Orchestrator\] E2E `). Gated behind the title check and a
          # present `Tracking issue: #N` ref, so this costs at most one
          # extra API call and only on orchestrator-managed plan runs
          # (CLAUDE.md §15). Fails open: an unreachable or unparseable
          # parent leaves alerts enabled rather than silencing a real
          # project.
          if [ "${IS_SMOKE_PLAN}" = "false" ]; then
            SMOKE_ISSUE_BODY="$(jq -r '.body // ""' "${ISSUE_META_FILE}")"
            SMOKE_TRACKING_NUM="$(printf '%s' "${SMOKE_ISSUE_BODY}" | sed -n 's/.*Tracking issue: #\([0-9][0-9]*\).*/\1/p' | head -n1)"
            if [ -n "${SMOKE_TRACKING_NUM:-}" ]; then
              SMOKE_TRACKING_TITLE=""
              if SMOKE_TRACKING_PAYLOAD="$(gh api "repos/${{ github.repository }}/issues/${SMOKE_TRACKING_NUM}" 2>/dev/null)"; then
                SMOKE_TRACKING_TITLE="$(printf '%s' "${SMOKE_TRACKING_PAYLOAD}" | jq -r '.title // ""' 2>/dev/null || echo "")"
              fi
              if printf '%s' "${SMOKE_TRACKING_TITLE}" | grep -qiE '^\[Orchestrator\] E2E '; then
                echo "🔬 Smoke orchestrator parent (#${SMOKE_TRACKING_NUM}) detected"
                IS_SMOKE_PLAN="true"
              fi
            fi
          fi

          if [ "${IS_SMOKE_PLAN}" = "true" ]; then
            echo "🔬 Smoke test detected — switching to low reasoning effort"
            echo "MODEL_REASONING_EFFORT=low" >> "$GITHUB_ENV"
            # Suppress per-phase Telegram alerts from this plan run; the
            # test-and-mark-stable gate emits a single combined pass/fail
            # notification at the end. SILENT > CRITICAL so all levels filter.
            echo "ALERT_MSG_LEVEL=SILENT" >> "$GITHUB_ENV"
          fi

      - name: Fetch issue comments
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          gh_retry gh api --paginate "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments?per_page=100" > "${ISSUE_COMMENTS_FILE}"

      - name: Validate planning phase label
        if: env.SKIP_PLAN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRIGGER_COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          if ! printf '%s' "${TRIGGER_COMMENT_BODY}" | perl -0777 -ne 'exit((/^\s*\/answer\b/is) ? 0 : 1)'; then
            echo "Comment does not begin with /answer on first non-whitespace content. Skipping planning run."
            echo "AI_PHASE_GATE_V1 phase=plan gate=trigger_validation reason=invalid_trigger_body outcome=skip issue=${ISSUE_NUMBER}"
            echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # Reuse already-fetched issue metadata instead of a redundant API call
          ISSUE_STATE="$(jq -r '.state // "open"' "${ISSUE_META_FILE}")"
          if [ "${ISSUE_STATE}" = "closed" ]; then
            # Closed issues should not progress through the pipeline. The
            # orchestrate-decompose-test smoke closes its child issues in
            # cleanup before the clarify→plan→implement chain finishes;
            # without this gate, plan keeps running on the closed issue,
            # posts the plan comment, and (when AUTO_IMPLEMENT_ON_CLEAR_PLAN
            # is set) auto-approves implement to fire on a closed issue.
            echo "Issue #${ISSUE_NUMBER} is closed. Skipping planning run."
            echo "AI_PHASE_GATE_V1 phase=plan gate=trigger_validation reason=issue_closed outcome=skip issue=${ISSUE_NUMBER}"
            echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
            exit 0
          fi
          # A standalone issue that declares a pull-request dependency (issue
          # #7228) is not planned until that PR is merged into the default
          # branch and the declared string is on it; the standalone poller
          # resumes it once with /reclarify. Checked before any label change.
          # scripts/pr_dependency.py was installed from verified support, and
          # -I keeps the checkout directory off the import path.
          PR_DEPENDENCY_VERDICT="$(PYTHONDONTWRITEBYTECODE=1 python3 -I -B scripts/pr_dependency.py pr-dependency --issue-json "${ISSUE_META_FILE}" --repo "${{ github.repository }}" --issue-number "${ISSUE_NUMBER}" 2>/dev/null || echo '{"status":"held","reason":"pr_dependency_check_failed"}')"
          if [ "$(printf '%s' "${PR_DEPENDENCY_VERDICT}" | jq -r '.status // "held"' 2>/dev/null)" = "held" ]; then
            _pr_dependency_reason="$(printf '%s' "${PR_DEPENDENCY_VERDICT}" | jq -r '.reason // "unknown"' 2>/dev/null | tr -cd 'A-Za-z0-9_.-' | cut -c1-64 || true)"
            echo "AI_PHASE_GATE_V1 phase=plan gate=pr_dependency reason=${_pr_dependency_reason:-unknown} outcome=skip issue=${ISSUE_NUMBER}"
            echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
            exit 0
          fi
          ISSUE_LABELS_JSON="$(jq -c '[.labels[].name]' "${ISSUE_META_FILE}")"
          if printf '%s' "${ISSUE_LABELS_JSON}" | jq -e 'index("ai:planning") != null' >/dev/null; then
            echo "Issue #${ISSUE_NUMBER} is already in ai:planning phase."
          elif printf '%s' "${ISSUE_LABELS_JSON}" | jq -e 'index("ai:clarification") != null' >/dev/null; then
            echo "Issue #${ISSUE_NUMBER} is in ai:clarification phase; transitioning to ai:planning for /answer processing."
            source scripts/label_helpers.sh
            ensure_label_exists "ai:planning" "${{ github.repository }}"
            gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${{ github.repository }}" \
              --add-label 'ai:planning' --remove-label 'ai:clarification' >/dev/null 2>&1 || true
          elif printf '%s' "${ISSUE_LABELS_JSON}" | jq -e 'index("ai:blocked") != null' >/dev/null; then
            echo "Issue #${ISSUE_NUMBER} is in ai:blocked phase; transitioning to ai:planning for /answer processing."
            source scripts/label_helpers.sh
            ensure_label_exists "ai:planning" "${{ github.repository }}"
            gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${{ github.repository }}" \
              --add-label 'ai:planning' --remove-label 'ai:blocked' >/dev/null 2>&1 || true
          else
            echo "Issue #${ISSUE_NUMBER} has none of ai:planning, ai:clarification, or ai:blocked labels. Skipping planning run."
            echo "Current labels: ${ISSUE_LABELS_JSON}"
            echo "AI_PHASE_GATE_V1 phase=plan gate=trigger_validation reason=missing_expected_phase_label outcome=skip issue=${ISSUE_NUMBER}"
            echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
            exit 0
          fi

      - name: Skip when issue already has a PR
        if: env.SKIP_PLAN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          # Only the issue's OWN implementation PR blocks a planning run:
          # an open PR on the conventional implement head `ai/issue-<N>`,
          # or an open PR whose body closes the issue with a supported short,
          # qualified, or GitHub issue URL reference. This mirrors
          # _pr_json_closes_issue in scripts/orchestrate_poll_process.sh.
          #
          # The previous gh pr list --search approach produced false positives
          # when unrelated PRs happened to mention the issue number, and the
          # bare timeline cross-reference count that replaced it had the same
          # blind spot: any open PR that merely mentions the issue ("Refs #N"
          # from an unrelated fix) also emits a `cross-referenced` event.
          # That skipped planning for issue #4073 three times in a row while
          # PR #4072 — a main-branch fix citing #4073 as context — was open;
          # the issue sat in ai:planning with no comment or label change
          # until stall recovery closed and re-issued it (#4075). Mention-only
          # PRs are now logged and ignored.
          #
          # §15: one timeline call identifies cross-referenced candidates;
          # one paginated open-PR inventory supplies the bodies and heads that
          # the timeline payload omits. This avoids one REST call per candidate.
          repo_slug="${{ github.repository }}"
          repo_owner="${repo_slug%%/*}"
          impl_head="ai/issue-${ISSUE_NUMBER}"
          closing_kw_re="(^|[^[:alnum:]_-])(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+(#${ISSUE_NUMBER}|[[:alnum:]_.-]+/[[:alnum:]_.-]+#${ISSUE_NUMBER}|https?://github[.]com/[[:alnum:]_.-]+/[[:alnum:]_.-]+/issues/${ISSUE_NUMBER})([^[:alnum:]_-]|$)"
          CROSS_REF_PR_CANDIDATES="$(gh_retry gh api --paginate \
            "repos/${repo_slug}/issues/${ISSUE_NUMBER}/timeline" \
            --jq '
              [.[]
               | select(.event == "cross-referenced")
               | select(.source.issue.pull_request != null)
               | select(.source.issue.state == "open")
               | .source.issue
              ]
              | unique_by(.number)
              | .[]
              | "\(.number)\t\(.html_url)"
            ')"
          OPEN_PR_INVENTORY="$(gh_retry gh api --paginate \
            "repos/${repo_slug}/pulls?state=open&per_page=100" \
            --jq '.[] | "\(.number)\t\(.html_url)\t\(.head.ref // "")\t\(.head.repo.owner.login // "")\t\((.body // "") | @base64)"')"
          CROSS_REF_PRS=""
          HEAD_BRANCH_PRS=""
          while IFS=$'\t' read -r inventory_pr_num inventory_pr_url inventory_head_ref inventory_head_owner inventory_body_b64; do
            [ -n "${inventory_pr_num}" ] || continue
            if [ "${inventory_head_ref}" = "${impl_head}" ] && [ "${inventory_head_owner,,}" = "${repo_owner,,}" ]; then
              HEAD_BRANCH_PRS+="#${inventory_pr_num} ${inventory_pr_url}"$'\n'
            fi
          done <<< "${OPEN_PR_INVENTORY}"
          while IFS=$'\t' read -r xref_candidate_num xref_candidate_url; do
            [ -n "${xref_candidate_num}" ] || continue
            xref_candidate_body_b64=""
            while IFS=$'\t' read -r inventory_pr_num inventory_pr_url inventory_head_ref inventory_head_owner inventory_body_b64; do
              if [ "${inventory_pr_num}" = "${xref_candidate_num}" ]; then
                xref_candidate_body_b64="${inventory_body_b64}"
                break
              fi
            done <<< "${OPEN_PR_INVENTORY}"
            if printf '%s' "${HEAD_BRANCH_PRS}" | grep -Fqx "#${xref_candidate_num} ${xref_candidate_url}"; then
              continue
            fi
            xref_candidate_body="$(printf '%s' "${xref_candidate_body_b64}" | base64 --decode)"
            if printf '%s' "${xref_candidate_body}" | grep -Eiq "${closing_kw_re}"; then
              CROSS_REF_PRS+="${xref_candidate_num}"$'\t'"${xref_candidate_url}"$'\tcloses\n'
            else
              CROSS_REF_PRS+="${xref_candidate_num}"$'\t'"${xref_candidate_url}"$'\tmention\n'
            fi
          done <<< "${CROSS_REF_PR_CANDIDATES}"
          IMPL_PRS=""
          MENTION_ONLY_PRS=""
          while IFS=$'\t' read -r xref_pr_num xref_pr_url xref_pr_kind; do
            [ -n "${xref_pr_num}" ] || continue
            if [ "${xref_pr_kind}" = "closes" ]; then
              IMPL_PRS+="#${xref_pr_num} ${xref_pr_url}"$'\n'
            else
              MENTION_ONLY_PRS+="#${xref_pr_num} ${xref_pr_url}"$'\n'
            fi
          done <<< "${CROSS_REF_PRS}"
          if [ -n "${HEAD_BRANCH_PRS}" ]; then
            IMPL_PRS+="${HEAD_BRANCH_PRS}"$'\n'
          fi
          IMPL_PRS="$(printf '%s' "${IMPL_PRS}" | grep -E '^#[0-9]+ ' | sort -u || true)"
          if [ -n "${MENTION_ONLY_PRS}" ]; then
            echo "Ignoring open PR(s) that only mention issue #${ISSUE_NUMBER} (not its implementation PR):"
            printf '%s' "${MENTION_ONLY_PRS}"
          fi
          LINKED_PR_COUNT="$(printf '%s\n' "${IMPL_PRS}" | grep -cE '^#[0-9]+ ' || true)"
          if [ "${LINKED_PR_COUNT}" -gt 0 ]; then
            echo "Issue #${ISSUE_NUMBER} already has at least one open PR. Skipping planning run."
            printf '%s\n' "${IMPL_PRS}"
            echo "AI_PHASE_GATE_V1 phase=plan gate=existing_pr_check reason=existing_pr outcome=skip issue=${ISSUE_NUMBER}"
            echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
          fi

      - name: Skip stale /answer comments
        if: env.SKIP_PLAN != 'true'
        env:
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail

          LATEST_ANSWER_COMMENT_ID="$(jq -r '
            [ .[] | select((.body // "") | test("(?i)^\\s*/answer\\b")) ]
            | sort_by(.created_at)
            | last
            | .id // ""
          ' "${ISSUE_COMMENTS_FILE}")"

          if [ -z "${LATEST_ANSWER_COMMENT_ID}" ] || [ "${LATEST_ANSWER_COMMENT_ID}" = "null" ]; then
            echo "No start-of-comment /answer command found. Skipping planning run."
            echo "AI_PHASE_GATE_V1 phase=plan gate=comment_freshness reason=no_answer_comment outcome=skip issue=${ISSUE_NUMBER}"
            echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Triggering comment ID: ${TRIGGER_COMMENT_ID}"
          echo "Latest /answer comment ID: ${LATEST_ANSWER_COMMENT_ID}"

          if [ "${LATEST_ANSWER_COMMENT_ID}" != "${TRIGGER_COMMENT_ID}" ]; then
            echo "Skipping stale /answer comment ${TRIGGER_COMMENT_ID}; latest is ${LATEST_ANSWER_COMMENT_ID}."
            echo "AI_PHASE_GATE_V1 phase=plan gate=comment_freshness reason=stale_answer_comment outcome=skip issue=${ISSUE_NUMBER} trigger_comment_id=${TRIGGER_COMMENT_ID} latest_comment_id=${LATEST_ANSWER_COMMENT_ID}"
            echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
            exit 0
          fi

      - name: Close superseded CI-repair issue (merged PR)
        id: superseded_merged_pr
        if: env.SKIP_PLAN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO_SLUG: ${{ github.repository }}
          PLAN_SUPERSEDED_MERGED_PR_CHECK_ENABLED: ${{ vars.PLAN_SUPERSEDED_MERGED_PR_CHECK_ENABLED || 'true' }}
          PLAN_SUPERSEDE_RESOLVED_REF: ${{ steps.refctx.outputs.ref || github.event.repository.default_branch }}
          PLAN_PR_NOT_OPEN: ${{ steps.refctx.outputs.pr_not_open }}
          PLAN_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          ALERT_MSG_LEVEL: ${{ env.ALERT_MSG_LEVEL || vars.ALERT_MSG_LEVEL || 'WARNING' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # Issue #7216: a check-failure triage issue (or a re-issue of one)
          # whose pull request already merged with the failing check green on
          # its final head is superseded. Close it before the /answer claim so
          # the model never plans edits to the merged PR's former head branch
          # (#7185). Every unverifiable state plans as usual (fail open).
          set -uo pipefail
          log() { echo "PLAN_SUPERSEDED_MERGED_PR issue=${ISSUE_NUMBER} $*"; }
          # Issue #7477: when "Resolve integration ref" tolerated a CI-triage
          # PR that is no longer open (pr_not_open=true), the checkout is the
          # default branch. Any outcome this step cannot resolve (close the
          # issue, or plan on the PR's base) skips planning instead.
          pr_not_open=false
          if [ "${PLAN_PR_NOT_OPEN:-}" = "true" ]; then
            pr_not_open=true
          fi
          pr_not_open_unresolved() {
            local detail="${1:-unknown}"
            echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
            log "outcome=skip reason=pr_not_open_unresolved detail=${detail}"
            echo "::warning::Planning skipped for #${ISSUE_NUMBER}: CI-triage PR is no longer open and the superseded check could not resolve the issue (${detail})."
            source scripts/tg_helpers.sh 2>/dev/null || true
            if type tg_send_tracked >/dev/null 2>&1; then
              tg_send_tracked "${ISSUE_NUMBER}" "Planning skipped for #${ISSUE_NUMBER}: its CI-triage PR is no longer open and the superseded check could not resolve the issue (${detail})."$'\n'"Issue: ${ISSUE_URL:-}" "WARNING" || true
            fi
            exit 0
          }
          case "$(printf '%s' "${PLAN_SUPERSEDED_MERGED_PR_CHECK_ENABLED:-true}" | tr '[:upper:]' '[:lower:]' | xargs)" in
            false|0|no|off)
              [ "${pr_not_open}" = "true" ] && pr_not_open_unresolved disabled
              log "outcome=skip reason=disabled"
              exit 0
              ;;
          esac
          # API-free pre-filter (a superset of the helper's own): only a
          # triage issue or a body with a re-issue reference costs API calls.
          if ! python3 -I -B -c '
          import json, re, sys
          meta = json.load(open(sys.argv[1], encoding="utf-8"))
          labels = {(label.get("name") if isinstance(label, dict) else label) for label in meta.get("labels") or []}
          body = meta.get("body") if isinstance(meta.get("body"), str) else ""
          ok = "ai:check-triage" in labels or re.search(r"Re-issued (by the unblock judge )?from\s*#|^-\s*Replaces:\s*#", body, re.M)
          sys.exit(0 if ok else 1)
          ' "${ISSUE_META_FILE}" >/dev/null 2>&1; then
            [ "${pr_not_open}" = "true" ] && pr_not_open_unresolved not_candidate
            log "outcome=plan reason=not_candidate"
            exit 0
          fi
          # Run only the verified support copy, never the checkout's scripts/ (#7159).
          helper=""
          for candidate in "$(pwd)/.codex-workflow-src/scripts/plan_superseded_merged_pr.py" \
            "$(pwd)/.codex-workflow-src-main/scripts/plan_superseded_merged_pr.py"; do
            if [ -f "${candidate}" ] && [ ! -L "${candidate}" ]; then
              helper="${candidate}"
              break
            fi
          done
          if [ -z "${helper}" ]; then
            [ "${pr_not_open}" = "true" ] && pr_not_open_unresolved helper_missing
            echo "::warning::Superseded-issue check helper is unavailable; planning as usual."
            log "outcome=plan reason=helper_missing"
            exit 0
          fi
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          # §14: the issue and comment reads above carry no PR or check state;
          # the helper's PR, check-run and source-issue reads are new and run
          # only for candidates. This identity read binds trust to the pipeline account.
          login="$(gh_retry gh api user --jq .login 2>/dev/null || true)"
          result_file="${RUNTIME_DIR}/plan_superseded.json"
          if ! python3 -I -B "${helper}" classify --issue-meta-file "${ISSUE_META_FILE}" \
            --repo "${REPO_SLUG}" --pipeline-login "${login}" --out "${result_file}"; then
            [ "${pr_not_open}" = "true" ] && pr_not_open_unresolved classifier_failed
            log "outcome=plan reason=classifier_failed"
            exit 0
          fi
          # Read one string field of the classifier JSON ("" when absent).
          field() {
            python3 -I -B -c 'import json, sys; value = json.load(open(sys.argv[1], encoding="utf-8")).get(sys.argv[2]); sys.stdout.write("" if value is None else str(value))' "${result_file}" "$1"
          }
          if ! outcome="$(field outcome 2>/dev/null)" || [ -z "${outcome}" ]; then
            [ "${pr_not_open}" = "true" ] && pr_not_open_unresolved classifier_failed
            log "outcome=plan reason=classifier_failed"
            exit 0
          fi
          reason="$(field reason | tr -cd 'a-z_')"
          source_issue="$(field source_issue | tr -cd '0-9')"
          pr_number="$(field pr | tr -cd '0-9')"
          head_sha="$(field final_head_sha | tr -cd '0-9a-f' | cut -c1-40)"
          base_ref="$(field base_ref)"
          head_ref="$(field head_ref)"
          check_label="$(field check_name | tr -cd 'A-Za-z0-9._/:()+-' | cut -c1-120)"
          case "${outcome}" in
            superseded)
              marker="<!-- ai:plan-superseded:v1 pr=${pr_number} head=${head_sha} -->"
              comment="present"
              # Dedupe on a marker the pipeline login wrote (the paginated
              # comments file may hold several JSON arrays back to back).
              if ! python3 -I -B -c '
          import json, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          decoder, pos, comments = json.JSONDecoder(), 0, []
          while True:
              while pos < len(text) and text[pos].isspace():
                  pos += 1
              if pos >= len(text):
                  break
              page, pos = decoder.raw_decode(text, pos)
              comments.extend(page if isinstance(page, list) else [])
          found = any(isinstance(c, dict) and (c.get("user") or {}).get("login") == sys.argv[2]
              and sys.argv[3] in (c.get("body") or "") for c in comments)
          sys.exit(0 if found else 1)
          ' "${ISSUE_COMMENTS_FILE}" "${login}" "${marker}" >/dev/null 2>&1; then
                comment_file="${RUNTIME_DIR}/plan_superseded_comment.md"
                field comment_body > "${comment_file}"
                if ! grep -qF -- "${marker}" "${comment_file}" || \
                  ! gh_retry gh api "repos/${REPO_SLUG}/issues/${ISSUE_NUMBER}/comments" -f body="$(cat "${comment_file}")" >/dev/null; then
                  [ "${pr_not_open}" = "true" ] && pr_not_open_unresolved comment_failed
                  echo "::warning::Could not post the superseded-issue comment; planning as usual."
                  log "source=${source_issue} pr=${pr_number} outcome=plan reason=comment_failed"
                  exit 0
                fi
                comment="posted"
              fi
              # The marker exists from here on: never run the model, even if
              # a label or close write fails (a rerun finds the marker).
              echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
              label_state="applied"
              close_state="done"
              source scripts/label_helpers.sh 2>/dev/null || true
              if type ensure_label_exists >/dev/null 2>&1; then
                ensure_label_exists "ai:closed" "${REPO_SLUG}" || true
              fi
              if ! gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${REPO_SLUG}" \
                --add-label 'ai:closed' \
                --remove-label 'ai:planning' \
                --remove-label 'ai:clarification' \
                --remove-label 'ai:awaiting-approval' >/dev/null 2>&1; then
                label_state="failed"
              fi
              if ! gh_retry gh issue close "${ISSUE_NUMBER}" --repo "${REPO_SLUG}" --reason "not planned" >/dev/null 2>&1; then
                close_state="failed"
              fi
              log "source=${source_issue} pr=${pr_number} head=${head_sha:0:12} check=${check_label} outcome=superseded label=${label_state} close=${close_state} comment=${comment}"
              source scripts/tg_helpers.sh 2>/dev/null || true
              if [ "${label_state}" = "failed" ] || [ "${close_state}" = "failed" ]; then
                echo "::warning::Superseded issue #${ISSUE_NUMBER} could not be fully closed (label=${label_state} close=${close_state})."
                if type tg_send_tracked >/dev/null 2>&1; then
                  tg_send_tracked "${ISSUE_NUMBER}" "Superseded CI-repair issue #${ISSUE_NUMBER} (merged PR #${pr_number}) could not be closed: label=${label_state} close=${close_state}."$'\n'"Issue: ${ISSUE_URL:-}" "WARNING" || true
                fi
              elif type tg_send_tracked >/dev/null 2>&1; then
                tg_send_tracked "${ISSUE_NUMBER}" "Closed superseded CI-repair issue #${ISSUE_NUMBER}: PR #${pr_number} merged with ${check_label} passing." "DEBUG" || true
              fi
              ;;
            merged_check_not_passed)
              facts_file="${RUNTIME_DIR}/merged_pr_facts.txt"
              field facts > "${facts_file}"
              echo "PLAN_MERGED_PR_FACTS_FILE=${facts_file}" >> "$GITHUB_ENV"
              branch_ok() { [[ "$1" =~ ^[A-Za-z0-9._/-]{1,200}$ ]] && [[ "$1" != *..* ]]; }
              # Reroute when the checkout is the merged PR's former head, or
              # (#7477) when the PR is no longer open, the checkout is the
              # default branch and the PR's base is another branch.
              if { { [ -n "${head_ref}" ] && [ "${PLAN_SUPERSEDE_RESOLVED_REF}" = "${head_ref}" ]; } || \
                { [ "${pr_not_open}" = "true" ] && [ "${base_ref}" != "${PLAN_DEFAULT_BRANCH:-}" ]; }; } && \
                branch_ok "${base_ref}"; then
                # "Stage workflow support files" installed support copies over
                # tracked scripts/ and prompts/ files, so a plain checkout
                # refuses when they differ between head and base. Save them,
                # force the checkout, then put the staged copies back. Ignored
                # files count too: consumer runs list staged helpers in
                # scripts/.gitignore, and checkout overwrites ignored files.
                staged_tar="${RUNTIME_DIR}/plan_reroute_staged_support.tar"
                if git fetch --quiet --depth 1 origin "refs/heads/${base_ref}" && \
                  { git diff -z --name-only HEAD; git ls-files -z --others -- scripts prompts ai-memory; } | \
                    tar --null --ignore-failed-read -cf "${staged_tar}" -T - 2>/dev/null && \
                  git checkout --quiet -f -B "${base_ref}" FETCH_HEAD && \
                  tar -xf "${staged_tar}"; then
                  echo "PLAN_REROUTED_REF=${base_ref}" >> "$GITHUB_ENV"
                  log "source=${source_issue} pr=${pr_number} outcome=rerouted from=${head_ref:-default} to=${base_ref}"
                else
                  # Never plan on the merged PR's former head (#7185): skip
                  # this run and let stall recovery retry it.
                  echo "::warning::Could not check out ${base_ref} for planning; skipping planning this run."
                  echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
                  log "source=${source_issue} pr=${pr_number} outcome=skip reason=reroute_failed"
                  source scripts/tg_helpers.sh 2>/dev/null || true
                  if type tg_send_tracked >/dev/null 2>&1; then
                    tg_send_tracked "${ISSUE_NUMBER}" "Planning skipped for #${ISSUE_NUMBER}: could not check out ${base_ref} after PR #${pr_number} merged."$'\n'"Issue: ${ISSUE_URL:-}" "WARNING" || true
                  fi
                fi
              elif [ "${pr_not_open}" = "true" ] && [ "${base_ref}" != "${PLAN_DEFAULT_BRANCH:-}" ]; then
                # The base failed the branch-name check: never fall through
                # to planning on the default branch.
                pr_not_open_unresolved invalid_base_ref
              else
                log "source=${source_issue} pr=${pr_number} check=${check_label} outcome=plan reason=merged_check_not_passed"
              fi
              ;;
            *)
              [ "${pr_not_open}" = "true" ] && pr_not_open_unresolved "${reason:-unknown}"
              log "outcome=plan reason=${reason:-unknown}"
              ;;
          esac

      - name: Check and claim /answer command
        if: env.SKIP_PLAN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh
          memory_bootstrap --ensure-branch

          CHECK_RESULT="$(memory_processed_command_check \
            --issue-number "${ISSUE_NUMBER}" \
            --comment-id "${TRIGGER_COMMENT_ID}" \
            --command "answer")"

          CHECK_EXISTS="$(printf '%s' "${CHECK_RESULT}" | jq -r '.exists // false' 2>/dev/null || echo "false")"
          if [ "${CHECK_EXISTS}" = "true" ]; then
            echo "::notice::/answer comment ${TRIGGER_COMMENT_ID} already processed; skipping."
            echo "AI_PHASE_GATE_V1 phase=plan gate=command_claim reason=already_processed outcome=skip issue=${ISSUE_NUMBER} comment_id=${TRIGGER_COMMENT_ID}"
            echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
            exit 0
          fi

          CLAIM_RESULT="$(memory_processed_command_claim \
            --issue-number "${ISSUE_NUMBER}" \
            --comment-id "${TRIGGER_COMMENT_ID}" \
            --command "answer" \
            --workflow "plan" \
            --actor "${{ github.actor }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}")"

          memory_enabled="$(printf '%s' "${AI_MEMORY_ENABLED:-true}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${memory_enabled}" =~ ^(1|true|yes|on)$ ]]; then
            if [ -z "${CLAIM_RESULT}" ]; then
              echo "::error::Empty /answer claim output while AI memory is enabled"
              exit 1
            fi

            if ! CLAIMED="$(printf '%s' "${CLAIM_RESULT}" | jq -r '
              if (if (.operation_result | type) == "object" then (.operation_result | has("claimed")) else false end) then
                (.operation_result.claimed | select(type == "boolean"))
              elif has("claimed") then
                (.claimed | select(type == "boolean"))
              else
                null
              end
            ' 2>/dev/null)"; then
              echo "::error::Malformed /answer claim output while AI memory is enabled"
              exit 1
            fi

            if [[ "${CLAIMED}" != "true" && "${CLAIMED}" != "false" ]]; then
              echo "::error::Malformed /answer claim output while AI memory is enabled"
              exit 1
            fi
          else
            CLAIMED="true"
          fi

          if [ "${CLAIMED}" != "true" ]; then
            echo "::notice::/answer comment ${TRIGGER_COMMENT_ID} claimed by another run; skipping."
            echo "AI_PHASE_GATE_V1 phase=plan gate=command_claim reason=claimed_elsewhere outcome=skip issue=${ISSUE_NUMBER} comment_id=${TRIGGER_COMMENT_ID}"
            echo "SKIP_PLAN=true" >> "$GITHUB_ENV"
            exit 0
          fi

          {
            echo "PROCESSED_ANSWER_CLAIMED=true"
            echo "PROCESSED_ANSWER_COMPLETED=false"
          } >> "$GITHUB_ENV"

      - name: Record planning run start
        if: env.SKIP_PLAN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh

          memory_record_run_event \
            --run-id "${{ github.run_id }}" \
            --workflow "plan" \
            --event-type "phase_started" \
            --status "ok" \
            --message "Planning phase started for issue #${ISSUE_NUMBER}" \
            --actor "${{ github.actor }}" \
            --issue-number "${ISSUE_NUMBER}"

      - name: Cleanup clarify-phase Telegram messages
        if: env.SKIP_PLAN != 'true'
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/tg_helpers.sh
          tg_cleanup_phase_msgs "${ISSUE_NUMBER}" "clarify"

      - name: Delete clarification question comments
        if: env.SKIP_PLAN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          # Find clarification comments by HTML marker or legacy "Clarification required" prefix.
          # Trusted authors are "...[bot]" logins (GitHub Apps — installable only
          # by repo admins) OR OWNER/MEMBER/COLLABORATOR author_association (the
          # same trust list clarify.yml applies to /reclarify). Pipeline comments
          # are posted with the GH_PAT, so their author is the PAT owner's human
          # login with OWNER association — a bot-login-only filter excluded every
          # pipeline-posted clarification comment and left stale ones behind
          # forever, while a body-marker-only match would let any commenter
          # spoof the marker and have this step delete their comment.
          CLARIFY_IDS="$(jq -r '
            .[]
            | select(
                (
                  (.user.login // "" | test("\\[bot\\]$")) or
                  ((.author_association // "") | IN("OWNER", "MEMBER", "COLLABORATOR"))
                ) and
                ((.body // "") | test("<!-- ai:clarification-questions -->|^Clarification required"))
              )
            | .id
          ' "${ISSUE_COMMENTS_FILE}")"

          for cid in ${CLARIFY_IDS}; do
            echo "Deleting clarification comment ${cid}"
            gh_retry gh api -X DELETE "repos/${{ github.repository }}/issues/comments/${cid}" || true
          done

      - name: Extract clarification answers and questions
        if: env.SKIP_PLAN != 'true'
        env:
          TRIGGER_COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          write_multiline_env() {
            local key="$1"
            local value="$2"
            local delim
            delim="EOF_$(date +%s%N)_$RANDOM"
            {
              printf '%s<<%s\n' "$key" "$delim"
              printf '%s\n' "$value"
              printf '%s\n' "$delim"
            } >> "$GITHUB_ENV"
          }

          ANSWER_COMMENT_BODY="$(jq -r '
            [ .[] | select((.body // "") | test("(?i)^\\s*/answer\\b")) ]
            | sort_by(.created_at)
            | last
            | .body // ""
          ' "${ISSUE_COMMENTS_FILE}")"

          if [ -z "${ANSWER_COMMENT_BODY}" ] || [ "${ANSWER_COMMENT_BODY}" = "null" ]; then
            echo "No /answer comment found in thread; using triggering comment body."
            ANSWER_COMMENT_BODY="${TRIGGER_COMMENT_BODY}"
          fi

          USER_ANSWERS="$(printf '%s' "${ANSWER_COMMENT_BODY}" | perl -0777 -pe 's/^\s*\/answer\b\s*//is')"
          if [ -z "${USER_ANSWERS}" ]; then
            USER_ANSWERS="(No content provided after /answer.)"
          fi

          CLARIFICATION_QUESTIONS="$(jq -r '
            def ix_of_latest_answer:
              ([ .
                | to_entries[]
                | select((.value.body // "") | test("(?i)^\\s*/answer\\b"))
                | .key
              ] | last);

            . as $all
            | (ix_of_latest_answer) as $idx
            | if ($idx == null) then
                ""
              else
                [ range(0; $idx) as $i | $all[$i] ]
                | reverse
                | map(select(
                    ((.user.type // "") != "User") or
                    ((.body // "") | test("Q[0-9]+:|QUESTIONS:|clarification"; "i"))
                  ))
                | if length > 0 then .[0].body // "" else "" end
              end
          ' "${ISSUE_COMMENTS_FILE}")"

          if [ -z "${CLARIFICATION_QUESTIONS}" ]; then
            CLARIFICATION_QUESTIONS="(No clarification questions were required. Continuation was confirmed with /answer.)"
          fi

          write_multiline_env "USER_ANSWERS" "${USER_ANSWERS}"
          write_multiline_env "CLARIFICATION_QUESTIONS" "${CLARIFICATION_QUESTIONS}"

      - name: Capture planning ref context
        if: env.SKIP_PLAN != 'true'
        env:
          RESOLVED_REF: ${{ steps.refctx.outputs.ref || github.event.repository.default_branch }}
          INTEGRATION_BRANCH_META: ${{ steps.refctx.outputs.integration_branch_meta }}
        run: |
          set -euo pipefail

          HEAD_SHA="$(git rev-parse HEAD)"
          HEAD_SYMBOLIC_BRANCH="$(git symbolic-ref --short -q HEAD || true)"
          if [ -z "${HEAD_SYMBOLIC_BRANCH}" ]; then
            HEAD_SYMBOLIC_BRANCH="<detached-head>"
          fi

          HEAD_BRANCH="${RESOLVED_REF}"
          if [ -n "${PLAN_REROUTED_REF:-}" ]; then
            # Issue #7216: the merged PR's former head was the resolved ref;
            # the superseded-issue step checked out its base branch instead.
            HEAD_BRANCH="${PLAN_REROUTED_REF}"
          fi
          if [ -z "${HEAD_BRANCH}" ]; then
            HEAD_BRANCH="${HEAD_SYMBOLIC_BRANCH}"
          fi

          REF_MISMATCH="unknown"
          if [ -n "${INTEGRATION_BRANCH_META}" ]; then
            if [ "${HEAD_BRANCH}" = "${INTEGRATION_BRANCH_META}" ]; then
              REF_MISMATCH="false"
            else
              REF_MISMATCH="true"
            fi
          fi
          if [ -n "${PLAN_REROUTED_REF:-}" ]; then
            REF_MISMATCH="false"
          fi

          {
            echo "PLANNING_REF_REROUTED_FROM_MERGED_PR=${PLAN_REROUTED_REF:-}"
            echo "PLANNING_REF_HEAD_SHA=${HEAD_SHA}"
            echo "PLANNING_REF_HEAD_BRANCH=${HEAD_BRANCH}"
            echo "PLANNING_REF_SYMBOLIC_BRANCH=${HEAD_SYMBOLIC_BRANCH}"
            echo "PLANNING_REF_INTEGRATION_BRANCH_META=${INTEGRATION_BRANCH_META}"
            echo "PLANNING_REF_MISMATCH=${REF_MISMATCH}"
          } >> "$GITHUB_ENV"

      - name: Build planning context
        if: env.SKIP_PLAN != 'true'
        run: |
          set -euo pipefail
          {
            echo "ISSUE DESCRIPTION"
            printf '%s\n\n' "${ISSUE_BODY}"
            echo "CLARIFICATION QUESTIONS"
            printf '%s\n\n' "${CLARIFICATION_QUESTIONS}"
            echo "USER ANSWERS"
            printf '%s\n\n' "${USER_ANSWERS}"
            echo "PLANNING REF CONTEXT"
            printf 'git rev-parse HEAD: %s\n' "${PLANNING_REF_HEAD_SHA}"
            printf 'Resolved checkout ref: %s\n' "${PLANNING_REF_HEAD_BRANCH}"
            printf 'git symbolic-ref --short -q HEAD: %s\n' "${PLANNING_REF_SYMBOLIC_BRANCH}"
            printf 'Integration branch metadata: %s\n' "${PLANNING_REF_INTEGRATION_BRANCH_META}"
            if [ -n "${PLANNING_REF_REROUTED_FROM_MERGED_PR:-}" ]; then
              printf 'Rerouted from merged PR head to base: %s\n' "${PLANNING_REF_REROUTED_FROM_MERGED_PR}"
            fi
            printf 'Integration branch mismatch: %s\n\n' "${PLANNING_REF_MISMATCH}"
            if [ -n "${PLAN_MERGED_PR_FACTS_FILE:-}" ] && [ -s "${PLAN_MERGED_PR_FACTS_FILE}" ]; then
              echo "MERGED PULL REQUEST FACTS (host-verified)"
              cat "${PLAN_MERGED_PR_FACTS_FILE}"
              printf '\n'
            fi
            echo "ALL COMMENTS"
            jq -r 'sort_by(.created_at)[] | "[" + (.created_at // "") + "] @" + (.user.login // "unknown") + ":\n" + (.body // "") + "\n"' "${ISSUE_COMMENTS_FILE}"
          } > "${PLANNING_CONTEXT_FILE}"

      - name: Create Codex config
        if: env.SKIP_PLAN != 'true'
        run: |
          set -euo pipefail
          source scripts/codex_helpers.sh
          # Centralised in scripts/write_codex_config.sh — see that
          # script's header for the apply_patch / trust / elevation
          # rationale.
          codex_config_assemble "${MODEL_EDITOR}" "${MODEL_REASONING_EFFORT}" "low"

      - name: Post progress signal (setup complete)
        if: env.SKIP_PLAN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          if PROGRESS_COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body="<!-- ai:plan-progress -->⏳ Planning in progress — assembling context and invoking model…" \
            --jq '.id' 2>/dev/null) && [ -n "${PROGRESS_COMMENT_ID}" ]; then
            echo "PLAN_PROGRESS_COMMENT_ID=${PROGRESS_COMMENT_ID}" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not create optional plan progress comment; continuing without progress signals."
          fi

      - name: Pre-assemble static context (cacheable across runs)
        if: env.SKIP_PLAN != 'true'
        run: |
          set -euo pipefail
          # See scripts/build_static_context.sh for trimming rationale and
          # prompt-prefix caching motivation.
          bash scripts/build_static_context.sh plan ./pre_assembled_static.txt

      - name: Retrieve memory context
        if: env.SKIP_PLAN != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh
          memory_bootstrap --require memory_retrieve

          ISSUE_TITLE="$(jq -r '.title // ""' "${ISSUE_META_FILE}")"
          jq -r '.body // ""' "${ISSUE_META_FILE}" > "${RUNTIME_DIR}/issue_body.txt"

          memory_retrieve "${RUNTIME_DIR}/memory_context.txt" \
            --role "planning" \
            --issue-number "${ISSUE_NUMBER}" \
            --issue-title "${ISSUE_TITLE}" \
            --issue-body-file "${RUNTIME_DIR}/issue_body.txt"

          memory_retrieve "${RUNTIME_DIR}/repo_learnings_context.txt" \
            --role "planning" \
            --issue-number "${ISSUE_NUMBER}" \
            --issue-title "${ISSUE_TITLE}" \
            --issue-body-file "${RUNTIME_DIR}/issue_body.txt" \
            --category "repo_learnings" \
            --scope-level "global" \
            --max "10"

          python3 - <<'PY' "${RUNTIME_DIR}/repo_learnings_context.txt" "${RUNTIME_DIR}/repo_learnings.txt"
          from pathlib import Path
          import sys


          source_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          summaries: list[str] = []
          for raw_line in source_path.read_text(encoding="utf-8").splitlines():
              if not raw_line.startswith("- [") or " :: " not in raw_line:
                  continue
              summary = raw_line.split(" :: ", 1)[1].strip()
              if summary and summary.lower() != "none":
                  summaries.append(summary)

          if summaries:
              output_path.write_text(
                  "Repository learnings from prior merged work:\n"
                  + "\n".join(f"- {summary}" for summary in summaries)
                  + "\n",
                  encoding="utf-8",
              )
          else:
              output_path.write_text("", encoding="utf-8")
          PY

      # Check-triage target-branch guard (#7064, default off): when
      # CHECK_TRIAGE_BRANCH_GUARD_ENABLED is on, an ai:check-triage issue whose
      # body declares no verified "Target branch:" / "Integration branch:" line
      # is blocked instead of being planned on the default branch. The guard
      # reads only the resolver's status token and the GitHub-reported labels;
      # it never infers a branch from issue prose. The synthetic BLOCKED line
      # reuses the existing parse -> blocked-handler path.
      - name: Check-triage target-branch guard
        id: check_triage_branch_guard
        if: env.SKIP_PLAN != 'true'
        env:
          CHECK_TRIAGE_BRANCH_GUARD_ENABLED: ${{ vars.CHECK_TRIAGE_BRANCH_GUARD_ENABLED || 'false' }}
          CHECK_TRIAGE_RESOLVER_STATUS: ${{ steps.refctx.outputs.resolver_status }}
        run: |
          set -euo pipefail
          guard_enabled=false
          case "$(printf '%s' "${CHECK_TRIAGE_BRANCH_GUARD_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')" in
            true|1|yes|on) guard_enabled=true ;;
          esac
          # Closed vocabulary; anything else counts as "could not verify".
          resolver_status="${CHECK_TRIAGE_RESOLVER_STATUS:-}"
          case "${resolver_status}" in
            resolved|routed|none|failed|unavailable) ;;
            *) resolver_status="unknown" ;;
          esac
          issue_ref="${ISSUE_NUMBER:-}"
          [[ "${issue_ref}" =~ ^[0-9]+$ ]] || issue_ref="unknown"
          guard_log() {
            echo "CHECK_TRIAGE_BRANCH_GUARD issue=${issue_ref} enabled=${guard_enabled} check_triage=$1 resolver_status=${resolver_status} outcome=$2 reason=$3"
          }
          guard_block() {
            # The message follows the block reason, so an unreadable label
            # list is never reported as missing branch metadata.
            if [ "$2" = "labels_unavailable" ]; then
              printf '%s\n' "BLOCKED: ai:check-triage target-branch guard could not be verified because the issue labels were unreadable (resolver_status=${resolver_status}); re-run planning with /answer" > "${CODEX_OUTPUT_FILE}"
            elif [ "$2" = "no_target_branch_metadata" ]; then
              printf '%s\n' 'BLOCKED: ai:check-triage issue has no explicit target-branch metadata; add a standalone `Target branch: BRANCH_NAME` or `Integration branch: BRANCH_NAME` line to the issue body, then reply /answer' > "${CODEX_OUTPUT_FILE}"
            else
              printf '%s\n' "BLOCKED: ai:check-triage issue target branch could not be verified (resolver_status=${resolver_status}); correct the issue's branch metadata, then reply /answer" > "${CODEX_OUTPUT_FILE}"
            fi
            echo "CHECK_TRIAGE_BRANCH_GUARD_BLOCKED=true" >> "$GITHUB_ENV"
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            guard_log "$1" blocked "$2"
          }

          if [ "${guard_enabled}" != "true" ]; then
            guard_log unknown skip disabled
            exit 0
          fi

          if ! labels_json="$(jq -c '[.labels[].name]' "${ISSUE_META_FILE}" 2>/dev/null)" || [ -z "${labels_json}" ]; then
            guard_block unknown labels_unavailable
            exit 0
          fi
          if ! jq -e 'any(.[]; . == "ai:check-triage")' >/dev/null 2>&1 <<<"${labels_json}"; then
            guard_log false pass not_check_triage
            exit 0
          fi
          if [ "${resolver_status}" = "resolved" ]; then
            guard_log true pass metadata_present
            exit 0
          fi
          # A verified PR head from CI-triage routing (exit 3 on any failed
          # check) is not a default-branch fallback, so it passes with its
          # own reason rather than being reported as body metadata.
          if [ "${resolver_status}" = "routed" ]; then
            guard_log true pass pr_head_routed
            exit 0
          fi
          if [ "${resolver_status}" = "none" ]; then
            guard_block true no_target_branch_metadata
          else
            guard_block true target_branch_unverified
          fi

      # Heal #7434 (source shubhodeep1/digital_pa#145): without its own
      # package.json, the claude-pool-token action's CommonJS main.js / post.js
      # load as ES modules in a consumer whose root package.json sets
      # "type": "module", crash on `require`, write no pool, and the planner is
      # refused with reason=no_credential. Since #7432 the action ships
      # package.json, so this step normally logs reason=present; it stays as a
      # fallback for a staged support checkout whose action copy lacks the file.
      # It runs before the write-guard snapshot, so its write is never
      # attributed to the planner.
      - name: Pin claude-pool-token action module type
        if: env.SKIP_PLAN != 'true' && env.CHECK_TRIAGE_BRANCH_GUARD_BLOCKED != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          action_dir=".codex-workflow-src/.github/actions/claude-pool-token"
          pkg="${action_dir}/package.json"
          if [ -L .codex-workflow-src ] || [ -L .codex-workflow-src/.github ] || [ -L .codex-workflow-src/.github/actions ] || [ -L "${action_dir}" ] || [ ! -d "${action_dir}" ]; then
            echo "::notice::CLAUDE_POOL_MODULE_PIN outcome=skip reason=action_dir_unavailable"
            exit 0
          fi
          if [ -e "${pkg}" ] || [ -L "${pkg}" ]; then
            echo "::notice::CLAUDE_POOL_MODULE_PIN outcome=skip reason=present"
            exit 0
          fi
          ( set -C; printf '{"type":"commonjs"}\n' > "${pkg}" ) || { echo "::warning::CLAUDE_POOL_MODULE_PIN outcome=failed reason=write_failed"; exit 0; }
          echo "::notice::CLAUDE_POOL_MODULE_PIN outcome=written"

      - name: Capture pre-Codex plan write-guard snapshot
        if: env.SKIP_PLAN != 'true'
        run: |
          set -euo pipefail
          if ! command -v git >/dev/null 2>&1 || [ ! -d .git ]; then
            : > "${PRE_PLAN_WRITE_GUARD_PATHS_FILE}"
            exit 0
          fi

          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            if [ -e "${path}" ]; then
              path_state="$(sha256sum -- "${path}" 2>/dev/null | awk '{print $1}' || true)"
              [ -n "${path_state}" ] || path_state="__present__"
            else
              path_state="__deleted__"
            fi
            printf '%s\t%s\n' "${path}" "${path_state}"
          done < <(
            {
              # Keep the snapshot limited to repository-visible paths; recursing
              # through .git/** is expensive and can churn independently of repo files.
              git diff --name-only --diff-filter=ACMRD HEAD || true
              git ls-files --others --exclude-standard || true
            } | sed '/^$/d' | LC_ALL=C sort -u
          ) | LC_ALL=C sort -u > "${PRE_PLAN_WRITE_GUARD_PATHS_FILE}"

      # Claude engine (replace-claude-sessions plan Phase 5a): the PLAN role
      # runs on Claude unless the issue's labels, AI_ENGINE_PLAN or AI_ENGINE
      # say codex. The CLI and the pool credential are fetched only when it
      # resolves to Claude; any Claude failure to start falls back to the
      # unchanged codex call in scripts/run_plan_codex.sh (exit 75, plan D1).
      - name: Resolve AI engine
        id: ai_engine
        if: env.SKIP_PLAN != 'true'
        env:
          AI_ENGINE: ${{ vars.AI_ENGINE || '' }}
          AI_ENGINE_PLAN: ${{ vars.AI_ENGINE_PLAN || '' }}
          AI_ENGINE_MODEL_HINT: ${{ env.MODEL_EDITOR }}
          AI_ENGINE_EFFORT_HINT: ${{ env.MODEL_REASONING_EFFORT }}
        run: |
          set -euo pipefail
          engine="codex"
          if [ -f scripts/ai_engine.sh ]; then
            # shellcheck disable=SC1091
            source scripts/ai_engine.sh
            AI_ENGINE_LABELS="$(jq -c '[.labels[]?.name]' "${ISSUE_META_FILE}")"
            export AI_ENGINE_LABELS
            engine="$(ai_engine_for_role PLAN || echo codex)"
          fi
          [ "${engine}" = "claude" ] || engine="codex"
          echo "engine=${engine}" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI
        if: env.SKIP_PLAN != 'true' && env.CHECK_TRIAGE_BRANCH_GUARD_BLOCKED != 'true' && steps.ai_engine.outputs.engine == 'claude'
        continue-on-error: true
        uses: ./.codex-workflow-src/.github/actions/install-claude
        with:
          config_path: .codex-workflow-src/.github/ai/claude_engine.json

      - name: Resolve Claude credential
        if: env.SKIP_PLAN != 'true' && env.CHECK_TRIAGE_BRANCH_GUARD_BLOCKED != 'true' && steps.ai_engine.outputs.engine == 'claude'
        continue-on-error: true
        uses: ./.codex-workflow-src/.github/actions/claude-pool-token
        with:
          config_path: .codex-workflow-src/.github/ai/claude_engine.json

      - name: Run Codex planning
        if: env.SKIP_PLAN != 'true' && env.CHECK_TRIAGE_BRANCH_GUARD_BLOCKED != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOOL_CALL_BUDGET: ${{ vars.TOOL_CALL_BUDGET_PLAN || '40' }}
          PLAN_ENGINE: ${{ steps.ai_engine.outputs.engine || 'codex' }}
          WORKFLOW_HEAL_EVIDENCE_MAX_BYTES: ${{ vars.WORKFLOW_HEAL_EVIDENCE_MAX_BYTES || '' }}
          WORKFLOW_HEAL_EVIDENCE_MAX_RUNS: ${{ vars.WORKFLOW_HEAL_EVIDENCE_MAX_RUNS || '' }}
          HEAL_PLAN_GRANT_BODY_EDIT_FIX_ENABLED: ${{ vars.HEAL_PLAN_GRANT_BODY_EDIT_FIX_ENABLED || '' }}
          PLAN_ISOLATED_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PLAN_ISOLATED_BASE_ENABLED: ${{ vars.PLAN_ISOLATED_BASE_ENABLED || 'true' }}
        run: |
          if ! heal_route="$(python3 scripts/workflow_failure_heal.py heal-route --issue-json "${ISSUE_META_FILE}")"; then
            echo '::error::Heal route classification failed' >&2
            exit 1
          fi
          if [ "${heal_route}" = true ]; then
            echo 'HEAL_ROUTE=true' >> "${GITHUB_ENV}"
            HEAL_ROUTE=true HEAL_EVIDENCE_FILE="${RUNTIME_DIR}/heal_evidence.md" bash scripts/workflow_failure_heal_evidence.sh
            export HEAL_ROUTE=true HEAL_EVIDENCE_FILE="${RUNTIME_DIR}/heal_evidence.md"
          fi
          bash scripts/run_plan_codex.sh

      - name: Enforce plan write guard
        if: env.SKIP_PLAN != 'true'
        run: |
          set -euo pipefail
          if ! command -v git >/dev/null 2>&1 || [ ! -d .git ]; then
            exit 0
          fi

          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            if [ -e "${path}" ]; then
              path_state="$(sha256sum -- "${path}" 2>/dev/null | awk '{print $1}' || true)"
              [ -n "${path_state}" ] || path_state="__present__"
            else
              path_state="__deleted__"
            fi
            printf '%s\t%s\n' "${path}" "${path_state}"
          done < <(
            {
              # Keep the snapshot limited to repository-visible paths; recursing
              # through .git/** is expensive and can churn independently of repo files.
              git diff --name-only --diff-filter=ACMRD HEAD || true
              git ls-files --others --exclude-standard || true
            } | sed '/^$/d' | LC_ALL=C sort -u
          ) | LC_ALL=C sort -u > "${POST_PLAN_WRITE_GUARD_PATHS_FILE}"

          # shellcheck source=/dev/null
          [ -f scripts/write_guard.sh ] || { echo "::error::write_guard.sh not found after fetch"; exit 1; }
          source scripts/write_guard.sh
          PLAN_WRITE_GUARD_FILE="$(mktemp "${TMPDIR:-/tmp}/plan-write-guard.XXXXXX")"

          if [ -f "${PRE_PLAN_WRITE_GUARD_PATHS_FILE}" ] && [ -f "${POST_PLAN_WRITE_GUARD_PATHS_FILE}" ]; then
            {
              LC_ALL=C comm -23 "${PRE_PLAN_WRITE_GUARD_PATHS_FILE}" "${POST_PLAN_WRITE_GUARD_PATHS_FILE}" || true
              LC_ALL=C comm -13 "${PRE_PLAN_WRITE_GUARD_PATHS_FILE}" "${POST_PLAN_WRITE_GUARD_PATHS_FILE}" || true
            } | cut -f1 | sed '/^$/d' | LC_ALL=C sort -u > "${PLAN_WRITE_GUARD_FILE}"
          elif [ -f "${POST_PLAN_WRITE_GUARD_PATHS_FILE}" ]; then
            cut -f1 "${POST_PLAN_WRITE_GUARD_PATHS_FILE}" | sed '/^$/d' | LC_ALL=C sort -u > "${PLAN_WRITE_GUARD_FILE}"
          else
            : > "${PLAN_WRITE_GUARD_FILE}"
          fi

          if ! write_guard_check plan "${PLAN_WRITE_GUARD_FILE}"; then
            rm -f "${PLAN_WRITE_GUARD_FILE}"
            echo "PLAN_FAILURE_CONTEXT=AI Plan write guard blocked repository changes during Codex planning." >> "$GITHUB_ENV"
            echo "::error::Codex modified files outside the plan write-guard policy during planning."
            exit 1
          fi

          rm -f "${PLAN_WRITE_GUARD_FILE}"

      - name: Write run summary
        if: env.SKIP_PLAN != 'true' && always()
        env:
          TOKEN_WARN_THRESHOLD: ${{ vars.TOKEN_WARN_THRESHOLD_PLAN || '200000' }}
        run: |
          set -euo pipefail
          TOKENS=""
          if [ -z "${RUNTIME_DIR:-}" ]; then
            echo "::warning::Write run summary: RUNTIME_DIR is unset (Checkout repository did not run); token usage omitted."
          elif [ -f "${RUNTIME_DIR}/codex_log.txt" ]; then
            TOKENS="$(grep -A1 'tokens used' "${RUNTIME_DIR}/codex_log.txt" | tail -1 | tr -d '[:space:]' || true)"
          fi
          {
            echo "## AI Plan Summary"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Issue | #${ISSUE_NUMBER} |"
            echo "| Model | \`${MODEL_EDITOR}\` |"
            if [ -n "${TOKENS}" ]; then
              echo "| Tokens used | ${TOKENS} |"
              TOKENS_NUM="${TOKENS//,/}"
              if [ "${TOKENS_NUM}" -gt "${TOKEN_WARN_THRESHOLD}" ] 2>/dev/null; then
                echo "| :warning: Token alert | Above ${TOKEN_WARN_THRESHOLD} threshold — review prompt efficiency |"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Parse planning output
        if: env.SKIP_PLAN != 'true'
        id: parse_plan
        run: |
          set -euo pipefail
          if ! grep -q '[^[:space:]]' "${CODEX_OUTPUT_FILE}"; then
            echo "Codex planning output is empty; refusing to continue."
            exit 1
          fi

          CODEX_OUTPUT_PARSE_FILE="${RUNTIME_DIR}/codex_output_parse.txt"
          # Strip only fully closed fenced code blocks before scanning for
          # PLAN_SELF_CHECK / clarification markers so malformed fences do not
          # hide blocker lines or auto-answer question blocks.
          perl -0pe '
            s{(^|\n)([ \t]*((?:```|~~~))[^\n]*\n.*?\n[ \t]*\3[ \t]*(?=\n|$))}{$1}gms;
          ' "${CODEX_OUTPUT_FILE}" > "${CODEX_OUTPUT_PARSE_FILE}" || {
            echo "::error::Failed to sanitize Codex output"
            exit 1
          }
          if [ ! -s "${CODEX_OUTPUT_PARSE_FILE}" ]; then
            echo "::error::Sanitized Codex output parse file missing or empty"
            exit 1
          fi
          echo "CODEX_OUTPUT_PARSE_FILE=${CODEX_OUTPUT_PARSE_FILE}" >> "$GITHUB_ENV"

          # Scan the sanitized parse file so malformed or unclosed fences
          # cannot hide a real BLOCKED line before the clarification/self-check
          # gates run.
          BLOCKED_REASON="$(perl -ne '
            if (/^\s*BLOCKED:\s*(.*\S)\s*$/i) { print $1; exit; }
          ' "${CODEX_OUTPUT_PARSE_FILE}")"

          if [ -n "${BLOCKED_REASON}" ]; then
            BLOCKED_REASON_OUTPUT_DELIM="BLOCKED_REASON_OUTPUT_${GITHUB_RUN_ID:-0}_${GITHUB_RUN_ATTEMPT:-0}_$$"
            BLOCKED_REASON_ENV_DELIM="BLOCKED_REASON_ENV_${GITHUB_RUN_ID:-0}_${GITHUB_RUN_ATTEMPT:-0}_$$"
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            {
              printf 'blocked_reason<<%s\n' "${BLOCKED_REASON_OUTPUT_DELIM}"
              printf '%s\n' "${BLOCKED_REASON}"
              printf '%s\n' "${BLOCKED_REASON_OUTPUT_DELIM}"
            } >> "$GITHUB_OUTPUT"
            echo "needs_clarification=false" >> "$GITHUB_OUTPUT"
            echo "BLOCKED=true" >> "$GITHUB_ENV"
            {
              printf 'BLOCKED_REASON<<%s\n' "${BLOCKED_REASON_ENV_DELIM}"
              printf '%s\n' "${BLOCKED_REASON}"
              printf '%s\n' "${BLOCKED_REASON_ENV_DELIM}"
            } >> "$GITHUB_ENV"
            echo "NEEDS_CLARIFICATION=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "blocked_reason=" >> "$GITHUB_OUTPUT"
          echo "BLOCKED=false" >> "$GITHUB_ENV"
          echo "BLOCKED_REASON=" >> "$GITHUB_ENV"

          PLAN_SELF_CHECK_GATE_ENABLED="false"
          case "$(printf '%s' "${PLAN_SELF_CHECK_ENABLED:-true}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
            1|true|yes|on)
              PLAN_SELF_CHECK_GATE_ENABLED="true"
              ;;
          esac

          SELF_CHECK_PASS_COUNT="$(perl -ne '
            if (/^\s*PLAN_SELF_CHECK:\s*PASS\s*$/i) { $count++; }
            END { print $count + 0; }
          ' "${CODEX_OUTPUT_PARSE_FILE}")"

          SELF_CHECK_WARNING_COUNT="$(perl -ne '
            if (/^\s*PLAN_SELF_CHECK:\s*WARNING:\s*(.*\S)\s*$/i) { $count++; }
            END { print $count + 0; }
          ' "${CODEX_OUTPUT_PARSE_FILE}")"

          SELF_CHECK_BLOCKER_COUNT="$(perl -ne '
            if (/^\s*PLAN_SELF_CHECK:\s*BLOCKER:\s*(.*\S)\s*$/i) { $count++; }
            END { print $count + 0; }
          ' "${CODEX_OUTPUT_PARSE_FILE}")"

          SELF_CHECK_REOPEN_CLARIFICATION="false"
          if [ "${PLAN_SELF_CHECK_GATE_ENABLED}" = "true" ] && [ "${SELF_CHECK_BLOCKER_COUNT}" -gt 0 ]; then
            SELF_CHECK_REOPEN_CLARIFICATION="true"
          fi

          SELF_CHECK_STATE="missing"
          SELF_CHECK_OBSERVATION="none"
          if [ "${SELF_CHECK_BLOCKER_COUNT}" -gt 0 ]; then
            SELF_CHECK_STATE="blocker"
            if [ "${SELF_CHECK_PASS_COUNT}" -gt 0 ] || [ "${SELF_CHECK_WARNING_COUNT}" -gt 0 ]; then
              SELF_CHECK_OBSERVATION="mixed"
            fi
          elif [ "${SELF_CHECK_WARNING_COUNT}" -gt 0 ]; then
            SELF_CHECK_STATE="warning"
            if [ "${SELF_CHECK_PASS_COUNT}" -gt 0 ]; then
              SELF_CHECK_OBSERVATION="mixed"
            fi
          elif [ "${SELF_CHECK_PASS_COUNT}" -eq 1 ]; then
            SELF_CHECK_STATE="pass"
          elif [ "${SELF_CHECK_PASS_COUNT}" -gt 1 ]; then
            SELF_CHECK_STATE="pass"
            SELF_CHECK_OBSERVATION="duplicate-pass"
          fi

          if [ "${SELF_CHECK_STATE}" = "missing" ] && [ "${PLAN_SELF_CHECK_GATE_ENABLED}" = "true" ]; then
            SELF_CHECK_OBSERVATION="missing"
          fi

          echo "plan_self_check_pass_count=${SELF_CHECK_PASS_COUNT}" >> "$GITHUB_OUTPUT"
          echo "plan_self_check_warning_count=${SELF_CHECK_WARNING_COUNT}" >> "$GITHUB_OUTPUT"
          echo "plan_self_check_blocker_count=${SELF_CHECK_BLOCKER_COUNT}" >> "$GITHUB_OUTPUT"
          echo "plan_self_check_state=${SELF_CHECK_STATE}" >> "$GITHUB_OUTPUT"
          echo "plan_self_check_observation=${SELF_CHECK_OBSERVATION}" >> "$GITHUB_OUTPUT"
          echo "plan_self_check_reopen_clarification=${SELF_CHECK_REOPEN_CLARIFICATION}" >> "$GITHUB_OUTPUT"

          HAS_STATUS_NEEDS_CLARIFICATION="false"
          if grep -qiE 'STATUS:.*NEEDS_CLARIFICATION|^\*\*STATUS:\*\*.*NEEDS_CLARIFICATION' "${CODEX_OUTPUT_PARSE_FILE}"; then
            HAS_STATUS_NEEDS_CLARIFICATION="true"
          fi

          HAS_STRUCTURED_CLARIFICATION_BLOCK="false"
          if perl -ne '
            if (/^\s*(?:>\s*)*(?:\*\*)?Q[0-9]+(?:\*\*)?:(?:\*\*)?\s+/i) { $q_line = $.; next; }
            if (defined $q_line && $. - $q_line <= 20 && /^\s*(?:>\s*)*Choices:\s*$/i) { $has_block = 1; }
            if (defined $q_line && $. - $q_line <= 20 && /^\s*(?:>\s*)*(?:[-*]\s*)?(?:\*\*)?[A-Za-z](?:\+[A-Za-z])*(?:\*\*)?\s*(?:—|–|[-)\.:]).*\(RECOMMENDED\)/i) { $has_block = 1; }
            END { exit($has_block ? 0 : 1); }
          ' "${CODEX_OUTPUT_PARSE_FILE}"; then
            HAS_STRUCTURED_CLARIFICATION_BLOCK="true"
          fi

          if [ "${HAS_STATUS_NEEDS_CLARIFICATION}" = "true" ] || [ "${HAS_STRUCTURED_CLARIFICATION_BLOCK}" = "true" ]; then
            echo "needs_clarification=true" >> "$GITHUB_OUTPUT"
            echo "NEEDS_CLARIFICATION=true" >> "$GITHUB_ENV"
          elif [ "${SELF_CHECK_REOPEN_CLARIFICATION}" = "true" ]; then
            # PLAN_SELF_CHECK: BLOCKER with no Q-ID block and no
            # NEEDS_CLARIFICATION status: there is nothing answerable, so
            # reopening clarification cannot converge — the orchestrator
            # auto-answer parser fails with "No Q-ID blocks detected" and
            # stall recovery re-answers into the same blocked plan forever.
            # Route to the blocked path instead (ai:blocked, human paged
            # once, stall recovery skips the issue). Later same-key writes
            # override the blocked=false defaults above in both
            # GITHUB_OUTPUT and GITHUB_ENV.
            SELF_CHECK_BLOCKED_REASON="$(perl -ne '
              if (/^\s*PLAN_SELF_CHECK:\s*BLOCKER:\s*(.*\S)\s*$/i) { print $1; exit; }
            ' "${CODEX_OUTPUT_PARSE_FILE}")"
            if [ -z "${SELF_CHECK_BLOCKED_REASON}" ]; then
              SELF_CHECK_BLOCKED_REASON="plan self-check reported blockers with no answerable clarification questions"
            fi
            SELF_CHECK_BLOCKED_OUTPUT_DELIM="SELF_CHECK_BLOCKED_OUTPUT_${GITHUB_RUN_ID:-0}_${GITHUB_RUN_ATTEMPT:-0}_$$"
            SELF_CHECK_BLOCKED_ENV_DELIM="SELF_CHECK_BLOCKED_ENV_${GITHUB_RUN_ID:-0}_${GITHUB_RUN_ATTEMPT:-0}_$$"
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            {
              printf 'blocked_reason<<%s\n' "${SELF_CHECK_BLOCKED_OUTPUT_DELIM}"
              printf '%s\n' "${SELF_CHECK_BLOCKED_REASON}"
              printf '%s\n' "${SELF_CHECK_BLOCKED_OUTPUT_DELIM}"
            } >> "$GITHUB_OUTPUT"
            echo "BLOCKED=true" >> "$GITHUB_ENV"
            {
              printf 'BLOCKED_REASON<<%s\n' "${SELF_CHECK_BLOCKED_ENV_DELIM}"
              printf '%s\n' "${SELF_CHECK_BLOCKED_REASON}"
              printf '%s\n' "${SELF_CHECK_BLOCKED_ENV_DELIM}"
            } >> "$GITHUB_ENV"
            echo "needs_clarification=false" >> "$GITHUB_OUTPUT"
            echo "NEEDS_CLARIFICATION=false" >> "$GITHUB_ENV"
          else
            echo "needs_clarification=false" >> "$GITHUB_OUTPUT"
            echo "NEEDS_CLARIFICATION=false" >> "$GITHUB_ENV"
          fi

      - name: Handle blocked planning output
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          ALERT_MSG_LEVEL: ${{ env.ALERT_MSG_LEVEL || vars.ALERT_MSG_LEVEL || 'WARNING' }}
          BLOCKED_REASON: ${{ steps.parse_plan.outputs.blocked_reason }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          source scripts/label_helpers.sh
          source scripts/tg_helpers.sh

          if [ -n "${PLAN_PROGRESS_COMMENT_ID:-}" ]; then
            gh_retry gh api -X DELETE "repos/${{ github.repository }}/issues/comments/${PLAN_PROGRESS_COMMENT_ID}" >/dev/null 2>&1 || true
          fi

          ensure_label_exists "ai:blocked" "${{ github.repository }}"
          gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${{ github.repository }}" \
            --add-label 'ai:blocked' \
            --remove-label 'ai:planning' \
            --remove-label 'ai:clarification' \
            --remove-label 'ai:awaiting-approval' >/dev/null 2>&1 || true

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            printf '%s\n' "Planning blocked: human input required."
            printf '\n'
            printf '%s\n' "Reason: ${BLOCKED_REASON}"
            printf '\n'
            printf '%s\n' "Auto-answer has been paused to avoid unsatisfiable clarification loops."
            printf '%s\n' "Provide the required input, then reply with /answer."
            printf '\n'
            printf '%s\n' "Run: ${RUN_URL}"
          } > "${PLAN_COMMENT_FILE}"

          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat "${PLAN_COMMENT_FILE}")" >/dev/null

          MSG="Planning blocked for issue #${ISSUE_NUMBER}: ${BLOCKED_REASON}"
          MSG+=$'\n'
          MSG+="Issue: ${ISSUE_URL}"
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          tg_send_tracked "${ISSUE_NUMBER}" "${MSG}" "CRITICAL"

      - name: Complete /answer command (blocked)
        if: env.SKIP_PLAN != 'true' && env.PROCESSED_ANSWER_CLAIMED == 'true' && steps.parse_plan.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh

          memory_processed_command_complete \
            --issue-number "${ISSUE_NUMBER}" \
            --comment-id "${TRIGGER_COMMENT_ID}" \
            --command "answer" \
            --status "blocked"

          echo "PROCESSED_ANSWER_COMPLETED=true" >> "$GITHUB_ENV"

      - name: Evaluate orchestrator auto-answer eligibility
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.needs_clarification == 'true'
        id: orchestrator_auto_answer_eval
        run: |
          set -euo pipefail

          write_output() {
            local key="$1"
            local value="$2"
            local delim
            delim="EOF_$(date +%s%N)_$RANDOM"
            {
              printf '%s<<%s\n' "$key" "$delim"
              printf '%s\n' "$value"
              printf '%s\n' "$delim"
            } >> "$GITHUB_OUTPUT"
          }

          HAS_ORCHESTRATOR_LABEL="false"
          if jq -e '[.labels[].name] | index("ai:orchestrator-managed") != null' "${ISSUE_META_FILE}" >/dev/null 2>&1; then
            HAS_ORCHESTRATOR_LABEL="true"
          fi

          IS_ORCHESTRATOR_MANAGED="false"
          if [ "${HAS_ORCHESTRATOR_LABEL}" = "true" ] || printf '%s' "${ISSUE_BODY}" | grep -qF 'Managed by: AI Orchestrator'; then
            IS_ORCHESTRATOR_MANAGED="true"
          fi

          write_output "is_orchestrator" "${IS_ORCHESTRATOR_MANAGED}"
          write_output "auto_answer_eligible" "false"
          write_output "auto_answer_parse_failed" "false"
          write_output "auto_answer_failure_reason" ""
          write_output "auto_answer_mapping" ""
          write_output "auto_answer_command" ""

          if [ "${IS_ORCHESTRATOR_MANAGED}" != "true" ]; then
            echo "AI_PHASE_GATE_V1 phase=plan gate=orchestrator_auto_answer reason=not_orchestrator_managed outcome=defer issue=${ISSUE_NUMBER}"
            exit 0
          fi

          PARSE_RESULT_FILE="${RUNTIME_DIR}/orchestrator_auto_answer_parse.txt"
          PARSE_SOURCE_FILE="${CODEX_OUTPUT_PARSE_FILE:-${CODEX_OUTPUT_FILE}}"
          perl - "${PARSE_SOURCE_FILE}" > "${PARSE_RESULT_FILE}" <<'PERL'
          use strict;
          use warnings;

          my ($file) = @ARGV;
          open my $fh, '<', $file or die "Unable to read $file: $!";

          my $current_qid = '';
          my @qid_order;
          my %seen_qid;
          my %recommended_tokens;

          while (my $line = <$fh>) {
            chomp $line;

            if ($line =~ /^\s*(?:>\s*)*(?:\*\*)?\s*(Q[0-9]+)\s*(?:\*\*)?\s*:/i) {
              $current_qid = uc($1);
              if ($seen_qid{$current_qid}) {
                print "status=error\n";
                print "reason=Duplicate Q-ID ${current_qid}\n";
                exit 0;
              }
              $seen_qid{$current_qid} = 1;
              push @qid_order, $current_qid;
              next;
            }

            next if !$current_qid;
            if ($line =~ /^\s*(?:>\s*)*(?:[-*]\s*)?(?:\*\*)?([A-Za-z](?:\+[A-Za-z])*)(?:\*\*)?\s*(?:—|–|[-)\.:]).*\(RECOMMENDED\)/i) {
              push @{ $recommended_tokens{$current_qid} }, uc($1);
            }
          }

          if (!@qid_order) {
            print "status=error\n";
            print "reason=No Q-ID blocks detected\n";
            exit 0;
          }

          for my $qid (@qid_order) {
            my @tokens = @{ $recommended_tokens{$qid} // [] };
            if (scalar(@tokens) == 0) {
              print "status=error\n";
              print "reason=Missing recommended option for ${qid}\n";
              exit 0;
            }
            if (scalar(@tokens) > 1) {
              print "status=error\n";
              print "reason=Multiple recommended options for ${qid}\n";
              exit 0;
            }
            if ($tokens[0] !~ /^[A-Z]$/) {
              print "status=error\n";
              print "reason=Non-single-letter recommended option '${tokens[0]}' for ${qid}\n";
              exit 0;
            }
          }

          my @mapping_tokens;
          my @answer_tokens;
          for my $qid (@qid_order) {
            my $opt = $recommended_tokens{$qid}[0];
            push @mapping_tokens, "${qid}->${opt}";
            push @answer_tokens, "${qid}: ${opt}";
          }

          print "status=ok\n";
          print "mapping=" . join(", ", @mapping_tokens) . "\n";
          print "answer=" . join(", ", @answer_tokens) . "\n";
          PERL

          PARSE_STATUS="$(sed -n 's/^status=//p' "${PARSE_RESULT_FILE}" | head -n1)"
          if [ "${PARSE_STATUS}" != "ok" ]; then
            PARSE_REASON="$(sed -n 's/^reason=//p' "${PARSE_RESULT_FILE}" | head -n1)"
            if [ -z "${PARSE_REASON}" ]; then
              PARSE_REASON="Unable to parse recommended options from clarification output"
            fi
            write_output "auto_answer_parse_failed" "true"
            write_output "auto_answer_failure_reason" "${PARSE_REASON}"
            echo "::notice::Orchestrator auto-answer skipped (run_id=${{ github.run_id }}): ${PARSE_REASON}"
            echo "AI_PHASE_GATE_V1 phase=plan gate=orchestrator_auto_answer reason=parse_failed outcome=defer issue=${ISSUE_NUMBER}"
            exit 0
          fi

          AUTO_ANSWER_MAPPING="$(sed -n 's/^mapping=//p' "${PARSE_RESULT_FILE}" | head -n1)"
          AUTO_ANSWER_PAYLOAD="$(sed -n 's/^answer=//p' "${PARSE_RESULT_FILE}" | head -n1)"

          write_output "auto_answer_eligible" "true"
          write_output "auto_answer_mapping" "${AUTO_ANSWER_MAPPING}"
          write_output "auto_answer_command" "/answer ${AUTO_ANSWER_PAYLOAD} [auto-answered-by-orchestrator]"

          echo "::notice::Orchestrator auto-answer eligible (run_id=${{ github.run_id }}): ${AUTO_ANSWER_MAPPING}"

      - name: Guard plans targeting template-owned paths
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.blocked != 'true' && steps.parse_plan.outputs.needs_clarification != 'true' && !endsWith(github.repository, '/coding-workflows')
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # Template-owned paths are fetched from coding-workflows templates
          # at runtime and excluded from Codex commits in implement.yml.  A
          # plan that targets those paths cannot be committed by the
          # implementation step and would fall through to the no-op handler.
          # Reject such plans here so the issue is routed back to humans with
          # a clear reason rather than producing a silent no-op PR downstream.
          #
          # `prompts/`, `ai-memory/`, `.github/prompts/`, and
          # `.github/scripts/` are blanket-excluded by implement.yml, so every
          # path under them is rejected.
          #
          # `scripts/` is NOT blanket-excluded there.  implement.yml builds
          # per-file exclusions for its runtime-fetched helpers so consumer
          # repos can still commit their own scripts/ files - for example the
          # scripts/run_validation_repo_checks.sh validation entry that
          # scripts/validation_template_bootstrap.py seeds into them.  This
          # guard derives those helper paths, including literal scripts/...
          # FETCHED_MANIFEST entries, from the staged implement.yml workflow
          # itself, then unions them with this job's scripts/.gitignore entries.
          # The tracked Serena template remains consumer-owned, matching
          # implement.yml's ownership check.  Other scripts are not rejected
          # merely because they are untracked consumer files.  That keeps
          # implement-only and plan-only helpers covered without duplicating
          # their lists here.
          # When either source is unavailable or cannot be parsed (bootstrap
          # failure), we fall back to rejecting every scripts/ path, matching
          # implement.yml's own fallback.
          #
          # This guard is skipped entirely when the workflow is running inside
          # the canonical `*/coding-workflows` repository, because in that repo
          # those paths *are* the source of truth and must be editable.
          #
          # We only scan the plan's "Files likely to change" section (and any
          # equivalent "Files to change" heading), not prose, so that a plan
          # which merely *mentions* `scripts/render_prompt.sh` in a verification
          # step does not get rejected as if it were editing it.
          #
          # Within the section we also drop explicitly-negative sublists.
          # Plans routinely close the Files section with a "No changes are
          # expected to:" list naming the files they deliberately leave
          # alone, and those names were being scanned as if they were
          # edit targets.  binance-blessings issue #268 (run 34127286952)
          # planned a one-file `agents.md` restore, listed
          # `scripts/build_static_context.sh` under "No changes are
          # expected to:" as context, and the guard hard-failed the plan
          # phase on a path the plan had just promised not to touch.
          # A standalone lead-in line that opens with a negation AND names
          # a change-ish word starts the suppressed region; it runs through
          # the blank lines, list items, and wrapped continuation lines
          # that belong to that list.  A later "Files ... change" lead-in
          # ends suppression regardless of indentation; otherwise the first
          # unindented non-blank line ends it.  A path mentioned positively first and negated only
          # later in the same line still counts as a target, matching the
          # conservative rejections below.  A bullet-prefixed negative is
          # scanned normally so it cannot hide positive sibling bullets.
          FILES_SECTION_FILE="${RUNTIME_DIR}/files_section.txt"
          perl -ne '
            BEGIN { $in = 0; $neg = 0 }
            if (/^\s{0,3}#{1,6}\s*Files\b[^\n]*\bchange\b/i) { $in = 1; $neg = 0; next; }
            if ($in && /^\s{0,3}#{1,6}\s+\S/) { $in = 0; $neg = 0; }
            next unless $in;
            if (/^\s*(?:\*\*|__)?\s*(?:no|not|none|nothing|unchanged)\b/i
                && /(?:chang|modif|edit|touch|affect|updat)/i) { $neg = 1; next; }
            if ($neg && /^\s*(?:\*\*|__)?\s*Files\b[^\n]*\bchang(?:e|ed|es|ing)\b/i) { $neg = 0; }
            if ($neg) {
              next if /^\s*$/;
              next if /^\s*(?:[-*+]\s|\d+[.)]\s)/;
              next if /^\s{2,}\S/;
              $neg = 0;
            }
            print;
          ' "${CODEX_OUTPUT_FILE}" > "${FILES_SECTION_FILE}"
          EXCLUDED_RE='(^|[^[:alnum:]_./-])`?(\./|/)?(scripts|prompts|ai-memory|\.github)'
          TEMPLATE_PATH_CANDIDATES_FILE="${RUNTIME_DIR}/template_path_candidates.txt"
          TEMPLATE_PATH_BLOCKED_FILE="${RUNTIME_DIR}/template_path_blocked.txt"
          IMPLEMENT_WORKFLOW_SOURCE_FILE=".codex-workflow-src/.github/workflows/implement.yml"
          if [ ! -f "${IMPLEMENT_WORKFLOW_SOURCE_FILE}" ] && [ -f ".codex-workflow-src-main/.github/workflows/implement.yml" ]; then
            IMPLEMENT_WORKFLOW_SOURCE_FILE=".codex-workflow-src-main/.github/workflows/implement.yml"
          fi
          FETCHED_SCRIPTS_IGNORE_FILE="${RUNTIME_DIR}/implementation_fetched_scripts.txt"
          : > "${TEMPLATE_PATH_CANDIDATES_FILE}"
          : > "${TEMPLATE_PATH_BLOCKED_FILE}"
          : > "${FETCHED_SCRIPTS_IGNORE_FILE}"
          if [ -f "${IMPLEMENT_WORKFLOW_SOURCE_FILE}" ] && [ -f scripts/.gitignore ]; then
            if ! PYTHONDONTWRITEBYTECODE=1 python3 - "${IMPLEMENT_WORKFLOW_SOURCE_FILE}" scripts/.gitignore "${FETCHED_SCRIPTS_IGNORE_FILE}" <<'PY'; then
          import re
          import sys
          from pathlib import Path

          workflow_text = Path(sys.argv[1]).read_text()
          stage_marker = "      - name: Stage workflow support files\n"
          if stage_marker not in workflow_text:
              raise ValueError("implement workflow support step not found")
          stage_body = workflow_text.split(stage_marker, 1)[1].split("\n      - name: ", 1)[0]
          implementation_helpers = set()
          loop_pattern = re.compile(
              r"^(?P<indent>[ \t]+)for f in (?P<names>[^;\n]+); do\n"
              r"(?P<body>.*?)(?=^(?P=indent)done\s*$)",
              re.MULTILINE | re.DOTALL,
          )
          for loop_match in loop_pattern.finditer(stage_body):
              if '_fetched_scripts+=("${f}")' in loop_match.group("body"):
                  implementation_helpers.update(loop_match.group("names").split())
          direct_manifest_pattern = re.compile(
              r'^\s*echo\s+"scripts/([^"$]+)"\s*>>\s*"\$\{FETCHED_MANIFEST\}"(?:\s*#[^\n]*)?\s*$',
              re.MULTILINE,
          )
          implementation_helpers.update(direct_manifest_pattern.findall(stage_body))
          if not implementation_helpers:
              raise ValueError("implement workflow helper manifest is empty")
          plan_helpers = {
              entry.strip()
              for entry in Path(sys.argv[2]).read_text().splitlines()
              if entry.strip() and not entry.lstrip().startswith("#")
          }
          Path(sys.argv[3]).write_text("\n".join(sorted(implementation_helpers | plan_helpers)) + "\n")
          PY
              echo "::warning::Unable to derive implement.yml's fetched-helper manifest; falling back to blanket scripts/ rejection."
              : > "${FETCHED_SCRIPTS_IGNORE_FILE}"
            fi
          else
            echo "::warning::Unable to derive fetched-helper manifest: implement.yml source or scripts/.gitignore missing; falling back to blanket scripts/ rejection."
          fi
          if [ -s "${FILES_SECTION_FILE}" ] && grep -qE "${EXCLUDED_RE}" "${FILES_SECTION_FILE}"; then
            perl -ne '
              while (m{(?:^|[^[:alnum:]_./-])`?(?:\./|/)?((?:scripts|prompts|ai-memory|\.github)(?:/[^\s`,;:*)\]]*)?)(?=$|[\s`,;:*)\]\x22\x27\x7d]|[.!?](?=$|[\s`\x22\x27\x7d]))}g) {
                my $candidate = $1;
                $candidate =~ s/[.!?\x22\x27}\]]+$//;
                print "$candidate\n" if length $candidate;
              }
            ' "${FILES_SECTION_FILE}" | sort -u > "${TEMPLATE_PATH_CANDIDATES_FILE}"
          fi
          while IFS= read -r template_path_candidate; do
            [ -n "${template_path_candidate}" ] || continue
            normalized_template_path_candidate="$(PYTHONDONTWRITEBYTECODE=1 python3 -c 'import posixpath, sys; print(posixpath.normpath(sys.argv[1]))' "${template_path_candidate}")"
            # Fail closed when lexical normalization escapes the roots this
            # guard knows how to classify.
            case "${normalized_template_path_candidate}" in
              scripts|scripts/*|prompts|prompts/*|ai-memory|ai-memory/*|.github|.github/*)
                ;;
              *)
                printf '%s\n' "${template_path_candidate}" >> "${TEMPLATE_PATH_BLOCKED_FILE}"
                continue
                ;;
            esac
            case "${normalized_template_path_candidate}" in
              prompts|prompts/*|ai-memory|ai-memory/*)
                printf '%s\n' "${template_path_candidate}" >> "${TEMPLATE_PATH_BLOCKED_FILE}"
                continue
                ;;
              .github/prompts|.github/prompts/*|.github/scripts|.github/scripts/*)
                printf '%s\n' "${template_path_candidate}" >> "${TEMPLATE_PATH_BLOCKED_FILE}"
                continue
                ;;
              .github|.github/*)
                continue
                ;;
            esac
            if [ ! -s "${FETCHED_SCRIPTS_IGNORE_FILE}" ]; then
              printf '%s\n' "${template_path_candidate}" >> "${TEMPLATE_PATH_BLOCKED_FILE}"
              continue
            fi
            fetched_script_name="${normalized_template_path_candidate#scripts/}"
            if [ -z "${fetched_script_name}" ] || [ "${fetched_script_name}" = "${normalized_template_path_candidate}" ]; then
              # A bare `scripts/` reference names no specific file; keep the
              # conservative rejection rather than guessing.
              printf '%s\n' "${template_path_candidate}" >> "${TEMPLATE_PATH_BLOCKED_FILE}"
              continue
            fi
            if [ "${normalized_template_path_candidate}" = "scripts/templates/serena_project.yml.j2" ] && \
               git ls-files --error-unmatch -- "${normalized_template_path_candidate}" >/dev/null 2>&1; then
              continue
            fi
            while IFS= read -r fetched_ignore_entry; do
              case "${fetched_ignore_entry}" in ''|'#'*) continue ;; esac
              if [ "${fetched_script_name}" = "${fetched_ignore_entry}" ]; then
                printf '%s\n' "${template_path_candidate}" >> "${TEMPLATE_PATH_BLOCKED_FILE}"
                break
              fi
            done < "${FETCHED_SCRIPTS_IGNORE_FILE}"
          done < "${TEMPLATE_PATH_CANDIDATES_FILE}"
          if [ -s "${TEMPLATE_PATH_BLOCKED_FILE}" ]; then
            echo "::error::Plan's 'Files likely to change' section lists template-owned paths (runtime-fetched scripts/ helpers, prompts/, ai-memory/, .github/prompts/, .github/scripts/) which are excluded from Codex commits in implement.yml. Changes to those paths belong in the coding-workflows repository."
            echo "Offending paths (from Files section):"
            cat "${TEMPLATE_PATH_BLOCKED_FILE}"
            source scripts/gh_helpers.sh 2>/dev/null || true
            type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
            # Clean up the progress comment so the failure comment (posted by
            # the existing "Comment on issue failure" handler) is the only
            # visible outcome.
            if [ -n "${PLAN_PROGRESS_COMMENT_ID:-}" ]; then
              gh_retry gh api -X DELETE "repos/${{ github.repository }}/issues/comments/${PLAN_PROGRESS_COMMENT_ID}" >/dev/null 2>&1 || true
            fi
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            REJECTION_BODY=$'The generated plan targets template-owned paths - runtime-fetched `scripts/` helpers, `prompts/`, `ai-memory/`, `.github/prompts/`, or `.github/scripts/` - which are fetched from the `coding-workflows` repository at runtime and are excluded from Codex commits in `implement.yml`. Implementing this plan would produce a no-op PR.\n\nConsumer-owned files under `scripts/` are not affected: only helpers derived from the implementation workflow\x27s runtime staging manifest are blocked.\n\nIf a change to those files is genuinely required, open an issue or PR directly against [`shubhodeep1/coding-workflows`](https://github.com/shubhodeep1/coding-workflows) instead.\n\nRun: '"${RUN_URL}"
            gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
              -f body="${REJECTION_BODY}" >/dev/null 2>&1 || true
            exit 1
          fi

      - name: Post clarification questions
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.blocked != 'true' && steps.parse_plan.outputs.needs_clarification == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          IS_ORCHESTRATOR_MANAGED: ${{ steps.orchestrator_auto_answer_eval.outputs.is_orchestrator }}
          AUTO_ANSWER_PARSE_FAILED: ${{ steps.orchestrator_auto_answer_eval.outputs.auto_answer_parse_failed }}
          AUTO_ANSWER_FAILURE_REASON: ${{ steps.orchestrator_auto_answer_eval.outputs.auto_answer_failure_reason }}
          AUTO_ANSWER_ELIGIBLE: ${{ steps.orchestrator_auto_answer_eval.outputs.auto_answer_eligible }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          # Clean up progress comment — real output replaces it
          if [ -n "${PLAN_PROGRESS_COMMENT_ID:-}" ]; then
            gh_retry gh api -X DELETE "repos/${{ github.repository }}/issues/comments/${PLAN_PROGRESS_COMMENT_ID}" >/dev/null 2>&1 || true
          fi
          source scripts/label_helpers.sh
          # Strip absolute CI runner paths from Codex output
          sed -i -E 's|/home/runner/work/[^/]+/[^/]+/||g' "${CODEX_OUTPUT_FILE}"
          ensure_label_exists "ai:clarification" "${{ github.repository }}"
          gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${{ github.repository }}" \
            --add-label 'ai:clarification' --remove-label 'ai:planning' \
            --remove-label 'ai:awaiting-approval' >/dev/null 2>&1 || true

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            if [ "${IS_ORCHESTRATOR_MANAGED}" = 'true' ]; then
              echo "<!-- ai:clarification-questions -->"
              if [ "${AUTO_ANSWER_PARSE_FAILED}" = 'true' ]; then
                echo "Clarification questions (human response required)"
              else
                echo "Clarification questions"
              fi
            else
              echo "Clarification required"
            fi
            echo
            cat "${CODEX_OUTPUT_FILE}"
            if [ "${IS_ORCHESTRATOR_MANAGED}" = 'true' ] && [ "${AUTO_ANSWER_PARSE_FAILED}" = 'true' ]; then
              echo
              echo "Auto-answer parse failure: ${AUTO_ANSWER_FAILURE_REASON}"
              echo "Run: ${RUN_URL}"
              echo "Human /answer is required for this clarification cycle."
            elif [ "${IS_ORCHESTRATOR_MANAGED}" = 'true' ] && [ "${AUTO_ANSWER_ELIGIBLE}" = 'true' ]; then
              echo
              echo "Orchestrator auto-answer will be posted from the recommended options."
            fi
            echo
            echo "Reply with:"
            echo "/answer"
          } > "${PLAN_COMMENT_FILE}"

          CLARIFICATION_COMMENT_LEN="$(wc -c < "${PLAN_COMMENT_FILE}")"
          if [ "${CLARIFICATION_COMMENT_LEN}" -gt 65536 ]; then
            echo "Generated clarification comment too long (${CLARIFICATION_COMMENT_LEN} bytes); refusing to post over GitHub limit."
            exit 1
          fi

          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat "${PLAN_COMMENT_FILE}")"

      - name: Post orchestrator auto-answer
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.needs_clarification == 'true' && steps.orchestrator_auto_answer_eval.outputs.is_orchestrator == 'true' && steps.orchestrator_auto_answer_eval.outputs.auto_answer_eligible == 'true'
        id: post_orchestrator_auto_answer
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          AUTO_ANSWER_COMMAND: ${{ steps.orchestrator_auto_answer_eval.outputs.auto_answer_command }}
          AUTO_ANSWER_MAPPING: ${{ steps.orchestrator_auto_answer_eval.outputs.auto_answer_mapping }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }

          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body="${AUTO_ANSWER_COMMAND}"

          echo "::notice::Posted orchestrator auto-answer (run_id=${{ github.run_id }}): ${AUTO_ANSWER_MAPPING}"
          echo "auto_answer_posted=true" >> "$GITHUB_OUTPUT"

      - name: Record planning candidate (needs clarification)
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.blocked != 'true' && steps.parse_plan.outputs.needs_clarification == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh

          DETAILS="$(head -c 10000 "${PLAN_COMMENT_FILE}")"
          memory_record_candidate \
            --category "task_summaries" \
            --summary "Plan requested re-clarification for issue #${ISSUE_NUMBER}" \
            --details "${DETAILS}" \
            --confidence "0.90" \
            --workflow "plan" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --actor "${{ github.actor }}" \
            --issue-number "${ISSUE_NUMBER}" \
            --source-refs "${ISSUE_URL}"

      - name: Complete /answer command (needs clarification)
        if: env.SKIP_PLAN != 'true' && env.PROCESSED_ANSWER_CLAIMED == 'true' && steps.parse_plan.outputs.blocked != 'true' && steps.parse_plan.outputs.needs_clarification == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh

          memory_processed_command_complete \
            --issue-number "${ISSUE_NUMBER}" \
            --comment-id "${TRIGGER_COMMENT_ID}" \
            --command "answer" \
            --status "needs_clarification"

          echo "PROCESSED_ANSWER_COMPLETED=true" >> "$GITHUB_ENV"

      - name: Telegram clarification notification
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.blocked != 'true' && steps.parse_plan.outputs.needs_clarification == 'true'
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ALERT_MSG_LEVEL: ${{ env.ALERT_MSG_LEVEL || vars.ALERT_MSG_LEVEL || 'WARNING' }}
          IS_ORCHESTRATOR_MANAGED: ${{ steps.orchestrator_auto_answer_eval.outputs.is_orchestrator }}
          AUTO_ANSWER_POSTED: ${{ steps.post_orchestrator_auto_answer.outputs.auto_answer_posted }}
          AUTO_ANSWER_PARSE_FAILED: ${{ steps.orchestrator_auto_answer_eval.outputs.auto_answer_parse_failed }}
          AUTO_ANSWER_FAILURE_REASON: ${{ steps.orchestrator_auto_answer_eval.outputs.auto_answer_failure_reason }}
        run: |
          set -euo pipefail
          source scripts/tg_helpers.sh

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="Plan needs clarification for issue #${ISSUE_NUMBER}"
          MSG+=$'\n'
          MSG+="Issue: ${ISSUE_URL}"
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"

          # Orchestrator-managed issues: send alerts only when human intervention is needed.
          # Non-orchestrator issues: phase tracking (cleaned up when plan is approved).
          if [ "${IS_ORCHESTRATOR_MANAGED}" = 'true' ]; then
            if [ "${AUTO_ANSWER_POSTED:-false}" = 'true' ]; then
              echo "Skipping TG alert for orchestrator-managed issue (auto-answer posted)."
            else
              MSG+=$'\n'
              MSG+="Auto-answer parser failed; the poller's stall ladder auto-answers if no /answer arrives."
              MSG+=$'\n'
              MSG+="Reason: ${AUTO_ANSWER_FAILURE_REASON:-Unknown parse failure}"
              # DEBUG: the stall ladder's auto-answer is the backstop, and its
              # exhausted/escalated outcome pages a human.
              tg_send_tracked "${ISSUE_NUMBER}" "${MSG}" "DEBUG"
            fi
          else
            tg_send_phase_tracked "${ISSUE_NUMBER}" "clarify" "${MSG}" "CRITICAL"
          fi

      - name: Post implementation plan
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.blocked != 'true' && steps.parse_plan.outputs.needs_clarification != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          # Clean up progress comment — real output replaces it
          if [ -n "${PLAN_PROGRESS_COMMENT_ID:-}" ]; then
            gh_retry gh api -X DELETE "repos/${{ github.repository }}/issues/comments/${PLAN_PROGRESS_COMMENT_ID}" >/dev/null 2>&1 || true
          fi
          source scripts/label_helpers.sh
          # Strip absolute CI runner paths from Codex output so comments show clean relative paths
          sed -i -E 's|/home/runner/work/[^/]+/[^/]+/||g' "${CODEX_OUTPUT_FILE}"
          {
            echo "Implementation Plan"
            echo
            cat "${CODEX_OUTPUT_FILE}"
            echo
            echo "To proceed reply:"
            echo
            echo "/approved"
            echo
            echo "To restart clarification reply:"
            echo
            echo "/reclarify"
            echo
            # Automation marker (issue #6630): clarify's intake accepts
            # /reclarify on a later line only in comments without one, so this
            # comment's own /reclarify line never restarts clarification.
            echo "<!-- ai:plan-proposal:v1 -->"
          } > "${PLAN_COMMENT_FILE}"

          PLAN_COMMENT_LEN="$(wc -c < "${PLAN_COMMENT_FILE}")"
          if [ "${PLAN_COMMENT_LEN}" -gt 65536 ]; then
            echo "Generated plan comment too long (${PLAN_COMMENT_LEN} bytes); refusing to post over GitHub limit."
            exit 1
          fi

          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat "${PLAN_COMMENT_FILE}")"

          ensure_label_exists "ai:awaiting-approval" "${{ github.repository }}"
          gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${{ github.repository }}" \
            --add-label 'ai:awaiting-approval' --remove-label 'ai:planning' >/dev/null 2>&1 || true

      - name: Record planning candidate (plan posted)
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.blocked != 'true' && steps.parse_plan.outputs.needs_clarification != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh

          DETAILS="$(head -c 10000 "${PLAN_COMMENT_FILE}")"
          memory_record_candidate \
            --category "task_summaries" \
            --summary "Implementation plan posted for issue #${ISSUE_NUMBER}" \
            --details "${DETAILS}" \
            --confidence "0.90" \
            --workflow "plan" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --actor "${{ github.actor }}" \
            --issue-number "${ISSUE_NUMBER}" \
            --source-refs "${ISSUE_URL}"

      - name: Complete /answer command (plan posted)
        if: env.SKIP_PLAN != 'true' && env.PROCESSED_ANSWER_CLAIMED == 'true' && steps.parse_plan.outputs.blocked != 'true' && steps.parse_plan.outputs.needs_clarification != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh

          memory_processed_command_complete \
            --issue-number "${ISSUE_NUMBER}" \
            --comment-id "${TRIGGER_COMMENT_ID}" \
            --command "answer" \
            --status "completed"

          echo "PROCESSED_ANSWER_COMPLETED=true" >> "$GITHUB_ENV"

      - name: Auto-approve clear plan
        id: auto_approve
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.blocked != 'true' && steps.parse_plan.outputs.needs_clarification != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ALLOW_WORKFLOW_EDITS: ${{ vars.ALLOW_WORKFLOW_EDITS || 'true' }}
          HEAL_PLAN_GRANT_BODY_EDIT_FIX_ENABLED: ${{ vars.HEAL_PLAN_GRANT_BODY_EDIT_FIX_ENABLED || '' }}
          ALERT_MSG_LEVEL: ${{ env.ALERT_MSG_LEVEL || vars.ALERT_MSG_LEVEL || 'WARNING' }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          PLAN_SPLIT_TO_PROJECT_ENABLED: ${{ vars.PLAN_SPLIT_TO_PROJECT_ENABLED || 'true' }}
          # Read as ${PLAN_STEP_REPO} so the run: body carries no expression
          # (tests/test_workflow_file_size_limit.py expression guard).
          PLAN_STEP_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          # Fallback: if gh_helpers.sh failed to source, gh_retry would be
          # undefined and the next call would fail under `set -euo pipefail`.
          # Same pattern used by every other gh_retry caller in this file.
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          type _safe_gh_jq >/dev/null 2>&1 || _safe_gh_jq() {
            local _tmpf
            if ! _tmpf=$(mktemp "${TMPDIR:-/tmp}/_safe_gh_jq.XXXXXX" 2>/dev/null); then
              echo "::error::_safe_gh_jq: failed to create temp file (mktemp failed); aborting without running: $*" >&2
              return 1
            fi
            if gh api "$@" > "${_tmpf}"; then
              cat "${_tmpf}"
              rm -f "${_tmpf}"
              return 0
            fi
            rm -f "${_tmpf}"
            return 1
          }

          echo "auto_approved=false" >> "$GITHUB_OUTPUT"

          # Re-check state and the original author's provenance in the same
          # live response. A closed issue (including smoke cleanup), an
          # untrusted author, or an inconclusive read cannot auto-approve.
          if ! CURRENT_ISSUE_JSON="$(gh_retry _safe_gh_jq "repos/${PLAN_STEP_REPO}/issues/${ISSUE_NUMBER}" 2>/dev/null)"; then
            echo "AI_PHASE_GATE_V1 phase=plan gate=auto_approve reason=issue_lookup_failed outcome=defer issue=${ISSUE_NUMBER}"
            exit 0
          fi
          if ! CURRENT_STATE="$(printf '%s' "${CURRENT_ISSUE_JSON}" | jq -er '.state | select(. == "open" or . == "closed")' 2>/dev/null)"; then
            echo "AI_PHASE_GATE_V1 phase=plan gate=auto_approve reason=issue_state_unknown outcome=defer issue=${ISSUE_NUMBER}"
            exit 0
          fi
          if [ "${CURRENT_STATE}" = "closed" ]; then
            echo "Issue #${ISSUE_NUMBER} is closed; skipping auto-approval comment."
            echo "AI_PHASE_GATE_V1 phase=plan gate=auto_approve reason=issue_closed outcome=defer issue=${ISSUE_NUMBER}"
            exit 0
          fi
          if ! printf '%s' "${CURRENT_ISSUE_JSON}" | jq -e '(.user.type == "User" and (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR"))) or (.user.type == "Bot" and .user.login == "github-actions[bot]")' >/dev/null 2>&1; then
            echo "AI_PHASE_GATE_V1 phase=plan gate=auto_approve reason=untrusted_issue_author outcome=defer issue=${ISSUE_NUMBER}"
            exit 0
          fi

          # Hold reporting for the automation-path plan gate (issue #6769, see
          # below). The gate sets these before calling automation_path_plan_hold.
          AUTOMATION_PATH_GATE_REASON=""
          AUTOMATION_PATH_GATE_DETAIL=""
          AUTOMATION_PATH_GATE_PATHS_FILE=""
          # Records a hold: step output, then one deduplicated marker
          # comment and one WARNING. Comment/alert failures only warn; a hold never
          # turns into an approval.
          automation_path_plan_hold() {
            local paths_json="[]" paths_b64="" path_count=0 comments_json="" duplicate="false" hold_body=""
            paths_json="$(jq -R -s -c 'split("\n") | map(select(length > 0)) | sort | unique' "${AUTOMATION_PATH_GATE_PATHS_FILE}" 2>/dev/null)" || paths_json="[]"
            [ -n "${paths_json}" ] || paths_json="[]"
            path_count="$(printf '%s' "${paths_json}" | jq 'length' 2>/dev/null)" || path_count=0
            paths_b64="$(printf '%s' "${paths_json}" | base64 | tr -d '\n')"
            echo "automation_path_hold=true" >> "$GITHUB_OUTPUT"
            if comments_json="$(gh_retry gh api --paginate "repos/${PLAN_STEP_REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100" 2>/dev/null | jq -s -c 'add // []' 2>/dev/null)"; then
              duplicate="$(printf '%s' "${comments_json}" | jq -r --arg issue "${ISSUE_NUMBER}" --arg reason "${AUTOMATION_PATH_GATE_REASON}" --arg paths "${paths_b64}" '
                def trusted: ((.user.login // "" | test("\\[bot\\]$")) or ((.author_association // "") | IN("OWNER", "MEMBER", "COLLABORATOR")));
                def event_key: [(.created_at // ""), ((.id // .databaseId // 0) | tonumber? // 0)];
                def is_plan: ((.body // "") | test("(^|\n)\\s*implementation\\s+plan\\b"; "i"));
                def hold_marker: ((.body // "") | (capture("<!-- ai:automation-path-plan-hold:v1 issue=(?<issue>[0-9]+) reason=(?<reason>[a-z_]+) source=(?<source>[a-z]+) paths=(?<paths>[A-Za-z0-9+/=]*) -->") // null));
                (map(select(trusted and is_plan)) | max_by(event_key)) as $plan
                | [.[] | select(trusted) | . as $c | hold_marker as $m
                    | select($m != null and $m.issue == $issue and ($plan == null or (($c | event_key) > ($plan | event_key))))
                    | $m]
                | any(.reason == $reason and .paths == $paths)
              ' 2>/dev/null)" || duplicate="false"
            fi
            if [ "${duplicate}" = "true" ]; then
              echo "Automation-path hold already reported for issue #${ISSUE_NUMBER}; not posting another comment."
              return 0
            fi
            if ! hold_body="$(jq -rn --argjson paths "${paths_json}" --arg issue "${ISSUE_NUMBER}" \
              --arg reason "${AUTOMATION_PATH_GATE_REASON}" --arg detail "${AUTOMATION_PATH_GATE_DETAIL}" \
              --arg source "plan" --arg b64 "${paths_b64}" --arg heal "${plan_gate_heal:-false}" '
                ($paths | map(gsub("[^A-Za-z0-9._/*?\\[\\]-]"; ""))) as $safe
                | ([range(0; $paths | length) | ($paths[.] | length) - ($safe[.] | length)] | add // 0) as $dropped
                | [
                    (if $reason == "automation_path_plan_auto_approval_disabled"
                      then "**Automatic approval withheld: the plan lists automation paths, and automatic approval of such plans is off.**"
                      elif ($reason | IN("plan_gate_error", "plan_gate_helper_unavailable", "identity_unavailable", "issue_meta_unavailable", "pipeline_plan_grant_write_failed", "heal_scope_check_unavailable"))
                      then "**Automatic approval withheld: the automation-path grant check could not run.**"
                      elif ($reason | IN("heal_scope_unverified", "heal_scope_plan_out_of_scope", "heal_scope_plan_paths_missing"))
                      then "**Automatic approval withheld: the plan is not inside the verified workflow-heal scope.**"
                      elif $reason == "plan_files_outside_files_touched"
                      then "**Automatic approval withheld: the plan changes files outside the `files_touched` list of this issue, so implementation would refuse the commit.**"
                      else "**Automatic approval withheld: the plan lists automation paths without a trusted exact grant.**" end),
                    "",
                    "Reason: `\($detail | gsub("[^a-z0-9_]"; ""))`",
                    "",
                    (if ($safe | length) > 0 then ($safe[:50] | map("- `" + . + "`") | join("\n")) else "_(no plan paths could be read)_" end),
                    (if ($paths | length) > 50 then "- ... and \(($paths | length) - 50) more" else empty end),
                    (if $dropped > 0 then "_(\($dropped) unsafe character(s) removed for display)_" else empty end),
                    (if $reason != "heal_scope_plan_out_of_scope" and any($paths[]; endswith("/") or test("[*?\\[]")) then "_(A directory entry ending in `/` or a glob entry (`*`, `?`, `[`) cannot be granted through `files_touched`; reply `/approved` instead.)_" else empty end),
                    "",
                    (if $reason == "plan_files_outside_files_touched"
                      then "To proceed, a maintainer either adds these paths to the `files_touched` list in the issue body or asks for a narrower plan, then replies `/approved`. `/approved` alone does not help: the implement-time `files_touched` guard would still refuse these files."
                    elif $reason == "heal_scope_plan_out_of_scope"
                      then "`/approved` alone does not help: implementation copies back and commits only files inside the heal scope marker of this issue (plus its own `agents.d/<issue>-*.md` fragment), so it would refuse these files. To proceed, a maintainer either asks for a plan inside the scope with `/reclarify`, or fixes the defect outside the heal pipeline (an interactive session or an ordinary issue) and closes this one. Do not edit the issue body: the scope of a workflow-heal issue comes from its scope marker, not `files_touched`, and an edit by anyone but the pipeline makes implementation refuse the issue."
                    elif ($heal == "true" or ($reason | startswith("heal_scope_")))
                      then "To proceed, a maintainer reviews the plan and replies `/approved`. Do not edit the issue body: the scope of a workflow-heal issue comes from its scope marker, not `files_touched`, and an edit by anyone but the pipeline makes implementation refuse the issue."
                      else "To proceed, a maintainer reviews the plan and replies `/approved`. When `AUTOMATION_PATH_PLAN_AUTO_APPROVAL_ENABLED` is `true`, a trusted OWNER/MEMBER/COLLABORATOR can instead add these exact paths to the `files_touched` list in the issue body (stall recovery re-checks the grant). The implement commit-time automation-path guard still applies either way." end),
                    "",
                    "<!-- ai:automation-path-plan-hold:v1 issue=\($issue) reason=\($reason) source=\($source) paths=\($b64) -->"
                  ] | join("\n")
              ' 2>/dev/null)"; then
              echo "::warning::Could not render the automation-path hold comment for issue #${ISSUE_NUMBER}."
              return 0
            fi
            if ! gh_retry gh api "repos/${PLAN_STEP_REPO}/issues/${ISSUE_NUMBER}/comments" -f body="${hold_body}" >/dev/null 2>&1; then
              echo "::warning::Could not post the automation-path hold comment for issue #${ISSUE_NUMBER}."
            fi
            if [ -f scripts/tg_helpers.sh ]; then
              # shellcheck disable=SC1091
              source scripts/tg_helpers.sh >/dev/null 2>&1 || true
            fi
            if type tg_send_msg >/dev/null 2>&1; then
              tg_send_msg "Plan auto-approval withheld for issue #${ISSUE_NUMBER}: ${AUTOMATION_PATH_GATE_REASON} (${path_count} path(s))."$'\n'"Issue: ${GITHUB_SERVER_URL:-https://github.com}/${PLAN_STEP_REPO}/issues/${ISSUE_NUMBER}" "WARNING" >/dev/null 2>&1 || true
            fi
            return 0
          }

          normalized_flag="$(printf '%s' "${AUTO_IMPLEMENT_ON_CLEAR_PLAN:-false}" | tr '[:upper:]' '[:lower:]' | xargs)"
          case "${normalized_flag}" in
            1|true|yes|on)
              # Automation-path plan gate (issue #6769). Plans listing
              # .github/, .claude/, scripts/, prompts/ or workflow-templates/
              # paths are held while AUTOMATION_PATH_PLAN_AUTO_APPROVAL_ENABLED
              # is false (it defaults to true); when it is on, every such path needs a trusted, exact
              # issue-body grant. The open pipeline-author grant does not
              # count; instead the pipeline writes an exact grant from the
              # plan (Q108, below). Every error holds. A held plan keeps ai:awaiting-approval
              # for a human /approved; the implement-time guard still applies.
              plan_gate_file="${CODEX_OUTPUT_FILE:-}"
              plan_gate_guard="scripts/files_touched_scope_guard.py"
              plan_gate_login=""
              plan_gate_result=""
              plan_gate_allow_edits="false"
              case "$(printf '%s' "${ALLOW_WORKFLOW_EDITS:-true}" | tr '[:upper:]' '[:lower:]' | xargs)" in
                1|true|yes|on) plan_gate_allow_edits="true" ;;
              esac
              # #7444: never PATCH an ai:workflow-heal body (the preflight refuses an edited
              # one); approve only inside its verified heal scope. Every error holds.
              plan_gate_heal="false"
              case "$(printf '%s' "${HEAL_PLAN_GRANT_BODY_EDIT_FIX_ENABLED:-true}" | tr '[:upper:]' '[:lower:]')" in
                ''|true) printf '%s' "${CURRENT_ISSUE_JSON}" | jq -e 'any(.labels[]?.name; . == "ai:workflow-heal") | not' >/dev/null 2>&1 || plan_gate_heal="true" ;;
                false) ;;
                *) echo "::warning::HEAL_PLAN_GRANT_BODY_EDIT_FIX_ENABLED has invalid value; treating as off" ;;
              esac
              if [ "${plan_gate_heal}" = "true" ]; then
                plan_gate_result='{"reason":"heal_scope_check_unavailable"}'
                plan_gate_heal_repo="${GITHUB_REPOSITORY:-}"
                plan_gate_heal_scope="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/plan_gate_heal_scope.XXXXXX")"
                # §14: REST has no lastEditedAt; one GraphQL read (the preflight's query).
                if plan_gate_login="$(gh_retry gh api user --jq '.login // ""' 2>/dev/null)" && [ -n "${plan_gate_login}" ] \
                  && plan_gate_heal_verified="$(gh_retry gh api graphql -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){issue(number:$number){body lastEditedAt author{login} labels(first:100){nodes{name}}}}}' -f owner="${plan_gate_heal_repo%%/*}" -f repo="${plan_gate_heal_repo#*/}" -F number="${ISSUE_NUMBER}" 2>/dev/null \
                    | jq -c --arg login "${plan_gate_login}" '.data.repository.issue as $i | {body: $i.body, last_edited_at: $i.lastEditedAt, author_login: $i.author.login, labels: [$i.labels.nodes[].name], pipeline_login: $login}' \
                    | PYTHONDONTWRITEBYTECODE=1 python3 -I -B scripts/workflow_failure_heal.py heal-scope verify --input-json /dev/stdin 2>/dev/null)"; then
                  plan_gate_result='{"reason":"heal_scope_unverified"}'
                  if printf '%s' "${plan_gate_heal_verified}" | jq -e '.status == "verified"' >/dev/null 2>&1 \
                    && printf '%s' "${plan_gate_heal_verified}" | jq -r '.paths[]' > "${plan_gate_heal_scope}" 2>/dev/null; then
                    plan_gate_result="$(PYTHONDONTWRITEBYTECODE=1 python3 -I -B "${plan_gate_guard}" --plan-auto-approval-gate --plan-file "${plan_gate_file}" --flag-enabled "${AUTOMATION_PATH_PLAN_AUTO_APPROVAL_ENABLED:-true}" --heal-scope-file "${plan_gate_heal_scope}" --allow-workflow-edits "${plan_gate_allow_edits}" --issue-number "${ISSUE_NUMBER}" 2>/dev/null || true)"
                  fi
                fi
                rm -f "${plan_gate_heal_scope}"
                echo "PIPELINE_PLAN_GRANT issue=${ISSUE_NUMBER} source=plan outcome=skipped reason=heal_issue"
                plan_gate_decision="$(printf '%s' "${plan_gate_result}" | jq -r '.decision // "hold"' 2>/dev/null || echo hold)"
                plan_gate_reason="$(printf '%s' "${plan_gate_result}" | jq -r '.reason // "plan_gate_error"' 2>/dev/null || echo plan_gate_error)"
                plan_gate_paths="$(printf '%s' "${plan_gate_result}" | jq -r '.log_paths // "none"' 2>/dev/null || echo none)"
              elif [ -f "${plan_gate_guard}" ]; then
                plan_gate_meta_file="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/plan_gate_issue.XXXXXX")"
                plan_gate_grant_body_file="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/plan_gate_grant_body.XXXXXX")"
                printf '%s' "${CURRENT_ISSUE_JSON}" > "${plan_gate_meta_file}"
                run_plan_gate() {
                  PYTHONDONTWRITEBYTECODE=1 python3 -I -B "${plan_gate_guard}" --plan-auto-approval-gate \
                    --plan-file "${plan_gate_file}" \
                    --flag-enabled "${AUTOMATION_PATH_PLAN_AUTO_APPROVAL_ENABLED:-true}" \
                    --issue-meta-file "${plan_gate_meta_file}" \
                    --pipeline-login "${plan_gate_login}" \
                    --allow-workflow-edits "${plan_gate_allow_edits}" \
                    --origin-repo "${GITHUB_REPOSITORY:-}" \
                    --pipeline-grant-body-out "${plan_gate_grant_body_file}" \
                    --issue-number "${ISSUE_NUMBER}" 2>/dev/null || true
                }
                plan_gate_result="$(run_plan_gate)"
                # The pipeline login is read only when the flag is on and the
                # plan lists protected paths (the guard then reports
                # identity_unavailable without one).
                if printf '%s' "${plan_gate_result}" | jq -e '.decision == "hold" and .reason == "identity_unavailable"' >/dev/null 2>&1; then
                  plan_gate_login="$(gh_retry gh api user --jq '.login // ""' 2>/dev/null || true)"
                  if [ -n "${plan_gate_login}" ]; then
                    plan_gate_result="$(run_plan_gate)"
                  fi
                fi
                rm -f "${plan_gate_meta_file}"
                plan_gate_decision="$(printf '%s' "${plan_gate_result}" | jq -r '.decision // "hold"' 2>/dev/null || echo hold)"
                plan_gate_reason="$(printf '%s' "${plan_gate_result}" | jq -r '.reason // "plan_gate_error"' 2>/dev/null || echo plan_gate_error)"
                plan_gate_paths="$(printf '%s' "${plan_gate_result}" | jq -r '.log_paths // "none"' 2>/dev/null || echo none)"
                # Q108: a pipeline-authored issue without files_touched is
                # approved only after the guard's exact block (the plan's
                # files plus tests/changelog/agents fragments) is in the issue
                # body; it is then the issue's implement-time scope. A failed
                # write holds.
                if [ "${plan_gate_decision}" = "approve" ] && printf '%s' "${plan_gate_result}" | jq -e '.pipeline_grant_body == true' >/dev/null 2>&1; then
                  if [ -s "${plan_gate_grant_body_file}" ] \
                    && gh_retry gh api -X PATCH "repos/${PLAN_STEP_REPO}/issues/${ISSUE_NUMBER}" -f body="$(cat "${plan_gate_grant_body_file}")" >/dev/null 2>&1; then
                    echo "PIPELINE_PLAN_GRANT issue=${ISSUE_NUMBER} source=plan outcome=written"
                  else
                    echo "PIPELINE_PLAN_GRANT issue=${ISSUE_NUMBER} source=plan outcome=failed reason=issue_body_write_failed"
                    plan_gate_decision="hold"
                    plan_gate_reason="pipeline_plan_grant_write_failed"
                  fi
                fi
                rm -f "${plan_gate_grant_body_file}"
              else
                plan_gate_decision="hold"
                plan_gate_reason="plan_gate_helper_unavailable"
                plan_gate_paths="none"
              fi
              # Reason and paths are sanitized so model-written plan text
              # cannot inject workflow commands or forge gate log lines.
              plan_gate_reason="$(printf '%s' "${plan_gate_reason}" | tr -cd 'a-z_' | cut -c1-80)"
              plan_gate_paths="$(printf '%s' "${plan_gate_paths}" | tr -cd 'A-Za-z0-9._/,-' | cut -c1-4200)"
              # Q151: a plan over the 50-file grant is handed to the
              # orchestrator as a Claude project instead of being held. The
              # script holds (exit 3) whenever it cannot start the project.
              if [ "${plan_gate_decision}" != "approve" ] && [ "${plan_gate_reason}" = "plan_too_large_for_grant" ] && [ -f scripts/plan_split_dispatch.sh ]; then
                plan_split_issue_file="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/plan_split_issue.XXXXXX")"
                printf '%s' "${CURRENT_ISSUE_JSON}" > "${plan_split_issue_file}"
                plan_split_rc=0
                REPO="${PLAN_STEP_REPO}" ISSUE_NUMBER="${ISSUE_NUMBER}" ISSUE_JSON_FILE="${plan_split_issue_file}" \
                  PLAN_FILE="${plan_gate_file}" RUN_URL="${GITHUB_SERVER_URL:-https://github.com}/${PLAN_STEP_REPO}/actions/runs/${GITHUB_RUN_ID:-}" \
                  PLAN_PATH_COUNT="$(printf '%s' "${plan_gate_result}" | jq -r '.plan_path_count // 0' 2>/dev/null || echo 0)" \
                  bash scripts/plan_split_dispatch.sh || plan_split_rc=$?
                rm -f "${plan_split_issue_file}"
                if [ "${plan_split_rc}" -eq 0 ]; then
                  echo "AI_PHASE_GATE_V1 phase=plan gate=auto_approve reason=plan_too_large_for_grant outcome=split issue=${ISSUE_NUMBER}"
                  echo "plan_split=true" >> "$GITHUB_OUTPUT"
                  {
                    echo "### Plan handed to the orchestrator"
                    echo ""
                    echo "The plan lists more files than one pipeline grant covers (50), so it was started as an orchestrator project on the Claude engine. The issue stays open until the project completes."
                  } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                  exit 0
                fi
              fi
              if [ "${plan_gate_decision}" != "approve" ]; then
                echo "AI_PHASE_GATE_V1 phase=plan gate=auto_approve reason=${plan_gate_reason:-plan_gate_error} outcome=defer issue=${ISSUE_NUMBER} paths=${plan_gate_paths:-none}"
                echo "auto_approve_hold_reason=${plan_gate_reason:-plan_gate_error}" >> "$GITHUB_OUTPUT"
                {
                  echo "### Automatic plan approval held"
                  echo ""
                  if [ "${plan_gate_reason:-}" = "plan_files_outside_files_touched" ]; then
                    echo "The plan changes files outside the issue's \`files_touched\` list, so no automatic \`/approved\` was posted (reason \`${plan_gate_reason}\`)."
                    echo "Plan files outside \`files_touched\`: \`${plan_gate_paths:-none}\`"
                    echo "A maintainer adds these paths to the issue's \`files_touched\` list or asks for a narrower plan, then replies \`/approved\`. \`/approved\` alone does not help: the implement-time \`files_touched\` guard would still refuse these files."
                  elif [ "${plan_gate_reason:-}" = "heal_scope_plan_out_of_scope" ]; then
                    echo "The plan changes files outside the verified workflow-heal scope, so no automatic \`/approved\` was posted (reason \`${plan_gate_reason}\`)."
                    echo "Plan files outside the heal scope: \`${plan_gate_paths:-none}\`"
                    echo "\`/approved\` alone does not help: implementation enforces the heal scope marker of this issue. A maintainer asks for a plan inside the scope with \`/reclarify\`, or fixes the defect outside the heal pipeline."
                  else
                    echo "The plan lists automation paths, so no automatic \`/approved\` was posted (reason \`${plan_gate_reason:-plan_gate_error}\`)."
                    echo "Protected paths without an exact grant: \`${plan_gate_paths:-none}\`"
                    echo "A maintainer can review the plan and reply \`/approved\`."
                  fi
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                # One deduplicated hold comment plus a WARNING, so a held plan
                # reaches a human. Failures only warn; a hold never approves.
                AUTOMATION_PATH_GATE_REASON="${plan_gate_reason:-plan_gate_error}"
                AUTOMATION_PATH_GATE_DETAIL="${AUTOMATION_PATH_GATE_REASON}"
                AUTOMATION_PATH_GATE_PATHS_FILE="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/plan_gate_paths.XXXXXX" 2>/dev/null)" || AUTOMATION_PATH_GATE_PATHS_FILE=""
                if [ -n "${AUTOMATION_PATH_GATE_PATHS_FILE}" ]; then
                  printf '%s' "${plan_gate_result}" | jq -r '(if ((.denied_paths // []) | length) > 0 then .denied_paths else (.protected_paths // []) end)[]? | strings' \
                    > "${AUTOMATION_PATH_GATE_PATHS_FILE}" 2>/dev/null || : > "${AUTOMATION_PATH_GATE_PATHS_FILE}"
                else
                  AUTOMATION_PATH_GATE_PATHS_FILE="/dev/null"
                fi
                automation_path_plan_hold || true
                [ "${AUTOMATION_PATH_GATE_PATHS_FILE}" = "/dev/null" ] || rm -f "${AUTOMATION_PATH_GATE_PATHS_FILE}"
                exit 0
              fi
              # Brief pause so the plan comment is fully indexed by GitHub before
              # the auto-approval comment triggers the implement workflow. Without
              # this, the implement workflow may see stale comment state.
              sleep 3
              gh_retry gh api "repos/${PLAN_STEP_REPO}/issues/${ISSUE_NUMBER}/comments" \
                -f body=$'/approved [auto-approved-by-plan]\n\nAuto approval was posted because AUTO_IMPLEMENT_ON_CLEAR_PLAN is enabled.'
              echo "auto_approved=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "AUTO_IMPLEMENT_ON_CLEAR_PLAN disabled; skipping auto-approval comment."
              echo "AI_PHASE_GATE_V1 phase=plan gate=auto_approve reason=auto_implement_disabled outcome=defer issue=${ISSUE_NUMBER}"
              ;;
          esac

      - name: Telegram plan notification
        if: env.SKIP_PLAN != 'true' && steps.parse_plan.outputs.blocked != 'true' && steps.parse_plan.outputs.needs_clarification != 'true' && steps.auto_approve.outputs.auto_approved != 'true' && steps.auto_approve.outputs.plan_split != 'true'
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ALERT_MSG_LEVEL: ${{ env.ALERT_MSG_LEVEL || vars.ALERT_MSG_LEVEL || 'WARNING' }}
        run: |
          set -euo pipefail
          source scripts/tg_helpers.sh

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Orchestrator-managed issues: general tracking (cleaned up at project end).
          # Non-orchestrator issues: phase tracking (cleaned up when implementation starts).
          if printf '%s' "${ISSUE_BODY}" | grep -qF 'Managed by: AI Orchestrator'; then
            MSG="Implementation plan generated for issue #${ISSUE_NUMBER}"
          else
            MSG="Plan awaiting approval for issue #${ISSUE_NUMBER}"
          fi
          MSG+=$'\n'
          MSG+="Issue: ${ISSUE_URL}"
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"

          if printf '%s' "${ISSUE_BODY}" | grep -qF 'Managed by: AI Orchestrator'; then
            tg_send_tracked "${ISSUE_NUMBER}" "${MSG}" "DEBUG"
          else
            tg_send_phase_tracked "${ISSUE_NUMBER}" "plan" "${MSG}" "CRITICAL"
          fi

      - name: Record planning run completed
        if: env.SKIP_PLAN != 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          source scripts/memory_helpers.sh

          memory_record_run_event \
            --run-id "${{ github.run_id }}" \
            --workflow "plan" \
            --event-type "phase_completed" \
            --status "ok" \
            --message "Planning completed for issue #${ISSUE_NUMBER}" \
            --actor "${{ github.actor }}" \
            --issue-number "${ISSUE_NUMBER}" \
            --metadata-json "{\"needs_clarification\": \"${{ steps.parse_plan.outputs.needs_clarification }}\", \"blocked\": \"${{ steps.parse_plan.outputs.blocked }}\"}"

      - name: Complete /answer command (failure/cancel)
        if: (failure() || cancelled()) && env.SKIP_PLAN != 'true' && env.PROCESSED_ANSWER_CLAIMED == 'true' && env.PROCESSED_ANSWER_COMPLETED != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          if [ ! -f scripts/memory_helpers.sh ]; then
            echo "::warning::Complete /answer command (failure/cancel): skipped, scripts/memory_helpers.sh is not staged (Checkout repository did not run)."
            exit 0
          fi
          source scripts/memory_helpers.sh

          STATUS="failed"
          if [ "${{ job.status }}" = "cancelled" ]; then
            STATUS="cancelled"
          fi

          memory_processed_command_complete \
            --issue-number "${ISSUE_NUMBER}" \
            --comment-id "${TRIGGER_COMMENT_ID}" \
            --command "answer" \
            --status "${STATUS}"

          echo "PROCESSED_ANSWER_COMPLETED=true" >> "$GITHUB_ENV"

      - name: Record planning run failed
        if: (failure() || cancelled()) && env.SKIP_PLAN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          if [ ! -f scripts/memory_helpers.sh ]; then
            echo "::warning::Record planning run failed: skipped, scripts/memory_helpers.sh is not staged (Checkout repository did not run)."
            exit 0
          fi
          source scripts/memory_helpers.sh

          STATUS="error"
          MESSAGE="Planning failed for issue #${ISSUE_NUMBER}"
          if [ "${{ job.status }}" = "cancelled" ]; then
            STATUS="cancelled"
            MESSAGE="Planning cancelled for issue #${ISSUE_NUMBER}"
          fi

          memory_record_run_event \
            --run-id "${{ github.run_id }}" \
            --workflow "plan" \
            --event-type "phase_failed" \
            --status "${STATUS}" \
            --message "${MESSAGE}" \
            --actor "${{ github.actor }}" \
            --issue-number "${ISSUE_NUMBER}"

      - name: Clean up progress comment on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          if [ -n "${PLAN_PROGRESS_COMMENT_ID:-}" ]; then
            gh_retry gh api -X DELETE "repos/${{ github.repository }}/issues/comments/${PLAN_PROGRESS_COMMENT_ID}" >/dev/null 2>&1 || true
          fi

      - name: Capture planning failure context
        if: failure() || cancelled()
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = "cancelled" ]; then
            {
              echo "PLAN_FAILURE_CONTEXT=AI Plan phase was cancelled or timed out before posting the implementation plan."
            } >> "$GITHUB_ENV"
          else
            {
              echo "PLAN_FAILURE_CONTEXT=AI Plan phase failed before posting the implementation plan."
            } >> "$GITHUB_ENV"
          fi

      - name: Revert label on planning failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/label_helpers.sh ]; then
            echo "::warning::Revert label on planning failure: skipped, scripts/label_helpers.sh is not staged (Checkout repository did not run)."
            exit 0
          fi
          source scripts/gh_helpers.sh 2>/dev/null || true
          source scripts/label_helpers.sh
          # Reuse the cached issue snapshot from the "Fetch issue
          # metadata" step when available — failure paths can run
          # before that step succeeded, so fall back to a fresh API
          # call on cache-miss OR jq parse failure (under
          # `set -euo pipefail` an unsuppressed jq error would kill
          # the whole step).
          ISSUE_LABELS_JSON=""
          if [ -s "${ISSUE_META_FILE:-}" ]; then
            ISSUE_LABELS_JSON="$(jq -c '[.labels[].name]' "${ISSUE_META_FILE}" 2>/dev/null || true)"
          fi
          if [ -z "${ISSUE_LABELS_JSON}" ]; then
            ISSUE_LABELS_JSON="$(gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}" --jq '[.labels[].name]')"
          fi
          if printf '%s' "${ISSUE_LABELS_JSON}" | jq -e 'index("ai:planning") != null' >/dev/null; then
            ensure_label_exists "ai:clarification" "${{ github.repository }}"
            gh_retry gh issue edit "${ISSUE_NUMBER}" --repo "${{ github.repository }}" \
              --add-label 'ai:clarification' --remove-label 'ai:planning' >/dev/null 2>&1 || true
          fi

      - name: Comment on issue failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED_STEP_HINT="Check the AI Plan run logs and inspect the first failed step."
          PLAN_CANCELLED_SUFFIX=""
          if [ "${{ job.status }}" = "cancelled" ]; then
            PLAN_CANCELLED_SUFFIX=$'\n<!-- ai:plan-cancelled -->'
          fi
          gh_retry gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body=$'AI planning workflow failed.\n\nWorkflow: AI Plan\nIssue: #'"${ISSUE_NUMBER}"$'\nIssue URL: '"${ISSUE_URL}"$'\nContext: '"${PLAN_FAILURE_CONTEXT}"$'\nHint: '"${FAILED_STEP_HINT}"$'\nRun: '"${RUN_URL}${PLAN_CANCELLED_SUFFIX}"

      - name: Telegram failure notification
        if: failure() || cancelled()
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ALERT_MSG_LEVEL: ${{ env.ALERT_MSG_LEVEL || vars.ALERT_MSG_LEVEL || 'WARNING' }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/tg_helpers.sh ]; then
            echo "::warning::Telegram failure notification: skipped, scripts/tg_helpers.sh is not staged (Checkout repository did not run)."
            exit 0
          fi
          source scripts/tg_helpers.sh

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED_STEP_HINT="Check the AI Plan run logs and inspect the first failed step."
          if [ "${{ job.status }}" = "cancelled" ]; then
            MSG="AI planning workflow cancelled/timed out."
          else
            MSG="AI planning workflow failed."
          fi
          MSG+=$'\n'
          MSG+="Context: ${PLAN_FAILURE_CONTEXT}"
          MSG+=$'\n'
          MSG+="Hint: ${FAILED_STEP_HINT}"
          MSG+=$'\n'
          MSG+="Issue: ${ISSUE_URL}"
          MSG+=$'\n'
          MSG+="Run: ${RUN_URL}"
          # DEBUG: the heal-report job and the unblock judge (ai:plan-failed)
          # pick this up and page when a person is needed.
          tg_send_phase_failure plan "${MSG}" "DEBUG" "${ISSUE_NUMBER}"

      - name: Exit safely
        if: failure() || cancelled()
        run: exit 0
      # Plan item 3e (D1): report every refused (non-capacity) Claude fallback
      # recorded by scripts/ai_engine.sh in this job's RUNNER_TEMP as a
      # workflow-failure-heal dispatch plus one Telegram WARNING. Runs only
      # the copy in the trusted support checkout, never a PR-head script.
      - name: Report refused AI engine fallbacks
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          WORKFLOW_HEAL_ENABLED: ${{ vars.WORKFLOW_HEAL_ENABLED || 'true' }}
          REPORT_WORKFLOW_NAME: ${{ github.workflow }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID || '' }}
        run: |
          fallback_support_dir="${GITHUB_WORKSPACE}/.codex-workflow-src"
          fallback_report="${fallback_support_dir}/scripts/ai_engine_fallback_report.sh"
          if [ -n "${fallback_support_dir}" ] && [ -f "${fallback_report}" ] && [ ! -L "${fallback_report}" ]; then
            REPORT_WRAPPER_SHA="$(env -u GIT_DIR -u GIT_WORK_TREE git -C "${fallback_support_dir}" rev-parse HEAD 2>/dev/null || true)" \
              bash "${fallback_report}" || true
          else
            echo "::warning::AI_ENGINE_FALLBACK_REPORT skip reason=support_missing"
          fi

  heal-report:
    # Workflow failure heal (README "Workflow Failure Heal"): report a failed
    # plan run to coding-workflows' heal intake, which diagnoses it and opens
    # an ai:workflow-heal issue for the pipeline to fix. A separate job, so the
    # plan job has finished and the intake reads its complete log. Only a
    # `failure` result is reported: a cancelled run was superseded or timed
    # out. The job is granted only `id-token: write` (every caller wrapper
    # grants it) so the reporter can attach the OIDC report identity the heal
    # intake verifies; GH_PAT does the work. The reporter always exits 0.
    needs: plan
    if: >-
      always() && needs.plan.result == 'failure' &&
      !contains(fromJson('["false"]'), vars.WORKFLOW_HEAL_ENABLED)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      WORKFLOW_HEAL_ENABLED: ${{ vars.WORKFLOW_HEAL_ENABLED || 'true' }}
      WORKFLOW_HEAL_PHASE_FAILURE_STREAK: ${{ vars.WORKFLOW_HEAL_PHASE_FAILURE_STREAK || '1' }}
      WORKFLOW_HEAL_PHASE: plan
      WORKFLOW_HEAL_ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPORT_WORKFLOW_NAME: ${{ github.workflow }}
    steps:
      - name: Resolve workflow support ref
        env:
          SUPPORT_REF_WORKFLOW_JOB_JSON: ${{ toJSON(job) }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            promote_candidate_support_ref="${{ github.sha }}"
            promote_candidate_workflow_ref="$(jq -r '.workflow_ref // ""' <<< "${SUPPORT_REF_WORKFLOW_JOB_JSON:-}" 2>/dev/null || true)"
            # Pipeline runs of this repository pinned to the protected promote-candidate
            # branch (promote cycle, docs/plans/pin-promote-cycle-to-candidate-plan.md)
            # take support code from that branch's tip. A look-alike ref, an unprotected
            # branch or a failed read keep github.sha.
            if [[ "${promote_candidate_workflow_ref}" =~ ^shubhodeep1/coding-workflows/\.github/workflows/plan\.yml@refs/heads/promote-candidate$ ]]; then
              # One branches read, only on this path: no earlier call in this step
              # returns the promote-candidate tip or its protection flag.
              source "${GH_API_RETRY_HELPERS:-/dev/null}" 2>/dev/null || true
              type gh_api_retry >/dev/null 2>&1 || gh_api_retry() { while [ "${1:-}" = --idempotent ] || [ "${1:-}" = --optional ]; do shift; done; gh api "$@"; }
              promote_candidate_json="$(gh_api_retry repos/shubhodeep1/coding-workflows/branches/promote-candidate 2>/dev/null || true)"
              promote_candidate_sha="$(jq -r 'if .protected == true then (.commit.sha // "") else "" end' <<< "${promote_candidate_json}" 2>/dev/null || true)"
              if [[ "${promote_candidate_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                promote_candidate_support_ref="${promote_candidate_sha}"
                echo "SUPPORT_REF source=promote_candidate sha=${promote_candidate_sha}"
              else
                echo "SUPPORT_REF source=promote_candidate_unprotected"
              fi
            fi
            echo "SCRIPT_REF=${promote_candidate_support_ref}" >> "$GITHUB_ENV"
          else
            # A consumer wrapper pins this workflow to a commit (<file>@<sha>);
            # take the support scripts from that same commit, not a newer
            # stable (Q64, as validate.yml in #7123). Tags, branches and any
            # other identity keep stable.
            support_ref_pin="stable"
            support_ref_workflow_ref="$(jq -r '.workflow_ref // ""' <<< "${SUPPORT_REF_WORKFLOW_JOB_JSON:-}" 2>/dev/null || true)"
            if [[ "${support_ref_workflow_ref}" =~ ^shubhodeep1/coding-workflows/\.github/workflows/plan\.yml@[0-9a-f]{40}$ ]]; then
              support_ref_pin="${support_ref_workflow_ref##*@}"
            fi
            echo "SUPPORT_REF ref=${support_ref_pin} workflow_ref=${support_ref_workflow_ref:-unknown}"
            echo "SCRIPT_REF=${support_ref_pin}" >> "$GITHUB_ENV"
          fi

      - name: Checkout workflow support source
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ env.SCRIPT_REF }}
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts

      - name: Report the failed run to workflow failure heal
        run: |
          set -euo pipefail
          reporter=".codex-workflow-src/scripts/workflow_failure_heal_phase_report.sh"
          if [ ! -f "${reporter}" ]; then
            echo "WORKFLOW_HEAL_PHASE_REPORT skip reason=reporter_missing ref=${SCRIPT_REF}"
            exit 0
          fi
          # A pinned support ref must be exactly the commit the caller pinned
          # (tele-funtoken-msg-scoring#4566); never run another ref's reporter.
          if [[ "${SCRIPT_REF}" =~ ^[0-9a-f]{40}$ ]] && [ "$(git -C .codex-workflow-src rev-parse HEAD 2>/dev/null || true)" != "${SCRIPT_REF}" ]; then
            echo "WORKFLOW_HEAL_PHASE_REPORT skip reason=support_ref_mismatch ref=${SCRIPT_REF}"
            exit 0
          fi
          REPORT_WRAPPER_SHA="$(git -C .codex-workflow-src rev-parse HEAD 2>/dev/null || true)" \
            RUNTIME_DIR="${RUNNER_TEMP}/workflow-heal-phase-report" \
            bash "${reporter}"

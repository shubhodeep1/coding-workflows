---
name: Claude Issue Queue Watchdog

# Hourly check that the Claude issue pickup is still draining the queue.
#
# claude-issue-intake.yml queues every standalone issue routed to Claude as
# one `ai:claude-issue-queue` issue in this repo. The Claude issue pickup
# session (.claude/commands/claude-issue-pickup.md) wakes hourly, starts the
# implementation session for each item, and closes it. When an item is still
# open after CLAUDE_ISSUE_QUEUE_STALE_HOURS (repo variable, default 3), the
# pickup has stopped: scripts/claude_issue_queue_watchdog.sh labels the
# item `ai:claude-issue-queue-stale` and sends one Telegram ERROR with the
# restart command. It never starts sessions itself (Actions cannot). A
# second step (issue #4938) re-queues issues whose Claude session stopped on
# an environment failure and closes queue items for closed issues.

"on":
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: claude-issue-queue-watchdog-${{ github.repository }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}

jobs:
  watchdog:
    if: github.repository == 'shubhodeep1/coding-workflows'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # GITHUB_TOKEN: label writes on queue issues do not start workflows.
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      CLAUDE_ISSUE_QUEUE_STALE_HOURS: ${{ vars.CLAUDE_ISSUE_QUEUE_STALE_HOURS || '3' }}
      TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
      TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
      TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      # Issue #4938: re-queue Claude issues whose session stopped on an
      # environment failure (`<!-- ai:claude-blocked:v1 reason=environment-… -->`)
      # through the same `claude-issue` dispatch `/reclarify` sends, at most
      # CLAUDE_ISSUE_ENV_REQUEUE_MAX (2) times per issue per 24h, then one
      # Telegram ERROR. It also closes queue items whose target issue was
      # closed after queueing (#4912), before the stale check below sees them.
      # GH_PAT reads the registered consumer repos and sends the dispatch;
      # queue-item writes use the GITHUB_TOKEN. Fail-open: never blocks the
      # stale check.
      #
      # Issue #5136: the comment scan of a blocked issue resumes across runs
      # from a checkpoint kept in the Actions cache, so flooding an issue past
      # the per-run comment budget delays its decision instead of disabling
      # it. Cache entries are immutable, so each run restores the newest
      # `claude-env-requeue-checkpoint-` entry and saves a new one. A missing
      # or unusable checkpoint restarts the scans from page 1 (fail open).
      - name: Restore the environment re-queue checkpoint
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/claude-env-requeue-checkpoint
          key: claude-env-requeue-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            claude-env-requeue-checkpoint-

      - name: Re-queue Claude issues blocked by an environment failure
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CLAUDE_ISSUE_QUEUE_TOKEN: ${{ github.token }}
          CLAUDE_ISSUE_WATCHDOG_MODE: env-requeue
          CLAUDE_ISSUE_ENV_REQUEUE_CHECKPOINT: ${{ runner.temp }}/claude-env-requeue-checkpoint/checkpoint.json
        run: |
          set -euo pipefail
          RUNTIME_DIR="${RUNNER_TEMP}/claude-issue-env-requeue-${GITHUB_RUN_ID}"
          export RUNTIME_DIR
          bash scripts/claude_issue_queue_watchdog.sh

      - name: Save the environment re-queue checkpoint
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/claude-env-requeue-checkpoint
          key: claude-env-requeue-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Flag queue items nobody picked up
        run: |
          set -euo pipefail
          RUNTIME_DIR="${RUNNER_TEMP}/claude-issue-queue-watchdog-${GITHUB_RUN_ID}"
          export RUNTIME_DIR
          bash scripts/claude_issue_queue_watchdog.sh

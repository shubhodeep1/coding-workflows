name: "Internal: AI Implement"

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/approved')
    uses: ./.github/workflows/implement.yml
    secrets: inherit

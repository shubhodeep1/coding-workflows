---
name: Test & Mark Stable Release

"on":
  workflow_dispatch:
    inputs:
      version_tag:
        description: >
          Semantic version tag (e.g. v1.2.0). Leave blank to auto-increment
          patch from the latest stable release.
        required: false
        type: string
        default: ""
      test_repo:
        description: >
          Repository to run E2E smoke test on (owner/repo).
          Defaults to this repository. The target repo must have
          the internal/consumer workflow wrappers installed.
        required: false
        type: string
        default: ""
      skip_e2e:
        description: Skip E2E test and only mark stable (same as mark-stable.yml)
        required: false
        type: boolean
        default: false
      dry_run:
        description: Validate only — do not push tags or create release
        required: false
        type: boolean
        default: false
      phase_timeout:
        description: >
          Max minutes of *inactivity* before a phase is considered stuck.
          The timer resets whenever progress is detected (label changes,
          new comments, workflow run status updates). This is NOT a
          wall-clock limit — a phase that keeps making progress can run
          longer than this value.
        required: false
        type: number
        default: 30
      review_timeout:
        description: >
          Max minutes of *inactivity* before the review & autofix phase
          is considered stuck. Review naturally runs longer (multiple
          reviewer models + editor), so this has a higher default.
          The timer resets on any detected progress (step transitions,
          new commits, review comments, log output growth).
        required: false
        type: number
        default: 30

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Job 0: Resolve version — auto-increment patch if not provided
  # ──────────────────────────────────────────────────────────────────
  resolve-version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version tag
        id: resolve
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.version_tag }}"

          if [ -n "$INPUT_VERSION" ]; then
            if [[ ! "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Provided version '${INPUT_VERSION}' is invalid; must match vX.Y.Z"
              exit 1
            fi
            echo "Using user-provided version: ${INPUT_VERSION}"
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find the latest vX.Y.Z tag reachable from main
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)

          if [ -z "$LATEST" ]; then
            NEXT="v1.0.0"
            echo "No existing version tags found. Defaulting to ${NEXT}"
          else
            # Parse and increment patch
            MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
            NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "Latest tag: ${LATEST} → next version: ${NEXT}"
          fi

          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────
  # Job 1: End-to-end smoke test — exercises every pipeline phase
  # ──────────────────────────────────────────────────────────────────
  e2e-smoke-test:
    needs: [resolve-version]
    if: ${{ !inputs.skip_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: e2e-smoke-test-${{ inputs.test_repo || github.repository }}
      cancel-in-progress: true
    outputs:
      test_passed: ${{ steps.verify.outputs.passed }}
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      TEST_REPO: ${{ inputs.test_repo || github.repository }}
      PHASE_TIMEOUT: ${{ inputs.phase_timeout || 30 }}
      REVIEW_TIMEOUT: ${{ inputs.review_timeout || inputs.phase_timeout || 30 }}
      POLL_INTERVAL: 10

    steps:
      - name: Validate prerequisites
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GH_PAT secret is required for E2E tests (GITHUB_TOKEN cannot trigger downstream workflows)"
            exit 1
          fi
          echo "Target repo: ${TEST_REPO}"
          echo "Phase timeout: ${PHASE_TIMEOUT} minutes"
          # Verify we can access the repo
          gh api "repos/${TEST_REPO}" --jq '.full_name' \
            || { echo "::error::Cannot access ${TEST_REPO}. Check GH_PAT permissions."; exit 1; }

      # ── Phase 0: Create the test issue ───────────────────────────
      - name: Create E2E test issue
        id: create-issue
        run: |
          set -euo pipefail
          RUN_ID="${GITHUB_RUN_ID}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "created_after=${TIMESTAMP}" >> "$GITHUB_OUTPUT"

          TITLE="[E2E Smoke Test] Update smoke-test canary (run ${RUN_ID})"

          BODY="## Task

          The file \`tests/e2e_smoke_canary.txt\` already exists in the repository. Update its content so it is **exactly** these three lines (no more, no less):

          \`\`\`text
          status: ok
          run_id: ${RUN_ID}
          updated-by: ai-pipeline
          \`\`\`

          ## How to do it

          Overwrite the entire file. For example, the equivalent shell command would be:

          \`\`\`bash
          printf 'status: ok\nrun_id: ${RUN_ID}\nupdated-by: ai-pipeline\n' > tests/e2e_smoke_canary.txt
          \`\`\`

          ## Constraints

          - **Only** modify \`tests/e2e_smoke_canary.txt\` — do not touch any other file.
          - The file already exists — do **not** create any new directories.
          - Replace the file content completely with the three lines above.
          - Do **not** add comments, headers, or any extra content.
          - This is a fully-specified task — **no clarification is needed**."

          # Create the issue and extract number in one call
          ISSUE_NUMBER=$(gh api "repos/${TEST_REPO}/issues" \
            -f title="${TITLE}" \
            -f body="${BODY}" \
            --jq '.number')

          ISSUE_URL=$(gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" --jq '.html_url')

          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Created test issue #${ISSUE_NUMBER}: ${ISSUE_URL}"

      # ── Phase 1: Wait for Clarify → Plan transition ─────────────
      - name: "Phase 1: Wait for clarify to complete"
        id: wait-clarify
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
        run: |
          set -euo pipefail
          echo "Waiting for clarify to finish on issue #${ISSUE_NUMBER}..."
          echo "Inactivity timeout: ${PHASE_TIMEOUT} minutes"
          INACTIVITY_LIMIT=$((PHASE_TIMEOUT * 60))
          LAST_ACTIVITY=$(date +%s)
          PREV_STATE=""
          RATE_LIMIT_BACKOFF=0

          # Rate-limit-aware gh api wrapper — sleeps on 403 rate limit,
          # returns empty string so callers fall back to safe defaults.
          gh_api_safe() {
            local output
            output=$(gh api "$@" 2>/tmp/gh_api_err) && { RATE_LIMIT_BACKOFF=0; echo "$output"; return 0; }
            if grep -qi "rate limit" /tmp/gh_api_err 2>/dev/null || echo "$output" | grep -qi "rate limit"; then
              if [ "$RATE_LIMIT_BACKOFF" -eq 0 ]; then RATE_LIMIT_BACKOFF=30
              elif [ "$RATE_LIMIT_BACKOFF" -lt 120 ]; then RATE_LIMIT_BACKOFF=$((RATE_LIMIT_BACKOFF * 2)); fi
              echo "  ⏳ Rate limited — backing off ${RATE_LIMIT_BACKOFF}s" >&2
              sleep "$RATE_LIMIT_BACKOFF"
              echo ""; return 1
            fi
            cat /tmp/gh_api_err >&2 2>/dev/null || true
            echo ""; return 1
          }

          # Robust workflow run-ID capture — retries on empty results to ride out
          # the brief race window where the matching run isn't yet indexed by the
          # API, and widens pagination to per_page=100 in case of high concurrent
          # workflow run volume on the target repo. Returns the run id on stdout
          # (empty string if all attempts fail).
          capture_run_id() {
            local name_re="$1"
            local result=""
            local _attempt
            for _attempt in 1 2 3 4 5; do
              result=$(gh_api_safe "repos/${TEST_REPO}/actions/runs?per_page=100&created=>${{ steps.create-issue.outputs.created_after }}" \
                --jq "[.workflow_runs[] | select(.name | test(\"${name_re}\"; \"i\")) | select(.conclusion != \"skipped\")] | sort_by(.created_at) | last | .id // empty" || echo "")
              if [ -n "$result" ] && [ "$result" != "null" ]; then
                printf '%s' "$result"
                return 0
              fi
              sleep 2
            done
            printf ''
            return 0
          }

          while true; do
            NOW=$(date +%s)
            IDLE=$((NOW - LAST_ACTIVITY))

            LABELS=$(gh_api_safe "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" \
              --jq '[.labels[].name] | join(",")' || echo "")

            # If rate-limited, skip this cycle (don't corrupt state)
            if [ "$RATE_LIMIT_BACKOFF" -gt 0 ] && [ -z "$LABELS" ]; then
              continue
            fi

            COMMENT_COUNT=$(gh_api_safe "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/comments" \
              --jq 'length' || echo "0")

            CUR_STATE="labels=${LABELS};comments=${COMMENT_COUNT}"

            # Reset inactivity timer on any state change
            if [ "$CUR_STATE" != "$PREV_STATE" ]; then
              if [ -n "$PREV_STATE" ]; then
                echo "  ↻ Activity detected (state changed) — resetting inactivity timer"
              fi
              LAST_ACTIVITY=$NOW
              IDLE=0
              PREV_STATE="$CUR_STATE"
            fi

            # Clarify succeeded if we see planning or awaiting-approval
            if echo "$LABELS" | grep -qE 'ai:planning|ai:awaiting-approval'; then
              echo "✓ Clarify phase completed — issue moved to planning"
              CLARIFY_RUN_ID=$(capture_run_id "Clarif")
              echo "run_id=${CLARIFY_RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Check for failure: look for error comments from bot
            LAST_BOT_COMMENT=$(gh_api_safe "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/comments?per_page=5&direction=desc" \
              --jq '[.[] | select(.user.login == "github-actions[bot]")] | .[0].body // ""' || echo "")
            if echo "$LAST_BOT_COMMENT" | grep -qi "failed\|error\|clarification.*needed"; then
              if echo "$LAST_BOT_COMMENT" | grep -qi "clarification.*needed\|NEEDS_CLARIFICATION"; then
                echo "::error::Clarify phase requested human clarification — test issue may not be clear enough"
                echo "status=clarification_needed" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi

            # Inactivity timeout
            if [ $IDLE -ge $INACTIVITY_LIMIT ]; then
              echo "::error::Clarify phase stalled — no activity for ${PHASE_TIMEOUT} minutes"
              echo "status=timeout" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            REMAINING=$(( (INACTIVITY_LIMIT - IDLE + 59) / 60 ))
            echo "  ... idle ${IDLE}s (timeout in ~${REMAINING}m) — labels: ${LABELS:-none}"
            sleep "$POLL_INTERVAL"
          done

      # ── Phase 2: Wait for Plan to complete ──────────────────────
      - name: "Phase 2: Wait for plan to complete"
        id: wait-plan
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
        run: |
          set -euo pipefail
          echo "Waiting for plan to finish on issue #${ISSUE_NUMBER}..."
          echo "Inactivity timeout: ${PHASE_TIMEOUT} minutes"
          INACTIVITY_LIMIT=$((PHASE_TIMEOUT * 60))
          LAST_ACTIVITY=$(date +%s)
          PREV_STATE=""
          RATE_LIMIT_BACKOFF=0

          gh_api_safe() {
            local output
            output=$(gh api "$@" 2>/tmp/gh_api_err) && { RATE_LIMIT_BACKOFF=0; echo "$output"; return 0; }
            if grep -qi "rate limit" /tmp/gh_api_err 2>/dev/null || echo "$output" | grep -qi "rate limit"; then
              if [ "$RATE_LIMIT_BACKOFF" -eq 0 ]; then RATE_LIMIT_BACKOFF=30
              elif [ "$RATE_LIMIT_BACKOFF" -lt 120 ]; then RATE_LIMIT_BACKOFF=$((RATE_LIMIT_BACKOFF * 2)); fi
              echo "  ⏳ Rate limited — backing off ${RATE_LIMIT_BACKOFF}s" >&2
              sleep "$RATE_LIMIT_BACKOFF"
              echo ""; return 1
            fi
            cat /tmp/gh_api_err >&2 2>/dev/null || true
            echo ""; return 1
          }

          # Robust workflow run-ID capture — retries on empty results to ride out
          # the brief race window where the matching run isn't yet indexed by the
          # API, and widens pagination to per_page=100 in case of high concurrent
          # workflow run volume on the target repo. Returns the run id on stdout
          # (empty string if all attempts fail).
          capture_run_id() {
            local name_re="$1"
            local result=""
            local _attempt
            for _attempt in 1 2 3 4 5; do
              result=$(gh_api_safe "repos/${TEST_REPO}/actions/runs?per_page=100&created=>${{ steps.create-issue.outputs.created_after }}" \
                --jq "[.workflow_runs[] | select(.name | test(\"${name_re}\"; \"i\")) | select(.conclusion != \"skipped\")] | sort_by(.created_at) | last | .id // empty" || echo "")
              if [ -n "$result" ] && [ "$result" != "null" ]; then
                printf '%s' "$result"
                return 0
              fi
              sleep 2
            done
            printf ''
            return 0
          }

          while true; do
            NOW=$(date +%s)
            IDLE=$((NOW - LAST_ACTIVITY))

            LABELS=$(gh_api_safe "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" \
              --jq '[.labels[].name] | join(",")' || echo "")

            # If rate-limited, skip this cycle (don't corrupt state)
            if [ "$RATE_LIMIT_BACKOFF" -gt 0 ] && [ -z "$LABELS" ]; then
              continue
            fi

            COMMENTS_JSON=$(gh_api_safe "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100&direction=desc" || echo "[]")
            COMMENT_COUNT=$(echo "${COMMENTS_JSON}" | jq 'length' 2>/dev/null || echo "0")
            # Track latest comment updated_at so progress comment edits reset the timer
            LATEST_COMMENT_UPDATED=$(echo "${COMMENTS_JSON}" | jq -r '[.[].updated_at] | sort | last // ""' 2>/dev/null || echo "")

            # Also check the plan workflow run status as an activity signal
            PLAN_RUN_STATUS=$(gh_api_safe "repos/${TEST_REPO}/actions/runs?per_page=50&created=>${{ steps.create-issue.outputs.created_after }}" \
              --jq '[.workflow_runs[] | select(.name | test("Plan"; "i")) | select(.conclusion != "skipped")] | sort_by(.created_at) | last | .status // "unknown"' || echo "unknown")

            CUR_STATE="labels=${LABELS};comments=${COMMENT_COUNT};comment_updated=${LATEST_COMMENT_UPDATED};plan_run=${PLAN_RUN_STATUS}"

            # Reset inactivity timer on any state change
            if [ "$CUR_STATE" != "$PREV_STATE" ]; then
              if [ -n "$PREV_STATE" ]; then
                echo "  ↻ Activity detected (state changed) — resetting inactivity timer"
              fi
              LAST_ACTIVITY=$NOW
              IDLE=0
              PREV_STATE="$CUR_STATE"
            fi

            if echo "$LABELS" | grep -q 'ai:awaiting-approval'; then
              echo "✓ Plan phase completed — awaiting approval"
              PLAN_RUN_ID=$(capture_run_id "Plan")
              echo "run_id=${PLAN_RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Check for auto-approved (if AUTO_IMPLEMENT_ON_CLEAR_PLAN is on)
            if echo "$LABELS" | grep -q 'ai:implementing'; then
              echo "✓ Plan phase completed with auto-approval — already implementing"
              PLAN_RUN_ID=$(capture_run_id "Plan")
              echo "run_id=${PLAN_RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "status=auto_approved" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Detect plan workflow failure (completed but no expected label)
            if [ "$PLAN_RUN_STATUS" = "completed" ]; then
              # Plan finished but didn't produce awaiting-approval or implementing
              # Give one more cycle in case labels are delayed
              sleep "$POLL_INTERVAL"
              LABELS_RECHECK=$(gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" \
                --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
              if echo "$LABELS_RECHECK" | grep -qE 'ai:awaiting-approval|ai:implementing'; then
                continue
              fi
              # Check if other Plan runs are still queued or in-progress.
              # The "completed" run may be a spurious trigger (e.g. non-/answer
              # comment that caused the job to be skipped) while the real Plan
              # run is still working.
              OTHER_ACTIVE_PLAN_RUNS=$(gh api "repos/${TEST_REPO}/actions/runs?per_page=50&created=>${{ steps.create-issue.outputs.created_after }}" \
                --jq '[.workflow_runs[] | select(.name | test("Plan"; "i")) | select(.status == "in_progress" or .status == "queued")] | length' 2>/dev/null || echo "0")
              if [ "$OTHER_ACTIVE_PLAN_RUNS" -gt 0 ]; then
                echo "  ⏳ Found ${OTHER_ACTIVE_PLAN_RUNS} other active Plan run(s) — waiting for the real run to finish"
                continue
              fi
              echo "::error::Plan workflow completed but issue lacks expected labels (current: ${LABELS_RECHECK:-none})"
              echo "status=plan_failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            # Inactivity timeout
            if [ $IDLE -ge $INACTIVITY_LIMIT ]; then
              echo "::error::Plan phase stalled — no activity for ${PHASE_TIMEOUT} minutes"
              echo "status=timeout" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            REMAINING=$(( (INACTIVITY_LIMIT - IDLE + 59) / 60 ))
            echo "  ... idle ${IDLE}s (timeout in ~${REMAINING}m) — plan_run: ${PLAN_RUN_STATUS}, labels: ${LABELS:-none}"
            sleep "$POLL_INTERVAL"
          done

      # ── Phase 3: Approve and wait for implementation ────────────
      - name: "Phase 3a: Approve the plan"
        id: approve
        if: steps.wait-plan.outputs.status == 'success'
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
        run: |
          set -euo pipefail
          echo "Posting /approved on issue #${ISSUE_NUMBER}..."
          gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/comments" \
            -f body="/approved

          E2E smoke test auto-approval (run ${GITHUB_RUN_ID})."
          echo "✓ Posted /approved comment"

      - name: "Phase 3b: Wait for PR creation (implement phase)"
        id: wait-implement
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
        run: |
          set -euo pipefail
          echo "Waiting for implementation PR on issue #${ISSUE_NUMBER}..."
          echo "Inactivity timeout: ${PHASE_TIMEOUT} minutes"
          INACTIVITY_LIMIT=$((PHASE_TIMEOUT * 60))
          LAST_ACTIVITY=$(date +%s)
          PREV_STATE=""
          RATE_LIMIT_BACKOFF=0

          gh_api_safe() {
            local output
            output=$(gh api "$@" 2>/tmp/gh_api_err) && { RATE_LIMIT_BACKOFF=0; echo "$output"; return 0; }
            if grep -qi "rate limit" /tmp/gh_api_err 2>/dev/null || echo "$output" | grep -qi "rate limit"; then
              if [ "$RATE_LIMIT_BACKOFF" -eq 0 ]; then RATE_LIMIT_BACKOFF=30
              elif [ "$RATE_LIMIT_BACKOFF" -lt 120 ]; then RATE_LIMIT_BACKOFF=$((RATE_LIMIT_BACKOFF * 2)); fi
              echo "  ⏳ Rate limited — backing off ${RATE_LIMIT_BACKOFF}s" >&2
              sleep "$RATE_LIMIT_BACKOFF"
              echo ""; return 1
            fi
            cat /tmp/gh_api_err >&2 2>/dev/null || true
            echo ""; return 1
          }

          # Robust workflow run-ID capture — retries on empty results to ride out
          # the brief race window where the matching run isn't yet indexed by the
          # API, and widens pagination to per_page=100 in case of high concurrent
          # workflow run volume on the target repo. Returns the run id on stdout
          # (empty string if all attempts fail).
          capture_run_id() {
            local name_re="$1"
            local result=""
            local _attempt
            for _attempt in 1 2 3 4 5; do
              result=$(gh_api_safe "repos/${TEST_REPO}/actions/runs?per_page=100&created=>${{ steps.create-issue.outputs.created_after }}" \
                --jq "[.workflow_runs[] | select(.name | test(\"${name_re}\"; \"i\")) | select(.conclusion != \"skipped\")] | sort_by(.created_at) | last | .id // empty" || echo "")
              if [ -n "$result" ] && [ "$result" != "null" ]; then
                printf '%s' "$result"
                return 0
              fi
              sleep 2
            done
            printf ''
            return 0
          }

          while true; do
            NOW=$(date +%s)
            IDLE=$((NOW - LAST_ACTIVITY))

            # Search for PRs that reference this issue
            # The implement workflow creates branch ai/issue-<N>
            PR_NUMBER=$(gh_api_safe "repos/${TEST_REPO}/pulls?state=open&head=${TEST_REPO%%/*}:ai/issue-${ISSUE_NUMBER}&per_page=1" \
              --jq '.[0].number // empty' || echo "")

            # If rate-limited, skip this cycle (don't corrupt state)
            if [ "$RATE_LIMIT_BACKOFF" -gt 0 ] && [ -z "$PR_NUMBER" ]; then
              sleep "$POLL_INTERVAL"
              continue
            fi

            if [ -n "$PR_NUMBER" ]; then
              echo "✓ Implementation PR #${PR_NUMBER} created"
              IMPL_RUN_ID=$(capture_run_id "Implement")
              echo "run_id=${IMPL_RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Track labels and implement workflow run status for activity detection
            LABELS=$(gh_api_safe "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" \
              --jq '[.labels[].name] | join(",")' || echo "")

            # Fetch all implement runs once and extract metrics from the response
            IMPL_RUNS_JSON=$(gh_api_safe "repos/${TEST_REPO}/actions/runs?per_page=50&created=>${{ steps.create-issue.outputs.created_after }}" || echo "")
            if [ -n "$IMPL_RUNS_JSON" ]; then
              IMPL_RUN_TOTAL=$(echo "$IMPL_RUNS_JSON" | jq '[.workflow_runs[] | select(.name | test("Implement"; "i")) | select(.conclusion != "skipped")] | length' 2>/dev/null || echo "0")
              IMPL_RUN_IN_PROGRESS=$(echo "$IMPL_RUNS_JSON" | jq '[.workflow_runs[] | select(.name | test("Implement"; "i")) | select(.conclusion != "skipped") | select(.status != "completed")] | length' 2>/dev/null || echo "0")
              IMPL_RUN_STATUS=$(echo "$IMPL_RUNS_JSON" | jq -r '[.workflow_runs[] | select(.name | test("Implement"; "i")) | select(.conclusion != "skipped")] | sort_by(.created_at) | last | .status // "unknown"' 2>/dev/null || echo "unknown")
              IMPL_RUN_ID_LATEST=$(echo "$IMPL_RUNS_JSON" | jq -r '[.workflow_runs[] | select(.name | test("Implement"; "i")) | select(.conclusion != "skipped")] | sort_by(.created_at) | last | .id // empty' 2>/dev/null || echo "")
            else
              IMPL_RUN_TOTAL="0"; IMPL_RUN_IN_PROGRESS="0"; IMPL_RUN_STATUS="unknown"; IMPL_RUN_ID_LATEST=""
            fi

            # ── Adaptive signals: step name + commit count ──
            IMPL_STEP_NAME=""
            if [ -n "$IMPL_RUN_ID_LATEST" ]; then
              IMPL_STEP_NAME=$(gh_api_safe "repos/${TEST_REPO}/actions/runs/${IMPL_RUN_ID_LATEST}/jobs?per_page=10" \
                --jq '[.jobs[].steps[] | select(.status == "in_progress")] | last | .name // ""' || echo "")
            fi

            IMPL_BRANCH="ai/issue-${ISSUE_NUMBER}"
            COMMIT_COUNT=$(gh_api_safe "repos/${TEST_REPO}/commits?sha=${IMPL_BRANCH}&per_page=1" \
              --jq '.[0].sha // ""' || echo "")

            CUR_STATE="labels=${LABELS};impl_run=${IMPL_RUN_STATUS};total=${IMPL_RUN_TOTAL};active=${IMPL_RUN_IN_PROGRESS};step=${IMPL_STEP_NAME};head=${COMMIT_COUNT}"

            # Reset inactivity timer on any state change
            if [ "$CUR_STATE" != "$PREV_STATE" ]; then
              if [ -n "$PREV_STATE" ]; then
                echo "  ↻ Activity detected (state changed) — resetting inactivity timer"
              fi
              LAST_ACTIVITY=$NOW
              IDLE=0
              PREV_STATE="$CUR_STATE"
            fi

            # Detect implement workflow failure — only if ALL runs have completed
            if [ "$IMPL_RUN_TOTAL" -gt 0 ] && [ "$IMPL_RUN_IN_PROGRESS" -eq 0 ]; then
              # All implement runs finished but no PR appeared — give one more cycle
              sleep "$POLL_INTERVAL"
              PR_RECHECK=$(gh api "repos/${TEST_REPO}/pulls?state=open&head=${TEST_REPO%%/*}:ai/issue-${ISSUE_NUMBER}&per_page=1" \
                --jq '.[0].number // empty' 2>/dev/null || echo "")
              if [ -n "$PR_RECHECK" ]; then
                continue
              fi
              echo "::error::All ${IMPL_RUN_TOTAL} implement workflow run(s) completed but no PR was created"
              echo "status=implement_failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            # Inactivity timeout
            if [ $IDLE -ge $INACTIVITY_LIMIT ]; then
              echo "::error::Implement phase stalled — no activity for ${PHASE_TIMEOUT} minutes"
              echo "status=timeout" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            REMAINING=$(( (INACTIVITY_LIMIT - IDLE + 59) / 60 ))
            echo "  ... idle ${IDLE}s (timeout in ~${REMAINING}m) — impl_runs: ${IMPL_RUN_TOTAL} total, ${IMPL_RUN_IN_PROGRESS} active, latest: ${IMPL_RUN_STATUS}, labels: ${LABELS:-none}"
            sleep "$POLL_INTERVAL"
          done

      # ── Phase 4: Wait for review/edit to complete ───────────────
      - name: "Phase 4: Wait for review & autofix to complete"
        id: wait-review
        env:
          PR_NUMBER: ${{ steps.wait-implement.outputs.pr_number }}
        run: |
          set -euo pipefail
          echo "Waiting for review workflow on PR #${PR_NUMBER}..."
          echo "Inactivity timeout: ${REVIEW_TIMEOUT} minutes"
          INACTIVITY_LIMIT=$((REVIEW_TIMEOUT * 60))
          LAST_ACTIVITY=$(date +%s)
          PREV_STATE=""
          ELAPSED=0
          RATE_LIMIT_BACKOFF=0

          # ── Rate-limit-aware gh api wrapper ──
          # Runs gh api; on 403 rate-limit, sleeps with backoff and
          # returns empty string so callers get safe fallback values.
          gh_api_safe() {
            local output http_code
            # Capture both stdout and the HTTP status code
            output=$(gh api "$@" 2>/tmp/gh_api_err) && { RATE_LIMIT_BACKOFF=0; echo "$output"; return 0; }
            # Check if the error is a rate limit (403 with "rate limit" in body)
            if grep -qi "rate limit" /tmp/gh_api_err 2>/dev/null || echo "$output" | grep -qi "rate limit"; then
              if [ "$RATE_LIMIT_BACKOFF" -eq 0 ]; then
                RATE_LIMIT_BACKOFF=30
              elif [ "$RATE_LIMIT_BACKOFF" -lt 120 ]; then
                RATE_LIMIT_BACKOFF=$((RATE_LIMIT_BACKOFF * 2))
              fi
              echo "  ⏳ Rate limited — backing off ${RATE_LIMIT_BACKOFF}s" >&2
              sleep "$RATE_LIMIT_BACKOFF"
              echo ""
              return 1
            fi
            # Non-rate-limit error — return empty, let caller use fallback
            echo ""
            return 1
          }

          # Give the review workflow a moment to start
          sleep 5

          while true; do
            NOW=$(date +%s)
            IDLE=$((NOW - LAST_ACTIVITY))

            # Find the review workflow run for this PR's head branch
            PR_BRANCH="ai/issue-${{ steps.create-issue.outputs.issue_number }}"

            # Look for workflow runs on this branch
            REVIEW_RUN=$(gh_api_safe "repos/${TEST_REPO}/actions/runs?branch=${PR_BRANCH}&event=pull_request&per_page=5" \
              --jq '[.workflow_runs[] | select(.name | test("Review|review|autofix"; "i"))] | sort_by(.created_at) | last' || echo "")

            # If rate-limited, skip this cycle entirely (don't corrupt state)
            if [ "$RATE_LIMIT_BACKOFF" -gt 0 ] && [ -z "$REVIEW_RUN" ]; then
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
              continue
            fi

            RUN_STATUS="none"
            RUN_CONCLUSION="null"
            RUN_ID="unknown"
            FAILED_STEPS="0"

            if [ -n "$REVIEW_RUN" ] && [ "$REVIEW_RUN" != "null" ]; then
              RUN_STATUS=$(echo "$REVIEW_RUN" | jq -r '.status // "unknown"')
              RUN_CONCLUSION=$(echo "$REVIEW_RUN" | jq -r '.conclusion // "null"')
              RUN_ID=$(echo "$REVIEW_RUN" | jq -r '.id // "unknown"')

              echo "  Review run #${RUN_ID}: status=${RUN_STATUS}, conclusion=${RUN_CONCLUSION}"

              if [ "$RUN_STATUS" = "completed" ]; then
                if [ "$RUN_CONCLUSION" = "success" ]; then
                  echo "✓ Review & autofix completed successfully"
                  echo "status=success" >> "$GITHUB_OUTPUT"
                  echo "review_run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
                  exit 0
                elif [ "$RUN_CONCLUSION" = "failure" ]; then
                  echo "::warning::Review workflow completed with failure — this may be acceptable if reviewers found issues"
                  echo "status=completed_with_findings" >> "$GITHUB_OUTPUT"
                  echo "review_run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
                  exit 0
                elif [ "$RUN_CONCLUSION" = "cancelled" ]; then
                  echo "Review run was cancelled — checking for newer run..."
                fi
              fi

              # While the run is still in_progress, probe job steps to detect
              # early failure. The review workflow uses if:always() cleanup steps
              # that keep the run in_progress long after the main work has died.
              if [ "$RUN_STATUS" = "in_progress" ] && [ "$RUN_ID" != "unknown" ]; then
                # Fetch jobs once and reuse for failed-steps check, current step, and log size
                JOBS_JSON=$(gh_api_safe "repos/${TEST_REPO}/actions/runs/${RUN_ID}/jobs?per_page=10" || echo "")
                if [ -n "$JOBS_JSON" ]; then
                  FAILED_STEPS=$(echo "$JOBS_JSON" | jq '[.jobs[].steps[] | select(.conclusion == "failure")] | length' 2>/dev/null || echo "0")
                else
                  FAILED_STEPS="0"
                fi
                if [ "$FAILED_STEPS" -gt 0 ]; then
                  echo "  ⚠ Review run has ${FAILED_STEPS} failed step(s) — main work has failed, cleanup still running"
                  echo "::warning::Review workflow has failed steps while cleanup is still in_progress"
                  echo "status=completed_with_findings" >> "$GITHUB_OUTPUT"
                  echo "review_run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
                  exit 0
                fi

                # Check live logs for reviewer progress (majority-pass shortcut)
                if [ "$ELAPSED" -ge 600 ]; then
                  JOB_ID=$(echo "$JOBS_JSON" | jq -r '.jobs[0].id // empty' 2>/dev/null || echo "")
                  if [ -n "$JOB_ID" ]; then
                    LOG_CONTENT=$(gh_api_safe "repos/${TEST_REPO}/actions/jobs/${JOB_ID}/logs" || echo "")
                    SUCCEEDED=$(echo "$LOG_CONTENT" | grep -c "Reviewer .* succeeded" || true)
                    FAILED_R=$(echo "$LOG_CONTENT" | grep -c "Reviewer .* failed after" || true)
                    SUCCEEDED="${SUCCEEDED:-0}"; SUCCEEDED="${SUCCEEDED##*$'\n'}"
                    FAILED_R="${FAILED_R:-0}"; FAILED_R="${FAILED_R##*$'\n'}"
                    [[ "$SUCCEEDED" =~ ^[0-9]+$ ]] || SUCCEEDED=0
                    [[ "$FAILED_R" =~ ^[0-9]+$ ]] || FAILED_R=0
                    TOTAL_DONE=$((SUCCEEDED + FAILED_R))
                    if [ "$SUCCEEDED" -ge 3 ] && [ $((SUCCEEDED * 2)) -gt "$TOTAL_DONE" ]; then
                      echo "  ✓ Review run still in_progress but ${SUCCEEDED}/${TOTAL_DONE} reviewers succeeded (>50%) — treating as pass"
                      echo "status=success" >> "$GITHUB_OUTPUT"
                      echo "review_run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
                      exit 0
                    elif [ "$TOTAL_DONE" -gt 0 ]; then
                      echo "  ... ${SUCCEEDED}/${TOTAL_DONE} reviewers succeeded so far, waiting for more..."
                    fi
                  fi
                fi
              fi
            fi

            # ── Adaptive activity signals ──────────────────────────
            # Beyond run status/conclusion, probe deeper indicators
            # that the review workflow is genuinely making progress.

            # 1) Current step name — reuse JOBS_JSON if already fetched
            CURRENT_STEP=""
            if [ "$RUN_ID" != "unknown" ]; then
              if [ -n "${JOBS_JSON:-}" ]; then
                CURRENT_STEP=$(echo "$JOBS_JSON" | jq -r '[.jobs[].steps[] | select(.status == "in_progress")] | last | .name // ""' 2>/dev/null || echo "")
              else
                CURRENT_STEP=$(gh_api_safe "repos/${TEST_REPO}/actions/runs/${RUN_ID}/jobs?per_page=10" \
                  --jq '[.jobs[].steps[] | select(.status == "in_progress")] | last | .name // ""' || echo "")
              fi
            fi

            # 2) Commit count on PR branch — editor pushes trigger changes
            PR_HEAD_SHA=$(gh_api_safe "repos/${TEST_REPO}/pulls/${PR_NUMBER}" \
              --jq '.head.sha // ""' || echo "")

            # 3) Review comment count on the PR
            REVIEW_COMMENT_COUNT=$(gh_api_safe "repos/${TEST_REPO}/pulls/${PR_NUMBER}/comments" \
              --jq 'length' || echo "0")

            # 4) Job log byte size — grows while reviewers/editor produce output
            LOG_SIZE="0"
            if [ "$RUN_ID" != "unknown" ]; then
              JOB_ID_FOR_SIZE=""
              if [ -n "${JOBS_JSON:-}" ]; then
                JOB_ID_FOR_SIZE=$(echo "$JOBS_JSON" | jq -r '.jobs[0].id // empty' 2>/dev/null || echo "")
              else
                JOB_ID_FOR_SIZE=$(gh_api_safe "repos/${TEST_REPO}/actions/runs/${RUN_ID}/jobs?per_page=10" \
                  --jq '.jobs[0].id // empty' || echo "")
              fi
              if [ -n "$JOB_ID_FOR_SIZE" ]; then
                LOG_SIZE=$(gh_api_safe "repos/${TEST_REPO}/actions/jobs/${JOB_ID_FOR_SIZE}/logs" \
                  | wc -c || echo "0")
                LOG_SIZE="${LOG_SIZE##*$'\n'}"
                [[ "$LOG_SIZE" =~ ^[0-9]+$ ]] || LOG_SIZE="0"
              fi
            fi

            CUR_STATE="run=${RUN_STATUS};conclusion=${RUN_CONCLUSION};failed_steps=${FAILED_STEPS};step=${CURRENT_STEP};head=${PR_HEAD_SHA};reviews=${REVIEW_COMMENT_COUNT};log_sz=${LOG_SIZE}"

            if [ "$CUR_STATE" != "$PREV_STATE" ]; then
              if [ -n "$PREV_STATE" ]; then
                echo "  ↻ Activity detected (state changed) — resetting inactivity timer"
              fi
              LAST_ACTIVITY=$NOW
              IDLE=0
              PREV_STATE="$CUR_STATE"
            fi

            # Inactivity timeout
            if [ $IDLE -ge $INACTIVITY_LIMIT ]; then
              echo "::error::Review phase stalled — no activity for ${REVIEW_TIMEOUT} minutes"
              echo "status=timeout" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            REMAINING=$(( (INACTIVITY_LIMIT - IDLE + 59) / 60 ))
            echo "  ... idle ${IDLE}s (timeout in ~${REMAINING}m) — step: ${CURRENT_STEP:-?}, head: ${PR_HEAD_SHA:0:7}, reviews: ${REVIEW_COMMENT_COUNT}, log: ${LOG_SIZE}b"
            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

      # ── Phase 5: Orchestrator script integration test ──────────
      - name: Checkout repository for integration tests
        uses: actions/checkout@v5
        with:
          ref: main

      - name: "Phase 5: Orchestrator script integration test"
        id: orchestrator-scripts
        run: |
          set -euo pipefail
          echo "Running orchestrator script integration tests..."

          # 5a: Python unit tests
          echo "── Unit tests ──"
          python3 tests/test_orchestrate_lib.py

          # 5b: CLI integration — validate a synthetic decomposition
          echo ""
          echo "── CLI: validate decomposition ──"
          SYNTH_FILE="$(mktemp --suffix=.json)"
          cat > "${SYNTH_FILE}" <<'SYNTH'
          {
            "schema_version": "orchestrate_decomposition.v1",
            "project_title": "E2E Orchestrator Validation",
            "project_summary": "Synthetic project for integration testing",
            "issues": [
              {"id": "setup", "title": "Setup", "body": "Setup task", "priority": 1},
              {"id": "impl", "title": "Implement", "body": "Implementation", "priority": 2},
              {"id": "test", "title": "Test", "body": "Testing", "priority": 3}
            ],
            "dependency_edges": [
              {"from": "setup", "to": "impl"},
              {"from": "impl", "to": "test"}
            ]
          }
          SYNTH
          python3 scripts/orchestrate_lib.py validate --input-file "${SYNTH_FILE}"

          echo ""
          echo "── CLI: compute waves ──"
          WAVE_OUTPUT="$(python3 scripts/orchestrate_lib.py compute-waves --input-file "${SYNTH_FILE}")"
          WAVE_COUNT="$(echo "${WAVE_OUTPUT}" | jq '.total_waves')"
          echo "Waves: ${WAVE_COUNT}"
          if [ "${WAVE_COUNT}" -ne 3 ]; then
            echo "::error::Expected 3 waves for linear dependency chain, got ${WAVE_COUNT}"
            exit 1
          fi

          # 5c: CLI integration — check-wave-status with review-blocked labels
          echo ""
          echo "── CLI: check-wave-status with review-blocked ──"
          STATE_FILE="$(mktemp --suffix=.json)"
          cat > "${STATE_FILE}" <<'STATE'
          {
            "schema_version": "orchestrate_state.v1",
            "project_title": "Test",
            "total_issues": 2,
            "total_waves": 1,
            "current_wave": 1,
            "judge_cycle": 0,
            "recovery_attempted": false,
            "review_blocked_retries": {},
            "status": "in_progress",
            "waves": [{"wave": 1, "issues": [
              {"id": "a", "github_issue": 100, "status": "pending"},
              {"id": "b", "github_issue": 101, "status": "pending"}
            ]}],
            "dependency_edges": [],
            "issue_number_map": {},
            "pending_issue_defs": {}
          }
          STATE
          LABELS_JSON='{"100": ["ai:review-blocked"], "101": ["ai:merged"]}'
          STATUS_OUTPUT="$(python3 scripts/orchestrate_lib.py check-wave-status \
            --state-file "${STATE_FILE}" \
            --labels-json "${LABELS_JSON}")"
          echo "${STATUS_OUTPUT}" | jq '.'

          RB_FLAG="$(echo "${STATUS_OUTPUT}" | jq '.any_review_blocked')"
          if [ "${RB_FLAG}" != "true" ]; then
            echo "::error::Expected any_review_blocked=true, got ${RB_FLAG}"
            exit 1
          fi
          WAVE_DONE="$(echo "${STATUS_OUTPUT}" | jq '.wave_complete')"
          if [ "${WAVE_DONE}" != "false" ]; then
            echo "::error::Expected wave_complete=false (review-blocked issue), got ${WAVE_DONE}"
            exit 1
          fi

          # 5d: Validate prompt files exist and are non-empty
          echo ""
          echo "── Prompt files validation ──"
          for pf in prompts/mode-judge.txt prompts/mode-judge-review-blocked.txt prompts/mode-judge-stall-recovery.txt; do
            if [ ! -s "${pf}" ]; then
              echo "::error::Prompt file ${pf} is missing or empty"
              exit 1
            fi
            echo "OK: ${pf} ($(wc -c < "${pf}") bytes)"
          done

          # 5e: Shell script syntax
          echo ""
          echo "── Shell script syntax ──"
          bash -n scripts/orchestrate_poll_process.sh
          echo "OK: orchestrate_poll_process.sh"

          # 5f: Label contract validation
          echo ""
          echo "── Label contract ──"
          python3 scripts/ai_labels.py contract-validate \
            --contract-file .github/ai/label_contract.v1.json

          echo ""
          echo "✓ All orchestrator script integration tests passed"
          echo "status=success" >> "$GITHUB_OUTPUT"

          rm -f "${SYNTH_FILE}" "${STATE_FILE}"

      # ── Phase 6: Review-blocked simulation test ────────────────
      - name: "Phase 6: Simulate review-blocked and verify poller handles it"
        id: review-blocked-sim
        if: steps.wait-implement.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.wait-implement.outputs.pr_number }}
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
        run: |
          set -euo pipefail
          echo "Setting up review-blocked simulation..."

          # 6a: Label the test issue as review-blocked (simulating autofix exhaustion)
          echo "Labeling issue #${ISSUE_NUMBER} as ai:review-blocked..."
          # Ensure the label exists before applying it (idempotent: check then create)
          if ! gh api "repos/${TEST_REPO}/labels/ai:review-blocked" >/dev/null 2>&1; then
            gh api "repos/${TEST_REPO}/labels" \
              -X POST \
              -f name="ai:review-blocked" \
              -f color="e11d48" \
              -f description="PR review/autofix could not resolve all issues — needs human intervention" \
              >/dev/null 2>&1 || true
          fi
          gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/labels" \
            -X POST \
            -f "labels[]=ai:review-blocked" >/dev/null 2>&1 || true
          # Remove other ai: phase labels to simulate a clean review-blocked state
          for label in ai:done ai:ready-to-merge ai:implementing ai:merged; do
            gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/labels/${label}" \
              -X DELETE 2>/dev/null || true
          done

          # 6b: Create a tracking issue with orchestrator state pointing to this issue
          TRACKING_BODY="## Project: E2E Review-Blocked Simulation

          Synthetic tracking issue for testing the orchestrator's review-blocked handling.

          ---
          *This issue is managed by the AI orchestrator. Do not edit manually.*
          \`ai:orchestrator-tracking\`"

          # Ensure the label exists before creating the issue (idempotent: check then create)
          if ! gh api "repos/${TEST_REPO}/labels/ai:orchestrator-tracking" >/dev/null 2>&1; then
            gh api "repos/${TEST_REPO}/labels" \
              -X POST \
              -f name="ai:orchestrator-tracking" \
              -f color="a2eeef" \
              -f description="Orchestrator project tracking issue" \
              >/dev/null 2>&1 || true
          fi

          # Create the issue WITH the label atomically so the issues:opened
          # event payload already contains ai:orchestrator-tracking.  This
          # prevents the clarify workflow from running on the tracking issue
          # (its guard checks labels at event time).
          TRACKING_NUMBER=$(gh api "repos/${TEST_REPO}/issues" \
            --method POST \
            --input - \
            --jq '.number' <<ISSUEJSON
          {
            "title": "[E2E Smoke Test] Review-Blocked Simulation (run ${GITHUB_RUN_ID})",
            "body": $(printf '%s' "${TRACKING_BODY}" | jq -Rs .),
            "labels": ["ai:orchestrator-tracking"]
          }
          ISSUEJSON
          )

          echo "Created tracking issue #${TRACKING_NUMBER}"
          echo "tracking_number=${TRACKING_NUMBER}" >> "$GITHUB_OUTPUT"

          # 6c: Post orchestrator state as a comment on the tracking issue
          STATE_JSON=$(jq -n \
            --argjson issue_number "${ISSUE_NUMBER}" \
            '{
              schema_version: "orchestrate_state.v1",
              project_title: "E2E Review-Blocked Simulation",
              total_issues: 1,
              total_waves: 1,
              current_wave: 1,
              judge_cycle: 0,
              recovery_attempted: false,
              review_blocked_retries: {},
              status: "in_progress",
              waves: [{wave: 1, issues: [
                {id: "test-issue", github_issue: $issue_number, status: "pending"}
              ]}],
              dependency_edges: [],
              issue_number_map: {"test-issue": $issue_number},
              pending_issue_defs: {}
            }')

          STATE_COMMENT="<!-- ORCHESTRATOR_STATE_V1
          ${STATE_JSON}
          ORCHESTRATOR_STATE_V1 -->"

          jq -n --arg body "${STATE_COMMENT}" '{"body": $body}' | \
            gh api "repos/${TEST_REPO}/issues/${TRACKING_NUMBER}/comments" \
              --method POST --input - >/dev/null

          echo "Posted orchestrator state to tracking issue #${TRACKING_NUMBER}"

          # 6d: Trigger the poller workflow
          echo "Triggering orchestrator poller..."
          POLLER_WORKFLOW="internal-orchestrate-poll.yml"
          if ! gh workflow run "${POLLER_WORKFLOW}" --repo "${TEST_REPO}" 2>/dev/null; then
            # Try the consumer wrapper name
            POLLER_WORKFLOW="ai-orchestrate-poll.yml"
            if ! gh workflow run "${POLLER_WORKFLOW}" --repo "${TEST_REPO}" 2>/dev/null; then
              echo "::warning::Could not trigger poller workflow. Skipping review-blocked verification."
              echo "status=skipped" >> "$GITHUB_OUTPUT"
              # Cleanup tracking issue
              gh api "repos/${TEST_REPO}/issues/${TRACKING_NUMBER}" \
                -X PATCH -f state=closed -f state_reason=not_planned 2>/dev/null || true
              exit 0
            fi
          fi

          echo "Poller triggered. Waiting for it to process the review-blocked issue..."

          # 6e: Wait for the poller to handle the review-blocked issue
          # The poller should: invoke judge → merge/fix/close_and_reissue
          # We verify by checking if the label changed from ai:review-blocked
          INACTIVITY_LIMIT=$((PHASE_TIMEOUT * 60))
          LAST_ACTIVITY=$(date +%s)
          PREV_STATE=""
          PREV_LABELS=""
          RATE_LIMIT_BACKOFF=0

          gh_api_safe() {
            local output
            output=$(gh api "$@" 2>/tmp/gh_api_err) && { RATE_LIMIT_BACKOFF=0; echo "$output"; return 0; }
            if grep -qi "rate limit" /tmp/gh_api_err 2>/dev/null || echo "$output" | grep -qi "rate limit"; then
              if [ "$RATE_LIMIT_BACKOFF" -eq 0 ]; then RATE_LIMIT_BACKOFF=30
              elif [ "$RATE_LIMIT_BACKOFF" -lt 120 ]; then RATE_LIMIT_BACKOFF=$((RATE_LIMIT_BACKOFF * 2)); fi
              echo "  ⏳ Rate limited — backing off ${RATE_LIMIT_BACKOFF}s" >&2
              sleep "$RATE_LIMIT_BACKOFF"
              echo ""; return 1
            fi
            echo ""; return 1
          }

          while true; do
            NOW=$(date +%s)
            IDLE=$((NOW - LAST_ACTIVITY))

            LABELS=$(gh_api_safe "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" \
              --jq '[.labels[].name] | join(",")' || echo "")

            # If rate-limited, skip this cycle (don't corrupt state)
            if [ "$RATE_LIMIT_BACKOFF" -gt 0 ] && [ -z "$LABELS" ]; then
              sleep "$POLL_INTERVAL"
              continue
            fi

            # Also check poller workflow run status for activity detection
            POLLER_RUN=$(gh_api_safe "repos/${TEST_REPO}/actions/runs?per_page=5&event=workflow_dispatch" \
              --jq "[.workflow_runs[] | select(.name | test(\"Orchestrate.*Poll|Poll\"; \"i\"))] | sort_by(.created_at) | last" || echo "")
            POLLER_STATUS="unknown"
            POLLER_CONCLUSION="null"
            if [ -n "${POLLER_RUN}" ] && [ "${POLLER_RUN}" != "null" ]; then
              POLLER_STATUS=$(echo "${POLLER_RUN}" | jq -r '.status // "unknown"')
              POLLER_CONCLUSION=$(echo "${POLLER_RUN}" | jq -r '.conclusion // "null"')
            fi

            CUR_STATE="labels=${LABELS};poller=${POLLER_STATUS};conclusion=${POLLER_CONCLUSION}"

            # Reset inactivity timer only when LABELS change (not poller
            # status alone — poller runs starting/completing would otherwise
            # reset the timer indefinitely while labels remain stuck).
            if [ "$LABELS" != "$PREV_LABELS" ]; then
              if [ -n "$PREV_LABELS" ]; then
                echo "  ↻ Label change detected — resetting inactivity timer"
              fi
              LAST_ACTIVITY=$NOW
              IDLE=0
              PREV_LABELS="$LABELS"
            fi
            # Still track full state for debug logging
            PREV_STATE="$CUR_STATE"

            # Success: label changed from ai:review-blocked to something else
            if ! echo "$LABELS" | grep -q 'ai:review-blocked'; then
              echo "✓ Review-blocked simulation passed — poller handled the issue"
              echo "  Current labels: ${LABELS}"

              if echo "$LABELS" | grep -q 'ai:ready-to-merge'; then
                echo "  Action: merge (judge decided to merge as-is)"
              elif echo "$LABELS" | grep -q 'ai:closed'; then
                echo "  Action: close_and_reissue (judge closed the PR)"
              else
                echo "  Action: fix or other (labels: ${LABELS})"
              fi

              echo "status=success" >> "$GITHUB_OUTPUT"

              gh api "repos/${TEST_REPO}/issues/${TRACKING_NUMBER}" \
                -X PATCH -f state=closed -f state_reason=not_planned 2>/dev/null || true
              exit 0
            fi

            # Check if the poller workflow failed
            if [ "${POLLER_STATUS}" = "completed" ] && [ "${POLLER_CONCLUSION}" = "failure" ]; then
              echo "::warning::Poller workflow failed — review-blocked handling may not have been reached"
              echo "status=poller_failed" >> "$GITHUB_OUTPUT"
              gh api "repos/${TEST_REPO}/issues/${TRACKING_NUMBER}" \
                -X PATCH -f state=closed -f state_reason=not_planned 2>/dev/null || true
              exit 0
            fi

            # Inactivity timeout
            if [ $IDLE -ge $INACTIVITY_LIMIT ]; then
              echo "::warning::Review-blocked sim stalled — no activity for ${PHASE_TIMEOUT} minutes"
              echo "status=timeout" >> "$GITHUB_OUTPUT"
              gh api "repos/${TEST_REPO}/issues/${TRACKING_NUMBER}" \
                -X PATCH -f state=closed -f state_reason=not_planned 2>/dev/null || true
              exit 0
            fi

            REMAINING=$(( (INACTIVITY_LIMIT - IDLE + 59) / 60 ))
            echo "  ... idle ${IDLE}s (timeout in ~${REMAINING}m) — labels: ${LABELS:-none}"
            sleep "$POLL_INTERVAL"
          done

      # ── Deep verification: inspect every step in every workflow run ─
      - name: "Deep verify: inspect all workflow run steps"
        id: deep-verify
        env:
          CLARIFY_RUN_ID: ${{ steps.wait-clarify.outputs.run_id }}
          PLAN_RUN_ID: ${{ steps.wait-plan.outputs.run_id }}
          IMPL_RUN_ID: ${{ steps.wait-implement.outputs.run_id }}
          REVIEW_RUN_ID: ${{ steps.wait-review.outputs.review_run_id }}
        run: |
          set -euo pipefail

          DEEP_PASS=true
          FAILED_STEPS=""
          SKIPPED_STEPS=""
          TOTAL_CHECKED=0
          TOTAL_OK=0
          TOTAL_FAILED=0
          TOTAL_SKIPPED=0

          # ── Helper: check ALL steps in a workflow run ──
          check_all_steps() {
            local run_id="$1"
            local phase_name="$2"

            if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
              echo ""
              echo "  ⚠ ${phase_name}: workflow run ID not captured — cannot verify steps"
              DEEP_PASS=false
              FAILED_STEPS="${FAILED_STEPS}\n  - ${phase_name}: run ID not found (phase may not have triggered)"
              return 0
            fi

            echo ""
            echo "  ┌─ ${phase_name} (run #${run_id})"

            # Fetch all jobs and their steps (retry up to 3 times on transient failures).
            #
            # IMPORTANT: Do NOT use `JOBS_JSON=$(gh api ... || echo fallback)`.
            # On non-zero exit, `gh api` still writes the API error body (e.g.
            # `{"message":"Not Found",...}`) to stdout; inside `$(...)`, the
            # `|| echo` branch runs anyway and its output is *concatenated*
            # with gh's stdout, producing a multi-document JSON blob. Downstream
            # `jq '.jobs | length'` then emits multiple lines (one per document),
            # `[ "$TOTAL_JOBS" -eq 0 ]` trips with "integer expression expected",
            # and `jq '[.jobs[] | select(...)] | length'` errors with "Cannot
            # iterate over null (null)" on any error-body document whose .jobs
            # key is missing. Always assign the fallback outside the command
            # substitution so the two outputs can't concatenate.
            #
            # Single source of truth for the schema predicate. Uses `jq -se`
            # (slurp + exit-status) so multi-document input fails the
            # predicate — without `-s`, `jq -e` evaluates each document
            # independently and exits with the truthiness of the *last*
            # document, so a multi-doc blob whose tail happens to satisfy
            # the schema would pass through and break downstream
            # `jq '.jobs | length'` with mixed-line output. Extracted into a
            # helper so the outer retry and the indexing-delay recheck stay
            # in lock-step.
            _jobs_json_valid() {
              printf '%s' "$1" \
                | jq -se 'length == 1 and (.[0] | type == "object" and (.jobs | type == "array"))' \
                >/dev/null 2>&1
            }

            JOBS_JSON='{"jobs":[]}'
            for _attempt in 1 2 3; do
              if _JOBS_OUT=$(gh api "repos/${TEST_REPO}/actions/runs/${run_id}/jobs?per_page=100" 2>/dev/null); then
                JOBS_JSON="$_JOBS_OUT"
                break
              fi
              echo "  │  ⚠ API attempt ${_attempt}/3 failed — retrying in 2s..."
              sleep 2
            done
            unset _JOBS_OUT
            # Shape check: reject anything that isn't a single JSON object
            # with a `.jobs` array. Catches (a) all-retries-failed with an
            # empty JOBS_JSON, (b) error-body responses that happen to parse,
            # and (c) any future accidental multi-doc concatenation.
            if ! _jobs_json_valid "$JOBS_JSON"; then
              JOBS_JSON='{"jobs":[]}'
            fi

            # Check if all jobs in this run were skipped (spurious re-trigger where
            # the reusable workflow's job-level if: condition was false). This commonly
            # happens when a comment event re-triggers internal-clarify.yml or
            # internal-implement.yml but the reusable workflow skips the job.
            TOTAL_JOBS=$(echo "$JOBS_JSON" | jq '.jobs | length')
            SKIPPED_JOBS=$(echo "$JOBS_JSON" | jq '[.jobs[] | select(.conclusion == "skipped")] | length')
            if [ "$TOTAL_JOBS" -eq 0 ]; then
              # GitHub can briefly report zero jobs before the run is fully indexed.
              # Re-fetch a few times so we don't false-pass real runs as spurious.
              echo "  │  ⚠ Run has no jobs yet — rechecking for indexing delay..."
              for _jobs_retry in 1 2 3; do
                sleep $((_jobs_retry * 2))
                # Same hazard as the outer retry — assign fallback outside the
                # command substitution so gh's error-body stdout cannot
                # concatenate with the literal fallback JSON.
                if _JOBS_OUT=$(gh api "repos/${TEST_REPO}/actions/runs/${run_id}/jobs?per_page=100" 2>/dev/null); then
                  JOBS_JSON="$_JOBS_OUT"
                else
                  JOBS_JSON='{"jobs":[]}'
                fi
                unset _JOBS_OUT
                if ! _jobs_json_valid "$JOBS_JSON"; then
                  JOBS_JSON='{"jobs":[]}'
                fi
                TOTAL_JOBS=$(echo "$JOBS_JSON" | jq '.jobs | length')
                SKIPPED_JOBS=$(echo "$JOBS_JSON" | jq '[.jobs[] | select(.conclusion == "skipped")] | length')
                [ "$TOTAL_JOBS" -gt 0 ] && break
              done
            fi
            if [ "$TOTAL_JOBS" -eq 0 ]; then
              echo "  │  ⊘ Run has no jobs after retries (spurious re-trigger) — OK"
              echo "  └─"
              return 0
            fi
            if [ "$SKIPPED_JOBS" -eq "$TOTAL_JOBS" ]; then
              echo "  │  ⊘ All ${TOTAL_JOBS} job(s) were skipped (spurious re-trigger) — OK"
              echo "  └─"
              return 0
            fi

            # Iterate every step in every job
            STEP_COUNT=$(echo "$JOBS_JSON" | jq '[.jobs[].steps[]] | length')
            if [ "$STEP_COUNT" -eq 0 ]; then
              echo "  │  ⚠ No steps found — run may still be in progress or API returned empty"
              DEEP_PASS=false
              FAILED_STEPS="${FAILED_STEPS}\n  - ${phase_name}: no steps found in run"
              echo "  └─"
              return 0
            fi

            local phase_ok=0
            local phase_fail=0
            local phase_skip=0

            # Process each step
            while IFS=$'\t' read -r step_name step_conclusion step_status; do
              TOTAL_CHECKED=$((TOTAL_CHECKED + 1))

              # Skip GitHub's internal "Set up job" / "Complete job" steps —
              # these are infra steps, not workflow logic
              if [ "$step_name" = "Set up job" ] || [ "$step_name" = "Complete job" ] || [ "$step_name" = "Post actions/checkout@v5" ]; then
                continue
              fi

              case "${step_conclusion}" in
                success)
                  echo "  │  ✓ ${step_name}"
                  phase_ok=$((phase_ok + 1))
                  TOTAL_OK=$((TOTAL_OK + 1))
                  ;;
                skipped)
                  echo "  │  ⊘ ${step_name} — SKIPPED"
                  phase_skip=$((phase_skip + 1))
                  TOTAL_SKIPPED=$((TOTAL_SKIPPED + 1))
                  SKIPPED_STEPS="${SKIPPED_STEPS}\n  - ${phase_name} → ${step_name}"
                  ;;
                failure)
                  echo "  │  ✗ ${step_name} — FAILED"
                  phase_fail=$((phase_fail + 1))
                  TOTAL_FAILED=$((TOTAL_FAILED + 1))
                  DEEP_PASS=false
                  FAILED_STEPS="${FAILED_STEPS}\n  - ${phase_name} → ${step_name}"
                  ;;
                cancelled)
                  echo "  │  ⊘ ${step_name} — CANCELLED"
                  phase_skip=$((phase_skip + 1))
                  TOTAL_SKIPPED=$((TOTAL_SKIPPED + 1))
                  SKIPPED_STEPS="${SKIPPED_STEPS}\n  - ${phase_name} → ${step_name} (cancelled)"
                  ;;
                *)
                  echo "  │  ? ${step_name} — ${step_conclusion:-unknown} (status: ${step_status})"
                  # In-progress or unknown — flag but don't fail
                  SKIPPED_STEPS="${SKIPPED_STEPS}\n  - ${phase_name} → ${step_name} (${step_conclusion:-unknown})"
                  ;;
              esac
            done < <(echo "$JOBS_JSON" | jq -r '.jobs[].steps[] | [.name, .conclusion, .status] | @tsv')

            echo "  └─ ${phase_ok} ok, ${phase_fail} failed, ${phase_skip} skipped"
          }

          echo "═══════════════════════════════════════════"
          echo "  Deep Verification: All Workflow Steps"
          echo "═══════════════════════════════════════════"

          check_all_steps "${CLARIFY_RUN_ID}" "Clarify"
          check_all_steps "${PLAN_RUN_ID}" "Plan"
          check_all_steps "${IMPL_RUN_ID}" "Implement"
          check_all_steps "${REVIEW_RUN_ID}" "Review/Edit"

          echo ""
          echo "───────────────────────────────────────────"
          echo "  Totals: ${TOTAL_OK} ok, ${TOTAL_FAILED} failed, ${TOTAL_SKIPPED} skipped"
          echo "───────────────────────────────────────────"

          # Print the failed-steps list whenever deep verify did not fully pass,
          # so "no steps found in run" / "run ID not found" entries (which do not
          # increment TOTAL_FAILED) are still surfaced in the summary.
          if [ "$DEEP_PASS" != "true" ] || [ "$TOTAL_FAILED" -gt 0 ]; then
            echo ""
            echo "  Failed steps:"
            echo -e "$FAILED_STEPS"
          fi

          if [ "$TOTAL_SKIPPED" -gt 0 ]; then
            echo ""
            echo "  Skipped steps:"
            echo -e "$SKIPPED_STEPS"
          fi

          echo ""
          if [ "$DEEP_PASS" = "true" ]; then
            echo "  ✓ All steps across all phases succeeded."
            echo "deep_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "  ✗ Some steps failed — see details above."
            echo "deep_passed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "═══════════════════════════════════════════"

      # ── Verification summary ───────────────────────────────────
      - name: Verify all phases passed
        id: verify
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
          PR_NUMBER: ${{ steps.wait-implement.outputs.pr_number }}
        run: |
          set -euo pipefail
          echo "═══════════════════════════════════════════"
          echo "  E2E Smoke Test Results"
          echo "═══════════════════════════════════════════"
          echo ""

          PASSED=true

          # Check clarify
          CLARIFY="${{ steps.wait-clarify.outputs.status }}"
          if [ "$CLARIFY" = "success" ]; then
            echo "  ✓ Clarify .... PASSED"
          else
            echo "  ✗ Clarify .... FAILED (${CLARIFY})"
            PASSED=false
          fi

          # Check plan
          PLAN="${{ steps.wait-plan.outputs.status }}"
          if [ "$PLAN" = "success" ] || [ "$PLAN" = "auto_approved" ]; then
            echo "  ✓ Plan ....... PASSED"
          else
            echo "  ✗ Plan ....... FAILED (${PLAN})"
            PASSED=false
          fi

          # Check implement
          IMPL="${{ steps.wait-implement.outputs.status }}"
          if [ "$IMPL" = "success" ]; then
            echo "  ✓ Implement .. PASSED (PR #${PR_NUMBER})"
          else
            echo "  ✗ Implement .. FAILED (${IMPL})"
            PASSED=false
          fi

          # Check review
          REVIEW="${{ steps.wait-review.outputs.status }}"
          if [ "$REVIEW" = "success" ] || [ "$REVIEW" = "completed_with_findings" ]; then
            echo "  ✓ Review ..... PASSED"
          else
            echo "  ✗ Review ..... FAILED (${REVIEW})"
            PASSED=false
          fi

          # Check orchestrator scripts (Phase 5)
          ORCH="${{ steps.orchestrator-scripts.outputs.status }}"
          if [ "$ORCH" = "success" ]; then
            echo "  ✓ Orch Tests . PASSED"
          else
            echo "  ✗ Orch Tests . FAILED (${ORCH:-not_run})"
            PASSED=false
          fi

          # Check review-blocked simulation (Phase 6)
          RBSIM="${{ steps.review-blocked-sim.outputs.status }}"
          if [ "$RBSIM" = "success" ] || [ "$RBSIM" = "skipped" ]; then
            echo "  ✓ RB Sim ..... PASSED (${RBSIM})"
          elif [ "$RBSIM" = "poller_failed" ]; then
            echo "  ⚠ RB Sim ..... WARN (poller workflow failed — non-blocking)"
          elif [ "$RBSIM" = "timeout" ]; then
            echo "  ⚠ RB Sim ..... WARN (timed out — non-blocking)"
          elif [ -z "$RBSIM" ]; then
            echo "  - RB Sim ..... SKIPPED (no PR to simulate with)"
          else
            echo "  ✗ RB Sim ..... FAILED (${RBSIM})"
            PASSED=false
          fi

          # Check deep verification (step-level)
          DEEP="${{ steps.deep-verify.outputs.deep_passed }}"
          if [ "$DEEP" = "true" ]; then
            echo "  ✓ Internals .. PASSED (all steps in all phases succeeded)"
          else
            echo "  ✗ Internals .. FAILED (some workflow steps failed or missing)"
            echo "    See 'Deep verify' step for full per-step breakdown."
            PASSED=false
          fi

          echo ""
          echo "═══════════════════════════════════════════"

          if [ "$PASSED" = "true" ]; then
            echo "  ALL PHASES PASSED — safe to release"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "  SOME PHASES FAILED — blocking release"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ── Cleanup ─────────────────────────────────────────────────
      - name: Cleanup test artifacts
        if: always()
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
          PR_NUMBER: ${{ steps.wait-implement.outputs.pr_number }}
          TRACKING_NUMBER: ${{ steps.review-blocked-sim.outputs.tracking_number }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          echo "Cleaning up E2E test artifacts..."

          # Close PR without merging
          if [ -n "${PR_NUMBER}" ]; then
            EXISTING_PR_BODY="$(_safe_gh_jq "repos/${TEST_REPO}/pulls/${PR_NUMBER}" --jq '.body // ""' || echo "")"
            NEW_PR_BODY="${EXISTING_PR_BODY}

          ---
          *Closed by E2E smoke test cleanup (run ${GITHUB_RUN_ID}).*"
            gh api "repos/${TEST_REPO}/pulls/${PR_NUMBER}" \
              -X PATCH -f state=closed -f body="${NEW_PR_BODY}" \
              2>/dev/null || echo "Warning: could not close PR #${PR_NUMBER}"
            echo "  Closed PR #${PR_NUMBER}"
          fi

          # Close issue
          if [ -n "${ISSUE_NUMBER}" ]; then
            gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" \
              -X PATCH -f state=closed \
              -f state_reason=not_planned \
              2>/dev/null || echo "Warning: could not close issue #${ISSUE_NUMBER}"

            # Add cleanup comment
            gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/comments" \
              -f body="E2E smoke test completed. Cleaning up.

          **Result:** ${{ steps.verify.outputs.passed == 'true' && '✓ All phases passed' || '✗ Some phases failed' }}
          **Run:** [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          **Version under test:** ${{ needs.resolve-version.outputs.version }}" \
              2>/dev/null || echo "Warning: could not post cleanup comment"
            echo "  Closed issue #${ISSUE_NUMBER}"
          fi

          # Close tracking issue from Phase 6 (if created)
          if [ -n "${TRACKING_NUMBER}" ]; then
            gh api "repos/${TEST_REPO}/issues/${TRACKING_NUMBER}" \
              -X PATCH -f state=closed -f state_reason=not_planned \
              2>/dev/null || echo "Warning: could not close tracking issue #${TRACKING_NUMBER}"
            echo "  Closed tracking issue #${TRACKING_NUMBER}"
          fi

          # Delete test branch
          BRANCH="ai/issue-${ISSUE_NUMBER}"
          gh api "repos/${TEST_REPO}/git/refs/heads/${BRANCH}" -X DELETE \
            2>/dev/null || echo "  Branch ${BRANCH} already deleted or does not exist"
          echo "  Deleted branch ${BRANCH}"

          echo "Cleanup complete."

  # ──────────────────────────────────────────────────────────────────
  # Job 1b: Script correctness validation — runs parallel with E2E
  # ──────────────────────────────────────────────────────────────────
  validate-scripts:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: YAML lint
        run: |
          set -euo pipefail
          pip install -q yamllint
          yamllint -s .github/workflows/*.yml .github/actions/*/action.yml

      - name: Shell script syntax check
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            bash -n "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: ShellCheck static analysis
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            shellcheck --severity=error "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Python syntax check
        run: |
          set -euo pipefail
          for f in scripts/*.py; do
            python3 -m py_compile "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Python lint (ruff)
        run: |
          set -euo pipefail
          pip install -q ruff
          ruff check --select E,F --ignore E501 scripts/*.py

      - name: Unit tests
        run: |
          set -euo pipefail
          python3 tests/test_orchestrate_lib.py
          python3 tests/test_orchestrate_poll_process.py

      - name: Prompt files integrity
        run: |
          set -euo pipefail
          for f in prompts/*.txt; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f is empty"
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done

          if [ ! -s "prompts/serena-efficiency-block.txt" ]; then
            echo "FAIL: prompts/serena-efficiency-block.txt is missing or empty"
            exit 1
          fi
          if [ ! -x "scripts/render_prompt.sh" ]; then
            echo "FAIL: scripts/render_prompt.sh is missing or not executable"
            exit 1
          fi

          target_prompts=(
            prompts/mode-clarify.txt
            prompts/mode-plan.txt
            prompts/mode-implement.txt
            prompts/mode-implement-diagnose.txt
            prompts/mode-implement-repair.txt
            prompts/mode-implement-repair-syntax.txt
            prompts/mode-orchestrate.txt
            prompts/mode-workflow-analysis.txt
            prompts/mode-judge.txt
            prompts/mode-judge-review-blocked.txt
            prompts/mode-judge-stall-recovery.txt
            prompts/mode-clarify-respond.txt
            prompts/mode-validate-generate.txt
            prompts/mode-validate-diagnose.txt
          )

          for pf in "${target_prompts[@]}"; do
            if grep -q '^SERENA MCP EFFICIENCY (MANDATORY):$' "${pf}"; then
              echo "FAIL: ${pf} still contains inline SERENA MCP EFFICIENCY block"
              exit 1
            fi
            rendered_file="$(mktemp)"
            bash scripts/render_prompt.sh "${pf}" > "${rendered_file}"
            if grep -q '{{SERENA_EFFICIENCY_BLOCK_[A-Z_][A-Z_]*}}' "${rendered_file}"; then
              echo "FAIL: unresolved Serena placeholders remain after rendering ${pf}"
              rm -f "${rendered_file}"
              exit 1
            fi
            rm -f "${rendered_file}"
          done

      - name: Script-workflow cross-reference
        run: |
          set -euo pipefail
          echo "Verifying all scripts referenced by workflows exist..."
          MISSING=0
          for ref in $(grep -rhoE 'scripts/[a-zA-Z0-9_.-]+\.(sh|py|json)' .github/workflows/ | sort -u); do
            if [ ! -f "$ref" ]; then
              echo "FAIL: $ref referenced in workflows but does not exist"
              MISSING=$((MISSING + 1))
            else
              echo "OK: $ref"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::${MISSING} script(s) referenced by workflows are missing"
            exit 1
          fi
          echo "All referenced scripts exist."

  # ──────────────────────────────────────────────────────────────────
  # Job 2: Validate release prerequisites (same as mark-stable.yml)
  # ──────────────────────────────────────────────────────────────────
  validate:
    needs: [resolve-version, e2e-smoke-test, validate-scripts]
    if: >-
      always() &&
      needs.resolve-version.result == 'success' &&
      needs.validate-scripts.result == 'success' &&
      (needs.e2e-smoke-test.result == 'success' || needs.e2e-smoke-test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate version format
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version tag '${VERSION}'. Must match vX.Y.Z"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure tag does not already exist
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${VERSION} already exists"
            exit 1
          fi

      - name: Verify CI passed on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "Checking CI status for $SHA ..."
          STATE=$(gh api "repos/${{ github.repository }}/commits/${SHA}/status" \
            --jq '.state' 2>/dev/null || echo "pending")
          if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
            echo "::error::CI is failing on main ($STATE). Fix before releasing."
            exit 1
          fi
          echo "CI state: $STATE — OK"

  # ──────────────────────────────────────────────────────────────────
  # Job 3: Create release (same as mark-stable.yml)
  # ──────────────────────────────────────────────────────────────────
  release:
    needs: [resolve-version, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Extract changelog for this version
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          NOTES=$(awk \
            "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" \
            CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="No changelog entry found for ${VERSION}."
          fi
          echo "$NOTES" > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Tag version and update stable pointer
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION="${{ needs.resolve-version.outputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          # Immutable version tag
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

          # Moving stable pointer
          git tag -f stable "$VERSION"
          git push -f origin stable

          # Moving major-version pointer (e.g. v1)
          git tag -f "$MAJOR" "$VERSION"
          git push -f origin "$MAJOR"

          echo "Tagged $VERSION and updated stable + $MAJOR pointers."

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            --target main

      - name: Notify consumer repos via repository_dispatch
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"

          CONSUMER_FILE=".github/ai/consumer_repos.json"
          if [ ! -f "$CONSUMER_FILE" ]; then
            echo "No consumer_repos.json found — skipping repository_dispatch."
            exit 0
          fi

          REPOS=$(jq -r '.[]' "$CONSUMER_FILE" 2>/dev/null || true)
          if [ -z "$REPOS" ]; then
            echo "consumer_repos.json is empty — skipping."
            exit 0
          fi

          for REPO in $REPOS; do
            echo "Dispatching coding-workflows-stable-released to ${REPO} ..."
            gh api "repos/${REPO}/dispatches" \
              -f event_type="coding-workflows-stable-released" \
              -f "client_payload[version]=${VERSION}" \
              || echo "::warning::Failed to dispatch to ${REPO} (may lack permissions)"
          done

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "=== DRY RUN ==="
          VERSION="${{ needs.resolve-version.outputs.version }}"
          echo "Would tag main as: ${VERSION}"
          echo "Would update pointers: stable, $(echo "${VERSION}" | cut -d. -f1)"
          echo ""
          echo "Changelog notes:"
          cat "${{ steps.changelog.outputs.notes_file }}"

  # ──────────────────────────────────────────────────────────────────
  # Job 4: Combined Telegram notification (runs after ALL jobs)
  # ──────────────────────────────────────────────────────────────────
  notify:
    needs: [resolve-version, e2e-smoke-test, validate-scripts, validate, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Telegram notification
        id: tg_send
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          CHAT_ID="${TG_CHAT_ID:-}"
          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${CHAT_ID}" ]; then
            echo "Telegram notification skipped (missing TG_BOT_SECRET or chat_id)"
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          E2E="${{ needs.e2e-smoke-test.result }}"
          SCRIPTS="${{ needs.validate-scripts.result }}"
          VALIDATE="${{ needs.validate.result }}"
          RELEASE="${{ needs.release.result }}"

          # Determine overall status
          if [ "$E2E" = "success" ] && [ "$SCRIPTS" = "success" ] && [ "$VALIDATE" = "success" ] && [ "$RELEASE" = "success" ]; then
            MSG="Release ${{ needs.resolve-version.outputs.version }} SUCCEEDED"
            MSG+=$'\n'"All jobs passed: e2e ✓ scripts ✓ validate ✓ release ✓"
          else
            MSG="Release ${{ needs.resolve-version.outputs.version }} FAILED"
            STATUS_LINE=""
            for JOB_NAME in e2e-smoke-test validate-scripts validate release; do
              case "$JOB_NAME" in
                e2e-smoke-test) RESULT="$E2E" ;;
                validate-scripts) RESULT="$SCRIPTS" ;;
                validate) RESULT="$VALIDATE" ;;
                release) RESULT="$RELEASE" ;;
              esac
              case "$RESULT" in
                success) ICON="✓" ;;
                skipped) ICON="⊘" ;;
                *) ICON="✗" ;;
              esac
              STATUS_LINE+="${JOB_NAME}: ${ICON} (${RESULT})  "
            done
            MSG+=$'\n'"${STATUS_LINE}"
          fi
          MSG+=$'\n'"Run: ${RUN_URL}"

          # Send notification (persists — not auto-deleted)
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_SECRET}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}" >/dev/null 2>&1 || echo "::warning::Telegram send failed"

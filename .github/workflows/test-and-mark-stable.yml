---
name: Test & Mark Stable Release

"on":
  workflow_dispatch:
    inputs:
      version_tag:
        description: >
          Semantic version tag (e.g. v1.2.0). Leave blank to auto-increment
          patch from the latest stable release.
        required: false
        type: string
        default: ""
      test_repo:
        description: >
          Repository to run E2E smoke test on (owner/repo).
          Defaults to this repository. The target repo must have
          the internal/consumer workflow wrappers installed.
        required: false
        type: string
        default: ""
      skip_e2e:
        description: Skip E2E test and only mark stable (same as mark-stable.yml)
        required: false
        type: boolean
        default: false
      dry_run:
        description: >
          Validate only — do not push tags or create release. Also skips every
          live-dispatch e2e job (smoke, workflow-log-analysis, orphan-workflows,
          orchestrate-decompose, validate-standalone, clarify-rejects-unsolvable,
          alt-model) so a
          dry run never mutates the test repo. Static checks (validate-scripts)
          still run so the gate can verify scripts/lint/yaml health without
          burning live test resources or polluting GitHub state. Use
          skip_e2e=true if you want the live tests skipped while still tagging
          a release (manual emergency tag scenario).
        required: false
        type: boolean
        default: false
      phase_timeout:
        description: >
          Max minutes of *inactivity* before a phase is considered stuck.
          The timer resets whenever progress is detected (label changes,
          new comments, workflow run status updates). This is NOT a
          wall-clock limit — a phase that keeps making progress can run
          longer than this value.
        required: false
        type: number
        default: 30
      plan_timeout:
        description: >
          Max minutes of *inactivity* for Phase 2 (Wait for plan). Higher
          default than `phase_timeout` because the plan trigger relies on
          GitHub `issue_comment` event delivery — observed to lag up to
          ~38 min in the wild (run 25477674617). The timer still resets
          on any detected progress (label/comment/plan-run changes), so
          a healthy plan completes well before the cap. Falls back to
          `phase_timeout` when unset, so existing dispatchers that only
          override `phase_timeout` keep the previous behaviour.
        required: false
        type: number
        default: 60
      review_timeout:
        description: >
          Max minutes of *inactivity* before the review & autofix phase
          is considered stuck. Review naturally runs longer (multiple
          reviewer models + editor), so this has a higher default.
          The timer resets on any detected progress (step transitions,
          new commits, review comments, log output growth).
          Raised 30→40 after run 27328808462 (v1.17.0): a pre-bait
          implement-phase review held the `pr-autofix-<PR>` concurrency
          lock (cancel-in-progress: false) for ~37m on a slow reviewer
          LLM step (~29m), serialising the bait review behind it; the
          extra headroom absorbs that contention.
        required: false
        type: number
        default: 40
      review_workflow_file:
        description: >
          Filename (under .github/workflows/ in TEST_REPO) of the
          review-autofix wrapper that the smoke gate dispatches and
          polls. Defaults to `internal-review.yml`, the source repo's
          template. Override only when smoke-testing against a
          consumer repo that renamed the wrapper.
        required: false
        type: string
        default: "internal-review.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Job -1: Validate dispatch ref — must be `stable`
  #
  # This workflow only releases from the long-lived `stable` branch.
  # Dispatching from `main` (or any other ref) is rejected so an
  # operator cannot accidentally tag main as stable and drag in
  # untested in-flight work. To promote `main` to the new stable
  # baseline (typical for minor/major bumps), run
  # promote-main-to-stable.yml — it fast-forwards stable to main and
  # then dispatches this workflow on stable automatically. For
  # bug-fix patch releases on the existing stable line, dispatch
  # this workflow directly with `--ref stable`.
  #
  # The `branch` output is preserved (always `stable`) so downstream
  # jobs that reference `needs.source.outputs.branch` keep working
  # without per-job edits.
  # ──────────────────────────────────────────────────────────────────
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      branch: ${{ steps.detect.outputs.branch }}
    steps:
      - name: Validate dispatch ref
        id: detect
        run: |
          set -euo pipefail
          REF="${{ github.ref_name }}"
          if [ "$REF" != "stable" ]; then
            echo "::error::test-and-mark-stable.yml must be dispatched from the 'stable' branch (got '${REF}')."
            echo "::error::To promote 'main' to a new stable baseline, run promote-main-to-stable.yml — it fast-forwards stable to main and then dispatches this workflow on stable automatically."
            exit 1
          fi
          echo "Dispatched from 'stable' — proceeding with stable-source release path"
          echo "branch=stable" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────
  # Job 0: Resolve version — auto-increment patch if not provided
  # ──────────────────────────────────────────────────────────────────
  resolve-version:
    needs: [source]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version tag
        id: resolve
        env:
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.version_tag }}"

          if [ -n "$INPUT_VERSION" ]; then
            if [[ ! "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Provided version '${INPUT_VERSION}' is invalid; must match vX.Y.Z"
              exit 1
            fi
            echo "Using user-provided version: ${INPUT_VERSION}"
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Refresh tags from origin BEFORE computing LATEST. If a new
          # tag was pushed after checkout, computing LATEST first would
          # pick an outdated base version and lean on the collision-
          # skip loop below to catch up. Bounded retry tolerates
          # transient network/auth flakes; persistent failure is a
          # hard error since running on stale tag data could pick a
          # colliding version.
          # Capture each attempt's stderr to /tmp/_git_fetch_err so the
          # underlying transport/auth failure cause is visible in logs
          # instead of being swallowed by the retry warning.
          fetch_attempt=1
          while [ "$fetch_attempt" -le 3 ]; do
            if git fetch --tags --force origin 2>/tmp/_git_fetch_err; then
              break
            fi
            if [ "$fetch_attempt" -eq 3 ]; then
              echo "::error::Failed to fetch remote tags from origin after 3 attempts — refusing to compute next version on potentially stale tag data"
              cat /tmp/_git_fetch_err >&2 2>/dev/null || true
              exit 1
            fi
            backoff=$(( 2 ** fetch_attempt ))
            echo "::warning::git fetch --tags failed (attempt ${fetch_attempt}/3), retrying in ${backoff}s…"
            cat /tmp/_git_fetch_err >&2 2>/dev/null || true
            sleep "${backoff}"
            fetch_attempt=$((fetch_attempt + 1))
          done

          # Find the latest vX.Y.Z tag reachable from `stable`'s HEAD.
          # `--merged HEAD` is critical: if main is on v1.5.0 and stable
          # is on v1.4.2, the next stable patch must bump from v1.4.2
          # (→ v1.4.3), not from main's v1.5.0. Restricting the lookup
          # to tags reachable from the checked-out branch avoids
          # computing the next version from unrelated newer tags
          # elsewhere in the repo.
          #
          # The shell glob `v[0-9]*.[0-9]*.[0-9]*` also matches prerelease
          # tags (e.g. `v1.4.2-beta.1`) which would later break patch
          # arithmetic on `cut -d. -f3` under `set -euo pipefail`. Filter
          # to strict semver with grep so only release tags survive.
          # `{ grep ... || true; }` keeps the pipeline exit status at 0
          # when no semver tags exist (grep returns 1 on no-match, which
          # under pipefail would abort the step before the empty-LATEST
          # fallback below can run).
          LATEST=$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | head -n1)

          NEXT=""
          if [ -z "$LATEST" ]; then
            NEXT="v1.0.0"
            echo "No existing version tags reachable from ${SOURCE_BRANCH}. Defaulting to ${NEXT}"
          else
            # Bump patch and skip any candidate that already exists in
            # the local tag namespace (which, after the fetch above,
            # mirrors the remote). Bounded to 1000 iterations as a
            # belt-and-braces guard against pathological tag layouts.
            MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
            i=0
            while [ "$i" -lt 1000 ]; do
              PATCH=$((PATCH + 1))
              CANDIDATE="v${MAJOR}.${MINOR}.${PATCH}"
              if ! git rev-parse "refs/tags/${CANDIDATE}" >/dev/null 2>&1; then
                NEXT="$CANDIDATE"
                break
              fi
              echo "Tag ${CANDIDATE} already exists elsewhere in repo — skipping"
              i=$((i + 1))
            done
            if [ -z "$NEXT" ]; then
              echo "::error::Could not find an unused patch tag after 1000 attempts starting from ${LATEST}"
              exit 1
            fi
            echo "Latest tag on ${SOURCE_BRANCH}: ${LATEST} → next version: ${NEXT}"
          fi

          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"

      # Temporary: reveal which git invocation in checkout's post-step
      # produces `The process '/usr/bin/git' failed with exit code 128`.
      # This diagnostic runs after checkout's main step and before
      # checkout's post-step cleanup, then re-executes the same git
      # operations to isolate the failing command.
      # Remove after root-cause is identified and a targeted fix lands.
      - &git-checkout-diag
        name: git diagnostic (checkout exit-128 probe)
        if: always()
        run: |
          set +e
          echo "=== git diagnostic: simulating checkout post-step operations ==="
          git --version
          echo "--- config (first 200) ---"
          git config --list --show-origin 2>&1 | head -n 200
          echo "--- status / head ---"
          git status 2>&1; echo "status_rc=$?"
          git log -1 --oneline 2>&1; echo "log_rc=$?"
          echo "--- simulate post-step extraheader ops ---"
          # Capture stdout (keys) and stderr (diagnostics) separately
          EXTRAHEADER_STDERR_FILE=$(mktemp)
          EXTRAHEADER_KEYS_STDOUT=$(git config --local --name-only --get-regexp 'http\..*\.extraheader' 2>"$EXTRAHEADER_STDERR_FILE")
          GETREGEXP_RC=$?
          EXTRAHEADER_KEYS_STDERR=$(cat "$EXTRAHEADER_STDERR_FILE" 2>/dev/null || true)
          rm -f "$EXTRAHEADER_STDERR_FILE"
          printf '%s\n' "$EXTRAHEADER_KEYS_STDOUT"
          [ -n "$EXTRAHEADER_KEYS_STDERR" ] && printf 'stderr: %s\n' "$EXTRAHEADER_KEYS_STDERR" || true
          echo "getregexp_rc=$GETREGEXP_RC"
          if [ "$GETREGEXP_RC" -eq 0 ] && [ -n "$EXTRAHEADER_KEYS_STDOUT" ]; then
            TEMP_GIT_CONFIG=$(mktemp)
            # Ensure temp file cleanup on any exit
            trap 'rm -f "$TEMP_GIT_CONFIG"' EXIT
            # Copy .git/config carefully; if missing, skip unset simulation
            if [ -f .git/config ]; then
              CP_STDERR_FILE=$(mktemp)
              cp .git/config "$TEMP_GIT_CONFIG" 2>"$CP_STDERR_FILE"
              CP_RC=$?
              [ -s "$CP_STDERR_FILE" ] && printf 'cp_stderr: %s\n' "$(cat "$CP_STDERR_FILE")" || true
              rm -f "$CP_STDERR_FILE"
              echo "cp_config_rc=$CP_RC"
              if [ "$CP_RC" -eq 0 ]; then
                while IFS= read -r EXTRAHEADER_KEY; do
                  [ -n "$EXTRAHEADER_KEY" ] || continue
                  git config --file "$TEMP_GIT_CONFIG" --unset-all "$EXTRAHEADER_KEY" 2>&1
                  echo "unset_rc[$EXTRAHEADER_KEY]=$?"
                done <<< "$EXTRAHEADER_KEYS_STDOUT"
              else
                echo "unset_rc=skipped (config copy failed)"
              fi
            else
              echo "config file .git/config missing — skipping unset simulation"
            fi
          elif [ "$GETREGEXP_RC" -ne 0 ]; then
            echo "unset_rc=skipped (git config --get-regexp failed with rc=$GETREGEXP_RC)"
          else
            echo "unset_rc=skipped (no matching key)"
          fi
          echo "--- simulate post-step submodule foreach ---"
          git submodule foreach --recursive 'echo ok' 2>&1; echo "foreach_rc=$?"
          echo "--- .git directory listing (first 40) ---"
          ls -la .git/ 2>&1 | head -n 40; echo "ls_rc=$?"
          echo "--- lock files ---"
          ls -l .git/*.lock 2>&1; echo "lock_ls_rc=$?"
          echo "=== end diagnostic ==="
          exit 0

  # ──────────────────────────────────────────────────────────────────
  # Job 1: End-to-end smoke test — exercises every pipeline phase
  # ──────────────────────────────────────────────────────────────────
  e2e-smoke-test:
    needs: [resolve-version]
    if: ${{ !inputs.skip_e2e && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: e2e-smoke-test-${{ inputs.test_repo || github.repository }}
      cancel-in-progress: true
    outputs:
      test_passed: ${{ steps.verify.outputs.passed }}
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      TEST_REPO: ${{ inputs.test_repo || github.repository }}
      PHASE_TIMEOUT: ${{ inputs.phase_timeout || 30 }}
      PLAN_PHASE_TIMEOUT: ${{ inputs.plan_timeout || inputs.phase_timeout || 60 }}
      REVIEW_TIMEOUT: ${{ inputs.review_timeout || inputs.phase_timeout || 40 }}
      POLL_INTERVAL: 10
      # Wrapper-workflow filename used by the smoke gate to dispatch
      # / poll review_autofix runs. Defaults to the source repo's
      # `internal-review.yml`; override at workflow_dispatch time
      # (input below) when smoke-testing against a TEST_REPO that
      # uses a different wrapper filename.
      REVIEW_WORKFLOW_FILE: ${{ inputs.review_workflow_file || 'internal-review.yml' }}

    steps:
      # Checkout repo at the start so `if: always()` steps (per-phase
      # soft-error analyser invocations, Cleanup test artifacts) can find
      # scripts/ even when an earlier phase exits non-zero. The original
      # "Checkout repository for integration tests" step (Phase 5,
      # ~line 1100) is skipped on early failure, leaving downstream
      # `if: always()` steps with no scripts/ on disk — observed in
      # run 25115169454 where Phase 4b's bait failure cascaded into
      # `python3: can't open file '...scripts/analyze_soft_errors.py'`
      # and `_safe_gh_jq: command not found` in cleanup. The Phase 5
      # checkout is left in place (idempotent re-checkout against
      # `ref: main`).
      - name: Checkout repository (early — needed by analyser & cleanup on early failure)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate prerequisites
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GH_PAT secret is required for E2E tests (GITHUB_TOKEN cannot trigger downstream workflows)"
            exit 1
          fi
          echo "Target repo: ${TEST_REPO}"
          echo "Phase timeout: ${PHASE_TIMEOUT} minutes"
          echo "Review workflow file: ${REVIEW_WORKFLOW_FILE}"
          # Validate REVIEW_WORKFLOW_FILE before it gets passed to
          # `gh workflow run` / Actions API as a positional. If the
          # value starts with `-` (e.g. `--help`), gh would treat it
          # as a flag; if it contains `/` or other unexpected chars,
          # the API path can break. Require a leading alphanumeric
          # character so degenerate basenames like `.yml`, `..yml`,
          # `-x.yml` are rejected at validation time instead of
          # later at dispatch.
          #
          # Use bash's `[[ =~ ]]` rather than `printf | grep -qE` so
          # the match anchors against the WHOLE variable value
          # (including any embedded newlines), not just the first
          # line. The hyphen sits at the end of the character class
          # so it's literal under POSIX ERE.
          if ! [[ "${REVIEW_WORKFLOW_FILE}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*\.yml$ ]]; then
            echo "::error::REVIEW_WORKFLOW_FILE='${REVIEW_WORKFLOW_FILE}' is not a safe basename matching ^[A-Za-z0-9][A-Za-z0-9_.-]*\\.yml\$ — refusing to proceed"
            exit 1
          fi
          # Verify we can access the repo
          gh api "repos/${TEST_REPO}" --jq '.full_name' \
            || { echo "::error::Cannot access ${TEST_REPO}. Check GH_PAT permissions."; exit 1; }

      # Fast-fail the hottest orchestrate-poll regression before the
      # workflow creates live smoke-test resources or waits on long
      # downstream phases.
      - name: "Phase 0a: Hot orchestrate-poll regression guard"
        id: hot-poller-guard
        run: |
          set -euo pipefail
          echo "Running hot orchestrate-poll regression guard..."
          if PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_poll_process.py test_implementation_failed_reissue_preserves_dependency_gates_and_pending_defs; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            HOT_POLLER_RC=$?
            echo "status=exit_code=${HOT_POLLER_RC}" >> "$GITHUB_OUTPUT"
            exit "${HOT_POLLER_RC}"
          fi

      # ── Phase 0: Create the test issue ───────────────────────────
      - name: Create E2E test issue
        id: create-issue
        run: |
          set -euo pipefail
          RUN_ID="${GITHUB_RUN_ID}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "created_after=${TIMESTAMP}" >> "$GITHUB_OUTPUT"

          TITLE="[E2E Smoke Test] Update smoke-test canary (run ${RUN_ID})"
          # Expose TITLE as a step output so Phase 2's plan-poller can scope its
          # workflow_runs query to this specific issue (via display_title — which
          # equals the issue title for issue_comment events). Without this scoping,
          # the poller picks "the latest non-skipped Plan run globally" and is
          # vulnerable to API per_page truncation when many parallel test workflows
          # generate >100 workflow runs in the same window.
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

          # Single source of truth for the canary spec lives in
          # tests/e2e_smoke_canary_spec.txt with `__RUN_ID__` as the
          # placeholder. Phase 4b's pytest reads the same file and
          # substitutes the same way, so the issue body and the
          # downstream byte-for-byte assertion can never drift.
          SPEC_TEMPLATE_PATH="tests/e2e_smoke_canary_spec.txt"
          if [ ! -f "${SPEC_TEMPLATE_PATH}" ]; then
            echo "::error::Canary spec template missing at ${SPEC_TEMPLATE_PATH}"
            exit 1
          fi
          # Substitute RUN_ID. Use the trailing-newline-preserving
          # sentinel trick around `$(...)` because command substitution
          # otherwise strips ALL trailing newlines, which would render
          # the issue body's fenced code block one line shorter than
          # the byte-for-byte spec the pytest verifier asserts. The
          # `; echo X` appends a sentinel char so the trailing `\n`
          # from the spec template survives, and `${var%X}` strips it
          # back off — net result: SPEC_BLOCK ends in `\n` exactly as
          # the template does.
          SPEC_BLOCK=$(sed "s|__RUN_ID__|${RUN_ID}|g" "${SPEC_TEMPLATE_PATH}"; echo X)
          SPEC_BLOCK="${SPEC_BLOCK%X}"
          # Build a single-line printf-quoted form for the example shell
          # command later in the body (newlines as literal `\n`).
          SPEC_PRINTF=$(printf '%s' "${SPEC_BLOCK}" | awk 'BEGIN{ORS="\\n"}1' | sed 's/\\n$//')

          BODY="## Task

          The file \`tests/e2e_smoke_canary.txt\` already exists in the repository. Update its content so it is **exactly** these three lines (no more, no less, with a trailing newline after the final line per POSIX file convention):

          \`\`\`text
          ${SPEC_BLOCK}\`\`\`

          ## How to do it

          Overwrite the entire file. For example, the equivalent shell command would be:

          \`\`\`bash
          printf '${SPEC_PRINTF}\n' > tests/e2e_smoke_canary.txt
          \`\`\`

          ## Constraints

          - **Only** modify \`tests/e2e_smoke_canary.txt\` — do not touch any other file.
          - The file already exists — do **not** create any new directories.
          - Replace the file content completely with the three lines above.
          - Do **not** add comments, headers, or any extra content.
          - This is a fully-specified task — **no clarification is needed**."

          # Create the issue and reuse the returned issue object for both
          # the number and URL instead of immediately re-reading the issue.
          ISSUE_CREATE_RESP="$(gh api "repos/${TEST_REPO}/issues" \
            -f title="${TITLE}" \
            -f body="${BODY}")"
          ISSUE_NUMBER="$(printf '%s' "${ISSUE_CREATE_RESP}" | jq -r '.number')"
          ISSUE_URL="$(printf '%s' "${ISSUE_CREATE_RESP}" | jq -r '.html_url')"

          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Created test issue #${ISSUE_NUMBER}: ${ISSUE_URL}"

      # ── Phase 1: Wait for Clarify → Plan transition ─────────────
      - name: "Phase 1: Wait for clarify to complete"
        id: wait-clarify
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
        run: |
          set -euo pipefail
          echo "Waiting for clarify to finish on issue #${ISSUE_NUMBER}..."
          echo "Inactivity timeout: ${PHASE_TIMEOUT} minutes"
          INACTIVITY_LIMIT=$((PHASE_TIMEOUT * 60))
          LAST_ACTIVITY=$(date +%s)
          PREV_STATE=""
          RATE_LIMIT_BACKOFF=0
          . ./scripts/comprehensive_test_and_release_gh_api.sh

          # Robust workflow run-ID capture — retries on empty results to ride out
          # the brief race window where the matching run isn't yet indexed by the
          # API, and widens pagination to per_page=100 in case of high concurrent
          # workflow run volume on the target repo. Returns the run id on stdout
          # (empty string if all attempts fail).
          capture_run_id() {
            local name_re="$1"
            local result=""
            local _attempt
            for _attempt in 1 2 3 4 5; do
              result=$(gh_api_safe_print "repos/${TEST_REPO}/actions/runs?per_page=100&created=>${{ steps.create-issue.outputs.created_after }}" \
                --jq "[.workflow_runs[] | select(.name | test(\"${name_re}\"; \"i\")) | select(.conclusion != \"skipped\")] | sort_by(.created_at) | last | .id // empty" || echo "")
              if [ -n "$result" ] && [ "$result" != "null" ]; then
                printf '%s' "$result"
                return 0
              fi
              sleep 2
            done
            printf ''
            return 0
          }

          while true; do
            NOW=$(date +%s)
            IDLE=$((NOW - LAST_ACTIVITY))

            LABELS=$(gh_api_safe_print "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" \
              --jq '[.labels[].name] | join(",")' || echo "")

            # If rate-limited, skip this cycle (don't corrupt state)
            if [ "$RATE_LIMIT_BACKOFF" -gt 0 ] && [ -z "$LABELS" ]; then
              continue
            fi

            COMMENT_COUNT=$(gh_api_safe_print "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/comments" \
              --jq 'length' || echo "0")

            CUR_STATE="labels=${LABELS};comments=${COMMENT_COUNT}"

            # Reset inactivity timer on any state change
            if [ "$CUR_STATE" != "$PREV_STATE" ]; then
              if [ -n "$PREV_STATE" ]; then
                echo "  ↻ Activity detected (state changed) — resetting inactivity timer"
              fi
              LAST_ACTIVITY=$NOW
              IDLE=0
              PREV_STATE="$CUR_STATE"
            fi

            # Clarify succeeded if we see planning or awaiting-approval
            if echo "$LABELS" | grep -qE 'ai:planning|ai:awaiting-approval'; then
              echo "✓ Clarify phase completed — issue moved to planning"
              CLARIFY_RUN_ID=$(capture_run_id "Clarif")
              echo "run_id=${CLARIFY_RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Check for failure: look for error comments from bot
            LAST_BOT_COMMENT=$(gh_api_safe_print "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/comments?per_page=5&direction=desc" \
              --jq '[.[] | select(.user.login == "github-actions[bot]")] | .[0].body // ""' || echo "")
            if echo "$LAST_BOT_COMMENT" | grep -qi "failed\|error\|clarification.*needed"; then
              if echo "$LAST_BOT_COMMENT" | grep -qi "clarification.*needed\|NEEDS_CLARIFICATION"; then
                echo "::error::Clarify phase requested human clarification — test issue may not be clear enough"
                echo "status=clarification_needed" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi

            # Inactivity timeout
            if [ $IDLE -ge $INACTIVITY_LIMIT ]; then
              echo "::error::Clarify phase stalled — no activity for ${PHASE_TIMEOUT} minutes"
              echo "status=timeout" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            REMAINING=$(( (INACTIVITY_LIMIT - IDLE + 59) / 60 ))
            echo "  ... idle ${IDLE}s (timeout in ~${REMAINING}m) — labels: ${LABELS:-none}"
            sleep "$POLL_INTERVAL"
          done

      # Per-phase soft-error analysis: clarify
      - name: "Phase 1b: Soft-error analyser (clarify)"
        if: always() && steps.wait-clarify.outputs.run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            clarify=${{ steps.wait-clarify.outputs.run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-clarify
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

      # ── Phase 2: Wait for Plan to complete ──────────────────────
      - name: "Phase 2: Wait for plan to complete"
        id: wait-plan
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
          # ISSUE_TITLE scopes the workflow_runs query to OUR Plan run via
          # display_title (which equals the issue title for issue_comment events).
          # See create-issue step for rationale.
          ISSUE_TITLE: ${{ steps.create-issue.outputs.title }}
        run: |
          set -euo pipefail
          echo "Waiting for plan to finish on issue #${ISSUE_NUMBER}..."
          echo "Inactivity timeout: ${PLAN_PHASE_TIMEOUT} minutes"
          INACTIVITY_LIMIT=$((PLAN_PHASE_TIMEOUT * 60))
          LAST_ACTIVITY=$(date +%s)
          PREV_STATE=""
          RATE_LIMIT_BACKOFF=0

          if [ -z "${ISSUE_TITLE}" ]; then
            echo "::error::Missing issue title for Plan run scoping"
            echo "status=plan_failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          . ./scripts/comprehensive_test_and_release_gh_api.sh

          fetch_plan_runs_json() {
            gh_api_safe_print "repos/${TEST_REPO}/actions/runs?per_page=100&created=>${{ steps.create-issue.outputs.created_after }}"
          }

          latest_scoped_run_field() {
            local name_re="$1"
            local field="$2"
            local runs_json=""
            runs_json=$(fetch_plan_runs_json || echo "")
            [ -n "$runs_json" ] || return 1
            printf '%s' "$runs_json" \
              | jq -r --arg name_re "$name_re" --arg title "$ISSUE_TITLE" --arg field "$field" '[.workflow_runs[] | select(.name | test($name_re; "i")) | select(.display_title == $title) | select(.conclusion != "skipped")] | sort_by(.created_at) | last | .[$field] // empty' 2>/dev/null
          }

          # Robust workflow run-ID capture — retries on empty results to ride out
          # the brief race window where the matching run isn't yet indexed by the
          # API, and widens pagination to per_page=100 in case of high concurrent
          # workflow run volume on the target repo. Filters by display_title so we
          # only pick up the Plan run that fired for OUR issue (display_title for
          # issue_comment events is the issue title). Returns the run id on stdout
          # (empty string if all attempts fail).
          capture_run_id() {
            local name_re="$1"
            local result=""
            local _attempt
            for _attempt in 1 2 3 4 5; do
              result=$(latest_scoped_run_field "$name_re" "id" || echo "")
              if [ -n "$result" ] && [ "$result" != "null" ]; then
                printf '%s' "$result"
                return 0
              fi
              sleep 2
            done
            printf ''
            return 0
          }

          while true; do
            NOW=$(date +%s)
            IDLE=$((NOW - LAST_ACTIVITY))

            LABELS=$(gh_api_safe_print "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" \
              --jq '[.labels[].name] | join(",")' || echo "")

            # If rate-limited, skip this cycle (don't corrupt state)
            if [ "$RATE_LIMIT_BACKOFF" -gt 0 ] && [ -z "$LABELS" ]; then
              continue
            fi

            COMMENTS_JSON=$(gh_api_safe_print "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100&direction=desc" || echo "[]")
            COMMENT_COUNT=$(echo "${COMMENTS_JSON}" | jq 'length' 2>/dev/null || echo "0")
            # Track latest comment updated_at so progress comment edits reset the timer
            LATEST_COMMENT_UPDATED=$(echo "${COMMENTS_JSON}" | jq -r '[.[].updated_at] | sort | last // ""' 2>/dev/null || echo "")

            # Also check the plan workflow run status as an activity signal.
            # Filter by display_title (== issue title for issue_comment events)
            # so we pick OUR issue's Plan run, not any concurrent Plan run from
            # a parallel test job. Bumped per_page from 50 to 100 (the API max)
            # so the query still surfaces our run when the release window has
            # high workflow-run volume; v1.13.5's smoke test broke when our
            # Plan run fell to position 51 in the unfiltered list and was
            # truncated off the per_page=50 response.
            PLAN_RUN_STATUS=$(latest_scoped_run_field "Plan" "status" || echo "")
            if [ -z "$PLAN_RUN_STATUS" ] || [ "$PLAN_RUN_STATUS" = "null" ]; then
              PLAN_RUN_STATUS="unknown"
            fi

            CUR_STATE="labels=${LABELS};comments=${COMMENT_COUNT};comment_updated=${LATEST_COMMENT_UPDATED};plan_run=${PLAN_RUN_STATUS}"

            # Reset inactivity timer on any state change
            if [ "$CUR_STATE" != "$PREV_STATE" ]; then
              if [ -n "$PREV_STATE" ]; then
                echo "  ↻ Activity detected (state changed) — resetting inactivity timer"
              fi
              LAST_ACTIVITY=$NOW
              IDLE=0
              PREV_STATE="$CUR_STATE"
            fi

            if echo "$LABELS" | grep -q 'ai:awaiting-approval'; then
              echo "✓ Plan phase completed — awaiting approval"
              PLAN_RUN_ID=$(capture_run_id "Plan")
              echo "run_id=${PLAN_RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Check for auto-approved (if AUTO_IMPLEMENT_ON_CLEAR_PLAN is on)
            if echo "$LABELS" | grep -q 'ai:implementing'; then
              echo "✓ Plan phase completed with auto-approval — already implementing"
              PLAN_RUN_ID=$(capture_run_id "Plan")
              echo "run_id=${PLAN_RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "status=auto_approved" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Detect plan workflow failure (completed but no expected label)
            if [ "$PLAN_RUN_STATUS" = "completed" ]; then
              # Plan finished but didn't produce awaiting-approval or implementing
              # Give one more cycle in case labels are delayed
              sleep "$POLL_INTERVAL"
              LABELS_RECHECK=$(gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" \
                --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
              if echo "$LABELS_RECHECK" | grep -qE 'ai:awaiting-approval|ai:implementing'; then
                continue
              fi
              # Check if other Plan runs for OUR issue are still queued or
              # in-progress. The "completed" run may be a spurious trigger
              # (e.g. a non-/answer comment that caused the job to be
              # skipped while the real Plan run is still working). Filter by
              # display_title (== issue title for issue_comment events) so we
              # only count Plan runs for OUR issue, and use per_page=100
              # (the API max) so high concurrent workflow-run volume in the
              # release window doesn't truncate our run off the response.
              _plan_runs_json_valid() {
                printf '%s' "$1" \
                  | jq -se 'length == 1 and (.[0] | type == "object" and (.workflow_runs | type == "array"))' \
                  >/dev/null 2>&1
              }
              PLAN_RUNS_JSON=$(fetch_plan_runs_json || echo "")
              if ! _plan_runs_json_valid "$PLAN_RUNS_JSON"; then
                echo "  ⏳ Unable to confirm concurrent Plan runs yet — retrying"
                sleep "$POLL_INTERVAL"
                continue
              fi
              OTHER_ACTIVE_PLAN_RUNS=0
              if _OTHER_ACTIVE_PLAN_RUNS=$(printf '%s' "$PLAN_RUNS_JSON" \
                | jq -r --arg title "${ISSUE_TITLE}" '[.workflow_runs[] | select(.name | test("Plan"; "i")) | select(.display_title == $title) | select(.status == "in_progress" or .status == "queued")] | length' 2>/dev/null); then
                OTHER_ACTIVE_PLAN_RUNS="$_OTHER_ACTIVE_PLAN_RUNS"
              fi
              unset _OTHER_ACTIVE_PLAN_RUNS
              if ! [[ "$OTHER_ACTIVE_PLAN_RUNS" =~ ^[0-9]+$ ]]; then
                OTHER_ACTIVE_PLAN_RUNS=0
              fi
              if [ "$OTHER_ACTIVE_PLAN_RUNS" -gt 0 ]; then
                echo "  ⏳ Found ${OTHER_ACTIVE_PLAN_RUNS} other active Plan run(s) — waiting for the real run to finish"
                continue
              fi
              echo "::error::Plan workflow completed but issue lacks expected labels (current: ${LABELS_RECHECK:-none})"
              echo "status=plan_failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            # Inactivity timeout
            if [ $IDLE -ge $INACTIVITY_LIMIT ]; then
              echo "::error::Plan phase stalled — no activity for ${PLAN_PHASE_TIMEOUT} minutes"
              echo "status=timeout" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            REMAINING=$(( (INACTIVITY_LIMIT - IDLE + 59) / 60 ))
            echo "  ... idle ${IDLE}s (timeout in ~${REMAINING}m) — plan_run: ${PLAN_RUN_STATUS}, labels: ${LABELS:-none}"
            sleep "$POLL_INTERVAL"
          done

      # Per-phase soft-error analysis: plan
      - name: "Phase 2b: Soft-error analyser (plan)"
        if: always() && steps.wait-plan.outputs.run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            plan=${{ steps.wait-plan.outputs.run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-plan
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

      # ── Phase 3: Approve and wait for implementation ────────────
      - name: "Phase 3a: Approve the plan"
        id: approve
        if: steps.wait-plan.outputs.status == 'success'
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
        run: |
          set -euo pipefail
          echo "Posting /approved on issue #${ISSUE_NUMBER}..."
          gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/comments" \
            -f body="/approved

          E2E smoke test auto-approval (run ${GITHUB_RUN_ID})."
          echo "approved_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "✓ Posted /approved comment"

      - name: "Phase 3b: Wait for PR creation (implement phase)"
        id: wait-implement
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
        run: |
          set -euo pipefail
          echo "Waiting for implementation PR on issue #${ISSUE_NUMBER}..."
          echo "Inactivity timeout: ${PHASE_TIMEOUT} minutes"
          INACTIVITY_LIMIT=$((PHASE_TIMEOUT * 60))
          LAST_ACTIVITY=$(date +%s)
          PHASE_START=$(date +%s)
          # Grace period before declaring "all runs completed" failure.
          # The /approved comment needs time to trigger the implement
          # workflow via webhook — without this, the poller can see a
          # stale completed implement run (e.g. from AUTO_IMPLEMENT_ON_CLEAR_PLAN
          # auto-approval) and exit before the real run even starts.
          MIN_GRACE_SECONDS=60
          PREV_STATE=""
          RATE_LIMIT_BACKOFF=0
          . ./scripts/comprehensive_test_and_release_gh_api.sh

          # Robust workflow run-ID capture — retries on empty results to ride out
          # the brief race window where the matching run isn't yet indexed by the
          # API, and widens pagination to per_page=100 in case of high concurrent
          # workflow run volume on the target repo. Returns the run id on stdout
          # (empty string if all attempts fail).
          # Use approval timestamp to filter implement runs so we exclude
          # stale runs triggered by AUTO_IMPLEMENT_ON_CLEAR_PLAN auto-approval
          # during the plan phase. Fall back to issue creation time if Phase 3a
          # was skipped (plan auto-approved directly to ai:implementing).
          IMPL_CREATED_AFTER="${{ steps.approve.outputs.approved_at || steps.create-issue.outputs.created_after }}"

          capture_run_id() {
            local name_re="$1"
            local result=""
            local _attempt
            for _attempt in 1 2 3 4 5; do
              result=$(gh_api_safe_print "repos/${TEST_REPO}/actions/runs?per_page=100&created=>${IMPL_CREATED_AFTER}" \
                --jq "[.workflow_runs[] | select(.name | test(\"${name_re}\"; \"i\")) | select(.conclusion != \"skipped\")] | sort_by(.created_at) | last | .id // empty" || echo "")
              if [ -n "$result" ] && [ "$result" != "null" ]; then
                printf '%s' "$result"
                return 0
              fi
              sleep 2
            done
            printf ''
            return 0
          }

          while true; do
            NOW=$(date +%s)
            IDLE=$((NOW - LAST_ACTIVITY))

            # Search for PRs that reference this issue
            # The implement workflow creates branch ai/issue-<N>
            PR_NUMBER=$(gh_api_safe_print "repos/${TEST_REPO}/pulls?state=open&head=${TEST_REPO%%/*}:ai/issue-${ISSUE_NUMBER}&per_page=1" \
              --jq '.[0].number // empty' || echo "")

            # If rate-limited, skip this cycle (don't corrupt state)
            if [ "$RATE_LIMIT_BACKOFF" -gt 0 ] && [ -z "$PR_NUMBER" ]; then
              sleep "$POLL_INTERVAL"
              continue
            fi

            if [ -n "$PR_NUMBER" ]; then
              echo "✓ Implementation PR #${PR_NUMBER} created"
              IMPL_RUN_ID=$(capture_run_id "Implement")
              echo "run_id=${IMPL_RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Track labels and implement workflow run status for activity detection
            LABELS=$(gh_api_safe_print "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" \
              --jq '[.labels[].name] | join(",")' || echo "")

            # Fetch all implement runs once and extract metrics from the response
            IMPL_RUNS_JSON=$(gh_api_safe_print "repos/${TEST_REPO}/actions/runs?per_page=50&created=>${IMPL_CREATED_AFTER}" || echo "")
            if [ -n "$IMPL_RUNS_JSON" ]; then
              IMPL_RUN_TOTAL=$(echo "$IMPL_RUNS_JSON" | jq '[.workflow_runs[] | select(.name | test("Implement"; "i")) | select(.conclusion != "skipped")] | length' 2>/dev/null || echo "0")
              IMPL_RUN_IN_PROGRESS=$(echo "$IMPL_RUNS_JSON" | jq '[.workflow_runs[] | select(.name | test("Implement"; "i")) | select(.conclusion != "skipped") | select(.status != "completed")] | length' 2>/dev/null || echo "0")
              IMPL_RUN_STATUS=$(echo "$IMPL_RUNS_JSON" | jq -r '[.workflow_runs[] | select(.name | test("Implement"; "i")) | select(.conclusion != "skipped")] | sort_by(.created_at) | last | .status // "unknown"' 2>/dev/null || echo "unknown")
              IMPL_RUN_ID_LATEST=$(echo "$IMPL_RUNS_JSON" | jq -r '[.workflow_runs[] | select(.name | test("Implement"; "i")) | select(.conclusion != "skipped")] | sort_by(.created_at) | last | .id // empty' 2>/dev/null || echo "")
            else
              IMPL_RUN_TOTAL="0"; IMPL_RUN_IN_PROGRESS="0"; IMPL_RUN_STATUS="unknown"; IMPL_RUN_ID_LATEST=""
            fi

            # ── Adaptive signals: step name + commit count ──
            IMPL_STEP_NAME=""
            if [ -n "$IMPL_RUN_ID_LATEST" ]; then
              IMPL_STEP_NAME=$(gh_api_safe_print "repos/${TEST_REPO}/actions/runs/${IMPL_RUN_ID_LATEST}/jobs?per_page=10" \
                --jq '[.jobs[].steps[] | select(.status == "in_progress")] | last | .name // ""' || echo "")
            fi

            IMPL_BRANCH="ai/issue-${ISSUE_NUMBER}"
            COMMIT_COUNT=$(gh_api_safe_print "repos/${TEST_REPO}/commits?sha=${IMPL_BRANCH}&per_page=1" \
              --jq '.[0].sha // ""' || echo "")

            CUR_STATE="labels=${LABELS};impl_run=${IMPL_RUN_STATUS};total=${IMPL_RUN_TOTAL};active=${IMPL_RUN_IN_PROGRESS};step=${IMPL_STEP_NAME};head=${COMMIT_COUNT}"

            # Reset inactivity timer on any state change
            if [ "$CUR_STATE" != "$PREV_STATE" ]; then
              if [ -n "$PREV_STATE" ]; then
                echo "  ↻ Activity detected (state changed) — resetting inactivity timer"
              fi
              LAST_ACTIVITY=$NOW
              IDLE=0
              PREV_STATE="$CUR_STATE"
            fi

            # Detect implement workflow failure — only if ALL runs have completed
            # AND enough time has elapsed for the real implement workflow to start.
            # Without the grace period, stale completed runs (e.g. from
            # AUTO_IMPLEMENT_ON_CLEAR_PLAN auto-approval during the plan phase)
            # cause a false failure before the /approved-triggered run starts.
            ELAPSED_SECS=$((NOW - PHASE_START))
            if [ "$IMPL_RUN_TOTAL" -gt 0 ] && [ "$IMPL_RUN_IN_PROGRESS" -eq 0 ] && [ "$ELAPSED_SECS" -ge "$MIN_GRACE_SECONDS" ]; then
              # All implement runs finished but no PR appeared — give one more cycle
              sleep "$POLL_INTERVAL"
              PR_RECHECK=$(gh api "repos/${TEST_REPO}/pulls?state=open&head=${TEST_REPO%%/*}:ai/issue-${ISSUE_NUMBER}&per_page=1" \
                --jq '.[0].number // empty' 2>/dev/null || echo "")
              if [ -n "$PR_RECHECK" ]; then
                continue
              fi
              echo "::error::All ${IMPL_RUN_TOTAL} implement workflow run(s) completed but no PR was created"
              echo "status=implement_failed" >> "$GITHUB_OUTPUT"
              exit 1
            elif [ "$IMPL_RUN_TOTAL" -gt 0 ] && [ "$IMPL_RUN_IN_PROGRESS" -eq 0 ] && [ "$ELAPSED_SECS" -lt "$MIN_GRACE_SECONDS" ]; then
              echo "  ⏳ All ${IMPL_RUN_TOTAL} implement run(s) completed but grace period active (${ELAPSED_SECS}s/${MIN_GRACE_SECONDS}s) — waiting for /approved-triggered run to start"
            fi

            # Inactivity timeout
            if [ $IDLE -ge $INACTIVITY_LIMIT ]; then
              echo "::error::Implement phase stalled — no activity for ${PHASE_TIMEOUT} minutes"
              echo "status=timeout" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            REMAINING=$(( (INACTIVITY_LIMIT - IDLE + 59) / 60 ))
            echo "  ... idle ${IDLE}s (timeout in ~${REMAINING}m) — impl_runs: ${IMPL_RUN_TOTAL} total, ${IMPL_RUN_IN_PROGRESS} active, latest: ${IMPL_RUN_STATUS}, labels: ${LABELS:-none}"
            sleep "$POLL_INTERVAL"
          done

      # ── Phase 3c: Inject editor "bait" commit ──────────────────
      # Forces the review/autofix pipeline to exercise the editor's
      # change-applying path. The smoke-test issue body mandates the canary
      # be EXACTLY three lines; we append a 4th obviously-removable line
      # which reviewers will flag (low-reasoning smoke override is sufficient
      # — the issue text spells out the requirement) and the editor must
      # trim. The
      # post-review verification step then confirms the bait is gone and
      # the editor produced at least one commit on top of the bait. This
      # turns Phase 4 from "review found no issues" into a real exercise of
      # the reviewer→editor→commit pipeline.
      #
      # Gate-bypass note: the canary file is `.txt` and the smoke PR is
      # tiny (≤10 additions/deletions), so review_autofix's deterministic
      # skip would normally fire (doc-only OR small-diff branches in
      # AUTOFIX_GATE). The next step applies the `force-review` label to
      # the PR so the gate's override path kicks in and the full reviewer
      # → editor pipeline runs. Without this label, the gate would skip
      # review and the bait would never be removed.

      # Per-phase soft-error analysis: implement
      - name: "Phase 3b2: Soft-error analyser (implement)"
        if: always() && steps.wait-implement.outputs.run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            implement=${{ steps.wait-implement.outputs.run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-implement
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

      - name: "Phase 3b1: Apply force-review label to smoke PR"
        id: force-review-label
        if: steps.wait-implement.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.wait-implement.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Create the label if missing (404 is non-fatal; addLabels below
          # will fail-soft and the gate will skip — verify-bait-removed
          # then surfaces the regression as a hard failure).
          gh api "repos/${TEST_REPO}/labels/force-review" >/dev/null 2>&1 || \
            gh api "repos/${TEST_REPO}/labels" \
              -f name="force-review" \
              -f color="d93f0b" \
              -f description="Bypass review_autofix deterministic skip" \
              >/dev/null 2>&1 || true
          gh api "repos/${TEST_REPO}/issues/${PR_NUMBER}/labels" \
            -f "labels[]=force-review" >/dev/null 2>&1 \
            || echo "::warning::Could not apply force-review label to PR #${PR_NUMBER}; gate may skip review (verify-bait-removed will surface this)"

      - name: "Phase 3c: Inject editor bait commit on PR branch"
        id: inject-bait
        if: steps.wait-implement.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.wait-implement.outputs.pr_number }}
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
        run: |
          set -euo pipefail
          BRANCH="ai/issue-${ISSUE_NUMBER}"
          BAIT_MARKER="E2E_EDITOR_BAIT_${GITHUB_RUN_ID}"
          CANARY_PATH="tests/e2e_smoke_canary.txt"

          # Race protection: wait-implement reports the impl run completed
          # but `gh api repos/.../contents/...?ref=BRANCH` reads can briefly
          # return the pre-impl blob if the API hasn't indexed the
          # implement push yet. Verify the PR head SHA is stable across
          # two reads ≥3s apart before we PUT the bait commit; otherwise
          # we'd race the implement push and inject the bait against a
          # stale parent SHA, getting a 409 conflict from the contents
          # PUT and skipping the editor exercise.
          for stability_attempt in 1 2 3 4 5; do
            HEAD_A=$(gh api "repos/${TEST_REPO}/pulls/${PR_NUMBER}" --jq '.head.sha // ""' 2>/dev/null || echo "")
            sleep 3
            HEAD_B=$(gh api "repos/${TEST_REPO}/pulls/${PR_NUMBER}" --jq '.head.sha // ""' 2>/dev/null || echo "")
            if [ -n "${HEAD_A}" ] && [ "${HEAD_A}" = "${HEAD_B}" ]; then
              echo "  ✓ PR head SHA stable at ${HEAD_A:0:7} (attempt ${stability_attempt})"
              break
            fi
            echo "  … PR head SHA still moving (${HEAD_A:0:7} -> ${HEAD_B:0:7}); attempt ${stability_attempt}/5"
          done

          # Fail-fast guard: if the PR is already closed/merged, the
          # bait push will land on the branch but `pull_request:
          # synchronize` does NOT fire for closed PRs, so no
          # review_autofix run will ever see the bait commit. Without
          # this guard, wait-review (Phase 4) sits for the full
          # REVIEW_TIMEOUT (30m) before exiting with the misleading
          # `no_review_triggered` status — which sends investigators
          # chasing a fan-out bug instead of the real cause.
          #
          # Run 25150961704 was the canonical failure: PR auto-merged
          # at +50s by the deterministic-skip-merge job, bait pushed
          # at +113s, then 30 minutes of polling for a workflow that
          # could never come. The implement workflow now stamps E2E
          # PRs with `force-review` + `e2e-smoke-test` at creation
          # time to suppress that auto-merge — this guard exists as
          # defense-in-depth in case (a) the labels fail to apply,
          # (b) someone manually merges the PR mid-test, or (c) a
          # future auto-merge path is added that doesn't honor the
          # e2e-smoke-test label.
          PR_META=$(gh api "repos/${TEST_REPO}/pulls/${PR_NUMBER}" 2>/dev/null || echo "")
          PR_STATE=$(printf '%s' "${PR_META}" | jq -r '.state // ""' 2>/dev/null || echo "")
          PR_MERGED=$(printf '%s' "${PR_META}" | jq -r '.merged // false' 2>/dev/null || echo "false")
          if [ "${PR_STATE}" = "closed" ] || [ "${PR_MERGED}" = "true" ]; then
            PR_MERGED_AT=$(printf '%s' "${PR_META}" | jq -r '.merged_at // ""' 2>/dev/null || echo "")
            PR_CLOSED_AT=$(printf '%s' "${PR_META}" | jq -r '.closed_at // ""' 2>/dev/null || echo "")
            echo "::error::PR #${PR_NUMBER} is already ${PR_STATE} (merged=${PR_MERGED}, merged_at=${PR_MERGED_AT}, closed_at=${PR_CLOSED_AT}) before bait could be injected — pushes to the head branch will not fan out a pull_request synchronize event, so no review_autofix run will be triggered. Likely cause: review_autofix.yml's deterministic-skip-merge job auto-merged the PR before the e2e gate's force-review/e2e-smoke-test labels took effect (see implement.yml steps 'Ensure E2E smoke-test labels exist on repo' / 'Backstop E2E smoke-test labels on PR after creation' and review_autofix.yml 'Enable auto-merge on PR' step's e2e-smoke-test guard)."
            echo "status=pr_already_closed" >> "$GITHUB_OUTPUT"
            # Fail fast. Phase 4 (wait-review), Phase 4b (verify-bait-
            # removed), Phase 5 (orchestrator-scripts), Phase 6
            # (review-blocked sim) and Phase 7 (cancel_on_pr_close)
            # all default to `if: success()` and will be skipped from
            # this point — appropriate, since their preconditions
            # (open PR / live bait commit / writeable head branch)
            # no longer hold once the PR is closed/merged. Exit 0
            # would let those phases run on a sabotaged main flow,
            # and on a busy repo wait-review's legacy-fallback could
            # latch onto an unrelated review_autofix run on the
            # branch and falsely report success. The `Verify all
            # phases passed` summary is now `if: always()`, so it
            # still consumes this output, hits the `pr_already_closed`
            # special-case, and reports the correct cause regardless
            # of which exit code we use here. (Copilot review #1+#2
            # on this PR: the original commit's exit 1 was right;
            # the prior fixup's exit 0 only made sense before
            # `if: always()` landed on verify.)
            exit 1
          fi

          echo "Fetching current canary blob on branch ${BRANCH}..."
          # The implementer should have set the canary to exactly 3 lines.
          # We fetch its SHA + decoded content so we can PUT a 4-line
          # version that adds one removable bait line at the end.
          BLOB_JSON=$(gh api "repos/${TEST_REPO}/contents/${CANARY_PATH}?ref=${BRANCH}" 2>/dev/null || echo "")
          if [ -z "${BLOB_JSON}" ] || [ "${BLOB_JSON}" = "null" ]; then
            echo "::warning::Could not fetch ${CANARY_PATH} from branch ${BRANCH} — skipping bait injection (editor exercise not enforced this run)"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BLOB_SHA=$(echo "${BLOB_JSON}" | jq -r '.sha // empty')
          BLOB_CONTENT=$(echo "${BLOB_JSON}" | jq -r '.content // empty' | tr -d '\n' | base64 -d 2>/dev/null || echo "")
          if [ -z "${BLOB_SHA}" ]; then
            echo "::warning::Canary blob has no SHA — skipping bait injection"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build new content: a multi-line corruption that violates the
          # linked issue's spec on every line, plus extra noise lines. The
          # editor must restore the file to the issue's exact 3-line target
          # — a single-line removal is no longer sufficient. This stresses
          # more of the production review pipeline (reviewer consensus on
          # multiple findings, multi-hunk apply_patch, post-edit validation)
          # so failures here track real production-class regressions
          # (Serena/MCP breakage, prompt-template drift, parser bugs)
          # rather than just "did the model strip one line."
          #
          # The `# E2E_EDITOR_BAIT_<run>:` marker is preserved verbatim so
          # the smoke override in scripts/review_apply_fixes.sh still
          # triggers (it greps for `^# E2E_EDITOR_BAIT_[0-9]+:`).
          NEW_CONTENT="status: BROKEN_BY_E2E_BAIT_${GITHUB_RUN_ID}"$'\n'
          NEW_CONTENT+="run_id: WRONG_VALUE_SHOULD_BE_${GITHUB_RUN_ID}"$'\n'
          NEW_CONTENT+="updated-by: e2e-bait-injector"$'\n'
          NEW_CONTENT+="extra: this line violates the issue spec"$'\n'
          NEW_CONTENT+="also: another line that must be removed"$'\n'
          NEW_CONTENT+="# ${BAIT_MARKER}: canary corrupted; restore to linked issue spec (smoke gate)"$'\n'
          NEW_B64=$(printf '%s' "${NEW_CONTENT}" | base64 -w0)

          echo "Pushing bait commit to ${BRANCH}..."
          # NOTE: this commit message is deliberately prefixed with
          # `[E2E Smoke Test]`, NEVER `[ai-autofix]`. review_autofix.yml's
          # gate (lines ~297-329) only fires `AUTOFIX_SKIP_SELF_TRIGGERED`
          # when BOTH conditions hold:
          #   (a) PR-head commit subject starts with `[ai-autofix]`, AND
          #   (b) author/committer login equals AUTOFIX_BOT_LOGIN (default
          #       `codex`).
          # Our prefix fails (a) outright, so the skip path can never
          # match this commit. Multiple PR-review rounds have flagged
          # this as a HIGH-severity risk; the comment exists so future
          # reviewers see the explicit guarantee and stop re-raising it.
          if ! gh api -X PUT "repos/${TEST_REPO}/contents/${CANARY_PATH}" \
              -f message="[E2E Smoke Test] inject editor bait line (run ${GITHUB_RUN_ID})" \
              -f content="${NEW_B64}" \
              -f sha="${BLOB_SHA}" \
              -f branch="${BRANCH}" >/tmp/bait_resp.json 2>&1; then
            echo "::warning::Bait commit failed; editor exercise will not be enforced"
            cat /tmp/bait_resp.json >&2 || true
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BAIT_SHA=$(jq -r '.commit.sha // empty' /tmp/bait_resp.json)
          if [ -z "${BAIT_SHA}" ]; then
            echo "::warning::Bait commit response missing SHA"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "✓ Bait commit ${BAIT_SHA:0:7} pushed to ${BRANCH}"
          # Diagnostic dump of the Contents-API response. Run-25147636528
          # surfaced a failure mode where the bait push succeeded
          # (commit + PR head pointer updated) but no pull_request
          # synchronize event fanned out, so no review_autofix run was
          # ever created — masquerading as a bait-removal failure
          # downstream. Logging the API author/committer/url makes it
          # cheap to verify the push wasn't silently demoted (e.g. to
          # a token whose identity can't trigger workflows) without an
          # out-of-band gh api call.
          jq '{commit_sha: .commit.sha, commit_url: .commit.html_url, author: .commit.author.name, committer: .commit.committer.name, verification: .commit.verification.verified, content_url: .content.html_url} | with_entries(select(.value != null))' /tmp/bait_resp.json 2>/dev/null \
            || echo "  (could not parse bait_resp.json)"
          echo "status=injected" >> "$GITHUB_OUTPUT"
          echo "bait_sha=${BAIT_SHA}" >> "$GITHUB_OUTPUT"

          # Emit the bait commit's timestamp (ISO-8601 UTC, e.g.
          # 2026-06-10T00:11:43Z) so wait-review (Phase 4) can recognise
          # the in-flight PR-open review run as a valid bait review.
          # That run is TRIGGERED on the pre-bait head SHA, so its
          # run-level head_sha never equals BAIT_SHA and the strict
          # head_sha pin excludes it — yet because review_autofix.yml
          # checks out the live branch tip at runtime, a review still
          # running when the bait lands actually reviews+edits the bait
          # tree (confirmed by INITIAL_HEAD_SHA=<bait> in its log). The
          # only thing distinguishing it from the historical
          # stale-implement-review false match (run 25147636528, which
          # COMPLETED before the bait) is whether it was still in flight
          # at bait-injection time. wait-review uses this timestamp as
          # the lower bound: a run with created_at <= bait_created_at
          # and updated_at >= bait_created_at was in flight when the
          # bait landed and is an acceptable bait review; a run that
          # finished before the bait is not. committer.date is the
          # GitHub-assigned push time for the Contents-API commit.
          # Invalid/malformed values are cleared to empty so wait-review
          # falls back to the strict head_sha pin instead of broadening
          # leg (b) with a non-timestamp placeholder.
          BAIT_CREATED_AT=$(jq -r '.commit.committer.date // .commit.author.date // empty | select(type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))' /tmp/bait_resp.json 2>/dev/null || echo "")
          if [ -z "${BAIT_CREATED_AT}" ]; then
            echo "::warning::bait_created_at is empty despite bait injection; wait-review leg (b) will be inert (strict head_sha pin only)"
          fi
          echo "bait_created_at=${BAIT_CREATED_AT}" >> "$GITHUB_OUTPUT"

          # Defense-in-depth for "Bug B" (PR #1811): the Contents-API PUT
          # above sometimes succeeds (commit + PR head pointer updated)
          # without GitHub fanning out a `pull_request: synchronize`
          # event, so the wrapper workflow (${REVIEW_WORKFLOW_FILE},
          # default internal-review.yml) is never auto-triggered and
          # wait-review (Phase 4) ages out at REVIEW_TIMEOUT minutes.
          # Run 25204168842 was the most recent confirmed occurrence.
          # Explicitly dispatch ${REVIEW_WORKFLOW_FILE} against the PR
          # branch so a review run with head_sha=BAIT_SHA always exists
          # — workflow_dispatch resolves the ref's tip SHA at dispatch
          # time, and we just pushed the bait commit there, so the
          # dispatched run carries head_sha=BAIT_SHA and is matched by
          # wait-review's pinned filter without any extra logic.
          # The dispatch is keyed on a separate concurrency group (in
          # the source repo's internal-review.yml at lines 48-50,
          # group `internal-review-dispatch-pr-N`; consumer repos with
          # a renamed wrapper own the equivalent guard there), so if
          # the synchronize event ever DID fire, both runs are
          # serialised downstream by review_autofix.yml's `pr-autofix-N`
          # group rather than racing — only one autofix proceeds.
          # Fail-soft: if dispatch fails, the synchronize event (when
          # it fires) still serves as the primary path; if neither
          # fires, wait-review surfaces no_review_triggered as before.
          # --repo "${TEST_REPO}" is required because this job supports
          # dispatching E2E against an arbitrary `inputs.test_repo`;
          # without it, `gh workflow run` would target the default repo
          # from the checkout/CLI context (shubhodeep1/coding-workflows
          # itself, per the early checkout at line 316) instead of the
          # repo we just pushed the bait commit to, leaving Phase 4
          # still vulnerable to no_review_triggered.
          if gh workflow run "${REVIEW_WORKFLOW_FILE}" \
              --repo "${TEST_REPO}" \
              --ref "${BRANCH}" \
              -f pr_number="${PR_NUMBER}" >/tmp/dispatch_resp.txt 2>&1; then
            echo "✓ Dispatched ${REVIEW_WORKFLOW_FILE} on ${BRANCH} for PR #${PR_NUMBER} (Bug B fallback)"
          else
            echo "::warning::Could not dispatch ${REVIEW_WORKFLOW_FILE} as Bug B fallback; relying on pull_request:synchronize event only"
            cat /tmp/dispatch_resp.txt >&2 || true
          fi

      # ── Phase 4: Wait for review/edit to complete ───────────────
      - name: "Phase 4: Wait for review & autofix to complete"
        id: wait-review
        env:
          PR_NUMBER: ${{ steps.wait-implement.outputs.pr_number }}
          # When inject-bait pushed a bait commit, pin the wait loop to
          # review runs whose head_sha matches the bait commit. Without
          # this filter, the loop sorts review runs by created_at and
          # picks the latest, which during the deterministic-skip
          # window (review_autofix.yml:339-433 + auto-merge tail at
          # :543-656) is the implement-phase review run on the prior
          # head SHA — already completed/success — causing wait-review
          # to exit before any bait-triggered review run appears. This
          # is the failure mode observed on run 25147636528 (the
          # canary's implementation is doc-only, so the implement-phase
          # review is always deterministically skipped and finishes
          # fast enough to win the latest-by-created_at race). Empty
          # when the bait injection was skipped (status != injected);
          # the loop then falls back to the legacy latest-by-created_at
          # filter so non-bait runs (no bait was injected this run) are
          # unaffected.
          BAIT_SHA: ${{ steps.inject-bait.outputs.bait_sha }}
          # ISO-8601 UTC timestamp of the bait commit (see inject-bait).
          # Lower bound for recognising the in-flight PR-open review run
          # as a valid bait review even though its run-level head_sha is
          # the pre-bait SHA: a review still running when the bait landed
          # checked out the live (post-bait) tip and reviewed+edited it.
          # Empty when no bait was injected (status != injected); the jq
          # below then leaves the strict head_sha pin untouched because
          # the date comparison short-circuits to false on an empty bound.
          BAIT_CREATED_AT: ${{ steps.inject-bait.outputs.bait_created_at }}
          # Promoted to env so the run: script body contains no ${{ }}
          # interpolations. With even one inline expression, GitHub Actions
          # treats the entire script as a single expression and enforces a
          # 21,000-char limit; this script is ~25k chars and was tripping it.
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
        run: |
          set -euo pipefail
          echo "Waiting for review workflow on PR #${PR_NUMBER}..."
          if [ -n "${BAIT_SHA:-}" ]; then
            echo "Pinning to review runs with head_sha=${BAIT_SHA:0:7} (bait commit)"
          else
            echo "No bait SHA — using legacy latest-by-created_at filter"
          fi
          echo "Inactivity timeout: ${REVIEW_TIMEOUT} minutes"
          INACTIVITY_LIMIT=$((REVIEW_TIMEOUT * 60))
          LAST_ACTIVITY=$(date +%s)
          PREV_STATE=""
          ELAPSED=0
          RATE_LIMIT_BACKOFF=0
          # Mutable pin tracking the head SHA the loop is currently polling
          # against. Initialised to BAIT_SHA; advances to the new PR head
          # whenever the pinned run reports `cancelled` AND the PR head has
          # moved past the pin. internal-review.yml uses `cancel-in-progress:
          # true` on a `head_ref`-keyed group, so the editor's fix-commit
          # push fires a fresh `pull_request: synchronize` event whose
          # successor review run cancels the bait-triggered predecessor.
          # Without advancing the pin, the BAIT_SHA-anchored jq filter never
          # matches the successor (its head_sha is the editor's fix SHA, not
          # the bait SHA) and the loop polls the dead cancelled run until
          # the 30-minute inactivity timeout fires — observed on
          # run-25428461223 (PR #2165), where the editor pushed 8234a6e at
          # +10m, the bait run was cancelled at +10m22s, and wait-review
          # then idled for the full REVIEW_TIMEOUT before failing.
          PIN_SHA="${BAIT_SHA:-}"

          . ./scripts/comprehensive_test_and_release_gh_api.sh

          # Give the review workflow a moment to start
          sleep 5

          while true; do
            NOW=$(date +%s)
            IDLE=$((NOW - LAST_ACTIVITY))

            # Find the review workflow run for this PR's head branch
            PR_BRANCH="ai/issue-${ISSUE_NUMBER}"

            # Look for workflow runs on this branch.
            # When BAIT_SHA is set the filter pins to head_sha == BAIT_SHA
            # so the wait loop cannot mistake a stale implement-phase
            # review run (head_sha = the implement commit, not the bait
            # commit) for a bait-triggered run. per_page is widened to
            # 100 because a doc-only PR's head can carry several extra
            # workflow runs (CI, Internal: AI Review & Autofix, …) and
            # the bait-triggered run could get crowded out of a small
            # page. Falls back to the legacy latest-by-created_at filter
            # only when the bait-injection step did not produce a SHA
            # (status=skipped path).
            #
            # The URL no longer pins event=pull_request: Phase 3c also
            # dispatches ${REVIEW_WORKFLOW_FILE} as a Bug B fallback, and
            # those runs carry event=workflow_dispatch. Dropping the
            # event filter from the URL lets head_sha=BAIT_SHA match
            # both paths uniformly. (We still rely on the jq name match
            # to avoid latching onto e.g. CI runs that happen to share
            # the bait SHA.) The dispatched run's head_sha matches
            # BAIT_SHA because we dispatch with --ref "${BRANCH}" and
            # GitHub records the ref's tip SHA at dispatch time.
            #
            # GitHub's "Running Copilot Code Review" run is excluded
            # (event == "dynamic" / name contains "copilot"): it is a
            # code-REVIEW agent, not the review-AND-AUTOFIX workflow, yet
            # its name matches the broad `Review` token above. On v1.19.0
            # (run 27926259717) the Copilot run (head=pre-bait SHA,
            # created 02:56:26, updated 02:58:40) straddled the bait
            # timestamp (02:58:37) so leg (b)'s created<=bait<=updated
            # window admitted it; tier-1 preference then picked that
            # already-completed Copilot success over the still-in-progress
            # real autofix run, so Phase 4 declared success ~6s in and
            # Phase 4b then failed on the unrestored canary. Excluding the
            # Copilot reviewer keeps the loop watching the actual
            # internal-review.yml / review_autofix.yml run instead.
            #
            # `self-healing` is part of the regex because review_autofix.yml
            # ("Codex PR Self-Healing Semantic Agent") is dispatched directly
            # by its own post_commit_retrigger after the editor commits the
            # fix — that engine run is the canonical successor at PIN_SHA on
            # repos where review_autofix.yml exists locally (coding-workflows
            # itself, plus consumer repos that copy/sync it). Without this
            # token the engine's name does not match `Review|review|autofix`,
            # so the wait loop never sees the post-commit successor run and
            # ages out at REVIEW_TIMEOUT — observed on run-25445414047 where
            # PIN_SHA advanced to the editor commit but the engine
            # workflow_dispatch run at that SHA was filtered out and the
            # poll timed out 30m later.
            if [ -n "${PIN_SHA:-}" ]; then
              # Candidate set ($m): name-matched review runs that EITHER
              #   (a) carry head_sha == PIN_SHA — the Phase 3c
              #       workflow_dispatch fallback and the bait
              #       pull_request:synchronize run; OR
              #   (b) were in flight when the bait commit landed:
              #       created_at <= BAIT_CREATED_AT AND the run is still
              #       active — either updated_at >= BAIT_CREATED_AT OR
              #       status == "in_progress".
              # Leg (b) recovers the original PR-open review run: it is
              # triggered on the pre-bait head SHA (so its run-level
              # head_sha never equals BAIT_SHA and leg (a) misses it),
              # but because review_autofix.yml checks out the live branch
              # tip at runtime, a review still running when the bait
              # landed actually reviews+edits the bait tree. Crucially,
              # the bait-SHA runs in leg (a) all serialise behind that
              # original run in review_autofix.yml's `pr-autofix-${PR}`
              # concurrency group (cancel-in-progress: false), so when
              # the original review runs long they stay queued/pending
              # past REVIEW_TIMEOUT and the loop, pinned to a 0-activity
              # pending sibling, ages out — the failure on runs
              # 27137020958 / 27244093614 / 27328808462 (v1.17.0). Leg (b)
              # lets the loop watch the actually-running review instead;
              # its growing job log registers as activity each poll and
              # resets the inactivity timer until it completes.
              # The BAIT_CREATED_AT guard (!= "") keeps leg (b) inert
              # when no bait was injected.
              #
              # The `or .status == "in_progress"` half is load-bearing:
              # the original updated_at >= BAIT_CREATED_AT bound alone
              # produced a FALSE NEGATIVE on run 27328808462. There the
              # PR-open review's codex-agent job started ~2m BEFORE the
              # bait and then ran a single ~37m job with no further
              # run-level state transitions, so the runs-list API reported
              # its `updated_at` frozen at the pre-bait job-start time
              # (< BAIT_CREATED_AT) for the whole 30m window. The bound
              # therefore rejected the very run leg (b) exists to catch,
              # the loop fell through to the queued-sibling fallback, and
              # the phase aged out. A run created at/before the bait that
              # is STILL in_progress was necessarily in flight when the
              # bait landed (it has not finished and review_autofix checks
              # out the live tip), so status alone is a sound in-flight
              # signal independent of the frozen timestamp.
              #
              # Both legs still exclude the historical stale-implement-
              # review false match (run 25147636528) which COMPLETED
              # before the bait: a completed run is neither updated_at >=
              # BAIT_CREATED_AT (it stopped before the bait) nor
              # status == "in_progress".
              #
              # Preference order over $m:
              #   1. newest completed non-cancelled run (terminal accept);
              #   2. oldest in_progress run created at/before the bait —
              #      this is the original long-running PR-open review
              #      (in flight when the bait landed), and it must win
              #      over a newer caller workflow run that is merely
              #      blocked behind it. (No updated_at bound here: see
              #      the run 27328808462 frozen-timestamp note above.)
              #   3. newest in_progress run (generic active-run fallback);
              #   4. newest non-cancelled run (queued/pending fallback);
              #   5. newest run overall (all cancelled).
              # Tier 1 still precedes 2 so an already-completed success
              # wins over an active sibling (preserves the run-26989483268
              # fix).
              REVIEW_RUN=$(gh_api_safe_quiet_print "repos/${TEST_REPO}/actions/runs?branch=${PR_BRANCH}&per_page=100" \
                --jq "[.workflow_runs[] | select(.name | test(\"Review|review|autofix|self-healing\"; \"i\")) | select((.event == \"dynamic\" or (.name | test(\"copilot\"; \"i\"))) | not) | select(.head_sha == \"${PIN_SHA}\" or (\"${BAIT_CREATED_AT:-}\" != \"\" and .created_at <= \"${BAIT_CREATED_AT:-}\" and (.updated_at >= \"${BAIT_CREATED_AT:-}\" or .status == \"in_progress\")))] as \$m | (\$m | map(select(.status == \"completed\" and .conclusion != \"cancelled\")) | sort_by(.created_at) | last) // (\$m | map(select(.status == \"in_progress\" and \"${BAIT_CREATED_AT:-}\" != \"\" and .created_at <= \"${BAIT_CREATED_AT:-}\")) | sort_by(.created_at) | first) // (\$m | map(select(.status == \"in_progress\")) | sort_by(.created_at) | last) // (\$m | map(select(.conclusion != \"cancelled\")) | sort_by(.created_at) | last) // (\$m | sort_by(.created_at) | last)" || echo "")
            else
              REVIEW_RUN=$(gh_api_safe_quiet_print "repos/${TEST_REPO}/actions/runs?branch=${PR_BRANCH}&event=pull_request&per_page=5" \
                --jq '[.workflow_runs[] | select(.name | test("Review|review|autofix|self-healing"; "i")) | select((.event == "dynamic" or (.name | test("copilot"; "i"))) | not)] | sort_by(.created_at) | last' || echo "")
            fi

            # If rate-limited, skip this cycle entirely (don't corrupt state)
            if [ "$RATE_LIMIT_BACKOFF" -gt 0 ] && [ -z "$REVIEW_RUN" ]; then
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
              continue
            fi

            RUN_STATUS="none"
            RUN_CONCLUSION="null"
            RUN_ID="unknown"
            FAILED_STEPS="0"

            if [ -n "$REVIEW_RUN" ] && [ "$REVIEW_RUN" != "null" ]; then
              RUN_STATUS=$(echo "$REVIEW_RUN" | jq -r '.status // "unknown"')
              RUN_CONCLUSION=$(echo "$REVIEW_RUN" | jq -r '.conclusion // "null"')
              RUN_ID=$(echo "$REVIEW_RUN" | jq -r '.id // "unknown"')

              echo "  Review run #${RUN_ID}: status=${RUN_STATUS}, conclusion=${RUN_CONCLUSION}"

              if [ "$RUN_STATUS" = "completed" ]; then
                if [ "$RUN_CONCLUSION" = "success" ]; then
                  echo "✓ Review & autofix completed successfully"
                  echo "status=success" >> "$GITHUB_OUTPUT"
                  echo "review_run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
                  exit 0
                elif [ "$RUN_CONCLUSION" = "failure" ]; then
                  echo "::warning::Review workflow completed with failure — this may be acceptable if reviewers found issues"
                  echo "status=completed_with_findings" >> "$GITHUB_OUTPUT"
                  echo "review_run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
                  exit 0
                elif [ "$RUN_CONCLUSION" = "cancelled" ]; then
                  echo "Review run was cancelled — checking for newer run..."
                  # internal-review.yml's concurrency group is keyed on
                  # `head_ref` with `cancel-in-progress: true`, so the
                  # autofix editor pushing a fix commit fires a fresh
                  # `pull_request: synchronize` event whose successor run
                  # cancels this one. When that happens the PR head has
                  # already moved past the pin, and the successor's
                  # head_sha equals the new PR head — advance the pin so
                  # the next iteration latches onto the successor instead
                  # of polling this dead run forever (the failure mode on
                  # run-25428461223). Reset the activity timer because
                  # the pivot itself is meaningful progress.
                  PIN_HEAD_NOW=$(gh_api_safe_quiet_print "repos/${TEST_REPO}/pulls/${PR_NUMBER}" --jq '.head.sha // ""' || echo "")
                  if [ -n "${PIN_SHA:-}" ] && [ -n "${PIN_HEAD_NOW}" ] && [ "${PIN_HEAD_NOW}" != "${PIN_SHA}" ]; then
                    echo "  ↪ PR head advanced past pin (${PIN_SHA:0:7} → ${PIN_HEAD_NOW:0:7}); advancing pin and polling successor run next iteration"
                    PIN_SHA="${PIN_HEAD_NOW}"
                    LAST_ACTIVITY=$NOW
                    PREV_STATE=""
                    sleep "$POLL_INTERVAL"
                    ELAPSED=$((ELAPSED + POLL_INTERVAL))
                    continue
                  fi
                fi
              fi

              # While the run is still in_progress, probe job steps to detect
              # early failure. The review workflow uses if:always() cleanup steps
              # that keep the run in_progress long after the main work has died.
              if [ "$RUN_STATUS" = "in_progress" ] && [ "$RUN_ID" != "unknown" ]; then
                # Fetch jobs once and reuse for failed-steps check, current step, and log size
                JOBS_JSON=$(gh_api_safe_quiet_print "repos/${TEST_REPO}/actions/runs/${RUN_ID}/jobs?per_page=10" || echo "")
                if [ -n "$JOBS_JSON" ]; then
                  FAILED_STEPS=$(echo "$JOBS_JSON" | jq '[.jobs[].steps[] | select(.conclusion == "failure")] | length' 2>/dev/null || echo "0")
                else
                  FAILED_STEPS="0"
                fi
                if [ "$FAILED_STEPS" -gt 0 ]; then
                  echo "  ⚠ Review run has ${FAILED_STEPS} failed step(s) — main work has failed, cleanup still running"
                  echo "::warning::Review workflow has failed steps while cleanup is still in_progress"
                  echo "status=completed_with_findings" >> "$GITHUB_OUTPUT"
                  echo "review_run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
                  exit 0
                fi

                # Check live logs for reviewer progress (majority-pass shortcut)
                # and for the editor-noop fallback marker (early-exit shortcut).
                # Both are gated behind ELAPSED >= 600 so we only pay the live-
                # log API cost after the editor step is plausibly running —
                # reviewers + editor together take well over 10 minutes in
                # every observed run, so anything earlier is wasted I/O.
                if [ "$ELAPSED" -ge 600 ]; then
                  JOB_ID=$(echo "$JOBS_JSON" | jq -r '.jobs[0].id // empty' 2>/dev/null || echo "")
                  if [ -n "$JOB_ID" ]; then
                    # Stream the job log to a tempfile rather than capturing
                    # into a shell variable. `gh_api_safe .../actions/jobs/
                    # {id}/logs` returns the raw log bytes (multi-MB on long
                    # autofix runs) and bash command-substitution `$(...)`
                    # silently drops NUL bytes from the captured output —
                    # which can occur when an inner tool (codex, jq, gh)
                    # emits binary content into stderr/stdout. Dropped NULs
                    # could merge adjacent lines and cause both the editor-
                    # noop grep and the reviewer-success counter to silently
                    # miss otherwise-valid matches. Writing once to a
                    # tempfile and grepping the file is byte-exact and uses
                    # no more API calls than before. See PR #1798 review by
                    # copilot-pull-request-reviewer.
                    LOG_FILE="$(mktemp)"
                    # On API failure (rate-limit or transient blip),
                    # gh_api_safe writes nothing to stdout and returns
                    # non-zero. Truncate LOG_FILE to zero bytes so the
                    # downstream greps see "no matches" rather than
                    # stale content from a previous iteration's mktemp
                    # collision (mktemp returns a fresh path so this is
                    # belt-and-braces, not strictly required). Emit a
                    # diagnostic so operators can spot API blips without
                    # having to correlate the missing shortcuts against
                    # the rate-limit log lines gh_api_safe emits to
                    # stderr — surfaces the case Grok-4.1 flagged in
                    # the claude-branch-review on PR #1798.
                    # Stderr is intentionally NOT redirected: gh_api_safe
                    # writes its own rate-limit / transient-failure
                    # diagnostics to >&2 (e.g. "⏳ Rate limited — backing
                    # off ${RATE_LIMIT_BACKOFF}s"), and operators rely on
                    # those lines to distinguish a genuinely-stuck review
                    # workflow from a slow smoke run caused by API blips.
                    if ! gh_api_safe_quiet_print "repos/${TEST_REPO}/actions/jobs/${JOB_ID}/logs" > "$LOG_FILE"; then
                      : > "$LOG_FILE"
                      echo "  ⚠ Live-log fetch failed for job ${JOB_ID} — editor-noop shortcut and reviewer-count shortcut are inactive this iteration; the wait loop continues with status/conclusion polling only" >&2
                    fi

                    # Editor-noop fallback marker shortcut.
                    #
                    # When `Validate editor no-op disposition` in
                    # review_autofix.yml emits the literal warning
                    # "Editor summary contains failure/fallback markers",
                    # the editor never produced a validated summary and the
                    # downstream merge-conflict / resolver / push steps
                    # (now gated on EDITOR_NOOP_SUSPICIOUS != 'true') will
                    # all skip — there is nothing left for the e2e bait
                    # check to verify, so we can short-circuit the wait
                    # loop the moment the marker appears in the live log
                    # rather than waiting for the cleanup steps to wind
                    # down (which can take another ~3.5 minutes and was
                    # the proximate cause of the run-25126757724 cascade
                    # masking the real editor failure).
                    #
                    # `grep -qaF` for an exact substring match — the
                    # annotation text is stable per analysis/e2e-smoke-
                    # failure-25126757724.md (a rename in
                    # review_autofix.yml is a breaking change per
                    # CLAUDE.md §6, so this literal is safe to depend on).
                    # The `-a` flag forces grep to treat the input as text
                    # even if a NUL byte in the streamed log would
                    # otherwise make grep classify it as binary and
                    # short-circuit to "Binary file ... matches" without
                    # honouring `-q`'s quiet exit-code-only contract; do
                    # not drop `-a` when editing this block.
                    #
                    # The `::warning::` prefix is part of the literal so
                    # this only matches the validator's annotation, not
                    # any other log line that happens to mention the
                    # phrase (e.g. the in-step retry's own `::notice::`
                    # before its widened gate fix landed — see PR #1798
                    # review). The validator emits exactly this prefix
                    # (`echo "::warning::Editor summary contains
                    # failure/fallback markers — editor never completed
                    # a validated review."`); GitHub Actions preserves
                    # workflow-command prefixes verbatim in the raw log
                    # bytes returned by /actions/jobs/{id}/logs.
                    if grep -qaF '::warning::Editor summary contains failure/fallback markers' "$LOG_FILE"; then
                      # When the editor's no-op was caused by a model
                      # safety-policy refusal (an OpenAI-style "I'm
                      # sorry, but I cannot assist" final-channel
                      # output), the validator additionally emits the
                      # `::notice::Editor returned a safety-policy
                      # refusal` annotation (review_autofix.yml,
                      # `Validate editor no-op disposition`). Re-running
                      # after the provider-side prompt cache expires
                      # typically clears the trip, so the operator-facing
                      # warning carries that hint. The generic-noop
                      # warning literal stays unchanged for non-refusal
                      # cases to avoid breaking any downstream grep
                      # consumer (CLAUDE.md §6).
                      if grep -qaF '::notice::Editor returned a safety-policy refusal' "$LOG_FILE"; then
                        echo "  ⚠ Editor safety-refusal detected in live log — model returned a refusal; provider-side cache will serve identical refusals briefly; aborting wait early"
                        echo "::warning::Review workflow editor refused (safety filter) — re-run after a few minutes (EDITOR_NOOP_REFUSAL marker observed); no autofix commit will be pushed"
                      else
                        echo "  ⚠ Editor noop marker detected in live log — editor never produced a validated commit; aborting wait early"
                        echo "::warning::Review workflow editor produced no validated summary (EDITOR_NOOP_SUSPICIOUS marker observed); no autofix commit will be pushed"
                      fi
                      echo "status=completed_with_findings" >> "$GITHUB_OUTPUT"
                      echo "review_run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
                      rm -f "$LOG_FILE"
                      exit 0
                    fi

                    # `-a` treats the input as text even if grep otherwise
                    # heuristically classified it as binary (any NUL byte
                    # would normally make grep fall through to "Binary file
                    # ... matches" instead of printing/counting matches).
                    SUCCEEDED=$(grep -caE "Reviewer .* succeeded" "$LOG_FILE" || true)
                    FAILED_R=$(grep -caE "Reviewer .* failed after" "$LOG_FILE" || true)
                    rm -f "$LOG_FILE"
                    SUCCEEDED="${SUCCEEDED:-0}"; SUCCEEDED="${SUCCEEDED##*$'\n'}"
                    FAILED_R="${FAILED_R:-0}"; FAILED_R="${FAILED_R##*$'\n'}"
                    [[ "$SUCCEEDED" =~ ^[0-9]+$ ]] || SUCCEEDED=0
                    [[ "$FAILED_R" =~ ^[0-9]+$ ]] || FAILED_R=0
                    TOTAL_DONE=$((SUCCEEDED + FAILED_R))
                    if [ "$SUCCEEDED" -ge 3 ] && [ $((SUCCEEDED * 2)) -gt "$TOTAL_DONE" ]; then
                      echo "  ✓ Review run still in_progress but ${SUCCEEDED}/${TOTAL_DONE} reviewers succeeded (>50%) — treating as pass"
                      echo "status=success" >> "$GITHUB_OUTPUT"
                      echo "review_run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
                      exit 0
                    elif [ "$TOTAL_DONE" -gt 0 ]; then
                      echo "  ... ${SUCCEEDED}/${TOTAL_DONE} reviewers succeeded so far, waiting for more..."
                    fi
                  fi
                fi
              fi
            fi

            # ── Adaptive activity signals ──────────────────────────
            # Beyond run status/conclusion, probe deeper indicators
            # that the review workflow is genuinely making progress.

            # 1) Current step name — reuse JOBS_JSON if already fetched
            CURRENT_STEP=""
            if [ "$RUN_ID" != "unknown" ]; then
              if [ -n "${JOBS_JSON:-}" ]; then
                CURRENT_STEP=$(echo "$JOBS_JSON" | jq -r '[.jobs[].steps[] | select(.status == "in_progress")] | last | .name // ""' 2>/dev/null || echo "")
              else
                CURRENT_STEP=$(gh_api_safe_quiet_print "repos/${TEST_REPO}/actions/runs/${RUN_ID}/jobs?per_page=10" \
                  --jq '[.jobs[].steps[] | select(.status == "in_progress")] | last | .name // ""' || echo "")
              fi
            fi

            # 2) Commit count on PR branch — editor pushes trigger changes
            PR_HEAD_SHA=$(gh_api_safe_quiet_print "repos/${TEST_REPO}/pulls/${PR_NUMBER}" \
              --jq '.head.sha // ""' || echo "")

            # 3) Review comment count on the PR
            REVIEW_COMMENT_COUNT=$(gh_api_safe_quiet_print "repos/${TEST_REPO}/pulls/${PR_NUMBER}/comments" \
              --jq 'length' || echo "0")

            # 4) Job log byte size — grows while reviewers/editor produce output
            LOG_SIZE="0"
            if [ "$RUN_ID" != "unknown" ]; then
              JOB_ID_FOR_SIZE=""
              if [ -n "${JOBS_JSON:-}" ]; then
                JOB_ID_FOR_SIZE=$(echo "$JOBS_JSON" | jq -r '.jobs[0].id // empty' 2>/dev/null || echo "")
              else
                JOB_ID_FOR_SIZE=$(gh_api_safe_quiet_print "repos/${TEST_REPO}/actions/runs/${RUN_ID}/jobs?per_page=10" \
                  --jq '.jobs[0].id // empty' || echo "")
              fi
              if [ -n "$JOB_ID_FOR_SIZE" ]; then
                LOG_SIZE=$(gh_api_safe_quiet_print "repos/${TEST_REPO}/actions/jobs/${JOB_ID_FOR_SIZE}/logs" \
                  | wc -c || echo "0")
                LOG_SIZE="${LOG_SIZE##*$'\n'}"
                [[ "$LOG_SIZE" =~ ^[0-9]+$ ]] || LOG_SIZE="0"
              fi
            fi

            CUR_STATE="run=${RUN_STATUS};conclusion=${RUN_CONCLUSION};failed_steps=${FAILED_STEPS};step=${CURRENT_STEP};head=${PR_HEAD_SHA};reviews=${REVIEW_COMMENT_COUNT};log_sz=${LOG_SIZE}"

            if [ "$CUR_STATE" != "$PREV_STATE" ]; then
              if [ -n "$PREV_STATE" ]; then
                echo "  ↻ Activity detected (state changed) — resetting inactivity timer"
              fi
              LAST_ACTIVITY=$NOW
              IDLE=0
              PREV_STATE="$CUR_STATE"
            fi

            # Inactivity timeout. When BAIT_SHA is set and the loop
            # never matched a review run for that SHA, surface a
            # distinct status so verify-bait-removed's failure isn't
            # the first place the operator hears that the bait push
            # never spawned a downstream review_autofix run. Dump the
            # review-run inventory for the branch so the diagnosis
            # doesn't require an out-of-band gh api call.
            if [ $IDLE -ge $INACTIVITY_LIMIT ]; then
              # jq's `last` on an empty array yields the literal string
              # "null" rather than empty, so both branches are needed.
              if [ -n "${BAIT_SHA:-}" ] && { [ -z "${REVIEW_RUN:-}" ] || [ "${REVIEW_RUN}" = "null" ]; }; then
                if [ "${PIN_SHA:-}" != "${BAIT_SHA:-}" ]; then
                  echo "::error::Review run pin was advanced from BAIT_SHA=${BAIT_SHA} to PIN_SHA=${PIN_SHA} after a cancellation, but no successor run with head_sha=${PIN_SHA} appeared within ${REVIEW_TIMEOUT}m — the editor's fix-commit push did not produce a review_autofix run"
                else
                  echo "::error::No review workflow run (Internal: AI Review & Autofix) with head_sha=${BAIT_SHA} ever appeared within ${REVIEW_TIMEOUT}m — neither the bait push's pull_request:synchronize event nor the Phase 3c workflow_dispatch fallback produced a review run"
                fi
                echo "status=no_review_triggered" >> "$GITHUB_OUTPUT"
                echo "Diagnostic: workflow runs visible on branch ${PR_BRANCH}:" >&2
                gh_api_safe_quiet_print "repos/${TEST_REPO}/actions/runs?branch=${PR_BRANCH}&per_page=20" \
                  --jq '.workflow_runs[] | "  \(.id) \(.name) event=\(.event) status=\(.status) conclusion=\(.conclusion // "null") head_sha=\(.head_sha[0:7])"' >&2 \
                  || echo "  (inventory fetch failed)" >&2
                exit 1
              fi
              echo "::error::Review phase stalled — no activity for ${REVIEW_TIMEOUT} minutes"
              echo "status=timeout" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            REMAINING=$(( (INACTIVITY_LIMIT - IDLE + 59) / 60 ))
            echo "  ... idle ${IDLE}s (timeout in ~${REMAINING}m) — step: ${CURRENT_STEP:-?}, head: ${PR_HEAD_SHA:0:7}, reviews: ${REVIEW_COMMENT_COUNT}, log: ${LOG_SIZE}b"
            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

      # Per-phase soft-error analysis: review_autofix.
      # Wait cap is bumped to 300s here because the previous single
      # end-of-job analyser raced review_autofix's tail (it exited
      # right when wait-review's FAILED_STEPS shortcut tripped and
      # the review run still had ~40s of cleanup steps to run),
      # producing the HTTP 404 report we observed on run 25126757724.
      - name: "Phase 4c: Soft-error analyser (review_autofix)"
        if: always() && steps.wait-review.outputs.review_run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            review_autofix=${{ steps.wait-review.outputs.review_run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-review_autofix
          wait_for_completion_secs: "300"
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

      # ── Phase 4b: Verify editor restored the canary file ──
      # Confirms the reviewer→editor→commit pipeline actually fired by
      # running the pytest assertions in tests/test_e2e_editor_smoke_canary.py
      # against the canary file fetched from the post-review PR head,
      # then checking the editor pushed at least one commit past the
      # Phase 3c bait commit. The pytest test asserts byte-for-byte
      # match to the issue's 3-line spec (any value mangled, any line
      # added/removed, any bait marker surviving = test fails).
      #
      # Hard-fail with retry budget: the autofix editor model is
      # known-flaky (seven prior in-tree fixes targeting reasoning
      # effort and prompt content; production runs hit empty-completion
      # state non-deterministically). On first pytest failure we
      # snapshot the branch head SHA, re-dispatch ${REVIEW_WORKFLOW_FILE}
      # via `--ref "${BRANCH}"`, and poll for a new workflow_dispatch
      # run whose head_sha matches the snapshotted SHA. We allow up
      # to 25 minutes for the new run to complete (raised from 10 min
      # after run 25371432937 truncated a still-running successful
      # retry); if the second verification also fails, we hard-fail
      # this step. The retry
      # absorbs single-shot model flakes without re-introducing the
      # release-blocking failure mode that drove the soft-check
      # detour. Phase 3c's `pr_already_closed` path is still
      # hard-failing on its own (test-setup race, not editor
      # reliability).
      #
      # Status outputs (echoed into $GITHUB_OUTPUT, consumed by the
      # aggregator below):
      #   success                  — first attempt passed
      #   success_after_retry      — passed after one re-dispatch
      #   spec_mismatch            — pytest FAILED after retry (real editor bug)
      #   harness_misconfigured    — pytest fixture/INTERNALERROR (workflow / runner / template
      #                              issue, not editor)
      #   no_editor_commit         — canary content correct but PR head still equals BAIT_SHA
      #   fetch_failed             — Contents API couldn't return the canary on first attempt
      #   fetch_failed_after_retry — same, after retry
      #   pytest_unavailable       — pip + apt fallback both failed (infra error)
      #   pr_head_fetch_failed     — pulls/<n> API failed; refused to fail-open commit guard
      #   retry_dispatch_failed    — gh workflow run failed, or wait-review id non-numeric
      #   retry_timeout            — re-dispatched run did not complete in 25 min
      #   retry_workflow_failed    — retry run completed but conclusion != success
      #   pr_closed_during_retry   — PR closed/merged while waiting for the retry run
      #   pr_state_check_failed    — fetch_pr_state returned "unknown" 4 consecutive times
      #                              (~60s of GitHub API outage); poll loop bails to avoid
      #                              burning the full 25-min retry window
      # Aggregator hard-fails on anything except success / success_after_retry. Phase 3c's
      # pr_already_closed (test-setup race) is hard-failed in the aggregator separately.
      #
      # Gate on wait-review's status: if the review pipeline didn't
      # complete cleanly upstream, retrying it from here would burn
      # the 25-min retry window on a known-broken state. Skip Phase 4b
      # in that case — the aggregator already counts the review
      # failure, and the skipped status is treated non-blocking
      # ("review didn't complete") instead of double-counting it as
      # an editor failure.
      - name: "Phase 4b: Verify editor restored canary (pytest + retry)"
        id: verify-bait-removed
        if: |
          steps.inject-bait.outputs.status == 'injected' &&
          (steps.wait-review.outputs.status == 'success' ||
           steps.wait-review.outputs.status == 'completed_with_findings')
        env:
          PR_NUMBER: ${{ steps.wait-implement.outputs.pr_number }}
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
          BAIT_SHA: ${{ steps.inject-bait.outputs.bait_sha }}
          # Promoted to env so the run: script body contains no ${{ }}
          # interpolations. Same constraint as Phase 4 above: a single
          # inline expression makes GitHub Actions treat the whole script
          # as one expression, capped at 21,000 chars; this body is ~21.3k.
          PRIOR_REVIEW_RUN: ${{ steps.wait-review.outputs.review_run_id }}
        run: |
          set -euo pipefail
          BRANCH="ai/issue-${ISSUE_NUMBER}"
          CANARY_PATH="tests/e2e_smoke_canary.txt"
          # The pytest test reconstructs the issue's exact 3-line target
          # from E2E_EXPECTED_RUN_ID. Issue body at line ~347 hardcodes
          # `run_id: ${RUN_ID}` where RUN_ID = GITHUB_RUN_ID, so the
          # same value works on both sides.
          export E2E_EXPECTED_RUN_ID="${GITHUB_RUN_ID}"
          export E2E_CANARY_FILE="${RUNNER_TEMP:-/tmp}/e2e_canary_fetched.txt"
          # Sentinel telling the test fixture this is the production
          # invocation: missing canary env vars must fail loudly here
          # (a configuration bug), not skip silently.
          export E2E_PHASE_4B_INVOKED=1
          PYTEST_OUTPUT="${RUNNER_TEMP:-/tmp}/e2e_pytest_output.txt"

          # Capture pip + apt diagnostics into a tmp file so a failed
          # install isn't silently lost. If the import probe below
          # fails, we surface the captured log alongside the error
          # so operators triaging pytest_unavailable can see the root
          # cause (network error, missing package, permission, etc.)
          # without re-running the workflow with verbose flags.
          PYTEST_INSTALL_LOG="${RUNNER_TEMP:-/tmp}/e2e_pytest_install.log"
          : > "${PYTEST_INSTALL_LOG}"
          python3 -m pip install --quiet pytest >>"${PYTEST_INSTALL_LOG}" 2>&1 || {
            echo "::warning::pip install pytest failed; trying apt fallback"
            # Refresh package indexes before the apt install — without
            # this a stale index on a long-running runner image can
            # surface as a spurious pytest_unavailable. Other workflows
            # in this repo (review_autofix.yml) precede their apt-get
            # installs the same way.
            sudo apt-get update -qq >>"${PYTEST_INSTALL_LOG}" 2>&1 || true
            sudo apt-get install -y --no-install-recommends python3-pytest >>"${PYTEST_INSTALL_LOG}" 2>&1 || true
          }
          # Verify pytest is actually importable. Without this, a
          # double-failure in pip+apt would later surface as a
          # ModuleNotFoundError that looks like a test/spec mismatch
          # rather than the infrastructure error it is.
          if ! python3 -c "import pytest" 2>/dev/null; then
            echo "::error::pytest is not importable after pip + apt install attempts; cannot verify canary"
            echo "::group::pytest install diagnostics"
            cat "${PYTEST_INSTALL_LOG}" || true
            echo "::endgroup::"
            echo "status=pytest_unavailable" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # gh api wrapper with a small retry budget so a transient
          # 429/5xx doesn't bypass the editor-flake retry budget. Used
          # by every gh api call in this step (fetch helpers + poll
          # loop) so any single API blip gets up to 3 attempts with
          # 2s/4s backoff before being treated as terminal. On final
          # failure ALL attempts' stderr is surfaced (not just the
          # last) so triage can spot patterns like "first 2 were
          # rate-limited then 3rd was 5xx".
          gh_api_with_retry() {
            local out
            local rc=0
            local err_file
            err_file="$(mktemp)"
            for try in 1 2 3; do
              # Tag each attempt's stderr so they're distinguishable
              # in the final warning and append (>>) — overwriting
              # would lose earlier diagnostics.
              echo "--- attempt ${try} stderr ---" >> "${err_file}"
              out=$(gh api "$@" 2>>"${err_file}") && {
                rm -f "${err_file}"
                printf '%s' "${out}"
                return 0
              }
              rc=$?
              [ "${try}" -lt 3 ] && sleep $((try * 2))
            done
            if [ -s "${err_file}" ]; then
              echo "::warning::gh api failed after 3 attempts (rc=${rc}): $(tr '\n' ' ' < "${err_file}" | head -c 1000)" >&2
            fi
            rm -f "${err_file}"
            return "${rc}"
          }

          fetch_canary_to_tmp() {
            # NOTE: do NOT use `blob=$(gh api ... || echo "")` — on
            # non-zero exit, `gh api` writes the error JSON body
            # (e.g. `{"message":"Not Found",...}`) to stdout, which
            # would land in $blob as a valid-looking but bogus
            # response. gh_api_with_retry returns rc!=0 on hard
            # failure and we further validate the .content field
            # before trusting the response.
            local blob_path="${RUNNER_TEMP:-/tmp}/e2e_canary_blob.json"
            : > "${blob_path}"
            if ! gh_api_with_retry "repos/${TEST_REPO}/contents/${CANARY_PATH}?ref=${BRANCH}" \
                > "${blob_path}"; then
              return 1
            fi
            if [ ! -s "${blob_path}" ]; then
              return 1
            fi
            local content_b64
            content_b64=$(jq -r '.content // empty' "${blob_path}")
            if [ -z "${content_b64}" ]; then
              return 1
            fi
            printf '%s' "${content_b64}" | tr -d '\n' | base64 -d > "${E2E_CANARY_FILE}" 2>/dev/null || return 1
            return 0
          }

          # Fetch PR head SHA with the same fail-loud discipline as
          # fetch_canary_to_tmp. Echoes the SHA on stdout, returns rc=0
          # on success and rc=1 on any API/parse failure — callers MUST
          # check rc and treat empty as "infrastructure error", not as
          # "head differs from bait" (the original `|| echo ""` form
          # silently fail-opened the no_editor_commit guard).
          fetch_pr_head_sha() {
            local resp_path="${RUNNER_TEMP:-/tmp}/e2e_pr_head_resp.json"
            : > "${resp_path}"
            if ! gh_api_with_retry "repos/${TEST_REPO}/pulls/${PR_NUMBER}" \
                > "${resp_path}"; then
              return 1
            fi
            if [ ! -s "${resp_path}" ]; then
              return 1
            fi
            local sha
            sha=$(jq -r '.head.sha // empty' "${resp_path}")
            if [ -z "${sha}" ]; then
              return 1
            fi
            printf '%s' "${sha}"
            return 0
          }

          # Returns the PR's state ("open" / "closed") or "unknown" on
          # API failure. Used by the retry poll loop to bail out if
          # the PR is closed/merged mid-wait — no point polling for a
          # review run that won't fire on a closed PR.
          fetch_pr_state() {
            local state
            state=$(gh_api_with_retry "repos/${TEST_REPO}/pulls/${PR_NUMBER}" --jq '.state // "unknown"') || {
              echo "unknown"
              return 0
            }
            echo "${state:-unknown}"
          }

          run_pytest() {
            : > "${PYTEST_OUTPUT}"
            # Locally disable -e so a non-zero pytest exit doesn't
            # propagate up before we can capture it. `set -e` semantics
            # for a function called from `if !` should already exempt
            # the body, but pipefail + the `tee` pipeline make the
            # interaction subtle enough to be worth pinning down
            # explicitly.
            set +e
            python3 -m pytest tests/test_e2e_editor_smoke_canary.py -v --no-header 2>&1 | tee "${PYTEST_OUTPUT}"
            local rc="${PIPESTATUS[0]}"
            set -e
            return "${rc}"
          }

          # When pytest fails, distinguish a true editor regression
          # (test assertion failed on canary content) from a harness/
          # infra error (fixture exception, pytest internal error,
          # missing dependency, runner I/O failure). pytest's own
          # FAILED-vs-ERROR distinction is the cleanest signal:
          #
          #   FAILED  → the test function ran and an assertion failed
          #             → real editor/spec bug → spec_mismatch
          #   ERROR   → fixture / collection / setup raised before the
          #             test body could run → harness issue
          #   INTERNALERROR → pytest itself crashed → harness issue
          #
          # Anything that's neither FAILED nor a clean pass falls into
          # the harness bucket — that catches RuntimeError from the
          # canary_invocation fixture, ImportError on a broken Python
          # env, OSError/PermissionError on runner I/O, pytest
          # UsageError, and similar infra failures that should NOT
          # blame the editor.
          classify_pytest_failure() {
            # Case-insensitive INTERNALERROR (-i) for forward-compat
            # against pytest output-format tweaks. ^FAILED / ^ERROR
            # stay case-sensitive — pytest's short-summary prefixes are
            # documented as uppercase and matching them case-insensitively
            # would risk false positives on user-controlled error
            # message bodies that happen to contain "failed " or "error "
            # at line start.
            #
            # ERROR is matched explicitly (rather than relying on the
            # else fallthrough) so the classification decision is
            # readable without having to know that pytest's setup/
            # collection failures emit "ERROR file::test ..." in the
            # short summary.
            if grep -qiE "INTERNALERROR" "${PYTEST_OUTPUT}" 2>/dev/null; then
              echo "harness_misconfigured"
            elif grep -qE "^ERROR " "${PYTEST_OUTPUT}" 2>/dev/null; then
              echo "harness_misconfigured"
            elif grep -qE "^FAILED " "${PYTEST_OUTPUT}" 2>/dev/null; then
              echo "spec_mismatch"
            else
              # Catch-all for unknown pytest output shapes (e.g. future
              # format changes, pytest exiting with no FAILED/ERROR
              # summary at all). Bias to harness_misconfigured rather
              # than silently misclassifying as spec_mismatch.
              echo "harness_misconfigured"
            fi
          }

          # ── Attempt 1 ──────────────────────────────────────────────
          echo "─── Phase 4b attempt 1: fetch + pytest ───"
          if ! fetch_canary_to_tmp; then
            echo "::error::Could not re-fetch ${CANARY_PATH} after review — branch may be gone"
            echo "status=fetch_failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if run_pytest; then
            echo "✓ Canary verification passed on first attempt"
            # Confirm the editor pushed at least one commit on top of the bait.
            if ! PR_HEAD=$(fetch_pr_head_sha); then
              echo "::error::Could not fetch PR head SHA to verify editor commit; treating as infra failure (refusing to fail-open the no_editor_commit guard)"
              echo "status=pr_head_fetch_failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if [ "${PR_HEAD}" = "${BAIT_SHA}" ]; then
              echo "::error::PR head is still the bait commit — editor did not push a fix commit"
              echo "status=no_editor_commit" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "✓ Editor produced commit(s) past the bait (PR head: ${PR_HEAD:0:7}, bait: ${BAIT_SHA:0:7})"
            echo "status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Phase 4b first attempt failed — re-dispatching review_autofix and retrying once"

          # ── Retry: redispatch ${REVIEW_WORKFLOW_FILE} on the current branch head ──
          # Mirrors the Phase 3c fallback dispatch (lines ~1101-1109),
          # which uses ${REVIEW_WORKFLOW_FILE} as the public entry-point
          # that gates into review_autofix.yml without an `[ai-autofix]`
          # self-trigger guard.
          #
          # Capture the branch head SHA right before dispatch — that's
          # what the new workflow_dispatch run will carry as head_sha,
          # and what we'll poll for. Filtering on BAIT_SHA would miss
          # the retry run whenever the editor's first attempt already
          # advanced the branch past the bait (e.g. the editor pushed
          # a wrong-fix commit but pytest still failed); we'd hit
          # retry_timeout even though the dispatch succeeded.
          #
          # `gh workflow run` is dispatched with --ref "${BRANCH}"
          # (its documented contract is branch/tag, not raw SHA);
          # RETRY_DISPATCH_SHA is used only as the poll filter. Tiny
          # race window if the branch advances between snapshot and
          # dispatch — acceptable, and the retry_timeout path catches
          # it cleanly.
          if ! RETRY_DISPATCH_SHA=$(gh_api_with_retry "repos/${TEST_REPO}/git/refs/heads/${BRANCH}" --jq '.object.sha // empty'); then
            echo "::error::Could not resolve ${BRANCH} head SHA before retry dispatch"
            echo "status=retry_dispatch_failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "${RETRY_DISPATCH_SHA}" ]; then
            echo "::error::Branch head SHA empty before retry dispatch"
            echo "status=retry_dispatch_failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "  resolved ${BRANCH} head for retry dispatch: ${RETRY_DISPATCH_SHA:0:7}"

          if ! gh workflow run "${REVIEW_WORKFLOW_FILE}" \
              --repo "${TEST_REPO}" \
              --ref "${BRANCH}" \
              -f pr_number="${PR_NUMBER}" >/tmp/retry_dispatch.txt 2>&1; then
            echo "::error::Retry dispatch failed; cannot recover"
            cat /tmp/retry_dispatch.txt >&2 || true
            echo "status=retry_dispatch_failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "✓ Retry dispatch sent on ${BRANCH} (head ${RETRY_DISPATCH_SHA:0:7}) — polling for the new review run"

          # Poll for the new review run on RETRY_DISPATCH_SHA (the
          # branch head we snapshotted at dispatch time). Skip the run
          # we already saw via wait-review by recording its id. We
          # gate Phase 4b on wait-review having succeeded, which means
          # review_run_id should be a non-empty numeric string here;
          # if it's somehow empty/non-numeric, the jq exclusion filter
          # would default to `select(.id != 0)` (no-op, since GitHub
          # run ids are always positive) and could pick up the
          # original review run as the "retry run". Fail fast in that
          # case rather than silently misattribute.
          if ! [[ "${PRIOR_REVIEW_RUN}" =~ ^[0-9]+$ ]]; then
            echo "::error::wait-review.outputs.review_run_id is not a positive integer ('${PRIOR_REVIEW_RUN}'); refusing to enter retry poll loop with a no-op exclusion filter"
            echo "status=retry_dispatch_failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # 25 minutes (was 10 min; raised after run 25371432937 timed out
          # during the retry's reviewer pass — full review_autofix pipeline
          # is 6 reviewers + consolidator + editor + conflict resolver and
          # observed to take ~20 min wall time, so 600s reliably truncated
          # genuine successful retries. 25 min keeps the upper bound below
          # the orchestrator phase budget while covering the observed P95).
          DEADLINE=$(( $(date +%s) + 1500 ))
          RETRY_RUN_ID=""
          RETRY_STATUS=""
          RETRY_CONCL=""
          # Circuit breaker: if fetch_pr_state returns "unknown" (API
          # failure / parse failure) for too many consecutive iterations
          # we're effectively polling blind and the closed-PR guard
          # above is inactive. Bail out instead of burning the full
          # 25-min retry window during a GitHub outage.
          PR_STATE_FAILURES=0
          PR_STATE_FAILURE_LIMIT=4  # ~60s of consecutive unknowns
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            sleep 15
            # Bail out if the PR closed/merged during the wait — no
            # point polling for a review run that won't fire on a
            # closed PR.
            PR_STATE=$(fetch_pr_state)
            if [ "${PR_STATE}" = "closed" ]; then
              echo "::error::PR #${PR_NUMBER} closed during retry wait — abandoning retry"
              echo "status=pr_closed_during_retry" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if [ "${PR_STATE}" = "unknown" ]; then
              PR_STATE_FAILURES=$((PR_STATE_FAILURES + 1))
              if [ "${PR_STATE_FAILURES}" -ge "${PR_STATE_FAILURE_LIMIT}" ]; then
                echo "::error::PR state unresolvable after ${PR_STATE_FAILURES} consecutive attempts (likely GitHub API outage) — bailing out instead of burning the full retry window"
                echo "status=pr_state_check_failed" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            else
              # Reset on any successful resolve so we only bail on
              # *consecutive* failures, not cumulative.
              PR_STATE_FAILURES=0
            fi
            CANDIDATES=$(gh_api_with_retry \
              "repos/${TEST_REPO}/actions/workflows/${REVIEW_WORKFLOW_FILE}/runs?event=workflow_dispatch&per_page=10" \
              --jq ".workflow_runs[] | select(.head_sha == \"${RETRY_DISPATCH_SHA}\") | select(.id != ${PRIOR_REVIEW_RUN:-0}) | \"\(.id) \(.status) \(.conclusion // \"null\")\"") || CANDIDATES=""
            if [ -z "${CANDIDATES}" ]; then
              echo "  (no new review run yet, pr_state=${PR_STATE})"
              continue
            fi
            # GitHub returns runs newest-first; the matching list is in
            # the same order so head -n 1 picks the most recent
            # candidate (the run we just dispatched).
            RETRY_RUN_ID=$(echo "${CANDIDATES}" | head -n 1 | awk '{print $1}')
            RETRY_STATUS=$(echo "${CANDIDATES}" | head -n 1 | awk '{print $2}')
            RETRY_CONCL=$(echo "${CANDIDATES}" | head -n 1 | awk '{print $3}')
            echo "  retry run #${RETRY_RUN_ID}: status=${RETRY_STATUS} conclusion=${RETRY_CONCL}"
            if [ "${RETRY_STATUS}" = "completed" ]; then
              break
            fi
          done

          if [ -z "${RETRY_RUN_ID}" ] || [ "${RETRY_STATUS:-}" != "completed" ]; then
            echo "::error::Retry review run did not complete within 25 minutes"
            echo "status=retry_timeout" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Validate the retry run's conclusion. If review_autofix
          # itself errored (failure / cancelled / timed_out), running
          # attempt-2 pytest against the resulting unchanged canary
          # would surface as spec_mismatch and falsely blame the
          # editor model. Report retry_workflow_failed so operators
          # look at the retry run's logs, not the editor.
          if [ "${RETRY_CONCL}" != "success" ]; then
            echo "::error::Retry review run #${RETRY_RUN_ID} completed with conclusion=${RETRY_CONCL} (not 'success'); refusing to attribute the resulting canary state to the editor"
            echo "status=retry_workflow_failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # ── Attempt 2 ──────────────────────────────────────────────
          echo "─── Phase 4b attempt 2: re-fetch + pytest after retry ───"
          if ! fetch_canary_to_tmp; then
            echo "::error::Could not re-fetch ${CANARY_PATH} after retry"
            echo "status=fetch_failed_after_retry" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! run_pytest; then
            FAILURE_KIND=$(classify_pytest_failure)
            if [ "${FAILURE_KIND}" = "harness_misconfigured" ]; then
              echo "::error::Phase 4b pytest fixture raised RuntimeError or pytest had INTERNALERROR — harness misconfigured (env var / file path / pytest setup), not an editor regression"
              echo "status=harness_misconfigured" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Canary verification still failed after retry — editor is broken or model fully unavailable"
              echo "status=spec_mismatch" >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi
          echo "✓ Canary verification passed on retry"

          if ! PR_HEAD=$(fetch_pr_head_sha); then
            echo "::error::Could not fetch PR head SHA after retry; treating as infra failure"
            echo "status=pr_head_fetch_failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "${PR_HEAD}" = "${BAIT_SHA}" ]; then
            echo "::error::PR head is still the bait commit after retry — editor did not push a fix commit"
            echo "status=no_editor_commit" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "✓ Editor produced commit(s) past the bait on retry (PR head: ${PR_HEAD:0:7}, bait: ${BAIT_SHA:0:7})"
          echo "status=success_after_retry" >> "$GITHUB_OUTPUT"
          # Explicit exit 0 — symmetric with the first-attempt success
          # path above, and a guard against future code being added
          # past this echo without realising the step was already done.
          exit 0

      # ── Phase 5: Orchestrator script integration test ──────────
      - name: Checkout repository for integration tests
        uses: actions/checkout@v5
        with:
          ref: main

      - name: "Phase 5: Orchestrator script integration test"
        id: orchestrator-scripts
        run: |
          set -euo pipefail
          echo "Running orchestrator script integration tests..."

          # 5a: Python unit tests
          echo "── Unit tests ──"
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_lib.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_blocker_check.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_codex_stall_guard_poller.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_force_tick.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrator_concurrency_caps.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_integration_ahead_by_gate.py

          # 5b: CLI integration — validate a synthetic decomposition
          echo ""
          echo "── CLI: validate decomposition ──"
          SYNTH_FILE="$(mktemp --suffix=.json)"
          cat > "${SYNTH_FILE}" <<'SYNTH'
          {
            "schema_version": "orchestrate_decomposition.v1",
            "project_title": "E2E Orchestrator Validation",
            "project_summary": "Synthetic project for integration testing",
            "issues": [
              {"id": "setup", "title": "Setup", "body": "Setup task", "priority": 1},
              {"id": "impl", "title": "Implement", "body": "Implementation", "priority": 2},
              {"id": "test", "title": "Test", "body": "Testing", "priority": 3}
            ],
            "dependency_edges": [
              {"from": "setup", "to": "impl"},
              {"from": "impl", "to": "test"}
            ]
          }
          SYNTH
          python3 scripts/orchestrate_lib.py validate --input-file "${SYNTH_FILE}"

          echo ""
          echo "── CLI: compute waves ──"
          WAVE_OUTPUT="$(python3 scripts/orchestrate_lib.py compute-waves --input-file "${SYNTH_FILE}")"
          WAVE_COUNT="$(echo "${WAVE_OUTPUT}" | jq '.total_waves')"
          echo "Waves: ${WAVE_COUNT}"
          if [ "${WAVE_COUNT}" -ne 3 ]; then
            echo "::error::Expected 3 waves for linear dependency chain, got ${WAVE_COUNT}"
            exit 1
          fi

          # 5c: CLI integration — check-wave-status with review-blocked labels
          echo ""
          echo "── CLI: check-wave-status with review-blocked ──"
          STATE_FILE="$(mktemp --suffix=.json)"
          cat > "${STATE_FILE}" <<'STATE'
          {
            "schema_version": "orchestrate_state.v1",
            "project_title": "Test",
            "total_issues": 2,
            "total_waves": 1,
            "current_wave": 1,
            "judge_cycle": 0,
            "recovery_attempted": false,
            "review_blocked_retries": {},
            "status": "in_progress",
            "waves": [{"wave": 1, "issues": [
              {"id": "a", "github_issue": 100, "status": "pending"},
              {"id": "b", "github_issue": 101, "status": "pending"}
            ]}],
            "dependency_edges": [],
            "issue_number_map": {},
            "pending_issue_defs": {}
          }
          STATE
          LABELS_JSON='{"100": ["ai:review-blocked"], "101": ["ai:merged"]}'
          STATUS_OUTPUT="$(python3 scripts/orchestrate_lib.py check-wave-status \
            --state-file "${STATE_FILE}" \
            --labels-json "${LABELS_JSON}")"
          echo "${STATUS_OUTPUT}" | jq '.'

          RB_FLAG="$(echo "${STATUS_OUTPUT}" | jq '.any_review_blocked')"
          if [ "${RB_FLAG}" != "true" ]; then
            echo "::error::Expected any_review_blocked=true, got ${RB_FLAG}"
            exit 1
          fi
          WAVE_DONE="$(echo "${STATUS_OUTPUT}" | jq '.wave_complete')"
          if [ "${WAVE_DONE}" != "false" ]; then
            echo "::error::Expected wave_complete=false (review-blocked issue), got ${WAVE_DONE}"
            exit 1
          fi

          # 5d: Validate prompt files exist and are non-empty
          echo ""
          echo "── Prompt files validation ──"
          for pf in prompts/mode-judge.txt prompts/mode-judge-review-blocked.txt prompts/mode-judge-stall-recovery.txt; do
            if [ ! -s "${pf}" ]; then
              echo "::error::Prompt file ${pf} is missing or empty"
              exit 1
            fi
            echo "OK: ${pf} ($(wc -c < "${pf}") bytes)"
          done

          # 5e: Shell script syntax
          echo ""
          echo "── Shell script syntax ──"
          bash -n scripts/orchestrate_poll_process.sh
          echo "OK: orchestrate_poll_process.sh"

          # 5f: Label contract validation
          echo ""
          echo "── Label contract ──"
          python3 scripts/ai_labels.py contract-validate \
            --contract-file .github/ai/label_contract.v1.json

          # 5g: Judge integration-ref context regression guard
          echo ""
          echo "── Judge integration-ref context regression guard ──"
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_poll_process.py test_wave_judge_uses_integration_branch_context_when_available
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_poll_process.py test_wave_judge_uses_default_branch_context_without_integration_metadata

          echo ""
          echo "✓ All orchestrator script integration tests passed"
          echo "status=success" >> "$GITHUB_OUTPUT"

          rm -f "${SYNTH_FILE}" "${STATE_FILE}"

      # ── Phase 6: Review-blocked simulation test ────────────────
      - name: "Phase 6: Simulate review-blocked and verify poller handles it"
        id: review-blocked-sim
        if: steps.wait-implement.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.wait-implement.outputs.pr_number }}
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
        run: |
          set -euo pipefail
          echo "Setting up review-blocked simulation..."

          # 6a: Label the test issue as review-blocked (simulating autofix exhaustion)
          echo "Labeling issue #${ISSUE_NUMBER} as ai:review-blocked..."
          # Ensure the label exists before applying it (idempotent: check then create)
          if ! gh api "repos/${TEST_REPO}/labels/ai:review-blocked" >/dev/null 2>&1; then
            gh api "repos/${TEST_REPO}/labels" \
              -X POST \
              -f name="ai:review-blocked" \
              -f color="e11d48" \
              -f description="PR review/autofix could not resolve all issues — needs human intervention" \
              >/dev/null 2>&1 || true
          fi
          gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/labels" \
            -X POST \
            -f "labels[]=ai:review-blocked" >/dev/null 2>&1 || true
          # Remove other ai: phase labels to simulate a clean review-blocked state
          for label in ai:done ai:ready-to-merge ai:implementing ai:merged; do
            gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/labels/${label}" \
              -X DELETE >/dev/null 2>&1 || true
          done

          # 6b: Create a tracking issue with orchestrator state pointing to this issue
          TRACKING_BODY="## Project: E2E Review-Blocked Simulation

          Synthetic tracking issue for testing the orchestrator's review-blocked handling.

          ---
          *This issue is managed by the AI orchestrator. Do not edit manually.*
          \`ai:orchestrator-tracking\`"

          # Ensure the label exists before creating the issue (idempotent: check then create)
          if ! gh api "repos/${TEST_REPO}/labels/ai:orchestrator-tracking" >/dev/null 2>&1; then
            gh api "repos/${TEST_REPO}/labels" \
              -X POST \
              -f name="ai:orchestrator-tracking" \
              -f color="a2eeef" \
              -f description="Orchestrator project tracking issue" \
              >/dev/null 2>&1 || true
          fi

          # Create the issue WITH the label atomically so the issues:opened
          # event payload already contains ai:orchestrator-tracking.  This
          # prevents the clarify workflow from running on the tracking issue
          # (its guard checks labels at event time).
          TRACKING_NUMBER=$(gh api "repos/${TEST_REPO}/issues" \
            --method POST \
            --input - \
            --jq '.number' <<ISSUEJSON
          {
            "title": "[E2E Smoke Test] Review-Blocked Simulation (run ${GITHUB_RUN_ID})",
            "body": $(printf '%s' "${TRACKING_BODY}" | jq -Rs .),
            "labels": ["ai:orchestrator-tracking"]
          }
          ISSUEJSON
          )

          echo "Created tracking issue #${TRACKING_NUMBER}"
          echo "tracking_number=${TRACKING_NUMBER}" >> "$GITHUB_OUTPUT"

          # 6c: Post orchestrator state as a comment on the tracking issue
          STATE_JSON=$(jq -n \
            --argjson issue_number "${ISSUE_NUMBER}" \
            '{
              schema_version: "orchestrate_state.v1",
              project_title: "E2E Review-Blocked Simulation",
              total_issues: 1,
              total_waves: 1,
              current_wave: 1,
              judge_cycle: 0,
              recovery_attempted: false,
              review_blocked_retries: {},
              status: "in_progress",
              waves: [{wave: 1, issues: [
                {id: "test-issue", github_issue: $issue_number, status: "pending"}
              ]}],
              dependency_edges: [],
              issue_number_map: {"test-issue": $issue_number},
              pending_issue_defs: {}
            }')

          STATE_COMMENT="<!-- ORCHESTRATOR_STATE_V1
          ${STATE_JSON}
          ORCHESTRATOR_STATE_V1 -->"

          # Diagnostic: capture gh stdout + stderr so 4xx errors surface
          # the API's errors[] payload instead of the opaque
          # "gh: Validation Failed (HTTP 422)" that happens when the response
          # body is redirected to /dev/null.
          if ! POST_OUT="$(mktemp)"; then
            echo "::error::Failed to create temp file for stdout capture (mktemp failed)"
            exit 1
          fi
          if ! POST_ERR="$(mktemp)"; then
            rm -f "${POST_OUT}"
            echo "::error::Failed to create temp file for stderr capture (mktemp failed)"
            exit 1
          fi

          # GitHub has a brief eventual-consistency window between issues.create
          # and the new issue node being resolvable by id for child writes
          # (comments). The first POST after create can fail with HTTP 422
          # "Could not resolve to a node with the global id of '<node_id>'".
          # Retry on that specific class of 422 with bounded backoff; a 422
          # for any other reason fails fast.
          COMMENT_POST_OK=0
          COMMENT_POST_MAX_ATTEMPTS=5
          COMMENT_POST_SLEEP=2
          for ((attempt = 1; attempt <= COMMENT_POST_MAX_ATTEMPTS; attempt++)); do
            : >"${POST_OUT}"
            : >"${POST_ERR}"
            if jq -n --arg body "${STATE_COMMENT}" '{"body": $body}' | \
                gh api "repos/${TEST_REPO}/issues/${TRACKING_NUMBER}/comments" \
                  --method POST --input - >"${POST_OUT}" 2>"${POST_ERR}"; then
              COMMENT_POST_OK=1
              break
            fi
            # Retry only on the eventual-consistency 422 ("Could not resolve to
            # a node") — every other failure (auth, validation, 5xx, etc.) is
            # surfaced immediately so we don't mask real bugs.
            if grep -qi "Could not resolve to a node" "${POST_ERR}" "${POST_OUT}" 2>/dev/null && \
               grep -qi "HTTP 422" "${POST_ERR}" "${POST_OUT}" 2>/dev/null; then
              if [ "${attempt}" -lt "${COMMENT_POST_MAX_ATTEMPTS}" ]; then
                echo "  ⏳ Comment POST hit eventual-consistency 422 (attempt ${attempt}/${COMMENT_POST_MAX_ATTEMPTS}) — retrying in ${COMMENT_POST_SLEEP}s"
                sleep "${COMMENT_POST_SLEEP}"
                COMMENT_POST_SLEEP=$((COMMENT_POST_SLEEP * 2))
                continue
              fi
            fi
            break
          done

          if [ "${COMMENT_POST_OK}" -ne 1 ]; then
            echo "::error::Failed to post orchestrator state comment (repo=${TEST_REPO} tracking_issue=${TRACKING_NUMBER})"
            echo "::group::gh stderr"
            cat "${POST_ERR}" || true
            echo "::endgroup::"
            echo "::group::API response body (first 4KB of stdout)"
            head -c 4096 "${POST_OUT}" || true
            echo ""
            echo "::endgroup::"
            rm -f "${POST_OUT}" "${POST_ERR}"
            exit 1
          fi
          rm -f "${POST_OUT}" "${POST_ERR}"

          echo "Posted orchestrator state to tracking issue #${TRACKING_NUMBER}"

          # 6d: Trigger the poller workflow
          echo "Triggering orchestrator poller..."
          POLLER_WORKFLOW="internal-orchestrate-poll.yml"
          if ! gh workflow run "${POLLER_WORKFLOW}" --repo "${TEST_REPO}" 2>/dev/null; then
            # Try the consumer wrapper name
            POLLER_WORKFLOW="ai-orchestrate-poll.yml"
            if ! gh workflow run "${POLLER_WORKFLOW}" --repo "${TEST_REPO}" 2>/dev/null; then
              echo "::warning::Could not trigger poller workflow. Skipping review-blocked verification."
              echo "status=skipped" >> "$GITHUB_OUTPUT"
              # Cleanup tracking issue
              gh api "repos/${TEST_REPO}/issues/${TRACKING_NUMBER}" \
                -X PATCH -f state=closed -f state_reason=not_planned 2>/dev/null || true
              exit 0
            fi
          fi

          echo "Poller triggered. Waiting for it to process the review-blocked issue..."

          # 6e: Wait for the poller to handle the review-blocked issue
          # The poller should: invoke judge → merge/fix/close_and_reissue
          # We verify by checking if the label changed from ai:review-blocked
          INACTIVITY_LIMIT=$((PHASE_TIMEOUT * 60))
          LAST_ACTIVITY=$(date +%s)
          PREV_STATE=""
          PREV_LABELS=""
          RATE_LIMIT_BACKOFF=0
          . ./scripts/comprehensive_test_and_release_gh_api.sh

          while true; do
            NOW=$(date +%s)
            IDLE=$((NOW - LAST_ACTIVITY))

            LABELS=$(gh_api_safe_quiet_print "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" \
              --jq '[.labels[].name] | join(",")' || echo "")

            # If rate-limited, skip this cycle (don't corrupt state)
            if [ "$RATE_LIMIT_BACKOFF" -gt 0 ] && [ -z "$LABELS" ]; then
              sleep "$POLL_INTERVAL"
              continue
            fi

            # Also check poller workflow run status for activity detection
            POLLER_RUN=$(gh_api_safe_quiet_print "repos/${TEST_REPO}/actions/runs?per_page=5&event=workflow_dispatch" \
              --jq "[.workflow_runs[] | select(.name | test(\"Orchestrate.*Poll|Poll\"; \"i\"))] | sort_by(.created_at) | last" || echo "")
            POLLER_STATUS="unknown"
            POLLER_CONCLUSION="null"
            if [ -n "${POLLER_RUN}" ] && [ "${POLLER_RUN}" != "null" ]; then
              POLLER_STATUS=$(echo "${POLLER_RUN}" | jq -r '.status // "unknown"')
              POLLER_CONCLUSION=$(echo "${POLLER_RUN}" | jq -r '.conclusion // "null"')
            fi

            CUR_STATE="labels=${LABELS};poller=${POLLER_STATUS};conclusion=${POLLER_CONCLUSION}"

            # Capture the latest poller run id (used by the per-phase
            # soft-error analyser invocation below to ingest the poller's
            # logs as the `orchestrate_poll` phase artifact).
            if [ -n "${POLLER_RUN}" ] && [ "${POLLER_RUN}" != "null" ]; then
              POLLER_LATEST_ID=$(echo "${POLLER_RUN}" | jq -r '.id // empty')
              if [ -n "${POLLER_LATEST_ID}" ]; then
                echo "poller_run_id=${POLLER_LATEST_ID}" >> "$GITHUB_OUTPUT"
              fi
            fi

            # Reset inactivity timer only when LABELS change (not poller
            # status alone — poller runs starting/completing would otherwise
            # reset the timer indefinitely while labels remain stuck).
            if [ "$LABELS" != "$PREV_LABELS" ]; then
              if [ -n "$PREV_LABELS" ]; then
                echo "  ↻ Label change detected — resetting inactivity timer"
              fi
              LAST_ACTIVITY=$NOW
              IDLE=0
              PREV_LABELS="$LABELS"
            fi
            # Still track full state for debug logging
            PREV_STATE="$CUR_STATE"

            # Success: poller has driven the review-blocked issue to a
            # terminal state. Two shapes are accepted:
            #   1. ai:review-blocked has been cleared entirely (judge fixed
            #      or closed-and-reissued the issue), OR
            #   2. ai:review-blocked is still present alongside a terminal
            #      label (ai:merged or ai:ready-to-merge) — the judge-merge
            #      path legitimately leaves the original review-blocked label
            #      on the issue while merging the PR.
            REVIEW_BLOCKED_PRESENT=0
            TERMINAL_LABEL_PRESENT=0
            if echo "$LABELS" | grep -q 'ai:review-blocked'; then
              REVIEW_BLOCKED_PRESENT=1
            fi
            if echo "$LABELS" | grep -qE 'ai:merged|ai:ready-to-merge'; then
              TERMINAL_LABEL_PRESENT=1
            fi
            if [ "$REVIEW_BLOCKED_PRESENT" -eq 0 ] || [ "$TERMINAL_LABEL_PRESENT" -eq 1 ]; then
              echo "✓ Review-blocked simulation passed — poller handled the issue"
              echo "  Current labels: ${LABELS}"

              if echo "$LABELS" | grep -q 'ai:merged'; then
                echo "  Action: merge (judge merged the PR; ai:review-blocked retained on issue)"
              elif echo "$LABELS" | grep -q 'ai:ready-to-merge'; then
                echo "  Action: merge (judge decided to merge as-is)"
              elif echo "$LABELS" | grep -q 'ai:closed'; then
                echo "  Action: close_and_reissue (judge closed the PR)"
              else
                echo "  Action: fix or other (labels: ${LABELS})"
              fi

              echo "status=success" >> "$GITHUB_OUTPUT"

              gh api "repos/${TEST_REPO}/issues/${TRACKING_NUMBER}" \
                -X PATCH -f state=closed -f state_reason=not_planned 2>/dev/null || true
              exit 0
            fi

            # Check if the poller workflow failed
            if [ "${POLLER_STATUS}" = "completed" ] && [ "${POLLER_CONCLUSION}" = "failure" ]; then
              echo "::warning::Poller workflow failed — review-blocked handling may not have been reached"
              echo "status=poller_failed" >> "$GITHUB_OUTPUT"
              gh api "repos/${TEST_REPO}/issues/${TRACKING_NUMBER}" \
                -X PATCH -f state=closed -f state_reason=not_planned 2>/dev/null || true
              exit 0
            fi

            # Inactivity timeout
            if [ $IDLE -ge $INACTIVITY_LIMIT ]; then
              echo "::warning::Review-blocked sim stalled — no activity for ${PHASE_TIMEOUT} minutes"
              echo "status=timeout" >> "$GITHUB_OUTPUT"
              gh api "repos/${TEST_REPO}/issues/${TRACKING_NUMBER}" \
                -X PATCH -f state=closed -f state_reason=not_planned 2>/dev/null || true
              exit 0
            fi

            REMAINING=$(( (INACTIVITY_LIMIT - IDLE + 59) / 60 ))
            echo "  ... idle ${IDLE}s (timeout in ~${REMAINING}m) — labels: ${LABELS:-none}"
            sleep "$POLL_INTERVAL"
          done

      # ── Deep verification: inspect every step in every workflow run ─
      - name: "Deep verify: inspect all workflow run steps"
        id: deep-verify
        env:
          CLARIFY_RUN_ID: ${{ steps.wait-clarify.outputs.run_id }}
          PLAN_RUN_ID: ${{ steps.wait-plan.outputs.run_id }}
          IMPL_RUN_ID: ${{ steps.wait-implement.outputs.run_id }}
          REVIEW_RUN_ID: ${{ steps.wait-review.outputs.review_run_id }}
        run: |
          set -euo pipefail

          DEEP_PASS=true
          FAILED_STEPS=""
          SKIPPED_STEPS=""
          TOTAL_CHECKED=0
          TOTAL_OK=0
          TOTAL_FAILED=0
          TOTAL_SKIPPED=0

          # ── Helper: check ALL steps in a workflow run ──
          check_all_steps() {
            local run_id="$1"
            local phase_name="$2"

            if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
              echo ""
              echo "  ⚠ ${phase_name}: workflow run ID not captured — cannot verify steps"
              DEEP_PASS=false
              FAILED_STEPS="${FAILED_STEPS}\n  - ${phase_name}: run ID not found (phase may not have triggered)"
              return 0
            fi

            echo ""
            echo "  ┌─ ${phase_name} (run #${run_id})"

            # Fetch all jobs and their steps (retry up to 3 times on transient failures).
            #
            # IMPORTANT: Do NOT use `JOBS_JSON=$(gh api ... || echo fallback)`.
            # On non-zero exit, `gh api` still writes the API error body (e.g.
            # `{"message":"Not Found",...}`) to stdout; inside `$(...)`, the
            # `|| echo` branch runs anyway and its output is *concatenated*
            # with gh's stdout, producing a multi-document JSON blob. Downstream
            # `jq '.jobs | length'` then emits multiple lines (one per document),
            # `[ "$TOTAL_JOBS" -eq 0 ]` trips with "integer expression expected",
            # and `jq '[.jobs[] | select(...)] | length'` errors with "Cannot
            # iterate over null (null)" on any error-body document whose .jobs
            # key is missing. Always assign the fallback outside the command
            # substitution so the two outputs can't concatenate.
            #
            # Single source of truth for the schema predicate. Uses `jq -se`
            # (slurp + exit-status) so multi-document input fails the
            # predicate — without `-s`, `jq -e` evaluates each document
            # independently and exits with the truthiness of the *last*
            # document, so a multi-doc blob whose tail happens to satisfy
            # the schema would pass through and break downstream
            # `jq '.jobs | length'` with mixed-line output. Extracted into a
            # helper so the outer retry and the indexing-delay recheck stay
            # in lock-step.
            _jobs_json_valid() {
              printf '%s' "$1" \
                | jq -se 'length == 1 and (.[0] | type == "object" and (.jobs | type == "array"))' \
                >/dev/null 2>&1
            }

            JOBS_JSON='{"jobs":[]}'
            for _attempt in 1 2 3; do
              if _JOBS_OUT=$(gh api "repos/${TEST_REPO}/actions/runs/${run_id}/jobs?per_page=100" 2>/dev/null); then
                JOBS_JSON="$_JOBS_OUT"
                break
              fi
              echo "  │  ⚠ API attempt ${_attempt}/3 failed — retrying in 2s..."
              sleep 2
            done
            unset _JOBS_OUT
            # Shape check: reject anything that isn't a single JSON object
            # with a `.jobs` array. Catches (a) all-retries-failed with an
            # empty JOBS_JSON, (b) error-body responses that happen to parse,
            # and (c) any future accidental multi-doc concatenation.
            if ! _jobs_json_valid "$JOBS_JSON"; then
              JOBS_JSON='{"jobs":[]}'
            fi

            # Check if all jobs in this run were skipped (spurious re-trigger where
            # the reusable workflow's job-level if: condition was false). This commonly
            # happens when a comment event re-triggers internal-clarify.yml or
            # internal-implement.yml but the reusable workflow skips the job.
            TOTAL_JOBS=$(echo "$JOBS_JSON" | jq '.jobs | length')
            SKIPPED_JOBS=$(echo "$JOBS_JSON" | jq '[.jobs[] | select(.conclusion == "skipped")] | length')
            if [ "$TOTAL_JOBS" -eq 0 ]; then
              # GitHub can briefly report zero jobs before the run is fully indexed.
              # Re-fetch a few times so we don't false-pass real runs as spurious.
              echo "  │  ⚠ Run has no jobs yet — rechecking for indexing delay..."
              for _jobs_retry in 1 2 3; do
                sleep $((_jobs_retry * 2))
                # Same hazard as the outer retry — assign fallback outside the
                # command substitution so gh's error-body stdout cannot
                # concatenate with the literal fallback JSON.
                if _JOBS_OUT=$(gh api "repos/${TEST_REPO}/actions/runs/${run_id}/jobs?per_page=100" 2>/dev/null); then
                  JOBS_JSON="$_JOBS_OUT"
                else
                  JOBS_JSON='{"jobs":[]}'
                fi
                unset _JOBS_OUT
                if ! _jobs_json_valid "$JOBS_JSON"; then
                  JOBS_JSON='{"jobs":[]}'
                fi
                TOTAL_JOBS=$(echo "$JOBS_JSON" | jq '.jobs | length')
                SKIPPED_JOBS=$(echo "$JOBS_JSON" | jq '[.jobs[] | select(.conclusion == "skipped")] | length')
                [ "$TOTAL_JOBS" -gt 0 ] && break
              done
            fi
            if [ "$TOTAL_JOBS" -eq 0 ]; then
              echo "  │  ⊘ Run has no jobs after retries (spurious re-trigger) — OK"
              echo "  └─"
              return 0
            fi
            if [ "$SKIPPED_JOBS" -eq "$TOTAL_JOBS" ]; then
              echo "  │  ⊘ All ${TOTAL_JOBS} job(s) were skipped (spurious re-trigger) — OK"
              echo "  └─"
              return 0
            fi

            # Iterate every step in every job
            STEP_COUNT=$(echo "$JOBS_JSON" | jq '[.jobs[].steps[]] | length')
            if [ "$STEP_COUNT" -eq 0 ]; then
              echo "  │  ⚠ No steps found — run may still be in progress or API returned empty"
              DEEP_PASS=false
              FAILED_STEPS="${FAILED_STEPS}\n  - ${phase_name}: no steps found in run"
              echo "  └─"
              return 0
            fi

            local phase_ok=0
            local phase_fail=0
            local phase_skip=0

            # Process each step
            while IFS=$'\t' read -r step_name step_conclusion step_status; do
              TOTAL_CHECKED=$((TOTAL_CHECKED + 1))

              # Skip GitHub's internal "Set up job" / "Complete job" steps —
              # these are infra steps, not workflow logic
              if [ "$step_name" = "Set up job" ] || [ "$step_name" = "Complete job" ] || [ "$step_name" = "Post actions/checkout@v5" ]; then
                continue
              fi

              case "${step_conclusion}" in
                success)
                  echo "  │  ✓ ${step_name}"
                  phase_ok=$((phase_ok + 1))
                  TOTAL_OK=$((TOTAL_OK + 1))
                  ;;
                skipped)
                  echo "  │  ⊘ ${step_name} — SKIPPED"
                  phase_skip=$((phase_skip + 1))
                  TOTAL_SKIPPED=$((TOTAL_SKIPPED + 1))
                  SKIPPED_STEPS="${SKIPPED_STEPS}\n  - ${phase_name} → ${step_name}"
                  ;;
                failure)
                  echo "  │  ✗ ${step_name} — FAILED"
                  phase_fail=$((phase_fail + 1))
                  TOTAL_FAILED=$((TOTAL_FAILED + 1))
                  DEEP_PASS=false
                  FAILED_STEPS="${FAILED_STEPS}\n  - ${phase_name} → ${step_name}"
                  ;;
                cancelled)
                  echo "  │  ⊘ ${step_name} — CANCELLED"
                  phase_skip=$((phase_skip + 1))
                  TOTAL_SKIPPED=$((TOTAL_SKIPPED + 1))
                  SKIPPED_STEPS="${SKIPPED_STEPS}\n  - ${phase_name} → ${step_name} (cancelled)"
                  ;;
                *)
                  echo "  │  ? ${step_name} — ${step_conclusion:-unknown} (status: ${step_status})"
                  # In-progress or unknown — flag but don't fail
                  SKIPPED_STEPS="${SKIPPED_STEPS}\n  - ${phase_name} → ${step_name} (${step_conclusion:-unknown})"
                  ;;
              esac
            done < <(echo "$JOBS_JSON" | jq -r '.jobs[].steps[] | [.name, .conclusion, .status] | @tsv')

            echo "  └─ ${phase_ok} ok, ${phase_fail} failed, ${phase_skip} skipped"
          }

          echo "═══════════════════════════════════════════"
          echo "  Deep Verification: All Workflow Steps"
          echo "═══════════════════════════════════════════"

          check_all_steps "${CLARIFY_RUN_ID}" "Clarify"
          check_all_steps "${PLAN_RUN_ID}" "Plan"
          check_all_steps "${IMPL_RUN_ID}" "Implement"
          check_all_steps "${REVIEW_RUN_ID}" "Review/Edit"

          echo ""
          echo "───────────────────────────────────────────"
          echo "  Totals: ${TOTAL_OK} ok, ${TOTAL_FAILED} failed, ${TOTAL_SKIPPED} skipped"
          echo "───────────────────────────────────────────"

          # Print the failed-steps list whenever deep verify did not fully pass,
          # so "no steps found in run" / "run ID not found" entries (which do not
          # increment TOTAL_FAILED) are still surfaced in the summary.
          if [ "$DEEP_PASS" != "true" ] || [ "$TOTAL_FAILED" -gt 0 ]; then
            echo ""
            echo "  Failed steps:"
            echo -e "$FAILED_STEPS"
          fi

          if [ "$TOTAL_SKIPPED" -gt 0 ]; then
            echo ""
            echo "  Skipped steps:"
            echo -e "$SKIPPED_STEPS"
          fi

          echo ""
          if [ "$DEEP_PASS" = "true" ]; then
            echo "  ✓ All steps across all phases succeeded."
            echo "deep_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "  ✗ Some steps failed — see details above."
            echo "deep_passed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "═══════════════════════════════════════════"

      # Per-phase soft-error analysis: orchestrate-poll (RBSIM)
      - name: "Phase 6b: Soft-error analyser (orchestrate-poll)"
        if: always() && steps.review-blocked-sim.outputs.poller_run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            orchestrate_poll=${{ steps.review-blocked-sim.outputs.poller_run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-orchestrate_poll
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

      # ── Phase 7: Verify cancel_on_pr_close fires on PR close ───
      # Closes the smoke-test PR and watches internal-cancel-on-pr-close.yml
      # complete successfully. This is the only path through the
      # cancel_on_pr_close.yml reusable workflow that the gate exercises end
      # to end. Done before the unconditional cleanup step so it can hard
      # fail the release; the cleanup step below is left as a safety net for
      # the issue / tracking / branch resources.
      - name: "Phase 7: Close PR and verify cancel_on_pr_close fires"
        id: verify-cancel-on-close
        if: steps.wait-implement.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.wait-implement.outputs.pr_number }}
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
        run: |
          set -euo pipefail
          BRANCH="ai/issue-${ISSUE_NUMBER}"

          # The PR may already be closed/merged by the time Phase 7 runs —
          # earlier phases (orchestrator auto-merge after review approval)
          # can close it asynchronously. PATCH-ing state=closed on an
          # already-closed PR is a no-op and fires no `pull_request.closed`
          # webhook, so the poll below would time out even though
          # cancel_on_pr_close already ran successfully on the original
          # close. Detect that case and verify the cancel run that fired
          # for the prior close instead.
          # Default to '{}' on gh failure so subsequent jq parses don't
          # blow up under `set -euo pipefail`.
          PR_INFO=$(gh api "repos/${TEST_REPO}/pulls/${PR_NUMBER}" \
            --jq '{state, head_sha: .head.sha}' 2>/dev/null || echo "{}")
          PR_STATE=$(echo "${PR_INFO}" | jq -r '.state // ""')
          PR_HEAD_SHA=$(echo "${PR_INFO}" | jq -r '.head_sha // ""')
          if [ -z "${PR_STATE}" ]; then
            echo "::error::Could not read state of PR #${PR_NUMBER} (gh api returned empty)"
            echo "status=lookup_failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "${PR_STATE}" = "closed" ]; then
            echo "PR #${PR_NUMBER} is already closed (head_sha=${PR_HEAD_SHA}); looking up the cancel-on-close run that fired for that closure."
            EXISTING=$(gh api \
              "repos/${TEST_REPO}/actions/workflows/internal-cancel-on-pr-close.yml/runs?per_page=20&head_sha=${PR_HEAD_SHA}" \
              --jq '[.workflow_runs[] | select(.event == "pull_request")] | sort_by(.created_at) | last' 2>/dev/null || echo "")
            if [ -z "${EXISTING}" ] || [ "${EXISTING}" = "null" ]; then
              echo "::error::PR #${PR_NUMBER} already closed but no internal-cancel-on-pr-close run found for head_sha=${PR_HEAD_SHA}"
              echo "status=no_run" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            EXISTING_RUN_ID=$(echo "${EXISTING}" | jq -r '.id // ""')
            EXISTING_STATUS=$(echo "${EXISTING}" | jq -r '.status // ""')
            EXISTING_CONCLUSION=$(echo "${EXISTING}" | jq -r '.conclusion // ""')
            echo "  found pre-existing cancel-on-close run #${EXISTING_RUN_ID}: status=${EXISTING_STATUS}, conclusion=${EXISTING_CONCLUSION}"
            # Match the open-PR poll budget (600s) so a slow/queued run
            # doesn't flake the smoke test if it would have eventually
            # succeeded.
            WAIT_DEADLINE=$(( $(date +%s) + 600 ))
            while [ "${EXISTING_STATUS}" != "completed" ] && [ "$(date +%s)" -lt "${WAIT_DEADLINE}" ]; do
              sleep 5
              # `gh api --jq` consumes the JSON inside gh, so a transient
              # failure produces an empty string rather than malformed
              # JSON for the next iteration to parse.
              EXISTING_STATUS=$(gh api "repos/${TEST_REPO}/actions/runs/${EXISTING_RUN_ID}" \
                --jq '.status // ""' 2>/dev/null || echo "")
              EXISTING_CONCLUSION=$(gh api "repos/${TEST_REPO}/actions/runs/${EXISTING_RUN_ID}" \
                --jq '.conclusion // ""' 2>/dev/null || echo "")
              echo "  cancel-on-close run #${EXISTING_RUN_ID}: status=${EXISTING_STATUS:-?}, conclusion=${EXISTING_CONCLUSION:-?}"
            done
            if [ "${EXISTING_STATUS}" != "completed" ]; then
              echo "::error::cancel-on-close run #${EXISTING_RUN_ID} did not complete within 600s (status=${EXISTING_STATUS:-?})"
              echo "status=timeout" >> "$GITHUB_OUTPUT"
              echo "cancel_run_id=${EXISTING_RUN_ID}" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if [ "${EXISTING_CONCLUSION}" != "success" ]; then
              echo "::error::cancel-on-close run #${EXISTING_RUN_ID} concluded ${EXISTING_CONCLUSION:-no_run}"
              echo "status=${EXISTING_CONCLUSION:-no_run}" >> "$GITHUB_OUTPUT"
              echo "cancel_run_id=${EXISTING_RUN_ID}" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "✓ cancel-on-close run #${EXISTING_RUN_ID} succeeded (fired on prior PR close)"
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "cancel_run_id=${EXISTING_RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PR is still open — exercise the close path end to end.
          # Snapshot the most recent cancel-on-close run BEFORE we close the
          # PR so we can detect a fresh run by monotonic ID after the close.
          PRE_RUN_ID=$(gh api \
            "repos/${TEST_REPO}/actions/workflows/internal-cancel-on-pr-close.yml/runs?per_page=1" \
            --jq '.workflow_runs[0].id // 0' 2>/dev/null || echo 0)
          echo "Pre-close cancel run head: ${PRE_RUN_ID}"

          # Close the PR (this is what triggers internal-cancel-on-pr-close).
          gh api "repos/${TEST_REPO}/pulls/${PR_NUMBER}" \
            -X PATCH -f state=closed >/dev/null 2>&1 \
            || { echo "::error::Could not close PR #${PR_NUMBER}"; echo "status=close_failed" >> "$GITHUB_OUTPUT"; exit 1; }
          echo "✓ Closed PR #${PR_NUMBER}"

          # Event-propagation grace: GitHub's webhook delivery for the
          # `pull_request.closed` event is usually sub-second but has been
          # observed to lag 2-3 seconds under heavy queue load. Sleep 5s
          # before the first poll so we don't false-fail by reading the
          # `actions/workflows/.../runs` index before the cancel run has
          # been created. The 600s overall budget below absorbs this.
          sleep 5

          # Wait for a new cancel-on-close run to register and complete.
          # Internal-cancel-on-pr-close fires near-immediately on the
          # pull_request[closed] webhook but the API can take a few
          # seconds to index the new run. Poll fast for the first 30s
          # to catch quick runs (the cancel job is short — it only
          # cancels other workflows), then back off to a slower cadence
          # to ride out longer execution. Total budget unchanged at 600s.
          DEADLINE=$(( $(date +%s) + 600 ))
          POLL_START=$(date +%s)
          NEW_RUN_ID=""
          NEW_CONCLUSION=""
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            CANDIDATE=$(gh api \
              "repos/${TEST_REPO}/actions/workflows/internal-cancel-on-pr-close.yml/runs?per_page=10" \
              --jq "[.workflow_runs[] | select(.id > ${PRE_RUN_ID})] | sort_by(.created_at) | last" 2>/dev/null || echo "")
            if [ -n "${CANDIDATE}" ] && [ "${CANDIDATE}" != "null" ]; then
              NEW_RUN_ID=$(echo "${CANDIDATE}" | jq -r '.id // ""')
              STATUS=$(echo "${CANDIDATE}" | jq -r '.status // ""')
              NEW_CONCLUSION=$(echo "${CANDIDATE}" | jq -r '.conclusion // ""')
              echo "  cancel-on-close run #${NEW_RUN_ID}: status=${STATUS}, conclusion=${NEW_CONCLUSION}"
              if [ "${STATUS}" = "completed" ]; then
                break
              fi
            fi
            ELAPSED=$(( $(date +%s) - POLL_START ))
            if [ "${ELAPSED}" -lt 30 ]; then
              sleep 3
            else
              sleep 10
            fi
          done

          if [ -z "${NEW_RUN_ID}" ]; then
            echo "::error::internal-cancel-on-pr-close did not register a new run within timeout"
            echo "status=no_run" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "${NEW_CONCLUSION}" != "success" ]; then
            echo "::error::cancel-on-close run #${NEW_RUN_ID} concluded ${NEW_CONCLUSION}"
            echo "status=${NEW_CONCLUSION}" >> "$GITHUB_OUTPUT"
            echo "cancel_run_id=${NEW_RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "✓ cancel-on-close run #${NEW_RUN_ID} succeeded"
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "cancel_run_id=${NEW_RUN_ID}" >> "$GITHUB_OUTPUT"

      # Per-phase soft-error analysis: cancel-on-pr-close
      - name: "Phase 7b: Soft-error analyser (cancel-on-pr-close)"
        if: always() && steps.verify-cancel-on-close.outputs.cancel_run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            cancel_on_pr_close=${{ steps.verify-cancel-on-close.outputs.cancel_run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-cancel_on_pr_close
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

      # The previous Phase 8 in this job re-ran the LLM analyser across
      # the 6 captured phases to produce a single combined report and
      # truncated it byte-wise for the Telegram summary. That step was
      # removed in favour of a deterministic concat performed in the
      # `notify` job (see `Consolidate per-phase soft-error reports`),
      # which can see every smoke-test sibling job's per-phase
      # artifacts — not just this job's six. The per-phase analyser
      # invocations above remain the source of truth.

      # ── Verification summary ───────────────────────────────────
      # if: always() so the consolidated pass/fail table runs even when
      # an upstream phase exits non-zero. Without this, an intermediate
      # phase failure (e.g., wait-review hitting its own timeout) would
      # short-circuit the job at the implicit `if: success()` and skip
      # this summary, hiding the per-phase outcomes — including the
      # `pr_already_closed` special-case from inject-bait, which the
      # multi-reviewer claude-branch-review flagged as fragile in the
      # success-only chaining model. Each step output is read via
      # `${{ steps.X.outputs.Y }}` which evaluates to empty string for
      # skipped/unset steps; the comparison logic below treats anything
      # other than the expected "success" / "completed_with_findings"
      # values as a phase failure and sets PASSED=false, so missing
      # outputs correctly fail the test.
      - name: Verify all phases passed
        id: verify
        if: always()
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
          PR_NUMBER: ${{ steps.wait-implement.outputs.pr_number }}
        run: |
          set -euo pipefail
          echo "═══════════════════════════════════════════"
          echo "  E2E Smoke Test Results"
          echo "═══════════════════════════════════════════"
          echo ""

          PASSED=true

          # Check the early hot-regression guard
          HOT_POLLER_GUARD="${{ steps.hot-poller-guard.outputs.status }}"
          if [ "$HOT_POLLER_GUARD" = "success" ]; then
            echo "  ✓ Hot poller .. PASSED"
          else
            echo "  ✗ Hot poller .. FAILED (${HOT_POLLER_GUARD:-not_run})"
            PASSED=false
          fi

          # Check clarify
          CLARIFY="${{ steps.wait-clarify.outputs.status }}"
          if [ "$CLARIFY" = "success" ]; then
            echo "  ✓ Clarify .... PASSED"
          else
            echo "  ✗ Clarify .... FAILED (${CLARIFY})"
            PASSED=false
          fi

          # Check plan
          PLAN="${{ steps.wait-plan.outputs.status }}"
          if [ "$PLAN" = "success" ] || [ "$PLAN" = "auto_approved" ]; then
            echo "  ✓ Plan ....... PASSED"
          else
            echo "  ✗ Plan ....... FAILED (${PLAN})"
            PASSED=false
          fi

          # Check implement
          IMPL="${{ steps.wait-implement.outputs.status }}"
          if [ "$IMPL" = "success" ]; then
            echo "  ✓ Implement .. PASSED (PR #${PR_NUMBER})"
          else
            echo "  ✗ Implement .. FAILED (${IMPL})"
            PASSED=false
          fi

          # Check review
          REVIEW="${{ steps.wait-review.outputs.status }}"
          if [ "$REVIEW" = "success" ] || [ "$REVIEW" = "completed_with_findings" ]; then
            echo "  ✓ Review ..... PASSED"
          else
            echo "  ✗ Review ..... FAILED (${REVIEW})"
            PASSED=false
          fi

          # Check Phase 4b — pytest verification that the editor
          # restored the canary file byte-for-byte and pushed a fix
          # commit past the bait. (Variable names retain the "BAIT_"
          # prefix from the prior single-line-bait era so existing
          # log greps and downstream tooling keep working.)
          BAIT_INJECTED="${{ steps.inject-bait.outputs.status }}"
          BAIT_VERIFIED="${{ steps.verify-bait-removed.outputs.status }}"
          REVIEW_OK=false
          if [ "$REVIEW" = "success" ] || [ "$REVIEW" = "completed_with_findings" ]; then
            REVIEW_OK=true
          fi
          if [ "$BAIT_INJECTED" = "skipped" ]; then
            echo "  - Editor Bait. SKIPPED (could not inject — non-blocking)"
          elif [ "$BAIT_INJECTED" = "pr_already_closed" ]; then
            # Phase 3c's fail-fast guard: PR was already closed/merged
            # before the bait could be injected (almost certainly the
            # deterministic-skip-merge auto-merge race). Distinct from
            # a generic editor failure — the editor never had a chance
            # to run because the test setup itself was sabotaged.
            echo "  ✗ Editor Bait. FAILED (pr_already_closed) — PR was merged/closed before bait injection; editor never invoked. See Phase 3c log."
            PASSED=false
          elif [ -z "$BAIT_VERIFIED" ] && [ "$REVIEW_OK" != true ]; then
            # Phase 4b is gated on wait-review succeeding; if Review
            # didn't complete cleanly, Phase 4b was skipped on
            # purpose (no point retry-polling a known-broken state).
            # The Review FAILED line above already counts that
            # failure — don't double-count it as an editor bug.
            echo "  - Editor Bait. SKIPPED (review didn't complete — see Review row above)"
          elif [ "$BAIT_VERIFIED" = "success" ]; then
            echo "  ✓ Editor Bait. PASSED (editor restored canary + pushed fix commit)"
          elif [ "$BAIT_VERIFIED" = "success_after_retry" ]; then
            echo "  ✓ Editor Bait. PASSED on retry (editor restored canary after one re-dispatch — see Phase 4b log)"
          else
            # Hard-fail: pytest verification (Phase 4b) failed both on
            # the first attempt AND after a one-shot review_autofix
            # re-dispatch. This is consistent with a real production
            # regression (Serena/MCP breakage, prompt drift, parser bug)
            # rather than a single-shot model flake — those get absorbed
            # by the retry budget.
            echo "  ✗ Editor Bait. FAILED (${BAIT_VERIFIED:-not_run}) — editor pipeline did not exercise correctly even after retry"
            PASSED=false
          fi

          # Check orchestrator scripts (Phase 5)
          ORCH="${{ steps.orchestrator-scripts.outputs.status }}"
          if [ "$ORCH" = "success" ]; then
            echo "  ✓ Orch Tests . PASSED"
          else
            echo "  ✗ Orch Tests . FAILED (${ORCH:-not_run})"
            PASSED=false
          fi

          # Check review-blocked simulation (Phase 6)
          RBSIM="${{ steps.review-blocked-sim.outputs.status }}"
          if [ "$RBSIM" = "success" ] || [ "$RBSIM" = "skipped" ]; then
            echo "  ✓ RB Sim ..... PASSED (${RBSIM})"
          elif [ "$RBSIM" = "poller_failed" ]; then
            echo "  ⚠ RB Sim ..... WARN (poller workflow failed — non-blocking)"
          elif [ "$RBSIM" = "timeout" ]; then
            echo "  ⚠ RB Sim ..... WARN (timed out — non-blocking)"
          elif [ -z "$RBSIM" ]; then
            echo "  - RB Sim ..... SKIPPED (no PR to simulate with)"
          else
            echo "  ✗ RB Sim ..... FAILED (${RBSIM})"
            PASSED=false
          fi

          # Check deep verification (step-level)
          DEEP="${{ steps.deep-verify.outputs.deep_passed }}"
          if [ "$DEEP" = "true" ]; then
            echo "  ✓ Internals .. PASSED (all steps in all phases succeeded)"
          else
            echo "  ✗ Internals .. FAILED (some workflow steps failed or missing)"
            echo "    See 'Deep verify' step for full per-step breakdown."
            PASSED=false
          fi

          # Check cancel_on_pr_close (Phase 7)
          CANCEL="${{ steps.verify-cancel-on-close.outputs.status }}"
          if [ "$CANCEL" = "success" ]; then
            echo "  ✓ Cancel-PR .. PASSED (cancel_on_pr_close ran successfully)"
          elif [ -z "$CANCEL" ]; then
            echo "  - Cancel-PR .. SKIPPED (no PR to close)"
          else
            echo "  ✗ Cancel-PR .. FAILED (${CANCEL})"
            PASSED=false
          fi

          echo ""
          echo "═══════════════════════════════════════════"

          if [ "$PASSED" = "true" ]; then
            echo "  ALL PHASES PASSED — safe to release"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "  SOME PHASES FAILED — blocking release"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ── Cleanup ─────────────────────────────────────────────────
      - name: Cleanup test artifacts
        if: always()
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
          PR_NUMBER: ${{ steps.wait-implement.outputs.pr_number }}
          TRACKING_NUMBER: ${{ steps.review-blocked-sim.outputs.tracking_number }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          echo "Cleaning up E2E test artifacts..."

          # Close PR without merging (idempotent — Phase 7 already closed
          # it for the cancel_on_pr_close test; if Phase 7 was skipped this
          # path closes the PR for the first time).
          if [ -n "${PR_NUMBER}" ]; then
            EXISTING_PR_BODY="$(_safe_gh_jq "repos/${TEST_REPO}/pulls/${PR_NUMBER}" --jq '.body // ""' || echo "")"
            NEW_PR_BODY="${EXISTING_PR_BODY}

          ---
          *Closed by E2E smoke test cleanup (run ${GITHUB_RUN_ID}).*"
            gh api "repos/${TEST_REPO}/pulls/${PR_NUMBER}" \
              -X PATCH -f state=closed -f body="${NEW_PR_BODY}" \
              2>/dev/null || echo "Warning: could not close PR #${PR_NUMBER}"
            echo "  Closed PR #${PR_NUMBER}"
          fi

          # Close issue
          if [ -n "${ISSUE_NUMBER}" ]; then
            gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" \
              -X PATCH -f state=closed \
              -f state_reason=not_planned \
              2>/dev/null || echo "Warning: could not close issue #${ISSUE_NUMBER}"

            # Add cleanup comment
            gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/comments" \
              -f body="E2E smoke test completed. Cleaning up.

          **Result:** ${{ steps.verify.outputs.passed == 'true' && '✓ All phases passed' || '✗ Some phases failed' }}
          **Run:** [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          **Version under test:** ${{ needs.resolve-version.outputs.version }}" \
              2>/dev/null || echo "Warning: could not post cleanup comment"
            echo "  Closed issue #${ISSUE_NUMBER}"
          fi

          # Close tracking issue from Phase 6 (if created)
          if [ -n "${TRACKING_NUMBER}" ]; then
            gh api "repos/${TEST_REPO}/issues/${TRACKING_NUMBER}" \
              -X PATCH -f state=closed -f state_reason=not_planned \
              >/dev/null 2>&1 || echo "Warning: could not close tracking issue #${TRACKING_NUMBER}"
            echo "  Closed tracking issue #${TRACKING_NUMBER}"
          fi

          # Delete test branch
          BRANCH="ai/issue-${ISSUE_NUMBER}"
          gh api "repos/${TEST_REPO}/git/refs/heads/${BRANCH}" -X DELETE \
            >/dev/null 2>&1 || echo "  Branch ${BRANCH} already deleted or does not exist"
          echo "  Deleted branch ${BRANCH}"

          echo "Cleanup complete."

      # Temporary: reveal which git invocation in checkout's post-step
      # produces `The process '/usr/bin/git' failed with exit code 128`.
      # Remove after root-cause is identified and a targeted fix lands.
      - *git-checkout-diag

  # ──────────────────────────────────────────────────────────────────
  # Job 1b: Script correctness validation — runs parallel with E2E
  # ──────────────────────────────────────────────────────────────────
  validate-scripts:
    needs: [source, resolve-version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.branch }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: YAML lint
        run: |
          set -euo pipefail
          pip install -q yamllint
          yamllint -s .github/workflows/*.yml .github/actions/*/action.yml

      - name: Shell script syntax check
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            bash -n "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: ShellCheck static analysis
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            shellcheck --severity=error "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Python syntax check
        run: |
          set -euo pipefail
          for f in scripts/*.py; do
            python3 -m py_compile "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Python lint (ruff)
        run: |
          set -euo pipefail
          pip install -q ruff
          ruff check --select E,F --ignore E501 scripts/*.py

      - name: Install Python test dependencies
        run: |
          set -euo pipefail
          # test_validation_refresh_runner.py exercises the real discovery
          # manifest validator (validate_discovered_manifest_yaml), which needs
          # pyyaml + jsonschema; jinja2 is required by the template-render tests.
          # Matches the dependency set installed in ci.yml, validation-refresh.yml
          # and nightly-validation-selftest.yml. Without these, the validator
          # short-circuits with jsonschema_missing, the codex retry loop fires,
          # and the FakeExecutor planned-call sequence desyncs (false failure).
          python3 -m pip install --quiet pyyaml jsonschema jinja2

      - name: Unit tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_lib.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_integration_ahead_by_gate.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_poll_process.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_poll_noop_suspicious_recovery.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_state_snapshot.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_run_substate_ledger.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_lint_pr_body_auto_close.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_lint_plan_archival_completeness.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_check_integration_pr_readiness.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_mark_stable_release_tag_refspec_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_targeted_file_context.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_phase_prompt_untrusted_context_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_detect_editor_changes_lost.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_autofix_review_pipeline_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_autofix_editor_noop_cascade_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_rb_judge_self_run_exclusion.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_rereview_and_approval_rubric.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_surface_prompt_hardening.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validate_editor_audit.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_reject_verify.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_stall_recovery_pr_lookup.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_editor_fifo_drain.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_subissue_closing_pr.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_fingerprint_state_selfheal.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_stall_loop_and_churn_fixes.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_stall_freshness_branch_fallback.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_retrigger_inflight_direct_fallback.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_actions_runs_fetch_unconfirmed_warning.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_conflict_resolve_smoke_deterministic.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_conflict_resolve_retry_prelude_render.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_cost_audit_semble_metrics.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workflow_log_analysis_failure_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_phase_skip_gate_telemetry_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workflow_gh_retry_fallback_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_semble_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_judge_semble_prefetch_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_judge_interim_round_trip.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_codex_stall_guard_scripts.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_render_prompt_foundation.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_render_prompt_core_modes.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_render_prompt_review_judge_modes.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_render_prompt_validate_analytics_modes.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_synthesise_smoke.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_implement_semble_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validate_semble_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validate_driver_synthesised_filter.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validation_refresh_runner.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validation_discovery_bootstrap.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validate_workflow_validate_bootstrap.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_codex_thread_reuse_core.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_codex_skip_git_repo_check_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workspace_init.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workspace_safety_check.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workspace_hooks.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workspace_cache_maintenance.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_family_node_runtime.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_poll_workflow_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workflow_overlay_orchestrator.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_mcp_handshake_probe.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_setup_serena_toml.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_serena_stats_emit.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validate_process_template_mode.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_semble_workflow_parity_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_drift_audit_job.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_fingerprint_quarantine.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_conflict_resolve_retry_state.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_verify_integration_fingerprints_tiers.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_verify_integration_fingerprints_post_capture_evolution.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_conflict_resolve_reasoning_step_down.py

      - name: Prompt files integrity
        run: |
          set -euo pipefail
          for f in prompts/*.txt; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f is empty"
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done

      - name: Script-workflow cross-reference
        run: |
          set -euo pipefail
          echo "Verifying all scripts referenced by workflows exist..."
          # Scripts intentionally absent on main: optional backends that shim
          # branches stage at runtime (see #3057). They appear as literal
          # scripts/<name> tokens in workflow YAML (e.g. validate.yml stages
          # render_prompt.py conditionally; review_autofix.yml's leaked-path
          # guard lists it), but main ships a self-contained alternative
          # (render_prompt.sh), so their absence here is expected and must not
          # fail the cross-reference gate. Keep this list in sync with the
          # optional-bootstrap handling in the consumer-facing workflows.
          OPTIONAL_SCRIPTS=("scripts/render_prompt.py")
          MISSING=0
          for ref in $(grep -rhoE 'scripts/[a-zA-Z0-9_.-]+\.(sh|py|json)' .github/workflows/ | sort -u); do
            if [ ! -f "$ref" ]; then
              if printf '%s\n' "${OPTIONAL_SCRIPTS[@]}" | grep -qxF "$ref"; then
                echo "OPTIONAL (absent on main, staged by shim branches): $ref"
                continue
              fi
              echo "FAIL: $ref referenced in workflows but does not exist"
              MISSING=$((MISSING + 1))
            else
              echo "OK: $ref"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::${MISSING} script(s) referenced by workflows are missing"
            exit 1
          fi
          echo "All referenced scripts exist."

      # Temporary: reveal which git invocation in checkout's post-step
      # produces `The process '/usr/bin/git' failed with exit code 128`.
      # Remove after root-cause is identified and a targeted fix lands.
      - *git-checkout-diag

  # ──────────────────────────────────────────────────────────────────
  # Job 1c-1: Workflow-log-analysis live-dispatch smoke gate
  # Split out of `orphan-workflows-test` so its Codex-driven long tail
  # cannot block `validate` / `release` / `sync-to-main`. See the
  # in-job comment below for cap derivation and the bump protocol.
  # ──────────────────────────────────────────────────────────────────
  workflow-log-analysis-test:
    needs: [resolve-version]
    if: ${{ !inputs.skip_e2e && !inputs.dry_run }}
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      # Job-level `continue-on-error` keeps this post-hoc audit
      # non-blocking, but `needs.<job>.result` collapses tolerated
      # failures to `success`, so `notify` consumes this explicit output.
      actual_result: ${{ steps.workflow_log_analysis_actual_result.outputs.result }}
      workflow_conclusion: ${{ steps.dispatch_log_analysis.outputs.workflow_conclusion || steps.workflow_log_analysis_actual_result.outputs.result }}
      workflow_run_id: ${{ steps.dispatch_log_analysis.outputs.run_id || '' }}
      workflow_snapshot_status: ${{ steps.dispatch_log_analysis.outputs.workflow_snapshot_status || '' }}
      workflow_snapshot_conclusion: ${{ steps.dispatch_log_analysis.outputs.workflow_snapshot_conclusion || '' }}
    # Split out of `orphan-workflows-test` (follow-up to release v1.8.2
    # which failed when the inner `api-redundancy` job hit its 90m
    # per-job cap and cancelled the dispatch chain). The Codex audit
    # chain has a Codex-driven long tail that periodically blows past
    # whatever cap the watcher uses, and a cancelled audit pass does
    # not invalidate the release artefact — the audit is a post-hoc
    # log inspector, not a release-correctness check. To stop those
    # cancellations from blocking `validate` / `release` /
    # `sync-to-main`, this dispatch lives in its own job that is
    # intentionally NOT in `validate.needs`. It still feeds the
    # `notify` job so operators see its result in the Telegram release
    # message and the soft-error report artifact still flows into the
    # consolidated report.
    # Historical high cap retained as harmless outer headroom, but the
    # dispatch step now exits after registration plus one status
    # snapshot instead of waiting for terminal child completion. In
    # normal operation this job should finish in minutes, not hours.
    timeout-minutes: 280
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      TEST_REPO: ${{ inputs.test_repo || github.repository }}
    steps:
      - name: Validate prerequisites
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GH_PAT secret is required for workflow-log-analysis dispatch"
            exit 1
          fi

      # Required for the run-soft-error-analyzer composite action below.
      - name: Checkout repository (for soft-error analyser)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Dispatch & snapshot — workflow-log-analysis
        id: dispatch_log_analysis
        # Rate-limit shaping: the script below opens with a brief 4s
        # sleep so concurrent gate jobs (e2e-smoke-test, alt-model,
        # orchestrate-decompose, etc.) don't all hit the
        # `actions/workflows/.../runs` and `actions/runs/...` endpoints
        # in the same instant when they happen to start within seconds
        # of each other. Combined with the existing 5–15s polling
        # intervals this keeps total API spend well below GH_PAT's
        # 5000/hr budget.
        #
        # Historical high cap retained as a defensive outer bound.
        # The in-script registration probe below exits after a short
        # registration window, so this timeout should no longer be hit
        # during healthy runs.
        timeout-minutes: 265
        env:
          WF_FILE: workflow-log-analysis.yml
          INPUTS: '{"lookback_days":"1","repos_override":"${{ inputs.test_repo || github.repository }}"}'
        run: |
          set -euo pipefail
          # Surface audit failures via step outputs + notify instead of
          # failing this job — workflow-log-analysis is observability-only.
          sleep 4
          bash ./scripts/dispatch_and_watch_workflow_run.sh \
            --repo "${TEST_REPO}" \
            --workflow "${WF_FILE}" \
            --display-name "workflow-log-analysis" \
            --registration-timeout-secs 300 \
            --registration-poll-interval-secs 5 \
            --snapshot-only \
            --dispatch-fail-open \
            --registration-fail-open \
            --field lookback_days=1 \
            --field "repos_override=${TEST_REPO}" \
            --field alert_msg_level=SILENT

      - name: "Soft-error analyser (workflow-log-analysis)"
        id: soft_error_analysis
        if: always() && steps.dispatch_log_analysis.outputs.run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            workflow_log_analysis=${{ steps.dispatch_log_analysis.outputs.run_id }}
          repo: ${{ env.TEST_REPO }}
          # Artifact name preserved verbatim (was emitted by the same
          # name when this step lived inside orphan-workflows-test);
          # the notify-job consolidator's
          # `pattern: soft-error-report-${{ github.run_id }}-*` glob
          # still picks it up unchanged.
          artifact_name: soft-error-report-${{ github.run_id }}-workflow_log_analysis
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

      - name: Capture workflow-log-analysis actual result
        id: workflow_log_analysis_actual_result
        if: always()
        env:
          DISPATCH_RESULT: ${{ steps.dispatch_log_analysis.outputs.workflow_conclusion || '' }}
          DISPATCH_OUTCOME: ${{ steps.dispatch_log_analysis.outcome || '' }}
          ANALYZER_OUTCOME: ${{ steps.soft_error_analysis.outcome || '' }}
        run: |
          set -euo pipefail
          RESULT=failure
          if [ "${DISPATCH_RESULT}" = "success" ] && { [ -z "${ANALYZER_OUTCOME}" ] || [ "${ANALYZER_OUTCOME}" = "success" ] || [ "${ANALYZER_OUTCOME}" = "skipped" ]; }; then
            RESULT=success
          elif [ "${DISPATCH_RESULT}" = "cancelled" ] || [ "${DISPATCH_OUTCOME}" = "cancelled" ] || [ "${ANALYZER_OUTCOME}" = "cancelled" ]; then
            RESULT=cancelled
          fi
          echo "result=${RESULT}" >> "$GITHUB_OUTPUT"
  # ──────────────────────────────────────────────────────────────────
  # Job 1c-2: Orphan workflows live-dispatch test
  # Dispatches each user-facing workflow that the e2e smoke test does
  # NOT exercise — except `workflow-log-analysis`, which now lives in
  # its own job (`workflow-log-analysis-test`) so its Codex-driven long
  # tail can no longer block `validate` / `release` / `sync-to-main`.
  # Remaining dispatches: validation-refresh, update_workflows,
  # memory_maintenance.
  # cancel_on_pr_close is exercised inside e2e-smoke-test Phase 7.
  # ──────────────────────────────────────────────────────────────────
  orphan-workflows-test:
    needs: [resolve-version]
    if: ${{ !inputs.skip_e2e && !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Sum of remaining in-step DEADLINEs (validation-refresh 2400s +
    # update_workflows 600s + memory-maintenance 900s = 3900s ≈ 65m).
    # Add headroom for prerequisite validation, checkout, and the
    # per-phase run-soft-error-analyzer composite actions (each waits
    # up to wait_for_completion_secs=120s and then runs an OpenRouter
    # call; log1 of run #25200117236 observed ~40s per phase, so 3
    # phases under OpenRouter latency variance can plausibly reach
    # 6–9m), runner queueing, and step setup. Cap at 90m so a runaway
    # validation-refresh / update_workflows / memory_maintenance can
    # still be killed within a sensible budget. Down from 360m before
    # the workflow-log-analysis split-out.
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      TEST_REPO: ${{ inputs.test_repo || github.repository }}
    steps:
      - name: Validate prerequisites
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GH_PAT secret is required for orphan-workflows dispatch"
            exit 1
          fi

      # Required for the run-soft-error-analyzer composite action below.
      - name: Checkout repository (for soft-error analyser)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      # Generic helper: dispatch a workflow_dispatch workflow by file name
      # and capture the resulting run id, then wait for completion. Each
      # invocation runs in its own step so failures attribute to the
      # specific workflow.
      #
      # Rate-limit shaping: each dispatch step opens with a brief 4s
      # sleep so concurrent gate jobs (e2e-smoke-test, alt-model,
      # orchestrate-decompose, etc.) don't all hit the
      # `actions/workflows/.../runs` and `actions/runs/...` endpoints in
      # the same instant when they happen to start within seconds of
      # each other. The PR-review concern was that simultaneous
      # dispatches collide; this stagger plus the existing 5–15 s polling
      # intervals keep total API spend well below GH_PAT's 5000/hr budget.
      #
      # Note: the `workflow-log-analysis` dispatch lives in its own
      # `workflow-log-analysis-test` job (split out so its Codex-driven
      # long tail can no longer block `validate` / `release` /
      # `sync-to-main`). The dispatches that remain here are the short,
      # deterministic ones whose failures still gate the release.
      - name: Dispatch & watch — validation-refresh
        id: dispatch_validation_refresh
        timeout-minutes: 42
        run: |
          set -euo pipefail
          sleep 4
          WF_FILE="validation-refresh.yml"
          BRANCH_NAME="ai/validation-refresh-smoke-${GITHUB_RUN_ID}"
          # Use a per-run smoke branch name so production validation-refresh
          # branches are never collided with.
          # Retry the dispatch on transient GitHub API failures (HTTP 5xx,
          # network blips) with exponential backoff (2s, 4s, 8s, 16s). A
          # single HTTP 500 from /dispatches blocked release v1.13.8
          # (run #26328466709 — update_workflows dispatch). The dispatch
          # call itself is idempotent here because the post-dispatch poll
          # filters runs by the pre-dispatch run-id snapshot, so a duplicate dispatch (if a 500
          # response masked a successful create) is harmless — the poll
          # picks up whichever run id was registered.
          bash ./scripts/dispatch_and_watch_workflow_run.sh \
            --repo "${TEST_REPO}" \
            --workflow "${WF_FILE}" \
            --display-name "validation-refresh" \
            --registration-timeout-secs 2400 \
            --registration-poll-interval-secs 5 \
            --completion-timeout-secs 2400 \
            --completion-poll-interval-secs 15 \
            --dispatch-max-attempts 5 \
            --dispatch-backoff-base-secs 2 \
            --field "branch_name=${BRANCH_NAME}" \
            --field alert_msg_level=SILENT

      - name: "Soft-error analyser (validation-refresh)"
        if: always() && steps.dispatch_validation_refresh.outputs.run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            validation_refresh=${{ steps.dispatch_validation_refresh.outputs.run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-validation_refresh
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

      - name: Dispatch & watch — update_workflows (allow_workflow_edits=false)
        id: dispatch_update_workflows
        timeout-minutes: 18
        run: |
          set -euo pipefail
          sleep 4
          # Run with allow_workflow_edits=false so the smoke gate exercises
          # workflow start-up + secret resolution + checkout, but leaves the
          # actual edit-and-commit branch behind a feature flag. Running
          # with edits=true on this repo would cause update_workflows to
          # overwrite local templates with whatever is at @stable — a
          # destructive feedback loop during a release rehearsal.
          WF_FILE="update_workflows.yml"
          # Retry transient GitHub API failures — see the validation-refresh
          # dispatch above for context (release v1.13.8 was blocked here by
          # a single HTTP 500 from /dispatches in run #26328466709).
          bash ./scripts/dispatch_and_watch_workflow_run.sh \
            --repo "${TEST_REPO}" \
            --workflow "${WF_FILE}" \
            --display-name update_workflows \
            --registration-timeout-secs 600 \
            --registration-poll-interval-secs 5 \
            --completion-timeout-secs 600 \
            --completion-poll-interval-secs 15 \
            --dispatch-max-attempts 5 \
            --dispatch-backoff-base-secs 2 \
            --allowed-conclusions success,skipped \
            --field allow_workflow_edits=false \
            --field alert_msg_level=SILENT

      - name: "Soft-error analyser (update_workflows)"
        if: always() && steps.dispatch_update_workflows.outputs.run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            update_workflows=${{ steps.dispatch_update_workflows.outputs.run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-update_workflows
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

      - name: Dispatch & watch — internal-memory-maintenance
        id: dispatch_memory_maintenance
        timeout-minutes: 25
        run: |
          set -euo pipefail
          sleep 4
          WF_FILE="internal-memory-maintenance.yml"
          # internal-memory-maintenance is a thin wrapper around the
          # reusable memory_maintenance.yml; neither the wrapper nor the
          # called workflow nor `ai_memory.py compact` emit Telegram
          # alerts (per Copilot review on PR #1742), so there is no
          # `alert_msg_level` input to pass — the smoke gate dispatch
          # already produces no per-phase pings here.
          # Retry transient GitHub API failures — see the validation-refresh
          # dispatch above for context (release v1.13.8 was blocked by a
          # single HTTP 500 from /dispatches in run #26328466709).
          bash ./scripts/dispatch_and_watch_workflow_run.sh \
            --repo "${TEST_REPO}" \
            --workflow "${WF_FILE}" \
            --display-name "internal-memory-maintenance" \
            --registration-timeout-secs 900 \
            --registration-poll-interval-secs 5 \
            --completion-timeout-secs 900 \
            --completion-poll-interval-secs 15 \
            --dispatch-max-attempts 5 \
            --dispatch-backoff-base-secs 2

      - name: "Soft-error analyser (memory_maintenance)"
        if: always() && steps.dispatch_memory_maintenance.outputs.run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            memory_maintenance=${{ steps.dispatch_memory_maintenance.outputs.run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-memory_maintenance
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

  # ──────────────────────────────────────────────────────────────────
  # Job 1d: Orchestrate decompose end-to-end test
  # Exercises the orchestrate root: project-description → tracking issue
  # + child issue DAG → wave dispatch. Cleans up issues when done.
  # ──────────────────────────────────────────────────────────────────
  orchestrate-decompose-test:
    needs: [resolve-version]
    if: ${{ !inputs.skip_e2e && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      TEST_REPO: ${{ inputs.test_repo || github.repository }}
    outputs:
      tracking_issue: ${{ steps.dispatch.outputs.tracking_issue }}
      child_issues: ${{ steps.dispatch.outputs.child_issues }}
    steps:
      - name: Validate prerequisites
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN}" ] || { echo "::error::GH_PAT required"; exit 1; }

      # Required for the run-soft-error-analyzer composite action below;
      # the action invokes scripts/analyze_soft_errors.py from the repo
      # checkout root.
      - name: Checkout repository (for soft-error analyser)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Dispatch internal-orchestrate.yml with multi-issue project
        id: dispatch
        run: |
          set -euo pipefail
          WF_FILE="internal-orchestrate.yml"
          # Two-issue project description with NO dependency between issues so
          # both land in Wave 1 and both GitHub issues get created at
          # orchestrator bootstrap. Run 25115188957 confirmed the decomposer
          # correctly emitted 2 issues with a dependency edge, but the
          # orchestrator architecture only creates Wave 1 issues at bootstrap
          # (later waves come from the poller after the prior wave merges).
          # The smoke-test assertion is ≥2 GitHub child issues immediately
          # after bootstrap, so the issues must be independent. The two
          # sub-issues still target DIFFERENT files
          # (tests/e2e_smoke_canary.txt vs tests/e2e_smoke_canary_b.txt)
          # so the decomposer's "one concern per issue" rule does not pressure
          # it to collapse them and the partition guard keeps them disjoint.
          # Cleanup still targets new issues via tracking-issue back-reference +
          # title-prefix marker.
          PROJECT_DESC="[E2E Orchestrate Smoke ${GITHUB_RUN_ID}] This is an author-decomposed project that requires TWO independent (no-dependency) child issues touching DIFFERENT files. Per the orchestrator's author-decomposition rule (see prompts/mode-orchestrate.txt), honor the enumeration below verbatim — emit exactly two issues with NO dependency_edges between them so both can run in Wave 1. "
          # Both issues MUST embed ${GITHUB_RUN_ID} in the required content so
          # the acceptance criteria force a real diff every run. Without that,
          # whichever file already has the requested first line from a prior
          # run becomes a no-op for the implementer, which the implement loop
          # treats as "stuck in exploration" and aborts after 2 consecutive
          # no-actionable-output attempts (see implement.yml retry-bail logic).
          PROJECT_DESC+="Issue 1 (no dependencies, files_touched=[tests/e2e_smoke_canary.txt]): set the first line of tests/e2e_smoke_canary.txt to exactly 'status: ok' AND append the line 'decompose-run: ${GITHUB_RUN_ID}' as the second line. "
          PROJECT_DESC+="Issue 2 (no dependencies, files_touched=[tests/e2e_smoke_canary_b.txt]): set the first line of tests/e2e_smoke_canary_b.txt to exactly 'status: ok' AND append the line 'decompose-run: ${GITHUB_RUN_ID}' as the second line. Issue 2 is fully self-contained — it does NOT need to read Issue 1's output and can run in parallel with Issue 1. "
          PROJECT_DESC+="The orchestrate_decomposition.v1 schema dependency_edges array MUST be empty ([]) so both issues are placed in Wave 1. The two issues' files_touched lists MUST NOT overlap. This is fully specified — no clarification is needed."
          # Capture the dispatch start time before dispatching so the
          # post-run lookup can use it as a lower-bound created_at filter
          # and restrict matches to issues opened by THIS orchestrate run
          # rather than scanning the whole open-issue list.
          DISPATCH_START_ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          bash ./scripts/dispatch_and_watch_workflow_run.sh \
            --repo "${TEST_REPO}" \
            --workflow "${WF_FILE}" \
            --display-name orchestrate \
            --registration-timeout-secs 3000 \
            --registration-poll-interval-secs 5 \
            --completion-timeout-secs 3000 \
            --completion-poll-interval-secs 20 \
            --status-log-prefix "orchestrate-bootstrap" \
            --field "project_description=${PROJECT_DESC}"

          # Locate the tracking issue (created by the orchestrator).
          # The orchestrator titles it `[Orchestrator] <project_title>`
          # where project_title is LLM-derived from project_description
          # and the smoke-test prefix is not guaranteed to survive that
          # rewrite. Filter instead by the canonical
          # `ai:orchestrator-tracking` label, restrict to issues
          # updated since this dispatch began, and confirm the body
          # references this run's GITHUB_RUN_ID (the project_description
          # we sent embeds it, and the body includes project_summary
          # which typically carries it through).
          # GitHub's /repos/{}/{}/issues endpoint with `since=` + `labels=`
          # filters has eventual-consistency lag: a freshly-created issue
          # can take tens of seconds to surface in subsequent filtered list
          # calls under release-day API load. The orchestrate run completes
          # within ~1s of creating the tracking issue ("Create tracking
          # issue" → "Dispatch Wave 1" runs in ~20s inside the orchestrate
          # bootstrap), so the immediate post-run lookup races the index.
          # Runs 25542750558 and 25477674617 both failed here even though
          # the tracking issue had been created seconds earlier (verified
          # via direct issue lookup). Poll up to 90s with 5s backoff to
          # absorb the lag instead of one-shot-failing.
          # Capture each iteration's stderr to a file (overwritten each
          # round so we surface the LAST failure on timeout). Without
          # this, persistent non-flaky failures (expired GH_PAT, 401/403,
          # rate limits, 5xx) silently burn the 90s budget and we'd
          # report a misleading "could not locate tracking issue" error.
          TRACKING_NUMBER=""
          TRACKING_ERR_FILE=$(mktemp)
          TRACKING_DEADLINE=$(( $(date +%s) + 90 ))
          while [ "$(date +%s)" -lt "${TRACKING_DEADLINE}" ]; do
            TRACKING_NUMBER=$(gh api \
              "repos/${TEST_REPO}/issues?state=open&labels=ai:orchestrator-tracking&since=${DISPATCH_START_ISO}&per_page=50" \
              --jq "[.[] | select(.body // \"\" | contains(\"${GITHUB_RUN_ID}\"))] | sort_by(.created_at) | last | .number // empty" \
              2>"${TRACKING_ERR_FILE}" || echo "")
            [ -n "${TRACKING_NUMBER}" ] && break
            sleep 5
          done
          if [ -z "${TRACKING_NUMBER}" ]; then
            if [ -s "${TRACKING_ERR_FILE}" ]; then
              echo "::warning::last gh api stderr during tracking-issue polling:"
              sed 's/^/  /' "${TRACKING_ERR_FILE}" || true
            fi
            rm -f "${TRACKING_ERR_FILE}"
            echo "::error::Could not locate tracking issue for run ${GITHUB_RUN_ID} after 90s polling (label=ai:orchestrator-tracking, since=${DISPATCH_START_ISO}, body must contain ${GITHUB_RUN_ID})"
            exit 1
          fi
          rm -f "${TRACKING_ERR_FILE}"
          echo "tracking_issue=${TRACKING_NUMBER}" >> "$GITHUB_OUTPUT"
          # Discover child issues by their orchestrator-managed back-reference
          # rather than by parsing the tracking-issue body. The tracking body
          # produced by `build_tracking_issue_body` (orchestrate_lib.py:727)
          # lists children by SLUG (`- [ ] **set-smoke-canary-status-ok**: …`),
          # never as `#N`, so the previous body-grep for `#[0-9]+` always
          # returned 0 children and the assertion failed. Each Wave 1 issue
          # the orchestrator creates carries the marker
          # `Tracking issue: #${TRACKING_NUMBER}` in its body
          # (orchestrate.yml:814) and the canonical
          # `ai:orchestrator-managed` label, so we list those directly.
          # `since=${DISPATCH_START_ISO}` and the body filter scope the
          # match to children opened by THIS dispatch, never an older run.
          # Same eventual-consistency caveat as the tracking-issue lookup
          # above: the Wave 1 children are created ~3-4s after the tracking
          # issue, so the filtered list call can still race the index even
          # after the tracking-issue lookup succeeds. Poll up to 90s with
          # 5s backoff until at least 2 children are visible.
          # Capture each iteration's stderr (overwritten each round) so a
          # persistent non-flaky failure surfaces on timeout instead of
          # being misreported as "produced 0 child issue(s)".
          CHILDREN=""
          CHILD_COUNT=0
          CHILDREN_ERR_FILE=$(mktemp)
          CHILDREN_DEADLINE=$(( $(date +%s) + 90 ))
          while [ "$(date +%s)" -lt "${CHILDREN_DEADLINE}" ]; do
            CHILDREN_JSON=$(gh api \
              "repos/${TEST_REPO}/issues?state=all&labels=ai:orchestrator-managed&since=${DISPATCH_START_ISO}&per_page=100" \
              --jq "[.[] | select(.pull_request | not) | select(.body // \"\" | contains(\"Tracking issue: #${TRACKING_NUMBER}\")) | .number]" \
              2>"${CHILDREN_ERR_FILE}" || echo "[]")
            CHILDREN=$(echo "${CHILDREN_JSON}" | jq -r 'sort | unique | join(",")' 2>/dev/null || echo "")
            CHILD_COUNT=$(echo "${CHILDREN}" | tr ',' '\n' | grep -c .)
            [ "${CHILD_COUNT}" -ge 2 ] && break
            sleep 5
          done
          echo "child_issues=${CHILDREN}" >> "$GITHUB_OUTPUT"
          # Decomposition assertion: at least two distinct child issues.
          if [ "${CHILD_COUNT}" -lt 2 ]; then
            if [ -s "${CHILDREN_ERR_FILE}" ]; then
              echo "::warning::last gh api stderr during child-issue polling:"
              sed 's/^/  /' "${CHILDREN_ERR_FILE}" || true
            fi
            rm -f "${CHILDREN_ERR_FILE}"
            echo "::error::Decomposition produced ${CHILD_COUNT} child issue(s) after 90s polling; expected >= 2 (queried label=ai:orchestrator-managed since=${DISPATCH_START_ISO} body~='Tracking issue: #${TRACKING_NUMBER}')"
            exit 1
          fi
          rm -f "${CHILDREN_ERR_FILE}"
          echo "✓ Decomposition produced ${CHILD_COUNT} child issues: ${CHILDREN}"

      - name: "Soft-error analyser (orchestrate-decompose)"
        if: always() && steps.dispatch.outputs.run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            orchestrate=${{ steps.dispatch.outputs.run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-orchestrate_decompose
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

      - name: Cleanup orchestrate test issues
        if: always()
        env:
          TRACKING_NUMBER: ${{ steps.dispatch.outputs.tracking_issue }}
          CHILDREN: ${{ steps.dispatch.outputs.child_issues }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Defence in depth: never abort cleanup on a single failed close.
          # The orchestrator can leave behind issues even when the
          # decompose dispatch fails part-way (children created but
          # tracking comment missing, etc.), so the cleanup also discovers
          # any open issues whose title carries this run's marker and
          # closes them too. Each close is retried 3× with backoff.
          set +e
          close_with_retry() {
            local num="$1"
            [ -n "${num}" ] || return 0
            local attempt
            for attempt in 1 2 3; do
              if gh api "repos/${TEST_REPO}/issues/${num}" \
                  -X PATCH -f state=closed -f state_reason=not_planned \
                  >/dev/null 2>&1; then
                echo "  closed #${num}"
                return 0
              fi
              sleep $(( attempt * 2 ))
            done
            echo "::warning::Could not close issue #${num} after 3 attempts (manual cleanup may be required)"
            return 1
          }

          # Phase 1: close known issues from the dispatch step's outputs.
          for n in ${TRACKING_NUMBER} $(echo "${CHILDREN}" | tr ',' ' '); do
            close_with_retry "${n}"
          done

          # Phase 2: discover-and-sweep — search for any open issue whose
          # title carries this run's smoke marker that we missed. Uses
          # GitHub's issue search API; failure is non-fatal (we did our
          # best in Phase 1). Matches the prefix used by the dispatch
          # step's project_description and any child issue the
          # orchestrator created from it.
          MARKER="E2E Orchestrate Smoke ${RUN_ID}"
          MARKER_Q=$(printf '%s' "${MARKER}" | jq -sRr @uri)
          # `is:issue` is required by the search API; without it the
          # call returns 422 "Query must include 'is:issue' or
          # 'is:pull-request'", and the JSON error body would otherwise
          # word-split into bogus issue numbers in the loop below.
          STRAGGLERS=$(gh api \
            "search/issues?q=repo:${TEST_REPO}+is:issue+state:open+in:title+${MARKER_Q}" \
            --jq '[.items[].number] | join(" ")' 2>/dev/null || echo "")
          for n in ${STRAGGLERS}; do
            close_with_retry "${n}"
          done
          true  # ensure step exits 0 even if some closes failed

  # ──────────────────────────────────────────────────────────────────
  # Job 1e: Validate (reusable) standalone fixture dispatch
  # Dispatches internal-validate.yml in standalone mode (tracking_issue=0)
  # against the test fixture compose file. Confirms validate.yml startup,
  # docker compose bringup, and status emission paths still work without
  # a tracking issue context.
  # ──────────────────────────────────────────────────────────────────
  validate-standalone-test:
    needs: [resolve-version]
    if: ${{ !inputs.skip_e2e && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      TEST_REPO: ${{ inputs.test_repo || github.repository }}
    steps:
      - name: Validate prerequisites
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN}" ] || { echo "::error::GH_PAT required"; exit 1; }

      # Required for the run-soft-error-analyzer composite action below.
      - name: Checkout repository (for soft-error analyser)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Dispatch internal-validate.yml standalone
        id: dispatch
        run: |
          set -euo pipefail
          WF_FILE="internal-validate.yml"
          # Standalone mode: tracking_issue=0 tells validate.yml to skip
          # tracking-issue label updates. The compose_file fallback uses
          # the canonical default; if the repo has no docker-compose.yml
          # the workflow will emit `status=error` and exit gracefully.
          bash ./scripts/dispatch_and_watch_workflow_run.sh \
            --repo "${TEST_REPO}" \
            --workflow "${WF_FILE}" \
            --display-name validate \
            --registration-timeout-secs 1800 \
            --registration-poll-interval-secs 5 \
            --completion-timeout-secs 1800 \
            --completion-poll-interval-secs 20 \
            --allowed-conclusions success,failure \
            --field tracking_issue=0 \
            --field compose_file=docker-compose.yml \
            --field validation_timeout=10

      - name: "Soft-error analyser (validate-standalone)"
        if: always() && steps.dispatch.outputs.run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            validate=${{ steps.dispatch.outputs.run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-validate_standalone
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

  # ──────────────────────────────────────────────────────────────────
  # Job 1f: Clarify-rejects-unsolvable negative test
  # Files an issue that is intentionally under-specified and asserts
  # that Clarify routes it to ai:awaiting-clarification (not directly
  # to ai:planning). Confirms the clarify-rejection path still works.
  # ──────────────────────────────────────────────────────────────────
  clarify-rejects-unsolvable-test:
    needs: [resolve-version]
    if: ${{ !inputs.skip_e2e && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      TEST_REPO: ${{ inputs.test_repo || github.repository }}
    steps:
      # Required for the run-soft-error-analyzer composite action below.
      - name: Checkout repository (for soft-error analyser)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Create unsolvable issue
        id: create
        run: |
          set -euo pipefail
          # Capture the latest clarify.yml run id BEFORE creating the
          # issue so the post-create capture step can find the new
          # run via `id > PRE_CLARIFY_RUN_ID`.
          PRE_CLARIFY_RUN_ID=$(gh api "repos/${TEST_REPO}/actions/workflows/clarify.yml/runs?per_page=1" --jq '.workflow_runs[0].id // 0' 2>/dev/null || echo "0")
          echo "pre_clarify_run_id=${PRE_CLARIFY_RUN_ID}" >> "$GITHUB_OUTPUT"
          TITLE="[E2E Clarify Negative Test] under-specified task (run ${GITHUB_RUN_ID})"
          BODY="Make it better."
          NUMBER=$(gh api "repos/${TEST_REPO}/issues" \
            -f title="${TITLE}" -f body="${BODY}" --jq '.number')
          echo "issue_number=${NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Created issue #${NUMBER}"

      - name: Capture clarify run id (negative test)
        id: capture_clarify_run
        if: steps.create.outputs.issue_number != ''
        env:
          PRE: ${{ steps.create.outputs.pre_clarify_run_id }}
        run: |
          set -euo pipefail
          # Poll up to 90s for clarify.yml to register a new run id
          # past the pre-create snapshot. Fail-open: emits empty
          # output when no new run is observed; the analyser step
          # below skips (its `if:` gates on non-empty output).
          DEADLINE=$(( $(date +%s) + 90 ))
          NEW_ID=""
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            NEW_ID=$(gh api "repos/${TEST_REPO}/actions/workflows/clarify.yml/runs?per_page=10" \
              --jq "[.workflow_runs[] | select(.id > ${PRE:-0})] | sort_by(.created_at) | last | .id // empty" 2>/dev/null || echo "")
            [ -n "${NEW_ID}" ] && break
            sleep 5
          done
          if [ -n "${NEW_ID}" ]; then
            echo "run_id=${NEW_ID}" >> "$GITHUB_OUTPUT"
            echo "✓ Captured negative-test clarify run #${NEW_ID}"
          else
            echo "::warning::Could not capture clarify run id for negative-test issue (analyser will be skipped)"
          fi

      - name: Wait for clarify to flag for clarification
        id: wait
        env:
          ISSUE_NUMBER: ${{ steps.create.outputs.issue_number }}
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 1500 ))
          OUTCOME=""
          # Race-resistance: clarify may transit through `ai:planning`
          # briefly during a multi-cycle clarification before settling on
          # `ai:awaiting-clarification`. Require any planning/approval
          # label to persist for two consecutive polls AND ≥45s before
          # treating it as terminal "false positive". Rejection labels
          # are always terminal — once they appear the orchestrator does
          # not regress to planning, so single observation is sufficient.
          PLANNING_FIRST_SEEN=0
          PLANNING_PERSIST_REQUIRED_SECS=45
          # `ai:clarification` is applied at the start of every clarify
          # run (see clarify.yml:399) and removed when the workflow
          # transitions to ai:planning ("no questions needed" path,
          # clarify.yml:416 / 1042). Treating a single observation as
          # terminal would falsely pass when clarify swaps to planning
          # within seconds, so require the label to persist
          # CLARIFY_PERSIST_REQUIRED_SECS while no planning/approval
          # label has appeared. Dedicated terminal labels
          # (ai:awaiting-clarification, ai:clarify-failed, ai:rejected,
          # ai:clarification-needed) and the bot question comment marker
          # remain immediate-terminal — they are not part of the
          # in-flight transient state machine.
          CLARIFY_FIRST_SEEN=0
          CLARIFY_PERSIST_REQUIRED_SECS=60
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            LABELS=$(gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" \
              --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
            echo "  labels: ${LABELS:-none}"
            # Definitively-terminal rejection labels — single observation
            # suffices. Anchored against the comma-separated label list
            # so they don't accidentally substring-match `ai:clarification`.
            if echo ",${LABELS}," | grep -qE ',(ai:awaiting-clarification|ai:clarify-failed|ai:rejected|ai:clarification-needed),'; then
              OUTCOME="rejected"
              break
            fi
            # Bot comment-based rejection signal: clarify posts a comment
            # when it asks for clarification; look for the canonical
            # marker so we still pass even if labels were never applied.
            BODY=$(gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/comments?per_page=20" \
              --jq '[.[] | select(.user.type == "Bot" or (.user.login | endswith("[bot]"))) | .body] | join("\n")' 2>/dev/null || echo "")
            if echo "${BODY}" | grep -qiE 'NEEDS_CLARIFICATION|clarification.*(needed|required)|cannot proceed without'; then
              OUTCOME="rejected"
              break
            fi
            HAS_CLARIFICATION=0
            HAS_PLANNING=0
            echo ",${LABELS}," | grep -qE ',ai:clarification,' && HAS_CLARIFICATION=1
            echo ",${LABELS}," | grep -qE ',(ai:planning|ai:awaiting-approval),' && HAS_PLANNING=1
            # `ai:clarification` only counts as rejection if it persists
            # ≥CLARIFY_PERSIST_REQUIRED_SECS without a planning/approval
            # label appearing. If planning ever shows up the timer is
            # reset and the planning-persistence check below takes over.
            if [ "${HAS_CLARIFICATION}" = "1" ] && [ "${HAS_PLANNING}" = "0" ]; then
              if [ "${CLARIFY_FIRST_SEEN}" = "0" ]; then
                CLARIFY_FIRST_SEEN=$(date +%s)
                echo "  ⏳ saw ai:clarification — waiting ${CLARIFY_PERSIST_REQUIRED_SECS}s to confirm it persists without ai:planning"
              elif [ $(( $(date +%s) - CLARIFY_FIRST_SEEN )) -ge "${CLARIFY_PERSIST_REQUIRED_SECS}" ]; then
                OUTCOME="rejected"
                break
              fi
            else
              if [ "${CLARIFY_FIRST_SEEN}" != "0" ]; then
                echo "  ↻ ai:clarification cleared (or planning appeared) — resetting clarification timer"
                CLARIFY_FIRST_SEEN=0
              fi
            fi
            # Tentative false-positive: only commit to this verdict if
            # the planning label persists across ≥45s of polling.
            if [ "${HAS_PLANNING}" = "1" ]; then
              if [ "${PLANNING_FIRST_SEEN}" = "0" ]; then
                PLANNING_FIRST_SEEN=$(date +%s)
                echo "  ⚠ saw planning/approval label — waiting ${PLANNING_PERSIST_REQUIRED_SECS}s to confirm it persists"
              elif [ $(( $(date +%s) - PLANNING_FIRST_SEEN )) -ge "${PLANNING_PERSIST_REQUIRED_SECS}" ]; then
                OUTCOME="false_positive"
                break
              fi
            else
              # Label dropped — reset persistence timer.
              if [ "${PLANNING_FIRST_SEEN}" != "0" ]; then
                echo "  ↻ planning/approval label cleared — resetting persistence timer"
                PLANNING_FIRST_SEEN=0
              fi
            fi
            sleep 15
          done
          if [ "${OUTCOME}" = "rejected" ]; then
            echo "✓ Clarify correctly rejected the under-specified task"
            exit 0
          fi
          if [ "${OUTCOME}" = "false_positive" ]; then
            echo "::error::Clarify advanced an under-specified issue to planning — rejection path is broken"
            exit 1
          fi
          echo "::error::Clarify did not act on the under-specified issue within timeout"
          exit 1

      - name: "Soft-error analyser (clarify negative test)"
        if: always() && steps.capture_clarify_run.outputs.run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            clarify_negative=${{ steps.capture_clarify_run.outputs.run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-clarify_negative
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

      - name: Cleanup negative-test issue
        if: always() && steps.create.outputs.issue_number != ''
        env:
          ISSUE_NUMBER: ${{ steps.create.outputs.issue_number }}
        run: |
          # Best-effort close with retry/backoff. A transient 5xx from the
          # close call previously left the issue open; the retry loop
          # makes the cleanup self-healing and stops orphaning issues
          # under API flakiness.
          set +e
          for attempt in 1 2 3; do
            if gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" \
                -X PATCH -f state=closed -f state_reason=not_planned \
                >/dev/null 2>&1; then
              echo "  closed #${ISSUE_NUMBER}"
              exit 0
            fi
            sleep $(( attempt * 2 ))
          done
          echo "::warning::Could not close issue #${ISSUE_NUMBER} after 3 attempts (manual cleanup may be required)"
          exit 0

  # ──────────────────────────────────────────────────────────────────
  # Job 1g: Alternate-model happy-path run
  # Re-runs a minimal happy path with WORKFLOW_EDITOR_MODEL overridden
  # to a different model than the production default. Catches model-
  # coupling regressions without 3x'ing release-gate runtime.
  # ──────────────────────────────────────────────────────────────────
  e2e-alt-model-test:
    needs: [resolve-version]
    # External-dependency opt-out: ALT_EDITOR_MODEL points at an
    # OpenRouter-hosted third-party model that is orthogonal to the
    # production pipeline. If that provider is unavailable (rate-limit,
    # API outage, model deprecation) the gate would otherwise block a
    # legitimate release on an unrelated availability issue. Operators
    # can set repo var `E2E_ALT_MODEL_ENABLED=false` to skip the job
    # without disabling other live tests; the validate gate already
    # accepts `skipped` as a pass for this job.
    if: >-
      ${{ !inputs.skip_e2e
          && !inputs.dry_run
          && vars.E2E_ALT_MODEL_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      TEST_REPO: ${{ inputs.test_repo || github.repository }}
      # Override propagated to the implement run via the issue body's
      # "Note: this run uses `<provider>/<model>` …" line, which the
      # implement workflow's "Detect smoke test" step parses when the
      # title contains [E2E Smoke Test alt-model]. The
      # WORKFLOW_EDITOR_MODEL repo-var path was the original intent
      # (PR #1841) but never wired through (gap acknowledged in PR
      # #1913 body); body-parsing is the cheaper closure since the
      # override is already documented for operators reading the issue.
      # Default model must appear in scripts/codex_model_catalog.json
      # so PR #2196's apply_patch_tool_type registration covers it
      # (anthropic/claude-sonnet-4-6 was never in the catalog, so even
      # a wired override would have failed apply_patch invocation).
      #
      # Default is openai/gpt-5.4 — the same slug as the production
      # WORKFLOW_EDITOR_MODEL default. The previous canary
      # (openai/gpt-5.3-codex) was retired after the 2026-05-07
      # ablation suite identified `apply_patch_tool_type: "freeform"`
      # on the OpenRouter Responses path as the underlying tool-call-
      # emission failure shared by both gpt-5.4 and gpt-5.3-codex —
      # the alt-canary stopped distinguishing them. Operators who want
      # to pin the canary to a non-OpenAI provider for cross-provider
      # coverage can set the repo var `ALT_EDITOR_MODEL` to any
      # catalog-listed non-OpenAI slug (e.g. one of the priority-10
      # entries in scripts/codex_model_catalog.json — minimax/...,
      # google/..., qwen/..., deepseek/..., moonshotai/..., etc.).
      # Adding the chosen slug to the catalog is recommended so codex
      # can register `apply_patch_tool_type` for it; the validation
      # step below only emits a `::warning::` and proceeds when the
      # slug is missing (codex falls back to bundled metadata, but
      # reliability degrades). Keep this default in sync with the
      # production default in implement.yml's MODEL_EDITOR.
      ALT_EDITOR_MODEL: ${{ vars.ALT_EDITOR_MODEL || 'openai/gpt-5.4' }}
    steps:
      # Required for the run-soft-error-analyzer composite action below.
      - name: Checkout repository (for soft-error analyser)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Validate prerequisites
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN}" ] || { echo "::error::GH_PAT required"; exit 1; }

          # Validate ALT_EDITOR_MODEL format before dispatch. A typo
          # (missing `provider/`, trailing whitespace, smart-quote chars)
          # would otherwise only surface deep inside the implement run as
          # an opaque OpenRouter error. Pattern matches the same shape
          # consumed by openai/openrouter SDKs: `<provider>/<model-id>`
          # where provider/id are alnum-with-dot/underscore/dash and the
          # full string is at most 128 chars. If `scripts/codex_model_catalog.json`
          # is present, the model must also appear in it; otherwise we
          # only enforce the shape (catalog file is optional, per CLAUDE.md
          # §4 – env vars get sane defaults).
          if ! [[ "${ALT_EDITOR_MODEL}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] \
             || [ "${#ALT_EDITOR_MODEL}" -gt 128 ]; then
            echo "::error::ALT_EDITOR_MODEL='${ALT_EDITOR_MODEL}' does not match expected '<provider>/<model-id>' shape"
            exit 1
          fi
          if [ -f scripts/codex_model_catalog.json ]; then
            if ! jq -e --arg m "${ALT_EDITOR_MODEL}" '.[$m] // .models[$m] // (.. | strings | select(. == $m)) | length > 0' scripts/codex_model_catalog.json >/dev/null 2>&1; then
              echo "::warning::ALT_EDITOR_MODEL='${ALT_EDITOR_MODEL}' is not in scripts/codex_model_catalog.json — proceeding anyway (catalog is informational)"
            fi
          fi
          echo "Using ALT_EDITOR_MODEL=${ALT_EDITOR_MODEL}"

      - name: Create alt-model smoke issue
        id: create
        run: |
          set -euo pipefail
          # Capture the latest run id of each phase workflow BEFORE creating
          # the issue. The post-wait capture step uses these as anchors to
          # find the new alt-model phase runs (id > pre_<phase>_run_id).
          for WF in clarify plan implement review_autofix; do
            LATEST=$(gh api "repos/${TEST_REPO}/actions/workflows/${WF}.yml/runs?per_page=1" --jq '.workflow_runs[0].id // 0' 2>/dev/null || echo "0")
            echo "pre_${WF}_run_id=${LATEST}" >> "$GITHUB_OUTPUT"
          done
          TITLE="[E2E Smoke Test alt-model] update canary (run ${GITHUB_RUN_ID})"
          # Same canary task as the main e2e job so we exercise the full
          # implement→review path; only the editor model varies. Body is
          # built with explicit newlines to avoid YAML literal-block
          # indentation traps.
          BODY=$'## Task\n'
          BODY+=$'The file `tests/e2e_smoke_canary.txt` already exists. Update its content so it is **exactly** these three lines:\n\n'
          BODY+=$'```\nstatus: ok\n'
          BODY+="run_id: alt-${GITHUB_RUN_ID}"$'\n'
          BODY+=$'updated-by: ai-pipeline\n```\n\n'
          BODY+=$'## Constraints\n'
          BODY+=$'- Only modify `tests/e2e_smoke_canary.txt`.\n'
          BODY+=$'- This is fully specified — **no clarification is needed**.\n'
          BODY+="- Note: this run uses \`${ALT_EDITOR_MODEL}\` as the editor model override."
          NUMBER=$(gh api "repos/${TEST_REPO}/issues" \
            -f title="${TITLE}" -f body="${BODY}" --jq '.number')
          echo "issue_number=${NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Wait for clarify→plan→implement (alt-model)
        id: wait
        env:
          ISSUE_NUMBER: ${{ steps.create.outputs.issue_number }}
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 4500 ))
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            LABELS=$(gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}" \
              --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
            echo "  labels: ${LABELS:-none}"
            # Auto-approve the plan when the issue lands in awaiting-approval.
            if echo "${LABELS}" | grep -q 'ai:awaiting-approval'; then
              gh api "repos/${TEST_REPO}/issues/${ISSUE_NUMBER}/comments" \
                -f body="/approved" >/dev/null 2>&1 || true
            fi
            # Success: the implement phase produced a PR and either is
            # mid-review or done. The alt-model gate doesn't need to wait
            # for review_autofix — that's already covered by the main e2e.
            # `ai:done` is the canonical "implement PR created" terminal for
            # this gate (set in implement.yml after create_pr); `ai:in-review`
            # is retained for forward-compat but is not currently emitted.
            if echo "${LABELS}" | grep -qE 'ai:done|ai:in-review|ai:ready-to-merge|ai:merged'; then
              echo "✓ Alt-model run reached implement-done/review/merge stage"
              exit 0
            fi
            if echo "${LABELS}" | grep -qE 'ai:clarify-failed|ai:plan-failed|ai:implementation-failed'; then
              echo "::error::Alt-model run hit a failure label: ${LABELS}"
              exit 1
            fi
            sleep 20
          done
          echo "::error::Alt-model run timed out before reaching review stage"
          exit 1

      - name: Capture alt-model phase run ids
        id: capture_alt_runs
        if: always() && steps.create.outputs.issue_number != ''
        env:
          ISSUE_NUMBER: ${{ steps.create.outputs.issue_number }}
          PRE_CLARIFY: ${{ steps.create.outputs.pre_clarify_run_id }}
          PRE_PLAN: ${{ steps.create.outputs.pre_plan_run_id }}
          PRE_IMPLEMENT: ${{ steps.create.outputs.pre_implement_run_id }}
          PRE_REVIEW: ${{ steps.create.outputs.pre_review_autofix_run_id }}
        run: |
          set -euo pipefail
          # For each phase, find the most recent workflow run with an id
          # greater than the snapshot taken before the issue was created.
          # We additionally filter by `head_branch == ai/issue-${ISSUE_NUMBER}`
          # for implement/review (those run on the PR branch, so the
          # branch name disambiguates collisions with concurrent runs);
          # clarify/plan run on `main` so the post-creation id ordering
          # is the only available filter.
          BRANCH="ai/issue-${ISSUE_NUMBER}"
          for spec in "clarify:${PRE_CLARIFY:-0}:main" "plan:${PRE_PLAN:-0}:main" "implement:${PRE_IMPLEMENT:-0}:${BRANCH}" "review_autofix:${PRE_REVIEW:-0}:${BRANCH}"; do
            WF="${spec%%:*}"
            REST="${spec#*:}"
            PRE="${REST%%:*}"
            REST="${REST#*:}"
            BRANCH_FILTER="${REST}"
            if [ -n "${BRANCH_FILTER}" ]; then
              QUERY="repos/${TEST_REPO}/actions/workflows/${WF}.yml/runs?per_page=20&branch=${BRANCH_FILTER}"
            else
              QUERY="repos/${TEST_REPO}/actions/workflows/${WF}.yml/runs?per_page=20"
            fi
            NEW_ID=$(gh api "${QUERY}" --jq "[.workflow_runs[] | select(.id > ${PRE})] | sort_by(.created_at) | last | .id // empty" 2>/dev/null || echo "")
            if [ -n "${NEW_ID}" ]; then
              echo "${WF}_run_id=${NEW_ID}" >> "$GITHUB_OUTPUT"
              echo "  ✓ alt-model ${WF} run #${NEW_ID}"
            else
              echo "  ⚠ alt-model ${WF} run not found (analyser will skip this phase)"
            fi
          done

      - name: "Soft-error analyser (alt-model clarify)"
        if: always() && steps.capture_alt_runs.outputs.clarify_run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            clarify=${{ steps.capture_alt_runs.outputs.clarify_run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-alt_clarify
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

      - name: "Soft-error analyser (alt-model plan)"
        if: always() && steps.capture_alt_runs.outputs.plan_run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            plan=${{ steps.capture_alt_runs.outputs.plan_run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-alt_plan
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

      - name: "Soft-error analyser (alt-model implement)"
        if: always() && steps.capture_alt_runs.outputs.implement_run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            implement=${{ steps.capture_alt_runs.outputs.implement_run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-alt_implement
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

      - name: "Soft-error analyser (alt-model review_autofix)"
        if: always() && steps.capture_alt_runs.outputs.review_autofix_run_id != ''
        uses: ./.github/actions/run-soft-error-analyzer
        with:
          phase_runs: |
            review_autofix=${{ steps.capture_alt_runs.outputs.review_autofix_run_id }}
          repo: ${{ env.TEST_REPO }}
          artifact_name: soft-error-report-${{ github.run_id }}-alt_review_autofix
          wait_for_completion_secs: "300"
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          gh_token: ${{ secrets.GH_PAT }}
          model: ${{ vars.LOG_ANALYZER_MODEL || 'openai/gpt-5.4-mini' }}
          reasoning: ${{ vars.LOG_ANALYZER_REASONING || 'medium' }}

      - name: Cleanup alt-model artifacts
        if: always() && steps.create.outputs.issue_number != ''
        env:
          ISSUE_NUMBER: ${{ steps.create.outputs.issue_number }}
        run: |
          # Defence in depth — never abort on single failure; retry each
          # close 3× with backoff. Same pattern as orchestrate-decompose-test
          # cleanup so all e2e jobs leak resources at the same (low) rate
          # under API flakiness.
          set +e
          close_with_retry() {
            local kind="$1" num="$2" attempt
            [ -n "${num}" ] || return 0
            for attempt in 1 2 3; do
              if gh api "repos/${TEST_REPO}/${kind}/${num}" \
                  -X PATCH -f state=closed -f state_reason=not_planned \
                  >/dev/null 2>&1; then
                echo "  closed ${kind%s}/#${num}"
                return 0
              fi
              sleep $(( attempt * 2 ))
            done
            echo "::warning::Could not close ${kind%s}/#${num} after 3 attempts"
            return 1
          }

          close_with_retry "issues" "${ISSUE_NUMBER}"
          # Best-effort PR + branch cleanup. Target ONLY the implement PR whose
          # head branch is ai/issue-<N> (the same selector Phase 3a's
          # wait-implement uses). The previous `first cross-referenced` timeline
          # heuristic closed whatever PR first referenced the canary issue — so
          # an unrelated fix PR that merely says "Refs #<N>" in its body would be
          # force-closed as collateral damage when the implement run failed and
          # no real ai/issue-<N> PR existed to match.
          PR_NUMBER=$(gh api "repos/${TEST_REPO}/pulls?state=open&head=${TEST_REPO%%/*}:ai/issue-${ISSUE_NUMBER}&per_page=1" \
            --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "${PR_NUMBER}" ]; then
            close_with_retry "pulls" "${PR_NUMBER}"
          fi
          for attempt in 1 2 3; do
            if gh api "repos/${TEST_REPO}/git/refs/heads/ai/issue-${ISSUE_NUMBER}" \
                -X DELETE >/dev/null 2>&1; then
              break
            fi
            sleep $(( attempt * 2 ))
          done
          true  # ensure step exits 0 even on failed branch delete

  # ──────────────────────────────────────────────────────────────────
  # Job 2: Validate release prerequisites (same as mark-stable.yml)
  # ──────────────────────────────────────────────────────────────────
  validate:
    needs: [source, resolve-version, e2e-smoke-test, validate-scripts, orphan-workflows-test, orchestrate-decompose-test, validate-standalone-test, clarify-rejects-unsolvable-test, e2e-alt-model-test]
    if: >-
      always() &&
      needs.resolve-version.result == 'success' &&
      needs.validate-scripts.result == 'success' &&
      (needs.e2e-smoke-test.result == 'success' || needs.e2e-smoke-test.result == 'skipped') &&
      (needs.orphan-workflows-test.result == 'success' || needs.orphan-workflows-test.result == 'skipped') &&
      (needs.orchestrate-decompose-test.result == 'success' || needs.orchestrate-decompose-test.result == 'skipped') &&
      (needs.validate-standalone-test.result == 'success' || needs.validate-standalone-test.result == 'skipped') &&
      (needs.clarify-rejects-unsolvable-test.result == 'success' || needs.clarify-rejects-unsolvable-test.result == 'skipped') &&
      (needs.e2e-alt-model-test.result == 'success' || needs.e2e-alt-model-test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate version format
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version tag '${VERSION}'. Must match vX.Y.Z"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.branch }}
          fetch-depth: 0

      - name: Ensure tag does not already exist
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          # Query the remote directly: `git rev-parse refs/tags/<V>` only
          # checks the local tag namespace, which can race a concurrent
          # tag push (or be incomplete depending on checkout fetch
          # config). `git ls-remote --exit-code` returns 0 if the ref
          # exists on origin, 2 if it does not, and any other non-zero
          # value for transport / auth / repo errors. Distinguish those
          # so a transient failure can't silently look like "tag absent"
          # and let the workflow advance to a duplicate-tag push.
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "::error::Tag ${VERSION} already exists on origin"
              exit 1
              ;;
            2)
              # Tag absent — this is what we want.
              echo "Tag ${VERSION} does not yet exist on origin — OK"
              ;;
            *)
              echo "::error::git ls-remote failed with exit code ${rc} (transport/auth/repo error). Refusing to proceed without a confirmed tag-absent signal."
              exit 1
              ;;
          esac

      - name: Verify CI passed on source branch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
        run: |
          set -euo pipefail
          source scripts/gh_helpers.sh 2>/dev/null || true
          type gh_retry >/dev/null 2>&1 || gh_retry() { "$@"; }
          SHA=$(git rev-parse HEAD)
          echo "Checking CI status for ${SOURCE_BRANCH} @ $SHA ..."
          # Allow the release even if no CI status is reported (repos
          # with no required checks). Fail only on explicit failure.
          # Distinguish three failure modes:
          #   1. API call itself failed (transport / auth / repeated 5xx
          #      / rate-limit retries exhausted) → hard error. The old
          #      `|| echo "pending"` coerced this into a synthetic
          #      "pending" that bypassed the gate.
          #   2. API returned an empty state (repo has no required
          #      checks configured) → proceed (preserves the documented
          #      "Allow the release even if no CI status is reported"
          #      policy above).
          #   3. API returned a real state — fail only on explicit
          #      "failure" / "error".
          # gh_retry already surfaces the final failure stderr, so rc
          # alone distinguishes transport/auth failure from an empty CI
          # state.
          set +e
          STATE=$(gh_retry gh api "repos/${{ github.repository }}/commits/${SHA}/status" \
            --jq '.state')
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Failed to query CI status after retries (rc=${rc}). Refusing to release without a confirmed CI signal."
            exit 1
          fi
          if [ -z "$STATE" ]; then
            echo "CI state: (empty — no required checks configured?) — proceeding"
          elif [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
            echo "::error::CI is failing on ${SOURCE_BRANCH} ($STATE). Fix before releasing."
            exit 1
          else
            echo "CI state: $STATE — OK"
          fi

      # Temporary: reveal which git invocation in checkout's post-step
      # produces `The process '/usr/bin/git' failed with exit code 128`.
      # Remove after root-cause is identified and a targeted fix lands.
      - *git-checkout-diag

  # ──────────────────────────────────────────────────────────────────
  # Job 3: Create release (same as mark-stable.yml)
  # ──────────────────────────────────────────────────────────────────
  release:
    needs: [source, resolve-version, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.branch }}
          fetch-depth: 0

      - name: Extract changelog for this version
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          NOTES=$(awk \
            "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" \
            CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="No changelog entry found for ${VERSION}."
          fi
          echo "$NOTES" > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Tag version and update stable pointer
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION="${{ needs.resolve-version.outputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          # Immutable version tag (refs/tags/ prefix for consistency with the moving-tag pushes below)
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

          # Moving stable pointer (use refs/tags/ to disambiguate from refs/heads/stable)
          git tag -f stable "$VERSION"
          git push -f origin refs/tags/stable

          # Moving major-version pointer (e.g. v1)
          git tag -f "$MAJOR" "$VERSION"
          git push -f origin "refs/tags/$MAJOR"

          echo "Tagged $VERSION and updated stable + $MAJOR pointers."

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            --target "${SOURCE_BRANCH}"

      - name: Notify consumer repos via repository_dispatch
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"

          CONSUMER_FILE=".github/ai/consumer_repos.json"
          if [ ! -f "$CONSUMER_FILE" ]; then
            echo "No consumer_repos.json found — skipping repository_dispatch."
            exit 0
          fi

          REPOS=$(jq -r '.[]' "$CONSUMER_FILE" 2>/dev/null || true)
          if [ -z "$REPOS" ]; then
            echo "consumer_repos.json is empty — skipping."
            exit 0
          fi

          for REPO in $REPOS; do
            echo "Dispatching coding-workflows-stable-released to ${REPO} ..."
            gh api "repos/${REPO}/dispatches" \
              -f event_type="coding-workflows-stable-released" \
              -f "client_payload[version]=${VERSION}" \
              || echo "::warning::Failed to dispatch to ${REPO} (may lack permissions)"
          done

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        env:
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
        run: |
          echo "=== DRY RUN ==="
          VERSION="${{ needs.resolve-version.outputs.version }}"
          echo "Would tag ${SOURCE_BRANCH} as: ${VERSION}"
          echo "Would update pointers: stable, $(echo "${VERSION}" | cut -d. -f1)"
          echo ""
          echo "Changelog notes:"
          cat "${{ steps.changelog.outputs.notes_file }}"

      # Temporary: reveal which git invocation in checkout's post-step
      # produces `The process '/usr/bin/git' failed with exit code 128`.
      # Remove after root-cause is identified and a targeted fix lands.
      - *git-checkout-diag

  # ──────────────────────────────────────────────────────────────────
  # Job 3.5: Sync stable bug fixes back to main
  #
  # After a successful stable release, dispatch
  # `forward-merge-stable-to-main.yml` so the just-released bug fixes
  # are propagated to `main`. This is belt-and-braces — the
  # forward-merge workflow already runs on every push to `stable`
  # (typically via the bug-fix PR merge), but explicitly dispatching
  # here guarantees the sync is tied to the release event itself, so
  # `main` can never silently drift behind a tagged stable release.
  #
  # Skipped on dry runs (no real release happened).
  # ──────────────────────────────────────────────────────────────────
  sync-to-main:
    needs: [release]
    if: >-
      !inputs.dry_run &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch forward-merge-stable-to-main
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          # --repo "${GITHUB_REPOSITORY}" is required: this job has no
          # checkout step, so without it `gh workflow run` falls back to
          # `git remote` detection and aborts with
          # `fatal: not a git repository (or any of the parent directories): .git`.
          gh workflow run forward-merge-stable-to-main.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref stable
          echo "Dispatched forward-merge-stable-to-main.yml on stable branch."
          echo "View runs: https://github.com/${GITHUB_REPOSITORY}/actions/workflows/forward-merge-stable-to-main.yml"

  # ──────────────────────────────────────────────────────────────────
  # Job 4: Combined Telegram notification (runs after ALL jobs)
  # ──────────────────────────────────────────────────────────────────
  notify:
    needs: [resolve-version, e2e-smoke-test, validate-scripts, workflow-log-analysis-test, orphan-workflows-test, orchestrate-decompose-test, validate-standalone-test, clarify-rejects-unsolvable-test, e2e-alt-model-test, validate, release, sync-to-main]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ── Consolidated soft-error report ─────────────────────────
      # Replaces the historical Phase 8 LLM re-summarisation that lived
      # inside `e2e-smoke-test`. Two reasons for moving this here:
      #   1. Coverage: `notify` `needs:` every smoke-test job, so it can
      #      see the per-phase artifacts emitted by
      #      workflow-log-analysis-test (workflow_log_analysis),
      #      orphan-workflows-test (validation_refresh, update_workflows,
      #      memory_maintenance), orchestrate-decompose-test,
      #      validate-standalone-test, clarify-rejects-unsolvable-test,
      #      and e2e-alt-model-test (alt_*). Phase 8 only saw the 6 e2e
      #      phases.
      #   2. Fidelity: pure-concat instead of an LLM second-pass means
      #      every per-phase finding is preserved verbatim. The previous
      #      flow re-ran the analyser model with an "<800 words" prompt
      #      cap, which silently dropped findings during consolidation.
      # The notify job runs `if: always()` to deliver a Telegram message
      # even when earlier jobs fail. Each setup step below is marked
      # fail-open so a transient checkout/setup-python/download outage
      # cannot suppress the release-status notification — the
      # consolidation step degrades gracefully (empty-input stub) and
      # the Telegram send step itself is `if: always()`.
      - name: Checkout repository
        id: checkout_repo
        if: always()
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        id: setup_python
        if: always()
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download per-phase soft-error reports
        id: download_soft_errors
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          # `actions/download-artifact@v6` accepts a glob in `pattern`
          # and downloads matching artifacts from the *current* workflow
          # run. Each artifact lands in its own subdirectory (default
          # behaviour); the consolidation script tolerates both that
          # layout and the flattened `merge-multiple` layout.
          pattern: soft-error-report-${{ github.run_id }}-*
          path: /tmp/soft-error-artifacts
          merge-multiple: false

      - name: Consolidate per-phase soft-error reports
        id: consolidate_soft_errors
        if: always()
        continue-on-error: true
        env:
          # Surface the download step's outcome so the consolidator can
          # emit a clearly-marked "download failed" stub if the input
          # directory is empty for that reason — without this, a
          # transient download outage would silently produce a "no
          # findings" stub identical to a clean run, masking real
          # per-phase findings that exist upstream.
          DOWNLOAD_OUTCOME: ${{ steps.download_soft_errors.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout_repo.outcome || 'success' }}
          SETUP_PYTHON_OUTCOME: ${{ steps.setup_python.outcome || 'success' }}
          # Tunable Telegram-summary byte cap. Default 2800 leaves
          # headroom under Telegram's 4096-char body cap for the rest
          # of the release-status text (job-status pill, run URL, etc.);
          # operators can override via repo var `SOFT_ERROR_TELEGRAM_BYTES`
          # if the rest of the message body changes shape (e.g. more
          # smoke-test sibling jobs are added). Pattern matches the
          # other tunables in this workflow (`vars.LOG_ANALYZER_MODEL`
          # / `vars.LOG_ANALYZER_REASONING`).
          SOFT_ERROR_TELEGRAM_BYTES: ${{ vars.SOFT_ERROR_TELEGRAM_BYTES || '2800' }}
        run: |
          set -euo pipefail
          REPORT="/tmp/soft_error_report.md"
          SUMMARY="/tmp/soft_error_summary.md"
          mkdir -p /tmp/soft-error-artifacts

          # Fail-open shell fallback: if the upstream Checkout or
          # Setup-Python steps failed (both are `continue-on-error: true`),
          # python3 and/or one of the consolidation scripts may not be on
          # disk. Without this guard, the `python3 scripts/...` invocation
          # below would `set -e` exit the step before writing stub files,
          # and the Telegram step would have nothing to attach.
          #
          # We check BOTH helper scripts because the consolidator imports
          # `truncate_to_utf8_byte_cap` as a sibling module — if that
          # helper is missing or renamed (e.g. partial checkout, future
          # refactor), the python invocation would `ImportError` before
          # writing stubs. Belt-and-braces: also wrap the python call in
          # an `||` fallback so any *other* unanticipated failure (env
          # var corruption, missing system dep, etc.) still yields stub
          # outputs rather than aborting the step.
          if ! command -v python3 >/dev/null 2>&1 \
             || [ ! -f scripts/consolidate_soft_error_reports.py ] \
             || [ ! -f scripts/truncate_to_utf8_byte_cap.py ]; then
            REASON="checkout=${CHECKOUT_OUTCOME} setup_python=${SETUP_PYTHON_OUTCOME}"
            echo "::warning::Consolidator unavailable (${REASON}); writing fallback stub."
            # Lead with the actual diagnostic — the failed step is the
            # primary failure here, NOT a missing soft-error artifact.
            # An earlier draft suggested inspecting per-phase artifacts
            # first, but reviewers flagged that as misleading because it
            # can send operators chasing the wrong cause; the per-phase
            # artifacts may exist (they are uploaded by their own
            # parent jobs, independent of this notify-job checkout) but
            # the fix lives in the notify-job logs, not the artifacts.
            {
              echo "# Consolidated soft-error report"
              echo
              echo "**CONSOLIDATOR UNAVAILABLE.** The notify job's"
              echo "Checkout / Setup-Python step failed (${REASON}); the"
              echo "consolidation script could not be executed. To"
              echo "diagnose, open this workflow run and inspect the"
              echo "failed step's logs in the notify job — the per-phase"
              echo "soft-error artifacts (uploaded by their own parent"
              echo "jobs) are unrelated to this failure path."
            } > "${REPORT}"
            {
              echo "## Soft-error consolidation"
              echo "_CONSOLIDATOR UNAVAILABLE (${REASON}); see the notify"
              echo "job's failed step logs for the root cause._"
            } > "${SUMMARY}"
            echo "report_path=${REPORT}" >> "$GITHUB_OUTPUT"
            echo "summary_path=${SUMMARY}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Sanitize SOFT_ERROR_TELEGRAM_BYTES in shell before passing
          # to Python. `set -euo pipefail` is in effect, so a non-integer
          # repo-var value (whitespace, "abc", etc.) would otherwise make
          # argparse exit non-zero and abort the step before it writes
          # report_path/summary_path — undermining the documented
          # fail-open intent.
          #
          # Trimming first means a repo-var saved as `" 3000 "` (with
          # incidental whitespace) is treated equivalently to `"3000"`
          # rather than silently falling back to the default. The
          # subsequent regex accepts any integer (incl. negatives like
          # `-1`); both `0` and any negative value flow through to the
          # Python consolidator's `max_bytes <= 0` branch which disables
          # truncation entirely. Operators who set
          # `SOFT_ERROR_TELEGRAM_BYTES=0` (or `-1`, by historical
          # convention from other helpers in this repo) to opt out of
          # the cap have their intent honoured rather than overridden.
          SOFT_ERROR_BYTES_RAW="${SOFT_ERROR_TELEGRAM_BYTES:-2800}"
          SOFT_ERROR_BYTES_TRIMMED="${SOFT_ERROR_BYTES_RAW#"${SOFT_ERROR_BYTES_RAW%%[![:space:]]*}"}"
          SOFT_ERROR_BYTES_TRIMMED="${SOFT_ERROR_BYTES_TRIMMED%"${SOFT_ERROR_BYTES_TRIMMED##*[![:space:]]}"}"
          if [[ "${SOFT_ERROR_BYTES_TRIMMED}" =~ ^-?[0-9]+$ ]]; then
            SOFT_ERROR_BYTES="${SOFT_ERROR_BYTES_TRIMMED}"
          else
            echo "::warning::Invalid SOFT_ERROR_TELEGRAM_BYTES='${SOFT_ERROR_BYTES_RAW}' (must be an integer); falling back to 2800."
            SOFT_ERROR_BYTES=2800
          fi

          # `||` fallback: any unanticipated failure (system Python
          # missing a stdlib module, OS-level error before argparse
          # runs, etc.) still yields stub outputs so the Telegram
          # step has something to attach. The script itself is
          # already non-blocking for the documented failure modes
          # (missing inputs, decode errors, OpenRouter outages),
          # so this branch only fires for genuinely unexpected
          # crashes.
          if ! python3 scripts/consolidate_soft_error_reports.py \
              --input-dir /tmp/soft-error-artifacts \
              --output-full "${REPORT}" \
              --output-summary "${SUMMARY}" \
              --max-summary-bytes "${SOFT_ERROR_BYTES}" \
              --download-status "${DOWNLOAD_OUTCOME:-unknown}"; then
            # The script is documented as non-blocking for every known
            # failure mode (missing inputs, decode errors, OpenRouter
            # outages), so any non-zero exit reaching this branch is
            # unexpected — could be a traceback, an argparse failure
            # from a future arg-format change, an environment-level
            # OS error, etc. We don't pretend to know which; the stub
            # just says "exited non-zero" and points at the notify-job
            # logs.
            echo "::warning::Consolidator exited non-zero unexpectedly; writing fallback stub."
            {
              echo "# Consolidated soft-error report"
              echo
              echo "**CONSOLIDATOR EXITED NON-ZERO.**"
              echo "\`scripts/consolidate_soft_error_reports.py\` returned a"
              echo "non-zero exit code. The script is documented as non-blocking,"
              echo "so any non-zero exit is itself a bug worth surfacing —"
              echo "inspect the notify-job logs for the actual error (traceback,"
              echo "argparse error, OS-level failure, etc.). Per-phase"
              echo "artifacts may still be available as separate"
              echo "\`soft-error-report-<run_id>-<phase>\` entries."
            } > "${REPORT}"
            {
              echo "## Soft-error consolidation"
              echo "_CONSOLIDATOR EXITED NON-ZERO; see notify-job logs for the actual error_"
            } > "${SUMMARY}"
          fi
          echo "report_path=${REPORT}" >> "$GITHUB_OUTPUT"
          echo "summary_path=${SUMMARY}" >> "$GITHUB_OUTPUT"

      - name: Upload consolidated soft-error report
        if: always() && steps.consolidate_soft_errors.outputs.report_path != ''
        uses: actions/upload-artifact@v6
        with:
          # Artifact name preserved for backward compatibility with any
          # operator tooling that fetches `soft-error-report-<run_id>`.
          name: soft-error-report-${{ github.run_id }}
          path: /tmp/soft_error_report.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Send Telegram notification
        id: tg_send
        # Always send the release-status notification, even if any of the
        # upstream consolidation steps (checkout / setup-python / download
        # / consolidate) failed. Without `if: always()` a single failure
        # in those steps would suppress the notification entirely; the
        # Telegram body simply omits the soft-error summary when its
        # source file is missing.
        if: always()
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          CHAT_ID="${TG_CHAT_ID:-}"
          if [ -z "${TG_BOT_SECRET:-}" ] || [ -z "${CHAT_ID}" ]; then
            echo "Telegram notification skipped (missing TG_BOT_SECRET or chat_id)"
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          E2E="${{ needs.e2e-smoke-test.result }}"
          SCRIPTS="${{ needs.validate-scripts.result }}"
          # workflow-log-analysis-test is intentionally NOT in
          # `validate.needs`, so its result does not gate the release.
          # It IS reported here via the non-blocking audit job's output
          # so operators see whether the post-hoc audit pass succeeded
          # alongside the rest of the gate. Fall back to the job
          # result only when the job was skipped or failed before the
          # dispatch step emitted an outcome.
          LOG_ANALYSIS="${{ needs.workflow-log-analysis-test.outputs.workflow_conclusion || needs.workflow-log-analysis-test.result }}"
          ORPHANS="${{ needs.orphan-workflows-test.result }}"
          ORCHESTRATE_DECOMPOSE="${{ needs.orchestrate-decompose-test.result }}"
          VALIDATE_STANDALONE="${{ needs.validate-standalone-test.result }}"
          CLARIFY_REJECTS="${{ needs.clarify-rejects-unsolvable-test.result }}"
          ALT_MODEL="${{ needs.e2e-alt-model-test.result }}"
          VALIDATE="${{ needs.validate.result }}"
          RELEASE="${{ needs.release.result }}"
          LOG_ANALYSIS_RUN_ID="${{ needs.workflow-log-analysis-test.outputs.workflow_run_id || '' }}"
          LOG_ANALYSIS_STATUS="${{ needs.workflow-log-analysis-test.outputs.workflow_snapshot_status || '' }}"
          LOG_ANALYSIS_SNAPSHOT_CONCLUSION="${{ needs.workflow-log-analysis-test.outputs.workflow_snapshot_conclusion || '' }}"

          # `LOG_ANALYSIS` is deliberately omitted from `all_supplemental_ok`
          # — its failure must NOT flip the overall message to "FAILED".
          # The release path is independent of it (see `validate.needs`).
          all_supplemental_ok=true
          for r in "$ORPHANS" "$ORCHESTRATE_DECOMPOSE" "$VALIDATE_STANDALONE" "$CLARIFY_REJECTS" "$ALT_MODEL"; do
            if [ -n "$r" ] && [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              all_supplemental_ok=false
            fi
          done

          # Render an icon for log-analysis using the same scheme as the
          # FAILED branch loop below, so the SUCCEEDED line surfaces a
          # real ✓/⊘/✗ for the post-hoc audit even when release passed.
          case "$LOG_ANALYSIS" in
            success) LOG_ANALYSIS_ICON="✓" ;;
            skipped) LOG_ANALYSIS_ICON="⊘" ;;
            "") LOG_ANALYSIS_ICON="-" ;;
            *) LOG_ANALYSIS_ICON="✗" ;;
          esac

          # Determine overall status
          if [ "$E2E" = "success" ] && [ "$SCRIPTS" = "success" ] && [ "$VALIDATE" = "success" ] && [ "$RELEASE" = "success" ] && [ "$all_supplemental_ok" = "true" ]; then
            MSG="Release ${{ needs.resolve-version.outputs.version }} SUCCEEDED"
            MSG+=$'\n'"e2e ✓ scripts ✓ orphans ✓ orchestrate ✓ validate-fx ✓ negative ✓ alt-model ✓ release ✓ log-analysis ${LOG_ANALYSIS_ICON}"
          else
            MSG="Release ${{ needs.resolve-version.outputs.version }} FAILED"
            STATUS_LINE=""
            for JOB_NAME in e2e-smoke-test validate-scripts workflow-log-analysis-test orphan-workflows-test orchestrate-decompose-test validate-standalone-test clarify-rejects-unsolvable-test e2e-alt-model-test validate release; do
              case "$JOB_NAME" in
                e2e-smoke-test) RESULT="$E2E" ;;
                validate-scripts) RESULT="$SCRIPTS" ;;
                workflow-log-analysis-test) RESULT="$LOG_ANALYSIS" ;;
                orphan-workflows-test) RESULT="$ORPHANS" ;;
                orchestrate-decompose-test) RESULT="$ORCHESTRATE_DECOMPOSE" ;;
                validate-standalone-test) RESULT="$VALIDATE_STANDALONE" ;;
                clarify-rejects-unsolvable-test) RESULT="$CLARIFY_REJECTS" ;;
                e2e-alt-model-test) RESULT="$ALT_MODEL" ;;
                validate) RESULT="$VALIDATE" ;;
                release) RESULT="$RELEASE" ;;
              esac
              case "$RESULT" in
                success) ICON="✓" ;;
                skipped) ICON="⊘" ;;
                "") ICON="-" ; RESULT="not_run" ;;
                *) ICON="✗" ;;
              esac
              STATUS_LINE+="${JOB_NAME}: ${ICON} (${RESULT})  "
            done
            MSG+=$'\n'"${STATUS_LINE}"
          fi
          MSG+=$'\n'"Run: ${RUN_URL}"
          if [ -n "${LOG_ANALYSIS_RUN_ID}" ]; then
            LOG_ANALYSIS_SNAPSHOT="run #${LOG_ANALYSIS_RUN_ID}"
            if [ -n "${LOG_ANALYSIS_STATUS}" ]; then
              LOG_ANALYSIS_SNAPSHOT+=" status=${LOG_ANALYSIS_STATUS}"
            fi
            if [ -n "${LOG_ANALYSIS_SNAPSHOT_CONCLUSION}" ]; then
              LOG_ANALYSIS_SNAPSHOT+=" conclusion=${LOG_ANALYSIS_SNAPSHOT_CONCLUSION}"
            fi
            MSG+=$'\n'"workflow-log-analysis snapshot: ${LOG_ANALYSIS_SNAPSHOT}"
          fi

          # Append the consolidated soft-error summary built by the
          # `Consolidate per-phase soft-error reports` step above. The
          # script does section-aware truncation (it drops whole findings
          # blocks rather than slicing mid-finding) and emits a status
          # pill listing every phase's analyser status code so the
          # release engineer can spot analyser failures (call_failed /
          # api_skipped) at a glance even when there are no findings.
          # Non-blocking by design: a missing summary file means the
          # consolidation step itself failed, in which case the
          # release-status header is still delivered.
          SOFT_ERR=""
          if [ -f /tmp/soft_error_summary.md ]; then
            SOFT_ERR=$(cat /tmp/soft_error_summary.md)
          fi
          if [ -n "${SOFT_ERR}" ]; then
            MSG+=$'\n\n'"---"$'\n'"${SOFT_ERR}"
          fi

          # Telegram caps message bodies at 4096 chars; trim if necessary.
          # The consolidator already does section-aware truncation up to
          # 2800 bytes, and the typical release-status header (job-status
          # pills + run URL) is ~300–500 bytes — so the combined message
          # is normally well under 4096. This block is the fallback for
          # the rare overflow case (large header, multi-line failure
          # status, or operator-raised SOFT_ERROR_TELEGRAM_BYTES).
          #
          # Using bash's `${MSG:0:3950}` here can mid-byte-split a
          # multi-byte UTF-8 sequence — the consolidated summary
          # routinely contains ✓/✗/⏳/em-dashes, and the consolidator's
          # status pill uses backticks plus phase names. A mid-codepoint
          # slice corrupts the rendered Telegram message and (worse)
          # makes the byte-count diverge from the visible character
          # count. Hand off to scripts/truncate_to_utf8_byte_cap.py
          # for codepoint-boundary-aware truncation. python3 is always
          # preinstalled at /usr/bin/python3 on `ubuntu-latest`, even
          # when `actions/setup-python` fails. If the helper script is
          # itself unavailable (checkout failed), fall back to the
          # legacy byte-slice — best-effort defence-in-depth so the
          # notification still goes out.
          # `wc -c` output may include leading whitespace on some
          # implementations (BSD-derived `wc` pads with spaces; GNU
          # `wc` on `ubuntu-latest` typically does not). Under
          # `set -euo pipefail`, a non-integer `MSG_BYTES` would make
          # `[ -gt 4000 ]` exit with a numeric-comparison error,
          # aborting the Telegram step before the send. Strip
          # whitespace defensively, then validate the result is
          # actually numeric — if any future `wc` impl emits
          # genuinely non-numeric padding (unlikely but cheap to guard
          # against), skip truncation and let the message go through.
          # Erring on the side of "send the message" matches the
          # documented fail-open intent of the notify job.
          MSG_BYTES=$(printf '%s' "${MSG}" | wc -c | tr -d '[:space:]')
          if ! [[ "${MSG_BYTES}" =~ ^[0-9]+$ ]]; then
            echo "::warning::wc -c produced non-integer output '${MSG_BYTES}'; skipping truncation."
            MSG_BYTES=0
          fi
          if [ "${MSG_BYTES}" -gt 4000 ]; then
            if command -v python3 >/dev/null 2>&1 \
               && [ -f scripts/truncate_to_utf8_byte_cap.py ]; then
              MSG=$(printf '%s' "${MSG}" | python3 scripts/truncate_to_utf8_byte_cap.py 3950)
            else
              # Fallback when checkout/setup-python failed and the helper
              # script isn't on disk. `${MSG:0:3950}` is char-oriented under
              # bash's UTF-8 locale (the default in `ubuntu-latest` runners),
              # so it could char-slice and still leave the message > 3950
              # BYTES — exactly the case that trips Telegram's body cap.
              # `head -c` is byte-oriented (POSIX), so the resulting message
              # is guaranteed to fit even though we may mid-byte-split a
              # codepoint (Telegram renders that as a U+FFFD glyph at the
              # tail; not great, but better than message rejection).
              # The python3 path above is preferred; this is defence-in-
              # depth for the rare case where it's unavailable.
              MSG=$(printf '%s' "${MSG}" | head -c 3950)
            fi
            MSG+=$'\n'"…[truncated; see artifact 'soft-error-report-${{ github.run_id }}']"
          fi

          # Send notification (persists — not auto-deleted)
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_SECRET}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}" >/dev/null 2>&1 || echo "::warning::Telegram send failed"

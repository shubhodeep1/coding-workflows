name: "Internal: AI Review Autofix Sweep"

# Periodic sweep that dispatches `internal-review.yml` via workflow_dispatch
# for every open non-draft PR, regardless of whether the PR is tracked by the
# orchestrator (`ai:*` labels). Complements the existing orchestrator-only
# polling in `internal-orchestrate-poll.yml` / `orchestrate_poll.yml` so that
# review autofix runs continuously on human/Claude PRs too.
#
# Why workflow_dispatch (and not push/synchronize):
#   - workflow_dispatch bypasses the synchronize-only self-trigger skip in
#     `review_autofix.yml:330-363` (the gate's `EVENT_ACTION == "synchronize"`
#     guard at line 332 is false on dispatch), so an `[ai-autofix]`-headed PR
#     still gets a verification rerun every cycle.
#   - Mirrors `_dispatch_review_for_conflicts` in
#     `scripts/orchestrate_poll_process.sh:7830` so the new sweep behaves
#     consistently with the orchestrator's existing dispatch path, except for
#     the ref (below).
#
# Dispatch ref (security, issue #4618):
#   - The sweep always dispatches from the default branch and passes only a
#     validated PR number as data. Dispatching `--ref <PR head branch>` ran the
#     unmerged branch's copy of internal-review.yml with `secrets: inherit`
#     and write permissions, so anyone who could push a same-repo branch could
#     have the scheduled sweep run workflow code no review had approved.
#     review_autofix.yml checks out the PR head from the PR's metadata either
#     way, and both concurrency groups are keyed by PR number, not by ref.
#   - Because a default-branch run's head_branch no longer names the PR,
#     internal-review.yml names every dispatched run
#     `Internal: AI Review & Autofix [pr:<N>]`, and the snapshot below keys
#     those runs by `pr:<N>` (see dedupe_key) instead of by head branch.
#
# Concurrency safety:
#   - Per-PR preflight reuses the `_has_active_autofix_run` pattern
#     (orchestrate_poll_process.sh:7792-7814): if any in_progress, queued, or
#     pending run already exists on `internal-review.yml` / `review_autofix.yml`
#     for the PR's head ref, or a dispatched run is named for the PR, skip the
#     dispatch. In-progress and pending runs
#     are never age-discounted; only queued runs may expire. This collapses the
#     dispatch-vs-synchronize parallel-write window from "indefinite" to
#     "GitHub API visibility delay" (~few seconds).
#   - `in_progress` runs suppress a duplicate dispatch with no time limit:
#     the codex-agent job legitimately runs well over an hour.
#   - `queued` runs suppress only until `SWEEP_STALE_QUEUED_MINUTES`
#     (default 120). GitHub can wedge a run in `queued` with zero jobs
#     and refuse both `cancel` (409 "has not been queued yet") and
#     `rerun` (403 "already running"), leaving nothing that can clear it.
#     With no cutoff such a run suppressed this sweep forever, and the
#     sweep is the only recovery path for the PR it belongs to, so the
#     guard deadlocked the mechanism it protects: PR #3841 sat unreviewed
#     for 11+ hours behind run 32984498460 while every 30-minute tick
#     logged `AUTOFIX_SWEEP_SKIP ... reason=active_run`. The cutoff sits
#     above the longest observed legitimate concurrency wait (~94 min for
#     a pull_request run queued behind an in-flight autofix round) so a
#     real wait is never cut short.
#   - Sweep-vs-sweep is bounded by the workflow-level concurrency group
#     below (`review-autofix-sweep`), which serialises sweep ticks.
#
# Cost guard:
#   - 30 min cadence matches the existing orchestrator poll cadence and is
#     a conscious trade-off (CLAUDE.md §1: Speed is the lowest priority).
#   - `[skip ai]` in the PR title, or alone on a PR body line, is the only
#     opt-out honoured here (same rule as the review gate); per
#     Q2=A the sweep otherwise targets every open non-draft PR.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      head_ref_filter:
        description: "Optional substring match against PR head ref (e.g. 'claude/'); empty = all open non-draft PRs"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Log candidates without dispatching"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read
  actions: write

# Serialise sweep ticks so an overrun (cron firing while the previous tick is
# still enumerating) cannot double-dispatch. Sweep ticks against orchestrator-
# managed PRs are independently deduped by the orchestrator's own cycle-local
# tracker and the per-PR preflight below.
concurrency:
  group: review-autofix-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - name: Check out budget helper
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record GH_PAT budget at sweep start
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_PAT_BUDGET_FILE: ${{ runner.temp }}/gh_pat_budget_${{ github.run_id }}_${{ github.run_attempt }}_sweep
        run: |
          source scripts/gh_helpers.sh
          gh_pat_budget start review_autofix_sweep sweep "${GH_PAT_BUDGET_FILE}"

      - name: Enumerate open PRs and dispatch internal-review.yml
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          READ_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF_FILTER: ${{ inputs.head_ref_filter }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_WORKFLOW_EDITS: ${{ contains(' 1 true yes on ', format(' {0} ', vars.ALLOW_WORKFLOW_EDITS || 'true')) && 'true' || 'false' }}
          SWEEP_STALE_QUEUED_MINUTES: ${{ vars.SWEEP_STALE_QUEUED_MINUTES || '120' }}
        run: |
          set -euo pipefail

          # Fetch all open PRs, then filter to non-draft client-side.
          # `gh` rejects `--slurp` combined with `--jq`, so pipe the
          # per-page arrays from `gh api --paginate` through a separate
          # `jq -s 'add // []'` to merge them into one snapshot before
          # filtering. Mirrors the established repo pattern (e.g.
          # implement.yml:786, gh_helpers.sh:916).
          prs_json="$(GH_TOKEN="${READ_TOKEN}" gh api --paginate -X GET "repos/${REPOSITORY}/pulls" \
            -f state=open -f per_page=100 \
            | jq -s '(add // []) | map(select(.draft == false) | {
              number,
              head_ref: .head.ref,
              head_sha: .head.sha,
              title: (.title // ""),
              body: (.body // "")
            })')"

          printf '%s\n' "${prs_json}" > "${RUNNER_TEMP}/ci-cancelled-pr-snapshot.json"

          total="$(printf '%s' "${prs_json}" | jq 'length')"
          echo "AUTOFIX_SWEEP_START repo=${REPOSITORY} candidates=${total} head_ref_filter=${HEAD_REF_FILTER:-<none>} dry_run=${DRY_RUN}"

          dispatched=0
          skipped_active=0
          skipped_filter=0
          skipped_skip_ai=0
          failures=0
          # Identical to the gate's copy in review_autofix.yml (issue #4985):
          # only a body line holding nothing but the marker, outside a fenced
          # block, counts. A fence closes only on a matching fence (same
          # character, at least as long, up to 3 spaces, issue #5377).
          # tests/test_skip_ai_marker_rule.py runs both copies.
          SKIP_AI_BODY_AWK='{ sub(/\r$/, "") } fl > 0 { if ($0 ~ /^ ? ? ?(```+|~~~+)[ \t]*$/) { r = $0; sub(/^ */, "", r); sub(/[ \t]*$/, "", r); if (substr(r, 1, 1) == fc && length(r) >= fl) fl = 0 } next } match($0, /^[ \t]*(```+|~~~+)/) { r = substr($0, RSTART, RLENGTH); sub(/^[ \t]*/, "", r); fc = substr(r, 1, 1); fl = length(r); next } /^ ? ? ?\[skip ai\][ \t]*$/ { found = 1 } END { exit found ? 0 : 1 }'

          if [ "${total}" -eq 0 ]; then
            echo "AUTOFIX_SWEEP_END dispatched=${dispatched} skipped_active=${skipped_active} skipped_filter=${skipped_filter} skipped_skip_ai=${skipped_skip_ai} failures=${failures} candidates=${total}"
            exit 0
          fi

          # Snapshot active review-family runs once per workflow, then do
          # per-PR lookups locally so the sweep avoids N×2 workflow-run API
          # fanout while preserving the existing active-run skip semantics.
          declare -A active_review_runs=()

          snapshot_active_review_runs() {
            local workflow="$1"
            local status snapshot_json='{}' cached_head_ref cached_count stale_run_id stale_run_created_epoch queued_age_minutes
            local stale_cutoff_epoch=0
            local stale_snapshot_epoch=0

            # Epoch before which a still-`queued` run is treated as wedged
            # rather than active. Computed in bash so jq never needs `now`
            # (keeps the reduce a pure function of its input). A
            # non-positive / unparseable value disables the cutoff, which
            # restores the previous always-suppress behaviour — fail-safe
            # toward the old semantics, not toward duplicate dispatch.
            if [ "${SWEEP_STALE_QUEUED_MINUTES:-0}" -gt 0 ] 2>/dev/null; then
              stale_snapshot_epoch="$(date -u +%s 2>/dev/null || echo 0)"
              stale_cutoff_epoch="$(date -u -d "-${SWEEP_STALE_QUEUED_MINUTES} minutes" +%s 2>/dev/null || echo 0)"
            fi

            # Fetch only active statuses for this workflow, then slurp the
            # page objects and reduce over their `.workflow_runs[]` entries.
            # `active` counts toward the skip; `stale` is logged instead so a
            # wedged run is visible rather than silently discounted.
            #
            # `pending` is fetched alongside queued/in_progress (one extra
            # API call per workflow per tick, §15-audited: the runs API has
            # no multi-status filter) because a run held back by the
            # review_autofix concurrency group (cancel-in-progress=false)
            # reports status=pending. During the PR #3895 incident the
            # queued/in_progress-only snapshot never saw the pending
            # duplicate, so every tick re-dispatched and each new run
            # replaced the pending predecessor. A pending run never counts
            # as stale — it is bounded by its running peer's job timeout.
            if snapshot_json="$(
              for status in queued in_progress pending; do
                GH_TOKEN="${READ_TOKEN}" gh api --paginate -X GET "repos/${REPOSITORY}/actions/workflows/${workflow}/runs" \
                  -f status="${status}" \
                  -f per_page=100 \
                  2>/dev/null || true
              done | jq -c -s --argjson cutoff "${stale_cutoff_epoch}" '
                  def created_epoch:
                    (.created_at // "")
                    | if . == "" then null
                      else (try fromdateiso8601 catch null)
                      end;
                  # A queued run older than the cutoff is wedged. Anything
                  # in_progress, or whose created_at is missing/unparseable,
                  # still counts as active (fail-safe).
                  def is_stale_queued:
                    $cutoff > 0
                    and (.status // "") == "queued"
                    and (created_epoch != null)
                    and (created_epoch <= $cutoff);
                  # A dispatched run is keyed by the PR its run name carries
                  # (internal-review.yml run-name, issue #4618): the sweep
                  # dispatches from the default branch, so head_branch would
                  # name the default branch, not the PR. Only
                  # workflow_dispatch runs qualify, so a PR titled like the
                  # marker cannot claim another PR key. Git refs cannot
                  # contain ":", so a "pr:<N>" key never collides with a
                  # branch key. Everything else stays keyed by head branch.
                  def dispatch_pr:
                    if (.event // "") == "workflow_dispatch" then
                      ((.display_title // "")
                        | [match("^Internal: AI Review & Autofix \\[pr:([1-9][0-9]*)\\]$").captures[0].string]
                        | first // "")
                    else "" end;
                  def dedupe_key:
                    dispatch_pr as $pr
                    | if $pr != "" then "pr:\($pr)" else .head_branch end;
                  # A run needs a key to count. GitHub can report a null
                  # head_branch on a workflow_dispatch run (issue #4928), so a
                  # run named for its PR is kept by its pr:<N> key; dropping
                  # it let the next tick dispatch that PR again and replace
                  # the pending review. A run with neither key is dropped.
                  [
                    .[]
                    | .workflow_runs[]?
                    | select((.head_branch // "") != "" or dispatch_pr != "")
                  ]
                  # A run can transition between the sequential status fetches;
                  # retain its in_progress snapshot so it is never discounted.
                  | group_by(.id)
                  | map(max_by(if (.status // "") == "in_progress" then 1 else 0 end))
                  | {
                      active: (
                        reduce (.[] | select(is_stale_queued | not) | dedupe_key) as $head_ref ({};
                          .[$head_ref] = ((.[$head_ref] // 0) + 1)
                        )
                      ),
                      stale: (
                        reduce (.[] | select(is_stale_queued) | "\(dedupe_key)\t\(.id)\t\(created_epoch)") as $entry ([];
                          . + [$entry]
                        )
                      )
                    }
                ' 2>/dev/null
            )"; then
              :
            else
              snapshot_json='{}'
            fi

            while IFS=$'\t' read -r cached_head_ref cached_count; do
              [ -n "${cached_head_ref}" ] || continue
              active_review_runs["${workflow}:${cached_head_ref}"]="${cached_count}"
            done < <(printf '%s' "${snapshot_json}" | jq -r '(.active // {}) | to_entries[]? | [.key, (.value | tostring)] | @tsv' 2>/dev/null || true)

            while IFS=$'\t' read -r cached_head_ref stale_run_id stale_run_created_epoch; do
              [ -n "${cached_head_ref}" ] || continue
              queued_age_minutes="unknown"
              if [ "${stale_snapshot_epoch}" -gt 0 ] 2>/dev/null && [ "${stale_run_created_epoch}" -gt 0 ] 2>/dev/null; then
                queued_age_minutes="$(((stale_snapshot_epoch - stale_run_created_epoch) / 60))"
              fi
              echo "::warning::AUTOFIX_SWEEP_STALE_QUEUED workflow=${workflow} head_ref=${cached_head_ref} run_id=${stale_run_id} queued_age_minutes=${queued_age_minutes} queued_age_threshold_minutes=${SWEEP_STALE_QUEUED_MINUTES:-0} — treating as wedged and no longer suppressing dispatch."
            done < <(printf '%s' "${snapshot_json}" | jq -r '(.stale // [])[]?' 2>/dev/null || true)
          }

          for wf in internal-review.yml review_autofix.yml; do
            snapshot_active_review_runs "${wf}"
          done

          # Read into an array so counters survive the loop (no subshell pipe).
          mapfile -t rows < <(printf '%s' "${prs_json}" | jq -c '.[]')

          for row in "${rows[@]}"; do
            pr_number="$(printf '%s' "${row}" | jq -r '.number')"
            head_ref="$(printf '%s' "${row}" | jq -r '.head_ref')"
            pr_title="$(printf '%s' "${row}" | jq -r '.title')"
            pr_body="$(printf '%s' "${row}" | jq -r '.body')"

            # The PR number is the only PR data the dispatch carries
            # (issue #4618), so accept nothing but a positive integer.
            if ! [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::warning::AUTOFIX_SWEEP_SKIP pr=#${pr_number} reason=invalid_pr_number head_ref=${head_ref}"
              failures=$((failures + 1))
              continue
            fi

            if [ -n "${HEAD_REF_FILTER}" ] && ! printf '%s' "${head_ref}" | grep -qF "${HEAD_REF_FILTER}"; then
              skipped_filter=$((skipped_filter + 1))
              continue
            fi

            # Honour the existing `[skip ai]` opt-out marker (parity with
            # review_autofix.yml gate behaviour: the title, or a body line
            # holding only the marker; a quoted mention does not count). This
            # is the only PR-author escape hatch on the sweep path.
            if [[ "${pr_title}" == *"[skip ai]"* ]] \
              || printf '%s\n' "${pr_body}" | awk "${SKIP_AI_BODY_AWK}"; then
              echo "AUTOFIX_SWEEP_SKIP pr=#${pr_number} reason=skip_ai_marker head_ref=${head_ref}"
              skipped_skip_ai=$((skipped_skip_ai + 1))
              continue
            fi

            # Preflight (mirrors scripts/orchestrate_poll_process.sh:7792-7814).
            # Skip when a review run is already in_progress, queued, or pending
            # for this branch on either workflow, or a dispatched run is named
            # for this PR (the `pr:<N>` key, issue #4618). In-progress and
            # pending runs always suppress dispatch; only queued runs can age out.
            active=0
            for wf in internal-review.yml review_autofix.yml; do
              for dedupe_ref in "${head_ref}" "pr:${pr_number}"; do
                count="${active_review_runs["${wf}:${dedupe_ref}"]:-0}"
                if [ "${count:-0}" -gt 0 ]; then
                  echo "AUTOFIX_SWEEP_SKIP pr=#${pr_number} reason=active_run workflow=${wf} count=${count} head_ref=${head_ref}"
                  active=1
                  break 2
                fi
              done
            done
            if [ "${active}" -eq 1 ]; then
              skipped_active=$((skipped_active + 1))
              continue
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              echo "AUTOFIX_SWEEP_DRY_RUN pr=#${pr_number} head_ref=${head_ref}"
              continue
            fi

            # Dispatch internal-review.yml (not review_autofix.yml directly):
            # internal-review owns the concurrency-group / push-trigger /
            # claude-branch-review routing, and forwards to review_autofix.yml
            # under its existing gate. Forwarding the normalized
            # `ALLOW_WORKFLOW_EDITS` repo variable matches
            # `_dispatch_review_for_conflicts`
            # (orchestrate_poll_process.sh:7862-7868).
            # Always dispatch from the default branch (no --ref), so the run
            # executes the reviewed internal-review.yml, never a copy an
            # unmerged branch carries (issue #4618; the same-repo head-ref
            # dispatch this replaces let any pushable branch run its own
            # workflow code with the sweep's secrets). The run is still
            # visible to the active-run guards: internal-review.yml names it
            # `Internal: AI Review & Autofix [pr:<N>]`, which this sweep's
            # snapshot and the poller's _has_active_autofix_run match by PR,
            # so the PR #3895 duplicate-dispatch loop stays closed.
            dispatch_args=(--repo "${REPOSITORY}"
              -f "pr_number=${pr_number}"
              -f "allow_workflow_edits=${ALLOW_WORKFLOW_EDITS}")
            if gh workflow run internal-review.yml "${dispatch_args[@]}" >/dev/null 2>&1; then
              echo "AUTOFIX_SWEEP_DISPATCH pr=#${pr_number} head_ref=${head_ref}"
              dispatched=$((dispatched + 1))
            else
              echo "::warning::AUTOFIX_SWEEP_DISPATCH_FAILED pr=#${pr_number} head_ref=${head_ref}"
              failures=$((failures + 1))
            fi
          done

          echo "AUTOFIX_SWEEP_END dispatched=${dispatched} skipped_active=${skipped_active} skipped_filter=${skipped_filter} skipped_skip_ai=${skipped_skip_ai} failures=${failures} candidates=${total}"

      - name: Record GH_PAT budget at sweep end
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_PAT_BUDGET_FILE: ${{ runner.temp }}/gh_pat_budget_${{ github.run_id }}_${{ github.run_attempt }}_sweep
        run: |
          if [ -f scripts/gh_helpers.sh ]; then
            source scripts/gh_helpers.sh
            gh_pat_budget end review_autofix_sweep sweep "${GH_PAT_BUDGET_FILE}"
          else
            echo 'GH_PAT_BUDGET phase=end workflow=review_autofix_sweep job=sweep remaining=unknown reset=unknown used_in_job=unknown'
          fi

      # Use the 30-minute sweep rather than the hourly Claude catch-all: it
      # already snapshots every open non-draft PR, including non-Claude PRs.
      # The sweep itself needs no checkout. Fetch only the default-branch
      # helper: a PR head must never supply code for an Actions write.
      - name: Check out trusted CI recovery helper
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          path: .ci-rerun-support
          persist-credentials: false

      - name: Re-run cancelled CI failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CI_CANCELLED_AUTO_RERUN_ENABLED: ${{ vars.CI_CANCELLED_AUTO_RERUN_ENABLED || 'true' }}
          HEAD_REF_FILTER: ${{ inputs.head_ref_filter }}
          DRY_RUN: ${{ inputs.dry_run }}
          CI_CANCELLED_PR_SNAPSHOT: ${{ runner.temp }}/ci-cancelled-pr-snapshot.json
        run: PYTHONDONTWRITEBYTECODE=1 python3 .ci-rerun-support/scripts/ci_cancelled_rerun.py

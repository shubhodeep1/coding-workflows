name: Audit Consumer Drift

# Daily (was weekly): besides the alert, every drifted consumer gets one
# restore pull request (head auto/restore-managed-workflows, body marker
# coding-workflows:restore-managed-workflows:v1), opened or refreshed with
# GH_PAT. Repository variable CONSUMER_DRIFT_REPAIR_ENABLED=false keeps the
# audit and alert but opens no pull requests (default: unset, repair on).
# Every 6 hours since #9483: a drifted consumer whose first release newer than
# its pin was tagged CONSUMER_PIN_MAX_AGE_SECONDS (default 86400) ago or more
# raises the WARNING alert, even while an update pull request is open.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'WARNING' }}

permissions:
  contents: read

concurrency:
  group: audit-consumer-drift-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit-consumer-drift:
    if: github.repository == 'shubhodeep1/coding-workflows'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run consumer drift audit
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: '1'
          CONSUMER_DRIFT_REPAIR_ENABLED: ${{ vars.CONSUMER_DRIFT_REPAIR_ENABLED || 'true' }}
          CONSUMER_PIN_MAX_AGE_SECONDS: ${{ vars.CONSUMER_PIN_MAX_AGE_SECONDS || '86400' }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: secrets.GH_PAT is required for cross-repository consumer drift reads."
            exit 1
          fi

          RUNTIME_DIR="${RUNNER_TEMP}/audit-consumer-drift-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${RUNTIME_DIR}"
          SUMMARY_JSON="${RUNTIME_DIR}/summary.json"
          echo "summary_json=${SUMMARY_JSON}" >> "${GITHUB_OUTPUT}"

          # Resolve the moving release tag to its immutable commit. The audit
          # must flag stale consumer pins instead of normalizing SHAs away.
          git fetch --no-tags --depth=1 origin refs/tags/stable
          STABLE_SHA="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ ! "${STABLE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve refs/tags/stable to a 40-character commit SHA."
            exit 1
          fi

          # Compare against, and restore from, the released templates and
          # renderer rather than main's: main can be ahead of stable, and a
          # restore pull request must match what the consumer's integrity
          # check renders at the stable release.
          STABLE_TREE="${RUNTIME_DIR}/stable"
          mkdir -p "${STABLE_TREE}"
          git archive FETCH_HEAD workflow-templates scripts/workflow_wrapper_refs.py | tar -x -C "${STABLE_TREE}"

          # Release tag times for the pin-age alarm (#9483). Fetched after the
          # archive above, which reads FETCH_HEAD. Release tags are annotated,
          # so creatordate is the tagger date. A failed fetch leaves an empty
          # file: every behind consumer then fails closed (pin_unknown).
          RELEASE_TAGS_TSV="${RUNTIME_DIR}/release_tags.tsv"
          if git fetch --no-tags --depth=1 --filter=tree:0 origin '+refs/tags/v*:refs/tags/v*'; then
            git for-each-ref --format='%(refname:strip=2)%09%(objectname)%09%(*objectname)%09%(creatordate:unix)' 'refs/tags/v*' > "${RELEASE_TAGS_TSV}"
          else
            echo "::warning::Could not fetch release tags; consumers behind stable are flagged as pin_unknown."
            : > "${RELEASE_TAGS_TSV}"
          fi

          REPAIR_ARGS=()
          if [ "${CONSUMER_DRIFT_REPAIR_ENABLED,,}" != "false" ]; then
            REPAIR_ARGS=(--repair)
          else
            echo "DRIFT_REPAIR outcome=disabled reason=CONSUMER_DRIFT_REPAIR_ENABLED"
          fi

          python3 scripts/audit_consumer_drift.py \
            --consumer-repos .github/ai/consumer_repos.json \
            --templates-dir "${STABLE_TREE}/workflow-templates" \
            --renderer "${STABLE_TREE}/scripts/workflow_wrapper_refs.py" \
            --stable-sha "${STABLE_SHA,,}" \
            --output "${SUMMARY_JSON}" \
            --max-diff-lines 25 \
            --release-tags-file "${RELEASE_TAGS_TSV}" \
            --pin-max-age-seconds="${CONSUMER_PIN_MAX_AGE_SECONDS}" \
            "${REPAIR_ARGS[@]}"

      - name: Build report artifacts
        if: always()
        id: report
        env:
          SUMMARY_JSON: ${{ steps.audit.outputs.summary_json }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Same threshold the audit used; only names the report heading.
          CONSUMER_PIN_MAX_AGE_SECONDS: ${{ vars.CONSUMER_PIN_MAX_AGE_SECONDS || '86400' }}
        run: |
          set -euo pipefail
          REPORT_DIR="${RUNNER_TEMP}/audit-consumer-drift-report-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${REPORT_DIR}"
          SUMMARY_MD="${REPORT_DIR}/summary.md"
          TELEGRAM_BODY="${REPORT_DIR}/telegram.txt"
          TELEGRAM_LEVEL_FILE="${REPORT_DIR}/telegram-level.txt"

          python3 - "${SUMMARY_JSON}" "${SUMMARY_MD}" "${TELEGRAM_BODY}" "${TELEGRAM_LEVEL_FILE}" "${RUN_URL}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          summary_path = Path(sys.argv[1])
          summary_md_path = Path(sys.argv[2])
          telegram_body_path = Path(sys.argv[3])
          level_path = Path(sys.argv[4])
          run_url = sys.argv[5]

          def preview_line_count(text: str) -> int:
              return 0 if not text else len(text.splitlines())

          def append_capped(blocks: list[str], base_lines: list[str], *, max_chars: int = 3900) -> str:
              body = "\n".join(base_lines)
              if not blocks:
                  return body
              result = body
              for index, block in enumerate(blocks):
                  candidate = result + "\n" + block
                  if len(candidate) <= max_chars:
                      result = candidate
                      continue
                  remaining = len(blocks) - index
                  return result + f"\n- ... {remaining} more item(s); see workflow summary for full details."
              return result

          if not summary_path or not summary_path.is_file():
              summary_md_path.write_text(
                  "\n".join(
                      [
                          "## Consumer Drift Audit",
                          "",
                          "- Summary JSON was not produced.",
                          f"- Run: {run_url}",
                      ]
                  )
                  + "\n",
                  encoding="utf-8",
              )
              telegram_body_path.write_text(
                  "Consumer wrapper drift audit failed before producing summary JSON.\n"
                  f"Run: {run_url}\n",
                  encoding="utf-8",
              )
              level_path.write_text("ERROR\n", encoding="utf-8")
              raise SystemExit(0)

          try:
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              summary_md_path.write_text(
                  "\n".join(
                      [
                          "## Consumer Drift Audit",
                          "",
                          f"- Summary JSON parse failed: {exc}",
                          f"- Run: {run_url}",
                      ]
                  )
                  + "\n",
                  encoding="utf-8",
              )
              telegram_body_path.write_text(
                  "Consumer wrapper drift audit produced unreadable summary JSON.\n"
                  f"Reason: {exc}\n"
                  f"Run: {run_url}\n",
                  encoding="utf-8",
              )
              level_path.write_text("ERROR\n", encoding="utf-8")
              raise SystemExit(0)

          totals = summary.get("totals", {})
          results = summary.get("results", [])
          template_files = summary.get("template_files", [])
          drift_results = [item for item in results if item.get("outcome") == "drift"]
          error_results = [item for item in results if item.get("outcome") == "error"]
          repairs = summary.get("repairs", [])
          # An open sync pull request younger than the repair's stale limit
          # (3 days) already fixes a consumer's drift, so that drift needs no
          # one: it stays at DEBUG. A stale one (pr_stale true, or missing in an
          # older summary) is stuck and raises the alert.
          def covered_by_sync_pull_request(repair: dict) -> bool:
              return (
                  repair.get("outcome") == "skipped"
                  and repair.get("reason") == "sync_pull_request_open"
                  and repair.get("pr_stale") is False
              )

          covered_repairs = [repair for repair in repairs if covered_by_sync_pull_request(repair)]
          covered_repositories = {repair.get("repository") for repair in covered_repairs}
          alert_drift_results = [item for item in drift_results if item.get("repository") not in covered_repositories]
          # A repository the audit reports as "match" can still differ in exact
          # bytes (the integrity check compares bytes), so a restore pull request
          # or a failed repair for it must raise the level too.
          actionable_repairs = [
              repair for repair in repairs
              if not covered_by_sync_pull_request(repair)
              and not (repair.get("outcome") == "skipped" and repair.get("reason") == "no_exact_drift")
          ]
          # Pin-age alarm (#9483): a consumer behind stable for the threshold
          # or longer, or whose pin or tag time is unknown, raises the alert
          # even when an open update pull request covers its drift.
          pin_stale_results = [
              item for item in drift_results
              if isinstance(item.get("pin_age"), dict) and item["pin_age"].get("stale") is True
          ]
          level = "WARNING" if alert_drift_results or error_results or actionable_repairs or pin_stale_results else "DEBUG"

          def pin_age_note(result: dict) -> str:
              pin_age = result.get("pin_age") or {}
              pinned = pin_age.get("pinned_release") or "unknown pin"
              newer = pin_age.get("first_newer_release") or "unknown release"
              behind = pin_age.get("behind_seconds")
              if isinstance(behind, int) and pin_age.get("reason") == "behind_stable":
                  return f"pinned {pinned}, {newer} released {behind // 3600} hours ago"
              return f"pinned {pinned}, first newer {newer} ({pin_age.get('reason', 'unknown')})"

          def pin_threshold_label() -> str:
              # Mirrors parse_pin_max_age_seconds: bad values mean 86400.
              # Same int() parse, so "+3600" names 1 hour here as it does there.
              try:
                  seconds = int(os.environ.get("CONSUMER_PIN_MAX_AGE_SECONDS", "86400").strip())
              except ValueError:
                  seconds = 0
              if seconds <= 0:
                  seconds = 86400
              if seconds % 3600 == 0:
                  return f"{seconds // 3600} hours"
              return f"{seconds} seconds"

          # Only behind_stable was measured against the threshold; pin_unknown
          # and tag_time_unknown fail closed and are listed on their own.
          pin_measured_results = [item for item in pin_stale_results if item["pin_age"].get("reason") == "behind_stable"]
          pin_unknown_results = [item for item in pin_stale_results if item["pin_age"].get("reason") != "behind_stable"]

          def repair_pull_request_note(repair: dict) -> str:
              if repair.get("reason") != "sync_pull_request_open":
                  return ""
              if repair.get("pr_stale") is False:
                  return " update pull request open, fixes this drift when merged"
              if repair.get("pr_for_release") is False:
                  return " update pull request built for another release; close it or wait for one for the current release"
              opened = repair.get("pr_created_at") or "unknown date"
              return f" update pull request stuck, open since {opened}; merge or close it"

          lines = [
              "## Consumer Drift Audit",
              "",
              f"- Generated at: `{summary.get('generated_at', 'unknown')}`",
              f"- Processed repositories: {totals.get('processed', 0)}",
              f"- Matching repositories: {totals.get('match', 0)}",
              f"- Drifting repositories: {totals.get('drift', 0)}",
              f"- Error repositories: {totals.get('error', 0)}",
              f"- Drift items: {totals.get('drift_items', 0)}",
              f"- Templates checked per repo: {len(template_files)}",
              "",
              f"- Run: {run_url}",
          ]

          if drift_results:
              lines.extend(["", "### Drift detected"])
              for result in drift_results:
                  repo = result.get("repository", "unknown")
                  lines.extend(["", f"#### `{repo}`"])
                  for item in result.get("drift_items", []):
                      diff_preview = item.get("diff_preview", "")
                      lines.append(
                          f"- `{item.get('file', 'unknown')}` — "
                          f"{'missing' if item.get('missing') else 'content drift'} "
                          f"({preview_line_count(diff_preview)}/{item.get('diff_lines_total', 0)} diff lines shown)"
                      )
                      if diff_preview:
                          lines.extend(["", "```diff", diff_preview, "```"])

          if pin_measured_results:
              lines.extend(["", f"### Behind stable for {pin_threshold_label()} or more"])
              for result in pin_measured_results:
                  lines.append(f"- `{result.get('repository', 'unknown')}` — {pin_age_note(result)}")
          if pin_unknown_results:
              lines.extend(["", "### Behind stable, pin or release tag time unknown"])
              for result in pin_unknown_results:
                  lines.append(f"- `{result.get('repository', 'unknown')}` — {pin_age_note(result)}")

          if repairs:
              lines.extend(["", "### Restore pull requests"])
              for repair in repairs:
                  pr = f" #{repair.get('pr_number')}" if repair.get("pr_number") else ""
                  files = ", ".join(repair.get("files") or []) or "-"
                  lines.append(
                      f"- `{repair.get('repository', 'unknown')}` — {repair.get('outcome', 'unknown')}"
                      f" ({repair.get('reason', '')}){pr}: {files}{repair_pull_request_note(repair)}"
                  )

          if error_results:
              lines.extend(["", "### Repository fetch errors"])
              for result in error_results:
                  repo = result.get("repository", "unknown")
                  detail = result.get("error_detail") or result.get("error") or "unknown"
                  lines.append(f"- `{repo}` — `{result.get('error', 'error')}`: {detail}")

          summary_md_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          telegram_lines = []
          if level == "DEBUG" and covered_repairs:
              telegram_lines.extend(
                  [
                      "Consumer wrapper drift is covered by open update pull requests; nothing to do.",
                      (
                          f"Processed={totals.get('processed', 0)} "
                          f"Match={totals.get('match', 0)} Drift={totals.get('drift', 0)} Error={totals.get('error', 0)}"
                      ),
                      "Registry: .github/ai/consumer_repos.json",
                  ]
                  + [
                      f"- {repair.get('repository', 'unknown')}: update PR #{repair.get('pr_number')}"
                      for repair in covered_repairs
                  ]
                  + [f"Run: {run_url}"]
              )
              telegram_body = "\n".join(telegram_lines)
          elif level == "DEBUG":
              telegram_lines.extend(
                  [
                      "All consumer wrappers match the checked-out workflow templates.",
                      (
                          f"Processed={totals.get('processed', 0)} "
                          f"Match={totals.get('match', 0)} Drift={totals.get('drift', 0)} Error={totals.get('error', 0)}"
                      ),
                      "Registry: .github/ai/consumer_repos.json",
                      f"Run: {run_url}",
                  ]
              )
              telegram_body = "\n".join(telegram_lines)
          else:
              telegram_lines.extend(
                  [
                      "Consumer wrapper drift audit detected drift, repository fetch errors or restore pull request activity.",
                      (
                          f"Processed={totals.get('processed', 0)} "
                          f"Match={totals.get('match', 0)} Drift={totals.get('drift', 0)} "
                          f"Error={totals.get('error', 0)} DriftItems={totals.get('drift_items', 0)}"
                      ),
                      "Registry: .github/ai/consumer_repos.json",
                  ]
              )
              blocks = []
              for result in pin_measured_results:
                  blocks.append(f"- behind stable: {result.get('repository', 'unknown')} — {pin_age_note(result)}")
              for result in pin_unknown_results:
                  blocks.append(f"- pin age unknown: {result.get('repository', 'unknown')} — {pin_age_note(result)}")
              # Drift an open, fresh update pull request covers is left out:
              # its repair line below says it is handled.
              for result in alert_drift_results:
                  repo = result.get("repository", "unknown")
                  for item in result.get("drift_items", []):
                      block_lines = [
                          f"- {repo} / {item.get('file', 'unknown')} "
                          f"({'missing' if item.get('missing') else 'drift'}, diff lines {item.get('diff_lines_total', 0)})"
                      ]
                      diff_preview = item.get("diff_preview", "")
                      if diff_preview:
                          block_lines.extend([f"  {line}" for line in diff_preview.splitlines()])
                      blocks.append("\n".join(block_lines))
              for result in error_results:
                  repo = result.get("repository", "unknown")
                  detail = result.get("error_detail") or result.get("error") or "unknown"
                  blocks.append(f"- {repo}: {result.get('error', 'error')} ({detail})")
              for repair in repairs:
                  pr = f" PR #{repair.get('pr_number')}" if repair.get("pr_number") else ""
                  blocks.append(f"- restore {repair.get('repository', 'unknown')}: {repair.get('outcome', 'unknown')} ({repair.get('reason', '')}){pr}{repair_pull_request_note(repair)}")
              telegram_body = append_capped(blocks, telegram_lines + [f"Run: {run_url}"])

          telegram_body_path.write_text(telegram_body + "\n", encoding="utf-8")
          level_path.write_text(level + "\n", encoding="utf-8")
          PY

          echo "summary_md=${SUMMARY_MD}" >> "${GITHUB_OUTPUT}"
          echo "telegram_body=${TELEGRAM_BODY}" >> "${GITHUB_OUTPUT}"
          echo "telegram_level=$(tr -d '\n' < "${TELEGRAM_LEVEL_FILE}")" >> "${GITHUB_OUTPUT}"

      - name: Append step summary
        if: always()
        env:
          SUMMARY_MD: ${{ steps.report.outputs.summary_md }}
        run: |
          set -euo pipefail
          if [ -n "${SUMMARY_MD:-}" ] && [ -f "${SUMMARY_MD}" ]; then
            cat "${SUMMARY_MD}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No consumer drift summary was produced." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Telegram alert
        if: always()
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          TELEGRAM_BODY_FILE: ${{ steps.report.outputs.telegram_body }}
          TELEGRAM_LEVEL: ${{ steps.report.outputs.telegram_level }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BODY_FILE:-}" ] || [ ! -f "${TELEGRAM_BODY_FILE}" ]; then
            echo "Telegram alert skipped (no rendered message body)."
            exit 0
          fi

          # shellcheck source=scripts/tg_helpers.sh
          source scripts/tg_helpers.sh
          telegram_body="$(cat "${TELEGRAM_BODY_FILE}")"
          if [ -z "${telegram_body}" ]; then
            echo "Telegram alert skipped (empty rendered message body)."
            exit 0
          fi

          tg_send_msg "${telegram_body}" "${TELEGRAM_LEVEL:-ERROR}" >/dev/null || true

name: "Internal: AI Validate"

on:
  workflow_dispatch:
    inputs:
      tracking_issue:
        description: "Tracking issue number (0 for standalone validation run)"
        required: false
        type: string
        default: "0"
      compose_file:
        description: "Fallback compose file path"
        required: false
        type: string
        default: "docker-compose.yml"
      validation_timeout:
        description: "Validation timeout in minutes"
        required: false
        type: string
        default: "15"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      tracking_issue: ${{ inputs.tracking_issue || '0' }}
      compose_file: ${{ inputs.compose_file || 'docker-compose.yml' }}
      validation_timeout: ${{ inputs.validation_timeout || '15' }}
    secrets: inherit

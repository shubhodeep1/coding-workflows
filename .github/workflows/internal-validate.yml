name: "Internal: AI Validate"

on:
  workflow_dispatch:
    inputs:
      tracking_issue:
        description: Tracking issue number
        required: false
        type: string
        default: "0"
      pr_number:
        description: Review PR number for restoring cached behavioural smoke artifacts
        required: false
        type: string
        default: "0"
      compose_file:
        description: Compose file path fallback
        required: false
        type: string
        default: "docker-compose.yml"
      validation_timeout:
        description: Validation idle timeout in minutes (killed after this long with no output)
        required: false
        type: string
        default: "15"
      alert_msg_level:
        description: Minimum Telegram alert level for this run (empty honours vars.ALERT_MSG_LEVEL; SILENT suppresses all)
        required: false
        type: string
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: shubhodeep1/coding-workflows/.github/workflows/validate.yml@main
    with:
      tracking_issue: ${{ inputs.tracking_issue || '0' }}
      pr_number: ${{ inputs.pr_number || '0' }}
      compose_file: ${{ inputs.compose_file || 'docker-compose.yml' }}
      validation_timeout: ${{ inputs.validation_timeout || '15' }}
      alert_msg_level: ${{ inputs.alert_msg_level || '' }}
    secrets: inherit

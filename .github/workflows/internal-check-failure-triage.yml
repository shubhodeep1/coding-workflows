name: "Internal: AI Check Failure Triage"

on:
  check_run:
    types: [completed]
  # Actions CI (see the triage-workflow-run job).
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read
  # Claude engine: the job's OIDC token for claude-pool-broker (plan Phase 4).
  id-token: write

jobs:
  triage:
    if: >-
      github.event_name == 'check_run' &&
      !contains(fromJson('["false"]'), vars.CHECK_FAILURE_TRIAGE_ENABLED) &&
      (github.event.check_run.conclusion == 'failure' ||
       github.event.check_run.conclusion == 'timed_out') &&
      github.event.check_run.pull_requests[0] != null &&
      !contains(github.event.check_run.name, 'Check Failure Triage')
    uses: shubhodeep1/coding-workflows/.github/workflows/check_failure_triage.yml@promote-candidate
    with:
      pr_number: ${{ github.event.check_run.pull_requests[0].number }}
      check_run_id: ${{ github.event.check_run.id }}
      check_name: ${{ github.event.check_run.name }}
      check_conclusion: ${{ github.event.check_run.conclusion }}
      head_sha: ${{ github.event.check_run.head_sha }}
      details_url: ${{ github.event.check_run.details_url }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      CHECK_TRIAGE_ISSUES_TOKEN: ${{ secrets.CHECK_TRIAGE_ISSUES_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}

  # GitHub never sends check_run events for checks created by GitHub Actions
  # ("to prevent recursive workflows"), so the job above never fires for
  # Actions CI. This job evaluates failed `CI` runs instead; the check name
  # is the workflow name, so repeated failures share one open issue per PR
  # and workflow. The diagnosis reads every failing check on the PR head.
  triage-workflow-run:
    if: >-
      github.event_name == 'workflow_run' &&
      !contains(fromJson('["false"]'), vars.CHECK_FAILURE_TRIAGE_ENABLED) &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    uses: shubhodeep1/coding-workflows/.github/workflows/check_failure_triage.yml@promote-candidate
    with:
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      check_run_id: ""
      check_name: ${{ github.event.workflow_run.name }}
      check_conclusion: ${{ github.event.workflow_run.conclusion }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      details_url: ${{ github.event.workflow_run.html_url }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      CHECK_TRIAGE_ISSUES_TOKEN: ${{ secrets.CHECK_TRIAGE_ISSUES_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}

  # Final-CI runs (cut-ci-runner-time Phase 4) are workflow_dispatch runs
  # named `CI [pr:<n>]`; GitHub leaves their pull_requests list empty, so the
  # job above never sees them. This job reads the PR number from the run
  # name and keeps it only while that PR's head is still the head the run
  # tested (one PR read), then hands it to the same triage.
  resolve-final-ci-pr:
    if: >-
      github.event_name == 'workflow_run' &&
      !contains(fromJson('["false"]'), vars.CHECK_FAILURE_TRIAGE_ENABLED) &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      startsWith(github.event.workflow_run.display_title, 'CI [pr:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Resolve the final-CI run's pull request
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr_number=""
          if [[ "${RUN_TITLE}" =~ ^CI\ \[pr:([1-9][0-9]*)\]$ ]]; then
            pr_number="${BASH_REMATCH[1]}"
          fi
          if [ -z "${pr_number}" ]; then
            echo "FINAL_CI_TRIAGE outcome=skip reason=no_pr_in_run_name"
            exit 0
          fi
          pr_head="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}" --jq 'if .state == "open" then .head.sha else "" end' 2>/dev/null || true)"
          if [ -z "${pr_head}" ] || [ "${pr_head}" != "${RUN_HEAD_SHA}" ]; then
            echo "FINAL_CI_TRIAGE pr=${pr_number} outcome=skip reason=head_moved_or_closed"
            exit 0
          fi
          echo "FINAL_CI_TRIAGE pr=${pr_number} outcome=resolved"
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"

  triage-final-ci-run:
    needs: resolve-final-ci-pr
    if: needs.resolve-final-ci-pr.outputs.pr_number != ''
    uses: shubhodeep1/coding-workflows/.github/workflows/check_failure_triage.yml@promote-candidate
    with:
      pr_number: ${{ needs.resolve-final-ci-pr.outputs.pr_number }}
      check_run_id: ""
      check_name: ${{ github.event.workflow_run.name }}
      check_conclusion: ${{ github.event.workflow_run.conclusion }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      details_url: ${{ github.event.workflow_run.html_url }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      CHECK_TRIAGE_ISSUES_TOKEN: ${{ secrets.CHECK_TRIAGE_ISSUES_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}

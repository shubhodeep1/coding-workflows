name: "Internal: AI Check Failure Triage"

on:
  check_run:
    types: [completed]
  # Actions CI (see the triage-workflow-run job).
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read
  # Claude engine: the job's OIDC token for claude-pool-broker (plan Phase 4).
  id-token: write

jobs:
  triage:
    if: >-
      github.event_name == 'check_run' &&
      !contains(fromJson('["false"]'), vars.CHECK_FAILURE_TRIAGE_ENABLED) &&
      (github.event.check_run.conclusion == 'failure' ||
       github.event.check_run.conclusion == 'timed_out') &&
      github.event.check_run.pull_requests[0] != null &&
      !contains(github.event.check_run.name, 'Check Failure Triage')
    uses: shubhodeep1/coding-workflows/.github/workflows/check_failure_triage.yml@main
    with:
      pr_number: ${{ github.event.check_run.pull_requests[0].number }}
      check_run_id: ${{ github.event.check_run.id }}
      check_name: ${{ github.event.check_run.name }}
      check_conclusion: ${{ github.event.check_run.conclusion }}
      head_sha: ${{ github.event.check_run.head_sha }}
      details_url: ${{ github.event.check_run.details_url }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      CHECK_TRIAGE_ISSUES_TOKEN: ${{ secrets.CHECK_TRIAGE_ISSUES_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}

  # GitHub never sends check_run events for checks created by GitHub Actions
  # ("to prevent recursive workflows"), so the job above never fires for
  # Actions CI. This job evaluates failed `CI` runs instead; the check name
  # is the workflow name, so repeated failures share one open issue per PR
  # and workflow. The diagnosis reads every failing check on the PR head.
  triage-workflow-run:
    if: >-
      github.event_name == 'workflow_run' &&
      !contains(fromJson('["false"]'), vars.CHECK_FAILURE_TRIAGE_ENABLED) &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    uses: shubhodeep1/coding-workflows/.github/workflows/check_failure_triage.yml@main
    with:
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      check_run_id: ""
      check_name: ${{ github.event.workflow_run.name }}
      check_conclusion: ${{ github.event.workflow_run.conclusion }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      details_url: ${{ github.event.workflow_run.html_url }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      CHECK_TRIAGE_ISSUES_TOKEN: ${{ secrets.CHECK_TRIAGE_ISSUES_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}

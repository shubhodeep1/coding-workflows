name: AI Memory Maintenance (Reusable)

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true

jobs:
  memory_maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run memory compaction
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          # Calculate the previous month for archival
          ARCHIVE_MONTH="$(date -d 'last month' '+%Y-%m' 2>/dev/null || date -v-1m '+%Y-%m')"

          echo "Running memory compaction for month: ${ARCHIVE_MONTH}"

          python3 scripts/ai_memory.py compact \
            --month "${ARCHIVE_MONTH}" \
            --prune true

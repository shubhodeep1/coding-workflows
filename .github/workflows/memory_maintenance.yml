name: AI Memory Maintenance (Reusable)

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true

jobs:
  memory_maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run memory compaction
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          MEMORY_ROOT=".github/ai-memory"

          # Calculate the previous month for archival
          ARCHIVE_MONTH="$(date -d 'last month' '+%Y-%m' 2>/dev/null || date -v-1m '+%Y-%m')"

          echo "Running memory compaction for month: ${ARCHIVE_MONTH}"

          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from ai_memory_lib import compact_memory
          from pathlib import Path

          memory_root = Path('${MEMORY_ROOT}')
          result = compact_memory(
              memory_root,
              month_yyyy_mm='${ARCHIVE_MONTH}',
              prune=True,
          )
          print(f'Compaction result: {result}')
          "

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No memory changes to commit."
            exit 0
          fi

          git config user.name "codex-bot"
          git config user.email "codex@users.noreply.github.com"
          git add .github/ai-memory/
          git commit -m "[ai-memory] monthly maintenance compaction"
          git push origin HEAD

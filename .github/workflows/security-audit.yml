name: Security Audit

"on":
  schedule:
    # GitHub Actions schedules are literal YAML, not repo-variable driven.
    # Keep README's SECURITY_AUDIT_CRON row aligned with this value.
    - cron: "0 8 * * 0"
  # `ref` is set by /implement-plan-claude when it audits a project branch;
  # scheduled runs and a bare dispatch leave it empty and audit the default
  # branch exactly as before.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to audit instead of the default branch (empty = default branch). Scope is the branch's changes since its merge-base with the default branch; follow-up issues target the branch."
        required: false
        default: ""
        type: string
  # Consumer repos run this workflow through the synced
  # workflow-templates/ai-security-audit.yml wrapper (called @stable).
  workflow_call:
    inputs:
      ref:
        required: false
        default: ""
        type: string
    secrets:
      GH_PAT:
        required: false
      OPENROUTER_API_KEY:
        required: true

permissions:
  contents: read
  issues: write

env:
  MODEL_PROVIDER_PROXY_MAX_REQUESTS: ${{ vars.MODEL_PROVIDER_PROXY_MAX_REQUESTS || '64' }}
  MODEL_PROVIDER_PROXY_MAX_CONCURRENCY: ${{ vars.MODEL_PROVIDER_PROXY_MAX_CONCURRENCY || '1' }}
  MODEL_PROVIDER_PROXY_MAX_OUTPUT_TOKENS: ${{ vars.MODEL_PROVIDER_PROXY_MAX_OUTPUT_TOKENS || '65536' }}
  MODEL_PROVIDER_PROXY_MAX_SPEND_USD: ${{ vars.MODEL_PROVIDER_PROXY_MAX_SPEND_USD || '25' }}

# The consumer wrapper (workflow-templates/ai-security-audit.yml) already
# serialises runs under `security-audit-<repo>`. A called workflow that
# declares the SAME group as its caller deadlocks: the caller holds the
# group while this workflow waits for it, and GitHub cancels the run at
# startup with zero jobs ("Canceling since a deadlock was detected for
# concurrency group ... between a top level workflow and 'security-audit'").
# Keep a distinct group so this repo's own scheduled runs stay serialised
# without contending with a wrapper's group.
concurrency:
  group: security-audit-reusable-${{ github.repository }}
  cancel-in-progress: false

jobs:
  security-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          # Full history: the incremental scope resolver in
          # scripts/security_audit.sh diffs HEAD against the last audited
          # commit recorded on the tracker issue body.
          fetch-depth: 0
          ref: ${{ inputs.ref || github.event.repository.default_branch }}

      - name: Resolve audit target
        env:
          AUDIT_TARGET_REF_INPUT: ${{ inputs.ref || '' }}
          AUDIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "${AUDIT_TARGET_REF_INPUT}" ] || [ "${AUDIT_TARGET_REF_INPUT}" = "${AUDIT_DEFAULT_BRANCH}" ]; then
            echo "SECURITY_AUDIT_TARGET: default branch ${AUDIT_DEFAULT_BRANCH}"
            exit 0
          fi
          # fetch-depth: 0 above fetched every branch, so the default
          # branch's remote-tracking ref is available for the merge-base.
          if ! audit_diff_base="$(git merge-base "refs/remotes/origin/${AUDIT_DEFAULT_BRANCH}" HEAD)"; then
            echo "::error::Could not compute the merge-base of ${AUDIT_TARGET_REF_INPUT} with ${AUDIT_DEFAULT_BRANCH}."
            exit 1
          fi
          audit_diff_head="$(git rev-parse HEAD)"
          echo "SECURITY_AUDIT_TARGET: branch ${AUDIT_TARGET_REF_INPUT} range ${audit_diff_base}..${audit_diff_head}"
          {
            echo "SECURITY_AUDIT_TARGET_REF=${AUDIT_TARGET_REF_INPUT}"
            echo "SECURITY_AUDIT_DIFF_BASE=${audit_diff_base}"
            echo "SECURITY_AUDIT_DIFF_HEAD=${audit_diff_head}"
          } >> "$GITHUB_ENV"

      - name: Resolve workflow support ref
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            echo "SCRIPT_REF=${{ github.sha }}" >> "$GITHUB_ENV"
            echo "SECURITY_AUDIT_IS_SOURCE_REPO=true" >> "$GITHUB_ENV"
          else
            echo "SCRIPT_REF=stable" >> "$GITHUB_ENV"
            echo "SECURITY_AUDIT_IS_SOURCE_REPO=false" >> "$GITHUB_ENV"
          fi

      - name: Checkout workflow support source
        if: env.SECURITY_AUDIT_IS_SOURCE_REPO != 'true'
        id: checkout_support_source
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ env.SCRIPT_REF }}
          token: ${{ secrets.GH_PAT || github.token }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Checkout workflow support source fallback
        if: env.SECURITY_AUDIT_IS_SOURCE_REPO != 'true' && steps.checkout_support_source.outcome == 'failure'
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT || github.token }}
          path: .codex-workflow-src
          fetch-depth: 1

      - name: Stage audit support files
        if: env.SECURITY_AUDIT_IS_SOURCE_REPO != 'true'
        run: |
          set -euo pipefail
          if [ ! -d .codex-workflow-src ]; then
            echo "::error::Failed to checkout workflow support source from ${SCRIPT_REF} or main"
            exit 1
          fi
          SUPPORT_DIR="${RUNNER_TEMP}/security-audit-support"
          mkdir -p "${SUPPORT_DIR}"
          cp -r .codex-workflow-src/scripts "${SUPPORT_DIR}/scripts"
          cp -r .codex-workflow-src/prompts "${SUPPORT_DIR}/prompts"
          # Remove the support checkout so the audited tree stays exactly the
          # consumer repository — the read-only Codex pass must never cite
          # workflow-source files as consumer findings.
          rm -rf .codex-workflow-src
          echo "SECURITY_AUDIT_SUPPORT_DIR=${SUPPORT_DIR}" >> "$GITHUB_ENV"

      - name: Install Codex CLI (source repo)
        if: env.SECURITY_AUDIT_IS_SOURCE_REPO == 'true'
        uses: ./.github/actions/install-codex

      - name: Install Codex CLI (consumer repos)
        if: env.SECURITY_AUDIT_IS_SOURCE_REPO != 'true'
        uses: shubhodeep1/coding-workflows/.github/actions/install-codex@stable

      - name: Create Codex config
        run: |
          set -euo pipefail
          # The catalog path MUST be absolute: codex resolves a relative
          # model_catalog_json against CODEX_HOME (~/.codex) and exits with
          # "No such file or directory (os error 2)". In the source repo
          # SECURITY_AUDIT_SUPPORT_DIR is unset, so fall back to the
          # workspace root rather than ".".
          bash "${SECURITY_AUDIT_SUPPORT_DIR:-.}/scripts/write_codex_config.sh" \
            --model "openai/gpt-6-sol" \
            --reasoning xhigh \
            --catalog-path "${SECURITY_AUDIT_SUPPORT_DIR:-${GITHUB_WORKSPACE}}/scripts/codex_model_catalog.json"
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

      - name: Run security audit
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
          SECURITY_AUDIT_ENABLED: ${{ vars.SECURITY_AUDIT_ENABLED || 'true' }}
          SECURITY_AUDIT_CONFIDENCE_GATE: ${{ vars.SECURITY_AUDIT_CONFIDENCE_GATE || '8' }}
          SECURITY_AUDIT_FP_EXCLUSIONS: ${{ vars.SECURITY_AUDIT_FP_EXCLUSIONS || 'scripts/security_audit_fp_exclusions.json' }}
          SECURITY_AUDIT_SKIP_IF_UNCHANGED: ${{ vars.SECURITY_AUDIT_SKIP_IF_UNCHANGED || 'true' }}
          SECURITY_AUDIT_INCREMENTAL: ${{ vars.SECURITY_AUDIT_INCREMENTAL || 'true' }}
        run: |
          set -euo pipefail
          bash "${SECURITY_AUDIT_SUPPORT_DIR:-.}/scripts/security_audit.sh"

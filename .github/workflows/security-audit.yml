name: Security Audit

"on":
  schedule:
    # GitHub Actions schedules are literal YAML, not repo-variable driven.
    # Keep README's SECURITY_AUDIT_CRON row aligned with this value.
    - cron: "0 8 * * 0"
  workflow_dispatch: {}
  # Consumer repos run this workflow through the synced
  # workflow-templates/ai-security-audit.yml wrapper (called @stable).
  workflow_call:
    secrets:
      GH_PAT:
        required: false
      OPENROUTER_API_KEY:
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: security-audit-${{ github.repository }}
  cancel-in-progress: false

jobs:
  security-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          # Full history: the incremental scope resolver in
          # scripts/security_audit.sh diffs HEAD against the last audited
          # commit recorded on the tracker issue body.
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

          persist-credentials: false
      - name: Resolve workflow support ref
        env:
          WORKFLOW_DEFINITION_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_DEFINITION_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          if [ "${WORKFLOW_DEFINITION_REPOSITORY}" != "${wf_source}" ]; then
            echo "::error::Reusable workflow repository '${WORKFLOW_DEFINITION_REPOSITORY}' does not match expected source '${wf_source}'."
            exit 1
          fi
          if ! [[ "${WORKFLOW_DEFINITION_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::job.workflow_sha is not an immutable 40-character commit SHA."
            exit 1
          fi
          echo "SCRIPT_REF=${WORKFLOW_DEFINITION_SHA,,}" >> "$GITHUB_ENV"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            echo "SECURITY_AUDIT_IS_SOURCE_REPO=true" >> "$GITHUB_ENV"
          else
            echo "SECURITY_AUDIT_IS_SOURCE_REPO=false" >> "$GITHUB_ENV"
          fi

      - name: Checkout workflow support source
        if: env.SECURITY_AUDIT_IS_SOURCE_REPO != 'true'
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ env.SCRIPT_REF }}
          token: ${{ secrets.GH_PAT || github.token }}
          path: .codex-workflow-src
          fetch-depth: 1
          persist-credentials: false
      - name: Stage audit support files
        if: env.SECURITY_AUDIT_IS_SOURCE_REPO != 'true'
        run: |
          set -euo pipefail
          if [ ! -d .codex-workflow-src ]; then
            echo "::error::Failed to checkout immutable workflow support source at ${SCRIPT_REF}"
            exit 1
          fi
          SUPPORT_DIR="${RUNNER_TEMP}/security-audit-support"
          mkdir -p "${SUPPORT_DIR}"
          cp -r .codex-workflow-src/scripts "${SUPPORT_DIR}/scripts"
          cp -r .codex-workflow-src/prompts "${SUPPORT_DIR}/prompts"
          # Remove the support checkout so the audited tree stays exactly the
          # consumer repository — the read-only Codex pass must never cite
          # workflow-source files as consumer findings.
          rm -rf .codex-workflow-src
          echo "SECURITY_AUDIT_SUPPORT_DIR=${SUPPORT_DIR}" >> "$GITHUB_ENV"

      - name: Install Codex CLI (source repo)
        if: env.SECURITY_AUDIT_IS_SOURCE_REPO == 'true'
        uses: ./.github/actions/install-codex

      - name: Install Codex CLI (consumer repos)
        if: env.SECURITY_AUDIT_IS_SOURCE_REPO != 'true'
        uses: shubhodeep1/coding-workflows/.github/actions/install-codex@f03b8d657a63d64b87324e8a1047a8b90d3221e0

      - name: Create Codex config
        run: |
          set -euo pipefail
          bash "${SECURITY_AUDIT_SUPPORT_DIR:-.}/scripts/write_codex_config.sh" \
            --model "openai/gpt-5.6-sol" \
            --reasoning xhigh \
            --catalog-path "${SECURITY_AUDIT_SUPPORT_DIR:-.}/scripts/codex_model_catalog.json"
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

      - name: Run security audit
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
          SECURITY_AUDIT_ENABLED: ${{ vars.SECURITY_AUDIT_ENABLED || 'true' }}
          SECURITY_AUDIT_CONFIDENCE_GATE: ${{ vars.SECURITY_AUDIT_CONFIDENCE_GATE || '8' }}
          SECURITY_AUDIT_FP_EXCLUSIONS: ${{ vars.SECURITY_AUDIT_FP_EXCLUSIONS || 'scripts/security_audit_fp_exclusions.json' }}
          SECURITY_AUDIT_SKIP_IF_UNCHANGED: ${{ vars.SECURITY_AUDIT_SKIP_IF_UNCHANGED || 'true' }}
          SECURITY_AUDIT_INCREMENTAL: ${{ vars.SECURITY_AUDIT_INCREMENTAL || 'true' }}
        run: |
          set -euo pipefail
          bash "${SECURITY_AUDIT_SUPPORT_DIR:-.}/scripts/security_audit.sh"

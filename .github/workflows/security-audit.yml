name: Security Audit

"on":
  schedule:
    # GitHub Actions schedules are literal YAML, not repo-variable driven.
    # Keep README's SECURITY_AUDIT_CRON row aligned with this value.
    - cron: "0 8 * * 0"
  # `ref` is set by /implement-plan-claude when it audits a project branch;
  # scheduled runs and a bare dispatch leave it empty and audit the default
  # branch exactly as before.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to audit instead of the default branch (empty = default branch). Scope is the branch's changes since its merge-base with the default branch; follow-up issues target the branch."
        required: false
        default: ""
        type: string
  # Consumer repos run this workflow through the synced
  # workflow-templates/ai-security-audit.yml wrapper (called @stable).
  workflow_call:
    inputs:
      ref:
        required: false
        default: ""
        type: string
    secrets:
      GH_PAT:
        required: false
      OPENROUTER_API_KEY:
        required: true

permissions:
  contents: read
  issues: write

env:
  SECURITY_AUDIT_SUPPORT_SHA: ""
  PYTHONSAFEPATH: '1'
  MODEL_PROVIDER_PROXY_MAX_REQUESTS: ${{ vars.MODEL_PROVIDER_PROXY_MAX_REQUESTS || '64' }}
  MODEL_PROVIDER_PROXY_MAX_CONCURRENCY: ${{ vars.MODEL_PROVIDER_PROXY_MAX_CONCURRENCY || '1' }}
  MODEL_PROVIDER_PROXY_MAX_OUTPUT_TOKENS: ${{ vars.MODEL_PROVIDER_PROXY_MAX_OUTPUT_TOKENS || '65536' }}
  MODEL_PROVIDER_PROXY_MAX_SPEND_USD: ${{ vars.MODEL_PROVIDER_PROXY_MAX_SPEND_USD || '25' }}

# The consumer wrapper (workflow-templates/ai-security-audit.yml) already
# serialises runs under `security-audit-<repo>`. A called workflow that
# declares the SAME group as its caller deadlocks: the caller holds the
# group while this workflow waits for it, and GitHub cancels the run at
# startup with zero jobs ("Canceling since a deadlock was detected for
# concurrency group ... between a top level workflow and 'security-audit'").
# Keep a distinct group so this repo's own scheduled runs stay serialised
# without contending with a wrapper's group.
concurrency:
  group: security-audit-reusable-${{ github.repository }}
  cancel-in-progress: false

jobs:
  security-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Resolve trusted audit support commit
        id: resolve_support
        env:
          WORKFLOW_JOB_JSON: ${{ toJSON(job) }}
          CALLER_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          support_workflow_repository="$(jq -r '.workflow_repository // ""' <<< "${WORKFLOW_JOB_JSON}")"
          support_workflow_ref="$(jq -r '.workflow_ref // ""' <<< "${WORKFLOW_JOB_JSON}")"
          source_ref='^shubhodeep1/coding-workflows/\.github/workflows/security-audit\.yml@refs/heads/[^[:space:]]+$'
          stable_ref='^shubhodeep1/coding-workflows/\.github/workflows/security-audit\.yml@refs/tags/stable$'
          consumer_pin='^shubhodeep1/coding-workflows/\.github/workflows/security-audit\.yml@[0-9a-f]{40}$'
          if [ "${support_workflow_repository}" != "shubhodeep1/coding-workflows" ] ||
             { [ "${CALLER_REPOSITORY}" = "shubhodeep1/coding-workflows" ] && [[ ! "${support_workflow_ref}" =~ ${source_ref} ]]; } ||
             { [ "${CALLER_REPOSITORY}" != "shubhodeep1/coding-workflows" ] &&
               [[ ! "${support_workflow_ref}" =~ ${stable_ref} ]] && [[ ! "${support_workflow_ref}" =~ ${consumer_pin} ]]; }; then
            echo "::error::Security audit support workflow identity is unapproved."
            exit 1
          fi
          if [ "${CALLER_REPOSITORY}" = "shubhodeep1/coding-workflows" ]; then
            # The event/workflow SHA can follow a dispatched source branch.
            # No earlier step has read the protected main branch in this job.
            if ! support_main_json="$(gh api repos/shubhodeep1/coding-workflows/branches/main)" ||
               ! jq -e '.protected == true' <<< "${support_main_json}" >/dev/null; then
              echo "::error::Security audit support main branch is not confirmed protected."
              exit 1
            fi
            support_sha="$(jq -r '.commit.sha // ""' <<< "${support_main_json}")"
          elif [[ "${support_workflow_ref}" =~ ${consumer_pin} ]]; then
            support_sha="${support_workflow_ref##*@}"
          else
            # No existing lookup in this job resolves the release tag. A
            # commits/stable read is ambiguous when a branch shares its name.
            if ! support_tag_json="$(gh api repos/shubhodeep1/coding-workflows/git/ref/tags/stable)"; then
              echo "::error::Security audit support stable tag is unavailable."
              exit 1
            fi
            support_tag_type="$(jq -r '.object.type // ""' <<< "${support_tag_json}")"
            support_sha="$(jq -r '.object.sha // ""' <<< "${support_tag_json}")"
            for _depth in 1 2 3; do
              [ "${support_tag_type}" = "tag" ] || break
              [[ "${support_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
              if ! support_tag_json="$(gh api "repos/shubhodeep1/coding-workflows/git/tags/${support_sha}")"; then
                echo "::error::Security audit support annotated tag is unavailable."
                exit 1
              fi
              support_tag_type="$(jq -r '.object.type // ""' <<< "${support_tag_json}")"
              support_sha="$(jq -r '.object.sha // ""' <<< "${support_tag_json}")"
            done
            if [ "${support_tag_type}" != "commit" ]; then
              echo "::error::Security audit support stable tag is not a commit."
              exit 1
            fi
          fi
          if [[ ! "${support_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Security audit support did not resolve to a commit SHA."
            exit 1
          fi
          echo "support_sha=${support_sha}" >> "$GITHUB_OUTPUT"
          if [ "${CALLER_REPOSITORY}" = "shubhodeep1/coding-workflows" ]; then
            echo "protected_main_sha=${support_sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted audit support
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ steps.resolve_support.outputs.support_sha }}
          token: ${{ secrets.GH_PAT || github.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify trusted audit support
        env:
          SUPPORT_SHA: ${{ steps.resolve_support.outputs.support_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${SUPPORT_SHA}" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$(git rev-parse HEAD 2>/dev/null)" != "${SUPPORT_SHA}" ] ||
             [ "$(git rev-parse --show-toplevel 2>/dev/null)" != "${GITHUB_WORKSPACE}" ]; then
            echo "::error::Security audit support checkout is not the approved commit."
            exit 1
          fi

      - name: Resolve audit target
        env:
          AUDIT_TARGET_REF_INPUT: ${{ inputs.ref || '' }}
          AUDIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROTECTED_MAIN_SHA: ${{ steps.resolve_support.outputs.protected_main_sha }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          audit_branch="${AUDIT_TARGET_REF_INPUT:-${AUDIT_DEFAULT_BRANCH}}"
          if [ -z "${AUDIT_DEFAULT_BRANCH}" ] ||
             ! git check-ref-format --branch "${AUDIT_DEFAULT_BRANCH}" >/dev/null 2>&1 ||
             ! git check-ref-format --branch "${audit_branch}" >/dev/null 2>&1 ||
             [ -e "${GITHUB_WORKSPACE}/audit-data" ] || [ -L "${GITHUB_WORKSPACE}/audit-data" ]; then
            echo "::error::Security audit branch or checkout path is invalid."
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY}" = "shubhodeep1/coding-workflows" ] &&
             [ "${audit_branch}" = "main" ] && [[ "${PROTECTED_MAIN_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            # The earlier protected-main lookup already supplied this exact
            # branch head. On a missing cache value use the branch API below.
            audit_sha="${PROTECTED_MAIN_SHA}"
          else
            # No other read supplies this head. Require a heads/ ref, never a
            # tag or prefix match; URL-encode even valid slash-bearing names.
            encoded_branch="$(jq -nr --arg ref "${audit_branch}" '$ref | @uri')"
            if ! audit_ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_branch}")"; then
              echo "::error::Security audit branch head is unavailable."
              exit 1
            fi
            audit_ref="$(jq -r '.ref // ""' <<< "${audit_ref_json}")"
            audit_type="$(jq -r '.object.type // ""' <<< "${audit_ref_json}")"
            audit_sha="$(jq -r '.object.sha // ""' <<< "${audit_ref_json}")"
            if [ "${audit_ref}" != "refs/heads/${audit_branch}" ] ||
               [ "${audit_type}" != "commit" ] || [[ ! "${audit_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Security audit branch head is not an exact commit ref."
              exit 1
            fi
          fi
          {
            echo "AUDIT_DATA_SHA=${audit_sha}"
            echo "AUDIT_DEFAULT_BRANCH=${AUDIT_DEFAULT_BRANCH}"
            echo "AUDIT_BRANCH=${audit_branch}"
          } >> "$GITHUB_ENV"

      - name: Checkout audit data
        uses: actions/checkout@v5
        with:
          ref: ${{ env.AUDIT_DATA_SHA }}
          path: audit-data
          persist-credentials: false
          # The incremental scope resolver needs the last audited commit and
          # the default branch's remote-tracking ref for merge-base.
          fetch-depth: 0

      - name: Verify audit data and resolve scope
        run: |
          set -euo pipefail
          if [ "$(git -C audit-data rev-parse --show-toplevel 2>/dev/null)" != "${GITHUB_WORKSPACE}/audit-data" ] ||
             [ "$(git -C audit-data rev-parse HEAD 2>/dev/null)" != "${AUDIT_DATA_SHA}" ]; then
            echo "::error::Security audit data checkout does not match the resolved branch head."
            exit 1
          fi
          if [ "${AUDIT_BRANCH}" = "${AUDIT_DEFAULT_BRANCH}" ]; then
            echo "SECURITY_AUDIT_TARGET: default branch ${AUDIT_DEFAULT_BRANCH} commit ${AUDIT_DATA_SHA}"
            exit 0
          fi
          if ! audit_diff_base="$(git -C audit-data merge-base "refs/remotes/origin/${AUDIT_DEFAULT_BRANCH}" "${AUDIT_DATA_SHA}")"; then
            echo "::error::Could not compute the security audit branch merge-base."
            exit 1
          fi
          echo "SECURITY_AUDIT_TARGET: branch ${AUDIT_BRANCH} range ${audit_diff_base}..${AUDIT_DATA_SHA}"
          {
            echo "SECURITY_AUDIT_TARGET_REF=${AUDIT_BRANCH}"
            echo "SECURITY_AUDIT_DIFF_BASE=${audit_diff_base}"
            echo "SECURITY_AUDIT_DIFF_HEAD=${AUDIT_DATA_SHA}"
          } >> "$GITHUB_ENV"

      - name: Install Codex CLI
        uses: ./.github/actions/install-codex

      - name: Create Codex config
        run: |
          set -euo pipefail
          # The catalog path MUST be absolute: codex resolves a relative
          # model_catalog_json against CODEX_HOME (~/.codex) and exits with
          # "No such file or directory (os error 2)".
          bash "${GITHUB_WORKSPACE}/scripts/write_codex_config.sh" \
            --model "openai/gpt-6-sol" \
            --reasoning xhigh \
            --catalog-path "${GITHUB_WORKSPACE}/scripts/codex_model_catalog.json"
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"

      - name: Resolve trusted security audit exclusions
        env:
          AUDIT_ENABLED: ${{ vars.SECURITY_AUDIT_ENABLED || 'true' }}
          AUDIT_EXCLUSIONS_CONFIG: ${{ vars.SECURITY_AUDIT_FP_EXCLUSIONS || 'scripts/security_audit_fp_exclusions.json' }}
        run: |
          set -euo pipefail
          # Preserve the audit script's disabled-run behavior: no catalog is
          # needed when it exits before loading exclusions.
          case "${AUDIT_ENABLED,,}" in
            1|true|yes|on) ;;
            *) exit 0 ;;
          esac
          # The audit-data checkout is nested inside the support checkout.
          # Resolve both the spelling and the destination before handing the
          # catalog to the audit script, which otherwise prefers audit-data.
          support_root="$(realpath -e -- "${GITHUB_WORKSPACE}")"
          if [[ "${AUDIT_EXCLUSIONS_CONFIG}" = /* ]]; then
            catalog_candidate="${AUDIT_EXCLUSIONS_CONFIG}"
          else
            catalog_candidate="${support_root}/${AUDIT_EXCLUSIONS_CONFIG}"
          fi
          if [[ "${catalog_candidate}" == *$'\n'* || "${catalog_candidate}" == *$'\r'* ]] ||
             [[ "${catalog_candidate}" == "${support_root}/audit-data" || "${catalog_candidate}" == "${support_root}/audit-data/"* ]] ||
             ! catalog_path="$(realpath -e -- "${catalog_candidate}" 2>/dev/null)" ||
             [[ "${catalog_path}" != "${support_root}/"* || "${catalog_path}" == "${support_root}/audit-data/"* ]] ||
             [ ! -f "${catalog_path}" ]; then
            echo "::error::Security audit exclusion catalog must be a regular file in trusted support (not audit data)."
            exit 1
          fi
          catalog_relative="${catalog_path#"${support_root}/"}"
          if ! git -C "${support_root}" ls-files --error-unmatch -- "${catalog_relative}" >/dev/null 2>&1 ||
             ! git -C "${support_root}" diff --quiet HEAD -- "${catalog_relative}"; then
            echo "::error::Security audit exclusion catalog is not unchanged tracked support content."
            exit 1
          fi
          echo "SECURITY_AUDIT_FP_EXCLUSIONS=${catalog_path}" >> "$GITHUB_ENV"

      - name: Run security audit
        working-directory: ./audit-data
        env:
          SECURITY_AUDIT_SUPPORT_DIR: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
          SECURITY_AUDIT_ENABLED: ${{ vars.SECURITY_AUDIT_ENABLED || 'true' }}
          SECURITY_AUDIT_CONFIDENCE_GATE: ${{ vars.SECURITY_AUDIT_CONFIDENCE_GATE || '8' }}
          SECURITY_AUDIT_SKIP_IF_UNCHANGED: ${{ vars.SECURITY_AUDIT_SKIP_IF_UNCHANGED || 'true' }}
          SECURITY_AUDIT_INCREMENTAL: ${{ vars.SECURITY_AUDIT_INCREMENTAL || 'true' }}
        run: |
          set -euo pipefail
          bash "${SECURITY_AUDIT_SUPPORT_DIR}/scripts/security_audit.sh"

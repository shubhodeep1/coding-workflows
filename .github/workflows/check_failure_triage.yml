---
name: AI Check Failure Triage (Reusable)

"on":
  workflow_call:
    inputs:
      pr_number:
        description: "PR number associated with the failing check-run"
        required: false
        type: string
        default: ""
      check_run_id:
        description: "Failing check-run id"
        required: false
        type: string
        default: ""
      check_name:
        description: "Failing check-run name"
        required: false
        type: string
        default: ""
      check_conclusion:
        description: "Check-run conclusion (failure|timed_out|...)"
        required: false
        type: string
        default: ""
      head_sha:
        description: "Head SHA the check ran against"
        required: false
        type: string
        default: ""
      details_url:
        description: "Check-run details URL"
        required: false
        type: string
        default: ""
    secrets:
      GH_PAT:
        required: true
      CHECK_TRIAGE_ISSUES_TOKEN:
        required: true
      OPENROUTER_API_KEY:
        required: true
      TG_BOT_SECRET:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}

jobs:
  derive_check_name_key:
    if: >-
      !contains(fromJson('["false"]'), vars.CHECK_FAILURE_TRIAGE_ENABLED) &&
      inputs.pr_number != '' &&
      contains(fromJson('["failure","timed_out"]'), inputs.check_conclusion) &&
      !contains(inputs.check_name, 'Check Failure Triage')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      check_name_key: ${{ steps.hash_check_name.outputs.check_name_key }}
      same_repo: ${{ steps.hash_check_name.outputs.same_repo }}
      smoke_pr: ${{ steps.hash_check_name.outputs.smoke_pr }}
    steps:
      - name: Validate inputs, hash check name, and verify PR origin
        id: hash_check_name
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CHECK_RUN_ID: ${{ inputs.check_run_id }}
          CHECK_NAME: ${{ inputs.check_name }}
          CHECK_CONCLUSION: ${{ inputs.check_conclusion }}
          HEAD_SHA: ${{ inputs.head_sha }}
          DETAILS_URL: ${{ inputs.details_url }}
        run: |
          set -euo pipefail

          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid PR number"
            exit 1
          fi
          if [ -n "${CHECK_RUN_ID}" ] && ! [[ "${CHECK_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid check-run id"
            exit 1
          fi
          case "${CHECK_CONCLUSION}" in
            failure|timed_out) ;;
            *)
              echo "::error::Unsupported check conclusion"
              exit 1
              ;;
          esac
          if [ -n "${HEAD_SHA}" ] && ! [[ "${HEAD_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid head SHA"
            exit 1
          fi

          check_name_key="$(printf '%s' "${CHECK_NAME}" | sha256sum | awk '{print $1}')"
          echo "check_name_key=${check_name_key}" >> "$GITHUB_OUTPUT"

          pr_payload="$(mktemp)"
          api_error="$(mktemp)"
          trap 'rm -f "${pr_payload}" "${api_error}"' EXIT

          attempt=1
          while true; do
            if gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "${pr_payload}" 2> "${api_error}"; then
              break
            fi

            http_status="$(grep -Eo 'HTTP [0-9]{3}' "${api_error}" | tail -1 | awk '{print $2}' || true)"
            retryable=false
            case "${http_status}" in
              408|429|5??) retryable=true ;;
              403)
                if grep -qiE 'rate limit|secondary rate limit|abuse' "${api_error}"; then
                  retryable=true
                fi
                ;;
              '') retryable=true ;;
            esac

            if [ "${retryable}" != "true" ]; then
              echo "::error::Permanent failure while determining PR origin (HTTP ${http_status:-unknown})"
              exit 1
            fi
            if [ "${attempt}" -ge 3 ]; then
              echo "::error::Unable to determine PR origin after ${attempt} attempts"
              exit 1
            fi
            sleep $((attempt * 2))
            attempt=$((attempt + 1))
          done

          head_repo="$(jq -r '.head.repo.full_name // ""' "${pr_payload}" 2>/dev/null || echo '')"
          if [ -z "${head_repo}" ] || [ "${head_repo}" = "null" ]; then
            echo "::error::Unable to determine PR head repository"
            exit 1
          fi
          # Smoke-fixture detection from the same PR payload (no extra API
          # call). implement.yml labels the test-and-mark-stable smoke PR
          # `e2e-smoke-test`; the triage job below then runs with
          # ALERT_MSG_LEVEL=SILENT so the gate's single pass/fail message
          # is the only Telegram notification. Triage itself still runs.
          if jq -e '[.labels[]?.name] | index("e2e-smoke-test") != null' "${pr_payload}" >/dev/null 2>&1; then
            echo "::notice::PR #${PR_NUMBER} carries the e2e-smoke-test label; Telegram alerts from this triage are silenced."
            echo "smoke_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "smoke_pr=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${head_repo}" != "${REPOSITORY}" ]; then
            echo "same_repo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping check-failure triage for fork PR #${PR_NUMBER} (head repo: ${head_repo})."
            exit 0
          fi
          echo "same_repo=true" >> "$GITHUB_OUTPUT"

  triage:
    needs: derive_check_name_key
    permissions:
      contents: read
    # Cost gate: enabled by default; a consumer opts OUT via
    # CHECK_FAILURE_TRIAGE_ENABLED=false. Only genuine failure conclusions on a
    # real PR proceed. The job is skipped (no checkout / no codex install) when
    # disabled. The prerequisite must validate the inputs and confirm a
    # same-repository PR before this secret-bearing job can start.
    if: >-
      !contains(fromJson('["false"]'), vars.CHECK_FAILURE_TRIAGE_ENABLED) &&
      inputs.pr_number != '' &&
      contains(fromJson('["failure","timed_out"]'), inputs.check_conclusion) &&
      !contains(inputs.check_name, 'Check Failure Triage') &&
      needs.derive_check_name_key.result == 'success' &&
      needs.derive_check_name_key.outputs.same_repo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # One in-flight triage per repo + PR + check. The hashed check-name
      # suffix preserves per-check serialization without exposing the raw
      # check name to GitHub's concurrency-group length/character limits.
      # cancel-in-progress: false means a check that is already being triaged
      # keeps its run; a second event queues and then no-ops via the
      # open-issue dedup in the script.
      group: ai-check-triage-${{ github.repository }}-${{ inputs.pr_number }}-${{ needs.derive_check_name_key.outputs.check_name_key || inputs.check_run_id || inputs.check_name || github.run_id }}
      cancel-in-progress: false
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      MODEL_EDITOR: ${{ vars.WORKFLOW_CHECK_TRIAGE_MODEL || vars.WORKFLOW_EDITOR_MODEL || 'openai/gpt-6-sol' }}
      MODEL_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_CHECK_TRIAGE || 'high' }}
      MODEL_VERBOSITY: ${{ vars.VERBOSITY_CHECK_TRIAGE || 'low' }}
      OPENROUTER_PROMPT_CACHE_DISABLED: ${{ vars.OPENROUTER_PROMPT_CACHE_DISABLED || 'false' }}
      CHECK_FAILURE_TRIAGE_ENABLED: ${{ vars.CHECK_FAILURE_TRIAGE_ENABLED || 'true' }}
      CHECK_FAILURE_TRIAGE_MAX_LINEAGE_DEPTH: ${{ vars.CHECK_FAILURE_TRIAGE_MAX_LINEAGE_DEPTH || '3' }}
      TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
      TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
      # Job-level override of the workflow-level default: a PR carrying the
      # `e2e-smoke-test` label (test-and-mark-stable fixture) runs triage
      # with every Telegram send suppressed. SILENT > CRITICAL in
      # tg_helpers.sh, so scripts/check_failure_triage.sh and the
      # failure-notify step below both go quiet.
      ALERT_MSG_LEVEL: ${{ needs.derive_check_name_key.outputs.smoke_pr == 'true' && 'SILENT' || vars.ALERT_MSG_LEVEL || 'DEBUG' }}
    steps:
      - name: Log trigger context
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          CHECK_NAME: ${{ inputs.check_name }}
          CHECK_CONCLUSION: ${{ inputs.check_conclusion }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          safe_check_name="$(PYTHONDONTWRITEBYTECODE=1 python3 -I -B -c '
          import sys, unicodedata
          check_name_text = "".join(" " if unicodedata.category(char).startswith("C") or unicodedata.category(char) in ("Zl", "Zp") else char for char in sys.argv[1])
          print(" ".join(check_name_text.split()).replace("`", "\u0027").replace("<", "&lt;")[:200] or "(unnamed check)")
          ' "${CHECK_NAME}")"
          printf 'Check-failure triage for %s PR #%s\n' "${GITHUB_REPOSITORY}" "${PR_NUMBER}"
          printf 'Check: %s (conclusion: %s)\n' "${safe_check_name}" "${CHECK_CONCLUSION}"
          printf 'Head SHA: %s\n' "${HEAD_SHA}"

      - name: Checkout PR head (failing branch)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          fetch-depth: 1
          token: ${{ github.token }}
          persist-credentials: false

      - name: Install Codex CLI
        uses: shubhodeep1/coding-workflows/.github/actions/install-codex@stable
        with:
          codex_version: ${{ vars.CODEX_VERSION || 'v0.114.0' }}

      - name: Resolve workflow support ref
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            echo "SCRIPT_REF=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "SCRIPT_REF=stable" >> "$GITHUB_ENV"
          fi

      - name: Checkout workflow support source
        id: checkout_support_source
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ env.SCRIPT_REF }}
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout workflow support source fallback
        if: ${{ steps.checkout_support_source.outcome == 'failure' }}
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1
          persist-credentials: false

      - name: Stage workflow support files
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          if [ ! -d .codex-workflow-src ]; then
            echo "::error::Failed to checkout workflow support source"
            exit 1
          fi
          echo "UNATTENDED_IDENTITY_REINJECT_ENABLED=${{ vars.UNATTENDED_IDENTITY_REINJECT_ENABLED || 'false' }}" >> "$GITHUB_ENV"
          mkdir -p scripts

          _fetched=()
          for f in gh_helpers.sh tg_helpers.sh emit_event.sh emit_event.py render_prompt.sh render_prompt.py write_codex_config.sh codex_helpers.sh collect_pr_check_runs_context.py check_failure_triage.sh clarify_isolated_run.sh clarify_openrouter_broker.py; do
            src=".codex-workflow-src/scripts/${f}"
            if [ ! -f "${src}" ]; then
              if [ "${f}" = "render_prompt.py" ]; then
                echo "::notice::Optional ${f} absent; render_prompt.sh resolves it elsewhere or uses the bundled renderer."
                continue
              fi
              echo "::error::Missing required support script ${f} in ${wf_source}@${SCRIPT_REF}"
              exit 1
            fi
            install -m 0755 "${src}" "scripts/${f}"
            _fetched+=("${f}")
          done

          catalog_src=".codex-workflow-src/scripts/codex_model_catalog.json"
          sandbox_src=".codex-workflow-src/scripts/clarify_sandbox/Dockerfile"
          for required_src in "${catalog_src}" "${sandbox_src}"; do
            if [ ! -f "${required_src}" ]; then
              echo "::error::Missing required isolation support ${required_src}"
              exit 1
            fi
          done
          install -m 0644 "${catalog_src}" scripts/codex_model_catalog.json
          mkdir -p scripts/clarify_sandbox
          install -m 0644 "${sandbox_src}" scripts/clarify_sandbox/Dockerfile
          _fetched+=(codex_model_catalog.json clarify_sandbox/)

          # Canonical repo-architecture facts for the diagnosis prompt.
          if [ -f ".codex-workflow-src/agents.md" ]; then
            install -m 0644 ".codex-workflow-src/agents.md" agents_canonical.md
          fi

          for f in unattended_system_instructions.md; do
            # These workspace copies only serve older, unset-directory callers.
            if [ ! -f "${f}" ] && [ -f ".codex-workflow-src/${f}" ]; then
              install -m 0644 ".codex-workflow-src/${f}" "${f}"
            fi
          done

          mkdir -p prompts
          if [ ! -f prompts/mode-check-failure-triage.txt ] && [ -f ".codex-workflow-src/prompts/mode-check-failure-triage.txt" ]; then
            install -m 0644 ".codex-workflow-src/prompts/mode-check-failure-triage.txt" prompts/mode-check-failure-triage.txt
          fi
          if [ ! -f prompts/_identity_recall.txt ] && [ -f ".codex-workflow-src/prompts/_identity_recall.txt" ]; then
            install -m 0644 ".codex-workflow-src/prompts/_identity_recall.txt" prompts/_identity_recall.txt
          fi

          if [ "${{ github.repository }}" != "${wf_source}" ]; then
            {
              echo "# Auto-generated by coding-workflows — DO NOT EDIT"
              echo "# Prevents runtime-fetched support scripts from being committed."
              printf '%s\n' "${_fetched[@]}" .gitignore
            } > scripts/.gitignore
          fi

          # Never render instructions from the PR checkout (including prompt
          # includes, personas and identity files). Keep it visible as code data.
          trusted_dir="${RUNNER_TEMP}/check-triage-trusted-support"
          if [ ! -f .codex-workflow-src/unattended_system_instructions.md ] ||
             [ ! -f .codex-workflow-src/prompts/mode-check-failure-triage.txt ]; then
            echo "::error::Required trusted triage instructions are missing from the support ref"
            exit 1
          fi
          rm -rf "${trusted_dir}"
          mkdir -p "${trusted_dir}/scripts" "${trusted_dir}/prompts"
          cp -R .codex-workflow-src/prompts/. "${trusted_dir}/prompts/"
          install -m 0644 .codex-workflow-src/unattended_system_instructions.md "${trusted_dir}/unattended_system_instructions.md"
          if [ -f .codex-workflow-src/agents.md ]; then
            install -m 0644 .codex-workflow-src/agents.md "${trusted_dir}/agents_canonical.md"
          fi
          for trusted_helper_file in gh_helpers.sh tg_helpers.sh emit_event.sh emit_event.py; do
            install -m 0755 ".codex-workflow-src/scripts/${trusted_helper_file}" "${trusted_dir}/scripts/${trusted_helper_file}"
          done
          install -m 0755 .codex-workflow-src/scripts/check_failure_triage.sh "${trusted_dir}/scripts/check_failure_triage.sh"
          install -m 0755 .codex-workflow-src/scripts/collect_pr_check_runs_context.py "${trusted_dir}/scripts/collect_pr_check_runs_context.py"
          install -m 0755 .codex-workflow-src/scripts/clarify_isolated_run.sh "${trusted_dir}/scripts/clarify_isolated_run.sh"
          install -m 0755 .codex-workflow-src/scripts/clarify_openrouter_broker.py "${trusted_dir}/scripts/clarify_openrouter_broker.py"
          install -m 0755 .codex-workflow-src/scripts/write_codex_config.sh "${trusted_dir}/scripts/write_codex_config.sh"
          install -m 0644 "${catalog_src}" "${trusted_dir}/scripts/codex_model_catalog.json"
          mkdir -p "${trusted_dir}/scripts/clarify_sandbox"
          install -m 0644 "${sandbox_src}" "${trusted_dir}/scripts/clarify_sandbox/Dockerfile"
          install -m 0755 .codex-workflow-src/scripts/render_prompt.sh "${trusted_dir}/scripts/render_prompt.sh"
          if [ -f .codex-workflow-src/scripts/render_prompt.py ]; then
            install -m 0755 .codex-workflow-src/scripts/render_prompt.py "${trusted_dir}/scripts/render_prompt.py"
          fi
          install -m 0755 .codex-workflow-src/scripts/assemble_prompt.sh "${trusted_dir}/scripts/assemble_prompt.sh"
          echo "CHECK_TRIAGE_TRUSTED_SUPPORT_DIR=${trusted_dir}" >> "$GITHUB_ENV"

          rm -rf .codex-workflow-src

      - name: Create Codex config
        run: |
          set -euo pipefail
          source scripts/codex_helpers.sh
          codex_config_assemble "${MODEL_EDITOR}" "${MODEL_REASONING_EFFORT}" "low"

      - name: Create runtime workspace
        run: |
          set -euo pipefail
          RUNTIME_DIR="/tmp/check-triage-${GITHUB_RUN_ID}"
          mkdir -p "${RUNTIME_DIR}"
          echo "RUNTIME_DIR=${RUNTIME_DIR}" >> "$GITHUB_ENV"

      - name: Collect check-failure context
        id: collect_triage
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          CHECK_TRIAGE_STAGE: collect
          CHECK_TRIAGE_PR_NUMBER: ${{ inputs.pr_number }}
          CHECK_TRIAGE_CHECK_RUN_ID: ${{ inputs.check_run_id }}
          CHECK_TRIAGE_CHECK_NAME: ${{ inputs.check_name }}
          CHECK_TRIAGE_CHECK_CONCLUSION: ${{ inputs.check_conclusion }}
          CHECK_TRIAGE_HEAD_SHA: ${{ inputs.head_sha }}
          CHECK_TRIAGE_DETAILS_URL: ${{ inputs.details_url }}
        run: |
          set -euo pipefail
          cd "${CHECK_TRIAGE_TRUSTED_SUPPORT_DIR:?trusted support is required}"
          bash scripts/check_failure_triage.sh

      - name: Diagnose check failure
        if: ${{ steps.collect_triage.outputs.ready == 'true' }}
        id: diagnose_triage
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLARIFY_CODEX_VERSION: ${{ vars.CODEX_VERSION || 'v0.114.0' }}
          CHECK_TRIAGE_STAGE: diagnose
          CHECK_TRIAGE_PREPARE_ONLY: "true"
          CHECK_TRIAGE_PR_NUMBER: ${{ inputs.pr_number }}
          CHECK_TRIAGE_CHECK_RUN_ID: ${{ inputs.check_run_id }}
          CHECK_TRIAGE_CHECK_NAME: ${{ inputs.check_name }}
          CHECK_TRIAGE_CHECK_CONCLUSION: ${{ inputs.check_conclusion }}
          CHECK_TRIAGE_HEAD_SHA: ${{ inputs.head_sha }}
          CHECK_TRIAGE_DETAILS_URL: ${{ inputs.details_url }}
        run: |
          set -euo pipefail
          cd "${CHECK_TRIAGE_TRUSTED_SUPPORT_DIR:?trusted support is required}"
          bash scripts/check_failure_triage.sh

      # A fine-grained PAT with Issues: write (and Metadata: read) keeps
      # issues:opened dispatching clarify; github.token would suppress it.
      - name: Post check-failure triage issue
        if: ${{ steps.diagnose_triage.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CHECK_TRIAGE_ISSUES_TOKEN }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          CHECK_NAME: ${{ inputs.check_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          cd "${CHECK_TRIAGE_TRUSTED_SUPPORT_DIR:?trusted support is required}"
          source scripts/gh_helpers.sh
          body_file="${RUNTIME_DIR}/issue_body.md"
          test -s "${body_file}"
          PYTHONDONTWRITEBYTECODE=1 python3 -I -B - "${body_file}" <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          issue_body_path = pathlib.Path(sys.argv[1])
          issue_body_text = issue_body_path.read_text(encoding="utf-8")
          for posting_token_value in {os.environ.get("GH_TOKEN", ""), os.environ.get("GITHUB_TOKEN", ""), os.environ.get("TG_BOT_SECRET", "")}:
              if len(posting_token_value) >= 8:
                  issue_body_text = issue_body_text.replace(posting_token_value, "[redacted]")
          expected_fingerprint = json.loads((issue_body_path.parent / "triage_metadata.json").read_text(encoding="utf-8"))["fingerprint"]
          first_line = issue_body_text.split("\n", 1)[0]
          if not isinstance(expected_fingerprint, str) or not re.fullmatch(r"[0-9a-f]{64}", expected_fingerprint) or first_line != f"<!-- check-failure-triage:fp={expected_fingerprint} -->":
              sys.exit("::error::Invalid check-failure triage issue marker")
          truncation_note = "\n\n_[triage body truncated]_"
          if len(issue_body_text) > 60000:
              issue_body_text = issue_body_text[:60000 - len(truncation_note)] + truncation_note
          issue_body_path.write_text(issue_body_text, encoding="utf-8")
          PY
          triage_post_fp="$(jq -er '.fingerprint' "${RUNTIME_DIR}/triage_metadata.json")"
          triage_post_gen="$(jq -er '.generation' "${RUNTIME_DIR}/triage_metadata.json")"
          triage_post_root="$(jq -er '.root' "${RUNTIME_DIR}/triage_metadata.json")"
          # The script's existing issue-create call serves direct callers; this
          # workflow must post from its own token-scoped step instead.
          triage_post_check_name="$(PYTHONDONTWRITEBYTECODE=1 python3 -I -B -c '
          import sys
          import re
          import unicodedata
          value = "".join(" " if unicodedata.category(char).startswith("C") or unicodedata.category(char) in ("Zl", "Zp") else char for char in sys.argv[1])
          value = " ".join(value.split()).replace("`", "\u0027").replace("<", "&lt;")
          keys = ("integration branch", "target branch", "tracking issue", "depends on",
              "local id", "managed by", "prior_pr_baseline_branch", "files_touched")
          key_pattern = re.compile(r"\b(" + "|".join(re.escape(key).replace(r"\ ", r"\s+") for key in keys) + r")(\s*\**\s*):", re.IGNORECASE)
          value = key_pattern.sub(r"\1 (untrusted)\2:", value)
          value = re.sub(r"Re-issued from\s*#", "Re-issued from (untrusted) #", value, flags=re.IGNORECASE)
          value = re.sub(r"review-blocked-reissue", "review-blocked (untrusted) reissue", value, flags=re.IGNORECASE)
          print(value[:200] or "(unnamed check)")
          ' "${CHECK_NAME}")"
          triage_issue_url="$(gh_retry gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "CI failure: ${triage_post_check_name} on PR #${PR_NUMBER}" \
            --body-file "${body_file}" --label "ai:check-triage")"
          test -n "${triage_issue_url}"
          printf 'CHECK_TRIAGE created issue=%s fp=%s gen=%s root=%s pr=%s check=%s\n' \
            "${triage_issue_url}" "${triage_post_fp}" "${triage_post_gen}" "${triage_post_root}" "${PR_NUMBER}" "${triage_post_check_name}"
          source scripts/tg_helpers.sh 2>/dev/null || true
          type tg_send_msg >/dev/null 2>&1 && tg_send_msg \
            "Check-failure auto-triage opened ${triage_issue_url} for ${GITHUB_REPOSITORY} PR #${PR_NUMBER} (check '${triage_post_check_name}', generation ${triage_post_gen}/${CHECK_FAILURE_TRIAGE_MAX_LINEAGE_DEPTH}). The pipeline will pick it up." \
            "DEBUG" >/dev/null 2>&1 || true

      - name: Notify on triage workflow failure
        if: ${{ failure() }}
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CHECK_NAME: ${{ inputs.check_name }}
        run: |
          set -euo pipefail
          safe_check_name="$(PYTHONDONTWRITEBYTECODE=1 python3 -I -B -c '
          import sys, unicodedata
          check_name_text = "".join(" " if unicodedata.category(char).startswith("C") or unicodedata.category(char) in ("Zl", "Zp") else char for char in sys.argv[1])
          print(" ".join(check_name_text.split()).replace("`", "\u0027").replace("<", "&lt;")[:160] or "(unnamed check)")
          ' "${CHECK_NAME}")"
          RUN_URL="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          notification="AI Check Failure Triage workflow itself failed for ${GITHUB_REPOSITORY} PR #${PR_NUMBER} (check '${safe_check_name}')."
          if [ -n "${CHECK_TRIAGE_TRUSTED_SUPPORT_DIR:-}" ] && [ -f "${CHECK_TRIAGE_TRUSTED_SUPPORT_DIR}/scripts/tg_helpers.sh" ]; then
            cd "${CHECK_TRIAGE_TRUSTED_SUPPORT_DIR}" || exit 0
            source scripts/tg_helpers.sh 2>/dev/null || true
            type tg_send_msg >/dev/null 2>&1 && tg_send_msg "${notification}"$'\n'"Run: ${RUN_URL}" "CRITICAL" >/dev/null 2>&1 || true
          elif [[ "${ALERT_MSG_LEVEL:-DEBUG}" != [sS][iI][lL][eE][nN][tT] ]] && [ -n "${TG_BOT_SECRET:-}" ] && [ -n "${TG_ADMIN_CHAT_ID:-${TG_CHAT_ID:-}}" ]; then
            # No PR-checkout helper may run when trusted support staging failed.
            curl -fsS -X POST "https://api.telegram.org/bot${TG_BOT_SECRET}/sendMessage" \
              -d "chat_id=${TG_ADMIN_CHAT_ID:-${TG_CHAT_ID:-}}" -d 'disable_web_page_preview=true' \
              --data-urlencode "text=CRITICAL: ${notification}"$'\n'"Run: ${RUN_URL}" >/dev/null 2>&1 || true
          fi

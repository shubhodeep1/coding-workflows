---
# Unblock judge (docs/plans/replace-claude-sessions-with-cli-engine-plan.md,
# Phase 7). Judges one blocked issue, pull request or orchestrator project and
# carries out the verdict (scripts/unblock_judge.sh). Called by
# unblock_judge_dispatch.yml, which the poller's unblock scan
# (run_unblock_scan in scripts/orchestrate_poll_process.sh) dispatches with
# `gh workflow run unblock_judge_dispatch.yml -f item=<n>`.
#
# The scripts and prompt come from a trusted coding-workflows commit (main in
# this repository, the stable tag or a pinned SHA in a consumer); the caller's
# default branch is checked out read-only for the model to read. Never fails
# the caller: the run step is continue-on-error and the script exits 0.
name: AI Unblock Judge (Reusable)

"on":
  workflow_call:
    inputs:
      item:
        description: Issue, pull request or tracking issue number to judge
        required: true
        type: string
    secrets:
      GH_PAT:
        required: true
      TG_BOT_SECRET:
        required: false
      OPENROUTER_API_KEY:
        required: false

env:
  # Claude capacity wait (issue #7370): a capacity fallback waits for the
  # hourly capacity-resume pass instead of running codex/OpenCode. Off for the
  # `core` install profile, which has no orchestrate-poll wrapper to resume
  # waiting work; repo variable CLAUDE_POOL_CAPACITY_WAIT_ENABLED=false rolls back.
  CLAUDE_POOL_CAPACITY_WAIT_ENABLED: ${{ vars.CLAUDE_POOL_CAPACITY_WAIT_ENABLED || (vars.WORKFLOW_PROFILE == 'core' && 'false') || 'true' }}

jobs:
  unblock-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve trusted unblock support commit
        id: resolve_support
        env:
          WORKFLOW_JOB_JSON: ${{ toJSON(job) }}
          CALLER_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          support_workflow_repository="$(jq -r '.workflow_repository // ""' <<< "${WORKFLOW_JOB_JSON}")"
          support_workflow_ref="$(jq -r '.workflow_ref // ""' <<< "${WORKFLOW_JOB_JSON}")"
          source_ref='^shubhodeep1/coding-workflows/\.github/workflows/unblock_judge\.yml@refs/heads/[^[:space:]]+$'
          stable_ref='^shubhodeep1/coding-workflows/\.github/workflows/unblock_judge\.yml@refs/tags/stable$'
          consumer_pin='^shubhodeep1/coding-workflows/\.github/workflows/unblock_judge\.yml@[0-9a-f]{40}$'
          if [ "${support_workflow_repository}" != "shubhodeep1/coding-workflows" ] ||
             { [ "${CALLER_REPOSITORY}" = "shubhodeep1/coding-workflows" ] && [[ ! "${support_workflow_ref}" =~ ${source_ref} ]]; } ||
             { [ "${CALLER_REPOSITORY}" != "shubhodeep1/coding-workflows" ] &&
               [[ ! "${support_workflow_ref}" =~ ${stable_ref} ]] && [[ ! "${support_workflow_ref}" =~ ${consumer_pin} ]]; }; then
            echo "::error::Unblock support workflow identity is unapproved."
            exit 1
          fi
          if [ "${CALLER_REPOSITORY}" = "shubhodeep1/coding-workflows" ]; then
            if ! support_main_json="$(gh api repos/shubhodeep1/coding-workflows/branches/main)" ||
               ! jq -e '.protected == true' <<< "${support_main_json}" >/dev/null; then
              echo "::error::Unblock support main branch is not confirmed protected."
              exit 1
            fi
            support_sha="$(jq -r '.commit.sha // ""' <<< "${support_main_json}")"
          elif [[ "${support_workflow_ref}" =~ ${consumer_pin} ]]; then
            support_sha="${support_workflow_ref##*@}"
          else
            if ! support_tag_json="$(gh api repos/shubhodeep1/coding-workflows/git/ref/tags/stable)"; then
              echo "::error::Unblock support stable tag is unavailable."
              exit 1
            fi
            support_tag_type="$(jq -r '.object.type // ""' <<< "${support_tag_json}")"
            support_sha="$(jq -r '.object.sha // ""' <<< "${support_tag_json}")"
            if [ "${support_tag_type}" = "tag" ] && [[ "${support_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              if ! support_tag_json="$(gh api "repos/shubhodeep1/coding-workflows/git/tags/${support_sha}")"; then
                echo "::error::Unblock support annotated tag is unavailable."
                exit 1
              fi
              support_tag_type="$(jq -r '.object.type // ""' <<< "${support_tag_json}")"
              support_sha="$(jq -r '.object.sha // ""' <<< "${support_tag_json}")"
            fi
            if [ "${support_tag_type}" != "commit" ]; then
              echo "::error::Unblock support stable tag is not a commit."
              exit 1
            fi
          fi
          if [[ ! "${support_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unblock support did not resolve to a commit SHA."
            exit 1
          fi
          echo "support_sha=${support_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted unblock support
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ steps.resolve_support.outputs.support_sha }}
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          persist-credentials: false
          fetch-depth: 1

      - name: Verify trusted unblock support
        env:
          SUPPORT_SHA: ${{ steps.resolve_support.outputs.support_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${SUPPORT_SHA}" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$(git -C .codex-workflow-src rev-parse HEAD 2>/dev/null)" != "${SUPPORT_SHA}" ] ||
             [ ! -f .codex-workflow-src/scripts/unblock_judge.sh ]; then
            echo "::error::Unblock support checkout is not the approved commit."
            exit 1
          fi

      - name: Checkout default branch for the judge to read
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          path: target
          persist-credentials: false
          fetch-depth: 1

      - name: Install Codex CLI
        uses: shubhodeep1/coding-workflows/.github/actions/install-codex@91b30f6fba400686c5dded34423f88f1ea10e163
        with:
          codex_version: ${{ vars.CODEX_VERSION || 'v0.114.0' }}

      # The UNBLOCK_JUDGE role runs codex unless the engine policy selects
      # Claude (scripts/ai_engine.sh); the isolated Claude runner falls back
      # to isolated codex without a credential, so these steps never fail the job.
      - name: Install Claude Code CLI
        continue-on-error: true
        uses: ./.codex-workflow-src/.github/actions/install-claude
        with:
          config_path: .codex-workflow-src/.github/ai/claude_engine.json

      - name: Resolve Claude credential
        continue-on-error: true
        uses: ./.codex-workflow-src/.github/actions/claude-pool-token
        with:
          config_path: .codex-workflow-src/.github/ai/claude_engine.json

      - name: Judge the blocked item
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'WARNING' }}
          PYTHONDONTWRITEBYTECODE: "1"
          REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ITEM: ${{ inputs.item }}
          UNBLOCK_JUDGE_ENABLED: ${{ vars.UNBLOCK_JUDGE_ENABLED || 'true' }}
          NEEDS_HUMAN_DIGEST_ENABLED: ${{ vars.NEEDS_HUMAN_DIGEST_ENABLED || 'true' }}
          UNBLOCK_JUDGE_MODEL: ${{ vars.UNBLOCK_JUDGE_MODEL || vars.WORKFLOW_EDITOR_MODEL || 'openai/gpt-6-sol' }}
          UNBLOCK_JUDGE_REASONING: ${{ vars.THINKING_LEVEL_UNBLOCK_JUDGE || 'high' }}
          CLARIFY_CODEX_VERSION: ${{ vars.CODEX_VERSION || 'v0.114.0' }}
          UNBLOCK_JUDGE_FIXUP_WAIT_HOURS: ${{ vars.UNBLOCK_JUDGE_FIXUP_WAIT_HOURS || '72' }}
          # `wait` verdicts and operator-step holds (Q116, Q126): on by default;
          # a hold is judged again after this many days.
          UNBLOCK_JUDGE_WAIT_ENABLED: ${{ vars.UNBLOCK_JUDGE_WAIT_ENABLED || 'true' }}
          UNBLOCK_JUDGE_WAIT_MAX_DAYS: ${{ vars.UNBLOCK_JUDGE_WAIT_MAX_DAYS || '14' }}
          # Refuse verdict instructions the network-less implementer cannot run, and re-ask once.
          UNBLOCK_INSTRUCTION_SANDBOX_CHECK_ENABLED: ${{ vars.UNBLOCK_INSTRUCTION_SANDBOX_CHECK_ENABLED || 'true' }}
          # Q129: the check-triage resolution gate clarify runs (#7095).
          CHECK_TRIAGE_RESOLVED_GATE_ENABLED: ${{ vars.CHECK_TRIAGE_RESOLVED_GATE_ENABLED || 'true' }}
          # Q148: close a heal issue whose failure a sibling already fixed.
          UNBLOCK_HEAL_ALREADY_FIXED_ENABLED: ${{ vars.UNBLOCK_HEAL_ALREADY_FIXED_ENABLED || 'true' }}
          UNBLOCK_PROTECTED_HANDOFF_ENABLED: ${{ vars.UNBLOCK_PROTECTED_HANDOFF_ENABLED || 'false' }}
          # Harness routing: a harness-owned verdict sends a heal report instead of a fix-up.
          UNBLOCK_JUDGE_TARGET_REPO_GUARD_ENABLED: ${{ vars.UNBLOCK_JUDGE_TARGET_REPO_GUARD_ENABLED || 'true' }}
          WORKFLOW_HEAL_ENABLED: ${{ vars.WORKFLOW_HEAL_ENABLED || 'true' }}
          # The automation-path re-check runs the implement guard with the
          # same ALLOW_WORKFLOW_EDITS default implement.yml uses.
          UNBLOCK_JUDGE_REGRANT_ENABLED: ${{ vars.UNBLOCK_JUDGE_REGRANT_ENABLED || 'true' }}
          ALLOW_WORKFLOW_EDITS: ${{ vars.ALLOW_WORKFLOW_EDITS || 'true' }}
          AI_ENGINE: ${{ vars.AI_ENGINE || '' }}
          AI_ENGINE_UNBLOCK_JUDGE: ${{ vars.AI_ENGINE_UNBLOCK_JUDGE || '' }}
          # #7032: the CI-failure supersede check reads the same named CI check
          # and CI workflow binding as review_autofix.yml's auto-merge wait.
          AUTO_MERGE_REQUIRED_CI_CHECK: ${{ vars.AUTO_MERGE_REQUIRED_CI_CHECK || '' }}
          AUTO_MERGE_WAIT_WORKFLOWS: ${{ vars.AUTO_MERGE_WAIT_WORKFLOWS || 'CI' }}
          SUPPORT_INSTRUCTIONS_FILE: ${{ github.workspace }}/.codex-workflow-src/unattended_system_instructions.md
        run: |
          SUPPORT_DIR="${GITHUB_WORKSPACE}/.codex-workflow-src" \
          TARGET_DIR="${GITHUB_WORKSPACE}/target" \
          RUNTIME_DIR="${RUNNER_TEMP}/unblock-judge" \
            bash "${GITHUB_WORKSPACE}/.codex-workflow-src/scripts/unblock_judge.sh"

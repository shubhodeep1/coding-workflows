---
name: AI Cancel Runs on PR Close

"on":
  workflow_call:
    secrets:
      GH_PAT:
        required: false

jobs:
  cancel-active-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      REPOSITORY: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Cancel queued/in-progress runs for closed PR branch
        shell: bash
        run: |
          set -euo pipefail

          # Rate-limit-aware gh retry
          _rl_wait() {
            local _reset_ts _wait_secs
            _reset_ts=$(gh api -i /rate_limit 2>/dev/null | grep -i '^x-ratelimit-reset:' | head -1 | awk '{print $2}' | tr -d '\r') || true
            if [ -n "${_reset_ts}" ] && [ "${_reset_ts}" -gt 0 ] 2>/dev/null; then
              _wait_secs=$(( _reset_ts - $(date +%s) + 1 ))
              [ "${_wait_secs}" -lt 1 ] && _wait_secs=1
              [ "${_wait_secs}" -gt 600 ] && _wait_secs=600
            else
              _wait_secs=30
            fi
            echo "::warning::  Rate limit resets in ${_wait_secs}s (X-RateLimit-Reset: ${_reset_ts:-unknown})" >&2
            sleep "${_wait_secs}"
          }
          _gh_retry() {
            local attempt=1
            while [ "${attempt}" -le 5 ]; do
              if "$@" 2>/tmp/_gh_rl_err; then return 0; fi
              if grep -qiE 'rate limit|abuse detection|secondary rate|HTTP 429' /tmp/_gh_rl_err 2>/dev/null; then
                echo "::warning::Rate limit hit (attempt ${attempt}/5), waiting for reset…" >&2
                _rl_wait; attempt=$((attempt + 1))
              else
                cat /tmp/_gh_rl_err >&2 2>/dev/null; local w=$(( 2 ** (attempt - 1) ))
                echo "::warning::gh failed (attempt ${attempt}/5), retrying in ${w}s…" >&2
                sleep "${w}"; attempt=$((attempt + 1))
              fi
            done; return 1
          }

          echo "Processing PR #${PR_NUMBER}" \
            "for ${REPOSITORY}" \
            "(head ref: ${PR_HEAD_REF})"

          RUNS_JQ='{workflow_runs:
            [.[].workflow_runs // []]
            | flatten}'
          # Filter at the API level by branch+event so the response is
          # bounded to this PR's branch only. This avoids fetching every
          # queued/in-progress run in the repo, which previously produced
          # JSON blobs large enough to exceed ARG_MAX when passed via
          # `jq --argjson` (E2BIG -> exit 126). The client-side selects
          # below are kept as a defensive double-check.
          queued_runs_json="$(
            _gh_retry gh api \
              --method GET \
              "repos/${REPOSITORY}/actions/runs" \
              --paginate \
              -f status=queued \
              -f event=pull_request \
              -f "branch=${PR_HEAD_REF}" \
              -f per_page=100 \
            | jq -s "${RUNS_JQ}"
          )"
          in_progress_runs_json="$(
            _gh_retry gh api \
              --method GET \
              "repos/${REPOSITORY}/actions/runs" \
              --paginate \
              -f status=in_progress \
              -f event=pull_request \
              -f "branch=${PR_HEAD_REF}" \
              -f per_page=100 \
            | jq -s "${RUNS_JQ}"
          )"

          COMBINE='{workflow_runs:
            (($queued.workflow_runs // [])
            + ($in_progress.workflow_runs
            // []))}'
          combined_runs_json="$(jq -n \
            --argjson queued \
              "${queued_runs_json}" \
            --argjson in_progress \
              "${in_progress_runs_json}" \
            "${COMBINE}")"

          mapfile -t target_run_ids < <(
            jq -r \
              --arg head_ref "${PR_HEAD_REF}" \
              --arg pr_number "${PR_NUMBER}" \
              --arg current_run_id "${CURRENT_RUN_ID}" \
              '.workflow_runs[]
              | select(.head_branch == $head_ref)
              | select((.pull_requests // [])
                | any(.number ==
                  ($pr_number | tonumber)))
              | select(.event == "pull_request")
              | select((.id | tostring) != $current_run_id)
              | .id' <<<"${combined_runs_json}" \
            | awk '!seen[$0]++'
          )

          if [ "${#target_run_ids[@]}" -eq 0 ]; then
            echo "No matching queued/in-progress" \
              "pull_request workflow runs" \
              "found for head ref" \
              "'${PR_HEAD_REF}'."
            exit 0
          fi

          echo "Found ${#target_run_ids[@]}" \
            "run(s) to cancel:" \
            "${target_run_ids[*]}"

          canceled_any=0
          for run_id in "${target_run_ids[@]}"; do
            echo "Attempting cancellation for run ${run_id}..."

            cancel_url="repos/${REPOSITORY}"
            cancel_url+="/actions/runs"
            cancel_url+="/${run_id}/cancel"
            if _gh_retry gh api -X POST \
              "${cancel_url}" \
              >/dev/null 2>&1; then
              echo "Canceled run ${run_id}."
              canceled_any=1
            else
              echo "Run ${run_id} could not" \
                "be canceled (likely already" \
                "completed); continuing."
            fi
          done

          if [ "${canceled_any}" -eq 1 ]; then
            echo "Cancellation pass complete."
          else
            echo "No runs were canceled" \
              "because matching runs" \
              "finished before cancellation" \
              "requests completed."
          fi

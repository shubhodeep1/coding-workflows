---
name: Auto release stable

# Releases the `stable` branch when it is ahead of the `stable` tag.
#
# Consumers pin the tag, not the branch, so a patch merged straight into the
# `stable` branch is invisible to them until test-and-mark-stable.yml runs.
# This schedule dispatches that gate whenever the branch tip differs from the
# tag commit, skipping while a gate run is queued or running on any branch
# (the gate's e2e job cancels concurrent siblings) and once the gate has
# failed AUTO_RELEASE_STABLE_MAX_ATTEMPTS times on the current tip (a human
# has to look at that; earlier failures are retried on the next tick, and a
# cancelled gate never counts). See scripts/auto_release_stable.sh for the
# decision order.
#
# Release-blocker reporters (stuck-states P4, Refs #8291): before its normal
# skip or dispatch line, the script sends one `release_blocker` heal report
# per tick (last_gate_failed, release_in_flight or stable_release_stale) once
# the condition has persisted past its RELEASE_BLOCKER_* threshold. The
# report carries an OIDC report identity (hence `id-token: write`) and a
# failed delivery sends a Telegram WARNING. RELEASE_BLOCKER_HEAL_ENABLED=false
# turns the reporters off; the release decision itself never changes.
#
# Promotion of `main` to `stable` stays with promote-main-to-stable.yml:
# its daily cycle job proves `main` first, and an operator can still run it
# by hand.

"on":
  schedule:
    # Half past the hour so this never starts in the same minute as the
    # daily promote cycle (00:00): whichever of the two dispatched a gate
    # first is then visible to the other's in-flight check.
    - cron: "30 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  id-token: write

# Shares the promote job's group so the check-then-dispatch here can never
# interleave with a poller-driven promotion (which fast-forwards stable and
# dispatches the same release gate): one of the two waits for the other, and
# the later one then sees the in-flight gate run and skips.
concurrency:
  group: promote-main-to-stable
  cancel-in-progress: false

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Dispatch the release gate when stable is ahead of its tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          AUTO_RELEASE_STABLE_ENABLED: ${{ vars.AUTO_RELEASE_STABLE_ENABLED || 'true' }}
          AUTO_RELEASE_STABLE_MAX_ATTEMPTS: ${{ vars.AUTO_RELEASE_STABLE_MAX_ATTEMPTS || '3' }}
          RELEASE_BLOCKER_HEAL_ENABLED: ${{ vars.RELEASE_BLOCKER_HEAL_ENABLED || 'true' }}
          RELEASE_BLOCKER_GATE_FAILED_MIN_AGE_SECS: ${{ vars.RELEASE_BLOCKER_GATE_FAILED_MIN_AGE_SECS || '86400' }}
          RELEASE_BLOCKER_IN_FLIGHT_MIN_AGE_SECS: ${{ vars.RELEASE_BLOCKER_IN_FLIGHT_MIN_AGE_SECS || '21600' }}
          RELEASE_BLOCKER_STABLE_STALE_SECS: ${{ vars.RELEASE_BLOCKER_STABLE_STALE_SECS || '86400' }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          TG_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
        run: |
          set -euo pipefail
          bash scripts/auto_release_stable.sh

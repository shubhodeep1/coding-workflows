          shopt -s nullglob
          for f in schemas/*.json examples/*.json; do
            python3 -c "import json; json.load(open('$f'))" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done
          # Validate label contract
          python3 scripts/ai_labels.py contract-validate --contract-file .github/ai/label_contract.v1.json

      - name: Prompt files validation
        run: |
          set -euo pipefail
          for f in prompts/*.txt; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f is empty"
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done

      - name: Prompt tier budget
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/prompt_size_budget.py

      - name: Prompt forbidden-token soft lint
        run: |
          set -euo pipefail
          # Per OpenAI prompt guide: "Don't use ALWAYS, NEVER, must, and
          # only for judgment calls. Reserve them for true invariants."
          # Soft lint — emits warnings, doesn't fail the build. Threshold
          # of 8 hits per file gives operators visibility into prompts
          # that are drifting back toward instruction-stack noise.
          for f in prompts/*.txt; do
            hits=$(grep -coE '\b(MANDATORY|FAILURE|NEVER|ALWAYS)\b' "${f}" || true)
            if [ "${hits}" -gt 8 ]; then
              echo "::warning file=${f}::High count of absolutist tokens (${hits}). Per OpenAI prompt guide, reserve MUST/NEVER/ALWAYS for true invariants."
            fi
          done

      - name: Shell script syntax check
        run: |
          set -euo pipefail
          for f in scripts/*.sh .claude/hooks/*.sh workflow-templates/.claude/hooks/*.sh; do
            bash -n "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Validate memory_helpers.sh exports memory helpers
        run: |
          set -euo pipefail
          bash -c 'source scripts/memory_helpers.sh && declare -F memory_ensure_branch >/dev/null && declare -F memory_bootstrap >/dev/null' \
            && echo "OK: memory_ensure_branch and memory_bootstrap are defined after sourcing scripts/memory_helpers.sh" \
            || { echo "FAIL: memory_ensure_branch and/or memory_bootstrap not defined after sourcing scripts/memory_helpers.sh"; exit 1; }

      - name: Shared shell-block anti-regression checks
        run: |
          set -euo pipefail

          # Use ubiquitous grep instead of ripgrep so this gate does not
          # fail on runner images that omit `rg`.
          if grep -nE 'bash ("\$\{[^}]+\}/|scripts/)?write_codex_config\.sh|WRITE_CODEX_CONFIG=' \
            .github/workflows/clarify.yml \
            .github/workflows/plan.yml \
            .github/workflows/implement.yml \
            .github/workflows/review_autofix.yml \
            scripts/validate_process.sh; then
            echo "::error::Inline Codex config assembly detected; use scripts/codex_helpers.sh"
            exit 1
          fi

          for f in \
            .github/workflows/clarify.yml \
            .github/workflows/plan.yml \
            .github/workflows/implement.yml \
            .github/workflows/review_autofix.yml \
            scripts/validate_process.sh; do
            if ! grep -q 'codex_config_assemble' "${f}"; then
              echo "::error file=${f}::Shared Codex config helper is not wired into this targeted call site."
              exit 1
            fi
          done

          for f in \
            .github/workflows/clarify.yml \
            .github/workflows/plan.yml \
            .github/workflows/implement.yml \
            .github/workflows/validate.yml \
            .github/workflows/review_autofix.yml; do
            if ! grep -q 'memory_bootstrap' "${f}"; then
              echo "::error file=${f}::Shared memory bootstrap helper is not wired into this targeted workflow domain."
              exit 1
            fi
          done

          for f in \
            .github/workflows/clarify.yml \
            .github/workflows/plan.yml \
            .github/workflows/implement.yml \
            .github/workflows/review_autofix.yml; do
            if ! grep -q 'tg_send_phase_failure' "${f}"; then
              echo "::error file=${f}::Shared Telegram failure helper is not wired into this targeted workflow."
              exit 1
            fi
          done

          if grep -nE 'read_codex_stall_guard_state\(\)|read_validate_codex_stall_guard_state\(\)|codex_stall_guard_kill_detected\(\)|resolve_editor_network_probe_pid\(\)|_reap_editor_fifo_holders\(\)' \
            .github/workflows/implement.yml \
            scripts/review_apply_fixes.sh \
            scripts/validate_process.sh; then
            echo "::error::Inline stall-guard parsing helpers detected; use scripts/watchdog_helpers.sh"
            exit 1
          fi

          for f in \
            .github/workflows/implement.yml \
            scripts/review_apply_fixes.sh \
            scripts/validate_process.sh; do
            if ! grep -qE 'watchdog_helpers\.sh' "${f}"; then
              echo "::error file=${f}::Shared watchdog helper is not wired into this targeted runtime."
              exit 1
            fi
          done


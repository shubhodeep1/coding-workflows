---
name: CI

"on":
  pull_request:
    branches: [main, stable]
  push:
    branches: [main, stable]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python CI dependencies
        run: |
          set -euo pipefail
          python3 -m pip install yamllint coverage pyyaml jsonschema jinja2

      - name: YAML lint
        run: |
          set -euo pipefail
          # Expand globs via `nullglob` + array so an empty directory does
          # not pass a literal pattern to yamllint (which would fail).
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/actions/*/action.yml workflow-templates/*.yml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::No YAML files matched — skipping yamllint"
            exit 0
          fi
          yamllint -s "${files[@]}"

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          # Dogfood gate: actionlint catches GitHub Actions schema errors that
          # yamllint cannot (bad action refs, invalid contexts, unresolved
          # `uses:` targets, etc.). Pinned to a specific upstream release
          # with sha256 verification for supply-chain safety and reproducible
          # CI (no `bash <(curl ...)` or moving-target `latest` refs).
          cd /tmp
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSLf -o "${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          rm -f "${tarball}"
          actionlint -version

      - name: Actionlint — reusable workflows and consumer templates
        run: |
          set -euo pipefail
          # Lint every workflow file in this repo and every consumer template.
          # The internal-*.yml wrappers pin `uses:` to @main, so a PR that
          # breaks a reusable workflow body or a template schema will fail
          # this gate before it lands and starts breaking in-flight
          # orchestrator runs on feature branches.
          #
          # `-shellcheck=` disables actionlint's shellcheck integration over
          # inline `run:` blocks. Shell script static analysis is already
          # covered by the standalone `ShellCheck static analysis` step
          # further down in this job, which runs shellcheck on every
          # `scripts/*.sh` file. Enabling it here would surface ~30
          # pre-existing style/info/warning findings in unrelated reusable
          # workflow `run:` blocks that are out of scope for this gate.
          shopt -s nullglob
          files=(.github/workflows/*.yml workflow-templates/*.yml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::No workflow files matched — skipping actionlint"
            exit 0
          fi
          actionlint -shellcheck= "${files[@]}"

      - name: Python syntax check
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ai_memory.py
          python3 -m py_compile scripts/ai_memory_lib.py
          python3 -m py_compile scripts/ai_context_utils.py
          python3 -m py_compile scripts/issue_attachment_bundle.py
          python3 -m py_compile scripts/generate_symbol_diff_summary.py
          python3 -m py_compile scripts/orchestrate_lib.py
          python3 -m py_compile scripts/ai_labels.py
          python3 -m py_compile scripts/collect_workflow_logs.py
          python3 -m py_compile scripts/analyze_workflow_logs.py
          python3 -m py_compile scripts/semantic_cache.py
          python3 -m py_compile scripts/check_workflow_script_refs.py
          # Phase 4b smoke-test fixture (only run from
          # test-and-mark-stable.yml). py_compile catches syntax-level
          # breakage (parse errors, indentation) early in CI; it does
          # NOT exercise imports, so import-time errors (e.g. missing
          # pytest at runtime) still surface only when Phase 4b
          # actually runs the test on the smoke runner.
          python3 -m py_compile tests/test_e2e_editor_smoke_canary.py

      - name: Orchestrate lib unit tests
        run: |
          set -euo pipefail
          python3 tests/test_orchestrate_lib.py

      - name: Orchestrate poll process unit tests
        run: |
          set -euo pipefail
          python3 tests/test_orchestrate_poll_process.py

      - name: Merge probe unit tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_merge_probe.py

      - name: Overlap validation fallback unit tests
        run: |
          set -euo pipefail
          python3 tests/test_overlap_validation_fallback.py

      - name: Validate harness RPC health-check unit tests
        run: |
          set -euo pipefail
          python3 tests/test_validate_harness_rpc.py

      - name: Validation self-test unit tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validation_selftest_runner.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validation_selftest_status.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_nightly_validation_selftest_workflow_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validation_refresh_runner.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validation_refresh_workflow_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workflow_checkout_integration_ref_audit.py

      - name: Validation lint rule unit tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validate_lint_canary_ordering.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validate_lint_healthcheck_test_strings.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validate_lint_test_script_prologue.py

      - name: Validate process cross-cycle escalation unit tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validate_process_cross_cycle_escalation.py

      - name: Implement post-Codex recovery unit tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_implement_post_codex_recovery.py

      - name: Codex config writer contract tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_write_codex_config.py

      - name: Targeted file context contract tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_targeted_file_context.py

      - name: Review Semble contract test
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_semble_contract.py

      - name: Review autofix failure-log upload contract test
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_autofix_failure_log_upload.py

      - name: Review autofix smoke editor override contract test
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_autofix_smoke_editor_override.py

      - name: Review autofix smoke conflict-resolver override contract test
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_autofix_smoke_conflict_resolver_override.py

      - name: Review conflict-resolve smoke deterministic contract test
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_conflict_resolve_smoke_deterministic.py

      - name: Review apply-fixes smoke deterministic contract test
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_apply_fixes_smoke_deterministic.py

      - name: Review-blocked judge label propagation contract test
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_rb_judge_label_propagation.py

      - name: Summariser sandbox-mode pin contract test
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_summarize_reviewer_consensus_sandbox_pin.py

      - name: Clarify loop guard unit tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_clarify_loop_guard.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_ai_memory_processed_command_entry.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_plan_clarify_blocked_output.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_plan_auto_answer_recommended_parser.py

      - name: Update workflows guardrails contract test
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_update_workflows_guardrails.py

      - name: Audit gate template atomicity contract test
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_audit_gate_template_atomicity.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_audit_gate_identity.py

      - name: SessionStart hook repo-slug contract test
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_session_start_extract_repo_slug.py

      - name: AI label precreation contract test
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_ai_label_precreation_contract.py

      - name: Phase label transition and fallback contract tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_label_helpers_phase_transition_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_issue_pr_status_payload_fallback_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_autofix_phase_transition_contract.py

      - name: Test-and-mark-stable plan polling guard regression tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_test_and_mark_stable_plan_polling_guard.py

      - name: Mark-stable release-tag refspec contract test
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_mark_stable_release_tag_refspec_contract.py

      - name: Soft-error report consolidator unit tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_consolidate_soft_error_reports.py

      - name: UTF-8-safe Telegram truncation unit tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_truncate_to_utf8_byte_cap.py

      - name: Workflow log collector coverage gate
        run: |
          set -euo pipefail
          python3 -m coverage erase
          python3 -m coverage run tests/test_collect_workflow_logs.py
          python3 -m coverage report --include='scripts/collect_workflow_logs.py' --fail-under=45

      - name: Workflow log analyzer coverage gate
        run: |
          set -euo pipefail
          python3 -m coverage erase
          python3 -m coverage run tests/test_analyze_workflow_logs.py
          python3 -m coverage report --include='scripts/analyze_workflow_logs.py' --fail-under=67

      - name: JSON schema validation
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in schemas/*.json examples/*.json; do
            python3 -c "import json; json.load(open('$f'))" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done
          # Validate label contract
          python3 scripts/ai_labels.py contract-validate --contract-file .github/ai/label_contract.v1.json

      - name: Prompt files validation
        run: |
          set -euo pipefail
          for f in prompts/*.txt; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f is empty"
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done

      - name: Prompt-length budget (OpenAI guide alignment)
        run: |
          set -euo pipefail
          # Per the OpenAI gpt-5.4 prompt guide: "shorter, outcome-focused
          # prompts"; over-specification of process adds noise and narrows
          # the model's search space. Cap coder/repair paths at 200 lines
          # and reasoning/synthesis paths at 150. Hard-fails the build so
          # prompt bloat regressions are caught at PR time rather than
          # after merge.
          # mode-validate-generate.txt is an explicitly allowed deferred
          # exception — its 700+ lines of conditional procedure are slated
          # for sidecar extraction in a separate smoke-gated PR. Same for
          # the validate-fix-harness / validate-diagnose phase prompts.
          declare -A CAPS=(
            [prompts/mode-implement.txt]=200
            [prompts/mode-implement-repair.txt]=200
            [prompts/mode-implement-repair-syntax.txt]=200
            [prompts/mode-implement-diagnose.txt]=150
            [prompts/mode-clarify.txt]=150
            [prompts/mode-clarify-respond.txt]=200
            [prompts/mode-plan.txt]=150
            [prompts/mode-orchestrate.txt]=200
            [prompts/mode-judge.txt]=150
            [prompts/mode-orchestrate-poll-judge.txt]=150
            [prompts/mode-judge-review-blocked.txt]=200
            [prompts/mode-judge-stall-recovery.txt]=150
            [prompts/conflict-resolver.txt]=150
            [prompts/integration-sync-conflict-resolver.txt]=200
            [prompts/integration-sync-conflict-resolver-retry-prelude.txt]=100
            [prompts/review-consolidator.txt]=150
            [prompts/header.txt]=20
            [prompts/mode-validate-discover.txt]=80
            [prompts/mode-validate-self-heal.txt]=150
            [prompts/mode-workflow-analysis.txt]=150
            [prompts/mode-workflow-audit.txt]=200
            [prompts/mode-workflow-api-redundancy.txt]=150
          )
          # Deferred (smoke-gate-required): mode-validate-generate.txt,
          # mode-validate-fix-harness.txt, mode-validate-diagnose.txt.
          # These contain conditional procedure that must move to a
          # sidecar rule sheet (followup PR).
          fail=0
          for path in "${!CAPS[@]}"; do
            if [ -f "${path}" ]; then
              actual=$(wc -l < "${path}")
              cap="${CAPS[${path}]}"
              if [ "${actual}" -gt "${cap}" ]; then
                echo "::error::Prompt length budget exceeded: ${path} = ${actual} lines (cap ${cap}). Slim per OpenAI prompt guide."
                fail=1
              else
                echo "OK: ${path} = ${actual}/${cap} lines"
              fi
            fi
          done
          [ "${fail}" -eq 0 ] || exit 1

      - name: Prompt forbidden-token soft lint
        run: |
          set -euo pipefail
          # Per OpenAI prompt guide: "Don't use ALWAYS, NEVER, must, and
          # only for judgment calls. Reserve them for true invariants."
          # Soft lint — emits warnings, doesn't fail the build. Threshold
          # of 8 hits per file gives operators visibility into prompts
          # that are drifting back toward instruction-stack noise.
          for f in prompts/*.txt; do
            hits=$(grep -coE '\b(MANDATORY|FAILURE|NEVER|ALWAYS)\b' "${f}" || true)
            if [ "${hits}" -gt 8 ]; then
              echo "::warning file=${f}::High count of absolutist tokens (${hits}). Per OpenAI prompt guide, reserve MUST/NEVER/ALWAYS for true invariants."
            fi
          done

      - name: Shell script syntax check
        run: |
          set -euo pipefail
          for f in scripts/*.sh .claude/hooks/*.sh workflow-templates/.claude/hooks/*.sh; do
            bash -n "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Validate memory_helpers.sh exports memory_ensure_branch
        run: |
          set -euo pipefail
          bash -c 'source scripts/memory_helpers.sh && declare -F memory_ensure_branch >/dev/null' \
            && echo "OK: memory_ensure_branch is defined after sourcing scripts/memory_helpers.sh" \
            || { echo "FAIL: memory_ensure_branch not defined after sourcing scripts/memory_helpers.sh"; exit 1; }

      - name: ShellCheck static analysis
        run: |
          set -euo pipefail
          for f in scripts/*.sh .claude/hooks/*.sh workflow-templates/.claude/hooks/*.sh; do
            shellcheck --severity=error "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Python lint (ruff)
        run: |
          set -euo pipefail
          pip install -q ruff
          ruff check --select E,F --ignore E501 scripts/*.py

      - name: Semantic cache unit tests
        run: |
          set -euo pipefail
          python3 -m coverage erase
          python3 -m coverage run tests/test_semantic_cache.py
          python3 -m coverage report --include='scripts/semantic_cache.py' --fail-under=70

      - name: Script-workflow cross-reference
        # Canonical check used by both CI and the inline post-resolver
        # guard in review_autofix.yml.  Catches three reference patterns:
        # explicit `scripts/<name>.<ext>`, `${SUPPORT_SCRIPTS_DIR}/<name>`,
        # and bare names enumerated in bootstrap fetch loops.  See
        # scripts/check_workflow_script_refs.py for details.
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_workflow_script_refs.py

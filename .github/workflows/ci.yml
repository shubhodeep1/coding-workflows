---
name: CI

"on":
  # Pull-request CI runs for every base (issue #7283). A fix PR routed to a
  # failing PR's head branch (CI-triage routing, #6726 / #7042) then gets its
  # own `CI / lint` before it merges, like a sub-issue PR into
  # `orchestrator/project-*` (Q45). Push CI stays on main, stable and the
  # integration branches, so check-failure triage has a base-branch result
  # to compare a failing PR against (a green base means the failure is the
  # PR's own and is left to its autofix). Heal intake and budget-watch act
  # on main pushes only.
  pull_request:
    branches: ["**"]
  push:
    branches: [main, stable, "orchestrator/project-*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  static-checks:
    # The old single `lint` job ran every check in one runner and took
    # 40-45 minutes, with a 60-minute stopgap budget (#4706). The checks are
    # now split across parallel jobs (#4707), and the final `lint` job below
    # aggregates them into one status.
    #
    # Static checks: shell-block guards, YAML lint, drift check, actionlint,
    # Python syntax and ruff, schema/prompt checks, and ShellCheck. About
    # 2 minutes measured (1.4-1.9 in #4707's CI runs); 15 leaves room for a
    # cold runner. Since #7250 and #7334 it also runs test steps moved from
    # tests-heal-plan-and-validation, so that figure no longer covers the
    # whole job: re-measure it before moving more steps here. budget-watch
    # warns at 75% of the timeout (11m15s for this job).
    # It took 15m18s of its 15 minutes on main (run 38562929820, budget-watch
    # issue #7382), so "Regression tests wired by the CI wiring guard
    # (part 1)" was moved out to tests-release-and-log-analysis, and from there
    # on to tests-heal-plan-and-validation in #7406.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Shared shell-block anti-regression checks
        run: |
          set -euo pipefail

          ci_guard_report_failure() {
            local ci_guard_identifier="$1"
            local ci_guard_condition="$2"
            local ci_guard_file_path="$3"
            local ci_guard_line_number="$4"
            local ci_guard_expected_policy="$5"
            local ci_guard_scanned_file_set="$6"
            printf '::error::CI_GUARD_FAILURE guard=%s check=%s file=%s line=%s expected=%s scanned_files=%s\n' \
              "${ci_guard_identifier}" \
              "${ci_guard_condition}" \
              "${ci_guard_file_path}" \
              "${ci_guard_line_number}" \
              "${ci_guard_expected_policy}" \
              "${ci_guard_scanned_file_set}"
          }

          ci_guard_codex_files=(
            .github/workflows/clarify.yml
            .github/workflows/plan.yml
            .github/workflows/implement.yml
            .github/workflows/review_autofix.yml
            scripts/validate_process.sh
          )
          ci_guard_codex_scanned="$(IFS=,; echo "${ci_guard_codex_files[*]}")"
          ci_guard_failure_count=0
          # Use ubiquitous grep instead of ripgrep so this gate does not
          # fail on runner images that omit `rg`.
          for ci_guard_file in "${ci_guard_codex_files[@]}"; do
            while IFS= read -r ci_guard_line; do
              ci_guard_report_failure \
                "codex-config-shared-helper" \
                "forbidden-inline-config-assembly" \
                "${ci_guard_file}" \
                "${ci_guard_line}" \
                "scripts/codex_helpers.sh:codex_config_assemble" \
                "${ci_guard_codex_scanned}"
              ci_guard_failure_count=$((ci_guard_failure_count + 1))
            done < <(
              grep -nE 'bash ("\$\{[^}]+\}/|scripts/)?write_codex_config\.sh|WRITE_CODEX_CONFIG=' \
                "${ci_guard_file}" | cut -d: -f1 || true
            )
          done
          if [ "${ci_guard_failure_count}" -ne 0 ]; then
            exit 1
          fi

          ci_guard_required_codex_files=(
            .github/workflows/clarify.yml
            .github/workflows/plan.yml
            .github/workflows/implement.yml
            scripts/validate_process.sh
          )
          ci_guard_required_codex_scanned="$(IFS=,; echo "${ci_guard_required_codex_files[*]}")"
          for ci_guard_file in "${ci_guard_required_codex_files[@]}"; do
            if ! grep -q 'codex_config_assemble' "${ci_guard_file}"; then
              ci_guard_report_failure \
                "codex-config-shared-helper" \
                "required-helper-missing" \
                "${ci_guard_file}" \
                "none" \
                "codex_config_assemble" \
                "${ci_guard_required_codex_scanned}"
              exit 1
            fi
          done

          ci_guard_review_file=.github/workflows/review_autofix.yml
          ci_guard_review_scanned="${ci_guard_review_file}"
          if grep -q 'codex_config_assemble' .github/workflows/review_autofix.yml; then
            while IFS= read -r ci_guard_line; do
              ci_guard_report_failure \
                "opencode-only-review" \
                "forbidden-codex-config-assembly" \
                "${ci_guard_review_file}" \
                "${ci_guard_line}" \
                "OpenCode-only-review-without-codex_config_assemble" \
                "${ci_guard_review_scanned}"
            done < <(grep -n 'codex_config_assemble' "${ci_guard_review_file}" | cut -d: -f1 || true)
            exit 1
          fi

          ci_guard_memory_files=(
            .github/workflows/clarify.yml
            .github/workflows/plan.yml
            .github/workflows/implement.yml
            .github/workflows/validate.yml
            .github/workflows/review_autofix.yml
          )
          ci_guard_memory_scanned="$(IFS=,; echo "${ci_guard_memory_files[*]}")"
          for ci_guard_file in "${ci_guard_memory_files[@]}"; do
            if ! grep -q 'memory_bootstrap' "${ci_guard_file}"; then
              ci_guard_report_failure \
                "memory-bootstrap-shared-helper" \
                "required-helper-missing" \
                "${ci_guard_file}" \
                "none" \
                "memory_bootstrap" \
                "${ci_guard_memory_scanned}"
              exit 1
            fi
          done

          ci_guard_telegram_files=(
            .github/workflows/clarify.yml
            .github/workflows/plan.yml
            .github/workflows/implement.yml
            .github/workflows/review_autofix.yml
          )
          ci_guard_telegram_scanned="$(IFS=,; echo "${ci_guard_telegram_files[*]}")"
          for ci_guard_file in "${ci_guard_telegram_files[@]}"; do
            if ! grep -q 'tg_send_phase_failure' "${ci_guard_file}"; then
              ci_guard_report_failure \
                "telegram-failure-shared-helper" \
                "required-helper-missing" \
                "${ci_guard_file}" \
                "none" \
                "tg_send_phase_failure" \
                "${ci_guard_telegram_scanned}"
              exit 1
            fi
          done

          ci_guard_watchdog_files=(
            .github/workflows/implement.yml
            scripts/review_apply_fixes.sh
            scripts/validate_process.sh
          )
          ci_guard_watchdog_scanned="$(IFS=,; echo "${ci_guard_watchdog_files[*]}")"
          ci_guard_failure_count=0
          for ci_guard_file in "${ci_guard_watchdog_files[@]}"; do
            while IFS= read -r ci_guard_line; do
              ci_guard_report_failure \
                "watchdog-shared-helper" \
                "forbidden-inline-stall-parser" \
                "${ci_guard_file}" \
                "${ci_guard_line}" \
                "scripts/watchdog_helpers.sh" \
                "${ci_guard_watchdog_scanned}"
              ci_guard_failure_count=$((ci_guard_failure_count + 1))
            done < <(
              grep -nE 'read_codex_stall_guard_state\(\)|read_validate_codex_stall_guard_state\(\)|codex_stall_guard_kill_detected\(\)|resolve_editor_network_probe_pid\(\)|_reap_editor_fifo_holders\(\)' \
                "${ci_guard_file}" | cut -d: -f1 || true
            )
          done
          if [ "${ci_guard_failure_count}" -ne 0 ]; then
            exit 1
          fi

          for ci_guard_file in "${ci_guard_watchdog_files[@]}"; do
            if ! grep -qE 'watchdog_helpers\.sh' "${ci_guard_file}"; then
              ci_guard_report_failure \
                "watchdog-shared-helper" \
                "required-helper-missing" \
                "${ci_guard_file}" \
                "none" \
                "watchdog_helpers.sh" \
                "${ci_guard_watchdog_scanned}"
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python CI dependencies
        run: |
          set -euo pipefail
          python3 -m pip install yamllint coverage pyyaml jsonschema jinja2 pytest ruff

      - name: Shared shell-block anti-regression contract tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_ci_shared_shell_block_guard.py

      - name: CI job split contract tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_ci_job_split_contract.py

      - name: CI test wiring guard
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider tests/test_ci_wires_every_test_file.py

      - name: YAML lint
        run: |
          set -euo pipefail
          # Expand globs via `nullglob` + array so an empty directory does
          # not pass a literal pattern to yamllint (which would fail).
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/actions/*/action.yml workflow-templates/*.yml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::No YAML files matched — skipping yamllint"
            exit 0
          fi
          yamllint -s "${files[@]}"

      - name: Drift check (generated docs)
        run: |
          set -euo pipefail
          make generate-check

      # CLAUDE.md §30: every pending agents.d/ fragment must fold into
      # agents.md; the release job would otherwise skip it with a warning.
      - name: agents.d fragment check and tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/assemble_agents.py check --repo-root .
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider tests/test_assemble_agents.py tests/test_agents_fragment_contract.py tests/test_check_agents_md_direct_edits.py

      # CLAUDE.md §30 (Q68): a pull request may not add documentation to
      # agents.md directly. Direct additions are what made orchestrator
      # integration branches conflict with main there (#6902's final PR).
      # The merge commit is compared with its first parent (the base tip it
      # was built on). A project's final PR (head orchestrator/project-*) is
      # skipped: its sub-issue PRs were checked when they targeted the
      # integration branch. A forward-merge fallback PR
      # (auto/forward-merge-stable-*) is skipped too: it carries the release
      # fold's generated agents.md text. Both skips apply only to a
      # same-repository head targeting the default branch, so a branch name
      # alone does not exempt an ordinary PR.
      - name: agents.md direct-edit check (CLAUDE.md §30)
        if: github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == github.event.repository.default_branch && (startsWith(github.head_ref, 'orchestrator/project-') || startsWith(github.head_ref, 'auto/forward-merge-stable-')))
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin "${GITHUB_SHA}"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_agents_md_direct_edits.py \
            --base "$(git rev-parse "${GITHUB_SHA}^1")" --head "${GITHUB_SHA}"

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          # Dogfood gate: actionlint catches GitHub Actions schema errors that
          # yamllint cannot (bad action refs, invalid contexts, unresolved
          # `uses:` targets, etc.). Pinned to a specific upstream release
          # with sha256 verification for supply-chain safety and reproducible
          # CI (no `bash <(curl ...)` or moving-target `latest` refs).
          cd /tmp
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # Bounded retries cover transient 5xx and connection resets (CI run
          # 35615284953 failed on an HTTP 504 here). `--retry-delay 0` keeps
          # curl's built-in exponential backoff; the sha256 check below still
          # guards integrity.
          curl -sSLf --retry 3 --retry-all-errors --retry-delay 0 \
            --connect-timeout 20 --max-time 120 -o "${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          rm -f "${tarball}"
          actionlint -version

      - name: Actionlint — reusable workflows and consumer templates
        run: |
          set -euo pipefail
          # Lint every workflow file in this repo and every consumer template.
          # The internal-*.yml wrappers pin `uses:` to @main, so a PR that
          # breaks a reusable workflow body or a template schema will fail
          # this gate before it lands and starts breaking in-flight
          # orchestrator runs on feature branches.
          #
          # `-shellcheck=` disables actionlint's shellcheck integration over
          # inline `run:` blocks. Shell script static analysis is already
          # covered by the standalone `ShellCheck static analysis` step
          # further down in this job, which runs shellcheck on every
          # `scripts/*.sh` file. Enabling it here would surface ~30
          # pre-existing style/info/warning findings in unrelated reusable
          # workflow `run:` blocks that are out of scope for this gate.
          shopt -s nullglob
          files=(.github/workflows/*.yml workflow-templates/*.yml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::No workflow files matched — skipping actionlint"
            exit 0
          fi
          actionlint -shellcheck= "${files[@]}"

      - name: Python syntax check
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/emit_event.py
          python3 -m py_compile scripts/ai_memory.py
          python3 -m py_compile scripts/ai_memory_lib.py
          python3 -m py_compile scripts/ai_context_utils.py
          python3 -m py_compile scripts/issue_attachment_bundle.py
          python3 -m py_compile scripts/generate_symbol_diff_summary.py
          python3 -m py_compile scripts/orchestrate_lib.py
          python3 -m py_compile scripts/task_state.py
          python3 -m py_compile scripts/ai_labels.py
          python3 -m py_compile scripts/collect_workflow_logs.py
          python3 -m py_compile scripts/analyze_workflow_logs.py
          python3 -m py_compile scripts/render_scenario_trace.py
          python3 -m py_compile scripts/workflow_retro.py
          python3 -m py_compile scripts/semantic_cache.py
          python3 -m py_compile scripts/check_workflow_script_refs.py
          python3 -m py_compile scripts/workflow_failure_heal.py
          # Phase 4b smoke-test fixture (only run from
          # test-and-mark-stable.yml). py_compile catches syntax-level
          # breakage (parse errors, indentation) early in CI; it does
          # NOT exercise imports, so import-time errors (e.g. missing
          # pytest at runtime) still surface only when Phase 4b
          # actually runs the test on the smoke runner.
          python3 -m py_compile tests/test_e2e_editor_smoke_canary.py

      - name: Python lint (ruff)
        run: |
          set -euo pipefail
          ruff check --select E,F --ignore E501 scripts/*.py

      - name: JSON schema validation
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in schemas/*.json examples/*.json; do
            python3 -c "import json; json.load(open('$f'))" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done
          # Validate label contract
          python3 scripts/ai_labels.py contract-validate --contract-file .github/ai/label_contract.v1.json

      - name: Prompt files validation
        run: |
          set -euo pipefail
          for f in prompts/*.txt; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f is empty"
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done

      - name: Prompt tier budget
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/prompt_size_budget.py

      - name: Prompt forbidden-token soft lint
        run: |
          set -euo pipefail
          # Per OpenAI prompt guide: "Don't use ALWAYS, NEVER, must, and
          # only for judgment calls. Reserve them for true invariants."
          # Soft lint — emits warnings, doesn't fail the build. Threshold
          # of 8 hits per file gives operators visibility into prompts
          # that are drifting back toward instruction-stack noise.
          for f in prompts/*.txt; do
            hits=$(grep -coE '\b(MANDATORY|FAILURE|NEVER|ALWAYS)\b' "${f}" || true)
            if [ "${hits}" -gt 8 ]; then
              echo "::warning file=${f}::High count of absolutist tokens (${hits}). Per OpenAI prompt guide, reserve MUST/NEVER/ALWAYS for true invariants."
            fi
          done

      - name: Shell script syntax check
        run: |
          set -euo pipefail
          for f in scripts/*.sh .claude/hooks/*.sh workflow-templates/.claude/hooks/*.sh; do
            bash -n "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Validate memory_helpers.sh exports memory helpers
        run: |
          set -euo pipefail
          bash -c 'source scripts/memory_helpers.sh && declare -F memory_ensure_branch >/dev/null && declare -F memory_bootstrap >/dev/null' \
            && echo "OK: memory_ensure_branch and memory_bootstrap are defined after sourcing scripts/memory_helpers.sh" \
            || { echo "FAIL: memory_ensure_branch and/or memory_bootstrap not defined after sourcing scripts/memory_helpers.sh"; exit 1; }

      - name: ShellCheck static analysis
        run: |
          set -euo pipefail
          # Issue #6680: ShellCheck 0.9.x (the runner image's copy) always runs
          # its dataflow analysis, which takes the runner down on
          # scripts/orchestrate_poll_process.sh. ShellCheck 0.10+ honours that
          # file's `# shellcheck extended-analysis=false` directive, so pin it.
          # A failed install keeps the runner's copy with a warning.
          sc=shellcheck
          if python3 -m pip install --quiet 'shellcheck-py==0.10.0.1'; then
            sc_dir="$(python3 -c 'import sysconfig; print(sysconfig.get_path("scripts"))')" || sc_dir=""
            if [ -x "${sc_dir}/shellcheck" ]; then
              sc="${sc_dir}/shellcheck"
            else
              echo "::warning::ShellCheck 0.10.0.1 installed but ${sc_dir:-<unknown>}/shellcheck is missing; using $(command -v shellcheck || echo 'no shellcheck')."
            fi
          else
            echo "::warning::Could not install ShellCheck 0.10.0.1; using $(command -v shellcheck || echo 'no shellcheck')."
          fi
          "${sc}" --version
          for f in scripts/*.sh .claude/hooks/*.sh workflow-templates/.claude/hooks/*.sh; do
            "${sc}" --severity=error "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Script-workflow cross-reference
        # Canonical check used by both CI and the inline post-resolver
        # guard in review_autofix.yml.  Catches three reference patterns:
        # explicit `scripts/<name>.<ext>`, `${SUPPORT_SCRIPTS_DIR}/<name>`,
        # and bare names enumerated in bootstrap fetch loops.  See
        # scripts/check_workflow_script_refs.py for details.
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_workflow_script_refs.py

      # Moved from tests-heal-plan-and-validation, which measured 15m08s of
      # its 20 minutes on main (run 38222993326, issue #7250); static-checks
      # measured about 2 minutes. Step names and bodies are unchanged.
      # "Regression tests wired by the CI wiring guard (part 1)", moved here
      # with it, moved on to tests-release-and-log-analysis in #7382 and is in
      # tests-heal-plan-and-validation since #7406.
      - name: Implement post-Codex recovery unit tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_implement_post_codex_recovery.py

      # Moved from tests-heal-plan-and-validation, which measured 15m04s of
      # its 20 minutes on main (run 38481381592, issue #7334). Per-step
      # timings for that run were not available when these steps were
      # chosen. Step names and bodies are unchanged.
      - name: Validation self-test unit tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validation_selftest_runner.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validation_selftest_status.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_nightly_validation_selftest_workflow_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validation_refresh_runner.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validation_discovery_bootstrap.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validation_refresh_workflow_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workflow_checkout_integration_ref_audit.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider tests/test_resolve_integration_ref_ci_triage.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_drift_audit_job.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_security_audit_workflow_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider tests/test_security_audit_upstream_report.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_security_audit_prompt_policy.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_audit_consumer_drift.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_fingerprint_quarantine.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_review_conflict_resolve_retry_state.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider tests/test_touched_set_symlink_aware.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_consumer_artifact_cleanup_preserves_tracked.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_verify_integration_fingerprints_tiers.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_verify_integration_fingerprints_post_capture_evolution.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_verify_integration_fingerprints_resolver_union.py

      - name: Validation bootstrap and family direct-run tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_validate_workflow_validate_bootstrap.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_codex_thread_reuse_core.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_codex_skip_git_repo_check_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_codex_stall_guard_scripts.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workspace_init.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workspace_safety_check.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workspace_hooks.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workspace_cache_maintenance.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_family_node_runtime.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_poll_workflow_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workflow_overlay_orchestrator.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_workflow_overlay_core.py

  tests-hooks-and-orchestrator:
    # Unit and contract tests, a contiguous slice of the old `lint` job's
    # step order. Each test job measured 2-8 minutes (#4707); 20 leaves
    # room for a cold runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare template-only PR live copies for parity tests
        if: >-
          (github.event_name == 'pull_request' && github.base_ref != 'stable') ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/orchestrator/project-'))
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          # Live copies are synced only after a push to main, so an
          # orchestrator integration branch can carry template changes that
          # earlier sub-issue PRs merged. The sync's drift recovery copies
          # those too (template committed after its live copy), but only
          # when --before is a reachable commit: the script skips an empty,
          # all-zero or unreachable one. A push has no PR base, so it passes
          # its own before; a branch-creation or force push falls back to
          # the merge-base with main. Pull-request CI runs for every base
          # since #7283, so a fix PR routed to a failing PR's ai/issue-* head
          # is prepared too; only PRs into stable check the committed tree.
          before="${PR_BASE_SHA:-${PUSH_BEFORE_SHA}}"
          if [ -z "${before//0/}" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            fallback="$(git merge-base HEAD origin/main 2>/dev/null || true)"
            echo "::warning::Template parity preparation: before=${before:-empty} is not a reachable commit; using merge-base with main (${fallback:-unavailable})."
            before="${fallback}"
          fi
          python3 scripts/sync_claude_live_copies.py sync --dry-run --before "${before}" --after HEAD --keep-committed-security-paths


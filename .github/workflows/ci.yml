          set -euo pipefail
          npm ci --no-audit --no-fund
          npx vitest run

  orchestrate-poll:
    # tests/test_orchestrate_poll_process.py was the old job's critical path
    # (about 20 minutes on 4 local shards). Each matrix group runs one
    # quarter of it on CI_POLL_TEST_SHARDS local shards, about 5 minutes
    # measured (#4707); 20 leaves room for a cold runner, whose shards can
    # be slower than a warm one's.
    runs-on: ubuntu-latest
    strategy:
      # Every group reports on its own; `lint` fails if any of them fails.
      fail-fast: false
      matrix:
        poll-group: [0, 1, 2, 3]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python CI dependencies
        run: |
          set -euo pipefail
          python3 -m pip install yamllint coverage pyyaml jsonschema jinja2 pytest ruff

      - name: Derive orchestrate poll test subsets
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import ast
          from pathlib import Path

          module = ast.parse(
              Path("tests/test_orchestrate_poll_process.py").read_text(encoding="utf-8")
          )
          tests = [
              node.name
              for node in module.body
              if isinstance(node, ast.FunctionDef) and node.name.startswith("test_")
          ]
          tests.sort()

          fast_fail = [name for name in tests if name.startswith("test_implementation_failed_")]
          if not fast_fail:
              raise SystemExit("No implementation-failed orchestrate-poll regression tests found")

          fast_fail_set = set(fast_fail)
          remaining = [name for name in tests if name not in fast_fail_set]
          if not remaining:
              raise SystemExit(
                  "Fast-fail selection unexpectedly captured the entire orchestrate-poll test module"
              )

          Path("/tmp/orchestrate_poll_fast_fail_tests.txt").write_text("\n".join(fast_fail) + "\n")
          Path("/tmp/orchestrate_poll_remaining_tests.txt").write_text("\n".join(remaining) + "\n")
          PY

      - name: Orchestrate poll implementation-failed regression fast-fail
        # The fast-fail subset is not part of the group split; run it once.
        if: strategy.job-index == 0
        run: |
          set -euo pipefail
          mapfile -t selected_tests < /tmp/orchestrate_poll_fast_fail_tests.txt
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_poll_process.py "${selected_tests[@]}"

      - name: Orchestrate poll process unit tests
        env:
          CI_POLL_TEST_SHARDS: ${{ vars.CI_POLL_TEST_SHARDS || '4' }}
          CI_POLL_TEST_GROUP_INDEX: ${{ strategy.job-index }}
          CI_POLL_TEST_GROUP_COUNT: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          # The fast-fail step already covers the implementation-failed hot path;
          # keep the rest of this module in CI without re-running that subset.
          #
          # This module is the CI critical path. Most of the 307 tests in the
          # post-fast-fail sharded subset spawn the real poller as a bash
          # subprocess inside a throwaway sandbox, so they cost seconds each
          # rather than milliseconds (measured: 71 of the
          # first 95 over 4s, slowest 27s). Run sequentially it took ~35 min on
          # a 4-core box, which on its own overran the job budget and left every
          # CI run cancelled mid-suite.
          #
          # Each test allocates its own tempdir sandbox in _make_poller_sandbox,
          # so the module shards with no shared state; measured 3.6x on 4 cores
          # (62s -> 17s on a 16-test slice, all shards green). The runner already
          # takes test names as argv, so no harness change is needed.
          #
          # Two levels (#4707): the `orchestrate-poll` matrix first takes group
          # CI_POLL_TEST_GROUP_INDEX of CI_POLL_TEST_GROUP_COUNT, then shards that
          # group across CI_POLL_TEST_SHARDS local workers. Both splits are the
          # same `NR % total == n` partition, so every test runs exactly once.
          shards="${CI_POLL_TEST_SHARDS:-4}"
          if ! [ "${shards}" -ge 1 ] 2>/dev/null; then
            echo "::warning::CI_POLL_TEST_SHARDS='${shards}' is not a positive integer; falling back to 1 (sequential)."
            shards=1
          fi

          poll_group="${CI_POLL_TEST_GROUP_INDEX:-0}"
          poll_groups="${CI_POLL_TEST_GROUP_COUNT:-1}"
          # A bad group index would silently skip a slice of the module, so
          # fail instead of falling back.
          if ! [ "${poll_groups}" -ge 1 ] 2>/dev/null \
            || ! [ "${poll_group}" -ge 0 ] 2>/dev/null \
            || [ "${poll_group}" -ge "${poll_groups}" ]; then
            echo "::error::Invalid orchestrate-poll group '${poll_group}' of '${poll_groups}'."
            exit 1
          fi

          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_ci_poll_test_sharding.py

          awk -v n="${poll_group}" -v total="${poll_groups}" 'NR % total == n' \
            /tmp/orchestrate_poll_remaining_tests.txt > /tmp/orchestrate_poll_group_tests.txt
          echo "orchestrate-poll group ${poll_group} of ${poll_groups}: $(wc -l < /tmp/orchestrate_poll_group_tests.txt | tr -d '[:space:]') tests"

          rm -f /tmp/poll_shard_*.txt /tmp/poll_shard_*.log /tmp/poll_shard_*.rc
          shard_pids=()
          for shard in $(seq 0 "$((shards - 1))"); do
            awk -v n="${shard}" -v total="${shards}" 'NR % total == n' \
              /tmp/orchestrate_poll_group_tests.txt > "/tmp/poll_shard_${shard}.txt"
            [ -s "/tmp/poll_shard_${shard}.txt" ] || continue
            (
              mapfile -t shard_tests < "/tmp/poll_shard_${shard}.txt"
              set +e
              PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_poll_process.py \
                "${shard_tests[@]}" > "/tmp/poll_shard_${shard}.log" 2>&1
              echo "$?" > "/tmp/poll_shard_${shard}.rc"
            ) &
            shard_pids+=("$!")
          done

          # Reap every shard before judging any of them, so one early failure
          # cannot leave siblings orphaned on the runner.
          for shard_pid in "${shard_pids[@]}"; do
            wait "${shard_pid}" || true
          done

          # Each failed shard's failing tests are repeated after the loop (#6888).
          # The shard logs above sit in collapsed groups, so in run 37907017153 the
          # job tail showed only the last shard's "33 passed", not shard 1's failure.
          shard_failures=0
          shard_failure_lines=()
          # One line per failed shard, printed after the loop (outside every
          # ::group::) so the failing test names reach the log tail and the
          # job annotations (#6889). Only names matching [A-Za-z0-9_] are
          # printed, so test output cannot inject workflow commands here.
          shard_failure_summaries=()
          failed_shard_ids=()
          for shard in $(seq 0 "$((shards - 1))"); do
            [ -s "/tmp/poll_shard_${shard}.txt" ] || continue
            # A shard with tests but no log died before its runner started, so
            # its tests never ran: count it as failed instead of skipping it.
            if [ ! -f "/tmp/poll_shard_${shard}.log" ]; then
              echo "::error::orchestrate-poll shard ${shard} produced no log; its tests did not run"
              shard_failures=$((shard_failures + 1))
              shard_failure_lines+=("shard ${shard}: no log recorded, its tests did not run")
              shard_failure_summaries+=("orchestrate-poll shard ${shard} exit none failed tests: no log (tests did not run)")
              failed_shard_ids+=("${shard}")
              continue
            fi
            echo "::group::orchestrate-poll shard ${shard} ($(wc -l < "/tmp/poll_shard_${shard}.txt" | tr -d '[:space:]') tests)"
            cat "/tmp/poll_shard_${shard}.log"
            echo "::endgroup::"
            # A missing .rc means the subshell died before recording one; treat
            # that as a failure rather than silently passing the shard.
            shard_rc="$(cat "/tmp/poll_shard_${shard}.rc" 2>/dev/null || echo 1)"
            case "${shard_rc}" in
              ''|*[!0-9]*) shard_rc=1 ;;
            esac
            if [ "${shard_rc}" -ne 0 ]; then
              echo "::error::orchestrate-poll shard ${shard} failed (exit ${shard_rc})"
              # Name the failing tests in annotations (#6885): the per-shard
              # log above sits inside a ::group:: that triage cannot read.
              # Match the runner's exact "  FAIL  <name>: ..." prefix, cap at
              # 20 lines, and escape workflow-command data. Without a FAIL
              # line (interrupted shard), print the log tail with a prefix so
              # log text can never start a workflow command.
              mapfile -t shard_fail_lines < <(grep -a -E '^  FAIL  ' "/tmp/poll_shard_${shard}.log" | head -n 20 || true)
              if [ "${#shard_fail_lines[@]}" -gt 0 ]; then
                for shard_fail_line in "${shard_fail_lines[@]}"; do
                  shard_fail_line="${shard_fail_line//%/%25}"
                  shard_fail_line="${shard_fail_line//$'\r'/%0D}"
                  shard_fail_line="${shard_fail_line//$'\n'/%0A}"
                  echo "::error::orchestrate-poll shard ${shard}: ${shard_fail_line#  }"
                done
              else
                echo "::error::orchestrate-poll shard ${shard} had no FAIL line; last log lines follow"
                while IFS= read -r shard_tail_line || [ -n "${shard_tail_line}" ]; do
                  echo "orchestrate-poll shard ${shard} | ${shard_tail_line}"
                done < <(tail -n 20 "/tmp/poll_shard_${shard}.log" || true)
              fi
              shard_failures=$((shard_failures + 1))
              # Prefer the runner's FAIL line (it carries the exception); fall back
              # to its "complete" fail events; else say no failure was recorded.
              # Every match is kept so the "... and <k> more" count below is exact.
              # `-a`: a NUL byte in the log must not turn the matches into grep's
              # "Binary file ... matches" line.
              mapfile -t shard_fail_matches < <(grep -a -E '^[[:space:]]*FAIL[[:space:]]' "/tmp/poll_shard_${shard}.log" 2>/dev/null || true)
              if [ "${#shard_fail_matches[@]}" -eq 0 ]; then
                mapfile -t shard_fail_matches < <(grep -a -E '^TEST_CASE_EVENT: .*"event":"complete"' "/tmp/poll_shard_${shard}.log" 2>/dev/null | grep -a -F '"status":"fail"' || true)
              fi
              if [ "${#shard_fail_matches[@]}" -eq 0 ]; then
                shard_failure_lines+=("shard ${shard}: exit ${shard_rc}, no FAIL line recorded (runner likely died)")
              else
                for shard_fail_match in "${shard_fail_matches[@]}"; do
                  shard_failure_lines+=("shard ${shard}: ${shard_fail_match#"${shard_fail_match%%[![:space:]]*}"}")
                done
              fi
              # `|| true`: under pipefail a grep with no match would abort the
              # step before the tally below.
              shard_failed_names="$(grep -a -E '^  FAIL  [A-Za-z0-9_]+:' "/tmp/poll_shard_${shard}.log" \
                | sed -E 's/^  FAIL  ([A-Za-z0-9_]+):.*/\1/' | awk '!seen[$0]++' || true)"
              if [ -z "${shard_failed_names}" ]; then
                shard_failed_list="no FAIL lines (process failure)"
              else
                shard_failed_count="$(printf '%s\n' "${shard_failed_names}" | wc -l | tr -d '[:space:]')"
                shard_failed_list="$(printf '%s\n' "${shard_failed_names}" | head -n 20 | paste -sd ',' - | sed 's/,/, /g')"
                if [ "${shard_failed_count}" -gt 20 ]; then
                  shard_failed_list="${shard_failed_list} (+$((shard_failed_count - 20)) more)"
                fi
              fi
              shard_failure_summaries+=("orchestrate-poll shard ${shard} exit ${shard_rc} failed tests: ${shard_failed_list}")
              failed_shard_ids+=("${shard}")
            fi
          done
          if [ "${shard_failures}" -ne 0 ]; then
            # Issue #6946 (triage of PR #6940): each shard log above sits in a
            # collapsed group, so the log tail showed only the last shard's
            # passing summary and never the failing test. Repeat each failed
            # shard's FAIL lines and log tail here, after the last group.
            # Copied log lines are prefixed so they cannot act as workflow
            # commands; the annotation carries only [A-Za-z0-9_] test names.
            echo "orchestrate-poll failed-shard summary (full shard logs are in the groups above):"
            for failed_shard in "${failed_shard_ids[@]}"; do
              failed_shard_log="/tmp/poll_shard_${failed_shard}.log"
              if [ ! -f "${failed_shard_log}" ]; then
                echo "  shard ${failed_shard}: no log; its tests did not run"
                continue
              fi
              failed_test_names="$({ grep -a -m 10 -E '^  FAIL  [A-Za-z0-9_]+:' "${failed_shard_log}" || true; } \
                | sed -E 's/^  FAIL  ([A-Za-z0-9_]+):.*/\1/' | tr '\n' ' ')"
              if [ -n "${failed_test_names// /}" ]; then
                echo "::error::orchestrate-poll shard ${failed_shard} failing tests: ${failed_test_names% }"
              fi
              echo "  shard ${failed_shard}: FAIL lines (first 50):"
              { grep -a -m 50 -E '^  FAIL  ' "${failed_shard_log}" || true; } | sed 's/^/    | /'
              echo "  shard ${failed_shard}: last 20 log lines:"
              tail -n 20 "${failed_shard_log}" | sed 's/^/    | /'
            done
            # At most 20 annotations; CR removed, cut to 400 characters, then "%"
            # escaped so a test message cannot break the annotation syntax.
            shard_failure_shown=0
            for shard_failure_line in "${shard_failure_lines[@]}"; do
              if [ "${shard_failure_shown}" -ge 20 ]; then
                break
              fi
              shard_failure_line="${shard_failure_line//$'\r'/}"
              shard_failure_line="${shard_failure_line:0:400}"
              shard_failure_line="${shard_failure_line//\%/%25}"
              echo "::error::orchestrate-poll failing test: ${shard_failure_line}"
              shard_failure_shown=$((shard_failure_shown + 1))
            done
            if [ "${#shard_failure_lines[@]}" -gt 20 ]; then
              echo "::error::orchestrate-poll failing test: ... and $(( ${#shard_failure_lines[@]} - 20 )) more (see the shard groups above)"
            fi
            for shard_failure_summary in "${shard_failure_summaries[@]}"; do
              echo "::error::${shard_failure_summary}"
            done
            echo "::error::${shard_failures} orchestrate-poll shard(s) failed."
            exit 1
          fi

          # The single-file modules are not split; group 0 runs them once.
          if [ "${poll_group}" -eq 0 ]; then
            PYTHONDONTWRITEBYTECODE=1 python3 tests/test_orchestrate_poll_noop_suspicious_recovery.py
            PYTHONDONTWRITEBYTECODE=1 python3 tests/test_state_snapshot.py
            PYTHONDONTWRITEBYTECODE=1 python3 tests/test_run_substate_ledger.py
          fi

      # Moved from tests-heal-plan-and-validation, which took 15m26s of its 20
      # minutes on main (run 39230958248, budget-watch issue #7690). That run's
      # step timings were not readable, so the steps were chosen by timing each
      # step body of that job in the implement sandbox (relative weights only;
      # PyYAML was missing there, so yaml-dependent modules errored and the
      # sharded heal step stopped early):
      # this step (CI wiring guard part 2) 37.2s, the unblock step 28.2s,
      # CI wiring guard part 1 25.2s, clarify loop guard 20.0s,
      # every other step 3s or less. Each test job has recorded about 15
      # minutes or more within weeks (#7366, #7406, #7560, #7575, #7576,
      # #7677), while poll groups record about 5 minutes (#4707). Group 0
      # carries the fast-fail subset and the single-file modules and group 1
      # then carried the merge-train step (moved out in #7766), so this step
      # runs in group 2 only, once per CI run. It needs only checkout, Python 3.12 and the shared pip install,
      # which this job already has. Name and body unchanged.
      - name: Regression tests wired by the CI wiring guard (part 2)
        if: strategy.job-index == 2
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider \
            tests/test_ai_memory_sync_reference_files.py \
            tests/test_ai_memory_workflow_log_analysis_cache.py \
            tests/test_assemble_changelog.py \
            tests/test_branch_rebuild_threshold_decision_log.py \
            tests/test_changelog_fragment_contract.py \
            tests/test_check_workflow_script_refs.py \
            tests/test_ci_actionlint_install_retry.py \
            tests/test_codex_heartbeat.py \
            tests/test_codex_isolated_exec_claude_contract.py \
            tests/test_cost_audit_serena_metrics.py \
            tests/test_gh_helpers_list_runs_method.py \
            tests/test_implement_prompt_pinned_sha_contract.py \
            tests/test_memory_helpers_fail_open_telemetry.py \
            tests/test_plan_reuse_audit_contract.py \
            tests/test_plan_template_owned_path_guard.py \
            tests/test_plan_superseded_merged_pr.py \
            tests/test_plan_superseded_merged_pr_workflow.py \
            tests/test_pytest_git_env_isolation.py \
            tests/test_render_validation_templates.py \
            tests/test_render_validation_templates_repo_checks.py \
            tests/test_render_validation_templates_shell_quoting.py \
            tests/test_retrigger_default_branch_dispatch.py \
            tests/test_review_autofix_reasoning_schedule.py \
            tests/test_review_autofix_sweep_merge_queued_skip.py \
            tests/test_review_commit_changelog_fragment_preserved.py \
            tests/test_review_conflict_prepare_state_author.py \
            tests/test_review_floor_rules.py \
            tests/test_review_host_python_safe_path.py \
            tests/test_review_issue_ledger.py \
            tests/test_review_ledger_cache_path_stability.py \
            tests/test_review_rb_judge_reference_staging.py \
            tests/test_review_resolve_review_threads.py \
            tests/test_review_reviewer_attempt_prompt_isolation.py \
            tests/test_static_context_symlink_guard.py \
            tests/test_summarize_unselected_runs.py \
            tests/test_test_and_mark_stable_phase7_unconflict.py \
            tests/test_test_and_mark_stable_live_log_cooldown.py \
            tests/test_validate_lint_bounded_tail_capture.py \
            tests/test_validate_lint_external_tool_dependencies.py \
            tests/test_validate_lint_import_audit_safety.py \
            tests/test_validate_lint_service_tool_scope.py \
            tests/test_validate_lint_shell_parity.py \
            tests/test_validate_process_fixup_labels.py \
            tests/test_verify_integration_fingerprints_baseline.py \
            tests/test_workflow_untrusted_input_contract.py

      # Moved from tests-hooks-and-orchestrator, which took 15m06s of its 20
      # minutes on main (run 39575950300, budget-watch issue #7798). That run's
      # step timings were not readable, and the implement sandbox could not
      # time every candidate (PyYAML and network were missing, so the vitest
      # pair could not run), so these steps are the plan's fallback list, chosen
      # by estimated cost, not measured. Group 2 is estimated at about 12.5-13
      # minutes after #7697 moved its promote-cycle step out. These steps need
      # no git history beyond HEAD (this job checks out at depth 1; every git
      # use in these modules is a temp repo), Node or the prepared .claude/
      # live copies, and this job has the same pip set and Python 3.12. They
      # run in group 2 only, once per CI run. Names and bodies unchanged.
      - name: Isolated agent container tests (codex_isolated_exec.sh)
        if: strategy.job-index == 2
        # The real-Docker e2e file skips itself unless CODEX_ISOLATION_DOCKER_E2E=1.
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider \
            tests/test_codex_agent_isolation_contract.py tests/test_codex_isolated_exec.py tests/test_dependency_registry_proxy.py \
            tests/test_codex_isolated_workspace.py tests/test_codex_isolated_exec_docker_e2e.py \
            tests/test_integration_judge_scope_guard.py tests/test_clarify_sandbox_base_image_preseed.py

      - name: Prebuilt sandbox image tests
        if: strategy.job-index == 2
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider tests/test_sandbox_image.py

      - name: Review sandbox image build retry tests
        if: strategy.job-index == 2
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider tests/test_review_sandbox_build_retry.py

      # Moved from tests-heal-plan-and-validation, which took 15m26s of its 20
      # minutes on main (run 39230958248, budget-watch issue #7690). That run's
      # step timings were not readable, so the steps were chosen by timing each
      # step body of that job in the implement sandbox (relative weights only;
      # PyYAML was missing there, so yaml-dependent modules errored and the
      # sharded heal step stopped early):
      # CI wiring guard part 2 37.2s, this step (unblock) 28.2s,
      # CI wiring guard part 1 25.2s, clarify loop guard 20.0s,
      # every other step 3s or less. Each test job has recorded about 15
      # minutes or more within weeks (#7366, #7406, #7560, #7575, #7576,
      # #7677), while poll groups record about 5 minutes (#4707). Group 0
      # carries the fast-fail subset and the single-file modules and group 1
      # then carried the merge-train step (moved out in #7766), so this step
      # runs in group 3 only, once per CI run. It needs only checkout, Python 3.12 and the shared pip install,
      # which this job already has. Name and body unchanged.
      - name: Unblock judge, scan and orphan fix-up close tests (replace-claude-sessions Phase 7)
        if: strategy.job-index == 3
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider tests/test_unblock_judge.py tests/test_unblock_scan.py tests/test_orphan_fixup_close.py

      # Moved from tests-release-and-log-analysis, which took 17m51s of its 20
      # minutes on main (run 39230958248, budget-watch issue #7689). Earlier
      # they moved there from tests-heal-plan-and-validation (#7383: the Claude
      # engine judges and harness sandbox steps) and from
      # tests-promote-stall-and-review (#7677: the promote cycle and
      # review-blocked label steps). Step timings were not readable when this
      # was planned; these are that job's most subprocess-heavy steps (full
      # poller runs, bash scripts, temp git repos), chosen by estimated cost,
      # not measured. Groups 0 and 1 already carry extra steps, so two ran in
      # group 2 and two run in group 3, each once per CI run. Group 2 then took
      # 19m28s of its 20 minutes (run 39245970945, budget-watch issue #7697),
      # so its two steps (promote cycle, review-blocked label propagation)
      # moved again in #7697: the promote step to tests-release-and-log-analysis
      # and the label step to tests-promote-stall-and-review. The group-3 steps
      # below need no git history beyond HEAD (this job checks out at depth 1;
      # every git use in these modules is a temp repo or a text assertion),
      # Node or the prepared .claude/ live copies, and this job has the same
      # pip set and Python 3.12. Names and bodies unchanged.
      - name: Orchestrator judges on the Claude engine tests (Phase 5c)
        if: strategy.job-index == 3
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider tests/test_orchestrator_judges_claude_engine.py

      - name: Validation harness sandbox tests
        if: strategy.job-index == 3
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider tests/test_validation_harness_sandbox.py

  budget-watch:
    # Early warning for the two budgets CI has hit without notice (workflow
    # file size near the §27 guard, a CI job near its timeout-minutes). Runs
    # only on pushes to main, after the test jobs, and opens one deduplicated
    # `ai:ci-budget` issue per finding so the pipeline fixes it in time.
    # Never fails, and is not part of the `lint` aggregate.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - static-checks
      - tests-hooks-and-orchestrator
      - tests-heal-plan-and-validation
      - tests-promote-stall-and-review
      - tests-release-and-log-analysis
      - orchestrate-poll
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check workflow sizes and CI job durations against their budgets
        env:
          GH_TOKEN: ${{ github.token }}
          # Issues opened with github.token start no workflow, so the issue
          # would never reach clarify. The issue-only PAT (Issues: write) is
          # used for the create call alone; unset, the job token is used.
          CI_BUDGET_ISSUE_TOKEN: ${{ secrets.CHECK_TRIAGE_ISSUES_TOKEN }}
          CI_BUDGET_WORKFLOW_WARN_BYTES: ${{ vars.CI_BUDGET_WORKFLOW_WARN_BYTES || '440000' }}
          CI_BUDGET_JOB_WARN_RATIO: ${{ vars.CI_BUDGET_JOB_WARN_RATIO || '0.75' }}
        run: |
          set -uo pipefail
          python3 -m pip install --quiet pyyaml || true
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci_budget_watch.py || echo "::warning::ci_budget_watch.py exited non-zero; ignoring (warning only)."

  lint:
    # Aggregate status: the one check that says whether all of CI passed.
    # The job id stays `lint` (docs and operators read `CI / lint`, §6).
    # `always()` makes it run and fail when a needed job fails or is
    # cancelled; without it the job would be skipped, and GitHub treats a
    # skipped required check as passing.
    needs:
      - static-checks
      - tests-hooks-and-orchestrator
      - tests-heal-plan-and-validation
      - tests-promote-stall-and-review
      - tests-release-and-log-analysis
      - orchestrate-poll
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          ci_needs_count="$(printf '%s' "${CI_NEEDS_JSON}" | jq -r 'length')"
          if ! [ "${ci_needs_count}" -ge 1 ] 2>/dev/null; then
            echo "::error::Could not read the needed jobs' results."
            exit 1
          fi
          printf '%s' "${CI_NEEDS_JSON}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          ci_unsuccessful_jobs="$(printf '%s' "${CI_NEEDS_JSON}" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "${ci_unsuccessful_jobs}" ]; then
            echo "::error::CI jobs that did not succeed: ${ci_unsuccessful_jobs}"
            exit 1
          fi
          echo "All ${ci_needs_count} CI jobs succeeded."

      - name: Plan decisions advisory lint
        continue-on-error: true
        env:
          DOCS_DECISION_LINT_ENABLED: ${{ vars.DOCS_DECISION_LINT_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          decision_lint_stderr="$(mktemp)"
          trap 'rm -f "${decision_lint_stderr}"' EXIT
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/lint_plan_decisions.py 2> "${decision_lint_stderr}"
          if [ "${DOCS_DECISION_LINT_ENABLED}" = "true" ] && [ -s "${decision_lint_stderr}" ]; then
            cat "${decision_lint_stderr}" >&2
            {
              echo "### Plan decision lint advisories"
              echo
              echo '```text'
              cat "${decision_lint_stderr}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"

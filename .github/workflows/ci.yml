      - name: Mark-stable release-tag refspec contract test
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_mark_stable_release_tag_refspec_contract.py

      # Moved from orchestrate-poll (2), which took 19m28s of its 20 minutes on
      # main (run 39245970945, budget-watch issue #7697). This step ran in this
      # job together with the review-blocked label propagation step before
      # #7689; it comes back alone, and that step goes to
      # tests-promote-stall-and-review. The choice rests on earlier recorded
      # durations, not measurements. Name and body unchanged.
      # Budget-watch issue #7699: this job then took 17m04s of its 20 minutes
      # (run 39257527801). The step had moved three times (#7677, #7689,
      # #7697) and every other job was estimated at or above the 15-minute
      # warning line with it added, so it stays here and is split in place,
      # the way the merge-train step was (#7579): one collection over the five
      # modules, then 4 local shards split by test function (parametrized
      # cases together). Every test seeds its own temp dirs and subprocesses,
      # and each shard is a separate pytest process. The savings are an
      # estimate; the step timings of run 39257527801 were not readable.
      - name: Promote cycle and blocked-verdict unit tests
        run: |
          set -euo pipefail
          pc_shards=4
          pc_modules=(
            tests/test_promote_main_cycle.py
            tests/test_apply_analysis_on_main.py
            tests/test_auto_release_stable.py
            tests/test_orchestrate_poll_promote_cycle.py
            tests/test_implement_blocked_verdict_terminalizes.py
            tests/test_promote_candidate_follow.py
          )
          rm -f /tmp/promote_cycle_collect.log /tmp/promote_cycle_tests.txt \
            /tmp/promote_cycle_shard_*.txt /tmp/promote_cycle_shard_*.log /tmp/promote_cycle_shard_*.rc
          # Keep the raw collect output so a collection error prints its traceback.
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest --collect-only -q -p no:cacheprovider "${pc_modules[@]}" \
            > /tmp/promote_cycle_collect.log 2>&1 \
            || { cat /tmp/promote_cycle_collect.log; echo "::error::Test collection failed for the promote-cycle modules."; exit 1; }
          : > /tmp/promote_cycle_tests.txt
          for pc_module in "${pc_modules[@]}"; do
            pc_module_count="$({ grep -F "${pc_module}::" /tmp/promote_cycle_collect.log || true; } \
              | sed 's/\[.*$//' | awk '!seen[$0]++' | tee -a /tmp/promote_cycle_tests.txt | wc -l | tr -d '[:space:]')"
            # A module that drops out of collection must not pass silently.
            if ! [ "${pc_module_count}" -ge 1 ] 2>/dev/null; then
              echo "::error::No tests collected from ${pc_module}."
              exit 1
            fi
          done
          pc_test_count="$(wc -l < /tmp/promote_cycle_tests.txt | tr -d '[:space:]')"
          if ! [ "${pc_test_count}" -ge 1 ] 2>/dev/null; then
            echo "::error::No tests collected from the promote-cycle modules."
            exit 1
          fi
          echo "promote-cycle modules: ${pc_test_count} test functions across ${pc_shards} shards"
          pc_pids=()
          for pc_shard in $(seq 0 "$((pc_shards - 1))"); do
            awk -v n="${pc_shard}" -v total="${pc_shards}" 'NR % total == n' \
              /tmp/promote_cycle_tests.txt > "/tmp/promote_cycle_shard_${pc_shard}.txt"
            [ -s "/tmp/promote_cycle_shard_${pc_shard}.txt" ] || continue
            (
              mapfile -t pc_shard_tests < "/tmp/promote_cycle_shard_${pc_shard}.txt"
              set +e
              PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider \
                "${pc_shard_tests[@]}" > "/tmp/promote_cycle_shard_${pc_shard}.log" 2>&1
              echo "$?" > "/tmp/promote_cycle_shard_${pc_shard}.rc"
            ) &
            pc_pids+=("$!")
          done
          # Reap every process before judging any, so none is left orphaned.
          for pc_pid in "${pc_pids[@]}"; do
            wait "${pc_pid}" || true
          done
          pc_failed=()
          for pc_shard in $(seq 0 "$((pc_shards - 1))"); do
            [ -s "/tmp/promote_cycle_shard_${pc_shard}.txt" ] || continue
            pc_stem="/tmp/promote_cycle_shard_${pc_shard}"
            echo "::group::promote-cycle step shard ${pc_shard}"
            cat "${pc_stem}.log" || true
            echo "::endgroup::"
            # A missing or non-numeric exit code counts as a failure.
            pc_rc="$(cat "${pc_stem}.rc" 2>/dev/null || echo 1)"
            case "${pc_rc}" in
              ''|*[!0-9]*) pc_rc=1 ;;
            esac
            if [ "${pc_rc}" != "0" ]; then
              pc_failed+=("${pc_shard}")
            fi
          done
          # Repeat failing shards' tails outside the collapsed groups. Each line
          # gets a "| " prefix so log text cannot act as a workflow command.
          for pc_shard in "${pc_failed[@]}"; do
            echo "--- promote-cycle step shard ${pc_shard} failed; last 40 log lines:"
            { tail -n 40 "/tmp/promote_cycle_shard_${pc_shard}.log" 2>/dev/null || true; } | sed 's/^/| /'
          done
          if [ "${#pc_failed[@]}" -gt 0 ]; then
            echo "::error::promote-cycle step shards failed: ${pc_failed[*]}"
            exit 1
          fi

      - name: Release notification superseded-run tests (stubbed gh and curl)
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider tests/test_release_notify_superseded.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider tests/test_release_static_preflight_contract.py

      - name: Release CI gate tests (stubbed gh; both release workflows)
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_release_ci_gate.py
          # Security finding release-gate-ignores-actions-ci (#6797, Refs
          # #6532): both stable-tag writers must require a successful
          # github-actions `lint` check-run from ci.yml on the exact commit
          # they release. Runs scripts/release_ci_gate.sh against a stub `gh`
          # for every pass/fail path, then checks that both release jobs call
          # the gate before any changelog push or tag write.
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          mkdir -p "${work}/bin" "${work}/fx"
          cat > "${work}/bin/gh" <<'STUB'
          #!/usr/bin/env bash
          set -euo pipefail
          fx="${RCG_TEST_FIXTURE_DIR:?}"
          if [ -f "${fx}/fail" ]; then
            echo "stub gh: forced failure" >&2
            exit 1
          fi
          case "$*" in
            *actions/workflows/ci.yml/runs*) cat "${fx}/runs.json" ;;
            *check-runs*)
              n=0
              if [ -f "${fx}/counter" ]; then n="$(cat "${fx}/counter")"; fi
              echo "$((n + 1))" > "${fx}/counter"
              if [ -f "${fx}/checks.${n}.json" ]; then
                cat "${fx}/checks.${n}.json"
              else
                cat "${fx}/checks.json"
              fi
              ;;
            *) echo "stub gh: unexpected call: $*" >&2; exit 1 ;;
          esac
          STUB
          chmod +x "${work}/bin/gh"

          sha="$(printf 'a%.0s' $(seq 1 40))"
          other_sha="$(printf 'b%.0s' $(seq 1 40))"
          RCG_FX="${work}/fx" RCG_SHA="${sha}" RCG_OTHER="${other_sha}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RCG_FX"])
          sha = os.environ["RCG_SHA"]
          other = os.environ["RCG_OTHER"]
          CI_RUN = {"head_sha": sha, "path": ".github/workflows/ci.yml", "check_suite_id": 100}


          def check(run_id=1, status="completed", conclusion="success", head=sha, app="github-actions", suite=100, name="lint"):
              return {"id": run_id, "name": name, "head_sha": head, "status": status,
                      "conclusion": conclusion, "app": {"slug": app}, "check_suite": {"id": suite}}


          def write(case, runs, checks, extra=None):
              d = root / case
              d.mkdir()
              (d / "runs.json").write_text(json.dumps([{"workflow_runs": runs}]))
              (d / "checks.json").write_text(checks if isinstance(checks, str) else json.dumps([{"check_runs": checks}]))
              for name, body in (extra or {}).items():
                  (d / name).write_text(body)


          write("success", [CI_RUN], [check()])
          write("success_ref_suffix", [dict(CI_RUN, path=".github/workflows/ci.yml@refs/heads/stable")], [check()])
          write("missing", [], [])
          write("pending", [CI_RUN], [check(status="in_progress", conclusion=None)])
          write("cancelled", [CI_RUN], [check(conclusion="cancelled")])
          write("failure", [CI_RUN], [check(conclusion="failure")])
          write("timed_out", [CI_RUN], [check(conclusion="timed_out")])
          write("skipped", [CI_RUN], [check(conclusion="skipped")])
          write("gh_fail", [CI_RUN], [check()], {"fail": ""})
          write("malformed_shape", [CI_RUN], json.dumps({"check_runs": [check()]}))
          write("malformed_json", [CI_RUN], "not json")
          write("non_actions_app", [CI_RUN], [check(app="evil-app")])
          write("non_ci_suite", [CI_RUN], [check(suite=999)])
          write("ci_run_other_sha", [dict(CI_RUN, head_sha=other)], [check()])
          write("other_workflow", [dict(CI_RUN, path=".github/workflows/lint.yml")], [check()])
          write("sha_mismatch", [CI_RUN], [check(head=other)])
          write("newest_cancelled", [CI_RUN], [check(run_id=10), check(run_id=11, conclusion="cancelled")])
          write("newest_success", [CI_RUN], [check(run_id=10, conclusion="failure"), check(run_id=11)])
          write("pending_then_success", [CI_RUN], [check()],
                {"checks.0.json": json.dumps([{"check_runs": [check(status="queued", conclusion=None)]}])})
          PY

          failures=0
          run_case() {
            # $1 case, $2 expected exit code, $3 expected output regex,
            # remaining args: extra env assignments.
            local case_name="$1" want_rc="$2" want_re="$3"
            shift 3
            local out rc=0
            out="$(env PATH="${work}/bin:${PATH}" GH_RETRY_MAX_ATTEMPTS=1 \
              RCG_TEST_FIXTURE_DIR="${work}/fx/${case_name}" \
              RELEASE_CI_GATE_WAIT_SECS=0 RELEASE_CI_GATE_POLL_SECS=1 "$@" \
              bash scripts/release_ci_gate.sh "${GATE_REPO:-owner/repo}" "${GATE_SHA:-${sha}}" 2>&1)" || rc=$?
            # Flatten to one line so a pattern can span several log lines.
            if [ "${rc}" -ne "${want_rc}" ] || ! grep -Eq "${want_re}" <<<"$(tr '\n' ' ' <<<"${out}")"; then
              echo "::error::release CI gate case '${case_name}': rc=${rc} (want ${want_rc}), output does not match /${want_re}/"
              printf '%s\n' "${out}"
              failures=$((failures + 1))
            else
              echo "OK: ${case_name} (rc=${rc})"
            fi
          }

          run_case success 0 'RELEASE_CI_GATE .*outcome=pass reason=success check_run_id=1 '
          run_case success_ref_suffix 0 'outcome=pass reason=success'
          run_case missing 1 'outcome=fail reason=wait_timeout .*last_state=missing'
          run_case pending 1 'outcome=fail reason=wait_timeout .*status=in_progress .*last_state=pending'
          run_case cancelled 1 'outcome=fail reason=conclusion_cancelled'
          run_case failure 1 'outcome=fail reason=conclusion_failure'
          run_case timed_out 1 'outcome=fail reason=conclusion_timed_out'
          run_case skipped 1 'outcome=fail reason=conclusion_skipped'
          run_case gh_fail 1 'outcome=fail reason=api_unreadable'
          run_case malformed_shape 1 'outcome=fail reason=api_unreadable'
          run_case malformed_json 1 'outcome=fail reason=api_unreadable'
          run_case non_actions_app 1 'outcome=fail reason=wait_timeout .*last_state=non_actions_app'
          run_case non_ci_suite 1 'outcome=fail reason=wait_timeout .*last_state=non_actions_app'
          run_case ci_run_other_sha 1 'outcome=fail reason=wait_timeout .*last_state=non_actions_app'
          run_case other_workflow 1 'outcome=fail reason=wait_timeout .*last_state=non_actions_app'
          run_case sha_mismatch 1 'outcome=fail reason=sha_mismatch'
          run_case newest_cancelled 1 'outcome=fail reason=conclusion_cancelled check_run_id=11 '
          run_case newest_success 0 'outcome=pass reason=success check_run_id=11 '
          run_case pending_then_success 0 'outcome=waiting reason=pending.*outcome=pass reason=success' \
            RELEASE_CI_GATE_WAIT_SECS=5
          run_case success 0 '::warning::RELEASE_CI_GATE RELEASE_CI_GATE_WAIT_SECS.*outcome=pass' \
            RELEASE_CI_GATE_WAIT_SECS=abc
          GATE_SHA="${sha:0:39}" run_case success 2 'outcome=fail reason=invalid_input'
          GATE_SHA="${other_sha^^}" run_case success 2 'outcome=fail reason=invalid_input'
          GATE_REPO='owner/repo;id' run_case success 2 'outcome=fail reason=invalid_input'
          GATE_REPO='../..' run_case success 2 'outcome=fail reason=invalid_input'

          if [ "${failures}" -ne 0 ]; then
            echo "::error::${failures} release CI gate case(s) failed."
            exit 1
          fi

          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import sys
          from pathlib import Path

          import yaml

          GATE = "Require CI / lint success on the tested commit"
          # Built at runtime: a literal expression opener here would be
          # evaluated by GitHub inside this run block.
          EXPR_OPEN = "$" + "{" + "{"
          errors = []
          for wf in (".github/workflows/test-and-mark-stable.yml", ".github/workflows/mark-stable.yml"):
              doc = yaml.safe_load(Path(wf).read_text(encoding="utf-8"))
              job = doc["jobs"]["release"]
              names = [step.get("name") for step in job["steps"]]
              if GATE not in names:
                  errors.append(f"{wf}: release job has no '{GATE}' step")
                  continue
              gate_index = names.index(GATE)
              for earlier in ("Record the tested commit",):
                  if earlier not in names or names.index(earlier) > gate_index:
                      errors.append(f"{wf}: '{earlier}' must run before the gate")
              for later in ("Assemble changelog fragments", "Tag version and update stable pointer", "Create GitHub Release"):
                  if later not in names or names.index(later) < gate_index:
                      errors.append(f"{wf}: '{later}' must run after the gate")
              step = job["steps"][gate_index]
              run = step.get("run", "")
              if "scripts/release_ci_gate.sh" not in run or '"${RELEASE_TESTED_SHA}"' not in run:
                  errors.append(f"{wf}: gate must run scripts/release_ci_gate.sh on the RELEASE_TESTED_SHA env value")
              if EXPR_OPEN in run:
                  errors.append(f"{wf}: gate run body must not contain workflow expressions; pass values through env")
              if step.get("if") is not None or step.get("continue-on-error"):
                  errors.append(f"{wf}: gate step must not be conditional or continue-on-error")
              if "GH_TOKEN" not in (step.get("env") or {}):
                  errors.append(f"{wf}: gate step must set GH_TOKEN")
              perms = job.get("permissions") or {}
              want = {"contents": "write", "checks": "read", "actions": "read"}
              if any(perms.get(k) != v for k, v in want.items()):
                  errors.append(f"{wf}: release job permissions must include {want}, got {perms}")
          if errors:
              for line in errors:
                  print(f"::error::{line}")
              sys.exit(1)
          print("OK: both release jobs gate on CI / lint before tagging")
          PY


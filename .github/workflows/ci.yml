        # enforcement workflow cannot regress silently.
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_lint_pr_body_auto_close.py

      # History: the step moved out of this job (15m52s of its 20 minutes, run
      # 39038112755, budget-watch issue #7575) into orchestrate-poll group 1.
      # Before that it moved here from tests-release-and-log-analysis (20m16s,
      # run 39030079651, #7560), and earlier out of this job when it measured
      # 19.6 of its 20 minutes (2026-10-09). In orchestrate-poll it ran in
      # group 1 only, because group 0 carries the fast-fail subset and the
      # single-file modules. Budget-watch issue #7579: group 1 then took
      # 15m13s of its 20 minutes (run 39047759102), and the step was split in
      # place there, the way the workflow failure heal step was (#7387):
      # tests/test_review_merge_train.py runs in 3 local shards (split by test
      # function, parametrized cases together) and the five small modules run
      # in one more process beside them, on the runner's 4 cores. Every test
      # seeds its own temp dirs and fake gh, and each shard is a separate
      # pytest process. Step
      # times here are estimates from test counts and earlier changelog
      # figures, not measurements of run 39047759102. The step seeds its own
      # git repositories and needs no Node or prepared .claude/ live copies.
      # Moved back from orchestrate-poll group 1, which took 15m42s of its 20
      # minutes (run 39526504422, budget-watch issue #7766); sharded since
      # #7579, so its estimated cost here is about 1.5 to 2 minutes. This job
      # has no matrix, so the step no longer carries a group guard.
      - name: Merge-train and gh_helpers rate-limit tests (CLAUDE.md §15)
        # Drives scripts/review_merge_train.sh through a fake `gh` and pins
        # the per-run file-list cache (one GET /pulls/{n}/files per distinct
        # PR per release tick), plus _parse_reset_header's Retry-After
        # precedence, gh_retry's per-attempt stdout buffering (#5495) and
        # the non-retryable HTTP 400/401 classification in
        # scripts/gh_helpers.sh, and PR comment JSON kept out of jq argv
        # (#7658).
        run: |
          set -euo pipefail
          mt_shards=3
          mt_module="tests/test_review_merge_train.py"
          rm -f /tmp/merge_train_collect.log /tmp/merge_train_tests.txt \
            /tmp/merge_train_shard_*.txt /tmp/merge_train_shard_*.log /tmp/merge_train_shard_*.rc \
            /tmp/merge_train_rest.log /tmp/merge_train_rest.rc
          # Keep the raw collect output so a collection error prints its traceback.
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest --collect-only -q -p no:cacheprovider "${mt_module}" \
            > /tmp/merge_train_collect.log 2>&1 \
            || { cat /tmp/merge_train_collect.log; echo "::error::Test collection failed for ${mt_module}."; exit 1; }
          { grep -F "${mt_module}::" /tmp/merge_train_collect.log || true; } \
            | sed 's/\[.*$//' | awk '!seen[$0]++' > /tmp/merge_train_tests.txt
          mt_test_count="$(wc -l < /tmp/merge_train_tests.txt | tr -d '[:space:]')"
          if ! [ "${mt_test_count}" -ge 1 ] 2>/dev/null; then
            echo "::error::No tests collected from ${mt_module}."
            exit 1
          fi
          echo "${mt_module}: ${mt_test_count} test functions across ${mt_shards} shards"
          mt_pids=()
          for mt_shard in $(seq 0 "$((mt_shards - 1))"); do
            awk -v n="${mt_shard}" -v total="${mt_shards}" 'NR % total == n' \
              /tmp/merge_train_tests.txt > "/tmp/merge_train_shard_${mt_shard}.txt"
            [ -s "/tmp/merge_train_shard_${mt_shard}.txt" ] || continue
            (
              mapfile -t mt_shard_tests < "/tmp/merge_train_shard_${mt_shard}.txt"
              set +e
              PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider \
                "${mt_shard_tests[@]}" > "/tmp/merge_train_shard_${mt_shard}.log" 2>&1
              echo "$?" > "/tmp/merge_train_shard_${mt_shard}.rc"
            ) &
            mt_pids+=("$!")
          done
          (
            set +e
            PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider \
              tests/test_gh_helpers_parse_reset_header.py \
              tests/test_gh_retry_stdout_isolation.py \
              tests/test_gh_retry_permanent_auth_failures.py \
              tests/test_gh_api_retry.py \
              tests/test_gh_api_retry_py.py \
              tests/test_gh_pr_comments_argv_limit.py > /tmp/merge_train_rest.log 2>&1
            echo "$?" > /tmp/merge_train_rest.rc
          ) &
          mt_pids+=("$!")
          # Reap every process before judging any, so none is left orphaned.
          for mt_pid in "${mt_pids[@]}"; do
            wait "${mt_pid}" || true
          done
          mt_ids=()
          for mt_shard in $(seq 0 "$((mt_shards - 1))"); do
            [ -s "/tmp/merge_train_shard_${mt_shard}.txt" ] || continue
            mt_ids+=("${mt_shard}")
          done
          mt_ids+=("rest")
          mt_failed=()
          for mt_id in "${mt_ids[@]}"; do
            if [ "${mt_id}" = "rest" ]; then
              mt_stem="/tmp/merge_train_rest"
            else
              mt_stem="/tmp/merge_train_shard_${mt_id}"
            fi
            echo "::group::merge-train step shard ${mt_id}"
            cat "${mt_stem}.log" || true
            echo "::endgroup::"
            # A missing or non-numeric exit code counts as a failure.
            mt_rc="$(cat "${mt_stem}.rc" 2>/dev/null || echo 1)"
            case "${mt_rc}" in
              ''|*[!0-9]*) mt_rc=1 ;;
            esac
            if [ "${mt_rc}" != "0" ]; then
              mt_failed+=("${mt_id}")
            fi
          done
          # Repeat failing shards' tails outside the collapsed groups. Each line
          # gets a "| " prefix so log text cannot act as a workflow command.
          for mt_id in "${mt_failed[@]}"; do
            if [ "${mt_id}" = "rest" ]; then
              mt_stem="/tmp/merge_train_rest"
            else
              mt_stem="/tmp/merge_train_shard_${mt_id}"
            fi
            echo "--- merge-train step shard ${mt_id} failed; last 40 log lines:"
            { tail -n 40 "${mt_stem}.log" 2>/dev/null || true; } | sed 's/^/| /'
          done
          if [ "${#mt_failed[@]}" -gt 0 ]; then
            echo "::error::merge-train step shards failed: ${mt_failed[*]}"
            exit 1
          fi

  tests-heal-plan-and-validation:
    # Unit and contract tests, a contiguous slice of the old `lint` job's
    # step order. Each test job measured 2-8 minutes (#4707); 20 leaves
    # room for a cold runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python CI dependencies
        run: |
          set -euo pipefail
          python3 -m pip install yamllint coverage pyyaml jsonschema jinja2 pytest ruff

      - name: Workflow failure heal contract and driver tests
        run: |
          set -euo pipefail
          # Budget-watch issue #7387: this job took 15m12s of its 20 minutes on
          # main (run 38584572151), almost all of it in this step. Moving the
          # step whole did not work: in PR run 38602731355 it needed more than
          # 7 minutes on top of the 12.8 minutes `tests-promote-stall-and-review`
          # already used, and that job was cancelled at its timeout. Nearly all
          # of the step's time is tests/test_workflow_failure_heal.py (297 of
          # the first command's 397 tests), so that module now runs in local
          # shards in parallel, the way the orchestrate-poll step runs its
          # largest module. Each test builds its own temp dirs, and shards are
          # separate pytest processes, so they share no state. Shards split by
          # test function (parametrized cases stay together), every collected
          # function runs exactly once, and a shard with no recorded exit code
          # counts as failed.
          heal_shards=4
          heal_module="tests/test_workflow_failure_heal.py"
          rm -f /tmp/heal_collect.log /tmp/heal_shard_*.txt /tmp/heal_shard_*.log /tmp/heal_shard_*.rc
          # Keep the raw collect output so a collection error prints its traceback.
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest --collect-only -q -p no:cacheprovider "${heal_module}" \
            > /tmp/heal_collect.log 2>&1 \
            || { cat /tmp/heal_collect.log; echo "::error::Test collection failed for ${heal_module}."; exit 1; }
          { grep -F "${heal_module}::" /tmp/heal_collect.log || true; } \
            | sed 's/\[.*$//' | awk '!seen[$0]++' > /tmp/heal_tests.txt
          heal_test_count="$(wc -l < /tmp/heal_tests.txt | tr -d '[:space:]')"
          if ! [ "${heal_test_count}" -ge 1 ] 2>/dev/null; then
            echo "::error::No tests collected from ${heal_module}."
            exit 1
          fi
          echo "${heal_module}: ${heal_test_count} test functions across ${heal_shards} shards"
          heal_shard_pids=()
          for shard in $(seq 0 "$((heal_shards - 1))"); do
            awk -v n="${shard}" -v total="${heal_shards}" 'NR % total == n' \
              /tmp/heal_tests.txt > "/tmp/heal_shard_${shard}.txt"
            [ -s "/tmp/heal_shard_${shard}.txt" ] || continue
            (
              mapfile -t shard_tests < "/tmp/heal_shard_${shard}.txt"
              set +e
              PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider \
                "${shard_tests[@]}" > "/tmp/heal_shard_${shard}.log" 2>&1
              echo "$?" > "/tmp/heal_shard_${shard}.rc"
            ) &
            heal_shard_pids+=("$!")
          done
          # Reap every shard before judging any, so none is left orphaned.
          for shard_pid in "${heal_shard_pids[@]}"; do
            wait "${shard_pid}" || true
          done
          heal_failed_shards=()
          for shard in $(seq 0 "$((heal_shards - 1))"); do
            [ -s "/tmp/heal_shard_${shard}.txt" ] || continue
            echo "::group::${heal_module} shard ${shard}"
            cat "/tmp/heal_shard_${shard}.log" || true
            echo "::endgroup::"
            shard_rc="$(cat "/tmp/heal_shard_${shard}.rc" 2>/dev/null || true)"
            if [ "${shard_rc}" != "0" ]; then
              heal_failed_shards+=("${shard}")
            fi
          done
          # Repeat failing shards' tails outside the collapsed groups.
          for shard in "${heal_failed_shards[@]}"; do
            echo "--- ${heal_module} shard ${shard} failed; last 40 log lines:"
            tail -n 40 "/tmp/heal_shard_${shard}.log" || true
          done
          if [ "${#heal_failed_shards[@]}" -gt 0 ]; then
            echo "::error::${heal_module} shards failed: ${heal_failed_shards[*]}"
            exit 1
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider tests/test_workflow_failure_heal_non_retryable_backfill.py tests/test_workflow_failure_heal_pr_reconcile.py tests/test_heal_isolated_editor.py tests/test_workflow_failure_heal_scope_tests.py tests/test_workflow_failure_heal_recovery_scan.py tests/test_workflow_failure_heal_synced_security.py tests/test_workflow_failure_heal_queue.py

---
name: AI Orchestrate Poller (Reusable)

"on":
  workflow_call:
    secrets:
      GH_PAT:
        required: true
      OPENROUTER_API_KEY:
        required: true
      TG_BOT_SECRET:
        required: false

env:
  MODEL_EDITOR: ${{ vars.WORKFLOW_ORCHESTRATE_MODEL || vars.WORKFLOW_EDITOR_MODEL || 'openai/gpt-5.3-codex' }}
  MODEL_REASONING_EFFORT_JUDGE: ${{ vars.THINKING_LEVEL_JUDGE || 'xhigh' }}

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Only one poller per repo at a time
      group: ai-orchestrate-poll-${{ github.repository }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Codex CLI and core tools
        shell: bash
        run: |
          set -euo pipefail

          npm install -g "@openai/codex@v0.114.0" --no-audit --no-fund

          missing_tools=()
          for tool in jq curl gh; do
            command -v "$tool" >/dev/null 2>&1 || missing_tools+=("$tool")
          done

          if [ "${#missing_tools[@]}" -gt 0 ]; then
            if ! command -v apt-get >/dev/null 2>&1; then
              echo "Missing tools (${missing_tools[*]}), but apt-get is unavailable on this runner" >&2
              exit 1
            fi

            apt_cmd=(apt-get)
            if command -v sudo >/dev/null 2>&1; then
              apt_cmd=(sudo apt-get)
            elif [ "$(id -u)" -ne 0 ]; then
              echo "Missing tools (${missing_tools[*]}), but sudo is unavailable and the current user is not root" >&2
              exit 1
            fi

            "${apt_cmd[@]}" update
            if ! "${apt_cmd[@]}" install -y "${missing_tools[@]}"; then
              echo "apt-get install failed for: ${missing_tools[*]}" >&2
              exit 1
            fi
          fi

          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"

      - name: Validate required environment variables
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "Missing required environment variables: OPENROUTER_API_KEY" >&2
            exit 1
          fi

      - name: Create runtime workspace
        run: |
          set -euo pipefail
          RUNTIME_DIR="/tmp/codex-orchestrate-poll-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${RUNTIME_DIR}"
          {
            echo "RUNTIME_DIR=${RUNTIME_DIR}"
            echo "STATE_FILE=${RUNTIME_DIR}/state.json"
            echo "JUDGE_PROMPT_FILE=${RUNTIME_DIR}/judge_prompt.txt"
            echo "JUDGE_OUTPUT_FILE=${RUNTIME_DIR}/judge_output.txt"
          } >> "$GITHUB_ENV"

      - name: Fetch workflow support scripts
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          wf_source="${{ github.repository_owner }}/coding-workflows"
          mkdir -p scripts prompts .github/ai
          for f in setup_serena.sh git_ref_health_check.sh orchestrate_lib.py orchestrate_poll_process.sh; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${wf_source}/contents/scripts/${f}?ref=stable" > "scripts/${f}"
            chmod +x "scripts/${f}"
          done
          for pf in mode-judge.txt mode-judge-review-blocked.txt; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${wf_source}/contents/prompts/${pf}?ref=stable" > "prompts/${pf}"
          done
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${wf_source}/contents/.github/ai/orchestrate_schema.v1.json?ref=stable" > ".github/ai/orchestrate_schema.v1.json"
          # Model catalog: try stable first, fall back to local copy from checkout.
          if gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${wf_source}/contents/scripts/codex_model_catalog.json?ref=stable" > "scripts/codex_model_catalog.json.tmp" 2>/dev/null; then
            mv "scripts/codex_model_catalog.json.tmp" "scripts/codex_model_catalog.json"
          else
            rm -f "scripts/codex_model_catalog.json.tmp"
            echo "Model catalog not on stable tag yet; using local copy."
          fi
          for f in codex_system_instructions.md ai_pipeline.md; do
            if [ ! -f "${f}" ]; then
              gh api -H 'Accept: application/vnd.github.raw+json' \
                "repos/${wf_source}/contents/${f}?ref=stable" > "${f}"
            fi
          done

      - name: Find active tracking issues
        id: find_tracking
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          # Find all open issues with the orchestrator tracking label
          TRACKING_ISSUES="$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "ai:orchestrator-tracking" \
            --state open \
            --json number,title \
            --limit 20)"

          COUNT="$(echo "${TRACKING_ISSUES}" | jq 'length')"
          echo "Found ${COUNT} active tracking issue(s)"

          if [ "${COUNT}" -eq 0 ]; then
            echo "No active orchestrator projects. Exiting."
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_work=true" >> "$GITHUB_OUTPUT"
          echo "${TRACKING_ISSUES}" > "${RUNTIME_DIR}/tracking_issues.json"

      - name: Process each tracking issue
        if: steps.find_tracking.outputs.has_work == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID || '' }}
          TOOL_CALL_BUDGET_JUDGE: ${{ vars.TOOL_CALL_BUDGET_JUDGE || '60' }}
          SERENA_VERSION: ${{ vars.SERENA_VERSION || 'main' }}
          SERENA_LANGUAGES: ${{ vars.SERENA_LANGUAGES || '' }}
          SERENA_DISABLED: ${{ vars.SERENA_DISABLED || 'false' }}
          SERENA_IGNORED_DIRS: ${{ vars.SERENA_IGNORED_DIRS || '' }}
          ENABLE_VALIDATION: ${{ vars.ENABLE_VALIDATION || 'true' }}
          MAX_VALIDATE_CYCLES: ${{ vars.MAX_VALIDATE_CYCLES || '3' }}
          MAX_REVIEW_BLOCKED_RETRIES: ${{ vars.MAX_REVIEW_BLOCKED_RETRIES || '2' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash scripts/orchestrate_poll_process.sh

      - name: Write run summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## AI Orchestrate Poller Summary"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Model (judge) | \`${MODEL_EDITOR}\` |"
            echo "| Reasoning (judge) | \`${MODEL_REASONING_EFFORT_JUDGE}\` |"
            if [ -f "${RUNTIME_DIR}/tracking_issues.json" ]; then
              COUNT="$(jq 'length' "${RUNTIME_DIR}/tracking_issues.json")"
              echo "| Tracking issues processed | ${COUNT} |"
            else
              echo "| Tracking issues processed | 0 |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

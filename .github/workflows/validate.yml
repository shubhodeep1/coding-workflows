          EOF

          echo "PROMPT_PRELUDE_REFACTOR_ENABLED=${{ vars.PROMPT_PRELUDE_REFACTOR_ENABLED || 'false' }}" >> "$GITHUB_ENV"
          echo "UNATTENDED_IDENTITY_REINJECT_ENABLED=${{ vars.UNATTENDED_IDENTITY_REINJECT_ENABLED || 'false' }}" >> "$GITHUB_ENV"
          WORKFLOW_SUPPORT_REF="${support_sha}" bash "${helper_stage_dir}/scripts/stage_workflow_support.sh" validate --manifest "${manifest_path}"
      - name: Stage trusted Claude engine support
        env:
          CLAUDE_ENGINE_SUPPORT_DEST: ${{ runner.temp }}/claude-engine-support
        run: |
          set -euo pipefail
          # The engine helpers (ai_engine.sh, policy, relay, isolation helper,
          # guard hook, instructions) come only from the verified support
          # clone, never from the checkout being validated. Without them every
          # validate role keeps its unchanged codex path
          # (AI_ENGINE_FALLBACK reason=engine_support_missing).
          helper_stage_dir="${VALIDATE_HELPER_STAGE_DIR:-}"
          if [ -n "${helper_stage_dir}" ] && [ -f "${helper_stage_dir}/scripts/ai_engine.sh" ] &&
             bash -c 'source "$0" && declare -F ai_engine_stage_support >/dev/null && ai_engine_stage_support "$1" "$2"' \
               "${helper_stage_dir}/scripts/ai_engine.sh" "${helper_stage_dir}" "${CLAUDE_ENGINE_SUPPORT_DEST}"; then
            echo "CLAUDE_ENGINE_SUPPORT_DIR=${CLAUDE_ENGINE_SUPPORT_DEST}" >> "$GITHUB_ENV"
          else
            echo "::warning::Trusted Claude engine support is unavailable; the validate roles run codex."
          fi

      - name: Resolve AI engine
        id: ai_engine
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE_INPUT: ${{ inputs.tracking_issue }}
          AI_ENGINE: ${{ vars.AI_ENGINE || '' }}
          AI_ENGINE_VALIDATE: ${{ vars.AI_ENGINE_VALIDATE || '' }}
          AI_ENGINE_VALIDATE_SELF_HEAL: ${{ vars.AI_ENGINE_VALIDATE_SELF_HEAL || '' }}
        run: |
          set -euo pipefail
          engine="codex"
          engine_script="${CLAUDE_ENGINE_SUPPORT_DIR:-}/scripts/ai_engine.sh"
          # Scheduled mode (#7553) calls no model: keep codex so the Claude CLI
          # install and the pool-token probes below are skipped.
          if [ "${VALIDATE_SCHEDULED_MODE:-false}" = "true" ]; then
            echo "engine=${engine}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${CLAUDE_ENGINE_SUPPORT_DIR:-}" ] && [ -f "${engine_script}" ] && [ ! -L "${engine_script}" ]; then
            if [[ "${TRACKING_ISSUE_INPUT}" =~ ^[1-9][0-9]*$ ]]; then
              # API audit (unattended section 14): no earlier step of this job
              # reads the tracking issue's labels ("Resolve integration ref"
              # exposes only the branch), and validate_process.sh reads the
              # issue body after the CLI and pool steps that need the engine.
              # One read; the labels go to GITHUB_ENV so validate_process.sh
              # and self-heal reuse them. A failed read leaves them empty.
              labels_json=""
              if labels_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE_INPUT}" --jq '[.labels[].name]' 2>/dev/null)" &&
                 labels_json="$(printf '%s' "${labels_json}" | python3 -I -c 'import json,sys; v=json.load(sys.stdin); assert isinstance(v,list) and all(isinstance(x,str) for x in v); print(json.dumps(v))' 2>/dev/null)"; then
                export AI_ENGINE_LABELS="${labels_json}"
                echo "AI_ENGINE_LABELS=${labels_json}" >> "$GITHUB_ENV"
              else
                echo "::warning::Could not read the tracking issue labels; engine selection uses variables and the engine config."
              fi
            fi
            # shellcheck disable=SC1090
            source "${engine_script}"
            for role in VALIDATE VALIDATE_SELF_HEAL; do
              if [ "$(ai_engine_for_role "${role}" || echo codex)" = "claude" ]; then
                engine="claude"
              fi
            done
          fi
          echo "engine=${engine}" >> "$GITHUB_OUTPUT"

      - name: Stage trusted Claude engine actions
        id: claude_engine_actions
        if: steps.ai_engine.outputs.engine == 'claude'
        continue-on-error: true
        run: |
          set -euo pipefail
          # `uses:` resolves local actions only inside GITHUB_WORKSPACE. The
          # copies come from the verified support clone (never the checkout)
          # and live under .codex-workflow-src, which workspace_init.sh keeps
          # out of the validation workspace. They stay until the job ends:
          # the pool-token post step runs from there and deletes the tokens.
          src="${VALIDATE_HELPER_STAGE_DIR:?}"
          dest="${GITHUB_WORKSPACE}/.codex-workflow-src"
          if [ -e "${dest}" ] || [ -L "${dest}" ]; then
            echo "::warning::${dest} already exists; not staging the Claude engine actions (codex runs)."
            exit 1
          fi
          for rel in .github/actions/install-claude .github/actions/claude-pool-token; do
            if [ ! -d "${src}/${rel}" ] || [ -L "${src}/${rel}" ] || [ -n "$(find "${src}/${rel}" ! -type f ! -type d -print -quit)" ]; then
              echo "::warning::Trusted ${rel} is missing or holds a non-regular file; codex runs."
              exit 1
            fi
          done
          if [ ! -f "${src}/.github/ai/claude_engine.json" ] || [ -L "${src}/.github/ai/claude_engine.json" ]; then
            echo "::warning::Trusted .github/ai/claude_engine.json is missing; codex runs."
            exit 1
          fi
          # The pool-token action runs <action>/../../../scripts/claude_pool_token.sh,
          # which calls claude_engine.py beside it. Without them the credential
          # step exits 127 and every Claude role ends with no_credential.
          for rel in scripts/claude_pool_token.sh scripts/claude_engine.py; do
            if [ ! -f "${src}/${rel}" ] || [ -L "${src}/${rel}" ]; then
              echo "::warning::Trusted ${rel} is missing; codex runs."
              exit 1
            fi
          done
          mkdir -p "${dest}/.github/actions" "${dest}/.github/ai" "${dest}/scripts"
          cp -R "${src}/.github/actions/install-claude" "${src}/.github/actions/claude-pool-token" "${dest}/.github/actions/"
          install -m 0644 "${src}/.github/ai/claude_engine.json" "${dest}/.github/ai/claude_engine.json"
          install -m 0755 "${src}/scripts/claude_pool_token.sh" "${dest}/scripts/claude_pool_token.sh"
          install -m 0644 "${src}/scripts/claude_engine.py" "${dest}/scripts/claude_engine.py"

      - name: Install Claude Code CLI
        if: steps.ai_engine.outputs.engine == 'claude' && steps.claude_engine_actions.outcome == 'success'
        continue-on-error: true
        uses: ./.codex-workflow-src/.github/actions/install-claude
        with:
          config_path: .codex-workflow-src/.github/ai/claude_engine.json

      - name: Resolve Claude credential
        id: claude_pool
        if: steps.ai_engine.outputs.engine == 'claude' && steps.claude_engine_actions.outcome == 'success'
        continue-on-error: true
        uses: ./.codex-workflow-src/.github/actions/claude-pool-token
        with:
          config_path: .codex-workflow-src/.github/ai/claude_engine.json

      - name: Initialize workspace metadata
        id: workspace_meta
        env:
          TRACKING_ISSUE_INPUT: ${{ inputs.tracking_issue }}
        run: |
          set -euo pipefail

          workspace_reuse_enabled="${WORKSPACE_REUSE_ENABLED:-false}"
          workspace_identifier=""
          if ! [[ "${TRACKING_ISSUE_INPUT}" =~ ^[0-9]+$ ]]; then
            echo "::error::tracking_issue must be 0 or a positive integer."
            exit 1
          fi
          if [ "${TRACKING_ISSUE_INPUT}" -gt 0 ]; then
            workspace_identifier="${TRACKING_ISSUE_INPUT}"
          else
            workspace_reuse_enabled="false"
          fi

          WORKSPACE_REUSE_ENABLED="${workspace_reuse_enabled}" \
          WORKSPACE_REQUIRE_STABLE_IDENTIFIER_FOR_REUSE="true" \
          WORKSPACE_ISSUE_IDENTIFIER="${workspace_identifier}" \
          WORKSPACE_SOURCE_PATH="${GITHUB_WORKSPACE}" \
            bash scripts/workspace_init.sh metadata

      - name: Restore reusable workspace cache
        if: steps.workspace_meta.outputs.workspace_reuse_enabled == 'true'
        id: workspace_cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.workspace_meta.outputs.workspace_path }}
          key: ${{ steps.workspace_meta.outputs.workspace_cache_key }}
          restore-keys: |
            ${{ steps.workspace_meta.outputs.workspace_cache_restore_prefix_exact }}
            ${{ steps.workspace_meta.outputs.workspace_cache_restore_prefix_issue }}

      - name: Finalize workspace metadata
        id: workspace_state
        run: |
          set -euo pipefail
          workspace_cache_matched_key=""
          workspace_cache_path="${{ steps.workspace_meta.outputs.workspace_path }}"
          workspace_cache_key="${{ steps.workspace_meta.outputs.workspace_cache_key }}"
          workspace_cache_restore_prefix_issue="${{ steps.workspace_meta.outputs.workspace_cache_restore_prefix_issue }}"
          workspace_cache_hit="${{ steps.workspace_cache.outputs.cache-hit || '' }}"
          if [ "${workspace_cache_hit}" = "true" ]; then
            workspace_cache_matched_key="${workspace_cache_key}"
          elif [ -d "${workspace_cache_path}" ] && [ -n "$(find "${workspace_cache_path}" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
            workspace_cache_matched_key="${workspace_cache_restore_prefix_issue}restored"
          fi
          WORKSPACE_REUSE_ENABLED="${{ steps.workspace_meta.outputs.workspace_reuse_enabled }}" \
          WORKSPACE_REQUIRE_STABLE_IDENTIFIER_FOR_REUSE="true" \
          WORKSPACE_ISSUE_IDENTIFIER="${{ steps.workspace_meta.outputs.workspace_issue_identifier }}" \
          WORKSPACE_SOURCE_PATH="${GITHUB_WORKSPACE}" \
          WORKSPACE_FINGERPRINT="${{ steps.workspace_meta.outputs.workspace_fingerprint }}" \
          WORKSPACE_CACHE_MATCHED_KEY="${workspace_cache_matched_key}" \
            bash scripts/workspace_init.sh metadata

      - name: Finalize workspace contents
        run: |
          set -euo pipefail
          WORKSPACE_SOURCE_PATH="${GITHUB_WORKSPACE}" \
          WORKSPACE_PATH="${{ steps.workspace_state.outputs.workspace_path }}" \
          WORKSPACE_REUSE_ENABLED="${{ steps.workspace_state.outputs.workspace_reuse_enabled }}" \
          WORKSPACE_CACHE_RESTORE_STATE="${{ steps.workspace_state.outputs.workspace_cache_restore_state }}" \
            bash scripts/workspace_init.sh finalize

      - name: Activate workspace shell context
        run: |
          set -euo pipefail
          workspace_shell_env="${{ steps.runtime.outputs.runtime_dir }}/workspace-shell.env"
          cat > "${workspace_shell_env}" <<'EOF'
          if [ -n "${WORKSPACE_PATH:-}" ] && [ -d "${WORKSPACE_PATH}" ]; then
            cd "${WORKSPACE_PATH}"
          fi
          EOF
          {
            echo "BASH_ENV=${workspace_shell_env}"
            echo "GIT_DIR=${GITHUB_WORKSPACE}/.git"
            echo "GIT_WORK_TREE=${WORKSPACE_PATH}"
          } >> "$GITHUB_ENV"

      - name: Run workspace after_create hook
        id: workspace_after_create_hook
        run: |
          set -euo pipefail
          : "${VALIDATE_HOOK_HELPER:?Trusted validation hook helper is unavailable}"
          bash "${VALIDATE_HOOK_HELPER}" validate after_create

      - name: Initialize Serena runtime state
        run: |
          set -euo pipefail

          serena_project_preexisted="false"
          if git ls-files --error-unmatch -- .serena/project.yml >/dev/null 2>&1 || [ -e .serena/project.yml ]; then
            serena_project_preexisted="true"
          fi

          {
            echo "SERENA_AVAILABLE=false"
            echo "SERENA_PROJECT_PREEXISTED=${serena_project_preexisted}"
            echo "SERENA_PROJECT_BOOTSTRAP_HASH="
          } >> "$GITHUB_ENV"

      - name: Restore validate hints cache
        # Reuse .ai/validate-hints-cache/hints.yml from a prior successful
        # run in the same repo with a matching cache key so
        # validate_process.sh can skip the codex discover call entirely.
        # Cache is per-repo (GitHub Actions cache scoping). Key hashes
        # files that drive validation discovery output; changes invalidate
        # the cache so stale hints cannot leak across structural changes.
        # Exact-key-only by design: no restore-keys fallback, because a
        # partial-prefix hit would reuse hints computed against a different
        # repo fingerprint and bypass the "changes invalidate" guarantee.
        # See scripts/validate_process.sh Phase 0.
        id: validate_hints_cache
        uses: actions/cache@v5
        with:
          # The path participates in the cache version. Keep it independent
          # of the per-run workspace while retaining the fingerprint in the
          # staging path so a miss cannot reuse stale local runner content.
          path: ${{ runner.temp }}/validate-hints-cache/${{ github.repository }}/${{ hashFiles('docker-compose*.yml', 'compose*.yml', '**/Dockerfile', '**/Dockerfile.*', '**/package.json', '**/pyproject.toml', '**/requirements*.txt', '**/go.mod', '**/Cargo.toml') }}/.ai/validate-hints-cache
          key: validate-hints-v1-${{ hashFiles('docker-compose*.yml', 'compose*.yml', '**/Dockerfile', '**/Dockerfile.*', '**/package.json', '**/pyproject.toml', '**/requirements*.txt', '**/go.mod', '**/Cargo.toml') }}

      - name: Stage restored validate hints cache into workspace
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "::warning::RUNNER_TEMP is unset; skipping validate hints cache stage-in."
            exit 0
          fi
          validate_hints_cache_workspace_root="${{ steps.workspace_state.outputs.workspace_path }}"
          if [ -z "${validate_hints_cache_workspace_root}" ]; then
            echo "::warning::workspace_path is empty; skipping validate hints cache stage-in."
            exit 0
          fi
          validate_hints_cache_staging_dir="${RUNNER_TEMP}/validate-hints-cache/${GITHUB_REPOSITORY}/${{ hashFiles('docker-compose*.yml', 'compose*.yml', '**/Dockerfile', '**/Dockerfile.*', '**/package.json', '**/pyproject.toml', '**/requirements*.txt', '**/go.mod', '**/Cargo.toml') }}/.ai/validate-hints-cache"
          validate_hints_cache_workspace_dir="${validate_hints_cache_workspace_root}/.ai/validate-hints-cache"
          validate_hints_cache_restored_entries=0
          if [ -d "${validate_hints_cache_staging_dir}" ]; then
            mkdir -p "${validate_hints_cache_workspace_dir}"
            cp -a "${validate_hints_cache_staging_dir}/." "${validate_hints_cache_workspace_dir}/"
            validate_hints_cache_restored_entries=1
          fi
          echo "VALIDATE_HINTS_CACHE_STAGE_IN restored_entries=${validate_hints_cache_restored_entries} staging_dir=${validate_hints_cache_staging_dir} workspace_dir=${validate_hints_cache_workspace_dir}"

      - name: Normalize behavioural smoke include flag
        id: behavioural_smoke_gate
        run: |
          set -euo pipefail

          include_synthesised="true"
          case "$(printf '%s' "${VALIDATION_INCLUDE_SYNTHESISED:-true}" | tr '[:upper:]' '[:lower:]')" in
            0|false|no|off)
              include_synthesised="false"
              ;;
          esac

          echo "enabled=${include_synthesised}" >> "$GITHUB_OUTPUT"

      - name: Resolve behavioural smoke source PR
        id: behavioural_smoke_pr
        if: steps.behavioural_smoke_gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number || '0' }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          PR_EVENT_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          echo "pr_number=" >> "$GITHUB_OUTPUT"

          if [[ "${INPUT_PR_NUMBER:-0}" =~ ^[0-9]+$ ]] && [ "${INPUT_PR_NUMBER}" -gt 0 ]; then
            echo "pr_number=${INPUT_PR_NUMBER}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${PR_EVENT_NUMBER:-}" =~ ^[0-9]+$ ]] && [ "${PR_EVENT_NUMBER}" -gt 0 ]; then
            echo "pr_number=${PR_EVENT_NUMBER}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          issue_number="${TRACKING_ISSUE:-}"
          if ! [[ "${issue_number}" =~ ^[0-9]+$ ]] || [ "${issue_number}" -le 0 ]; then
            echo "::notice::No tracking issue available to resolve behavioural smoke cache source PR; skipping review-runtime restore."
            exit 0
          fi

          source scripts/gh_helpers.sh

          # Audit note: validate.yml's existing GitHub calls resolve the
          # integration branch and record memory events, but none expose the
          # latest linked PR number needed to restore the per-PR
          # .ai/review_runtime cache. Use the shared timeline helper here so
          # the review-runtime lookup stays GraphQL-first and fail-open.
          timeline_json="$(gh_issue_timeline_with_cross_refs "${GITHUB_REPOSITORY%%/*}" "${GITHUB_REPOSITORY##*/}" "${issue_number}" 2>/dev/null || true)"
          pr_number="$(printf '%s' "${timeline_json}" | jq -r '
            if (type == "array") then
              [.[] | select(.event == "cross-referenced" and .source.issue.pull_request != null) | .source.issue.number] | last // empty
            else
              empty
            end
          ' 2>/dev/null || true)"

          if [[ "${pr_number}" =~ ^[0-9]+$ ]] && [ "${pr_number}" -gt 0 ]; then
            echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No linked PR found for tracking issue #${issue_number}; skipping behavioural smoke runtime restore."
          fi

      - name: Prepare behavioural smoke runtime cache path
        if: steps.behavioural_smoke_gate.outputs.enabled == 'true' && steps.behavioural_smoke_pr.outputs.pr_number != ''
        run: |
          set -euo pipefail
          mkdir -p "${{ steps.workspace_state.outputs.workspace_path }}/.ai/review_runtime/"

      - name: Restore behavioural smoke runtime cache
        if: steps.behavioural_smoke_gate.outputs.enabled == 'true' && steps.behavioural_smoke_pr.outputs.pr_number != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          # Must be byte-identical to the `Save review-issue ledger*` path
          # list in review_autofix.yml: actions/cache hashes the path list
          # into the cache version, so any difference (including the old
          # per-run workspace prefix) makes the review run's save
          # unreachable from here. The stage-in step below copies the
          # restored runtime dir into the per-run workspace.
          path: |
            ${{ runner.temp }}/review-ledger-cache/${{ github.repository }}/pr-${{ steps.behavioural_smoke_pr.outputs.pr_number }}/.ai/review_issue_ledger/
            ${{ runner.temp }}/review-ledger-cache/${{ github.repository }}/pr-${{ steps.behavioural_smoke_pr.outputs.pr_number }}/.ai/review_runtime/
            ${{ runner.temp }}/review-ledger-cache/${{ github.repository }}/pr-${{ steps.behavioural_smoke_pr.outputs.pr_number }}/${{ vars.REVIEW_LEDGER_PATH || format('.ai/review_issue_ledger/pr-{0}.txt', steps.behavioural_smoke_pr.outputs.pr_number) }}
          key: review-ledger-${{ github.repository }}-pr-${{ steps.behavioural_smoke_pr.outputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            review-ledger-${{ github.repository }}-pr-${{ steps.behavioural_smoke_pr.outputs.pr_number }}-

      - name: Stage restored behavioural smoke runtime cache into workspace
        if: steps.behavioural_smoke_gate.outputs.enabled == 'true' && steps.behavioural_smoke_pr.outputs.pr_number != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "::warning::RUNNER_TEMP is unset; skipping behavioural smoke runtime cache stage-in."
            exit 0
          fi
          ledger_cache_workspace_root="${{ steps.workspace_state.outputs.workspace_path }}"
          if [ -z "${ledger_cache_workspace_root}" ]; then
            echo "::warning::workspace_path is empty; skipping behavioural smoke runtime cache stage-in."
            exit 0
          fi
          ledger_cache_staging_root="${RUNNER_TEMP}/review-ledger-cache/${GITHUB_REPOSITORY}/pr-${{ steps.behavioural_smoke_pr.outputs.pr_number }}"
          ledger_cache_restored_entries=0
          if [ -d "${ledger_cache_staging_root}/.ai/review_runtime" ]; then
            mkdir -p "${ledger_cache_workspace_root}/.ai/review_runtime"
            cp -a "${ledger_cache_staging_root}/.ai/review_runtime/." "${ledger_cache_workspace_root}/.ai/review_runtime/"
            ledger_cache_restored_entries=1
          fi
          echo "REVIEW_LEDGER_CACHE_STAGE_IN restored_entries=${ledger_cache_restored_entries} staging_root=${ledger_cache_staging_root} workspace_root=${ledger_cache_workspace_root}"

      - name: Record validation run start
        continue-on-error: true
        env:
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          # Auth is scoped to this step; no credential enters origin/.git.
          git_auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="Authorization: Basic ${git_auth_header}"
          source scripts/memory_helpers.sh
          memory_bootstrap --ensure-branch --require memory_record_run_event
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0

          issue_number="${TRACKING_ISSUE}"
          if ! [[ "${issue_number}" =~ ^[0-9]+$ ]] || [ "${issue_number}" -le 0 ]; then
            issue_number=""
          fi

          metadata_json="$(jq -cn \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg tracking_issue "${TRACKING_ISSUE:-0}" \
            '{run_attempt:$run_attempt,tracking_issue:$tracking_issue}')"

          memory_record_run_event \
            --run-id "${{ github.run_id }}" \
            --workflow "validate" \
            --event-type "validation_started" \
            --status "ok" \
            --message "Validation run started for issue ${TRACKING_ISSUE:-0} (attempt ${{ github.run_attempt }})." \
            --issue-number "${issue_number}" \
            --actor "${{ github.actor }}" \
            --metadata-json "${metadata_json}"

      - name: Install Python dependencies for validation renderer
        id: renderer_dependencies
        # "Run validation process" runs under always(), so this preparation must
        # too, or an unrelated earlier failure skips it and validation fails
        # with a misleading "runtime unavailable" (#6521). It still requires the
        # trusted runtime and the trusted support staging, which only succeeds
        # after checkout authorization, and gates on the preceding after_create hook.
        if: always() && !cancelled() && steps.runtime.outcome == 'success' && steps.support_staging.outcome == 'success' && steps.workspace_after_create_hook.outcome != 'failure'
        env:
          RUNTIME_DIR: ${{ steps.runtime.outputs.runtime_dir }}
          WORKSPACE_PATH: ${{ steps.workspace_state.outputs.workspace_path }}
          # Do not source the workspace-directed shell startup file in this host-side step.
          BASH_ENV: ''
        run: |
          set -euo pipefail

          # Check the renderer in the tree validate_process.sh runs it from: the
          # workspace shell context cd's into WORKSPACE_PATH only when it is a
          # directory, and BASH_ENV is cleared here, so resolve it explicitly.
          renderer_root="${WORKSPACE_PATH:-}"
          if [ -z "${renderer_root}" ] || [ ! -d "${renderer_root}" ]; then
            renderer_root="${GITHUB_WORKSPACE}"
          fi
          renderer_path="${renderer_root}/scripts/render_validation_templates.py"
          if [ -f "${renderer_path}" ]; then
            : "${RUNTIME_DIR:?Trusted validation runtime is unavailable}"
            mkdir -m 700 "${RUNTIME_DIR}/renderer-empty"
            cd "${RUNTIME_DIR}/renderer-empty"
            python3 -I -m venv "${RUNTIME_DIR}/renderer-venv"
            "${RUNTIME_DIR}/renderer-venv/bin/python" -I -m pip --isolated install --disable-pip-version-check --quiet pyyaml jsonschema jinja2
            "${RUNTIME_DIR}/renderer-venv/bin/python" -I -c '
          import importlib.util
          import pathlib
          import sys
          import sysconfig
          environment = pathlib.Path(sys.argv[1]).resolve()
          if pathlib.Path(sys.prefix).resolve() != environment:
              raise SystemExit("Renderer interpreter is not the isolated environment")
          roots = [pathlib.Path(sysconfig.get_path(key)).resolve() for key in ("purelib", "platlib")]
          if not all(root.is_relative_to(environment) for root in roots):
              raise SystemExit("Renderer package paths are not in the isolated environment")
          for name in ("yaml", "jsonschema", "jinja2"):
              spec = importlib.util.find_spec(name)
              if spec is None or spec.origin is None or not any(pathlib.Path(spec.origin).resolve().is_relative_to(root) for root in roots):
                  raise SystemExit("Renderer dependency origin is not in the isolated environment: " + name)
              if spec.submodule_search_locations and not all(any(pathlib.Path(location).resolve().is_relative_to(root) for root in roots) for location in spec.submodule_search_locations):
                  raise SystemExit("Renderer dependency search path is not in the isolated environment: " + name)
          import yaml, jsonschema, jinja2
          ' "${RUNTIME_DIR}/renderer-venv"
            echo "renderer_state=prepared" >> "$GITHUB_OUTPUT"
          else
            echo "renderer_state=absent" >> "$GITHUB_OUTPUT"
            echo "::error::Template renderer is unavailable at ${renderer_path}; dependency installation cannot proceed." >&2
            exit 1
          fi

      - name: Determine Semble bootstrap state
        id: semble_gate
        env:
          RUNTIME_DIR: ${{ steps.runtime.outputs.runtime_dir }}
          VALIDATION_USE_SEMBLE: ${{ vars.VALIDATION_USE_SEMBLE || 'true' }}
          SERENA_ENABLED: ${{ env.SERENA_ENABLED }}
        run: |
          set -euo pipefail

          enabled="false"
          serena_enabled="false"
          bootstrap_enabled="false"
          case "$(printf '%s' "${VALIDATION_USE_SEMBLE}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on)
              enabled="true"
              ;;
          esac
          case "$(printf '%s' "${SERENA_ENABLED}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on)
              serena_enabled="true"
              ;;
          esac

          if [ "${enabled}" = "true" ] && [ "$(printf '%s' "${SEMBLE_BOOTSTRAP_MODE:-eager}" | tr '[:upper:]' '[:lower:]')" = "lazy" ]; then
            echo "SEMBLE_ENABLED=true" >> "$GITHUB_ENV"
          fi
          if { [ "${enabled}" = "true" ] && [ "$(printf '%s' "${SEMBLE_BOOTSTRAP_MODE:-eager}" | tr '[:upper:]' '[:lower:]')" != "lazy" ]; } || [ "${serena_enabled}" = "true" ]; then
            bootstrap_enabled="true"
          fi

          index_path="${RUNTIME_DIR}/.semble-index"
          {
            echo "enabled=${enabled}"
            echo "serena_enabled=${serena_enabled}"
            echo "bootstrap_enabled=${bootstrap_enabled}"
            echo "index_path=${index_path}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "SEMBLE_AVAILABLE=false"
            echo "SEMBLE_INDEX_AVAILABLE=false"
            echo "SEMBLE_INDEX_PATH=${index_path}"
          } >> "$GITHUB_ENV"

          if [ "${enabled}" != "true" ]; then
            echo "::notice::Validation Semble bootstrap disabled via VALIDATION_USE_SEMBLE=${VALIDATION_USE_SEMBLE}."
          fi

      - name: setup-uv
        if: steps.semble_gate.outputs.bootstrap_enabled == 'true'
        continue-on-error: true
        uses: astral-sh/setup-uv@v7

      - name: Install semble
        if: steps.semble_gate.outputs.enabled == 'true' && env.SEMBLE_BOOTSTRAP_MODE != 'lazy'
        # Defense-in-depth: install_semble.sh + the file-existence guard
        # below are both fail-soft already (script writes
        # SEMBLE_AVAILABLE=false on any error; missing-script branch
        # exits 0), but the step-level guard makes the contract explicit
        # at the step boundary — matches the pattern in
        # implement.yml / orchestrate_poll.yml / workflow-log-analysis.yml.
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          VALIDATION_USE_SEMBLE: ${{ vars.VALIDATION_USE_SEMBLE || 'true' }}
        run: |
          set -euo pipefail

          semble_enabled="false"
          case "$(printf '%s' "${VALIDATION_USE_SEMBLE}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on)
              semble_enabled="true"
              ;;
          esac

          if [ "${semble_enabled}" != "true" ]; then
            echo "::notice::VALIDATION_USE_SEMBLE is not true; skipping Semble install."
            echo "SEMBLE_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ ! -f "scripts/install_semble.sh" ]; then
            echo "::notice::scripts/install_semble.sh is unavailable; validation will continue without Semble."
            exit 0
          fi

          if ! bash scripts/install_semble.sh; then
            echo "::warning::scripts/install_semble.sh exited non-zero; validation will continue without Semble."
          fi

      - name: Build semble index
        if: steps.semble_gate.outputs.enabled == 'true' && env.SEMBLE_BOOTSTRAP_MODE != 'lazy'
        # Defense-in-depth: the file-existence guard and shared script are
        # both fail-soft already, but `continue-on-error: true` makes the
        # contract explicit at the step boundary — matches the pattern in
        # implement.yml / orchestrate_poll.yml / workflow-log-analysis.yml.
        continue-on-error: true
        env:
          RUNTIME_DIR: ${{ steps.runtime.outputs.runtime_dir }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail

          if [ ! -f "scripts/semble_helpers.sh" ]; then
            echo "::notice::scripts/semble_helpers.sh is unavailable; validation prompts will continue without Semble context."
            {
              echo "SEMBLE_INDEX_AVAILABLE=false"
              echo "SEMBLE_INDEX_PATH=${RUNTIME_DIR}/.semble-index"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          # Shared BM25 wrapper builder — see scripts/build_semble_wrapper.sh
          # for the rationale (semble 0.1.3 ships no index/query CLI surface,
          # so we pickle a BM25 index from semble's Python primitives and
          # expose a wrapper binary that satisfies semble_helpers.sh's
          # `semble query` contract). Fail-soft: missing-script case is
          # handled here (older @stable refs may not yet ship the script);
          # all other errors are handled inside the script (writes
          # SEMBLE_INDEX_AVAILABLE=false on any error and exits 0).
          if [ -f scripts/build_semble_wrapper.sh ]; then
            SEMBLE_INDEX_PATH="${RUNTIME_DIR}/.semble-index" \
            SEMBLE_WRAPPER_DIR="${RUNTIME_DIR}/semble/bin" \
              bash scripts/build_semble_wrapper.sh
          else
            echo "::notice::scripts/build_semble_wrapper.sh is unavailable; validation prompts will continue without Semble context."
            {
              echo "SEMBLE_INDEX_AVAILABLE=false"
              echo "SEMBLE_INDEX_PATH=${RUNTIME_DIR}/.semble-index"
            } >> "$GITHUB_ENV"
          fi

      - name: Run workspace before_run hook
        id: workspace_before_run_hook
        run: |
          set -euo pipefail
          : "${VALIDATE_HOOK_HELPER:?Trusted validation hook helper is unavailable}"
          bash "${VALIDATE_HOOK_HELPER}" validate before_run

      - name: Run validation process
        id: validate_run
        if: always() && steps.workspace_after_create_hook.outcome != 'failure' && steps.workspace_before_run_hook.outcome != 'failure'
        continue-on-error: true
        env:
          RUNTIME_DIR: ${{ steps.runtime.outputs.runtime_dir }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          VALIDATION_TIMEOUT: ${{ inputs.validation_timeout }}
          VALIDATION_COMPOSE_FILE: ${{ inputs.compose_file }}
          TOOL_CALL_BUDGET_VALIDATE: ${{ vars.TOOL_CALL_BUDGET_VALIDATE || '60' }}
          MAX_CODEX_ATTEMPTS: ${{ vars.MAX_CODEX_ATTEMPTS || '3' }}
          CODEX_RETRY_BACKOFF_BASE_SECS: ${{ vars.CODEX_RETRY_BACKOFF_BASE_SECS || '10' }}
          MODEL_EDITOR: ${{ env.MODEL_EDITOR }}
          MODEL_REASONING_EFFORT: ${{ env.MODEL_REASONING_EFFORT }}
          AI_ENGINE: ${{ vars.AI_ENGINE || '' }}
          AI_ENGINE_VALIDATE: ${{ vars.AI_ENGINE_VALIDATE || '' }}
          AI_ENGINE_VALIDATE_SELF_HEAL: ${{ vars.AI_ENGINE_VALIDATE_SELF_HEAL || '' }}
          # Scheduled mode (#7553): no self-heal, no model phases, and no
          # per-phase alerts (the sink step sends one WARNING when it opens
          # the failure issue).
          MAX_SELF_HEAL_ATTEMPTS: ${{ env.VALIDATE_SCHEDULED_MODE == 'true' && '0' || vars.MAX_SELF_HEAL_ATTEMPTS || '2' }}
          VALIDATE_DETERMINISTIC_ONLY: ${{ env.VALIDATE_SCHEDULED_MODE }}
          # Harness-owned failures go to workflow failure heal (README "Runtime
          # Validation Phase" > "Harness-owned failures"); false restores the old path.
          VALIDATION_HARNESS_HEAL_ENABLED: ${{ vars.VALIDATION_HARNESS_HEAL_ENABLED || 'true' }}
          VALIDATION_USE_TEMPLATES: ${{ vars.VALIDATION_USE_TEMPLATES || 'true' }}
          VALIDATION_RENDERER_DEPENDENCIES_READY: ${{ steps.renderer_dependencies.outcome == 'success' && steps.renderer_dependencies.outputs.renderer_state == 'prepared' }}
          VALIDATION_RENDERER_DEPENDENCIES_OUTCOME: ${{ steps.renderer_dependencies.outcome }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID || '' }}
          ALERT_MSG_LEVEL: ${{ env.VALIDATE_SCHEDULED_MODE == 'true' && 'SILENT' || inputs.alert_msg_level || vars.ALERT_MSG_LEVEL || 'WARNING' }}
        run: |
          set -euo pipefail
          validate_process_rc=0
          bash scripts/validate_process.sh || validate_process_rc=$?
          if [ "${validate_process_rc}" -eq 80 ]; then
            # Claude capacity wait (issue #7370): no verdict label. The report
            # step labels the tracking issue; the capacity-resume pass removes
            # the label and the poller re-dispatches validation.
            echo "AI_ENGINE_CAPACITY_WAIT role=VALIDATE outcome=deferred stage=validate"
            echo "CLAUDE_CAPACITY_WAIT=true" >> "${GITHUB_ENV}"
            exit 0
          fi
          exit "${validate_process_rc}"

      - name: Run workspace after_run hook
        if: always() && steps.validate_run.outcome != 'skipped'
        run: |
          set -euo pipefail
          : "${VALIDATE_HOOK_HELPER:?Trusted validation hook helper is unavailable}"
          bash "${VALIDATE_HOOK_HELPER}" validate after_run

      - name: Stage validate hints cache for save
        if: always() && steps.validate_run.outcome != 'skipped'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "::warning::RUNNER_TEMP is unset; skipping validate hints cache stage-out."
            exit 0
          fi
          validate_hints_cache_workspace_root="${{ steps.workspace_state.outputs.workspace_path }}"
          if [ -z "${validate_hints_cache_workspace_root}" ]; then
            echo "::warning::workspace_path is empty; skipping validate hints cache stage-out."
            exit 0
          fi
          validate_hints_cache_staging_dir="${RUNNER_TEMP}/validate-hints-cache/${GITHUB_REPOSITORY}/${{ hashFiles('docker-compose*.yml', 'compose*.yml', '**/Dockerfile', '**/Dockerfile.*', '**/package.json', '**/pyproject.toml', '**/requirements*.txt', '**/go.mod', '**/Cargo.toml') }}/.ai/validate-hints-cache"
          validate_hints_cache_workspace_dir="${validate_hints_cache_workspace_root}/.ai/validate-hints-cache"
          rm -rf "${validate_hints_cache_staging_dir}"
          validate_hints_cache_staged_entries=0
          if [ -d "${validate_hints_cache_workspace_dir}" ]; then
            mkdir -p "$(dirname "${validate_hints_cache_staging_dir}")"
            cp -a "${validate_hints_cache_workspace_dir}" "${validate_hints_cache_staging_dir}"
            validate_hints_cache_staged_entries=1
          fi
          echo "VALIDATE_HINTS_CACHE_STAGE_OUT staged_entries=${validate_hints_cache_staged_entries} staging_dir=${validate_hints_cache_staging_dir} workspace_dir=${validate_hints_cache_workspace_dir}"

      - name: Collect validation status
        id: collect_status
        if: env.CLAUDE_CAPACITY_WAIT != 'true' && (always())
        env:
          RUNTIME_DIR: ${{ steps.runtime.outputs.runtime_dir }}
        run: |
          set -euo pipefail

          STATUS_FILE_PATH="${RUNTIME_DIR}/validation_status.json"
          METADATA_FILE_PATH="${RUNTIME_DIR}/validation_metadata.json"

          if [ ! -f "${STATUS_FILE_PATH}" ]; then
            jq -n \
              --arg status "error" \
              --arg raw_status "codex_failure" \
              --arg summary "Validation process did not produce validation_status.json." \
              --arg failure_summary "Missing status artifact. Check validate_process.sh output and uploaded artifacts." \
              '{
                status: $status,
                raw_status: $raw_status,
                summary: $summary,
                failure_summary: $failure_summary
              }' > "${STATUS_FILE_PATH}"
          fi

          status="$(jq -r '.status // "error"' "${STATUS_FILE_PATH}")"
          raw_status="$(jq -r '.raw_status // .status // "error"' "${STATUS_FILE_PATH}")"
          summary="$(jq -r '.summary // ""' "${STATUS_FILE_PATH}" | tr '\n' ' ' | sed -e 's/[[:space:]]\+/ /g' -e 's/^ //; s/ $//')"
          failure_summary="$(jq -r '.failure_summary // ""' "${STATUS_FILE_PATH}" | tr '\n' ' ' | sed -e 's/[[:space:]]\+/ /g' -e 's/^ //; s/ $//')"

          # Harness ownership (docs/plans/validation-failure-harness-routing-plan.md,
          # Phase 1). scripts/validate_process.sh writes these fields after the
          # model phases ran, so each value is checked against a fixed vocabulary
          # or pattern before it becomes an output. Anything else turns the heal
          # report off (fail closed: nothing is reported).
          failure_owner="$(jq -r '(.failure_owner // "none") | tostring' "${STATUS_FILE_PATH}" 2>/dev/null || echo none)"
          case "${failure_owner}" in
            harness|project|mixed|none) ;;
            *) failure_owner="none" ;;
          esac
          harness_stage="$(jq -r '(.harness_stage // "") | tostring' "${STATUS_FILE_PATH}" 2>/dev/null || true)"
          [[ "${harness_stage}" =~ ^[a-z_]{1,40}$ ]] || harness_stage=""
          harness_reason="$(jq -r '(.harness_reason // "") | tostring' "${STATUS_FILE_PATH}" 2>/dev/null || true)"
          [[ "${harness_reason}" =~ ^[a-z_]{1,40}$ ]] || harness_reason=""
          harness_fp="$(jq -r '(.harness_fp // "") | tostring' "${STATUS_FILE_PATH}" 2>/dev/null || true)"
          [[ "${harness_fp}" =~ ^[0-9a-f]{64}$ ]] || harness_fp=""
          harness_report="$(jq -r 'if .harness_report == true then "true" else "false" end' "${STATUS_FILE_PATH}" 2>/dev/null || echo false)"
          [ "${harness_report}" = "true" ] || harness_report="false"
          case "${failure_owner}" in
            harness|mixed) ;;
            *) harness_report="false" ;;
          esac
          if [ -z "${harness_stage}" ] || [ -z "${harness_reason}" ] || [ -z "${harness_fp}" ]; then
            harness_report="false"
          fi
          # The heal-report job runs on another runner, so the signature file
          # travels as a base64 job output: exact bytes (the reporter recomputes
          # the fingerprint from them), at most 1024 bytes, base64 alphabet only.
          harness_signature_b64=""
          harness_signature_path="${RUNTIME_DIR}/validation_harness_signature.txt"
          if [ "${harness_report}" = "true" ] && [ -f "${harness_signature_path}" ] && [ ! -L "${harness_signature_path}" ]; then
            harness_signature_bytes="$(wc -c < "${harness_signature_path}" 2>/dev/null | tr -d '[:space:]' || true)"
            if [[ "${harness_signature_bytes}" =~ ^[0-9]+$ ]] && [ "${harness_signature_bytes}" -ge 1 ] && [ "${harness_signature_bytes}" -le 1024 ]; then
              harness_signature_b64="$(base64 -w0 < "${harness_signature_path}" 2>/dev/null || true)"
              [[ "${harness_signature_b64}" =~ ^[A-Za-z0-9+/=]{4,1368}$ ]] || harness_signature_b64=""
            fi
          fi

          if [ ! -f "${METADATA_FILE_PATH}" ]; then
            jq -n \
              --arg status "${status}" \
              --arg raw_status "${raw_status}" \
              --arg summary "${summary}" \
              --arg failure_summary "${failure_summary}" \
              '{
                status: $status,
                raw_status: $raw_status,
                summary: $summary,
                failure_summary: (if ($failure_summary | length) > 0 then $failure_summary else null end),
                generated_at_utc: (now | todateiso8601)
              }' > "${METADATA_FILE_PATH}"
          fi

          {
            echo "status=${status}"
            echo "raw_status=${raw_status}"
            echo "summary=${summary}"
            echo "failure_summary=${failure_summary}"
            echo "status_file=${STATUS_FILE_PATH}"
            echo "metadata_file=${METADATA_FILE_PATH}"
            echo "failure_owner=${failure_owner}"
            echo "harness_report=${harness_report}"
            echo "harness_stage=${harness_stage}"
            echo "harness_reason=${harness_reason}"
            echo "harness_fp=${harness_fp}"
            echo "harness_signature_b64=${harness_signature_b64}"
          } >> "$GITHUB_OUTPUT"

      - name: Emit Serena stats
        if: env.CLAUDE_CAPACITY_WAIT != 'true' && (always())
        continue-on-error: true
        env:
          RUNTIME_DIR: ${{ steps.runtime.outputs.runtime_dir }}
        run: |
          set -euo pipefail

          if [ ! -f scripts/serena_stats_emit.py ]; then
            echo "::notice::serena_stats_emit.py is unavailable; skipping Serena stats emission."
            exit 0
          fi
          if [ -z "${RUNTIME_DIR:-}" ] || [ ! -d "${RUNTIME_DIR}" ]; then
            echo "::notice::RUNTIME_DIR is unavailable; skipping Serena stats emission."
            exit 0
          fi

          serena_stat_args=(--target validate)
          while IFS= read -r -d '' log_path; do
            serena_stat_args+=(--log "${log_path}")
          done < <(find "${RUNTIME_DIR}" -maxdepth 1 -type f \( -name 'validate_discover.log' -o -name 'validate_diagnose.log' -o -name 'validate_self_heal.log' \) -print0 2>/dev/null)

          if [ "${#serena_stat_args[@]}" -le 2 ]; then
            echo "::notice::No Serena log files were found for this validate run."
            exit 0
          fi

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/serena_stats_emit.py "${serena_stat_args[@]}"

      - name: Record validation candidate
        if: env.CLAUDE_CAPACITY_WAIT != 'true' && (always())
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          STATUS_FILE_PATH: ${{ steps.collect_status.outputs.status_file }}
          STATUS_VALUE: ${{ steps.collect_status.outputs.status }}
          RAW_STATUS_VALUE: ${{ steps.collect_status.outputs.raw_status }}
          SUMMARY_VALUE: ${{ steps.collect_status.outputs.summary }}
          FAILURE_SUMMARY_VALUE: ${{ steps.collect_status.outputs.failure_summary }}
        run: |
          set -euo pipefail

          source scripts/memory_helpers.sh
          memory_bootstrap --require memory_record_candidate

          issue_number="${TRACKING_ISSUE}"
          if ! [[ "${issue_number}" =~ ^[0-9]+$ ]] || [ "${issue_number}" -le 0 ]; then
            issue_number=""
          fi

          status_value="${STATUS_VALUE:-error}"
          summary_value="${SUMMARY_VALUE:-}"
          failure_summary_value="${FAILURE_SUMMARY_VALUE:-}"

          if [ -n "${STATUS_FILE_PATH:-}" ] && [ -f "${STATUS_FILE_PATH}" ]; then
            parsed_status="$(jq -r '.status // empty' "${STATUS_FILE_PATH}" 2>/dev/null || true)"
            parsed_summary="$(jq -r '.summary // empty' "${STATUS_FILE_PATH}" 2>/dev/null || true)"
            parsed_failure_summary="$(jq -r '.failure_summary // empty' "${STATUS_FILE_PATH}" 2>/dev/null || true)"

            if [ -n "${parsed_status}" ]; then
              status_value="${parsed_status}"
            fi
            if [ -n "${parsed_summary}" ]; then
              summary_value="${parsed_summary}"
            fi
            if [ -n "${parsed_failure_summary}" ]; then
              failure_summary_value="${parsed_failure_summary}"
            fi
          fi
          raw_status="${RAW_STATUS_VALUE:-}"
          if [ -z "${raw_status}" ] && [ -n "${STATUS_FILE_PATH:-}" ] && [ -f "${STATUS_FILE_PATH}" ]; then
            parsed_raw_status="$(jq -r '.raw_status // empty' "${STATUS_FILE_PATH}" 2>/dev/null || true)"
            if [ -n "${parsed_raw_status}" ]; then
              raw_status="${parsed_raw_status}"
            fi
          fi
          raw_status="${raw_status:-${status_value}}"

          summary_compact="$(printf '%s' "${summary_value}" | tr '\n' ' ' | sed -e 's/[[:space:]]\+/ /g' -e 's/^ //; s/ $//')"
          failure_summary_compact="$(printf '%s' "${failure_summary_value}" | tr '\n' ' ' | sed -e 's/[[:space:]]\+/ /g' -e 's/^ //; s/ $//')"

          candidate_summary="${summary_compact}"
          if [ -z "${candidate_summary}" ]; then
            candidate_summary="Validation status ${status_value}."
          fi
          candidate_summary="${candidate_summary:0:220}"

          candidate_details="status=${status_value}; raw_status=${raw_status}; summary=${summary_compact}; failure_summary=${failure_summary_compact}"
          candidate_details="$(printf '%s' "${candidate_details}" | tr '\n' ' ' | sed -e 's/[[:space:]]\+/ /g' -e 's/^ //; s/ $//')"
          candidate_details="${candidate_details:0:600}"

          confidence="0.70"
          if [ "${status_value}" = "pass" ]; then
            confidence="0.90"
          fi

          memory_record_candidate \
            --category "patterns" \
            --summary "${candidate_summary}" \
            --details "${candidate_details}" \
            --confidence "${confidence}" \
            --workflow "validate" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --actor "${{ github.actor }}" \
            --issue-number "${issue_number}"

      - name: Upload validation artifacts
        if: env.CLAUDE_CAPACITY_WAIT != 'true' && (always())
        uses: actions/upload-artifact@v6
        with:
          name: ai-validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ steps.runtime.outputs.runtime_dir }}/
            ${{ steps.workspace_state.outputs.workspace_path }}/validation/

      - name: Write run summary
        if: env.CLAUDE_CAPACITY_WAIT != 'true' && (always())
        env:
          SUMMARY_TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          SUMMARY_COMPOSE_FILE: ${{ inputs.compose_file }}
          SUMMARY_TIMEOUT: ${{ inputs.validation_timeout }}
          SUMMARY_STATUS: ${{ steps.collect_status.outputs.status }}
          SUMMARY_TEXT: ${{ steps.collect_status.outputs.summary }}
          SUMMARY_FAILURE_TEXT: ${{ steps.collect_status.outputs.failure_summary }}
        run: |
          set -euo pipefail

          summary_text_escaped="${SUMMARY_TEXT//|/\\|}"
          failure_text_escaped="${SUMMARY_FAILURE_TEXT//|/\\|}"

          {
            echo "## AI Validate Summary"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Model | \`${MODEL_EDITOR}\` |"
            echo "| Reasoning effort | \`${MODEL_REASONING_EFFORT}\` |"
            printf '| Tracking issue | `%s` |\n' "${SUMMARY_TRACKING_ISSUE}"
            printf '| Compose fallback | `%s` |\n' "${SUMMARY_COMPOSE_FILE}"
            printf '| Idle timeout (minutes) | `%s` |\n' "${SUMMARY_TIMEOUT}"
            printf '| Status | `%s` |\n' "${SUMMARY_STATUS}"
            printf '| Summary | %s |\n' "${summary_text_escaped}"
            if [ -n "${SUMMARY_FAILURE_TEXT}" ]; then
              printf '| Failure summary | %s |\n' "${failure_text_escaped}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record validation run end
        if: env.CLAUDE_CAPACITY_WAIT != 'true' && (always())
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          STATUS_FILE_PATH: ${{ steps.collect_status.outputs.status_file }}
          STATUS_VALUE: ${{ steps.collect_status.outputs.status }}
          RAW_STATUS_VALUE: ${{ steps.collect_status.outputs.raw_status }}
          SUMMARY_VALUE: ${{ steps.collect_status.outputs.summary }}
          FAILURE_SUMMARY_VALUE: ${{ steps.collect_status.outputs.failure_summary }}
        run: |
          set -euo pipefail

          source scripts/memory_helpers.sh
          memory_bootstrap --require memory_record_run_event

          issue_number="${TRACKING_ISSUE}"
          if ! [[ "${issue_number}" =~ ^[0-9]+$ ]] || [ "${issue_number}" -le 0 ]; then
            issue_number=""
          fi

          status_value="${STATUS_VALUE:-error}"
          event_status="error"
          if [ "${status_value}" = "pass" ]; then
            event_status="ok"
          fi

          completion_message="${SUMMARY_VALUE:-}"
          if [ -z "${completion_message}" ]; then
            completion_message="${FAILURE_SUMMARY_VALUE:-}"
          fi
          if [ -z "${completion_message}" ]; then
            completion_message="Validation run completed with status ${status_value}."
          fi
          completion_message="$(printf '%s' "${completion_message}" | tr '\n' ' ' | sed -e 's/[[:space:]]\+/ /g' -e 's/^ //; s/ $//')"
          completion_message="${completion_message:0:280}"

          raw_status="${RAW_STATUS_VALUE:-}"
          if [ -z "${raw_status}" ] && [ -n "${STATUS_FILE_PATH:-}" ] && [ -f "${STATUS_FILE_PATH}" ]; then
            parsed_raw_status="$(jq -r '.raw_status // empty' "${STATUS_FILE_PATH}" 2>/dev/null || true)"
            if [ -n "${parsed_raw_status}" ]; then
              raw_status="${parsed_raw_status}"
            fi
          fi
          raw_status="${raw_status:-${status_value}}"
          metadata_json="$(jq -cn \
            --arg raw_status "${raw_status}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            '{raw_status:$raw_status,run_attempt:$run_attempt}')"

          memory_record_run_event \
            --run-id "${{ github.run_id }}" \
            --workflow "validate" \
            --event-type "validation_completed" \
            --status "${event_status}" \
            --message "${completion_message}" \
            --issue-number "${issue_number}" \
            --actor "${{ github.actor }}" \
            --metadata-json "${metadata_json}"

      # Issue #7553: a scheduled run reports its result in one deduplicated
      # ai:scheduled-validation-failed issue in this repository (opened with one
      # Telegram WARNING, updated in place, closed when a later run passes).
      # Runs only the trusted support copy of the helper, never the checkout.
      # A cancelled run is not evidence of a red branch, so it reports nothing.
      - name: Report scheduled validation result
        id: scheduled_sink
        if: "!cancelled() && env.VALIDATE_SCHEDULED_MODE == 'true' && env.CLAUDE_CAPACITY_WAIT != 'true'"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SINK_STATUS: ${{ steps.collect_status.outputs.status }}
          SINK_RAW_STATUS: ${{ steps.collect_status.outputs.raw_status }}
          SINK_SUMMARY: ${{ steps.collect_status.outputs.summary }}
          SINK_FAILURE_SUMMARY: ${{ steps.collect_status.outputs.failure_summary }}
          SINK_RESULT_FILE: ${{ steps.runtime.outputs.runtime_dir }}/validation_result.json
          SINK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SINK_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID || '' }}
          ALERT_MSG_LEVEL: ${{ inputs.alert_msg_level || vars.ALERT_MSG_LEVEL || 'WARNING' }}
          # Do not source the workspace-directed shell startup file here.
          BASH_ENV: ''
        run: |
          sink_support_dir="${VALIDATE_HELPER_STAGE_DIR:-}"
          sink_script="${sink_support_dir}/scripts/validate_scheduled_sink.sh"
          if [ -z "${sink_support_dir}" ] || [ ! -f "${sink_script}" ] || [ -L "${sink_script}" ]; then
            echo "::warning::VALIDATE_SCHEDULED_SINK outcome=skip reason=support_missing"
            exit 0
          fi
          SINK_HEAD_SHA="$(env -u GIT_DIR -u GIT_WORK_TREE git -C "${GITHUB_WORKSPACE}" rev-parse HEAD 2>/dev/null || true)" \
            bash "${sink_script}" || true

      - name: Force orchestrate poll after validation finalization
        if: env.CLAUDE_CAPACITY_WAIT != 'true' && (always())
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
        run: |
          set -euo pipefail

          if ! [[ "${TRACKING_ISSUE:-}" =~ ^[0-9]+$ ]] || [ "${TRACKING_ISSUE:-0}" -le 0 ]; then
            echo "No tracking issue provided; skipping force-tick dispatch."
            exit 0
          fi

          bash scripts/orchestrate_force_tick.sh \
            --repo "${{ github.repository }}" \
            --tracking-issue "${TRACKING_ISSUE}" \
            --issue "${TRACKING_ISSUE}" \
            --reason "validation-finalized" \
            --source-workflow "validate" \
            --run-id "${{ github.run_id }}"

      - name: Run workspace before_remove hook
        if: always()
        run: |
          set -euo pipefail
          : "${VALIDATE_HOOK_HELPER:?Trusted validation hook helper is unavailable}"
          bash "${VALIDATE_HOOK_HELPER}" validate before_remove

      - name: Enforce validation outcome
        if: env.CLAUDE_CAPACITY_WAIT != 'true' && (always())
        env:
          VALIDATION_STATUS: ${{ steps.collect_status.outputs.status }}
          VALIDATION_RAW_STATUS: ${{ steps.collect_status.outputs.raw_status }}
        run: |
          set -euo pipefail
          if [ "${VALIDATION_STATUS}" = "pass" ]; then
            exit 0
          fi
          # Exit 2 for harness_error so orchestration can distinguish a harness
          # defect (generator/canary produced an incorrect test) from an
          # application-side failure; exit 1 for every other non-pass outcome.
          if [ "${VALIDATION_RAW_STATUS}" = "harness_error" ]; then
            echo "Validation did not pass (harness error)."
            exit 2
          fi
          echo "Validation did not pass."
          exit 1
      # Plan item 3e (D1): report every refused (non-capacity) Claude fallback
      # recorded by scripts/ai_engine.sh in this job's RUNNER_TEMP as a
      # workflow-failure-heal dispatch plus one Telegram WARNING. Runs only
      # the copy in the trusted support checkout, never a PR-head script.
      - name: Report refused AI engine fallbacks
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          WORKFLOW_HEAL_ENABLED: ${{ vars.WORKFLOW_HEAL_ENABLED || 'true' }}
          REPORT_WORKFLOW_NAME: ${{ github.workflow }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID || '' }}
        run: |
          fallback_support_dir="${VALIDATE_HELPER_STAGE_DIR:-}"
          fallback_report="${fallback_support_dir}/scripts/ai_engine_fallback_report.sh"
          if [ -n "${fallback_support_dir}" ] && [ -f "${fallback_report}" ] && [ ! -L "${fallback_report}" ]; then
            REPORT_WRAPPER_SHA="$(env -u GIT_DIR -u GIT_WORK_TREE git -C "${fallback_support_dir}" rev-parse HEAD 2>/dev/null || true)" \
              bash "${fallback_report}" || true
          else
            echo "::warning::AI_ENGINE_FALLBACK_REPORT skip reason=support_missing"
          fi

  heal-report:
    # Workflow failure heal (README "Runtime Validation Phase" > "Harness-owned
    # failures"; docs/plans/validation-failure-harness-routing-plan.md, Phase 1).
    # A runtime validation failure owned by the harness this repository ships
    # (a Layer 0 stage, a harness_error diagnosis, or needs_fixes whose files
    # are all harness-managed; a mixed result too) is reported to
    # coding-workflows' heal intake as one `validation_failure` report, so the
    # harness is fixed upstream instead of filing fix-up issues the project
    # cannot act on. Only a failed validate job with a validated
    # harness_report output is reported: a cancelled run was superseded or
    # timed out, and the intake requires a failed run conclusion. A separate
    # job, so the validate job has finished and the intake reads its complete
    # log. The signature file reaches this runner as the base64 job output
    # harness_signature_b64 (checked against the base64 alphabet on both
    # sides) and is decoded into RUNNER_TEMP. Granted only `id-token: write`
    # (every caller wrapper grants it) so the reporter can attach the OIDC
    # report identity the intake verifies; GH_PAT does the work. The reporter
    # always exits 0. VALIDATION_HARNESS_HEAL_ENABLED=false turns it off.
    needs: validate
    if: >-
      always() && needs.validate.result == 'failure' &&
      needs.validate.outputs.harness_report == 'true' &&
      inputs.tracking_issue != '' && inputs.tracking_issue != '0' &&
      !contains(fromJson('["false"]'), vars.WORKFLOW_HEAL_ENABLED) &&
      !contains(fromJson('["false"]'), vars.VALIDATION_HARNESS_HEAL_ENABLED)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      WORKFLOW_HEAL_ENABLED: ${{ vars.WORKFLOW_HEAL_ENABLED || 'true' }}
      VALIDATION_HARNESS_HEAL_ENABLED: ${{ vars.VALIDATION_HARNESS_HEAL_ENABLED || 'true' }}
      WORKFLOW_HEAL_PHASE: validate
      WORKFLOW_HEAL_ISSUE_NUMBER: ${{ inputs.tracking_issue }}
      WORKFLOW_HEAL_VALIDATION_STAGE: ${{ needs.validate.outputs.harness_stage }}
      WORKFLOW_HEAL_VALIDATION_REASON: ${{ needs.validate.outputs.harness_reason }}
      WORKFLOW_HEAL_VALIDATION_FP: ${{ needs.validate.outputs.harness_fp }}
      VALIDATION_SIGNATURE_B64: ${{ needs.validate.outputs.harness_signature_b64 }}
      REPORT_WORKFLOW_NAME: ${{ github.workflow }}
    steps:
      - name: Resolve workflow support ref
        env:
          SUPPORT_REF_WORKFLOW_JOB_JSON: ${{ toJSON(job) }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          # Expression values reach the script only through env (never run: source).
          SUPPORT_REF_REPOSITORY: ${{ github.repository }}
          SUPPORT_REF_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          if [ "${SUPPORT_REF_REPOSITORY:-}" = "${wf_source}" ]; then
            promote_candidate_support_ref="${SUPPORT_REF_HEAD_SHA:-}"
            promote_candidate_workflow_ref="$(jq -r '.workflow_ref // ""' <<< "${SUPPORT_REF_WORKFLOW_JOB_JSON:-}" 2>/dev/null || true)"
            # Pipeline runs of this repository pinned to the protected promote-candidate
            # branch (promote cycle, docs/plans/pin-promote-cycle-to-candidate-plan.md)
            # take support code from that branch's tip. A look-alike ref, an unprotected
            # branch or a failed read keep github.sha.
            if [[ "${promote_candidate_workflow_ref}" =~ ^shubhodeep1/coding-workflows/\.github/workflows/validate\.yml@refs/heads/promote-candidate$ ]]; then
              # One branches read, only on this path: no earlier call in this step
              # returns the promote-candidate tip or its protection flag.
              source "${GH_API_RETRY_HELPERS:-/dev/null}" 2>/dev/null || true
              type gh_api_retry >/dev/null 2>&1 || gh_api_retry() { while [ "${1:-}" = --idempotent ] || [ "${1:-}" = --optional ]; do shift; done; gh api "$@"; }
              promote_candidate_json="$(gh_api_retry repos/shubhodeep1/coding-workflows/branches/promote-candidate 2>/dev/null || true)"
              promote_candidate_sha="$(jq -r 'if .protected == true then (.commit.sha // "") else "" end' <<< "${promote_candidate_json}" 2>/dev/null || true)"
              if [[ "${promote_candidate_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                promote_candidate_support_ref="${promote_candidate_sha}"
                echo "SUPPORT_REF source=promote_candidate sha=${promote_candidate_sha}"
              else
                echo "SUPPORT_REF source=promote_candidate_unprotected"
              fi
            fi
            echo "SCRIPT_REF=${promote_candidate_support_ref}" >> "$GITHUB_ENV"
          else
            # A consumer wrapper pins this workflow to a commit (<file>@<sha>);
            # take the support scripts from that same commit, not a newer
            # stable (as implement.yml's heal-report job). Tags, branches and
            # any other identity keep stable.
            support_ref_pin="stable"
            support_ref_workflow_ref="$(jq -r '.workflow_ref // ""' <<< "${SUPPORT_REF_WORKFLOW_JOB_JSON:-}" 2>/dev/null || true)"
            if [[ "${support_ref_workflow_ref}" =~ ^shubhodeep1/coding-workflows/\.github/workflows/validate\.yml@[0-9a-f]{40}$ ]]; then
              support_ref_pin="${support_ref_workflow_ref##*@}"
            fi
            echo "SUPPORT_REF ref=${support_ref_pin} workflow_ref=${support_ref_workflow_ref:-unknown}"
            echo "SCRIPT_REF=${support_ref_pin}" >> "$GITHUB_ENV"
          fi

      - name: Checkout workflow support source
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: shubhodeep1/coding-workflows
          ref: ${{ env.SCRIPT_REF }}
          token: ${{ secrets.GH_PAT }}
          path: .codex-workflow-src
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts

      - name: Report the harness-owned validation failure to workflow failure heal
        run: |
          set -euo pipefail
          reporter=".codex-workflow-src/scripts/workflow_failure_heal_phase_report.sh"
          if [ ! -f "${reporter}" ]; then
            echo "WORKFLOW_HEAL_PHASE_REPORT skip reason=reporter_missing ref=${SCRIPT_REF}"
            exit 0
          fi
          # A pinned support ref must be exactly the commit the caller pinned
          # (tele-funtoken-msg-scoring#4566); never run another ref's reporter.
          if [[ "${SCRIPT_REF}" =~ ^[0-9a-f]{40}$ ]] && [ "$(git -C .codex-workflow-src rev-parse HEAD 2>/dev/null || true)" != "${SCRIPT_REF}" ]; then
            echo "WORKFLOW_HEAL_PHASE_REPORT skip reason=support_ref_mismatch ref=${SCRIPT_REF}"
            exit 0
          fi
          report_dir="${RUNNER_TEMP}/workflow-heal-phase-report"
          mkdir -p "${report_dir}" || { echo "::warning::WORKFLOW_HEAL_PHASE_REPORT skip reason=report_dir_unavailable"; exit 0; }
          # Decode the signature only when the job output is plain base64; the
          # reporter skips (and logs why) when the variable is left empty.
          WORKFLOW_HEAL_VALIDATION_SIGNATURE_FILE=""
          if [[ "${VALIDATION_SIGNATURE_B64:-}" =~ ^[A-Za-z0-9+/=]{4,1368}$ ]]; then
            signature_file="${report_dir}/validation_harness_signature.txt"
            rm -f "${signature_file}"
            if printf '%s' "${VALIDATION_SIGNATURE_B64}" | base64 -d > "${signature_file}" 2>/dev/null; then
              WORKFLOW_HEAL_VALIDATION_SIGNATURE_FILE="${signature_file}"
            fi
          fi
          export WORKFLOW_HEAL_VALIDATION_SIGNATURE_FILE
          REPORT_WRAPPER_SHA="$(git -C .codex-workflow-src rev-parse HEAD 2>/dev/null || true)" \
            RUNTIME_DIR="${report_dir}" \
            bash "${reporter}"

---
name: AI Validate (Reusable)

"on":
  workflow_call:
    inputs:
      tracking_issue:
        description: "Tracking issue number (0 for standalone validation run)"
        required: false
        type: string
        default: "0"
      pr_number:
        description: "Review PR number for restoring cached behavioural smoke artifacts (0 to auto-detect from tracking issue)"
        required: false
        type: string
        default: "0"
      compose_file:
        description: "Fallback compose file path"
        required: false
        type: string
        default: "docker-compose.yml"
      validation_timeout:
        description: "Validation idle timeout in minutes (killed after this long with no output)"
        required: false
        type: string
        default: "15"
      alert_msg_level:
        description: "Minimum Telegram alert level for this run (DEBUG|WARNING|ERROR|CRITICAL|SILENT). Empty honours vars.ALERT_MSG_LEVEL; the test-and-mark-stable gate passes SILENT so its standalone validate smoke emits no per-phase alerts."
        required: false
        type: string
        default: ""
      target_ref:
        description: "Branch to validate instead of the tracking issue's integration branch or the default branch (empty = unchanged behaviour). Set by /implement-plan-claude for its project branch."
        required: false
        type: string
        default: ""
    secrets:
      GH_PAT:
        required: true
      OPENROUTER_API_KEY:
        required: true
      TG_BOT_SECRET:
        required: false
    outputs:
      status:
        description: "Validation status (pass|fail|error)"
        value: ${{ jobs.validate.outputs.status }}
      raw_status:
        description: "Raw validation status (preserves diagnostic classifier values)"
        value: ${{ jobs.validate.outputs.raw_status }}
      summary:
        description: "Validation summary"
        value: ${{ jobs.validate.outputs.summary }}
      failure_summary:
        description: "Failure summary for poller consumption"
        value: ${{ jobs.validate.outputs.failure_summary }}
      status_file:
        description: "Path to validation_status.json"
        value: ${{ jobs.validate.outputs.status_file }}
      metadata_file:
        description: "Path to validation_metadata.json"
        value: ${{ jobs.validate.outputs.metadata_file }}
      failure_owner:
        description: "Who owns a failed validation (harness|project|mixed|none); docs/plans/validation-failure-harness-routing-plan.md"
        value: ${{ jobs.validate.outputs.failure_owner }}
      harness_report:
        description: "true when the failure is harness-owned and its stage, reason and fingerprint passed validation, so the heal-report job reports it"
        value: ${{ jobs.validate.outputs.harness_report }}
      harness_stage:
        description: "Harness stage of a harness-owned failure ([a-z_]{1,40}, empty otherwise)"
        value: ${{ jobs.validate.outputs.harness_stage }}
      harness_reason:
        description: "Harness reason of a harness-owned failure ([a-z_]{1,40}, empty otherwise)"
        value: ${{ jobs.validate.outputs.harness_reason }}
      harness_fp:
        description: "Fingerprint of a harness-owned failure (64 hex, empty otherwise)"
        value: ${{ jobs.validate.outputs.harness_fp }}

env:
  # Claude capacity wait (issue #7370): a capacity fallback waits for the
  # hourly capacity-resume pass instead of running codex/OpenCode. Off for the
  # `core` install profile, which has no orchestrate-poll wrapper to resume
  # waiting work; repo variable CLAUDE_POOL_CAPACITY_WAIT_ENABLED=false rolls back.
  CLAUDE_POOL_CAPACITY_WAIT_ENABLED: ${{ vars.CLAUDE_POOL_CAPACITY_WAIT_ENABLED || (vars.WORKFLOW_PROFILE == 'core' && 'false') || 'true' }}
  SEMBLE_BOOTSTRAP_MODE: ${{ vars.SEMBLE_BOOTSTRAP_MODE || 'lazy' }}
  UNATTENDED_PHASE: validate
  EVENTS_JSONL_ENABLED: ${{ vars.EVENTS_JSONL_ENABLED || 'false' }}
  UNATTENDED_TRANSCRIPT_ARCHIVE_ENABLED: ${{ vars.UNATTENDED_TRANSCRIPT_ARCHIVE_ENABLED || 'false' }}
  # Validate-generate / validate-diagnose / validate-discover are gpt-6-sol
  # (research/synthesis); validate-fix-harness / validate-self-heal are
  # codex (file edits) — those phases override MODEL_EDITOR locally if
  # WORKFLOW_VALIDATE_FIX_MODEL is set.
  MODEL_EDITOR: ${{ vars.WORKFLOW_VALIDATE_MODEL || vars.WORKFLOW_EDITOR_MODEL || 'openai/gpt-6-sol' }}
  MODEL_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_VALIDATE || 'high' }}
  MODEL_VERBOSITY: ${{ vars.VERBOSITY_VALIDATE || 'low' }}
  CODEX_THREAD_REUSE_ENABLED: ${{ vars.CODEX_THREAD_REUSE_ENABLED || 'false' }}
  # Codex version baked into the isolated agent image (scripts/codex_isolated_exec.sh).
  CODEX_VERSION: ${{ vars.CODEX_VERSION || 'v0.114.0' }}
  VALIDATION_INCLUDE_SYNTHESISED: ${{ vars.VALIDATION_INCLUDE_SYNTHESISED || 'true' }}
  OPENROUTER_PROMPT_CACHE_DISABLED: ${{ vars.OPENROUTER_PROMPT_CACHE_DISABLED || 'false' }}
  MEMORY_INJECTION_SCAN_ENABLED: ${{ vars.MEMORY_INJECTION_SCAN_ENABLED || 'true' }}
  WRITE_GUARDS_ENABLED: ${{ vars.WRITE_GUARDS_ENABLED || 'true' }}
  CODEX_HEARTBEAT_ENABLED: ${{ vars.CODEX_HEARTBEAT_ENABLED || '1' }}
  CODEX_HEARTBEAT_INTERVAL_SECS: ${{ vars.CODEX_HEARTBEAT_INTERVAL_SECS || '30' }}
  LEDGER_TOKENS_LOG_MAX_BYTES: ${{ vars.LEDGER_TOKENS_LOG_MAX_BYTES || '1048576' }}
  LEDGER_EMIT_TIMEOUT_SECONDS: ${{ vars.LEDGER_EMIT_TIMEOUT_SECONDS || '120' }}
  SERENA_ENABLED: ${{ vars.SERENA_ENABLED || 'false' }}
  WORKSPACE_HOOK_TIMEOUT_SECONDS: ${{ vars.WORKSPACE_HOOK_TIMEOUT_SECONDS || '600' }}
  WORKSPACE_REUSE_ENABLED: ${{ vars.WORKSPACE_REUSE_ENABLED || 'false' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      status: ${{ steps.collect_status.outputs.status }}
      raw_status: ${{ steps.collect_status.outputs.raw_status }}
      summary: ${{ steps.collect_status.outputs.summary }}
      failure_summary: ${{ steps.collect_status.outputs.failure_summary }}
      status_file: ${{ steps.collect_status.outputs.status_file }}
      metadata_file: ${{ steps.collect_status.outputs.metadata_file }}
      failure_owner: ${{ steps.collect_status.outputs.failure_owner }}
      harness_report: ${{ steps.collect_status.outputs.harness_report }}
      harness_stage: ${{ steps.collect_status.outputs.harness_stage }}
      harness_reason: ${{ steps.collect_status.outputs.harness_reason }}
      harness_fp: ${{ steps.collect_status.outputs.harness_fp }}
      harness_signature_b64: ${{ steps.collect_status.outputs.harness_signature_b64 }}

    env:
      AI_ENGINE_FALLBACK_POLICY: ${{ vars.AI_ENGINE_FALLBACK_POLICY || 'capacity' }}
      # Claude capacity wait (issue #7370): the tracking issue is labelled;
      # the resume pass removes the label and the poller re-dispatches.
      CLAUDE_CAPACITY_WAIT_ITEM_KIND: ${{ inputs.tracking_issue && inputs.tracking_issue != '0' && 'issue' || 'run' }}
      CLAUDE_CAPACITY_WAIT_ITEM_NUMBER: ${{ inputs.tracking_issue || '' }}
      CLAUDE_CAPACITY_WAIT_STAGE: validate
      # Opt-in weekly scheduled run of the consumer wrapper (issue #7553). A
      # called workflow keeps the caller's github context, so the schedule is
      # read from github.event_name. A tracking issue or an explicit target
      # turns scheduled mode off. Scheduled mode runs no model phase and
      # reports through scripts/validate_scheduled_sink.sh.
      VALIDATE_SCHEDULED_MODE: ${{ github.event_name == 'schedule' && (inputs.tracking_issue == '' || inputs.tracking_issue == '0') && inputs.target_ref == '' && 'true' || 'false' }}
    steps:
      - name: Bootstrap GitHub API retry helper
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          SUPPORT_REF_WORKFLOW_JOB_JSON: ${{ toJSON(job) }}
        run: |
          # Trusted pre-support copy of scripts/gh_helpers.sh for gh_api_retry
          # (issue #6634): main in this repo, stable in consumers, never the PR
          # head or the caller checkout. emit_event.sh is fetched next to it so
          # the helper never sources a checkout copy. Git transport spends no
          # REST budget. On failure the steps below fall back to plain gh api.
          # A consumer run whose job workflow_ref pins a coding-workflows file
          # to a commit fetches that commit instead, never stable
          # (tele-funtoken-msg-scoring#4566); a fetch that does not land
          # exactly on it leaves the helper unset.
          ghr_ref=stable
          if [ "${GITHUB_REPOSITORY}" = "shubhodeep1/coding-workflows" ]; then ghr_ref=main; fi
          ghr_pin=""
          ghr_workflow_ref="$(jq -r '.workflow_ref // ""' <<< "${SUPPORT_REF_WORKFLOW_JOB_JSON:-}" 2>/dev/null || true)"
          if [ "${ghr_ref}" = "stable" ] && [[ "${ghr_workflow_ref}" =~ ^shubhodeep1/coding-workflows/\.github/workflows/[A-Za-z0-9_.-]+\.yml@[0-9a-f]{40}$ ]]; then
            ghr_pin="${ghr_workflow_ref##*@}"
            ghr_ref="${ghr_pin}"
          fi
          ghr_dir="${RUNNER_TEMP}/gh-api-retry-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ghr_auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          for ghr_try in 1 2 3; do
            rm -rf "${ghr_dir}"
            mkdir -p "${ghr_dir}"
            if { if [ -n "${ghr_pin}" ]; then
                  git init -q "${ghr_dir}/src" 2>/dev/null \
                    && git -C "${ghr_dir}/src" remote add origin https://github.com/shubhodeep1/coding-workflows \
                    && git -c http.extraHeader="${ghr_auth}" -C "${ghr_dir}/src" fetch -q --no-tags --depth 1 --filter=blob:none origin "${ghr_pin}" 2>/dev/null \
                    && [ "$(git -C "${ghr_dir}/src" rev-parse FETCH_HEAD 2>/dev/null)" = "${ghr_pin}" ] \
                    && git -C "${ghr_dir}/src" update-ref HEAD FETCH_HEAD
                else
                  git -c http.extraHeader="${ghr_auth}" clone -q --no-tags --depth 1 --filter=blob:none --no-checkout \
                    --branch "${ghr_ref}" https://github.com/shubhodeep1/coding-workflows "${ghr_dir}/src" 2>/dev/null
                fi; } \
              && git -c http.extraHeader="${ghr_auth}" -C "${ghr_dir}/src" show HEAD:scripts/gh_helpers.sh > "${ghr_dir}/gh_helpers.sh" 2>/dev/null \
              && git -c http.extraHeader="${ghr_auth}" -C "${ghr_dir}/src" show HEAD:scripts/emit_event.sh > "${ghr_dir}/emit_event.sh" 2>/dev/null; then
              break
            fi
            if [ "${ghr_try}" -lt 3 ]; then sleep $(( ghr_try * 5 )); fi
          done
          if grep -q '^gh_api_retry()' "${ghr_dir}/gh_helpers.sh" 2>/dev/null && [ -s "${ghr_dir}/emit_event.sh" ]; then
            echo "GH_API_RETRY_HELPERS=${ghr_dir}/gh_helpers.sh" >> "${GITHUB_ENV}"
          else
            echo "::warning::GH_API_RETRY bootstrap unavailable (ref=${ghr_ref}); steps use plain gh api."
          fi

      - name: Resolve integration ref
        id: refctx
        env:
          SUPPORT_REF_WORKFLOW_JOB_JSON: ${{ toJSON(job) }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CI_TRIAGE_PR_BRANCH_ROUTING_ENABLED: ${{ vars.CI_TRIAGE_PR_BRANCH_ROUTING_ENABLED || 'true' }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
        run: |
          set -euo pipefail
          issue_number="${TRACKING_ISSUE:-}"
          if ! [[ "${issue_number}" =~ ^[0-9]+$ ]] || [ "${issue_number}" -le 0 ]; then
            echo "::notice::No tracking issue provided for integration ref resolution; falling back to default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          resolver_repo="shubhodeep1/coding-workflows"
          resolver_ref="stable"
          resolver_ref_pinned=false
          # A consumer wrapper pinned to a commit runs the resolver from that
          # commit, never from stable or main (issue tele-funtoken#4566).
          resolver_workflow_ref="$(jq -r '.workflow_ref // ""' <<< "${SUPPORT_REF_WORKFLOW_JOB_JSON:-}" 2>/dev/null || true)"
          if [[ "${resolver_workflow_ref}" =~ ^shubhodeep1/coding-workflows/\.github/workflows/validate\.yml@[0-9a-f]{40}$ ]]; then
            resolver_ref="${resolver_workflow_ref##*@}"
            resolver_ref_pinned=true
          fi
          if [ "${{ github.repository }}" = "${resolver_repo}" ]; then
            resolver_ref="${{ github.sha }}"
            # Runs pinned to the protected promote-candidate branch (promote cycle,
            # docs/plans/pin-promote-cycle-to-candidate-plan.md) take support code
            # from its tip; a look-alike ref, an unprotected branch or a failed read
            # keep the source above. One branches read, only on this path.
            if [[ "${resolver_workflow_ref}" =~ ^shubhodeep1/coding-workflows/\.github/workflows/validate\.yml@refs/heads/promote-candidate$ ]]; then
              # Tells "Fetch workflow support files" this step already decided, so a
              # rejected read is not repeated there with a possibly different answer.
              echo "promote_candidate_checked=true" >> "$GITHUB_OUTPUT"
              source "${GH_API_RETRY_HELPERS:-/dev/null}" 2>/dev/null || true
              type gh_api_retry >/dev/null 2>&1 || gh_api_retry() { while [ "${1:-}" = --idempotent ] || [ "${1:-}" = --optional ]; do shift; done; gh api "$@"; }
              promote_candidate_json="$(gh_api_retry repos/shubhodeep1/coding-workflows/branches/promote-candidate 2>/dev/null || true)"
              promote_candidate_sha="$(jq -r 'if .protected == true then (.commit.sha // "") else "" end' <<< "${promote_candidate_json}" 2>/dev/null || true)"
              if [[ "${promote_candidate_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                resolver_ref="${promote_candidate_sha}"
                resolver_ref_pinned=true
                # "Fetch workflow support files" reuses this SHA, so both checkouts
                # come from one candidate commit even if the branch moves meanwhile.
                echo "promote_candidate_sha=${promote_candidate_sha}" >> "$GITHUB_OUTPUT"
                echo "SUPPORT_REF source=promote_candidate sha=${promote_candidate_sha}"
              else
                echo "SUPPORT_REF source=promote_candidate_unprotected"
              fi
            fi
          fi

          resolver_stage_root="${RUNNER_TEMP}/resolve-integration-ref-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          resolver_stage_primary="${resolver_stage_root}/primary"
          resolver_stage_fallback="${resolver_stage_root}/fallback"
          resolver_repo_url="https://github.com/${resolver_repo}"
          rm -rf "${resolver_stage_root}"
          mkdir -p "${resolver_stage_root}"
          resolver_clone_log="${resolver_stage_root}/clone.log"
          resolver_git_auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          resolver_git() {
            git -c "http.extraHeader=Authorization: Basic ${resolver_git_auth_header}" "$@"
          }
          cleanup_resolver_stage() {
            rm -rf "${resolver_stage_root}"
          }
          trap cleanup_resolver_stage EXIT
          # Issue #7283: with CI-triage PR-branch routing on, a resolver that cannot
          # be staged, pinned or found fails the step instead of falling back to the
          # default branch (the unpinned main fallback clone counts as a pinning
          # failure). The flag is parsed like ci_triage_routing_enabled in
          # scripts/resolve_integration_ref.sh. With routing off, the fallbacks below
          # are unchanged.
          resolver_ci_triage_routing_on=false
          case "${CI_TRIAGE_PR_BRANCH_ROUTING_ENABLED:-true}" in
            [Tt][Rr][Uu][Ee]|1|[Yy][Ee][Ss]|[Oo][Nn]) resolver_ci_triage_routing_on=true ;;
          esac
          resolver_stage_fail_closed() {
            if [ "${resolver_ci_triage_routing_on}" = "true" ]; then
              resolver_pin_log=""
              if [ "${resolver_ref_pinned}" = "true" ]; then resolver_pin_log=" pinned_ref=${resolver_ref}"; fi
              echo "::error::INTEGRATION_REF_RESOLVE outcome=resolver_unavailable reason=$1 ci_triage_routing=on${resolver_pin_log}; refusing to fall back to the default branch."
            elif [ "${resolver_ref_pinned}" = "true" ]; then
              echo "::error::INTEGRATION_REF_RESOLVE outcome=resolver_unavailable reason=$1 pinned_ref=${resolver_ref}; refusing to run resolver code from another ref."
            else
              return 0
            fi
            if [ -s "${resolver_clone_log}" ]; then
              sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g' "${resolver_clone_log}" | sed -n '1,20p'
            fi
            exit 1
          }

          if resolver_git clone --quiet --depth 1 --branch main "${resolver_repo_url}" "${resolver_stage_primary}" 2>"${resolver_clone_log}"; then
            resolver_script="${resolver_stage_primary}/scripts/resolve_integration_ref.sh"
            if ! resolver_git -C "${resolver_stage_primary}" fetch --quiet --depth 1 origin "${resolver_ref}" 2>>"${resolver_clone_log}" || \
               ! git -C "${resolver_stage_primary}" checkout --quiet --detach FETCH_HEAD 2>>"${resolver_clone_log}" || \
               { [ "${resolver_ref_pinned}" = "true" ] && [ "$(git -C "${resolver_stage_primary}" rev-parse HEAD 2>/dev/null || true)" != "${resolver_ref}" ]; }; then
              resolver_stage_fail_closed pin_failed
              echo "::warning::Failed to stage canonical integration resolver ref ${resolver_ref}; using main fallback."
              if [ -s "${resolver_clone_log}" ]; then
                sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g' "${resolver_clone_log}" | sed -n '1,20p'
              fi
            fi
          elif resolver_git clone --quiet --depth 1 --branch main "${resolver_repo_url}" "${resolver_stage_fallback}" 2>>"${resolver_clone_log}"; then
            resolver_script="${resolver_stage_fallback}/scripts/resolve_integration_ref.sh"
            resolver_stage_fail_closed pin_failed
          else
            resolver_stage_fail_closed stage_failed
            echo "::warning::Failed to stage canonical integration resolver; falling back to default branch."
            if [ -s "${resolver_clone_log}" ]; then
              sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g' "${resolver_clone_log}" | sed -n '1,20p'
            fi
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "${resolver_script}" ]; then
            resolver_stage_fail_closed script_missing
            echo "::warning::Canonical integration resolver script not found in staged source; falling back to default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          chmod +x "${resolver_script}"
          # Exit 3 means CI-triage PR-branch routing was required but could
          # not be verified; never fall back to the default branch then.
          resolver_rc=0
          integration_branch="$({
            REPO="${{ github.repository }}" \
            ISSUE="${issue_number}" \
            GH_TOKEN="${GH_TOKEN}" \
            CI_TRIAGE_PR_BRANCH_ROUTING_ENABLED="${CI_TRIAGE_PR_BRANCH_ROUTING_ENABLED:-true}" \
            bash "${resolver_script}"
          })" || resolver_rc=$?
          if [ "${resolver_rc}" -eq 0 ]; then
            echo "ref=${integration_branch}" >> "$GITHUB_OUTPUT"
          elif [ "${resolver_rc}" -eq 3 ]; then
            echo "::error::CI-triage PR-branch routing refused for issue #${issue_number}; refusing to fall back to the default branch."
            exit 1
          else
            # resolver_rc already holds the resolver's exit code (captured by
            # `|| resolver_rc=$?` above); `$?` here would be the failed exit-3
            # test's status and would hide exits 75 and 2.
            # A resolver that stayed rate-limited (exit 75, issue #6634) must
            # not silently fall back to the default branch.
            if [ "${resolver_rc}" -eq 75 ]; then
              echo "::error::INTEGRATION_REF_RESOLVE outcome=rate_limited rc=${resolver_rc}"
              exit 1
            fi
            # Exit 2 is an API failure (retries exhausted or a permanent error);
            # only exit 1 (declared branch missing) keeps the fallback below.
            if [ "${resolver_rc}" -eq 2 ]; then
              echo "::error::INTEGRATION_REF_RESOLVE outcome=api_unavailable rc=${resolver_rc}"
              exit 1
            fi
            echo "::warning::Canonical integration resolver failed; falling back to default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Authorize explicit validation target
        id: authorized_target
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          VALIDATE_TARGET_REF: ${{ inputs.target_ref }}
          VALIDATE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          source "${GH_API_RETRY_HELPERS:-/dev/null}" 2>/dev/null || true
          type gh_api_retry >/dev/null 2>&1 || gh_api_retry() { while [ "${1:-}" = --idempotent ] || [ "${1:-}" = --optional ]; do shift; done; gh api "$@"; }
          if [ -z "${VALIDATE_TARGET_REF}" ]; then
            exit 0
          fi
          if [[ ! "${VALIDATE_TARGET_REF}" =~ ^claude/implement-plan-[A-Za-z0-9][A-Za-z0-9._-]*$ ]] ||
             ! git check-ref-format --branch "${VALIDATE_TARGET_REF}" >/dev/null 2>&1; then
            echo "::error::Invalid explicit validation target."
            exit 1
          fi
          # The integration issue lookup has no PR head/repository identity.
          # One paginated pull listing supplies the independent binding. It has
          # no base filter: jq requires exactly one open trusted PR for the
          # head, and that PR must go into the default branch. (The stacked
          # project-branch and stable bases of #4734 / #4791 served the retired
          # /implement-plan-claude chain and were removed with it.)
          # GitHub reads (CLAUDE.md §15): the target listing only. No earlier
          # call in this job returns PR head/base data.
          validate_pr_jq_defs='
            def trusted_pr($repo):
              type == "object" and .state == "open" and
              .head.repo.full_name == $repo and .base.repo.full_name == $repo and
              (.author_association == "OWNER" or .author_association == "MEMBER" or
               .author_association == "COLLABORATOR");
            def single_pr($what):
              if type != "array" or any(.[]; type != "array") then error("invalid pull listing") else
                [ .[][] ] |
                if length != 1 then error("\($what) PR binding is missing or ambiguous") else .[0] end
              end;'
          # A transient or rate-limited listing is not "not authorized"
          # (issue #6634): report it as an API failure.
          target_prs_rc=0
          target_prs="$(gh_api_retry --method GET --paginate --slurp \
            -f state=open -f "head=${GITHUB_REPOSITORY%%/*}:${VALIDATE_TARGET_REF}" \
            -f per_page=100 \
            "repos/${GITHUB_REPOSITORY}/pulls")" || target_prs_rc=$?
          if [ "${target_prs_rc}" -ne 0 ]; then
            echo "::error::VALIDATE_AUTHORIZE_TARGET outcome=api_unavailable rc=${target_prs_rc}"
            exit 1
          fi
          target_binding="$(jq -er --arg repo "${GITHUB_REPOSITORY}" \
            --arg branch "${VALIDATE_TARGET_REF}" --arg base "${VALIDATE_DEFAULT_BRANCH}" "${validate_pr_jq_defs}"'
            single_pr("target") |
            if trusted_pr($repo) and .head.ref == $branch and
              (.head.sha | type == "string" and test("^[0-9a-fA-F]{40}$")) and
              (.base.ref | type == "string")
            then
              if .base.ref == $base then "default \(.head.sha)"
              else error("target PR base is not authorized") end
            else error("target PR is unauthorized") end' <<< "${target_prs}")" || { echo "::error::Explicit validation target is not authorized."; exit 1; }
          read -r target_kind authorized_sha <<< "${target_binding}"
          case "${target_kind}" in
            default)
              ;;
            *)
              echo "::error::Explicit validation target is not authorized."
              exit 1
              ;;
          esac
          echo "sha=${authorized_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.authorized_target.outputs.sha || steps.refctx.outputs.ref || github.event.repository.default_branch }}
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Verify authorized checkout
        env:
          VALIDATE_AUTHORIZED_SHA: ${{ steps.authorized_target.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "${VALIDATE_AUTHORIZED_SHA}" ] && [ "$(git rev-parse HEAD)" != "${VALIDATE_AUTHORIZED_SHA}" ]; then
            echo "::error::Validation checkout does not match the authorized PR head."
            exit 1
          fi

      - name: Log checkout ref
        env:
          VALIDATE_RESOLVED_REF: ${{ steps.authorized_target.outputs.sha || steps.refctx.outputs.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "Resolved ref: ${VALIDATE_RESOLVED_REF}"
          echo "HEAD commit: $(git rev-parse HEAD)"
          if branch_name="$(git symbolic-ref --short HEAD 2>/dev/null)"; then
            echo "HEAD branch: ${branch_name}"
          else
            echo "HEAD branch: DETACHED"
          fi

      - name: Setup shared runtime
        id: runtime
        uses: shubhodeep1/coding-workflows/.github/actions/setup-runtime@stable
        with:
          runtime_prefix: codex-validate
          required_env_csv: OPENROUTER_API_KEY
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Fetch workflow support files
        id: support_staging
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          VALIDATE_AUTHORIZED_TARGET_SHA: ${{ steps.authorized_target.outputs.sha }}
          VALIDATE_WORKFLOW_JOB_JSON: ${{ toJSON(job) }}
          VALIDATE_PROMOTE_CANDIDATE_SHA: ${{ steps.refctx.outputs.promote_candidate_sha }}
          VALIDATE_PROMOTE_CANDIDATE_CHECKED: ${{ steps.refctx.outputs.promote_candidate_checked }}
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          helper_ref="stable"
          if [ "${GITHUB_REPOSITORY}" = "${wf_source}" ]; then
            helper_ref="main"
          fi
          # A consumer wrapper pins this workflow to a commit (validate.yml@<sha>).
          # Stage the support scripts from that same commit, never from a newer
          # stable: binance-blessings#249's integration branch pinned an old
          # validate.yml that failed against stable's scripts on every dispatch
          # (Q49). Same identity source as review_autofix.yml's support commit.
          validate_workflow_ref="$(jq -r '.workflow_ref // ""' <<< "${VALIDATE_WORKFLOW_JOB_JSON}" 2>/dev/null || true)"
          validate_support_pin_pattern='^shubhodeep1/coding-workflows/\.github/workflows/validate\.yml@[0-9a-f]{40}$'
          if [ "${GITHUB_REPOSITORY}" != "${wf_source}" ] && [[ "${validate_workflow_ref}" =~ ${validate_support_pin_pattern} ]]; then
            helper_ref="${validate_workflow_ref##*@}"
          fi
          if [ "${GITHUB_REPOSITORY}" = "${wf_source}" ]; then
            # Runs pinned to the protected promote-candidate branch (promote cycle,
            # docs/plans/pin-promote-cycle-to-candidate-plan.md) take support code
            # from its tip; a look-alike ref, an unprotected branch or a failed read
            # keep the source above. One branches read, only on this path.
            if [[ "${validate_workflow_ref}" =~ ^shubhodeep1/coding-workflows/\.github/workflows/validate\.yml@refs/heads/promote-candidate$ ]]; then
              # Reuse the SHA "Resolve integration ref" accepted (a step output,
              # which later steps cannot overwrite). Read the branch only when that
              # step never read it (no tracking issue); a rejection there keeps main.
              promote_candidate_sha="${VALIDATE_PROMOTE_CANDIDATE_SHA:-}"
              if [[ ! "${promote_candidate_sha}" =~ ^[0-9a-f]{40}$ ]] && [ "${VALIDATE_PROMOTE_CANDIDATE_CHECKED:-}" != "true" ]; then
                source "${GH_API_RETRY_HELPERS:-/dev/null}" 2>/dev/null || true
                type gh_api_retry >/dev/null 2>&1 || gh_api_retry() { while [ "${1:-}" = --idempotent ] || [ "${1:-}" = --optional ]; do shift; done; gh api "$@"; }
                promote_candidate_json="$(gh_api_retry repos/shubhodeep1/coding-workflows/branches/promote-candidate 2>/dev/null || true)"
                promote_candidate_sha="$(jq -r 'if .protected == true then (.commit.sha // "") else "" end' <<< "${promote_candidate_json}" 2>/dev/null || true)"
              fi
              if [[ "${promote_candidate_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                helper_ref="${promote_candidate_sha}"
                echo "SUPPORT_REF source=promote_candidate sha=${promote_candidate_sha}"
              else
                echo "SUPPORT_REF source=promote_candidate_unprotected"
              fi
            fi
          fi
          echo "VALIDATE_SUPPORT_REF ref=${helper_ref} workflow_ref=${validate_workflow_ref:-unknown}"
          helper_stage_root="${RUNNER_TEMP}/codex-validate-helper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          helper_stage_dir="${helper_stage_root}/src"
          mkdir -p "${helper_stage_root}"
          # Never execute a staging helper (or hook helper) from target_ref.
          helper_auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          helper_git() {
            git -c "http.extraHeader=Authorization: Basic ${helper_auth}" "$@"
          }
          if [[ "${helper_ref}" =~ ^[0-9a-f]{40}$ ]]; then
            # A commit is not a branch, so fetch it directly.
            if ! { helper_git init --quiet "${helper_stage_dir}" &&
                   helper_git -C "${helper_stage_dir}" fetch --quiet --no-tags --depth 1 "https://github.com/${wf_source}" "${helper_ref}" &&
                   helper_git -C "${helper_stage_dir}" checkout --quiet --detach FETCH_HEAD; }; then
              echo "::error::Trusted validation support checkout failed (ref=${helper_ref})."
              exit 1
            fi
          elif ! helper_git clone --quiet --no-tags --depth 1 --branch "${helper_ref}" \
            "https://github.com/${wf_source}" "${helper_stage_dir}"; then
            echo "::error::Trusted validation support checkout failed."
            exit 1
          fi
          support_sha="$(git -C "${helper_stage_dir}" rev-parse HEAD)"
          [[ "${support_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "${helper_ref}" =~ ^[0-9a-f]{40}$ ]] && [ "${support_sha}" != "${helper_ref}" ]; then
            echo "::error::Validation support checkout is not the pinned commit (expected ${helper_ref}, got ${support_sha})."
            exit 1
          fi
          # The commit the support scripts come from; scripts/validate_process.sh
          # records it in the validation-harness-owner:v1 marker.
          echo "VALIDATE_SUPPORT_SHA sha=${support_sha}"
          echo "VALIDATE_SUPPORT_SHA=${support_sha}" >> "$GITHUB_ENV"
          if [ ! -f "${helper_stage_dir}/scripts/stage_workflow_support.sh" ] ||
             [ ! -f "${helper_stage_dir}/scripts/run_workspace_hook.sh" ]; then
            echo "::error::Trusted validation support helpers are unavailable."
            exit 1
          fi
          hook_helper_dir="${RUNNER_TEMP}/validate-hook-support-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${hook_helper_dir}"
          install -m 0755 "${helper_stage_dir}/scripts/run_workspace_hook.sh" "${hook_helper_dir}/run_workspace_hook.sh"
          echo "VALIDATE_HOOK_HELPER=${hook_helper_dir}/run_workspace_hook.sh" >> "$GITHUB_ENV"
          echo "VALIDATE_HELPER_STAGE_DIR=${helper_stage_dir}" >> "$GITHUB_ENV"

          manifest_path="${RUNNER_TEMP}/validate-support-manifest.json"
          cat > "${manifest_path}" <<'EOF'
          {
            "required_scripts": [
              "scripts/gh_helpers.sh",
              "scripts/ai_labels.py",
              "scripts/render_prompt.sh",
              "scripts/assemble_prompt.sh",
              "scripts/load_workflow_overlay.py",
              "scripts/tg_helpers.sh",
              "scripts/memory_helpers.sh",
              "scripts/ai_memory.py",
              "scripts/ai_memory_lib.py",
              "scripts/memory_injection_patterns.py",
              "scripts/openrouter_prompt_cache.py",
              "scripts/build_static_context.sh",
              "scripts/assemble_agents.py",
              "scripts/write_codex_config.sh",
              "scripts/codex_helpers.sh",
              "scripts/orchestrate_force_tick.sh",
              "scripts/watchdog_helpers.sh",
              "scripts/write_guard.sh",
              "scripts/workspace_init.sh",
              "scripts/workspace_safety_check.sh",
              "scripts/run_workspace_hook.sh",
              "scripts/codex_isolated_exec.sh",
              "scripts/sandbox_image.sh",
              "scripts/codex_isolated_workspace.py",
              "scripts/validation_harness_sandbox.sh",
              "scripts/clarify_openrouter_broker.py"
            ],
            "optional_preserve_scripts_before_templates": [

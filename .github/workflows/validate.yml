---
name: AI Validate (Reusable)

"on":
  workflow_call:
    inputs:
      tracking_issue:
        description: "Tracking issue number (0 for standalone validation run)"
        required: false
        type: string
        default: "0"
      pr_number:
        description: "Review PR number for restoring cached behavioural smoke artifacts (0 to auto-detect from tracking issue)"
        required: false
        type: string
        default: "0"
      compose_file:
        description: "Fallback compose file path"
        required: false
        type: string
        default: "docker-compose.yml"
      validation_timeout:
        description: "Validation idle timeout in minutes (killed after this long with no output)"
        required: false
        type: string
        default: "15"
    secrets:
      GH_PAT:
        required: true
      OPENROUTER_API_KEY:
        required: true
      TG_BOT_SECRET:
        required: false
    outputs:
      status:
        description: "Validation status (pass|fail|error)"
        value: ${{ jobs.validate.outputs.status }}
      raw_status:
        description: "Raw validation status (preserves diagnostic classifier values)"
        value: ${{ jobs.validate.outputs.raw_status }}
      summary:
        description: "Validation summary"
        value: ${{ jobs.validate.outputs.summary }}
      failure_summary:
        description: "Failure summary for poller consumption"
        value: ${{ jobs.validate.outputs.failure_summary }}
      status_file:
        description: "Path to validation_status.json"
        value: ${{ jobs.validate.outputs.status_file }}
      metadata_file:
        description: "Path to validation_metadata.json"
        value: ${{ jobs.validate.outputs.metadata_file }}

env:
  # Validate-generate / validate-diagnose / validate-discover are gpt-5.4
  # (research/synthesis); validate-fix-harness / validate-self-heal are
  # codex (file edits) — those phases override MODEL_EDITOR locally if
  # WORKFLOW_VALIDATE_FIX_MODEL is set.
  MODEL_EDITOR: ${{ vars.WORKFLOW_VALIDATE_MODEL || vars.WORKFLOW_EDITOR_MODEL || 'openai/gpt-5.4' }}
  MODEL_REASONING_EFFORT: ${{ vars.THINKING_LEVEL_VALIDATE || 'xhigh' }}
  MODEL_VERBOSITY: ${{ vars.VERBOSITY_VALIDATE || 'low' }}
  VALIDATION_INCLUDE_SYNTHESISED: ${{ vars.VALIDATION_INCLUDE_SYNTHESISED || 'true' }}
  OPENROUTER_PROMPT_CACHE_DISABLED: ${{ vars.OPENROUTER_PROMPT_CACHE_DISABLED || 'false' }}
  CODEX_HEARTBEAT_ENABLED: ${{ vars.CODEX_HEARTBEAT_ENABLED || '1' }}
  CODEX_HEARTBEAT_INTERVAL_SECS: ${{ vars.CODEX_HEARTBEAT_INTERVAL_SECS || '30' }}
  SERENA_ENABLED: ${{ vars.SERENA_ENABLED || 'false' }}
  WORKSPACE_HOOK_TIMEOUT_SECONDS: ${{ vars.WORKSPACE_HOOK_TIMEOUT_SECONDS || '600' }}
  WORKSPACE_REUSE_ENABLED: ${{ vars.WORKSPACE_REUSE_ENABLED || 'false' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      status: ${{ steps.collect_status.outputs.status }}
      raw_status: ${{ steps.collect_status.outputs.raw_status }}
      summary: ${{ steps.collect_status.outputs.summary }}
      failure_summary: ${{ steps.collect_status.outputs.failure_summary }}
      status_file: ${{ steps.collect_status.outputs.status_file }}
      metadata_file: ${{ steps.collect_status.outputs.metadata_file }}

    steps:
      - name: Resolve integration ref
        id: refctx
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
        run: |
          set -euo pipefail
          issue_number="${TRACKING_ISSUE:-}"
          if ! [[ "${issue_number}" =~ ^[0-9]+$ ]] || [ "${issue_number}" -le 0 ]; then
            echo "::notice::No tracking issue provided for integration ref resolution; falling back to default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          resolver_repo="shubhodeep1/coding-workflows"
          resolver_ref="stable"
          if [ "${{ github.repository }}" = "${resolver_repo}" ]; then
            resolver_ref="${{ github.sha }}"
          fi

          resolver_stage_root="${RUNNER_TEMP}/resolve-integration-ref-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          resolver_stage_primary="${resolver_stage_root}/primary"
          resolver_stage_fallback="${resolver_stage_root}/fallback"
          resolver_repo_url="https://github.com/${resolver_repo}"
          rm -rf "${resolver_stage_root}"
          mkdir -p "${resolver_stage_root}"
          resolver_clone_log="${resolver_stage_root}/clone.log"
          resolver_git_auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          resolver_git() {
            git -c "http.extraHeader=Authorization: Basic ${resolver_git_auth_header}" "$@"
          }
          cleanup_resolver_stage() {
            rm -rf "${resolver_stage_root}"
          }
          trap cleanup_resolver_stage EXIT

          if resolver_git clone --quiet --depth 1 --branch main "${resolver_repo_url}" "${resolver_stage_primary}" 2>"${resolver_clone_log}"; then
            resolver_script="${resolver_stage_primary}/scripts/resolve_integration_ref.sh"
            if ! resolver_git -C "${resolver_stage_primary}" fetch --quiet --depth 1 origin "${resolver_ref}" 2>>"${resolver_clone_log}" || \
               ! git -C "${resolver_stage_primary}" checkout --quiet --detach FETCH_HEAD 2>>"${resolver_clone_log}"; then
              echo "::warning::Failed to stage canonical integration resolver ref ${resolver_ref}; using main fallback."
              if [ -s "${resolver_clone_log}" ]; then
                sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g' "${resolver_clone_log}" | sed -n '1,20p'
              fi
            fi
          elif resolver_git clone --quiet --depth 1 --branch main "${resolver_repo_url}" "${resolver_stage_fallback}" 2>>"${resolver_clone_log}"; then
            resolver_script="${resolver_stage_fallback}/scripts/resolve_integration_ref.sh"
          else
            echo "::warning::Failed to stage canonical integration resolver; falling back to default branch."
            if [ -s "${resolver_clone_log}" ]; then
              sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g' "${resolver_clone_log}" | sed -n '1,20p'
            fi
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "${resolver_script}" ]; then
            echo "::warning::Canonical integration resolver script not found in staged source; falling back to default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          chmod +x "${resolver_script}"
          if integration_branch="$({
            REPO="${{ github.repository }}" \
            ISSUE="${issue_number}" \
            GH_TOKEN="${GH_TOKEN}" \
            bash "${resolver_script}"
          })"; then
            echo "ref=${integration_branch}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Canonical integration resolver failed; falling back to default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.refctx.outputs.ref || github.event.repository.default_branch }}
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Log checkout ref
        run: |
          set -euo pipefail
          echo "Resolved ref: ${{ steps.refctx.outputs.ref || github.event.repository.default_branch }}"
          echo "HEAD commit: $(git rev-parse HEAD)"
          if branch_name="$(git symbolic-ref --short HEAD 2>/dev/null)"; then
            echo "HEAD branch: ${branch_name}"
          else
            echo "HEAD branch: DETACHED"
          fi

      - name: Configure git auth for memory helper clones
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_PAT is empty"; exit 1; }
          SERVER_HOST="${GITHUB_SERVER_URL#https://}"
          SERVER_HOST="${SERVER_HOST#http://}"
          SERVER_HOST="${SERVER_HOST%/}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${SERVER_HOST}/${GITHUB_REPOSITORY}"

      - name: Setup shared runtime
        id: runtime
        uses: shubhodeep1/coding-workflows/.github/actions/setup-runtime@stable
        with:
          runtime_prefix: codex-validate
          required_env_csv: OPENROUTER_API_KEY
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Fetch workflow support files
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          wf_source="shubhodeep1/coding-workflows"
          # When running within coding-workflows itself, use the current
          # commit to avoid version skew with the stable tag (stable is
          # only updated after e2e tests pass — causes bootstrap failures).
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            script_ref="${{ github.sha }}"
          else
            script_ref="stable"
          fi
          mkdir -p scripts prompts .github/ai

          SERVER_HOST="${GITHUB_SERVER_URL#https://}"
          SERVER_HOST="${SERVER_HOST#http://}"
          SERVER_HOST="${SERVER_HOST%/}"
          WF_REMOTE_URL="https://x-access-token:${GH_TOKEN}@${SERVER_HOST}/${wf_source}"

          support_stage_root="${RUNNER_TEMP}/codex-validate-support-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          support_primary_dir="${support_stage_root}/primary"
          support_main_dir="${support_stage_root}/main"
          is_self_repo="false"
          if [ "${{ github.repository }}" = "${wf_source}" ]; then
            is_self_repo="true"
          fi

          checkout_support_ref() {
            local ref="$1"
            local dest="$2"
            rm -rf "${dest}"
            mkdir -p "$(dirname "${dest}")"
            if git clone --quiet --no-tags --depth 1 --branch "${ref}" "${WF_REMOTE_URL}" "${dest}" 2>/dev/null; then
              return 0
            fi
            rm -rf "${dest}"
            return 1
          }

          support_primary_root=""
          resolved_script_ref="${script_ref}"
          if [ "${is_self_repo}" = "true" ]; then
            support_primary_root="${GITHUB_WORKSPACE}"
          elif checkout_support_ref "${script_ref}" "${support_primary_dir}"; then
            support_primary_root="${support_primary_dir}"
          elif checkout_support_ref "main" "${support_primary_dir}"; then
            echo "::warning::Support checkout ref ${script_ref} is unavailable; using main."
            support_primary_root="${support_primary_dir}"
            resolved_script_ref="main"
          fi

          support_main_root=""
          if [ "${resolved_script_ref}" != "main" ] && checkout_support_ref "main" "${support_main_dir}"; then
            support_main_root="${support_main_dir}"
          fi

          copy_from_ref_or_local() {
            local repo_path="$1"
            local target_path="$2"
            local require_remote="${3:-false}"
            local allow_main_fallback="${4:-true}"
            local source_path=""

            mkdir -p "$(dirname "${target_path}")"

            if [ -n "${support_primary_root}" ] && [ -f "${support_primary_root}/${repo_path}" ]; then
              source_path="${support_primary_root}/${repo_path}"
            elif [ "${allow_main_fallback}" = "true" ] && [ -n "${support_main_root}" ] && [ -f "${support_main_root}/${repo_path}" ]; then
              echo "::warning::${repo_path} not found on ${resolved_script_ref}; falling back to main"
              source_path="${support_main_root}/${repo_path}"
            fi

            if [ -n "${source_path}" ]; then
              if [ -e "${target_path}" ] && [ "$(realpath -m "${source_path}")" = "$(realpath -m "${target_path}")" ]; then
                return 0
              fi
              cp "${source_path}" "${target_path}" || {
                echo "Failed to copy ${repo_path} from ${source_path} to ${target_path}" >&2
                return 1
              }
              return 0
            fi

            if [ "${require_remote}" != "true" ] && [ -f "${target_path}" ]; then
              echo "Using local fallback for ${target_path} (not found on ${resolved_script_ref}: ${repo_path})"
              return 0
            fi

            if [ "${require_remote}" = "true" ]; then
              echo "Missing required remote file: ${repo_path} (${resolved_script_ref}); local fallback is disabled for this file." >&2
              return 1
            fi

            echo "Missing required file: ${repo_path} (${resolved_script_ref}) and local fallback ${target_path}" >&2
            return 1
          }

          _fetched_scripts=()
          for f in gh_helpers.sh ai_labels.py render_prompt.sh render_prompt.py tg_helpers.sh memory_helpers.sh ai_memory.py ai_memory_lib.py openrouter_prompt_cache.py write_codex_config.sh orchestrate_force_tick.sh workspace_init.sh run_workspace_hook.sh; do
            copy_from_ref_or_local "scripts/${f}" "scripts/${f}"
            chmod +x "scripts/${f}"
            _fetched_scripts+=("${f}")
          done

          # render_prompt.py is the optional Python backend for the
          # render_prompt.sh shim adopted by branches that took the issue
          # #3043 refactor.  main ships a self-contained bash render_prompt.sh
          # that needs no backend, so the file is absent on main and is staged
          # only when the branch under processing actually carries it.  Absence
          # is expected (non-shim branches, incl. main) and must not fail the
          # bootstrap; presence stages it beside the shim so the shim resolves
          # ${SCRIPT_DIR}/render_prompt.py.
          if [ ! -f "scripts/render_prompt.py" ]; then
            if copy_from_ref_or_local "scripts/render_prompt.py" "scripts/render_prompt.py.tmp" "false" "true"; then
              mv "scripts/render_prompt.py.tmp" "scripts/render_prompt.py"
              chmod +x "scripts/render_prompt.py"
              _fetched_scripts+=(render_prompt.py)
            else
              rm -f "scripts/render_prompt.py.tmp"
              echo "render_prompt.py backend not on ${script_ref} yet; render_prompt.sh shim (if present) resolves it elsewhere or the bundled bash renderer is used."
            fi
          else
            chmod +x "scripts/render_prompt.py"
            _fetched_scripts+=(render_prompt.py)
          fi

          if [ ! -f "scripts/render_validation_templates.py" ]; then
            if copy_from_ref_or_local "scripts/render_validation_templates.py" "scripts/render_validation_templates.py.tmp" "false" "true"; then
              mv "scripts/render_validation_templates.py.tmp" "scripts/render_validation_templates.py"
              chmod +x "scripts/render_validation_templates.py"
              _fetched_scripts+=(render_validation_templates.py)
            else
              rm -f "scripts/render_validation_templates.py.tmp"
              echo "Template renderer not on ${script_ref} yet; template mode may not be available."
            fi
          else
            chmod +x "scripts/render_validation_templates.py"
            _fetched_scripts+=(render_validation_templates.py)
          fi

          if [ ! -f "scripts/templates/slot_manifest.schema.json" ]; then
            mkdir -p scripts/templates
            if copy_from_ref_or_local "scripts/templates/slot_manifest.schema.json" "scripts/templates/slot_manifest.schema.json.tmp" "false" "true"; then
              mv "scripts/templates/slot_manifest.schema.json.tmp" "scripts/templates/slot_manifest.schema.json"
            else
              rm -f "scripts/templates/slot_manifest.schema.json.tmp"
              echo "Validation slot manifest schema not on ${script_ref} yet; template mode may not be available."
            fi
          fi

          if [ ! -d "workflow-templates/validation-harness" ]; then
            mkdir -p workflow-templates/validation-harness
          fi
          while IFS= read -r template_path; do
            [ -z "${template_path}" ] && continue
            copy_from_ref_or_local "${template_path}" "${template_path}" "false" "true" || true
          done <<'EOF_TEMPLATE_FILES'
          workflow-templates/validation-harness/_shared/_lib/tap_helpers.sh.j2
          workflow-templates/validation-harness/_shared/tests/00_canary.sh.j2
          workflow-templates/validation-harness/_shared/tests/90_tap_report.sh.j2
          workflow-templates/validation-harness/node-hardhat-solidity/Dockerfile.app.j2
          workflow-templates/validation-harness/node-hardhat-solidity/_lib/graceful_shutdown.sh.j2
          workflow-templates/validation-harness/node-hardhat-solidity/docker-compose.test.yml.j2
          workflow-templates/validation-harness/node-hardhat-solidity/tests/00_canary.sh.j2
          workflow-templates/validation-harness/node-hardhat-solidity/tests/10_family_marker.sh.j2
          workflow-templates/validation-harness/node-hardhat-solidity/tests/20_rpc_probe.sh.j2
          workflow-templates/validation-harness/node-hardhat-solidity/tests/20_import_audit.sh.j2
          workflow-templates/validation-harness/node-hardhat-solidity/tests/_lib/import_audit.py.j2
          workflow-templates/validation-harness/node-hardhat-solidity/tests/30_hardhat_test.sh.j2
          workflow-templates/validation-harness/node-hardhat-solidity/validate.env.j2
          workflow-templates/validation-harness/node-runtime/Dockerfile.app.j2
          workflow-templates/validation-harness/node-runtime/docker-compose.test.yml.j2
          workflow-templates/validation-harness/node-runtime/validate.env.j2
          workflow-templates/validation-harness/node-runtime/tests/00_canary.sh.j2
          workflow-templates/validation-harness/node-runtime/tests/10_family_marker.sh.j2
          workflow-templates/validation-harness/node-runtime/tests/20_import_audit.sh.j2
          workflow-templates/validation-harness/node-runtime/tests/30_graceful_shutdown.sh.j2
          workflow-templates/validation-harness/node-runtime/tests/40_repo_checks.sh.j2
          workflow-templates/validation-harness/node-runtime/tests/90_tap_report.sh.j2
          workflow-templates/validation-harness/node-runtime/tests/_lib/graceful_shutdown.py.j2
          workflow-templates/validation-harness/node-runtime/tests/_lib/import_audit.py.j2
          workflow-templates/validation-harness/python-mongo-flask/Dockerfile.app.j2
          workflow-templates/validation-harness/python-mongo-flask/docker-compose.test.yml.j2
          workflow-templates/validation-harness/python-mongo-flask/tests/00_canary.sh.j2
          workflow-templates/validation-harness/python-mongo-flask/tests/10_family_marker.sh.j2
          workflow-templates/validation-harness/python-mongo-flask/tests/10_http_smoke.sh.j2
          workflow-templates/validation-harness/python-mongo-flask/tests/20_import_audit.sh.j2
          workflow-templates/validation-harness/python-mongo-flask/tests/30_graceful_shutdown.sh.j2
          workflow-templates/validation-harness/python-mongo-flask/tests/90_tap_report.sh.j2
          workflow-templates/validation-harness/python-mongo-flask/tests/_lib/graceful_shutdown.py.j2
          workflow-templates/validation-harness/python-mongo-flask/tests/_lib/http_smoke.py.j2
          workflow-templates/validation-harness/python-mongo-flask/tests/_lib/import_audit.py.j2
          workflow-templates/validation-harness/python-repo-checks/Dockerfile.app.j2
          workflow-templates/validation-harness/python-repo-checks/docker-compose.test.yml.j2
          workflow-templates/validation-harness/python-repo-checks/tests/00_canary.sh.j2
          workflow-templates/validation-harness/python-repo-checks/tests/10_family_marker.sh.j2
          workflow-templates/validation-harness/python-repo-checks/tests/20_import_audit.sh.j2
          workflow-templates/validation-harness/python-repo-checks/tests/30_graceful_shutdown.sh.j2
          workflow-templates/validation-harness/python-repo-checks/tests/40_repo_checks.sh.j2
          workflow-templates/validation-harness/python-repo-checks/tests/90_tap_report.sh.j2
          workflow-templates/validation-harness/python-repo-checks/tests/_lib/graceful_shutdown.py.j2
          workflow-templates/validation-harness/python-repo-checks/tests/_lib/import_audit.py.j2
          workflow-templates/validation-harness/python-mongo-repo-checks/Dockerfile.app.j2
          workflow-templates/validation-harness/python-mongo-repo-checks/docker-compose.test.yml.j2
          workflow-templates/validation-harness/python-mongo-repo-checks/validate.env.j2
          workflow-templates/validation-harness/python-mongo-repo-checks/tests/00_canary.sh.j2
          workflow-templates/validation-harness/python-mongo-repo-checks/tests/10_family_marker.sh.j2
          workflow-templates/validation-harness/python-mongo-repo-checks/tests/20_import_audit.sh.j2
          workflow-templates/validation-harness/python-mongo-repo-checks/tests/30_graceful_shutdown.sh.j2
          workflow-templates/validation-harness/python-mongo-repo-checks/tests/40_repo_checks.sh.j2
          workflow-templates/validation-harness/python-mongo-repo-checks/tests/90_tap_report.sh.j2
          workflow-templates/validation-harness/python-mongo-repo-checks/tests/_lib/graceful_shutdown.py.j2
          workflow-templates/validation-harness/python-mongo-repo-checks/tests/_lib/import_audit.py.j2
          EOF_TEMPLATE_FILES

          require_remote_canonical_scripts=false
          if [ "${{ github.repository }}" != "${wf_source}" ]; then
            require_remote_canonical_scripts=true
          fi

          canonical_validate_driver="scripts/validate_driver.sh"
          copy_from_ref_or_local "${canonical_validate_driver}" "${canonical_validate_driver}" "${require_remote_canonical_scripts}"
          chmod +x "${canonical_validate_driver}"
          _fetched_scripts+=(validate_driver.sh)

          canonical_validate_process="scripts/validate_process.sh"
          copy_from_ref_or_local "${canonical_validate_process}" "${canonical_validate_process}" "${require_remote_canonical_scripts}"
          chmod +x "${canonical_validate_process}"
          _fetched_scripts+=(validate_process.sh)

          # The self-heal helper (scripts/self_heal_validation.sh) is
          # fetched below using best-effort copy from staged support refs.
          # It is fetched below inside a conditional best-effort
          # copy_from_ref_or_local block so missing files return non-zero
          # and the fallback path preserves compatibility with older
          # @stable tags that predate self-heal — see
          # docs/validation-improvements.md rollout notes.

          # Fetch AI memory schema files so consumer repos that lack
          # schemas on their default branch can bootstrap the ai-memory
          # branch (schemas are validated during memory operations).
          # Include H5/H6 cache schemas; fetch remains best-effort until
          # these files exist on the selected support ref.
          mkdir -p ai-memory/schemas
          for sf in \
            memory_record.v1.json \
            processed_command_entry.v1.json \
            run_ledger_entry.v1.json \
            task_lineage.v1.json \
            actions_runs_cache.v1.json \
            workflow_log_analysis_cache.v1.json \
            validation_history.v1.json \
            operator_bypass_audit.v1.json \
            revalidate_events.v1.json \
            validation_discovery.v1.json; do
            if [ ! -f "ai-memory/schemas/${sf}" ]; then
              schema_tmp="ai-memory/schemas/${sf}.tmp"
              if copy_from_ref_or_local "ai-memory/schemas/${sf}" "${schema_tmp}" "false" "true"; then
                mv "${schema_tmp}" "ai-memory/schemas/${sf}"
              else
                rm -f "${schema_tmp}"
              fi
            fi
          done

          if copy_from_ref_or_local "scripts/codex_model_catalog.json" "scripts/codex_model_catalog.json.tmp" "false" "false"; then
            if [ -s "scripts/codex_model_catalog.json.tmp" ]; then
              mv "scripts/codex_model_catalog.json.tmp" "scripts/codex_model_catalog.json"
              _fetched_scripts+=(codex_model_catalog.json)
            else
              rm -f "scripts/codex_model_catalog.json.tmp"
              echo "Model catalog not on ${script_ref} yet; using local copy."
            fi
          else
            rm -f "scripts/codex_model_catalog.json.tmp"
            echo "Model catalog not on ${script_ref} yet; using local copy."
          fi

          if [ ! -f "scripts/codex_heartbeat.sh" ]; then
            if copy_from_ref_or_local "scripts/codex_heartbeat.sh" "scripts/codex_heartbeat.sh.tmp" "false" "true"; then
              mv "scripts/codex_heartbeat.sh.tmp" "scripts/codex_heartbeat.sh"
              chmod +x "scripts/codex_heartbeat.sh"
              _fetched_scripts+=(codex_heartbeat.sh)
            else
              rm -f "scripts/codex_heartbeat.sh.tmp"
              echo "Codex heartbeat helper not on ${script_ref} yet; validation will continue without live heartbeat logging."
            fi
          else
            chmod +x "scripts/codex_heartbeat.sh"
            _fetched_scripts+=(codex_heartbeat.sh)
          fi

          if [ ! -f "scripts/codex_stall_guard.sh" ]; then
            if copy_from_ref_or_local "scripts/codex_stall_guard.sh" "scripts/codex_stall_guard.sh.tmp" "false" "true"; then
              mv "scripts/codex_stall_guard.sh.tmp" "scripts/codex_stall_guard.sh"
              chmod +x "scripts/codex_stall_guard.sh"
              _fetched_scripts+=(codex_stall_guard.sh)
            else
              rm -f "scripts/codex_stall_guard.sh.tmp"
              echo "Codex stall guard helper not on ${script_ref} yet; validation will continue without idle-kill wrapping."
            fi
          else
            chmod +x "scripts/codex_stall_guard.sh"
            _fetched_scripts+=(codex_stall_guard.sh)
          fi

          # Semble bootstrap helpers (optional; validation falls back if
          # absent on the selected script_ref to preserve compatibility
          # with older stable tags during rollout).
          if [ ! -f "scripts/install_semble.sh" ]; then
            if copy_from_ref_or_local "scripts/install_semble.sh" "scripts/install_semble.sh.tmp" "false" "true"; then
              mv "scripts/install_semble.sh.tmp" "scripts/install_semble.sh"
              chmod +x "scripts/install_semble.sh"
              _fetched_scripts+=(install_semble.sh)
            else
              rm -f "scripts/install_semble.sh.tmp"
              echo "Semble installer not on ${script_ref} yet; validation will continue without Semble bootstrap."
            fi
          else
            chmod +x "scripts/install_semble.sh"
            _fetched_scripts+=(install_semble.sh)
          fi

          if [ ! -f "scripts/semble_helpers.sh" ]; then
            if copy_from_ref_or_local "scripts/semble_helpers.sh" "scripts/semble_helpers.sh.tmp" "false" "true"; then
              mv "scripts/semble_helpers.sh.tmp" "scripts/semble_helpers.sh"
              chmod +x "scripts/semble_helpers.sh"
              _fetched_scripts+=(semble_helpers.sh)
            else
              rm -f "scripts/semble_helpers.sh.tmp"
              echo "Semble helper library not on ${script_ref} yet; validation prompts will continue without Semble context."
            fi
          else
            chmod +x "scripts/semble_helpers.sh"
            _fetched_scripts+=(semble_helpers.sh)
          fi

          if [ ! -f "scripts/build_semble_wrapper.sh" ]; then
            if copy_from_ref_or_local "scripts/build_semble_wrapper.sh" "scripts/build_semble_wrapper.sh.tmp" "false" "true"; then
              mv "scripts/build_semble_wrapper.sh.tmp" "scripts/build_semble_wrapper.sh"
              chmod +x "scripts/build_semble_wrapper.sh"
              _fetched_scripts+=(build_semble_wrapper.sh)
            else
              rm -f "scripts/build_semble_wrapper.sh.tmp"
              echo "Semble BM25 wrapper builder not on ${script_ref} yet; validation prompts will continue without Semble context."
            fi
          else
            chmod +x "scripts/build_semble_wrapper.sh"
            _fetched_scripts+=(build_semble_wrapper.sh)
          fi

          # Self-heal helper (optional; self-heal is a no-op if absent on
          # the selected script_ref, for backward compatibility with older
          # stable tags during rollout). Best-effort fetch: skip silently
          # on missing remote, do not overwrite an existing local copy.
          if [ ! -f "scripts/self_heal_validation.sh" ]; then
            if copy_from_ref_or_local "scripts/self_heal_validation.sh" "scripts/self_heal_validation.sh.tmp" "false" "true"; then
              mv "scripts/self_heal_validation.sh.tmp" "scripts/self_heal_validation.sh"
              chmod +x "scripts/self_heal_validation.sh"
              _fetched_scripts+=(self_heal_validation.sh)
            else
              rm -f "scripts/self_heal_validation.sh.tmp"
              echo "Self-heal helper not on ${script_ref} yet; self-heal will be a no-op."
            fi
          else
            chmod +x "scripts/self_heal_validation.sh"
            _fetched_scripts+=(self_heal_validation.sh)
          fi

          # Serena bootstrap helpers (optional; validation falls back if
          # absent on the selected script_ref to preserve compatibility
          # with older stable tags during rollout).
          for f in setup_serena.sh serena_stats_emit.py mcp_handshake_probe.py; do
            if [ ! -f "scripts/${f}" ]; then
              if copy_from_ref_or_local "scripts/${f}" "scripts/${f}.tmp" "false" "true"; then
                mv "scripts/${f}.tmp" "scripts/${f}"
                chmod +x "scripts/${f}"
                _fetched_scripts+=("${f}")
              else
                rm -f "scripts/${f}.tmp"
                echo "Optional Serena support asset scripts/${f} not on ${script_ref} yet; validation will continue without that helper."
              fi
            else
              chmod +x "scripts/${f}"
              _fetched_scripts+=("${f}")
            fi
          done

          mkdir -p scripts/templates
          if [ "${is_self_repo}" != "true" ] && git ls-files --error-unmatch -- "scripts/templates/serena_project.yml.j2" >/dev/null 2>&1; then
            echo "::notice::Consumer repo already tracks scripts/templates/serena_project.yml.j2; preserving caller-owned Serena template."
          elif [ ! -f "scripts/templates/serena_project.yml.j2" ]; then
            if copy_from_ref_or_local "scripts/templates/serena_project.yml.j2" "scripts/templates/serena_project.yml.j2.tmp" "false" "true"; then
              mv "scripts/templates/serena_project.yml.j2.tmp" "scripts/templates/serena_project.yml.j2"
              _fetched_scripts+=(templates/serena_project.yml.j2)
            else
              rm -f "scripts/templates/serena_project.yml.j2.tmp"
              echo "Optional Serena template scripts/templates/serena_project.yml.j2 not on ${script_ref} yet; validation will continue without Serena project templating."
            fi
          else
            _fetched_scripts+=(templates/serena_project.yml.j2)
          fi

          # Block fetched scripts from being committed in consumer repos.
          if [ "${{ github.repository }}" != "${wf_source}" ]; then
            {
              echo "# Auto-generated by coding-workflows — DO NOT EDIT"
              echo "# Prevents runtime-fetched support scripts from being committed."
              printf '%s\n' "${_fetched_scripts[@]}" .gitignore
            } > scripts/.gitignore
          fi

          for pf in mode-validate-generate.txt mode-validate-diagnose.txt mode-validate-discover.txt mode-validate-fix-harness.txt; do
            copy_from_ref_or_local "prompts/${pf}" "prompts/${pf}"
          done
          # Self-heal prompt (optional; backward-compatible with older
          # stable tags that predate self-heal). Best-effort fetch: skip
          # silently on missing remote, do not overwrite an existing
          # local copy. We fetch via a conditional
          # copy_from_ref_or_local call so missing optional prompts return
          # non-zero and are handled in the `else` fallback branch.
          if [ ! -f "prompts/mode-validate-self-heal.txt" ]; then
            if copy_from_ref_or_local "prompts/mode-validate-self-heal.txt" "prompts/mode-validate-self-heal.txt.tmp" "false" "true"; then
              mv "prompts/mode-validate-self-heal.txt.tmp" "prompts/mode-validate-self-heal.txt"
            else
              rm -f "prompts/mode-validate-self-heal.txt.tmp"
              echo "Self-heal prompt not on ${script_ref} yet; self-heal will be a no-op."
            fi
          fi

          for f in unattended_system_instructions.md ai_pipeline.md; do
            if [ ! -f "${f}" ]; then
              copy_from_ref_or_local "${f}" "${f}"
            fi
          done

          if [ ! -f .github/ai/label_contract.v1.json ]; then
            copy_from_ref_or_local ".github/ai/label_contract.v1.json" ".github/ai/label_contract.v1.json" "false" "true" || true
          fi

      - name: Initialize workspace metadata
        id: workspace_meta
        run: |
          set -euo pipefail

          workspace_reuse_enabled="${WORKSPACE_REUSE_ENABLED:-false}"
          workspace_identifier=""
          if [[ "${{ inputs.tracking_issue }}" =~ ^[0-9]+$ ]] && [ "${{ inputs.tracking_issue }}" -gt 0 ]; then
            workspace_identifier="${{ inputs.tracking_issue }}"
          else
            workspace_reuse_enabled="false"
          fi

          WORKSPACE_REUSE_ENABLED="${workspace_reuse_enabled}" \
          WORKSPACE_REQUIRE_STABLE_IDENTIFIER_FOR_REUSE="true" \
          WORKSPACE_ISSUE_IDENTIFIER="${workspace_identifier}" \
          WORKSPACE_SOURCE_PATH="${GITHUB_WORKSPACE}" \
            bash scripts/workspace_init.sh metadata

      - name: Restore reusable workspace cache
        if: steps.workspace_meta.outputs.workspace_reuse_enabled == 'true'
        id: workspace_cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.workspace_meta.outputs.workspace_path }}
          key: ${{ steps.workspace_meta.outputs.workspace_cache_key }}
          restore-keys: |
            ${{ steps.workspace_meta.outputs.workspace_cache_restore_prefix_exact }}
            ${{ steps.workspace_meta.outputs.workspace_cache_restore_prefix_issue }}

      - name: Finalize workspace metadata
        id: workspace_state
        run: |
          set -euo pipefail
          workspace_cache_matched_key=""
          workspace_cache_path="${{ steps.workspace_meta.outputs.workspace_path }}"
          workspace_cache_key="${{ steps.workspace_meta.outputs.workspace_cache_key }}"
          workspace_cache_restore_prefix_issue="${{ steps.workspace_meta.outputs.workspace_cache_restore_prefix_issue }}"
          workspace_cache_hit="${{ steps.workspace_cache.outputs.cache-hit || '' }}"
          if [ "${workspace_cache_hit}" = "true" ]; then
            workspace_cache_matched_key="${workspace_cache_key}"
          elif [ -d "${workspace_cache_path}" ] && [ -n "$(find "${workspace_cache_path}" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
            workspace_cache_matched_key="${workspace_cache_restore_prefix_issue}restored"
          fi
          WORKSPACE_REUSE_ENABLED="${{ steps.workspace_meta.outputs.workspace_reuse_enabled }}" \
          WORKSPACE_REQUIRE_STABLE_IDENTIFIER_FOR_REUSE="true" \
          WORKSPACE_ISSUE_IDENTIFIER="${{ steps.workspace_meta.outputs.workspace_issue_identifier }}" \
          WORKSPACE_SOURCE_PATH="${GITHUB_WORKSPACE}" \
          WORKSPACE_FINGERPRINT="${{ steps.workspace_meta.outputs.workspace_fingerprint }}" \
          WORKSPACE_CACHE_MATCHED_KEY="${workspace_cache_matched_key}" \
            bash scripts/workspace_init.sh metadata

      - name: Finalize workspace contents
        run: |
          set -euo pipefail
          WORKSPACE_SOURCE_PATH="${GITHUB_WORKSPACE}" \
          WORKSPACE_PATH="${{ steps.workspace_state.outputs.workspace_path }}" \
          WORKSPACE_REUSE_ENABLED="${{ steps.workspace_state.outputs.workspace_reuse_enabled }}" \
          WORKSPACE_CACHE_RESTORE_STATE="${{ steps.workspace_state.outputs.workspace_cache_restore_state }}" \
            bash scripts/workspace_init.sh finalize

      - name: Activate workspace shell context
        run: |
          set -euo pipefail
          workspace_shell_env="${{ steps.runtime.outputs.runtime_dir }}/workspace-shell.env"
          cat > "${workspace_shell_env}" <<'EOF'
          if [ -n "${WORKSPACE_PATH:-}" ] && [ -d "${WORKSPACE_PATH}" ]; then
            cd "${WORKSPACE_PATH}"
          fi
          EOF
          {
            echo "BASH_ENV=${workspace_shell_env}"
            echo "GIT_DIR=${GITHUB_WORKSPACE}/.git"
            echo "GIT_WORK_TREE=${WORKSPACE_PATH}"
          } >> "$GITHUB_ENV"

      - name: Run workspace after_create hook
        id: workspace_after_create_hook
        run: |
          set -euo pipefail
          bash scripts/run_workspace_hook.sh validate after_create

      - name: Initialize Serena runtime state
        run: |
          set -euo pipefail

          serena_project_preexisted="false"
          if git ls-files --error-unmatch -- .serena/project.yml >/dev/null 2>&1 || [ -e .serena/project.yml ]; then
            serena_project_preexisted="true"
          fi

          {
            echo "SERENA_AVAILABLE=false"
            echo "SERENA_PROJECT_PREEXISTED=${serena_project_preexisted}"
            echo "SERENA_PROJECT_BOOTSTRAP_HASH="
          } >> "$GITHUB_ENV"

      - name: Restore validate hints cache
        # Reuse .ai/validate-hints-cache/hints.yml from a prior successful
        # run in the same repo with a matching cache key so
        # validate_process.sh can skip the codex discover call entirely.
        # Cache is per-repo (GitHub Actions cache scoping). Key hashes
        # files that drive validation discovery output; changes invalidate
        # the cache so stale hints cannot leak across structural changes.
        # Exact-key-only by design: no restore-keys fallback, because a
        # partial-prefix hit would reuse hints computed against a different
        # repo fingerprint and bypass the "changes invalidate" guarantee.
        # See scripts/validate_process.sh Phase 0.
        id: validate_hints_cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.workspace_state.outputs.workspace_path }}/.ai/validate-hints-cache
          key: validate-hints-v1-${{ hashFiles('docker-compose*.yml', 'compose*.yml', '**/Dockerfile', '**/Dockerfile.*', '**/package.json', '**/pyproject.toml', '**/requirements*.txt', '**/go.mod', '**/Cargo.toml') }}

      - name: Normalize behavioural smoke include flag
        id: behavioural_smoke_gate
        run: |
          set -euo pipefail

          include_synthesised="true"
          case "$(printf '%s' "${VALIDATION_INCLUDE_SYNTHESISED:-true}" | tr '[:upper:]' '[:lower:]')" in
            0|false|no|off)
              include_synthesised="false"
              ;;
          esac

          echo "enabled=${include_synthesised}" >> "$GITHUB_OUTPUT"

      - name: Resolve behavioural smoke source PR
        id: behavioural_smoke_pr
        if: steps.behavioural_smoke_gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number || '0' }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          PR_EVENT_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          echo "pr_number=" >> "$GITHUB_OUTPUT"

          if [[ "${INPUT_PR_NUMBER:-0}" =~ ^[0-9]+$ ]] && [ "${INPUT_PR_NUMBER}" -gt 0 ]; then
            echo "pr_number=${INPUT_PR_NUMBER}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${PR_EVENT_NUMBER:-}" =~ ^[0-9]+$ ]] && [ "${PR_EVENT_NUMBER}" -gt 0 ]; then
            echo "pr_number=${PR_EVENT_NUMBER}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          issue_number="${TRACKING_ISSUE:-}"
          if ! [[ "${issue_number}" =~ ^[0-9]+$ ]] || [ "${issue_number}" -le 0 ]; then
            echo "::notice::No tracking issue available to resolve behavioural smoke cache source PR; skipping review-runtime restore."
            exit 0
          fi

          source scripts/gh_helpers.sh

          # Audit note: validate.yml's existing GitHub calls resolve the
          # integration branch and record memory events, but none expose the
          # latest linked PR number needed to restore the per-PR
          # .ai/review_runtime cache. Use the shared timeline helper here so
          # the review-runtime lookup stays GraphQL-first and fail-open.
          timeline_json="$(gh_issue_timeline_with_cross_refs "${GITHUB_REPOSITORY%%/*}" "${GITHUB_REPOSITORY##*/}" "${issue_number}" 2>/dev/null || true)"
          pr_number="$(printf '%s' "${timeline_json}" | jq -r '
            if (type == "array") then
              [.[] | select(.event == "cross-referenced" and .source.issue.pull_request != null) | .source.issue.number] | last // empty
            else
              empty
            end
          ' 2>/dev/null || true)"

          if [[ "${pr_number}" =~ ^[0-9]+$ ]] && [ "${pr_number}" -gt 0 ]; then
            echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No linked PR found for tracking issue #${issue_number}; skipping behavioural smoke runtime restore."
          fi

      - name: Restore behavioural smoke runtime cache
        if: steps.behavioural_smoke_gate.outputs.enabled == 'true' && steps.behavioural_smoke_pr.outputs.pr_number != ''
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.workspace_state.outputs.workspace_path }}/.ai/review_runtime/
          key: review-ledger-${{ github.repository }}-pr-${{ steps.behavioural_smoke_pr.outputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            review-ledger-${{ github.repository }}-pr-${{ steps.behavioural_smoke_pr.outputs.pr_number }}-

      - name: Record validation run start
        continue-on-error: true
        env:
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          source scripts/memory_helpers.sh
          memory_ensure_branch

          issue_number="${TRACKING_ISSUE}"
          if ! [[ "${issue_number}" =~ ^[0-9]+$ ]] || [ "${issue_number}" -le 0 ]; then
            issue_number=""
          fi

          metadata_json="$(jq -cn \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg tracking_issue "${TRACKING_ISSUE:-0}" \
            '{run_attempt:$run_attempt,tracking_issue:$tracking_issue}')"

          memory_record_run_event \
            --run-id "${{ github.run_id }}" \
            --workflow "validate" \
            --event-type "validation_started" \
            --status "ok" \
            --message "Validation run started for issue ${TRACKING_ISSUE:-0} (attempt ${{ github.run_attempt }})." \
            --issue-number "${issue_number}" \
            --actor "${{ github.actor }}" \
            --metadata-json "${metadata_json}"

      - name: Install Python dependencies for validation renderer
        run: |
          set -euo pipefail

          if [ -f "scripts/render_validation_templates.py" ]; then
            python3 -m pip install --disable-pip-version-check --quiet --user pyyaml jsonschema jinja2
          else
            echo "::warning::scripts/render_validation_templates.py is unavailable; skipping renderer dependency installation."
          fi

      - name: Determine Semble bootstrap state
        id: semble_gate
        env:
          RUNTIME_DIR: ${{ steps.runtime.outputs.runtime_dir }}
          VALIDATION_USE_SEMBLE: ${{ vars.VALIDATION_USE_SEMBLE || 'true' }}
          SERENA_ENABLED: ${{ env.SERENA_ENABLED }}
        run: |
          set -euo pipefail

          enabled="false"
          serena_enabled="false"
          bootstrap_enabled="false"
          case "$(printf '%s' "${VALIDATION_USE_SEMBLE}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on)
              enabled="true"
              ;;
          esac
          case "$(printf '%s' "${SERENA_ENABLED}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on)
              serena_enabled="true"
              ;;
          esac

          if [ "${enabled}" = "true" ] || [ "${serena_enabled}" = "true" ]; then
            bootstrap_enabled="true"
          fi

          index_path="${RUNTIME_DIR}/.semble-index"
          {
            echo "enabled=${enabled}"
            echo "serena_enabled=${serena_enabled}"
            echo "bootstrap_enabled=${bootstrap_enabled}"
            echo "index_path=${index_path}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "SEMBLE_AVAILABLE=false"
            echo "SEMBLE_INDEX_AVAILABLE=false"
            echo "SEMBLE_INDEX_PATH=${index_path}"
          } >> "$GITHUB_ENV"

          if [ "${enabled}" != "true" ]; then
            echo "::notice::Validation Semble bootstrap disabled via VALIDATION_USE_SEMBLE=${VALIDATION_USE_SEMBLE}."
          fi

      - name: setup-uv
        if: steps.semble_gate.outputs.bootstrap_enabled == 'true'
        continue-on-error: true
        uses: astral-sh/setup-uv@v7

      - name: Install semble
        if: steps.semble_gate.outputs.bootstrap_enabled == 'true'
        # Defense-in-depth: install_semble.sh + the file-existence guard
        # below are both fail-soft already (script writes
        # SEMBLE_AVAILABLE=false on any error; missing-script branch
        # exits 0), but the step-level guard makes the contract explicit
        # at the step boundary — matches the pattern in
        # implement.yml / orchestrate_poll.yml / workflow-log-analysis.yml.
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          VALIDATION_USE_SEMBLE: ${{ vars.VALIDATION_USE_SEMBLE || 'true' }}
        run: |
          set -euo pipefail

          semble_enabled="false"
          case "$(printf '%s' "${VALIDATION_USE_SEMBLE}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on)
              semble_enabled="true"
              ;;
          esac

          if [ "${semble_enabled}" != "true" ]; then
            echo "::notice::VALIDATION_USE_SEMBLE is not true; skipping Semble install."
            echo "SEMBLE_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ ! -f "scripts/install_semble.sh" ]; then
            echo "::notice::scripts/install_semble.sh is unavailable; validation will continue without Semble."
            exit 0
          fi

          if ! bash scripts/install_semble.sh; then
            echo "::warning::scripts/install_semble.sh exited non-zero; validation will continue without Semble."
          fi

      - name: Build semble index
        if: (steps.semble_gate.outputs.enabled == 'true')
        # Defense-in-depth: the file-existence guard and shared script are
        # both fail-soft already, but `continue-on-error: true` makes the
        # contract explicit at the step boundary — matches the pattern in
        # implement.yml / orchestrate_poll.yml / workflow-log-analysis.yml.
        continue-on-error: true
        env:
          RUNTIME_DIR: ${{ steps.runtime.outputs.runtime_dir }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail

          if [ ! -f "scripts/semble_helpers.sh" ]; then
            echo "::notice::scripts/semble_helpers.sh is unavailable; validation prompts will continue without Semble context."
            {
              echo "SEMBLE_INDEX_AVAILABLE=false"
              echo "SEMBLE_INDEX_PATH=${RUNTIME_DIR}/.semble-index"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          # Shared BM25 wrapper builder — see scripts/build_semble_wrapper.sh
          # for the rationale (semble 0.1.3 ships no index/query CLI surface,
          # so we pickle a BM25 index from semble's Python primitives and
          # expose a wrapper binary that satisfies semble_helpers.sh's
          # `semble query` contract). Fail-soft: missing-script case is
          # handled here (older @stable refs may not yet ship the script);
          # all other errors are handled inside the script (writes
          # SEMBLE_INDEX_AVAILABLE=false on any error and exits 0).
          if [ -f scripts/build_semble_wrapper.sh ]; then
            SEMBLE_INDEX_PATH="${RUNTIME_DIR}/.semble-index" \
            SEMBLE_WRAPPER_DIR="${RUNTIME_DIR}/semble/bin" \
              bash scripts/build_semble_wrapper.sh
          else
            echo "::notice::scripts/build_semble_wrapper.sh is unavailable; validation prompts will continue without Semble context."
            {
              echo "SEMBLE_INDEX_AVAILABLE=false"
              echo "SEMBLE_INDEX_PATH=${RUNTIME_DIR}/.semble-index"
            } >> "$GITHUB_ENV"
          fi

      - name: Run workspace before_run hook
        id: workspace_before_run_hook
        run: |
          set -euo pipefail
          bash scripts/run_workspace_hook.sh validate before_run

      - name: Run validation process
        id: validate_run
        if: always() && steps.workspace_after_create_hook.outcome != 'failure' && steps.workspace_before_run_hook.outcome != 'failure'
        continue-on-error: true
        env:
          RUNTIME_DIR: ${{ steps.runtime.outputs.runtime_dir }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          VALIDATION_TIMEOUT: ${{ inputs.validation_timeout }}
          VALIDATION_COMPOSE_FILE: ${{ inputs.compose_file }}
          TOOL_CALL_BUDGET_VALIDATE: ${{ vars.TOOL_CALL_BUDGET_VALIDATE || '60' }}
          MAX_CODEX_ATTEMPTS: ${{ vars.MAX_CODEX_ATTEMPTS || '3' }}
          CODEX_RETRY_BACKOFF_BASE_SECS: ${{ vars.CODEX_RETRY_BACKOFF_BASE_SECS || '10' }}
          MODEL_EDITOR: ${{ env.MODEL_EDITOR }}
          MODEL_REASONING_EFFORT: ${{ env.MODEL_REASONING_EFFORT }}
          MAX_SELF_HEAL_ATTEMPTS: ${{ vars.MAX_SELF_HEAL_ATTEMPTS || '2' }}
          VALIDATION_USE_TEMPLATES: ${{ vars.VALIDATION_USE_TEMPLATES || 'true' }}
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID || '' }}
          ALERT_MSG_LEVEL: ${{ vars.ALERT_MSG_LEVEL || 'DEBUG' }}
        run: |
          set -euo pipefail
          bash scripts/validate_process.sh

      - name: Run workspace after_run hook
        if: always() && steps.validate_run.outcome != 'skipped'
        run: |
          set -euo pipefail
          bash scripts/run_workspace_hook.sh validate after_run

      - name: Collect validation status
        id: collect_status
        if: always()
        env:
          RUNTIME_DIR: ${{ steps.runtime.outputs.runtime_dir }}
        run: |
          set -euo pipefail

          STATUS_FILE_PATH="${RUNTIME_DIR}/validation_status.json"
          METADATA_FILE_PATH="${RUNTIME_DIR}/validation_metadata.json"

          if [ ! -f "${STATUS_FILE_PATH}" ]; then
            jq -n \
              --arg status "error" \
              --arg raw_status "codex_failure" \
              --arg summary "Validation process did not produce validation_status.json." \
              --arg failure_summary "Missing status artifact. Check validate_process.sh output and uploaded artifacts." \
              '{
                status: $status,
                raw_status: $raw_status,
                summary: $summary,
                failure_summary: $failure_summary
              }' > "${STATUS_FILE_PATH}"
          fi

          status="$(jq -r '.status // "error"' "${STATUS_FILE_PATH}")"
          raw_status="$(jq -r '.raw_status // .status // "error"' "${STATUS_FILE_PATH}")"
          summary="$(jq -r '.summary // ""' "${STATUS_FILE_PATH}" | tr '\n' ' ' | sed -e 's/[[:space:]]\+/ /g' -e 's/^ //; s/ $//')"
          failure_summary="$(jq -r '.failure_summary // ""' "${STATUS_FILE_PATH}" | tr '\n' ' ' | sed -e 's/[[:space:]]\+/ /g' -e 's/^ //; s/ $//')"

          if [ ! -f "${METADATA_FILE_PATH}" ]; then
            jq -n \
              --arg status "${status}" \
              --arg raw_status "${raw_status}" \
              --arg summary "${summary}" \
              --arg failure_summary "${failure_summary}" \
              '{
                status: $status,
                raw_status: $raw_status,
                summary: $summary,
                failure_summary: (if ($failure_summary | length) > 0 then $failure_summary else null end),
                generated_at_utc: (now | todateiso8601)
              }' > "${METADATA_FILE_PATH}"
          fi

          {
            echo "status=${status}"
            echo "raw_status=${raw_status}"
            echo "summary=${summary}"
            echo "failure_summary=${failure_summary}"
            echo "status_file=${STATUS_FILE_PATH}"
            echo "metadata_file=${METADATA_FILE_PATH}"
          } >> "$GITHUB_OUTPUT"

      - name: Emit Serena stats
        if: always()
        continue-on-error: true
        env:
          RUNTIME_DIR: ${{ steps.runtime.outputs.runtime_dir }}
        run: |
          set -euo pipefail

          if [ ! -f scripts/serena_stats_emit.py ]; then
            echo "::notice::serena_stats_emit.py is unavailable; skipping Serena stats emission."
            exit 0
          fi
          if [ -z "${RUNTIME_DIR:-}" ] || [ ! -d "${RUNTIME_DIR}" ]; then
            echo "::notice::RUNTIME_DIR is unavailable; skipping Serena stats emission."
            exit 0
          fi

          serena_stat_args=(--target validate)
          while IFS= read -r -d '' log_path; do
            serena_stat_args+=(--log "${log_path}")
          done < <(find "${RUNTIME_DIR}" -maxdepth 1 -type f \( -name 'validate_discover.log' -o -name 'validate_diagnose.log' -o -name 'validate_self_heal.log' \) -print0 2>/dev/null)

          if [ "${#serena_stat_args[@]}" -le 2 ]; then
            echo "::notice::No Serena log files were found for this validate run."
            exit 0
          fi

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/serena_stats_emit.py "${serena_stat_args[@]}"

      - name: Record validation candidate
        if: always()
        continue-on-error: true
        env:
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          STATUS_FILE_PATH: ${{ steps.collect_status.outputs.status_file }}
          STATUS_VALUE: ${{ steps.collect_status.outputs.status }}
          RAW_STATUS_VALUE: ${{ steps.collect_status.outputs.raw_status }}
          SUMMARY_VALUE: ${{ steps.collect_status.outputs.summary }}
          FAILURE_SUMMARY_VALUE: ${{ steps.collect_status.outputs.failure_summary }}
        run: |
          set -euo pipefail

          source scripts/memory_helpers.sh

          issue_number="${TRACKING_ISSUE}"
          if ! [[ "${issue_number}" =~ ^[0-9]+$ ]] || [ "${issue_number}" -le 0 ]; then
            issue_number=""
          fi

          status_value="${STATUS_VALUE:-error}"
          summary_value="${SUMMARY_VALUE:-}"
          failure_summary_value="${FAILURE_SUMMARY_VALUE:-}"

          if [ -n "${STATUS_FILE_PATH:-}" ] && [ -f "${STATUS_FILE_PATH}" ]; then
            parsed_status="$(jq -r '.status // empty' "${STATUS_FILE_PATH}" 2>/dev/null || true)"
            parsed_summary="$(jq -r '.summary // empty' "${STATUS_FILE_PATH}" 2>/dev/null || true)"
            parsed_failure_summary="$(jq -r '.failure_summary // empty' "${STATUS_FILE_PATH}" 2>/dev/null || true)"

            if [ -n "${parsed_status}" ]; then
              status_value="${parsed_status}"
            fi
            if [ -n "${parsed_summary}" ]; then
              summary_value="${parsed_summary}"
            fi
            if [ -n "${parsed_failure_summary}" ]; then
              failure_summary_value="${parsed_failure_summary}"
            fi
          fi
          raw_status="${RAW_STATUS_VALUE:-}"
          if [ -z "${raw_status}" ] && [ -n "${STATUS_FILE_PATH:-}" ] && [ -f "${STATUS_FILE_PATH}" ]; then
            parsed_raw_status="$(jq -r '.raw_status // empty' "${STATUS_FILE_PATH}" 2>/dev/null || true)"
            if [ -n "${parsed_raw_status}" ]; then
              raw_status="${parsed_raw_status}"
            fi
          fi
          raw_status="${raw_status:-${status_value}}"

          summary_compact="$(printf '%s' "${summary_value}" | tr '\n' ' ' | sed -e 's/[[:space:]]\+/ /g' -e 's/^ //; s/ $//')"
          failure_summary_compact="$(printf '%s' "${failure_summary_value}" | tr '\n' ' ' | sed -e 's/[[:space:]]\+/ /g' -e 's/^ //; s/ $//')"

          candidate_summary="${summary_compact}"
          if [ -z "${candidate_summary}" ]; then
            candidate_summary="Validation status ${status_value}."
          fi
          candidate_summary="${candidate_summary:0:220}"

          candidate_details="status=${status_value}; raw_status=${raw_status}; summary=${summary_compact}; failure_summary=${failure_summary_compact}"
          candidate_details="$(printf '%s' "${candidate_details}" | tr '\n' ' ' | sed -e 's/[[:space:]]\+/ /g' -e 's/^ //; s/ $//')"
          candidate_details="${candidate_details:0:600}"

          confidence="0.70"
          if [ "${status_value}" = "pass" ]; then
            confidence="0.90"
          fi

          memory_record_candidate \
            --category "patterns" \
            --summary "${candidate_summary}" \
            --details "${candidate_details}" \
            --confidence "${confidence}" \
            --workflow "validate" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --actor "${{ github.actor }}" \
            --issue-number "${issue_number}"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ steps.runtime.outputs.runtime_dir }}/
            ${{ steps.workspace_state.outputs.workspace_path }}/validation/

      - name: Write run summary
        if: always()
        env:
          SUMMARY_TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          SUMMARY_COMPOSE_FILE: ${{ inputs.compose_file }}
          SUMMARY_TIMEOUT: ${{ inputs.validation_timeout }}
          SUMMARY_STATUS: ${{ steps.collect_status.outputs.status }}
          SUMMARY_TEXT: ${{ steps.collect_status.outputs.summary }}
          SUMMARY_FAILURE_TEXT: ${{ steps.collect_status.outputs.failure_summary }}
        run: |
          set -euo pipefail

          summary_text_escaped="${SUMMARY_TEXT//|/\\|}"
          failure_text_escaped="${SUMMARY_FAILURE_TEXT//|/\\|}"

          {
            echo "## AI Validate Summary"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Model | \`${MODEL_EDITOR}\` |"
            echo "| Reasoning effort | \`${MODEL_REASONING_EFFORT}\` |"
            printf '| Tracking issue | `%s` |\n' "${SUMMARY_TRACKING_ISSUE}"
            printf '| Compose fallback | `%s` |\n' "${SUMMARY_COMPOSE_FILE}"
            printf '| Idle timeout (minutes) | `%s` |\n' "${SUMMARY_TIMEOUT}"
            printf '| Status | `%s` |\n' "${SUMMARY_STATUS}"
            printf '| Summary | %s |\n' "${summary_text_escaped}"
            if [ -n "${SUMMARY_FAILURE_TEXT}" ]; then
              printf '| Failure summary | %s |\n' "${failure_text_escaped}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record validation run end
        if: always()
        continue-on-error: true
        env:
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          STATUS_FILE_PATH: ${{ steps.collect_status.outputs.status_file }}
          STATUS_VALUE: ${{ steps.collect_status.outputs.status }}
          RAW_STATUS_VALUE: ${{ steps.collect_status.outputs.raw_status }}
          SUMMARY_VALUE: ${{ steps.collect_status.outputs.summary }}
          FAILURE_SUMMARY_VALUE: ${{ steps.collect_status.outputs.failure_summary }}
        run: |
          set -euo pipefail

          source scripts/memory_helpers.sh

          issue_number="${TRACKING_ISSUE}"
          if ! [[ "${issue_number}" =~ ^[0-9]+$ ]] || [ "${issue_number}" -le 0 ]; then
            issue_number=""
          fi

          status_value="${STATUS_VALUE:-error}"
          event_status="error"
          if [ "${status_value}" = "pass" ]; then
            event_status="ok"
          fi

          completion_message="${SUMMARY_VALUE:-}"
          if [ -z "${completion_message}" ]; then
            completion_message="${FAILURE_SUMMARY_VALUE:-}"
          fi
          if [ -z "${completion_message}" ]; then
            completion_message="Validation run completed with status ${status_value}."
          fi
          completion_message="$(printf '%s' "${completion_message}" | tr '\n' ' ' | sed -e 's/[[:space:]]\+/ /g' -e 's/^ //; s/ $//')"
          completion_message="${completion_message:0:280}"

          raw_status="${RAW_STATUS_VALUE:-}"
          if [ -z "${raw_status}" ] && [ -n "${STATUS_FILE_PATH:-}" ] && [ -f "${STATUS_FILE_PATH}" ]; then
            parsed_raw_status="$(jq -r '.raw_status // empty' "${STATUS_FILE_PATH}" 2>/dev/null || true)"
            if [ -n "${parsed_raw_status}" ]; then
              raw_status="${parsed_raw_status}"
            fi
          fi
          raw_status="${raw_status:-${status_value}}"
          metadata_json="$(jq -cn \
            --arg raw_status "${raw_status}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            '{raw_status:$raw_status,run_attempt:$run_attempt}')"

          memory_record_run_event \
            --run-id "${{ github.run_id }}" \
            --workflow "validate" \
            --event-type "validation_completed" \
            --status "${event_status}" \
            --message "${completion_message}" \
            --issue-number "${issue_number}" \
            --actor "${{ github.actor }}" \
            --metadata-json "${metadata_json}"

      - name: Force orchestrate poll after validation finalization
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
        run: |
          set -euo pipefail

          if ! [[ "${TRACKING_ISSUE:-}" =~ ^[0-9]+$ ]] || [ "${TRACKING_ISSUE:-0}" -le 0 ]; then
            echo "No tracking issue provided; skipping force-tick dispatch."
            exit 0
          fi

          bash scripts/orchestrate_force_tick.sh \
            --repo "${{ github.repository }}" \
            --tracking-issue "${TRACKING_ISSUE}" \
            --issue "${TRACKING_ISSUE}" \
            --reason "validation-finalized" \
            --source-workflow "validate" \
            --run-id "${{ github.run_id }}"

      - name: Run workspace before_remove hook
        if: always()
        run: |
          set -euo pipefail
          bash scripts/run_workspace_hook.sh validate before_remove

      - name: Enforce validation outcome
        if: always()
        env:
          VALIDATION_STATUS: ${{ steps.collect_status.outputs.status }}
          VALIDATION_RAW_STATUS: ${{ steps.collect_status.outputs.raw_status }}
        run: |
          set -euo pipefail
          if [ "${VALIDATION_STATUS}" = "pass" ]; then
            exit 0
          fi
          # Exit 2 for harness_error so orchestration can distinguish a harness
          # defect (generator/canary produced an incorrect test) from an
          # application-side failure; exit 1 for every other non-pass outcome.
          if [ "${VALIDATION_RAW_STATUS}" = "harness_error" ]; then
            echo "Validation did not pass (harness error)."
            exit 2
          fi
          echo "Validation did not pass."
          exit 1

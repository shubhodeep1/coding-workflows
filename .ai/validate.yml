# Template-mode validation manifest for this repository.
# This repo is workflow/script focused, so use repo-local checks instead of
# a Flask service bootstrap.
type: python-repo-checks
entry: scripts/run_validation_repo_checks.sh
slots:
  project_name: coding-workflows
  canary_tools:
    - bash
    - python3
    - jq
  tap_plan: 3

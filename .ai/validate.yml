# Validation manifest for this workflow/tooling repository.
# Uses repo-local-tooling family to run local renderer/self-test checks without
# booting a fabricated HTTP app.
type: repo-local-tooling
entry: scripts/render_validation_templates.py
slots:
  project_name: coding-workflows
  canary_tools:
    - bash
    - python3
    - jq
  tap_plan: 5

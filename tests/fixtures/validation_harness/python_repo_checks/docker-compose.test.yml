services:
  app:
    init: true
    build:
      context: ..
      dockerfile: out/Dockerfile.app
    working_dir: /workspace
    command: ["/bin/sh", "-c", "sleep infinity"]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "test -d /workspace \u0026\u0026 ( _repo_check_health_entry=\u0027scripts/run_validation_repo_checks.sh\u0027; _repo_check_health_command=; _repo_check_health_path_seen=0; for _repo_check_health_token in $$_repo_check_health_entry; do _repo_check_health_token=$${_repo_check_health_token#\\\"}; _repo_check_health_token=$${_repo_check_health_token%\\\"}; _repo_check_health_token=$${_repo_check_health_token#\\\u0027}; _repo_check_health_token=$${_repo_check_health_token%\\\u0027}; [ -n \"$$_repo_check_health_command\" ] || _repo_check_health_command=$$_repo_check_health_token; if [ -f \"/workspace/$$_repo_check_health_token\" ]; then exit 0; fi; case \"$$_repo_check_health_token\" in */*|*\\\\*) _repo_check_health_path_seen=1 ;; esac; done; [ \"$$_repo_check_health_path_seen\" -eq 0 ] \u0026\u0026 [ -n \"$$_repo_check_health_command\" ] \u0026\u0026 command -v \"$$_repo_check_health_command\" \u003e/dev/null 2\u003e\u00261 )"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

services:
  app:
    init: true
    build:
      context: ..
      dockerfile: out/Dockerfile.app
    working_dir: /workspace
    command: ["/bin/sh", "-c", "sleep infinity"]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "test -d /workspace && ( test -f \"/workspace/scripts/run_validation_repo_checks.sh\" || command -v \"scripts/run_validation_repo_checks.sh\" >/dev/null 2>&1 )"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

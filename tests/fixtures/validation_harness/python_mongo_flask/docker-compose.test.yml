services:
  app:
    init: true
    build:
      context: ..
      dockerfile: validation/Dockerfile.app
    working_dir: /workspace
    environment:
      FLASK_APP: "app.py"
      FLASK_RUN_HOST: "0.0.0.0"
      FLASK_RUN_PORT: "8000"
      APP_PORT: "8000"
      APP_URL: "http://127.0.0.1:8000/health"
      TEST_HOST_HEADER: "${TEST_HOST_HEADER:-app.local.test}"
      MONGO_URL: "mongodb://mongo:27017/app"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - '/bin/sh -c "curl -fsS -H \"Host: ${TEST_HOST_HEADER:-app.local.test}\" \"http://127.0.0.1:8000/health\" >/dev/null"'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    init: true
    image: "mongo:7"
    # The image declares VOLUME /data/db and /data/configdb. Without these
    # tmpfs mounts Docker creates anonymous volumes and copies the image
    # content into them, xattrs included; the validation sandbox's rootless
    # daemon cannot set `system.posix_acl_default` there and container
    # creation fails ("failed to copy xattrs ... invalid argument"). The test
    # database is throwaway, so memory-backed mounts lose nothing.
    tmpfs:
      - /data/db
      - /data/configdb
    environment:
      MONGO_INITDB_DATABASE: "app"
    healthcheck:
      test:
        - "CMD-SHELL"
        - '/bin/sh -c "mongosh --quiet --eval \"db.runCommand({ ping: 1 }).ok\" \"mongodb://127.0.0.1:27017/app\" >/dev/null"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

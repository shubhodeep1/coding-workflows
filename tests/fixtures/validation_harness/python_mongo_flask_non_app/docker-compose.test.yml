services:
  app:
    init: true
    build:
      context: ..
      dockerfile: validation/Dockerfile.app
    working_dir: /workspace
    environment:

      MONGO_URL: "mongodb://mongo:27017/app"

    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    init: true
    image: "mongo:7"
    environment:
      MONGO_INITDB_DATABASE: "app"
    healthcheck:
      test:
        - "CMD-SHELL"
        - '/bin/sh -c "mongosh --quiet --eval \"db.runCommand({ ping: 1 }).ok\" \"mongodb://127.0.0.1:27017/app\" >/dev/null"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
